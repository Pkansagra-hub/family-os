meta:
  adr: ADR-0089
  version: 0.1.0
  status: accepted
  scope: "K0 bridge policy enforcement contract"
  description: >-
    Contract between the K0 bridge and the K0 kernel policy enforcement module
    (PEM). Defines request/response envelopes, obligation semantics, metrics,
    and audit expectations for policy-driven admission.

ports:
  - id: P00
    name: policy.evaluate
    direction: bridge->k0
    stability: experimental
    request:
      content_type: application/json
      schema:
        type: object
        required:
          - envelope
          - manifest_fingerprint
          - bridge_trace_id
        properties:
          envelope:
            $ref: "../jsonschema/command_envelope.schema.json"
          manifest_fingerprint:
            type: string
            description: >-
              SHA256 (hex) of the active policy manifest used by the bridge.
              Enables PEM to detect drift and reply with an updated manifest.
          bridge_trace_id:
            type: string
            description: Cognitive trace propagated from bridge lane.
          preview:
            type: boolean
            default: false
            description: >-
              When true, PEM evaluates policy without committing side effects
              (read-only check). Used for dry-runs in diagnostic tooling.
    response:
      content_type: application/json
      schema:
        type: object
        required:
          - decision
          - obligations
          - manifest_fingerprint
          - pem_trace_id
        properties:
          decision:
            type: string
            enum: [ALLOW, DENY]
            description: Admission outcome for the supplied envelope.
          deny_reason:
            type: string
            nullable: true
            description: Populated when decision == DENY (e.g., ROLE_FORBIDDEN).
          obligations:
            type: array
            description: Ordered obligations that PEM must enforce.
            items:
              $ref: "#/$defs/obligation"
          receipt_annotations:
            type: object
            additionalProperties: true
            description: Key/value annotations PEM will attach to receipts.
          manifest_fingerprint:
            type: string
            description: Active policy manifest hash at PEM. Mismatch triggers
              bridge refresh before next request.
          pem_trace_id:
            type: string
            description: Trace identifier generated by PEM for observability.
          max_ttl_ms:
            type: integer
            minimum: 0
            description: Time-to-live for caching this decision (0 = no cache).
    error_codes:
      - code: POLICY_UNAVAILABLE
        http_status: 503
        retriable: true
        description: PEM could not evaluate policy (dependency failure).
      - code: POLICY_VERSION_MISMATCH
        http_status: 412
        retriable: true
        description: Manifest fingerprint mismatch; bridge must fetch update.

  - id: P01
    name: policy.manifest.describe
    direction: bridge<-k0
    stability: experimental
    request:
      content_type: application/json
      schema:
        type: object
        properties:
          include_rules:
            type: boolean
            default: false
            description: When true, PEM returns full manifest body (for tests).
    response:
      content_type: application/json
      schema:
        type: object
        required:
          - manifest_fingerprint
          - version
        properties:
          manifest_fingerprint:
            type: string
            description: SHA256 hash of the active manifest.
          version:
            type: string
            description: Semantic manifest version (e.g., 2025-09-28T00:00:00Z).
          bands:
            type: array
            items:
              type: string
            description: Ordered list of supported policy bands.
          obligations:
            type: array
            items:
              $ref: "#/$defs/obligation"
            description: Catalog of obligation types PEM understands.
          manifest:
            type: object
            description: Optional manifest body when include_rules is true.

  - id: P02
    name: policy.obligation.capabilities
    direction: bridge<-k0
    stability: experimental
    request:
      content_type: application/json
      schema:
        type: object
        properties:
          include_examples:
            type: boolean
            default: false
    response:
      content_type: application/json
      schema:
        type: object
        required:
          - obligations
        properties:
          obligations:
            type: array
            items:
              allOf:
                - $ref: "#/$defs/obligation"
                - type: object
                  properties:
                    audit_event:
                      type: string
                      description: Audit event name emitted when obligation fires.
                    ledger_table:
                      type: string
                      description: Table receiving obligation write (e.g., redaction_log).
                    storage_semantics:
                      type: string
                      enum: [idempotent, append, replace]
                    example:
                      type: object
                      description: Optional payload example when include_examples is true.

  - id: P03
    name: policy.metrics.snapshot
    direction: bridge<-k0
    stability: experimental
    request:
      content_type: application/json
      schema:
        type: object
        properties:
          since_ts:
            type: string
            format: date-time
            description: Return metrics deltas since timestamp (UTC ISO-8601).
    response:
      content_type: application/json
      schema:
        type: object
        required:
          - counters
        properties:
          counters:
            type: array
            items:
              type: object
              required: [name, value, labels]
              properties:
                name:
                  type: string
                value:
                  type: number
                labels:
                  type: object
                  additionalProperties: string
          histograms:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                buckets:
                  type: array
                  items:
                    type: object
                    required: [le, count]
                    properties:
                      le:
                        type: number
                      count:
                        type: integer

$defs:
  obligation:
    type: object
    required:
      - name
      - details
    properties:
      name:
        type: string
        enum:
          - kernel.redact.field
          - kernel.audit.log
          - kernel.audit.trace
          - kernel.security.notify
          - kernel.device.patch
          - kernel.policy.review
          - kernel.qos.tighten
        description: Obligation identifier recognised by PEM.
      details:
        type: object
        additionalProperties: true
        description: Obligation-specific key/value metadata.
      severity:
        type: string
        enum: [info, warning, critical]
        default: info
      persistent:
        type: boolean
        default: true
        description: False for transient advisory obligations.

metrics:
  counters:
    - name: k0_pep_decisions_total
      type: counter
      labels:
        - decision
        - band
        - schema_uri
        - lane
      description: Incremented per evaluated envelope.
      invariants:
        - value >= 0
        - monotonic: true
    - name: k0_pep_obligations_total
      type: counter
      labels:
        - obligation
        - decision
        - band
      description: Incremented for each obligation emitted.
      invariants:
        - value >= obligations.length
        - monotonic: true
  histograms:
    - name: k0_pep_evaluation_latency_ms
      buckets: [1, 5, 10, 25, 50, 100, 250]
      description: Time PEM spends evaluating policy.
      target_p95_ms: 50

observability:
  audit_events:
    - name: command_policy_decision
      payload:
        required:
          - decision
          - deny_reason
          - obligations
          - bridge_trace_id
          - pem_trace_id
        optional:
          - idem_key
          - receipt_id
  receipts:
    annotations_required:
      - policy.decision
      - policy.manifest.version
      - policy.obligations

testing:
  harness_overrides:
    manifest_path_env: "K0_POLICY_MANIFEST_PATH"
    bridge_policy_contract_env: "K0_BRIDGE_POLICY_CONTRACT_PATH"
    permitted_values:
      - tests/fixtures/policy/allow_all.json
      - tests/fixtures/policy/deny_household_device.json
      - tests/fixtures/policy/redact_shared_device.json
  fixtures:
    redact:
      obligations:
        - name: kernel.redact.field
          details:
            fields: [email, ssn]
            mask: "***REDACTED***"
    deny:
      deny_reason: ROLE_FORBIDDEN
      obligations:
        - name: kernel.audit.log
          details:
            level: warning
    allow:
      obligations:
        - name: kernel.audit.trace
          details:
            role: admin

compatibility:
  requires_kernel_version: ">=0.6.0"
  requires_bridge_version: ">=0.8.0"
  rolling_upgrade:
    strategy: >-
      Deploy PEM upgrade first, then bridge clients. PEM tolerates
      unknown obligations by returning POLICY_VERSION_MISMATCH.
