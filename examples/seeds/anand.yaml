# Example seed -- guardian (Anand)
#
# Used by ``scripts/onboarding_seed.py`` to populate L1/L2/L3 for the
# household's primary guardian. Keys mirror the typed L3 writers
# defined in :mod:`k1.selfmodel.service.self_model`.
#
# Run:
#   python scripts/onboarding_seed.py \
#       --household HH1 --actor anand --yaml examples/seeds/anand.yaml

actor_id: anand
role: guardian

# L1 -- core display fields. Surfaced in the [self] block.
core:
  display_name: Anand
  language: en

# L2 -- identity fields. Surfaced in the [self] block.
identity:
  age_band: adult
  pronouns: he/him

# L3 -- typed pattern. Each key maps to a typed writer.
pattern:
  preferences:
    theme: dark
    notification_window: "08:00-22:00"
  hobbies:
    - hiking
    - reading
    - cooking
  likes:
    - filter coffee
    - long-form essays
  dislikes:
    - small talk
  goals:
    - goal_id: g_run5k
      summary: Run a 5k in under 28 minutes
      horizon: "3-months"
      status: active
    - goal_id: g_read12
      summary: Finish 12 books this year
      horizon: "12-months"
      status: active
  habits:
    - habit_id: h_morning_walk
      summary: 20-minute morning walk
      cadence: daily
  routines:
    - routine_id: r_morning
      name: Morning routine
      schedule: "07:00 weekdays"
    - routine_id: r_familydinner
      name: Family dinner
      schedule: "19:30 daily"
  communication_style: brief
