# Model Placement Cascade
# Device placement priority cascade

cascade:
  - device: npu
    priority: 1
    conditions:
      - model_size_mb: "< 1000"
      - thermal_ok: true
      - power_available: true

  - device: gpu
    priority: 2
    conditions:
      - model_size_mb: "< 5000"
      - thermal_ok: true

  - device: cpu
    priority: 3
    conditions:
      - always: true

fallback:
  remote: true
  remote_endpoint: "remote-model-service"

monitoring:
  placement_tracking: true
  performance_metrics: true
