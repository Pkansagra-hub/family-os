# K1 Kernel Configuration
# Schema: k1/contracts/schemas/kernel.schema.json
# ADR-0080: Continuous Config Hot-Reload
# Version: 1.0.0

version: "1.0.0"

kernel:
  name: "k1-intelligence-core"
  session_timeout_ms: 300000  # 5 minutes
  max_agents_per_session: 3
  supervisor_check_interval_ms: 1000  # 1 second

runtime:
  worker_threads: 4
  max_memory_mb: 512  # 512 MB
  enable_hot_reload: true

k0_bridge:
  connection_pool_size: 5  # HTTP/2 connections
  timeout_ms: 100  # K0 write timeout
