# K1 Logging Configuration
# Schema: k1/contracts/schemas/logging.schema.json
# ADR-0029c: Component-Level Observability
# Version: 1.0.0

version: "1.0.0"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json, text

  output:
    console: true
    file:
      enabled: false
      path: "/var/log/k1/k1.log"
      max_size_mb: 100
      rotation_count: 5

  trace_context:
    enabled: true
    baggage_keys:
      - "cognitive_trace_id"
      - "session_id"
