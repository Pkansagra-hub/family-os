# Code Assistant Agent Template
# Inherits from: base_ai_agent.agent.yml

$schema: http://json-schema.org/draft-07/schema#
agent_type: code_assistant
category: task_executor
extends: base_ai_agent
version: "1.0.0"

# Metadata
metadata:
  author: K1 Intelligence Module
  created: 2025-10-23
  description: Specialized agent for code generation, review, and debugging
  changelog:
    - version: 1.0.0
      date: 2025-10-23
      changes: Initial code assistant template
  examples:
    - "Write a Python function to parse JSON"
    - "Review this code for bugs"
    - "Explain how this algorithm works"
    - "Generate unit tests for this function"

# Capabilities
capabilities:
  - TOOL_CALL
  - MEMORY_READ
  - MODEL_CALL  # LLM for code generation
  - NETWORK_ACCESS  # May need to fetch docs/examples

# Resource requirements
resources:
  memory_mb: 196  # 196MB for code assistant (larger context)
  max_memory_mb: 256
  preferred_accelerator: GPU  # Prefer GPU for code generation
  thermal_aware: true

# Persona traits
persona:
  response_style: detailed  # Detailed code explanations
  tone: technical
  verbosity: medium
  domain_expertise:
    - python
    - javascript
    - code_review
    - debugging
    - testing
    - algorithms
  traits:
    precision: very_high
    verbosity: medium
    code_quality: high

# Tool whitelist (30+ code-related tools)
tools:
  whitelist:
    - execute_python_code
    - execute_javascript_code
    - lint_code
    - format_code
    - generate_unit_tests
    - search_code_examples
    - fetch_documentation
    - analyze_complexity
    - detect_bugs
    - suggest_refactoring
    - search_stackoverflow
    - get_code_snippet
  blacklist: []

# Lifecycle settings
lifecycle:
  idle_timeout_seconds: 60  # Terminate after 60s idle
  persistent: false
  max_instances_per_session: 2  # Allow 2 code assistants (review + generate)

# Security settings
security:
  allow_network_access: true  # Need network for docs/examples
  allow_file_system_access: false  # Sandboxed execution only
  privacy_band_required: GREEN  # Code is typically GREEN band

# Prompt template reference
prompt:
  template_id: code_assistant
  template_path: agent_prompts/code_assistant.prompt.j2
  max_tokens: 280
