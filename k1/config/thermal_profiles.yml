# Thermal Profiles
# Device thermal management profiles

devices:
  npu:
    max_temperature: 80
    throttle_temp: 75
    shutdown_temp: 90
    cooling_priority: high

  gpu:
    max_temperature: 85
    throttle_temp: 80
    shutdown_temp: 95
    cooling_priority: high

  cpu:
    max_temperature: 90
    throttle_temp: 85
    shutdown_temp: 100
    cooling_priority: medium

policies:
  aggressive_cooling: true
  predictive_throttling: true
  thermal_migration: true
