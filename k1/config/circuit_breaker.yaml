# K1 Circuit Breaker Configuration
# Schema: k1/contracts/schemas/circuit_breaker.schema.json
# ADR-0009b: Per-Service Circuit Configuration
# Version: 1.0.0

version: "1.0.0"

circuit_breakers:
  # Tool Runner (P08) - External tool API calls
  tool_runner:
    failure_threshold: 5
    timeout_duration_ms: 30000  # 30s
    success_threshold: 2
    slow_call_threshold_ms: 5000  # 5s
    time_window_ms: 60000  # 60s
    fallback_strategy: "default_value"
    enabled: true

  # Model Hub - Local LLM (gemma-2b, qwen-2.5)
  model_hub_local:
    failure_threshold: 3
    timeout_duration_ms: 10000  # 10s
    success_threshold: 1
    slow_call_threshold_ms: 1000  # 1s
    time_window_ms: 30000  # 30s
    fallback_strategy: "alternate_model"
    alternate_service: "model_hub_remote"
    enabled: true

  # Model Hub - Remote LLM (gpt-4o-mini, gpt-4o)
  model_hub_remote:
    failure_threshold: 5
    timeout_duration_ms: 60000  # 60s
    success_threshold: 2
    slow_call_threshold_ms: 10000  # 10s
    time_window_ms: 120000  # 120s
    fallback_strategy: "cached_result"
    cache_ttl_ms: 300000  # 5 min
    enabled: true

  # K0 Bridge (P02) - Critical path, no fallback
  k0_bridge:
    failure_threshold: 3
    timeout_duration_ms: 5000  # 5s
    success_threshold: 1
    slow_call_threshold_ms: 100  # 100ms
    time_window_ms: 30000  # 30s
    fallback_strategy: "raise_error"
    enabled: true

  # MCP Gateway (P10) - External MCP server calls
  mcp_gateway:
    failure_threshold: 5
    timeout_duration_ms: 30000  # 30s
    success_threshold: 2
    slow_call_threshold_ms: 3000  # 3s
    time_window_ms: 60000  # 60s
    fallback_strategy: "default_value"
    enabled: true

  # Streaming Engine (P11) - SSE stream failures
  streaming_engine:
    failure_threshold: 3
    timeout_duration_ms: 10000  # 10s
    success_threshold: 1
    slow_call_threshold_ms: 5000  # 5s
    time_window_ms: 30000  # 30s
    fallback_strategy: "raise_error"
    enabled: true

global:
  metrics_enabled: true
  logging_enabled: true
  alert_on_open: true
  max_circuits: 100
  cleanup_interval_ms: 60000  # 60s
