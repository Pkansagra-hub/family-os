---
# 4-Stage Planning Pipeline - Validation Stage
# ADR Source: ADR-0007-4stage-planning-pipeline.md, ADR-0007c-validation-stage.md
# Research: Formal Methods (Floyd-Hoare logic), Constraint Solving (SMT solvers)
#
# The Validation stage performs 2-tier validation:
# 1. Deterministic rule engine (catches most issues)
# 2. Human arbiter fallback for ambiguous/complex cases (especially RED band)

validation_stage:
  purpose: |
    Validate expanded plan before execution:
    - Does plan respect user's constraints? (budget, time)
    - Does plan respect domain rules? (capability requirements, policies)
    - Does plan have any obvious logical errors? (circular deps, missing tools)
    - Is plan safe for execution? (RED band escalation if needed)

    Input: Expanded plan from Expand stage
    Output: Validated plan approved for Commit stage, or rejection with reasons

    Two-tier approach:
    - Tier 1: Rule engine (deterministic, fast, <10ms)
    - Tier 2: Arbiter (human judgment, slow, but comprehensive)

  stage_position: "Stage 3 of 4 in Planner Pipeline"
  duration_target_ms: 30   # Tier 1 only (rule engine)
  max_duration_tier1_ms: 100
  max_duration_tier2_ms: 30000  # 30 seconds for arbiter if needed

---

## Tier 1: Rule Engine Validation

rule_engine:
  purpose: |
    Deterministic validation using if-then rules.

    Examples:
    - IF total_cost > budget THEN REJECT
    - IF step requires capability_X AND agent lacks capability_X THEN REJECT
    - IF circular_dependency detected THEN REJECT
    - IF step timeout_ms > user_acceptable_latency THEN WARN

  rule_categories: |
    1. Resource constraints (budget, time)
    2. Capability matching (agent capabilities vs step requirements)
    3. Graph structure (cycles, missing nodes)
    4. Safety constraints (RED band escalation, PII handling)
    5. Business rules (domain-specific policies)
    6. Data quality (parameter validity, type matching)

---

## Rule Categories & Examples

constraint_validation:

  budget_constraints:
    rules:
      - rule: "total_plan_cost <= user_budget"
        severity: "ERROR"
        action: "REJECT plan, suggest cheaper alternatives"
        example: |
          User budget: $10
          Plan cost: $12
          Violation: Cost exceeds budget by $2

      - rule: "cost_per_step <= per_step_budget"
        severity: "WARNING"
        action: "FLAG step, suggest cheaper fallback"
        example: |
          User budget: $100 total, $30 per step
          Step 3 cost: $35
          Violation: Step exceeds per-step budget

  time_constraints:
    rules:
      - rule: "critical_path_duration <= deadline_ms"
        severity: "ERROR"
        action: "REJECT, plan won't meet deadline"
        example: |
          Deadline: 5 seconds (5000ms)
          Critical path: 5500ms
          Violation: Plan takes 500ms too long

      - rule: "per_step_timeout < overall_deadline"
        severity: "WARNING"
        action: "FLAG step with aggressive timeout"
        example: |
          Deadline: 5 seconds
          Step 1 timeout: 4000ms (leaves only 1s for other steps)
          Violation: Step timeout too large

  step_count_constraints:
    rules:
      - rule: "step_count >= 1 AND step_count <= max_steps"
        severity: "ERROR"
        action: "REJECT, plan too complex or empty"
        max_steps: 30  # Arbitrary limit to prevent explosion

capability_matching_rules:

  agent_capability_validation:
    rules:
      - rule: "agent.capabilities includes step.required_capability"
        severity: "ERROR"
        action: "REJECT, no capable agent assigned"
        example: |
          Step: PaymentProcessing
          Required: PAYMENT_PROCESSING capability
          Assigned agent: SearchAgent (no payment capability)
          Violation: Agent lacks required capability

      - rule: "agent.availability > step.estimated_cost"
        severity: "WARNING"
        action: "FLAG, agent might run out of resources"
        example: |
          Agent available memory: 256MB
          Step estimated cost: 200MB
          Remaining for subsequent steps: 56MB
          Violation: Low resources remaining

  tool_compatibility:
    rules:
      - rule: "tool_version compatible with agent_version"
        severity: "WARNING"
        action: "FLAG for manual review"
        example: |
          Tool: SearchProductV2 (requires SearchAgent v2.x)
          Agent: SearchAgent v1.5
          Violation: Version incompatibility

      - rule: "tool_output_schema matches step_input_schema"
        severity: "ERROR"
        action: "REJECT, parameter type mismatch"
        example: |
          Step 1 output: {ids: ["id1", "id2"]} (array)
          Step 2 input: {product_id: string} (single item)
          Violation: Type mismatch (array vs string)

graph_structure_rules:

  dag_validation:
    rules:
      - rule: "no circular dependencies detected"
        severity: "ERROR"
        action: "REJECT, plan is logically impossible"
        algorithm: "topological_sort (Kahn's algorithm)"
        example: |
          step_1 depends_on step_2
          step_2 depends_on step_3
          step_3 depends_on step_1
          Violation: Circular dependency loop

      - rule: "all dependencies point to existing steps"
        severity: "ERROR"
        action: "REJECT, missing referenced steps"
        example: |
          step_2 depends_on [step_1, step_5]
          step_5 doesn't exist
          Violation: Dangling dependency reference

  wave_structure:
    rules:
      - rule: "each wave has no internal dependencies"
        severity: "INFO"
        action: "LOG parallelism info, no action"
        example: |
          Wave 1: [step_1, step_2, step_3]
          - step_1 depends_on nothing ✓
          - step_2 depends_on nothing ✓
          - step_3 depends_on nothing ✓
          Parallelism: Steps 1-3 can run simultaneously

safety_and_security_rules:

  privacy_band_escalation:
    rules:
      - rule: "RED band plans require arbiter approval"
        severity: "ERROR"
        action: "ESCALATE to Tier 2 (arbiter) for approval"
        definition: |
          RED band = tasks involving:
          - PII (personal identifiable information)
          - Financial transactions
          - Healthcare data
          - User consent decisions

      - rule: "GREEN band plans skip arbiter (auto-pass Tier 1)"
        severity: "INFO"
        action: "Continue to Commit stage"

  capability_access_control:
    rules:
      - rule: "agent has capability token for this task"
        severity: "ERROR"
        action: "REJECT if capability token missing or expired"
        example: |
          Step requires: PAYMENT_PROCESSING with token issued_by=Compliance
          Agent capabilities: [SEARCH, HAS_NO_PAYMENT_TOKEN]
          Violation: Missing required token

  data_residency:
    rules:
      - rule: "step executes in allowed region for data type"
        severity: "ERROR"
        action: "REJECT if data residency violated"
        example: |
          User data must stay in EU (GDPR)
          Step 2 assigned to agent in US
          Violation: Data residency violation

business_rule_validation:

  domain_specific_rules:
    shopping_domain:
      - rule: "cart total matches item prices"
        severity: "WARNING"
        action: "FLAG potential pricing issue"

      - rule: "items in stock before checkout"
        severity: "WARNING"
        action: "FLAG potential stock issue"

    payment_domain:
      - rule: "amount > 0"
        severity: "ERROR"
        action: "REJECT invalid amount"

      - rule: "payment method not expired"
        severity: "ERROR"
        action: "REJECT expired payment"

    travel_domain:
      - rule: "checkout_date > checkin_date"
        severity: "ERROR"
        action: "REJECT invalid dates"

      - rule: "airport codes valid (IATA codes)"
        severity: "WARNING"
        action: "FLAG unusual airport code"

parameter_validation:

  type_checking:
    rules:
      - rule: "parameter type matches tool schema"
        severity: "ERROR"
        action: "REJECT mismatched type"
        example: |
          Tool parameter: quantity (integer)
          Plan parameter: "5" (string)
          Violation: String vs integer type mismatch

  range_validation:
    rules:
      - rule: "numeric parameters within allowed range"
        severity: "ERROR"
        action: "REJECT out-of-range value"
        example: |
          Tool parameter: page_number (1-1000)
          Plan parameter: 5001
          Violation: Page number out of range

  format_validation:
    rules:
      - rule: "email/phone/date fields valid format"
        severity: "ERROR"
        action: "REJECT invalid format"
        example: |
          Email parameter: "not-an-email"
          Violation: Invalid email format

  reference_resolution:
    rules:
      - rule: "all {{variable}} references can be resolved"
        severity: "ERROR"
        action: "REJECT unresolvable references"
        example: |
          Parameter: {{step_5.result.product_id}}
          step_5 doesn't exist
          Violation: Unresolvable variable reference

---

## Tier 1 Validation Workflow

tier1_workflow:
  algorithm: |
    1. Load expanded plan
    2. FOR EACH rule in rule_engine:
       a. Evaluate rule against plan
       b. IF rule fails AND severity == ERROR:
            → Record violation
       c. ELSE IF rule fails AND severity == WARNING:
            → Record warning (don't fail)
       d. ELSE:
            → Continue
    3. Compute violation_score = count(errors)
    4. IF violation_score == 0:
         → PASS Tier 1, proceed to Commit
       ELSE IF violation_score < high_threshold:
         → ESCALATE to Tier 2 (arbiter review)
       ELSE:
         → REJECT plan, return errors to user

  performance: |
    All rules deterministic, O(steps) complexity
    Typical: 10-30ms for 5-10 steps
    Max: 100ms before timeout

validation_result_structure:
  example_pass: |
    {
      "validation_result": "PASS",
      "tier": 1,
      "errors": [],
      "warnings": [],
      "next_stage": "commit"
    }

  example_with_warnings: |
    {
      "validation_result": "PASS_WITH_WARNINGS",
      "tier": 1,
      "errors": [],
      "warnings": [
        {
          "rule": "step_timeout_large",
          "step": "step_1",
          "message": "Timeout 2000ms leaves only 1s for remaining steps"
        }
      ],
      "next_stage": "commit"
    }

  example_escalate_to_arbiter: |
    {
      "validation_result": "ESCALATE",
      "tier": 1,
      "errors": [
        {
          "rule": "red_band_requires_arbiter",
          "severity": "ERROR",
          "message": "Plan involves PII (RED band) - requires arbiter approval"
        }
      ],
      "warnings": [],
      "next_stage": "tier2_arbiter",
      "arbiter_priority": "high"
    }

  example_reject: |
    {
      "validation_result": "REJECT",
      "tier": 1,
      "errors": [
        {
          "rule": "budget_exceeded",
          "severity": "ERROR",
          "message": "Plan cost $12 exceeds budget $10"
        },
        {
          "rule": "circular_dependency",
          "severity": "ERROR",
          "message": "Circular dependency: step_1 → step_2 → step_1"
        }
      ],
      "warnings": [],
      "next_stage": "user_revision"
    }

---

## Tier 2: Arbiter Fallback

arbiter_fallback:
  purpose: |
    When Tier 1 validation doesn't have clear answer, escalate to Arbiter Agent.

    Arbiter is an AI agent trained for complex judgment calls:
    - RED band approvals (high-stakes tasks)
    - Ambiguous rule interpretations
    - Trade-off decisions (cost vs quality, speed vs thoroughness)
    - Novel task types not covered by rules

  trigger_conditions: |
    1. Plan involves RED band data (PII, financial, healthcare)
    2. Tier 1 returns multiple warnings (uncertain state)
    3. Tier 1 encounters rule it doesn't understand
    4. User marked plan as requiring special review

  arbiter_workflow: |
    1. Format plan and violations for arbiter
    2. Send to Arbiter Agent with:
       - Full expanded plan
       - Tier 1 validation results
       - Context (user profile, task domain)
       - Question: "Should this plan be approved?"
    3. Arbiter reviews and responds with:
       - Decision: APPROVE | REJECT | NEEDS_REVISION
       - Explanation of reasoning
       - Suggested fixes if NEEDS_REVISION
    4. Record arbiter decision for auditing

  arbiter_prompt_template: |
    You are a planning arbiter reviewing high-stakes plans.

    Plan ID: {{plan_id}}
    Task: {{task_description}}
    Privacy level: {{privacy_band}}

    Validation results from rule engine:
    {{tier1_results}}

    Plan summary:
    - Steps: {{step_count}}
    - Estimated cost: ${{cost}}
    - Estimated duration: {{duration_ms}}ms
    - Critical path: {{critical_path_steps}}

    Should this plan be approved for execution?
    Consider:
    - Data safety (PII, compliance)
    - User intent (does plan match task?)
    - Risk factors (dependencies, error handling)
    - Cost/benefit trade-off

    Respond with:
    {
      "decision": "APPROVE" | "REJECT" | "NEEDS_REVISION",
      "reasoning": "...",
      "suggestions": [...]
    }

  timeout: |
    Arbiter must respond within 30 seconds
    If no response: AUTO_REJECT (fail-safe approach)
    If override needed: Escalate to human on-call arbiter

---

## Tier 1 + Tier 2 Decision Matrix

decision_matrix:
  scenarios:
    - condition: "tier1_result = PASS"
      action: "Continue to Commit stage"

    - condition: "tier1_result = PASS_WITH_WARNINGS"
      action: "Continue to Commit stage (warnings logged)"

    - condition: "tier1_result = ESCALATE AND privacy_band = RED"
      action: "Escalate to Arbiter"

    - condition: "tier1_result = ESCALATE AND privacy_band = AMBER"
      action: "Escalate to Arbiter (if complex)"

    - condition: "tier1_result = ESCALATE AND privacy_band = GREEN"
      action: "Continue to Commit (most GREEN escalations conservative)"

    - condition: "tier1_result = REJECT"
      action: "Reject to user, provide error explanation"

    - condition: "arbiter_decision = APPROVE"
      action: "Continue to Commit stage"

    - condition: "arbiter_decision = NEEDS_REVISION"
      action: "Return plan to user with arbiter suggestions"

    - condition: "arbiter_decision = REJECT OR timeout"
      action: "Reject to user with arbiter feedback"

---

## Validation Error Messages

error_messages:
  template: |
    {
      "severity": "ERROR" | "WARNING",
      "rule_name": "rule_identifier",
      "rule_description": "Human-readable rule",
      "plan_violation": "What in the plan violated this rule",
      "user_message": "Friendly explanation for end user",
      "fix_suggestion": "How to fix the plan"
    }

  example_budget_exceeded: |
    {
      "severity": "ERROR",
      "rule_name": "budget_constraint",
      "rule_description": "Total plan cost must not exceed user budget",
      "plan_violation": "Plan total cost ($12.50) exceeds user budget ($10.00)",
      "user_message": "Your plan would cost $12.50, but your budget is $10.00.",
      "fix_suggestion": "Either increase budget to $12.50 or ask planner to find cheaper alternatives."
    }

  example_circular_dependency: |
    {
      "severity": "ERROR",
      "rule_name": "no_circular_deps",
      "rule_description": "Plan must form valid DAG without cycles",
      "plan_violation": "Circular dependency found: step_1 depends_on step_2, step_2 depends_on step_1",
      "user_message": "Plan has a logical impossibility: step 1 waits for step 2, but step 2 waits for step 1.",
      "fix_suggestion": "Planner should have caught this. Regenerate plan."
    }

  example_red_band_escalation: |
    {
      "severity": "ERROR",
      "rule_name": "red_band_requires_arbiter",
      "rule_description": "Plans involving sensitive data (RED band) require arbiter approval",
      "plan_violation": "Plan accesses user financial information (RED band)",
      "user_message": "Your task involves handling financial information. An arbiter will review the plan for safety.",
      "fix_suggestion": "No action needed. Plan is being reviewed by arbiter."
    }

---

## Observability: Validation Metrics

observability:
  key_traces:
    validation_trace:
      span_name: "planner.validation"
      spans:
        - tier1_rule_engine: "Time to run all rules"
        - tier2_arbiter_check: "Time for arbiter review (if needed)"
      events:
        - validation.started
        - validation.tier1_complete
        - validation.tier2_escalation (optional)
        - validation.approved or validation.rejected

  key_metrics:
    validation_duration_ms:
      type: "Histogram"
      buckets: [10, 25, 50, 75, 100]
      p95_target: 50  # Tier 1 only
      labels: [with_escalation: true/false]

    tier1_pass_rate:
      type: "Counter"
      rate_target: "> 70%"
      description: "% of plans passing Tier 1 without escalation"

    tier2_escalation_rate:
      type: "Counter"
      rate_target: "5-10%"
      description: "% of plans escalated to arbiter"
      labels: [reason: red_band | multiple_warnings | novel_task]

    arbiter_approval_rate:
      type: "Counter"
      rate_target: "> 90%"
      description: "% of escalated plans approved by arbiter"

    violation_types:
      type: "Counter"
      labels: [violation: budget | capability | cycle | privacy | parameter]
      description: "Which rules fail most often"

    error_fix_acceptance:
      type: "Counter"
      description: "% of users who fix rejected plans vs abandoning"
      target: "> 50%"

