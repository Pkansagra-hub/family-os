## Example: E-commerce Sketch

example_ecommerce:
  user_task: "Find a laptop under $1000 with good battery life and buy it"

  generated_sketch: |
    {
      "sketch_id": "sketch_sku891",
      "steps": [
        {
          "step_id": "step_1",
          "description": "Search for laptops under $1000",
          "action": "SearchLaptops",
          "parameters": {
            "price_max": 1000,
            "sort_by": "rating"
          },
          "dependencies": [],
          "estimated_duration_ms": 300,
          "confidence": 0.98
        },
        {
          "step_id": "step_2",
          "description": "Filter for good battery life (> 8 hours)",
          "action": "FilterBattery",
          "parameters": {
            "battery_hours_min": 8,
            "products": "{{step_1.result.products}}"
          },
          "dependencies": ["step_1"],
          "estimated_duration_ms": 50,
          "confidence": 0.95
        },
        {
          "step_id": "step_3",
          "description": "Get detailed specs for top 3 results",
          "action": "GetProductDetails",
          "parameters": {
            "product_ids": "{{step_2.result.top_3}}"
          },
          "dependencies": ["step_2"],
          "estimated_duration_ms": 200,
          "confidence": 0.92
        },
        {
          "step_id": "step_4",
          "description": "Add highest-rated laptop to cart",
          "action": "AddToCart",
          "parameters": {
            "product_id": "{{step_3.result.best_laptop_id}}"
          },
          "dependencies": ["step_3"],
          "estimated_duration_ms": 50,
          "confidence": 0.99
        },
        {
          "step_id": "step_5",
          "description": "Proceed to checkout",
          "action": "Checkout",
          "parameters": {
            "payment_method": "{{context.user.default_payment}}"
          },
          "dependencies": ["step_4"],
          "estimated_duration_ms": 400,
          "confidence": 0.94
        }
      ],

      "reasoning": "User wants laptop under budget with specific battery requirement. Search finds options, filter by battery, get details to compare, add best option, checkout.",
      "llm_confidence": 0.94,
      "estimated_total_duration_ms": 1000
    }

  next_stages: |
    Sketch passed to Expand stage, which will:
    - Resolve tool schemas for each step
    - Select actual agents/implementations
    - Add error handlers and retries
    - Commit to K0 WAL

