---
# 4-Stage Planning Pipeline - Commit Stage
# ADR Source: ADR-0007-4stage-planning-pipeline.md, ADR-0007d-commit-stage.md
# Research: Write-Ahead Logging (Gray & Seltzer), Event Sourcing (Fowler)
#
# The Commit stage persists the validated plan to K0 Write-Ahead Log,
# making it durable and available for Orchestrator execution.

commit_stage:
  purpose: |
    Persist validated plan to K0 Write-Ahead Log (WAL):
    - Plan becomes durable (survives system failures)
    - Plan available to Orchestrator for execution
    - Enables auditing and replay if needed
    - Records plan history for learning feedback loop

    Input: Validated plan from Validation stage
    Output: Committed plan ID, or error with reason

    Analogy: Committing transaction to database WAL

  stage_position: "Stage 4 of 4 in Planner Pipeline"
  duration_target_ms: 10   # K0 write is fast (<10ms)
  max_duration_ms: 100     # Timeout if K0 unavailable

---

## K0 Write-Ahead Log Integration

k0_wal:
  concept: |
    K0 WAL = Durable, append-only log of all plan mutations.

    Benefits:
    - Durability: Plan survives system crashes
    - Atomicity: Plan committed or not (no partial states)
    - Auditability: Complete history of all plans
    - Replay: Can replay plans for debugging or retraining
    - Consistency: All components see same plan version

  k0_plans_table_schema: |
    CREATE TABLE plans (
      plan_id TEXT PRIMARY KEY,

      -- Plan identification
      sketch_id TEXT,                 # Reference to original sketch
      task_id TEXT,                   # User's task ID
      context_id TEXT,                # Session/user context

      -- Plan content
      plan_json TEXT,                 # Full serialized plan
      plan_hash TEXT,                 # SHA256 hash of plan JSON

      -- Stages
      sketch_version INT,             # Sketch version (1, 2, 3...)
      expansion_version INT,          # Expansion version
      validation_status TEXT,         # PASSED, PASSED_WITH_WARNINGS, etc.

      -- Metadata
      created_at TIMESTAMP,           # When plan created
      committed_at TIMESTAMP,         # When committed to WAL
      user_id TEXT,
      privacy_band TEXT,              # GREEN, AMBER, RED

      -- Execution tracking
      execution_status TEXT,          # PENDING, RUNNING, COMPLETED, FAILED
      execution_started_at TIMESTAMP,
      execution_completed_at TIMESTAMP,
      execution_result_json TEXT,     # Results from execution

      -- Metrics
      estimated_duration_ms INT,
      estimated_cost_cents FLOAT,
      actual_duration_ms INT,
      actual_cost_cents FLOAT,

      -- Quality & feedback
      quality_score FLOAT,            # 0-1 quality rating
      feedback_json TEXT,             # User feedback data
      tags_json TEXT                  # For querying/filtering
    );

  wal_entry_structure: |
    WAL Entry = Immutable record of plan transaction

    {
      wal_sequence_id: 1234567,       # Monotonic ordering
      timestamp: ISO8601,
      operation: "COMMIT_PLAN",
      plan_id: "plan_abc123",

      # Full plan snapshot for replay
      plan_snapshot: {
        plan_id, sketch_id, steps[], metadata, ...
      },

      # Transaction metadata
      user_id: "user_xyz",
      session_id: "session_123",
      trace_id: "trace_id_for_correlation",

      # Commit guarantees
      durability: "fsync_to_disk",    # Persisted before response
      isolation: "serializable",

      # Flags for special handling
      privacy_band: "RED",
      requires_audit: true,
      rollback_enabled: true
    }

---

## Commit Workflow

commit_workflow:
  algorithm: |
    1. Receive validated plan from Validation stage
    2. Serialize plan to JSON
    3. Compute plan hash (SHA256)
    4. Check for duplicate plans (idempotency)
    5. IF duplicate found:
         → Return existing plan_id (idempotent)
    6. Create WAL entry with plan snapshot
    7. Write to K0 WAL (fsync to disk)
    8. Wait for durability confirmation
    9. Update plans table with execution status = PENDING
    10. Return plan_id and commit confirmation

  error_handling: |
    K0 unavailable:
      - Retry with exponential backoff (100ms, 300ms, 1000ms)
      - If persists > 3 seconds:
        → Reject plan, user can retry later
        → Alert infrastructure team

    Plan too large:
      - If serialized plan > max_size_bytes (e.g., 10MB):
        → Reject plan as too complex
        → Suggest simplifying plan

    Hash collision:
      - Extremely unlikely (SHA256 collision)
      - If detected: Alert security team, investigate

---

## Plan Serialization & Format

serialization:
  format: "JSON with FlatBuffers option"

  json_serialization: |
    Advantages:
    - Human-readable
    - Widely compatible
    - Easy to debug
    - No schema evolution issues

    Disadvantages:
    - Larger size (~50KB per plan typical)
    - Slower parsing
    - Preferred for storage/audit, not performance-critical

  flatbuffers_serialization: |
    Advantages:
    - Compact (~15KB per plan typical, 70% size reduction)
    - Fast zero-copy deserialization
    - Versioned schema support
    - Preferred for K1 internal performance

    Disadvantages:
    - Not human-readable
    - Requires schema definition
    - More complex tooling

  k1_strategy: |
    Store in K0 WAL: JSON (durability, auditability)
    Cache in K1 memory: FlatBuffers (performance)

    Orchestrator loads FlatBuffers version from cache for execution.
    If cache miss, deserialize JSON from K0.

  example_json_plan: |
    {
      "plan_id": "plan_abc123",
      "sketch_id": "sketch_xyz",
      "task_description": "Find and purchase laptop under $1000",

      "steps": [
        {
          "step_id": "step_1",
          "description": "Search for laptops",
          "action": "SearchProduct",
          "tool": {
            "name": "SearchProduct",
            "agent": "SearchAgent-01",
            "timeout_ms": 550
          },
          "parameters": {
            "query": "laptop",
            "max_price": 1000
          },
          "error_handlers": {
            "timeout": {
              "max_retries": 2,
              "backoff_ms": [100, 500]
            }
          },
          "dependencies": [],
          "estimated_duration_ms": 300,
          "estimated_cost_cents": 5
        }
        # ... more steps ...
      ],

      "critical_path_steps": ["step_1", "step_3", "step_5"],
      "total_estimated_duration_ms": 1000,
      "total_estimated_cost_cents": 15,

      "metadata": {
        "user_id": "user_123",
        "privacy_band": "GREEN",
        "created_at": "2025-10-15T14:45:00Z"
      }
    }

---

## Idempotency & Duplicate Detection

idempotency:
  concept: |
    Ensure same plan committed multiple times returns same plan_id.

    Scenario: Network timeout after plan committed
    - First request: Commit plan → SUCCESS, return plan_id_123
    - Network timeout happens
    - Client retries (automatic retry)
    - Second request: Check if plan already committed
    - Response: plan_id_123 (same as before, idempotent!)

  mechanism: |
    plan_hash = SHA256(json.dumps(plan, sort_keys=true))

    1. Compute hash of incoming plan
    2. Query: SELECT plan_id FROM plans WHERE plan_hash = ?
    3. IF found: Return existing plan_id (idempotent)
    4. IF not found: Proceed with new commit

  benefits: |
    - Network retries don't create duplicate plans
    - Client can safely retry without coordination
    - Distributed system friendly

  edge_case: |
    Two slightly different plans might hash the same (collision)?
    - Probability: negligible (2^-256)
    - Mitigation: Validate both serialization and content before trusting hash

---

## Execution Status Transitions

execution_lifecycle:
  states:
    PENDING:
      description: "Plan committed, waiting for Orchestrator to execute"
      transitions:
        - RUNNING: "Orchestrator begins execution"

    RUNNING:
      description: "Orchestrator executing plan steps"
      transitions:
        - COMPLETED: "All steps finished successfully"
        - FAILED: "Step failed, entered saga compensation"
        - PAUSED: "User paused execution"

    COMPLETED:
      description: "Plan executed successfully"
      transitions:
        - none (final state)
      metadata:
        - total_actual_duration_ms
        - total_actual_cost_cents
        - result_json

    FAILED:
      description: "Plan failed during execution"
      transitions:
        - PENDING: "User retries plan"
      metadata:
        - failure_reason
        - error_step_id
        - compensation_status

    PAUSED:
      description: "User paused execution mid-way"
      transitions:
        - RUNNING: "User resumes execution"
        - ABANDONED: "User cancels entirely"

  state_update_in_k0: |
    ON execution status change:
      UPDATE plans SET
        execution_status = 'RUNNING',
        execution_started_at = NOW()
      WHERE plan_id = ?

    Store in same transaction:
    - Status
    - Timestamp
    - Additional metadata

    Enables queries like:
    - "Show me all failed plans"
    - "Plans taking > 10 seconds"
    - "Plans using > $50"

---

## Plan History & Versioning

plan_history:
  concept: |
    Plans can be revised and re-committed:
    - User sees plan, says "that's not what I wanted"
    - Planner regenerates with new context
    - New plan committed as new version
    - Old plan versions preserved in history

  versioning_strategy: |
    plan_id = "plan_abc123" (unique identifier, never changes)
    version = 1, 2, 3, ... (increments on each revision)

    Composite key: (plan_id, version)
    - Can refer to specific version
    - Latest version = max(version) for plan_id

  history_queries: |
    "Show all versions of plan_abc123"
    "What changed from version 1 to version 2?"
    "Revert plan to version 1"

  diff_tracking: |
    Store deltas between versions:
    - What steps changed?
    - What parameters changed?
    - Why did user reject previous version?

    Enables:
    - Faster storage (only deltas, not full copies)
    - Understanding user preferences
    - ML training data (user feedback on plans)

---

## Audit & Compliance Logging

audit_trail:
  what_to_log: |
    1. Plan created (sketch_id, user, timestamp)
    2. Plan validated (validation_status, errors/warnings)
    3. Plan committed (plan_id, wal_seq, timestamp)
    4. Plan executed (status, duration, cost)
    5. Plan feedback (user rating, comments)
    6. Plan access (who viewed, downloaded, shared)

  audit_entry_schema: |
    {
      audit_id: UUID,
      timestamp: ISO8601,
      user_id: str,
      action: CREATED | VALIDATED | COMMITTED | EXECUTED | FEEDBACK | ACCESSED,
      plan_id: str,
      details: {...},
      trace_id: str
    }

  compliance_requirements: |
    GDPR: Log consent, explain decisions (especially RED band)
    HIPAA: Audit PII access (healthcare data)
    SOC2: Maintain audit trail for 7 years
    Data residency: Store audit logs in authorized region

  redaction_policy: |
    Before storing audit log:
    - Redact PII (names, emails, phone numbers)
    - Hash credit card numbers
    - Truncate sensitive fields
    - Keep plan structure and timestamps (for audit integrity)

---

## Observability: Commit Metrics

observability:
  key_traces:
    commit_trace:
      span_name: "planner.commit"
      spans:
        - plan_serialization: "Time to serialize plan to JSON"
        - plan_hashing: "Time to compute SHA256"
        - duplicate_check: "Time to check if plan exists"
        - k0_write: "Time to write to K0 WAL"
        - durability_confirm: "Time for fsync confirmation"
      events:
        - commit.started
        - commit.serialized
        - commit.hashed
        - commit.duplicate_check_complete
        - commit.k0_write_started
        - commit.k0_write_confirmed
        - commit.completed or commit.failed

  key_metrics:
    commit_duration_ms:
      type: "Histogram"
      buckets: [2, 5, 10, 20, 50]
      p95_target: 15
      description: "Total commit latency"

    k0_write_latency_ms:
      type: "Histogram"
      buckets: [1, 2, 5, 10, 20]
      p95_target: 8
      description: "K0 WAL write latency (should dominate)"

    plan_size_bytes:
      type: "Histogram"
      buckets: [1000, 5000, 10000, 50000, 100000]
      description: "Serialized plan size in JSON"
      typical: "~50KB"

    commit_success_rate:
      type: "Counter"
      rate_target: "> 99.5%"
      description: "% of commit operations successful"

    duplicate_plan_rate:
      type: "Counter"
      description: "% of commits finding duplicate plan (idempotent)"
      typical: "< 5%"

    k0_unavailable_incidents:
      type: "Counter"
      alert_if: "> 0"
      description: "Times K0 WAL was unreachable during commit"

    plan_commit_to_execution_latency_ms:
      type: "Histogram"
      buckets: [100, 500, 1000, 5000, 10000]
      description: "Time from commit until Orchestrator starts execution"
      typical: "< 1000ms"

---

## Failure Recovery & K0 Unavailability

failure_recovery:
  k0_write_failure: |
    Scenario: K0 WAL unreachable during commit

    Handling:
    1. Detect write failure (network timeout)
    2. Retry with exponential backoff:
       - Attempt 1: 100ms backoff
       - Attempt 2: 300ms backoff
       - Attempt 3: 1000ms backoff
    3. If all attempts fail (> 3 seconds total):
       - Reject commit to user
       - Return error: "K0 unavailable, retry later"
       - Alert infrastructure team

    Why fail fast?
    - Waiting indefinitely blocks user request
    - K0 typically recovers within seconds
    - User can retry application request

  partial_write: |
    Scenario: WAL entry partially written (corrupted)

    Prevention:
    - Use transactions (all-or-nothing)
    - Validate checksum before finalizing
    - K0 handles durability guarantees

    Detection:
    - Read back plan after commit
    - Verify hash matches
    - If mismatch: Escalate to database team

  plan_too_large: |
    Scenario: Serialized plan exceeds size limit

    Reasons:
    - User task generated 100+ steps
    - Each step has complex error handlers
    - Too many alternatives/fallbacks

    Handling:
    - Reject plan with error
    - Suggest to user: "Plan too complex (5MB), try simplifying"
    - Provide breakdown of largest steps

  rollback_scenario: |
    Scenario: Plan committed, but user wants to cancel before execution

    Handling:
    - Set plan execution_status = CANCELLED
    - Keep WAL entry (audit trail)
    - Orchestrator won't execute CANCELLED plans
    - User can regenerate new plan

---

## Performance Characteristics

performance:
  typical_latencies: |
    Plan serialization to JSON: 2-5ms
    SHA256 hash computation: 0.5-2ms
    Duplicate check (hash lookup): 0.5-1ms
    K0 WAL write (fsync): 5-10ms
    Total commit: 10-20ms P95

  throughput: |
    Single Planner instance: 50-100 plans/sec
    10 Planner instances: 500-1000 plans/sec

    Limited by K0 WAL write throughput
    K0 can handle 1000s of writes/sec

  scalability: |
    Plan size: Independent (each plan separate WAL entry)
    User concurrency: Linear with instances
    Historical plans: Query performance with indexing

