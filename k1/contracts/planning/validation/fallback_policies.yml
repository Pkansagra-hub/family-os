---
# Fallback Policies - Error Recovery and Graceful Degradation
# Purpose: Define how validation failures are handled with fallback strategies
# Source ADR: ADR-0007c (Validation Stage 2-Tier Implementation)
# Layer: Planning Layer (Layer 3 - Execution & Tools)

contract:
  name: "Fallback Policies"
  version: "1.0.0"
  purpose: "Error recovery and graceful degradation strategies when validation fails"
  owner: "Planning Layer"
  layer: "Layer 3 - Execution & Tools"
  adr_references:
    - "ADR-0007c: Validation Stage 2-Tier Implementation"
    - "ADR-0008: Saga Pattern Error Recovery"

---

# SECTION 1: FALLBACK OVERVIEW

fallback_philosophy:
  principle: "Conservative safety with progressive severity"
  strategy: |
    1. Immediate rejection for safety violations
    2. Suggest improvements to user
    3. Offer alternative tools/approaches
    4. Escalate if needed (human review)
    5. Never execute unsafe plans

  fallback_hierarchy: |
    TIER 1 ERROR (Structural, Dependency, etc)
    ↓
    IMMEDIATE REJECTION (no fallback possible)
    ↓
    Return error to user with suggestions
    ↓
    User can resubmit fixed plan

    TIER 2 ERROR (Arbiter rejects)
    ↓
    REJECTION with arbiter feedback
    ↓
    Option 1: User modifies and resubmits
    ↓
    Option 2: Escalate to supervisor
    ↓
    Option 3: Use simpler alternative

    TIER 2 TIMEOUT
    ↓
    CONSERVATIVE REJECT (assume unsafe)
    ↓
    Escalate to arbiter for expedited review
    ↓
    User can request urgent approval

---

# SECTION 2: TIER 1 REJECTION STRATEGIES

tier1_rejections:
  description: "Non-recoverable structural or constraint violations"

  structural_error:
    trigger: "Plan missing required fields"
    response: |
      1. Return: ValidationError(rule="rule_structural_plan_format")
      2. Message: "Plan is missing required fields: flow_id, created_at"
      3. Suggestion: "Ensure all plan fields are present"
      4. User action: "Fix and resubmit"
      5. No fallback: User must resubmit

  circular_dependency:
    trigger: "DAG contains cycles (Step A→B→A)"
    response: |
      1. Return error with cycle path
      2. Message: "Circular dependency: Step 1→3→5→1"
      3. Suggestion: "Remove dependency or reorder steps"
      4. Offer alternatives:
         a. "Try parallel execution (remove dependency)"
         b. "Try different tool with fewer steps"
         c. "Simplify plan objective"
      5. User action: "Fix and resubmit"

  missing_capability:
    trigger: "Agent pool lacks required tool capability"
    response: |
      1. Return error: "Agent pool lacks capability: internet_access"
      2. Available capabilities: [file_read, email_send]
      3. Suggestions:
         a. "Add agent with internet_access"
         b. "Use alternative tool: api_call (more flexible)"
         c. "Simplify to local-only operations"
      4. User action: "Choose alternative or request capability"

  budget_exceeded:
    trigger: "Plan cost/latency exceeds session budget"
    response: |
      1. Return error: "Plan latency 3500ms exceeds deadline 2500ms"
      2. Analysis:
         a. Critical path: Step 1→2→4 (500+1500+1000=3000ms)
         b. Needed: Remove 500ms
      3. Suggestions:
         a. "Remove Step 2 (email confirmation, 1500ms)"
         b. "Use faster tool: search_local_files instead of search_web"
         c. "Extend deadline (request from user)"
      4. User action: "Accept suggestion or extend budget"

  schema_invalid:
    trigger: "Step parameters don't match tool schema"
    response: |
      1. Return error: "Step 2 'send_email' missing required field 'recipient'"
      2. Schema:
         required: [recipient, subject]
         optional: [cc, bcc, attachment]
      3. Suggestion: "Provide recipient email address"
      4. User action: "Fix parameter and resubmit"

---

# SECTION 3: TIER 2 REJECTION STRATEGIES

tier2_rejections:
  description: "Arbiter rejects plan due to safety concerns"

  pii_handling_concern:
    trigger: "Arbiter detects inadequate PII protection"
    response: |
      Decision: REJECT
      Rationale: "Plan handles sensitive data without encryption"
      Suggestions from arbiter:
        1. "Add encryption step before data transmission"
        2. "Use differential privacy for aggregation"
        3. "Reduce data scope (anonymize before processing)"
        4. "Use RED band tool with compliance certification"
      Escalation options:
        - "Request manual review from security team"
        - "Provide encryption certificate"
        - "Justify why PII handling is necessary"
      User action: "Modify plan and resubmit OR request manual review"

  financial_amount_concern:
    trigger: "Transaction amount unusually high"
    response: |
      Decision: REJECT
      Rationale: "Payment $5000 is 10x user's typical transaction"
      Suggestions:
        1. "Reduce to $500 (standard limit)"
        2. "Add explicit user confirmation step"
        3. "Split into smaller transactions ($1000 x 5)"
        4. "Request increase to user's spending limit"
      Escalation:
        - "Submit exception request to finance team"
        - "Provide business justification"
      User action: "Accept suggestion OR provide justification"

  child_safety_concern:
    trigger: "Plan affects child user with inappropriate content risk"
    response: |
      Decision: REJECT
      Rationale: "Child user (age 12) accessing adult-oriented service"
      Suggestions:
        1. "Use child-safe alternative service"
        2. "Add parental consent verification"
        3. "Add content filter step"
        4. "Disable for users under 16"
      Mandatory escalation:
        - "Requires parental review before proceeding"
        - "Contact parent for approval"
      User action: "Provide parental consent OR use alternative"

---

# SECTION 4: TIMEOUT STRATEGIES

timeout_strategies:
  description: "When arbiter doesn't respond in time (1500ms)"

  conservative_approach:
    philosophy: "Assume unsafe on timeout"
    action: |
      1. After 1500ms with no arbiter response:
      2. Assume REJECT (conservative)
      3. Return error to user: "Arbiter review timeout"
      4. Suggestion: "Try simpler plan or wait for arbiter"
      5. Escalation: "Route to expedited arbiter queue"

  expedited_review:
    trigger: "User escalates timeout decision"
    action: |
      1. Create expedited review request
      2. Priority: HIGH (5 min response target)
      3. Arbiter reviews with higher confidence threshold
      4. Decision options:
         a. APPROVE_FAST (quick scan pass)
         b. REJECT_CONFIRMED (definitely unsafe)
         c. REQUEST_EXTENSION (need more time)
      5. Notify user of final decision

  queue_management:
    trigger: "Arbiter backlog building (>10 pending)"
    action: |
      1. Increase arbiter pool or activate backup
      2. Batch LOW risk reviews (30 min timeout)
      3. Keep HIGH risk responses fast (<5 min)
      4. Send notification: "Arbiter team at capacity"
      5. Suggest alternatives: Simplify plan, retry later

---

# SECTION 5: FALLBACK TOOL STRATEGIES

fallback_tools:
  description: "When primary tool fails validation, suggest alternatives"

  capability_mismatch:
    scenario: |
      Step needs: search_web (requires internet_access)
      Agent pool lacks: internet_access

      Fallback options:
        1. search_knowledge_base (local, no internet needed)
        2. search_local_files (search docs instead)
        3. api_call (generic HTTP, if available)

    selection_algorithm: |
      1. Get all tools matching step domain
      2. Filter by available capabilities
      3. Rank by:
         a. Similarity to original tool purpose (0-1)
         b. Cost and latency
         c. User's prior usage
      4. Return top 3 alternatives

  band_incompatibility:
    scenario: |
      Step uses: charge_payment (RED band)
      Session band: GREEN (no financial allowed)

      Fallback options:
        1. get_balance (read-only, GREEN band)
        2. Manual payment instruction (user does externally)
        3. Escalate to RED band session (ask user)

    selection: "If user wants proceed: escalate to RED band session with arbiter"

---

# SECTION 6: GRACEFUL DEGRADATION

graceful_degradation:
  description: "Continue with reduced functionality instead of total failure"

  scenarios:
    reduced_tool_set:
      scenario: "Multiple tools unavailable"
      approach: |
        1. Identify available tools
        2. Reconstruct plan with available tools only
        3. Accept reduced functionality
        4. Warn user: "Using alternative tools, results may differ"
      example: |
        Original: search_web + parse_results + generate_summary
        Fallback: search_knowledge_base + generate_summary (skip parse)

    reduced_capabilities:
      scenario: "Tool has reduced capability (timeout warning)"
      approach: |
        1. Use tool with lower confidence/longer timeout
        2. Add extra validation step
        3. Add error handler for failure
        4. Warn user: "Using conservative settings for reliability"

    sequential_retry:
      scenario: "Tool unreliable, try backup approach"
      approach: |
        1. Try primary tool first
        2. On failure: automatically retry with fallback
        3. Track which approach succeeded
        4. Learn preference for future (optional)
      example: |
        Step 1 (try): api_call (generic HTTP)
        Step 1 (fallback): search_web_backup
        Automatically use step 1 fallback if primary times out

---

# SECTION 7: USER-FACING ERROR MESSAGES

error_messages:
  structure: |
    {
      "status": "REJECTED" or "REVISION_NEEDED",
      "primary_issue": "Clear description",
      "technical_details": "For advanced users",
      "suggestions": ["Fix 1", "Fix 2", "Alternative approach"],
      "next_steps": "What user can do",
      "escalation_available": true/false
    }

  examples:
    example_1: |
      status: REJECTED
      primary_issue: "Plan exceeds time deadline"
      technical_details: "Critical path (steps 1→2→4): 3500ms, deadline 2500ms"
      suggestions:
        - "Remove Step 2 (email confirmation)"
        - "Use faster search tool"
        - "Request deadline extension (ask user)"
      next_steps: "Choose suggestion or extend deadline"
      escalation_available: false

    example_2: |
      status: REVISION_NEEDED
      primary_issue: "Arbiter wants to review for PII safety"
      technical_details: "Plan handles customer emails with AMBER band tool"
      suggestions:
        - "Add data encryption step"
        - "Use RED band tool (secure)"
        - "Redact PII before processing"
      next_steps: "Modify plan and resubmit for approval"
      escalation_available: true (request manual review)

---

# SECTION 8: METRICS FOR FALLBACK SUCCESS

metrics:
  - name: "validation_rejection_rate"
    type: "gauge"
    description: "Plans rejected after full validation"
    target: "<10%"

  - name: "user_retry_rate"
    type: "gauge"
    description: "Users who retry after rejection"
    target: ">70%"

  - name: "fallback_suggestion_acceptance_rate"
    type: "gauge"
    description: "Users accepting suggested fixes"
    target: ">60%"

  - name: "alternative_tool_success_rate"
    type: "gauge"
    description: "Success of recommended alternative tools"
    target: ">80%"

  - name: "timeout_escalation_rate"
    type: "gauge"
    description: "Timeout decisions escalated to expedited"
    target: ">90%"

---

# SECTION 9: ESCALATION PATHS

escalation_paths:
  tier1_failures: |
    Permanent validation failure (structural, capability)
    ↓
    User gets actionable suggestions
    ↓
    User action: Modify and resubmit
    ↓
    No escalation (user's responsibility to fix)

  tier2_rejections: |
    Arbiter rejects (safety concern)
    ↓
    User gets arbiter feedback + suggestions
    ↓
    User action: Modify OR request manual review
    ↓
    If requested: Escalate to security team OR compliance team
    ↓
    Final decision: Approve exception or maintain rejection

  timeout_escalations: |
    Arbiter timeout (no response in 1500ms)
    ↓
    Conservative reject (assume unsafe)
    ↓
    User notified of timeout
    ↓
    User can request: Expedited review (5 min SLA)
    ↓
    Arbiter provides fast decision or escalates
    ↓
    Final: Approve, reject, or manual review

---

# SECTION 10: BEST PRACTICES FOR FALLBACK

best_practices:
  for_users: |
    1. Start with simple plans (fewer steps, single tool)
    2. Use recommended tools (higher success rate)
    3. Monitor validation feedback for patterns
    4. Ask for help if rejected (contact support)
    5. Request escalation if disagree with decision

  for_arbiters: |
    1. Provide specific, actionable feedback
    2. Suggest improvements when rejecting
    3. Fast-track LOW risk decisions
    4. Escalate truly risky plans (don't guess)
    5. Document rationale for every decision

  for_system: |
    1. Track fallback suggestion success
    2. Learn which alternatives work best
    3. Update tool registry based on failures
    4. Improve error messages based on user feedback
    5. Proactively suggest better approaches

---

# SECTION 11: FUTURE ENHANCEMENTS

future:
  v2:
    - "Machine learning to predict which fallbacks will succeed"
    - "Automatic plan repair (suggest minimal changes)"
    - "Progressive plan relaxation (start strict, gradually relax constraints)"
    - "Fallback A/B testing (compare different suggestions)"

  v3:
    - "Multi-path planning (generate multiple valid alternatives)"
    - "Collaborative refinement (user + system iteratively improve)"
    - "Learned user preferences (remember what users accept)"
    - "Federated fallback catalog (learn from other K1 instances)"
