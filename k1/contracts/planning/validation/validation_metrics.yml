---
# Validation Metrics - Observability for Tier 1 & Tier 2 Validation Quality
# Purpose: Define metrics and SLOs for plan validation
# Source ADR: ADR-0007c (Validation Stage 2-Tier Implementation)
# Layer: Planning Layer (Layer 3 - Execution & Tools)

contract:
  name: "Validation Metrics"
  version: "1.0.0"
  purpose: "Comprehensive metrics for validation stage observability and SLO tracking"
  owner: "Planning Layer"
  layer: "Layer 3 - Execution & Tools"
  adr_references:
    - "ADR-0007c: Validation Stage 2-Tier Implementation"
    - "Performance Budgets from ADR-0007"

---

# SECTION 1: TIER 1 METRICS

tier1_metrics:
  description: "Fast deterministic validation performance tracking"

  latency:
    - name: "validation_tier1_latency_ms"
      type: "histogram"
      buckets: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
      labels: ["plan_size", "rule_set"]
      description: "Tier 1 validation latency in milliseconds"
      target_p50: 0.3
      target_p95: 1.0
      target_p99: 2.0

    - name: "validation_structural_check_ms"
      type: "histogram"
      description: "Structural validation only"
      target_p95: 0.1

    - name: "validation_dependency_check_ms"
      type: "histogram"
      description: "Dependency DAG validation"
      target_p95: 0.3

    - name: "validation_capability_check_ms"
      type: "histogram"
      description: "Capability matching"
      target_p95: 0.2

    - name: "validation_budget_check_ms"
      type: "histogram"
      description: "Budget constraint checking"
      target_p95: 0.1

    - name: "validation_schema_check_ms"
      type: "histogram"
      description: "JSON Schema validation"
      target_p95: 0.2

  results:
    - name: "validation_tier1_passed_total"
      type: "counter"
      labels: ["plan_type", "step_count"]
      description: "Plans that passed Tier 1 validation"

    - name: "validation_tier1_rejected_total"
      type: "counter"
      labels: ["rejection_reason", "rule_name"]
      description: "Plans rejected by Tier 1"
      rejection_reasons:
        - "structural_error"
        - "circular_dependency"
        - "missing_dependency"
        - "capability_missing"
        - "budget_exceeded"
        - "band_mismatch"
        - "schema_invalid"
        - "error_handler_invalid"

    - name: "validation_tier1_pass_rate"
      type: "gauge"
      description: "Percentage of plans passing Tier 1"
      target: 0.70  # 70% pass rate is good (others go to Tier 2)

    - name: "validation_tier1_by_rule_total"
      type: "counter"
      labels: ["rule_name", "result"]
      description: "Individual rule execution counts"

  errors:
    - name: "validation_tier1_errors_by_type_total"
      type: "counter"
      labels: ["error_type"]
      description: "Breakdown of validation errors"
      error_types:
        - "STRUCTURAL"
        - "DEPENDENCY"
        - "CAPABILITY"
        - "BUDGET"
        - "BAND"
        - "SCHEMA"
        - "ERROR_HANDLER"

    - name: "validation_tier1_errors_per_plan"
      type: "histogram"
      buckets: [0, 1, 2, 5, 10, 20]
      description: "Number of errors per rejected plan"
      target_p95: 3  # Most plans have < 3 errors

---

# SECTION 2: TIER 2 ARBITER METRICS

tier2_metrics:
  description: "Human-in-loop arbiter performance tracking"

  invocation:
    - name: "validation_tier2_invocations_total"
      type: "counter"
      labels: ["trigger_reason", "risk_level"]
      description: "How often Tier 2 arbiter invoked"
      expected_rate: 0.15  # ~15% of plans (others pass Tier 1)
      trigger_breakdown:
        - "band_red (50%)"
        - "child_user (20%)"
        - "multiple_amber_tools (15%)"
        - "validation_warnings (10%)"
        - "user_requested (5%)"

    - name: "validation_tier2_invocation_rate"
      type: "gauge"
      description: "Percentage of plans requiring Tier 2"
      target: 0.15

    - name: "validation_tier2_by_risk_level_total"
      type: "counter"
      labels: ["risk_level"]
      description: "Arbiter requests by risk level"
      risk_breakdown:
        - "HIGH"
        - "MEDIUM"
        - "LOW"

  latency:
    - name: "validation_tier2_latency_ms"
      type: "histogram"
      buckets: [50, 100, 200, 500, 1000, 2000, 5000, 10000]
      labels: ["risk_level", "decision_type"]
      description: "Arbiter decision latency"
      target_p50: 72
      target_p95: 300
      target_p99: 1500
      note: "Ranges from 50ms (quick approve) to 30min (bulk review)"

    - name: "validation_tier2_timeout_total"
      type: "counter"
      labels: ["timeout_type"]
      description: "Arbiter timeouts (conservative reject)"
      target_rate: "<1%"

  decisions:
    - name: "arbiter_decisions_total"
      type: "counter"
      labels: ["decision_type", "risk_level"]
      description: "All arbiter decisions"
      decision_types:
        - "APPROVE"
        - "APPROVE_WITH_MODIFICATIONS"
        - "REQUEST_INFO"
        - "REJECT"
        - "ESCALATE"

    - name: "arbiter_approval_rate"
      type: "gauge"
      labels: ["risk_level"]
      description: "Percentage of plans approved"
      targets:
        LOW: 0.95     # 95% of LOW risk approved
        MEDIUM: 0.85  # 85% of MEDIUM risk approved
        HIGH: 0.70    # 70% of HIGH risk approved

    - name: "arbiter_rejection_rate"
      type: "gauge"
      labels: ["risk_level"]
      description: "Percentage of plans rejected"
      monitors: "Unusual patterns (too high = false negatives)"

    - name: "arbiter_modification_rate"
      type: "gauge"
      description: "Rate of APPROVE_WITH_MODIFICATIONS"
      target: 0.10  # ~10% need minor tweaks

    - name: "arbiter_modifications_per_plan"
      type: "histogram"
      buckets: [0, 1, 2, 5, 10]
      description: "Number of modifications per plan"
      target_p95: 2

  quality:
    - name: "arbiter_decision_consistency"
      type: "gauge"
      description: "Measure of decision consistency across arbifers"
      method: "Cohen's kappa on subset of reviewed plans"
      target: 0.85  # Good inter-rater reliability

    - name: "arbiter_false_positive_rate"
      type: "gauge"
      description: "Rejected plans that actually succeeded"
      target: "<5%"
      notes: "Tracked via post-execution analysis"

    - name: "arbiter_false_negative_rate"
      type: "gauge"
      description: "Approved plans that should have been rejected"
      target: "<1%"
      notes: "Critical for safety"

---

# SECTION 3: END-TO-END VALIDATION METRICS

end_to_end:
  description: "Combined Tier 1 + Tier 2 validation outcomes"

  overall:
    - name: "validation_total_latency_ms"
      type: "histogram"
      buckets: [1, 10, 50, 100, 500, 1000, 5000]
      labels: ["plan_path"]
      description: "Total validation time (Tier 1 + optional Tier 2)"
      plan_paths:
        - "green_band (Tier 1 only, ~1ms)"
        - "amber_band_simple (Tier 1 only, ~1ms)"
        - "red_band (Tier 1 + Tier 2, ~100ms)"
        - "child_user (Tier 1 + Tier 2, ~100ms)"
      target_p95:
        GREEN: 1
        AMBER_SIMPLE: 1
        RED: 300
        CHILD: 300

    - name: "validation_pass_rate_final"
      type: "gauge"
      description: "Percentage of plans passing full validation (Tier 1 + Tier 2)"
      target: 0.95  # 95% of well-formed requests pass

    - name: "validation_reject_rate_final"
      type: "gauge"
      description: "Percentage of plans rejected (user must fix)"
      target: 0.05  # 5% require user intervention

    - name: "validation_escalation_rate"
      type: "gauge"
      description: "Plans escalated to supervisor"
      target: "<1%"

  funnel:
    - name: "validation_funnel_metric"
      type: "gauge"
      description: "Validation funnel stages (relative percentages)"
      stages:
        - "submitted: 100%"
        - "tier1_passed: 70%"
        - "tier2_triggered: 30%"
        - "arbiter_approved: 28%"
        - "final_pass: 98%"
        - "final_reject: 2%"

---

# SECTION 4: PLAN CHARACTERISTICS METRICS

plan_characteristics:
  description: "Understand plan properties correlating with validation outcomes"

  size:
    - name: "plan_step_count"
      type: "histogram"
      buckets: [1, 2, 3, 5, 10, 20]
      description: "Number of steps per plan"
      target_avg: 3.5

    - name: "plan_dependency_depth"
      type: "histogram"
      buckets: [1, 2, 3, 5, 10]
      description: "Critical path length"
      target_avg: 2.0

    - name: "plan_tool_diversity"
      type: "histogram"
      buckets: [1, 2, 3, 5, 10]
      description: "Number of distinct tools used"
      target_avg: 2.5

  complexity:
    - name: "plan_by_complexity_total"
      type: "counter"
      labels: ["complexity_level"]
      description: "Plans categorized by complexity"
      levels:
        - "SIMPLE (1-2 steps, 1-2 tools)"
        - "MODERATE (3-5 steps, 2-4 tools)"
        - "COMPLEX (6+ steps, 5+ tools)"
      complexity_correlation:
        SIMPLE: "98% pass Tier 1"
        MODERATE: "75% pass Tier 1"
        COMPLEX: "45% pass Tier 1 (many to Tier 2)"

    - name: "plan_validation_success_by_complexity"
      type: "gauge"
      labels: ["complexity_level"]
      description: "Final success rate by complexity"

  risk:
    - name: "plan_by_band_total"
      type: "counter"
      labels: ["band"]
      description: "Plans by privacy band"
      breakdown:
        - "GREEN: 60% (simple searches, reads)"
        - "AMBER: 30% (email, calendar, files)"
        - "RED: 10% (payment, health, legal)"

    - name: "plan_by_risk_distribution"
      type: "gauge"
      labels: ["risk_level"]
      description: "Plans by assessed risk"
      breakdown:
        - "LOW: 70%"
        - "MEDIUM: 20%"
        - "HIGH: 10%"

---

# SECTION 5: ERROR ANALYSIS METRICS

error_analysis:
  description: "Detailed breakdown of validation failures"

  error_frequency:
    - name: "validation_errors_by_rule_total"
      type: "counter"
      labels: ["rule_name"]
      description: "Errors by specific validation rule"
      common_errors:
        - "circular_dependency (15%)"
        - "missing_capability (20%)"
        - "budget_exceeded (10%)"
        - "schema_invalid (25%)"
        - "band_mismatch (8%)"
        - "other (22%)"

    - name: "validation_error_frequency_distribution"
      type: "gauge"
      description: "Distribution of most common errors"
      tracked: "Top 10 error rules with percentages"

    - name: "validation_error_trends"
      type: "gauge"
      description: "Error rate trend over time (daily)"
      alert: "If error rate increases >20% day-over-day"

  error_recovery:
    - name: "plan_submission_retry_rate"
      type: "gauge"
      description: "Users retrying after validation rejection"
      target: 0.70  # 70% of users successfully retry

    - name: "plan_retry_success_rate"
      type: "gauge"
      description: "Percentage of retries that pass"
      target: 0.80  # 80% of retries successful

---

# SECTION 6: ALERTS & SLOs

alerts:
  - name: "ValidationTier1SlowDown"
    condition: "histogram_quantile(0.95, validation_tier1_latency_ms) > 2.0"
    severity: "WARNING"
    action: "Investigate rule engine performance"

  - name: "HighValidationFailureRate"
    condition: "validation_tier1_pass_rate < 0.50"
    severity: "CRITICAL"
    action: "Review plan generation (sketch/expand)"

  - name: "ArbiterBacklogBuilding"
    condition: "increase(validation_tier2_invocations_total[5m]) > 10"
    severity: "WARNING"
    action: "Add arbiter capacity or review trigger conditions"

  - name: "ArbiterTimeoutRate"
    condition: "(arbiter_timeouts / arbiter_total_decisions) > 0.05"
    severity: "ERROR"
    action: "Conservative reject on timeout (safe)"

  - name: "LowArbiterApprovalRate"
    condition: "arbiter_approval_rate < 0.50"
    severity: "WARNING"
    action: "Review arbiter decision patterns for bias"

  - name: "HighValidationErrorRate"
    condition: "increase(validation_tier1_errors_total[5m]) / validation_tier1_attempts > 0.50"
    severity: "ERROR"
    action: "Major issue in plan generation or tool registry"

slos:
  tier1_latency: "P95 < 1ms (99.9% uptime)"
  tier1_pass_rate: ">70% pass (30% go to Tier 2)"
  tier2_latency: "P95 < 300ms (99% uptime)"
  arbiter_approval_rate: ">85% approve (MEDIUM risk)"
  final_pass_rate: ">95% pass full validation"
  validation_availability: "99.99% (critical path)"

---

# SECTION 7: DASHBOARDS

dashboards:
  - name: "Validation Health"
    panels:
      - "Tier 1 latency (P50/P95/P99)"
      - "Tier 1 pass rate"
      - "Top validation errors"
      - "Tier 2 invocation rate"
      - "Arbiter approval distribution"
      - "Final pass rate"

  - name: "Plan Characteristics"
    panels:
      - "Step count distribution"
      - "Complexity distribution"
      - "Privacy band distribution"
      - "Risk level distribution"

  - name: "Error Trends"
    panels:
      - "Validation errors over time (daily)"
      - "Error types (stacked area)"
      - "Retry success rate"
      - "Top failing rules"

  - name: "Arbiter Performance"
    panels:
      - "Decision latency by risk level"
      - "Approval rate by risk"
      - "Decision distribution (pie)"
      - "Queue length"
      - "Timeout rate"

---

# SECTION 8: COMPLIANCE & AUDIT

compliance:
  description: "Validation metrics for regulatory compliance"

  metrics:
    - name: "validation_red_band_approval_tracking"
      type: "counter"
      description: "RED band plans approved and execution outcome"
      tracked: "For PII/financial/health compliance"

    - name: "arbiter_decision_audit_trail"
      type: "event_log"
      description: "Complete record of all arbiter decisions"
      retention: "7 years (regulatory requirement)"

    - name: "validation_error_incident_tracking"
      type: "event_log"
      description: "Validation failures leading to user impact"
      alert: "Any validation error causing user-facing issue"

---

# SECTION 9: PERFORMANCE TARGETS SUMMARY

performance_targets:
  tier1_validation:
    p50_latency_ms: 0.3
    p95_latency_ms: 1.0
    pass_rate: 0.70

  tier2_validation:
    p50_latency_ms: 72
    p95_latency_ms: 300
    approval_rate: 0.85

  end_to_end:
    p95_latency_ms: 300
    pass_rate: 0.95
    reject_rate: 0.05
