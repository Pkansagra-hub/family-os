---
# Prompt Registry Schema - Central Catalog of Domain-Specific Prompts
# Purpose: Define all Jinja2 prompt templates for LLM inference across domains
# Source ADR: ADR-0007b (Expand Stage Tool/Prompt Registry Integration)
# Layer: Planning Layer (Layer 3 - Execution & Tools)

contract:
  name: "Prompt Registry"
  version: "1.0.0"
  purpose: "Central catalog of domain-specific Jinja2 prompt templates for LLM inference"
  owner: "Planning Layer"
  layer: "Layer 3 - Execution & Tools"
  adr_references:
    - "ADR-0007a: Sketch Stage LLM Prompt Engineering"
    - "ADR-0007b: Expand Stage Tool/Prompt Registry Integration"

  research_citations:
    - "In-context learning with prompts (Brown et al., 2020)"
    - "Prompt engineering best practices (Wei et al., 2022)"
    - "Domain-specific prompt templates (Sahoo et al., 2024)"

---

# SECTION 1: REGISTRY STRUCTURE

registry:
  description: "Central in-memory registry of domain-specific prompt templates"
  total_prompts: 25
  storage: "in-memory hash map with optional persistent backup to K0"
  access_pattern: "O(1) lookup by prompt_id, O(n) iteration during expand stage"

  template_formats:
    - "Jinja2 (primary)"
    - "Plain text with variable substitution"

  variable_substitution:
    syntax: "{{ variable_name }}"
    examples:
      - "{{ user_context }}"
      - "{{ tool_name }}"
      - "{{ available_tools }}"
      - "{{ task_description }}"
      - "{{ examples }}"
      - "{{ constraints }}"

  cache:
    enabled: true
    ttl_minutes: 60
    eviction_policy: "LRU"
    hit_rate_target: 0.95

---

# SECTION 2: PROMPT TEMPLATE SCHEMA

prompt_template:
  schema_name: "PromptTemplate"
  description: "Complete specification for a single prompt template"

  fields:
    prompt_id:
      type: "string"
      required: true
      example: "web_search_prompt"
      description: "Unique identifier for the prompt template"
      validation: "^[a-z_][a-z0-9_]*_prompt$"

    name:
      type: "string"
      required: true
      example: "Web Search Prompt"
      description: "Human-readable prompt name"

    description:
      type: "string"
      required: true
      example: "Template for generating web search queries with result formatting"
      description: "Prompt purpose and use cases"

    domain:
      type: "enum"
      required: true
      allowed_domains:
        - "search"           # Web, local file, contact search
        - "calendar"         # Calendar event management
        - "file_operations"  # File read/write/delete
        - "email"            # Email composition and retrieval
        - "payment"          # Payment processing
        - "communication"    # SMS, chat, notifications
        - "data_analysis"    # Data analysis and reporting
        - "content_creation" # Writing, editing, summarization
        - "coding"           # Code generation and analysis
        - "ai_reasoning"     # Complex reasoning tasks
        - "generic"          # Generic/fallback template
      example: "search"

    model_class:
      type: "enum"
      required: true
      description: "Which LLM class this template is designed for"
      allowed_values:
        - "gpt-4o"            # OpenAI GPT-4o (full capability)
        - "gpt-4o-mini"       # OpenAI GPT-4o-mini (fast)
        - "gemma-2b-it"       # Google Gemma (local)
        - "claude-opus"       # Anthropic Claude (reasoning)
        - "generic"           # Works with any model
      example: "gpt-4o-mini"

    version:
      type: "string"
      required: true
      example: "1.2.0"
      description: "Semantic version (MAJOR.MINOR.PATCH)"

    system_prompt:
      type: "string"
      required: true
      description: "System prompt defining LLM role and context"
      example: "You are an expert at formulating web search queries to find specific information."

    user_prompt_template:
      type: "string"
      required: true
      description: "User prompt template with Jinja2 variables"
      example: |
        You need to search for information about: {{ task_description }}

        Available tools: {{ tool_descriptions }}

        Constraints:
        - Keep search queries concise (1-5 words)
        - Use boolean operators if needed
        - Prefer specific queries over broad ones

        Generate a search query:

    context_variables:
      type: "array of string"
      required: true
      description: "Required variables for Jinja2 rendering"
      example:
        - "task_description"
        - "tool_descriptions"
        - "max_results"

    optional_variables:
      type: "array of string"
      required: false
      description: "Optional variables with defaults"
      example:
        - "user_preferences"
        - "previous_context"

    output_format:
      type: "object"
      required: true
      description: "Expected output format after LLM inference"
      properties:
        type:
          type: "enum"
          allowed_values: ["string", "json", "list", "code"]
          example: "string"

        schema:
          type: "JSON Schema or description"
          description: "Schema or format specification"
          example:
            type: "object"
            properties:
              query: { type: "string" }
              keywords: { type: "array" }

        examples:
          type: "array"
          description: "Example outputs"
          example:
            - "laptop prices under $1000"
            - '"best hotels" near NYC -Manhattan'

    latency_hint_ms:
      type: "object"
      required: true
      description: "Expected inference latency"
      properties:
        p50: { type: "integer", example: 300 }
        p95: { type: "integer", example: 800 }
        p99: { type: "integer", example: 1500 }

    cost_hint:
      type: "object"
      required: true
      description: "Estimated cost per invocation"
      properties:
        model: { type: "string", example: "gpt-4o-mini" }
        price_cents: { type: "number", example: 0.15 }
        currency: { type: "string", example: "USD" }
        unit: { type: "string", example: "per_call" }

    temperature:
      type: "number"
      required: true
      range: [0.0, 2.0]
      description: "LLM temperature (0=deterministic, 1=balanced, 2=creative)"
      example: 0.3

    max_tokens:
      type: "integer"
      required: true
      example: 200
      description: "Max output tokens"

    determinism:
      type: "enum"
      required: true
      allowed_values: ["deterministic", "nondeterministic"]
      example: "nondeterministic"
      description: |
        - deterministic: temperature=0, reproducible outputs (verification, extraction)
        - nondeterministic: temperature>0, variable outputs (generation, reasoning)

    privacy_profile:
      type: "object"
      required: true
      description: "PII handling and data protection for this prompt"
      properties:
        pii_classes:
          type: "array"
          example: ["CONTACT", "FINANCIAL"]
          description: "Classes of PII this prompt may handle"
        data_retention_days:
          type: "integer"
          example: 1
          description: "How long prompt results should be retained"
        redaction:
          type: "array"
          example: ["drop_access_tokens", "mask_emails"]
          description: "Automatic redaction for logs"

    rate_limit:
      type: "object"
      required: false
      description: "Per-model rate limiting for this prompt"
      properties:
        tokens_per_minute:
          type: "integer"
          example: 120000
          description: "Max tokens/min for this prompt across all users"
        burst:
          type: "integer"
          example: 10000
          description: "Burst allowance"
        scope:
          type: "enum"
          allowed_values: ["per_user", "per_org", "global"]
          example: "per_user"

    safety_moderation:
      type: "object"
      required: false
      description: "Content moderation settings (filter harmful outputs)"
      properties:
        enabled:
          type: "boolean"
          example: false
        filter_categories:
          type: "array"
          example: ["violence", "hate_speech", "adult"]
        threshold:
          type: "number"
          range: [0.0, 1.0]
          example: 0.7
          description: "Confidence threshold for filtering"

    retry_on_error:
      type: "boolean"
      required: false
      default: true
      description: "Whether to retry if LLM output doesn't match expected format"

    fallback_action:
      type: "enum"
      required: false
      allowed_values:
        - "use_generic_template"  # Fall back to generic prompt
        - "return_error"           # Return error to user
        - "manual_intervention"    # Escalate to human
      default: "use_generic_template"
      description: "What to do if template fails"

    examples:
      type: "array"
      required: false
      description: "Example invocations showing template rendering"
      example:
        - input:
            task_description: "Find flights to Paris in March"
            tool_descriptions: "Web search: search public web"
          output: "Paris flights March travel deals"
          output_latency_ms: 450

        - input:
            task_description: "Check email from manager"
            tool_descriptions: "Email search: search mailbox"
          output: "Email from manager subject status"
          output_latency_ms: 320

---

# SECTION 3: PROMPT TEMPLATE CATALOG (25 Prompts)

# SEARCH DOMAIN (4 prompts)
search_prompts:
  - prompt_id: "web_search_prompt"
    name: "Web Search Query"
    domain: "search"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "You are an expert at formulating concise web search queries."
    user_prompt_template: |
      Task: {{ task_description }}

      Generate a focused web search query (3-7 words):
    context_variables: ["task_description"]
    output_format:
      type: "string"
      examples:
        - "best coffee shops downtown"
        - "weather forecast next week"
    temperature: 0.2
    max_tokens: 50
    latency_hint_ms: { p50: 200, p95: 400, p99: 800 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.05 }

  - prompt_id: "local_file_search_prompt"
    name: "Local File Search"
    domain: "search"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "You help formulate file search queries for local systems."
    user_prompt_template: |
      Search for files matching: {{ task_description }}
      Available folders: {{ available_folders }}

      Generate a file search pattern:
    context_variables: ["task_description", "available_folders"]
    output_format:
      type: "string"
      examples:
        - "*.pdf"
        - "report_*.xlsx"
    temperature: 0.1
    max_tokens: 50
    latency_hint_ms: { p50: 150, p95: 300, p99: 600 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.03 }

  - prompt_id: "contact_search_prompt"
    name: "Contact Search"
    domain: "search"
    model_class: "gemma-2b-it"
    version: "1.0.0"
    system_prompt: "Help find contacts by name or organization."
    user_prompt_template: |
      Find contact for: {{ search_criteria }}

      Extract name and organization to search:
    context_variables: ["search_criteria"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          name: { type: "string" }
          organization: { type: "string" }
    temperature: 0.1
    max_tokens: 100
    latency_hint_ms: { p50: 100, p95: 200, p99: 400 }
    cost_hint: { model: "gemma-2b-it", price_cents: 0.0 }

  - prompt_id: "knowledge_base_search_prompt"
    name: "Knowledge Base Search"
    domain: "search"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Extract semantic search keywords for knowledge base queries."
    user_prompt_template: |
      Topic: {{ topic }}

      Generate 3-5 relevant search keywords (comma-separated):
    context_variables: ["topic"]
    output_format:
      type: "string"
      examples:
        - "machine learning, model training, neural networks"
        - "customer service, support tickets, issue resolution"
    temperature: 0.3
    max_tokens: 100
    latency_hint_ms: { p50: 200, p95: 500, p99: 1000 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.08 }

# CALENDAR DOMAIN (3 prompts)
calendar_prompts:
  - prompt_id: "create_event_prompt"
    name: "Create Calendar Event"
    domain: "calendar"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Extract event details from natural language descriptions."
    user_prompt_template: |
      User request: {{ user_request }}

      Extract event details (JSON):
    context_variables: ["user_request"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          title: { type: "string" }
          start_time: { type: "string", format: "ISO8601" }
          duration_minutes: { type: "integer" }
          attendees: { type: "array" }
          description: { type: "string" }
    temperature: 0.1
    max_tokens: 200
    latency_hint_ms: { p50: 250, p95: 600, p99: 1200 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.10 }

  - prompt_id: "find_availability_prompt"
    name: "Find Available Time Slots"
    domain: "calendar"
    model_class: "gemma-2b-it"
    version: "1.0.0"
    system_prompt: "Help find available time slots for scheduling."
    user_prompt_template: |
      Need to schedule: {{ activity }}
      Duration needed: {{ duration_minutes }} minutes
      Constraints: {{ constraints }}

      Suggest available time windows:
    context_variables: ["activity", "duration_minutes", "constraints"]
    output_format:
      type: "list"
      examples:
        - "Monday 2-3 PM"
        - "Tuesday 10-11 AM"
    temperature: 0.2
    max_tokens: 150
    latency_hint_ms: { p50: 150, p95: 350, p99: 700 }
    cost_hint: { model: "gemma-2b-it", price_cents: 0.0 }

  - prompt_id: "meeting_invite_prompt"
    name: "Compose Meeting Invite"
    domain: "calendar"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Generate professional meeting invite text."
    user_prompt_template: |
      Meeting: {{ meeting_title }}
      Attendees: {{ attendees }}
      Purpose: {{ purpose }}

      Draft a professional meeting invite:
    context_variables: ["meeting_title", "attendees", "purpose"]
    output_format:
      type: "string"
      examples:
        - "Dear team, we have scheduled a weekly planning sync for..."
    temperature: 0.4
    max_tokens: 200
    latency_hint_ms: { p50: 300, p95: 700, p99: 1400 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.12 }

# FILE OPERATIONS DOMAIN (3 prompts)
file_prompts:
  - prompt_id: "file_read_prompt"
    name: "File Read"
    domain: "file_operations"
    model_class: "gemma-2b-it"
    version: "1.0.0"
    system_prompt: "Extract file paths and reading instructions."
    user_prompt_template: |
      User wants to: {{ user_request }}

      Extract file path and reading parameters:
    context_variables: ["user_request"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          file_path: { type: "string" }
          start_line: { type: "integer" }
          end_line: { type: "integer" }
    temperature: 0.1
    max_tokens: 100
    latency_hint_ms: { p50: 100, p95: 200, p99: 400 }
    cost_hint: { model: "gemma-2b-it", price_cents: 0.0 }

  - prompt_id: "file_write_prompt"
    name: "File Write"
    domain: "file_operations"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Help format content for writing to files."
    user_prompt_template: |
      Content to write: {{ content }}
      File path: {{ file_path }}

      Format for file writing:
    context_variables: ["content", "file_path"]
    output_format:
      type: "string"
    temperature: 0.2
    max_tokens: 500
    latency_hint_ms: { p50: 200, p95: 500, p99: 1000 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.15 }

  - prompt_id: "file_list_prompt"
    name: "List Files"
    domain: "file_operations"
    model_class: "gemma-2b-it"
    version: "1.0.0"
    system_prompt: "Extract directory path and filtering criteria."
    user_prompt_template: |
      User wants to list: {{ user_request }}

      Extract directory and file filter:
    context_variables: ["user_request"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          directory: { type: "string" }
          pattern: { type: "string" }
    temperature: 0.1
    max_tokens: 100
    latency_hint_ms: { p50: 100, p95: 200, p99: 400 }
    cost_hint: { model: "gemma-2b-it", price_cents: 0.0 }

# EMAIL DOMAIN (3 prompts)
email_prompts:
  - prompt_id: "compose_email_prompt"
    name: "Compose Email"
    domain: "email"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Compose professional email messages."
    user_prompt_template: |
      Recipient: {{ recipient }}
      Subject: {{ subject }}
      Purpose: {{ purpose }}
      Tone: {{ tone }}

      Compose an email:
    context_variables: ["recipient", "subject", "purpose", "tone"]
    optional_variables: ["context_info"]
    output_format:
      type: "string"
      examples:
        - "Dear [Recipient], I hope this email finds you well. I wanted to follow up on..."
    temperature: 0.5
    max_tokens: 400
    latency_hint_ms: { p50: 400, p95: 900, p99: 1800 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.12 }

  - prompt_id: "email_search_prompt"
    name: "Email Search"
    domain: "email"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Extract search criteria for email queries."
    user_prompt_template: |
      Looking for emails: {{ user_request }}

      Extract search parameters:
    context_variables: ["user_request"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          keywords: { type: "array" }
          from_sender: { type: "string" }
          date_range: { type: "string" }
    temperature: 0.2
    max_tokens: 200
    latency_hint_ms: { p50: 250, p95: 600, p99: 1200 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.08 }

  - prompt_id: "email_summarize_prompt"
    name: "Summarize Email"
    domain: "email"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Summarize email threads concisely."
    user_prompt_template: |
      Email thread:
      {{ email_content }}

      Provide a 1-2 sentence summary:
    context_variables: ["email_content"]
    output_format:
      type: "string"
      examples:
        - "John requested project status update. Reply needed by Friday."
    temperature: 0.3
    max_tokens: 150
    latency_hint_ms: { p50: 300, p95: 700, p99: 1400 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.10 }

# PAYMENT DOMAIN (2 prompts)
payment_prompts:
  - prompt_id: "payment_validation_prompt"
    name: "Validate Payment Request"
    domain: "payment"
    model_class: "gpt-4o"
    version: "1.0.0"
    system_prompt: "Validate payment requests for security and compliance."
    user_prompt_template: |
      Payment request:
      - Amount: {{ amount }}
      - Recipient: {{ recipient }}
      - Purpose: {{ purpose }}

      Validate and flag any concerns:
    context_variables: ["amount", "recipient", "purpose"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          is_valid: { type: "boolean" }
          concerns: { type: "array" }
          risk_level: { type: "enum", enum: ["LOW", "MEDIUM", "HIGH"] }
    temperature: 0.0
    max_tokens: 200
    latency_hint_ms: { p50: 600, p95: 1500, p99: 3000 }
    cost_hint: { model: "gpt-4o", price_cents: 0.30 }

  - prompt_id: "payment_amount_prompt"
    name: "Calculate Payment Amount"
    domain: "payment"
    model_class: "gemma-2b-it"
    version: "1.0.0"
    system_prompt: "Extract and validate payment amounts."
    user_prompt_template: |
      User says: {{ user_request }}

      Extract amount and currency:
    context_variables: ["user_request"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          amount: { type: "number" }
          currency: { type: "string" }
    temperature: 0.0
    max_tokens: 100
    latency_hint_ms: { p50: 150, p95: 350, p99: 700 }
    cost_hint: { model: "gemma-2b-it", price_cents: 0.0 }

# COMMUNICATION DOMAIN (2 prompts)
communication_prompts:
  - prompt_id: "sms_compose_prompt"
    name: "Compose SMS"
    domain: "communication"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Compose concise SMS messages (limit 160 characters)."
    user_prompt_template: |
      Message to: {{ recipient_name }}
      Content: {{ content }}
      Tone: {{ tone }}

      Compose SMS (keep under 160 chars):
    context_variables: ["recipient_name", "content", "tone"]
    output_format:
      type: "string"
      examples:
        - "Hi Sarah, can we reschedule our 3pm meeting to 4pm? Thanks!"
    temperature: 0.3
    max_tokens: 100
    latency_hint_ms: { p50: 200, p95: 450, p99: 900 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.05 }

  - prompt_id: "notification_compose_prompt"
    name: "Compose Notification"
    domain: "communication"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Create concise in-app notification messages."
    user_prompt_template: |
      Event: {{ event_name }}
      Details: {{ details }}

      Create notification (title + body):
    context_variables: ["event_name", "details"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          title: { type: "string" }
          body: { type: "string" }
    temperature: 0.3
    max_tokens: 200
    latency_hint_ms: { p50: 200, p95: 450, p99: 900 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.06 }

# DATA ANALYSIS DOMAIN (2 prompts)
analysis_prompts:
  - prompt_id: "sentiment_analysis_prompt"
    name: "Analyze Sentiment"
    domain: "data_analysis"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Analyze sentiment in text."
    user_prompt_template: |
      Text to analyze: {{ text }}

      Provide sentiment analysis:
    context_variables: ["text"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          sentiment: { type: "enum", enum: ["POSITIVE", "NEUTRAL", "NEGATIVE"] }
          score: { type: "number", minimum: 0, maximum: 1 }
          explanation: { type: "string" }
    temperature: 0.0
    max_tokens: 200
    latency_hint_ms: { p50: 250, p95: 600, p99: 1200 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.08 }

  - prompt_id: "data_summarize_prompt"
    name: "Summarize Data"
    domain: "data_analysis"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Summarize data insights concisely."
    user_prompt_template: |
      Data: {{ data }}
      Focus: {{ focus_area }}

      Provide summary:
    context_variables: ["data", "focus_area"]
    output_format:
      type: "string"
    temperature: 0.3
    max_tokens: 300
    latency_hint_ms: { p50: 400, p95: 1000, p99: 2000 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.15 }

# CONTENT CREATION DOMAIN (2 prompts)
content_prompts:
  - prompt_id: "write_document_prompt"
    name: "Write Document"
    domain: "content_creation"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Write professional documents."
    user_prompt_template: |
      Document type: {{ doc_type }}
      Topic: {{ topic }}
      Audience: {{ audience }}
      Length: {{ length }}

      Write document:
    context_variables: ["doc_type", "topic", "audience", "length"]
    output_format:
      type: "string"
    temperature: 0.5
    max_tokens: 1000
    latency_hint_ms: { p50: 800, p95: 2000, p99: 4000 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.25 }

  - prompt_id: "edit_text_prompt"
    name: "Edit Text"
    domain: "content_creation"
    model_class: "gpt-4o-mini"
    version: "1.0.0"
    system_prompt: "Edit and improve text content."
    user_prompt_template: |
      Original text: {{ text }}
      Edit type: {{ edit_type }}

      Improved version:
    context_variables: ["text", "edit_type"]
    optional_variables: ["tone", "style"]
    output_format:
      type: "string"
    temperature: 0.4
    max_tokens: 500
    latency_hint_ms: { p50: 400, p95: 1000, p99: 2000 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.12 }

# CODING DOMAIN (1 prompt)
coding_prompts:
  - prompt_id: "code_generation_prompt"
    name: "Generate Code"
    domain: "coding"
    model_class: "gpt-4o"
    version: "1.0.0"
    system_prompt: "Generate clean, production-ready code."
    user_prompt_template: |
      Task: {{ task_description }}
      Language: {{ language }}
      Framework: {{ framework }}

      Generate code:
    context_variables: ["task_description", "language", "framework"]
    optional_variables: ["existing_code", "constraints"]
    output_format:
      type: "code"
      examples:
        - "def calculate_total(items):\n    return sum(item.price for item in items)"
    temperature: 0.2
    max_tokens: 1000
    latency_hint_ms: { p50: 600, p95: 1500, p99: 3000 }
    cost_hint: { model: "gpt-4o", price_cents: 0.25 }

# AI REASONING DOMAIN (1 prompt)
reasoning_prompts:
  - prompt_id: "complex_reasoning_prompt"
    name: "Complex Reasoning"
    domain: "ai_reasoning"
    model_class: "claude-opus"
    version: "1.0.0"
    system_prompt: "Engage in deep reasoning and problem-solving."
    user_prompt_template: |
      Problem: {{ problem_statement }}
      Context: {{ context }}
      Constraints: {{ constraints }}

      Provide detailed reasoning and solution:
    context_variables: ["problem_statement", "context"]
    optional_variables: ["constraints", "examples"]
    output_format:
      type: "json"
      schema:
        type: "object"
        properties:
          reasoning: { type: "string" }
          solution: { type: "string" }
          alternatives: { type: "array" }
    temperature: 0.6
    max_tokens: 2000
    latency_hint_ms: { p50: 1500, p95: 3500, p99: 7000 }
    cost_hint: { model: "claude-opus", price_cents: 0.60 }

# GENERIC FALLBACK PROMPT (1 prompt)
generic_prompts:
  - prompt_id: "generic_tool_call_prompt"
    name: "Generic Tool Call"
    domain: "generic"
    model_class: "generic"
    version: "1.0.0"
    system_prompt: "You are a helpful assistant that can call various tools."
    user_prompt_template: |
      User request: {{ user_request }}
      Tool: {{ tool_name }}

      How to use this tool:
    context_variables: ["user_request", "tool_name"]
    optional_variables: ["tool_description", "examples"]
    output_format:
      type: "string"
    temperature: 0.3
    max_tokens: 300
    latency_hint_ms: { p50: 300, p95: 800, p99: 1600 }
    cost_hint: { model: "gpt-4o-mini", price_cents: 0.10 }

---

# SECTION 4: PROMPT MATCHING ALGORITHM

matching_algorithm:
  description: "How expand_stage selects prompt templates"
  complexity: "O(1) average case (hash map lookup) with optional fuzzy matching"

  algorithm: |
    Function prompt_registry.select_prompt(step: PlanStep) -> PromptTemplate:
      1. Try exact match by step.tool_id:
         prompt_id = step.tool_id + "_prompt"
         if prompt_id in registry:
           return registry.get(prompt_id)

      2. Try fuzzy match by description:
         candidates = [p for p in registry if p.domain == step.domain]
         best_match = max(candidates, key=lambda p: cosine_similarity(p.description, step.description))
         if best_match.similarity > 0.7:
           return best_match

      3. Fall back to domain-specific default:
         return registry.get_default_for_domain(step.domain)

      4. Ultimate fallback:
         return registry.get("generic_tool_call_prompt")

  matching_priority: |
    1. Exact tool_id match (best - specific template for tool)
    2. Domain + fuzzy description match (good - similar task in same domain)
    3. Domain default (acceptable - domain-specific fallback)
    4. Generic fallback (worst case - generic template)

  performance_budgets:
    p50_latency_ms: 1.0
    p95_latency_ms: 5.0
    p99_latency_ms: 10.0

---

# SECTION 5: TEMPLATE RENDERING

rendering:
  engine: "Jinja2"

  rendering_process: |
    Function render_prompt(template: PromptTemplate, context: Dict) -> str:
      1. Validate all required variables present in context
      2. Set defaults for optional variables
      3. Render system_prompt with context
      4. Render user_prompt_template with context
      5. Return combined [system_prompt, user_prompt]

  error_handling:
    missing_variable: |
      If required variable missing:
      - Log error with template_id and variable_name
      - Raise TemplateRenderError with helpful message
      - Recommend which context variables are required

    invalid_type: |
      If variable type mismatch:
      - Attempt automatic type coercion (str, int, list)
      - If coercion fails, raise TypeError with details
      - Suggest correct variable types from schema

  validation: |
    After rendering, validate output:
    1. Length check (total tokens < max_tokens)
    2. Format check (contains expected structure)
    3. Safety check (no PII leakage, no injection attempts)

---

# SECTION 6: METRICS & OBSERVABILITY

observability:
  metrics:
    - name: "prompt_registry_lookups_total"
      type: "counter"
      labels: ["prompt_id", "match_type", "status"]
      description: "Total prompt registry lookups (exact/fuzzy/fallback)"

    - name: "prompt_registry_lookup_duration_ms"
      type: "histogram"
      buckets: [0.5, 1, 2, 5, 10, 20, 50]
      labels: ["prompt_id", "match_type"]
      description: "Prompt lookup latency"

    - name: "prompt_render_duration_ms"
      type: "histogram"
      buckets: [10, 50, 100, 200, 500, 1000]
      labels: ["prompt_id"]
      description: "Jinja2 template rendering latency"

    - name: "prompt_render_errors_total"
      type: "counter"
      labels: ["prompt_id", "error_type"]
      description: "Prompt rendering errors (missing_variable, invalid_type, etc.)"

    - name: "prompt_inference_duration_ms"
      type: "histogram"
      buckets: [100, 300, 500, 1000, 2000, 5000]
      labels: ["model_class"]
      description: "LLM inference latency"

    - name: "prompt_output_validation_failures_total"
      type: "counter"
      labels: ["prompt_id", "failure_reason"]
      description: "Failed output validations"

  alerts:
    - name: "PromptRenderingSlowDown"
      condition: "histogram_quantile(0.95, prompt_render_duration_ms) > 100ms"
      severity: "WARNING"
      message: "Prompt rendering latency above 100ms"

    - name: "HighPromptRenderErrors"
      condition: "increase(prompt_render_errors_total[5m]) > 50"
      severity: "ERROR"
      message: "High rate of prompt rendering errors in last 5 minutes"

    - name: "OutputValidationIssues"
      condition: "increase(prompt_output_validation_failures_total[5m]) > 20"
      severity: "WARNING"
      message: "Many failed LLM output validations"

---

# SECTION 7: DEPENDENCIES & INTEGRATION

dependencies:
  incoming:
    - "expand_stage.yml - Needs prompt templates to enrich tool steps"
    - "sketch_stage.yml - Sketch stage uses system/user prompt templates"

  outgoing:
    - "tool_registry_schema.yml - Paired with tool registry"
    - "K0 Bridge - Persistent storage of prompt registry"

  related_contracts:
    - "ADR-0007a-sketch-stage-llm-prompt-engineering.md"
    - "ADR-0007b-expand-stage-tool-prompt-registry-integration.md"
    - "contracts/planning/pipeline/sketch_stage.yml"
    - "contracts/planning/pipeline/expand_stage.yml"

---

# SECTION 8: VALIDATION & CONSTRAINTS

validation:
  template_constraints:
    - "prompt_id must be unique globally"
    - "prompt_id must match: ^[a-z_][a-z0-9_]*_prompt$"
    - "system_prompt and user_prompt_template must be valid Jinja2"
    - "All variables in templates must be declared in context_variables"
    - "max_tokens must be > 0"
    - "temperature must be in range [0.0, 2.0]"
    - "model_class must be a supported LLM"
    - "domain must be one of the allowed domains"

  rendering_constraints:
    - "All required context variables must be provided"
    - "Output must be valid according to output_format schema"
    - "No PII should leak in outputs"
    - "Final prompt size < max_tokens"

  registry_constraints:
    - "No duplicate prompt_ids"
    - "Total prompts <= 100 (scalability limit)"
    - "Memory usage <= 50MB (operational limit)"

---

# SECTION 9: FUTURE ENHANCEMENTS

future_enhancements:
  v2:
    - "Dynamic prompt generation from few-shot examples"
    - "Prompt versioning and A/B testing"
    - "Automatic prompt optimization based on LLM feedback"
    - "Multi-language prompt templates"
    - "Prompt composition (combining multiple templates)"

  v3:
    - "Learned prompt templates (learned from successful executions)"
    - "Domain-specific prompt fine-tuning"
    - "Prompt marketplace (share prompts across K1 instances)"
    - "Automatic prompt fallback selection based on model capabilities"
