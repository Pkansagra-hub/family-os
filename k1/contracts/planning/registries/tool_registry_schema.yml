---
# Tool Registry Schema - Central Catalog of Available Tools
# Purpose: Define all tools available to the planning system
# Source ADR: ADR-0007b (Expand Stage Tool/Prompt Registry Integration)
# Layer: Planning Layer (Layer 3 - Execution & Tools)

contract:
  name: "Tool Registry"
  version: "1.0.0"
  purpose: "Central catalog of all available tools with schemas, latency hints, costs, and agent implementations"
  owner: "Planning Layer"
  layer: "Layer 3 - Execution & Tools"
  adr_references:
    - "ADR-0007b: Expand Stage Tool/Prompt Registry Integration"
    - "ADR-0001a: Model Hub Architecture"

  research_citations:
    - "Tool composition in LLM systems (Yao et al., 2022)"
    - "Task decomposition with tool schemas (Schick et al., 2024)"

---

# SECTION 1: REGISTRY STRUCTURE
registry:
  description: "Central in-memory registry of 50+ tools"
  total_tools: 50
  storage: "in-memory hash map with optional persistent backup to K0"
  access_pattern: "O(1) lookup by tool_id, O(n) iteration during expand stage"
  cache:
    enabled: true
    ttl_minutes: 60
    eviction_policy: "LRU"
    hit_rate_target: 0.95

---

# SECTION 2: TOOL SPECIFICATION SCHEMA
tool_spec:
  schema_name: "ToolSpec"
  description: "Complete specification for a single tool"

  fields:
    tool_id:
      type: "string"
      required: true
      example: "search_web"
      description: "Unique identifier for the tool (alphanumeric + underscore)"
      validation: "^[a-z_][a-z0-9_]*$"

    name:
      type: "string"
      required: true
      example: "Web Search"
      description: "Human-readable tool name"

    description:
      type: "string"
      required: true
      example: "Search the public web for information"
      description: "Tool purpose and use cases"

    category:
      type: "enum"
      required: true
      allowed_values:
        - "search"       # Web, local, contacts, knowledge base
        - "calendar"     # Event management
        - "file"         # File operations
        - "email"        # Email management
        - "communication" # Chat, messaging
        - "payment"      # Financial transactions
        - "api"          # Generic HTTP API client
        - "media"        # Image, video, audio generation
        - "analysis"     # Data analysis and visualization
        - "coding"       # Code execution, compilation
        - "ai_models"    # LLM inference
      example: "search"

    schema_in:
      type: "JSON Schema"
      required: true
      description: "Input schema (parameters)"
      example:
        type: "object"
        properties:
          query:
            type: "string"
            description: "Search query text"
          limit:
            type: "integer"
            default: 10
            description: "Max results to return"
          region:
            type: "string"
            default: "us"
            description: "Geographic region for search"
        required: ["query"]

    schema_out:
      type: "JSON Schema"
      required: true
      description: "Output schema (response format)"
      example:
        type: "object"
        properties:
          results:
            type: "array"
            items:
              type: "object"
              properties:
                title:
                  type: "string"
                url:
                  type: "string"
                snippet:
                  type: "string"
          total_results:
            type: "integer"
          search_time_ms:
            type: "integer"
        required: ["results", "total_results"]

    latency_hint_ms:
      type: "object"
      required: true
      description: "Expected latency percentiles"
      properties:
        p50: { type: "integer", example: 200 }
        p95: { type: "integer", example: 500 }
        p99: { type: "integer", example: 1000 }

    cost_hint:
      type: "object"
      required: true
      description: "Estimated cost in cents per invocation (normalized unit model)"
      properties:
        model:
          type: "enum"
          allowed_values: ["per_call", "per_token", "per_second"]
          example: "per_call"
          description: "Unit model for pricing"
        price_cents:
          type: "number"
          example: 0.1
          description: "Cost in cents (may be per unit specified in model)"
        currency:
          type: "string"
          example: "USD"
        unit_details:
          type: "object"
          required: false
          description: "Additional unit normalization (for per_token pricing)"
          properties:
            token_type:
              type: "enum"
              allowed_values: ["input", "output", "both"]
              example: "both"
              description: "Which token counts are included"
            per_1k_tokens:
              type: "boolean"
              example: true
              description: "If true, price_cents is per 1000 tokens"

    band_required:
      type: "enum"
      required: true
      description: "Minimum privacy band required (GREEN/AMBER/RED)"
      allowed_values: ["GREEN", "AMBER", "RED"]
      example: "GREEN"
      details:
        GREEN: "No PII, no financial, no sensitive health"
        AMBER: "Might involve PII or minor financial transactions"
        RED: "Involves healthcare, legal, or high-value financial"

    capabilities_required:
      type: "array of strings"
      required: true
      description: "Agent capabilities needed to execute this tool"
      example: ["internet_access", "search_indexing", "result_parsing"]

    # SAFETY-CRITICAL FIELDS (Added per team recommendations)
    side_effects:
      type: "enum"
      required: true
      allowed_values: ["none", "read", "write_external"]
      example: "write_external"
      description: "Whether tool causes external side effects (for idempotency planning)"
      details:
        none: "Pure read-only, no state changes"
        read: "Reads external state only"
        write_external: "Modifies external state (requires idempotency, receipts)"

    idempotency:
      type: "object"
      required: true
      description: "Idempotency semantics (critical for write tools and retries)"
      properties:
        required:
          type: "boolean"
          example: true
          description: "Whether idempotency is required (mandatory for write_external)"
        key_template:
          type: "string"
          example: "session:{{user_id}}:charge:{{merchant_id}}:{{amount}}:{{date}}"
          description: "Template for generating idempotency keys (ignored if required=false)"
        semantics:
          type: "enum"
          allowed_values: ["exactly_once", "at_least_once", "best_effort"]
          example: "exactly_once"
          description: |
            - exactly_once: Guarantees single execution (financial, critical ops)
            - at_least_once: May execute multiple times (with deduplication)
            - best_effort: No ordering guarantees (search, read-only)

    receipt_policy:
      type: "object"
      required: true
      description: "How receipts are generated and tracked (audit & recovery)"
      properties:
        plan_receipt_required:
          type: "boolean"
          example: true
          description: "Emit receipt when added to plan (audit trail)"
        effect_receipt_required:
          type: "boolean"
          example: true
          description: "Emit receipt when effect occurs (affects saga compensation)"
        effect_type:
          type: "enum"
          allowed_values: ["STATE_MUTATION", "EXTERNAL_ACTION", "AUDIT_ONLY"]
          example: "EXTERNAL_ACTION"
          description: |
            - STATE_MUTATION: Changes internal state (requires compensation on rollback)
            - EXTERNAL_ACTION: Affects external system (requires effect receipt)
            - AUDIT_ONLY: Read-only, only audit trail needed

    confirm_policy:
      type: "object"
      required: false
      description: "User confirmation requirements before execution"
      properties:
        require_user_confirm:
          type: "boolean"
          example: false
          description: "User must explicitly confirm before executing"
        two_person_rule:
          type: "boolean"
          example: false
          description: "Two authorized users must approve (financial/locks)"
        confirm_template:
          type: "string"
          example: "Confirm charge ${{amount}} to {{merchant}}?"
          description: "Template for confirmation prompt"

    privacy_profile:
      type: "object"
      required: true
      description: "PII classes handled and data protection requirements"
      properties:
        pii_classes:
          type: "array"
          example: ["CONTACT", "FINANCIAL"]
          description: "Classes of PII this tool may handle"
        data_retention_days:
          type: "integer"
          example: 30
          description: "How long results should be retained"
        redaction:
          type: "array"
          example: ["mask_account_last4", "drop_access_tokens"]
          description: "Automatic redaction policies for logs"

    capability_tokens_required:
      type: "array of strings"
      required: true
      description: "Ed25519-signed capability lease tokens (enforces ADR-0005e)"
      example: ["TOOL_CALL", "NETWORK_ACCESS", "MODEL_CALL"]
      details: |
        These capabilities must be verified at runtime using signed capability tokens.
        Unlike capabilities_required (human-readable), these tokens are cryptographically
        verified to prevent capability elevation attacks.

    determinism:
      type: "enum"
      required: true
      allowed_values: ["deterministic", "nondeterministic"]
      example: "nondeterministic"
      description: |
        - deterministic: Same inputs always produce same outputs (safe for critical paths)
        - nondeterministic: Output varies (web search, LLM calls, timing-dependent ops)

    execution_class:
      type: "enum"
      required: true
      allowed_values: ["cpu_bound", "io_bound", "llm_bound"]
      example: "io_bound"
      description: "Execution characteristic for scheduling (affects worker pool assignment)"

    supports_streaming:
      type: "boolean"
      required: false
      default: false
      example: false
      description: "Whether tool supports streaming output (for long-running operations)"

    sandbox:
      type: "enum"
      required: false
      allowed_values: ["none", "mcp", "wasm", "container"]
      example: "mcp"
      description: "Sandboxing mechanism for code execution (none = external service)"

    healthcheck:
      type: "object"
      required: false
      description: "Health probe configuration (for planner to avoid dead tools)"
      properties:
        probe_type:
          type: "enum"
          allowed_values: ["http", "rpc", "none"]
          example: "http"
        probe_endpoint:
          type: "string"
          example: "/healthz"
        expected_p95_ms:
          type: "integer"
          example: 200
          description: "Expected P95 latency for healthcheck response"
        fail_open:
          type: "boolean"
          example: false
          description: "If healthcheck fails, fail open (allow) or fail closed (reject)"

    timeout_overrides_ms:
      type: "object"
      required: false
      description: "Per-band timeout overrides (session band affects resource limits)"
      properties:
        GREEN:
          type: "integer"
          example: 800
        AMBER:
          type: "integer"
          example: 2000
        RED:
          type: "integer"
          example: 5000

    authentication:
      type: "object"
      required: true
      description: "Authentication method needed"
      properties:
        method:
          type: "enum"
          allowed_values: ["none", "api_key", "oauth2", "service_account"]
          example: "api_key"
        scopes:
          type: "array of strings"
          example: ["search:read", "public"]

    timeout_ms:
      type: "integer"
      required: true
      example: 5000
      description: "Hard timeout for this tool invocation"

    max_concurrent_calls:
      type: "integer"
      required: true
      example: 10
      description: "Maximum concurrent invocations allowed"

    retry_policy:
      type: "object"
      required: true
      description: "Retry behavior on failure"
      properties:
        max_retries: { type: "integer", example: 2 }
        backoff_ms: { type: "integer", example: 100 }
        exponential_base: { type: "number", example: 2.0 }
        jitter_ms:
          type: "integer"
          example: 50
          description: "Random jitter added to backoff (prevents thundering herd)"
        retryable_errors:
          type: "array"
          example: ["TIMEOUT", "RATE_LIMIT", "TRANSIENT_ERROR"]

    agent_implementations:
      type: "array"
      required: true
      description: "Which agents can execute this tool"
      example:
        - agent_id: "search_agent_01"
          specialization_bonus: 0.2
          typical_success_rate: 0.98
        - agent_id: "search_agent_02"
          specialization_bonus: 0.15
          typical_success_rate: 0.95

    examples:
      type: "array of object"
      required: false
      description: "Example invocations showing input/output"
      example:
        - input: { query: "how to bake cookies" }
          output:
            results:
              - title: "The Best Cookie Recipe"
                url: "https://example.com/cookies"
                snippet: "Try this classic chocolate chip cookie recipe..."
            total_results: 500000
            search_time_ms: 250

---

# SECTION 3: CORE TOOL CATALOG (50+ Tools)

# SEARCH TOOLS (6 tools)
search_tools:
  - tool_id: "search_web"
    name: "Web Search"
    description: "Search the public web for information"
    category: "search"
    band_required: "GREEN"
    capabilities_required: ["internet_access", "search_indexing"]
    capability_tokens_required: ["TOOL_CALL", "INTERNET_ACCESS"]
    latency_hint_ms: { p50: 200, p95: 500, p99: 1000 }
    cost_hint: { model: "per_call", price_cents: 0.1, currency: "USD" }
    side_effects: "read"
    determinism: "nondeterministic"
    idempotency: { required: false, semantics: "best_effort" }
    receipt_policy: { plan_receipt_required: false, effect_receipt_required: false, effect_type: "AUDIT_ONLY" }
    confirm_policy: { require_user_confirm: false, two_person_rule: false }
    privacy_profile: { pii_classes: [], data_retention_days: 7, redaction: [] }
    execution_class: "io_bound"
    supports_streaming: false
    sandbox: "mcp"
    healthcheck: { probe_type: "http", probe_endpoint: "/healthz", expected_p95_ms: 200, fail_open: true }
    timeout_overrides_ms: { GREEN: 5000, AMBER: 8000 }
    timeout_ms: 5000
    max_concurrent_calls: 10
    retry_policy: { max_retries: 2, backoff_ms: 100, exponential_base: 2.0, jitter_ms: 50, retryable_errors: ["TIMEOUT", "RATE_LIMIT"] }
    agent_implementations:
      - agent_id: "search_agent_01"
        specialization_bonus: 0.2
        typical_success_rate: 0.98
      - agent_id: "search_agent_02"
        specialization_bonus: 0.15
        typical_success_rate: 0.95

  - tool_id: "search_local_files"
    name: "Local File Search"
    description: "Search files on device or network storage"
    category: "search"
    band_required: "AMBER"
    capabilities_required: ["file_access", "indexing"]
    latency_hint_ms: { p50: 100, p95: 300, p99: 800 }
    cost_hint: { model: "per_request", price_cents: 0.0, currency: "USD" }
    timeout_ms: 3000
    max_concurrent_calls: 5
    agent_implementations:
      - agent_id: "file_agent_01"
        specialization_bonus: 0.3
        typical_success_rate: 0.99

  - tool_id: "search_contacts"
