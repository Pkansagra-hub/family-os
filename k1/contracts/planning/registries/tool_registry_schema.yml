---

# SECTION 4: REGISTRY LOOKUP ALGORITHM

lookup_algorithm:
  description: "How expand_stage retrieves tool specs"
  complexity: "O(1) average case (hash map)"
  algorithm: |
    Function tool_registry.get(tool_id: string) -> ToolSpec:
      1. Check in-memory hash map by tool_id
      2. If found, return ToolSpec
      3. If not found in memory, check persistent K0 backup
      4. If found in K0, update in-memory cache and return
      5. If not found anywhere, log WARNING and return null
      6. Null tools trigger validation error in tier 1

  caching:
    strategy: "LRU with 1-hour TTL"
    hit_rate_target: 0.95
    eviction_policy: "Least Recently Used"
    metrics:
      - tool_registry_cache_hits_total
      - tool_registry_cache_misses_total
      - tool_registry_cache_evictions_total

  performance_budgets:
    p50_latency_ms: 0.1
    p95_latency_ms: 1.0
    p99_latency_ms: 5.0

---

# SECTION 5: REGISTRY MAINTENANCE

maintenance:
  update_frequency: "On-demand + daily sync from K0"
  versioning: "Semantic versioning (MAJOR.MINOR.PATCH)"
  deprecation_policy: "30-day grace period before removal"

  operations:
    register_tool: |
      Adds new tool to registry
      Requires: tool_id, schema_in, schema_out, agent_implementations
      Validation: Unique tool_id, valid JSON schemas
      Atomicity: Transactional write to K0 + in-memory update
      Metric: tools_registered_total

    update_tool: |
      Updates existing tool (schema, latency hint, cost)
      Requires: tool_id + changes
      Validation: tool_id must exist, changes must be valid
      Atomicity: Transactional update
      Metric: tools_updated_total

    deprecate_tool: |
      Mark tool as deprecated (30-day grace)
      Existing plans can still use, new plans cannot
      Metric: tools_deprecated_total

    remove_tool: |
      Remove tool after deprecation period
      Metric: tools_removed_total

  metrics:
    - tools_registered_total
    - tools_updated_total
    - tools_deprecated_total
    - tools_removed_total
    - tool_registry_size_count
    - tool_registry_memory_bytes

---

# SECTION 6: METRICS & OBSERVABILITY

observability:
  metrics:
    - name: "tool_registry_lookups_total"
      type: "counter"
      labels: ["tool_id", "status"]
      description: "Total tool registry lookups"

    - name: "tool_registry_lookup_duration_ms"
      type: "histogram"
      buckets: [0.1, 0.5, 1, 5, 10, 50, 100]
      labels: ["tool_id"]
      description: "Tool registry lookup latency"

    - name: "tool_registry_cache_hit_rate"
      type: "gauge"
      labels: []
      description: "Tool registry cache hit rate (target: 0.95)"

    - name: "tool_registry_size_count"
      type: "gauge"
      labels: []
      description: "Current number of tools in registry"

    - name: "tool_registry_memory_bytes"
      type: "gauge"
      labels: []
      description: "Memory used by tool registry"

    - name: "unknown_tools_in_sketches_total"
      type: "counter"
      labels: ["unknown_tool_id"]
      description: "Count of unknown tools encountered during expand"

  alerts:
    - name: "ToolRegistryCacheHitRateLow"
      condition: "tool_registry_cache_hit_rate < 0.80"
      severity: "WARNING"
      message: "Tool registry cache hit rate below 80%"

    - name: "ToolRegistryMemoryHigh"
      condition: "tool_registry_memory_bytes > 100MB"
      severity: "WARNING"
      message: "Tool registry memory usage above 100MB"

    - name: "UnknownToolsDetected"
      condition: "increase(unknown_tools_in_sketches_total[5m]) > 10"
      severity: "WARNING"
      message: "More than 10 unknown tools in sketches (last 5 min)"

---

# SECTION 7: DEPENDENCIES & INTEGRATION POINTS

dependencies:
  incoming:
    - "expand_stage.yml - Needs tool specs to enrich sketch plans"
    - "validation_stage.yml - Uses tool specs for capability validation"

  outgoing:
    - "prompt_registry_schema.yml - Paired with prompt registry for expand stage"
    - "K0 Bridge (contracts/k0_bridge/) - Persistent storage of tool registry"

  related_contracts:
    - "ADR-0007b-expand-stage-tool-prompt-registry-integration.md"
    - "contracts/planning/pipeline/expand_stage.yml"
    - "contracts/planning/pipeline/validation_stage.yml"
    - "contracts/planning/registries/prompt_registry_schema.yml"

---

# SECTION 8: VALIDATION & CONSTRAINTS

validation:
  tool_spec_constraints:
    - "tool_id must be unique globally"
    - "tool_id must match: ^[a-z_][a-z0-9_]*$"
    - "schema_in and schema_out must be valid JSON Schema"
    - "latency_hint_ms must have p50 <= p95 <= p99"
    - "cost_hint.price_cents must be >= 0"
    - "timeout_ms must be > 0"
    - "max_concurrent_calls must be > 0"
    - "At least one agent_implementation must exist"
    - "band_required must be GREEN, AMBER, or RED"

  registry_constraints:
    - "No duplicate tool_ids"
    - "Total tools <= 500 (scalability limit)"
    - "Memory usage <= 200MB (operational limit)"
    - "All tools must pass validation before registration"

---

# SECTION 9: EXAMPLES

examples:
  successful_lookup:
    input: "tool_registry.get('search_web')"
    output:
      tool_id: "search_web"
      name: "Web Search"
      description: "Search the public web for information"
      band_required: "GREEN"
      latency_hint_ms: { p50: 200, p95: 500, p99: 1000 }
      agent_implementations:
        - agent_id: "search_agent_01"
          specialization_bonus: 0.2
    latency_ms: 0.15

  unknown_tool_lookup:
    input: "tool_registry.get('unknown_tool_xyz')"
    output: null
    log_level: "WARNING"
    log_message: "Unknown tool: unknown_tool_xyz"
    impact: "Validation tier 1 will reject plan"

  tool_availability_scenario:
    scenario: "Plan requires 5 tools"
    request_sequence:
      - search_web (found) ✓
      - send_email (found) ✓
      - custom_llm (found) ✓
      - proprietary_tool (not found) ✗
      - api_call (found) ✓
    result: "1 unknown tool → validation rejects plan"
    recommendation: "User must fix plan or tool must be registered"

---

# SECTION 10: FUTURE EXTENSIONS

future_enhancements:
  v2:
    - "Tool composition (tools combining multiple tools)"
    - "Tool versioning (tool_v1, tool_v2)"
    - "Dynamic tool registration from plugins"
    - "Tool performance learning (update latency_hint_ms based on observed data)"
    - "Tool deprecation with migration paths"

  v3:
    - "Tool marketplace (publish/subscribe tools)"
    - "Tool federation across K1 instances"
    - "Tool capability inference from execution history"
