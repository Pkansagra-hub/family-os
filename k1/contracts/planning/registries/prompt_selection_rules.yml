---
# Prompt Selection Rules - Algorithm for Matching Prompts to Plan Steps
# Purpose: Define deterministic rules for selecting appropriate prompt templates
# Source ADR: ADR-0007b (Expand Stage Tool/Prompt Registry Integration)
# Layer: Planning Layer (Layer 3 - Execution & Tools)

contract:
  name: "Prompt Selection Rules"
  version: "1.0.0"
  purpose: "Deterministic algorithm for selecting best prompt templates during expand stage"
  owner: "Planning Layer"
  layer: "Layer 3 - Execution & Tools"
  adr_references:
    - "ADR-0007a: Sketch Stage LLM Prompt Engineering"
    - "ADR-0007b: Expand Stage Tool/Prompt Registry Integration"

  research_citations:
    - "Prompt optimization (Wei et al., 2022)"
    - "Few-shot learning (Brown et al., 2020)"

---

# SECTION 1: OVERVIEW

overview:
  description: "Prompt selection matches each plan step to an appropriate LLM prompt template"
  input: "ExpandedPlanStep with tool_id, domain, description, step_context"
  output: "Best matching PromptTemplate with rendering context and confidence score"
  performance_budget: "<5ms latency (lookup + fuzzy match)"
  failure_mode: "Generic fallback prompt (always available as last resort)"

  matching_strategy: |
    1. PRIMARY: Exact match by tool_id (best, specific template)
    2. SECONDARY: Domain-based search (good, domain-specific)
    3. TERTIARY: Fuzzy description match (acceptable, semantic)
    4. FALLBACK: Generic template (always available)

---

# SECTION 2: PRIMARY MATCHING - EXACT TOOL_ID

exact_match:
  description: "Direct match using tool_id to find corresponding prompt"
  complexity: "O(1)"

  algorithm: |
    Function select_prompt_exact(tool_id: string, registry: PromptRegistry) -> PromptTemplate:
      1. Normalize tool_id: lowercase, underscore-separated
      2. Create prompt_id: tool_id + "_prompt"
      3. Look up in registry.prompts_by_id[prompt_id]
      4. If found: return PromptTemplate with confidence 1.0
      5. If not found: continue to secondary matching

  naming_convention: |
    tool_id → prompt_id
    search_web → search_web_prompt
    send_email → send_email_prompt
    read_file → read_file_prompt
    create_event → create_event_prompt
    charge_payment → charge_payment_prompt

  example:
    input:
      tool_id: "send_email"
      step: "Compose and send an email to manager"
    lookup: "registry.prompts_by_id['send_email_prompt']"
    output:
      prompt_id: "compose_email_prompt"
      confidence: 1.0
      match_type: "EXACT"
    latency_ms: 0.5

---

# SECTION 3: SECONDARY MATCHING - DOMAIN-BASED

domain_matching:
  description: "When exact match fails, find best prompt in matching domain"
  complexity: "O(m) where m = prompts in domain (typically 2-4 prompts per domain)"

  algorithm: |
    Function select_prompt_by_domain(step: PlanStep, registry: PromptRegistry) -> PromptTemplate:
      1. Extract or infer domain from step (e.g., "search", "email", "file_operations")
      2. Get all prompts in registry where prompt.domain == step.domain
      3. Filter by model_class preferences (see model_selection below)
      4. If multiple candidates: pick first or use fuzzy score
      5. Return with confidence 0.7

  domain_categories: |
    search → [web_search_prompt, local_file_search_prompt, contact_search_prompt, kb_search_prompt]
    calendar → [create_event_prompt, find_availability_prompt, meeting_invite_prompt]
    file_operations → [file_read_prompt, file_write_prompt, file_list_prompt]
    email → [compose_email_prompt, email_search_prompt, email_summarize_prompt]
    payment → [payment_validation_prompt, payment_amount_prompt]
    communication → [sms_compose_prompt, notification_compose_prompt]
    data_analysis → [sentiment_analysis_prompt, data_summarize_prompt]
    content_creation → [write_document_prompt, edit_text_prompt]
    coding → [code_generation_prompt]
    ai_reasoning → [complex_reasoning_prompt]
    generic → [generic_tool_call_prompt]

  domain_inference: |
    If step.domain not explicit, infer from step context:
    - "search/find/lookup" keywords → search domain
    - "send/compose/reply" keywords → email or communication
    - "read/write/delete" keywords → file_operations
    - "schedule/meeting/calendar" keywords → calendar
    - "charge/pay/refund" keywords → payment
    - "analyze/summarize/report" keywords → data_analysis
    - Default to generic if uncertain

---

# SECTION 4: TERTIARY MATCHING - FUZZY DESCRIPTION

fuzzy_description_match:
  description: "Semantic similarity matching when exact/domain match not found"
  complexity: "O(n) where n = total prompts (~25 prompts)"

  algorithm: |
    Function select_prompt_fuzzy(step: PlanStep, registry: PromptRegistry) -> PromptTemplate:
      1. Compute similarity(step.description, prompt.description) for all prompts
      2. Find prompt with max_similarity
      3. Compute confidence score based on similarity
      4. If max_confidence >= 0.6: return prompt with confidence
      5. Else: fall back to generic template

  similarity_computation: |
    - Use cosine similarity on cached BERT embeddings
    - step.description_embedding (pre-computed in expand stage)
    - prompt.description_embedding (pre-computed on registration)
    - similarity = dot_product(step_emb, prompt_emb) / (norm(step) * norm(prompt))
    - Range: [0.0, 1.0] where 1.0 = perfect match

  confidence_calculation: |
    base_confidence = similarity_score
    model_compatibility_boost = 0.05 if model_class matches user preferences
    domain_match_boost = 0.1 if domain matches

    final_confidence = base_confidence + model_compatibility_boost + domain_match_boost

    confidence_ranges:
      >= 0.85: HIGH confidence, safe to use
      >= 0.70: MEDIUM confidence, usable but with warnings
      >= 0.50: LOW confidence, likely fallback
      < 0.50: VERY LOW, should use generic

  fallback_logic: |
    if confidence >= 0.7:
      return (prompt, confidence, match_type="FUZZY_GOOD")
    elif confidence >= 0.5:
      log WARNING "Using low-confidence prompt match"
      return (prompt, confidence, match_type="FUZZY_POOR")
    else:
      log INFO "Fuzzy match failed, using generic"
      return generic_prompt

  examples:
    input_1:
      step_description: "Generate an image based on user description"
      registry_candidates:
        - "write_document_prompt: similarity 0.35, confidence 0.35"
        - "generic_tool_call_prompt: similarity 0.50, confidence 0.50"
    output_1: "generic_tool_call_prompt with confidence 0.50 (no image generation template exists)"

    input_2:
      step_description: "Extract company and person names from email"
      registry_candidates:
        - "email_summarize_prompt: similarity 0.65, confidence 0.70"
        - "generic_tool_call_prompt: similarity 0.50, confidence 0.50"
    output_2: "email_summarize_prompt with confidence 0.70"

---

# SECTION 5: FALLBACK - GENERIC TEMPLATE

generic_fallback:
  description: "Always-available generic template as last resort"
  availability: "100% (no conditions)"

  template_id: "generic_tool_call_prompt"

  characteristics: |
    - Works with any tool (no tool-specific knowledge)
    - Works with any LLM model_class
    - Simple system prompt + user request structure
    - Accepts tool_name and tool_description as variables
    - Confidence: 0.0 (absolute fallback, not ideal)

  usage_scenario: |
    Triggered when:
    1. Exact tool_id match not found
    2. Domain matching yields no candidates
    3. Fuzzy matching fails (< 0.5 confidence)
    4. Tool is new/unknown (not in registry)
    5. Any other selection error

  metrics:
    - generic_fallback_usage_total (should be <5% of expand operations)
    - alert if > 10% (indicates missing prompts or tools)

---

# SECTION 6: MODEL CLASS SELECTION

model_class_selection:
  description: "Choose appropriate LLM for prompt based on cost/performance tradeoff"
  where_applied: "After finding candidate prompt, before rendering"

  algorithm: |
    Function select_model_class(prompt: PromptTemplate, context: SelectionContext) -> ModelClass:
      1. Get prompt.model_class (e.g., gpt-4o-mini, gemma-2b-it, generic)
      2. If prompt.model_class != "generic":
         return prompt.model_class (use template's preferred model)
      3. Else (generic template):
         a. Check user_preferences.preferred_model_class
         b. Check session budget remaining
         c. Select: fast (local) vs quality (remote) based on:
            - Intent complexity (from sketch stage)
            - Time budget (deadline vs now)
            - Cost budget (dollars remaining)
         d. Return selected model_class

  model_selection_matrix: |
    Context: search (low complexity, fast-path)
    - Budget: < 100ms, cost < $0.01
    - Selection: gemma-2b-it (local, free)

    Context: email composition (medium complexity)
    - Budget: < 500ms, cost < $0.10
    - Selection: gpt-4o-mini (remote, cheap)

    Context: complex reasoning (high complexity)
    - Budget: < 3000ms, cost < $1.00
    - Selection: gpt-4o or claude-opus (powerful, expensive)

  fallback_on_unavailable_model: |
    If selected model unavailable:
    1. Try alternate within same class (e.g., gpt-4o → gpt-4-turbo)
    2. Try lower-cost tier (e.g., gpt-4o → gpt-4o-mini)
    3. Try local fallback (e.g., any → gemma-2b-it)
    4. Return error if no models available (rare)

---

# SECTION 7: RENDERING CONTEXT PREPARATION

rendering_context:
  description: "Gather required variables for Jinja2 template rendering"

  algorithm: |
    Function prepare_rendering_context(step: PlanStep, prompt: PromptTemplate) -> Dict:
      1. Get required context_variables from prompt
      2. Gather variables from available sources:
         a. step.parameters (from expand stage)
         b. step.context (prior step results)
         c. session.user_context (preferences, history)
         d. step.tool_description (for generic prompts)
      3. Validate all required variables present
      4. Apply defaults for optional_variables
      5. Return rendering_context dict

  variable_sources: |
    step.parameters: Task-specific parameters (e.g., recipient, subject)
    step.context: Results from prior steps (e.g., search results)
    session.user_context: User preferences, history, constraints
    step.tool_spec: Tool schema and documentation
    step.domain: Step domain category
    step_number: Position in plan (1-indexed)
    total_steps: Total steps in plan
    time_budget_ms: Remaining time budget
    cost_budget_cents: Remaining cost budget

  validation: |
    - All required variables present (raise TemplateRenderError if not)
    - Type coercion if needed (str, int, list conversion)
    - PII redaction before passing to LLM (if RED band)
    - Length validation (total tokens < model context window)

---

# SECTION 8: FINAL SELECTION ALGORITHM

final_selection:
  description: "Complete prompt selection workflow"

  algorithm: |
    Function select_prompt(step: PlanStep, context: SelectionContext) -> Selection:
      # Phase 1: Matching
      1. Try exact_match(step.tool_id) → result_exact
      2. If found: confidence = 1.0, match = "EXACT"
      3. Else: Try domain_match(step.domain) → result_domain
      4. If found: confidence = 0.7, match = "DOMAIN"
      5. Else: Try fuzzy_match(step.description) → result_fuzzy
      6. If found: confidence = result_fuzzy.confidence, match = "FUZZY"
      7. Else: Use generic_fallback()
              confidence = 0.0, match = "GENERIC_FALLBACK"

      # Phase 2: Model Selection
      8. model_class = select_model_class(prompt, context)

      # Phase 3: Rendering Context
      9. rendering_context = prepare_rendering_context(step, prompt)

      # Phase 4: Return
      10. Return Selection(prompt, model_class, rendering_context, confidence, match, metadata)

  selection_return_type: |
    class Selection:
      prompt_id: string                   # Prompt ID
      model_class: string                 # Selected LLM (gpt-4o-mini, gemma-2b-it, etc)
      confidence: float                   # Confidence 0.0-1.0
      match_type: string                  # EXACT, DOMAIN, FUZZY, GENERIC_FALLBACK
      rendering_context: Dict[str, any]  # Variables for Jinja2 rendering
      latency_ms: float                   # Selection algorithm latency
      warnings: [string]                  # Any warnings or notes
      recommendation: string | None       # Alternative if selection uncertain

  example_successful:
    step:
      tool_id: "send_email"
      description: "Send email to manager with status update"
    selection:
      prompt_id: "compose_email_prompt"
      model_class: "gpt-4o-mini"
      confidence: 1.0
      match_type: "EXACT"
      rendering_context:
        recipient: "manager@company.com"
        subject: "Status Update"
        purpose: "Share project progress"
        tone: "professional"
      latency_ms: 1.2

  example_domain_match:
    step:
      tool_id: "search_local_files"
      description: "Find all documents from January"
      domain: "search"
    selection:
      prompt_id: "local_file_search_prompt"
      model_class: "gemma-2b-it"
      confidence: 0.7
      match_type: "DOMAIN"
      rendering_context:
        user_request: "Find all documents from January"
        available_folders: "/Documents, /Archive, /Projects"
      latency_ms: 0.8

  example_fuzzy_match:
    step:
      tool_id: null
      description: "Determine if customer feedback is positive or negative"
    selection:
      prompt_id: "sentiment_analysis_prompt"
      model_class: "gpt-4o-mini"
      confidence: 0.75
      match_type: "FUZZY"
      rendering_context:
        text: "Customer feedback..."
      latency_ms: 2.5
      warnings: ["fuzzy_match_used"]

  example_generic_fallback:
    step:
      tool_id: "unknown_custom_tool"
      description: "Do something proprietary"
    selection:
      prompt_id: "generic_tool_call_prompt"
      model_class: "gpt-4o-mini"
      confidence: 0.0
      match_type: "GENERIC_FALLBACK"
      rendering_context:
        user_request: "Do something proprietary"
        tool_name: "unknown_custom_tool"
      latency_ms: 0.5
      warnings: ["tool_not_in_registry", "using_generic_template"]

---

# SECTION 9: PERFORMANCE METRICS

metrics:
  selections:
    - "prompt_selection_attempts_total"
    - "prompt_selection_by_match_type_total (exact, domain, fuzzy, generic)"
    - "prompt_selection_duration_ms (histogram, target less than 5ms)"
    - "prompt_selection_failures_total"

  quality:
    - "prompt_confidence_distribution (histogram 0.0 to 1.0)"
    - "prompt_fuzzy_match_scores (histogram, track quality)"
    - "model_class_distribution (which models selected)"
    - "generic_fallback_usage_rate (target less than 5%)"
    - "rendering_context_preparation_errors_total"

  alerts:
    - "HighGenericFallbackRate greater than 5% of selections"
    - "LowPromptConfidenceAverage average less than 0.8"
    - "PromptSelectionSlowdown p95 greater than 5ms"
    - "RenderingContextErrors greater than 10 per minute"

---

# SECTION 10: DEPENDENCIES

dependencies:
  uses:
    - "prompt_registry_schema.yml"
    - "tool_registry_schema.yml"
    - "BERT embeddings for fuzzy matching"

  used_by:
    - "expand_stage.yml"
    - "validation_stage.yml"
    - "sketch_stage.yml"

---

# SECTION 11: INTEGRATION WITH EXPAND STAGE

expand_stage_integration:
  description: "How expand stage calls prompt selection"

  workflow: |
    For each step in sketch plan:
      1. lookup_tool(step.tool_id) → ToolSpec
      2. expand_step_with_tool_metadata(step, tool_spec)
      3. select_prompt(step) → PromptTemplate
      4. prepare_rendering_context(step)
      5. Store prompt_id, model_class, rendering_context in expanded step
      6. Later: validation_stage validates
      7. Later: commit_stage persists
      8. Later: orchestrator.execute() calls LLM with rendered prompt

  performance_impact:
    prompt_selection_latency: <5ms per step (usually <2ms)
    total_expand_latency_target: <50ms for 10-step plan

---

# SECTION 12: FUTURE ENHANCEMENTS

future:
  v2:
    - "Dynamic prompt generation from few-shot examples"
    - "Prompt caching (re-use same prompt for similar steps)"
    - "A/B testing different prompts"
    - "Prompt versioning and rollback"
    - "Learning from LLM output quality"

  v3:
    - "Learned prompt rankings (what works best)"
    - "Cross-domain prompt transfer"
    - "Automatic prompt optimization"
    - "Prompt marketplace"
