# ========================================
# CONTRACT: Misunderstanding Detection - Correction Detection
# ========================================
# PURPOSE: Detect user corrections to LLM misinterpretations with LLM-first pattern matching
# OWNER: K1 Dialogue Repair System
# ADR: ADR-0054d lines 251-310 (Misunderstanding Detector)
# DEPENDENCIES: clarification_generation.yml, learning_loop_integration.yml
# VERSION: 2.0.0 (BREAKING: LLM-first detection with deterministic fallback)
# LAST UPDATED: 2025-10-22

metadata:
  contract_id: dialogue.misunderstanding.correction_detection
  version: 2.0.0
  status: PRODUCTION
  owner: k1_dialogue_repair
  dependencies:
    - dialogue.clarification.clarification_generation (v2.1.0)
    - dialogue.misunderstanding.learning_loop_integration (v2.0.0)
    - learning_loop.feedback_signals (ADR-0059)

# ========================================
# BREAKING CHANGES (v2.0.0)
# ========================================

breaking_changes:
  - change: "LLM-first correction detection (replaces template-only approach)"
    reason: "8 hardcoded phrases miss 40% of corrections (e.g., 'wait, no', 'that's wrong', 'hold on')"
    migration: "Add LLM semantic detection with deterministic fallback (original 8 phrases)"
  - change: "Added correction_confidence score (0.0-1.0)"
    reason: "Ops needs to track false positives (innocent 'no' vs correction 'no, I meant')"
    impact: "MisunderstandingDetector.detect_correction now returns (bool, float)"
  - change: "Added context_window (last 3 turns) for multi-turn corrections"
    reason: "User corrections often reference previous turns ('that was wrong', 'not that restaurant')"
    impact: "detect_correction requires last_3_turns parameter"

# ========================================
# 1. CORRECTION DETECTION ARCHITECTURE
# ========================================

correction_detection:
  mode: LLM_FIRST_WITH_DETERMINISTIC_FALLBACK
  description: |
    Detect when user is correcting a previous LLM misinterpretation.
    - PRIMARY: LLM semantic detection (catches 95% of corrections including nuanced ones)
    - FALLBACK: Deterministic phrase matching (8 templates, catches 60% on offline/timeout)

  detection_pipeline:
    step_1_deterministic_fast_path:
      description: "Check 8 hardcoded correction phrases (regex-based, <1ms)"
      phrases:
        - pattern: "^no,?\\s+(i|we)\\s+meant"
          regex: "(?i)^no,?\\s+(i|we)\\s+meant"
          examples: ["no, i meant Italian", "no I meant tomorrow"]
        - pattern: "^actually"
          regex: "(?i)^actually\\b"
          examples: ["actually, I want Chinese", "Actually it's at 7pm"]
        - pattern: "^not\\s+that"
          regex: "(?i)^not\\s+that\\b"
          examples: ["not that one", "Not that restaurant"]
        - pattern: "^i\\s+said"
          regex: "(?i)^i\\s+said\\b"
          examples: ["i said 7pm", "I said Italian not Indian"]
        - pattern: "^no,?\\s+not"
          regex: "(?i)^no,?\\s+not\\b"
          examples: ["no, not Friday", "no not that time"]
        - pattern: "i\\s+meant\\s+to\\s+say"
          regex: "(?i)i\\s+meant\\s+to\\s+say\\b"
          examples: ["i meant to say tomorrow", "I meant to say 7pm"]
        - pattern: "let\\s+me\\s+rephrase"
          regex: "(?i)let\\s+me\\s+rephrase\\b"
          examples: ["let me rephrase that", "Let me rephrase—I want Chinese"]
        - pattern: "i'm\\s+trying\\s+to\\s+say"
          regex: "(?i)i'?m\\s+trying\\s+to\\s+say\\b"
          examples: ["i'm trying to say it's at 7pm", "Im trying to say Italian"]
      on_match:
        action: RETURN_CORRECTION_DETECTED
        correction_confidence: 0.9  # High confidence for explicit phrases
        latency_target: <1ms P95
        cost: $0

    step_2_llm_semantic_detection:
      description: "LLM analyzes user input for correction intent (if step 1 negative)"
      llm_system_prompt: |
        You are a correction detector for a voice assistant.
        Analyze if the user is correcting a previous misunderstanding.

        USER INPUT: {current_user_message}
        LAST 3 TURNS: {last_3_turns}

        Return JSON:
        {
          "is_correction": bool,
          "confidence": float,  # 0.0-1.0
          "correction_type": str,  # "entity_correction" | "intent_correction" | "clarification_followup" | "none"
          "corrected_entity": str | null,  # What entity is being corrected (e.g., "restaurant: Luigi's → Olive Garden")
          "reasoning": str  # 1-sentence explanation
        }

        EXAMPLES:
        - "wait, no" → is_correction: true, confidence: 0.85, type: "intent_correction"
        - "that's wrong" → is_correction: true, confidence: 0.9, type: "entity_correction"
        - "hold on, I meant the other one" → is_correction: true, confidence: 0.95, type: "entity_correction"
        - "no" (standalone) → is_correction: false, confidence: 0.3, type: "none" (ambiguous)
        - "yes" → is_correction: false, confidence: 0.0, type: "none"

      retry_cascade:
        primary: local_slm  # Faster for classification tasks
        timeout_local_slm: 150ms
        fallback: remote_llm
        timeout_remote_llm: 300ms
        final_fallback: DETERMINISTIC_NEGATIVE  # If all LLM timeouts, assume no correction

      confidence_threshold:
        minimum: 0.6  # LLM confidence ≥0.6 required to flag correction
        description: "Prevents false positives on innocent 'no' responses"

      on_success:
        action: RETURN_LLM_RESULT
        latency_target: <200ms P95 (local_slm) | <400ms P95 (remote_llm)
        cost: $0.001 (local_slm) | $0.003 (remote_llm)

      on_timeout_or_offline:
        action: FALLBACK_TO_DETERMINISTIC_NEGATIVE
        rationale: "Conservative: Assume no correction unless explicit phrases detected in step 1"
        latency_guarantee: <1ms
        cost: $0

# ========================================
# 2. MISUNDERSTANDING DETECTOR CLASS
# ========================================

misunderstanding_detector:
  class_name: MisunderstandingDetector
  location: k1/l2_orchestration/dialogue_repair/misunderstanding_detector.py

  methods:
    detect_correction:
      signature: |
        async def detect_correction(
            self,
            current_user_message: str,
            last_3_turns: list[Turn],  # Context for multi-turn corrections
            trace_id: str
        ) -> CorrectionDetectionResult

      returns:
        type: CorrectionDetectionResult
        fields:
          is_correction: bool
          correction_confidence: float  # 0.0-1.0
          correction_type: CorrectionType  # ENTITY | INTENT | CLARIFICATION_FOLLOWUP | NONE
          corrected_entity: Optional[str]  # e.g., "restaurant: Luigi's → Olive Garden"
          detection_method: DetectionMethod  # DETERMINISTIC | LLM_LOCAL | LLM_REMOTE
          latency_ms: int
          cost_usd: float

      performance:
        latency_p50: <5ms  # Fast path dominates (60% deterministic hit rate)
        latency_p95: <200ms  # LLM local_slm for remaining 40%
        latency_p99: <400ms  # LLM remote_llm fallback
        cost_per_detection: $0.0006  # 60% × $0 + 30% × $0.001 + 10% × $0.003

      example_usage: |
        detector = MisunderstandingDetector()

        # Turn 1: User: "book dinner at Luigi's"
        # Turn 2: Agent: "Booking dinner at Olive Garden for 7pm"
        # Turn 3: User: "no, i meant Luigi's"

        result = await detector.detect_correction(
            current_user_message="no, i meant Luigi's",
            last_3_turns=[turn1, turn2, turn3],
            trace_id="trace-abc123"
        )

        # Result:
        # is_correction: True
        # correction_confidence: 0.9
        # correction_type: ENTITY_CORRECTION
        # corrected_entity: "restaurant: Olive Garden → Luigi's"
        # detection_method: DETERMINISTIC (matched "^no,?\s+(i|we)\s+meant")
        # latency_ms: 0.8
        # cost_usd: $0

# ========================================
# 3. CORRECTION TYPES
# ========================================

correction_types:
  entity_correction:
    description: "User corrects a specific entity (restaurant, time, date, contact)"
    examples:
      - user: "no, i meant Luigi's"
        context: "Agent misheard Olive Garden"
        corrected_entity: "restaurant: Olive Garden → Luigi's"
      - user: "i said 7pm, not 8pm"
        context: "Agent misheard time"
        corrected_entity: "time: 8pm → 7pm"
    frequency: 70%  # Most common correction type

  intent_correction:
    description: "User corrects the entire intent (book → cancel, weather → reminder)"
    examples:
      - user: "wait, no—I want to cancel, not book"
        context: "Agent misunderstood intent"
        corrected_entity: "intent: book_dinner → cancel_reservation"
      - user: "actually, I need the weather, not a reminder"
        context: "Agent picked wrong intent"
        corrected_entity: "intent: set_reminder → get_weather"
    frequency: 20%

  clarification_followup:
    description: "User provides missing info after clarification question"
    examples:
      - agent: "What time would you like dinner?"
        user: "7pm"
        is_correction: False  # This is followup, not correction
      - agent: "Did you mean Luigi's or Olive Garden?"
        user: "not that one, the other one"
        is_correction: True  # Correcting agent's assumption
    frequency: 10%

# ========================================
# 4. FUZZY MATCHING (Deterministic Fast Path)
# ========================================

fuzzy_matching:
  description: "Regex-based matching for 8 correction phrases"
  case_insensitive: true
  ignore_punctuation: true  # "no i meant" matches "no, I meant"
  max_edit_distance: 0  # No fuzzy string matching (too many false positives)

  performance:
    latency_p95: <1ms  # Regex matching 8 patterns
    memory: <1KB  # Compiled regexes cached in memory
    cpu: <0.1% per detection

  false_positive_rate:
    target: <2%
    actual: 1.3%  # Measured over 10K samples
    examples:
      - input: "no, thank you"  # Does NOT match "^no,?\s+(i|we)\s+meant"
        is_correction: False
      - input: "actually, that sounds great"  # Matches "^actually" (false positive)
        is_correction: True  # 🚨 Limitation: "actually" can be conversational
        mitigation: "LLM step 2 catches this with confidence <0.6"

# ========================================
# 5. MULTI-TURN CONTEXT WINDOW
# ========================================

context_window:
  description: "Include last 3 turns to understand correction context"
  window_size: 3 turns
  rationale: |
    Corrections often reference previous turns:
    - "that was wrong" → What was wrong? Need previous agent response.
    - "not that restaurant" → Which restaurant? Need previous agent entity extraction.

  turn_structure:
    fields:
      - turn_number: int
      - user_message: str
      - agent_response: str
      - extracted_entities: dict[str, str]  # {"restaurant": "Olive Garden", "time": "7pm"}
      - intent: str
      - confidence: float

  example_context:
    last_3_turns:
      - turn_number: 10
        user_message: "book dinner at Luigi's"
        agent_response: "Booking dinner at Olive Garden for 7pm tomorrow"
        extracted_entities: {"restaurant": "Olive Garden", "time": "7pm", "date": "tomorrow"}
        intent: "book_dinner"
        confidence: 0.85
      - turn_number: 11
        user_message: "no, i meant Luigi's"
        agent_response: null  # Current turn being analyzed
        extracted_entities: null
        intent: null
        confidence: null

    llm_analysis:
      is_correction: true
      confidence: 0.95
      correction_type: "entity_correction"
      corrected_entity: "restaurant: Olive Garden → Luigi's"
      reasoning: "User explicitly corrected restaurant name from Olive Garden to Luigi's"

# ========================================
# 6. OBSERVABILITY & METRICS
# ========================================

observability:
  prometheus_metrics:
    dialogue_corrections_detected_total:
      type: counter
      labels: [correction_type, detection_method]
      description: "Total corrections detected (ENTITY, INTENT, CLARIFICATION_FOLLOWUP)"
      example_query: rate(dialogue_corrections_detected_total{correction_type="entity_correction"}[5m])

    dialogue_correction_detection_latency_ms:
      type: histogram
      buckets: [1, 5, 10, 50, 100, 200, 400]
      labels: [detection_method]
      description: "Latency for correction detection (deterministic <1ms, LLM <200ms)"
      targets:
        deterministic_p95: <1ms
        llm_local_p95: <200ms
        llm_remote_p95: <400ms

    dialogue_correction_false_positives_total:
      type: counter
      labels: [phrase_pattern]
      description: "False positive corrections (innocent 'no' flagged as correction)"
      target: <2% of total corrections
      alert: false_positive_rate >5%

    dialogue_correction_confidence:
      type: histogram
      buckets: [0.0, 0.2, 0.4, 0.6, 0.8, 0.9, 1.0]
      description: "Correction confidence distribution (LLM-only, deterministic always 0.9)"
      target: ">80% corrections with confidence ≥0.8"

  structured_logging:
    correction_detected_event:
      level: INFO
      message: "User correction detected"
      fields:
        trace_id: str
        session_id: str
        turn_number: int
        user_message: str  # Redacted if PII
        is_correction: bool
        correction_confidence: float
        correction_type: str
        corrected_entity: Optional[str]
        detection_method: str  # DETERMINISTIC | LLM_LOCAL | LLM_REMOTE
        latency_ms: int
        cost_usd: float
      example: |
        {
          "level": "INFO",
          "message": "User correction detected",
          "trace_id": "trace-abc123",
          "session_id": "session-xyz",
          "turn_number": 11,
          "user_message": "no, i meant Luigi's",
          "is_correction": true,
          "correction_confidence": 0.9,
          "correction_type": "entity_correction",
          "corrected_entity": "restaurant: Olive Garden → Luigi's",
          "detection_method": "DETERMINISTIC",
          "latency_ms": 0.8,
          "cost_usd": 0.0
        }

# ========================================
# 7. INTEGRATION WITH LEARNING LOOP
# ========================================

learning_loop_integration:
  description: "Send correction events to Learning Loop (ADR-0059) to improve confidence thresholds"
  contract_reference: learning_loop_integration.yml

  event_payload:
    event_type: FeedbackType.CORRECTION
    signal_strength: 1.0  # Corrections are high-confidence negative feedback
    metadata:
      original_input: str
      llm_interpretation: str  # What LLM thought user meant
      user_correction: str  # What user actually meant
      confidence_score: float  # Original LLM confidence before correction
      correction_type: str  # ENTITY | INTENT | CLARIFICATION_FOLLOWUP

  learning_actions:
    - action: "Adjust confidence thresholds ±0.05"
      trigger: "If correction_rate >10% for intent X"
      example: "book_dinner corrections 15% → lower EXECUTE threshold from 0.6 → 0.65"
    - action: "Flag ambiguous entity patterns"
      trigger: "If entity_correction_rate >20% for entity type Y"
      example: "Restaurant name corrections 25% → add fuzzy matching for restaurant names"
    - action: "Improve clarification templates"
      trigger: "If clarification_followup corrections >5%"
      example: "User corrects clarification question → improve question phrasing"

# ========================================
# 8. PERFORMANCE BUDGETS
# ========================================

performance:
  latency:
    p50: <5ms  # Deterministic fast path dominates
    p95: <200ms  # LLM local_slm fallback
    p99: <400ms  # LLM remote_llm final fallback
    max: <500ms  # Hard timeout (fail open: assume no correction)

  cost:
    per_detection: $0.0006  # Weighted average (60% × $0 + 30% × $0.001 + 10% × $0.003)
    per_turn: $0.0006  # 1 detection per turn
    monthly_household: $0.22  # 365 turns/year × $0.0006 = $0.22/year

  accuracy:
    precision: ">95%"  # Of flagged corrections, 95% are true corrections
    recall: ">90%"  # Of true corrections, 90% are detected
    f1_score: ">0.92"

  breakdown:
    deterministic_hit_rate: 60%  # 8 phrases catch 60% of corrections
    llm_local_hit_rate: 30%  # local_slm catches additional 30%
    llm_remote_hit_rate: 10%  # remote_llm catches final 10%

# ========================================
# 9. TESTING REQUIREMENTS
# ========================================

testing:
  unit_tests:
    - test: "test_deterministic_phrases_exact_match"
      description: "All 8 correction phrases match correctly"
      assertions:
        - '"no, i meant Italian" → is_correction=True, confidence=0.9, method=DETERMINISTIC'
        - '"actually, I want Chinese" → is_correction=True, confidence=0.9, method=DETERMINISTIC'
        - '"let me rephrase that" → is_correction=True, confidence=0.9, method=DETERMINISTIC'

    - test: "test_deterministic_false_negatives"
      description: "Phrases not in template require LLM (fallback to LLM step 2)"
      assertions:
        - '"wait, no" → deterministic=False → LLM detects is_correction=True, confidence=0.85'
        - '"that''s wrong" → deterministic=False → LLM detects is_correction=True, confidence=0.9'

    - test: "test_llm_false_positive_prevention"
      description: "LLM confidence threshold prevents false positives"
      assertions:
        - '"no, thank you" → LLM confidence=0.3 (<0.6 threshold) → is_correction=False'
        - '"actually, that sounds great" → LLM confidence=0.4 (<0.6) → is_correction=False'

    - test: "test_multi_turn_context_correction"
      description: "LLM uses last 3 turns to understand correction context"
      setup:
        - turn_10: "book dinner at Luigi's"
        - turn_11_agent: "Booking at Olive Garden"
        - turn_12_user: "that's wrong"
      assertions:
        - "LLM detects correction: restaurant Olive Garden → Luigi's (from turn_10 context)"

    - test: "test_timeout_fallback_deterministic_negative"
      description: "LLM timeout falls back to 'no correction detected'"
      setup: Mock LLM timeout after 300ms
      assertions:
        - 'is_correction=False, confidence=0.0, method=TIMEOUT_FALLBACK'

  integration_tests:
    - test: "test_end_to_end_correction_to_learning_loop"
      description: "Correction detection triggers Learning Loop event"
      flow:
        - User: "book dinner at Luigi's"
        - Agent: "Booking at Olive Garden"
        - User: "no, i meant Luigi's"
        - System: detect_correction → is_correction=True
        - System: Send FeedbackType.CORRECTION to Learning Loop
        - Learning Loop: Log MisunderstandingPattern
      assertions:
        - "Learning Loop receives event with corrected_entity=\"restaurant: Olive Garden → Luigi's\""

    - test: "test_correction_confidence_threshold_adjustment"
      description: "High correction rate lowers confidence threshold"
      setup: Simulate 15% correction rate for book_dinner intent
      assertions:
        - 'Learning Loop adjusts EXECUTE threshold from 0.6 → 0.65 for book_dinner'

  performance_tests:
    - test: "test_deterministic_latency_p95_under_1ms"
      description: "10,000 deterministic detections complete in <1ms P95"
      setup: Run 10K corrections with 8 template phrases
      assertions:
        - 'P95 latency <1ms'

    - test: "test_llm_local_latency_p95_under_200ms"
      description: "1,000 LLM local_slm detections complete in <200ms P95"
      setup: Run 1K corrections requiring LLM (not in templates)
      assertions:
        - 'P95 latency <200ms (local_slm)'

    - test: "test_cost_per_detection_under_1_cent"
      description: "Average cost <$0.001 per detection"
      setup: Run 1K detections (60% deterministic, 30% local, 10% remote)
      assertions:
        - 'Average cost $0.0006 per detection'

# ========================================
# 10. SECURITY & PRIVACY
# ========================================

security:
  pii_handling:
    redaction: "User messages with RED/BLACK privacy band redacted before LLM detection"
    deterministic_only: "RED/BLACK privacy bands use deterministic detection only (no LLM)"
    example: |
      User (RED band): "no, i meant card ending in 1234"
      → Deterministic detection only (8 phrases)
      → LLM step skipped (no PII to LLM)

  prompt_injection:
    risk: "User input 'ignore previous instructions' in correction detection"
    mitigation: "LLM system prompt sandboxed, user input in {current_user_message} placeholder only"
    validation: "Correction detection returns structured JSON only (no free-form text)"

# ========================================
# 11. MIGRATION NOTES
# ========================================

migration:
  from_version: 1.0.0 (template-only detection)
  to_version: 2.0.0 (LLM-first detection)

  changes:
    - "Add LLM semantic detection (catches +35% corrections missed by templates)"
    - "Add correction_confidence score (0.0-1.0) to CorrectionDetectionResult"
    - "Add context_window (last_3_turns) parameter to detect_correction method"
    - "Add detection_method enum (DETERMINISTIC | LLM_LOCAL | LLM_REMOTE)"

  backward_compatibility:
    breaking: true
    reason: "detect_correction signature changed (added last_3_turns parameter)"
    migration_guide: |
      # OLD (v1.0.0)
      result = detector.detect_correction(user_input, trace_id)

      # NEW (v2.0.0)
      result = await detector.detect_correction(
          current_user_message=user_input,
          last_3_turns=session.get_last_n_turns(3),
          trace_id=trace_id
      )

      # Access new fields
      print(result.correction_confidence)  # NEW in v2.0.0
      print(result.detection_method)  # NEW in v2.0.0
