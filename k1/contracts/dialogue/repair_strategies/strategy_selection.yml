# Contract: Repair Strategy Selection (LLM-First)
# Purpose: Select optimal clarification strategy based on IntentAnalysis
# ADR: ADR-0054d (Dialogue Repair & Clarification Pipeline) lines 176-250
# Layer: L3 Execution (Dialogue)
# Owner: ClarificationManager
# Architecture: LLM_FIRST_WITH_DETERMINISTIC_FALLBACK (deprecated template-based approach)

metadata:
  contract_id: dialogue.repair_strategies.strategy_selection
  version: 2.0.0  # BREAKING: Deleted template-based selection, replaced with LLM scenario selection
  status: proposed
  created: 2025-10-22
  updated: 2025-10-22
  adrs:
    - ADR-0054d  # Dialogue Repair & Clarification Pipeline
  dependencies:
    - dialogue.clarification.clarification_decision  # ClarificationDecision with backend selection
    - dialogue.clarification.confidence_thresholds  # Confidence threshold rules
    - dialogue.clarification.clarification_generation  # LLM scenario prompts (REPHRASE, SIMPLIFY, etc.)
  layer: l3_execution
  module: dialogue

  breaking_changes:
    version_2_0_0:
      date: 2025-10-22
      changes:
        - "DELETED: Template-based strategy selection (5 strategies × 22 templates = rigid approach)"
        - "REPLACED: LLM scenario selection (5 system prompts, infinite variety)"
        - "DELETED: RepairStrategies.select() method returning Strategy enum"
        - "ADDED: Scenario selection logic integrated into clarification_generation.yml"
        - "Architecture: LLM_FIRST_WITH_DETERMINISTIC_FALLBACK (never stalls)"
      rationale: |
        Following OpenAI/Claude approach:
        - Templates sound robotic (same 22 phrases heard 1,460× over 20 years)
        - LLM generates contextual natural questions (infinite variety)
        - Strategy selection now embedded in LLM prompt selection
        - Cost negligible ($0.005/clarification = $1.83/year)
        - Prioritize user experience over template efficiency

# =============================================================================
# 1. STRATEGY SELECTION DECISION TREE (LLM SCENARIO MAPPING)
# =============================================================================

strategy_selection:
  description: |
    **ARCHITECTURE CHANGE:** Strategy selection is now **LLM scenario selection**.
    Maps IntentAnalysis conditions to LLM system prompts (see clarification_generation.yml).

    DEPRECATED APPROACH (template-based):
    - RepairStrategies.select(IntentAnalysis) → Strategy enum (REPHRASE, SIMPLIFY, OFFER_OPTIONS, etc.)
    - Strategy enum → select template from 22-template library
    - Template rendering with variable substitution

    NEW APPROACH (LLM scenario-based):
    - IntentAnalysis → select LLM scenario (scenario_1_rephrase, scenario_2_missing_entity, etc.)
    - LLM scenario → system prompt + user prompt template
    - LLM generates natural clarification (no templates)

  decision_tree:
    description: |
      Priority-ordered decision tree for LLM scenario selection.
      Evaluated in order - early exit on first match.

    scenario_1_rephrase:
      condition: "confidence < 0.4"
      description: "Very low confidence - request full rephrase"
      llm_scenario: scenario_1_rephrase
      rationale: "Confidence too low for partial understanding - need full rephrase"
      example:
        user_input: "Book uh... thing... tomorrow"
        intent: unknown
        confidence: 0.32
        selected_scenario: scenario_1_rephrase
        llm_generated: "I didn't quite catch that. Could you rephrase what you're looking for?"

    scenario_2_missing_entity:
      condition: "confidence >= 0.6 AND len(missing_entities) > 0"
      description: "High confidence but missing required information"
      llm_scenario: scenario_2_missing_entity
      rationale: "Know what user wants, just need specific details"
      example:
        user_input: "Book dinner tomorrow"
        intent: book_dinner
        confidence: 0.87
        missing_entities: ["time", "location"]
        selected_scenario: scenario_2_missing_entity
        llm_generated: "I'd be happy to book dinner tomorrow! What time works for you, and do you have a restaurant in mind?"

    scenario_3_ambiguous_entity:
      condition: "len(ambiguous_entities) > 0"
      description: "Multiple plausible interpretations - offer grounded options"
      llm_scenario: scenario_3_ambiguous_entity
      grounding_required: true  # PRODUCTION: candidate_options from memory/tools
      rationale: "Disambiguate with grounded options (prevents hallucination)"
      example:
        user_input: "Book dinner at that Italian place"
        intent: book_dinner
        confidence: 0.82
        ambiguous_entity: location
        candidate_options: ["Luigi's (12 visits)", "Olive Garden (8 visits)", "Carrabba's (3 visits)"]
        selected_scenario: scenario_3_ambiguous_entity
        llm_generated: "I found a few Italian restaurants you've visited recently. Did you mean Luigi's, Olive Garden, or Carrabba's?"
        grounded: true

    scenario_4_context_recovery:
      condition: "multi_turn_context_lost OR topic_ambiguous"
      description: "Multi-turn context loss - confirm conversation topic"
      llm_scenario: scenario_4_context_recovery
      rationale: "Recover lost conversation thread across turns"
      example:
        last_topic: "weather in Seattle"
        user_input: "What about Tuesday?"
        intent: weather_query
        confidence: 0.65
        selected_scenario: scenario_4_context_recovery
        llm_generated: "Are we still talking about weather in Seattle? Tuesday will be 68°F and rainy."

    scenario_5_simplify:
      condition: "0.4 <= confidence < 0.6 AND (len(missing_entities) > 0 OR entities_partial)"
      description: "Moderate confidence - ask about specific missing parts"
      llm_scenario: scenario_5_simplify
      rationale: "Partially understood - acknowledge what we got, ask for missing parts"
      example:
        user_input: "Book dinner tomorrow"
        intent: book_dinner
        confidence: 0.52
        understood: "dinner tomorrow"
        missing: ["time", "location"]
        selected_scenario: scenario_5_simplify
        llm_generated: "I can help book dinner tomorrow. What time would you like to go, and which restaurant?"

# =============================================================================
# 2. SCENARIO SELECTION LOGIC (PSEUDOCODE)
# =============================================================================

scenario_selection_logic:
  description: |
    Embedded in clarification_generation.yml step_1_select_scenario.
    This contract documents the decision tree for reference.

  pseudocode: |
    def select_scenario(analysis: IntentAnalysis) -> LLMScenario:
        """Select appropriate LLM scenario based on IntentAnalysis"""

        # SCENARIO 1: Very low confidence (<0.4) → REPHRASE
        if analysis.confidence < 0.4:
            return LLMScenario.REPHRASE

        # SCENARIO 2: High confidence (≥0.6) + missing entities → MISSING_ENTITY
        elif analysis.confidence >= 0.6 and len(analysis.missing_entities) > 0:
            return LLMScenario.MISSING_ENTITY

        # SCENARIO 3: Ambiguous entities (multiple interpretations) → AMBIGUOUS_ENTITY
        elif len(analysis.ambiguous_entities) > 0:
            return LLMScenario.AMBIGUOUS_ENTITY

        # SCENARIO 4: Multi-turn context loss → CONTEXT_RECOVERY
        elif analysis.multi_turn_context_lost or analysis.topic_ambiguous:
            return LLMScenario.CONTEXT_RECOVERY

        # SCENARIO 5: Moderate confidence (0.4-0.6) + missing/partial → SIMPLIFY
        elif 0.4 <= analysis.confidence < 0.6:
            return LLMScenario.SIMPLIFY

        # FALLBACK: Should not reach here (clarification_decision filters before this)
        else:
            return LLMScenario.MISSING_ENTITY  # Safe default

  latency: "<5ms P95"
  implementation: "clarification_generation.yml step_1_select_scenario"

# =============================================================================
# 3. MIGRATION FROM TEMPLATE-BASED APPROACH
# =============================================================================

migration_guide:
  deprecated_components:
    - component: "RepairStrategies.select(IntentAnalysis) → Strategy enum"
      rationale: "Replaced by LLM scenario selection (embedded in clarification_generation.yml)"
      migration: "Use clarification_generation.generate_clarification() directly"

    - component: "Strategy enum (REPHRASE, SIMPLIFY, OFFER_OPTIONS, CONTEXT_RECOVERY, MISSING_ENTITY)"
      rationale: "Replaced by LLMScenario enum (scenario_1_rephrase, scenario_2_missing_entity, etc.)"
      migration: "Map old Strategy → LLMScenario 1:1"

    - component: "22-template library (rephrase_strategy.yml, simplify_strategy.yml, etc.)"
      rationale: "Robotic - user hears same phrases 1,460× over 20 years"
      migration: "Delete template files - LLM generates natural questions"

    - component: "Template rendering engine (variable substitution)"
      rationale: "Replaced by LLM generation API call"
      migration: "Use LLM system prompt + user prompt template"

  new_components:
    - component: "LLM scenario selection (integrated into clarification_generation.yml)"
      purpose: "Select LLM system prompt based on IntentAnalysis"
      location: "clarification_generation.yml step_1_select_scenario"

    - component: "5 LLM system prompts (1 per scenario)"
      purpose: "Guide LLM clarification generation"
      location: "clarification_generation.yml llm_clarification_scenarios"

    - component: "Grounding enforcement (scenario_3_ambiguous_entity)"
      purpose: "Prevent hallucinated restaurant/contact names"
      location: "clarification_generation.yml scenario_3_ambiguous_entity"

  comparison:
    template_approach:
      components: "RepairStrategies.select() → Strategy enum → 22 templates"
      latency: "<5ms selection + <10ms rendering = <15ms total"
      cost: "$0"
      quality: "Robotic (22 fixed phrases, heard 1,460× over 20 years)"

    llm_approach:
      components: "select_scenario() → LLM system prompt → LLM generation"
      latency: "<5ms selection + <500ms LLM generation = <505ms total"
      cost: "$0.005 per clarification ($1.83/year typical)"
      quality: "Natural (infinite variety, contextual phrasing)"

    recommendation: "Use LLM approach (prioritize user experience over latency)"

# =============================================================================
# 4. PERFORMANCE BUDGET
# =============================================================================

performance:
  scenario_selection_latency:
    target: "<5ms P95"
    breakdown:
      confidence_check: "<1ms"
      missing_entities_check: "<1ms"
      ambiguous_entities_check: "<1ms"
      multi_turn_context_check: "<1ms"
      logging: "<1ms"
      total: "<5ms P95"

  end_to_end_clarification:
    target: "<500ms P95"
    breakdown:
      scenario_selection: "5ms"  # This contract
      llm_prompt_building: "10ms"
      llm_generation: "480ms"  # Dominant cost (clarification_generation.yml)
      validation: "5ms"
      event_publishing: "5ms"
      total: "505ms"

  memory_footprint:
    scenario_selection_logic: "1KB"  # Decision tree code
    llm_scenarios_metadata: "2KB"  # 5 scenario configs
    total: "<5KB"

# =============================================================================
# 5. OBSERVABILITY
# =============================================================================

observability:
  prometheus_metrics:
    dialogue_scenario_selections_total:
      type: Counter
      labels: [scenario, intent]
      description: "Total scenario selections (tracks which scenarios are most common)"
      example_labels:
        scenario: [scenario_1_rephrase, scenario_2_missing_entity, scenario_3_ambiguous_entity, scenario_4_context_recovery, scenario_5_simplify]
        intent: [book_dinner, set_timer, schedule_meeting, weather_query]

    dialogue_scenario_selection_latency_ms:
      type: Histogram
      description: "Scenario selection latency (ms)"
      buckets: [1, 2, 5, 10, 20]
      target: "<5ms P95"

  structured_logging:
    events:
      - event: scenario_selected
        level: INFO
        fields: [intent, confidence, scenario, missing_entities, ambiguous_entities, trace_id]

# =============================================================================
# 6. DEPENDENCIES
# =============================================================================

dependencies:
  upstream:
    - contract: dialogue.clarification.clarification_decision
      provides: ClarificationDecision
      required_fields: [should_clarify, backend, trigger]

    - contract: dialogue.clarification.confidence_thresholds
      provides: Confidence threshold values
      required_fields: [execute_threshold, clarify_lower, clarify_upper]

  downstream:
    - contract: dialogue.clarification.clarification_generation
      consumes: Scenario selection result
      action: Generates natural clarification via LLM (scenario_1_rephrase, scenario_2_missing_entity, etc.)

# =============================================================================
# 7. TESTING REQUIREMENTS
# =============================================================================

testing:
  unit_tests:
    - test: test_scenario_1_rephrase_very_low_confidence
      input:
        confidence: 0.32
      expected_scenario: scenario_1_rephrase
      reasoning: "Confidence <0.4 → REPHRASE"

    - test: test_scenario_2_missing_entity_high_confidence
      input:
        confidence: 0.87
        missing_entities: ["time", "location"]
      expected_scenario: scenario_2_missing_entity
      reasoning: "Confidence ≥0.6 + missing entities → MISSING_ENTITY"

    - test: test_scenario_3_ambiguous_entity
      input:
        ambiguous_entities: [{entity: "location", options: ["Luigi's", "Olive Garden"]}]
      expected_scenario: scenario_3_ambiguous_entity
      reasoning: "Ambiguous entities → AMBIGUOUS_ENTITY with grounding"

    - test: test_scenario_4_context_recovery_multi_turn
      input:
        multi_turn_context_lost: true
        last_topic: "weather in Seattle"
      expected_scenario: scenario_4_context_recovery
      reasoning: "Context loss → CONTEXT_RECOVERY"

    - test: test_scenario_5_simplify_moderate_confidence
      input:
        confidence: 0.52
        missing_entities: ["time"]
      expected_scenario: scenario_5_simplify
      reasoning: "Moderate confidence (0.4-0.6) + missing → SIMPLIFY"

  integration_tests:
    - test: test_scenario_selection_end_to_end
      scenario: "Scenario selection feeds into LLM generation"
      input:
        confidence: 0.52
        missing_entities: ["time", "location"]
      expected_flow:
        - step: "select_scenario() → scenario_2_missing_entity (<5ms)"
        - step: "LLM generation with scenario_2 system prompt (<500ms)"
        - step: "Natural clarification returned: 'I'd be happy to book dinner tomorrow! What time works for you, and do you have a restaurant in mind?'"

  performance_tests:
    - test: test_scenario_selection_latency_under_5ms
      scenario: "1000 scenario selections complete <5ms P95"
      input: "1000 IntentAnalysis objects with varied conditions"
      expected_p50: "<2ms"
      expected_p95: "<5ms"
