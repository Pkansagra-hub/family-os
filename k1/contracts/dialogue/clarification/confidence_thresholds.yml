# Contract: Confidence Threshold Rules (LLM-Generated Clarifications)
# Purpose: Define confidence threshold rules for LLM-generated clarifications (NO TEMPLATES)
# ADR: ADR-0054d (Dialogue Repair & Clarification Pipeline) lines 145-163
# Layer: L3 Execution (Dialogue)
# Owner: Clarification Manager
# Architecture: Following OpenAI/Claude industry standard (pure LLM generation, no templates)

metadata:
  contract_id: dialogue.clarification.confidence_thresholds
  version: 2.0.0  # BREAKING: Changed from template-based to LLM-generated
  status: proposed
  created: 2025-10-22
  updated: 2025-10-22
  adrs:
    - ADR-0054d  # Dialogue Repair & Clarification Pipeline (rewritten for LLM generation)
    - ADR-0059   # Learning Loop (threshold adaptation)
  dependencies:
    - dialogue.clarification.clarification_decision
    - learning.feedback.correction_signals
    - infrastructure.llm.generation  # NEW: LLM service dependency
  layer: l3_execution
  module: dialogue

  breaking_changes:
    version_2_0_0:
      date: 2025-10-22
      rationale: |
        Changed from template-based clarifications (22 templates, <10ms, robotic)
        to LLM-generated clarifications (OpenAI/Claude approach).

        WHY: Templates sound robotic (user hears same phrase 1,460× over 20 years).
        Industry leaders (OpenAI ChatGPT, Claude) use pure LLM generation.
        Cost negligible ($1.83/year for typical family = 7,300 clarifications × $0.005).
        Prioritize user experience (natural phrasing) over latency (500ms acceptable).

      migration_guide: |
        1. Delete clarification_generation.yml template library (22 templates)
        2. Add LLM service dependency (gpt-4o-mini for clarification generation)
        3. Update performance budget: <100ms P95 → <500ms P95 for LLM call
        4. Add cost tracking: $0.005 per clarification
        5. System prompts replace template selection logic

# =============================================================================
# 1. CONFIDENCE THRESHOLD STRATEGY (LLM-BASED CLARIFICATION)
# =============================================================================

confidence_thresholds:
  description: |
    Three-tier confidence threshold strategy for intent classification:
    - EXECUTE (≥0.6): High confidence - execute action immediately (no LLM call)
    - CLARIFY (0.4-0.6): Moderate confidence - LLM generates natural clarifying question
    - REJECT (<0.4): Low confidence - LLM generates conversational rephrase request

    Thresholds are adaptive - Learning Loop adjusts ±0.05 based on correction rate.

    **ARCHITECTURAL CHANGE:** LLM generates all clarifications (following OpenAI/Claude approach).
    No templates. Natural contextual phrasing. Cost: $0.005 per clarification.

  tier_definitions:
    execute_threshold:
      value: 0.6
      range: [0.55, 0.70]  # Adaptive learning bounds
      action: EXECUTE_IMMEDIATELY
      llm_call_required: false
      description: High confidence - proceed with action without clarification
      rationale: |
        ≥0.6 confidence indicates LLM has high certainty in intent classification.
        Execute action directly to minimize conversation latency.
        Production data shows <5% error rate at this threshold.
        NO LLM clarification call needed.

    clarify_threshold:
      lower_bound: 0.4
      upper_bound: 0.6
      range: [0.35, 0.65]  # Adaptive learning bounds
      action: REQUEST_LLM_CLARIFICATION
      llm_call_required: true
      llm_model: gpt-4o-mini
      llm_cost: "$0.005 per call"
      llm_latency: "500ms P95"
      description: Moderate confidence - LLM generates natural clarifying question
      rationale: |
        0.4-0.6 confidence indicates LLM has partial understanding.
        Call LLM to generate contextual clarifying question (no templates).
        Production data shows 75% of clarifications lead to successful action.

        Example system prompt:
        "You are uncertain about missing information. Ask a brief natural clarifying question."

        Example user prompt:
        "User said: 'Book dinner tomorrow'. Intent: book_dinner (confidence 0.52).
        Understood: date=tomorrow. Missing: time, location.
        Generate a brief natural clarifying question."

        Example LLM output:
        "I'd be happy to book dinner tomorrow! What time works for you, and do you have a restaurant in mind?"

    reject_threshold:
      value: 0.4
      range: [0.30, 0.45]  # Adaptive learning bounds
      action: REQUEST_LLM_REPHRASE
      llm_call_required: true
      llm_model: gpt-4o-mini
      llm_cost: "$0.005 per call"
      llm_latency: "500ms P95"
      description: Low confidence - LLM generates conversational rephrase request
      rationale: |
        <0.4 confidence indicates LLM has insufficient understanding.
        Call LLM to generate conversational rephrase request (no templates).

        Example system prompt:
        "You didn't understand the user. Ask them to rephrase conversationally."

        Example LLM output:
        "I didn't quite catch that. Could you rephrase what you're looking for?"

  clarification_generation_mode:
    type: LLM_FIRST_WITH_DETERMINISTIC_FALLBACK  # Changed from TEMPLATE_BASED
    architecture: |
      Following OpenAI ChatGPT and Claude Anthropic approach with production reliability:
      - PRIMARY: LLM generates natural contextual clarifications via system prompts
      - FALLBACK: Deterministic minimal clarification when LLM unavailable/timeout/over-budget
      - Accept 500ms latency for quality (vs 10ms templates)
      - Cost $0.005 per clarification ($1.83/year for typical family)
      - Reliability: Never stall, never overspend, works offline

    llm_config:
      model: gpt-4o-mini
      temperature: 0.7
      max_tokens: 50
      timeout_ms: 400  # Hard wall; stream if available
      cost_cap_usd_per_turn: 0.01
      cost_cap_usd_per_month_per_household: 0.50
      retry_policy:
        - local_slm: first   # Try local small language model first
        - remote_llm: second # Fall back to remote gpt-4o-mini
      on_failover: DETERMINISTIC_MINIMAL  # Emit short slot-filling question from code
      system_prompt_template: |
        You are a family assistant. When uncertain about user intent:
        - Ask natural clarifying questions
        - Admit when missing information
        - Offer options when ambiguous
        - Keep questions conversational and brief (<30 words)

    cost_analysis:
      per_call_cost: "$0.005"
      typical_family_usage: "7,300 clarifications over 20 years"
      total_20_year_cost: "$36.50"
      annual_cost: "$1.83 per year"
      monthly_cap_usd_per_household: "$0.50"
      action_on_cap: "FALLBACK_DETERMINISTIC"
      justification: "Negligible cost for natural phrasing vs $0 templates (robotic)"

    quality_improvement:
      template_approach: "Robotic - user hears same phrase 1,460× over 20 years"
      llm_approach: "Natural - infinite variety, contextual, conversational"
      user_experience: "Prioritized over latency (500ms acceptable for voice UI)"

    deterministic_fallback:
      description: |
        When LLM unavailable, timeout, over budget, or offline, emit minimal deterministic clarification.
        Guarantees reliability: never stall, never overspend, works offline.

      triggers:
        - timeout_ms_exceeded: "LLM call >400ms"
        - cost_cap_exceeded: "Monthly household cost >$0.50"
        - offline_mode: "No network connectivity"
        - remote_llm_unavailable: "API error or rate limit"

      fallback_strategy: SLOT_FILLING_QUESTION

      examples:
        missing_entities:
          input: "Book dinner tomorrow"
          missing: ["time", "location"]
          deterministic_output: "I can book dinner tomorrow ⟂ need time and place."

        ambiguous_entities:
          input: "Book dinner at that Italian place"
          ambiguous: ["Luigi's", "Olive Garden", "Carrabba's"]
          deterministic_output: "Which restaurant: Luigi's, Olive Garden, or Carrabba's?"

        low_confidence:
          input: "wkdjf slkdjf"
          confidence: 0.15
          deterministic_output: "I didn't understand. Please rephrase."

# =============================================================================
# 2. THRESHOLD DECISION LOGIC (TRIGGERS LLM CLARIFICATION)
# =============================================================================

decision_rules:
  description: Priority-ordered rules for confidence-based decisions (trigger LLM clarification generation)

  rule_priority:
    - rule: missing_required_entities
      priority: 1  # Highest priority
      condition: confidence >= 0.6 AND missing_entities.count > 0
      action: REQUEST_LLM_CLARIFICATION
      llm_system_prompt: "You are uncertain about missing information. Ask a brief natural clarifying question."
      rationale: High confidence but missing required info - LLM generates targeted question
      example:
        user_input: "Book dinner tomorrow"
        intent: book_dinner
        confidence: 0.87
        understood: ["date: tomorrow"]
        missing: ["time", "location"]
        llm_user_prompt: |
          User said: 'Book dinner tomorrow'
          Intent: book_dinner (confidence 0.87)
          Understood: date=tomorrow
          Missing: time, location
          Generate a brief natural clarifying question.
        llm_generated_clarification: "I'd be happy to book dinner tomorrow! What time works for you, and do you have a restaurant in mind?"

    - rule: execute_high_confidence
      priority: 2
      condition: confidence >= 0.6 AND missing_entities.count == 0
      action: EXECUTE_IMMEDIATELY
      llm_call_required: false
      rationale: High confidence, all entities present - proceed immediately (no LLM call)

    - rule: clarify_moderate_confidence
      priority: 3
      condition: 0.4 <= confidence < 0.6
      action: REQUEST_LLM_CLARIFICATION
      llm_system_prompt: "You have moderate confidence. Ask a natural question about what you're uncertain about."
      rationale: Moderate confidence - LLM generates contextual question
      example:
        user_input: "Book dinner tomorrow"
        confidence: 0.52
        understood: ["date: tomorrow"]
        missing: ["time", "location"]
        llm_generated_clarification: "I can help book dinner tomorrow. What time would you like to go, and which restaurant?"

    - rule: reject_low_confidence
      priority: 4
      condition: confidence < 0.4
      action: REQUEST_LLM_REPHRASE
      llm_system_prompt: "You didn't understand the user. Ask them to rephrase conversationally."
      rationale: Very low confidence - LLM generates conversational rephrase request
      example:
        confidence: 0.32
        llm_generated_rephrase: "I didn't quite catch that. Could you rephrase what you're looking for?"

    - rule: ambiguous_entities
      priority: 3
      condition: ambiguous_entities.count > 0
      action: REQUEST_LLM_CLARIFICATION
      llm_system_prompt: "Multiple interpretations exist. Offer options conversationally."
      rationale: Multiple plausible interpretations - LLM generates natural options list
      example:
        user_input: "Book dinner at that Italian place"
        ambiguous_location: ["Luigi's", "Olive Garden", "Carrabba's"]
        llm_user_prompt: |
          User said: 'book dinner at that Italian place'
          Ambiguous location - we've been to: Luigi's, Olive Garden, Carrabba's
          Generate a natural question offering these options.
        llm_generated_clarification: "I found a few Italian restaurants you've visited recently. Did you mean Luigi's, Olive Garden, or Carrabba's?"

# =============================================================================
# 3. ADAPTIVE THRESHOLD LEARNING
# =============================================================================

threshold_adjustment:
  learning_rate: 0.05  # Adjust threshold by ±0.05 per learning cycle

  adjustment_triggers:
    high_correction_rate:
      condition: correction_rate > 0.15  # >15% of actions corrected by user
      action: execute_threshold += 0.05
      rationale: Too many wrong actions at current threshold → increase threshold (more conservative)
      example:
        correction_rate: 0.18  # 18% of actions corrected
        current_threshold: 0.60
        adjustment: +0.05
        new_threshold: 0.65
        impact: "Require higher confidence before executing (will generate more LLM clarifications)"

    low_correction_rate:
      condition: correction_rate < 0.05  # <5% of actions corrected
      action: execute_threshold -= 0.05
      rationale: Very few errors → can be more aggressive (lower threshold)
      example:
        correction_rate: 0.03  # 3% of actions corrected
        current_threshold: 0.60
        adjustment: -0.05
        new_threshold: 0.55
        impact: "Execute with lower confidence (will generate fewer LLM clarifications, save cost)"

    acceptable_correction_rate:
      condition: 0.05 <= correction_rate <= 0.15  # 5-15% corrections
      action: No adjustment
      rationale: Correction rate in acceptable range (sweet spot)

  adjustment_formula:
    pseudocode: |
      correction_rate = corrections_count / total_actions_in_window

      IF correction_rate > 0.15:
          execute_threshold = min(execute_threshold + 0.05, 0.70)  # Cap at 0.70
          # Impact: More LLM clarifications generated, higher cost but fewer errors
      ELIF correction_rate < 0.05:
          execute_threshold = max(execute_threshold - 0.05, 0.55)  # Floor at 0.55
          # Impact: Fewer LLM clarifications, lower cost but acceptable error rate

      # Store updated threshold in SessionState.beliefs for session persistence
      session_state.beliefs["confidence_thresholds"] = {
          "execute": execute_threshold,
          "clarify_lower": clarify_lower,
          "clarify_upper": clarify_upper,
          "last_adjusted": datetime.now()
      }

  evaluation_window: 100  # Evaluate every 100 clarifications
  minimum_samples: 50     # Require 50+ samples before adjustment

  bounds:
    execute_threshold: [0.55, 0.70]
    clarify_lower: [0.35, 0.50]
    clarify_upper: [0.55, 0.65]
    reject_threshold: [0.30, 0.45]

# =============================================================================
# 4. LEARNING LOOP INTEGRATION
# =============================================================================

learning_integration:
  description: Send correction signals to Learning Loop for threshold adaptation

  feedback_signals:
    correction_signal:
      type: FeedbackType.CORRECTION
      signal_strength: 1.0  # Explicit user correction = strong signal
      trigger: "User correction detected ('No, I meant...')"
      payload:
        original_input: str
        llm_interpretation: str
        user_correction: str
        confidence_score: float
        intent: str
      action: Increase execute_threshold by learning_rate (0.05) for similar intents
      example:
        user_original: "Book dinner tomorrow"
        llm_interpretation: "Booking dinner at Luigi's"
        user_correction: "No, I meant Olive Garden"
        confidence: 0.62
        result: "execute_threshold += 0.05 (0.62 → 0.67 for book_dinner intent)"

    success_signal:
      type: FeedbackType.SUCCESS
      signal_strength: 0.3  # Weak positive signal
      trigger: Action executed successfully without user correction
      action: Maintain current threshold or slightly decrease (become more aggressive)

    clarification_failed:
      type: FeedbackType.CLARIFICATION_FAILED
      signal_strength: 0.8  # Strong negative signal
      trigger: User asked same question 3+ times (LLM clarification strategy failing)
      payload:
        intent: str
        clarification_attempts: int
        llm_generated_questions: List[str]
      action: Increase clarify_upper threshold (ask for clarification earlier)

  integration_point:
    component: k1/l4_runtime/learning_loop/
    contract: learning.feedback.correction_signals
    method: learning_loop.record_feedback(feedback_type, signal_strength, context, trace_id)

# =============================================================================
# 5. PERFORMANCE BUDGET (LLM-BASED CLARIFICATION)
# =============================================================================

performance:
  latency:
    decision_latency:
      target: "<1ms P95"
      rationale: Simple threshold comparison (no I/O, happens before LLM call)
      measurement: Time from IntentAnalysis input to decision output

    llm_clarification_generation:
      target: "<500ms P95"
      streaming_first_token_p95: "<150ms"
      supports_barge_in: true
      rationale: |
        LLM call to generate natural clarification (gpt-4o-mini fast model).
        Stream first token <150ms for perceived responsiveness in voice UI.
        Barge-in support allows user to interrupt LLM generation mid-sentence.
      measurement: Time from decision to LLM-generated clarification
      cost_per_call: "$0.005"
      tradeoff: "500ms latency acceptable for natural phrasing (vs 10ms robotic templates)"
      current_performance: "350ms P50, 480ms P95, 120ms first token P95"

    deterministic_fallback_latency:
      target: "<10ms P95"
      rationale: Code-based slot-filling question (no LLM call)
      measurement: Time from fallback trigger to deterministic clarification output

    threshold_adjustment:
      target: "<50ms P95"
      rationale: Adjustment happens asynchronously after 100 clarifications
      measurement: Time to recalculate correction_rate and update threshold

  memory:
    threshold_config: 2KB  # 4 thresholds + adjustment config
    correction_history: 4KB  # Last 100 corrections for rate calculation
    llm_clarification_cache: 0KB  # NO caching (each clarification unique/contextual)
    deterministic_fallback_templates: 3KB  # Minimal slot-filling question templates
    total_footprint: "<10KB"

  cost:
    llm_clarification_cost:
      per_call: "$0.005"
      typical_family_usage: "7,300 clarifications over 20 years (1/day average)"
      total_20_year_cost: "$36.50"
      annual_cost: "$1.83 per year"
      monthly_cap_per_household: "$0.50"
      action_on_cap: "FALLBACK_DETERMINISTIC"
      comparison: "$0 for templates (but robotic, user hears same phrase 1,460×)"
      justification: "Negligible cost for natural phrasing, industry standard (OpenAI/Claude)"

# =============================================================================
# 6. POLICY & SECURITY
# =============================================================================

policy:
  privacy_band:
    allowed: ["GREEN", "AMBER"]  # Disallow RED/BLACK for LLM clarifications
    rationale: "Clarifications can leak PII; restrict to GREEN/AMBER bands only"
    red_band_fallback: "DETERMINISTIC_MINIMAL"  # Use deterministic for RED band

  pii_masking:
    enabled: true
    strategy: "summarize_entities_by_type"
    prompt_template: "No raw secrets; summarize entities by type (e.g., 'a restaurant' not 'Luigi's Private Dining')"

  safe_prompt_construction:
    sanitize_user_input: true
    strip_special_chars: true
    max_input_length: 200

# =============================================================================
# 7. UNCERTAINTY & GUARDRAILS
# =============================================================================

uncertainty:
  description: Composite uncertainty score (not just intent confidence)
  formula: "u = α*intent_conf + β*slot_gap + γ*(1-retrieval_score) + δ*contradiction_flag"

  components:
    intent_confidence_weight: 0.4  # α
    slot_gap_weight: 0.3           # β (fraction of required slots missing)
    retrieval_score_weight: 0.2    # γ (1 - memory retrieval confidence)
    contradiction_weight: 0.1      # δ (binary: conflicting entities detected)

  threshold_u: 0.45  # Clarify if composite uncertainty >0.45

  example:
    input: "Book dinner tomorrow at that place we went last week"
    intent_confidence: 0.75
    slot_gap: 0.5  # Missing 2 of 4 required slots (time, location)
    retrieval_score: 0.6  # Memory retrieval found "that place" with 60% confidence
    contradiction_flag: 0  # No contradictions
    composite_u: "0.4*0.75 + 0.3*0.5 + 0.2*(1-0.6) + 0.1*0 = 0.30 + 0.15 + 0.08 + 0 = 0.53"
    decision: "u=0.53 > threshold_u=0.45 → REQUEST_LLM_CLARIFICATION"

guardrails:
  max_clarifications_per_turn: 2
  max_clarifications_per_5_turns: 1
  suppression_window_s: 120  # Don't clarify same intent within 2 minutes

  rationale: "Prevent clarification fatigue; fallback to deterministic or rejection after limits"

  on_limit_exceeded: "FALLBACK_DETERMINISTIC_OR_REJECT"

# =============================================================================
# 6. OBSERVABILITY (LLM CLARIFICATION METRICS)
# =============================================================================

observability:
  prometheus_metrics:
    dialogue_confidence_decisions_total:
      type: Counter
      labels: [action, threshold_applied]
      description: Total confidence-based decisions
      example_labels:
        action: [EXECUTE_IMMEDIATELY, REQUEST_LLM_CLARIFICATION, REQUEST_LLM_REPHRASE, FALLBACK_DETERMINISTIC]

    dialogue_llm_clarification_latency_ms:
      type: Histogram
      description: LLM clarification generation latency (ms)
      buckets: [50, 100, 150, 250, 500, 1000, 2000]
      target: "<500ms P95, <150ms first token P95"
      breakdown_by_model: true  # local_slm vs remote_llm

    dialogue_llm_clarification_cost_usd:
      type: Counter
      description: Total LLM clarification cost (USD)
      expected_annual: "$1.83 per family"

    dialogue_deterministic_fallback_total:
      type: Counter
      labels: [reason]
      description: Total deterministic fallback clarifications
      example_labels:
        reason: [timeout, cost_cap, offline, llm_unavailable, red_band]

    dialogue_threshold_adjustments_total:
      type: Counter
      labels: [threshold_name, direction]
      description: Total threshold adjustments via Learning Loop

    dialogue_correction_rate:
      type: Gauge
      labels: [intent]
      description: Current correction rate (0.0-1.0) per intent
      target: "<0.10"  # <10% correction rate

    dialogue_clarification_success_rate:
      type: Gauge
      description: Percentage of LLM clarifications that lead to successful action
      target: ">0.75"  # >75% success rate

    dialogue_post_clarification_error_rate:
      type: Gauge
      description: Error rate AFTER clarification (key business KPI)
      breakdown_by_reason: ["missing_slots", "ambiguity", "low_conf", "context_recovery"]
      target: "<0.05"  # <5% errors after clarification

  structured_logging:
    events:
      - event: confidence_decision
        fields: [intent, confidence, composite_uncertainty, decision, threshold, trace_id]
      - event: llm_clarification_generated
        fields: [intent, confidence, llm_latency_ms, llm_cost_usd, first_token_latency_ms, clarification_text, trace_id]
      - event: deterministic_fallback
        fields: [reason, fallback_text, trace_id]
      - event: threshold_adjusted
        fields: [threshold_name, old_value, new_value, correction_rate, trace_id]

# =============================================================================
# 8. UX & ACCESSIBILITY
# =============================================================================

ux:
  language_match_user_locale: true
  style: concise
  reading_level: "A2-B1"  # CEFR levels (basic user to intermediate)

  localization:
    supported_locales: ["en-US", "es-US", "zh-CN"]
    llm_system_prompt_localized: true
    deterministic_fallback_localized: true

  voice_optimization:
    streaming_enabled: true
    first_token_target: "<150ms P95"
    barge_in_enabled: true
    prosody_hints: true  # SSML for natural speech

# =============================================================================
# 9. DEPENDENCIES
# =============================================================================

dependencies:
  upstream:
    - contract: orchestration.planner.intent_analysis
      provides: IntentClassification
      required_fields: [intent, confidence, entities]

    - contract: infrastructure.llm.generation
      provides: LLMGenerationService
      required_fields: [system_prompt, user_prompt, max_tokens, temperature]
      description: "LLM service for generating natural clarifications (gpt-4o-mini)"

  downstream:
    - contract: dialogue.clarification.clarification_decision
      consumes: Confidence threshold decisions
      action: Triggers LLM clarification generation if needed

    - contract: learning.feedback.correction_signals
      consumes: Correction rate signals
      action: Adjusts thresholds dynamically

# =============================================================================
# 10. TESTING REQUIREMENTS
# =============================================================================

testing:
  unit_tests:
    - test: test_high_confidence_executes_no_llm_call
      input:
        confidence: 0.87
        entities: ["date", "time", "location"]
      expected_decision: EXECUTE_IMMEDIATELY
      expected_llm_call: false

    - test: test_moderate_confidence_triggers_llm_clarification
      input:
        confidence: 0.52
        missing_entities: ["time", "location"]
      expected_decision: REQUEST_LLM_CLARIFICATION
      expected_llm_call: true
      expected_llm_system_prompt: "You are uncertain about missing information. Ask a brief natural clarifying question."

    - test: test_low_confidence_triggers_llm_rephrase
      input:
        confidence: 0.32
      expected_decision: REQUEST_LLM_REPHRASE
      expected_llm_call: true

    - test: test_deterministic_fallback_on_timeout
      input:
        confidence: 0.52
        llm_timeout: true
      expected_decision: FALLBACK_DETERMINISTIC
      expected_output: "I can book dinner tomorrow ⟂ need time and place."
      expected_latency: "<10ms"

    - test: test_deterministic_fallback_on_cost_cap
      input:
        confidence: 0.52
        monthly_cost_usd: 0.51  # Exceeded $0.50 cap
      expected_decision: FALLBACK_DETERMINISTIC
      expected_llm_call: false

  integration_tests:
    - test: test_llm_clarification_generation_under_500ms
      scenario: LLM generates natural clarification <500ms
      input:
        confidence: 0.52
        missing_entities: ["time", "location"]
      expected_llm_latency: "<500ms P95"
      expected_first_token_latency: "<150ms P95"
      expected_llm_cost: "$0.005"
      llm_output_example: "I'd be happy to help book dinner tomorrow! What time works for you, and do you have a restaurant in mind?"

    - test: test_streaming_first_token_voice_ux
      scenario: Streaming first token <150ms for voice responsiveness
      input:
        confidence: 0.52
      expected_first_token_latency: "<150ms P95"
      supports_barge_in: true

    - test: test_learning_loop_threshold_adjustment
      scenario: User correction triggers threshold increase
      flow:
        - step: Planner classifies intent (confidence 0.62)
        - step: Confidence check → EXECUTE_IMMEDIATELY (no LLM call)
        - step: User correction detected
        - step: Learning Loop adjusts execute_threshold += 0.05
        - step: Next similar intent triggers LLM clarification at 0.62
      expected_result: Threshold increased from 0.62 to 0.67

    - test: test_retry_cascade_local_to_remote
      scenario: Local SLM fails, retry with remote LLM, fallback to deterministic
      flow:
        - step: Try local_slm (timeout after 200ms)
        - step: Retry with remote gpt-4o-mini (timeout after 400ms)
        - step: Fallback to DETERMINISTIC_MINIMAL
      expected_output: "I can book dinner tomorrow ⟂ need time and place."
      expected_total_latency: "<650ms"

  performance_tests:
    - test: test_decision_latency_under_1ms
      scenario: Confidence decision (before LLM call) completes <1ms
      expected_latency: "<1ms P95"

    - test: test_llm_clarification_cost_tracking
      scenario: Track LLM clarification cost over 100 calls
      expected_total_cost: "$0.50 (100 × $0.005)"

    - test: test_composite_uncertainty_calculation
      scenario: Calculate composite uncertainty from 4 components
      input:
