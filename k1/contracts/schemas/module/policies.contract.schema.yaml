$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "k1://schemas/module/policies.contract.schema.yaml"
title: "Policies Contract"
type: object

additionalProperties: false
unevaluatedProperties: false

required: [metadata, contract_version, impl_version]
properties:
  metadata:
    $ref: "k1://schemas/base/metadata.schema.yaml"
  contract_version:
    type: integer
    minimum: 1
  impl_version:
    $ref: "k1://schemas/base/version.schema.yaml"

  capabilities:
    type: object
    additionalProperties: false
    unevaluatedProperties: false
    properties:
      granted:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9_\\-]+:[a-z0-9_\\-]+:[a-z0-9_\\-]+$"
        maxItems: 1024

  budgets:
    type: object
    additionalProperties: false
    unevaluatedProperties: false
    properties:
      latency_ms_p95:
        type: integer
        minimum: 1
        maximum: 600000
      cost_usd_per_session_max:
        type: number
        minimum: 0
        maximum: 1000
      kv_cache_mb_max:
        type: integer
        minimum: 0
        maximum: 65536

  egress:
    type: object
    additionalProperties: false
    unevaluatedProperties: false
    properties:
      network:
        type: object
        additionalProperties: false
        unevaluatedProperties: false
        properties:
          allowed_domains:
            type: array
            items: { type: string, maxLength: 253 }
            maxItems: 256
          allowed_ips:
            type: array
            items: { type: string, maxLength: 64 }
            maxItems: 256
      filesystem:
        type: object
        additionalProperties: false
        unevaluatedProperties: false
        properties:
          allowed_paths:
            type: array
            items: { type: string, maxLength: 256 }
            maxItems: 256

  audit:
    type: object
    additionalProperties: false
    unevaluatedProperties: false
    properties:
      emit_receipts:
        type: boolean
      receipt_topic:
        type: string
        maxLength: 128
