  - symbol: "WorkflowSaveRequest"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "InterruptRequest"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "MicroReplanRequest"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "CompensationRecord"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "ProcessingContext"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "OrchestratorConfig"
    from_file: "k1/orchestrator/__init__.py"

  # --- Enums ---
  - symbol: "StepStatus"
