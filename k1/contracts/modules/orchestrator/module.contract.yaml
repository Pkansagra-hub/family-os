# ---------------------------------------------------------------------------
# Orchestrator Module Contract
# Follows Fabric pattern: k1/contracts/modules/fabric/module.contract.yaml
# Reference: Schema Whiteboard Section 4.1
# ---------------------------------------------------------------------------
$schema: "k1://schemas/module/module.contract.schema.yaml"

metadata:
  module_id: "orchestrator"
  owner: "platform-team"
  band: "GREEN"
  description: >
    Orchestrator module for K1. Blind DAG executor, workflow engine,
    connector host. Pure deterministic actor. Zero LLM calls, zero tools,
    NEVER writes SessionState.
  tags: ["orchestrator", "dag", "workflows", "mcp"]

contract_version: 1
impl_version: "1.0.0"

# ---------------------------------------------------------------------------
# Exported symbols -- all from k1/orchestrator/__init__.py
# ---------------------------------------------------------------------------
exports:
  # --- Facade (entry point) ---
  - symbol: "OrchestratorService"
    from_file: "k1/orchestrator/__init__.py"

  # --- Core Services ---
  - symbol: "DAGExecutor"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "StepRunner"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "ConstraintResolver"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "ErrorRouter"
    from_file: "k1/orchestrator/__init__.py"

  # --- Workflow Services ---
  - symbol: "WorkflowEngine"
    from_file: "k1/orchestrator/__init__.py"

  # --- Connector Services ---
  - symbol: "ConnectorLifecycleManager"
    from_file: "k1/orchestrator/__init__.py"

  # --- Port Protocols (8 ports) ---
  - symbol: "IMailboxPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IFabricGatewayPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IPlannerPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IStateReadPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IDeltaEmitPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IBridgeWritePort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IEventSubscriptionPort"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "IWorkflowStoragePort"
    from_file: "k1/orchestrator/__init__.py"

  # --- Core Types ---
  - symbol: "TaskEnvelope"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "PlanRequest"
    from_file: "k1/orchestrator/__init__.py"
  - symbol: "CommittedPlan"
