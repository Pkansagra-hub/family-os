$schema: "k1://schemas/module/module.contract.schema.yaml"

metadata:
  module_id: "sessionstate"
  owner: "platform-team"
  band: "GREEN"
  description: "SessionState module for K1, managing tiered HOT/WARM/COLD state with invariants, services, and emergency modes."
  tags: ["state", "memory", "tiered", "kernel"]

contract_version: 1
impl_version: "1.0.0"

exports:
  - symbol: "SessionStateManager"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "MutationGuard"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "EvictionEngine"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "MigrationEngine"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "SizeTracker"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "ReconstructionSLA"
    from_file: "k1/sessionstate/__init__.py"
  - symbol: "SnapshotAPI"
    from_file: "k1/sessionstate/__init__.py"

entrypoints:
  init: "sessionstate:initialize"
  shutdown: "sessionstate:cleanup"

dependencies:
  - module: "kernel"
    version: "1.0.0"
  - module: "bus"
    version: "1.0.0"
  - module: "k0"
    version: "1.0.0"
