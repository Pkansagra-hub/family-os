# ---------------------------------------------------------------------------
# Entrypoints
# ---------------------------------------------------------------------------
entrypoints:
  init: "memory_writer:initialize"
  shutdown: "memory_writer:cleanup"

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
dependencies:
  - module: "sessionstate"
    version: "1.0.0"
    required: true
    note: "ISessionReadPort -- read-only, lock-free, MW-01"
  - module: "bridge"
    version: "1.0.0"
    required: true
    note: "IBridgeCommandPort -- fire-and-forget to K0, MW-03"
  - module: "bus"
    version: "1.0.0"
    required: true
    note: "IEventSubscriptionPort -- turn.complete.v1 subscription"
  - module: "model_hub"
    version: "1.0.0"
    required: false
    note: "IModelHubPort -- LLM extraction, circuit breaker protected, MW-06"

# ---------------------------------------------------------------------------
# 11 Hard Invariants (MW-01 to MW-11)
# ---------------------------------------------------------------------------
invariants:
  # --- Identity ---
  - id: "MW-01"
    description: "NEVER writes SessionState"
    category: "identity"
    enforcement: "compile-time (no IStateWritePort dependency)"

  - id: "MW-02"
    description: "Reads SessionState lock-free <1ms"
    category: "identity"
    enforcement: "runtime (timing assertion on snapshot call)"

  - id: "MW-03"
    description: "All K0 writes via Bridge only"
    category: "identity"
    enforcement: "compile-time (only IBridgeCommandPort output)"

  # --- Extraction ---
  - id: "MW-04"
    description: "Body text <= 50 words"
    category: "extraction"
    enforcement: "runtime (ExtractionValidator assertion)"

  - id: "MW-05"
    description: "0-6 atoms per turn max"
    category: "extraction"
    enforcement: "runtime (pipeline output assertion)"

  - id: "MW-06"
    description: "LLM budget: 2000 tokens"
    category: "extraction"
    enforcement: "runtime (IModelHubPort call assertion)"

  - id: "MW-07"
    description: "Filter is rule-based (no LLM)"
    category: "filter"
    enforcement: "compile-time (no IModelHubPort dependency in filter)"

  # --- Batch ---
  - id: "MW-08"
    description: "Batch window: 250ms"
    category: "batch"
    enforcement: "runtime (config enforcement)"

  - id: "MW-09"
    description: "Offline-safe (LocalOutbox)"
    category: "batch"
    enforcement: "runtime (adapter guarantee)"

  # --- Envelope ---
  - id: "MW-10"
    description: "All envelopes carry cognitive_trace_id"
    category: "envelope"
    enforcement: "runtime (EnvelopeBuilder assertion)"

  # --- Architecture ---
  - id: "MW-11"
    description: "UltraBERT validates in K0 P02 (not K1)"
    category: "architecture"
    enforcement: "compile-time (no UltraBERT import in memory_writer)"
