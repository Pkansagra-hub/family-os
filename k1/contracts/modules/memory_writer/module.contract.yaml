# ---------------------------------------------------------------------------
# Memory Writer v2 Module Contract
# Follows Orchestrator pattern: k1/contracts/modules/orchestrator/module.contract.yaml
# Reference: MASTER_IMPLEMENTATION_SKELETON.md Epic 1.1
# Source of truth: docs/pipelines/p03/stage5_proposal_corrections.md LAYER 2
# ---------------------------------------------------------------------------
$schema: "k1://schemas/module/module.contract.schema.yaml"

metadata:
  module_id: "memory_writer"
  owner: "platform-team"
  band: "GREEN"
  description: >
    Memory Writer v2 module for K1. Extracts episodic memory atoms from
    conversation turns via LLM, producing 34-field MemoryAtom envelopes
    routed through Bridge to K0 P02. 2000-token LLM budget, 12 cognitive
    dimensions, 0-6 atoms per turn. NEVER writes SessionState.
  tags: ["memory_writer", "extraction", "episodic", "atoms", "bridge"]

contract_version: 1
impl_version: "2.0.0"

# ---------------------------------------------------------------------------
# Exported symbols -- all from k1/memory_writer/__init__.py
# ---------------------------------------------------------------------------
exports:
  # --- Facade (entry point) ---
  - symbol: "MemoryWriterPipeline"
    from_file: "k1/memory_writer/__init__.py"

  # --- Core Services ---
  - symbol: "RelevanceFilter"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ContextBuilder"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ExtractionValidator"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "EnvelopeBuilder"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "DeltaAggregator"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "BatchEmitter"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "PersonResolver"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "PrivacyEnforcer"
    from_file: "k1/memory_writer/__init__.py"

  # --- Port Protocols (5 ports) ---
  - symbol: "ISessionReadPort"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "IBridgeCommandPort"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "IEventSubscriptionPort"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "IModelHubPort"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "IHealthPort"
    from_file: "k1/memory_writer/__init__.py"

  # --- Core Types ---
  - symbol: "MemoryAtom"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ExtractionContext"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "CompressedTurn"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "MWEnvelope"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "MWConfig"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "FilterDecision"
    from_file: "k1/memory_writer/__init__.py"

  # --- Enums ---
  - symbol: "SkipReason"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "NoveltyLevel"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ElaborationDepth"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "TemporalOrientation"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "SourceType"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ArcPosition"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "SocialIntimacy"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "ActivityType"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "RelationshipType"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "LocationType"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "IdentityDomain"
    from_file: "k1/memory_writer/__init__.py"
  - symbol: "SentimentLabel"
