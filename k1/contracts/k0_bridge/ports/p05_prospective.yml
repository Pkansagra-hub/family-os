# P05 Prospective - Reminders & Triggers Pipeline
# Port: P05 (K1 → K0 prospective memory)
# Command semantics: K1 sets intentions, reminders, event-based triggers
# Performance budget: 75ms P95, 300ms timeout

version: "1.0"
port_id: "P05"
port_name: "Prospective"
direction: "K1_TO_K0"
semantics: "command"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0025"  # Prospective Memory System
  - "ADR-0026"  # Event-based Triggers
  - "ADR-0044"  # HTTP/2 Transport
  - "ADR-0125"  # Intention Formation & Cue Monitoring

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P05"
      description: "Port identifier for prospective memory"

    command_type:
      type: string
      value: "prospective_memory_set"
      description: "Command to create intention/reminder"

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing"
      example: "3b4c5d6e-7f8a-9b0c-1d2e-3f4a5b6c7d8e"

    session_id:
      type: string
      format: uuid
      required: true
      description: "Session identifier for context isolation"
      example: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"

    privacy_band:
      type: string
      enum: ["GREEN", "AMBER", "RED"]
      required: true
      description: |
        Privacy classification:
        - GREEN: Standard storage, cloud sync
        - AMBER: PII detection, limited sync
        - RED: Local-only, encrypted

    capability:
      type: string
      value: "SET_PROSPECTIVE_MEMORY"
      required: true
      description: "Required K0 capability for prospective memory creation"

  payload:
    intention_type:
      type: string
      enum: ["time_based", "event_based", "activity_based"]
      required: true
      description: |
        Prospective memory trigger type:
        - time_based: Calendar/timer triggers (absolute or relative)
        - event_based: Pattern matching on event bus
        - activity_based: Workflow state transitions

    trigger_spec:
      type: object
      required: true
      description: "Trigger specification (structure varies by intention_type)"
      oneOf:
        - time_based_trigger:
            timestamp:
              type: string
              format: iso8601
              description: "Absolute trigger time (ISO 8601)"
              example: "2025-10-20T15:30:00Z"
            relative_offset_ms:
              type: integer
              description: "Relative trigger (milliseconds from now)"
              example: 7200000  # 2 hours

        - event_based_trigger:
            event_pattern:
              type: string
              description: "Event pattern to match (JSONPath expression)"
              example: "$.event_type == 'user.location.home_arrival'"
            event_filter:
              type: object
              additionalProperties: true
              description: "Additional event filters"

        - activity_based_trigger:
            activity_context:
              type: string
              description: "Activity context identifier"
              example: "task_completion:project_alpha"
            workflow_state:
              type: string
              description: "Expected workflow state"
              example: "completed"

    action_payload:
      type: object
      required: true
      description: "Action to execute when triggered"
      properties:
        action_type:
          type: string
          enum: ["notification", "tool_call", "habit_trigger", "custom"]
          description: "Action category"

        notification_text:
          type: string
          max_length: 500
          description: "Notification message (if action_type=notification)"
          example: "Reminder: Emma's soccer practice at 10am"

        tool_name:
          type: string
          description: "Tool to invoke (if action_type=tool_call)"

        tool_parameters:
          type: object
          additionalProperties: true
          description: "Tool parameters (if action_type=tool_call)"

        habit_id:
          type: string
          format: uuid
          description: "Habit to trigger (if action_type=habit_trigger)"

    priority:
      type: integer
      min: 1
      max: 10
      default: 5
      description: "Intention priority (1=lowest, 10=highest)"

    interference_control:
      type: string
      enum: ["allow_defer", "force_execute"]
      default: "allow_defer"
      description: |
        Conflict resolution strategy:
        - allow_defer: Can be deferred if higher-priority intention conflicts
        - force_execute: Must execute at trigger time

    expiry_ts:
      type: string
      format: iso8601
      required: false
      description: "Intention expiry timestamp (auto-delete after)"
      example: "2025-10-25T23:59:59Z"

    recurrence:
      type: object
      required: false
      description: "Recurrence pattern (for repeating reminders)"
      properties:
        frequency:
          type: string
          enum: ["daily", "weekly", "monthly", "custom"]

        interval:
          type: integer
          description: "Recurrence interval (e.g., every 2 days)"

        end_date:
          type: string
          format: iso8601
          description: "Recurrence end date"

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "201":
      description: "Intention created and monitoring activated"
      payload:
        intention_id:
          type: string
          format: uuid
          description: "Unique intention identifier"
          example: "1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e"

        trigger_scheduled:
          type: boolean
          description: "Whether trigger successfully scheduled"
          example: true

        monitoring_active:
          type: boolean
          description: "Whether cue monitoring is active"
          example: true

        priority_assigned:
          type: integer
          description: "Final assigned priority (after conflict resolution)"
          example: 5

        next_trigger_time:
          type: string
          format: iso8601
          description: "Next expected trigger time (if time_based)"
          example: "2025-10-20T15:30:00Z"

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail"
          example: "2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f"

    "400":
      description: "Invalid intention specification"
      payload:
        error:
          type: string
          enum: ["invalid_intention_type", "invalid_trigger_spec", "invalid_action_payload", "invalid_priority"]

        details:
          type: string

    "401":
      description: "Unauthorized - missing or invalid authentication"

    "403":
      description: "Forbidden - insufficient capability (requires SET_PROSPECTIVE_MEMORY)"
      payload:
        required_capability:
          type: string
          example: "SET_PROSPECTIVE_MEMORY"

    "409":
      description: "Conflict - duplicate intention or time conflict"
      payload:
        conflicting_intention_id:
          type: string
          format: uuid

    "429":
      description: "Rate limited - prospective memory quota exceeded"
      payload:
        retry_after_ms:
          type: integer

    "500":
      description: "K0 internal error during intention creation"
      payload:
        error:
          type: string
          enum: ["storage_failed", "scheduler_unavailable"]

    "504":
      description: "Gateway timeout - intention creation exceeded 300ms budget"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Time-based reminder (absolute)"
    request:
      envelope:
        port_id: "P05"
        command_type: "prospective_memory_set"
        cognitive_trace_id: "3b4c5d6e-7f8a-9b0c-1d2e-3f4a5b6c7d8e"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "SET_PROSPECTIVE_MEMORY"
      payload:
        intention_type: "time_based"
        trigger_spec:
          timestamp: "2025-10-20T15:30:00Z"
        action_payload:
          action_type: "notification"
          notification_text: "Reminder: Emma's soccer practice at 10am tomorrow"
        priority: 7
        interference_control: "allow_defer"
        expiry_ts: "2025-10-21T00:00:00Z"

    response:
      status: 201
      payload:
        intention_id: "1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e"
        trigger_scheduled: true
        monitoring_active: true
        priority_assigned: 7
        next_trigger_time: "2025-10-20T15:30:00Z"
        receipt_id: "2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f"

  - name: "Event-based trigger (location)"
    request:
      envelope:
        port_id: "P05"
        command_type: "prospective_memory_set"
        cognitive_trace_id: "4c5d6e7f-8a9b-0c1d-2e3f-4a5b6c7d8e9f"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "AMBER"
        capability: "SET_PROSPECTIVE_MEMORY"
      payload:
        intention_type: "event_based"
        trigger_spec:
          event_pattern: "$.event_type == 'user.location.home_arrival'"
        action_payload:
          action_type: "habit_trigger"
          habit_id: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"
        priority: 6
        interference_control: "allow_defer"

    response:
      status: 201
      payload:
        intention_id: "3d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f8a"
        trigger_scheduled: true
        monitoring_active: true
        priority_assigned: 6
        receipt_id: "4e5f6a7b-8c9d-0e1f-2a3b-4c5d6e7f8a9b"

  - name: "Recurring reminder (weekly)"
    request:
      envelope:
        port_id: "P05"
        command_type: "prospective_memory_set"
        cognitive_trace_id: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "SET_PROSPECTIVE_MEMORY"
      payload:
        intention_type: "time_based"
        trigger_spec:
          timestamp: "2025-10-20T09:00:00Z"
        action_payload:
          action_type: "notification"
          notification_text: "Weekly planning session"
        priority: 8
        recurrence:
          frequency: "weekly"
          interval: 1
          end_date: "2025-12-31T23:59:59Z"

    response:
      status: 201
      payload:
        intention_id: "6e7f8a9b-0c1d-2e3f-4a5b-6c7d8e9f0a1b"
        trigger_scheduled: true
        monitoring_active: true
        priority_assigned: 8
        next_trigger_time: "2025-10-20T09:00:00Z"
        receipt_id: "7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c"

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "intention_formation"
      description: |
        Validate trigger_spec, parse action_payload
        Calculate trigger time (for time_based) or register event pattern

    - step: "cue_monitoring_registration"
      description: |
        Register trigger with appropriate monitor:
        - time_based: timer service (st_reminder_ticks)
        - event_based: event bus subscriber
        - activity_based: workflow state tracker

    - step: "priority_management"
      description: |
        Check for conflicts with existing intentions
        Apply interference_control policy
        Resolve priority conflicts (defer or override)

    - step: "storage"
      description: |
        Store intention in st_reminders
        Store recurrence pattern in st_reminder_schedule

    - step: "monitoring_activation"
      description: |
        Activate background monitoring process
        For time_based: schedule timer tick
        For event_based: subscribe to event stream

    - step: "receipt_issue"
      description: "Issue receipt for audit trail"

  trigger_execution:
    description: "When trigger conditions met:"
    steps:
      - "Detect cue (timer fires, event matches, activity completes)"
      - "Retrieve intention from st_reminders"
      - "Validate priority (check for higher-priority conflicts)"
      - "Execute action via P04 (Arbitration pipeline)"
      - "Update intention state (mark triggered, reschedule if recurring)"
      - "Emit feedback to P06 (Learning pipeline)"

  storage_targets:
    - "st_reminders" # Intention storage
    - "st_reminder_ticks" # Timer scheduling
    - "st_reminder_schedule" # Recurrence patterns
    - "st_receipts" # Receipt storage

  events_emitted:
    - "infra.prospective.intention_formed"
    - "infra.prospective.cue_monitoring_active"
    - "infra.prospective.cue_detected"
    - "infra.prospective.triggered"
    - "infra.prospective.executed"
    - "infra.prospective.expired"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "intention_type must be [time_based|event_based|activity_based]"
  - rule: "trigger_spec structure must match intention_type"
  - rule: "action_payload.action_type must be [notification|tool_call|habit_trigger|custom]"
  - rule: "priority: 1-10"
  - rule: "if time_based then trigger_spec.timestamp OR trigger_spec.relative_offset_ms required"
  - rule: "if recurrence provided then frequency must be [daily|weekly|monthly|custom]"
  - rule: "expiry_ts must be in future"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_prospective_memory_active_count"
      type: "gauge"
      labels: ["intention_type"]
      description: "Number of active prospective memories"

    - name: "k0_prospective_memory_triggered_total"
      type: "counter"
      labels: ["intention_type", "action_type"]
      description: "Total prospective memories triggered"

    - name: "k0_prospective_memory_expired_total"
      type: "counter"
      labels: ["intention_type"]
      description: "Total prospective memories expired"

    - name: "k0_prospective_memory_latency_ms"
      type: "histogram"
      labels: ["intention_type"]
      buckets: [10, 50, 100, 500, 1000, 5000]
      description: "Latency from trigger detection to execution"

    - name: "k0_prospective_memory_conflicts_total"
      type: "counter"
      labels: ["resolution"]
      description: "Total intention conflicts (resolution: deferred|overridden)"

  traces:
    span_name: "k0_prospective.intention_lifecycle"
    attributes:
      - "intention_id"
      - "intention_type"
      - "priority"
      - "monitoring_active"

  logs:
    - event: "infra.prospective.intention_formed"
      level: "INFO"
      fields: ["intention_id", "intention_type", "trigger_time"]

    - event: "infra.prospective.triggered"
      level: "INFO"
      fields: ["intention_id", "trigger_latency_ms", "action_type"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    p50: "30ms"
    p95: "75ms"
    p99: "150ms"
    timeout: "300ms"

  throughput:
    target_qps: 50
    burst_capacity: 200

  monitoring_overhead:
    description: "Background cue monitoring must be lightweight"
    target_cpu: "< 1% per 1000 active intentions"
    target_memory: "< 10MB per 1000 active intentions"

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Bearer token (JWT)"
    required: true

  authorization:
    capability_required: "SET_PROSPECTIVE_MEMORY"
    session_scoped: true

  privacy_bands:
    GREEN: "Standard storage, cloud sync"
    AMBER: "PII detection in action_payload, limited sync"
    RED: "Local-only storage, encrypted at rest"

  audit_trail:
    receipt_id: "Issued for all intention creations"
    retention: "90 days"

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research:
  prospective_memory:
    description: "Future-oriented memory for delayed intentions"
    citations:
      - "Einstein & McDaniel (1990) - Normal aging and prospective memory"
      - "Graf & Uttl (2001) - Prospective memory: A new focus for research"

  cue_monitoring:
    description: "Continuous scanning for trigger conditions"
    citations:
      - "Smith (2003) - The cost of remembering to remember in event-based prospective memory"
      - "McDaniel & Einstein (2000) - Strategic and automatic processes in prospective memory retrieval"
