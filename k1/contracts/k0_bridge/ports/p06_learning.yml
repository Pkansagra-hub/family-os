# P06 Learning - Adaptive Learning Pipeline
# Port: P06 (K1 → K0 learning signals)
# Event semantics: K1 submits feedback signals for adaptive intelligence
# Performance budget: 50ms P95, 200ms timeout

version: "1.0"
port_id: "P06"
port_name: "Learning"
direction: "K1_TO_K0"
semantics: "event"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0030"  # Learning Loop Architecture
  - "ADR-0031"  # Reward Prediction & TD-Learning
  - "ADR-0032"  # Neuromodulation System
  - "ADR-0044"  # HTTP/2 Transport
  - "ADR-0130"  # Feedback Signal Weighting

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P06"
      description: "Port identifier for learning signals"

    command_type:
      type: string
      value: "learning_signal"
      description: "Event type for adaptive learning feedback"

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing"
      example: "4c5d6e7f-8a9b-0c1d-2e3f-4a5b6c7d8e9f"

    session_id:
      type: string
      format: uuid
      required: true
      description: "Session identifier for context isolation"
      example: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"

    privacy_band:
      type: string
      enum: ["GREEN", "AMBER", "RED"]
      required: true
      description: |
        Privacy classification:
        - GREEN: Learning signals stored, cloud aggregation
        - AMBER: Limited signal storage, local-only aggregation
        - RED: Ephemeral signals only, no persistence

    capability:
      type: string
      value: "SUBMIT_LEARNING_SIGNAL"
      required: true
      description: "Required K0 capability for learning signal submission"

  payload:
    signal_type:
      type: string
      enum: ["explicit_feedback", "implicit_feedback", "behavioral_observation", "reward_prediction_error"]
      required: true
      description: |
        Learning signal type with different weights:
        - explicit_feedback: User corrections, thumbs up/down (weight: 1.0)
        - implicit_feedback: Acceptance/rejection of suggestions (weight: 0.5)
        - behavioral_observation: Usage patterns, engagement (weight: 0.2)
        - reward_prediction_error: Unexpected outcomes, surprise

    target_memory_id:
      type: string
      format: uuid
      required: false
      description: "Memory ID to associate feedback with (if applicable)"
      example: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"

    target_action_id:
      type: string
      required: false
      description: "Action ID to associate feedback with (if applicable)"
      example: "action_123"

    feedback_value:
      type: number
      min: -1.0
      max: 1.0
      required: true
      description: |
        Feedback valence:
        - -1.0: Strong negative (error, rejection)
        - 0.0: Neutral
        - +1.0: Strong positive (correct, acceptance)
      example: 0.8

    learning_context:
      type: object
      required: true
      description: "Context describing what was learned"
      properties:
        learning_type:
          type: string
          enum: ["procedural", "declarative", "reinforcement", "social", "meta_learning"]
          description: "Category of learning"

        domain:
          type: string
          description: "Learning domain (e.g., 'task_planning', 'habit_formation')"
          example: "task_planning"

        description:
          type: string
          max_length: 500
          description: "Human-readable learning description"
          example: "User preferred morning routine order changed"

    confidence:
      type: number
      min: 0.0
      max: 1.0
      default: 0.8
      description: "Signal confidence (0.0 = low, 1.0 = high)"

    neuromod_adjustments:
      type: object
      required: false
      description: "Neuromodulation adjustments (expert mode)"
      properties:
        learning_rate_delta:
          type: number
          min: -0.5
          max: 0.5
          description: "Adjustment to learning rate (±0.5)"
          example: 0.1

        consolidation_boost:
          type: boolean
          description: "Prioritize for consolidation (P03)"
          example: true

        attention_bias:
          type: string
          enum: ["increase", "decrease", "neutral"]
          description: "Adjust attention to similar patterns"

    metadata:
      type: object
      required: false
      description: "Additional signal metadata"
      additionalProperties: true

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "202":
      description: "Learning signal accepted for processing"
      payload:
        signal_id:
          type: string
          format: uuid
          description: "Unique signal identifier"
          example: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"

        learning_applied:
          type: boolean
          description: "Whether learning update was immediately applied"
          example: true

        model_updated:
          type: array
          items:
            type: string
          description: "Models updated by this signal"
          example: ["habit_policy", "planner_model"]

        consolidation_scheduled:
          type: boolean
          description: "Whether consolidation job queued"
          example: false

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail"
          example: "6e7f8a9b-0c1d-2e3f-4a5b-6c7d8e9f0a1b"

    "400":
      description: "Invalid learning signal"
      payload:
        error:
          type: string
          enum: ["invalid_signal_type", "invalid_feedback_value", "invalid_confidence", "invalid_context"]

        details:
          type: string

    "401":
      description: "Unauthorized - missing or invalid authentication"

    "403":
      description: "Forbidden - insufficient capability (requires SUBMIT_LEARNING_SIGNAL)"
      payload:
        required_capability:
          type: string
          example: "SUBMIT_LEARNING_SIGNAL"

    "429":
      description: "Rate limited - learning signal quota exceeded"
      payload:
        retry_after_ms:
          type: integer

    "500":
      description: "K0 internal error during learning signal processing"
      payload:
        error:
          type: string
          enum: ["model_update_failed", "storage_failed"]

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Explicit feedback on task suggestion"
    request:
      envelope:
        port_id: "P06"
        command_type: "learning_signal"
        cognitive_trace_id: "4c5d6e7f-8a9b-0c1d-2e3f-4a5b6c7d8e9f"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "SUBMIT_LEARNING_SIGNAL"
      payload:
        signal_type: "explicit_feedback"
        target_action_id: "task_suggestion_42"
        feedback_value: 0.9
        learning_context:
          learning_type: "reinforcement"
          domain: "task_planning"
          description: "User accepted planner suggestion with high satisfaction"
        confidence: 1.0
        neuromod_adjustments:
          consolidation_boost: true

    response:
      status: 202
      payload:
        signal_id: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"
        learning_applied: true
        model_updated: ["planner_model", "preference_model"]
        consolidation_scheduled: true
        receipt_id: "6e7f8a9b-0c1d-2e3f-4a5b-6c7d8e9f0a1b"

  - name: "Implicit feedback on habit execution"
    request:
      envelope:
        port_id: "P06"
        command_type: "learning_signal"
        cognitive_trace_id: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "SUBMIT_LEARNING_SIGNAL"
      payload:
        signal_type: "implicit_feedback"
        target_action_id: "habit_morning_routine"
        feedback_value: 0.5
        learning_context:
          learning_type: "procedural"
          domain: "habit_formation"
          description: "User completed habit without explicit prompt"
        confidence: 0.7

    response:
      status: 202
      payload:
        signal_id: "6e7f8a9b-0c1d-2e3f-4a5b-6c7d8e9f0a1b"
        learning_applied: true
        model_updated: ["habit_policy"]
        consolidation_scheduled: false
        receipt_id: "7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c"

  - name: "Reward prediction error"
    request:
      envelope:
        port_id: "P06"
        command_type: "learning_signal"
        cognitive_trace_id: "6e7f8a9b-0c1d-2e3f-4a5b-6c7d8e9f0a1b"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "SUBMIT_LEARNING_SIGNAL"
      payload:
        signal_type: "reward_prediction_error"
        feedback_value: -0.6
        learning_context:
          learning_type: "reinforcement"
          domain: "decision_making"
          description: "Expected positive outcome, received negative (surprise)"
        confidence: 0.9
        neuromod_adjustments:
          learning_rate_delta: 0.2
          attention_bias: "increase"

    response:
      status: 202
      payload:
        signal_id: "7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c"
        learning_applied: true
        model_updated: ["value_estimator", "decision_model"]
        consolidation_scheduled: false
        receipt_id: "8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d"

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "signal_validation"
      description: "Validate signal_type, feedback_value, confidence"

    - step: "signal_weighting"
      description: |
        Apply weight by signal type:
        - explicit_feedback: 1.0
        - implicit_feedback: 0.5
        - behavioral_observation: 0.2
        - reward_prediction_error: computed (TD-learning)

    - step: "feedback_aggregation"
      description: |
        Aggregate signals over time window (e.g., last 10 signals)
        Compute running average, variance

    - step: "reward_prediction"
      description: |
        Update value estimates (V(s), Q(s,a))
        Compute prediction error: δ = r + γV(s') - V(s)
        TD-learning update: V(s) ← V(s) + α·δ

    - step: "model_adaptation"
      description: |
        Update models based on feedback:
        - Habit policy: adjust execution probabilities
        - Planner model: update action value estimates
        - Self-model: adjust preference models

    - step: "consolidation_boost"
      description: |
        If consolidation_boost=true or |δ| > threshold:
        Queue memory for prioritized consolidation (P03)

    - step: "neuromodulation"
      description: |
        Apply neuromod_adjustments:
        - learning_rate_delta: adjust α for future updates
        - attention_bias: modify retrieval scores (P01)

    - step: "storage"
      description: "Store signal in st_learning_signals (if privacy_band != RED)"

    - step: "receipt_issue"
      description: "Issue receipt for audit trail"

  storage_targets:
    - "st_learning_signals" # Signal history
    - "st_habits" # Habit policy updates
    - "st_planner_models" # Planner model updates
    - "st_self_preferences" # Preference updates
    - "st_value_estimates" # V(s), Q(s,a) tables

  events_emitted:
    - "cognitive.learning.outcome.received"
    - "cognitive.learning.habit.updated"
    - "cognitive.learning.planner.updated"
    - "cognitive.learning.self_model.updated"
    - "cognitive.learning.prediction_error.computed"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "signal_type must be [explicit_feedback|implicit_feedback|behavioral_observation|reward_prediction_error]"
  - rule: "feedback_value: -1.0 to 1.0"
  - rule: "confidence: 0.0 to 1.0"
  - rule: "learning_context.learning_type must be [procedural|declarative|reinforcement|social|meta_learning]"
  - rule: "if neuromod_adjustments provided then learning_rate_delta: -0.5 to 0.5"
  - rule: "target_memory_id OR target_action_id should be provided (at least one)"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_learning_signals_total"
      type: "counter"
      labels: ["signal_type", "learning_type"]
      description: "Total learning signals received"

    - name: "k0_learning_signal_latency_ms"
      type: "histogram"
      labels: ["signal_type"]
      buckets: [5, 10, 25, 50, 100, 200]
      description: "Learning signal processing latency"

    - name: "k0_model_updates_total"
      type: "counter"
      labels: ["model_type"]
      description: "Total model updates applied"

    - name: "k0_prediction_error_magnitude"
      type: "histogram"
      buckets: [0.1, 0.3, 0.5, 0.7, 0.9]
      description: "Distribution of prediction error magnitudes"

    - name: "k0_learning_rate_current"
      type: "gauge"
      labels: ["learning_type"]
      description: "Current learning rate (α)"

  traces:
    span_name: "k0_learning.signal_processing"
    attributes:
      - "signal_type"
      - "feedback_value"
      - "models_updated"
      - "consolidation_scheduled"

  logs:
    - event: "cognitive.learning.outcome.received"
      level: "INFO"
      fields: ["signal_id", "signal_type", "feedback_value"]

    - event: "cognitive.learning.model.updated"
      level: "DEBUG"
      fields: ["model_type", "update_magnitude"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    p50: "20ms"
    p95: "50ms"
    p99: "100ms"
    timeout: "200ms"

  throughput:
    target_qps: 100
    burst_capacity: 500

  signal_aggregation:
    window_size: "10 recent signals"
    update_frequency: "immediate for explicit, batched for implicit/behavioral"

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Bearer token (JWT)"
    required: true

  authorization:
    capability_required: "SUBMIT_LEARNING_SIGNAL"
    session_scoped: true

  privacy_bands:
    GREEN: "Signals stored, cloud aggregation enabled"
    AMBER: "Limited signal storage, local-only aggregation"
    RED: "Ephemeral signals only, no persistence"

  audit_trail:
    receipt_id: "Issued for all learning signals"
    retention: "90 days"

  data_protection:
    description: "Learning signals may contain sensitive feedback"
    pii_detection: "Applied to learning_context.description"

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research:
  td_learning:
    description: "Temporal-difference learning for reward prediction"
    citations:
      - "Sutton & Barto (2018) - Reinforcement Learning: An Introduction"
      - "Schultz et al. (1997) - A neural substrate of prediction and reward"

  neuromodulation:
    description: "Dopamine-like signals modulating learning"
    citations:
      - "Doya (2002) - Metalearning and neuromodulation"
      - "Montague et al. (1996) - A framework for mesencephalic dopamine systems"

  feedback_weighting:
    description: "Different signal types with different learning weights"
    citations:
      - "Kluger & DeNisi (1996) - Effects of feedback intervention on performance"
      - "Hattie & Timperley (2007) - The power of feedback"
