# P04 Arbitration - Decision Execution Pipeline (Advisory Boundary)
# Port: P04 (K1 → K0 action execution)
# Command semantics: K1 Intelligence Systems ADVISORY, P04 SOLE executor
# Performance budget: 250ms P95, 1000ms timeout

version: "1.0"
port_id: "P04"
port_name: "Arbitration"
direction: "K1_TO_K0"
semantics: "command"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0018"  # Safety Policy Enforcement
  - "ADR-0020"  # Action Execution Framework
  - "ADR-0021"  # Saga Pattern (rollback support)
  - "ADR-0044"  # HTTP/2 Transport
  - "ADR-0140"  # Habit vs Planning Arbitration

# ============================================================================
# CRITICAL BOUNDARY ENFORCEMENT
# ============================================================================

boundary:
  principle: "ADVISORY ONLY → EXECUTION SEPARATION"
  description: |
    Family Intelligence Systems (D3) emit ADVISORY signals:
    - Agent recommendations (multi-agent negotiation)
    - Planning suggestions (4-stage planner pipeline)
    - Learning signals (feedback loops)

    P04 Arbitration is the SOLE ACTION EXECUTOR:
    - Validates safety constraints
    - Applies policy enforcement
    - Executes approved actions
    - Records audit trail

    NO Intelligence System has direct execution authority.

  rationale: |
    Research: Dual-process theory (Kahneman 2011), cognitive control (Miller & Cohen 2001)
    - System 1 (habits): Fast, automatic, parallel (basal ganglia)
    - System 2 (planning): Slow, deliberative, sequential (prefrontal cortex)
    - Arbitration: Metacognitive monitoring selects action

  enforcement:
    - "All intelligence.advisory.* events must flow through P04"
    - "All tool calls/API requests must be executed via P04"
    - "Capability EXECUTE_ACTION required for all actions"

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P04"
      description: "Port identifier for action execution"

    command_type:
      type: string
      value: "action_execute"
      description: "Command type for action execution"

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing"
      example: "5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d"

    session_id:
      type: string
      format: uuid
      required: true
      description: "Session identifier for multi-turn context"
      example: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"

    privacy_band:
      type: string
      enum: ["GREEN", "AMBER", "RED"]
      required: true
      description: |
        Privacy classification:
        - GREEN: Standard action execution, cloud services allowed
        - AMBER: PII-aware, limited external calls
        - RED: Local-only, no external services

    capability:
      type: string
      enum: ["EXECUTE_ACTION", "EXECUTE_EMERGENCY_ACTION"]
      required: true
      description: |
        Required K0 capability:
        - EXECUTE_ACTION: Standard action execution
        - EXECUTE_EMERGENCY_ACTION: Safety-critical bypass

  payload:
    action_type:
      type: string
      enum: ["habit", "planned", "emergency"]
      required: true
      description: |
        Action type determining arbitration path:
        - habit: Automatic, procedural (fast, basal ganglia)
        - planned: Deliberative, goal-directed (slow, prefrontal cortex)
        - emergency: Immediate safety-critical action

    action_spec:
      type: object
      required: true
      description: "Action specification for execution"
      properties:
        action_id:
          type: string
          description: "Unique action identifier"

        action_category:
          type: string
          enum: ["tool_call", "api_request", "internal_operation"]
          description: "Action category for routing"

        tool_name:
          type: string
          description: "Tool name (if action_category=tool_call)"

        tool_parameters:
          type: object
          additionalProperties: true
          description: "Tool parameters (if action_category=tool_call)"

        api_endpoint:
          type: string
          description: "API endpoint (if action_category=api_request)"

        operation_type:
          type: string
          description: "Operation type (if action_category=internal_operation)"

    advisory_signals:
      type: array
      items:
        type: object
        properties:
          source:
            type: string
            enum: ["agent_fabric", "planner", "learning_loop", "procedural_memory"]
            description: "Advisory signal source"

          confidence:
            type: number
            min: 0.0
            max: 1.0
            description: "Advisory confidence score"

          recommendation:
            type: string
            description: "Recommended action"

      description: "Advisory signals from Intelligence Systems (D3)"

    safety_constraints:
      type: object
      required: true
      description: "Safety validation requirements"
      properties:
        policy_enforcement:
          type: boolean
          default: true
          description: "Enforce ABAC/RBAC policies"

        harm_detection:
          type: boolean
          default: true
          description: "Run harm detection checks"

        rate_limiting:
          type: boolean
          default: true
          description: "Apply rate limits"

        sandbox_required:
          type: boolean
          default: false
          description: "Execute in sandbox (WASM/MCP isolation)"

    rollback_plan:
      type: object
      required: false
      description: "Saga pattern rollback specification"
      properties:
        compensation_action:
          type: string
          description: "Compensating action for rollback"

        rollback_timeout_ms:
          type: integer
          default: 5000
          description: "Rollback timeout in milliseconds"

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "200":
      description: "Action executed successfully"
      payload:
        action_id:
          type: string
          description: "Action identifier (echo)"
          example: "action_123"

        execution_status:
          type: string
          enum: ["completed", "partial_success"]
          description: "Execution outcome"

        outcome:
          type: object
          description: "Action execution results"
          additionalProperties: true

        safety_checks_passed:
          type: array
          items:
            type: string
          description: "Safety checks that passed"
          example: ["policy_enforcement", "harm_detection", "rate_limiting"]

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail"
          example: "8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d"

        rollback_available:
          type: boolean
          description: "Whether rollback is available (saga pattern)"

        execution_latency_ms:
          type: integer
          description: "Action execution latency"
          example: 187

    "202":
      description: "Action accepted for async execution"
      payload:
        action_id:
          type: string
          description: "Action identifier"

        async_job_id:
          type: string
          format: uuid
          description: "Job ID for tracking"

        estimated_completion_ms:
          type: integer
          description: "Estimated completion time"

    "400":
      description: "Invalid action specification"
      payload:
        error:
          type: string
          enum: ["invalid_action_type", "invalid_tool_name", "invalid_parameters"]

        details:
          type: string

    "401":
      description: "Unauthorized - missing or invalid authentication"

    "403":
      description: "Forbidden - insufficient capability or policy violation"
      payload:
        required_capability:
          type: string
          example: "EXECUTE_ACTION"

        policy_violation:
          type: string
          description: "Policy that blocked execution"

    "409":
      description: "Conflict - action already in progress"
      payload:
        conflicting_action_id:
          type: string

    "429":
      description: "Rate limited - action quota exceeded"
      payload:
        retry_after_ms:
          type: integer

    "500":
      description: "Execution error"
      payload:
        error:
          type: string
          enum: ["tool_execution_failed", "api_call_failed", "internal_error"]

        details:
          type: string

        rollback_initiated:
          type: boolean
          description: "Whether automatic rollback started"

    "504":
      description: "Gateway timeout - action exceeded 1000ms budget"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Habit-based action execution"
    request:
      envelope:
        port_id: "P04"
        command_type: "action_execute"
        cognitive_trace_id: "5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "EXECUTE_ACTION"
      payload:
        action_type: "habit"
        action_spec:
          action_id: "morning_routine_step_2"
          action_category: "internal_operation"
          operation_type: "log_habit_completion"
        advisory_signals:
          - source: "procedural_memory"
            confidence: 0.95
            recommendation: "execute_habit"
        safety_constraints:
          policy_enforcement: true
          harm_detection: true
          rate_limiting: true

    response:
      status: 200
      payload:
        action_id: "morning_routine_step_2"
        execution_status: "completed"
        outcome:
          habit_logged: true
          streak_updated: 15
        safety_checks_passed: ["policy_enforcement", "harm_detection", "rate_limiting"]
        receipt_id: "8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d"
        rollback_available: false
        execution_latency_ms: 87

  - name: "Planned action with rollback"
    request:
      envelope:
        port_id: "P04"
        command_type: "action_execute"
        cognitive_trace_id: "6b7c8d9e-0f1a-2b3c-4d5e-6f7a8b9c0d1e"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "EXECUTE_ACTION"
      payload:
        action_type: "planned"
        action_spec:
          action_id: "send_email_to_sarah"
          action_category: "tool_call"
          tool_name: "email_sender"
          tool_parameters:
            recipient: "sarah@example.com"
            subject: "Q4 Roadmap Follow-up"
            body: "Per our discussion, API v2 migration is top priority."
        advisory_signals:
          - source: "planner"
            confidence: 0.87
            recommendation: "execute_planned_action"
          - source: "agent_fabric"
            confidence: 0.82
            recommendation: "approve_with_monitoring"
        safety_constraints:
          policy_enforcement: true
          harm_detection: true
          rate_limiting: true
        rollback_plan:
          compensation_action: "send_cancellation_email"
          rollback_timeout_ms: 5000

    response:
      status: 200
      payload:
        action_id: "send_email_to_sarah"
        execution_status: "completed"
        outcome:
          email_sent: true
          message_id: "msg_789"
        safety_checks_passed: ["policy_enforcement", "harm_detection", "rate_limiting"]
        receipt_id: "9b0c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e"
        rollback_available: true
        execution_latency_ms: 245

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "envelope_validation"
      description: "Validate envelope structure, capability check"

    - step: "safety_validation"
      description: |
        Policy enforcement: ABAC/RBAC checks
        Harm detection: Safety classifier (P18 pipeline)
        Rate limiting: QoS governance (P17 pipeline)

    - step: "habit_evaluation"
      description: |
        Query st_procedures, st_habits for matching patterns
        Calculate habit confidence (frequency, recency, context match)
        Fast path: habit confidence > 0.85 → execute immediately

    - step: "planning_evaluation"
      description: |
        Retrieve advisory signals from intelligence.advisory.* events
        Aggregate agent recommendations, planner suggestions
        Slow path: deliberative evaluation, metacognitive monitoring

    - step: "arbitration"
      description: |
        Metacognitive control: select action (habit vs planning)
        Conflict resolution: if both compete, planning wins (override)
        Emergency override: immediate execution for safety-critical

    - step: "action_execution"
      description: |
        Route to appropriate executor:
        - Tool calls: MCP Gateway, Tool Runner
        - API requests: External API Gateway
        - Internal operations: K0 internal handlers

    - step: "outcome_monitoring"
      description: |
        Record execution results
        Emit feedback signals to Learning Loop (P06)
        Update habit reinforcement

    - step: "rollback_support"
      description: |
        Saga pattern: if execution fails, invoke compensation_action
        Distributed rollback coordination

    - step: "receipt_issue"
      description: "Issue receipt for audit trail"

  storage_targets:
    - "st_procedures" # Habit templates
    - "st_habits" # Habit logs
    - "st_action_log" # Execution audit trail
    - "st_receipts" # Receipt storage (Epic 2.12)

  events_emitted:
    - "cognitive.arbitration.decision.requested"
    - "cognitive.arbitration.habit.evaluated"
    - "cognitive.arbitration.planner.evaluated"
    - "cognitive.arbitration.decision.made"
    - "cognitive.arbitration.action.executed"
    - "cognitive.arbitration.action.failed"
    - "cognitive.arbitration.rollback.initiated"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "action_type must be [habit|planned|emergency]"
  - rule: "action_spec.action_category must be [tool_call|api_request|internal_operation]"
  - rule: "advisory_signals: at least one signal required for planned actions"
  - rule: "safety_constraints.policy_enforcement must be true for AMBER/RED bands"
  - rule: "capability EXECUTE_ACTION required (EXECUTE_EMERGENCY_ACTION for emergency)"
  - rule: "rollback_plan optional but recommended for distributed actions"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_action_execution_total"
      type: "counter"
      labels: ["action_type", "status", "action_category"]
      description: "Total action executions"

    - name: "k0_action_latency_ms"
      type: "histogram"
      labels: ["action_type", "status"]
      buckets: [10, 50, 100, 250, 500, 1000]
      description: "Action execution latency"

    - name: "k0_action_rollback_total"
      type: "counter"
      labels: ["action_type", "reason"]
      description: "Total rollbacks initiated"

    - name: "k0_action_safety_blocks_total"
      type: "counter"
      labels: ["policy_type", "action_category"]
      description: "Total actions blocked by safety policies"

    - name: "k0_habit_vs_planning_decisions"
      type: "counter"
      labels: ["winner"]
      description: "Arbitration outcomes (habit vs planning)"

  traces:
    span_name: "k0_arbitration.action_execute"
    attributes:
      - "action_type"
      - "action_category"
      - "advisory_sources"
      - "safety_checks_passed"
      - "rollback_available"

  logs:
    - event: "cognitive.arbitration.decision.requested"
      level: "INFO"
      fields: ["cognitive_trace_id", "action_type", "advisory_signals_count"]

    - event: "cognitive.arbitration.decision.made"
      level: "INFO"
      fields: ["action_id", "selected_path", "confidence"]

    - event: "cognitive.arbitration.action.executed"
      level: "INFO"
      fields: ["action_id", "status", "latency_ms"]

    - event: "cognitive.arbitration.rollback.initiated"
      level: "WARN"
      fields: ["action_id", "reason", "compensation_action"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    p50: "100ms"
    p95: "250ms"
    p99: "500ms"
    timeout: "1000ms"

  fast_path:
    description: "Habit-based actions (basal ganglia analog)"
    target: "50ms P95"

  slow_path:
    description: "Planned actions (prefrontal cortex analog)"
    target: "250ms P95"

  throughput:
    target_qps: 50
    burst_capacity: 200

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Bearer token (JWT)"
    required: true

  authorization:
    capability_required: "EXECUTE_ACTION or EXECUTE_EMERGENCY_ACTION"
    policy_enforcement: "ABAC/RBAC validation before execution"

  audit_trail:
    receipt_id: "Issued for all executions"
    retention: "90 days"

  privacy_bands:
    GREEN: "External API calls allowed"
    AMBER: "Limited external calls, PII redaction"
    RED: "Local-only execution, no external services"

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research:
  dual_process_theory:
    description: "System 1 (habit) vs System 2 (planning)"
    citations:
      - "Kahneman (2011) - Thinking, Fast and Slow"
      - "Daw et al. (2005) - Uncertainty-based competition between prefrontal and dorsolateral striatal systems"

  cognitive_control:
    description: "Metacognitive monitoring and action selection"
    citations:
      - "Miller & Cohen (2001) - An integrative theory of prefrontal cortex function"
      - "Botvinick et al. (2001) - Conflict monitoring and cognitive control"

  habit_formation:
    description: "Basal ganglia procedural learning"
    citations:
      - "Graybiel (2008) - Habits, rituals, and the evaluative brain"
      - "Dolan & Dayan (2013) - Goals and habits in the brain"
