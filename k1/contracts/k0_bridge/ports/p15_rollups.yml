# P15 Rollups - Data Aggregation & Summaries Pipeline
# Port: P15 (K0_INTERNAL)
# Background job semantics: Data aggregation, summarization, trend analysis
# Performance budget: N/A (async aggregation, minutes to complete)

version: "1.0"
port_id: "P15"
port_name: "Rollups"
direction: "K0_INTERNAL"
semantics: "background_job"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0120"  # Rollup Strategy
  - "ADR-0121"  # LLM Summarization
  - "ADR-0122"  # Trend Detection
  - "ADR-0044"  # HTTP/2 Transport

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P15"
      description: "Port identifier for rollup operations"

    command_type:
      type: string
      enum: ["rollup_request", "rollup_status", "rollup_query"]
      required: true
      description: |
        Rollup operation type:
        - rollup_request: Trigger data aggregation/summarization
        - rollup_status: Query rollup job status
        - rollup_query: Retrieve existing rollup summaries

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing"
      example: "1d2e3f4a-5b6c-7d8e-9f0a-1b2c3d4e5f6a"

    capability:
      type: string
      value: "TRIGGER_ROLLUP"
      required: true
      description: "Required K0 capability for rollup operations"

  payload:
    rollup_type:
      type: string
      enum: ["summary", "statistics", "trends"]
      required: true
      description: |
        Rollup type:
        - summary: Natural language summary of events (LLM-generated)
        - statistics: Counts, averages, distributions (SQL aggregation)
        - trends: Time-series patterns, forecasts (ML-based)

    time_window:
      type: string
      enum: ["daily", "weekly", "monthly", "custom"]
      required: true
      description: |
        Time window for aggregation:
        - daily: 24-hour rollup (midnight-to-midnight)
        - weekly: 7-day rollup (Sunday-to-Saturday)
        - monthly: Calendar month rollup
        - custom: User-defined start/end timestamps

    start_ts:
      type: string
      format: iso8601
      required: false
      description: "Start timestamp (if time_window=custom)"

    end_ts:
      type: string
      format: iso8601
      required: false
      description: "End timestamp (if time_window=custom)"

    memory_types:
      type: array
      items:
        type: string
        enum: ["episodic", "semantic", "procedural", "all"]
      default: ["episodic"]
      description: "Memory types to include in rollup"

    summary_model:
      type: string
      enum: ["gpt-4-turbo", "claude-3-haiku", "local-llama-3-8b"]
      default: "claude-3-haiku"
      description: |
        LLM model for summarization (if rollup_type=summary):
        - gpt-4-turbo: High-quality summaries (higher cost, higher latency)
        - claude-3-haiku: Fast summaries (lower cost, lower latency)
        - local-llama-3-8b: Privacy-friendly local summarization

    job_id:
      type: string
      format: uuid
      required: false
      description: "Job ID (for rollup_status)"

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "202":
      description: "Rollup job accepted (async processing)"
      payload:
        job_id:
          type: string
          format: uuid
          description: "Unique rollup job identifier"
          example: "rollup_job_123"

        rollup_type:
          type: string
          description: "Echo of rollup type"
          example: "summary"

        time_window:
          type: string
          description: "Echo of time window"
          example: "weekly"

        memories_included_count:
          type: integer
          description: "Number of memories in time window"
          example: 1500

        estimated_duration_ms:
          type: integer
          description: "Estimated completion time"
          example: 120000

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail"

    "200":
      description: "Rollup completed or query successful"
      payload:
        rollup_id:
          type: string
          format: uuid
          description: "Rollup identifier"

        rollup_type:
          type: string
          description: "Rollup type"

        time_window:
          type: string
          description: "Time window"

        summary:
          type: string
          required: false
          description: "Natural language summary (if rollup_type=summary)"
          example: "This week, user attended 3 meetings, completed 5 tasks, and spent 2 hours exercising. Key highlights: Completed Q4 planning, launched new feature, improved fitness routine."

        statistics:
          type: object
          required: false
          description: "Statistical aggregates (if rollup_type=statistics)"
          example:
            meetings_attended: 3
            tasks_completed: 5
            exercise_hours: 2.0
            messages_sent: 127
            memories_created: 89

        trends:
          type: object
          required: false
          description: "Trend analysis (if rollup_type=trends)"
          properties:
            trend_direction:
              type: string
              enum: ["increasing", "decreasing", "stable"]

            change_percentage:
              type: number
              description: "Change vs previous window"

            forecast:
              type: object
              description: "Next window forecast"

    "400":
      description: "Invalid rollup request"
      payload:
        error:
          type: string
          enum: ["invalid_rollup_type", "invalid_time_window", "invalid_date_range", "invalid_summary_model"]

        details:
          type: string

    "500":
      description: "Rollup processing error"
      payload:
        error:
          type: string
          enum: ["aggregation_failed", "summarization_failed", "trend_analysis_failed"]

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Weekly summary with GPT-4 Turbo"
    request:
      envelope:
        port_id: "P15"
        command_type: "rollup_request"
        cognitive_trace_id: "1d2e3f4a-5b6c-7d8e-9f0a-1b2c3d4e5f6a"
        capability: "TRIGGER_ROLLUP"
      payload:
        rollup_type: "summary"
        time_window: "weekly"
        memory_types: ["episodic", "semantic"]
        summary_model: "gpt-4-turbo"

    response:
      status: 202
      payload:
        job_id: "rollup_job_123"
        rollup_type: "summary"
        time_window: "weekly"
        memories_included_count: 1500
        estimated_duration_ms: 120000
        receipt_id: "2e3f4a5b-6c7d-8e9f-0a1b-2c3d4e5f6a7b"

  - name: "Daily statistics rollup"
    request:
      envelope:
        port_id: "P15"
        command_type: "rollup_request"
        cognitive_trace_id: "2e3f4a5b-6c7d-8e9f-0a1b-2c3d4e5f6a7b"
        capability: "TRIGGER_ROLLUP"
      payload:
        rollup_type: "statistics"
        time_window: "daily"
        memory_types: ["all"]

    response:
      status: 202
      payload:
        job_id: "rollup_job_124"
        rollup_type: "statistics"
        time_window: "daily"
        memories_included_count: 250
        estimated_duration_ms: 5000
        receipt_id: "3f4a5b6c-7d8e-9f0a-1b2c-3d4e5f6a7b8c"

  - name: "Monthly trend analysis"
    request:
      envelope:
        port_id: "P15"
        command_type: "rollup_request"
        cognitive_trace_id: "3f4a5b6c-7d8e-9f0a-1b2c-3d4e5f6a7b8c"
        capability: "TRIGGER_ROLLUP"
      payload:
        rollup_type: "trends"
        time_window: "monthly"
        memory_types: ["episodic"]

    response:
      status: 202
      payload:
        job_id: "rollup_job_125"
        rollup_type: "trends"
        time_window: "monthly"
        memories_included_count: 8000
        estimated_duration_ms: 300000
        receipt_id: "4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d"

  - name: "Query existing weekly summary"
    request:
      envelope:
        port_id: "P15"
        command_type: "rollup_query"
        cognitive_trace_id: "4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d"
        capability: "TRIGGER_ROLLUP"
      payload:
        rollup_type: "summary"
        time_window: "weekly"

    response:
      status: 200
      payload:
        rollup_id: "rollup_123"
        rollup_type: "summary"
        time_window: "weekly"
        summary: "This week, user attended 3 meetings, completed 5 tasks, and spent 2 hours exercising. Key highlights: Completed Q4 planning, launched new feature, improved fitness routine."

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "time_window_resolution"
      description: |
        Resolve time window to absolute timestamps:
        - daily: previous 24 hours
        - weekly: previous 7 days (Sunday-Saturday)
        - monthly: previous calendar month
        - custom: user-provided start_ts/end_ts

    - step: "memory_query"
      description: |
        Fetch all memories in time window:
        - Filter by memory_types (episodic, semantic, procedural)
        - Order by timestamp
        - Apply privacy band filters (GREEN, AMBER only)

    - step: "summary_generation"
      description: |
        If rollup_type=summary:
        - Concatenate memory content (max 10K tokens)
        - LLM call: "Summarize the following events from this [time_window]..."
        - Post-process: extract key highlights, themes, achievements

    - step: "statistics_computation"
      description: |
        If rollup_type=statistics:
        - SQL aggregation: COUNT, SUM, AVG, STDDEV
        - Group by: memory_type, tags, privacy_band
        - Compute derived metrics (e.g., productivity score)

    - step: "trend_analysis"
      description: |
        If rollup_type=trends:
        - Compare current window vs previous window
        - Compute change percentage, trend direction
        - Time-series forecast (ARIMA, exponential smoothing)
        - Identify anomalies, outliers

    - step: "storage"
      description: |
        Store rollup in st_rollup_summaries:
        - Compress summary text (gzip)
        - Index by time_window, rollup_type
        - Enable fast retrieval (rollup_query)

    - step: "consolidation_integration"
      description: |
        Emit event for P03 (consolidation):
        - Rollup summaries feed into neocortical integration
        - Semantic extraction from aggregated patterns

  storage_targets:
    - "st_rollup_summaries" # Compressed aggregates
    - "st_rollup_jobs" # Job status tracking
    - "st_episodic" # Source memories
    - "st_semantic" # Source memories
    - "st_procedures" # Source memories

  events_emitted:
    - "infra.rollup_started"
    - "infra.rollup_summary_generated"
    - "infra.rollup_statistics_computed"
    - "infra.rollup_trends_analyzed"
    - "infra.rollup_completed"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "rollup_type must be [summary|statistics|trends]"
  - rule: "time_window must be [daily|weekly|monthly|custom]"
  - rule: "if time_window=custom then start_ts and end_ts required"
  - rule: "start_ts must be before end_ts (if custom)"
  - rule: "summary_model must be [gpt-4-turbo|claude-3-haiku|local-llama-3-8b]"
  - rule: "memory_types must contain valid types [episodic|semantic|procedural|all]"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_rollup_jobs_total"
      type: "counter"
      labels: ["rollup_type", "time_window", "status"]
      description: "Total rollup jobs"

    - name: "k0_rollup_duration_ms"
      type: "histogram"
      labels: ["rollup_type", "time_window"]
      buckets: [5000, 30000, 60000, 120000, 300000]
      description: "Rollup job duration (5s to 5min)"

    - name: "k0_summaries_generated_total"
      type: "counter"
      labels: ["summary_model"]
      description: "Total summaries generated (LLM calls)"

    - name: "k0_rollup_storage_mb"
      type: "gauge"
      description: "Total storage used by rollup summaries (MB)"

    - name: "k0_rollup_latency_ms"
      type: "histogram"
      labels: ["rollup_type"]
      buckets: [1000, 5000, 10000, 30000, 60000]
      description: "Rollup processing latency"

  traces:
    span_name: "k0_rollup.job"
    attributes:
      - "job_id"
      - "rollup_type"
      - "time_window"
      - "summary_model"

  logs:
    - event: "infra.rollup_started"
      level: "INFO"
      fields: ["job_id", "rollup_type", "time_window", "memories_included_count"]

    - event: "infra.rollup_completed"
      level: "INFO"
      fields: ["job_id", "duration_ms", "storage_mb"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    statistics: "5000ms" # SQL aggregation
    summary_claude_haiku: "30000ms" # Fast LLM
    summary_gpt4_turbo: "120000ms" # High-quality LLM
    trends: "60000ms" # Time-series analysis

  throughput:
    target_jobs_per_hour: 100
    max_concurrent_jobs: 10

  cost:
    gpt4_turbo: "$0.10 per summary (10K tokens)"
    claude_haiku: "$0.02 per summary (10K tokens)"
    local_llama: "$0 (self-hosted)"

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Bearer token (JWT)"
    required: true

  authorization:
    capability_required: "TRIGGER_ROLLUP"

  privacy:
    memory_filtering: "Exclude RED band memories from rollups"
    pii_redaction: "Apply P10 redaction before LLM summarization"

  audit_trail:
    receipt_id: "Issued for all rollup jobs"
    retention: "365 days"

# ============================================================================
# SUMMARIZATION PROMPTS
# ============================================================================

summarization_prompts:
  daily_summary:
    prompt: |
      Summarize the following events from today in 3-5 sentences. Focus on key activities, accomplishments, and notable interactions.

      Events:
      {memory_content}

      Summary:

  weekly_summary:
    prompt: |
      Summarize the following events from this week in 2 paragraphs. Highlight major achievements, recurring themes, and overall progress.

      Events:
      {memory_content}

      Summary:

  monthly_summary:
    prompt: |
      Summarize the following events from this month in 3 paragraphs. Focus on long-term trends, major milestones, and areas of growth or challenge.

      Events:
      {memory_content}

      Summary:

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research_foundations:
  - citation: "Zhang, J., et al. (2023). Abstractive Summarization with Large Language Models. ACL 2023."
    url: "https://aclanthology.org/"
    relevance: "LLM-based summarization techniques"

  - citation: "Box, G. E. P., & Jenkins, G. M. (1976). Time Series Analysis: Forecasting and Control."
    url: "https://www.wiley.com/en-us/Time+Series+Analysis%3A+Forecasting+and+Control"
    relevance: "ARIMA time-series forecasting"

  - citation: "Hyndman, R. J., & Athanasopoulos, G. (2021). Forecasting: Principles and Practice."
    url: "https://otexts.com/fpp3/"
    relevance: "Modern forecasting methods for trend detection"
