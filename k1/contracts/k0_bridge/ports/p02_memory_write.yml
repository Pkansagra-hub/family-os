# P02 MemoryWrite - Memory Formation Pipeline
# Port: P02 (K1 → K0 memory formation)
# Command semantics: K1 writes new memories to K0
# Performance budget: 100ms P95, 500ms timeout

version: "1.0"
port_id: "P02"
port_name: "MemoryWrite"
direction: "K1_TO_K0"
semantics: "command"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0001f" # State Boundary Management
  - "ADR-0002"  # Memory Spaces (personal/family/work)
  - "ADR-0010"  # Deduplication Strategy
  - "ADR-0044"  # HTTP/2 Transport
  - "ADR-0150"  # Privacy Bands

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P02"
      description: "Port identifier for memory write"

    command_type:
      type: string
      value: "memory_write"
      description: "Command type for memory formation"

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing (OpenTelemetry)"
      example: "2f1f1c0a-9b9f-4f6c-9a2d-9fa1f7f2a8ad"

    session_id:
      type: string
      format: uuid
      required: true
      description: "Session identifier for multi-turn context"
      example: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"

    privacy_band:
      type: string
      enum: ["GREEN", "AMBER", "RED"]
      required: true
      description: |
        Privacy classification determining storage/processing:
        - GREEN: Standard storage, cloud sync allowed
        - AMBER: PII detection/redaction before storage, limited sync
        - RED: Local-only, encrypted at rest, no cloud sync

    capability:
      type: string
      enum: ["WRITE_MEMORY", "INGEST"]
      required: true
      description: |
        Required K0 capability for authorization:
        - WRITE_MEMORY: Standard memory write
        - INGEST: Bulk import/connector operations

  payload:
    memory_type:
      type: string
      enum: ["episodic", "semantic", "procedural", "working_memory"]
      required: true
      description: |
        Type of memory being written:
        - episodic: Time-stamped events (what/when/where)
        - semantic: Facts and knowledge (timeless)
        - procedural: Skills and routines (how-to)
        - working_memory: Temporary context (current session)

    content:
      type: object
      required: true
      description: "Memory content (text or structured data)"
      properties:
        text:
          type: string
          max_length: 10000
          description: "Natural language content (for episodic/semantic)"

        structured_data:
          type: object
          description: "Structured memory fields (for procedural/working_memory)"
          additionalProperties: true

    metadata:
      type: object
      required: true
      description: "Memory metadata for indexing and retrieval"
      properties:
        timestamp:
          type: string
          format: iso8601
          required: true
          description: "Memory formation timestamp (ISO 8601)"
          example: "2025-10-18T14:32:00Z"

        tags:
          type: array
          items:
            type: string
            max_length: 64
          max_items: 50
          description: "User-defined tags for categorization"
          example: ["work", "project_alpha", "meeting"]

        space_id:
          type: string
          format: uuid
          required: false
          description: "Memory space ID (personal/family/work)"
          example: "e5f6a7b8-9c0d-1e2f-3a4b-5c6d7e8f9a0b"

        provenance:
          type: object
          required: false
          description: "Memory source metadata"
          properties:
            source:
              type: string
              enum: ["user_input", "assistant_observation", "external_connector"]
              description: "Origin of memory"

            connector_id:
              type: string
              description: "Connector ID if external source"

    dedup_check:
      type: boolean
      default: true
      description: |
        Enable deduplication check (BLAKE3 fingerprinting):
        - true: Check canonical_map, return existing memory_id if duplicate
        - false: Force write (e.g., intentional duplicate entries)

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "201":
      description: "Memory created successfully"
      payload:
        memory_id:
          type: string
          format: uuid
          description: "Unique identifier for created memory"
          example: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail (Epic 2.12)"
          example: "9f0e1d2c-3b4a-5c6d-7e8f-9a0b1c2d3e4f"

        write_latency_ms:
          type: integer
          description: "Memory write latency in milliseconds"
          example: 87

        dedup_status:
          type: string
          enum: ["new", "duplicate_found", "check_skipped"]
          description: |
            Deduplication result:
            - new: Fresh memory created
            - duplicate_found: Existing memory returned
            - check_skipped: dedup_check=false

        consolidation_scheduled:
          type: boolean
          description: "Whether consolidation job queued"
          example: true

    "400":
      description: "Invalid memory structure or missing required fields"
      payload:
        error:
          type: string
          enum: ["invalid_memory_type", "content_too_large", "invalid_timestamp", "tags_exceeded"]

        details:
          type: string
          description: "Human-readable error explanation"

    "401":
      description: "Unauthorized - missing or invalid authentication token"

    "403":
      description: "Forbidden - insufficient capability (requires WRITE_MEMORY or INGEST)"
      payload:
        required_capability:
          type: string
          example: "WRITE_MEMORY"

    "409":
      description: "Duplicate memory detected (dedup_check=true)"
      payload:
        existing_memory_id:
          type: string
          format: uuid
          description: "ID of existing duplicate memory"

    "429":
      description: "Rate limited - memory write quota exceeded"
      payload:
        retry_after_ms:
          type: integer
          description: "Milliseconds until quota resets"

    "500":
      description: "K0 internal error during memory write"
      payload:
        error:
          type: string
          enum: ["hippocampus_encoding_failed", "wal_append_failed", "uow_commit_failed"]

    "504":
      description: "Gateway timeout - memory write exceeded 500ms budget"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Episodic memory write (GREEN band)"
    request:
      envelope:
        port_id: "P02"
        command_type: "memory_write"
        cognitive_trace_id: "2f1f1c0a-9b9f-4f6c-9a2d-9fa1f7f2a8ad"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "WRITE_MEMORY"
      payload:
        memory_type: "episodic"
        content:
          text: "Had a productive meeting with Sarah about Q4 roadmap. Decided to prioritize API v2 migration."
        metadata:
          timestamp: "2025-10-18T14:32:00Z"
          tags: ["work", "meeting", "sarah", "q4_planning"]
          space_id: "e5f6a7b8-9c0d-1e2f-3a4b-5c6d7e8f9a0b"
          provenance:
            source: "user_input"
        dedup_check: true

    response:
      status: 201
      payload:
        memory_id: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        receipt_id: "9f0e1d2c-3b4a-5c6d-7e8f-9a0b1c2d3e4f"
        write_latency_ms: 87
        dedup_status: "new"
        consolidation_scheduled: true

  - name: "Semantic memory write (AMBER band with PII)"
    request:
      envelope:
        port_id: "P02"
        command_type: "memory_write"
        cognitive_trace_id: "3a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "AMBER"
        capability: "WRITE_MEMORY"
      payload:
        memory_type: "semantic"
        content:
          text: "Doctor's appointment scheduled for next Thursday at 3pm with Dr. Johnson."
        metadata:
          timestamp: "2025-10-18T15:00:00Z"
          tags: ["health", "appointment"]
          provenance:
            source: "external_connector"
            connector_id: "calendar_sync"
        dedup_check: true

    response:
      status: 201
      payload:
        memory_id: "4b5c6d7e-8f9a-0b1c-2d3e-4f5a6b7c8d9e"
        receipt_id: "6c7d8e9f-0a1b-2c3d-4e5f-6a7b8c9d0e1f"
        write_latency_ms: 112
        dedup_status: "new"
        consolidation_scheduled: true

  - name: "Duplicate memory rejected"
    request:
      envelope:
        port_id: "P02"
        command_type: "memory_write"
        cognitive_trace_id: "5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a"
        session_id: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"
        privacy_band: "GREEN"
        capability: "WRITE_MEMORY"
      payload:
        memory_type: "episodic"
        content:
          text: "Had a productive meeting with Sarah about Q4 roadmap."
        metadata:
          timestamp: "2025-10-18T14:32:00Z"
          tags: ["work", "meeting"]
        dedup_check: true

    response:
      status: 409
      payload:
        existing_memory_id: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "attention_gate"
      description: "Facade entry point, envelope validation"

    - step: "memory_steward"
      description: "Orchestrates hippocampal encoding workflow"

    - step: "space_resolver"
      description: "Determine memory space (personal/family/work)"

    - step: "redaction_coordinator"
      description: "Apply privacy band policies (AMBER/RED bands)"

    - step: "hippocampus_encoding"
      description: |
        DG (pattern separation) → CA3 (pattern completion) → CA1 (cortical bridge)
        - DG: Sparse coding, novelty detection
        - CA3: Recurrent connections, pattern completion
        - CA1: Binding to cortical representations

    - step: "deduplication_check"
      description: "BLAKE3 fingerprinting, canonical_map lookup"

    - step: "commit_manager"
      description: "Unit of Work (UoW) transaction coordination"

    - step: "wal_append"
      description: "Append to Write-Ahead Log for durability"

    - step: "outbox_staging"
      description: "Stage consolidation events for async processing"

    - step: "receipt_issue"
      description: "Issue receipt for audit trail (Epic 2.12)"

  storage_targets:
    - "st_episodic" # Episodic memory store
    - "st_semantic" # Semantic memory store
    - "st_hipp_store" # Hippocampal temporary storage
    - "st_procedures" # Procedural memory (if memory_type=procedural)

  events_emitted:
    - "cognitive.memory.write.initiated"
    - "cognitive.memory.write.space_resolved"
    - "cognitive.memory.write.redacted"
    - "cognitive.memory.write.committed"
    - "cognitive.memory.write.failed"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "memory_type must be one of [episodic, semantic, procedural, working_memory]"
  - rule: "content.text or content.structured_data must be provided"
  - rule: "content.text max length: 10,000 characters"
  - rule: "metadata.timestamp must be valid ISO 8601 format"
  - rule: "metadata.tags: max 50 tags, each ≤64 characters"
  - rule: "privacy_band must be GREEN/AMBER/RED"
  - rule: "capability must be WRITE_MEMORY or INGEST"
  - rule: "dedup_check: if false, ignore duplicate detection"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_bridge_memory_write_total"
      type: "counter"
      labels: ["status", "memory_type", "dedup_status"]
      description: "Total memory write operations"

    - name: "k0_bridge_memory_write_latency_ms"
      type: "histogram"
      labels: ["status", "memory_type"]
      buckets: [10, 25, 50, 100, 250, 500]
      description: "Memory write latency distribution"

    - name: "k0_bridge_hippocampal_encoding_latency_ms"
      type: "histogram"
      labels: ["memory_type"]
      buckets: [5, 10, 25, 50, 100]
      description: "Hippocampal encoding latency (DG→CA3→CA1)"

    - name: "k0_bridge_memory_dedup_hits_total"
      type: "counter"
      labels: ["memory_type"]
      description: "Total duplicate memories detected"

    - name: "k0_bridge_consolidation_events_total"
      type: "counter"
      labels: ["memory_type"]
      description: "Total consolidation events queued"

  traces:
    span_name: "k0_bridge.memory_write"
    attributes:
      - "memory_type"
      - "dedup_status"
      - "consolidation_scheduled"
      - "space_id"
      - "privacy_band"

  logs:
    - event: "cognitive.memory.write.initiated"
      level: "INFO"
      fields: ["cognitive_trace_id", "memory_type", "privacy_band"]

    - event: "cognitive.memory.write.committed"
      level: "INFO"
      fields: ["memory_id", "write_latency_ms", "dedup_status"]

    - event: "cognitive.memory.write.failed"
      level: "ERROR"
      fields: ["error", "details", "cognitive_trace_id"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    p50: "40ms"
    p95: "100ms"
    p99: "200ms"
    timeout: "500ms"

  throughput:
    target_qps: 100
    burst_capacity: 500

  resource_limits:
    max_content_size: "10KB"
    max_tags: 50
    max_tag_length: 64

  caching:
    strategy: "write-through"
    ttl: "N/A (writes don't cache)"

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Bearer token (JWT)"
    required: true

  authorization:
    capability_required: "WRITE_MEMORY or INGEST"
    space_isolation: true

  privacy_bands:
    GREEN:
      storage: "Standard encrypted at rest"
      sync: "Cloud sync enabled"

    AMBER:
      storage: "PII detection + redaction before storage"
      sync: "Limited sync (redacted only)"
      redaction_types: ["EMAIL", "SSN", "PHONE", "ADDRESS"]

    RED:
      storage: "Local-only, encrypted at rest"
      sync: "No cloud sync"

  audit_trail:
    receipt_id: "Issued for all successful writes"
    retention: "90 days"

  input_validation:
    - "SQL injection prevention (parameterized queries)"
    - "XSS prevention (content sanitization)"
    - "Content length limits enforced"
    - "Malicious tag filtering"
