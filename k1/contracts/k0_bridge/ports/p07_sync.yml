# P07 Sync - Cross-Device CRDT Synchronization Pipeline
# Port: P07 (K0 ↔ K0 bidirectional sync)
# Sync semantics: Peer-to-peer CRDT synchronization with E2EE
# Performance budget: 500ms P95, 5000ms timeout

version: "1.0"
port_id: "P07"
port_name: "Sync"
direction: "BIDIRECTIONAL"
semantics: "sync_protocol"
transport: "HTTP/2"
related_adrs:
  - "ADR-0001a" # K0/K1 Bridge Protocol
  - "ADR-0040"  # CRDT Synchronization
  - "ADR-0041"  # MLS E2EE Groups
  - "ADR-0042"  # Device Coordination
  - "ADR-0044"  # HTTP/2 Transport
  - "ADR-0135"  # Family-Aware Conflict Resolution

# ============================================================================
# REQUEST SPECIFICATION
# ============================================================================

request:
  envelope:
    port_id:
      type: string
      value: "P07"
      description: "Port identifier for cross-device sync"

    command_type:
      type: string
      value: "sync_request"
      description: "CRDT synchronization request"

    cognitive_trace_id:
      type: string
      format: uuid
      required: true
      description: "Cognitive trace ID for distributed tracing"
      example: "7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c"

    device_id:
      type: string
      format: uuid
      required: true
      description: "Source device identifier"
      example: "device_abc123"

    mls_group_id:
      type: string
      format: uuid
      required: true
      description: "MLS group ID for E2EE enforcement"
      example: "mls_group_family_001"

    privacy_band:
      type: string
      enum: ["GREEN", "RED"]
      required: true
      description: |
        Privacy classification (AMBER not supported for sync):
        - GREEN: Cloud sync enabled
        - RED: Local-only sync (peer-to-peer within network)

  payload:
    sync_mode:
      type: string
      enum: ["push", "pull", "bidirectional"]
      required: true
      description: |
        Synchronization mode:
        - push: Local changes → remote peer
        - pull: Remote changes → local device
        - bidirectional: Full reconciliation

    vector_clock:
      type: object
      required: true
      description: "Causal ordering for CRDT operations"
      additionalProperties:
        type: integer
      example:
        device_abc123: 42
        device_def456: 38

    changes:
      type: array
      required: true
      description: "CRDT operations to synchronize"
      items:
        type: object
        properties:
          operation_id:
            type: string
            format: uuid
            description: "Unique operation identifier"

          crdt_type:
            type: string
            enum: ["LWW_Element_Set", "OR_Set", "G_Counter", "PN_Counter"]
            description: "CRDT data structure type"

          operation_type:
            type: string
            enum: ["add", "remove", "update", "increment", "decrement"]
            description: "CRDT operation"

          target_id:
            type: string
            description: "Target memory/object ID"

          value:
            type: object
            additionalProperties: true
            description: "Operation payload"

          timestamp:
            type: integer
            description: "Logical timestamp (Lamport clock)"

    priority:
      type: string
      enum: ["urgent", "normal", "background"]
      default: "normal"
      description: |
        Sync priority:
        - urgent: Immediate sync (e.g., safety-critical updates)
        - normal: Standard sync
        - background: Low-priority bulk sync

    bandwidth_limit_kbps:
      type: integer
      min: 10
      max: 10000
      required: false
      description: "Bandwidth limit in kilobits per second"
      example: 500

# ============================================================================
# RESPONSE SPECIFICATION
# ============================================================================

response:
  status_codes:
    "200":
      description: "Sync completed successfully"
      payload:
        sync_id:
          type: string
          format: uuid
          description: "Unique sync transaction identifier"
          example: "sync_123"

        changes_applied_count:
          type: integer
          description: "Number of changes applied locally"
          example: 15

        conflicts_resolved_count:
          type: integer
          description: "Number of conflicts resolved"
          example: 2

        next_vector_clock:
          type: object
          additionalProperties:
            type: integer
          description: "Updated vector clock after sync"
          example:
            device_abc123: 45
            device_def456: 40

        bandwidth_used_kb:
          type: number
          description: "Bandwidth consumed in kilobytes"
          example: 87.3

        sync_latency_ms:
          type: integer
          description: "Total sync latency"
          example: 423

        receipt_id:
          type: string
          format: uuid
          description: "Receipt ID for audit trail"

    "202":
      description: "Partial sync accepted (async completion)"
      payload:
        sync_id:
          type: string
          format: uuid
          description: "Sync job identifier"

        partial_changes_applied:
          type: integer
          description: "Changes applied so far"

        estimated_completion_ms:
          type: integer
          description: "Estimated time to complete"

    "400":
      description: "Invalid sync request"
      payload:
        error:
          type: string
          enum: ["invalid_vector_clock", "invalid_crdt_operations", "invalid_priority"]

        details:
          type: string

    "401":
      description: "Unauthorized - missing or invalid device authentication"

    "403":
      description: "Forbidden - device not in MLS group"
      payload:
        required_mls_group:
          type: string
          example: "mls_group_family_001"

    "409":
      description: "Conflict detected (unresolvable)"
      payload:
        conflicting_operations:
          type: array
          items:
            type: string
          description: "List of conflicting operation IDs"

    "429":
      description: "Rate limited - sync quota exceeded"
      payload:
        retry_after_ms:
          type: integer

    "500":
      description: "Sync error"
      payload:
        error:
          type: string
          enum: ["crdt_merge_failed", "storage_failed", "encryption_failed"]

    "504":
      description: "Gateway timeout - sync exceeded 5000ms budget"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - name: "Push local changes to peer device"
    request:
      envelope:
        port_id: "P07"
        command_type: "sync_request"
        cognitive_trace_id: "7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c"
        device_id: "device_abc123"
        mls_group_id: "mls_group_family_001"
        privacy_band: "GREEN"
      payload:
        sync_mode: "push"
        vector_clock:
          device_abc123: 42
          device_def456: 38
        changes:
          - operation_id: "op_001"
            crdt_type: "LWW_Element_Set"
            operation_type: "add"
            target_id: "mem_xyz789"
            value:
              content: "New memory content"
              tags: ["family", "event"]
            timestamp: 1697140842
        priority: "normal"
        bandwidth_limit_kbps: 500

    response:
      status: 200
      payload:
        sync_id: "sync_123"
        changes_applied_count: 1
        conflicts_resolved_count: 0
        next_vector_clock:
          device_abc123: 43
          device_def456: 38
        bandwidth_used_kb: 12.5
        sync_latency_ms: 320
        receipt_id: "8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d"

  - name: "Bidirectional sync with conflict resolution"
    request:
      envelope:
        port_id: "P07"
        command_type: "sync_request"
        cognitive_trace_id: "8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d"
        device_id: "device_abc123"
        mls_group_id: "mls_group_family_001"
        privacy_band: "GREEN"
      payload:
        sync_mode: "bidirectional"
        vector_clock:
          device_abc123: 42
          device_def456: 38
        changes:
          - operation_id: "op_002"
            crdt_type: "LWW_Element_Set"
            operation_type: "update"
            target_id: "mem_xyz789"
            value:
              content: "Updated memory content (device A)"
            timestamp: 1697140845
          - operation_id: "op_003"
            crdt_type: "OR_Set"
            operation_type: "add"
            target_id: "tags_mem_xyz789"
            value: "urgent"
            timestamp: 1697140846
        priority: "normal"

    response:
      status: 200
      payload:
        sync_id: "sync_124"
        changes_applied_count: 8
        conflicts_resolved_count: 2
        next_vector_clock:
          device_abc123: 45
          device_def456: 43
        bandwidth_used_kb: 45.7
        sync_latency_ms: 487
        receipt_id: "9b0c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e"

# ============================================================================
# K0 PROCESSING DETAILS
# ============================================================================

k0_processing:
  pipeline:
    - step: "mls_group_validation"
      description: |
        Verify device_id in MLS group membership
        Check key freshness (key rotation)
        Validate E2EE envelope

    - step: "vector_clock_comparison"
      description: |
        Compare local vs remote vector clocks
        Detect missing operations (causal gaps)
        Determine sync direction (push/pull/both)

    - step: "crdt_merge"
      description: |
        Apply CRDT operations:
        - LWW_Element_Set: Last-writer-wins (timestamp comparison)
        - OR_Set: Observed-remove (add-bias)
        - G_Counter: Grow-only (max merge)
        - PN_Counter: Positive-negative (sum merge)

    - step: "conflict_resolution"
      description: |
        Family-aware policies:
        - Parent override: Parent device wins
        - Democratic: Voting by all devices
        - Eldest device wins: Longest device tenure
        - LWW fallback: Timestamp-based

    - step: "storage_update"
      description: |
        Apply changes to local storage:
        - st_crdt_docs: Document state
        - st_crdt_ops: Operation log
        - st_sync_peers: Peer vector clocks
        - st_sync_checkpoints: Full-state snapshots

    - step: "response_generation"
      description: |
        If bidirectional: package local changes for peer
        Update vector clock

    - step: "bandwidth_accounting"
      description: "Track bandwidth usage, enforce limits"

    - step: "receipt_issue"
      description: "Issue receipt for audit trail"

  storage_targets:
    - "st_crdt_docs" # CRDT document state
    - "st_crdt_ops" # CRDT operation log
    - "st_sync_peers" # Peer device vector clocks
    - "st_sync_checkpoints" # Full-state snapshots
    - "st_mls_groups" # MLS group membership

  events_emitted:
    - "infra.sync.push_started"
    - "infra.sync.pull_started"
    - "infra.sync.conflict_resolved"
    - "infra.sync.completed"
    - "infra.sync.failed"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation:
  - rule: "sync_mode must be [push|pull|bidirectional]"
  - rule: "privacy_band must be GREEN or RED (no AMBER for sync)"
  - rule: "vector_clock must contain device_id"
  - rule: "changes array must be non-empty for push/bidirectional"
  - rule: "crdt_type must be [LWW_Element_Set|OR_Set|G_Counter|PN_Counter]"
  - rule: "operation_type must match crdt_type semantics"
  - rule: "device_id must be member of mls_group_id"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_sync_operations_total"
      type: "counter"
      labels: ["sync_mode", "status"]
      description: "Total sync operations"

    - name: "k0_sync_latency_ms"
      type: "histogram"
      labels: ["sync_mode"]
      buckets: [100, 250, 500, 1000, 2500, 5000]
      description: "Sync latency distribution"

    - name: "k0_sync_conflicts_total"
      type: "counter"
      labels: ["resolution_policy"]
      description: "Total conflicts resolved"

    - name: "k0_sync_bandwidth_bytes"
      type: "histogram"
      buckets: [1000, 10000, 50000, 100000, 500000]
      description: "Bandwidth per sync operation"

    - name: "k0_sync_peers_active"
      type: "gauge"
      description: "Number of active sync peers"

  traces:
    span_name: "k0_sync.crdt_merge"
    attributes:
      - "sync_mode"
      - "device_id"
      - "changes_count"
      - "conflicts_count"

  logs:
    - event: "infra.sync.conflict_resolved"
      level: "INFO"
      fields: ["operation_id", "resolution_policy", "winner_device"]

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  latency_budget:
    p50: "200ms"
    p95: "500ms"
    p99: "2000ms"
    timeout: "5000ms"

  throughput:
    target_qps: 10
    burst_capacity: 50

  bandwidth:
    typical_sync_size: "10-100KB"
    max_sync_size: "10MB"
    adaptive_throttling: true

# ============================================================================
# SECURITY
# ============================================================================

security:
  authentication:
    mechanism: "Device certificate (X.509) + JWT"
    required: true

  authorization:
    mls_group_membership: "Required"
    device_capability: "SYNC_ENABLED"

  encryption:
    e2ee: "MLS (Message Layer Security)"
    key_rotation: "Every 7 days or on device removal"
    forward_secrecy: true

  privacy_bands:
    GREEN: "Cloud sync enabled"
    RED: "Local network peer-to-peer only"

  audit_trail:
    receipt_id: "Issued for all sync operations"
    retention: "90 days"

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research:
  crdts:
    description: "Conflict-free replicated data types"
    citations:
      - "Shapiro et al. (2011) - Conflict-free replicated data types"
      - "Preguiça et al. (2009) - Commutative replicated data types"

  mls:
    description: "Message Layer Security for group E2EE"
    citations:
      - "IETF RFC 9420 - The Messaging Layer Security (MLS) Protocol"
      - "Beurdouche et al. (2015) - On the security of the MLS draft"
