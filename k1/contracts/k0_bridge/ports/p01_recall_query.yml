# K0 Bridge Port P01: RecallQuery
# Purpose: K1 queries K0 for relevant memories (context retrieval for AI agents)
# Source ADR: ADR-0001a (K0 Bridge Communication Protocol)
# Related ADR: ADR-0044 (K0 Bridge HTTP/2 Protocol)
# Version: 1.0.0
# Last Updated: 2025-10-14

port:
  id: "P01"
  name: "RecallQuery"
  direction: "K1_TO_K0"  # K1 → K0
  semantics: "query"  # query | command | event
  performance_budget_ms: 50
  description: "K1 queries K0 for relevant memories (context retrieval for AI agents)"

  # Request Schema
  request_schema:
    envelope_fields:
      - name: "port_id"
        type: "string"
        value: "P01"
        required: true
        description: "K0 Bridge Port identifier (P01 = RecallQuery)"

      - name: "command_type"
        type: "string"
        value: "recall_query"
        required: true
        description: "Specific operation within query port"

      - name: "cognitive_trace_id"
        type: "string"
        format: "uuid"
        required: true
        description: "End-to-end trace ID for observability"
        example: "2f1f1c0a-9b9f-4f6c-9a2d-9fa1f7f2a8ad"

      - name: "session_id"
        type: "string"
        format: "uuid"
        required: true
        description: "K1 session ID for context isolation"
        example: "a3a0c5f2-6e0b-4a5d-bf6e-c3e4d55d9a85"

      - name: "privacy_band"
        type: "enum"
        values: ["GREEN", "AMBER", "RED"]
        default: "GREEN"
        required: false
        description: "Privacy band for query classification (GREEN = standard, AMBER = PII masking, RED = local-only)"

      - name: "capability"
        type: "string"
        value: "READ_MEMORY/RECALL"
        required: true
        description: "Required capability for K0 authorization enforcement"

    payload_fields:
      - name: "query_type"
        type: "enum"
        values: ["episodic", "semantic", "procedural", "working_memory"]
        required: true
        description: "Memory type to retrieve (episodic = events, semantic = facts, procedural = skills, working_memory = recent context)"
        example: "episodic"

      - name: "limit"
        type: "int32"
        default: 10
        range: [1, 100]
        required: false
        description: "Maximum number of memories to return"
        example: 10

      - name: "cursor"
        type: "string"
        required: false
        description: "Opaque cursor for pagination (continue retrieval from previous query)"
        example: "cursor_xyz789"

      - name: "filters"
        type: "object"
        required: false
        description: "Query filters for memory retrieval"
        schema:
          - name: "time_range"
            type: "object"
            required: false
            description: "Time range filter for episodic memories (both start and end required if provided)"
            fields:
              - name: "start"
                type: "int64"
                required: true
                description: "Unix timestamp (microseconds)"
                example: 1697140800000000
              - name: "end"
                type: "int64"
                required: true
                description: "Unix timestamp (microseconds)"
                example: 1697227200000000

          - name: "tags"
            type: "array[string]"
            required: false
            description: "Filter by memory tags (max 50 tags, each ≤ 64 chars)"
            example: ["planning", "task_execution"]
            constraints:
              max_tags: 50
              max_tag_length: 64

          - name: "similarity_threshold"
            type: "float"
            range: [0.0, 1.0]
            default: 0.7
            required: false
            description: "Minimum semantic similarity score (applies to vector/KG stores; ignored by pure episodic scans)"
            example: 0.75

      - name: "cognitive_enhancements"
        type: "object"
        required: false
        description: "Brain-inspired cognitive biases for retrieval (Smart Lane only)"
        schema:
          - name: "working_memory_boost"
            type: "boolean"
            default: false
            description: "Boost recent working memory items (recency bias)"

          - name: "affect_bias"
            type: "boolean"
            default: false
            description: "Prioritize emotionally salient memories"

          - name: "temporal_bias"
            type: "enum"
            values: ["recency", "frequency"]
            required: false
            description: "Prioritize recent or frequent memories"

          - name: "social_bias"
            type: "enum"
            values: ["family_only", "all"]
            default: "all"
            required: false
            description: "Filter by social context (family-only or all memories)"

  # Response Schema
  response_schema:
    status_codes:
      - code: 200
        meaning: "success"
        description: "Memories successfully retrieved"

      - code: 400
        meaning: "invalid_query"
        description: "Query validation failed (invalid time range, threshold out of bounds, etc.)"

      - code: 401
        meaning: "unauthorized"
        description: "Missing or invalid JWT authentication"

      - code: 403
        meaning: "forbidden"
        description: "Session scope or capability does not allow recall (READ_MEMORY/RECALL required)"

      - code: 429
        meaning: "rate_limited"
        description: "Caller exceeded per-session or global rate limits"

      - code: 500
        meaning: "k0_internal_error"
        description: "K0 internal error (database failure, indexing error, etc.)"

      - code: 504
        meaning: "timeout"
        description: "Query exceeded 200ms timeout"

    payload_fields:
      - name: "results"
        type: "array[Memory]"
        required: true
        description: "Array of retrieved memories"
        schema:
          - name: "memory_id"
            type: "string"
            description: "Unique memory identifier"
            example: "mem_xyz789"

          - name: "content"
            type: "string"
            description: "Memory content (text or structured data)"
            example: "User scheduled Emma's soccer practice for Saturday at 10am"

          - name: "content_redacted"
            type: "boolean"
            required: false
            description: "True if result content was redacted due to privacy band policies (AMBER/RED)"
            example: false

          - name: "redaction_types"
            type: "array[string]"
            required: false
            description: "Types of PII redacted (if content_redacted = true)"
            example: ["EMAIL", "SSN", "PHONE"]

          - name: "memory_type"
            type: "enum"
            values: ["episodic", "semantic", "procedural", "working_memory"]
            description: "Memory classification"
            example: "episodic"

          - name: "timestamp"
            type: "int64"
            description: "Memory creation timestamp (Unix microseconds)"
            example: 1697140800000000

          - name: "relevance_score"
            type: "float"
            range: [0.0, 1.0]
            description: "Retrieval relevance score (1.0 = most relevant)"
            example: 0.92

          - name: "provenance"
            type: "object"
            required: false
            description: "Multi-store retrieval scores (transparency into fusion ranking)"
            schema:
              - name: "fusion_score"
                type: "float"
                required: true
                description: "Final fused score from multi-store retrieval"
                example: 0.92

              - name: "fts_score"
                type: "float"
                required: false
                description: "Full-text search score (keyword matching)"
                example: 0.85

              - name: "vector_score"
                type: "float"
                required: false
                description: "Vector similarity score (semantic similarity)"
                example: 0.95

              - name: "kg_score"
                type: "float"
                required: false
                description: "Knowledge graph traversal score (relationship relevance)"
                example: 0.78

      - name: "total_count"
        type: "int32"
        required: true
        description: "Total number of memories matching query (before limit applied; must be >= len(results))"
        example: 42

      - name: "next_cursor"
        type: "string"
        required: false
        description: "Opaque cursor to continue retrieval (present if total_count > limit)"
        example: "cursor_next_page_abc"

      - name: "query_latency_ms"
        type: "float"
        required: true
        description: "Query execution time in milliseconds"
        example: 35.2

      - name: "receipt_id"
        type: "string"
        required: true
        description: "Receipt identifier for audit trail (Turn/ToolReceipt from Epic 2.12)"
        example: "receipt_abc123xyz"

  # Usage Examples
  usage_examples:
    - scenario: "Planner AI Agent queries context for task generation"
      description: "Planner agent retrieves recent episodic memories to understand user context before generating a task plan"
      k1_code: |
        # k1/orchestration/planner/planner_agent.py
        async def generate_plan(self, task: TaskAnnouncement):
            # Step 1: Query K0 for relevant context
            query = RecallQuery(
                query_type="episodic",
                limit=10,
                filters=QueryFilters(
                    time_range=TimeRange(
                        start=now() - timedelta(days=7),
                        end=now()
                    ),
                    tags=["planning", task.domain]
                ),
                cognitive_enhancements={
                    "working_memory_boost": True,
                    "temporal_bias": "recency"
                }
            )
            context = await self.k0_bridge.recall_query(query)

            # Step 2: Use context in LLM prompt
            prompt = self.build_prompt(context.results, task)
            plan = await self.model_hub.call(prompt, model="gpt-4")
            return plan

      k0_routing: |
        # K0 Memory Module handles internally
        # Port "query" + command_type "recall_query" → P01 Pipeline
        # K0 performs multi-store retrieval:
        #   1. FTS search (keyword matching in SQLite FTS5)
        #   2. Vector search (FAISS similarity search)
        #   3. KG traversal (graph relationships)
        #   4. Episodic retrieval (sequential memory lookup)
        # Fusion Engine ranks results (weighted sum of scores)
        # MMR Engine applies diversity ranking
        # Returns top N results with provenance

      expected_response: |
        {
          "results": [
            {
              "memory_id": "mem_001",
              "content": "User scheduled Emma's soccer practice for Saturday at 10am",
              "memory_type": "episodic",
              "timestamp": 1697140800000000,
              "relevance_score": 0.92,
              "provenance": {
                "fusion_score": 0.92,
                "fts_score": 0.85,
                "vector_score": 0.95,
                "kg_score": 0.78
              }
            },
            {
              "memory_id": "mem_002",
              "content": "User prefers outdoor activities for kids on weekends",
              "memory_type": "semantic",
              "timestamp": 1697054400000000,
              "relevance_score": 0.87,
              "provenance": {
                "fusion_score": 0.87,
                "fts_score": 0.80,
                "vector_score": 0.90,
                "kg_score": 0.75
              }
            }
          ],
          "total_count": 15,
          "query_latency_ms": 35.2
        }

    - scenario: "Researcher AI Agent retrieves semantic knowledge for synthesis"
      description: "Researcher agent queries semantic memories to gather facts for information synthesis"
      k1_code: |
        # k1/orchestration/researcher/researcher_agent.py
        async def research_topic(self, topic: str):
            query = RecallQuery(
                query_type="semantic",
                limit=20,
                filters=QueryFilters(
                    tags=["knowledge", topic],
                    similarity_threshold=0.8
                ),
                cognitive_enhancements={
                    "affect_bias": False  # Objective facts only
                }
            )
            facts = await self.k0_bridge.recall_query(query)

            # Synthesize facts into research summary
            summary = await self.synthesize(facts.results)
            return summary

  # Validation Rules
  validation_rules:
    - rule: "time_range.start < time_range.end"
      violation: "invalid_time_range"
      error_message: "Start time must be before end time"

    - rule: "if time_range provided then start != null AND end != null"
      violation: "invalid_time_range_fields"
      error_message: "Both start and end must be provided when using time_range"

    - rule: "limit >= 1 AND limit <= 100"
      violation: "invalid_limit"
      error_message: "Limit must be between 1 and 100"

    - rule: "similarity_threshold >= 0.0 AND similarity_threshold <= 1.0"
      violation: "invalid_threshold"
      error_message: "Similarity threshold must be between 0.0 and 1.0"

    - rule: "query_type IN ['episodic', 'semantic', 'procedural', 'working_memory']"
      violation: "invalid_query_type"
      error_message: "Query type must be one of: episodic, semantic, procedural, working_memory"

    - rule: "tags.length <= 50 AND every tag.length <= 64"
      violation: "invalid_tags"
      error_message: "Maximum 50 tags, each tag must be <= 64 characters"

    - rule: "total_count >= results.length"
      violation: "invalid_total_count"
      error_message: "total_count must be >= number of returned results"

    - rule: "if next_cursor present then total_count > limit"
      violation: "invalid_cursor"
      error_message: "next_cursor should only be present when total_count exceeds limit"

  # Observability
  observability:
    prometheus_metrics:
      - name: "k0_bridge_recall_query_total"
        type: "counter"
        labels: ["status", "query_type"]
        description: "Total number of recall queries"
        example: k0_bridge_recall_query_total{status="success",query_type="episodic"} 1523

      - name: "k0_bridge_recall_query_latency_ms"
        type: "histogram"
        buckets: [10, 25, 50, 100, 200]
        labels: ["query_type", "status"]
        description: "Recall query latency distribution in milliseconds"
        example: k0_bridge_recall_query_latency_ms{query_type="episodic",status="success",le="50"} 1420

      - name: "k0_bridge_recall_query_results_count"
        type: "histogram"
        buckets: [0, 1, 5, 10, 20, 50]
        labels: ["query_type"]
        description: "Number of results returned per query"
        example: k0_bridge_recall_query_results_count{query_type="episodic",le="10"} 982

      - name: "k0_bridge_recall_cache_hits_total"
        type: "counter"
        labels: ["query_type"]
        description: "Total number of cache hits for recall queries"
        example: k0_bridge_recall_cache_hits_total{query_type="episodic"} 892

      - name: "k0_bridge_recall_cache_misses_total"
        type: "counter"
        labels: ["query_type"]
        description: "Total number of cache misses for recall queries"
        example: k0_bridge_recall_cache_misses_total{query_type="episodic"} 631

    opentelemetry_spans:
      - span_name: "k0_bridge.recall_query"
        description: "Trace for full recall query lifecycle (K1 → K0 → K1)"
        attributes:
          - name: "query_type"
            type: "string"
            example: "episodic"

          - name: "cognitive_trace_id"
            type: "string"
            example: "trace_abc123"

          - name: "result_count"
            type: "int"
            example: 15

          - name: "latency_ms"
            type: "float"
            example: 35.2

          - name: "cache_hit"
            type: "boolean"
            example: false
            description: "Whether query was served from K0 cache"

  # Related ADRs
  related_adrs:
    - adr: "ADR-0001a"
      section: "Port Specifications - P01"
      description: "K0 Bridge Communication Protocol - defines dual protocol support and port structure"
      url: "docs/architecture/decisions/0001a-k0-bridge-communication-protocol.md"

    - adr: "ADR-0044"
      section: "K0 Bridge HTTP/2 Protocol"
      description: "HTTP/2 multiplexing and FlatBuffers serialization for K0 Bridge"
      url: "docs/architecture/decisions/0044-k0-bridge-http2-flatbuffers.md"

    - adr: "ADR-0001f"
      section: "State Flow Patterns - K0→K1 (Read Pattern)"
      description: "Context retrieval pattern for K1 agents querying K0"
      url: "docs/architecture/decisions/0001f-state-boundary-management-k1-k0.md"

  # Performance Characteristics
  performance:
    target_latency_p50: "25ms"
    target_latency_p95: "50ms"
    target_latency_p99: "100ms"
    timeout: "200ms"
    typical_payload_size: "2-10KB (JSON), 1-5KB (FlatBuffers)"
    max_payload_size: "100KB"
    cache_hit_rate_target: "60%"  # K0 query cache

  # Security & Privacy
  security:
    authentication: "JWT token in Authorization header (K1 → K0)"
    authorization: "Capability-based (READ_MEMORY/RECALL required); session-scoped (query can only access memories for session_id)"
    privacy_bands:
      - band: "GREEN"
        description: "No special restrictions, standard recall"

      - band: "AMBER"
        description: "PII masking applied to results (email, SSN, phone redacted); content_redacted flag set"
        redaction_types: ["EMAIL", "SSN", "PHONE", "ADDRESS"]

      - band: "RED"
        description: "Restricted to local-only memories (no cloud sync); additional encryption requirements"

    audit_trail: "All queries logged to K0 WAL with (session_id, query_type, timestamp, result_count, receipt_id)"
    receipt: "Turn/ToolReceipt issued per Epic 2.12; receipt_id returned in response for audit correlation"

  # Changelog
  changelog:
    - version: "1.0.0"
      date: "2025-10-14"
      changes: "Initial contract definition"
      author: "K1 Contract Development Team"
