# FlatBuffers Envelope Specification - K0 Bridge Protocol
# Purpose: Secondary optimization format for K1 high-frequency operations
# Status: Production-ready, zero-copy binary serialization
# ADR References: ADR-0001a (K0 Bridge Protocol), ADR-0011 (FlatBuffers), ADR-0014 (Dual Format)

version: "1.0"
specification_type: "flatbuffers_envelope"
priority: "SECONDARY"
related_adrs:
  - "ADR-0001a" # K0 Bridge Communication Protocol
  - "ADR-0011"  # FlatBuffers for All Contracts
  - "ADR-0014"  # JSON for REST API (Dual Format)

# ============================================================================
# FLATBUFFERS IDL SCHEMA
# ============================================================================

flatbuffers_idl:
  description: |
    FlatBuffers IDL (Interface Definition Language) for K0 Bridge envelopes.
    SECONDARY format optimized for K1 high-frequency operations.
    Zero-copy deserialization, ~40% smaller payloads than JSON.

  schema_file: "k0_bridge_envelope.fbs"
  namespace: "k0_bridge"
  code_generation:
    languages: ["python", "cpp", "typescript", "rust"]
    command: "flatc --python --cpp --ts --rust k0_bridge_envelope.fbs"

  schema_definition: |
    // k0_bridge_envelope.fbs
    namespace k0_bridge;

    // ========================================================================
    // Envelope (Top-Level Structure)
    // ========================================================================

    table Envelope {
      envelope_id: string (required);
      cognitive_trace_id: string (required);
      timestamp: int64 (required);  // Unix timestamp (microseconds)
      device_id: string (required);
      session_id: string (required);
      user_id: string (required);
      schema_version: string (required);
      port: Port (required);
      command_type: string (required);
      qos_band: QoSBand (required);
      obligations: [string];
      payload: [ubyte] (required);  // Serialized payload (port-specific schema)
      signature: [ubyte] (required);  // ED25519 signature
    }

    // ========================================================================
    // Enums
    // ========================================================================

    enum Port: byte {
      COMMAND = 1,
      QUERY = 2,
      SSE = 3,
      OBSERVABILITY = 4
    }

    enum QoSBand: byte {
      GREEN = 1,   // Fast Lane (<50ms)
      AMBER = 2,   // Smart Lane (<200ms)
      RED = 3      // Critical (prioritized)
    }

    // ========================================================================
    // Command Port Payloads
    // ========================================================================

    table MemoryWritePayload {
      memory_type: string (required);
      content: string (required);
      speaker: string;
      tags: [string];
      entities: [string];
      temporal: string;
      metadata: [KeyValue];
    }

    table KeyValue {
      key: string (required);
      value: string (required);
    }

    // ========================================================================
    // Query Port Payloads
    // ========================================================================

    table RecallQueryPayload {
      text: string (required);
      intent: string (required);
      context_window_ms: int64;
      max_results: int32;
      include_provenance: bool;
      cognitive_enhancements: CognitiveEnhancements;
    }

    table CognitiveEnhancements {
      working_memory_boost: bool;
      affect_bias: bool;
      temporal_bias: string;  // "recency" | "frequency"
      social_bias: string;    // "family_only" | "all"
    }

    table RecallQueryResponse {
      status: string (required);
      envelope_id: string (required);
      cognitive_trace_id: string (required);
      timestamp: int64 (required);
      results: [Memory];
      total_matches: int32;
      retrieval_latency_ms: float;
      metadata: RetrievalMetadata;
    }

    table Memory {
      memory_id: string (required);
      content: string (required);
      memory_type: string (required);
      speaker: string;
      timestamp: int64 (required);
      confidence: float;
      salience: float;
      provenance: Provenance;
      cognitive_enhancements_applied: CognitiveEnhancementsApplied;
      entities: [string];
      tags: [string];
    }

    table Provenance {
      stores: [string];  // ["st_epi", "st_fts", "st_vec", "st_kg"]
      fusion_score: float;
      mmr_score: float;
      fts_score: float;
      vector_score: float;
      kg_score: float;
    }

    table CognitiveEnhancementsApplied {
      working_memory_boost: float;
      affect_bias: float;
      temporal_bias: float;
      social_bias: float;
    }

    table RetrievalMetadata {
      stores_queried: [string];
      working_memory_hits: int32;
      cache_tier_hits: int32;
      hot_tier_hits: int32;
      cold_tier_hits: int32;
    }

    // ========================================================================
    // SSE Port Payloads
    // ========================================================================

    table SSESubscribePayload {
      topics: [string] (required);
      session_filter: string;
    }

    table SSEEvent {
      event_type: string (required);
      event_id: string (required);
      data: [ubyte] (required);  // Event-specific payload
    }

    // ========================================================================
    // Observability Port Payloads
    // ========================================================================

    table MetricsQueryPayload {
      format: string (required);  // "prometheus" | "json"
      filters: [string];
    }

    // ========================================================================
    // Error Responses
    // ========================================================================

    table ErrorResponse {
      status: string (required);
      error: string (required);
      details: string;
      envelope_id: string (required);
      retry_after_seconds: int32;
    }

    // ========================================================================
    // Root Type
    // ========================================================================

    root_type Envelope;

# ============================================================================
# SERIALIZATION CHARACTERISTICS
# ============================================================================

serialization:
  format: "FlatBuffers binary"
  binary_format: true

  performance:
    serialization_latency: "<0.5ms (typical)"
    deserialization_latency: "<0.3ms (zero-copy)"
    payload_size: "0.6x of JSON (~40% smaller)"
    human_readable: false

  optimization:
    zero_copy: "Direct memory access without parsing"
    alignment: "8-byte alignment for optimal performance"
    vtable: "Virtual table for schema evolution"
    compression: "zstd level 3 for payloads >4KB (60% compression ratio)"

  advantages:
    - "Zero-copy deserialization (no parsing overhead)"
    - "Compact binary format (~40% smaller than JSON)"
    - "Fast serialization (<0.5ms vs JSON 1.5-2ms)"
    - "Backward/forward compatible (schema evolution built-in)"
    - "Memory-efficient (no intermediate representations)"

  disadvantages:
    - "Not human-readable (binary format)"
    - "Requires FlatBuffers compiler (flatc)"
    - "Debugging requires reflection API or conversion to JSON"
    - "More complex than JSON (learning curve)"

# ============================================================================
# CODE GENERATION
# ============================================================================

code_generation:
  flatc_command: "flatc --python --cpp --ts --rust k0_bridge_envelope.fbs"

  python_usage:
    description: "Generated Python code for K1 Bridge Client"
    example: |
      import flatbuffers
      from k0_bridge import Envelope, Port, QoSBand, MemoryWritePayload

      # Serialize
      builder = flatbuffers.Builder(1024)

      # Build payload
      content = builder.CreateString("Emma's soccer practice Wednesday 4pm")
      memory_type = builder.CreateString("episodic")

      MemoryWritePayload.Start(builder)
      MemoryWritePayload.AddMemoryType(builder, memory_type)
      MemoryWritePayload.AddContent(builder, content)
      payload_offset = MemoryWritePayload.End(builder)

      # Serialize payload to bytes
      builder.Finish(payload_offset)
      payload_bytes = bytes(builder.Output())

      # Build envelope
      builder = flatbuffers.Builder(2048)
      envelope_id = builder.CreateString("env_abc123")
      trace_id = builder.CreateString("trace_xyz789")
      device_id = builder.CreateString("device_mom_phone")
      session_id = builder.CreateString("sess_789")
      user_id = builder.CreateString("user_mom")
      schema_version = builder.CreateString("1.2.0")
      command_type = builder.CreateString("memory_write")
      payload_vec = builder.CreateByteVector(payload_bytes)
      signature_vec = builder.CreateByteVector(b"ed25519_signature")

      Envelope.Start(builder)
      Envelope.AddEnvelopeId(builder, envelope_id)
      Envelope.AddCognitiveTraceId(builder, trace_id)
      Envelope.AddTimestamp(builder, 1728000000000)
      Envelope.AddDeviceId(builder, device_id)
      Envelope.AddSessionId(builder, session_id)
      Envelope.AddUserId(builder, user_id)
      Envelope.AddSchemaVersion(builder, schema_version)
      Envelope.AddPort(builder, Port.COMMAND)
      Envelope.AddCommandType(builder, command_type)
      Envelope.AddQosBand(builder, QoSBand.AMBER)
      Envelope.AddPayload(builder, payload_vec)
      Envelope.AddSignature(builder, signature_vec)
      envelope_offset = Envelope.End(builder)

      builder.Finish(envelope_offset)
      envelope_bytes = bytes(builder.Output())

      # Deserialize (zero-copy)
      envelope = Envelope.GetRootAs(envelope_bytes, 0)
      print(f"Envelope ID: {envelope.EnvelopeId()}")
      print(f"QoS Band: {envelope.QosBand()}")  # AMBER (2)
      print(f"Timestamp: {envelope.Timestamp()}")

  cpp_usage:
    description: "Generated C++ code for high-performance K0 processing"
    example: |
      #include "k0_bridge_generated.h"

      flatbuffers::FlatBufferBuilder builder(1024);

      // Build envelope
      auto envelope_id = builder.CreateString("env_abc123");
      auto trace_id = builder.CreateString("trace_xyz789");
      auto device_id = builder.CreateString("device_dad_phone");
      auto session_id = builder.CreateString("sess_456");
      auto user_id = builder.CreateString("user_dad");
      auto schema_version = builder.CreateString("1.2.0");
      auto command_type = builder.CreateString("recall_query");
      auto payload = builder.CreateVector<uint8_t>({...});
      auto signature = builder.CreateVector<uint8_t>({...});

      auto envelope = k0_bridge::CreateEnvelope(
        builder,
        envelope_id,
        trace_id,
        1728000000000,
        device_id,
        session_id,
        user_id,
        schema_version,
        k0_bridge::Port_QUERY,
        command_type,
        k0_bridge::QoSBand_GREEN,
        0,  // obligations
        payload,
        signature
      );

      builder.Finish(envelope);

      // Zero-copy access
      auto* env = k0_bridge::GetEnvelope(builder.GetBufferPointer());
      std::cout << "Envelope ID: " << env->envelope_id()->str() << std::endl;
      std::cout << "QoS Band: " << env->qos_band() << std::endl;

# ============================================================================
# SCHEMA EVOLUTION & VERSIONING
# ============================================================================

schema_evolution:
  backward_compatibility:
    description: "FlatBuffers supports backward compatibility via optional fields"
    rules:
      - "New fields must be optional (default values provided)"
      - "Do NOT remove fields (mark as deprecated instead)"
      - "Do NOT change field types (create new fields instead)"
      - "Do NOT reorder fields (FlatBuffers uses field IDs)"

  forward_compatibility:
    description: "Old code can read new schemas (ignores unknown fields)"
    mechanism: "Virtual table (vtable) allows skipping unknown fields"

  deprecation:
    process:
      - "Mark field as deprecated in comments"
      - "Add new field with desired type/name"
      - "Maintain both fields for 90 days"
      - "Remove deprecated field in next major version"

  versioning_strategy:
    policy: "SemVer 2.0 in schema_version field"
    compatibility: "N/N+1 compatibility (support 2 versions simultaneously)"

  example_evolution:
    v1_0_0: |
      table Envelope {
        envelope_id: string;
        timestamp: int64;
        // ... other fields
      }

    v1_1_0_adding_optional_field: |
      table Envelope {
        envelope_id: string;
        timestamp: int64;
        request_timeout_ms: int32 = 10000;  // NEW optional field with default
        // ... other fields
      }

    v2_0_0_breaking_change: |
      table Envelope {
        envelope_id: string;
        timestamp_us: int64;  // BREAKING: renamed timestamp → timestamp_us (microseconds)
        request_timeout_ms: int32 = 10000;
        // ... other fields
      }

# ============================================================================
# PERFORMANCE BENCHMARKS
# ============================================================================

performance_benchmarks:
  test_environment:
    cpu: "AMD Ryzen 9 7950X"
    memory: "64GB DDR5"
    language: "Python 3.11"
    flatbuffers_version: "23.5.26"

  serialization:
    description: "Time to serialize envelope to bytes"
    json_latency_ms: 1.8
    flatbuffers_latency_ms: 0.4
    speedup: "4.5x faster"

  deserialization:
    description: "Time to deserialize bytes to envelope"
    json_latency_ms: 2.2
    flatbuffers_latency_ms: 0.3
    speedup: "7.3x faster (zero-copy)"

  payload_size:
    description: "Envelope size in bytes (typical memory write)"
    json_size_bytes: 1024
    flatbuffers_size_bytes: 640
    reduction: "37.5% smaller"

  round_trip:
    description: "K1 → serialize → K0 → deserialize → process"
    json_total_ms: 4.0
    flatbuffers_total_ms: 0.7
    speedup: "5.7x faster end-to-end"

# ============================================================================
# CONTENT TYPE NEGOTIATION
# ============================================================================

content_type:
  header: "Content-Type: application/x-flatbuffers"
  accept_header: "Accept: application/x-flatbuffers, application/json"

  negotiation_flow:
    description: "K1 prefers FlatBuffers for high-frequency operations"
    steps:
      - "K1 sets Content-Type: application/x-flatbuffers in request"
      - "K1 sets Accept: application/x-flatbuffers in request"
      - "K0 parses Content-Type header, deserializes FlatBuffers"
      - "K0 processes request, serializes response as FlatBuffers"
      - "K0 responds with Content-Type: application/x-flatbuffers"
      - "K1 zero-copy deserializes FlatBuffers response"

  fallback:
    description: "If K0 doesn't support FlatBuffers, K1 falls back to JSON"
    trigger: "K0 responds with 415 Unsupported Media Type"
    action: "K1 retries with Content-Type: application/json"

# ============================================================================
# DEBUGGING & REFLECTION
# ============================================================================

debugging:
  challenge: "FlatBuffers binary format not human-readable"

  solutions:
    - name: "FlatBuffers Reflection API"
      description: "Convert FlatBuffers to JSON at runtime"
      example: |
        import flatbuffers
        from k0_bridge import Envelope

        # Deserialize FlatBuffers
        envelope = Envelope.GetRootAs(envelope_bytes, 0)

        # Convert to JSON (for debugging)
        envelope_json = {
          "envelope_id": envelope.EnvelopeId().decode('utf-8'),
          "cognitive_trace_id": envelope.CognitiveTraceId().decode('utf-8'),
          "timestamp": envelope.Timestamp(),
          "qos_band": ["", "GREEN", "AMBER", "RED"][envelope.QosBand()],
          # ... other fields
        }

        print(json.dumps(envelope_json, indent=2))

    - name: "Logging with JSON conversion"
      description: "Log envelopes as JSON in development"
      example: |
        logger.debug(
          "k0_bridge_request",
          envelope_id=envelope.EnvelopeId().decode('utf-8'),
          port=["", "COMMAND", "QUERY", "SSE", "OBSERVABILITY"][envelope.Port()],
          qos_band=["", "GREEN", "AMBER", "RED"][envelope.QosBand()],
          payload_size_bytes=len(envelope.PayloadAsNumpy())
        )

    - name: "Development mode fallback"
      description: "Use JSON in dev/staging, FlatBuffers in production"
      example: |
        if os.getenv("K0_BRIDGE_FORMAT") == "json":
          return json_serializer.serialize(envelope)
        else:
          return flatbuffers_serializer.serialize(envelope)

# ============================================================================
# SECURITY
# ============================================================================

security:
  signature:
    field: "signature: [ubyte]"
    algorithm: "ED25519"
    coverage: "All envelope fields except signature itself"
    verification: "K0 verifies signature before deserialization"

  integrity:
    idempotency: "envelope_id prevents duplicate processing"
    replay_protection: "timestamp + device_id + envelope_id unique tuple"

  transport:
    encryption: "TLS 1.3 over HTTP/2"
    certificate_validation: "Device certificates (mutual TLS)"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "envelope_id must be unique (idempotency)"
  - rule: "timestamp must be Unix timestamp in microseconds"
  - rule: "port must be [COMMAND|QUERY|SSE|OBSERVABILITY]"
  - rule: "qos_band must be [GREEN|AMBER|RED]"
  - rule: "payload must be valid serialized FlatBuffers table"
  - rule: "signature must be valid ED25519 signature"
  - rule: "schema_version must match K0 supported versions"

# ============================================================================
# TESTING STRATEGY
# ============================================================================

testing:
  unit_tests:
    - "FlatBuffers schema compilation (flatc)"
    - "Serialization round-trip (Python, C++, TypeScript)"
    - "Zero-copy deserialization verification"
    - "Field access performance (<0.1ms)"
    - "Schema evolution (v1.0 → v1.1 → v2.0)"

  integration_tests:
    - "K1 → FlatBuffers → K0 → FlatBuffers → K1"
    - "Large payload handling (>1MB with zstd compression)"
    - "Backward compatibility (old client → new K0)"
    - "Forward compatibility (new client → old K0)"

  contract_tests:
    - "JSON ↔ FlatBuffers equivalence (same semantic content)"
    - "Schema compatibility matrix (v1.0, v1.1, v1.2, v2.0)"

  performance_tests:
    - "Serialization latency <0.5ms P95"
    - "Deserialization latency <0.3ms P95"
    - "Payload size ~40% smaller than JSON"
    - "Round-trip latency <1ms P95"

# ============================================================================
# MIGRATION STRATEGY
# ============================================================================

migration:
  from_json_only:
    phase1: "Add FlatBuffers support (keep JSON as fallback)"
    phase2: "Deploy K0 with dual format support"
    phase3: "K1 switches to FlatBuffers for high-frequency operations"
    phase4: "Monitor performance improvements (latency, payload size)"

  rollback:
    trigger: "FlatBuffers causes production issues"
    action: "K1 falls back to JSON automatically (Content-Type negotiation)"

  monitoring:
    metrics:
      - "k0_bridge_requests_total{protocol='flatbuffers'}"
      - "k0_bridge_latency_seconds{protocol='flatbuffers'}"
      - "k0_bridge_payload_size_bytes{protocol='flatbuffers'}"
      - "k0_bridge_errors_total{protocol='flatbuffers'}"

# ============================================================================
# RESEARCH FOUNDATIONS
# ============================================================================

research_foundations:
  - citation: "FlatBuffers: Memory Efficient Serialization Library (Google, 2014)"
    url: "https://google.github.io/flatbuffers/"
    relevance: "Zero-copy binary serialization format"

  - citation: "Protocol Buffers vs FlatBuffers: Benchmarking (2019)"
    url: "https://blog.logrocket.com/flatbuffers-vs-protocol-buffers/"
    relevance: "Performance comparison: FlatBuffers 7x faster deserialization"

  - citation: "Cap'n Proto vs FlatBuffers (2014)"
    url: "https://capnproto.org/news/2014-06-17-capnproto-flatbuffers-sbe.html"
    relevance: "Zero-copy serialization benchmarks"
