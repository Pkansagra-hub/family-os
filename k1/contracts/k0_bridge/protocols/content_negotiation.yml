# Content Negotiation Specification - K0 Bridge Protocol
# Purpose: Format selection algorithm for JSON/FlatBuffers dual protocol
# Status: Production-ready, RFC 7231 compliant
# ADR References: ADR-0001a (K0 Bridge Protocol), ADR-0014 (Dual Format)

version: "1.0"
specification_type: "content_negotiation"
related_adrs:
  - "ADR-0001a" # K0 Bridge Communication Protocol
  - "ADR-0014"  # JSON for REST API (Dual Format)
  - "RFC-7231"  # HTTP Content Negotiation

# ============================================================================
# CONTENT NEGOTIATION OVERVIEW
# ============================================================================

overview:
  description: |
    K0 Bridge supports dual protocol format (JSON PRIMARY, FlatBuffers SECONDARY).
    Content negotiation allows K1 clients to request preferred format via HTTP headers.
    K0 responds in requested format or falls back to JSON if unsupported.

  standards_compliance:
    - "RFC 7231 Section 5.3: Content Negotiation (Accept, Content-Type headers)"
    - "RFC 7231 Section 6.5.6: 415 Unsupported Media Type"
    - "RFC 7231 Section 12.1: Quality Values (q parameter)"

  format_priority:
    primary:
      format: "JSON (application/json)"
      reason: "K0 native format, human-readable, backward compatible"

    secondary:
      format: "FlatBuffers (application/x-flatbuffers)"
      reason: "K1 optimization, zero-copy, ~40% smaller payloads"

# ============================================================================
# HTTP HEADERS
# ============================================================================

http_headers:
  content_type:
    description: "Indicates format of request body"
    header_name: "Content-Type"

    values:
      - media_type: "application/json"
        description: "Request body is JSON"
        charset: "UTF-8"
        example: "Content-Type: application/json; charset=utf-8"

      - media_type: "application/x-flatbuffers"
        description: "Request body is FlatBuffers binary"
        charset: null
        example: "Content-Type: application/x-flatbuffers"

  accept:
    description: "Indicates client's preferred response format(s)"
    header_name: "Accept"

    values:
      - media_type: "application/json"
        description: "Client prefers JSON response"
        quality: 1.0
        example: "Accept: application/json"

      - media_type: "application/x-flatbuffers"
        description: "Client prefers FlatBuffers response"
        quality: 1.0
        example: "Accept: application/x-flatbuffers"

      - media_type: "*/*"
        description: "Client accepts any format (K0 defaults to JSON)"
        quality: 1.0
        example: "Accept: */*"

  quality_values:
    description: "RFC 7231 quality values (q parameter) for preference weighting"
    format: "q=<float between 0.0 and 1.0>"

    examples:
      - header: "Accept: application/x-flatbuffers;q=1.0, application/json;q=0.9"
        interpretation: "Prefer FlatBuffers (q=1.0), fall back to JSON (q=0.9)"

      - header: "Accept: application/json;q=1.0, application/x-flatbuffers;q=0.5"
        interpretation: "Prefer JSON (q=1.0), accept FlatBuffers if JSON unavailable (q=0.5)"

      - header: "Accept: */*;q=0.8, application/json;q=1.0"
        interpretation: "Prefer JSON (q=1.0), accept any other format (q=0.8)"

# ============================================================================
# FORMAT SELECTION ALGORITHM
# ============================================================================

format_selection_algorithm:
  description: |
    K0 selects response format based on Accept header and K0 capabilities.
    Algorithm follows RFC 7231 quality value prioritization.

  steps:
    - step: 1
      description: "Parse Accept header (extract media types and quality values)"
      example_input: "Accept: application/x-flatbuffers;q=1.0, application/json;q=0.9"
      parsed_output:
        - media_type: "application/x-flatbuffers"
          quality: 1.0
        - media_type: "application/json"
          quality: 0.9

    - step: 2
      description: "Sort media types by quality value (descending)"
      sorted_output:
        - media_type: "application/x-flatbuffers"
          quality: 1.0
        - media_type: "application/json"
          quality: 0.9

    - step: 3
      description: "Check K0 support for each media type (in quality order)"
      k0_supported_formats:
        - "application/json" # Always supported (PRIMARY)
        - "application/x-flatbuffers" # Supported (SECONDARY)

    - step: 4
      description: "Select first supported format with highest quality"
      selected_format: "application/x-flatbuffers"
      reason: "Highest quality (q=1.0) and K0 supports it"

    - step: 5
      description: "If no supported format, respond with 406 Not Acceptable"
      example: "Accept: application/xml (K0 does not support XML)"
      response_status: 406

  pseudocode: |
    def select_format(accept_header: str, supported_formats: List[str]) -> str:
        # Step 1: Parse Accept header
        media_types = parse_accept_header(accept_header)

        # Step 2: Sort by quality value (descending)
        media_types.sort(key=lambda mt: mt.quality, reverse=True)

        # Step 3-4: Find first supported format
        for media_type in media_types:
            if media_type.type in supported_formats:
                return media_type.type

        # Step 5: No supported format
        raise HTTPException(status_code=406, detail="No acceptable format")

# ============================================================================
# CLIENT-SERVER NEGOTIATION FLOWS
# ============================================================================

negotiation_flows:
  - name: "JSON Request → JSON Response (Default)"
    description: "Client sends JSON, requests JSON response"

    request:
      method: "POST"
      url: "/k0/ports/P02"
      headers:
        Content-Type: "application/json"
        Accept: "application/json"
      body_format: "JSON"

    k0_processing:
      parse_format: "JSON"
      response_format: "JSON (Accept header match)"

    response:
      status: 200
      headers:
        Content-Type: "application/json"
      body_format: "JSON"

  - name: "FlatBuffers Request → FlatBuffers Response (Optimized)"
    description: "K1 high-frequency operation, zero-copy deserialization"

    request:
      method: "POST"
      url: "/k0/ports/P01"
      headers:
        Content-Type: "application/x-flatbuffers"
        Accept: "application/x-flatbuffers"
      body_format: "FlatBuffers binary"

    k0_processing:
      parse_format: "FlatBuffers (zero-copy)"
      response_format: "FlatBuffers (Accept header match)"

    response:
      status: 200
      headers:
        Content-Type: "application/x-flatbuffers"
      body_format: "FlatBuffers binary"

  - name: "JSON Request → FlatBuffers Response (Mixed)"
    description: "Client sends JSON, prefers FlatBuffers response"

    request:
      method: "POST"
      url: "/k0/ports/P01"
      headers:
        Content-Type: "application/json"
        Accept: "application/x-flatbuffers, application/json;q=0.9"
      body_format: "JSON"

    k0_processing:
      parse_format: "JSON"
      response_format: "FlatBuffers (highest quality in Accept)"

    response:
      status: 200
      headers:
        Content-Type: "application/x-flatbuffers"
      body_format: "FlatBuffers binary"

  - name: "Wildcard Accept (K0 Defaults to JSON)"
    description: "Client accepts any format, K0 responds with PRIMARY (JSON)"

    request:
      method: "GET"
      url: "/k0/ports/P01"
      headers:
        Accept: "*/*"
      body_format: null

    k0_processing:
      response_format: "JSON (PRIMARY default)"

    response:
      status: 200
      headers:
        Content-Type: "application/json"
      body_format: "JSON"

  - name: "Unsupported Format (415 Error)"
    description: "Client requests unsupported format (e.g., XML, Protobuf)"

    request:
      method: "POST"
      url: "/k0/ports/P02"
      headers:
        Content-Type: "application/xml"
        Accept: "application/xml"
      body_format: "XML"

    k0_processing:
      error: "K0 does not support application/xml"

    response:
      status: 415
      headers:
        Content-Type: "application/json"
      body_format: "JSON error response"
      body:
        error: "unsupported_media_type"
        details: "K0 supports: application/json, application/x-flatbuffers"
        supported_formats: ["application/json", "application/x-flatbuffers"]

# ============================================================================
# K1 CLIENT BEHAVIOR
# ============================================================================

k1_client_behavior:
  default_preference:
    description: "K1 prefers JSON (PRIMARY) by default for compatibility"
    request_headers:
      Content-Type: "application/json"
      Accept: "application/json"

  high_frequency_optimization:
    description: "K1 uses FlatBuffers for latency-critical operations"
    triggers:
      - "LLM context assembly (P01 RecallQuery, >10 queries/sec)"
      - "Agent coordination messages (P02 MemoryWrite batches)"
      - "SessionState delta batching (P02, 250ms flush interval)"
    request_headers:
      Content-Type: "application/x-flatbuffers"
      Accept: "application/x-flatbuffers, application/json;q=0.9"

  fallback_strategy:
    description: "If K0 responds with 415, K1 retries with JSON"
    steps:
      - "K1 sends FlatBuffers request"
      - "K0 responds with 415 Unsupported Media Type"
      - "K1 detects 415, converts payload to JSON"
      - "K1 retries with Content-Type: application/json"
      - "K0 processes JSON successfully"

  caching:
    description: "K1 caches K0's supported formats to avoid 415 errors"
    mechanism:
      - "On first request, K1 sends FlatBuffers (optimistic)"
      - "If K0 responds with 200, cache 'FlatBuffers supported'"
      - "If K0 responds with 415, cache 'FlatBuffers NOT supported'"
      - "Subsequent requests use cached preference"
    cache_ttl: "300 seconds (5 minutes)"

# ============================================================================
# K0 SERVER BEHAVIOR
# ============================================================================

k0_server_behavior:
  supported_formats:
    - format: "application/json"
      priority: "PRIMARY"
      always_supported: true

    - format: "application/x-flatbuffers"
      priority: "SECONDARY"
      always_supported: true

  request_parsing:
    description: "K0 parses Content-Type to determine request format"

    json_parsing:
      content_type: "application/json"
      parser: "json.loads() (Python stdlib)"
      latency: "~2ms"

    flatbuffers_parsing:
      content_type: "application/x-flatbuffers"
      parser: "FlatBuffers.GetRootAs() (zero-copy)"
      latency: "<0.3ms"

  response_serialization:
    description: "K0 serializes response based on Accept header"

    json_serialization:
      accept: "application/json"
      serializer: "json.dumps() (Python stdlib)"
      latency: "~1.5ms"

    flatbuffers_serialization:
      accept: "application/x-flatbuffers"
      serializer: "FlatBuffers Builder (zero-copy)"
      latency: "<0.5ms"

  error_handling:
    unsupported_content_type:
      status: 415
      body:
        error: "unsupported_media_type"
        details: "Supported: application/json, application/x-flatbuffers"

    unsupported_accept:
      status: 406
      body:
        error: "not_acceptable"
        details: "K0 can respond in: application/json, application/x-flatbuffers"

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  negotiation_overhead:
    description: "Content negotiation adds minimal overhead"
    header_parsing: "<0.1ms (cached)"
    format_selection: "<0.05ms (simple lookup)"
    total_overhead: "<0.15ms P95"

  format_comparison:
    json:
      serialization_ms: 1.8
      deserialization_ms: 2.2
      payload_size_bytes: 1024

    flatbuffers:
      serialization_ms: 0.4
      deserialization_ms: 0.3
      payload_size_bytes: 640

  recommendation:
    low_frequency: "Use JSON (human-readable, easier debugging)"
    high_frequency: "Use FlatBuffers (4-7x faster, 40% smaller)"

# ============================================================================
# SECURITY CONSIDERATIONS
# ============================================================================

security:
  header_injection:
    risk: "Malicious Accept headers could cause denial-of-service"
    mitigation: "Limit Accept header length (<1KB), validate format"

  format_confusion:
    risk: "Client sends JSON with Content-Type: application/x-flatbuffers"
    mitigation: "K0 validates payload format matches Content-Type header"

  downgrade_attack:
    risk: "Attacker forces client to use slower JSON format"
    mitigation: "K1 observability tracks format usage, alerts on unexpected changes"

# ============================================================================
# OBSERVABILITY
# ============================================================================

observability:
  metrics:
    - name: "k0_bridge_requests_total"
      type: "counter"
      labels: ["protocol"]
      description: "Total requests by protocol (json, flatbuffers)"

    - name: "k0_bridge_format_negotiation_failures_total"
      type: "counter"
      labels: ["reason"]
      description: "Format negotiation failures (415, 406 errors)"

    - name: "k0_bridge_format_fallback_total"
      type: "counter"
      labels: ["from_format", "to_format"]
      description: "K1 format fallbacks (FlatBuffers → JSON)"

  logs:
    - event: "format_negotiation"
      level: "DEBUG"
      fields:
        - "envelope_id"
        - "request_content_type"
        - "accept_header"
        - "selected_response_format"
        - "negotiation_latency_ms"

# ============================================================================
# TESTING STRATEGY
# ============================================================================

testing:
  unit_tests:
    - "Parse Accept header with quality values"
    - "Format selection algorithm (prefer highest quality)"
    - "Wildcard Accept (*/*) defaults to JSON"
    - "Unsupported format returns 415"
    - "Quality value sorting (q=1.0 > q=0.9 > q=0.5)"

  integration_tests:
    - "JSON request → JSON response"
    - "FlatBuffers request → FlatBuffers response"
    - "JSON request → FlatBuffers response (mixed)"
    - "K1 fallback (415 → retry with JSON)"
    - "K0 format caching (avoid repeated 415 errors)"

  contract_tests:
    - "RFC 7231 compliance (Accept, Content-Type headers)"
    - "Quality value precedence (q=1.0 wins)"
    - "415 Unsupported Media Type format"
    - "406 Not Acceptable format"

  performance_tests:
    - "Content negotiation overhead <0.15ms P95"
    - "FlatBuffers request 4-7x faster than JSON"
    - "FlatBuffers payload 40% smaller than JSON"

# ============================================================================
# EXAMPLE IMPLEMENTATIONS
# ============================================================================

example_implementations:
  k1_client_python:
    description: "K1 Bridge Client with content negotiation"
    code: |
      import aiohttp
      import flatbuffers
      import json

      class K0BridgeClient:
          def __init__(self, prefer_flatbuffers=True):
              self.prefer_flatbuffers = prefer_flatbuffers
              self.k0_supports_flatbuffers = None  # Cache K0 capabilities

          async def post(self, port: str, envelope):
              # Determine format based on preference and K0 support
              if self.prefer_flatbuffers and self.k0_supports_flatbuffers != False:
                  content_type = "application/x-flatbuffers"
                  accept = "application/x-flatbuffers, application/json;q=0.9"
                  payload = serialize_flatbuffers(envelope)
              else:
                  content_type = "application/json"
                  accept = "application/json"
                  payload = json.dumps(envelope)

              # Send request
              try:
                  async with aiohttp.ClientSession() as session:
                      async with session.post(
                          f"https://k0:8080/ports/{port}",
                          data=payload,
                          headers={
                              "Content-Type": content_type,
                              "Accept": accept
                          }
                      ) as resp:
                          if resp.status == 415:
                              # K0 doesn't support FlatBuffers, cache and retry with JSON
                              self.k0_supports_flatbuffers = False
                              return await self.post(port, envelope)  # Retry

                          # Cache K0 supports FlatBuffers
                          if content_type == "application/x-flatbuffers":
                              self.k0_supports_flatbuffers = True

                          # Parse response based on Content-Type
                          response_content_type = resp.headers.get("Content-Type")
                          if "application/x-flatbuffers" in response_content_type:
                              return parse_flatbuffers(await resp.read())
                          else:
                              return await resp.json()

              except Exception as e:
                  logger.error(f"K0 Bridge error: {e}")
                  raise

  k0_server_python:
    description: "K0 FastAPI server with content negotiation"
    code: |
      from fastapi import FastAPI, Request, Response, HTTPException
      import json
      import flatbuffers

      app = FastAPI()

      SUPPORTED_FORMATS = ["application/json", "application/x-flatbuffers"]

      @app.post("/ports/{port}")
      async def handle_port(port: str, request: Request):
          # Parse Content-Type
          content_type = request.headers.get("content-type", "application/json")

          # Validate Content-Type
          if content_type not in SUPPORTED_FORMATS:
              raise HTTPException(
                  status_code=415,
                  detail={
                      "error": "unsupported_media_type",
                      "supported": SUPPORTED_FORMATS
                  }
              )

          # Parse request body
          if content_type == "application/x-flatbuffers":
              body = await request.body()
              envelope = parse_flatbuffers_envelope(body)
          else:
              body = await request.json()
              envelope = body

          # Process request
          result = await process_port(port, envelope)

          # Select response format based on Accept header
          accept = request.headers.get("accept", "application/json")
          response_format = select_format(accept, SUPPORTED_FORMATS)

          # Serialize response
          if response_format == "application/x-flatbuffers":
              response_body = serialize_flatbuffers(result)
              return Response(
                  content=response_body,
                  media_type="application/x-flatbuffers"
              )
          else:
              return result  # FastAPI auto-serializes to JSON

