# K0 Bridge Compression Specification
# Purpose: Define payload compression requirements for K1 → K0 bridge traffic
# Status: Production contract aligned with ADR-0022d and ADR-0025d

version: "1.0"
specification_type: "compression_policy"
related_adrs:
  - "ADR-0001a"   # K0 Bridge Communication Protocol
  - "ADR-0022d"   # FlatBuffers Batch Schema & Zero-Copy
  - "ADR-0025d"   # zstd Compression Strategy (70% reduction)

compression:
  codec: "zstd"
  compression_level:
    value: 3
    rationale: "Balanced speed/ratio; ≤10ms compress, ≥70% reduction for 128KB payloads"
  threshold_bytes:
    minimum: 4096
    rationale: "Skip compression when payload ≤4KB to avoid overhead"
  max_payload_bytes: 5242880  # 5 MB limit to stay within device memory constraints
  streaming_mode: false  # Single buffer compression; use chunked API if >5 MB
  timeout_budget_ms:
    compress: 20
    decompress: 10
  ratio_targets:
    expected_ratio: 0.30  # compressed/original ≤ 0.30 (≥70% reduction)
    minimum_ratio: 0.40   # trigger alert if compression ratio worsens (>40%)

headers:
  content_encoding:
    request: "zstd"        # Set when request body compressed
    response: "zstd"       # K0 responds with same encoding when applicable
  metadata_fields:
    - name: "X-K0-Original-Size"
      type: integer
      units: bytes
    - name: "X-K0-Compression-Ratio"
      type: float
      precision: 0.01

observability:
  metrics:
    - name: "k1_k0_bridge_compression_compressed_bytes_total"
      type: counter
      labels: [port, codec]
    - name: "k1_k0_bridge_compression_uncompressed_bytes_total"
      type: counter
      labels: [port]
    - name: "k1_k0_bridge_compression_duration_ms"
      type: histogram
      buckets_ms: [0.25, 0.5, 1, 2, 5, 10, 20]
    - name: "k1_k0_bridge_decompression_duration_ms"
      type: histogram
      buckets_ms: [0.1, 0.25, 0.5, 1, 2, 5, 10]
    - name: "k1_k0_bridge_compression_ratio"
      type: gauge
      labels: [port]
  traces:
    span_name_compress: "k0_bridge.compression.compress"
    span_name_decompress: "k0_bridge.compression.decompress"
    attributes:
      - "compression.codec"
      - "compression.level"
      - "compression.original_size"
      - "compression.compressed_size"
      - "cognitive_trace_id"
  logs:
    level: "DEBUG"
    fields:
      - name: "event"
        allowed_values:
          - "compression_applied"
          - "compression_skipped"
          - "compression_failed"
      - name: "codec"
      - name: "original_size"
      - name: "compressed_size"
      - name: "ratio"
      - name: "duration_ms"
      - name: "trace_id"

validation:
  payload_limits:
    max_input_bytes: 5242880
    max_output_bytes: 5242880
  error_handling:
    - condition: "compression_error"
      action: "emit metric + log error + fallback to identity payload"
    - condition: "ratio_above_minimum"
      action: "emit warning log + increment ratio_gauge + continue"
  test_vectors:
    - name: "payload_128kb"
      description: "Expect ≥70% reduction and <10ms compression"
      input_size_bytes: 131072
      expected_max_duration_ms: 10
      expected_max_ratio: 0.30
    - name: "payload_2kb"
      description: "Compression skipped (below threshold)"
      input_size_bytes: 2048
      expected_behavior: "skip"
    - name: "payload_1mb"
      description: "Ensure timeout budget respected"
      input_size_bytes: 1048576
      expected_max_duration_ms: 20
      expected_max_ratio: 0.35

compliance:
  privacy_bands:
    allowed_bands: ["GREEN", "AMBER", "RED"]
    red_band_requirement: "Encrypt after compression; compression must occur inside trusted enclave"
  capability_tags:
    - "compression"
    - "zstd"
    - "k0_bridge"

change_control:
  versioning:
    bump_policy: "Minor version bump when thresholds/config change; major when codec changes"
  verification:
    - "pytest tests/k1/bridge_k0/test_compression.py"
    - "pytest tests/k1/bridge_k0/test_protocol.py -k compression"
  rollout:
    staged_deployment:
      steps:
        - "Shadow compression metrics only"
        - "Enable compression for BACKGROUND priority"
        - "Enable compression for all payloads"
