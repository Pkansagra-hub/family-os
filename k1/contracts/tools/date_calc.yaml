# k1/contracts/tools/date_calc.yaml
# Date Calculator Tool Contract (Phase 1 -- Fabric E2E Validation)
#
# WASM tool contract for date arithmetic operations.
# GREEN-band pure computation. No I/O, no side effects.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 1, Section 3.2
#   - fabric_developer_guide.md Section 6

tool_contract:
  name: "tool.execute.date_calc"
  version: "1.0.0"
  domain:
    - "UTILITY"
    - "DATE"
  description: >
    Pure date arithmetic operations: days between two dates,
    add/subtract days from a date, weekday lookup, weekend check.
    Runs in WASM sandbox with no I/O access.
  capabilities:
    - "date_calculation"
    - "days_between"
    - "date_addition"
    - "weekday_lookup"
  limitations:
    - "pure_computation"
    - "no_timezone_awareness"
    - "no_recurring_patterns"
    - "iso_8601_dates_only"

  required_inputs:
    - name: "operation"
      type: "STRING"
      description: "Operation to perform: days_between, add_days, weekday, is_weekend"
      enum:
        - "days_between"
        - "add_days"
        - "weekday"
        - "is_weekend"
    - name: "date"
      type: "STRING"
      description: "Primary date in ISO 8601 format (YYYY-MM-DD)"

  optional_inputs:
    - name: "date2"
      type: "STRING"
      description: "Second date for days_between (ISO 8601, YYYY-MM-DD)"
    - name: "days"
      type: "NUMBER"
      description: "Number of days to add (positive) or subtract (negative) for add_days"
      default: 0

  output:
    type: "object"
    properties:
      result:
        description: "Operation result: integer (days_between), date string (add_days), weekday name (weekday), or boolean (is_weekend)"
      operation:
        type: "string"
        description: "Echo of the requested operation"
      input_date:
        type: "string"
        description: "Echo of the primary input date"
    required:
      - "result"
      - "operation"

  provider_type: "WASM"
  provider_id: "date_calc_wasm"
  safety_band_min: "GREEN"
  risk_class: "low"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 100
  availability: "ONLINE"
