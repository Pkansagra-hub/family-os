# k1/contracts/tools/notes_search.yaml
# Notes Search Tool Contract (Phase 3 -- Fabric E2E Validation)
#
# MCP tool contract for searching notes by keyword.
# GREEN-band read-only tool. Local stdio transport via FastMCP.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 3, Section 5.1

tool_contract:
  name: "tool.read.notes_search"
  version: "1.0.0"
  domain:
    - "NOTES"
    - "FAMILY"
  description: >
    Search notes by keyword. Performs a case-insensitive search
    across note titles and content. Returns matching notes
    ordered by relevance.
  capabilities:
    - "search_notes"
    - "keyword_search"
  limitations:
    - "read_only"
    - "local_storage"
    - "exact_substring_matching"

  required_inputs:
    - name: "query"
      type: "STRING"
      description: "Search keyword or phrase"

  optional_inputs:
    - name: "max_results"
      type: "NUMBER"
      description: "Maximum results to return (default 20)"
      default: 20

  output:
    type: "object"
    properties:
      results:
        type: "array"
        description: "Matching notes"
        items:
          type: "object"
          properties:
            note_id:
              type: "string"
            title:
              type: "string"
            snippet:
              type: "string"
              description: "Content snippet with match context"
            tags:
              type: "array"
              items:
                type: "string"
      count:
        type: "number"
        description: "Number of results"
    required:
      - "results"
      - "count"

  provider_type: "MCP"
  provider_id: "notes_mcp_stdio"
  safety_band_min: "GREEN"
  cost_per_call: 0.0
  avg_latency_ms: 20
  max_latency_ms: 500
  availability: "ONLINE"
