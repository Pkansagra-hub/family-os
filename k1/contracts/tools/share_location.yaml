# k1/contracts/tools/share_location.yaml
# Storyline capability (M12.E3.I1) — backed by LocalStubProvider.

tool_contract:
  name: "tool.execute.share_location"
  version: "1.0.0"
  domain:
    - "LOCATION"
    - "FAMILY"
  description: >
    Share a household member's current location with another party.
    Storyline capability for M12 conscience activation; backed by a
    deterministic local stub.
  capabilities:
    - "location_sharing"
  limitations:
    - "stub_implementation"
  required_inputs:
    - name: "subject"
      type: "STRING"
      description: "Member whose location is being shared."
    - name: "audience"
      type: "STRING"
      description: "Recipient identifier."
  output:
    type: "object"
    properties:
      receipt_id: {type: "string"}
      status: {type: "string"}
      timestamp: {type: "string"}
    required: ["receipt_id", "status", "timestamp"]
  provider_type: "LOCAL_STUB"
  provider_id: "share_location_stub"
  safety_band_min: "AMBER"
  risk_class: "high"
  social_act: "share_location"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 50
  availability: "ONLINE"
  requires_human_confirmation: true
  side_effects:
    - kind: "third_party_share"
      target: "location.realtime"
      reversible: false
      description: "Reveals real-time location to a third party."
