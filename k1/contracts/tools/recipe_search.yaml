# k1/contracts/tools/recipe_search.yaml
# Recipe Search Tool Contract (Phase 3 -- Fabric E2E Validation)
#
# MCP tool contract for searching recipes by ingredients or name.
# GREEN-band read-only tool. Remote SSE transport via FastMCP.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 3, Section 5.2

tool_contract:
  name: "tool.read.recipe_search"
  version: "1.0.0"
  domain:
    - "RECIPES"
    - "FAMILY"
  description: >
    Search for recipes by name or ingredients. Returns matching
    recipes with title, ingredients, and prep time. Read-only,
    backed by recipe data provider.
  capabilities:
    - "recipe_search"
    - "ingredient_search"
  limitations:
    - "read_only"
    - "api_rate_limited"

  required_inputs:
    - name: "query"
      type: "STRING"
      description: "Recipe name or ingredient(s) to search for"

  optional_inputs:
    - name: "cuisine"
      type: "STRING"
      description: "Filter by cuisine type (e.g. italian, mexican, asian)"
    - name: "max_results"
      type: "NUMBER"
      description: "Maximum recipes to return (default 10)"
      default: 10

  output:
    type: "object"
    properties:
      recipes:
        type: "array"
        description: "Matching recipes"
        items:
          type: "object"
          properties:
            recipe_id:
              type: "string"
            title:
              type: "string"
            cuisine:
              type: "string"
            prep_time_min:
              type: "number"
            ingredients:
              type: "array"
              items:
                type: "string"
      count:
        type: "number"
        description: "Number of recipes returned"
    required:
      - "recipes"
      - "count"

  provider_type: "MCP"
  provider_id: "recipes_mcp_sse"
  safety_band_min: "GREEN"
  cost_per_call: 0.0
  avg_latency_ms: 300
  max_latency_ms: 2000
  availability: "ONLINE"
