# k1/contracts/tools/set_routine.yaml
# Storyline capability (M12.E3.I1) — backed by LocalStubProvider.

tool_contract:
  name: "tool.execute.set_routine"
  version: "1.0.0"
  domain:
    - "ROUTINES"
    - "FAMILY"
  description: >
    Create or update a recurring household routine (chores, schedules,
    quiet hours). Storyline capability for M12 conscience activation;
    backed by a deterministic local stub.
  capabilities:
    - "routine_management"
  limitations:
    - "stub_implementation"
  required_inputs:
    - name: "name"
      type: "STRING"
      description: "Routine name."
    - name: "schedule"
      type: "STRING"
      description: "Cron-like schedule expression."
  output:
    type: "object"
    properties:
      receipt_id: {type: "string"}
      status: {type: "string"}
      timestamp: {type: "string"}
    required: ["receipt_id", "status", "timestamp"]
  provider_type: "LOCAL_STUB"
  provider_id: "set_routine_stub"
  safety_band_min: "AMBER"
  risk_class: "medium"
  social_act: "set_routine"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 50
  availability: "ONLINE"
  requires_human_confirmation: true
  side_effects:
    - kind: "data_write"
      target: "routines.spec"
      reversible: true
      description: "Persists a new or updated household routine."
