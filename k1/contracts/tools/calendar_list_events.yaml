# k1/contracts/tools/calendar_list_events.yaml
# Calendar List Events Tool Contract (Phase 1 -- Fabric E2E Validation)
#
# MCP tool contract for listing family calendar events by date range.
# GREEN-band read-only tool. Local stdio transport.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 1, Section 3.1
#   - fabric_developer_guide.md Section 3

tool_contract:
  name: "tool.read.calendar_list_events"
  version: "1.0.0"
  domain:
    - "CALENDAR"
    - "FAMILY"
  description: >
    List family calendar events within a date range. Returns events
    sorted by start time. Read-only, no side effects.
  capabilities:
    - "event_listing"
    - "date_range_query"
  limitations:
    - "read_only"
    - "no_recurring_expansion"
    - "max_90_day_range"

  required_inputs:
    - name: "start_date"
      type: "STRING"
      description: "Range start date (ISO 8601, e.g. 2025-01-01)"
    - name: "end_date"
      type: "STRING"
      description: "Range end date (ISO 8601, e.g. 2025-01-31)"

  optional_inputs:
    - name: "max_results"
      type: "NUMBER"
      description: "Maximum number of events to return (default: 50, max: 200)"
      default: 50

  output:
    type: "object"
    properties:
      events:
        type: "array"
        items:
          type: "object"
          properties:
            event_id:
              type: "string"
            title:
              type: "string"
            start_time:
              type: "string"
              description: "ISO 8601 datetime"
            end_time:
              type: "string"
              description: "ISO 8601 datetime"
            location:
              type: "string"
            description:
              type: "string"
          required:
            - "event_id"
            - "title"
            - "start_time"
            - "end_time"
      count:
        type: "integer"
        description: "Number of events returned"
    required:
      - "events"
      - "count"

  provider_type: "MCP"
  provider_id: "calendar_mcp_stdio"
  safety_band_min: "GREEN"
  risk_class: "low"
  cost_per_call: 0.0
  avg_latency_ms: 20
  max_latency_ms: 200
  availability: "ONLINE"
