# k1/contracts/tools/messaging_send_message.yaml
# Storyline capability (M12.E3.I1) — backed by LocalStubProvider.

tool_contract:
  name: "tool.execute.send_message"
  version: "1.0.0"
  domain:
    - "MESSAGING"
    - "FAMILY"
  description: >
    Send a text message to another household member or contact.
    Storyline capability for M12 conscience activation; backed by a
    deterministic local stub until a real messaging gateway is wired.
  capabilities:
    - "interpersonal_communication"
  limitations:
    - "stub_implementation"
    - "no_attachments"
  required_inputs:
    - name: "recipient"
      type: "STRING"
      description: "Recipient identifier (member id, phone, or handle)."
    - name: "body"
      type: "STRING"
      description: "Message body."
  output:
    type: "object"
    properties:
      receipt_id: {type: "string"}
      status: {type: "string"}
      timestamp: {type: "string"}
    required: ["receipt_id", "status", "timestamp"]
  provider_type: "LOCAL_STUB"
  provider_id: "send_message_stub"
  safety_band_min: "AMBER"
  risk_class: "high"
  social_act: "send_message"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 50
  availability: "ONLINE"
  requires_human_confirmation: true
  side_effects:
    - kind: "notification_send"
      target: "messaging.recipient"
      reversible: false
      description: "Delivers a message to a third party."
