# k1/contracts/tools/unit_convert.yaml
# Unit Converter Tool Contract (Phase 2 -- Fabric E2E Validation)
#
# WASM tool contract for unit conversion operations.
# GREEN-band pure computation. No I/O, no side effects.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 2, Section 4.2

tool_contract:
  name: "tool.execute.unit_convert"
  version: "1.0.0"
  domain:
    - "UTILITY"
    - "MATH"
  description: >
    Unit conversion across temperature, distance, weight, and volume.
    Pure computation in WASM sandbox. No I/O, no side effects.
  capabilities:
    - "temperature_conversion"
    - "distance_conversion"
    - "weight_conversion"
    - "volume_conversion"
  limitations:
    - "pure_computation"
    - "no_currency"
    - "predefined_units_only"

  required_inputs:
    - name: "category"
      type: "STRING"
      description: "Conversion category"
      enum:
        - "temperature"
        - "distance"
        - "weight"
        - "volume"
    - name: "from_unit"
      type: "STRING"
      description: "Source unit (e.g. 'C', 'km', 'kg', 'L')"
    - name: "to_unit"
      type: "STRING"
      description: "Target unit (e.g. 'F', 'mi', 'lb', 'gal')"
    - name: "value"
      type: "NUMBER"
      description: "Numeric value to convert"

  optional_inputs: []

  output:
    type: "object"
    properties:
      result:
        type: "number"
        description: "Converted value"
      from_unit:
        type: "string"
        description: "Echo of source unit"
      to_unit:
        type: "string"
        description: "Echo of target unit"
      category:
        type: "string"
        description: "Echo of conversion category"
    required:
      - "result"
      - "from_unit"
      - "to_unit"
      - "category"

  provider_type: "WASM"
  provider_id: "unit_convert_wasm"
  safety_band_min: "GREEN"
  cost_per_call: 0.0
  avg_latency_ms: 2
  max_latency_ms: 100
  availability: "ONLINE"
