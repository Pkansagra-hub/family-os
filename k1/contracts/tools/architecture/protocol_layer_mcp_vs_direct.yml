# Protocol Layer: MCP vs Direct API
#
# **Purpose:** Define the Protocol Layer (Layer 1) architecture for tool invocation.
# Compares MCP (80% adoption) vs Direct API (20% adoption) with transport options,
# performance characteristics, and selection criteria.
#
# **Source ADR:** ADR-0033 (Three-Tier Sandbox Strategy), ADR-0033a (MCP Protocol)
# **Related:** ADR-0033d (2D Selection Logic - Protocol Axis 1)
#
# **Key Principle:** Protocol Layer is ORTHOGONAL to Sandbox Layer.
# MCP works with WASM, Process, or Container sandboxes.
# Direct works with WASM, Process, or Container sandboxes.

---
protocol_layer:
  name: "Protocol Layer (Layer 1: HOW)"
  version: "1.0"
  description: "Tool invocation protocol - standardized (MCP) vs custom (Direct)"

  ## OVERVIEW
  overview:
    purpose: "Define how K1 communicates with tools"
    philosophy: |
      Protocol is the COMMUNICATION LAYER (like HTTP).
      Separate from Sandbox which is the EXECUTION LAYER (like Docker).
      Both layers compose to form complete tool execution strategy.

    adoption_distribution:
      mcp: "80% (608 tools) - Industry standard, recommended"
      direct: "20% (152 tools) - Legacy tools, no MCP server"

  ## MCP PROTOCOL (80% OF TOOLS)
  mcp_protocol:
    name: "MCP Protocol"
    adoption_percent: 80
    adoption_count: 608
    status: "Recommended"

    description: |
      JSON-RPC 2.0 based protocol for standardized tool discovery and invocation.
      Industry standard adopted by Claude, ChatGPT, Copilot, and other AI platforms.

    specification:
      rfc: "JSON-RPC 2.0 (RFC 2119)"
      format: "JSON"
      request_format:
        jsonrpc: "2.0"
        method: "string (e.g., 'tools/call')"
        params: "object (tool-specific parameters)"
        id: "string (request ID for response matching)"

      response_format:
        jsonrpc: "2.0"
        result: "object (success)"
        id: "string (matching request ID)"

      error_format:
        jsonrpc: "2.0"
        error:
          code: "integer (-32000 to -32099 reserved)"
          message: "string (error description)"
          data: "object (optional error details)"
        id: "string (matching request ID)"

    transports:
      - name: "Stdio Transport"
        id: "stdio"
        description: "JSON-RPC over stdin/stdout pipes (newline-delimited JSON)"
        format: "Newline-delimited JSON (each message on separate line)"
        use_case: "Process sandbox MCP servers"
        adoption: "70% (424 tools)"

        characteristics:
          overhead: "<5ms per request (same process)"
          bidirectional: true
          reliability: "Process-managed (tight coupling)"
          performance_tier: "Native (lowest latency)"

        implementation:
          server_process: "spawned via subprocess.Popen()"
          stdin_pipe: "MCPClient writes JSON requests"
          stdout_pipe: "MCPClient reads JSON responses"
          stderr: "Tool logging (not protocol)"

        message_format: |
          {"jsonrpc":"2.0","method":"tools/list","id":"req-001"}\n
          {"jsonrpc":"2.0","result":{...},"id":"req-001"}\n

        advantages:
          - "No network overhead"
          - "Sub-millisecond latency"
          - "Process isolation (separate PID)"
          - "Simple bidirectional communication"

        limitations:
          - "Requires subprocess spawning"
          - "Tied to process lifecycle"
          - "Cannot share across network (no remote execution)"

      - name: "HTTP Transport"
        id: "http"
        description: "JSON-RPC over HTTP POST requests"
        format: "JSON in HTTP request/response body"
        use_case: "WASM sandbox MCP servers, remote invocation"
        adoption: "10% (61 tools)"

        characteristics:
          overhead: "<10ms per request (network latency)"
          bidirectional: false  # Request/response pattern
          reliability: "HTTP-managed (loose coupling)"
          performance_tier: "Network-dependent"

        implementation:
          server_process: "HTTP server listening on port"
          request_method: "POST /rpc"
          request_header: "Content-Type: application/json"
          request_body: "JSON-RPC request object"
          response_body: "JSON-RPC response object"

        message_format: |
          POST /rpc HTTP/1.1
          Content-Type: application/json

          {"jsonrpc":"2.0","method":"tools/list","id":"req-001"}

          HTTP/1.1 200 OK
          Content-Type: application/json

          {"jsonrpc":"2.0","result":{...},"id":"req-001"}

        advantages:
          - "Works from anywhere (no subprocess required)"
          - "HTTP standard (firewall-friendly)"
          - "WASM compatible (no file I/O)"
          - "Network-based (multi-instance possible)"

        limitations:
          - "Network latency (~10ms)"
          - "HTTP overhead vs stdio"
          - "Requires HTTP server implementation"

    standard_methods:
      - name: "initialize"
        description: "Initialize MCP server, return capabilities"
        request:
          method: "initialize"
          params: {}
        response:
          capabilities: "array (e.g., [tools/call, tools/list])"
          server_info: "object"

      - name: "tools/list"
        description: "List all available tools"
        request:
          method: "tools/list"
          params: {}
        response:
          tools: "array of tool definitions"

      - name: "tools/call"
        description: "Invoke tool with parameters"
        request:
          method: "tools/call"
          params:
            tool_name: "string"
            arguments: "object"
        response:
          result: "object (tool result)"

      - name: "shutdown"
        description: "Graceful shutdown"
        request:
          method: "shutdown"
          params: {}
        response:
          status: "ok"

    advantages:
      - "Industry standard (Claude, ChatGPT, Copilot)"
      - "Good performance (<50ms overhead)"
      - "Extensible (custom methods supported)"
      - "Multi-transport support (stdio + HTTP)"
      - "Request/response matching by ID"
      - "Error handling standardized"

    disadvantages:
      - "Requires MCP server implementation"
      - "Not all legacy tools have MCP servers"

  ## DIRECT API (20% OF TOOLS)
  direct_api:
    name: "Direct API"
    adoption_percent: 20
    adoption_count: 152
    status: "Legacy / Fallback"

    description: |
      Direct invocation of tools via REST API or CLI command line.
      Used for legacy tools without MCP server implementations.

    options:
      - name: "REST API"
        id: "rest_api"
        description: "HTTP REST API (GET/POST/etc)"
        use_case: "Web-based services without MCP"
        adoption: "8% (61 tools)"

        characteristics:
          overhead: "<15ms per request (network latency)"
          method: "HTTP GET/POST/PUT/DELETE"
          standard: "REST architectural style"

        implementation:
          client_code: |
            import requests
            response = requests.post(
              "https://api.example.com/weather",
              json={"lat": 40.7128, "lon": -74.0060}
            )
            result = response.json()

        examples:
          - name: "OpenWeatherMap REST API"
            endpoint: "https://api.openweathermap.org/data/2.5/weather"
            method: "GET"

          - name: "Google Calendar REST API"
            endpoint: "https://www.googleapis.com/calendar/v3/calendars"
            method: "GET"

        advantages:
          - "Standard HTTP protocol"
          - "Firewall-friendly"
          - "Works across networks"
          - "Simple request/response"

        disadvantages:
          - "No standardized discovery"
          - "Tool-specific implementation required"
          - "Network latency overhead"

      - name: "CLI Command"
        id: "cli"
        description: "Shell command line invocation"
        use_case: "CLI tools (ffmpeg, imagemagick, etc)"
        adoption: "12% (91 tools)"

        characteristics:
          overhead: "<50ms per invocation (process spawn)"
          method: "execve() / subprocess"
          standard: "Unix command line"

        implementation:
          client_code: |
            import subprocess
            result = subprocess.run([
              "ffmpeg", "-i", "input.mp4",
              "-vf", "scale=1280:720", "output.mp4"
            ], capture_output=True, text=True)
            output = result.stdout

        examples:
          - name: "FFmpeg video transcoding"
            command: "ffmpeg -i input.mp4 -c:v libx264 output.mp4"

          - name: "ImageMagick image processing"
            command: "convert input.png -resize 800x600 output.png"

          - name: "Pandoc document conversion"
            command: "pandoc input.md -o output.pdf"

        advantages:
          - "Works with any Unix tool"
          - "No server required"
          - "Simple shell integration"
          - "Full Unix environment access"

        disadvantages:
          - "Process spawn overhead (~50ms)"
          - "No standardized discovery"
          - "Tool-specific argument formatting"
          - "Output parsing required"

    advantages:
      - "Works with any existing tool"
      - "No MCP server required"
      - "Flexible (custom APIs)"

    disadvantages:
      - "No standardized discovery"
      - "Tool-specific implementation required"
      - "Higher latency (REST: ~15ms, CLI: ~50ms)"

  ## PROTOCOL SELECTION CRITERIA
  selection_criteria:
    criterion_1_mcp_availability:
      description: "Does the tool have MCP server?"
      if_yes: "Use MCP Protocol (preferred)"
      if_no: "Use Direct API"

    criterion_2_standard_support:
      description: "Is the tool industry-standard with good MCP support?"
      examples: "Weather API, Calendar API, Image Generator"
      recommendation: "Prefer MCP Protocol"

    criterion_3_legacy_tool:
      description: "Is this a legacy CLI tool (ffmpeg, imagemagick)?"
      examples: "ffmpeg, imagemagick, graphviz, pandoc"
      recommendation: "Use Direct API (CLI)"

    criterion_4_performance_critical:
      description: "Is sub-10ms latency critical?"
      if_yes: "Prefer stdio transport (MCP) or Direct API (CLI)"
      if_no: "HTTP transport (MCP) acceptable"

    criterion_5_remote_execution:
      description: "Must tool execute on remote server?"
      if_yes: "Use REST API (Direct) or HTTP transport (MCP)"
      if_no: "Prefer stdio transport (MCP) for performance"

  ## PERFORMANCE COMPARISON
  performance:
    transport_latencies:
      mcp_stdio: "<5ms (same process, no network)"
      mcp_http: "<10ms (network latency typical)"
      direct_rest: "<15ms (network latency typical)"
      direct_cli: "<50ms (process spawn overhead)"

    typical_end_to_end:
      mcp_process_sandbox: "~20ms (protocol + sandbox setup)"
      direct_cli_process_sandbox: "~60ms (CLI spawn + sandbox)"
      mcp_wasm_sandbox: "~15ms (protocol + WASM overhead)"

    priority_ranking:
      first: "MCP + stdio (Process sandbox) - <20ms typical"
      second: "Direct CLI (Process sandbox) - <60ms typical"
      third: "MCP + HTTP (WASM sandbox) - <15ms typical"
      fourth: "Direct REST API - <15ms typical"

  ## OBSERVABILITY
  observability:
    metrics:
      - name: "k1_protocol_invocations_total"
        labels: ["protocol", "method", "status"]
        type: "Counter"
        description: "Total protocol invocations (MCP vs Direct)"

      - name: "k1_protocol_latency_ms"
        labels: ["protocol", "transport"]
        type: "Histogram"
        description: "Protocol latency (stdio vs HTTP)"

      - name: "k1_protocol_errors_total"
        labels: ["protocol", "error_code"]
        type: "Counter"
        description: "Protocol errors"

      - name: "k1_protocol_fallback_total"
        labels: ["from_protocol", "to_protocol"]
        type: "Counter"
        description: "Protocol fallbacks (MCP → Direct if MCP fails)"

    tracing:
      - span_name: "protocol_invocation"
        attributes:
          - protocol: "mcp|direct"
          - transport: "stdio|http|rest|cli"
          - tool_name: "string"
          - method: "string"
          - latency_ms: "number"

    logging:
      - level: "INFO"
        message: "protocol_invocation_started"
        fields: ["protocol", "tool_name", "method", "trace_id"]

      - level: "INFO"
        message: "protocol_invocation_completed"
        fields: ["protocol", "tool_name", "latency_ms", "trace_id"]

      - level: "ERROR"
        message: "protocol_invocation_failed"
        fields: ["protocol", "tool_name", "error_code", "error_message", "trace_id"]

---

# INTEGRATION WITH SANDBOX LAYER

layer_integration:
  principle: |
    Protocol Layer (Layer 1) is completely orthogonal to Sandbox Layer (Layer 2).
    MCP works with WASM, Process, or Container.
    Direct works with WASM, Process, or Container.

  composition:
    mcp_with_wasm: "MCP server implemented in WASM (HTTP transport)"
    mcp_with_process: "MCP server in native Python process (stdio transport)"
    mcp_with_container: "MCP server in container (HTTP or stdio transport)"

    direct_with_wasm: "Direct WASM function invocation"
    direct_with_process: "Direct CLI command execution"
    direct_with_container: "Direct command in container"

  examples:
    - protocol: "MCP"
      transport: "stdio"
      sandbox: "process"
      tool: "weather_api.py"
      adoption: "70%"

    - protocol: "MCP"
      transport: "http"
      sandbox: "wasm"
      tool: "user_plugin.wasm"
      adoption: "10%"

    - protocol: "Direct"
      transport: "cli"
      sandbox: "process"
      tool: "ffmpeg"
      adoption: "15%"

    - protocol: "MCP"
      transport: "http"
      sandbox: "container"
      tool: "booking_engine"
      adoption: "5%"
