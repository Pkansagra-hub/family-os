# 2D Tool Execution Architecture: Protocol × Sandbox
#
# **Purpose:** Define the 2-layer tool execution architecture combining Protocol Layer
# (MCP vs Direct API) × Sandbox Layer (WASM vs Process vs Container) to provide
# 100% tool coverage with graduated security isolation.
#
# **Source ADR:** ADR-0033 (Three-Tier Sandbox Strategy)
# **Related ADRs:** ADR-0033a (MCP Protocol), ADR-0033b (WASM Sandbox),
#                   ADR-0033c (Process Sandbox), ADR-0033d (2D Selection Logic)
#
# **Architecture Vision:**
# - Layer 1 (Protocol): Standardized communication (MCP vs Direct)
# - Layer 2 (Sandbox): Graduated isolation (WASM vs Process vs Container)
# - Orthogonal concerns that work TOGETHER (not as alternatives)
# - 6 valid combinations providing 100% tool coverage
#
# **Key Principle:** MCP provides the PROTOCOL (like HTTP), while
# WASM/Process/Container provide the SANDBOX (like Docker/VMs/native processes).
# They are independent layers that compose to form complete tool execution strategy.

---
architecture:
  name: "K1 Tool Execution Architecture"
  version: "1.0"
  description: "2-layer tool execution with Protocol × Sandbox matrix"

  ## LAYER 1: PROTOCOL (How tools are invoked)
  protocol_layer:
    name: "Protocol Layer"
    purpose: "Standardized tool discovery and invocation interface"
    description: |
      Defines HOW tools are invoked: through standardized protocol (MCP)
      or direct API/CLI invocation.

    options:
      - name: "MCP Protocol"
        id: "mcp"
        adoption: "80%"  # 608 out of 760 tools
        description: "JSON-RPC 2.0 over stdio/HTTP for standardized tool integration"
        implementation: "Standardized, industry-adopted (Claude, ChatGPT, Copilot)"
        transports:
          - type: "stdio"
            description: "JSON-RPC over stdin/stdout pipes (newline-delimited JSON)"
            use_case: "Process sandbox MCP servers"
            overhead: "<5ms per request"

          - type: "http"
            description: "JSON-RPC over HTTP POST requests"
            use_case: "WASM sandbox MCP servers (stdio unavailable in WASM)"
            overhead: "<10ms per request (including network latency)"

        features:
          - "Standardized tool discovery (tools/list RPC)"
          - "Standardized tool invocation (tools/call RPC)"
          - "Error handling with JSON-RPC error codes"
          - "Request/response tracking by ID"
          - "Timeout enforcement per tool"

        strengths:
          - "Industry standard (adopted by leading AI platforms)"
          - "Good performance (<50ms overhead)"
          - "Extensible (custom methods supported)"
          - "Multi-transport support (stdio + HTTP)"

        limitations:
          - "Requires MCP server implementation"
          - "Not all legacy tools have MCP servers yet"

      - name: "Direct API"
        id: "direct"
        adoption: "20%"  # 152 out of 760 tools
        description: "REST/CLI invocation for legacy tools without MCP servers"
        implementation: "Custom API or shell command execution"
        transports:
          - type: "rest_api"
            description: "HTTP REST API (GET/POST/etc)"
            use_case: "Web-based services without MCP"
            overhead: "<15ms per request"

          - type: "cli"
            description: "Shell command line invocation"
            use_case: "CLI tools (ffmpeg, imagemagick, etc)"
            overhead: "<50ms per invocation (process spawn)"

        features:
          - "Direct invocation without abstraction layer"
          - "Support for legacy tools"
          - "Custom argument passing"

        strengths:
          - "Works with any tool (no server required)"
          - "Simple for CLI tools"

        limitations:
          - "No standardized discovery"
          - "Tool-specific implementation required"
          - "Higher latency for CLI tools (process spawn overhead)"

  ## LAYER 2: SANDBOX (Where tools execute)
  sandbox_layer:
    name: "Sandbox Layer"
    purpose: "Graduated isolation based on tool trust level and risk"
    description: |
      Defines WHERE tools execute: in WASM sandbox (maximum security),
      process sandbox (standard isolation), or container sandbox (hardware isolation).

    options:
      - name: "WASM Sandbox"
        id: "wasm"
        adoption: "15%"  # 114 out of 760 tools
        description: "WebAssembly sandbox for untrusted code with zero native syscalls"
        isolation_level: "MAXIMUM"
        trust_level: "UNTRUSTED"

        runtime: "Wasmtime"
        memory_overhead: "<5MB per module"
        boot_time: "<10ms"

        security_features:
          - "Zero syscalls (100% capability-based I/O)"
          - "Capability-based network access (WASI hosts)"
          - "Capability-based filesystem access (WASI preopen dirs)"
          - "Cross-platform execution (Linux/macOS/Windows)"
          - "Memory sandbox (no access to host memory)"

        features:
          - "User plugin support (untrusted WASM code)"
          - "Maximum isolation from host OS"
          - "Deterministic execution"

        performance:
          - "Latency: 10x slower than native (5ms per call)"
          - "Acceptable for 15% untrusted tools"
          - "Overhead: <5MB memory per module"

        use_cases:
          - "User plugins (untrusted code)"
          - "Third-party tools (no audit)"
          - "Experimental/new tools"
          - "Cross-platform tools"

        strengths:
          - "Maximum security (zero syscalls)"
          - "Capability-based isolation"
          - "Cross-platform"
          - "Low memory overhead"

        limitations:
          - "10x slower than native"
          - "Limited to tools available as WASM"

      - name: "Process Sandbox"
        id: "process"
        adoption: "80%"  # 608 out of 760 tools
        description: "OS process with chroot + seccomp + cgroups + ADR-0032 egress controls"
        isolation_level: "STANDARD"
        trust_level: "STANDARD / VERIFIED"

        runtime: "Linux OS + Python/native subprocess"
        memory_overhead: "<50MB per process"
        boot_time: "<100ms"

        security_features:
          - "Network isolation (ADR-0032a: iptables + bands)"
          - "Filesystem isolation (ADR-0032b: chroot + seccomp)"
          - "Resource isolation (ADR-0032c: cgroups v2)"
          - "Violation audit logging (ADR-0032d: K0 trail)"

        features:
          - "Native performance"
          - "Support for legacy tools"
          - "Standard Unix process model"
          - "Integration with ADR-0032 egress rules"

        performance:
          - "Latency: Native speed (<5ms overhead)"
          - "Overhead: <50MB memory per process"

        use_cases:
          - "Standard tools (80% of tools)"
          - "Performance-critical tools"
          - "Verified third-party APIs"
          - "Internal services"

        strengths:
          - "Native performance"
          - "Support for any Unix tool"
          - "Well-understood isolation model"
          - "Comprehensive egress controls (ADR-0032)"

        limitations:
          - "Requires Linux (main K1 platform)"
          - "Syscalls allowed (can be exploited if kernel 0-day)"

      - name: "Container Sandbox"
        id: "container"
        adoption: "5%"  # 38 out of 760 tools
        description: "Firecracker microVM or gVisor for hardware-level isolation of RED band tools"
        isolation_level: "MAXIMUM (HARDWARE)"
        trust_level: "UNTRUSTED / CRITICAL"

        runtime: "Firecracker microVM or gVisor"
        memory_overhead: "<100MB per container"
        boot_time: "<125ms"

        security_features:
          - "Hardware-level isolation (Firecracker: hypervisor)"
          - "Alternative: Kernel-level isolation (gVisor: guest kernel)"
          - "No host kernel access"
          - "Independent OS instance per tool"

        features:
          - "Maximum isolation for high-risk tools"
          - "RED band support (no host compromise even if tool exploited)"
          - "Independent OS instance"

        performance:
          - "Latency: 125ms boot overhead"
          - "Overhead: 100MB memory per container"
          - "Use for <5% tools (high-risk operations)"

        use_cases:
          - "RED band tools (booking, payment, PII)"
          - "Untrusted third-party code"
          - "Code execution tools"
          - "High-risk operations"

        strengths:
          - "Hardware-level isolation"
          - "No host kernel compromise risk"
          - "Maximum security"

        limitations:
          - "125ms boot overhead (unacceptable for standard tools)"
          - "100MB memory overhead"
          - "Use only for <5% critical tools"

  ## VALID COMBINATIONS (2D MATRIX)
  valid_combinations:
    description: "6 valid Protocol × Sandbox combinations providing 100% tool coverage"

    matrix:
      - protocol: "MCP"
        sandbox: "WASM"
        adoption_percent: 10
        adoption_count: 76
        examples: ["user_plugin.wasm", "experimental_tool.wasm"]
        rationale: |
          MCP server implemented in WASM (untrusted code). HTTP transport
          (stdio unavailable in WASM). Maximum security for user plugins.
        use_case: "Untrusted MCP implementations, user code"
        performance: "10x slower, <5MB memory"
        priority: "P3 (nice to have)"

      - protocol: "MCP"
        sandbox: "PROCESS"
        adoption_percent: 70
        adoption_count: 532
        examples: ["weather_api.py", "calendar_sync.py", "image_processor.py"]
        rationale: |
          Standard MCP server in process sandbox. Stdio transport.
          Best for verified third-party APIs with MCP support. Native performance
          with comprehensive ADR-0032 egress controls.
        use_case: "Standard tools (70%)"
        performance: "Native speed (<5ms overhead)"
        priority: "P1 (critical)"

      - protocol: "MCP"
        sandbox: "CONTAINER"
        adoption_percent: 5
        adoption_count: 38
        examples: ["booking_engine.py", "payment_processor.py"]
        rationale: |
          MCP server in container for RED band tools. Hardware-level isolation.
          125ms boot overhead acceptable for non-real-time operations.
        use_case: "RED band tools (high-risk)"
        performance: "125ms boot, 100MB memory"
        priority: "P2 (important)"

      - protocol: "DIRECT"
        sandbox: "WASM"
        adoption_percent: 2
        adoption_count: 15
        examples: ["custom_wasm_tool.wasm"]
        rationale: |
          Direct CLI invocation of WASM tool. Rare (most WASM tools use MCP).
          Maximum security for untrusted code.
        use_case: "Experimental untrusted code"
        performance: "10x slower"
        priority: "P4 (rarely used)"

      - protocol: "DIRECT"
        sandbox: "PROCESS"
        adoption_percent: 15
        adoption_count: 114
        examples: ["ffmpeg", "imagemagick", "graphviz", "pandoc"]
        rationale: |
          CLI tool invocation (direct API). No MCP server available.
          Native performance with ADR-0032 egress controls.
        use_case: "Legacy tools, CLI utilities (15%)"
        performance: "Native speed + 50ms process spawn"
        priority: "P1 (critical)"

      - protocol: "DIRECT"
        sandbox: "CONTAINER"
        adoption_percent: "<1"
        adoption_count: "<1"
        examples: []
        rationale: |
          Rare. Direct CLI in container. Use only if tool MUST have
          hardware isolation AND no MCP available AND no WASM option.
        use_case: "Very rare edge cases"
        performance: "125ms boot + 50ms spawn overhead"
        priority: "P4 (rarely used)"

  ## COVERAGE ANALYSIS
  coverage:
    total_tools: 760
    coverage_by_protocol:
      mcp: "80% (608 tools)"
      direct: "20% (152 tools)"

    coverage_by_sandbox:
      wasm: "15% (114 tools)"
      process: "80% (608 tools)"
      container: "5% (38 tools)"

    coverage_by_band:
      green: "40% (304 tools) → Process or WASM sandbox, MCP preferred"
      amber: "35% (266 tools) → Process sandbox, MCP preferred"
      red: "20% (152 tools) → Container sandbox, MCP preferred"
      black: "5% (38 tools) → Container sandbox, Direct API if no MCP"

    summary: "100% of tools covered by at least one valid combination"

  ## INTEGRATION POINTS
  integration:
    layer_1_protocol:
      mcp_protocol:
        file: "contracts/tools/mcp_protocol/json_rpc_2_0_protocol.yml"
        description: "JSON-RPC 2.0 protocol specification"

      direct_api:
        file: "contracts/tools/direct_api/direct_api_contract.yml"
        description: "Direct API invocation (REST/CLI)"

    layer_2_sandbox:
      wasm_sandbox:
        file: "contracts/tools/wasm_sandbox/wasmtime_runtime.yml"
        description: "WASM sandbox implementation (ADR-0033b)"

      process_sandbox:
        file: "contracts/tools/process_sandbox/os_process_isolation.yml"
        description: "Process sandbox implementation (ADR-0033c)"
        depends_on: "ADR-0032 (Band-Based Egress Rules)"

      container_sandbox:
        file: "contracts/tools/container_sandbox/firecracker_container.yml"
        description: "Container sandbox implementation (Firecracker/gVisor)"

    selection_logic:
      file: "contracts/tools/selection/tool_execution_selector.yml"
      description: "2D selection logic (ADR-0033d)"

    tool_registry:
      file: "k1/config/tool_registry.yml"
      description: "Tool registry with protocol/sandbox assignments"

  ## LAYERING PRINCIPLE
  layering:
    principle: "Protocol and Sandbox are ORTHOGONAL layers"

    explanation: |
      Protocol (Layer 1) defines HOW tools are invoked.
      Sandbox (Layer 2) defines WHERE tools execute.

      These are independent concerns:
      - You can use MCP Protocol with ANY sandbox (WASM, Process, Container)
      - You can use Direct API with ANY sandbox (WASM, Process, Container)
      - You can use ANY sandbox with ANY protocol

      They compose to form 6 valid combinations, not alternatives.

    analogy: |
      Protocol is like HTTP (transport layer).
      Sandbox is like Docker/VMs/native processes (execution layer).
      HTTP works with any execution environment.
      Docker/VMs work with any communication protocol.

  ## PERFORMANCE TARGETS (P95)
  performance:
    protocol_overhead:
      mcp_stdio: "<5ms per request"
      mcp_http: "<10ms per request"
      direct_api: "<15ms per request"
      direct_cli: "<50ms per invocation (process spawn)"

    sandbox_overhead:
      wasm: "10x slower than native (5ms per call)"
      process: "<5ms overhead (already spawned)"
      container: "125ms boot time (amortized if reused)"

    total_latency_targets:
      mcp_process: "P95 < 50ms (standard case)"
      mcp_wasm: "P95 < 100ms (untrusted code)"
      direct_process: "P95 < 100ms (CLI tools)"
      mcp_container: "P95 < 200ms (RED band, includes boot)"

  ## SECURITY BUDGETS
  security:
    wasm_sandbox:
      trust_level: "Maximum (zero syscalls)"
      network_egress: "Capability-based (WASI hosts)"
      filesystem_access: "Capability-based (WASI preopen dirs)"
      memory_isolation: "100% (separate linear memory)"

    process_sandbox:
      trust_level: "Standard (syscalls filtered by seccomp)"
      network_egress: "ADR-0032a (iptables + bands)"
      filesystem_access: "ADR-0032b (chroot + seccomp)"
      resource_limits: "ADR-0032c (cgroups v2)"

    container_sandbox:
      trust_level: "Maximum (hardware isolation)"
      network_egress: "Host firewall + container networking"
      filesystem_access: "Container root filesystem"
      resource_limits: "Hypervisor enforcement"

---

# SCHEMA: Tool Definition (in k1/config/tool_registry.yml)

tool_definition_schema:
  fields:
    tool_id:
      type: "uuid"
      description: "Unique identifier"

    name:
      type: "string"
      description: "Tool name (e.g., weather_api)"

    description:
      type: "string"
      description: "Tool description"

    band:
      type: "enum"
      values: ["GREEN", "AMBER", "RED", "BLACK"]
      description: "Privacy band classification"

    # Layer 1: Protocol
    protocol:
      type: "enum"
      values: ["mcp", "direct"]
      description: "Primary protocol (MCP or Direct API)"

    # Layer 1 Config: MCP
    mcp_config:
      type: "object"
      optional: true
      fields:
        server_path:
          type: "string"
          description: "Path to MCP server (Python, WASM, etc)"

        transport:
          type: "enum"
          values: ["stdio", "http"]
          description: "Transport (stdio for Process, http for WASM)"

        timeout_seconds:
          type: "integer"
          description: "Tool-specific timeout in seconds"

    # Layer 1 Config: Direct
    direct_config:
      type: "object"
      optional: true
      fields:
        api_url:
          type: "string"
          description: "REST API endpoint"

        cli_command:
          type: "string"
          description: "CLI command for execution"

        timeout_seconds:
          type: "integer"
          description: "Tool-specific timeout in seconds"

    # Layer 2: Sandbox
    sandbox:
      type: "enum"
      values: ["wasm", "process", "container"]
      description: "Primary sandbox type"

    sandbox_fallback:
      type: "enum"
      values: ["wasm", "process", "container"]
      optional: true
      description: "Fallback sandbox if primary unavailable"

    # Layer 2 Config: WASM
    wasm_config:
      type: "object"
      optional: true
      fields:
        wasm_path:
          type: "string"
          description: "Path to .wasm file"

        wasi_hosts:
          type: "array[string]"
          description: "Capability-based hosts (e.g., *.openai.com)"

        memory_max_bytes:
          type: "integer"
          default: 5242880
          description: "Max memory (default 5MB)"

    # Layer 2 Config: Process
    sandbox_config:
      type: "object"
      optional: true
      fields:
        allowed_domains:
          type: "array[string]"
          description: "Network egress whitelist (ADR-0032a)"

        allowed_syscalls:
          type: "array[string]"
          description: "Filtered syscalls via seccomp (ADR-0032b)"

        cpu_limit:
          type: "integer"
          description: "CPU limit via cgroups (ADR-0032c)"

        memory_limit_mb:
          type: "integer"
          default: 512
          description: "Memory limit via cgroups (ADR-0032c)"

    # Layer 2 Config: Container
    container_config:
      type: "object"
      optional: true
      fields:
        image:
          type: "string"
          description: "Container image (Firecracker or gVisor)"

        memory_limit_mb:
          type: "integer"
          description: "Container memory limit"

        cpu_limit:
          type: "float"
          description: "Container CPU limit"
