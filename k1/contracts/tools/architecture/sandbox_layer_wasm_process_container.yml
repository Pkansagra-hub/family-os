# Sandbox Layer: WASM vs Process vs Container
#
# **Purpose:** Define the Sandbox Layer (Layer 2) architecture for tool execution.
# Compares graduated isolation: WASM (max security, 15%), Process (performance, 80%),
# Container (hardware isolation, 5%).
#
# **Source ADR:** ADR-0033 (Three-Tier Sandbox Strategy), ADR-0033b, ADR-0033c
# **Related:** ADR-0033d (2D Selection Logic - Sandbox Axis 2), ADR-0032 (Egress)
#
# **Key Principle:** Sandbox Layer is ORTHOGONAL to Protocol Layer.
# Any protocol works with any sandbox.

---
sandbox_layer:
  name: "Sandbox Layer (Layer 2: WHERE)"
  version: "1.0"
  description: "Tool execution environment - graduated isolation (WASM, Process, Container)"

  ## OVERVIEW
  overview:
    purpose: "Define where K1 executes tools with graduated isolation"
    philosophy: |
      Sandbox is the EXECUTION LAYER (like Docker/VMs/native processes).
      Separate from Protocol which is the COMMUNICATION LAYER (like HTTP).
      Both layers compose to form complete tool execution strategy.

    isolation_spectrum: |
      MAXIMUM ISOLATION ←→ PERFORMANCE
      ↓                   ↓
      WASM (15%)        Process (80%)      Container (5%)
      Zero syscalls     Filtered syscalls  Hardware isolation
      10x slower        Native speed       125ms overhead
      <5MB memory       <50MB memory       100MB memory

    adoption_distribution:
      wasm: "15% (114 tools) - Untrusted code"
      process: "80% (608 tools) - Standard tools"
      container: "5% (38 tools) - RED band high-risk"

  ## WASM SANDBOX (15% OF TOOLS - MAXIMUM ISOLATION)
  wasm_sandbox:
    name: "WASM Sandbox"
    adoption_percent: 15
    adoption_count: 114
    isolation_level: "MAXIMUM"
    trust_level: "UNTRUSTED"

    description: |
      WebAssembly sandbox providing maximum security through zero native syscalls,
      capability-based I/O, and complete isolation from host OS.

    runtime:
      name: "Wasmtime"
      description: "Open-source WASM runtime (Bytecode Alliance)"
      version: "1.0+"
      language_support: ["Rust", "C", "C++", "Python", "TypeScript", "Zig"]

    execution_model:
      type: "Interpreted/JIT compiled"
      memory_model: "Linear memory (isolated from host)"
      syscalls: "Zero (100% capability-based)"

    security_features:
      - "Zero native syscalls (cannot call OS kernel)"
      - "Capability-based filesystem (WASI preopen dirs)"
      - "Capability-based network (WASI hosts whitelist)"
      - "Memory sandbox (separate linear memory, no host memory access)"
      - "Deterministic execution (no side channels)"
      - "Cross-platform execution (identical behavior on Linux/macOS/Windows)"

    resource_limits:
      memory:
        default: "5MB"
        max: "256MB"
        enforced_by: "Wasmtime configuration"

      cpu:
        limit: "Fuel-based metering (optional)"
        description: "Wasmtime fuel API limits instructions"

      timeout:
        tool_specific: "5-300s per tool"

      disk:
        limit: "None (no filesystem access for untrusted)"

    isolation_model:
      memory_isolation: "Complete (separate linear memory)"
      process_isolation: "Via separate Wasmtime instance"
      network_isolation: "Capability-based (whitelist only)"
      filesystem_isolation: "Capability-based (preopen dirs only)"

    performance:
      latency_overhead: "10x slower than native"
      example: "5ms per tool call (vs 0.5ms native)"
      acceptance_threshold: "Acceptable for 15% untrusted tools"
      memory_overhead: "<5MB per module"
      boot_time: "<10ms module instantiation"

    use_cases:
      - "User plugins (untrusted WASM code)"
      - "Third-party tools (no audit trail)"
      - "Experimental/new tools (unverified)"
      - "Cross-platform tools (Linux/macOS/Windows)"
      - "Capability-based tool design"

    tool_examples:
      - "user_plugin.wasm (uploaded by user)"
      - "experimental_ai_model.wasm (new research)"
      - "community_tool.wasm (unverified contributor)"

    advantages:
      - "Maximum security (zero syscalls, 100% capability-based)"
      - "Capability-based isolation (no ambient authority)"
      - "Cross-platform (identical behavior everywhere)"
      - "Memory-efficient (<5MB per module)"
      - "Deterministic (no non-determinism side channels)"
      - "Fine-grained resource control (fuel metering)"

    disadvantages:
      - "10x slower than native (performance penalty)"
      - "Limited to tools available as WASM"
      - "WASM ecosystem still emerging"
      - "Learning curve for WASM development"

    implementation:
      language: "Python/Rust"
      library: "wasmtime Python bindings"
      example_code: |
        import wasmtime

        # Load WASM module
        store = wasmtime.Store()
        module = wasmtime.Module.from_file(
          store.engine,
          "user_plugin.wasm"
        )

        # Create instance with capabilities
        wasi_config = wasmtime.WasiConfig()
        wasi_config.inherit_stdout()
        wasi_config.inherit_stderr()
        instance = wasmtime.Instance(module, [])

        # Invoke function
        result = instance.exports(store)["process"](
          input_data
        )

  ## PROCESS SANDBOX (80% OF TOOLS - PERFORMANCE)
  process_sandbox:
    name: "Process Sandbox"
    adoption_percent: 80
    adoption_count: 608
    isolation_level: "STANDARD"
    trust_level: "STANDARD / VERIFIED"

    description: |
      OS process with multi-layer isolation: chroot (filesystem),
      seccomp (syscall filtering), cgroups (resources), and ADR-0032
      network egress controls.

    isolation_layers:
      - name: "Network Isolation (ADR-0032a)"
        mechanism: "iptables --pid-owner per-tool + privacy bands"
        isolation_level: "Application-level (policy-based)"

      - name: "Filesystem Isolation (ADR-0032b)"
        mechanism: "chroot jail + seccomp-bpf syscall filtering"
        isolation_level: "OS-level (sandboxed root filesystem)"

      - name: "Resource Isolation (ADR-0032c)"
        mechanism: "cgroups v2 (CPU, memory, PIDs, I/O)"
        isolation_level: "Kernel-level (resource controller)"

      - name: "Violation Logging (ADR-0032d)"
        mechanism: "K0 ToolReceipt audit trail"
        isolation_level: "Audit/compliance (7-year retention)"

    execution_model:
      type: "Native OS process (Python/binary)"
      memory_model: "Full OS process memory"
      syscalls: "Allowed (filtered by seccomp if needed)"

    resource_limits:
      cpu:
        green_band: "4 CPUs (400000 quota / 100000 period)"
        amber_band: "2 CPUs (200000 quota)"
        red_band: "1 CPU (100000 quota)"
        enforced_by: "cgroups v2 cpu.max"

      memory:
        green_band: "2GB (2048 MB)"
        amber_band: "1GB (1024 MB)"
        red_band: "512MB"
        black_band: "256MB"
        enforced_by: "cgroups v2 memory.max"

      pids:
        green_band: "100 PIDs max (prevents fork bombs)"
        amber_band: "50 PIDs max"
        red_band: "20 PIDs max"
        enforced_by: "cgroups v2 pids.max"

      io:
        green_band: "10GB/s I/O"
        amber_band: "5GB/s I/O"
        red_band: "1GB/s I/O"
        enforced_by: "cgroups v2 io.max"

      timeout:
        tool_specific: "3-300s per tool"

    network_egress_policies:
      green_band:
        policy: "Allow-list (whitelisted domains)"
        example: ["*.openai.com", "*.anthropic.com", "api.github.com"]
        dns: "Allowed (DNS lookups to allowed domains)"
        mechanism: "iptables --pid-owner + domain allowlist"

      amber_band:
        policy: "Allow-list + PII masking proxy"
        example: ["*.company.com", "internal-api.local"]
        dns: "Allowed (restricted to internal)"
        mechanism: "iptables + HTTP proxy (redact PII)"

      red_band:
        policy: "127.0.0.1 only (no external network)"
        example: []
        dns: "Blocked (no network access)"
        mechanism: "iptables DROP all OUTPUT (except loopback)"

      black_band:
        policy: "All network blocked"
        example: []
        dns: "Blocked"
        mechanism: "iptables DROP all OUTPUT"

    filesystem_policies:
      green_band:
        access: "Read-only /usr/lib, /usr/bin; Read-write /tmp/tool_workspace"
        mechanism: "chroot + mount --bind ro"

      amber_band:
        access: "Read-write /tmp/tool_workspace (user directory)"
        mechanism: "chroot + user namespace"

      red_band:
        access: "tmpfs only (no persistence, memory-only)"
        mechanism: "mount -t tmpfs (10MB max)"

      black_band:
        access: "No filesystem access"
        mechanism: "tmpfs (1MB, extremely limited)"

    performance:
      latency_overhead: "Native speed"
      process_spawn: "<100ms"
      sandbox_setup: "<50ms (chroot, seccomp, cgroups)"
      total_overhead: "<150ms per tool spawn (amortized)"
      memory_overhead: "<50MB per process"
      boot_time: "Immediate (OS scheduler)"

    use_cases:
      - "Standard tools (80% of tools)"
      - "Performance-critical tools"
      - "Verified third-party APIs"
      - "Internal services"
      - "MCP servers (most use process sandbox)"

    tool_examples:
      - "weather_api.py (verified OpenWeatherMap API wrapper)"
      - "calendar_sync.py (verified Google Calendar integration)"
      - "image_processor.py (ImageMagick wrapper)"
      - "ffmpeg (native binary for video transcoding)"

    advantages:
      - "Native performance (no slowdown)"
      - "Support for ANY Unix tool (CLI, Python, C, etc)"
      - "Well-understood isolation model"
      - "Comprehensive egress controls (ADR-0032)"
      - "Mature Linux toolchain (iptables, chroot, seccomp, cgroups)"

    disadvantages:
      - "Requires Linux (primary K1 platform)"
      - "Syscalls allowed (can be exploited if kernel 0-day)"
      - "More complex setup than WASM (multiple layers)"

    implementation:
      technologies:
        - "subprocess.Popen() (Python process spawning)"
        - "iptables (network egress control, ADR-0032a)"
        - "chroot + seccomp-bpf (filesystem isolation, ADR-0032b)"
        - "cgroups v2 (resource limits, ADR-0032c)"
        - "K0 (audit trail, ADR-0032d)"

      example_code: |
        import subprocess
        import os

        # Spawn process in sandbox
        process = subprocess.Popen([
          "/opt/familyos/mcp_servers/weather_api.py",
          "--lat", "40.7128",
          "--lon", "-74.0060"
        ], stdin=subprocess.PIPE, stdout=subprocess.PIPE)

        # Apply egress controls (via separate setup)
        # - iptables --pid-owner <pid> (ADR-0032a)
        # - chroot jail (ADR-0032b)
        # - cgroup limits (ADR-0032c)

        # Communicate via stdin/stdout
        result, _ = process.communicate(timeout=30)

  ## CONTAINER SANDBOX (5% OF TOOLS - HARDWARE ISOLATION)
  container_sandbox:
    name: "Container Sandbox"
    adoption_percent: 5
    adoption_count: 38
    isolation_level: "MAXIMUM (HARDWARE)"
    trust_level: "UNTRUSTED / CRITICAL"

    description: |
      Firecracker microVM or gVisor for hardware-level isolation.
      Used for RED band tools (booking, payment, PII operations)
      where host compromise risk is unacceptable.

    runtime_options:
      - name: "Firecracker"
        description: "Lightweight microVM hypervisor (AWS)"
        overhead_boot: "125ms"
        overhead_memory: "100MB per instance"
        isolation: "Hardware-level (KVM hypervisor)"
        use_case: "Maximum isolation for RED band tools"

      - name: "gVisor"
        description: "Kernel-level sandbox (Google)"
        overhead_boot: "500ms"
        overhead_memory: "50MB per instance"
        isolation: "Kernel-level (guest kernel)"
        use_case: "Alternative to Firecracker"

    execution_model:
      type: "Independent microVM or kernel sandbox"
      memory_model: "Isolated guest OS memory"
      syscalls: "Filtered by hypervisor/guest kernel"

    resource_limits:
      red_band:
        cpu: "1 CPU max"
        memory: "512MB max"
        network: "Firecracker network interface + host firewall"
        disk: "Read-only root, ephemeral /tmp"

      black_band:
        cpu: "1 CPU max"
        memory: "256MB max"
        network: "Loopback only"
        disk: "None (memory-only)"

    network_egress_policies:
      red_band:
        policy: "127.0.0.1 + controlled proxy"
        mechanism: "Firecracker network interface + host firewall"

      black_band:
        policy: "Loopback only"
        mechanism: "No external network interface"

    filesystem_policies:
      red_band:
        access: "Read-only root filesystem + ephemeral /tmp"
        mechanism: "Hypervisor-enforced"

      black_band:
        access: "ephemeral /tmp only (tmpfs, 10MB)"
        mechanism: "Hypervisor-enforced"

    performance:
      latency_overhead: "125ms boot time"
      memory_overhead: "100MB per instance (Firecracker)"
      suitable_for: "<1% of tools (high-risk only)"

    use_cases:
      - "RED band tools (booking, payment, PII operations)"
      - "Untrusted third-party code"
      - "Code execution tools (code sandboxing)"
      - "High-risk operations requiring maximum isolation"

    tool_examples:
      - "booking_engine.py (RED: hotel/flight booking)"
      - "payment_processor.py (RED: credit card processing)"
      - "code_executor.py (RED: execute user code)"

    advantages:
      - "Hardware-level isolation (no host kernel compromise)"
      - "Maximum security for RED band"
      - "Independent OS instance"

    disadvantages:
      - "125ms boot overhead (unacceptable for real-time)"
      - "100MB memory overhead per instance"
      - "Use only for <5% critical tools"

    implementation:
      technologies:
        - "Firecracker VM runtime"
        - "qemu or KVM hypervisor"
        - "gVisor alternative (Google)"

      example_code: |
        import subprocess

        # Boot Firecracker microVM
        firecracker_process = subprocess.Popen([
          "firecracker",
          "--config", "booking_engine.json"
        ])

        # Wait for boot (125ms)
        time.sleep(0.125)

        # Connect via network interface
        result = requests.post(
          "http://localhost:9000/booking",
          json={"hotel": "Marriott", "nights": 3}
        )

  ## SANDBOX SELECTION CRITERIA
  selection_criteria:
    criterion_1_trust_level:
      dimension: "Code trustworthiness"
      wasm: "UNTRUSTED - user plugins, no audit"
      process: "STANDARD - verified tools, audited code"
      container: "CRITICAL - RED band operations"

    criterion_2_performance_requirement:
      dimension: "Latency sensitivity"
      wasm: "Acceptable latency (10x slower ok)"
      process: "Native performance required"
      container: "Latency not critical (<1% of tools)"

    criterion_3_privacy_band:
      dimension: "Privacy classification"
      green_band: "Process sandbox (80%)"
      amber_band: "Process sandbox (80%)"
      red_band: "Container sandbox (5%), or Process with strict egress"
      black_band: "Container sandbox (minimal access)"

    criterion_4_platform_availability:
      dimension: "Platform support"
      wasm: "Cross-platform (Linux/macOS/Windows)"
      process: "Linux primary, macOS/Windows secondary"
      container: "Linux only (Firecracker)"

    criterion_5_resource_constraints:
      dimension: "Memory/CPU budget"
      wasm: "<5MB memory per tool"
      process: "<50MB memory per tool"
      container: "100MB+ memory per instance"

  ## PERFORMANCE COMPARISON
  performance:
    latency_comparison:
      wasm: "10x slower (5ms per call)"
      process: "Native (0.5ms per call, no overhead)"
      container: "125ms boot + native speed"

    memory_comparison:
      wasm: "<5MB per module"
      process: "<50MB per process"
      container: "100MB per instance"

    typical_scenarios:
      weather_api: "Process sandbox (AMBER, standard tool, 80%)"
      user_plugin: "WASM sandbox (GREEN, untrusted, 15%)"
      booking_engine: "Container sandbox (RED, high-risk, 5%)"
      ffmpeg: "Process sandbox (GREEN, performance-critical)"

  ## INTEGRATION WITH PROTOCOL LAYER
  protocol_integration:
    principle: |
      Protocol Layer (MCP/Direct) is orthogonal to Sandbox Layer.
      Any protocol works with any sandbox.

    valid_combinations:
      - protocol: "MCP stdio"
        sandbox: "Process"
        adoption: "70%"

      - protocol: "MCP http"
        sandbox: "WASM"
        adoption: "10%"

      - protocol: "MCP http"
        sandbox: "Container"
        adoption: "5%"

      - protocol: "Direct CLI"
        sandbox: "Process"
        adoption: "15%"

      - protocol: "Direct"
        sandbox: "WASM"
        adoption: "<1%"

      - protocol: "Direct"
        sandbox: "Container"
        adoption: "<1%"

  ## OBSERVABILITY
  observability:
    metrics:
      - "k1_sandbox_spawns_total (by sandbox type)"
      - "k1_sandbox_spawn_latency_ms (histogram)"
      - "k1_sandbox_memory_usage_bytes (gauge)"
      - "k1_sandbox_violations_total (network/filesystem egress)"
      - "k1_sandbox_terminations_total (by reason)"

    tracing:
      - "sandbox_spawn_started"
      - "sandbox_spawn_completed"
      - "sandbox_violation_detected"
      - "sandbox_shutdown"

    logging:
      - "sandbox_lifecycle_events (INFO)"
      - "sandbox_violations (WARNING)"
      - "sandbox_errors (ERROR)"
