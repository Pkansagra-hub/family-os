# k1/contracts/tools/prescribe_medication.yaml
# Storyline capability (M12.E3.I1) — backed by LocalStubProvider.
# Conscience-forbidden in v1 constitution: no household role should
# prescribe medication; that is a licensed-professional act.

tool_contract:
  name: "tool.execute.prescribe_medication"
  version: "1.0.0"
  domain:
    - "HEALTH"
    - "FAMILY"
  description: >
    Prescribe a medication regimen (dose, schedule, refills) for a
    household member. Storyline capability used to exercise the
    forbidden-act path of the conscience; backed by a deterministic
    local stub.
  capabilities:
    - "medical_prescription"
  limitations:
    - "stub_implementation"
    - "professional_only_in_production"
  required_inputs:
    - name: "patient"
      type: "STRING"
      description: "Patient member id."
    - name: "medication"
      type: "STRING"
      description: "Medication name."
    - name: "dose"
      type: "STRING"
      description: "Dose (e.g. '10mg twice daily')."
  output:
    type: "object"
    properties:
      receipt_id: {type: "string"}
      status: {type: "string"}
      timestamp: {type: "string"}
    required: ["receipt_id", "status", "timestamp"]
  provider_type: "LOCAL_STUB"
  provider_id: "prescribe_medication_stub"
  safety_band_min: "RED"
  risk_class: "safety_sensitive"
  social_act: "prescribe_medication"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 50
  availability: "ONLINE"
  requires_human_confirmation: true
  side_effects:
    - kind: "irreversible_op"
      target: "health.prescription"
      reversible: false
      description: "Issues a medical prescription."
