################################################################################
# CONTRACT: Tool Characteristics & Selection Criteria
# CONTRACT_ID: TOOLS-CHARACTERISTICS-CRITERIA
# PURPOSE: Defines tool attributes used in 2D selection decision-making
# ADR_REFERENCE: ADR-0033d (2D Selection Logic - Section 3: Tool Characteristics)
# STATUS: ACTIVE
# LAST_UPDATED: 2025-01-15
################################################################################

contract_name: "Tool Characteristics & Selection Criteria"
contract_id: "TOOLS-CHARACTERISTICS-CRITERIA"
version: "1.0"
status: "ACTIVE"

description: |
  Defines the complete set of tool attributes that determine protocol and
  sandbox selection in the 2D tool execution architecture. Each characteristic
  directly influences selection decision-making through the 2D selector logic.

  This contract defines:
  1. Tool Characteristics (input to selection algorithm)
  2. Selection Criteria (decision rules based on characteristics)
  3. Characteristic Values & Enumerations
  4. Impact Analysis (how each characteristic affects selection)
  5. Tool Registry Format (how characteristics are stored)

################################################################################
# SECTION 1: TOOL CHARACTERISTICS (INPUT DATA STRUCTURE)
################################################################################
tool_characteristics:
  definition: |
    Data structure containing all metadata about a tool that influences
    selection of protocol and sandbox. Required for every tool execution.

  data_structure: "ToolCharacteristics"

  fields:
    tool_name:
      type: "string"
      required: true
      description: |
        Unique identifier for the tool within the registry.
        Used for tracing, logging, and tool lookup.

      constraints:
        - "Must be alphanumeric with underscores"
        - "Length: 1-64 characters"
        - "Must be globally unique within registry"

      examples:
        - "weather_api"
        - "user_plugin_v2"
        - "ffmpeg_processor"
        - "claude_sdk"

      impact_on_selection: |
        - Direct lookup: used to fetch cached selection for repeated calls
        - Trust level lookup: certain tools may have hardcoded trust levels
        - Logging & observability: included in all metrics and traces

    band:
      type: "enum"
      required: true
      description: |
        Privacy band governing tool execution and data access.
        Determines maximum sandbox isolation level allowed.

      enum_values:
        GREEN:
          description: "Public data, public APIs, no sensitive processing"
          isolation_requirement: "Minimum (WASM or Process sufficient)"
          rationale: |
            Public tools can execute with minimal isolation since no
            sensitive data is involved. WASM or Process sandbox acceptable.

        AMBER:
          description: "Internal data, controlled access, some PII handling"
          isolation_requirement: "Medium (Process minimum, Container recommended)"
          rationale: |
            Internal tools need isolation to prevent cross-tenant data access.
            Process sandbox with ADR-0032 egress controls required minimum.
            Container recommended for high-isolation scenarios.

        RED:
          description: "Sensitive data, high-trust execution, critical operations"
          isolation_requirement: "Maximum (Container or Direct without sandbox)"
          rationale: |
            Sensitive tools need highest isolation (hardware-level via Container)
            or trusted execution path (Direct without sandbox for vetted tools).

      constraints:
        - "Must be one of: GREEN, AMBER, RED"
        - "Immutable per tool (set during registration)"

      impact_on_selection:
        - "GREEN → Any sandbox acceptable (WASM, Process, Container)"
        - "AMBER → Process minimum (Container if high_risk_flag)"
        - "RED → Container for untrusted, Direct for trusted high-perf"
        - "Overrides other criteria if security requirement triggered"

      examples:
        - band: "GREEN"
          tool: "weather_api"
          rationale: "Public weather service"

        - band: "AMBER"
          tool: "user_profile_api"
          rationale: "Internal API with customer data"

        - band: "RED"
          tool: "billing_processor"
          rationale: "Financial data, PCI-DSS compliance"

    trust_level:
      type: "enum"
      required: true
      description: |
        How much the system trusts the tool's code to behave correctly
        without exploit or escape attempts. Influences sandbox selection.

      enum_values:
        TRUSTED:
          description: |
            Tool is vendor-signed, open-source with audit trail,
            or extensively tested internally. Vetted implementation.

          characteristics:
            - "Vendor has reputation/SLA"
            - "Code reviewed or open-source"
            - "No known exploits or CVEs"
            - "Tested against escape attempts"

          isolation_requirement: "Minimal to Medium"

          impact_on_selection:
            - "Allows Process sandbox (lower overhead)"
            - "Allows Direct API (maximum performance)"
            - "Can use WASM if performance-critical=False"
            - "Default to Process (native speed acceptable)"

        UNTRUSTED:
          description: |
            Tool origin unknown, user-provided plugin, or minimal testing.
            Assume potential exploit/escape attempt.

          characteristics:
            - "Tool author is unknown or unverified"
            - "No code review or open-source audit"
            - "New tool with limited testing"
            - "User-provided or community plugin"

          isolation_requirement: "Maximum isolation (WASM or Container)"

          impact_on_selection:
            - "Default to WASM (zero syscalls, maximum isolation)"
            - "Never Direct API (untrusted code needs sandbox)"
            - "Avoid Process if other options available"
            - "Container acceptable if WASM performance insufficient"

      constraints:
        - "Must be one of: TRUSTED, UNTRUSTED"
        - "Can be overridden per-session for testing"

      impact_on_selection:
        - "TRUSTED → Prefers Process (performance), allows Direct"
        - "UNTRUSTED → Prefers WASM (isolation), allows Container"
        - "Strongest isolation influence (overrides performance_critical if conflict)"

      examples:
        - trust_level: "TRUSTED"
          tool: "ffmpeg"
          rationale: "Well-known open-source project, extensive testing"

        - trust_level: "UNTRUSTED"
          tool: "user_plugin"
          rationale: "User-provided code, minimal review"

    has_mcp_server:
      type: "boolean"
      required: true
      description: |
        Whether tool has Model Context Protocol (MCP) server implementation.
        Determines if MCP protocol available (vs Direct API only).

      values:
        true:
          description: |
            Tool has MCP server implementation (stdio or HTTP transport).
            Can use standardized JSON-RPC 2.0 interface.

          impact_on_selection: |
            - "Select MCP protocol (standardized, 80% of tools)"
            - "Enables protocol discovery (tools/list)"
            - "Enables protocol fallback to Direct if MCP fails"

        false:
          description: |
            Tool does not have MCP implementation.
            Must use Direct API (CLI, REST, custom protocol).

          impact_on_selection: |
            - "Select Direct API protocol (legacy, 20% of tools)"
            - "No protocol fallback available (MCP not possible)"
            - "No tool discovery (must know tool schema in advance)"

      constraints:
        - "Must match actual tool implementation (registry verification)"
        - "Immutable once set (requires re-registration to change)"

      data_source: |
        Set during tool registration by:
        - Tool developer: Self-reported MCP availability
        - Registry validator: Verified by attempting MCP connection
        - Tool discovery: Auto-detected by MCP server scan

      impact_on_selection:
        - "Dominant influence on protocol selection (single criterion)"
        - "If has_mcp_server=true → Always prefer MCP"
        - "If has_mcp_server=false → Always use Direct"

      examples:
        - has_mcp_server: true
          tool: "claude_sdk"
          mcp_transport: "stdio"
          mcp_endpoint: "python -m claude.mcp"

        - has_mcp_server: false
          tool: "curl_tool"
          direct_interface: "CLI with JSON output"

        - has_mcp_server: true
          tool: "weather_api"
          mcp_transport: "HTTP"
          mcp_endpoint: "http://localhost:8000/mcp"

    performance_critical:
      type: "boolean"
      required: true
      description: |
        Whether tool execution latency is critical to application SLA.
        Influences sandbox selection (WASM slower than native).

      values:
        true:
          description: |
            Tool execution time directly impacts end-user experience.
            Requires fast execution (< 500ms latency target).

          characteristics:
            - "User-facing operation (not background)"
            - "Latency budget < 500ms"
            - "Called frequently (cost of isolation matters)"

          impact_on_selection:
            - "Prefers native execution (Process over WASM)"
            - "Avoids Container if possible (boot overhead)"
            - "May override isolation if necessary"

        false:
          description: |
            Tool execution latency not critical.
            Can use slower isolation mechanisms (WASM, Container).

          characteristics:
            - "Background operation or batch processing"
            - "Latency budget > 1000ms"
            - "Called infrequently (isolation cost acceptable)"

          impact_on_selection:
            - "Can choose maximum isolation (WASM or Container)"
            - "Latency not a constraint"
            - "Prioritizes security/isolation over performance"

      constraints:
        - "Must reflect actual application requirements"
        - "Overstating criticality leads to over-provisioning"
        - "Understating criticality may cause SLA violations"

      impact_on_selection:
        - "Influences sandbox preference (Process > Container > WASM)"
        - "Conflicts with untrusted tools resolved in favor of isolation"
        - "Tool band affects interpretation (RED tools prioritize security)"

      examples:
        - performance_critical: true
          tool: "sentiment_analysis"
          rationale: "Real-time user input processing, <500ms SLA"

        - performance_critical: false
          tool: "daily_report_generator"
          rationale: "Batch operation, runs nightly, no time pressure"

        - performance_critical: true
          tool: "translation_service"
          rationale: "Chat application, streaming response, <200ms per chunk"

################################################################################
# SECTION 2: SELECTION CRITERIA (DECISION RULES)
################################################################################
selection_criteria:
  definition: |
    Rules that use tool characteristics to make selection decisions for
    protocol and sandbox. Each criterion has a specific impact on selection.

  axis_1_protocol_selection:
    criterion_name: "Has MCP Server"
    criterion_key: "has_mcp_server"
    rule: |
      IF has_mcp_server = true THEN
        select_protocol := "MCP"
      ELSE
        select_protocol := "Direct"
      END

    weight: "100% (dominant, single criterion)"

    rationale: |
      Protocol selection is deterministic based on single criterion.
      - If tool has MCP: use standardized protocol (80% of tools)
      - If tool has no MCP: use Direct API (20% of tools)

    decision_table:
      - has_mcp_server: true
        selected_protocol: "MCP"
        tools_percent: "80%"
        examples: ["weather_api", "claude_sdk", "code_executor"]

      - has_mcp_server: false
        selected_protocol: "Direct"
        tools_percent: "20%"
        examples: ["ffmpeg", "curl_tool", "legacy_service"]

    fallback_behavior: |
      Protocol fallback available if selected protocol fails:
      - MCP fails → Fallback to Direct (if available)
      - Direct fails → Fallback to MCP (if available)

    conflict_resolution: "No conflicts possible (single criterion)"

  axis_2_sandbox_selection:
    criterion_name: "Sandbox Preference (4-step decision tree)"
    criterion_key: "multi-dimensional"

    step_1_untrusted_detection:
      name: "Untrusted Tool Isolation"
      rule: |
        IF trust_level = "UNTRUSTED" THEN
          select_sandbox := "WASM"  // Maximum isolation (zero syscalls)
          continue_evaluation := false  // Non-overridable
        ELSE
          continue_evaluation := true
        END

      weight: "Highest (overrides all other criteria)"

      rationale: |
        Untrusted code must have maximum isolation regardless of
        performance requirements. Zero syscalls prevents escape attempts.

      examples:
        - tool: "user_plugin_v1"
          trust_level: "UNTRUSTED"
          performance_critical: true
          decision: "WASM (isolation required despite performance cost)"

    step_2_red_band_detection:
      name: "Red Band Maximum Isolation"
      rule: |
        IF trust_level = "TRUSTED" AND (
          band = "RED" AND high_risk_flag = true
        ) THEN
          select_sandbox := "Container"  // Hardware isolation
          continue_evaluation := false
        ELSE
          continue_evaluation := true
        END

      weight: "Very High (overrides performance for security)"

      rationale: |
        Red band sensitive tools need hardware-level isolation (Container)
        for maximum security guarantees even if performance-critical.

      examples:
        - tool: "billing_processor"
          band: "RED"
          trust_level: "TRUSTED"
          performance_critical: true
          decision: "Container (RED band, hardware isolation)"

    step_3_performance_critical_detection:
      name: "Performance Critical Native Execution"
      rule: |
        IF trust_level = "TRUSTED" AND (
          performance_critical = true
        ) THEN
          select_sandbox := "Process"  // Native speed
          continue_evaluation := false
        ELSE
          continue_evaluation := true
        END

      weight: "Medium (overrides isolation for performance)"

      rationale: |
        Trusted, performance-critical tools use Process sandbox
        for native execution speed with ADR-0032 egress controls.

      examples:
        - tool: "sentiment_analysis"
          trust_level: "TRUSTED"
          band: "GREEN"
          performance_critical: true
          decision: "Process (native speed for real-time requirement)"

    step_4_default_fallback:
      name: "Default Sandbox Selection"
      rule: |
        // Catch-all for all remaining cases
        select_sandbox := "Process"  // Default to Process (80% of tools)

      weight: "Low (applies to remaining cases)"

      rationale: |
        Default to Process sandbox for all remaining tools:
        - Trusted tools with non-critical performance
        - All tools not matching specific criteria above

      examples:
        - tool: "weather_api"
          trust_level: "TRUSTED"
          band: "GREEN"
          performance_critical: false
          decision: "Process (default for trusted, non-critical)"

    decision_tree_logic:
      pseudo_code: |
        SELECT_SANDBOX(tool):
          IF tool.trust_level = "UNTRUSTED" THEN
            RETURN "WASM"

          IF tool.band = "RED" AND tool.high_risk_flag THEN
            RETURN "Container"

          IF tool.performance_critical = true THEN
            RETURN "Process"

          RETURN "Process"  // Default

      execution_flow: |
        1. Check UNTRUSTED → exit with WASM
        2. Check RED band + high_risk → exit with Container
        3. Check performance_critical → exit with Process
        4. Default → return Process

      early_termination: |
        Each step that matches terminates evaluation and returns sandbox.
        Steps are ordered by priority (security > performance).

    conflict_resolution: |
      If multiple criteria match, highest priority wins:
      1. UNTRUSTED (trust_level) → WASM (security first)
      2. RED band + high_risk → Container (compliance)
      3. performance_critical → Process (performance)
      4. Default → Process

################################################################################
# SECTION 3: CHARACTERISTIC AGGREGATION & COMBINATIONS
################################################################################
characteristic_combinations:
  definition: |
    Common combinations of characteristics and their resulting selections.
    Patterns that occur frequently in practice.

  pattern_1_trusted_public_api:
    characteristics:
      tool_name: "Any trusted public API"
      band: "GREEN"
      trust_level: "TRUSTED"
      has_mcp_server: true
      performance_critical: false

    expected_selection:
      protocol: "MCP"
      sandbox: "Process"

    tools_matching: "weather_api, news_api, calculator_service"
    frequency: "~40% of all tool registrations"

    selection_rationale: |
      - has_mcp_server=true → MCP protocol
      - trust_level=TRUSTED → Process acceptable
      - performance_critical=false → Process acceptable
      - band=GREEN → no additional constraints
      → Result: MCP + Process (standard combination)

  pattern_2_untrusted_plugin:
    characteristics:
      tool_name: "User-provided plugin"
      band: "GREEN"
      trust_level: "UNTRUSTED"
      has_mcp_server: false
      performance_critical: false

    expected_selection:
      protocol: "Direct"
      sandbox: "WASM"

    tools_matching: "user_plugin_v1, community_addon"
    frequency: "~15% of all tool registrations"

    selection_rationale: |
      - trust_level=UNTRUSTED → WASM (maximum isolation)
      - has_mcp_server=false → Direct API
      → Result: Direct + WASM (untrusted isolation pattern)

  pattern_3_performance_critical_trusted:
    characteristics:
      tool_name: "Real-time processing"
      band: "GREEN"
      trust_level: "TRUSTED"
      has_mcp_server: false
      performance_critical: true

    expected_selection:
      protocol: "Direct"
      sandbox: "Process"

    tools_matching: "sentiment_analysis, image_processor, ffmpeg"
    frequency: "~20% of all tool registrations"

    selection_rationale: |
      - performance_critical=true → Process (native speed)
      - has_mcp_server=false → Direct API
      - trust_level=TRUSTED → Process acceptable
      → Result: Direct + Process (performance pattern)

  pattern_4_sensitive_data_processing:
    characteristics:
      tool_name: "Financial/medical processing"
      band: "RED"
      trust_level: "TRUSTED"
      has_mcp_server: true
      performance_critical: true
      high_risk_flag: true

    expected_selection:
      protocol: "MCP"
      sandbox: "Container"

    tools_matching: "billing_processor, healthcare_analyzer"
    frequency: "~5% of all tool registrations"

    selection_rationale: |
      - band=RED AND high_risk_flag=true → Container
      - has_mcp_server=true → MCP protocol
      - performance_critical=true → acceptable with Container
      → Result: MCP + Container (compliance/security pattern)

  pattern_5_vendor_supplied_trusted:
    characteristics:
      tool_name: "Vendor SDK or service"
      band: "AMBER"
      trust_level: "TRUSTED"
      has_mcp_server: true
      performance_critical: false

    expected_selection:
      protocol: "MCP"
      sandbox: "Process"

    tools_matching: "claude_sdk, openai_api, anthropic_tools"
    frequency: "~10% of all tool registrations"

    selection_rationale: |
      - trust_level=TRUSTED → Process acceptable
      - has_mcp_server=true → MCP protocol
      - performance_critical=false → Process acceptable
      - band=AMBER → Process with ADR-0032 controls
      → Result: MCP + Process (vendor SDK pattern)

################################################################################
# SECTION 4: CHARACTERISTIC ENUMERATIONS & CONSTRAINTS
################################################################################
enumerations:
  band_enum:
    values: ["GREEN", "AMBER", "RED"]
    definition: "Privacy sensitivity level"
    immutable: true
    scope: "Tool-level (set at registration)"

  trust_level_enum:
    values: ["TRUSTED", "UNTRUSTED"]
    definition: "Code execution trustworthiness"
    immutable: false
    scope: "Can be overridden per-session for testing"

  has_mcp_server_enum:
    values: [true, false]
    definition: "MCP server availability"
    immutable: true
    scope: "Tool-level (requires re-registration to change)"

  performance_critical_enum:
    values: [true, false]
    definition: "Performance importance"
    immutable: false
    scope: "Can be overridden per-session (affects SLA)"

constraints:
  global_constraints:
    - "All characteristics must be specified (no nulls)"
    - "Enum values must be from defined lists"
    - "tool_name must be globally unique in registry"
    - "tool_name must be alphanumeric with underscores"

  logical_constraints:
    - "If band=RED, then high_risk_flag should typically=true"
    - "If trust_level=UNTRUSTED, then band should not=GREEN (odd combo)"
    - "If performance_critical=true and band=RED, SLA may be unachievable"

  registry_constraints:
    - "tool_name immutable once registered"
    - "band immutable once registered"
    - "has_mcp_server immutable once registered"
    - "trust_level can be overridden per-session"
    - "performance_critical can be overridden per-session"

################################################################################
# SECTION 5: TOOL REGISTRY FORMAT
################################################################################
tool_registry_format:
  definition: |
    Standard format for storing and retrieving tool characteristics
    from the tool registry database.

  storage_format: "YAML"

  registry_file_structure: |
    tools/
    ├── __init__.yml (registry metadata)
    ├── weather_api.yml (individual tool)
    ├── claude_sdk.yml
    ├── user_plugin.yml
    └── ...

  individual_tool_file_template: |
    ################################################################################
    # tool_registry_entry: {tool_name}
    ################################################################################

    tool_name: "weather_api"

    # Characteristics
    band: "GREEN"
    trust_level: "TRUSTED"
    has_mcp_server: true
    performance_critical: false

    # Additional metadata
    metadata:
      vendor: "OpenWeatherMap"
      version: "2.5"
      mcp_server:
        transport: "stdio"
        command: "python -m openweathermap.mcp"
      fallback_api:
        type: "REST"
        endpoint: "https://api.openweathermap.org/data/2.5"
      registration_date: "2025-01-01"
      last_updated: "2025-01-15"
      trust_audit:
        reviewer: "security-team"
        date: "2025-01-01"
        status: "APPROVED"

    # Registry entries
    registry:
      tool_id: "uuid-weather-api-v1"
      category: "data_retrieval"
      tags: ["weather", "public_api", "real_time"]
      documentation_url: "https://docs.example.com/weather_api"

  registry_query_examples:
    example_1_fetch_all_untrusted:
      query: "SELECT * FROM tools WHERE trust_level='UNTRUSTED'"
      result_count: "~15% of registry"
      use_case: "Security audit or isolation enforcement"

    example_2_fetch_performance_critical:
      query: "SELECT * FROM tools WHERE performance_critical=true"
      result_count: "~20% of registry"
      use_case: "Performance optimization analysis"

    example_3_fetch_red_band:
      query: "SELECT * FROM tools WHERE band='RED'"
      result_count: "~5% of registry"
      use_case: "Compliance audit or security review"

    example_4_fetch_mcp_tools:
      query: "SELECT * FROM tools WHERE has_mcp_server=true"
      result_count: "~80% of registry"
      use_case: "Protocol support analysis"

################################################################################
# SECTION 6: IMPACT ANALYSIS (CHARACTERISTIC → SELECTION)
################################################################################
impact_analysis:
  protocol_selection_impact:
    has_mcp_server: "100% impact (single criterion)"

    impact_table:
      - criterion: "has_mcp_server = true"
        impact: "Select MCP protocol"
        strength: "Deterministic (no alternatives)"
        examples: ["claude_sdk → MCP", "weather_api → MCP"]

      - criterion: "has_mcp_server = false"
        impact: "Select Direct protocol"
        strength: "Deterministic (no alternatives)"
        examples: ["ffmpeg → Direct", "curl_tool → Direct"]

  sandbox_selection_impact:
    impact_priority_order:
      1: "trust_level (if UNTRUSTED → WASM, override all)"
      2: "band + high_risk_flag (if RED+HIGH → Container)"
      3: "performance_critical (if true → Process)"
      4: "default (→ Process)"

    impact_table:
      - criterion: "trust_level = UNTRUSTED"
        impact: "Force WASM sandbox"
        strength: "Mandatory override"
        overrides: "Everything (performance_critical ignored)"
        examples: ["user_plugin → WASM despite performance_critical=true"]

      - criterion: "band = RED + high_risk_flag = true"
        impact: "Force Container sandbox"
        strength: "Mandatory override"
        overrides: "Performance considerations"
        examples: ["billing_processor → Container despite performance_critical=true"]

      - criterion: "performance_critical = true"
        impact: "Prefer Process sandbox"
        strength: "Strong preference"
        overrides: "Isolation preferences (except trust/band overrides)"
        examples: ["ffmpeg → Process for real-time speed"]

      - criterion: "default"
        impact: "Select Process sandbox"
        strength: "Fallback default"
        examples: ["weather_api → Process (most combinations)"]

  combined_impact_examples:
    example_1_low_security_high_performance:
      characteristics:
        band: "GREEN"
        trust_level: "TRUSTED"
        performance_critical: true
      impact_chain: |
        - performance_critical=true → Process preference
        - trust_level=TRUSTED → Process acceptable
        - No overrides triggered
        → Result: Process (performance optimization)

    example_2_high_security_unknown_code:
      characteristics:
        band: "GREEN"
        trust_level: "UNTRUSTED"
        performance_critical: true
      impact_chain: |
        - trust_level=UNTRUSTED → WASM override
        - performance_critical=true → overridden by trust_level
        - band=GREEN → no additional constraint
        → Result: WASM (security isolation, despite performance cost)

    example_3_compliance_with_performance:
      characteristics:
        band: "RED"
        trust_level: "TRUSTED"
        performance_critical: true
        high_risk_flag: true
      impact_chain: |
        - band=RED + high_risk_flag=true → Container
        - performance_critical=true → acceptable with Container
        - trust_level=TRUSTED → Container acceptable
        → Result: Container (compliance isolation)

################################################################################
# SECTION 7: VERIFICATION & VALIDATION
################################################################################
verification:
  validation_rules:
    rule_1_tool_name_exists:
      condition: "tool_name must exist in registry"
      action: "If not found, raise ToolNotFoundError"
      implications: "Prevents accidental misspellings of tool names"

    rule_2_band_valid_enum:
      condition: "band must be GREEN, AMBER, or RED"
      action: "If invalid, raise InvalidBandError"
      implications: "Ensures consistent band classification"

    rule_3_trust_level_valid_enum:
      condition: "trust_level must be TRUSTED or UNTRUSTED"
      action: "If invalid, raise InvalidTrustLevelError"
      implications: "Ensures consistent trust classification"

    rule_4_mcp_server_match:
      condition: "has_mcp_server must match actual tool implementation"
      action: "Registry validator attempts MCP connection at registration"
      implications: "Catches false MCP claims"

    rule_5_performance_critical_sla:
      condition: |
        If performance_critical=true, SLA must be definable
        (max latency must be reasonable for sandbox type)
      action: "Warn if SLA unachievable (e.g., RED+WASM+<100ms)"
      implications: "Prevents impossible SLA combinations"

  registration_checklist:
    step_1_validate_characteristics:
      - "Verify all characteristics specified (no nulls)"
      - "Verify enum values valid"
      - "Verify tool_name unique"

    step_2_verify_mcp_claim:
      - "Attempt MCP connection if has_mcp_server=true"
      - "Fall back to Direct API test"
      - "Update has_mcp_server based on actual results"

    step_3_assess_trust_level:
      - "Review tool source (vendor, open-source, community)"
      - "Check for known CVEs or exploits"
