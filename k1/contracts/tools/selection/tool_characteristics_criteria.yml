# SECTION 9: IMPLEMENTATION CONTRACT
################################################################################
implementation:
  class_name: "ToolCharacteristics"
  module: "k1.tools.registry.characteristics"

  dataclass_definition: |
    @dataclass
    class ToolCharacteristics:
      """Tool characteristics for 2D selection algorithm"""

      tool_name: str  # Unique identifier
      band: Band  # GREEN|AMBER|RED
      trust_level: TrustLevel  # TRUSTED|UNTRUSTED
      has_mcp_server: bool  # True if MCP available
      performance_critical: bool  # True if latency critical
      high_risk_flag: Optional[bool] = None  # For RED band tools

  methods:
    - method_name: "validate"
      description: "Validate characteristic values and constraints"
      signature: |
        def validate(self) -> ValidationResult

      checks:
        - "All fields non-null"
        - "Enum values valid"
        - "Logical constraints satisfied"

      raises: "CharacteristicValidationError"

    - method_name: "to_selection_input"
      description: "Convert to input for 2D selection algorithm"
      signature: |
        def to_selection_input(self) -> SelectionInput

