# k1/contracts/tools/weather_forecast.yaml
# Weather Forecast Tool Contract (Phase 2 -- Fabric E2E Validation)
#
# MCP tool contract for retrieving multi-day weather forecast.
# GREEN-band read-only tool. Remote SSE transport.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 2, Section 4.1

tool_contract:
  name: "tool.read.weather_forecast"
  version: "1.0.0"
  domain:
    - "WEATHER"
    - "FAMILY"
    - "PLANNING"
  description: >
    Get multi-day weather forecast for a given location. Returns
    daily high/low temperatures and conditions. Read-only, no side
    effects. Backed by remote weather API with 5-min cache.
  capabilities:
    - "weather_forecast"
    - "multi_day"
    - "location_based"
  limitations:
    - "read_only"
    - "5_minute_cache"
    - "max_7_days"
    - "api_rate_limited"

  required_inputs:
    - name: "location"
      type: "STRING"
      description: "City name or coordinates (e.g. 'London' or '51.5,-0.1')"

  optional_inputs:
    - name: "days"
      type: "NUMBER"
      description: "Number of forecast days (1-7, default 3)"
      default: 3
    - name: "units"
      type: "STRING"
      description: "Temperature units: metric (C), imperial (F), or kelvin (K)"
      default: "metric"
      enum:
        - "metric"
        - "imperial"
        - "kelvin"

  output:
    type: "object"
    properties:
      location:
        type: "string"
        description: "Resolved location name"
      forecast:
        type: "array"
        items:
          type: "object"
          properties:
            date:
              type: "string"
              description: "Forecast date (ISO 8601)"
            high:
              type: "number"
              description: "High temperature"
            low:
              type: "number"
              description: "Low temperature"
            description:
              type: "string"
              description: "Weather description"
          required:
            - "date"
            - "high"
            - "low"
            - "description"
      units:
        type: "string"
        description: "Temperature units used in response"
    required:
      - "location"
      - "forecast"
      - "units"

  provider_type: "MCP"
  provider_id: "weather_mcp_sse"
  safety_band_min: "GREEN"
  risk_class: "low"
  cost_per_call: 0.0
  avg_latency_ms: 800
  max_latency_ms: 2000
  availability: "ONLINE"
