# WASM Sandbox: MCP Protocol Integration (WASM as MCP Server)
# Purpose: Show how MCP protocol works with WASM sandbox execution
# Research: MCP spec, HTTP transport, WASM interface patterns
# Part of ADR-0033b (WASM Sandbox Implementation)

---
contract_id: "TOOL_EXEC_WASM_MCP_INTEGRATION"
contract_type: "protocol_integration"
applies_to: ["k1.orchestrator.tool_runner", "k1.wasm_sandbox", "k1.mcp_gateway"]

# ============================================================================
# MCP IN WASM: Architecture Overview
# ============================================================================

principle: |
  MCP server can be implemented as WASM module + HTTP transport layer.

  Traditional MCP: Native process + stdio pipes + JSON-RPC protocol
  WASM MCP: WASM module + HTTP endpoints + JSON-RPC protocol

  Benefit: Untrusted MCP servers run safely in WASM sandbox
  - Tool function exposed via WASM export
  - HTTP endpoint calls WASM export
  - Result: Untrusted MCP server, full isolation

  Architecture:
  K1 HTTP Client → HTTP POST /resource/read → WASM MCP Handler
                                                      ↓
                                                  Call WASM export
                                                      ↓
                                                  Return result JSON

# ============================================================================
# WASM EXPORTS: How WASM Exposes MCP Functions
# ============================================================================

wasm_interface:
  wasm_exports: |
    WASM module defines exports (functions callable from host):

    // Rust source (compiled to WASM)
    #[export_name = "mcp_list_resources"]
    pub fn mcp_list_resources(limit: i32) -> i32 {
        // return offset to JSON response in WASM memory
        // JSON: { "resources": [{...}] }
    }

    #[export_name = "mcp_read_resource"]
    pub fn mcp_read_resource(uri_ptr: i32, uri_len: i32) -> i32 {
        // Extract URI from WASM memory (utf8)
        // return offset to JSON response
        // JSON: { "contents": [{...}] }
    }

    #[export_name = "mcp_call_tool"]
    pub fn mcp_call_tool(
        tool_name_ptr: i32, tool_name_len: i32,
        args_ptr: i32, args_len: i32
    ) -> i32 {
        // Extract tool name and args from WASM memory
        // Perform tool logic
        // return offset to result JSON
        // JSON: { "content": [{...}] }
    }

  memory_management: |
    WASM module has isolated linear memory:
    - Module can allocate: malloc, Vec::push, etc.
    - Module can call exports: host reads result from memory
    - Result JSON written to WASM memory → host reads it

    Data flow example (read resource):
    1. Host passes URI: "memory://config.json" (in WASM memory)
    2. Host calls: mcp_read_resource(uri_ptr=1000, uri_len=20)
    3. WASM reads: UTF8 from memory[1000..1020] → "memory://config.json"
    4. WASM processes: load config from virtual filesystem
    5. WASM writes response: JSON at memory[5000..6000]
    6. WASM returns: offset 5000
    7. Host reads: response JSON from memory[5000..6000]

  json_protocol: |
    MCP protocol exchanged as JSON strings in WASM memory:

    Request (host → WASM):
    URI string copied to WASM memory at offset 1000

    Response (WASM → host):
    JSON response written to WASM memory at offset 5000:
    {
      "jsonrpc": "2.0",
      "result": {
        "contents": [
          {
            "uri": "memory://config.json",
            "mimeType": "application/json",
            "text": "{...config...}"
          }
        ]
      }
    }

# ============================================================================
# HTTP WRAPPER: WASM Module Behind HTTP Endpoint
# ============================================================================

http_layer:
  http_endpoint_wrapper: |
    K1 MCP Gateway wraps WASM module with HTTP:

    // Python wrapper
    from fastapi import FastAPI, Request
    import wasmtime

    app = FastAPI()
    wasm_store = wasmtime.Store()
    wasm_instance = wasmtime.Instance(wasm_store, tool_module, [])

    @app.post("/resource/read")
    async def read_resource(request: Request):
        body = await request.json()
        uri = body["uri"]

        # Write URI to WASM memory
        uri_bytes = uri.encode("utf8")
        uri_ptr = wasm_allocate(len(uri_bytes))
        wasm_memory.buffer[:] = uri_bytes

        # Call WASM export
        result_ptr = wasm_instance.exports.mcp_read_resource(
            uri_ptr, len(uri_bytes)
        )

        # Read result JSON from WASM memory
        result_json_bytes = read_wasm_memory(result_ptr)
        result = json.loads(result_json_bytes)

        return result

  mcp_protocol_mapping: |
    MCP request types → WASM export functions:

    resources/list → mcp_list_resources(limit)
      Request:  GET /resource/list?limit=10
      WASM:     Call mcp_list_resources(10)
      Response: { "resources": [...] }

    resources/read → mcp_read_resource(uri)
      Request:  POST /resource/read { "uri": "memory://config" }
      WASM:     Call mcp_read_resource(ptr, len)
      Response: { "contents": [...] }

    tools/list → mcp_list_tools(limit)
      Request:  GET /tool/list?limit=10
      WASM:     Call mcp_list_tools(10)
      Response: { "tools": [...] }

    tools/call → mcp_call_tool(name, args)
      Request:  POST /tool/call { "name": "get_weather", "args": {...} }
      WASM:     Call mcp_call_tool(name_ptr, name_len, args_ptr, args_len)
      Response: { "content": [...] }

  latency_profile: |
    WASM MCP HTTP wrapper latency:

    Traditional MCP (native process):
    1. Serialize request to JSON: 1ms
    2. Send via stdio pipe: 0.1ms
    3. Native process executes: 10-100ms
    4. Receive response via pipe: 0.1ms
    5. Deserialize JSON: 1ms
    Total: 12-102ms

    WASM MCP (HTTP):
    1. Serialize request to JSON: 1ms
    2. HTTP POST to endpoint: 0.5ms
    3. Copy request to WASM memory: 0.1ms
    4. Call WASM export: 0.1ms
    5. WASM executes: 10-100ms (10x slower if untrusted)
    6. Copy response from WASM memory: 0.1ms
    7. Deserialize JSON: 1ms
    Total: 12.8-102.8ms (essentially same latency)

# ============================================================================
# EXAMPLE: Weather API Server in WASM
# ============================================================================

example_weather_mcp_server:
  rust_source: |
    // weather_server.rs - Rust MCP server, compile to WASM
    use serde_json::{json, Value};

    const WEATHER_DATA: &str = r#"{
        "cities": {
            "NYC": {"temp": 72, "humidity": 65},
            "LA": {"temp": 85, "humidity": 40}
        }
    }"#;

    #[export_name = "mcp_list_resources"]
    pub fn mcp_list_resources(_limit: i32) -> i32 {
        let response = json!({
            "resources": [
                {
                    "uri": "weather://NYC",
                    "name": "NYC Weather",
                    "mimeType": "application/json"
                },
                {
                    "uri": "weather://LA",
                    "name": "LA Weather",
                    "mimeType": "application/json"
                }
            ]
        });
        write_response_to_memory(&response)
    }

    #[export_name = "mcp_read_resource"]
    pub fn mcp_read_resource(uri_ptr: i32, uri_len: i32) -> i32 {
        let uri = read_string_from_memory(uri_ptr, uri_len);

        let city = uri.strip_prefix("weather://").unwrap_or("NYC");
        let weather_db: Value = serde_json::from_str(WEATHER_DATA).unwrap();

        let weather = weather_db["cities"][city].clone();
        let response = json!({
            "contents": [{
                "uri": uri,
                "mimeType": "application/json",
                "text": weather.to_string()
            }]
        });

        write_response_to_memory(&response)
    }

    #[export_name = "mcp_call_tool"]
    pub fn mcp_call_tool(
        tool_name_ptr: i32, tool_name_len: i32,
        args_ptr: i32, args_len: i32
    ) -> i32 {
        let tool_name = read_string_from_memory(tool_name_ptr, tool_name_len);
        let args_str = read_string_from_memory(args_ptr, args_len);
        let args: Value = serde_json::from_str(&args_str).unwrap();

        match tool_name {
            "get_weather" => {
                let city = args["city"].as_str().unwrap_or("NYC");
                let weather_db: Value = serde_json::from_str(WEATHER_DATA).unwrap();
                let weather = weather_db["cities"][city].clone();

                let response = json!({
                    "content": [{
                        "type": "text",
                        "text": format!("Weather in {}: {:?}", city, weather)
                    }]
                });
                write_response_to_memory(&response)
            }
            _ => {
                let response = json!({"error": "Unknown tool"});
                write_response_to_memory(&response)
            }
        }
    }

  compilation: |
    Compile Rust to WASM:
    rustc --target wasm32-unknown-unknown weather_server.rs -O

    Output: weather_server.wasm (0.2MB binary)

    Deploy to K1:
    PUT /k1/wasm_modules/weather_mcp_v1.0.wasm (upload binary)

  k1_handler: |
    // Python handler in K1 MCP Gateway
    import wasmtime
    import json

    class WeatherMCPHandler:
        def __init__(self, wasm_binary_path):
            self.engine = wasmtime.Engine()
            self.store = wasmtime.Store(self.engine)

            with open(wasm_binary_path, "rb") as f:
                module = wasmtime.Module(self.engine, f.read())

            self.instance = wasmtime.Instance(self.store, module, [])

        def list_resources(self, limit: int):
            result_ptr = self.instance.exports.mcp_list_resources(limit)
            return self._read_json_from_memory(result_ptr)

        def read_resource(self, uri: str):
            uri_bytes = uri.encode("utf8")
            uri_ptr = self._write_to_memory(uri_bytes)
            result_ptr = self.instance.exports.mcp_read_resource(uri_ptr, len(uri_bytes))
            return self._read_json_from_memory(result_ptr)

        def call_tool(self, tool_name: str, args: dict):
            args_json = json.dumps(args)
            args_bytes = args_json.encode("utf8")
            args_ptr = self._write_to_memory(args_bytes)

            tool_name_bytes = tool_name.encode("utf8")
            tool_name_ptr = self._write_to_memory(tool_name_bytes)

            result_ptr = self.instance.exports.mcp_call_tool(
                tool_name_ptr, len(tool_name_bytes),
                args_ptr, len(args_bytes)
            )
            return self._read_json_from_memory(result_ptr)

        def _write_to_memory(self, data: bytes) -> int:
            # Allocate space in WASM memory and copy data
            # Return offset (simplified)
            ptr = 1000  # simplified allocation
            wasm_memory = self.instance.exports.memory.data_ptr()
            # Copy data to WASM memory
            return ptr

        def _read_json_from_memory(self, ptr: int) -> dict:
            # Read null-terminated string from WASM memory
            # Parse as JSON (simplified)
            return {"result": "success"}

    # Usage in FastAPI endpoint
    handler = WeatherMCPHandler("/k1/wasm_modules/weather_mcp_v1.0.wasm")

    @app.post("/weather/tools/call")
    async def call_weather_tool(tool_name: str, args: dict):
        result = handler.call_tool(tool_name, args)
        return result

# ============================================================================
# SECURITY: WASM MCP Isolation
# ============================================================================

security_properties:
  untrusted_mcp_server: |
    WASM MCP servers run completely sandboxed:

    Untrusted WASM MCP can try to:
    - Read host files: BLOCKED (WASI filesystem sandboxing)
    - Access network: BLOCKED (WASI network whitelisting)
    - Fork processes: BLOCKED (WASM cannot execute fork)
    - Escape sandbox: BLOCKED (zero-syscall isolation)

    Result: Untrusted MCP server poses zero risk

  compared_to_native_mcp: |
    Native MCP server (untrusted):
    - File access: Unrestricted (can read any file)
    - Network: Unrestricted (can contact any host)
    - Process: Can spawn processes
    - Escape: Possible via exploit

    Result: Untrusted native MCP server is DANGEROUS

    WASM MCP server (untrusted):
    - File access: Restricted to sandbox
    - Network: Restricted to whitelist
    - Process: Cannot spawn
    - Escape: Impossible (no syscalls)

    Result: Untrusted WASM MCP server is SAFE

# ============================================================================
# PERFORMANCE: WASM MCP vs Native MCP
# ============================================================================

performance_comparison:
  trusted_mcp_native: |
    Trusted MCP server in native process:
    - Tool execution time: T (baseline)
    - Example: 100ms for weather API call

  untrusted_mcp_native: |
    Untrusted MCP server in native process:
    - Tool execution time: T (same code, same speed)
    - But REQUIRES os-level sandbox (seccomp/chroot)
    - Sandbox overhead: +5-10% (rule filtering)
    - Total: 1.05-1.10 × T
    - Example: 105-110ms for weather API call

  untrusted_mcp_wasm: |
    Untrusted MCP server in WASM:
    - Tool execution time: 10 × T (WASM interpretation)
    - WASM sandbox overhead: minimal (already isolated)
    - Total: 10 × T
    - Example: 1000ms for weather API call

  tradeoff: |
    When to use WASM MCP:
    - Tool is I/O bound (5-50ms compute) → WASM overhead minimal
    - Tool must be untrusted → WASM preferred for security
    - Tool is heavy compute (100-1000ms compute) → WASM not ideal
    - Tool is time-sensitive (<50ms) → WASM not suitable

# ============================================================================
# DEPLOYMENT MODEL: MCP Selection
# ============================================================================

mcp_selection:
  decision_tree: |
    User requests MCP server execution:

    Is MCP server trusted?
    ├─ YES → Use NATIVE process (best performance)
    │   └─ Add seccomp/chroot for defense-in-depth
    │
    └─ NO (untrusted) → Is it I/O bound?
        ├─ YES → Use WASM (small overhead, maximum safety)
        │   └─ Example: API wrapper, database query
        │
        └─ NO (compute bound) → Check latency budget
            ├─ Budget > 2000ms → Use WASM (acceptable penalty)
            │   └─ Example: Image processing tool
            │
            └─ Budget < 2000ms → Use NATIVE + seccomp only
                └─ Note: Less safe but acceptable for time-critical

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: WASM MCP module MUST export minimum required functions
    REQUIRED: mcp_list_resources, mcp_read_resource, mcp_call_tool
    ENFORCEMENT: K1 validates exports at instantiation
    RATIONALE: Ensure MCP protocol compliance

  rule_2: |
    RULE: All MCP responses MUST be valid JSON
    ENFORCEMENT: K1 JSON-validates all responses from WASM
    RATIONALE: Detect malformed responses early

  rule_3: |
    RULE: WASM memory allocation MUST be tracked
    ENFORCEMENT: K1 limits total WASM memory to privacy band limit
    RATIONALE: Prevent memory exhaustion DoS

  rule_4: |
    RULE: WASM MCP execution timeout MUST apply
    ENFORCEMENT: K1 enforces timeout at HTTP layer + WASM layer
    RATIONALE: Prevent infinite loops in WASM code

  rule_5: |
    RULE: Only RED band (untrusted) MCP SHOULD use WASM
    ENFORCEMENT: K1 prefers NATIVE for trusted MCP
    RATIONALE: Avoid 10x penalty for trusted code
