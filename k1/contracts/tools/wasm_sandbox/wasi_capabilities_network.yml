# WASM Sandbox: WASI Network Capabilities
# Purpose: Define WASI network sandboxing with allowed host restrictions
# Research: WASI specification, capability-based networking
# Part of ADR-0033b (WASM Sandbox Implementation)

---
contract_id: "TOOL_EXEC_WASM_WASI_NETWORK"
contract_type: "sandbox_capabilities"
applies_to: ["k1.orchestrator.tool_runner", "k1.wasm_sandbox.wasi"]

# ============================================================================
# OVERVIEW: WASI Network Capabilities
# ============================================================================

overview: |
  WASI network provides capability-based socket access restricted to
  specific allowed hosts. Module cannot connect to arbitrary servers.

  Example: weather_plugin WASM module
  - Can connect to: api.openweathermap.org, api.weatherapi.com
  - Cannot connect to: 192.168.1.1 (internal network)
  - Cannot connect to: attacker.com (external network)
  - Cannot create raw sockets or use advanced networking

# ============================================================================
# NETWORK CAPABILITIES
# ============================================================================

network_capabilities:
  allowed_hosts:
    definition: |
      Whitelist of hosts that WASM module can connect to.
      Format: hostname or IP, with optional port.

      Examples:
      - api.openweathermap.org (any port)
      - api.openweathermap.org:443 (specific port)
      - 8.8.8.8 (Google DNS)
      - [2001:4860:4860::8888] (IPv6)

    enforcement: |
      Before socket connection:
      1. Parse target address (hostname or IP)
      2. Resolve hostname to IP (if hostname)
      3. Check: target IP in allowed_hosts? YES → allow, NO → deny
      4. Check: target port in allowed_ports? YES → allow, NO → deny
      5. Return error if not allowed (EACCES - permission denied)

  dns_resolution:
    mechanism: |
      WASM module calls getaddrinfo() or similar to resolve DNS.
      K1 intercepts DNS resolution:
      - Check: hostname in allowed_hosts? If not → deny
      - Resolve hostname to IP (via host DNS resolver)
      - Return resolved IP to WASM module
      - Module uses IP to connect (connection check above prevents direct IP bypass)

    security: |
      Prevents DNS rebinding attacks:
      - Module resolves attacker.com → gets 127.0.0.1 (attacker's DNS server rebinds)
      - Module tries to connect to 127.0.0.1 → blocked (not in allowed_hosts)
      - Protected against timing attacks (DNS responses not timing-dependent)

  port_restrictions:
    allowed_ports: |
      Per-tool allowed ports (default: 443, 80, 8080):
      - HTTP: 80 (web APIs)
      - HTTPS: 443 (secure APIs, TLS required)
      - Custom: 8080, 3000, 5000, 9000 (dev servers)

    blocked_ports: |
      Blocked ports (hardcoded):
      - 22 (SSH) - no remote shell
      - 23 (Telnet) - no shell
      - 3389 (RDP) - no desktop
      - 3306 (MySQL) - no direct database
      - 5432 (PostgreSQL) - no direct database
      - 6379 (Redis) - no direct cache
      - 11211 (Memcached) - no direct cache
      - Rationale: WASM can use API instead of direct protocol

    enforcement: |
      Before connect:
      - Check target port in blocked_ports? → DENY
      - Check target port in allowed_ports? → ALLOW
      - Otherwise → DENY (default-deny policy)

  protocol_restrictions:
    tcp_only: |
      K1 WASI supports TCP (socket/connect), not UDP.
      Rationale:
      - TCP is stateful (easier to audit)
      - UDP is connectionless (harder to track)
      - Most APIs use TCP/HTTP/HTTPS

    tls_enforcement: |
      For remote hosts (not localhost), TLS is recommended:
      - HTTP (port 80): Allowed but exposed (plaintext)
      - HTTPS (port 443): Encrypted and authenticated
      - K1 policy: Allow both, but emit warning for HTTP
      - Rationale: Balance security vs usability

    unsupported: |
      Not supported:
      - Raw sockets (socket(AF_INET, SOCK_RAW))
      - Multicast (socket options for multicast)
      - IPv4 mapped IPv6 (avoid complexity)

# ============================================================================
# BANDWIDTH & RATE LIMITING
# ============================================================================

rate_limiting:
  per_module_limits:
    bandwidth: |
      Per-tool network bandwidth limits (egress):
      - GREEN band: 10 Mbps (unlimited practically)
      - AMBER band: 5 Mbps
      - RED band: 1 Mbps (sensitive operations)
      - BLACK band: 0 Mbps (no network)

    connection_count: |
      Max concurrent connections per module:
      - Per-tool: 10 connections (typical)
      - Per-host: 3 connections (prevent connection exhaustion)
      - Enforcement: track in K1 network manager

    timeout: |
      Connection timeout (per-band):
      - GREEN: 30 seconds
      - AMBER: 20 seconds
      - RED: 10 seconds
      - Enforcement: asyncio.wait_for or similar

  enforcement_mechanism: |
    K1 network manager intercepts socket operations:
    1. socket() → create socket → track in active_connections
    2. connect() → check allowed_hosts, rate limits → allowed → proceed
    3. send/recv → measure bandwidth → check limits → proceed
    4. close() → remove from active_connections

    Violations:
    - Rate limit exceeded → Connection closed (EPIPE)
    - Bandwidth exceeded → Throttle (slower packet delivery)
    - Timeout exceeded → Force close (ETIMEOUT)

# ============================================================================
# CONFIGURATION: YAML Schema
# ============================================================================

configuration:
  yaml_section: "k1/config/tools/wasm_wasi_network.yml"
  config_example: |
    wasi_network:
      enabled: true

      tools:
        - tool_id: "weather_plugin"
          allowed_hosts:
            - "api.openweathermap.org"
            - "api.weatherapi.com"
            - "cdn.weather.example.com"
          allowed_ports: [80, 443]
          bandwidth_limit_mbps: 10
          max_connections: 5
          connection_timeout_seconds: 30
          band: GREEN

        - tool_id: "auth_provider"
          allowed_hosts:
            - "accounts.google.com"
            - "login.microsoft.com"
          allowed_ports: [443]
          bandwidth_limit_mbps: 5
          max_connections: 3
          connection_timeout_seconds: 20
          band: AMBER

      blocked_ports_global: [22, 23, 3389, 3306, 5432, 6379, 11211]
      tcp_only: true
      dns_resolver_enabled: true

# ============================================================================
# OBSERVABILITY & VALIDATION
# ============================================================================

observability:
  metrics:
    - name: "wasi_socket_connect_total"
      type: "Counter"
      labels: ["tool_id", "target_host", "status"]
      description: "Total connection attempts"

    - name: "wasi_socket_denied_total"
      type: "Counter"
      labels: ["tool_id", "target_host", "reason"]
      values: ["not_in_whitelist", "port_blocked", "rate_limited"]
      description: "Denied connection attempts"

    - name: "wasi_bandwidth_usage_bytes"
      type: "Gauge"
      labels: ["tool_id"]
      description: "Current bandwidth usage (bytes/sec)"

    - name: "wasi_active_connections"
      type: "Gauge"
      labels: ["tool_id"]
      description: "Active socket connections per tool"

  logging:
    - event: "wasi_socket_connect_success"
      level: "DEBUG"
      context: {tool_id, target_host, target_port, trace_id}

    - event: "wasi_socket_connect_denied"
      level: "WARNING"
      context: {tool_id, target_host, target_port, reason, trace_id}

    - event: "wasi_dns_resolution"
      level: "DEBUG"
      context: {tool_id, hostname, resolved_ip, allowed, trace_id}

    - event: "wasi_bandwidth_limit_exceeded"
      level: "WARNING"
      context: {tool_id, current_mbps, limit_mbps, trace_id}

    - event: "wasi_suspicious_connection_pattern"
      level: "CRITICAL"
      context: {tool_id, pattern, details, trace_id}

validation_rules:
  rule_1: |
    RULE: Target host MUST be in allowed_hosts whitelist before connect
    ENFORCEMENT: Check before socket connect(), return EACCES if not allowed
    RATIONALE: Prevent access to unauthorized hosts

  rule_2: |
    RULE: Target port MUST NOT be in blocked_ports
    ENFORCEMENT: Check before connect(), block hardcoded dangerous ports
    RATIONALE: Prevent direct database/cache/remote shell access

  rule_3: |
    RULE: Bandwidth usage MUST NOT exceed per-tool limit
    ENFORCEMENT: Measure egress bandwidth, throttle or close if exceeded
    RATIONALE: Prevent resource exhaustion

  rule_4: |
    RULE: Concurrent connections MUST NOT exceed per-tool max
    ENFORCEMENT: Count active connections, reject new connect() if at limit
    RATIONALE: Prevent connection exhaustion attack

  rule_5: |
    RULE: Connection timeout MUST be enforced
    ENFORCEMENT: Close socket if no activity for timeout period
    RATIONALE: Prevent hanging connections, resource leaks
