# WASM Sandbox: Zero Syscall Isolation
# Purpose: Explain how WASM achieves complete isolation via no syscall access
# Research: WebAssembly security model, sandboxing principles
# Part of ADR-0033b (WASM Sandbox Implementation)

---
contract_id: "TOOL_EXEC_WASM_ZERO_SYSCALL_ISOLATION"
contract_type: "security_principle"
applies_to: ["k1.orchestrator.tool_runner", "k1.wasm_sandbox"]

# ============================================================================
# ZERO SYSCALL PRINCIPLE
# ============================================================================

principle: |
  WASM modules execute with ZERO direct access to OS syscalls.

  Native code: fork, execve, open, socket, etc. all available
  WASM code: None of these available (100% isolated)

  Instead: WASM uses WASI functions (safe wrapper layer)
  - WASI fd_open() → K1 enforces capability check → open(2) on host
  - WASM socket() → Not available, use WASI socket functions
  - WASM fork() → Not available (WASM is single-threaded)
  - WASM execve() → Not available (no process launching)

  Result: Complete isolation from host OS, zero privilege escalation risk

# ============================================================================
# WASM EXECUTION MODEL: NO SYSCALLS
# ============================================================================

wasm_execution_model:
  instruction_set: |
    WASM has ~180 instructions (fully defined):
    - Memory operations: memory.load, memory.store
    - Control flow: br, call, if/else/loop
    - Arithmetic: i32.add, f64.mul, etc.
    - Type conversion: i32.trunc_f64_s, etc.

    NOT included:
    - syscall instruction (doesn't exist in WASM)
    - privileged instructions (ring0/ring3 irrelevant)
    - I/O instructions (no direct I/O)

  function_calls: |
    WASM can call:
    1. Exported functions (other WASM modules or WASI)
    2. Imported functions (host functions, defined at instantiation)
    3. Internal functions (within same module)

    WASM CANNOT:
    - Call arbitrary memory addresses as functions (no function pointers in memory)
    - Call OS functions directly (no syscall instruction)
    - Return to arbitrary code locations (no ROP gadgets)

  memory_access: |
    WASM memory is linear and bounded:
    - Accessed only via memory.load/memory.store
    - All accesses bounds-checked by Wasmtime
    - Cannot access:
      - Host memory (different address space)
      - Other WASM module memory (separate store)
      - Kernel memory (no kernel access)

    Memory corruption:
    - Buffer overflow in WASM → stays within WASM memory
    - Cannot corrupt host process memory
    - Cannot corrupt other WASM modules

  information_leakage: |
    WASM module cannot leak information about:
    - Host memory layout (ASLR intact)
    - Other WASM modules (separate stores)
    - Kernel internals (no syscall results)

    Exception: Timing side-channels
    - WASM execution time might leak information
    - Mitigation: K1 adds jitter to response times
    - Mitigation: Constant-time cryptography recommended

# ============================================================================
# CONTRAST: Native Code vs WASM
# ============================================================================

comparison:
  native_code_security: |
    Native compiled code (C, C++, Rust):
    - Direct syscall access (open, socket, fork, etc.)
    - Direct memory access (pointer dereference)
    - Privilege escalation possible (buffer overflow → ROP → shell)
    - Information leakage (reading host memory)
    - Requires OS-level sandboxing (seccomp, chroot, capabilities)

    Example attack:
    ```
    // Malicious C code
    int fd = open("/etc/shadow", O_RDONLY);  // Direct syscall
    char* p = (char*)0x7fff0000;             // Direct memory access
    printf("Host memory: %s\n", p);          // Information leak
    ```

  wasm_code_security: |
    WASM code (compiled from Rust, C, etc.):
    - NO direct syscall access (no syscall instruction)
    - NO direct memory access (memory.load/store only, bounds-checked)
    - NO privilege escalation (no syscalls to escalate)
    - NO information leakage (cannot access host memory)
    - Complete isolation (no OS-level sandboxing needed)

    Example: Same logic compiled to WASM
    ```
    // Rust code compiled to WASM
    let fd = wasi::fd_open(...)?;  // WASI function (not syscall)
                                    // K1 checks capability before opening
    let p: *const u8 = 0x7fff0000; // Can't create this pointer in WASM
                                    // (memory.load would check bounds)
    // println! not available (WASM prints via WASI)
    ```

# ============================================================================
# THREAT MODEL: What WASM Prevents
# ============================================================================

threat_model:
  threat_1_code_injection: |
    WASM prevents code injection:
    - WASM code is compiled to bytecode (not source)
    - No self-modifying code (bytecode is immutable)
    - No dynamic code generation (eval not possible)
    - Result: Code integrity guaranteed

  threat_2_privilege_escalation: |
    WASM prevents privilege escalation:
    - No syscall instruction (cannot call kernel)
    - No capability to run commands (no fork/execve)
    - No access to privileged files (WASI enforces capability)
    - Result: Module cannot gain higher privilege

  threat_3_information_disclosure: |
    WASM prevents information disclosure:
    - Cannot access host memory (separate memory)
    - Cannot read arbitrary files (WASI capability enforcement)
    - Cannot access other modules (separate stores)
    - Result: Data confidentiality within sandbox

  threat_4_denial_of_service: |
    WASM partially mitigates DoS:
    - Memory limits (memory.max bounds growth)
    - CPU time limits (timeout enforcement by K1)
    - Connection limits (WASI network limits)
    - Result: Limited resource exhaustion risk
    - Note: Module can still waste CPU (intentional, monitored)

  threat_5_side_channels: |
    WASM still vulnerable to some side-channel attacks:
    - Timing attacks (execution time leak)
    - Cache timing (if cache not partitioned)
    - Spectre/Meltdown (CPU-level, not WASM-level)
    - Result: Sensitive data shouldn't rely on timing secrecy
    - Mitigation: K1 adds randomization, constant-time crypto recommended

# ============================================================================
# IMPLEMENTATION: How Wasmtime Enforces Isolation
# ============================================================================

wasmtime_enforcement:
  instruction_validation: |
    Wasmtime validates WASM bytecode before execution:
    1. Parse bytecode (magic number 0x6d736100 = "\0asm")
    2. Validate instruction opcodes (reject unknown opcodes)
    3. Validate control flow (no unreachable code)
    4. Validate function signatures (type checking)
    5. Validate memory/table bounds (statically check if possible)

    Result: Only valid, safe code executes

  runtime_bounds_checking: |
    Every WASM memory access is bounds-checked:

    WASM code: memory.load(ptr)
    Wasmtime:
      1. Check: ptr < current_memory_size? YES → load, NO → trap
      2. Cost: 1 CPU instruction per access (negligible)

    Result: Buffer overflow impossible (cannot access outside WASM memory)

  stack_isolation: |
    WASM stack is separate from host stack:
    - WASM function calls use WASM stack (within linear memory)
    - Host function calls use host stack (protected)
    - Stack overflow in WASM → cannot corrupt host stack

    Result: Stack smashing attack (ROP) impossible in WASM

  function_pointer_restrictions: |
    WASM function calls are indirect via function table:

    WASM code: call_indirect(func_index)
    Wasmtime:
      1. Check: func_index < table_size? YES → call, NO → trap
      2. Lookup: table[func_index] → function address
      3. Call: function (cannot call arbitrary address)

    Result: ROP gadgets not accessible (functions must be in table)

# ============================================================================
# PERFORMANCE: Overhead of Zero Syscalls
# ============================================================================

performance:
  direct_syscalls_eliminated: |
    WASM code that needs I/O must use WASI:

    Native: open("/tmp/file.txt") → 1 syscall → 10-100 microseconds
    WASM: wasi::fd_open() → 1 WASI call → 1-10 microseconds

    Reason: WASI call is function call, not syscall
    Benefit: 10x faster (no context switch)

  memory_access_penalty: |
    Bounds checking adds minimal overhead:

    Native: mov rax, [rbx]        → 1 CPU instruction
    WASM:   memory.load(offset)   → 2-3 CPU instructions
                                     (bounds check + load)

    Reason: WASM needs to validate offset first
    Overhead: ~2x, but tiny absolute time (1 nanosecond)

  total_isolation_penalty: |
    WASM isolation vs native code:
    - Native with os-level sandbox (seccomp, chroot): 10-20% overhead
    - WASM with zero-syscall: 10-20% overhead (similar)
    - WASM is safer (no syscalls to be filtered)

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: WASM bytecode MUST be validated before execution
    ENFORCEMENT: Wasmtime validates on module instantiation
    RATIONALE: Prevent malformed code from executing

  rule_2: |
    RULE: All memory accesses MUST be bounds-checked
    ENFORCEMENT: Wasmtime adds bounds checks to all memory.load/store
    RATIONALE: Prevent buffer overflow attacks

  rule_3: |
    RULE: WASM MUST NOT have syscall instruction
    ENFORCEMENT: WASM instruction set excludes syscall
    RATIONALE: Enforce zero-syscall isolation principle

  rule_4: |
    RULE: Function calls MUST go through function table (indirect)
    ENFORCEMENT: WASM call_indirect validates table index before calling
    RATIONALE: Prevent ROP gadget attacks

  rule_5: |
    RULE: Each WASM instance MUST have isolated memory/store
    ENFORCEMENT: Wasmtime creates separate Store per instance
    RATIONALE: Complete isolation between modules
