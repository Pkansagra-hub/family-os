# WASM Sandbox: WASI Filesystem Capabilities
# Purpose: Define WASI filesystem sandboxing with capability-based access
# Research: WASI specification (WASM System Interface), Capability-based security
# Part of ADR-0033b (WASM Sandbox Implementation)

---
contract_id: "TOOL_EXEC_WASM_WASI_FILESYSTEM"
contract_type: "sandbox_capabilities"
applies_to: ["k1.orchestrator.tool_runner", "k1.wasm_sandbox.wasi"]

# ============================================================================
# OVERVIEW: WASI Filesystem Sandboxing
# ============================================================================

overview: |
  WASI filesystem provides capability-based file access without exposing
  the entire host filesystem. Preopened directories define capability boundaries.

  Module can ONLY access:
  - Preopened directories (explicitly granted)
  - Files within those directories
  - Cannot escape sandbox via path traversal

  Example: User plugin given /tmp/user_workspace
  - Can read/write: /tmp/user_workspace/data.txt ✓
  - Cannot access: /tmp/other_workspace/ ✗
  - Cannot access: /etc/passwd ✗
  - Cannot access: /root/.ssh/ ✗

# ============================================================================
# CAPABILITY-BASED FILESYSTEM ACCESS
# ============================================================================

capabilities:
  preopened_directories:
    definition: |
      Preopened directories are filesystem directories that WASI exposes to
      WASM module with specific capabilities. Module receives file descriptor
      (fd) that can be used to access files within directory.

      Example configuration:
      - /tmp/tool_<tool_id>_workspace → fd=3 (tool's private workspace)
      - /k1/tool_libs/<tool_id>/ → fd=4 (read-only tool libraries)
      - /tmp/shared_data/ → fd=5 (shared read-only data, for multiple tools)

    isolation:
      - Each WASM instance has separate fd table (no fd sharing between instances)
      - Module cannot create new directories (except within preopened directories)
      - Module cannot follow symlinks outside preopened boundaries
      - Module cannot access files by absolute path (sandboxed relative access)

  file_descriptor_operations:
    fd_open: |
      Open file within preopened directory
      - Arguments: fd (preopened directory fd), path (relative path)
      - Returns: new file descriptor (or error if path outside directory)
      - Capabilities checked: Does fd grant access to this path?
      - Path normalization: Reject "..", symbolic links that escape
      - Example: fd_open(3, "data.txt") opens /tmp/tool_workspace/data.txt

    fd_read: |
      Read from file descriptor
      - Arguments: fd (file descriptor), buffer (WASM memory address), size
      - Returns: bytes read (or error)
      - Capability checked: Does fd have READ capability?
      - Memory bounds: Write to buffer within WASM memory bounds (Wasmtime checks)

    fd_write: |
      Write to file descriptor
      - Arguments: fd (file descriptor), buffer (WASM memory address), size
      - Returns: bytes written (or error)
      - Capability checked: Does fd have WRITE capability?
      - Quota enforcement: Check remaining disk quota before write

    fd_seek: |
      Seek within file
      - Arguments: fd (file descriptor), offset, whence
      - Returns: new file position (or error)
      - Capability checked: Does fd have SEEK capability?
      - Boundary check: Seek within file size + 1 (POSIX standard)

    fd_close: |
      Close file descriptor
      - Arguments: fd (file descriptor)
      - Returns: success or error
      - Cleanup: Release file descriptor resources
      - Safety: Prevent fd exhaustion

    fd_stat: |
      Get file metadata (size, permissions, timestamps)
      - Arguments: fd (file descriptor), path (optional)
      - Returns: file metadata struct
      - Capability checked: Does fd have STAT capability?

    fd_prestat: |
      Get metadata about preopened directory
      - Arguments: fd (file descriptor)
      - Returns: directory path (as visible to module)
      - Security: Module can discover its own preopened directories
      - Limitation: Module cannot see directories it wasn't given

  directory_operations:
    path_resolution: |
      WASI performs strict path resolution (no escaping):

      Preopened directory: /tmp/tool_workspace
      WASM module path: "data/file.txt"
      Resolved: /tmp/tool_workspace/data/file.txt ✓

      Preopened directory: /tmp/tool_workspace
      WASM module path: "../other_workspace/file.txt"
      Resolved: REJECT (path normalization prevents ..) ✗

      Preopened directory: /tmp/tool_workspace
      WASM module path: "/etc/passwd" (absolute path)
      Resolved: REJECT (absolute paths forbidden) ✗

    symlink_handling: |
      Symlinks that escape are rejected:

      Preopened directory: /tmp/tool_workspace/
      /tmp/tool_workspace/link.txt → symlink to /etc/passwd
      Module opens "link.txt"
      WASI follows symlink, checks: /etc/passwd in /tmp/tool_workspace/? NO
      REJECT access ✗

      Preopened directory: /tmp/tool_workspace/
      /tmp/tool_workspace/link.txt → symlink to /tmp/tool_workspace/real.txt
      Module opens "link.txt"
      WASI follows symlink, checks: /tmp/tool_workspace/real.txt in /tmp/tool_workspace/? YES
      ALLOW access ✓

    permission_checking: |
      WASI respects POSIX permissions (mode, user, group):
      - Module runs as specific UID/GID (isolated from host)
      - Read access: Requires r-- permission on file
      - Write access: Requires -w- permission on file
      - Execute access: Not applicable (WASM cannot execute files)

# ============================================================================
# QUOTA & RESOURCE LIMITS
# ============================================================================

quotas:
  disk_quota:
    per_tool: |
      Each tool gets disk quota for /tmp/tool_<tool_id>_workspace:
      - GREEN band: 1 GB
      - AMBER band: 500 MB
      - RED band: 100 MB
      - BLACK band: 0 MB (no filesystem access)

    enforcement:
      - Before fd_write: Check disk_usage + write_size <= quota
      - If exceeds: Return ENOSPC error (no space on device)
      - Metric: disk_usage_percent per tool_id

    cleanup:
      - On tool exit: Workspace destroyed (rm -rf /tmp/tool_<tool_id>_workspace)
      - Space reclaimed: Quota reset to 0 for next instance

  file_descriptor_limit:
    per_module_instance: 1024 (typical ulimit)
    enforcement: |
      - K1 configures per-tool fd limit in cgroups
      - If module opens 1024 fds: next open() returns EMFILE
      - Module must close() fds to open more

    protection: |
      Prevents fd exhaustion attack:
      - Malicious module opens 1000 fds
      - Cannot open more files
      - Cannot cause host-level fd exhaustion (isolated per tool)

# ============================================================================
# CONFIGURATION: YAML Schema
# ============================================================================

configuration:
  yaml_section: "k1/config/tools/wasm_wasi_filesystem.yml"
  config_example: |
    wasi_filesystem:
      enabled: true
      preopened_directories:
        - fd: 3
          path: "/tmp/tool_<tool_id>_workspace"
          capabilities: ["READ", "WRITE", "CREATE", "STAT"]
          quota_bytes: 1073741824  # 1 GB
          description: "Per-tool private workspace"

        - fd: 4
          path: "/k1/tool_libs"
          capabilities: ["READ", "STAT"]
          quota_bytes: 0  # Read-only, no quota
          description: "Shared tool libraries (read-only)"

      symlink_handling: "follow_with_boundary_check"  # Follow symlinks but check boundaries
      path_resolution: "strict"  # Reject escapes, absolute paths, .., etc.

      disk_quota:
        GREEN: 1073741824    # 1 GB
        AMBER: 536870912     # 512 MB
        RED: 104857600       # 100 MB
        BLACK: 0             # 0 MB (no access)

      fd_limit: 1024

# ============================================================================
# OBSERVABILITY & VALIDATION
# ============================================================================

observability:
  metrics:
    - name: "wasi_fd_open_total"
      type: "Counter"
      labels: ["tool_id", "status"]
      description: "Total file open attempts"

    - name: "wasi_disk_usage_bytes"
      type: "Gauge"
      labels: ["tool_id"]
      description: "Current disk usage per tool"

    - name: "wasi_quota_exceeded_total"
      type: "Counter"
      labels: ["tool_id"]
      description: "Quota exceeded errors"

    - name: "wasi_path_escape_attempts_total"
      type: "Counter"
      labels: ["tool_id"]
      description: "Path traversal attack attempts"

  logging:
    - event: "wasi_fd_open_success"
      level: "DEBUG"
      context: {tool_id, fd, path, size_bytes, trace_id}

    - event: "wasi_fd_open_failure"
      level: "WARNING"
      context: {tool_id, path, error_code, reason, trace_id}

    - event: "wasi_quota_exceeded"
      level: "ERROR"
      context: {tool_id, disk_usage_bytes, quota_bytes, requested_bytes, trace_id}

    - event: "wasi_path_escape_detected"
      level: "CRITICAL"
      context: {tool_id, attempted_path, trace_id}

validation_rules:
  rule_1: |
    RULE: Path traversal via ".." MUST be rejected
    ENFORCEMENT: Normalize paths, reject if result outside preopened directory
    RATIONALE: Prevent escape from sandbox

  rule_2: |
    RULE: Symlinks MUST be resolved with boundary checking
    ENFORCEMENT: Follow symlink, verify target in preopened directory
    RATIONALE: Prevent escape via symlink tricks

  rule_3: |
    RULE: Absolute paths MUST be rejected
    ENFORCEMENT: Reject paths starting with /
    RATIONALE: Force relative paths within preopened directory

  rule_4: |
    RULE: Disk quota MUST be enforced before write
    ENFORCEMENT: Check usage + write_size <= quota, return ENOSPC if exceeds
    RATIONALE: Prevent disk exhaustion attacks
