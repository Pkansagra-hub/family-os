# Process Sandbox: Network Egress via iptables
# Purpose: Firewall rules per-tool via --pid-owner matching
# Research: iptables, netfilter, per-process firewall
# Part of ADR-0033c (Process Sandbox Implementation) & ADR-0032 (Egress Layer 1)

---
contract_id: "TOOL_EXEC_PROCESS_NETWORK_EGRESS_IPTABLES"
contract_type: "network_security"
applies_to: ["k1.orchestrator.tool_runner", "k1.process_sandbox"]

# ============================================================================
# NETWORK EGRESS PRINCIPLE: Per-Tool Firewall via iptables
# ============================================================================

principle: |
  Each tool process has individual firewall rules (via --pid-owner).

  Traditional firewall: Host-level rules (apply to all processes)
  K1 network egress: Process-level rules (apply per-tool PID)

  Benefits:
  - Weather tool can connect only to weather APIs (specific hosts)
  - Database tool can connect only to internal DB (specific host/port)
  - Other tools cannot make network calls (policy drop)

  Architecture:
  iptables rule + --pid-owner matching
  → Kernel netfilter checks: Is source PID in tool list?
  → If YES: Check whitelist (allowed host/port?)
  → If whitelisted: Allow packet
  → If not whitelisted: Drop packet (silently)

  Result: Per-tool network isolation

# ============================================================================
# IPTABLES RULES: Default Deny, Explicit Allow
# ============================================================================

rules_architecture:
  default_policy: |
    All network: DENY (drop all packets)
    Exception: Loopback (127.0.0.1 always allowed)
    Exception: Whitelisted hosts/ports (explicitly allowed)

    Rule precedence (evaluated top-to-bottom):
    1. Allow loopback (127.0.0.1, ::1)
    2. Allow whitelisted hosts (from tool config)
    3. Block sensitive ports (22, 23, 3306, 5432, 6379, 11211)
    4. Drop all remaining (default policy)

  rule_setup_example: |
    For weather_tool (PID 200):

    # Drop all by default for this PID
    iptables -A OUTPUT -p tcp --pid-owner 200 -j DROP
    iptables -A OUTPUT -p udp --pid-owner 200 -j DROP

    # Allow loopback
    iptables -A OUTPUT -p tcp --pid-owner 200 -d 127.0.0.1 -j ACCEPT
    iptables -A OUTPUT -p tcp --pid-owner 200 -d ::1 -j ACCEPT

    # Allow DNS (port 53 to 8.8.8.8)
    iptables -A OUTPUT -p udp --pid-owner 200 -d 8.8.8.8 --dport 53 -j ACCEPT

    # Allow API host (api.openweathermap.org = 1.2.3.4)
    iptables -A OUTPUT -p tcp --pid-owner 200 -d 1.2.3.4 --dport 443 -j ACCEPT
    iptables -A OUTPUT -p tcp --pid-owner 200 -d 1.2.3.4 --dport 80 -j ACCEPT

    # Block sensitive ports explicitly (defense-in-depth)
    iptables -A OUTPUT -p tcp --pid-owner 200 --dport 22 -j DROP  # SSH
    iptables -A OUTPUT -p tcp --pid-owner 200 --dport 3306 -j DROP # MySQL

    (All other traffic drops via default policy)

# ============================================================================
# WHITELIST CONFIGURATION: Per-Tool Network Policy
# ============================================================================

configuration:
  tool_network_whitelist: |
    YAML configuration per tool:

    tool_id: weather_tool
    network_policy:
      allowed_hosts:
        - api.openweathermap.org      # Will resolve to IP
        - api.weatherapi.com          # Will resolve to IP
      allowed_ports: [80, 443]
      blocked_ports: [22, 23, 3389, 3306, 5432, 6379, 11211]
      dns_servers: [8.8.8.8, 8.8.4.4]
      bandwidth_limit_mbps: 10
      connection_timeout_sec: 30
      max_connections: 10
      max_connections_per_host: 3
      tls_required: true

  privacy_band_restrictions: |
    Resource limits per privacy band:

    GREEN band tools:
      bandwidth_limit: 50 Mbps (high-trust tools can use more)
      allowed_hosts: Per-tool whitelist
      timeout: 30 seconds

    AMBER band tools:
      bandwidth_limit: 20 Mbps (moderate restriction)
      allowed_hosts: Stricter whitelist
      timeout: 20 seconds

    RED band tools:
      bandwidth_limit: 5 Mbps (severe restriction)
      allowed_hosts: Minimal whitelist
      timeout: 10 seconds

    BLACK band tools:
      bandwidth_limit: 0 Mbps (completely blocked)
      allowed_hosts: None (empty list)
      timeout: N/A

# ============================================================================
# DNS RESOLUTION: Preventing Rebinding Attacks
# ============================================================================

dns_security:
  dns_resolution_flow: |
    When tool tries to resolve hostname:

    1. Tool calls: socket(AF_INET, SOCK_DGRAM)
       → iptables allows UDP to DNS server (8.8.8.8:53)

    2. Tool sends: DNS query for "api.openweathermap.org"

    3. DNS server responds: IP address (1.2.3.4)

    4. K1 intercepts: Validates response
       - Is 1.2.3.4 in whitelist for api.openweathermap.org?
       - YES: Allow, add to local DNS cache
       - NO: Block connection attempt

    5. Tool connects: Uses validated IP address

  rebinding_attack_prevention: |
    Attack: DNS rebinding (tool resolves same domain to different IP)

    Naive behavior:
    1. Tool resolves api.openweathermap.org → 1.2.3.4 (correct)
    2. Connection succeeds
    3. Attacker controls DNS server
    4. Tool resolves api.openweathermap.org again → 192.168.1.100 (internal)
    5. Second connection succeeds (SECURITY BREACH)

    K1 prevention:
    - Cache DNS results
    - Validate each connection: Does resolved IP match cached result?
    - If mismatch: Block connection (rebinding attack detected)
    - Log violation to audit receipt

    iptables rule (simplified):
    iptables -A OUTPUT -p tcp --pid-owner 200 -m conntrack \
      --ctstate NEW -m limit --limit 5/sec -j ACCEPT
    (Rate-limit DNS lookups to prevent rapid rebinding)

# ============================================================================
# BLOCKED PORTS: Hardcoded Security
# ============================================================================

blocked_ports_global:
  port_22_ssh: |
    Port 22 (SSH): ALWAYS BLOCKED

    Reason: SSH allows remote command execution
    Block: Prevents tool from exfiltrating data via SSH tunnel

    Rule: iptables -A OUTPUT -p tcp --dport 22 -j DROP

  port_23_telnet: |
    Port 23 (Telnet): ALWAYS BLOCKED

    Reason: Telnet allows remote shell access (unencrypted)
    Block: Prevents unauthorized access to internal systems

    Rule: iptables -A OUTPUT -p tcp --dport 23 -j DROP

  port_3389_rdp: |
    Port 3389 (RDP): ALWAYS BLOCKED

    Reason: Remote Desktop Protocol (Windows remote access)
    Block: Prevents lateral movement to Windows systems

    Rule: iptables -A OUTPUT -p tcp --dport 3389 -j DROP

  port_3306_mysql: |
    Port 3306 (MySQL): ALWAYS BLOCKED (unless whitelisted)

    Reason: Direct database access (high-risk)
    Exception: If database_tool has explicit whitelist for internal DB

    Rule: iptables -A OUTPUT -p tcp --dport 3306 -j DROP

  port_5432_postgresql: |
    Port 5432 (PostgreSQL): ALWAYS BLOCKED (unless whitelisted)

    Reason: Direct database access (high-risk)
    Exception: If database_tool has explicit whitelist for internal DB

    Rule: iptables -A OUTPUT -p tcp --dport 5432 -j DROP

  port_6379_redis: |
    Port 6379 (Redis): ALWAYS BLOCKED

    Reason: In-memory data store (often unauthenticated)
    Block: Prevents cache poisoning, data theft

    Rule: iptables -A OUTPUT -p tcp --dport 6379 -j DROP

  port_11211_memcached: |
    Port 11211 (Memcached): ALWAYS BLOCKED

    Reason: Memory cache (unencrypted, unauthenticated)
    Block: Prevents cache data theft, session hijacking

    Rule: iptables -A OUTPUT -p tcp --dport 11211 -j DROP

# ============================================================================
# ALLOWED PORTS: Web Services Only
# ============================================================================

allowed_ports_default:
  port_80_http: |
    Port 80 (HTTP): ALLOWED (for whitelisted hosts)

    Default: HTTP allowed to whitelisted hosts
    Caution: Unencrypted, consider recommending TLS
    Policy: Prefer port 443 (HTTPS) over 80 (HTTP)

    Rule: iptables -A OUTPUT -p tcp -d <whitelist_ip> --dport 80 -j ACCEPT

  port_443_https: |
    Port 443 (HTTPS): ALLOWED (for whitelisted hosts)

    Default: HTTPS allowed to whitelisted hosts
    Benefit: Encrypted, authenticated
    Recommendation: Use 443 for all API calls

    Rule: iptables -A OUTPUT -p tcp -d <whitelist_ip> --dport 443 -j ACCEPT

  port_8080_http_alt: |
    Port 8080 (HTTP alternate): ALLOWED (for whitelisted hosts)

    Use case: Internal services using non-standard HTTP port
    Default: Allowed with explicit whitelist

    Rule: iptables -A OUTPUT -p tcp -d <whitelist_ip> --dport 8080 -j ACCEPT

  port_3000_nodejs: |
    Port 3000 (Node.js default): ALLOWED (for whitelisted hosts)

    Use case: Development/staging APIs
    Default: Allowed with explicit whitelist

    Rule: iptables -A OUTPUT -p tcp -d <whitelist_ip> --dport 3000 -j ACCEPT

# ============================================================================
# BANDWIDTH LIMITING: Rate-Based Throttling
# ============================================================================

bandwidth_limiting:
  kubernetes_ingress_rate_limit: |
    K1 uses tc (traffic control) for per-tool bandwidth:

    # Create qdisc (traffic class)
    tc qdisc add dev eth0 root handle 1: htb default 10

    # Create class with rate limit (10 Mbps for tool PID 200)
    tc class add dev eth0 parent 1: classid 1:10 htb rate 10mbit

    # Filter traffic from tool PID 200 to this class
    tc filter add dev eth0 parent 1: protocol ip prio 16 \
      handle 1 fw classid 1:10

    # Mark packets from tool PID 200
    iptables -A OUTPUT --pid-owner 200 -j MARK --set-mark 1

  privacy_band_bandwidth: |
    Bandwidth limit per privacy band:

    GREEN band: 50 Mbps (trusted, high throughput)
    AMBER band: 20 Mbps (semi-trusted, moderate throughput)
    RED band: 5 Mbps (untrusted, restricted throughput)
    BLACK band: 0 Mbps (completely blocked)

  enforcement_mechanism: |
    How bandwidth is enforced:

    1. Tool tries to send 100 Mbps (e.g., large download)
    2. Packets marked with --pid-owner 200
    3. tc qdisc throttles to 10 Mbps (configured limit)
    4. Kernel queues excess packets
    5. If queue fills: Kernel drops packets (TCP timeout)
    6. Tool retransmits (or abandons transfer)
    7. Net effect: Tool limited to 10 Mbps average

# ============================================================================
# CONNECTION LIMITS: Preventing Connection Bombs
# ============================================================================

connection_limits:
  per_tool_limit: |
    Max concurrent connections per tool: 10

    Enforcement:
    - conntrack module tracks established connections
    - Kernel counts: connections with --pid-owner 200
    - If count >= 10: New connections rejected (EREJECTCONNECTION)

    iptables rule:
    iptables -A OUTPUT -p tcp --pid-owner 200 -m connlimit \
      --connlimit-above 10 -j REJECT

  per_host_limit: |
    Max concurrent connections to single host: 3

    Scenario: Prevent tool from opening 10 connections to one server
    Enforcement: Kernel counts per-destination connections

    iptables rule (using recent module):
    iptables -A OUTPUT -p tcp --pid-owner 200 -m recent \
      --set --name weather_connections
    iptables -A OUTPUT -p tcp --pid-owner 200 -m recent \
      --update --name weather_connections --hitcount 3 -j DROP

# ============================================================================
# TIMEOUT ENFORCEMENT: Connection Timeout
# ============================================================================

timeout_enforcement:
  tcp_timeout: |
    TCP idle timeout per privacy band:

    GREEN band: 30 seconds (trusted tools allowed longer connections)
    AMBER band: 20 seconds (moderate timeout)
    RED band: 10 seconds (aggressive, untrusted tools)

    Enforcement: iptables conntrack timeout setting
    iptables -A OUTPUT -p tcp --pid-owner 200 -m conntrack \
      --ctstate ESTABLISHED,RELATED -o eth0 \
      -m limit --limit 1/sec --limit-burst 1 -j ACCEPT

    After timeout: Connection dropped, tool must reconnect

  dns_timeout: |
    DNS query timeout (UDP): 5 seconds

    DNS queries go to DNS server (8.8.8.8:53)
    K1 times out if DNS server doesn't respond
    Result: Tool DNS resolution fails (controlled failure)

# ============================================================================
# SETUP OVERHEAD: Performance Impact
# ============================================================================

performance_overhead:
  rule_installation_latency: |
    Installing iptables rules takes <5ms per tool:

    Breakdown:
    - iptables add rule: ~0.1ms per rule
    - Average rules per tool: ~20-30 rules
    - Total installation: ~2-3ms
    - Applied in preexec_fn (before tool exec())

  packet_filtering_latency: |
    Per-packet filtering overhead: Negligible

    Latency per packet:
    - Check --pid-owner: ~50 nanoseconds (kernel cache hit)
    - Check port/protocol: ~50 nanoseconds
    - Total per packet: ~100 nanoseconds

    Impact on HTTP request (10 packets):
    - 10 packets × 100ns = 1 microsecond
    - Negligible compared to network latency (milliseconds)

  cleanup_latency: |
    Removing iptables rules takes <2ms per tool:

    When tool terminates:
    - Remove all rules for --pid-owner 200
    - Clean up tc bandwidth limits
    - Total cleanup: ~1-2ms
    - Prevents rule accumulation from past tools

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: All tools MUST have explicit network whitelist
    ENFORCEMENT: K1 rejects tools with empty or missing whitelist
    RATIONALE: Default deny + explicit allow prevents accidental access

  rule_2: |
    RULE: Sensitive ports (22,23,3306,5432,etc.) MUST be blocked globally
    ENFORCEMENT: K1 installs global drop rules for these ports
    RATIONALE: Defense-in-depth prevents lateral movement

  rule_3: |
    RULE: DNS rebinding attempts MUST be detected and blocked
    ENFORCEMENT: K1 validates DNS responses against cached results
    RATIONALE: Prevent DNS rebinding attack

  rule_4: |
    RULE: Bandwidth limits MUST be enforced per privacy band
    ENFORCEMENT: tc qdisc applies rate limiting at kernel level
    RATIONALE: Prevent bandwidth exhaustion of host network

  rule_5: |
    RULE: Connection limits MUST be enforced (10 per tool, 3 per host)
    ENFORCEMENT: iptables connlimit and recent modules
    RATIONALE: Prevent connection bomb DoS attack
