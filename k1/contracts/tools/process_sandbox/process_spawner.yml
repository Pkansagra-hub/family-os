# Process Spawner Contract
# Purpose: Define MCPProcessSpawner behavior for subprocess creation and initialization
# Source ADR: 0034b-mcp-process-lifecycle.md (lines 500-800)
# Version: 1.0
# Status: ACTIVE

component_name: "MCPProcessSpawner"
component_type: "Process Lifecycle"
version: "1.0"
description: "Spawns and initializes MCP tool processes with subprocess management, environment setup, and ready-state verification"

references:
  adr: ["0034b", "0034a"]
  contracts: ["lifecycle_fsm_5_states"]

spawner_class:
  name: "MCPProcessSpawner"
  responsibility: "Manage subprocess creation, initialization, and ready-state detection"

  methods:
    - method_name: "spawn()"
      parameters:
        - name: "tool_id"
          type: "str"
          description: "Tool identifier from tool registry"
        - name: "executable_path"
          type: "str"
          description: "Absolute path to executable or script"
        - name: "args"
          type: "List[str]"
          description: "Command-line arguments"
        - name: "env"
          type: "Dict[str, str]"
          description: "Environment variables (merged with parent)"
        - name: "timeout_seconds"
          type: "float"
          description: "Initialization timeout (default 5.0)"
      returns:
        type: "ProcessInfo"
        description: "ProcessInfo with SPAWNING state, pid, pipes"
      latency_sla_ms: 30
      description: |
        1. Start subprocess with stdin/stdout/stderr pipes
        2. Set SPAWNING state
        3. Record start_time
        4. Return ProcessInfo immediately

    - method_name: "wait_for_ready()"
      parameters:
        - name: "process_info"
          type: "ProcessInfo"
          description: "ProcessInfo object with SPAWNING state"
        - name: "timeout_seconds"
          type: "float"
          description: "Max wait time for ready signal"
      returns:
        type: "bool"
        description: "True if ready, False if timeout"
      latency_sla_ms: 50
      description: |
        1. Wait for 'ready' JSON-RPC message on stdout
        2. Or detect initialize() response
        3. Transition to RUNNING state
        4. Return True on success

    - method_name: "send_initialize()"
      parameters:
        - name: "process_info"
          type: "ProcessInfo"
          description: "ProcessInfo in SPAWNING state"
      returns:
        type: "bool"
        description: "True if initialize sent and response received"
      description: |
        Send {"jsonrpc":"2.0","method":"initialize","id":"UUID"} on stdin
        Wait for {"jsonrpc":"2.0","result":{...},"id":"UUID"} on stdout
        Parse supported tools from result.tools
        Transition to RUNNING state

subprocess_creation:
  method: "asyncio.create_subprocess_exec()"
  pipes: ["PIPE", "PIPE", "PIPE"]  # stdin, stdout, stderr
  cwd: "auto-detect"
  environment_handling:
    - preserve_parent_env: true
    - required_vars: ["PATH", "HOME", "USER"]
    - allow_override: true

execution_environment:
  stdin_mode: "newline-delimited JSON"
  stdout_mode: "newline-delimited JSON"
  stderr_mode: "optional logging"
  shell: false
  preexec_fn: null

initialization_sequence:
  step1_spawn:
    action: "subprocess.Popen() or asyncio.create_subprocess_exec()"
    target_latency_ms: 30
    state: "SPAWNING"

  step2_ready_detection:
    action: "wait_for_ready() or send_initialize()"
    target_latency_ms: 50
    timeout_seconds: 5
    state_transition: "SPAWNING → RUNNING"

  step3_initialization:
    action: "send tools/list and verify tool capabilities"
    timeout_seconds: 5
    verify: "tool_registry matches supported tools"

error_handling:
  spawn_failure:
    condition: "Popen() raises exception"
    action: "transition to CRASHED, log exception"
    state: "CRASHED"

  init_timeout:
    condition: "wait_for_ready() exceeds timeout"
    action: "send SIGTERM, transition to TERMINATING"
    state: "TERMINATING"

  invalid_response:
    condition: "initialize() response missing required fields"
    action: "log error, send SIGTERM"
    state: "TERMINATING"

performance_slas:
  spawn_latency_p95_ms: 30
  ready_detection_p95_ms: 50
  total_initialization_p95_s: 5
  metrics_name: "process_spawn_duration_ms"

implementation_notes:
  - "Use asyncio for non-blocking subprocess management"
  - "Close unused pipe ends immediately after Popen()"
  - "Handle ENOENT if executable not found"
  - "Set reasonable buffer limits on pipes to prevent hangs"
  - "Implement ready signal timeout to prevent indefinite hangs"
  - "Log all subprocess creation with trace_id"

testing_requirements:
  - test_spawn_success: "Spawn process, verify PID, verify SPAWNING state"
  - test_spawn_timeout: "Exceed init timeout, verify transition to TERMINATING"
  - test_init_success: "Send initialize(), verify RUNNING state"
  - test_pipe_closure: "Verify pipes are properly closed on failure"
  - test_env_override: "Pass custom env vars, verify subprocess receives them"
  - test_missing_executable: "Attempt to spawn non-existent executable, verify CRASHED"

compliance:
  adr_0034b_sections: ["ProcessState FSM", "MCPProcessSpawner class", "spawn/wait_for_ready methods"]
  adr_0034a_sections: ["initialize() request format", "JSON-RPC response parsing"]

changelog:
  "1.0": "Initial contract - MCPProcessSpawner class definition"
