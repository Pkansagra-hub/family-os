# Process Monitor Task Contract
# Purpose: Define background monitoring task for continuous process health checks
# Source ADR: 0034b-mcp-process-lifecycle.md (lines 1751-1850)
# Version: 1.0
# Status: ACTIVE

component_name: "ProcessMonitorTask"
component_type: "Process Lifecycle"
version: "1.0"
description: "Background asyncio task that continuously monitors process health, detects crashes, and handles state transitions"

references:
  adr: ["0034b"]
  contracts: ["lifecycle_fsm_5_states", "crash_detection", "resource_cleanup"]

monitor_task_overview:
  purpose: "Continuously monitor process for health, crashes, and state changes"
  execution_model: "Long-lived asyncio Task"
  lifetime: "Created at RUNNING state, runs until TERMINATED/CRASHED"
  cancellation: "Allowed after process terminates"

monitor_task_lifecycle:
  creation:
    trigger: "Process enters RUNNING state"
    timing: "After wait_for_ready() succeeds"
    code: "asyncio.create_task(monitor_process(process_info))"

  execution:
    polling_interval_ms: 100
    action: "Check process.poll() every 100ms"
    loop_type: "while process.poll() is None:"

  termination:
    trigger: "process.poll() returns non-None"
    action: "Detect exit, analyze, transition state"
    cleanup: "Task naturally exits loop"

polling_loop_pseudocode:
  code: |
    async def monitor_process(process_info):
      while process_info.state in [RUNNING, TERMINATING]:
        exit_code = process_info.process.poll()

        if exit_code is None:
          # Process still running
          await asyncio.sleep(0.1)  # Poll every 100ms
          continue

        # Process exited
        process_info.exit_code = exit_code

        # Analyze exit code
        cause = analyze_exit_code(exit_code)

        if is_normal_exit(exit_code):
          transition_to_TERMINATED(process_info)
        else:
          transition_to_CRASHED(process_info)

        break  # Task exits

monitoring_frequency:
  polling_interval_ms: 100
  rationale: "Balance between responsiveness and CPU usage"
  latency_sla_ms: 10
  note: "Crash detected within 10ms of actual exit (100ms + processing)"

state_monitoring:
  RUNNING_state:
    monitoring: "Active"
    action: "Poll process.poll() every 100ms"

  TERMINATING_state:
    monitoring: "Active"
    action: "Poll process.poll(), wait for exit"
    max_wait_seconds: 13

  SPAWNING_state:
    monitoring: "Not applicable (separate wait_for_ready task)"

  TERMINATED_state:
    monitoring: "None (process exited cleanly)"
    task_exit: "Task exits naturally"

  CRASHED_state:
    monitoring: "None (crash detected and classified)"
    task_exit: "Task exits naturally"

crash_detection_in_monitor:
  trigger: "process.poll() returns exit_code"
  analysis: "Call analyze_exit_code(exit_code)"

  classification:
    exit_code_0: "TERMINATED"
    exit_code_1_127: "CRASHED"
    exit_code_128_plus_sigterm: "TERMINATED"
    exit_code_128_plus_sigkill: "CRASHED"
    exit_code_128_plus_other: "CRASHED"

  action: "Emit metrics, log crash, transition state"

metrics_collection:
  during_monitoring:
    - name: "uptime_seconds"
      measurement: "time.time() - process_info.started_at"
      type: "Gauge"

    - name: "polling_latency_ms"
      measurement: "time.time() - last_poll_time"
      type: "Histogram"

    - name: "total_requests_handled"
      measurement: "Count of successful tool calls"
      type: "Counter"

    - name: "total_timeouts"
      measurement: "Count of timeout errors"
      type: "Counter"

  on_crash:
    - name: "crash_detected_latency_ms"
      measurement: "Time from exit to detection"

    - name: "process_uptime_seconds"
      measurement: "Time from spawn to crash"

error_handling_in_monitor:
  process_already_exited:
    condition: "process.poll() returns None first, then process reaped externally"
    action: "Detect None → non-None transition, handle normally"

  monitor_task_cancelled:
    condition: "task.cancel() called"
    exception: "asyncio.CancelledError"
    action: "Suppress, exit gracefully"

  unexpected_exception:
    condition: "Exception in monitor loop"
    action: "Log exception, re-raise, let parent handle"

integration_with_lifecycle_fsm:
  created: "At RUNNING state entry"
  monitors: "RUNNING → TERMINATING → TERMINATED/CRASHED"
  state_updates: "Call process_info.transition_to(NEW_STATE)"
  cleanup_trigger: "On TERMINATED or CRASHED, cleanup() called"

background_task_management:
  creation:
    code: "task = asyncio.create_task(monitor_process(process_info))"
    storage: "process_info.monitor_task = task"

  tracking:
    all_tasks: "Keep set of all active monitor tasks"
    per_tool: "One task per spawned process"

  cancellation:
    trigger: "When tool removed or session ends"
    method: "task.cancel()"
    verify: "task.done() == True or task.cancelled() == True"

performance_slas:
  monitor_cpu_usage: "<1% per task"
  monitor_memory_usage: "<1MB per task"
  polling_latency_p95_ms: 10
  task_creation_latency_ms: 5

configuration:
  polling_interval_ms: 100
  configurable: true
  recommendation: "Keep at 100ms for good balance"

  edge_cases:
    very_short_processes: "May exit before next poll (detection in next 100ms)"
    long_lived_processes: "100ms polling is responsive enough"

logging:
  log_on_monitoring_events:
    - process_started (uptime 0s)
    - process_healthy (every 10s with uptime)
    - process_exited (with exit_code, uptime, total_requests)
    - process_crashed (with cause, uptime, total_timeouts)

  log_fields:
    - tool_id
    - process_id
    - state_transition
    - exit_code (if exited)
    - uptime_seconds
    - total_requests
    - total_timeouts
    - trace_id

implementation_notes:
  - "Use asyncio.create_task() to spawn monitor as background task"
  - "Store task reference in process_info for later cancellation"
  - "100ms polling interval balances responsiveness vs CPU"
  - "Monitor task exits naturally (no explicit cancellation needed)"
  - "Process.wait() alternative: use async streams for notifications"
  - "Log all major events (start, exit, crash) with trace_id"
  - "Emit Prometheus metrics for uptime, requests, timeouts"

testing_requirements:
  - test_monitor_spawning: "Verify task created when entering RUNNING"
  - test_monitor_detects_clean_exit: "Process exits (0), detected and TERMINATED"
  - test_monitor_detects_crash: "Process crashes, detected and CRASHED"
  - test_monitor_latency: "Crash detected <10ms after exit (in practice ~100ms)"
  - test_monitor_metrics: "Verify metrics emitted on exit"
  - test_monitor_cancellation: "Cancel task, verify no errors"

compliance:
  adr_0034b_sections: ["Background monitoring task", "process.wait() implementation", "State transition triggering"]

changelog:
  "1.0": "Initial contract - Background process monitoring task"
