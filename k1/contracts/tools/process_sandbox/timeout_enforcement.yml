# Timeout Enforcement Contract
# Purpose: Define per-tool timeout configuration and enforcement mechanism
# Source ADR: 0034b-mcp-process-lifecycle.md (lines 1201-1400)
# Version: 1.0
# Status: ACTIVE

component_name: "TimeoutEnforcer"
component_type: "Process Lifecycle"
version: "1.0"
description: "Enforces per-tool request timeouts using asyncio.wait_for() with deterministic timeout selection and SIGTERM escalation"

references:
  adr: ["0034b", "0034a"]
  contracts: ["lifecycle_fsm_5_states", "process_spawner"]

timeout_enforcer_class:
  name: "TimeoutEnforcer"
  responsibility: "Wrap tool requests with timeout enforcement, handle timeout exceptions"

  methods:
    - method_name: "execute_with_timeout()"
      parameters:
        - name: "coro"
          type: "Coroutine"
          description: "Async coroutine (tool execution)"
        - name: "tool_id"
          type: "str"
          description: "Tool identifier (for timeout lookup)"
        - name: "timeout_config"
          type: "TimeoutConfig"
          description: "Per-tool timeout settings"
      returns:
        type: "Any"
        description: "Result from tool or raises asyncio.TimeoutError"
      description: |
        1. Lookup tool timeout (or use default 30s)
        2. Wrap coro with asyncio.wait_for(coro, timeout_seconds)
        3. On timeout, raise asyncio.TimeoutError
        4. Caller transitions process to TERMINATING state

tool_timeout_configuration:
  default_timeout_seconds: 30

  tool_specific_timeouts:
    - tool_id: "calculator"
      category: "computational"
      timeout_seconds: 5
      rationale: "Math operations should complete quickly"

    - tool_id: "weather_api"
      category: "network"
      timeout_seconds: 10
      rationale: "Network calls need reasonable time"

    - tool_id: "video_transcoder"
      category: "media_processing"
      timeout_seconds: 300
      rationale: "Media processing is inherently slow"

    - tool_id: "database_query"
      category: "io_intensive"
      timeout_seconds: 60
      rationale: "Complex queries may require time"

  timeout_categories:
    - category: "computational"
      default_seconds: 5

    - category: "network"
      default_seconds: 10

    - category: "io_intensive"
      default_seconds: 60

    - category: "media_processing"
      default_seconds: 300

timeout_lookup_algorithm:
  step1_check_tool_specific: "tool_id in tool_specific_timeouts"
  step2_check_category: "tool_category in timeout_categories"
  step3_use_default: "default_timeout_seconds = 30"

enforcement_mechanism:
  using_asyncio:
    - method: "asyncio.wait_for(coro, timeout_seconds)"
    - raises: "asyncio.TimeoutError after timeout_seconds"
    - no_cleanup: "Parent must handle cleanup (e.g., SIGTERM)"

  exception_handling:
    - exception_type: "asyncio.TimeoutError"
      trigger: "Tool request exceeds timeout_seconds"
      action: "Propagate to ToolExecutor"
      next_action: "ToolExecutor transitions to TERMINATING state"

    - exception_type: "asyncio.CancelledError"
      trigger: "Task cancelled due to timeout or explicit cancel"
      action: "Propagate as TimeoutError"

timeout_state_transitions:
  before_timeout: "Process in RUNNING state"
  timeout_detected: "asyncio.TimeoutError raised"
  transition: "RUNNING → TERMINATING (by ToolExecutor)"
  action: "Send SIGTERM to process, start shutdown sequence"

performance_slas:
  timeout_detection_latency_ms: 1
  timeout_overhead_ms: "<1"
  description: "Timeout enforcement should be transparent to latency budget"

configuration_schema:
  TimeoutConfig:
    type: "dataclass"
    fields:
      - name: "default_timeout_seconds"
        type: "float"
        default: 30

      - name: "tool_timeouts"
        type: "Dict[str, float]"
        description: "tool_id → timeout in seconds"

      - name: "category_timeouts"
        type: "Dict[str, float]"
        description: "category → timeout in seconds"

integration_with_lifecycle:
  RUNNING_state_timeout_applicable: true
  SPAWNING_state_timeout_applicable: false
  TERMINATING_state_timeout_applicable: false
  TERMINATED_state_timeout_applicable: false
  CRASHED_state_timeout_applicable: false

error_handling:
  timeout_exceeded:
    condition: "asyncio.wait_for() timeout fired"
    action: "Raise asyncio.TimeoutError"
    responsibility: "ToolExecutor catches and initiates TERMINATING"

  invalid_timeout_config:
    condition: "tool_id not found, category not found"
    action: "Use default_timeout_seconds"

implementation_notes:
  - "Use asyncio.wait_for() for timeout enforcement"
  - "Timeout is per-request, not per-tool (short-lived)"
  - "Tool-specific timeouts override category defaults"
  - "Default timeout is 30 seconds (configurable)"
  - "Timeout does NOT automatically clean up the subprocess"
  - "Process cleanup (SIGTERM/SIGKILL) is ToolExecutor responsibility"
  - "Log timeout events with tool_id, timeout_seconds, trace_id"

testing_requirements:
  - test_timeout_lookup: "Verify correct timeout selected for each tool"
  - test_timeout_enforcement: "Verify asyncio.wait_for() raises TimeoutError"
  - test_default_timeout: "Verify default 30s used for unknown tools"
  - test_category_override: "Verify category timeout overrides default"
  - test_tool_specific_override: "Verify tool-specific overrides category"
  - test_timeout_latency: "Verify timeout overhead <1ms"

compliance:
  adr_0034b_sections: ["TimeoutEnforcer class", "per-tool timeout configuration", "asyncio.wait_for() implementation"]

changelog:
  "1.0": "Initial contract - TimeoutEnforcer with per-tool configuration"
