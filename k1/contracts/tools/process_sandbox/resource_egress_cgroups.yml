# Process Sandbox: Resource Egress via cgroups v2
# Purpose: CPU, memory, I/O quotas per-tool enforcement
# Research: cgroups v2, resource limits, fairness scheduling
# Part of ADR-0033c (Process Sandbox Implementation) & ADR-0032 (Egress Layer 3)

---
contract_id: "TOOL_EXEC_PROCESS_RESOURCE_EGRESS_CGROUPS"
contract_type: "resource_management"
applies_to: ["k1.orchestrator.tool_runner", "k1.process_sandbox"]

# ============================================================================
# RESOURCE EGRESS PRINCIPLE: cgroups v2 Quotas
# ============================================================================

principle: |
  Per-tool resource quotas enforced by Linux cgroups (control groups).

  Resources limited:
  - CPU: Process gets maximum X% of CPU time
  - Memory: Process gets maximum Y MB of RAM
  - I/O: Process gets maximum Z MB/sec disk I/O
  - Processes: Process can create at most N child processes

  Enforcement:
  - Kernel enforces at scheduling level (CPU)
  - Kernel enforces at memory allocation level (memory)
  - Kernel enforces at I/O submission level (I/O)
  - Kernel enforces at fork/clone level (processes)

  Result: No resource exhaustion attacks possible

# ============================================================================
# CPU QUOTA: Fair-Share CPU Scheduling
# ============================================================================

cpu_resource:
  cpu_quota_model: |
    Each tool gets CPU quota (% of available CPU):

    System has 4 cores (400% total)
    K1 total quota: 400% (4 cores)

    Per-tool allocation:
    - Tool A: 100% (1 core) - can use full 1 core
    - Tool B: 100% (1 core) - can use full 1 core
    - Tool C: 100% (1 core) - can use full 1 core
    - K1 overhead: 100% (1 core)
    - Total: 400% (all cores allocated)

    Overcommit possible (schedule more than physical cores):
    - Tool A: 100% quota
    - Tool B: 100% quota
    - Tool C: 100% quota
    - Kernel: Fair-share scheduling (each gets 33% when all running)

  cpu_quota_enforcement: |
    cgroup CPU quotas (cgroups v2):

    # Set CPU quota for tool PID 200
    # Quota: 100,000 microseconds per 100,000 microseconds = 1 core
    echo "100000" > /sys/fs/cgroup/k1-tool-200/cpu.max

    How it works:
    1. Kernel measures: How much CPU did tool 200 use?
    2. If used 100,000 microseconds: Quota exhausted
    3. Tool throttled (not scheduled) until next period
    4. After 100,000 microseconds: Quota reset
    5. Tool can run again

  privacy_band_cpu_limits: |
    CPU allocation per privacy band:

    GREEN band:     1.0 core (100% of 1 core)
    AMBER band:     0.5 core (50% of 1 core)
    RED band:       0.25 core (25% of 1 core)
    BLACK band:     0.0 core (0%, frozen)

  cpu_fairness: |
    When multiple tools running (overcommit):

    Scenario: 2 tools, 1 core available, both want full core
    - Tool A CPU quota: 100% of 1 core
    - Tool B CPU quota: 100% of 1 core
    - Kernel schedules: Fair-share (50% to each)

    Result: Both get 50% of 1 core (but can burst to 100% if other idle)
    Fairness: No starvation, proportional to quota

# ============================================================================
# MEMORY QUOTA: Out-of-Memory Handling
# ============================================================================

memory_resource:
  memory_quota_model: |
    Each tool gets memory quota (maximum RAM):

    System has 8GB RAM
    K1 system reservation: 2GB (kernel, K1 processes)
    Available to tools: 6GB

    Per-tool allocation:
    - Tool A: 512MB (worst-case allocation)
    - Tool B: 512MB
    - Tool C: 512MB
    - Unused: 4.5GB (can be allocated to other tools later)

    Note: Allocated quotas can overlap (not all running simultaneously)

  memory_quota_enforcement: |
    cgroup memory limits (cgroups v2):

    # Set memory limit for tool PID 200: 512MB
    echo "536870912" > /sys/fs/cgroup/k1-tool-200/memory.max

    How it works:
    1. Tool allocates memory (malloc, new, Vec::push, etc.)
    2. Kernel checks: Does this exceed limit (536MB)?
    3. If NO: Memory allocated (added to tool's count)
    4. If YES: Out-of-memory event triggered
    5. Kernel: Either deny allocation or OOM-kill process

  out_of_memory_kill: |
    When tool exceeds memory quota:

    Scenario: Tool allocates 512MB, then tries to allocate 10MB more

    1. Kernel detects: Would exceed 512MB limit
    2. Options:
       a) Deny allocation (malloc returns NULL) - tool must handle
       b) OOM-kill process (kernel kills tool)

    K1 configuration: USE OOM-KILL
    - Reason: Tool crash is visible (process killed)
    - Reason: K1 can catch and log violation

    Result: Tool receives SIGKILL (cannot catch, must die)
    K1 logs: Tool terminated due to memory limit

  privacy_band_memory_limits: |
    Memory quota per privacy band:

    GREEN band:     512MB (trusted tools allowed more memory)
    AMBER band:     256MB (moderate limit)
    RED band:       128MB (strict limit for untrusted)
    BLACK band:      0MB (none, no process allocation)

  memory_swappiness: |
    How memory pressure affects paging:

    Swappiness setting:
    - 0: Avoid swap, use page cache
    - 100: Aggressive swapping

    K1 setting: 10 (low swappiness)
    - Reason: Tool memory should stay in RAM
    - Reason: Avoid slow disk paging degrading performance

    Result: Out-of-memory kill happens before extreme swapping

# ============================================================================
# I/O QUOTA: Disk Rate Limiting
# ============================================================================

io_resource:
  io_quota_model: |
    Each tool gets I/O quotas:

    Disk read rate: 100MB/sec per tool (GREEN band)
    Disk write rate: 50MB/sec per tool (GREEN band)
    I/O operations: 1000 IOPS per tool (GREEN band)

    Enforcement: Kernel throttles if exceeded
    - Tool wants to read 200MB/sec: Kernel throttles to 100MB/sec
    - Excess requests queued (tool delays waiting for I/O)

  io_quota_enforcement: |
    cgroup I/O limits (cgroups v2 blkio):

    # Set I/O limits for tool PID 200
    # Format: major:minor rbps=X wbps=Y
    # (rbps = read bytes per second, wbps = write bytes per second)

    echo "259:0 rbps=104857600" > /sys/fs/cgroup/k1-tool-200/io.max
    (104857600 bytes/sec = 100MB/sec)

    echo "259:0 wbps=52428800" > /sys/fs/cgroup/k1-tool-200/io.max
    (52428800 bytes/sec = 50MB/sec)

  privacy_band_io_limits: |
    I/O quotas per privacy band:

    GREEN band (trusted):
      Read:  100MB/sec
      Write: 50MB/sec
      IOPS:  1000/sec

    AMBER band (semi-trusted):
      Read:  50MB/sec
      Write: 25MB/sec
      IOPS:  500/sec

    RED band (untrusted):
      Read:  10MB/sec
      Write: 5MB/sec
      IOPS:  100/sec

  io_throttling_mechanism: |
    How I/O limiting works:

    Scenario: Tool tries to read 200MB file in 1 second

    1. Tool calls: read(fd, buffer, 200MB)
    2. Kernel checks: I/O quota for this tool
    3. First 100MB submitted to disk controller
    4. Remaining 100MB queued (delayed)
    5. Tool blocks (read syscall returns partial data)
    6. Tool loop: keeps calling read()
    7. As time passes: More I/O quota becomes available
    8. Remaining 100MB submitted gradually
    9. Total time: ~2 seconds (half the original speed)

    Result: Tool limited to 100MB/sec average

# ============================================================================
# PROCESS LIMITS: Preventing Fork Bombs
# ============================================================================

process_limits:
  process_quota_model: |
    Each tool can create limited processes:

    K1 configuration: Max 5 processes per tool (tool + 4 children)

    Why not allow many?
    - Each process has 20MB memory overhead
    - 100 processes = 2GB memory overhead
    - Prevent fork bomb (infinite process spawning)

  process_limit_enforcement: |
    cgroup PID limits:

    # Set max processes for tool PID 200: 5
    echo "5" > /sys/fs/cgroup/k1-tool-200/pids.max

    How it works:
    1. Tool has 1 main process (tool.py running)
    2. Tool calls: os.fork() → child process created (now 2)
    3. Tool calls: os.fork() again → child process created (now 3)
    4. Tool calls: os.fork() again → child process created (now 4)
    5. Tool calls: os.fork() again → child process created (now 5)
    6. Tool calls: os.fork() again → FORK DENIED (EAGAIN error)
    7. Tool's fork() call fails with "Resource temporarily unavailable"

  fork_bomb_prevention: |
    Attack: Tool spawns infinite processes

    def fork_bomb():
        while True:
            os.fork()

    Result with cgroup limits:
    1. First 5 calls succeed (tool + 4 children)
    2. 6th call fails (EAGAIN)
    3. Tool crash or error handling

    Prevention: Fork bomb limited to 5 processes (not infinite)

# ============================================================================
# CONFIGURATION: Per-Tool Resource Policy
# ============================================================================

configuration:
  tool_resource_specification: |
    YAML per-tool resource limits:

    weather_tool:
      resources:
        cpu_quota_cores: 1.0
        memory_limit_mb: 512
        io_read_limit_mbps: 100
        io_write_limit_mbps: 50
        max_processes: 5
        max_threads: 10
        max_open_files: 256
        max_connections: 10

  privacy_band_resource_specification: |
    Resource limits override per privacy band:

    GREEN band tools:
      cpu_quota_cores: 1.0
      memory_limit_mb: 512
      io_read_limit_mbps: 100
      io_write_limit_mbps: 50
      max_processes: 5

    AMBER band tools:
      cpu_quota_cores: 0.5
      memory_limit_mb: 256
      io_read_limit_mbps: 50
      io_write_limit_mbps: 25
      max_processes: 3

    RED band tools:
      cpu_quota_cores: 0.25
      memory_limit_mb: 128
      io_read_limit_mbps: 10
      io_write_limit_mbps: 5
      max_processes: 2

# ============================================================================
# SETUP AND CLEANUP: Cgroup Lifecycle
# ============================================================================

cgroup_lifecycle:
  cgroup_creation: |
    Create cgroup before tool execution:

    # Create cgroup for tool 200
    mkdir -p /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope

    # Populate with resource limits
    echo "1" > /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/cpu.max
    echo "536870912" > /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/memory.max

    # Move process into cgroup
    echo "200" > /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/cgroup.procs

  process_assignment: |
    Assign tool process to cgroup:

    # After subprocess.Popen() spawns process with PID 200
    # Kernel automatically moves into cgroup if properly configured
    # Or manually assign:
    echo "200" > /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/cgroup.procs

  cgroup_deletion: |
    Clean up after tool terminates:

    # After tool process exits
    # Move process out of cgroup (or just remove cgroup)
    rmdir /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope

    # Kernel deallocates reserved quota
    # Other tools can use freed resources

  setup_latency: |
    Cgroup creation overhead:
    - Create directory: 0.1-0.5ms
    - Write CPU limits: 0.1-0.2ms
    - Write memory limits: 0.1-0.2ms
    - Write I/O limits: 0.2-0.5ms
    - Total: <2ms per tool

# ============================================================================
# MONITORING: Resource Usage Tracking
# ============================================================================

monitoring:
  query_resource_usage: |
    Query tool resource usage (for observability/audit):

    # CPU usage
    cat /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/cpu.stat
    Output: usage_usec 150000  (150ms CPU time used)

    # Memory usage
    cat /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/memory.current
    Output: 87654321  (83.6MB currently allocated)

    # Memory peak
    cat /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/memory.peak
    Output: 120000000  (120MB peak usage)

    # I/O statistics
    cat /sys/fs/cgroup/k1-tool.slice/k1-tool-200.scope/io.stat
    Output: 259:0 rbytes=10485760 wbytes=5242880  (10MB read, 5MB written)

  metrics_for_audit: |
    Resource usage metrics for ToolReceipt:

    {
      "tool_id": "weather_tool",
      "resource_usage": {
        "cpu_time_ms": 245,
        "cpu_peak_percent": 95,
        "memory_current_mb": 87,
        "memory_peak_mb": 120,
        "io_read_bytes": 10485760,
        "io_write_bytes": 5242880,
        "io_read_rate_mbps": 42,
        "io_write_rate_mbps": 21
      }
    }

# ============================================================================
# PERFORMANCE IMPACT: Overhead of cgroups
# ============================================================================

performance:
  setup_overhead: |
    cgroup creation overhead: <2ms per tool

    Applied in preexec_fn:
    - Should not add noticeable latency
    - Total tool spawn overhead: 20-35ms (already includes exec overhead)

  runtime_overhead_minimal: |
    Per-operation runtime overhead: Negligible

    CPU quota checking: ~50 nanoseconds per syscall (negligible)
    Memory quota checking: ~100 nanoseconds per allocation (negligible)
    I/O quota checking: ~500 nanoseconds per I/O submission (negligible)

    Total: Effectively zero impact on well-behaved tools

  throttling_latency: |
    When tool exceeds quota:

    Normal execution: No impact
    CPU quota exceeded: Tool throttled (delayed scheduling)
    - Impact: Tool runs slower, but gradually

    Memory quota exceeded: Out-of-memory kill
    - Impact: Tool immediately killed (SIGKILL)
    - K1 detects: Process exit, logs to audit receipt

    I/O quota exceeded: I/O requests throttled
    - Impact: Disk I/O delayed, tool waits
    - Graceful degradation: Tool continues but slower

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: Each tool MUST have CPU quota enforced via cgroups
    ENFORCEMENT: K1 sets cpu.max in cgroup before tool exec()
    RATIONALE: Prevent CPU exhaustion attacks

  rule_2: |
    RULE: Each tool MUST have memory quota enforced via cgroups
    ENFORCEMENT: K1 sets memory.max in cgroup before tool exec()
    RATIONALE: Prevent memory exhaustion attacks (OOM-kill enforced)

  rule_3: |
    RULE: Each tool MUST have I/O quota enforced via cgroups
    ENFORCEMENT: K1 sets io.max in cgroup before tool exec()
    RATIONALE: Prevent I/O exhaustion attacks (disk saturation)

  rule_4: |
    RULE: Tool process limit MUST be enforced (max 5 processes)
    ENFORCEMENT: K1 sets pids.max in cgroup before tool exec()
    RATIONALE: Prevent fork bomb DoS attack

  rule_5: |
    RULE: Resource limits MUST match privacy band classification
    ENFORCEMENT: K1 queries tool privacy band, applies corresponding limits
    RATIONALE: Untrusted tools get stricter limits (RED < AMBER < GREEN)
