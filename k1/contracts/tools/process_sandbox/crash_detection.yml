# Crash Detection Contract
# Purpose: Detect and classify process crashes using exit codes and signal monitoring
# Source ADR: 0034b-mcp-process-lifecycle.md (lines 1601-1700)
# Version: 1.0
# Status: ACTIVE

component_name: "CrashDetection"
component_type: "Process Lifecycle"
version: "1.0"
description: "Monitors process health, detects crashes via exit codes and signals, transitions to CRASHED state with root cause analysis"

references:
  adr: ["0034b", "0034a"]
  contracts: ["lifecycle_fsm_5_states", "process_spawner"]

crash_detection_mechanism:
  monitoring_method: "process.wait() or process.poll()"
  detection_latency_sla_ms: 10
  monitoring_task: "Background async task continuously polling process state"

exit_code_classification:
  clean_exit:
    code: 0
    cause: "Normal, graceful termination"
    classification: "TERMINATED (not CRASHED)"
    action: "Transition to TERMINATED, no error"

  generic_error:
    code: 1
    cause: "Unspecified error in tool"
    classification: "CRASHED"
    action: "Log as crash, investigate tool logs"

  crash_signal:
    code_range: "128-255"
    formula: "128 + signal_number"
    cause: "Process killed by signal"
    examples:
      - code: 143
        signal: "SIGTERM (15)"
        cause: "Graceful termination received"
        classification: "TERMINATED"

      - code: 137
        signal: "SIGKILL (9)"
        cause: "Forced termination"
        classification: "CRASHED"

      - code: 139
        signal: "SIGSEGV (11)"
        cause: "Segmentation fault"
        classification: "CRASHED"

      - code: 134
        signal: "SIGABRT (6)"
        cause: "Abnormal termination"
        classification: "CRASHED"

      - code: 136
        signal: "SIGFPE (8)"
        cause: "Floating point exception"
        classification: "CRASHED"

signal_handling:
  SIGTERM: "15 - Graceful termination (expected)"
  SIGKILL: "9 - Forced kill (crash)"
  SIGSEGV: "11 - Segmentation fault (crash)"
  SIGABRT: "6 - Abnormal termination (crash)"
  SIGFPE: "8 - Floating point exception (crash)"
  SIGPIPE: "13 - Broken pipe (crash)"

process_monitoring_task:
  name: "process_monitor_background_task"
  run_as: "Separate asyncio task"
  frequency: "Poll every 100ms or use process.wait()"
  action: |
    while process.poll() is None:
      await asyncio.sleep(0.1)

    # Process exited
    exit_code = process.returncode
    if exit_code == 0:
      transition to TERMINATED
    elif signal_caused_exit(exit_code):
      classify_signal(exit_code)
      if is_abnormal_signal(exit_code):
        transition to CRASHED
      else:
        transition to TERMINATED
    else:
      transition to CRASHED

crash_classification_logic:
  step1_check_exit_code:
    condition: "process.poll() returns non-None"
    action: "Retrieve process.returncode"

  step2_classify:
    if_exit_code_0: "Clean exit → TERMINATED"
    if_exit_code_1: "Generic error → CRASHED"
    if_exit_code_128_plus: |
      Signal received → check signal_type
      - SIGTERM (143): Graceful shutdown → TERMINATED
      - SIGKILL (137): Forced kill → CRASHED
      - SIGSEGV (139): Segfault → CRASHED
      - SIGABRT (134): Abnormal abort → CRASHED
      - Other: Unknown signal → CRASHED

root_cause_analysis:
  information_gathered:
    - exit_code: "process.returncode"
    - signal: "exit_code - 128 (if signal-based)"
    - duration: "process_end_time - process_start_time"
    - total_requests: "requests handled before crash"
    - total_timeouts: "timeouts before crash"

  analysis_output:
    - crash_type: "signal | normal_exit | unknown"
    - cause: "human-readable description"
    - severity: "LOW | MEDIUM | HIGH | CRITICAL"
    - recommended_action: "retry | manual_investigation | disable_tool"

severity_classification:
  LOW:
    examples: ["Exit code 1 after 100+ requests", "SIGTERM after normal run"]
    action: "Log and retry"

  MEDIUM:
    examples: ["SIGSEGV", "SIGABRT", "repeated crashes"]
    action: "Log, investigate, consider disabling"

  HIGH:
    examples: ["Crash within 1 second of startup", "SIGFPE"]
    action: "Alert, disable tool, manual review"

  CRITICAL:
    examples: ["Repeated crashes (>5 in 1 hour)", "SIGKILL suspected memory issue"]
    action: "Immediate alert, disable tool, incident response"

state_transitions:
  RUNNING_to_CRASHED:
    trigger: "process.poll() detects abnormal exit"
    action: "Transition to CRASHED, analyze, log"

  RUNNING_to_TERMINATED:
    trigger: "process.poll() detects clean exit (code 0) or SIGTERM"
    action: "Transition to TERMINATED, cleanup"

  SPAWNING_to_CRASHED:
    trigger: "Process exits before reaching RUNNING"
    action: "Transition to CRASHED, investigate init failure"

performance_slas:
  crash_detection_latency_p95_ms: 10
  description: "Crash detected within 10ms of process exit"

metrics_emission:
  prometheus_metrics:
    - name: "process_crashes_total"
      type: "Counter"
      labels: ["tool_id", "exit_code", "signal", "severity"]

    - name: "process_uptime_seconds"
      type: "Histogram"
      labels: ["tool_id", "exit_code"]

    - name: "crash_severity"
      type: "Gauge"
      labels: ["tool_id", "severity"]

logging:
  log_every_crash_with:
    - tool_id
    - process_id
    - exit_code
    - signal_number
    - uptime_seconds
    - total_requests
    - total_timeouts
    - root_cause
    - severity
    - trace_id
    - timestamp

error_handling:
  process_already_exited:
    condition: "process.poll() called after exit"
    action: "Retrieve cached exit code from process.returncode"

  unknown_exit_code:
    condition: "Exit code not recognized"
    action: "Classify as CRASHED, log as unknown cause"

integration_with_lifecycle:
  processes_monitored_states:
    - SPAWNING: "Detect init failures"
    - RUNNING: "Detect crashes"
    - TERMINATING: "Detect forced kill or errors during shutdown"

  not_monitored_states:
    - TERMINATED: "Already exited normally"
    - CRASHED: "Already detected and classified"

implementation_notes:
  - "Use asyncio.create_task() to spawn background monitor task"
  - "Monitor task runs for lifetime of process"
  - "Call process.wait() to block until process exits (or poll() in loop)"
  - "Catch OSError if process.wait() fails"
  - "Cache exit code in ProcessInfo for later analysis"
  - "Emit Prometheus metrics for each crash"
  - "Include trace_id in all crash logs for debugging"

testing_requirements:
  - test_clean_exit: "Process exits with code 0, verify TERMINATED"
  - test_error_exit: "Process exits with code 1, verify CRASHED"
  - test_sigterm_classification: "SIGTERM exit (143), verify TERMINATED"
  - test_sigkill_classification: "SIGKILL exit (137), verify CRASHED"
  - test_sigsegv_classification: "SIGSEGV exit (139), verify CRASHED"
  - test_detection_latency: "Verify crash detected <10ms after exit"
  - test_root_cause_analysis: "Verify correct cause classification"

compliance:
  adr_0034b_sections: ["Crash detection", "Exit code monitoring", "Signal handling", "Root cause analysis"]

changelog:
  "1.0": "Initial contract - Crash detection with exit code and signal classification"
