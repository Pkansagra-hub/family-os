# Process Sandbox: ADR-0032 Egress Control Integration
# Purpose: Overview of how 4-layer egress control works in process sandbox
# Reference: ADR-0032 (Egress Control Architecture)
# Part of ADR-0033c (Process Sandbox Implementation)

---
contract_id: "TOOL_EXEC_PROCESS_ADR0032_EGRESS_INTEGRATION"
contract_type: "architecture_integration"
applies_to: ["k1.orchestrator.tool_runner", "k1.process_sandbox", "k1.egress_control"]

# ============================================================================
# ADR-0032: 4-LAYER EGRESS CONTROL ARCHITECTURE
# ============================================================================

principle: |
  Process Sandbox implements ADR-0032 4-layer egress control:

  Layer 1 - Network Egress: iptables firewall (per-tool ingress/egress rules)
  Layer 2 - Filesystem Egress: chroot jail (restricted root directory)
  Layer 3 - Resource Egress: cgroups v2 (CPU, memory, I/O quotas)
  Layer 4 - Audit Egress: violation logging to K0 (compliance trail)

  All 4 layers stack for defense-in-depth:
  - Layer 1 alone: Can still attack filesystem, processes, memory
  - Layer 1+2: Can still exhaust CPU, memory, I/O
  - Layer 1+2+3: Can still violate audit requirements
  - Layer 1+2+3+4: Complete egress control with compliance

  Result: Untrusted tool completely contained

# ============================================================================
# LAYER 1: NETWORK EGRESS via iptables
# ============================================================================

layer_1_network:
  overview: |
    Network firewall rules per-tool (via --pid-owner match):

    Default policy: DROP all (deny by default)
    Allowed: Only whitelisted ports (80/443) to whitelisted hosts
    Blocked: All other ports and hosts

    Rules installed:
    - Loopback allowed (127.0.0.1 always)
    - Specific host whitelist (api.openweathermap.org, etc.)
    - Blocked ports hardcoded (22/SSH, 23/Telnet, etc.)
    - Allowed ports limited (80/HTTP, 443/HTTPS)
    - DNS resolution validated (prevent rebinding attacks)

  iptables_rules_example: |
    # Block all network by default (for tool PID 200)
    iptables -A OUTPUT -p tcp --pid-owner 200 -j DROP
    iptables -A OUTPUT -p udp --pid-owner 200 -j DROP

    # Allow loopback
    iptables -A OUTPUT -p tcp --pid-owner 200 -d 127.0.0.1 -j ACCEPT

    # Allow specific host on port 443
    iptables -A OUTPUT -p tcp --pid-owner 200 -d 1.2.3.4 --dport 443 -j ACCEPT

    # Block sensitive ports
    iptables -A OUTPUT -p tcp --pid-owner 200 --dport 22 -j DROP
    iptables -A OUTPUT -p tcp --pid-owner 200 --dport 3306 -j DROP

  configuration: |
    Per-tool network whitelist (from tool metadata):

    weather_tool:
      allowed_hosts:
        - api.openweathermap.org
        - api.weatherapi.com
      allowed_ports: [80, 443]
      bandwidth_limit_mbps: 10

    database_tool:
      allowed_hosts:
        - internal-db.company.net
      allowed_ports: [5432]
      bandwidth_limit_mbps: 50

  enforcement_latency: |
    iptables rule setup overhead:
    - Per-rule addition: 0.1-0.5ms
    - Per-tool rules: ~10 rules (typical)
    - Total setup time: ~1-5ms per tool
    - Applied in: preexec_fn before exec()

  references: |
    Full details: Detailed contract in:
      contracts/tools/process_sandbox/network_egress_iptables.yml

# ============================================================================
# LAYER 2: FILESYSTEM EGRESS via chroot + seccomp
# ============================================================================

layer_2_filesystem:
  overview: |
    Filesystem isolation via two techniques:

    chroot (directory isolation):
    - Change root directory to /tmp/tool_<tool_id>_sandbox
    - Tool sees /etc, /usr, /lib as sandboxed versions
    - Real /etc is invisible
    - Tool cannot access parent directories (../../etc is in sandbox)

    seccomp (syscall filtering):
    - Block dangerous syscalls (mount, ptrace, execve, etc.)
    - Allow safe syscalls (open, read, write within sandbox)
    - Allow file operations only in /tmp/tool_* workspace

  chroot_structure: |
    Directory layout for tool PID 200:
    /tmp/tool_200_sandbox/ (tool's root directory)
      ├─ bin/
      ├─ usr/lib/ (dynamic libraries)
      ├─ lib/ (libc, standard libraries)
      ├─ etc/ (read-only config files for tool)
      ├─ workspace/ (read-write output directory)
      └─ tmp/ (temporary files)

    Tool sees this as:
    / (its chroot)
      ├─ bin/
      ├─ usr/lib/
      ├─ lib/
      ├─ etc/ (read-only)
      ├─ workspace/ (read-write)
      └─ tmp/

    Real filesystem hidden, tool cannot escape

  seccomp_rules_example: |
    Syscall filtering for tool PID 200:

    Blocked syscalls (BPF rules):
    - mount, umount (filesystem mounting)
    - ptrace (process debugging)
    - execve, execveat (new process spawning)
    - socket (network, use WASI instead)
    - clone, fork (thread/process spawning)
    - open (/etc/shadow, /root/.ssh - protected paths)

    Allowed syscalls:
    - open, openat (only within /tmp/tool_200_sandbox)
    - read, write, pread, pwrite
    - stat, fstat, lstat (metadata)
    - close, dup, dup2
    - brk, mmap (memory allocation)

  configuration: |
    Per-tool filesystem whitelist:

    weather_tool:
      writable_dirs: ["/workspace", "/tmp"]
      readonly_dirs: ["/usr/lib", "/lib"]
      blocked_files: ["/etc/shadow", "/root/.ssh", "/etc/passwd"]

    database_tool:
      writable_dirs: ["/workspace", "/var/tmp"]
      readonly_dirs: ["/usr/lib", "/lib"]
      blocked_files: ["/etc/shadow", "/root/.ssh"]

  enforcement_latency: |
    seccomp filter compilation:
    - BPF program generation: 1-2ms
    - BPF program loading: 0.1-0.5ms
    - Total setup time: 1-3ms per tool

    Syscall filtering overhead (at runtime):
    - Per-syscall check: ~50-100 nanoseconds (negligible)
    - Only first syscall slow (filter cache miss)

  references: |
    Full details: Detailed contract in:
      contracts/tools/process_sandbox/filesystem_egress_chroot.yml

# ============================================================================
# LAYER 3: RESOURCE EGRESS via cgroups v2
# ============================================================================

layer_3_resources:
  overview: |
    Resource quotas enforced by Linux cgroups (control groups):

    CPU limiting:
    - Per-tool quota: 1 core (100% of 1 CPU)
    - Kernel throttles when exceeded
    - Fair share if >1 tool running

    Memory limiting:
    - Per-tool quota: 512MB (worst-case)
    - Out-of-memory kill if exceeded
    - Includes page cache and swap

    I/O limiting:
    - Disk read rate: 100MB/sec per tool
    - Disk write rate: 50MB/sec per tool
    - I/O operations rate: 1000 IOPS per tool
    - Throttles or blocks if exceeded

    PID limiting:
    - Max processes per tool: 5 (tool + potential forks)
    - Prevents process bomb (fork bomb)

  cgroups_v2_structure: |
    Cgroup hierarchy (simplified):
    /sys/fs/cgroup/
      ├─ k1.slice/ (K1 system)
      ├─ k1-tool.slice/ (tool cgroups)
      │   ├─ k1-tool-200.scope/ (tool PID 200)
      │   │   ├─ cpu.max=100000 (100% of 1 core)
      │   │   ├─ memory.max=536870912 (512MB)
      │   │   ├─ io.max (I/O limits)
      │   │   └─ pids.max=5 (max processes)
      │   ├─ k1-tool-201.scope/ (tool PID 201)
      │   └─ k1-tool-202.scope/ (tool PID 202)
      └─ system.slice/ (other system services)

  configuration: |
    Per-privacy-band resource limits:

    GREEN band tools:
      cpu_limit: 1 core (100%)
      memory_limit: 512MB
      io_read_limit: 100MB/sec
      io_write_limit: 50MB/sec

    AMBER band tools:
      cpu_limit: 0.5 core (50%)
      memory_limit: 256MB
      io_read_limit: 50MB/sec
      io_write_limit: 25MB/sec

    RED band tools:
      cpu_limit: 0.25 core (25%)
      memory_limit: 128MB
      io_read_limit: 10MB/sec
      io_write_limit: 5MB/sec

  enforcement_latency: |
    Cgroup creation and configuration:
    - Create cgroup (mkdir -p): 0.1-0.5ms
    - Set CPU limits: 0.1-0.2ms
    - Set memory limits: 0.1-0.2ms
    - Set I/O limits: 0.2-0.5ms
    - Total setup time: <2ms per tool
    - Applied in: preexec_fn before exec()

  references: |
    Full details: Detailed contract in:
      contracts/tools/process_sandbox/resource_egress_cgroups.yml

# ============================================================================
# LAYER 4: AUDIT EGRESS via K0 ToolReceipt
# ============================================================================

layer_4_audit:
  overview: |
    Violation detection and compliance logging:

    K0 ToolReceipt integration:
    - Capture all tool invocations (audit trail)
    - Record network connections attempted/blocked
    - Record filesystem access attempts
    - Record resource usage (CPU time, memory peak)
    - Record execution outcome (success, timeout, crash)

    Audit trail retention:
    - 7-year compliance requirement (from contract)
    - Immutable log to K0 storage layer
    - Query for compliance audits

  violation_events_logged: |
    Network violations:
    - Blocked outbound connection (host not whitelisted)
    - Blocked port access (port not allowed)
    - DNS rebinding attempt detected
    - Bandwidth limit exceeded

    Filesystem violations:
    - Attempted path traversal (../../etc)
    - Attempted access outside sandbox
    - Attempted write to read-only filesystem
    - Attempted file access to protected path

    Resource violations:
    - CPU quota exceeded (throttled)
    - Memory limit exceeded (killed)
    - I/O rate exceeded (throttled)
    - Process limit exceeded (fork denied)

    Execution violations:
    - Tool timeout exceeded (force killed)
    - Tool crashed (segmentation fault)
    - Tool exited with error code
    - Tool spawned unauthorized subprocess (seccomp blocked)

  ToolReceipt_structure: |
    Example audit entry (K0 ToolReceipt):
    {
      "receipt_id": "receipt_abc123",
      "tool_id": "weather_tool",
      "session_id": "session_xyz789",
      "timestamp": "2025-01-15T14:30:45Z",
      "execution_time_ms": 245,
      "status": "COMPLETED",
      "violations": [
        {
          "type": "NETWORK",
          "severity": "BLOCKED",
          "message": "Attempted connection to 192.168.1.100:22 (not whitelisted)",
          "timestamp": "2025-01-15T14:30:46Z"
        }
      ],
      "resource_usage": {
        "cpu_time_ms": 150,
        "memory_peak_mb": 87,
        "io_read_bytes": 1024000,
        "io_write_bytes": 512000
      }
    }

  compliance_requirements: |
    Audit trail enables compliance:

    SOC 2 Type II:
    - Evidence of access controls (all tools sandboxed)
    - Evidence of monitoring (all violations logged)
    - Evidence of incident response (violations captured)

    HIPAA/PCI-DSS (if handling sensitive data):
    - 7-year retention (K0 provides)
    - Immutable audit trail (K0 append-only)
    - Query capabilities (K0 supports)

    Regulatory audit:
    - Export ToolReceipts for period (query K0)
    - Prove all tools sandboxed (receipts show violations blocked)
    - Prove retention (receipts timestamped)

  references: |
    Full details: Detailed contract in:
      contracts/tools/process_sandbox/violation_logging_k0.yml

# ============================================================================
# INTEGRATION: 4-LAYER SETUP IN PREEXEC_FN
# ============================================================================

integration_example:
  python_pseudocode: |
    import subprocess
    import os

    def setup_tool_sandbox(tool_id, tool_config):
        """Setup all 4 egress control layers"""

        def preexec_fn():
            # Layer 1: Install iptables rules
            setup_network_iptables(tool_id, tool_config)  # <5ms

            # Layer 2: Install chroot + seccomp
            setup_filesystem_chroot(tool_id, tool_config)  # <5ms
            setup_seccomp_filter(tool_id, tool_config)    # <3ms

            # Layer 3: Create cgroup + set limits
            setup_cgroup_limits(tool_id, tool_config)     # <2ms

            # Layer 4: Prepare audit receipt
            prepare_audit_receipt(tool_id)                # <1ms

        # Spawn process with all 4 layers
        process = subprocess.Popen(
            args=tool_config.cmd,
            stdin=subprocess.PIPE,
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            preexec_fn=preexec_fn  # Called in child before exec()
        )

        return process

    # Total setup overhead: ~16ms

  startup_sequence: |
    1. K1 decides to execute tool (untrusted RED tool)
    2. K1 calls: setup_tool_sandbox(tool_id="weather_tool_v2", config=...)
    3. K1 calls: subprocess.Popen(..., preexec_fn=preexec_fn)
    4. Kernel: fork() → create child process (PID 200)
    5. Child: preexec_fn() executes in context of child
       - Layer 1 iptables setup: ~5ms
       - Layer 2 chroot + seccomp: ~8ms
       - Layer 3 cgroup setup: ~2ms
       - Layer 4 audit prep: ~1ms
    6. Child: exec(tool_binary) → replace process image
    7. Tool: Now running in sandboxed environment with all 4 layers active
    8. K1: communicate via stdin/stdout pipes (MCP protocol)
    9. K1: collect violations from audit receipt
    10. K1: terminate process + cleanup cgroup + restore iptables

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: All 4 egress control layers MUST be installed
    ENFORCEMENT: K1 preexec_fn installs all 4 before exec()
    RATIONALE: Defense-in-depth requirement, single layer insufficient

  rule_2: |
    RULE: iptables rules MUST be installed before process execution
    ENFORCEMENT: preexec_fn runs iptables setup synchronously
    RATIONALE: Prevent network access before rules installed

  rule_3: |
    RULE: chroot + seccomp MUST be applied before tool code runs
    ENFORCEMENT: preexec_fn applies before exec()
    RATIONALE: Prevent filesystem escape before jail active

  rule_4: |
    RULE: cgroup resources MUST be set before process starts
    ENFORCEMENT: preexec_fn applies cgroup limits synchronously
    RATIONALE: Prevent resource exhaustion attack at startup

  rule_5: |
    RULE: All violations MUST be recorded in audit receipt
    ENFORCEMENT: K0 ToolReceipt captures all violation events
    RATIONALE: Enable compliance audits and incident investigation
