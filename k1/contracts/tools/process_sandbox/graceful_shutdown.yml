# Graceful Shutdown Contract
# Purpose: Define graceful shutdown sequence (shutdown → SIGTERM → SIGKILL)
# Source ADR: 0034b-mcp-process-lifecycle.md (lines 1401-1600)
# Version: 1.0
# Status: ACTIVE

component_name: "GracefulShutdown"
component_type: "Process Lifecycle"
version: "1.0"
description: "Implements graceful shutdown protocol: shutdown JSON-RPC → 2s wait → SIGTERM → 5s wait → SIGKILL (13s total max)"

references:
  adr: ["0034b", "0034a"]
  contracts: ["lifecycle_fsm_5_states", "process_spawner"]

graceful_shutdown_protocol:
  total_max_duration_seconds: 13
  target_graceful_window_seconds: 10
  fallback_force_kill_seconds: 13

  phases:
    - phase: "1_shutdown_request"
      duration_seconds: 2
      description: "Send shutdown JSON-RPC message"
      action: |
        Send {"jsonrpc":"2.0","method":"shutdown","id":"UUID"}
        Wait 2 seconds for response

    - phase: "2_sigterm"
      duration_seconds: 5
      description: "Send SIGTERM if shutdown didn't work"
      action: |
        If no response after 2s, send SIGTERM to process
        Wait 5 seconds for graceful exit

    - phase: "3_sigkill"
      duration_seconds: 6
      description: "Force kill if SIGTERM didn't work"
      action: |
        If still running after SIGTERM+5s, send SIGKILL
        Process terminates immediately
        Wait 1s for OS cleanup

shutdown_json_rpc_message:
  request:
    jsonrpc: "2.0"
    method: "shutdown"
    params: {}
    id: "UUID"
  response:
    jsonrpc: "2.0"
    result:
      closed_resources: true
      exit_code_hint: 0
    id: "UUID"
  timeout_seconds: 2
  description: "Graceful shutdown request - tool cleans up resources"

signal_handling:
  SIGTERM:
    purpose: "Request graceful termination"
    behavior: "Process should clean up and exit"
    waiting_period_seconds: 5
    signal_number: 15

  SIGKILL:
    purpose: "Force immediate termination"
    behavior: "Kernel forcibly kills process"
    waiting_period_seconds: 1
    signal_number: 9
    note: "Cannot be caught, guaranteed to terminate"

shutdown_state_machine:
  state_transition: "RUNNING → TERMINATING → TERMINATED"

  TERMINATING_phase_1:
    action: "Send shutdown JSON-RPC"
    timeout: "2 seconds"
    next: "TERMINATING_phase_2"

  TERMINATING_phase_2:
    condition: "Shutdown message received response OR 2s timeout"
    action: "Send SIGTERM if no response"
    timeout: "5 seconds"
    next: "TERMINATING_phase_3"

  TERMINATING_phase_3:
    condition: "SIGTERM sent AND process still running OR 5s timeout"
    action: "Send SIGKILL"
    timeout: "1 second"
    next: "TERMINATED"

  TERMINATED:
    action: "Process exited, resources cleaned, close pipes"
    final_state: true

cleanup_on_exit:
  close_stdin: true
  close_stdout: true
  close_stderr: true
  wait_for_exit: true
  reap_process: true
  note: "Prevent zombies by calling wait()"

exit_code_interpretation:
  0: "Clean exit, no errors"
  1: "Generic error"
  127: "Command not found"
  128: "Fatal signal received"
  SIGTERM_exit: "128 + 15 = 143 (clean shutdown)"
  SIGKILL_exit: "128 + 9 = 137 (forced kill)"

timeout_enforcement:
  total_timeout_seconds: 13
  step_timeouts:
    - step: "phase_1_shutdown_json"
      timeout_seconds: 2

    - step: "phase_2_sigterm"
      timeout_seconds: 5

    - step: "phase_3_sigkill"
      timeout_seconds: 6

  enforcement: "Use asyncio.wait_for() for each phase"

performance_slas:
  graceful_shutdown_p95_seconds: 13
  expected_graceful_window_seconds: 10
  metrics_name: "process_shutdown_duration_seconds"

error_handling:
  shutdown_message_timeout:
    condition: "No response to shutdown JSON-RPC after 2s"
    action: "Proceed to SIGTERM"

  sigterm_timeout:
    condition: "Process still running after SIGTERM + 5s wait"
    action: "Send SIGKILL"

  sigkill_timeout:
    condition: "Process still running after SIGKILL (shouldn't happen)"
    action: "Log critical error, assume zombie, move to TERMINATED"

resource_cleanup_sequence:
  before_signals: "Leave pipes open for communication"
  after_shutdown_json: "Wait for response"
  after_sigterm: "Process should clean its resources"
  after_sigkill: "Kernel forced termination"
  final: "Close all pipes, release ProcessInfo"

integration_with_lifecycle:
  initial_state: "RUNNING"
  target_state: "TERMINATED"
  intermediate_state: "TERMINATING"
  timeout_max: 13
  description: "Graceful shutdown is used when transition RUNNING → TERMINATED"

implementation_notes:
  - "Shutdown sequence is deterministic: shutdown → SIGTERM → SIGKILL"
  - "Each phase has explicit timeout"
  - "Total timeout never exceeds 13 seconds"
  - "Expected graceful shutdown (no SIGKILL) is ~10 seconds"
  - "Log all shutdown phases with trace_id and timing"
  - "Use process.terminate() (SIGTERM) and process.kill() (SIGKILL) in asyncio"
  - "Monitor exit code to understand shutdown cause"

testing_requirements:
  - test_graceful_shutdown_success: "Send shutdown, wait for exit, verify TERMINATED"
  - test_shutdown_timeout_to_sigterm: "Shutdown times out, SIGTERM sent, process exits"
  - test_sigterm_timeout_to_sigkill: "SIGTERM times out, SIGKILL sent, process forcibly killed"
  - test_exit_code_mapping: "Verify exit codes match shutdown cause"
  - test_pipe_closure: "Verify pipes closed after TERMINATED"
  - test_total_timeout: "Verify shutdown never exceeds 13s"

compliance:
  adr_0034b_sections: ["Graceful shutdown sequence", "SIGTERM/SIGKILL handling", "13s total timeout"]

changelog:
  "1.0": "Initial contract - Graceful shutdown protocol (shutdown → SIGTERM → SIGKILL)"
