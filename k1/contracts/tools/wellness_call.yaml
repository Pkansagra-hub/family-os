# k1/contracts/tools/wellness_call.yaml
# Storyline capability (M12.E3.I1) — backed by LocalStubProvider.

tool_contract:
  name: "tool.execute.wellness_call"
  version: "1.0.0"
  domain:
    - "HEALTH"
    - "FAMILY"
  description: >
    Place a check-in / wellness call to a household member or
    contact. Storyline capability for M12 conscience activation;
    backed by a deterministic local stub.
  capabilities:
    - "wellness_outreach"
  limitations:
    - "stub_implementation"
  required_inputs:
    - name: "subject"
      type: "STRING"
      description: "Member to be called for wellness check."
    - name: "channel"
      type: "STRING"
      description: "Call channel (voice, video)."
  output:
    type: "object"
    properties:
      receipt_id: {type: "string"}
      status: {type: "string"}
      timestamp: {type: "string"}
    required: ["receipt_id", "status", "timestamp"]
  provider_type: "LOCAL_STUB"
  provider_id: "wellness_call_stub"
  safety_band_min: "AMBER"
  risk_class: "medium"
  social_act: "wellness_call"
  cost_per_call: 0.0
  avg_latency_ms: 5
  max_latency_ms: 50
  availability: "ONLINE"
  requires_human_confirmation: true
  side_effects:
    - kind: "notification_send"
      target: "wellness.callee"
      reversible: false
      description: "Initiates an outbound wellness call."
