# MCP Server Lifecycle Contract
#
# **Purpose:** Define MCP server state machine (initialize → tools/list → tools/call → shutdown)
# with graceful termination (SIGTERM → 5s → SIGKILL), health checks, and crash detection.
#
# **Source ADR:** ADR-0033a (MCP Protocol Integration)

---
mcp_server_lifecycle:
  name: "MCP Server Lifecycle"
  version: "1.0"
  description: "Server state machine and lifecycle management"

  state_machine:
    description: "5-state FSM for MCP server lifecycle"

    states:
      INITIALIZING:
        description: "Server spawned, awaiting initialize() call"
        timeout: "5 seconds"
        transitions:
          success: "READY (on initialize response)"
          timeout: "CRASHED (initialization timeout)"
          error: "CRASHED"

      READY:
        description: "Server initialized, ready for calls"
        transitions:
          tools_list_call: "READY (tools/list method)"
          tools_call_call: "READY (tools/call method)"
          shutdown: "TERMINATING"
          crash: "CRASHED"

      TERMINATING:
        description: "Graceful shutdown in progress (SIGTERM sent)"
        timeout: "5 seconds"
        transitions:
          success: "TERMINATED (exit code 0)"
          timeout: "FORCE_KILLING (exceeded 5s)"
          error: "FORCE_KILLING"

      FORCE_KILLING:
        description: "Forced termination (SIGKILL)"
        timeout: "2 seconds"
        transitions:
          success: "TERMINATED (killed)"
          error: "TERMINATED (resource cleanup)"

      CRASHED:
        description: "Server process crashed or died unexpectedly"
        transitions:
          cleanup: "TERMINATED (resources cleaned up)"

    transitions:
      initialize:
        from: "INITIALIZING"
        to: "READY"
        trigger: "initialize() completes successfully"

      tools_list:
        from: "READY"
        to: "READY"
        trigger: "tools/list() called"

      tools_call:
        from: "READY"
        to: "READY"
        trigger: "tools/call() called"

      shutdown:
        from: "READY"
        to: "TERMINATING"
        trigger: "shutdown() called"

      graceful_complete:
        from: "TERMINATING"
        to: "TERMINATED"
        trigger: "Process exits cleanly"

      force_kill:
        from: "TERMINATING"
        to: "FORCE_KILLING"
        trigger: "5-second timeout exceeded"

      kill_complete:
        from: "FORCE_KILLING"
        to: "TERMINATED"
        trigger: "Process killed via SIGKILL"

      crash:
        from: "READY"
        to: "CRASHED"
        trigger: "Process dies unexpectedly"

      crash_cleanup:
        from: "CRASHED"
        to: "TERMINATED"
        trigger: "Resources cleaned up"

  lifecycle_phases:

    phase_1_spawn:
      description: "Spawn MCP server process"

      process_spawn:
        command: |
          subprocess.Popen([
              "python",
              "/opt/familyos/mcp_servers/weather_api.py"
          ])

        state: "INITIALIZING"
        timeout: "5 seconds"

      sandbox_setup:
        description: "Apply sandbox constraints (ADR-0032)"
        steps:
          - "Create chroot jail (if Process sandbox)"
          - "Setup iptables rules (if Process sandbox)"
          - "Create cgroups v2 (if Process sandbox)"
          - "Assign to Wasmtime instance (if WASM sandbox)"

      monitoring:
        - "Monitor process spawn latency (<100ms)"
        - "Monitor memory usage"
        - "Monitor CPU usage"

    phase_2_initialize:
      description: "Call initialize() to setup server"

      client_call:
        method: "MCPClient.initialize()"
        timeout: "5 seconds"

      server_tasks:
        - "Load tool definitions"
        - "Initialize resources"
        - "Return capabilities"

      success_criteria:
        - "Server responds with capabilities"
        - "Server transitions to READY"

      failure_handling:
        timeout: "Kill process, spawn new"
        error: "Restart server"

      state_transition: "INITIALIZING → READY"

    phase_3_operations:
      description: "Active tool invocation"

      operations:
        - "tools/list (discover available tools)"
        - "tools/call (invoke specific tool)"
        - "Custom methods (tool-specific)"

      state: "READY (no state change)"

      error_handling:
        method_error: "Retry or fallback"
        timeout: "Kill process, spawn new"
        crash: "Kill process, spawn new"

    phase_4_graceful_shutdown:
      description: "Graceful server termination"

      trigger:
        - "Session ended"
        - "Tool execution complete"
        - "Manual shutdown request"

      steps:
        step_1_call_shutdown:
          description: "Call shutdown() method"
          timeout: "5 seconds"
          server_tasks:
            - "Close open connections"
            - "Flush buffers"
            - "Release resources"

        step_2_send_sigterm:
          description: "Send SIGTERM to process"
          signal: "SIGTERM"
          wait_timeout: "5 seconds"
          effect: "Signal graceful termination"

        step_3_await_exit:
          description: "Wait for process to exit"
          timeout: "5 seconds"
          success: "Process exits cleanly (code 0)"

        step_4_if_timeout_send_sigkill:
          description: "If not exited after 5s, send SIGKILL"
          signal: "SIGKILL"
          wait_timeout: "2 seconds"
          effect: "Force termination"

        step_5_cleanup:
          description: "Clean up resources"
          tasks:
            - "Close pipes (stdin/stdout)"
            - "Release file handles"
            - "Unmount sandbox (if chroot)"
            - "Release cgroups (if Process)"

      state_transitions:
        - "READY → TERMINATING (step 1)"
        - "TERMINATING → TERMINATED (step 3, success)"
        - "TERMINATING → FORCE_KILLING (step 4, timeout)"
        - "FORCE_KILLING → TERMINATED (step 5)"

    phase_5_force_termination:
      description: "Forced termination if graceful fails"

      trigger: "Graceful termination timeout (5s)"

      steps:
        - "Send SIGKILL to process"
        - "Wait 2 seconds for process exit"
        - "Forcefully kill all child processes (killall -9 in cgroup)"
        - "Release all resources"

      state_transitions: "TERMINATING → FORCE_KILLING → TERMINATED"

    phase_6_crash_handling:
      description: "Unexpected process termination"

      detection:
        mechanism: "Monitor process.poll() != None"
        check_frequency: "Every 1 second (supervisor)"

      recovery:
        strategy: "Escalate to ToolExecutionSelector (fallback cascade)"
        steps:
          - "Log crash event (with trace_id)"
          - "Increment crash counter"
          - "Trigger fallback sandbox selection"
          - "Spawn new process (if fallback available)"

      crash_blacklist:
        rule: "3 crashes in 10 minutes → blacklist tool for 1 hour"
        effect: "Prevent repeated crash loops"

      state_transitions: "READY → CRASHED → TERMINATED"

  ## HEALTH CHECKS
  health_checks:

    check_1_initialization:
      name: "Initialization Health Check"
      trigger: "After server spawn"
      method: "Send initialize() call"
      timeout: "5 seconds"
      success_criteria: "Responds with capabilities"
      failure_action: "Spawn new process"

    check_2_liveness:
      name: "Liveness Health Check"
      trigger: "Every 60 seconds (during READY)"
      method: "Send tools/list call"
      timeout: "5 seconds"
      success_criteria: "Responds with tool list"
      failure_action: "Assume process crashed, trigger restart"

    check_3_responsiveness:
      name: "Responsiveness Health Check"
      trigger: "Per tool call"
      method: "Measure tool call latency"
      timeout: "tool-specific (e.g., 30s)"
      success_criteria: "Completes within timeout"
      failure_action: "Kill process, trigger fallback"

  ## METRICS
  metrics:

    lifecycle_metrics:
      - name: "k1_mcp_server_spawns_total"
        labels: ["tool_name", "sandbox"]
        type: "Counter"
        description: "Total server spawns"

      - name: "k1_mcp_server_spawn_latency_ms"
        labels: ["tool_name", "sandbox"]
        type: "Histogram"
        description: "Spawn latency (<100ms target)"

      - name: "k1_mcp_server_initialization_latency_ms"
        labels: ["tool_name", "sandbox"]
        type: "Histogram"
        description: "Initialization latency (<5s)"

      - name: "k1_mcp_server_crashes_total"
        labels: ["tool_name", "sandbox", "reason"]
        type: "Counter"
        description: "Server crashes"

      - name: "k1_mcp_server_graceful_shutdowns_total"
        labels: ["tool_name", "sandbox"]
        type: "Counter"
        description: "Graceful shutdowns"

      - name: "k1_mcp_server_force_kills_total"
        labels: ["tool_name", "sandbox"]
        type: "Counter"
        description: "Force kills (graceful timeout)"

      - name: "k1_mcp_server_uptime_seconds"
        labels: ["tool_name", "sandbox"]
        type: "Gauge"
        description: "Server uptime"

    health_metrics:
      - "k1_mcp_health_checks_total (by check_type, result)"
      - "k1_mcp_health_check_latency_ms (by check_type)"

  ## LOGGING
  logging:

    events:
      - event: "server_spawn"
        level: "INFO"
        fields: ["tool_name", "sandbox", "pid", "trace_id"]

      - event: "server_initialize_start"
        level: "INFO"
        fields: ["tool_name", "pid", "trace_id"]

      - event: "server_initialize_complete"
        level: "INFO"
        fields: ["tool_name", "latency_ms", "capabilities", "trace_id"]

      - event: "server_initialize_timeout"
        level: "ERROR"
        fields: ["tool_name", "timeout_seconds", "trace_id"]

      - event: "server_crash"
        level: "ERROR"
        fields: ["tool_name", "exit_code", "signal", "pid", "crash_count", "trace_id"]

      - event: "server_shutdown_start"
        level: "INFO"
        fields: ["tool_name", "trigger", "trace_id"]

      - event: "server_shutdown_graceful_complete"
        level: "INFO"
        fields: ["tool_name", "latency_ms", "trace_id"]

      - event: "server_shutdown_force_kill"
        level: "WARNING"
        fields: ["tool_name", "reason", "trace_id"]

      - event: "server_health_check_failed"
        level: "WARNING"
        fields: ["tool_name", "check_type", "error", "trace_id"]

  ## CRASH DETECTION & BLACKLIST
  crash_detection:

    crash_counter:
      name: "Crash counter (per tool, per session)"
      reset: "Every 10 minutes"

    crash_blacklist:
      rule: "3+ crashes in 10-minute window → blacklist tool"
      duration: "60 minutes (1 hour)"
      effect: "Tool not available for selection"
      logging: "Log event, alert operator"
      recovery: "Manual operator review required"

    crash_reasons:
      - "exit_code != 0 (abnormal termination)"
      - "signal (SIGSEGV, SIGABRT, etc)"
      - "timeout (process hung)"
      - "memory exhausted (OOM kill)"
      - "resource limit exceeded"

  ## PERFORMANCE TARGETS
  performance:
    spawn_latency:
      target: "<100ms"
      p95: "120ms"

    initialization_latency:
      target: "<5s"
      p95: "5.5s"

    graceful_shutdown_latency:
      target: "<5s"
      p95: "5.5s"

    force_kill_latency:
      target: "<2s"
      p95: "2.5s"

  ## INTEGRATION WITH SANDBOX LAYER
  sandbox_integration:

    process_sandbox:
      description: "Integration with ADR-0032 egress controls"
      lifecycle_hooks:
        on_spawn: "Create chroot, setup iptables, setup cgroups"
        on_shutdown: "Unmount chroot, cleanup iptables, release cgroups"

    wasm_sandbox:
      description: "Integration with Wasmtime runtime"
      lifecycle_hooks:
        on_spawn: "Instantiate WASM module"
        on_shutdown: "Release module instance"

    container_sandbox:
      description: "Integration with Firecracker microVM"
      lifecycle_hooks:
        on_spawn: "Boot microVM"
        on_shutdown: "Shutdown microVM"
