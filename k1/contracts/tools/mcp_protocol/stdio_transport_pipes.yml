# MCP Transport: Stdio Pipes Implementation (Layer 1 - Protocol Transport)
# Purpose: Newline-delimited JSON-RPC 2.0 over process stdin/stdout
# Research: Actor Model message passing (Hewitt 1973), Unix pipes design
# Part of ADR-0033a (MCP Protocol Integration)
# Applies to: All K1 tools using MCP protocol with native process sandboxes

---
contract_id: "TOOL_EXEC_MCP_STDIO_TRANSPORT_PIPES"
contract_type: "protocol_transport"
applies_to: ["k1.orchestrator.tool_runner", "k1.planner.tool_executor"]
research_basis:
  - title: "The Unix Philosophy: Do One Thing Well"
    authors: ["McIlroy, Pinson, Tague"]
    year: 1978
  - title: "Actor Model of Computation"
    authors: ["Carl Hewitt"]
    year: 1973
  - title: "JSON-RPC 2.0 Specification"
    authors: ["JSON-RPC Working Group"]
    year: 2010

# ============================================================================
# OVERVIEW: Stdio Transport Design
# ============================================================================

overview: |
  Stdio transport provides bidirectional JSON-RPC 2.0 communication over
  subprocess stdin/stdout with newline-delimited message framing.

  This is the PRIMARY transport for MCP in K1 (70% adoption) because:
  1. No network latency (<5ms vs 10ms+ for HTTP)
  2. Same-process subprocess (minimal overhead)
  3. Simple framing (newline separation)
  4. Native process supervision (parent owns child lifecycle)
  5. Shared memory benefits (no serialization overhead)

  Performance targets:
  - Latency: P95 < 5ms (request → response)
  - Throughput: > 1000 requests/second
  - Memory overhead: < 1MB per transport pair
  - Startup latency: < 100ms (process spawn + initialize)

# ============================================================================
# PROTOCOL: Newline-Delimited JSON
# ============================================================================

protocol:
  name: "Newline-Delimited JSON-RPC 2.0 (NDJSON)"
  rfc: "JSON-RPC 2.0 (https://www.jsonrpc.org/specification)"
  framing_mechanism: "newline_delimited"
  frame_format: |
    Each JSON-RPC message is a complete JSON object followed by newline (LF):

    Request:
    {"jsonrpc":"2.0","method":"initialize","params":{},"id":1}\n

    Response:
    {"jsonrpc":"2.0","result":{"tool_count":42},"id":1}\n

    Error response:
    {"jsonrpc":"2.0","error":{"code":-32600,"message":"Invalid Request"},"id":1}\n

    Notification (no response expected):
    {"jsonrpc":"2.0","method":"ping","params":{}}\n

  character_encoding: "UTF-8"
  line_ending: "LF (0x0A)"
  json_validation: "RFC 7158 strict (no trailing commas, valid Unicode)"
  max_message_size: "16 MB"
  max_message_size_rationale: |
    Prevents denial-of-service attacks where malformed process sends
    infinite single-line JSON. 16MB accommodates reasonable payloads
    (e.g., large base64-encoded files) without excessive buffering.

# ============================================================================
# TRANSPORT LAYER: Process Management
# ============================================================================

process_management:
  spawning:
    mechanism: "asyncio.create_subprocess_exec (Python)"
    target_environment: "Sandbox process (ADR-0033c Process Sandbox)"
    stdout_handling: "asyncio.StreamReader (non-blocking)"
    stdin_handling: "asyncio.StreamWriter (non-blocking)"
    stderr_handling: "Captured separately for diagnostics/logging"
    working_directory: "Tool-specific or K1_TOOL_ROOT"
    environment_variables:
      K1_TRACE_ID: "Cognitive trace ID for observability"
      K1_TOOL_ID: "Tool identifier (e.g., 'weather_api')"
      K1_BAND: "Privacy band (GREEN/AMBER/RED/BLACK)"
      K1_LOG_LEVEL: "DEBUG/INFO/WARNING/ERROR"
    launch_latency_target: "< 100ms (process spawn + first I/O ready)"

  lifecycle_events:
    on_spawn: |
      - Record spawn start timestamp
      - Emit metric: mcp_transport_spawns_total{transport=stdio}
      - Log: {event: "transport_spawn", transport: "stdio", pid: <pid>}

    on_ready: |
      - Wait for first I/O readiness (stdout/stdin ready)
      - Record ready timestamp
      - Validate process still alive (poll for exit code)
      - Emit metric: mcp_transport_ready_latency_ms with latency

    on_exit: |
      - Capture exit code (0 = clean, non-zero = error)
      - Record stderr/stdout tail (last 1KB for diagnostics)
      - Emit metric: mcp_transport_exits_total{exit_code, reason}
      - Log: {event: "transport_exit", exit_code, reason, stderr_tail}

  process_termination:
    graceful_shutdown:
      method: "SIGTERM signal"
      timeout_seconds: 5
      sequence: |
        1. Send SIGTERM to process (signum=15)
        2. Wait for graceful exit (5 second timeout)
        3. On timeout, proceed to force_kill

    force_kill:
      method: "SIGKILL signal"
      timeout_seconds: 2
      sequence: |
        1. Send SIGKILL to process (signum=9)
        2. Wait for process death (2 second timeout)
        3. On timeout, log error (process may be orphaned)
        4. Clean up file descriptors regardless

    cleanup_on_exit:
      - Close stdin (sends EOF to process)
      - Close stdout reader (release buffers)
      - Close stderr reader (release buffers)
      - Cancel all pending I/O operations
      - Emit metric: mcp_transport_cleanup_duration_ms

# ============================================================================
# SERIALIZATION: Message Encoding/Decoding
# ============================================================================

serialization:
  encoding:
    format: "JSON (RFC 7158)"
    encoding_charset: "UTF-8 (with BOM stripping)"
    encoding_process: |
      1. Python dict → json.dumps(obj, ensure_ascii=False)
      2. Bytes = result.encode('utf-8')
      3. Append LF (0x0A)
      4. Write to stdin

    encoding_example: |
      Request object:
      {
        "jsonrpc": "2.0",
        "method": "tools/call",
        "params": {
          "tool_id": "weather_api",
          "arguments": {"city": "San Francisco"}
        },
        "id": 42
      }

      Encoded form (hex):
      7b 22 6a 73 6f 6e 72 70 63 22 3a 22 32 2e 30 22 2c...
      [JSON content]...
      0a [LF]

  decoding:
    format: "Line-by-line JSON parsing"
    decoding_process: |
      1. Read line from stdout (asyncio.StreamReader.readline())
      2. Split at LF boundary
      3. Strip LF/CR (just in case)
      4. Validate JSON (json.loads() or strict validator)
      5. Validate JSON-RPC schema (required fields, types)
      6. Return parsed object or error

    error_handling: |
      - Malformed JSON: LogError, emit metric, skip line
      - Invalid JSON-RPC: LogError, may send error response
      - Line too long (>16MB): Close transport, emit error metric
      - Encoding error: LogError, close transport

  buffering:
    strategy: "Line-buffered (asyncio.StreamReader native)"
    read_buffer_size: "64KB (asyncio default, sufficient for line reading)"
    write_buffer_size: "64KB (asyncio default, sufficient for JSON objects)"
    overflow_behavior: |
      - If line > 16MB and no LF found: Close transport
      - If write buffer full (very rare): BackpressureError, pause writes
      - If read buffer full (very rare): Slow down read rate

# ============================================================================
# REQUEST/RESPONSE HANDLING
# ============================================================================

request_response_protocol:
  request_submission:
    method: "async def send_request(method, params, timeout)"
    steps: |
      1. Generate unique request ID (UUID or sequence number)
      2. Create JSON-RPC 2.0 request object
      3. Serialize to JSON
      4. Append newline
      5. Write to subprocess stdin (non-blocking)
      6. Register future/callback for response matching
      7. Set timeout timer (3 seconds default)
      8. Return future (await for response)

  response_matching:
    strategy: "Request ID correlation"
    flow: |
      1. Client sends: {jsonrpc, method, params, id: 123}
      2. Server processes request
      3. Server sends: {jsonrpc, result/error, id: 123}
      4. Client reads response line
      5. Extract response.id = 123
      6. Match to pending_requests[123]
      7. Resolve future with result/error
      8. Await-ing caller receives response

  timeout_behavior:
    default_timeout_seconds: 3
    timeout_strategy: |
      1. If response not received within timeout
      2. Reject promise/future with TimeoutError
      3. Emit metric: mcp_request_timeout{method, tool}
      4. Log: {event: "request_timeout", method, timeout_ms}
      5. Client continues (may retry or fallback)
      6. Process may still respond later (late response discarded)

  bidirectional_communication:
    enabled: true
    description: |
      Stdio transport is full-duplex. MCP server can send:
      - Notifications (no response needed)
      - Server-initiated messages (logging, telemetry, state changes)

      Examples:
      - Log notifications: {jsonrpc, method: "log", params: {level, message}}
      - Health check pings: {jsonrpc, method: "ping", params: {}}
      - State change notifications: {jsonrpc, method: "state_changed", ...}

# ============================================================================
# ERROR HANDLING & RECOVERY
# ============================================================================

error_handling:
  transport_errors:
    process_crash:
      detection: "process.poll() returns non-None (exit code)"
      handling: |
        1. Set transport status to CRASHED
        2. Complete all pending requests with ProcessCrashedError
        3. Emit metric: mcp_transport_crash
        4. Log: {event: "transport_crash", exit_code, stderr_tail}
        5. Do NOT auto-restart (let ToolExecutionSelector retry/fallback)

    pipe_broken:
      detection: "OSError (Errno 32 EPIPE) on write"
      handling: |
        1. Close transport
        2. Complete pending requests with BrokenPipeError
        3. Emit metric: mcp_transport_pipe_broken
        4. Log error

    encoding_error:
      detection: "json.JSONDecodeError on response line"
      handling: |
        1. Skip malformed line (emit debug log)
        2. Continue reading next line
        3. If repeated errors, close transport (likely corrupted state)

    timeout_error:
      detection: "asyncio.TimeoutError during await"
      handling: |
        1. Reject request promise
        2. Emit metric: mcp_request_timeout
        3. Continue reading (process may still be working)

  recovery_strategies:
    partial_recovery:
      enabled: true
      strategy: |
        If one request times out but transport still responding:
        1. Mark request as failed
        2. Continue using transport for other requests
        3. Track consecutive timeouts
        4. If >3 consecutive timeouts, close transport

    transport_restart:
      enabled: false
      rationale: |
        Stdio transport does NOT auto-restart. If process crashes,
        ToolExecutionSelector's fallback cascade handles:
        1. Current request fails
        2. Try alternative combination (fallback stage 2+)
        3. Eventually succeed or report final error

# ============================================================================
# PERFORMANCE & OPTIMIZATION
# ============================================================================

performance:
  latency_targets:
    request_submit: "< 0.1ms (serialization + write buffer)"
    network_latency: "< 0.5ms (IPC, no network)"
    process_handling: "< 0.5ms (signal, exit code check)"
    response_parse: "< 1ms (JSON parsing, schema validation)"
    total_round_trip: "< 5ms P95 (all above combined)"

  throughput_targets:
    requests_per_second: "> 1000"
    concurrent_requests: "< 100 (typical <50)"
    burst_capacity: "1000 req/sec for 10 seconds"

  optimization_techniques:
    json_parsing: |
      - Use compiled JSON parsers (Python's native json or orjson)
      - Avoid double-parsing (parse once, validate once)
      - Cache frequently-accessed keys (tool_id, method)

    buffering: |
      - Use asyncio StreamReader (already optimized)
      - Don't buffer entire responses (line-by-line)
      - Pre-allocate buffers if known size

    syscall_reduction: |
      - Batch writes where possible (collect multiple requests)
      - Avoid sync I/O (use async/await consistently)
      - Minimize process spawning (reuse spawned processes)

    memory_efficiency: |
      - Per-transport: ~1MB overhead (buffers + pending requests dict)
      - Per-request: ~10KB (JSON payload typical size)
      - No memory leaks: Cancel tasks, close streams on exit

  profiling_results:
    cpu_usage: "< 1% per transport (mostly I/O wait)"
    memory_per_transport: "1MB average"
    context_switches: "4-6 per request (read/write/wait/response)"

# ============================================================================
# OBSERVABILITY: Metrics, Traces, Logs
# ============================================================================

observability:
  metrics:
    prometheus_metrics:
      - name: "mcp_transport_spawns_total"
        type: "Counter"
        labels: ["transport=stdio", "tool_id", "band"]
        description: "Total stdio transport processes spawned"

      - name: "mcp_transport_ready_latency_ms"
        type: "Histogram"
        labels: ["transport=stdio", "tool_id"]
        buckets: [10, 50, 100, 200, 500]
        description: "Time from spawn to first I/O ready"

      - name: "mcp_request_duration_ms"
        type: "Histogram"
        labels: ["transport=stdio", "method", "tool_id"]
        buckets: [0.1, 0.5, 1, 2, 5, 10]
        description: "Request → response latency"

      - name: "mcp_request_timeout"
        type: "Counter"
        labels: ["transport=stdio", "method", "tool_id", "timeout_ms"]
        description: "Requests that exceeded timeout"

      - name: "mcp_transport_errors_total"
        type: "Counter"
        labels: ["transport=stdio", "error_type", "tool_id"]
        values: ["process_crash", "pipe_broken", "encoding_error", "timeout"]
        description: "Transport-level errors"

      - name: "mcp_transport_active"
        type: "Gauge"
        labels: ["transport=stdio"]
        description: "Currently active stdio transports"

  tracing:
    traces_captured:
      - span_name: "stdio_transport_spawn"
        attributes:
          - tool_id: "string (e.g., 'weather_api')"
          - process_pid: "integer"
          - spawn_duration_ms: "float"
        events:
          - "spawn_start"
          - "spawn_complete"
          - "first_io_ready"

      - span_name: "stdio_transport_request"
        attributes:
          - request_id: "integer"
          - method: "string (e.g., 'tools/call')"
          - request_size_bytes: "integer"
          - response_size_bytes: "integer"
          - duration_ms: "float"
        events:
          - "request_sent"
          - "response_received"
          - "response_parsed"

      - span_name: "stdio_transport_error"
        attributes:
          - error_type: "string"
          - error_message: "string"
          - exit_code: "integer (if process crash)"
        events:
          - "error_detected"
          - "cleanup_start"
          - "cleanup_complete"

  logging:
    log_events:
      - event: "transport_spawn"
        level: "INFO"
        context: {transport: "stdio", tool_id, pid, trace_id}

      - event: "transport_ready"
        level: "DEBUG"
        context: {transport: "stdio", ready_latency_ms, trace_id}

      - event: "request_sent"
        level: "DEBUG"
        context: {request_id, method, params_summary, trace_id}

      - event: "response_received"
        level: "DEBUG"
        context: {request_id, method, duration_ms, trace_id}

      - event: "transport_crash"
        level: "ERROR"
        context: {tool_id, exit_code, stderr_tail_500b, trace_id}

      - event: "encoding_error"
        level: "WARNING"
        context: {line_sample_100b, error_message, trace_id}

      - event: "timeout_error"
        level: "WARNING"
        context: {request_id, method, timeout_ms, trace_id}

# ============================================================================
# INTEGRATION: Connection to ADR-0033c (Process Sandbox)
# ============================================================================

integration_with_process_sandbox:
  overview: |
    Stdio transport is a communication mechanism INDEPENDENT of the
    execution sandbox. MCP-over-stdio works with ANY sandbox:
    - Process sandbox (PRIMARY: ADR-0033c, 80% adoption)
    - WASM sandbox (10% adoption, via WASM interface)
    - Container sandbox (5% adoption)

  process_sandbox_integration:
    spawning:
      - K1 ToolExecutionSelector chooses MCP + Process sandbox
      - Spawns process in namespace (chroot, cgroup, iptables setup)
      - Captures subprocess stdin/stdout
      - Wraps in StdioTransport

    supervision:
      - K1 Supervisor monitors process health (ADR-0033c)
      - Health checks (initialization, liveness, responsiveness)
      - Crash detection + blacklist
      - Graceful/force shutdown
      - Stdio transport hooks into lifecycle events

    termination:
      - Transport receives shutdown signal
      - Closes stdin (EOF to process)
      - Waits for graceful exit (SIGTERM, 5s timeout)
      - Force kills if needed (SIGKILL, 2s timeout)
      - Cleans up file descriptors
      - Reports status to Supervisor

  security_integration:
    network_isolation:
      - Process network restricted by iptables (ADR-0032)
      - Stdio is IPC (same host, kernel bypass)
      - No network exposure from stdio transport

    filesystem_isolation:
      - Process filesystem restricted by chroot/seccomp (ADR-0032)
      - Stdio inherits parent's mutable filesystem
      - No additional filesystem risk

    resource_limits:
      - Process resource limits enforced by cgroups (ADR-0032)
      - Stdio transport does not allocate memory in sandboxed process
      - Only stdio buffers (minimal overhead)

# ============================================================================
# DEPLOYMENT & CONFIGURATION
# ============================================================================

configuration:
  yaml_section: "k1/config/tools/mcp_transports.yml"
  config_example: |
    mcp_stdio_transport:
      enabled: true
      max_processes_per_tool: 3  # Pooling (TODO for future)
      process_timeout_seconds: 5  # Graceful shutdown
      force_kill_timeout_seconds: 2
      max_message_size_bytes: 16777216  # 16 MB
      encoding: "utf-8"
      line_ending: "lf"
      health_check:
        enabled: true
        initialization_timeout_seconds: 5
        liveness_check_interval_seconds: 60
        responsiveness_timeout_seconds: 3
      observability:
        metrics_enabled: true
        tracing_enabled: true
        logging_level: "INFO"

  environment_setup: |
    When spawning MCP server process:
    1. Set K1_TRACE_ID (correlation ID)
    2. Set K1_TOOL_ID (tool identifier)
    3. Set K1_BAND (privacy band: GREEN/AMBER/RED/BLACK)
    4. Set K1_LOG_LEVEL (DEBUG/INFO/WARNING/ERROR)
    5. Set PATH to include /usr/local/bin (for shell commands)
    6. Clear untrusted env vars (PYTHONPATH, LD_PRELOAD, etc.)
    7. Set working directory to tool-specific or K1_TOOL_ROOT

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  rule_1: |
    RULE: Stdio transport MUST use newline-delimited JSON framing
    ENFORCEMENT: On every write, append LF (0x0A)
    RATIONALE: Message boundary detection (no length-prefix overhead)

  rule_2: |
    RULE: All JSON-RPC messages MUST conform to RFC 2.0
    ENFORCEMENT: Validate schema before processing
    RATIONALE: Interoperability with any JSON-RPC 2.0 server

  rule_3: |
    RULE: Request IDs MUST be unique within transport lifetime
    ENFORCEMENT: Use UUID v4 or atomic counter
    RATIONALE: Response matching (no collisions)

  rule_4: |
    RULE: Max message size MUST be enforced (16MB)
    ENFORCEMENT: Reject lines >16MB without LF, close transport
    RATIONALE: DoS protection (prevent unbounded buffering)

  rule_5: |
    RULE: Process MUST be terminated on transport close
    ENFORCEMENT: On transport.close(), send SIGTERM, wait 5s, SIGKILL
    RATIONALE: Resource cleanup (no zombie processes)

  rule_6: |
    RULE: Stdio transport MUST not retry failed requests automatically
    ENFORCEMENT: Return error to caller, let ToolExecutionSelector retry
    RATIONALE: Centralized retry logic (consistent fallback behavior)

# ============================================================================
# COMPARISON: Stdio vs HTTP Transport
# ============================================================================

comparison:
  stdio_vs_http:
    stdio_transport:
      latency: "< 5ms (IPC, no network)"
      throughput: "> 1000 req/sec"
      startup: "< 100ms"
      adoption: "70% of MCP tools"
      use_case: "Native process, high performance"
      complexity: "Medium (process management, signal handling)"
      security: "High (no network exposure)"

    http_transport:
      latency: "< 10ms (network, even localhost)"
      throughput: "> 500 req/sec"
      startup: "< 500ms (server startup + network)"
      adoption: "10% of MCP tools"
      use_case: "Remote servers, stateless APIs"
      complexity: "Low (standard HTTP client)"
      security: "Lower (network exposure, but with auth/TLS)"

# ============================================================================
# EXAMPLES: Stdio Transport in Action
# ============================================================================

examples:
  example_1_successful_request_response:
    title: "Successful MCP call over stdio"
    flow: |
      1. Client sends request to stdio transport
      2. Transport serializes to JSON, appends LF, writes to stdin
      3. MCP server process receives line on stdin
      4. Server processes request
      5. Server writes JSON response + LF to stdout
      6. Transport reads response line from stdout
      7. Transport parses JSON, validates schema
      8. Transport matches response ID to request
      9. Transport resolves future with result
      10. Await-ing client code receives result

    code_pseudocode: |
      # Client code
      client = MCPClient(transport=StdioTransport(...))
      await client.initialize()

      # Make a tool call
      result = await client.call_tool(
          tool_id="weather_api",
          arguments={"city": "SF"}
      )
      # Returns: {"temperature": 72, "condition": "sunny"}

      # Under the hood:
      # 1. client sends: {"jsonrpc":"2.0","method":"tools/call","params":{...},"id":1}\n
      # 2. server responds: {"jsonrpc":"2.0","result":{...},"id":1}\n
      # 3. transport matches id=1, resolves future
      # 4. client.call_tool() returns result

  example_2_timeout_and_fallback:
    title: "Request timeout, triggers fallback cascade"
    flow: |
      1. Client sends request (3s timeout)
      2. MCP server process hangs (infinite loop)
      3. After 3s, timeout fires
      4. Transport rejects request promise with TimeoutError
      5. Caller (ToolExecutionSelector) catches timeout
      6. ToolExecutionSelector.execute() catches TimeoutError
      7. Fallback logic: Move to Fallback Stage 2 (try different sandbox)
      8. Eventually succeeds or returns final error

    code_pseudocode: |
      # Client code
      try:
          result = await asyncio.wait_for(
              client.call_tool(...),
              timeout=3.0
          )
      except asyncio.TimeoutError:
          # Timeout! Trigger fallback
          # ToolExecutionSelector.execute() handles retry/fallback

  example_3_process_crash:
    title: "MCP server process crashes"
    flow: |
      1. Client has ongoing request
      2. Process crashes (segfault, exit code 139)
      3. Transport detects exit via process.poll()
      4. Transport sets status to CRASHED
      5. Transport completes all pending requests with ProcessCrashedError
      6. Caller catches ProcessCrashedError
      7. ToolExecutionSelector.execute() catches and triggers fallback
      8. Eventually retries with different combination or reports error

    code_pseudocode: |
      # Transport code (event loop)
      while True:
          result = process.poll()  # Non-blocking check
          if result is not None:
              # Process exited with code: result
              self.status = "CRASHED"
              for pending_req in self.pending_requests.values():
                  pending_req.set_exception(ProcessCrashedError(...))
              break
