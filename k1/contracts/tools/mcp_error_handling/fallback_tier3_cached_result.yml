# Fallback Tier 3: Cached Result
# Purpose: Define Tier 3 fallback strategy - serve stale K0 cached result
# Source ADR: 0034d-mcp-error-handling.md (lines 1201-1400)
# Version: 1.0

component_name: "FallbackTier3Cached"
version: "1.0"
description: "Serve cached K0 result (5-60 minutes old, 60% success rate)"

references:
  adr: ["0034d"]
  contracts: ["error_classification_3_categories"]

tier3_overview:
  name: "Cached Result"
  purpose: "Return stale cached result from K0"
  applicable_errors: "TRANSIENT or PERMANENT or CRITICAL"
  success_rate_production: "60%"
  cache_age_range: [300, 3600]
  cache_age_range_minutes: [5, 60]

  entry_conditions:
    - tier2_exhausted: "true"
    - cached_result_available: "true"
    - cache_not_expired: "true"

  next_tier_on_failure: "Tier 4 (Graceful Degradation)"

cache_storage:
  backend: "K0 (external cache service)"
  key_format: "tool_id:params_hash:timestamp"
  expiration:
    max_age_seconds: 3600
    typical_age_seconds: 900

  cache_examples:
    weather_nyc:
      key: "weather_api:NYC:location_hash"
      value: "{'temp': 72F, 'humidity': 65%}"
      age: "25 minutes"

    calendar_today:
      key: "calendar_api:today:user_hash"
      value: "[{event: 'Meeting 2pm'}, {event: 'Lunch 12pm'}]"
      age: "5 minutes"

cached_result_lookup:
  algorithm: "Lookup cache key and retrieve if not expired"
  key_construction: |
    cache_key = f"{tool_id}:{hash(params)}:{timestamp}"
    result = k0_cache.get(cache_key)
    if result and result.age < max_age_seconds:
      return result

  on_cache_miss: "No cached result, go to Tier 4"
  on_cache_expired: "Cache older than 60min, go to Tier 4"

cache_staleness_policy:
  acceptable_age_seconds: 3600
  acceptable_age_minutes: 60

  age_brackets:
    0_5_min:
      staleness: "Very fresh"
      confidence: "95%"

    5_15_min:
      staleness: "Fresh"
      confidence: "85%"

    15_30_min:
      staleness: "Slightly stale"
      confidence: "70%"

    30_60_min:
      staleness: "Moderately stale"
      confidence: "50%"

tier3_algorithm:
  step1_construct_key: "Build cache key from tool_id + params"
  step2_lookup_cache: "Query K0 for cached value"
  step3_check_expiration: "Verify cache age < 60 minutes"
  step4_cache_valid: "If found and fresh, return cached result"
  step5_cache_invalid: "If expired or not found, go to Tier 4"

pseudocode:
  code: |
    async def try_cached_result(tool_id, params):
      # Construct cache key
      key = f"{tool_id}:{hash(params)}"

      # Lookup in K0
      cached = await k0_cache.get(key)
      if not cached:
        return None  # Not in cache

      # Check expiration
      age_seconds = time.time() - cached.timestamp
      if age_seconds > 3600:  # 60 minutes
        return None  # Too old

      # Return cached result
      return cached.value

production_statistics:
  total_attempts: 2400
  successful_cached: 1440
  success_rate: "60%"
  avg_cache_age_minutes: 15

  by_age_bracket:
    "0-5_min": "95% success"
    "5-15_min": "85% success"
    "15-30_min": "70% success"
    "30-60_min": "50% success"

cache_invalidation:
  triggers:
    - user_action: "User calls tool to refresh"
    - time_based: "Cache expires after 60 minutes"
    - manual: "Admin purge cache"

  invalidation_time: "Immediate"

cache_quality_indicators:
  metadata_attached_to_cached_result:
    - age_seconds: "How old is the cache"
    - source_tool_id: "Which tool produced this"
    - timestamp: "When was this cached"
    - user_facing_note: "Optional note about staleness"

user_communication:
  when_serving_cached:
    message: "Using cached result from {age} ago"
    example: "Using cached weather from 15 minutes ago"
    transparency: "Always disclose cache age"

error_handling_in_tier3:
  on_cache_miss:
    condition: "No cached result available"
    action: "Go to Tier 4 (graceful degradation)"

  on_cache_expired:
    condition: "Cache older than 60 minutes"
    action: "Go to Tier 4 (graceful degradation)"

  on_cache_corruption:
    condition: "Cached value unparseable"
    action: "Log error, go to Tier 4"

integration_with_fallback_strategy:
  entry_condition: "Tier 2 exhausted or CRITICAL error"
  success_exit: "Return cached result to caller"
  failure_exit: "Cache miss or expired, go to Tier 4"

timing:
  tier3_latency: "<50ms (cache lookup)"
  typical_duration: "1-50ms"

metrics:
  prometheus_counters:
    - name: "tier3_attempts_total"
      labels: ["tool_id"]
    - name: "tier3_success_total"
      labels: ["tool_id"]
    - name: "tier3_cache_hits"
      labels: ["tool_id", "age_bracket"]
    - name: "tier3_cache_misses"
      labels: ["tool_id"]

logging:
  log_tier3_attempt:
    - tier: "3"
    - tool_id
    - cache_age_seconds
    - cache_hit: true/false
    - trace_id

  log_tier3_result:
    - success: true/false
    - cache_age_minutes
    - result_served: true/false

testing_requirements:
  - test_tier3_cache_hit: "Cached result found and returned"
  - test_tier3_cache_miss: "No cache, go to Tier 4"
  - test_tier3_cache_expired: "Cache >60min, go to Tier 4"
  - test_tier3_cache_age_metadata: "Cache age properly tracked"
  - test_tier3_cache_lookup_latency: "<50ms"

compliance:
  adr_0034d_sections: ["Fallback Tier 3 (Cached Result)", "Production statistics (60% success)"]

changelog:
  "1.0": "Initial contract - Fallback Tier 3 (Cached result)"
