# Fallback Tier 1: Retry (Same Tool)
# Purpose: Define Tier 1 fallback strategy - retry same tool with exponential backoff
# Source ADR: 0034d-mcp-error-handling.md (lines 801-1000)
# Version: 1.0

component_name: "FallbackTier1Retry"
version: "1.0"
description: "Retry same tool with exponential backoff (85% success rate)"

references:
  adr: ["0034d"]
  contracts: ["error_classification_3_categories", "retry_strategy_exponential_backoff"]

tier1_overview:
  name: "Retry (Same Tool)"
  purpose: "Retry the same tool that failed"
  applicable_errors: "TRANSIENT errors only"
  success_rate_production: "85%"

  conditions:
    - error_category: "TRANSIENT"
    - retry_count: "< 3"
    - circuit_breaker_state: "Not OPEN"

  next_tier_on_failure: "Tier 2 (Alternative Tool)"

tier1_algorithm:
  step1_classify_error: "If TRANSIENT, attempt retry"
  step2_check_conditions: "Verify not over limit, CB not OPEN"
  step3_calculate_backoff: "1s, 2s, 4s, 8s + jitter"
  step4_sleep: "Wait exponential backoff time"
  step5_retry_execution: "Execute same tool call again"
  step6_on_success: "Return result to caller"
  step7_on_failure: "Increment retry_count, loop to step 2"

pseudocode:
  code: |
    async def retry_same_tool(tool_call, error, retry_count):
      if error.category != TRANSIENT:
        return None  # Not retryable

      if retry_count >= 3:
        return None  # Exhausted retries

      if circuit_breaker.is_open(error.tool_id):
        return None  # CB open, skip retry

      # Calculate backoff
      base_delays = [1, 2, 4, 8]
      delay = base_delays[retry_count] + random.uniform(0, 0.5)

      await asyncio.sleep(delay)

      # Retry execution
      try:
        result = await execute_tool(tool_call, timeout)
        return result  # Success!
      except Exception as e:
        # Will be handled by next tier
        return None

production_statistics:
  total_attempts: 12000
  successful_retries: 10200
  success_rate: "85%"
  avg_retry_delay_seconds: 2.5

  by_retry_attempt:
    retry_1: "80% success (1s delay)"
    retry_2: "90% success (2s delay)"
    retry_3: "75% success (4s delay)"

error_handling_in_tier1:
  on_transient_error_again:
    condition: "Retry also gets TRANSIENT error"
    action: "Check if retry_count < 3"
    result: "Continue retry loop"

  on_permanent_error:
    condition: "Retry gets PERMANENT error"
    action: "Stop retrying, go to Tier 2"
    result: "Try alternative tool"

  on_critical_error:
    condition: "Retry gets CRITICAL error"
    action: "Stop retrying, go to Tier 3/4"
    result: "Try cached or graceful"

integration_with_fallback_strategy:
  entry_condition: "Error classified as TRANSIENT"
  execution_order: "First tier to attempt"
  success_exit: "Return result, skip remaining tiers"
  failure_exit: "After 3 retries exhausted, go to Tier 2"
  timeout_during_retry: "Counts as retry, not separate attempt"

timing:
  tier1_max_duration: "15 seconds (all 3 retries)"
  typical_duration: "3-5 seconds (1 successful retry)"

  latency_breakdown:
    attempt_1: "Original call (up to 30s timeout)"
    wait_1: "1s + jitter"
    attempt_2: "Retry 1 (up to 30s timeout)"
    wait_2: "2s + jitter"
    attempt_3: "Retry 2 (up to 30s timeout)"
    total_max: "~90 seconds if all attempts max out"

metrics:
  prometheus_counters:
    - name: "tier1_attempts_total"
      labels: ["tool_id"]
    - name: "tier1_success_total"
      labels: ["tool_id"]
    - name: "tier1_duration_seconds"
      type: "Histogram"
      labels: ["tool_id"]

logging:
  log_tier1_attempt:
    - tier: "1"
    - tool_id
    - error_code
    - retry_count
    - backoff_delay_ms
    - trace_id

  log_tier1_result:
    - success: true/false
    - duration_seconds
    - total_attempts

testing_requirements:
  - test_tier1_retry_success: "TRANSIENT error, retry succeeds"
  - test_tier1_retry_exhausted: "After 3 retries, move to Tier 2"
  - test_tier1_backoff_timing: "Verify 1s, 2s, 4s delays"
  - test_tier1_circuit_breaker_skip: "OPEN CB skips Tier 1"
  - test_tier1_permanent_error: "PERMANENT error skips Tier 1"

compliance:
  adr_0034d_sections: ["Fallback Tier 1 (Retry)", "Production statistics (85% success)"]

changelog:
  "1.0": "Initial contract - Fallback Tier 1 (Retry same tool)"
