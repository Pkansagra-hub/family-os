# Error Propagation and Logging
# Purpose: Define K0 logging, Prometheus metrics, and audit trail for errors
# Source ADR: 0034d-mcp-error-handling.md (lines 1801-2000)
# Version: 1.0

component_name: "ErrorPropagationLogging"
version: "1.0"
description: "K0 audit logging, Prometheus metrics, and OpenTelemetry tracing for errors"

references:
  adr: ["0034d"]
  contracts: ["error_classification_3_categories"]

error_logging_to_k0:
  purpose: "Immutable audit trail of all tool errors"
  backend: "K0 (external logging service)"
  retention: "90 days minimum"

  logged_on_every_error:
    - error_code: "Numeric error code"
    - error_category: "TRANSIENT | PERMANENT | CRITICAL"
    - tool_id: "Tool that generated error"
    - tool_method: "Tool method called (tools/call)"
    - parameters: "Request parameters (sanitized)"
    - timestamp: "When error occurred"
    - duration_ms: "How long execution took before error"
    - trace_id: "Unique trace ID for this request"
    - user_id: "Who triggered this (for support)"
    - session_id: "Session context"
    - fallback_tier_attempted: "Which tier(s) attempted"
    - final_result: "What was returned to user"

structured_logging_format:
  format: "JSON"
  example: |
    {
      "timestamp": "2025-01-14T10:30:45.123Z",
      "trace_id": "req-abc123-xyz",
      "error_code": 1001,
      "error_category": "TRANSIENT",
      "tool_id": "weather_api",
      "message": "Connection timeout",
      "duration_ms": 30500,
      "retry_count": 2,
      "fallback_tier": 2,
      "final_result": "cached_data",
      "user_id": "user123",
      "session_id": "session456"
    }

prometheus_metrics:
  categories:
    - name: "errors_total"
      type: "Counter"
      description: "Total errors by tool and category"
      labels: ["tool_id", "error_code", "category"]

    - name: "errors_by_category"
      type: "Counter"
      description: "Error counts by category"
      labels: ["category"]

    - name: "error_duration_ms"
      type: "Histogram"
      description: "Latency from start to error"
      labels: ["tool_id", "error_code"]
      buckets: [10, 50, 100, 500, 1000, 3000, 5000, 10000]

    - name: "retry_success_total"
      type: "Counter"
      description: "Retries that succeeded"
      labels: ["tool_id"]

    - name: "retry_exhausted_total"
      type: "Counter"
      description: "Retries exhausted"
      labels: ["tool_id"]

    - name: "fallback_tier_usage"
      type: "Counter"
      description: "Usage of each fallback tier"
      labels: ["tier", "success"]

    - name: "fallback_success_rate"
      type: "Gauge"
      description: "Success rate per tier"
      labels: ["tier"]

    - name: "circuit_breaker_state"
      type: "Gauge"
      description: "CB state per tool"
      labels: ["tool_id", "state"]

opentelemetry_tracing:
  trace_id_propagation: "All log entries include trace_id"
  span_hierarchy:
    - span_name: "tool_execution"
      events:
        - "execution_started"
        - "error_detected"
        - "fallback_tier_1_attempted"
        - "fallback_tier_2_attempted"
        - "fallback_tier_3_attempted"
        - "fallback_tier_4_executed"
        - "execution_completed"

      span_attributes:
        - tool_id
        - error_code
        - retry_count
        - fallback_tier
        - result_source (primary/retry/alternative/cached/graceful)

logging_triggers:
  on_error_classification: "Log error with trace_id"
  on_retry_attempt: "Log retry #N with backoff delay"
  on_retry_success: "Log successful retry"
  on_tier_transition: "Log fallback tier change"
  on_tier_success: "Log tier result"
  on_execution_complete: "Log final result and latency"

k0_query_examples:
  get_all_errors_for_tool:
    query: "SELECT * FROM errors WHERE tool_id='weather_api' ORDER BY timestamp DESC LIMIT 100"
    use_case: "Debug tool failures"

  get_retry_success_rate:
    query: "SELECT COUNT(*) as total, SUM(CASE WHEN succeeded THEN 1 ELSE 0 END) as successes FROM retries WHERE tool_id='weather_api' AND timestamp > now()-24h"
    use_case: "Monitor retry effectiveness"

  get_fallback_tier_usage:
    query: "SELECT tier, COUNT(*) as usage_count FROM fallback_events WHERE timestamp > now()-7d GROUP BY tier"
    use_case: "Understand fallback effectiveness"

  get_errors_by_user:
    query: "SELECT user_id, COUNT(*) as error_count FROM errors GROUP BY user_id ORDER BY error_count DESC LIMIT 10"
    use_case: "Support investigations"

performance_profiling:
  metric: "error_duration_ms"
  sla: "Error should be detected <10ms after occurrence"
  tracked_latencies:
    - error_classification: "<0.1ms"
    - retry_scheduling: "<1ms"
    - fallback_tier_selection: "<1ms"
    - tier_execution: "varies (retry 15s, alternative 30s, cached 50ms)"

error_sampling:
  approach: "Log 100% of errors (zero sampling)"
  rationale: "Errors are rare and important to diagnose"
  exception: "If error rate >1000/min, may sample"

personally_identifiable_information:
  policy: "Sanitize PII in logs"
  examples:
    - email_addresses: "***@example.com"
    - phone_numbers: "***-****"
    - user_ids: "hash instead of actual ID"

  parameters_in_logs:
    - sensitive_data: "Hash or redact"
    - location: "May keep (useful for debugging)"
    - timestamps: "Keep (needed for diagnostics)"

access_control:
  k0_logs_readonly: "Engineering only"
  audit_logs_available: "Support team"
  prometheus_metrics_public: "Available to monitoring dashboards"

retention_policies:
  k0_error_logs: "90 days"
  prometheus_metrics: "30 days (default)"
  opentelemetry_traces: "7 days"
  audit_logs: "180 days"

alerting_rules:
  alert_high_error_rate:
    condition: "errors_total > 100 per minute"
    severity: "P1"

  alert_retry_exhausted:
    condition: "retry_exhausted_total > 10 per minute"
    severity: "P2"

  alert_circuit_breaker_open:
    condition: "circuit_breaker_state == OPEN for >5 minutes"
    severity: "P2"

  alert_high_latency_errors:
    condition: "error_duration_ms p95 > 10000"
    severity: "P3"

dashboards:
  error_overview:
    charts:
      - "Errors by category (TRANSIENT/PERMANENT/CRITICAL)"
      - "Error rate over time"
      - "Top 10 error codes"
      - "Retry success rate"

  fallback_effectiveness:
    charts:
      - "Tier 1 success rate"
      - "Tier 2 success rate"
      - "Tier 3 success rate"
      - "Tier 4 graceful rate"

  circuit_breaker_health:
    charts:
      - "Tools in OPEN state"
      - "Cooldown time remaining"
      - "Probe success rate"

support_investigations:
  trace_id_lookup: "Search K0 by trace_id"
  user_id_lookup: "Find all errors for user"
  tool_debugging: "View errors by tool_id"
  time_range_analysis: "Errors in specific time window"

testing_requirements:
  - test_k0_logging: "Errors logged to K0"
  - test_prometheus_metrics: "Metrics emitted correctly"
  - test_trace_id_propagation: "trace_id in all logs"
  - test_pii_sanitization: "Sensitive data redacted"
  - test_retention_policies: "Logs retained correctly"
  - test_alerting_rules: "Alerts trigger on thresholds"

compliance:
  adr_0034d_sections: ["Error propagation and logging", "K0 audit trail", "Prometheus metrics"]

changelog:
  "1.0": "Initial contract - Error propagation logging (K0, Prometheus, OpenTelemetry)"
