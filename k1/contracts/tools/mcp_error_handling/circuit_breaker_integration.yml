# Circuit Breaker Integration
# Purpose: Define circuit breaker integration with fallback strategy
# Source ADR: 0034d-mcp-error-handling.md (lines 1601-1700)
# Version: 1.0

component_name: "CircuitBreakerIntegration"
version: "1.0"
description: "Integrate circuit breaker with fallback strategy (OPEN skips Tier 1, HALF_OPEN allows probe)"

references:
  adr: ["0034d"]
  contracts: ["error_classification_3_categories"]

circuit_breaker_states:
  CLOSED:
    description: "Normal operation, all tiers available"
    tier1_retry: "Allowed"
    tier2_alternative: "Allowed"
    transition_to_OPEN: "After 5 consecutive failures"

  OPEN:
    description: "Tool failing repeatedly, circuit open"
    tier1_retry: "SKIPPED (fail-fast)"
    tier2_alternative: "Allowed (required entry point)"
    transition_to_HALF_OPEN: "After cooldown_seconds"

  HALF_OPEN:
    description: "Probing if tool recovered"
    tier1_retry: "ALLOWED (single probe)"
    tier2_alternative: "Allowed (backup)"
    transition_to_CLOSED: "If probe succeeds"
    transition_to_OPEN: "If probe fails"

state_transitions:
  CLOSED_to_OPEN:
    trigger: "5 failures in rolling window"
    action: "Stop sending traffic to tool"
    cooldown: "cooldown_seconds (default 60)"

  OPEN_to_HALF_OPEN:
    trigger: "cooldown_seconds elapsed"
    action: "Allow single probe retry"

  HALF_OPEN_to_CLOSED:
    trigger: "Probe succeeds"
    action: "Resume normal traffic"

  HALF_OPEN_to_OPEN:
    trigger: "Probe fails"
    action: "Return to OPEN, extend cooldown"

circuit_breaker_config_per_tool:
  weather_api:
    failure_threshold: 5
    rolling_window_seconds: 60
    cooldown_seconds: 60

  calendar_api:
    failure_threshold: 3
    rolling_window_seconds: 60
    cooldown_seconds: 120

  video_transcoder:
    failure_threshold: 1
    rolling_window_seconds: 60
    cooldown_seconds: 300

tier1_behavior_with_circuit_breaker:
  if_cb_closed:
    action: "Retry with exponential backoff"
    max_retries: 3

  if_cb_open:
    action: "SKIP retry, go directly to Tier 2"
    rationale: "Tool known to be failing, don't waste time retrying"

  if_cb_half_open:
    action: "ALLOW 1 retry (probe)"
    rationale: "Testing if tool recovered"
    max_retries: 1

tier2_behavior_with_circuit_breaker:
  if_cb_any_state:
    action: "Always try alternative (Tier 2 entry point)"
    rationale: "Circuit breaker only affects original tool, not alternative"

pseudocode_tier1_with_cb:
  code: |
    async def execute_with_retry_and_cb(tool_id, tool_call):
      cb_state = circuit_breaker.get_state(tool_id)

      if cb_state == OPEN:
        # Skip retry, go to alternative
        return None  # Skip Tier 1, go to Tier 2

      if cb_state == HALF_OPEN:
        max_retries = 1  # Single probe
      else:  # CLOSED
        max_retries = 3  # Normal retries

      for attempt in range(max_retries + 1):
        try:
          result = await execute_tool(tool_id, tool_call)
          circuit_breaker.record_success(tool_id)
          return result
        except Exception as e:
          circuit_breaker.record_failure(tool_id)
          if not should_retry(e, attempt, max_retries):
            break

      return None  # Retries exhausted, go to Tier 2

failure_recording:
  triggered_on:
    - Exception during tool execution
    - Timeout during tool call
    - Tool process crash

  recorded_data:
    - timestamp
    - failure_count
    - rolling_window
    - state_transition

success_recording:
  triggered_on:
    - Successful tool execution
    - HALF_OPEN probe succeeds

  recorded_data:
    - timestamp
    - consecutive_success_count
    - reset_failure_counter: true

metrics:
  prometheus_counters:
    - name: "circuit_breaker_state_transitions"
      labels: ["tool_id", "from_state", "to_state"]
    - name: "circuit_breaker_failures"
      labels: ["tool_id"]
    - name: "circuit_breaker_probes"
      labels: ["tool_id", "success"]

integration_with_fallback_strategy:
  tier1_entry_decision: "Check CB state before Tier 1"
  tier1_skip_condition: "CB OPEN"
  tier1_probe_condition: "CB HALF_OPEN (single retry allowed)"

  fallback_sequence_with_cb:
    step1: "Check CB state for primary tool"
    step2: "If OPEN, skip Tier 1 retry, go to Tier 2"
    step3: "If CLOSED, attempt Tier 1 retry"
    step4: "If HALF_OPEN, attempt 1 probe retry"
    step5: "On success, restore tool (CLOSED)"
    step6: "On failure, go to Tier 2 (alternative)"

logging:
  log_circuit_breaker_event:
    - tool_id
    - state_transition: (OLD → NEW)
    - failure_count
    - cooldown_remaining_seconds
    - trace_id

examples:
  example_1:
    scenario: "Tool failing (5+ failures)"
    cb_state: "CLOSED → OPEN"
    tier1_behavior: "Skip retry"
    tier2_behavior: "Try alternative"
    result: "User gets alternative tool result"

  example_2:
    scenario: "Circuit breaker cooling down"
    cb_state: "OPEN"
    elapsed: "30 seconds (cooldown 60s)"
    tier1_behavior: "Still skip retry"
    result: "Still using Tier 2 (alternative)"

  example_3:
    scenario: "Cooldown completed"
    cb_state: "OPEN → HALF_OPEN"
    tier1_behavior: "Allow 1 probe retry"
    probe_result: "Success"
    next_state: "HALF_OPEN → CLOSED"
    result: "Tool back in normal rotation"

testing_requirements:
  - test_cb_open_skips_tier1: "OPEN state skips Tier 1"
  - test_cb_half_open_probes: "HALF_OPEN allows 1 retry"
  - test_cb_closed_retries: "CLOSED state allows 3 retries"
  - test_cb_transition_on_failure: "5 failures trigger CLOSED → OPEN"
  - test_cb_transition_on_success: "Probe success triggers HALF_OPEN → CLOSED"
  - test_cb_cooldown: "OPEN state respects cooldown"

compliance:
  adr_0034d_sections: ["Circuit breaker integration with fallback"]

changelog:
  "1.0": "Initial contract - Circuit breaker integration"
