# Error Classification Contract (3 Categories)
# Purpose: Define error classification system (TRANSIENT, PERMANENT, CRITICAL)
# Source ADR: 0034d-mcp-error-handling.md (lines 1-400)
# Version: 1.0
# Status: ACTIVE

component_name: "ErrorClassification"
component_type: "MCP Error Handling"
version: "1.0"
description: "3-category error classification system for MCP tool errors with deterministic retry policies"

references:
  adr: ["0034d", "0034a"]
  contracts: []

error_classification_system:
  categories: 3
  purpose: "Classify errors into TRANSIENT, PERMANENT, or CRITICAL for handling strategy"

category_definitions:
  TRANSIENT:
    description: "Temporary errors that may succeed on retry"
    retry_policy: "Retry 3 times with exponential backoff"
    max_attempts: 4
    backoff_strategy: "exponential (1s, 2s, 4s, 8s)"
    success_rate_production: "85%"
    examples:
      - "Network timeout (connection lost)"
      - "Tool temporarily unavailable (500 error)"
      - "Temporary resource exhaustion"
      - "DNS resolution timeout"
    fallback_tier: "Tier 2 (alternative tool) if retries exhausted"

  PERMANENT:
    description: "Errors that will never succeed on retry"
    retry_policy: "Do not retry"
    max_attempts: 1
    backoff_strategy: "none"
    examples:
      - "Invalid parameters"
      - "Method not found"
      - "Authentication failure"
      - "Unsupported operation"
      - "Parse error in request"
    fallback_tier: "Tier 2 (alternative tool) immediately"

  CRITICAL:
    description: "Errors indicating system-wide issues requiring escalation"
    retry_policy: "Do not retry"
    max_attempts: 1
    backoff_strategy: "none"
    escalation: "true"
    examples:
      - "Tool crashed (SIGSEGV)"
      - "Out of memory"
      - "Tool process killed"
      - "Circuit breaker OPEN"
    fallback_tier: "Tier 3 (cached result) or Tier 4 (graceful)"
    action: "Alert operator, consider disabling tool"

error_codes:
  mapping_strategy: "JSON-RPC error codes → ErrorCategory"
  source: "ADR-0034a (JSON-RPC 2.0 Standard Errors)"

  json_rpc_standard_codes:
    -32700:
      name: "Parse error"
      category: "PERMANENT"
      description: "Invalid JSON was received by the server"

    -32600:
      name: "Invalid Request"
      category: "PERMANENT"
      description: "The JSON sent is not a valid Request object"

    -32601:
      name: "Method not found"
      category: "PERMANENT"
      description: "The method does not exist or is not available"

    -32602:
      name: "Invalid params"
      category: "PERMANENT"
      description: "Invalid method parameter(s)"

    -32603:
      name: "Internal error"
      category: "PERMANENT"
      description: "Internal JSON-RPC error"

  mcp_extended_codes:
    1001:
      name: "NETWORK_TIMEOUT"
      category: "TRANSIENT"
      description: "Connection or request timeout"

    1002:
      name: "NETWORK_UNREACHABLE"
      category: "TRANSIENT"
      description: "Network is unreachable"

    1003:
      name: "DNS_RESOLUTION_FAILED"
      category: "TRANSIENT"
      description: "DNS lookup failed"

    1004:
      name: "TOOL_UNAVAILABLE"
      category: "TRANSIENT"
      description: "Tool returned 503 Service Unavailable"

    2001:
      name: "TOOL_CRASH"
      category: "CRITICAL"
      description: "Tool process crashed or exited abnormally"

    2002:
      name: "TOOL_OUT_OF_MEMORY"
      category: "CRITICAL"
      description: "Tool process ran out of memory"

    2003:
      name: "TOOL_HUNG"
      category: "CRITICAL"
      description: "Tool process stopped responding"

    3001:
      name: "CIRCUIT_BREAKER_OPEN"
      category: "CRITICAL"
      description: "Circuit breaker is OPEN for this tool"

error_classifier_class:
  name: "ErrorClassifier"
  method: "classify(exception, error_code, tool_id)"

  classification_logic:
    step1_check_error_code: "If error_code provided, use code → category mapping"
    step2_check_exception_type: "If no code, map exception type to code to category"
    step3_default_to_permanent: "If unknown, classify as PERMANENT (safest)"

  exception_type_mapping:
    asyncio.TimeoutError:
      code: 1001
      category: "TRANSIENT"

    ConnectionError:
      code: 1002
      category: "TRANSIENT"

    aiohttp.ClientSSLError:
      code: 1002
      category: "TRANSIENT"

    socket.gaierror:
      code: 1003
      category: "TRANSIENT"

    json.JSONDecodeError:
      code: -32700
      category: "PERMANENT"

    ValueError:
      code: -32602
      category: "PERMANENT"

    KeyError:
      code: -32601
      category: "PERMANENT"

    RuntimeError:
      code: -32603
      category: "PERMANENT"

tool_error_dataclass:
  name: "ToolError"
  fields:
    - name: "error_code"
      type: "int"
      description: "Error code (JSON-RPC or MCP extended)"

    - name: "category"
      type: "ErrorCategory"
      description: "TRANSIENT | PERMANENT | CRITICAL"

    - name: "message"
      type: "str"
      description: "Human-readable error message"

    - name: "tool_id"
      type: "str"
      description: "Tool that generated error"

    - name: "trace_id"
      type: "str"
      description: "Unique trace ID for this error"

    - name: "retry_count"
      type: "int"
      description: "Number of retries attempted"

    - name: "timestamp"
      type: "datetime"
      description: "When error occurred"

    - name: "original_exception"
      type: "Exception"
      description: "Original Python exception"

classification_examples:
  example_1:
    trigger: "Tool returns HTTP 500"
    exception: "aiohttp.ClientResponseError(500)"
    code: 1004
    category: "TRANSIENT"
    action: "Retry 3 times"

  example_2:
    trigger: "Invalid JSON parameter passed"
    exception: "ValueError('Invalid parameter')"
    code: -32602
    category: "PERMANENT"
    action: "No retry, go to Tier 2"

  example_3:
    trigger: "Tool process crashed (SIGSEGV)"
    exception: "ProcessCrashed(signal=11)"
    code: 2001
    category: "CRITICAL"
    action: "Alert, skip retries, go to Tier 3/4"

  example_4:
    trigger: "Request timeout (30 seconds)"
    exception: "asyncio.TimeoutError()"
    code: 1001
    category: "TRANSIENT"
    action: "Retry 3 times"

error_propagation:
  captured_as: "ToolError dataclass"
  stored_in: "ExecutionContext.errors list"
  passed_to: "FallbackStrategy (retry → alternative → cached → graceful)"

metrics_collection:
  prometheus_metrics:
    - name: "errors_total"
      type: "Counter"
      labels: ["tool_id", "error_code", "category"]

    - name: "errors_by_category"
      type: "Counter"
      labels: ["category"]  # TRANSIENT, PERMANENT, CRITICAL

logging:
  log_on_error_classification:
    - error_code
    - category
    - tool_id
    - message
    - trace_id
    - timestamp
    - exception_type

performance_slas:
  error_classification_latency_p95_ms: 0.1
  description: "Classification should be <0.1ms (trivial mapping)"

implementation_notes:
  - "Use dataclass(frozen=True) for immutable ToolError"
  - "Map error codes and exception types to categories deterministically"
  - "Store original exception for debugging"
  - "Log all errors with trace_id for traceability"
  - "Emit Prometheus metrics for error distribution"
  - "Unknown error codes default to PERMANENT (safer than TRANSIENT)"

testing_requirements:
  - test_transient_classification: "HTTP 500 → TRANSIENT"
  - test_permanent_classification: "Invalid params → PERMANENT"
  - test_critical_classification: "Tool crash → CRITICAL"
  - test_code_to_category_mapping: "All error codes map correctly"
  - test_exception_to_category_mapping: "All exception types map correctly"
  - test_default_behavior: "Unknown error → PERMANENT"
  - test_classification_latency: "Classification <0.1ms"

compliance:
  adr_0034d_sections: ["Error classification (3 categories)", "Error codes", "ErrorClassifier class"]
  adr_0034a_references: ["JSON-RPC standard error codes"]

changelog:
  "1.0": "Initial contract - 3-category error classification system"
