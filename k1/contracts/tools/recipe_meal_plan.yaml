# k1/contracts/tools/recipe_meal_plan.yaml
# Recipe Meal Plan Tool Contract (Phase 3 -- Fabric E2E Validation)
#
# MCP tool contract for generating a weekly meal plan.
# AMBER-band write tool. Remote SSE transport via FastMCP.
#
# References:
#   - fabric_tool_implementation_plan.md Phase 3, Section 5.2

tool_contract:
  name: "tool.write.recipe_meal_plan"
  version: "1.0.0"
  domain:
    - "RECIPES"
    - "FAMILY"
  description: >
    Generate a meal plan for a specified number of days.
    Takes preferences, dietary restrictions, and family size
    into account. Returns a structured day-by-day meal plan.
  capabilities:
    - "meal_planning"
    - "dietary_filtering"
  limitations:
    - "api_rate_limited"
    - "plan_is_suggestion_only"

  required_inputs:
    - name: "days"
      type: "NUMBER"
      description: "Number of days to plan (1-7)"
    - name: "servings"
      type: "NUMBER"
      description: "Number of servings per meal"

  optional_inputs:
    - name: "cuisine"
      type: "STRING"
      description: "Preferred cuisine type"
    - name: "dietary"
      type: "STRING"
      description: "Dietary restrictions (e.g. vegetarian, gluten-free)"
      enum:
        - "none"
        - "vegetarian"
        - "vegan"
        - "gluten-free"
        - "dairy-free"

  output:
    type: "object"
    properties:
      plan:
        type: "array"
        description: "Day-by-day meal plan"
        items:
          type: "object"
          properties:
            day:
              type: "number"
            meals:
              type: "array"
              items:
                type: "object"
                properties:
                  meal_type:
                    type: "string"
                  recipe_id:
                    type: "string"
                  title:
                    type: "string"
                  prep_time_min:
                    type: "number"
      days:
        type: "number"
        description: "Number of days in the plan"
      servings:
        type: "number"
        description: "Servings per meal"
    required:
      - "plan"
      - "days"
      - "servings"

  provider_type: "MCP"
  provider_id: "recipes_mcp_sse"
  safety_band_min: "AMBER"
  cost_per_call: 0.0
  avg_latency_ms: 500
  max_latency_ms: 2000
  availability: "ONLINE"
