# Latency Scoring Contract
# Source ADR: ADR-0006b (Multi-Criteria Proposal Scoring Engine)
# Defines latency normalization for proposal scoring

metadata:
  contract_id: "latency-scoring-v1.0"
  source_adr: "0006b-multi-criteria-proposal-scoring-engine.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]
  parent_contract: "scoring-algorithm.yml"

# Latency Scoring Overview
latency_overview:
  description: "Normalize agent latency estimates to 0-1 score"
  purpose: "Evaluate speed factor in proposal scoring"
  component: "Factor 2 in 6-factor scoring (weight=8.0, high priority)"
  performance: "<1ms P95 per proposal"
  determinism: "Same latency estimate → same normalized score"

# Research Foundation
research_foundation:
  latency_context: |
    **Why Latency Matters in Agent Selection**
    - UX Impact: Faster response = better user experience
    - System Load: Slower agents = longer resource contention
    - Budget Constraints: Task deadline may require fast execution
    - Trade-offs: Sometimes slow-but-confident > fast-but-uncertain

  normalization_challenge: |
    **Problem: Different Tasks, Different Latency Budgets**
    - Fishing trip planning: 250ms budget (user can wait)
    - Quick fact lookup: 50ms budget (interactive response needed)
    - Code generation: 3000ms budget (complex task)

    Solution: Normalize agent estimate against task budget
    - normalize(latency) = f(agent_estimate, task_budget)
    - Result: Score 0.0-1.0 regardless of task complexity

  normalization_strategies: |
    **Strategy 1: Linear Interpolation (Simple, Used Here)**
    - If estimate = 0: score = 1.0 (instant)
    - If estimate = budget: score = 0.0 (barely makes it)
    - If estimate = budget/2: score = 0.5 (half budget used)

    **Strategy 2: Soft Threshold (Forgiving)**
    - If estimate < budget*0.5: score = 1.0 (plenty of headroom)
    - If budget*0.5 < estimate < budget: interpolate
    - If estimate > budget: score = 0.0 (missed deadline)

    **Strategy 3: Exponential Decay (Aggressive)**
    - Heavily penalizes estimates near budget
    - Preferred for latency-critical tasks

    We use Strategy 2 (Soft Threshold) as default.

# Latency Normalization Function
normalization_function:

  algorithm_name: "Soft Threshold Latency Normalization"

  pseudocode: |
    def normalize_latency(agent_estimate_ms, task_budget_ms):
        """
        Normalize agent's latency estimate to 0.0-1.0 score.

        Args:
            agent_estimate_ms: Agent's estimated latency in milliseconds
            task_budget_ms: Task's acceptable latency budget in milliseconds

        Returns:
            normalized_score: float in [0.0, 1.0]
        """

        # Safety check: ensure budget is positive
        if task_budget_ms <= 0:
            return 0.0

        # Calculate ratio: how much of budget will be used?
        usage_ratio = agent_estimate_ms / task_budget_ms

        # Apply soft threshold normalization
        if usage_ratio <= 0.5:
            # Good: estimate is <= 50% of budget (plenty of headroom)
            normalized = 1.0
        elif usage_ratio <= 1.0:
            # Fair: estimate is 50-100% of budget (linear interpolation)
            # At 0.5: score=1.0, at 1.0: score=0.0
            normalized = 2.0 - (2.0 * usage_ratio)
        else:
            # Poor: estimate exceeds budget
            normalized = 0.0

        # Clamp to [0.0, 1.0]
        return max(0.0, min(1.0, normalized))

  mathematical_formula: |
    For usage_ratio = estimate / budget:

    score(latency) =
        1.0                    if ratio ≤ 0.5
        2.0 - 2.0 × ratio      if 0.5 < ratio ≤ 1.0
        0.0                    if ratio > 1.0

    Graphically:

    score
      1.0 |●●●●●●●●●●●●●
          |            ╱●
          |          ╱●
      0.5 |        ╱●
          |      ╱●
          |    ╱●
      0.0 |●●●●●●●●●●●●●
          +-----+-----+-----+---- ratio
            0.0   0.5   1.0   1.5

    - Flat at 1.0 until 50% of budget used (forgiving)
    - Linear decline from 50% to 100% (fair)
    - Zero for anything exceeding budget (hard failure)

# Latency Scoring Examples
latency_examples:

  # Example 1: Well Within Budget
  example_1_headroom:
    scenario: "Fishing trip task, 250ms budget"

    agents:
      - agent_id: "concierge"
        estimated_latency_ms: 120
      - agent_id: "planner"
        estimated_latency_ms: 180
      - agent_id: "researcher"
        estimated_latency_ms: 220

    task_budget_ms: 250

    calculations: |
      Concierge:
        usage_ratio = 120 / 250 = 0.48
        0.48 ≤ 0.5 → score = 1.0 (full credit)

      Planner:
        usage_ratio = 180 / 250 = 0.72
        0.5 < 0.72 ≤ 1.0 → score = 2.0 - (2.0 × 0.72) = 2.0 - 1.44 = 0.56

      Researcher:
        usage_ratio = 220 / 250 = 0.88
        0.5 < 0.88 ≤ 1.0 → score = 2.0 - (2.0 × 0.88) = 2.0 - 1.76 = 0.24

    results: |
      Concierge: 1.0 ✅ (120ms is 48% of budget)
      Planner: 0.56 ✓ (180ms is 72% of budget)
      Researcher: 0.24 ⚠ (220ms is 88% of budget)

  # Example 2: Hitting Deadline
  example_2_tight_deadline:
    scenario: "Quick fact lookup, 50ms budget"

    agents:
      - agent_id: "base"
        estimated_latency_ms: 20
      - agent_id: "standard"
        estimated_latency_ms: 40
      - agent_id: "slow"
        estimated_latency_ms: 60

    task_budget_ms: 50

    calculations: |
      Base:
        usage_ratio = 20 / 50 = 0.40
        0.40 ≤ 0.5 → score = 1.0 ✅

      Standard:
        usage_ratio = 40 / 50 = 0.80
        0.5 < 0.80 ≤ 1.0 → score = 2.0 - (2.0 × 0.80) = 2.0 - 1.60 = 0.40 ✓

      Slow:
        usage_ratio = 60 / 50 = 1.20
        1.20 > 1.0 → score = 0.0 ❌ (FAILS budget)

    results: |
      Base: 1.0 ✅ (20ms safe)
      Standard: 0.40 ⚠ (40ms is risky, 80% utilization)
      Slow: 0.0 ❌ (60ms exceeds 50ms budget)

  # Example 3: Complex Task, Generous Budget
  example_3_generous_budget:
    scenario: "Code generation, 3000ms budget"

    agents:
      - agent_id: "fast"
        estimated_latency_ms: 1000
      - agent_id: "standard"
        estimated_latency_ms: 1800
      - agent_id: "thorough"
        estimated_latency_ms: 2500

    task_budget_ms: 3000

    calculations: |
      Fast:
        usage_ratio = 1000 / 3000 = 0.33
        0.33 ≤ 0.5 → score = 1.0 ✅

      Standard:
        usage_ratio = 1800 / 3000 = 0.60
        0.5 < 0.60 ≤ 1.0 → score = 2.0 - (2.0 × 0.60) = 2.0 - 1.20 = 0.80 ✅

      Thorough:
        usage_ratio = 2500 / 3000 = 0.83
        0.5 < 0.83 ≤ 1.0 → score = 2.0 - (2.0 × 0.83) = 2.0 - 1.66 = 0.34 ⚠

    results: |
      Fast: 1.0 ✅ (1000ms is 33% of 3000ms budget)
      Standard: 0.80 ✅ (1800ms is 60% of 3000ms budget, acceptable)
      Thorough: 0.34 ⚠ (2500ms is 83% of 3000ms budget, risky)

  # Example 4: Edge Cases
  example_4_edge_cases:
    scenario: "Various edge cases"

    cases:
      - case: "Instant estimate"
        estimate_ms: 0
        budget_ms: 100
        calculation: "0 / 100 = 0.0 ≤ 0.5 → score = 1.0 ✅"
        result: 1.0

      - case: "Exactly at budget"
        estimate_ms: 100
        budget_ms: 100
        calculation: "100 / 100 = 1.0 (1.0 > 0.5) → score = 2.0 - 2.0 = 0.0 ❌"
        result: 0.0

      - case: "50% of budget (boundary)"
        estimate_ms: 50
        budget_ms: 100
        calculation: "50 / 100 = 0.5 (ratio = 0.5) → score = 1.0 ✅"
        result: 1.0

      - case: "Just over 50% (boundary)"
        estimate_ms: 51
        budget_ms: 100
        calculation: "51 / 100 = 0.51 (0.51 > 0.5) → score = 2.0 - 1.02 = 0.98"
        result: 0.98

      - case: "Way over budget"
        estimate_ms: 500
        budget_ms: 100
        calculation: "500 / 100 = 5.0 (5.0 > 1.0) → score = 0.0 ❌"
        result: 0.0

    interpretation: |
      - Score "cliffs" at 100% budget (hard deadline)
      - Soft threshold at 50% budget (forgiving for fast estimates)
      - Smooth linear decline between 50-100% (fair for mid-range estimates)

# Integration with Scoring Algorithm
scoring_integration:

  factor_2_latency_input: |
    normalized_latency_score (0.0-1.0) from latency normalization

  scoring_contribution: |
    In scoring_algorithm.yml:
    f2_latency = normalize_latency(proposal.estimated_latency_ms, task.budget_ms)
    score_contribution = w_latency × f2_latency
                       = 8.0 × normalized_score

    Examples:
    - Estimate 120ms, budget 250ms → score = 1.0 → contribution = 8.0
    - Estimate 180ms, budget 250ms → score = 0.56 → contribution = 4.48
    - Estimate 250ms, budget 250ms → score = 0.0 → contribution = 0.0

  impact_on_ranking: |
    Example: Fishing trip (250ms budget)
    - Agent A: confidence=0.8, latency=1.0 → 8.0 + 8.0 = 16.0 contribution
    - Agent B: confidence=0.9, latency=0.5 → 9.0 + 4.0 = 13.0 contribution
    - Agent A wins despite lower confidence (faster)

# Alternative Normalization Strategies
alternative_strategies:

  strategy_linear_strict: |
    **Simple Linear Normalization (Strict)**
    score = max(0.0, 1.0 - (estimate / budget))

    - If estimate = 0: score = 1.0
    - If estimate = budget: score = 0.0
    - If estimate = budget/2: score = 0.5

    Issue: No headroom concept, penalizes immediately

  strategy_exponential: |
    **Exponential Decay (Aggressive)**
    score = e^(-estimate / budget)

    - If estimate = 0: score = 1.0
    - If estimate = budget/2: score ≈ 0.606
    - If estimate = budget: score ≈ 0.368
    - If estimate = 2×budget: score ≈ 0.135

    Issue: Nonlinear, hard to tune, less intuitive

  strategy_sigmoid: |
    **Sigmoid Curve (Smooth Transition)**
    score = 1.0 / (1.0 + e^(5×(estimate/budget - 0.6)))

    - Smooth S-curve transition around 60% of budget
    - Never exactly 0.0, always some score

    Issue: No hard cutoff, agents slightly over budget still get points

  decision_soft_threshold: |
    **Why We Chose Soft Threshold:**
    ✓ Intuitive: flat at 1.0 until 50%, then linear decline
    ✓ Forgiving: agents with headroom get full credit
    ✓ Fair: linear decay in critical range (50-100%)
    ✓ Deterministic: hard cutoff at budget
    ✓ Tunable: easy to adjust 0.5 threshold

# Budget Specification
budget_specification:

  task_budget_definition: |
    Each TaskAnnouncement includes latency_budget_ms:

    {
      "task_id": "fish-trip-001",
      "task": "Plan a fishing trip",
      "latency_budget_ms": 250,  # User can wait up to 250ms
      ...
    }

  budget_calibration: |
    - Interactive tasks (chat): 50-200ms
    - Planning tasks: 200-500ms
    - Research tasks: 500-3000ms
    - Batch tasks: 3000+ ms

  budget_in_orchestrator: |
    Orchestrator propagates budget to all agents:

    1. Negotiation phase (50ms): Ask agents for proposals
    2. Each agent receives: task description + latency_budget_ms
    3. Agent estimates how long it will take
    4. Proposal includes: estimated_latency_ms
    5. Selection phase: normalize against budget_ms

# Performance Characteristics
performance:

  time_complexity: "O(1) - single division and comparison"

  performance_breakdown: |
    - Get estimate from proposal: <0.01ms
    - Get budget from task: <0.01ms
    - Calculate ratio: <0.01ms
    - Apply normalization formula: <0.01ms
    - Total: <0.05ms per proposal

  p95_target: "<1ms for all 5 proposals"

# Testing & Validation
testing_validation:

  unit_tests:
    - "Within 50% of budget → score=1.0"
    - "At 50% boundary → score=1.0"
    - "Just over 50% → score < 1.0"
    - "At 100% boundary → score=0.0"
    - "Over 100% budget → score=0.0"
    - "Zero estimate → score=1.0"
    - "Negative estimate (error) → score=0.0"

  property_tests:
    - "Score is deterministic (same input → same output)"
    - "Score in [0.0, 1.0]"
    - "Score is monotonic (slower estimate → lower score)"
    - "Score reaches 1.0 for fast estimates"
    - "Score reaches 0.0 for slow estimates"

  integration_tests:
    - "Proposal ranking with 5 agents (latency only)"
    - "Changing budget changes scores appropriately"
    - "Latency factor weighted correctly in full scoring"

  performance_tests:
    - "Normalize 100 proposals in <1ms"
    - "P95 latency <0.2ms per proposal"

# Configuration
configuration:

  # Soft Threshold Parameters
  threshold_parameters:
    green_zone_ratio: 0.5       # ≤ 50% of budget = full score
    yellow_zone_start: 0.5      # > 50% of budget
    yellow_zone_end: 1.0        # = 100% of budget (red zone start)
    red_zone_threshold: 1.0     # > 100% of budget

  # Tuning for Different Scenarios
  tuning_scenarios:
    latency_critical:
      green_zone_ratio: 0.3     # Tighter threshold (30% instead of 50%)
      description: "For interactive tasks, penalize delays more aggressively"

    latency_flexible:
      green_zone_ratio: 0.7     # Looser threshold (70% instead of 50%)
      description: "For batch tasks, allow closer-to-budget estimates"

