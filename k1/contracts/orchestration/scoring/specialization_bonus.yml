# Specialization Bonus Contract
# Source ADR: ADR-0006b (Multi-Criteria Proposal Scoring Engine)
# Defines domain expertise and parallelism bonus scoring

metadata:
  contract_id: "specialization-bonus-v1.0"
  source_adr: "0006b-multi-criteria-proposal-scoring-engine.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]
  parent_contract: "scoring-algorithm.yml"

# Specialization Bonus Overview
specialization_overview:
  description: "Award bonuses for agent specialization and strategic advantages"
  purpose: "Reward proven specialization and efficient execution strategies"
  component: "Factors 4 & 5 in 6-factor scoring (weights: 3.0 and 2.0)"
  performance: "<1ms P95 per proposal"
  determinism: "Same specialization → same bonus"
  note: |
    **Two separate bonus dimensions:**
    1. Factor 4: Parallelism Bonus (execution strategy) - weight 3.0
    2. Factor 5: Track Record Bonus (historical success) - weight 2.0

# Parallelism Bonus (Factor 4)
parallelism_bonus:

  overview: |
    **What is Parallelism Bonus?**
    - Agents can execute complex tasks in parallel (DAG execution)
    - vs sequential (one step at a time)
    - Parallel execution can be faster overall despite slower per-step
    - Example: Research task with 3 independent web searches
      - Sequential: Search 1 (100ms) + Search 2 (100ms) + Search 3 (100ms) = 300ms total
      - Parallel: All 3 searches (100ms) = 100ms total (3x faster!)

  research_foundation: |
    **Parallelism in Task Execution**
    - DAG (Directed Acyclic Graph) Execution: Identify independent tasks
    - Critical Path Analysis: Shortest path through DAG is execution time
    - Amdahl's Law: Speedup limited by sequential portion
    - Work-stealing schedulers: Balance load across parallel tasks

  strategy_classification: |
    Three execution strategies for tasks:

    1. **Sequential Strategy**
       - Execute steps one at a time
       - Simplest, least overhead
       - Bonus: 0.0
       - Example: "Write one paragraph at a time"

    2. **Hybrid Strategy**
       - Mix of parallel and sequential steps
       - Some steps can run in parallel, others sequential
       - Bonus: +0.5 (half credit)
       - Example: "Research 3 topics in parallel, then synthesize"

    3. **Parallel Strategy**
       - Multiple independent steps in parallel
       - Agent can manage multiple operations simultaneously
       - Bonus: +1.0 (full credit)
       - Example: "Search 5 sources, fetch 10 pages, process all in parallel"

  parallelism_scoring_algorithm: |
    def calculate_parallelism_bonus(proposal):
        """
        Calculate parallelism execution bonus

        Args:
            proposal: Agent proposal with strategy field

        Returns:
            bonus: float 0.0, 0.5, or 1.0
        """
        strategy = proposal.strategy  # "sequential", "hybrid", or "parallel"

        if strategy == "sequential":
            return 0.0
        elif strategy == "hybrid":
            return 0.5
        elif strategy == "parallel":
            return 1.0
        else:
            return 0.0  # Default: no bonus for unknown strategy

  # Parallelism Examples
  parallelism_examples:

    # Example 1: Fishing Trip Scenario
    example_fishing_trip:
      task: "Plan a fishing trip for father and son"

      agent_proposals:
        - agent_id: "concierge"
          strategy: "sequential"
          rationale: |
            - Step 1: Find fishing location
            - Step 2: Check weather
            - Step 3: List gear needed
            - Step 4: Search availability
            (Each step depends on previous)
          bonus: 0.0

        - agent_id: "planner"
          strategy: "parallel"
          rationale: |
            - Step 1A: Find fishing locations (parallel with 1B)
            - Step 1B: Check weather forecast (parallel with 1A)
            - Step 1C: Look up gear requirements (parallel with 1A, 1B)
            - Step 2: Synthesize results (depends on 1A, 1B, 1C)
            (Steps 1A, 1B, 1C can run in parallel)
          bonus: 1.0

        - agent_id: "researcher"
          strategy: "hybrid"
          rationale: |
            - Step 1: Research fishing locations (can parallel with 2)
            - Step 2: Research equipment (parallel with 1)
            - Step 3: Check local regulations (depends on 1)
            - Step 4: Plan itinerary (depends on 1, 2, 3)
            (Some parallelism, but ultimately sequential)
          bonus: 0.5

      scoring_impact: |
        In scoring_algorithm.yml:
        w_parallelism = 3.0

        Concierge:   3.0 × 0.0 = 0.0 (no bonus)
        Planner:     3.0 × 1.0 = 3.0 (full bonus)
        Researcher:  3.0 × 0.5 = 1.5 (half bonus)

        Impact: Planner gains 3.0 points from parallelism bonus
                Researcher gains 1.5 points from parallelism bonus

    # Example 2: Data Processing Task
    example_data_processing:
      task: "Analyze 10 CSV files and generate report"

      agent_proposals:
        - agent_id: "processor"
          strategy: "sequential"
          rationale: "Load CSV 1, process, load CSV 2, process, ... (10 × 100ms = 1000ms)"
          bonus: 0.0

        - agent_id: "parallel_processor"
          strategy: "parallel"
          rationale: "Load all 10 CSVs in parallel, process all in parallel (100ms total)"
          bonus: 1.0
          speedup_factor: "10x faster than sequential!"

      scoring_impact: |
        For 250ms latency budget:
        - Sequential agent: 1000ms estimate (over budget, fails)
        - Parallel agent: 100ms estimate (under budget, fast)

        Parallel wins on both latency AND parallelism factors

  # Integration with Scoring
  parallelism_factor_integration: |
    Factor 4 Parallelism Contribution:
    w_parallelism = 3.0 (medium priority)

    In full scoring formula:
    score_contribution = 3.0 × bonus
                       = 0.0 (sequential)
                       = 1.5 (hybrid)
                       = 3.0 (parallel)

    Combined with latency:
    - Parallel strategy often enables faster execution (higher latency score)
    - Parallelism bonus adds additional 3.0 points
    - Can overcome other factors (e.g., slightly higher cost)

# Track Record Bonus (Factor 5)
track_record_bonus:

  overview: |
    **What is Track Record?**
    - Historical success rate of agent on similar tasks
    - Agents improve over time through learning loop
    - Proven agents = lower risk of failure
    - Weight: 2.0 (lowest of positive factors, but still important)

  data_sources: |
    Track record data comes from:
    1. **Learning Loop Memory:** Success/failure history
    2. **Agent Context:** Agent's scoring profile (see personality contracts)
    3. **SessionState Beliefs:** Past performance in current session

    Stored in agent context:
    {
      "agent_id": "planner",
      "success_rate": 0.88,
      "total_tasks": 250,
      "success_count": 220,
      "failure_count": 30,
      "last_updated": "2025-10-15T10:00:00Z",
      "domain_specializations": ["planning", "itinerary", "travel"]
    }

  track_record_scoring_algorithm: |
    def calculate_track_record_score(agent_context):
        """
        Calculate track record score for agent

        Args:
            agent_context: Agent's historical context

        Returns:
            score: float 0.0-1.0
        """
        # Option 1: Direct success rate
        if agent_context.total_tasks > 0:
            success_rate = agent_context.success_count / agent_context.total_tasks
            return success_rate

        # Option 2: With confidence intervals (for new agents)
        if agent_context.total_tasks < 5:
            # New agent: assume neutral starting point with confidence adjustment
            confidence_adjustment = 0.8  # 80% credit for unknown agents
            return confidence_adjustment

        # Use historical success rate
        return agent_context.success_rate

  track_record_examples:

    # Example 1: Proven Agent
    example_proven:
      agent_id: "planner"
      total_tasks: 250
      success_count: 220
      failure_count: 30
      success_rate: 0.88

      calculation: |
        Track record score = 220 / 250 = 0.88
        Contribution = 2.0 × 0.88 = 1.76 points

      interpretation: "Highly reliable agent, proven track record"

    # Example 2: Standard Agent
    example_standard:
      agent_id: "researcher"
      total_tasks: 150
      success_count: 120
      failure_count: 30
      success_rate: 0.80

      calculation: |
        Track record score = 120 / 150 = 0.80
        Contribution = 2.0 × 0.80 = 1.60 points

      interpretation: "Good agent, mostly reliable"

    # Example 3: New Agent
    example_new:
      agent_id: "rookie"
      total_tasks: 0
      success_count: 0
      failure_count: 0
      success_rate: null

      calculation: |
        Since total_tasks < 5, use default: score = 0.80
        Contribution = 2.0 × 0.80 = 1.60 points

      interpretation: "New agent, neutral starting point (not penalized)"

    # Example 4: Struggling Agent
    example_struggling:
      agent_id: "legacy_system"
      total_tasks: 100
      success_count: 55
      failure_count: 45
      success_rate: 0.55

      calculation: |
        Track record score = 55 / 100 = 0.55
        Contribution = 2.0 × 0.55 = 1.10 points

      interpretation: "Unreliable agent, often fails (but not excluded)"

  # Domain Specialization
  domain_specialization: |
    **Can Boost Track Record by Domain Match**

    Agent specializations:
    {
      "domain_specializations": ["planning", "itinerary", "travel"],
      "specialization_history": {
        "planning": {"success_rate": 0.95, "tasks": 100},
        "itinerary": {"success_rate": 0.92, "tasks": 80},
        "travel": {"success_rate": 0.88, "tasks": 70},
        "research": {"success_rate": 0.70, "tasks": 50}
      }
    }

    Task-specific track record:
    - If task is "Plan fishing trip" (planning domain)
      - Use planning success rate: 0.95
      - Instead of overall: 0.88
      - Boost: +0.07 (7% improvement)

    - If task is "Research fishing locations" (research domain)
      - Use research success rate: 0.70
      - Instead of overall: 0.88
      - Penalty: -0.18 (18% worse for this agent in this domain)

  # Integration with Scoring
  track_record_factor_integration: |
    Factor 5 Track Record Contribution:
    w_track_record = 2.0

    In full scoring formula:
    score_contribution = 2.0 × success_rate
                       = 2.0 × 0.55 = 1.10 (struggling agent)
                       = 2.0 × 0.80 = 1.60 (new/standard agent)
                       = 2.0 × 0.95 = 1.90 (expert in domain)

    Difference: 1.90 - 1.10 = 0.80 points (meaningful but not decisive)
    Compared to confidence factor: 10.0 points (10x more important)

# Specialization Scoring Integration
specialization_integration:

  complete_example_with_specialization: |
    Scenario: "Plan fishing trip for father and son" (250ms budget, $1.0 budget)

    Task characteristics:
    - Domain: "planning" (travel subcategory)
    - Deadline: Loose (250ms available)
    - Budget: Moderate ($1.0 available)

    Three agents with different specializations:

    1. Concierge:
       - General purpose agent
       - Domain specializations: ["concierge", "hospitality"]
       - Overall success_rate: 0.92
       - Planning success_rate: 0.85 (not specialized here)
       - Parallelism: sequential (0.0 bonus)
       - Use: overall success_rate = 0.92
       - Track record contribution = 2.0 × 0.92 = 1.84
       - Parallelism contribution = 3.0 × 0.0 = 0.0

    2. Planner:
       - Travel specialist
       - Domain specializations: ["planning", "itinerary", "travel"]
       - Overall success_rate: 0.88
       - Planning success_rate: 0.95 (expert here!)
       - Parallelism: parallel (1.0 bonus)
       - Use: planning success_rate = 0.95 (domain match)
       - Track record contribution = 2.0 × 0.95 = 1.90
       - Parallelism contribution = 3.0 × 1.0 = 3.0
       - Total specialization bonus = 1.90 + 3.0 = 4.90

    3. Researcher:
       - Research specialist
       - Domain specializations: ["research", "analysis"]
       - Overall success_rate: 0.80
       - Planning success_rate: 0.70 (not specialized)
       - Parallelism: hybrid (0.5 bonus)
       - Use: overall success_rate = 0.80 (no domain match)
       - Track record contribution = 2.0 × 0.80 = 1.60
       - Parallelism contribution = 3.0 × 0.5 = 1.50
       - Total specialization bonus = 1.60 + 1.50 = 3.10

    Comparison:
    - Concierge: 1.84 + 0.0 = 1.84
    - Planner: 1.90 + 3.0 = 4.90 (BEST by 3.06 points!)
    - Researcher: 1.60 + 1.5 = 3.10

    Insight: Planner wins specialization comparison due to:
    - Domain expertise in planning (+0.06 vs concierge)
    - Parallel execution ability (+3.0 vs sequential concierge, +1.5 vs hybrid researcher)

  reward_specialization: |
    **Why Reward Specialization?**
    ✓ Agents improve over time through experience
    ✓ Specialized agents are more reliable in their domain
    ✓ Encourages agent development toward strengths
    ✓ Learning loop feeds back into scoring
    ✓ Natural market mechanism (specialists preferred)

# Performance Characteristics
performance:

  parallelism_bonus_time: "<0.1ms (string comparison)"
  track_record_time: "<0.5ms (database lookup + calculation)"
  total_specialization_time: "<1ms per proposal"
  p95_target: "<1ms per proposal"

# Configuration
configuration:

  # Parallelism Strategy Bonuses
  parallelism_bonuses:
    sequential: 0.0
    hybrid: 0.5
    parallel: 1.0

  # Track Record Scoring
  track_record_config:
    default_score_new_agent: 0.8      # 80% credit for unknown agents
    min_tasks_for_specialization: 10  # Need 10 tasks to claim specialization
    success_rate_threshold: 0.75      # >75% success = "specialized"

  # Domain Matching
  domain_matching:
    enable_domain_specialization: true
    specialization_boost: "use domain-specific success_rate when available"
    min_samples_for_domain: 5         # Need 5 tasks in domain to count

# Testing & Validation
testing_validation:

  parallelism_unit_tests:
    - "Sequential strategy → bonus=0.0"
    - "Hybrid strategy → bonus=0.5"
    - "Parallel strategy → bonus=1.0"
    - "Unknown strategy → bonus=0.0"

  track_record_unit_tests:
    - "Success rate 0.88 (250 tasks) → score=0.88"
    - "Success rate 0.80 (150 tasks) → score=0.80"
    - "No tasks (new agent) → score=0.80 (default)"
    - "Domain specialization match → boost score"

  integration_tests:
    - "Full proposal ranking with specialization"
    - "Specialized agent beats generalist in domain"
    - "Parallelism enables faster estimates"
    - "Specialization bonuses appear in score breakdown"

  property_tests:
    - "Parallelism bonus is 0.0, 0.5, or 1.0 (discrete)"
    - "Track record score in [0.0, 1.0]"
    - "Domain specialization never reduces score"

# Implementation Status
implementation_status:
  parallelism_bonus: "COMPLETED"
  track_record_basic: "COMPLETED"
  domain_specialization: "TODO (needs learning loop integration)"
  specialization_logging: "TODO"
  overall_completion: "70%"

# Recommended Next Steps
next_steps: |
  1. Integrate with Learning Loop (ADR-0008)
     - Capture success/failure on each task
     - Update agent_context.success_rate after each turn
     - Calculate domain-specific success rates

  2. Calibrate Default Values
     - default_score_new_agent = 0.8 (should be empirically validated)
     - threshold for "specialization" (currently 75%)

  3. Add Tie-Breaking with Specialization
     - Use specialization bonus as secondary ranking when scores equal

  4. Explainability Features
     - Log which specialization matched
     - Show domain-specific success rate vs overall
     - Explain parallelism strategy choice

