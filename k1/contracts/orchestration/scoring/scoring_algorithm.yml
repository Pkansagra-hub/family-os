# Scoring Algorithm Contract
# Source ADR: ADR-0006b (Multi-Criteria Proposal Scoring Engine)
# Defines the 6-factor weighted scoring function and normalization

metadata:
  contract_id: "scoring-algorithm-v1.0"
  source_adr: "0006b-multi-criteria-proposal-scoring-engine.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Scoring Algorithm Overview
algorithm_overview:
  description: "6-factor weighted sum for multi-criteria agent proposal evaluation"
  purpose: "Rank proposals and select optimal agent for task execution"
  research: "Multi-Attribute Decision Making (MADM) - Weighted Sum Model (WSM)"
  performance: "<5ms P95 (scoring all proposals)"
  determinism: "Same proposals → same winner (reproducible)"
  transparency: "Explicit weights, full score breakdown logging"

# Research Foundation
research_foundation:
  madm_weighted_sum: |
    **Multi-Attribute Decision Making (MADM)**
    - Weighted Sum Model (WSM): Score = Σ(weight_i × attribute_i)
    - Normalization: Scale all attributes to 0-1 range
    - Trade-off analysis: Balance competing objectives
    - Used in: Kubernetes scheduling, resource allocation, hiring decisions

  why_weighted_sum: |
    - **Simplicity:** Easy to implement, understand, debug
    - **Performance:** O(N) for N proposals (~1ms for 5 proposals)
    - **Transparency:** Explicit weights, tunable per scenario
    - **Determinism:** No randomness, reproducible results

# Core Scoring Formula
scoring_formula:
  description: "6-factor weighted sum with normalization"
  formula: |
    score(proposal) =
        w_confidence × norm_confidence
      + w_latency × norm_latency
      + w_cost × norm_cost
      + w_parallelism × bonus_parallelism
      + w_track_record × norm_track_record
      + penalty_busy × norm_load

  interpretation: |
    - First 4 factors: Positive contributions (proposal attributes)
    - Last 2 factors: Negative weights/penalties (undesirable attributes)
    - Result: Continuous score (typically -10.0 to +25.0 range)
    - Higher score = better proposal

# Scoring Weights (6 Factors)
scoring_weights:

  factor_1_confidence:
    name: "Confidence (Capability Match)"
    weight: 10.0
    priority: "HIGHEST"
    description: "How confident is the agent in successfully completing the task?"
    range: [1.0, 20.0]
    rationale: "A confident agent beats a fast but uncertain one"
    input_source: "proposal.confidence (from agent evaluation)"
    normalization: "Already 0.0-1.0 (pass-through)"

  factor_2_latency:
    name: "Latency (Speed)"
    weight: 8.0
    priority: "HIGH"
    description: "How quickly can the agent execute the task?"
    range: [1.0, 15.0]
    rationale: "Speed matters for UX, but not at cost of correctness"
    input_source: "proposal.estimated_latency_ms"
    normalization: "Normalize to 0-1 scale (see latency_scoring.yml)"

  factor_3_cost:
    name: "Cost (Budget Efficiency)"
    weight: -5.0
    priority: "MEDIUM"
    description: "How expensive is the agent's execution?"
    range: [-10.0, 0.0]
    note: "NEGATIVE weight - penalizes expensive options"
    rationale: "Prefer cheaper agents when confidence/latency equal"
    input_source: "proposal.estimated_cost"
    normalization: "Normalize to 0-1 scale (see cost_scoring.yml)"

  factor_4_parallelism:
    name: "Parallelism (Execution Strategy)"
    weight: 3.0
    priority: "MEDIUM"
    description: "Can the agent parallelize independent steps?"
    range: [0.0, 10.0]
    rationale: "Parallel execution can beat sequential even if slower per-step"
    input_source: "proposal.strategy (parallel|sequential|hybrid)"
    bonus_calculation: |
      - "parallel" strategy: +1.0 (full bonus)
      - "hybrid" strategy: +0.5 (partial bonus)
      - "sequential" strategy: 0.0 (no bonus)

  factor_5_track_record:
    name: "Track Record (Historical Success)"
    weight: 2.0
    priority: "LOW"
    description: "What's the agent's historical success rate?"
    range: [0.0, 5.0]
    rationale: "Proven agents better than new ones"
    input_source: "agent_context.success_rate (from learning loop)"
    value_range: [0.0, 1.0]
    fallback: "0.8 for agents with no history (neutral starting point)"

  factor_6_load_penalty:
    name: "Load Penalty (Current Utilization)"
    weight: -4.0
    priority: "MEDIUM"
    description: "How busy is the agent right now?"
    range: [-10.0, 0.0]
    note: "NEGATIVE weight - penalizes overloaded agents"
    rationale: "Prefer available agents over busy ones"
    input_source: "agent_context.load (mailbox size / max_size)"
    value_range: [0.0, 1.0]
    interpretation: |
      - 0.0 = idle (no penalty)
      - 0.5 = half busy (moderate penalty)
      - 1.0 = full (maximum penalty)

# Scoring Example (Detailed Walkthrough)
scoring_example:

  scenario: "User asks: 'Plan a fishing trip with my son'"

  proposals:
    - agent_id: "concierge"
      confidence: 0.7
      estimated_latency_ms: 180
      estimated_cost: 0.30
      strategy: "sequential"
      proposal_load: 0.3  # Currently has 3 messages in queue
      agent_success_rate: 0.92

    - agent_id: "planner"
      confidence: 0.9
      estimated_latency_ms: 220
      estimated_cost: 0.60
      strategy: "parallel"
      proposal_load: 0.7  # Currently busy with 7 messages in queue
      agent_success_rate: 0.88

    - agent_id: "researcher"
      confidence: 0.6
      estimated_latency_ms: 450
      estimated_cost: 0.40
      strategy: "sequential"
      proposal_load: 0.2
      agent_success_rate: 0.75

  task_budget:
    latency_ms: 250
    cost_usd: 1.0

  detailed_scoring:

    # Score Concierge
    concierge:
      f1_confidence: 0.7
      f2_latency:
        calculation: "180ms is well within 250ms budget (72%)"
        normalized: 1.0
        rationale: "estimate <= budget*0.5 → score=1.0"

      f3_cost:
        calculation: "$0.30 is within budget ($1.0), 30% utilization"
        normalized: 0.7
        rationale: "$0.30 <= budget*0.5 ($0.50) → partial score"

      f4_parallelism:
        strategy: "sequential"
        bonus: 0.0
        rationale: "No parallelism → 0.0 bonus"

      f5_track_record:
        success_rate: 0.92
        normalized: 0.92

      f6_load_penalty:
        load: 0.3
        normalized: 0.3

      calculation: |
        score = (10.0 × 0.7) + (8.0 × 1.0) + (-5.0 × 0.7) + (3.0 × 0.0) + (2.0 × 0.92) + (-4.0 × 0.3)
              = 7.0 + 8.0 - 3.5 + 0.0 + 1.84 - 1.2
              = **13.14**

    # Score Planner
    planner:
      f1_confidence: 0.9
      f2_latency:
        calculation: "220ms is near budget (88%)"
        normalized: 0.88
        rationale: "In range [125ms, 250ms] → linear interpolation"

      f3_cost:
        calculation: "$0.60 is near budget, 60% utilization"
        normalized: 0.40
        rationale: "$0.60 > budget*0.5 ($0.50) → lower score"

      f4_parallelism:
        strategy: "parallel"
        bonus: 1.0
        rationale: "Parallel strategy → full 1.0 bonus"

      f5_track_record:
        success_rate: 0.88
        normalized: 0.88

      f6_load_penalty:
        load: 0.7
        normalized: 0.7

      calculation: |
        score = (10.0 × 0.9) + (8.0 × 0.88) + (-5.0 × 0.40) + (3.0 × 1.0) + (2.0 × 0.88) + (-4.0 × 0.7)
              = 9.0 + 7.04 - 2.0 + 3.0 + 1.76 - 2.8
              = **16.0**

    # Score Researcher
    researcher:
      f1_confidence: 0.6
      f2_latency:
        calculation: "450ms exceeds budget (180%)"
        normalized: 0.0
        rationale: "Over budget → score=0.0 (clamped)"

      f3_cost:
        calculation: "$0.40 moderate cost"
        normalized: 0.6

      f4_parallelism:
        strategy: "sequential"
        bonus: 0.0

      f5_track_record:
        success_rate: 0.75
        normalized: 0.75

      f6_load_penalty:
        load: 0.2
        normalized: 0.2

      calculation: |
        score = (10.0 × 0.6) + (8.0 × 0.0) + (-5.0 × 0.6) + (3.0 × 0.0) + (2.0 × 0.75) + (-4.0 × 0.2)
              = 6.0 + 0.0 - 3.0 + 0.0 + 1.5 - 0.8
              = **3.7**

  ranking:
    1st: "Planner (16.0) ✅ WINNER"
    2nd: "Concierge (13.14)"
    3rd: "Researcher (3.7)"

  explanation: |
    Planner wins despite being busy and expensive because:
    - High confidence (0.9 × 10.0 = 9.0) - most important factor
    - Fast enough (0.88 × 8.0 = 7.04) - within budget
    - Parallel strategy (1.0 × 3.0 = 3.0) - can execute faster overall
    - Good track record (0.88 × 2.0 = 1.76) - proven reliability

    Concierge would be second choice (fast, low cost, good history) but less confident.
    Researcher is too slow (450ms > 250ms budget) despite low cost.

# Scoring Algorithm Implementation
algorithm_implementation:

  # Step 1: Prepare Input
  prepare_input:
    input_sources:
      - "proposals: List[Proposal]"
      - "task: TaskAnnouncement"
      - "agent_context: Dict[agent_id -> {success_rate, load, ...}]"
    validation:
      - "At least 1 proposal"
      - "All proposals have valid fields"
      - "Task budget is defined"

  # Step 2: Calculate Scores
  calculate_scores: |
    scored_proposals = []
    for proposal in proposals:
        score = calculate_score(proposal, task, agent_context[proposal.agent_id])
        scored_proposals.append({
            'proposal': proposal,
            'score': score,
            'breakdown': get_score_breakdown(proposal, task, agent_context)
        })

  # Step 3: Sort by Score
  sort_by_score: |
    # Sort descending (highest score first)
    scored_proposals.sort(key=lambda x: x['score'], reverse=True)

  # Step 4: Select Winner
  select_winner: |
    winner = scored_proposals[0]
    return winner['proposal']

# Output Structure
output_structure:

  winner_proposal: "Proposal object"
  winner_score: "float (score value)"
  score_breakdown: |
    {
      "confidence": 0.9,
      "latency": 0.88,
      "cost": 0.40,
      "parallelism": 1.0,
      "track_record": 0.88,
      "load": 0.7,
      "weighted_sum": 16.0
    }
  all_scores: "List of all proposals with scores"
  ranking: "Full ranking for explainability"

# Weight Tuning Guidelines
weight_tuning:

  # Scenario 1: Latency Critical
  latency_critical_preset:
    w_confidence: 8.0
    w_latency: 15.0  # Boost latency
    w_cost: -3.0     # Relax cost constraint
    w_parallelism: 5.0
    w_track_record: 1.0
    penalty_busy: -5.0
    rationale: "Minimize latency at cost of quality/expense"

  # Scenario 2: Cost Conscious
  cost_conscious_preset:
    w_confidence: 8.0
    w_latency: 5.0
    w_cost: -10.0    # Strong cost penalty
    w_parallelism: 2.0
    w_track_record: 1.0
    penalty_busy: -3.0
    rationale: "Minimize cost, acceptable latency trade-off"

  # Scenario 3: Quality First
  quality_first_preset:
    w_confidence: 15.0  # Highest confidence required
    w_latency: 6.0
    w_cost: -2.0       # Tolerant of expense
    w_parallelism: 3.0
    w_track_record: 4.0  # Heavy weight on proven agents
    penalty_busy: -2.0
    rationale: "Best quality output, less concerned with cost/speed"

  # Scenario 4: Balanced (Default)
  balanced_preset:
    w_confidence: 10.0
    w_latency: 8.0
    w_cost: -5.0
    w_parallelism: 3.0
    w_track_record: 2.0
    penalty_busy: -4.0
    rationale: "Default balanced scoring"

  # How to Tune
  tuning_methodology: |
    1. Start with balanced preset
    2. Identify underperforming factor (slow selection, wrong agent selected)
    3. Increase weight of desired factor OR decrease competing factors
    4. Test with WARD integration tests
    5. Monitor metrics (selection latency, winner quality)
    6. Iterate until SLA met

# Performance Characteristics
performance:

  time_complexity: "O(N) where N = number of proposals"
  space_complexity: "O(1) per proposal (constant memory)"
  typical_performance: |
    - 1 proposal: <1ms
    - 3 proposals: <2ms
    - 5 proposals: <3ms
    - 10 proposals: <5ms
  p95_target: "<5ms for all proposals"

  optimization_opportunities: |
    - Vectorized scoring (SIMD for multiple proposals)
    - Caching normalized values (if reused)
    - Early termination (if proposal clearly not winning)

# Testing & Validation
testing_validation:

  # Unit Tests
  unit_tests:
    - "Score calculation correctness (against manual calculation)"
    - "Normalization functions (latency, cost, load)"
    - "Weight configuration loading"
    - "Edge cases (single proposal, all equal scores, extreme values)"
    - "Consistency (same input → same score across runs)"

  # Integration Tests
  integration_tests:
    - "Full ranking of 5+ proposals"
    - "Weight preset switching"
    - "Score breakdown logging"
    - "Performance targets (P95 <5ms)"

  # Property Tests
  property_tests:
    - "Score monotonicity (higher confidence → higher score)"
    - "Score boundedness (score in reasonable range)"
    - "Determinism (same proposals → same scores)"

# Configuration
configuration:

  # Default Weights
  default_weights:
    w_confidence: 10.0
    w_latency: 8.0
    w_cost: -5.0
    w_parallelism: 3.0
    w_track_record: 2.0
    penalty_busy: -4.0

  # Tunable Parameters
  tunable_parameters:
    - "all weights: Adjust for different optimization scenarios"
    - "normalization_breakpoints: Adjust latency/cost ranges"
    - "weight_presets: Choose scenario-specific weights"

# Implementation Status
implementation_status:
  formula: "COMPLETED"
  normalization: "IN PROGRESS (see separate contracts)"
  tie_breaking: "TODO (see selection_phase.yml)"
  explainability: "COMPLETED"
  overall_completion: "75%"

# Research Backing
research_backing:
  - "Multi-Attribute Decision Making (Fishburn, 1967)"
  - "Weighted Sum Model (Hwang & Yoon, 1981)"
  - "Kubernetes Scheduling (Google, 2014)"
  - "Borg Resource Allocation (Verma et al., 2015)"
