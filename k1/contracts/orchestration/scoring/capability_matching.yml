# Capability Matching Contract
# Source ADR: ADR-0006b (Multi-Criteria Proposal Scoring Engine)
# Defines capability matching algorithm for confidence scoring

metadata:
  contract_id: "capability-matching-v1.0"
  source_adr: "0006b-multi-criteria-proposal-scoring-engine.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]
  parent_contract: "scoring-algorithm.yml"

# Capability Matching Overview
matching_overview:
  description: "Evaluate capability match between task requirements and agent capabilities"
  purpose: "Calculate confidence score (0.0-1.0) for proposal scoring"
  component: "Factor 1 in 6-factor scoring (weight=10.0, highest priority)"
  performance: "<1ms P95 per proposal"
  determinism: "Same capabilities → same match score"

# Research Foundation
research_foundation:
  capability_model: |
    **K1 Capability Model**
    - Capabilities: Fine-grained permissions (tool access, resource limits)
    - Tokens: Ed25519-signed capability leases (2-hour TTL)
    - Layers: Abstract > Concrete (hierarchy)
    - Verification: Cryptographic signature check on token

  matching_algorithm: |
    **Capability Matching (Graph Traversal)**
    - Task requirements: Tree of required capabilities
    - Agent capabilities: Set of owned capability tokens
    - Matching: Depth-first traversal with delegation
    - Scoring: Match percentage (0.0-1.0)

  trust_model: |
    - Required > Offered: Cannot perform task (0.0 confidence)
    - Required = Offered: Full confidence (1.0)
    - Required < Offered: Over-qualified (1.0, possibly inefficient)

# Capability Matching Algorithm
matching_algorithm:

  algorithm_name: "Recursive Capability Graph Traversal"

  data_structures:
    task_requirements: |
      {
        "required_capabilities": [
          {
            "capability_id": "tool.web_search",
            "access_level": "read",
            "resources": {"max_requests": 100},
            "delegatable": true
          },
          {
            "capability_id": "tool.text_generation",
            "access_level": "execute",
            "parameters": {"max_tokens": 2000},
            "delegatable": false
          }
        ],
        "optional_capabilities": [
          {
            "capability_id": "tool.image_generation",
            "performance_boost": 0.1  # Adds 10% to score if available
          }
        ]
      }

    agent_capabilities: |
      {
        "agent_id": "planner",
        "capability_tokens": [
          {
            "token": "Ed25519 signature...",  # Cryptographic proof
            "capability_id": "tool.web_search",
            "access_level": "read",
            "resources": {"max_requests": 150},
            "issued_at": "2025-10-15T10:00:00Z",
            "expires_at": "2025-10-15T12:00:00Z",
            "issuer": "supervisor",
            "status": "active"
          },
          {
            "token": "Ed25519 signature...",
            "capability_id": "tool.text_generation",
            "access_level": "execute",
            "parameters": {"max_tokens": 3000},
            "issued_at": "2025-10-15T10:00:00Z",
            "expires_at": "2025-10-15T12:00:00Z",
            "issuer": "supervisor",
            "status": "active"
          }
        ]
      }

  algorithm_pseudocode: |
    def calculate_capability_confidence(task_requirements, agent_capabilities):
        """
        Calculate confidence score (0.0-1.0) for task execution capability match

        Args:
            task_requirements: Dict with required/optional capabilities
            agent_capabilities: Dict with agent's capability tokens

        Returns:
            confidence: float 0.0-1.0
            explanation: str detailing match results
        """

        # Step 1: Verify all capability tokens are valid
        valid_tokens = verify_tokens(agent_capabilities['capability_tokens'])
        if not valid_tokens:
            return 0.0, "Invalid or expired capability tokens"

        # Step 2: Extract required capabilities
        required_caps = {c['capability_id']: c for c in task_requirements['required_capabilities']}
        optional_caps = {c['capability_id']: c for c in task_requirements.get('optional_capabilities', [])}
        agent_caps = {c['capability_id']: c for c in agent_capabilities['capability_tokens']}

        # Step 3: Check required capability coverage
        required_match_score = 0.0
        matched_required = 0

        for cap_id, required_cap in required_caps.items():
            if cap_id not in agent_caps:
                # Missing required capability = cannot perform task
                return 0.0, f"Missing required capability: {cap_id}"

            agent_cap = agent_caps[cap_id]

            # Verify access level
            if not has_sufficient_access_level(agent_cap['access_level'], required_cap['access_level']):
                return 0.0, f"Insufficient access level for {cap_id}: {agent_cap['access_level']} < {required_cap['access_level']}"

            # Verify resources
            if not has_sufficient_resources(agent_cap['resources'], required_cap['resources']):
                return 0.0, f"Insufficient resources for {cap_id}: {agent_cap['resources']} < {required_cap['resources']}"

            matched_required += 1

        # All required capabilities present
        required_match_score = 1.0 if matched_required == len(required_caps) else 0.0

        # Step 4: Check optional capability coverage
        optional_boost = 0.0
        matched_optional = 0

        for cap_id, optional_cap in optional_caps.items():
            if cap_id in agent_caps:
                matched_optional += 1
                optional_boost += optional_cap.get('performance_boost', 0.05)

        # Optional boost maxes out at 0.1 (10%)
        optional_boost = min(optional_boost, 0.1)

        # Step 5: Calculate final confidence
        confidence = min(required_match_score + optional_boost, 1.0)

        return confidence, {
            'required_match': required_match_score,
            'optional_boost': optional_boost,
            'matched_required': matched_required,
            'total_required': len(required_caps),
            'matched_optional': matched_optional,
            'total_optional': len(optional_caps)
        }

  helper_functions:
    verify_tokens: |
      def verify_tokens(capability_tokens):
          """Verify Ed25519 signatures and expiration"""
          valid_tokens = []
          for token in capability_tokens:
              # Check expiration
              if token['expires_at'] < now():
                  continue  # Skip expired tokens

              # Verify Ed25519 signature
              try:
                  signature_valid = ed25519_verify(
                      token['token'],
                      token['capability_id'] + token['access_level'] + token['issued_at'],
                      issuer_public_key[token['issuer']]
                  )
                  if signature_valid:
                      valid_tokens.append(token)
              except:
                  continue  # Skip invalid signatures

          return valid_tokens

    has_sufficient_access_level: |
      def has_sufficient_access_level(agent_level, required_level):
          """Check access level hierarchy"""
          levels = ['none', 'read', 'execute', 'admin']
          agent_idx = levels.index(agent_level)
          required_idx = levels.index(required_level)
          return agent_idx >= required_idx

    has_sufficient_resources: |
      def has_sufficient_resources(agent_resources, required_resources):
          """Verify all resource requirements met"""
          for resource_name, required_limit in required_resources.items():
              agent_limit = agent_resources.get(resource_name, 0)
              if agent_limit < required_limit:
                  return False
          return True

# Matching Examples
matching_examples:

  # Example 1: Perfect Match
  example_1_perfect_match:
    scenario: "Planner agent, task requires web search + text generation"

    task_requirements:
      required_capabilities:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 100}
        - capability_id: "tool.text_generation"
          access_level: "execute"
          parameters: {max_tokens: 2000}
      optional_capabilities:
        - capability_id: "tool.image_generation"
          performance_boost: 0.1

    agent_capabilities:
      agent_id: "planner"
      capability_tokens:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 150}  # Has MORE than required (150 > 100)
          status: "active"
        - capability_id: "tool.text_generation"
          access_level: "execute"
          parameters: {max_tokens: 3000}  # Has MORE than required (3000 > 2000)
          status: "active"
        - capability_id: "tool.image_generation"
          access_level: "execute"
          status: "active"  # HAS optional capability

    calculation: |
      Step 1: Verify tokens → All valid ✓
      Step 2: Extract capabilities → 2 required, 1 optional
      Step 3: Check required coverage
        - tool.web_search: ✓ (read >= read, 150 > 100)
        - tool.text_generation: ✓ (execute >= execute, 3000 > 2000)
        - required_match_score = 1.0
      Step 4: Check optional coverage
        - tool.image_generation: ✓ FOUND (+0.1 boost)
        - optional_boost = 0.1
      Step 5: Calculate confidence
        - confidence = min(1.0 + 0.1, 1.0) = 1.0

    result: "confidence = 1.0 (Perfect match) ✅"

  # Example 2: Partial Match (Missing Optional)
  example_2_partial_match:
    scenario: "Researcher agent, missing image generation"

    task_requirements:
      required_capabilities:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 100}
        - capability_id: "tool.text_generation"
          access_level: "execute"
          parameters: {max_tokens: 2000}
      optional_capabilities:
        - capability_id: "tool.image_generation"
          performance_boost: 0.1

    agent_capabilities:
      agent_id: "researcher"
      capability_tokens:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 150}  # Has required
          status: "active"
        - capability_id: "tool.text_generation"
          access_level: "execute"
          parameters: {max_tokens: 3000}  # Has required
          status: "active"
        # MISSING tool.image_generation

    calculation: |
      Step 1: Verify tokens → All valid ✓
      Step 2: Extract capabilities → 2 required, 1 optional
      Step 3: Check required coverage
        - tool.web_search: ✓ (read >= read, 150 > 100)
        - tool.text_generation: ✓ (execute >= execute, 3000 > 2000)
        - required_match_score = 1.0
      Step 4: Check optional coverage
        - tool.image_generation: ✗ NOT FOUND (no boost)
        - optional_boost = 0.0
      Step 5: Calculate confidence
        - confidence = min(1.0 + 0.0, 1.0) = 1.0

    result: "confidence = 1.0 (Still acceptable, optional not required) ✅"

  # Example 3: Insufficient Resources
  example_3_insufficient_resources:
    scenario: "Concierge agent with limited web search quota"

    task_requirements:
      required_capabilities:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 100}

    agent_capabilities:
      agent_id: "concierge"
      capability_tokens:
        - capability_id: "tool.web_search"
          access_level: "read"
          resources: {max_requests: 50}  # LESS than required (50 < 100)
          status: "active"

    calculation: |
      Step 1: Verify tokens → All valid ✓
      Step 2: Extract capabilities → 1 required
      Step 3: Check required coverage
        - tool.web_search: ✗ Insufficient resources!
          - Agent has: max_requests=50
          - Task needs: max_requests=100
          - 50 < 100 → FAIL
        - return 0.0, "Insufficient resources for tool.web_search: max_requests=50 < 100"

    result: "confidence = 0.0 (Cannot execute task) ❌"

  # Example 4: Missing Required Capability
  example_4_missing_required:
    scenario: "Basic agent, lacks image generation capability"

    task_requirements:
      required_capabilities:
        - capability_id: "tool.image_generation"
          access_level: "execute"

    agent_capabilities:
      agent_id: "basic"
      capability_tokens:
        - capability_id: "tool.text_generation"
          access_level: "execute"
          # MISSING tool.image_generation entirely

    calculation: |
      Step 1: Verify tokens → All valid ✓
      Step 2: Extract capabilities → 1 required, 0 optional
      Step 3: Check required coverage
        - tool.image_generation: ✗ NOT FOUND
        - return 0.0, "Missing required capability: tool.image_generation"

    result: "confidence = 0.0 (Cannot execute task) ❌"

  # Example 5: Insufficient Access Level
  example_5_insufficient_access:
    scenario: "Agent has read access but task requires execute"

    task_requirements:
      required_capabilities:
        - capability_id: "tool.database"
          access_level: "execute"  # Requires execute (write)

    agent_capabilities:
      agent_id: "reader"
      capability_tokens:
        - capability_id: "tool.database"
          access_level: "read"  # Only has read (not execute)

    calculation: |
      Step 1: Verify tokens → All valid ✓
      Step 2: Extract capabilities → 1 required
      Step 3: Check required coverage
        - tool.database: ✗ Insufficient access level
          - Agent has: read
          - Task needs: execute
          - read < execute → FAIL
        - return 0.0, "Insufficient access level for tool.database: read < execute"

    result: "confidence = 0.0 (Cannot execute task) ❌"

# Capability Scoring Integration
scoring_integration:

  factor_1_confidence_input: |
    confidence_score (0.0-1.0) from capability matching

  example_scoring: |
    // In scoring_algorithm.yml
    f1_confidence = calculate_capability_confidence(task, agent)
    score_contribution = w_confidence × f1_confidence
                       = 10.0 × 0.95
                       = 9.5 (out of 10.0 max)

  impact_on_ranking: |
    High confidence (0.9+) agents typically score higher than:
    - Fast but uncertain (0.6 confidence) agents
    - Cheap but uncertain (0.5 confidence) agents
    - Proven but slow (0.8 confidence) agents

    This reflects prioritizing correctness over speed/cost.

# Token Verification Details
token_verification:

  ed25519_signature_format: |
    signature = Ed25519Sign(
      message = capability_id + access_level + issued_at,
      private_key = issuer_private_key
    )

    verification = Ed25519Verify(
      message = capability_id + access_level + issued_at,
      signature = signature,
      public_key = issuer_public_key
    )

  expiration_checking: |
    if token.expires_at < now():
        skip this token  # Expired
    else:
        include in matching  # Valid

  issuer_validation: |
    approved_issuers = ["supervisor", "k0_bridge", "security_arbiter"]
    if token.issuer not in approved_issuers:
        reject token  # Untrusted issuer

# Performance Characteristics
performance:

  time_complexity: "O(R + O) where R=required, O=optional capabilities"
  typical_sizes:
    required_capabilities: "3-8 per task"
    optional_capabilities: "0-3 per task"
    agent_capability_tokens: "5-15 per agent"

  performance_breakdown: |
    - Token verification (Ed25519): ~0.2ms per token
    - Capability traversal: ~0.05ms per capability
    - Resource checking: ~0.01ms per resource

    Typical total: <1ms for 10 required + 2 optional capabilities

  p95_target: "<1ms per proposal"

# Configuration
configuration:

  # Boost Amounts (optional capability boost)
  optional_capability_boosts:
    high_value_boost: 0.15  # 15% score boost for critical optional capabilities
    medium_value_boost: 0.10  # 10% score boost
    low_value_boost: 0.05   # 5% score boost

  optional_boost_cap: 0.1   # Maximum total optional boost is 10%

  # Capability Hierarchy
  access_level_hierarchy:
    levels: ["none", "read", "execute", "admin"]
    semantics: |
      - none: No access
      - read: Can read/query only
      - execute: Can read and modify/execute
      - admin: Can read, modify, delete, grant capabilities

# Testing & Validation
testing_validation:

  unit_tests:
    - "Perfect match (all required, all optional) → confidence=1.0"
    - "Partial match (all required, no optional) → confidence=1.0"
    - "Missing required capability → confidence=0.0"
    - "Insufficient resources → confidence=0.0"
    - "Insufficient access level → confidence=0.0"
    - "Expired token → skip, treat as missing"
    - "Invalid signature → skip, treat as missing"

  integration_tests:
    - "Proposal scoring with 5 agents of varying capability match"
    - "Token expiration triggering capability loss"
    - "Resource quota updates changing confidence"

  property_tests:
    - "Confidence is deterministic (same input → same output)"
    - "Confidence in [0.0, 1.0]"
    - "More capabilities → higher or equal confidence"

# Implementation Status
implementation_status:
  algorithm: "COMPLETED"
  token_verification: "COMPLETED"
  resource_checking: "COMPLETED"
  access_level_hierarchy: "COMPLETED"
  overall_completion: "100%"

