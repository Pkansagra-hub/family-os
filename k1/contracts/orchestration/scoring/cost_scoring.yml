# Cost Scoring Contract
# Source ADR: ADR-0006b (Multi-Criteria Proposal Scoring Engine)
# Defines cost normalization for proposal scoring

metadata:
  contract_id: "cost-scoring-v1.0"
  source_adr: "0006b-multi-criteria-proposal-scoring-engine.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]
  parent_contract: "scoring-algorithm.yml"

# Cost Scoring Overview
cost_overview:
  description: "Normalize agent cost estimates to 0-1 score with NEGATIVE weight"
  purpose: "Penalize expensive proposals in scoring"
  component: "Factor 3 in 6-factor scoring (weight=-5.0, PENALTY factor)"
  performance: "<1ms P95 per proposal"
  determinism: "Same cost estimate → same normalized score"
  note: |
    **CRITICAL: This factor has NEGATIVE weight (-5.0)**
    - Higher cost → LOWER overall score
    - Cheaper agents preferred when confidence/latency equal
    - Cost is trade-off with quality, not primary factor

# Research Foundation
research_foundation:
  resource_allocation: |
    **Why Cost Matters in Agent Selection**
    - Cloud Economics: Agents consume compute resources (CPU, memory, network)
    - Budget Constraints: Organizations have fixed token budgets
    - Fair Allocation: Prefer cheaper agents when performance equal
    - Cost-Quality Trade-off: Sometimes expensive = more capable

  cost_models: |
    **Types of Costs in K1**
    1. **Model Inference Costs:**
       - LLM API calls: $0.001-$0.01 per 1K tokens
       - Agent complexity: Simple planner < Complex researcher
       - Output tokens: More output = higher cost

    2. **Compute Resource Costs:**
       - GPU/CPU allocation: Varies by agent tier
       - Memory overhead: Buffering, context window size
       - Tool call costs: Depend on tool and execution

    3. **Operational Costs:**
       - Queueing delay: Busy agents need buffering
       - Coordination overhead: Negotiation, selection, execution
       - Retry/error handling: Failed tasks cost twice

  normalization_challenge: |
    **Problem: Different Tasks, Different Cost Budgets**
    - Quick lookup: $0.01 budget (cheap API calls)
    - Planning task: $0.50 budget (more API calls)
    - Research task: $5.00 budget (extensive tool use)

    Solution: Normalize agent quote against task budget
    - normalize(cost) = f(agent_quote, task_budget)
    - Result: Score 0.0-1.0 regardless of task complexity
    - Then: Apply NEGATIVE weight to penalize expensive options

  normalization_strategies: |
    **Strategy 1: Linear Normalization (Simple, Used Here)**
    - If quote = 0: score = 1.0 (free)
    - If quote = budget: score = 0.0 (fully budgeted)
    - If quote = budget/2: score = 0.5

    **Strategy 2: Budget Ratio with Slack**
    - If quote ≤ budget*0.5: score = 1.0 (stays under half budget)
    - If quote ≤ budget: interpolate
    - If quote > budget: clamp to 0.0 (over budget)

    **Strategy 3: Logarithmic Scale (Reduces outlier impact)**
    - Uses log(quote) to reduce impact of expensive agents
    - Helps when cost varies widely

    We use Strategy 1 (Linear) as default for clarity.

# Cost Normalization Function
normalization_function:

  algorithm_name: "Linear Cost Normalization"

  pseudocode: |
    def normalize_cost(agent_quote, task_budget):
        """
        Normalize agent's cost estimate to 0.0-1.0 score.

        Args:
            agent_quote: Agent's estimated cost in dollars
            task_budget: Task's cost budget in dollars

        Returns:
            normalized_score: float in [0.0, 1.0]
            interpretation: Lower score = more expensive (penalty)
        """

        # Safety checks
        if task_budget <= 0:
            return 0.0  # Invalid budget

        if agent_quote < 0:
            return 0.0  # Invalid quote

        # Calculate ratio: what fraction of budget?
        cost_ratio = agent_quote / task_budget

        # Linear normalization: 1.0 - ratio
        # - Cheap (low ratio) → high score
        # - Expensive (high ratio) → low score
        normalized = 1.0 - cost_ratio

        # Clamp to [0.0, 1.0]
        return max(0.0, min(1.0, normalized))

  mathematical_formula: |
    For cost_ratio = quote / budget:

    score(cost) = max(0.0, 1.0 - cost_ratio)
                = max(0.0, 1.0 - quote/budget)

    Graphically:

    score
      1.0 |●●●●●●●●●●●●●
          |          ╱
          |        ╱●
      0.5 |      ╱●
          |    ╱●
          |  ╱●
      0.0 |●●●●●●●●●●●●●●●●●
          +-----+-----+-----+---- cost_ratio
            0.0   0.5   1.0   1.5

    - Linear decline (1.0 to 0.0) as cost ratio increases
    - Zero for anything exceeding budget (hard constraint)
    - Full credit (1.0) for zero cost (rare)

  integration_with_scoring: |
    **CRITICAL: Weight is NEGATIVE**
    In scoring_algorithm.yml:

    w_cost = -5.0  (negative!)
    f3_cost = normalize_cost(proposal.quote, task.budget)
    score_contribution = w_cost × f3_cost
                       = -5.0 × normalized_score

    Examples:
    - Quote $0.10, budget $1.0 → normalized = 0.90 → contribution = -4.5
    - Quote $0.50, budget $1.0 → normalized = 0.50 → contribution = -2.5
    - Quote $1.00, budget $1.0 → normalized = 0.00 → contribution = 0.0

    Interpretation:
    - Cheap proposals: LOWER total score (negative contribution)
    - Expensive proposals: HIGHER total score (less negative)
    - This seems backward! But combined with other factors:
      - High confidence agent that costs more → still wins
      - Same confidence but cheaper → wins (saves resources)

# Cost Scoring Examples
cost_examples:

  # Example 1: Varied Cost, Same Budget
  example_1_varied_cost:
    scenario: "Fishing trip task, $1.0 budget"

    agents:
      - agent_id: "cheap"
        estimated_cost: 0.20
      - agent_id: "standard"
        estimated_cost: 0.60
      - agent_id: "premium"
        estimated_cost: 0.95

    task_budget: 1.0

    calculations: |
      Cheap:
        cost_ratio = 0.20 / 1.0 = 0.20
        score = max(0.0, 1.0 - 0.20) = 0.80
        contribution = -5.0 × 0.80 = -4.0

      Standard:
        cost_ratio = 0.60 / 1.0 = 0.60
        score = max(0.0, 1.0 - 0.60) = 0.40
        contribution = -5.0 × 0.40 = -2.0

      Premium:
        cost_ratio = 0.95 / 1.0 = 0.95
        score = max(0.0, 1.0 - 0.95) = 0.05
        contribution = -5.0 × 0.05 = -0.25

    results: |
      Cheap: score=0.80, contribution=-4.0 (lowest score, penalized most)
      Standard: score=0.40, contribution=-2.0 (moderate)
      Premium: score=0.05, contribution=-0.25 (highest score, penalized least!)

    insight: |
      **Counterintuitive: Cheaper gets LOWER score contribution**
      This is because -5.0 × 0.80 = -4.0 (large negative)
      vs -5.0 × 0.05 = -0.25 (small negative)

      In full scoring, when combined with other factors:
      - A cheap but low-confidence agent loses to expensive but high-confidence
      - Among equal confidence agents, cheap still wins overall
      - See example below with full scoring

  # Example 2: Within Budget
  example_2_within_budget:
    scenario: "Quick task, $0.10 budget"

    agents:
      - agent_id: "free"
        estimated_cost: 0.00
      - agent_id: "cheap"
        estimated_cost: 0.05
      - agent_id: "full"
        estimated_cost: 0.10

    task_budget: 0.10

    calculations: |
      Free:
        cost_ratio = 0.00 / 0.10 = 0.0
        score = max(0.0, 1.0 - 0.0) = 1.0
        contribution = -5.0 × 1.0 = -5.0

      Cheap:
        cost_ratio = 0.05 / 0.10 = 0.5
        score = max(0.0, 1.0 - 0.5) = 0.5
        contribution = -5.0 × 0.5 = -2.5

      Full:
        cost_ratio = 0.10 / 0.10 = 1.0
        score = max(0.0, 1.0 - 1.0) = 0.0
        contribution = -5.0 × 0.0 = 0.0

    results: |
      Free: score=1.0, contribution=-5.0 (penalty: -5.0)
      Cheap: score=0.5, contribution=-2.5 (penalty: -2.5)
      Full: score=0.0, contribution=0.0 (penalty: 0.0, at budget limit)

  # Example 3: Over Budget (Not Recommended)
  example_3_over_budget:
    scenario: "Research task, $2.0 budget (to allow overflow)"

    agents:
      - agent_id: "reasonable"
        estimated_cost: 1.50
      - agent_id: "expensive"
        estimated_cost: 2.50
      - agent_id: "very_expensive"
        estimated_cost: 5.00

    task_budget: 2.0

    calculations: |
      Reasonable:
        cost_ratio = 1.50 / 2.0 = 0.75
        score = max(0.0, 1.0 - 0.75) = 0.25
        contribution = -5.0 × 0.25 = -1.25

      Expensive:
        cost_ratio = 2.50 / 2.0 = 1.25
        score = max(0.0, 1.0 - 1.25) = max(0.0, -0.25) = 0.0 (clamped)
        contribution = -5.0 × 0.0 = 0.0

      Very_Expensive:
        cost_ratio = 5.00 / 2.0 = 2.5
        score = max(0.0, 1.0 - 2.5) = max(0.0, -1.5) = 0.0 (clamped)
        contribution = -5.0 × 0.0 = 0.0

    results: |
      Reasonable: score=0.25, contribution=-1.25 (within budget)
      Expensive: score=0.0, contribution=0.0 (over budget, penalized)
      Very_Expensive: score=0.0, contribution=0.0 (way over budget, penalized)

  # Example 4: Full Scoring Integration
  example_4_full_scoring:
    scenario: "Fishing trip with cost factor in full scoring"

    task_budget: 1.0

    proposals:
      - proposal_id: "cheap_uncertain"
        confidence: 0.6
        latency_score: 0.9
        cost: 0.20
        parallelism: 0.0
        track_record: 0.80
        load: 0.3

      - proposal_id: "expensive_confident"
        confidence: 0.95
        latency_score: 0.8
        cost: 0.80
        parallelism: 0.0
        track_record: 0.90
        load: 0.2

    scoring_breakdown: |
      Cheap, Uncertain:
        f1_confidence = 0.6
        f2_latency = 0.9
        f3_cost (normalized) = 1.0 - (0.20/1.0) = 0.80
        f4_parallelism = 0.0
        f5_track_record = 0.80
        f6_load = 0.3

        weighted_score = (10.0 × 0.6) + (8.0 × 0.9) + (-5.0 × 0.80) + (3.0 × 0.0) + (2.0 × 0.80) + (-4.0 × 0.3)
                       = 6.0 + 7.2 - 4.0 + 0.0 + 1.6 - 1.2
                       = 9.6

      Expensive, Confident:
        f1_confidence = 0.95
        f2_latency = 0.8
        f3_cost (normalized) = 1.0 - (0.80/1.0) = 0.20
        f4_parallelism = 0.0
        f5_track_record = 0.90
        f6_load = 0.2

        weighted_score = (10.0 × 0.95) + (8.0 × 0.8) + (-5.0 × 0.20) + (3.0 × 0.0) + (2.0 × 0.90) + (-4.0 × 0.2)
                       = 9.5 + 6.4 - 1.0 + 0.0 + 1.8 - 0.8
                       = 15.9

    result: |
      Expensive, Confident wins: 15.9 > 9.6 ✅

      Why? Confidence factor (10.0 weight) dominates cost factor (5.0 weight)
      - Expensive proposal "saves" 1.0 point on cost (-5.0 × 0.20 vs -5.0 × 0.80)
      - But gains 3.5 points on confidence (10.0 × 0.95 vs 10.0 × 0.6)
      - Net gain: 3.5 - 1.0 = 2.5 points (more than compensates for cost)

    lesson: |
      Cost is important but NOT THE PRIMARY FACTOR
      When confidence differs, the confident agent wins despite higher cost
      Cost matters most when confidence is similar

# Cost Model Details
cost_model_details:

  model_inference_costs: |
    **Agent Cost Breakdown**

    Simple Agents (e.g., Concierge):
    - Base cost per invocation: $0.001
    - Average tokens: 100 input + 50 output
    - Per-task cost: $0.003-0.01

    Standard Agents (e.g., Planner):
    - Base cost per invocation: $0.005
    - Average tokens: 500 input + 200 output
    - Per-task cost: $0.02-0.05

    Complex Agents (e.g., Researcher):
    - Base cost per invocation: $0.01
    - Average tokens: 1000 input + 500 output
    - Tool calls (e.g., web search): $0.001 each × 10 = $0.01
    - Per-task cost: $0.10-0.50

  budget_calibration: |
    **Recommended Budgets by Task Complexity**

    Quick Facts:
      budget: $0.01
      typical_winner: Simple agent

    Planning Tasks:
      budget: $0.50
      typical_winner: Standard agent

    Research Tasks:
      budget: $5.00
      typical_winner: Complex agent with tools

    Extended Analysis:
      budget: $20.00
      typical_winner: Researcher with multiple passes

  cost_quote_sources: |
    Agents provide cost estimates in proposal:

    {
      "agent_id": "planner",
      "estimated_cost": 0.045,
      "cost_breakdown": {
        "base_invocation": 0.005,
        "token_estimate": 0.030,
        "tool_calls": 0.010
      },
      "cost_confidence": 0.85  // 85% confident in this estimate
    }

# Normalization Strategies Comparison
strategy_comparison:

  strategy_linear: |
    **Linear (Current Implementation)**
    score = 1.0 - (quote / budget)
    Pros: Simple, intuitive, transparent
    Cons: No headroom concept like latency

  strategy_budget_slack: |
    **Budget Slack (Alternative)**
    if quote ≤ budget * 0.5:
        score = 1.0  (under half budget)
    else if quote ≤ budget:
        score = 2.0 * (1.0 - quote/budget)
    else:
        score = 0.0

    Pros: Rewards cost-efficient agents more
    Cons: More complex, two-tier scoring

  strategy_logarithmic: |
    **Logarithmic Scale (For Wide Cost Range)**
    score = 1.0 - log(quote + 1) / log(budget + 1)

    Pros: Reduces impact of outlier expensive agents
    Cons: Less intuitive, harder to explain to users

  decision_linear: |
    **Why We Use Linear:**
    ✓ Intuitive: 1.0 - ratio is easy to understand
    ✓ Transparent: Direct mapping of cost to score
    ✓ Fair: Equal cost increase = equal score decrease
    ✓ Predictable: Users can reason about impact

# Performance Characteristics
performance:

  time_complexity: "O(1) - single division and subtraction"

  performance_breakdown: |
    - Get quote from proposal: <0.01ms
    - Get budget from task: <0.01ms
    - Calculate ratio: <0.01ms
    - Apply normalization formula: <0.01ms
    - Total: <0.05ms per proposal

  p95_target: "<1ms for all 5 proposals"

# Testing & Validation
testing_validation:

  unit_tests:
    - "Zero cost (free) → score=1.0"
    - "Half budget → score=0.5"
    - "Full budget → score=0.0"
    - "Over budget → score=0.0 (clamped)"
    - "Negative cost (error) → score=0.0"
    - "Negative budget (error) → score=0.0"

  property_tests:
    - "Score is deterministic (same input → same output)"
    - "Score in [0.0, 1.0]"
    - "Score is monotonic (higher cost → lower score)"
    - "Score reaches 1.0 for free/cheap options"
    - "Score reaches 0.0 for expensive options"

  integration_tests:
    - "Proposal ranking with 5 agents (cost only)"
    - "Changing budget changes scores appropriately"
    - "Cost factor weighted correctly in full scoring"
    - "Expensive-but-confident wins over cheap-but-uncertain"

  performance_tests:
    - "Normalize 100 proposals in <1ms"
    - "P95 latency <0.2ms per proposal"

# Configuration
configuration:

  # Linear Normalization Parameter
  normalization_parameters:
    method: "linear"           # 1.0 - (quote/budget)
    clamping_min: 0.0          # Minimum score
    clamping_max: 1.0          # Maximum score

  # Tuning for Different Scenarios
  tuning_scenarios:
    cost_critical:
      weight: -8.0             # Increase cost penalty
      description: "For budget-constrained operations"

    cost_flexible:
      weight: -3.0             # Decrease cost penalty
      description: "For high-value tasks where cost is less important"

  # Cost Budget Presets
  budget_presets:
    cheap_task: 0.01
    standard_task: 0.50
    expensive_task: 5.00
    research_task: 20.00

