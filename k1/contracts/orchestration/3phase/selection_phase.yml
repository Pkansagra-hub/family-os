# Phase 2: Selection — Multi-Criteria Scoring
# Source ADR: ADR-0006 (3-Phase Orchestration)
# Sub-ADR: ADR-0006b (Multi-Criteria Scoring Algorithm)
# Defines proposal evaluation and best agent selection

metadata:
  contract_id: "selection-phase-v1.0"
  source_adr: "0006-3phase-orchestration-contract-net.md, 0006b-multi-criteria-scoring.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Selection Phase Overview
selection_overview:
  description: "Multi-Criteria Decision Making for optimal agent selection"
  purpose: "Score and rank proposals, select winner for task execution"
  research: |
    - TOPSIS (Hwang & Yoon, 1981) - Rank alternatives by distance to ideal
    - AHP (Saaty, 1980) - Pairwise comparison with weights
    - Pareto Optimization (Zitzler et al., 2003) - Non-dominated solutions
    - Google Borg (Verma et al., 2015) - Resource allocation with scoring
  latency_budget_ms: 30
  typical_latency_ms: 5
  current_status: "Production ready - 65% implementation complete"

# Input to Selection Phase
selection_input:
  source: "Proposal collection from Phase 1"
  data_structure: |
    proposals: List[Proposal]  # From bidding phase
    session: Session           # Current session context
    turn_plan: TurnPlan        # Original task to execute
  validation:
    - "At least 1 proposal (else fallback)"
    - "All proposals validated (invalid ones filtered out)"
    - "Session has valid budget and privacy band"

# Scoring Function (Multi-Criteria Weighted Sum)
scoring_function:

  # Overall Score Formula
  formula: |
    score(proposal) =
        w_confidence * norm_confidence(proposal.confidence)
      + w_latency * norm_latency(proposal.estimated_latency_ms)
      + w_cost * norm_cost(proposal.estimated_cost)
      + w_parallelism * bonus_parallelism(proposal.strategy)
      + w_track_record * agent_success_rate(proposal.agent_id)
      + w_specialization * bonus_specialization(proposal.agent_id, task_domain)
      - penalty_busy * agent_current_load(proposal.agent_id)

  # Interpretation
  rationale: |
    Weighted sum prioritizes:
    1. Confidence (agent knows how to do it) - MOST important
    2. Latency (can finish on time) - Speed matters for UX
    3. Cost (budget efficiency) - Penalize expensive options
    4. Parallelism (can run steps in parallel) - Faster overall execution
    5. Track record (historical success) - Proven reliability
    6. Specialization (domain expertise) - Better quality
    7. Load (busy agents may be bottleneck) - Penalize overloaded agents

# Scoring Weights (Default Configuration)
scoring_weights:

  w_confidence:
    value: 10.0
    description: "Most important: can agent successfully handle this task?"
    range: [1.0, 20.0]
    rationale: "A confident agent beats a fast but uncertain one"

  w_latency:
    value: 8.0
    description: "Speed of execution - critical for UX"
    range: [1.0, 15.0]
    rationale: "Users want fast responses, but not at cost of correctness"

  w_cost:
    value: -5.0
    description: "Negative weight penalizes expensive options"
    range: [-10.0, 0.0]
    rationale: "Prefer cheaper agents when confidence/latency equal"

  w_parallelism:
    value: 3.0
    description: "Bonus for parallel execution strategy"
    range: [0.0, 10.0]
    rationale: "Parallel execution can beat sequential even if slower per-step"

  w_track_record:
    value: 2.0
    description: "Historical agent success rate"
    range: [0.0, 5.0]
    rationale: "Proven agents better than new ones"

  w_specialization:
    value: 1.5
    description: "Bonus for domain expertise"
    range: [0.0, 5.0]
    rationale: "Nice-to-have, not critical"

  penalty_busy:
    value: -4.0
    description: "Penalty for overloaded agents"
    range: [-10.0, 0.0]
    rationale: "Prefer available agents over busy ones"

# Normalization Functions
normalization:

  # 1. Confidence Normalization
  norm_confidence:
    input: "proposal.confidence (0.0-1.0)"
    output: "0.0-1.0 (already normalized)"
    formula: "confidence_score = proposal.confidence"

  # 2. Latency Normalization
  norm_latency:
    input: "proposal.estimated_latency_ms"
    budget: "session.budget.latency_ms"
    formula: |
      if estimated_latency_ms <= budget * 0.5:
          latency_score = 1.0  # Well within budget
      elif estimated_latency_ms >= budget:
          latency_score = 0.0  # Over budget
      else:
          # Linear interpolation in range [0.5x budget, 1.0x budget]
          latency_score = 1.0 - (estimated - budget*0.5) / (budget*0.5)

    examples:
      - "Budget=200ms, Estimate=100ms → score=1.0 (best)"
      - "Budget=200ms, Estimate=150ms → score=0.5 (mid-range)"
      - "Budget=200ms, Estimate=200ms → score=0.0 (at limit)"
      - "Budget=200ms, Estimate=250ms → score=0.0 (over budget, clamped)"

  # 3. Cost Normalization
  norm_cost:
    input: "proposal.estimated_cost"
    budget: "session.budget.cost"
    formula: |
      if estimated_cost <= budget * 0.5:
          cost_score = 1.0  # Well within budget
      elif estimated_cost >= budget:
          cost_score = 0.0  # Over budget
      else:
          # Linear interpolation in range [0.5x budget, 1.0x budget]
          cost_score = 1.0 - (estimated - budget*0.5) / (budget*0.5)

    rationale: "Same as latency - penalize expensive options"

  # 4. Parallelism Bonus
  bonus_parallelism:
    input: "proposal.strategy ('parallel' | 'sequential' | 'hybrid')"
    scoring: |
      if strategy == "parallel":
          bonus = 1.0  # Best
      elif strategy == "hybrid":
          bonus = 0.5  # Good
      elif strategy == "sequential":
          bonus = 0.0  # Base (no bonus)

  # 5. Track Record
  agent_success_rate:
    source: "Learning loop metrics"
    calculation: |
      success_rate = successful_tasks / total_tasks (for agent)
      # Normalize to [0.0, 1.0]
      if total_tasks == 0:
          success_rate = 0.5  # Neutral for new agents
    range: [0.0, 1.0]

  # 6. Specialization Bonus
  bonus_specialization:
    description: "Agent expertise in task domain"
    input: "proposal.agent_id, task_domain"
    examples:
      - "Researcher for knowledge task → +1.0"
      - "Planner for planning task → +1.0"
      - "Concierge for routing → +1.0"
      - "Generic agent for unknown domain → +0.0"

  # 7. Load Penalty
  agent_current_load:
    source: "Session roster"
    metric: "Current mailbox size / max_mailbox_size"
    range: [0.0, 1.0]
    interpretation: |
      0.0 = idle (no penalty)
      0.5 = half busy (moderate penalty)
      1.0 = full (maximum penalty)

# Scoring Example
scoring_example:

  scenario: "User asks: 'Plan a fishing trip with my son'"

  proposals_received:
    - agent_id: "concierge"
      confidence: 0.7
      estimated_latency_ms: 180
      estimated_cost: 0.3
      strategy: "sequential"
      success_rate: 0.92
      current_load: 0.3

    - agent_id: "planner"
      confidence: 0.9
      estimated_latency_ms: 220
      estimated_cost: 0.6
      strategy: "parallel"
      success_rate: 0.88
      current_load: 0.7

    - agent_id: "researcher"
      confidence: 0.6
      estimated_latency_ms: 450
      estimated_cost: 0.4
      strategy: "sequential"
      success_rate: 0.75
      current_load: 0.2

  session_budget:
    latency_ms: 250
    cost: 1.0

  scoring_calculation:

    # Concierge scoring
    concierge_score:
      confidence: 0.7 * 10.0 = 7.0
      latency: 1.0 * 8.0 = 8.0  # 180ms < 125ms budget*0.5 → score=1.0
      cost: 0.7 * -5.0 = -3.5  # 0.3 < 0.5 budget → score=0.7
      parallelism: 0.0 * 3.0 = 0.0
      track_record: 0.92 * 2.0 = 1.84
      specialization: 0.8 * 1.5 = 1.2  # Concierge for routing +0.8
      load_penalty: 0.3 * -4.0 = -1.2
      total: 7.0 + 8.0 - 3.5 + 0.0 + 1.84 + 1.2 - 1.2 = **13.34**

    # Planner scoring
    planner_score:
      confidence: 0.9 * 10.0 = 9.0
      latency: 0.88 * 8.0 = 7.04  # 220ms is in [125ms, 250ms] → 0.88
      cost: 0.4 * -5.0 = -2.0  # 0.6 > 0.5 budget → 0.4
      parallelism: 1.0 * 3.0 = 3.0
      track_record: 0.88 * 2.0 = 1.76
      specialization: 1.0 * 1.5 = 1.5  # Planner for planning +1.0
      load_penalty: 0.7 * -4.0 = -2.8
      total: 9.0 + 7.04 - 2.0 + 3.0 + 1.76 + 1.5 - 2.8 = **17.5**

    # Researcher scoring
    researcher_score:
      confidence: 0.6 * 10.0 = 6.0
      latency: 0.1 * 8.0 = 0.8  # 450ms > 250ms budget → score=0.0, clamped
      cost: 0.6 * -5.0 = -3.0
      parallelism: 0.0 * 3.0 = 0.0
      track_record: 0.75 * 2.0 = 1.5
      specialization: 0.3 * 1.5 = 0.45  # Researcher for knowledge +0.3
      load_penalty: 0.2 * -4.0 = -0.8
      total: 6.0 + 0.8 - 3.0 + 0.0 + 1.5 + 0.45 - 0.8 = **5.05**

  winner: "Planner (score: 17.5 > Concierge: 13.34 > Researcher: 5.05)"

# Selection Algorithm Implementation
selection_algorithm:

  # Step 1: Calculate Scores
  calculate_all_scores: |
    scored_proposals = []
    for proposal in proposals:
        score = calculate_score(proposal, session)
        scored_proposals.append((proposal, score))

  # Step 2: Sort by Score (Descending)
  sort_by_score: |
    scored_proposals.sort(key=lambda x: x[1], reverse=True)

  # Step 3: Select Winner
  select_winner: |
    if len(scored_proposals) == 0:
        return None  # No proposals (fallback to Phase 1)

    winner_proposal, winner_score = scored_proposals[0]
    return winner_proposal

  # Step 4: Tie-Breaking
  tie_breaking: |
    if scored_proposals[0][1] == scored_proposals[1][1]:
        # Scores are equal, apply tie-breaker

        # Tie-break 1: Prefer resident agents (already warm)
        if scored_proposals[0][0].agent_type == "resident":
            return scored_proposals[0][0]

        # Tie-break 2: Prefer lower latency
        if (scored_proposals[0][0].estimated_latency_ms <
            scored_proposals[1][0].estimated_latency_ms):
            return scored_proposals[0][0]

        # Tie-break 3: Random (avoid bias)
        import random
        return random.choice([scored_proposals[0][0], scored_proposals[1][0]])

  # Step 5: Log Selection Reasoning
  log_selection: |
    logger.info(
        "agent_selected",
        winner_agent_id=winner.agent_id,
        winner_score=winner_score,
        all_scores=[(p.agent_id, s) for p, s in scored_proposals],
        reasoning=f"Selected {winner.agent_id} (score: {winner_score:.2f})"
    )

# Output from Selection Phase
selection_output:
  winning_proposal: Proposal
  winner_score: float
  all_scores: List[Tuple[str, float]]
  selection_reasoning: str

# Performance Monitoring
performance_monitoring:

  # Metrics
  metrics:
    selection_latency_ms:
      type: Histogram
      description: "Selection phase duration (scoring + ranking)"
      buckets: [1, 2, 5, 10, 20, 30]
      p95_target: 30

    selection_score_distribution:
      type: Histogram
      description: "Winner score values"
      buckets: [0, 5, 10, 15, 20, 25, 30]

    winning_agent_frequency:
      type: Counter
      description: "How often each agent wins selection"
      labels: ["agent_id"]

    selection_diversity:
      type: Gauge
      description: "Number of different agents winning across tasks"

  # Alerts
  alerts:
    slow_selection:
      trigger: "selection_latency_ms > 30ms for 5% of tasks"
      action: "Investigate scoring function efficiency"
      severity: "WARNING"

    same_agent_monopoly:
      trigger: "Same agent wins >80% of selections for 1 hour"
      action: "Check if other agents are blacklisted or broken"
      severity: "WARNING"

# Error Handling
error_handling:

  # No Proposals
  no_proposals:
    scenario: "Proposal list is empty"
    action: "Return None (fallback to Phase 1 - retry negotiation)"
    recovery: "Hire new agent or simplify task"

  # Invalid Scores
  invalid_scores:
    scenario: "Scoring produces NaN or Inf values"
    action: "Log error, treat as score=0 (lowest priority)"
    prevention: "Validate normalization outputs"

  # Tie-Breaking Failure
  tie_breaking_failure:
    scenario: "Tie-breaker rules inconclusive"
    action: "Random selection (acceptable, prevents stalemate)"

# Testing & Validation
testing_validation:

  # Unit Tests
  unit_tests:
    - "Normalization functions (confidence, latency, cost)"
    - "Scoring formula correctness"
    - "Weight configuration loading"
    - "Tie-breaking logic"
    - "Edge cases (zero proposals, all equal scores, extreme values)"

  # Integration Tests
  integration_tests:
    - "Full scoring pipeline with sample proposals"
    - "Selection with varying weights"
    - "Ranking correctness with multiple proposals"
    - "Explainability logging"

  # Property Tests
  property_tests:
    - "Score normalization always produces [0, max_value] range"
    - "Winner is always highest-scoring proposal"
    - "Consistent ranking across multiple runs"
    - "Weight changes produce predictable score changes"

# Configuration
configuration:

  # Default Weights (tunable)
  default_weights:
    w_confidence: 10.0
    w_latency: 8.0
    w_cost: -5.0
    w_parallelism: 3.0
    w_track_record: 2.0
    w_specialization: 1.5
    penalty_busy: -4.0

  # Weight Presets (for different scenarios)
  weight_presets:
    latency_critical: |
      # Minimize latency at cost of other factors
      w_latency: 20.0
      w_confidence: 8.0
      w_cost: -2.0

    cost_conscious: |
      # Minimize cost
      w_cost: -10.0
      w_confidence: 8.0
      w_latency: 5.0

    quality_first: |
      # Maximize quality (confidence + specialization)
      w_confidence: 15.0
      w_specialization: 3.0
      w_latency: 5.0

  # Tunable Parameters
  tunable_parameters:
    - "weight_*: Adjust scoring weights for different optimization goals"
    - "normalization_functions: Can override for custom behavior"

# Implementation Status
implementation_status:
  scoring_function: "COMPLETED"
  normalization: "COMPLETED"
  selection_algorithm: "COMPLETED"
  tie_breaking: "COMPLETED"
  performance_monitoring: "COMPLETED"
  error_handling: "COMPLETED"
  overall_completion: "90%"

# Research Backing
research_backing:
  - "TOPSIS (Hwang & Yoon, 1981) - Multi-criteria ranking"
  - "AHP (Saaty, 1980) - Hierarchical decision making"
  - "Pareto Optimization (Zitzler et al., 2003) - Non-dominated solutions"
  - "Google Borg Scheduling (Verma et al., 2015) - Production scoring"
  - "Kubernetes Scheduler (Redhat) - Multi-dimensional resource scoring"
