# Contract Net Protocol (CNP) Message Formats
# Source ADR: ADR-0006 (3-Phase Orchestration)
# Sub-ADR: ADR-0006a (Contract Net Negotiation Protocol)
# Defines FSM, message types, timeouts, and research backing

metadata:
  contract_id: "contract-net-protocol-v1.0"
  source_adr: "0006-3phase-orchestration-contract-net.md, 0006a-contract-net-negotiation.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]
  research_foundation: "Smith, 1980 - Contract Net Protocol for multi-agent task allocation"

# Protocol Overview
protocol_overview:
  description: "Contract Net Protocol for distributed task allocation and agent bidding"
  purpose: "Enable agents to bid for tasks based on capability, cost, and availability"
  standardization: "FIPA ACL (Agent Communication Language) foundation"
  use_cases:
    - "Multi-agent coordination for complex tasks"
    - "Dynamic load balancing"
    - "Resource allocation with heterogeneous agents"
  scale: "Tested with 58 agents (4 AI + 54 pure actors)"

# Research Foundation
research_foundation:
  smith_1980: |
    **Contract Net Protocol (Smith, 1980)**
    - Seminal paper on multi-agent task allocation
    - Task announcements → agent bidding → manager selection
    - Handles dynamic agent availability and heterogeneous capabilities
    - Decentralized decision-making with central coordination
    - Used in robotics (RoboCup), manufacturing, distributed systems

  fipa_acl: |
    **FIPA Agent Communication Language (IEEE, 2002)**
    - Standardized agent communication framework
    - Message types: REQUEST, INFORM, PROPOSE, REFUSE, ACCEPT-PROPOSAL
    - Performatives for agent interaction

  blackboard_architecture: |
    **Blackboard Architecture (Erman et al., 1980)**
    - Shared workspace for agent proposals
    - Central controller manages access and coordination
    - Reduces agent coupling compared to pure peer-to-peer

# FSM (Finite State Machine)
protocol_fsm:

  # Manager (Orchestrator) States
  manager_states:
    INIT:
      description: "Initial state, prepare for task announcement"
      entry_action: "Load task details from Planner"
      transitions:
        - "→ ANNOUNCE (on announce_task event)"

    ANNOUNCE:
      description: "Broadcast task announcement to agents"
      entry_action: |
        - Create TaskAnnouncement with requirements
        - Broadcast to all ACTIVE agents
        - Set proposal collection deadline
      duration_ms: 5
      transitions:
        - "→ COLLECT_PROPOSALS (on broadcast_complete event)"

    COLLECT_PROPOSALS:
      description: "Wait for agent proposals"
      entry_action: |
        - Start proposal collection loop
        - Poll proposal queue every 5ms
        - Track deadline (50ms typical)
      duration_ms: "1-50 (depending on proposals received)"
      timeout_ms: 50
      transitions:
        - "→ SELECT_WINNER (on deadline_reached or enough_proposals event)"

    SELECT_WINNER:
      description: "Score proposals and select winner"
      entry_action: |
        - Calculate score for each proposal
        - Rank by score (descending)
        - Select highest-scoring proposal
      duration_ms: 5
      transitions:
        - "→ AWARD_TASK (on winner_selected event)"

    AWARD_TASK:
      description: "Send award notification to winner"
      entry_action: |
        - Send task award message to winning agent
        - Send rejection notices to other bidders
        - Update metrics and logging
      duration_ms: 2
      transitions:
        - "→ EXECUTE_TASK (on award_complete event)"

    EXECUTE_TASK:
      description: "Monitor task execution"
      entry_action: |
        - Start execution phase with winning agent
        - Monitor for completion or failure
        - Collect results
      duration_ms: "Variable (50-2000ms typical)"
      transitions:
        - "→ COMPLETE (on task_complete event)"
        - "→ HANDLE_FAILURE (on task_failure event)"

    HANDLE_FAILURE:
      description: "Handle task execution failure"
      entry_action: |
        - Classify failure type (transient, permanent)
        - Decide: retry, fallback, or abort
      duration_ms: "<10 (decision logic)"
      transitions:
        - "→ ANNOUNCE (on retry_task event)"
        - "→ COMPLETE (on abort event)"

    COMPLETE:
      description: "Task completed (success or graceful failure)"
      entry_action: |
        - Finalize results
        - Update metrics
        - Return to idle state

  # Agent (Bidder) States
  agent_states:
    IDLE:
      description: "Waiting for task announcements"
      entry_action: "Monitor mailbox for TaskAnnouncement"
      transitions:
        - "→ EVALUATE (on task_announcement received)"

    EVALUATE:
      description: "Evaluate task feasibility"
      entry_action: |
        - Check capability requirements
        - Estimate execution time and cost
        - Calculate confidence score
      duration_ms: "<10 (deterministic for pure actors, ~5-50 for AI)"
      transitions:
        - "→ SUBMIT_PROPOSAL (on can_handle event)"
        - "→ IDLE (on cannot_handle event)"

    SUBMIT_PROPOSAL:
      description: "Submit bid to Orchestrator"
      entry_action: |
        - Create Proposal message
        - Send to orchestrator.proposal_queue
        - Return to idle state
      duration_ms: "<1 (async send)"
      transitions:
        - "→ IDLE (on proposal_submitted event)"

    AWARDED:
      description: "Task awarded to this agent"
      entry_action: "Receive task award message"
      transitions:
        - "→ EXECUTE (on task_details_received event)"

    EXECUTE:
      description: "Executing assigned task"
      entry_action: |
        - Begin execution phase
        - Process steps in order
        - Handle errors and timeouts
      duration_ms: "Variable (50-2000ms typical)"
      transitions:
        - "→ REPORT_RESULT (on execution_complete event)"

    REPORT_RESULT:
      description: "Report execution results back to Orchestrator"
      entry_action: "Send ExecutionResult message"
      duration_ms: "<5 (send)"
      transitions:
        - "→ IDLE (on result_sent event)"

# Message Types
message_types:

  # Task Announcement (Manager → Agents)
  task_announcement:
    name: "TaskAnnouncement"
    sender: "Orchestrator"
    recipients: "All ACTIVE agents"
    timing: "Broadcast (send-and-forget)"

    schema: |
      {
        "message_type": "TASK_ANNOUNCEMENT",
        "sender_id": "orchestrator_1",
        "task_id": "uuid",
        "turn_plan": {
          "steps": [
            {"id": "step_1", "op": "Tool", "tool_name": "..."},
            {"id": "step_2", "op": "Model", "prompt": "..."},
            ...
          ],
          "dependencies": {
            "step_2": ["step_1"]  # step_2 depends on step_1
          }
        },
        "requirements": {
          "latency_budget_ms": 250,
          "cost_budget": 1.0,
          "privacy_band": "GREEN|AMBER|RED",
          "context_summary": "..."
        },
        "deadline_ms": 50,  # Agents must respond by this time
        "created_at": "2025-10-15T12:00:00Z",
        "session_id": "session_123"
      }

    processing: |
      # Agent receives and queues
      agent.mailbox.receive(task_announcement)

      # Agent evaluates asynchronously
      asyncio.create_task(agent.evaluate_and_bid(task_announcement))

  # Proposal (Agent → Manager)
  proposal:
    name: "Proposal"
    sender: "Agent"
    recipient: "Orchestrator"
    timing: "Async (non-blocking)"

    schema: |
      {
        "message_type": "PROPOSAL",
        "sender_id": "agent_123",
        "task_id": "uuid",
        "estimated_latency_ms": 180,
        "estimated_cost": 0.3,
        "confidence": 0.85,
        "strategy": "parallel",
        "tools_required": ["FlightSearch", "WeatherAPI"],
        "reasoning": "I have tools for flights and weather, can parallelize...",
        "agent_load": 2,  # Current mailbox size
        "success_rate": 0.92,  # Historical success
        "fallback_plan": {...},  # Optional
        "created_at": "2025-10-15T12:00:00.145Z"
      }

    submission: |
      # Non-blocking queue submission
      orchestrator.proposal_queue.put_nowait(proposal)

      # If queue full, proposal lost (acceptable timeout)

  # Award (Manager → Winning Agent)
  award:
    name: "TaskAward"
    sender: "Orchestrator"
    recipient: "Winning agent"
    timing: "Direct message to agent mailbox"

    schema: |
      {
        "message_type": "TASK_AWARD",
        "sender_id": "orchestrator_1",
        "task_id": "uuid",
        "winner_agent_id": "agent_123",
        "awarded_proposal": {...},  # Echo back proposal
        "execution_deadline_ms": 2000,
        "session_context": {...}
      }

  # Rejection (Manager → Non-Winning Agents)
  rejection:
    name: "TaskRejection"
    sender: "Orchestrator"
    recipient: "Non-winning agents (optional)"
    timing: "Direct message (optional, for fairness)"

    schema: |
      {
        "message_type": "TASK_REJECTION",
        "task_id": "uuid",
        "reason": "Another agent selected",
        "winning_agent_id": "agent_123"
      }

  # Execution Result (Awarded Agent → Manager)
  execution_result:
    name: "ExecutionResult"
    sender: "Winning agent"
    recipient: "Orchestrator"
    timing: "Async message"

    schema: |
      {
        "message_type": "EXECUTION_RESULT",
        "task_id": "uuid",
        "status": "SUCCESS|FAILURE|PARTIAL",
        "step_results": {
          "step_1": {...},
          "step_2": {...},
          ...
        },
        "execution_latency_ms": 185,
        "actual_cost": 0.28,
        "error_log": [],
        "trace_id": "uuid"
      }

# Timeout Specifications
timeouts:

  # Phase 1: Negotiation Timeouts
  proposal_deadline_ms:
    description: "Agents must submit proposals within this time"
    default: 50
    rationale: "50ms allows ~10 agents to evaluate and bid"
    range: [20, 100]

  proposal_collection_timeout_ms:
    description: "Manager waits this long to collect proposals"
    default: 50
    rationale: "Wait full deadline for best options"
    range: [20, 100]

  # Phase 2: Selection Timeout
  selection_timeout_ms:
    description: "Time to score and rank proposals"
    default: 5
    range: [1, 20]
    note: "Usually instant (<5ms)"

  # Phase 3: Execution Timeouts
  execution_deadline_ms:
    description: "Awarded agent must complete execution"
    default: 2000
    range: [500, 5000]
    note: "Includes all steps (Tool, Model, Ask, etc.)"

  tool_timeout_ms:
    description: "Single tool call timeout"
    default: 1000
    range: [100, 3000]

  model_timeout_ms:
    description: "Single LLM call timeout"
    default: 100
    range: [50, 500]

  ask_timeout_ms:
    description: "User input timeout"
    default: 30000
    range: [5000, 120000]

  # Protocol-Level Timeouts
  protocol_timeout_ms:
    description: "Total phase time (negotiation + selection + execution)"
    default: 2500
    range: [1000, 10000]
    note: "P95 target: 2000ms"

# Message Exchange Diagram
message_exchange: |
  Manager                           Agents
  ┌─────────┐                       ┌─────────────┐
  │Announce │ ─────────────────────>│Concierge    │
  │(50ms DL)│  TASK_ANNOUNCEMENT    │Planner      │
  │         │ ─────────────────────>│Researcher   │
  │         │ ─────────────────────>│Safety_Watch │
  │         │                       │...          │
  └─────────┘                       └─────────────┘
        │                                  │
        │          Evaluate                │
        │<─────────────────────────────────│
        │          PROPOSAL (Agent A)      │
        │<─────────────────────────────────│
        │          PROPOSAL (Agent B)      │
        │<─────────────────────────────────│
        │          (timeout if no more)    │
        │                                  │
  ┌─────────┐
  │ Select  │  (1-5ms)
  │ Winner  │
  └─────────┘
        │
        │              TASK_AWARD
        │─────────────────────────>│ Agent A
        │                          │
        │     TASK_REJECTION       │
        │─────────────────────────>│ Agents B, C, ...
        │                          │
        │                    EXECUTE (Phase 3)
        │                          │
        │     EXECUTION_RESULT     │
        │<─────────────────────────│
        │                          │
  ┌─────────┐
  │Complete │
  └─────────┘

# Error Handling
error_handling:

  # No Proposals
  no_proposals_received:
    scenario: "Deadline reached, zero proposals"
    manager_action: |
      if can_hire_new_agent():
          hire_agent()
          retry_negotiation()
      elif can_simplify_task():
          simplify_task()
          retry_negotiation()
      else:
          graceful_degradation()

  # Proposal Queue Full
  proposal_queue_overflow:
    scenario: "Agent tries to submit but queue full"
    agent_action: "Discard proposal (non-blocking architecture)"
    impact: "One less option in selection"
    rationale: "Better to lose proposal than block agent"

  # Award Message Lost
  award_message_lost:
    scenario: "Winning agent never receives award"
    detection: "No ExecutionResult received after execution_deadline_ms"
    recovery: |
      - Timeout waiting for result
      - Mark agent as slow/unresponsive
      - Possibly blacklist if repeated

  # Slow Responder
  slow_responder:
    scenario: "Agent takes >50ms to evaluate task"
    impact: "Proposal arrives after deadline"
    handling: "Collect anyway (late-arriving proposal)"

# Observability & Metrics
observability:

  # Metrics
  metrics:
    cnp_negotiation_latency_ms:
      type: Histogram
      labels: ["phase"]  # ANNOUNCE, COLLECT_PROPOSALS, SELECT_WINNER
      buckets: [1, 2, 5, 10, 20, 50, 100]

    proposal_count:
      type: Histogram
      description: "Number of proposals per task"
      buckets: [0, 1, 2, 3, 4, 5, 10]

    bidding_rate:
      type: Gauge
      description: "Percentage of agents that bid"

    winning_agent_frequency:
      type: Counter
      labels: ["agent_id"]

    message_latency_ms:
      type: Histogram
      labels: ["message_type"]
      description: "Message delivery latency"

  # Logging
  logging:
    level: "INFO"
    events:
      - "task_announcement_sent"
      - "proposal_received"
      - "proposal_selected"
      - "task_awarded"
      - "execution_completed"
      - "protocol_timeout"
      - "protocol_error"

  # Tracing
  tracing:
    format: "OpenTelemetry"
    fields:
      - "trace_id (for full E2E tracing)"
      - "span_id (for phase tracking)"
      - "task_id"
      - "agent_id"
      - "proposal_score"

# Implementation Requirements
implementation_requirements:

  # Language & Framework
  language: "Python 3.10+"
  async_framework: "asyncio"
  serialization: "JSON (for messages), FlatBuffers (for K0)"

  # Queue Implementation
  proposal_queue:
    type: "asyncio.Queue"
    maxsize: 100
    policy: "FIFO (first-in, first-out)"
    timeout_behavior: "Discardmessage if full (non-blocking)"

  # Timer/Deadline Management
  deadline_tracking:
    implementation: "monotonic clock (time.monotonic())"
    representation: "absolute deadline_ms = now() + relative_ms"
    advantage: "Immune to system clock adjustments"

  # Fault Tolerance
  fault_tolerance:
    assumptions: "Agents may crash, proposals may be lost, timeouts expected"
    resilience:
      - "Timeouts prevent indefinite blocking"
      - "Non-blocking queue prevents agent deadlock"
      - "Fallback strategies for no proposals"

# Testing & Validation
testing_validation:

  # Unit Tests
  unit_tests:
    - "Message creation and serialization (TaskAnnouncement, Proposal, etc.)"
    - "FSM state transitions"
    - "Timeout enforcement"
    - "Queue handling (full, empty, timeout)"

  # Integration Tests
  integration_tests:
    - "Full CNP round (announce → bid → award → execute)"
    - "Multiple agents bidding"
    - "No proposals → fallback"
    - "Slow agents (proposal after deadline)"
    - "Agent crash during execution"

  # Performance Tests
  performance_tests:
    - "50 agents bidding in <50ms"
    - "Proposal queue throughput (>1000/sec)"
    - "Message serialization overhead"

# Compliance
compliance:

  # Standards
  standards:
    - "FIPA ACL (Agent Communication Language)"
    - "IEEE 1541-2002"

  # Specifications
  specifications:
    - "RFC 7231 (HTTP semantics for tool calls)"
    - "OpenTelemetry specification for tracing"

# Configuration
configuration:

  # Default Timeouts
  default_timeouts:
    proposal_deadline_ms: 50
    proposal_collection_timeout_ms: 50
    selection_timeout_ms: 5
    execution_deadline_ms: 2000

  # Tunable Parameters
  tunable_parameters:
    - "proposal_deadline_ms: Adjust based on agent evaluation complexity"
    - "proposal_collection_timeout_ms: Adjust for latency targets"
    - "Weights in selection scoring: Adjust priority (confidence vs latency)"

# Implementation Status
implementation_status:
  message_types: "COMPLETED"
  fsm_definition: "COMPLETED"
  timeout_management: "COMPLETED"
  error_handling: "COMPLETED"
  observability: "COMPLETED"
  overall_completion: "90%"

# Research Backing
research_backing:
  - "Contract Net Protocol (Smith, 1980) - Seminal multi-agent coordination"
  - "FIPA ACL (IEEE 1541-2002) - Standardized agent communication"
  - "Blackboard Architecture (Erman et al., 1980) - Proposal collection"
  - "Actor Model (Hewitt, 1973) - Non-blocking concurrency"
  - "Temporal.io Patterns (Uber, 2020) - Message-driven orchestration"
