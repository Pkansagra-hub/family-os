# Phase 3: Execution — Parallel DAG Execution
# Source ADR: ADR-0006 (3-Phase Orchestration)
# Sub-ADR: ADR-0006c (Parallel DAG Execution), ADR-0006d (Saga Pattern Integration)
# Defines task execution with parallel steps and error recovery

metadata:
  contract_id: "execution-phase-v1.0"
  source_adr: "0006-3phase-orchestration-contract-net.md, 0006c-parallel-dag-execution.md, 0006d-saga-pattern-integration.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Execution Phase Overview
execution_overview:
  description: "Execute winning proposal with parallel DAG and error recovery"
  purpose: "Run plan steps in dependency order, parallelize independent steps, handle failures"
  research: |
    - Apache Airflow (Airbnb, 2014) - DAG dependency-aware execution
    - Dask (Rocklin, 2015) - Parallel computation graphs
    - Ray (Moritz et al., 2018) - Distributed execution framework
    - Temporal Workflows (Uber, 2020) - Durable orchestration with Saga pattern
  latency_budget_ms: "Variable (task-dependent), typical 150-200ms"
  current_status: "Production ready - 65% implementation complete"

# Input to Execution Phase
execution_input:
  source: "Selection phase winner"
  data_structure: |
    winning_proposal: Proposal    # Chosen agent
    turn_plan: TurnPlan           # Steps with dependencies to execute
    session: Session              # Session context
  validation:
    - "winning_proposal is valid"
    - "turn_plan has valid steps"
    - "Selected agent is in ACTIVE state"

# DAG Construction
dag_construction:

  # Step 1: Parse Plan as DAG
  parse_plan_to_dag:
    input: "turn_plan.steps (list of steps)"
    output: "DAG(nodes, edges)"
    algorithm: |
      nodes = {}  # step_id -> Step
      edges = {}  # step_id -> [dependent_step_ids]

      for step in turn_plan.steps:
          nodes[step.id] = step
          edges[step.id] = step.dependencies or []

  # Step 2: DAG Validation
  validate_dag:
    checks:
      - "No cycles (acyclic requirement)"
      - "All dependencies reference valid steps"
      - "No missing steps"
    error_handling: "DAG with cycles → error, fallback to sequential"

  # Step 3: Data Structure
  dag_structure: |
    class ExecutionDAG:
        nodes: Dict[str, Step]              # step_id -> Step
        edges: Dict[str, List[str]]         # step_id -> [dep step_ids]

    def get_ready_steps(self, completed: Set[str]) -> List[Step]:
        """Return steps whose all dependencies are completed"""
        ready = []
        for step_id, step in self.nodes.items():
            if step_id in completed:
                continue  # Already done

            # Check if all dependencies completed
            deps = self.edges[step_id]
            if all(dep in completed for dep in deps):
                ready.append(step)

        return ready

    def is_parallelizable(self, steps: List[Step]) -> bool:
        """Check if steps can run in parallel (no mutual dependencies)"""
        for i, step_a in enumerate(steps):
            for step_b in steps[i+1:]:
                if step_a.id in self.edges[step_b.id]:
                    return False  # step_b depends on step_a
                if step_b.id in self.edges[step_a.id]:
                    return False  # step_a depends on step_b
        return True

# Execution Strategy
execution_strategy:

  # Strategy 1: Parallel Execution (for independent steps)
  parallel_execution:
    trigger: "Multiple ready steps with no mutual dependencies"
    mechanism: |
      # Get ready steps
      ready = dag.get_ready_steps(completed)

      # Check if can parallelize
      if dag.is_parallelizable(ready):
          # Create concurrent tasks
          tasks = [execute_step(step, ...) for step in ready]
          results = await asyncio.gather(*tasks, return_exceptions=True)
      else:
          # Sequential fallback
          results = [await execute_step(step, ...) for step in ready]

    concurrency_limit: 3
    rationale: "Parallelize independent steps to minimize latency"

  # Strategy 2: Sequential Execution (for dependent steps)
  sequential_execution:
    trigger: "Steps with dependencies or parallelism disabled"
    mechanism: |
      while len(completed) < len(dag.nodes):
          ready = dag.get_ready_steps(completed)

          for step in ready:
              result = await execute_step(step, ...)
              if not isinstance(result, Exception):
                  completed.add(step.id)
              else:
                  # Error handling (see below)
                  handle_error(step, result)

    rationale: "Sequential for clear error propagation"

  # Strategy 3: Hybrid (Mixed)
  hybrid_execution:
    description: "Some steps parallel, some sequential based on dependencies"
    example: |
      Wave 1: Step A (sequential requirement first)
      Wave 2: Steps B + C (parallel, both ready after A)
      Wave 3: Step D (depends on B and C)

# Step Execution
step_execution:

  # Supported Step Types
  step_types:
    Tool:
      description: "External tool call (MCP, REST API, WASM)"
      handler: "execute_tool()"
      examples: ["FlightSearch", "WeatherAPI", "Calculator"]
      latency_budget: "Per tool (default 1000ms)"

    Model:
      description: "LLM inference (Model Hub call)"
      handler: "execute_model()"
      examples: ["Intent classification", "Summarization", "Generation"]
      latency_budget: "Per agent (30-100ms typical)"

    Ask:
      description: "Ask user for input (interactive)"
      handler: "execute_ask()"
      examples: ["Confirm action", "Clarify requirement", "Get permission"]
      latency_budget: "User-dependent (30s typical, configurable)"

    Memory:
      description: "Read/write SessionState or K0"
      handler: "execute_memory()"
      examples: ["Fetch context", "Store result", "Update preferences"]
      latency_budget: "<10ms (in-process)"

  # Execute Tool Step
  execute_tool: |
    async def execute_tool(step, agent, session, previous_results):
        """Execute external tool and return result"""
        async with concurrency_semaphore:  # Limit concurrency
            tool_name = step.tool_name
            tool_input = step.input or {}

            # Resolve variable references from previous steps
            for key, value in tool_input.items():
                if isinstance(value, str) and value.startswith("$"):
                    ref_step_id = value[1:]  # e.g., "$step_1" -> "step_1"
                    tool_input[key] = previous_results.get(ref_step_id)

            # Execute tool with timeout
            try:
                tool_result = await agent.execute_tool(
                    tool_name=tool_name,
                    tool_input=tool_input,
                    timeout_ms=step.timeout_ms or 1000
                )
                return tool_result
            except asyncio.TimeoutError:
                # Tool timeout - error handling
                raise ToolTimeoutError(f"Tool {tool_name} timeout after {step.timeout_ms}ms")

  # Execute Model Step
  execute_model: |
    async def execute_model(step, agent, session, previous_results):
        """Execute LLM inference and return result"""
        async with concurrency_semaphore:  # Limit concurrency
            prompt = step.prompt or ""

            # Resolve variable references
            for key, value in previous_results.items():
                prompt = prompt.replace(f"${{{key}}}", str(value))

            # Execute with budget timeout
            budget_ms = session.personality.llm_config.budget_ms
            try:
                result = await agent.call_model(
                    prompt=prompt,
                    timeout_ms=budget_ms
                )
                return result
            except asyncio.TimeoutError:
                raise LLMBudgetExceededError(f"LLM timeout after {budget_ms}ms")

  # Execute Ask Step
  execute_ask: |
    async def execute_ask(step, session):
        """Ask user for input (interactive)"""
        message = step.message or "Please respond..."

        # Send to user (via WebSocket or SSE)
        response_id = uuid4()
        session.pending_asks[response_id] = step.id

        # Wait for user response (with timeout)
        try:
            user_response = await asyncio.wait_for(
                session.ask_response_queue.get(),
                timeout=step.timeout_ms or 30000
            )
            return user_response
        except asyncio.TimeoutError:
            # User didn't respond - error handling
            raise UserTimeoutError(f"User timeout after {step.timeout_ms}ms")

  # Execute Memory Step
  execute_memory: |
    async def execute_memory(step, session):
        """Read/write session memory"""
        if step.op == "read":
            return session.state.read(step.key)
        elif step.op == "write":
            session.state.write(step.key, step.value)
            return {"status": "written"}

# Parallel Execution with Barriers
parallel_execution:

  # Concurrency Control
  concurrency_control: |
    # Semaphore pattern - limit concurrent operations
    semaphore = asyncio.Semaphore(3)  # Max 3 concurrent

    async with semaphore:
        result = await execute_step(...)

  rationale: |
    - Prevents resource exhaustion (too many HTTP/LLM calls)
    - Respects API rate limits
    - Keeps memory predictable
    - Prevents overload on K0 bridge

  # Execution Waves with Barriers
  execution_waves: |
    completed = set()
    results = {}

    while len(completed) < len(dag.nodes):
        # Wave N: Get all ready steps
        ready = dag.get_ready_steps(completed)

        if len(ready) == 0 and len(completed) < len(dag.nodes):
            raise ExecutionError("DAG deadlock (cycle?)")

        # Execute ready steps (parallel if safe)
        if dag.is_parallelizable(ready):
            # PARALLEL execution
            tasks = [execute_step(s, ...) for s in ready]
            step_results = await asyncio.gather(*tasks, return_exceptions=True)
        else:
            # SEQUENTIAL execution
            step_results = [await execute_step(s, ...) for s in ready]

        # Mark completed and store results
        for i, step in enumerate(ready):
            result = step_results[i]
            if isinstance(result, Exception):
                # Error - see error handling
                await handle_step_failure(step, result, session)
            else:
                completed.add(step.id)
                results[step.id] = result

        # BARRIER: wait for all ready steps to complete before next wave

# Error Handling & Recovery
error_handling:

  # Error Categories
  error_categories:
    transient_errors:
      description: "Network timeouts, rate limits, temporary unavailable"
      examples: ["ConnectionTimeout", "HTTPError(429)", "Temporary unavailable"]
      recovery: "Retry (up to 2x)"
      strategy: "exponential_backoff"

    tool_errors:
      description: "Tool execution failed (invalid input, API error)"
      examples: ["Tool not found", "Invalid parameters", "API returned error"]
      recovery: "Log error, skip step or fallback"
      strategy: "skip_or_fallback"

    user_errors:
      description: "User didn't provide required input"
      examples: ["User declined confirmation", "User timeout"]
      recovery: "Fallback to default or abort"
      strategy: "user_handling"

    resource_errors:
      description: "Out of memory, too many concurrent operations"
      examples: ["MemoryError", "SemaphoreTimeout"]
      recovery: "Reduce concurrency, retry later"
      strategy: "backpressure"

  # Retry Strategy
  retry_strategy:
    max_retries: 2
    backoff_base_ms: 100
    backoff_formula: "100 * (2 ^ retry_count)"
    applicable_to: "Transient errors only"

  # Saga Pattern for Compensation
  saga_pattern:
    description: "Roll back executed steps on failure"
    usage: "For multi-step transactions (booking + calendar + notification)"

    compensating_transactions: |
      # Example: Flight booking saga
      steps:
        1. Check availability (no compensation needed)
        2. Hold flight (compensate: release hold)
        3. Charge card (compensate: refund)
        4. Send confirmation (compensate: cancel email)

      # On failure at step 3:
      compensation_chain:
        step 2: release_hold(booking_id)
        step 1: no-op

    implementation: |
      @dataclass
      class SagaStep:
          name: str
          execute: Callable
          compensate: Callable  # Rollback function

      async def execute_saga(steps):
          completed = []
          try:
              for step in steps:
                  result = await step.execute()
                  completed.append((step, result))
          except Exception as e:
              # Roll back in reverse order
              for step, result in reversed(completed):
                  try:
                      await step.compensate(result)
                  except Exception as comp_error:
                      logger.error(f"Compensation failed: {comp_error}")
              raise

  # Fallback Strategies
  fallback_strategies:
    step_failure_fallback: |
      # If optional step fails, continue with fallback result
      if step.optional:
          results[step.id] = step.fallback_value
          completed.add(step.id)
      else:
          # Required step failed - abort execution
          raise ExecutionError(f"Required step {step.id} failed")

    plan_failure_fallback: |
      # If plan fails completely, return graceful degradation
      if num_failed_steps > 0.5 * total_steps:
          # >50% steps failed - abort
          return graceful_degradation_response()
      else:
          # <50% failed - return partial results
          return partial_results()

# Result Aggregation
result_aggregation:

  # Collect All Results
  collect_results:
    description: "Gather results from all executed steps"
    format: |
      results = {
          "step_1": tool_output,
          "step_2": model_output,
          "step_3": user_input,
          ...
      }

  # Synthesize Response
  synthesize_response:
    input: "All step results"
    output: "Final turn output"
    process: |
      # AI agent synthesizes results into natural response
      response_prompt = f"""
      Based on these results, create a natural response:
      {json.dumps(results)}
      """

      response = await agent.call_model(response_prompt)
      return response

  # Format Output
  format_output:
    types:
      natural_language: "Text response to user"
      structured: "JSON with step-by-step results"
      mixed: "Text + structured data"

# Performance Monitoring
performance_monitoring:

  # Metrics
  metrics:
    execution_latency_ms:
      type: Histogram
      description: "Phase 3 total execution time"
      buckets: [50, 100, 150, 200, 300, 500, 1000, 2000]
      p95_target: 250

    step_execution_latency_ms:
      type: Histogram
      description: "Per-step execution latency"
      labels: ["step_type"]
      buckets: [1, 5, 10, 50, 100, 500, 1000, 3000]

    parallelism_factor:
      type: Gauge
      description: "Average parallelism (concurrent steps)"
      calculation: "sum(step durations) / execution time"

    error_rate:
      type: Counter
      description: "Steps that failed"
      labels: ["error_category"]

    compensation_count:
      type: Counter
      description: "Saga compensations executed"

  # Alerts
  alerts:
    slow_execution:
      trigger: "execution_latency_ms > 250ms for 5% of tasks"
      action: "Investigate bottleneck steps"
      severity: "WARNING"

    high_error_rate:
      trigger: "error_rate > 5% for 1 hour"
      action: "Check tool availability, LLM service status"
      severity: "CRITICAL"

# Output from Execution Phase
execution_output:
  all_step_results: Dict[str, Any]
  final_response: str
  execution_trace: ExecutionTrace
  error_summary: Optional[Dict]

# Testing & Validation
testing_validation:

  # Unit Tests
  unit_tests:
    - "DAG parsing and validation"
    - "Ready step detection"
    - "Parallelizability checking"
    - "Step execution handlers (Tool, Model, Ask, Memory)"
    - "Error handling and retry logic"
    - "Saga compensation execution"

  # Integration Tests
  integration_tests:
    - "Full execution pipeline (DAG → results)"
    - "Parallel execution with varying step times"
    - "Error scenarios (tool timeout, user timeout, network error)"
    - "Saga compensation on failure"
    - "Result synthesis and formatting"

  # Latency Tests
  latency_tests:
    - "Execution latency <250ms P95 for simple plans"
    - "Parallel execution beats sequential"
    - "Concurrency limit prevents overload"

# Configuration
configuration:

  # Default Settings
  defaults:
    max_concurrency: 3
    tool_timeout_ms: 1000
    ask_timeout_ms: 30000
    retry_max_count: 2
    saga_enabled: true
    fallback_enabled: true

  # Tunable Parameters
  tunable_parameters:
    - "max_concurrency: Limit based on resource availability"
    - "tool_timeout_ms: Adjust per tool type"
    - "ask_timeout_ms: User timeout tolerance"
    - "retry_max_count: Retry limit for transient errors"

# Implementation Status
implementation_status:
  dag_construction: "COMPLETED"
  execution_strategy: "COMPLETED"
  step_execution: "COMPLETED"
  parallel_execution: "COMPLETED"
