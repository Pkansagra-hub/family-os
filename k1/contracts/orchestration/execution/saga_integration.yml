## Saga Observability & Metrics

observability:
  key_traces:
    saga_execution_trace:
      span_name: "saga.execute"
      attributes:
        saga_id: str
        context_id: str
        step_count: int
      events:
        - saga.started
        - saga.step_N.started
        - saga.step_N.completed
        - saga.step_N.failed
        - saga.compensation_started
        - saga.compensation_step_N.completed
        - saga.completed or saga.failed

  key_metrics:
    saga_success_rate:
      type: "Counter"
      labels: [context_type, priority]
      unit: "sagas"
      target: "> 95%"

    saga_compensation_rate:
      type: "Counter"
      labels: [compensation_reason]
      unit: "compensations"
      description: "How many sagas required compensation"
      target: "< 5%"

    saga_duration_ms:
      type: "Histogram"
      labels: [context_type, step_count]
      buckets: [100, 500, 1000, 2000, 5000, 10000]
      description: "Total saga execution time"
      target_p95: "2000ms"

    compensation_duration_ms:
      type: "Histogram"
      labels: [fallback_type]
      buckets: [100, 500, 1000, 5000, 30000]
      description: "Time to complete all compensations"
      target_p95: "5000ms"

    arbiter_escalation_rate:
      type: "Counter"
      labels: [compensation_type]
      unit: "escalations"
      description: "Compensation decisions sent to arbiter"
      target: "< 1%"

