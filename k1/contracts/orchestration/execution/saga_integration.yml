---
# Saga Pattern Integration for Distributed Task Execution
# ADR Source: ADR-0006d-saga-pattern-integration.md
# Research: Garcia-Molina & Sagas (1987), Compensating Transactions Pattern
#
# Saga Pattern addresses the challenge of managing distributed transactions
# across multiple agents and K0 persistence layers when tasks fail mid-execution.
#
# K1 adopts the Orchestration-based Saga pattern where the Orchestrator maintains
# saga state and coordinates compensating transactions on failure.

saga_pattern:
  definition: |
    A Saga is a sequence of local transactions (task steps) coordinated by the
    Orchestrator. If any transaction fails, compensating transactions unwind
    previous steps to maintain consistency across agents and K0.

  pattern_type: "Orchestration-based (vs. Choreography-based)"
  reason: |
    - Centralized coordination enables timeout enforcement
    - Single point for monitoring and observability
    - Deterministic failure recovery
    - Aligns with 3-phase orchestration protocol

  research_basis: |
    - Garcia-Molina & Salem (1987): "Sagas" foundational paper
    - Compensating Transactions Pattern (Fowler)
    - Enterprise Integration Patterns (Hohpe & Woolf)
    - Event Sourcing & CQRS for state reconstruction

---

## Saga Lifecycle State Machine

saga_lifecycle:
  states:
    PENDING:
      description: "Saga created, steps defined, waiting for execution"
      transitions:
        - target: RUNNING
          trigger: "Start saga execution"

    RUNNING:
      description: "Executing forward steps (steps 1..N)"
      substeps:
        - step_N_executing: "Current step being executed by agent"
        - step_N_done: "Step completed, result received"
        - step_N_receipt_emitted: "Receipt emitted for effect (if side_effects=write_external)"
      transitions:
        - target: RUNNING
          trigger: "All steps complete normally"
          next_state: DONE
        - target: COMPENSATING
          trigger: "Any step fails (timeout, error, rejection)"

    COMPENSATING:
      description: "Unwinding completed steps via compensating transactions"
      substeps:
        - compensate_step_N: "Running compensation for step N"
        - compensate_done: "Compensation complete"
      transitions:
        - target: FAILED
          trigger: "All compensations complete"

    DONE:
      description: "All steps executed successfully, saga committed"
      final_state: true
      actions:
        - persist_saga_result_to_K0
        - release_allocated_resources

    FAILED:
      description: "Saga failed and fully compensated"
      final_state: true
      actions:
        - record_failure_event
        - publish_saga_failure_metric
        - notify_arbiter_if_RED_band

---

## Task Step Definition

task_step_definition:
  anatomy: |
    Each step in a saga defines:
    1. action - What to execute
    2. target_agent - Which agent executes it
    3. compensation - How to undo it
    4. timeout_ms - Max execution time
    5. retries - Number of retry attempts
    6. side_effects - Whether step causes external effects (NEW)
    7. idempotency_policy - Deduplication strategy (NEW)
    8. receipt_policy - Receipt emission (NEW)

  schema: |
    step_N:
      action: str                           # e.g., "FetchUserData", "ComputeRecommendations"
      description: str                      # Human-readable description
      target_agent: {
        agent_id: str                       # Specific agent to execute
        capability: str                     # Required capability
      }

      parameters: {                         # Step-specific parameters
        key1: value1,
        key2: "{step_M.result.field}"      # Variable substitution from prior steps
      }

      timeout_ms: int                       # Must be < orchestration timeout
      max_retries: int                      # 0-3 typical range

      # NEW: Safety-critical fields (inherited from tool registry)
      side_effects: str                     # "none" | "read" | "write_external"
      idempotency_policy: {
        required: bool                      # true for write_external
        key_template: str                   # Template for generating idempotency key
        semantics: str                      # "exactly_once" | "at_least_once" | "best_effort"
      }
      receipt_policy: {
        plan_receipt_required: bool
        effect_receipt_required: bool
        effect_type: str                    # "STATE_MUTATION" | "EXTERNAL_ACTION" | "AUDIT_ONLY"
      }

      compensation: {
        action: str                         # "Revert", "Delete", "Rollback"
        target_agent: str or auto           # Can auto-select agent or specify
        parameters: {...}
        fallback: "manual_intervention" or "escalate_to_arbiter"
        # NEW: Compensation receipts
        receipt_on_compensation: bool       # Emit receipt when compensation runs
      }

      on_failure: {
        retry: bool                         # Retry before compensation?
        immediate_compensation: bool        # Compensate immediately or wait?
        escalation: "none" | "arbiter" | "manual"
      }

  example_e_commerce: |
    # Step 1: Deduct payment
    step_1:
      action: "DeductPayment"
      description: "Charge customer's payment method"
      target_agent:
        agent_id: "payment-agent-01"
        capability: PAYMENT_PROCESSING
      parameters:
        customer_id: "{context.customer_id}"
        amount: 99.99
        currency: USD
      timeout_ms: 2000
      max_retries: 2
      compensation:
        action: "RefundPayment"
        target_agent: "auto"               # Auto-select payment agent
        parameters:
          transaction_id: "{step_1.result.txn_id}"
          reason: "saga_rollback"
        fallback: "escalate_to_arbiter"    # Require human approval for refund
      on_failure:
        retry: true
        immediate_compensation: false       # Try 2 retries before compensation
        escalation: "arbiter"              # Alert arbiter on multiple failures

    # Step 2: Reserve inventory (depends on step 1)
    step_2:
      action: "ReserveInventory"
      description: "Hold items for 15 minutes"
      target_agent:
        agent_id: "inventory-agent-01"
        capability: INVENTORY_MANAGEMENT
      parameters:
        items: "{context.order_items}"    # Array of items
        hold_duration_minutes: 15
        saga_id: "{saga.id}"               # Link for tracking
      timeout_ms: 1500
      max_retries: 1
      compensation:
        action: "ReleaseInventory"
        target_agent: "auto"
        parameters:
          reservation_id: "{step_2.result.reservation_id}"
        fallback: "escalate_to_arbiter"
      on_failure:
        retry: false                        # Don't retry inventory - go straight to compensation
        immediate_compensation: true        # Immediately refund payment
        escalation: "none"                 # Arbiter already notified if payment failed

    # Step 3: Create shipment (depends on step 2)
    step_3:
      action: "CreateShipment"
      description: "Generate shipping label and manifest"
      target_agent:
        agent_id: "logistics-agent-01"
        capability: SHIPPING_COORDINATION
      parameters:
        reservation_id: "{step_2.result.reservation_id}"
        destination_address: "{context.shipping_address}"
        service_level: "express"
      timeout_ms: 3000
      max_retries: 1
      compensation:
        action: "CancelShipment"
        target_agent: "auto"
        parameters:
          shipment_id: "{step_3.result.shipment_id}"
          reason: "saga_rollback"
        fallback: "manual_intervention"    # Shipping requires manual cancellation
      on_failure:
        retry: true
        immediate_compensation: true       # Release inventory immediately
        escalation: "manual"               # Shipping failures often need human review

---

## Forward Execution Phase

forward_execution:
  orchestrator_workflow: |
    FOR EACH step in saga.steps:
      1. Select agent for step (using 3-phase orchestration)
      2. Send TaskExecution message with:
         - step_id
         - step_N.action
         - step_N.parameters (with variable substitution)
         - saga_id (for linking to saga)
         - timeout_ms
      3. Wait for result or timeout
      4. IF result.status == SUCCESS:
         - Record step_N.result
         - Mark step_N as DONE
         - Publish saga_step_completed metric
         - CONTINUE to step N+1
      5. IF result.status == ERROR or timeout:
         - Record error in saga.error_log
         - BEGIN COMPENSATION PHASE
      6. IF all steps DONE:
         - TRANSITION to DONE state
         - PERSIST saga to K0
         - PUBLISH saga_completed metric

  result_handling: |
    Each step result structure:
    {
      step_id: str,
      status: "SUCCESS" | "ERROR" | "TIMEOUT" | "REJECTED",
      result: any,                         # Step-specific output
      error: str or null,                 # Error message if failed
      duration_ms: int,
      timestamp: iso8601,
      agent_id: str
    }

    Result storage:
    saga.steps_results[step_id] = result
    saga.state_snapshot[step_id] = {...}  # For reconstruction if needed

  variable_substitution: |
    During step parameter resolution, substitute variables:

    Pattern: {step_N.result.field}
    Resolution: saga.steps_results["step_N"]["result"]["field"]

    Pattern: {step_N.result.array[0].id}
    Resolution: saga.steps_results["step_N"]["result"][0]["id"]

    Pattern: {context.customer_id}
    Resolution: saga.context["customer_id"]

    If reference doesn't exist:
      - Error: InvalidVariableReference
      - Action: FAIL saga and BEGIN COMPENSATION

---

## Compensation Phase

compensation:
  trigger_conditions:
    - Any step times out
    - Any step returns ERROR status
    - Any step returns REJECTED status (agent declined)
    - Arbiter cancels saga during execution
    - Administrator forces rollback

  compensation_algorithm: |
    # Compensation runs BACKWARDS through completed steps

    FOR EACH step in REVERSE(saga.completed_steps):
      1. Get step.compensation definition
      2. IF step.compensation.fallback == "escalate_to_arbiter":
         - Create compensation request
         - Send to arbiter for approval
         - WAIT for arbiter response (timeout: 60s)
         - IF approved: EXECUTE compensation
         - IF rejected: TRANSITION to FAILED_MANUAL_REVIEW
      3. IF step.compensation.fallback == "manual_intervention":
         - Record in manual review queue
         - Notify administrators
         - WAIT for manual action (timeout: 300s)
         - IF manual completed: CONTINUE
         - IF timeout: ESCALATE to on-call
      4. SELECT agent to execute compensation (usually same agent as step)
      5. EXECUTE compensation with timeout
      6. IF compensation succeeds:
         - Record compensation_result
         - CONTINUE to previous step
      7. IF compensation fails:
         - LOG critical failure
         - ESCALATE to manual_recovery
         - TRANSITION to FAILED_NEEDS_MANUAL_RECOVERY
      8. After ALL compensations complete:
         - TRANSITION to FAILED state

  compensation_strategy:
    immediate: |
      Trigger compensation for each step failure individually.
      Pros: Faster recovery, less intermediate state
      Cons: May create inconsistencies if compensations fail
      Use: For independent steps without cross-dependencies

    deferred: |
      Complete all steps, then compensate all at once if any fail.
      Pros: Transactional atomicity, consistent rollback
      Cons: Slower failure detection, more K0 rollback
      Use: For tightly coupled steps with shared state

    adaptive: |
      Use immediate for early steps, deferred for later steps.
      Reasoning: Early failures are cheap, late failures expensive
      Example:
        - Steps 1-3: Immediate compensation
        - Steps 4-6: Deferred compensation

  K1_strategy: "immediate"  # K1 uses immediate compensation for fast failure recovery

---

## Saga State Persistence (K0 Integration)

k0_persistence:
  sagas_table_schema: |
    CREATE TABLE sagas (
      saga_id TEXT PRIMARY KEY,
      context_id TEXT,

      -- Saga definition
      steps_json TEXT,                    # Full step definitions (serialized)
      created_at TIMESTAMP,

      -- Execution state
      current_state VARCHAR(16),          # PENDING, RUNNING, COMPENSATING, DONE, FAILED
      current_step_index INT,             # Which step currently executing

      -- Results
      steps_results_json TEXT,            # Results for each completed step
      state_snapshot_json TEXT,           # Snapshots for reconstruction

      -- Error tracking
      error_log_json TEXT,                # Array of errors encountered
      compensation_log_json TEXT,         # Array of compensation attempts

      -- Metrics
      started_at TIMESTAMP,
      completed_at TIMESTAMP,
      total_duration_ms INT,

      -- Metadata
      priority INT,                       # 1=high, 2=normal, 3=low
      band VARCHAR(8),                    # GREEN, AMBER, RED (privacy band)
      tags_json TEXT                      # For querying related sagas
    );

  write_patterns: |
    On saga creation (PENDING):
      INSERT sagas VALUES (saga_id, context_id, steps_json, NOW(), 'PENDING', 0, ...)

    After each step completes (RUNNING):
      UPDATE sagas
      SET current_step_index = N,
          steps_results_json = {...},
          state_snapshot_json = {...}
      WHERE saga_id = ?

    On compensation start (COMPENSATING):
      UPDATE sagas
      SET current_state = 'COMPENSATING',
          compensation_log_json = [{step_id, status, ...}]
      WHERE saga_id = ?

    On saga completion (DONE or FAILED):
      UPDATE sagas
      SET current_state = 'DONE' or 'FAILED',
          completed_at = NOW(),
          total_duration_ms = (NOW - started_at)
      WHERE saga_id = ?

  transaction_guarantees: |
    Durability: All state changes durable to K0 WAL before continuing
    Consistency: Saga state always reflects step execution status
    Isolation: Concurrent sagas don't interfere (separate rows)
    Idempotency: Re-executing a step with same parameters gives same result
      (relies on agent-level idempotency keys)

---

## Idempotency Keys for Compensation

idempotency:
  problem: |
    If compensation request sent to agent, but response lost in network:
    - Orchestrator might retry compensation
    - Agent executes compensation twice
    - Inconsistent final state

  solution: idempotency_keys
  mechanism: |
    Each step gets deterministic idempotency key:
    idempotency_key = sha256(saga_id + step_id + "compensation")

    Agent stores received idempotency keys and returns cached result
    if same key seen again.

  example: |
    Compensation attempt 1:
      POST /agent/compensate
      {
        idempotency_key: "abc123def456",
        compensation_action: "RefundPayment",
        transaction_id: "txn_789"
      }
      Response: {status: "OK", refund_id: "ref_123"}

    Network timeout, retry:
      POST /agent/compensate
      {
        idempotency_key: "abc123def456",        # Same key
        compensation_action: "RefundPayment",
        transaction_id: "txn_789"
      }
      Response: {status: "OK", refund_id: "ref_123"}  # Cached result
      (No second refund created!)

---

## Failure Modes & Recovery

failure_modes:
  agent_timeout:
    description: "Agent doesn't respond within timeout_ms"
    recovery: |
      1. Mark step as TIMED_OUT
      2. If max_retries > 0: RETRY with new timeout
      3. Else: BEGIN COMPENSATION

  agent_rejects:
    description: "Agent returns REJECTED (insufficient resources, declined)"
    recovery: |
      1. Mark step as REJECTED
      2. If agent_id specified: Try alternate agent from same role
      3. If no alternates: BEGIN COMPENSATION

  compensation_fails:
    description: "Compensation action fails or times out"
    recovery: |
      1. Log compensation failure with step_id and error
      2. If on_failure.fallback == "escalate_to_arbiter":
         - Notify arbiter (SMS, email, Slack)
         - WAIT for manual intervention
      3. If on_failure.fallback == "manual_intervention":
         - Create incident ticket
         - Notify on-call team
      4. TRANSITION saga to FAILED_NEEDS_MANUAL_RECOVERY
      5. Stop automatic recovery

  K0_unavailable:
    description: "Cannot persist saga state to K0 WAL"
    recovery: |
      1. Keep saga in memory with local queue
      2. Retry K0 writes with exponential backoff
      3. If K0 unavailable > 10 seconds:
         - PAUSE saga execution
         - Alert infrastructure team
         - Do NOT proceed with compensation until K0 recovers
      4. On K0 recovery: Replay queued writes

  cascading_failures:
    description: "Multiple steps fail in sequence"
    example: |
      Payment fails → Compensation fails → Inventory locked → Can't release
    recovery: |
      1. Orchestrator detects compensation chain failure
      2. ESCALATE to multi-step recovery procedure:
         - Identify all locked resources
         - Attempt autonomous recovery (delayed retry)
         - If no success: ESCALATE to arbiter

---

## Compensation Fallback Patterns

fallback_patterns:
  escalate_to_arbiter:
    description: "For high-impact compensations (refunds, account changes)"
    workflow: |
      1. Create CompensationRequest
      2. Send to Arbiter Agent (RED band)
      3. Arbiter reviews:
         - Saga history
         - Compensation impact
         - Customer/business rules
      4. Arbiter approves or rejects
      5. If approved: Execute compensation
      6. If rejected: Record audit, escalate to manual
    timeout_ms: 60000  # 60 seconds for arbiter to respond

  manual_intervention:
    description: "For complex compensations requiring human expertise"
    workflow: |
      1. Create incident ticket with full saga context
      2. Tag for on-call team based on domain
      3. Notify via Slack, PagerDuty, email
      4. Human executes compensation (e.g., manual shipping cancel)
      5. Human updates ticket with "compensation_completed"
      6. Saga transitions to DONE or FAILED
    timeout_ms: 300000  # 5 minutes for human to start, 30 min total

  K1_defaults:
    high_impact_compensations:  # Refund, account close, data deletion
      fallback: "escalate_to_arbiter"
    mid_impact_compensations:   # Reservation cancel, hold release
      fallback: "manual_intervention"
    low_impact_compensations:   # State rollback, cache clear
      fallback: "none"           # Automatic retry, no escalation

---

## Example: Booking System Saga

example_booking_saga:
  scenario: "User books a hotel, flight, and rental car with cross-cancellation"

  steps:
    step_1:
      action: "ReserveHotel"
      target_agent: {agent_id: "hotel-agent", capability: BOOKING}
      parameters:
        check_in: "{context.dates.start}"
        check_out: "{context.dates.end}"
        rooms: 1
      compensation:
        action: "CancelHotelReservation"
        parameters: {reservation_id: "{step_1.result.res_id}"}
        fallback: "escalate_to_arbiter"

    step_2:
      action: "ReserveFlight"
      target_agent: {agent_id: "flight-agent", capability: BOOKING}
      parameters:
        departure_date: "{context.dates.start}"
        return_date: "{context.dates.end}"
        airport_code: "{context.destination.airport}"
      compensation:
        action: "CancelFlightReservation"
        parameters: {booking_ref: "{step_2.result.booking_ref}"}
        fallback: "escalate_to_arbiter"

    step_3:
      action: "RentCar"
      target_agent: {agent_id: "rental-agent", capability: BOOKING}
      parameters:
        pickup_location: "{context.destination.airport}"
        pickup_date: "{context.dates.start}"
        return_date: "{context.dates.end}"
        car_class: "economy"
      compensation:
        action: "CancelCarRental"
        parameters: {confirmation_code: "{step_3.result.confirmation}"}
        fallback: "manual_intervention"

  saga_execution_trace: |
    1. Start saga, all reservations attempted in parallel (3-phase negotiation)
    2. Orchestrator selects agents with best scoring
    3. Step 1 (hotel) completes in 500ms → stored
    4. Step 2 (flight) completes in 800ms → stored
    5. Step 3 (car) times out after 2000ms → COMPENSATION triggered
    6. Backward compensation:
       - Cancel flight (escalated to arbiter) → arbiter approves
       - Cancel hotel (escalated to arbiter) → arbiter approves
       - Skip car (never reserved)
    7. Saga transitions to FAILED
    8. Customer receives notification with cancellation details
    9. K0 records saga failure for future reference

