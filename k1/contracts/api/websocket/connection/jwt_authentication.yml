classes:
  - name: JWTWebSocketAuthenticator
    description: JWT-based authentication for WebSocket connections following ADR-0037
    research: RFC 7519 (JWT), RS256 signature algorithm, ADR-0037 (JWT Authentication), stateless token validation
    performance_budget: <50ms JWT validation (signature verification + claims extraction)
    reliability_properties:
      - stateless_authentication: No server-side session storage, JWT self-contained
      - rs256_signature_verification: RSA 2048-bit public key signature validation
      - claims_extraction: Extract user_id, session_id, space_id, privacy_band from JWT payload
      - expiration_validation: Check exp claim against current timestamp
      - security_first: Reject invalid/expired/malformed tokens with 403 Forbidden
    methods:
      - name: validate_jwt_from_query_param
        description: Extract and validate JWT from WebSocket URL query parameter
        parameters:
          - name: query_params
            type: HashMap<String, String>
            description: Query parameters from WebSocket URL
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<JWTClaims, AuthenticationError>
          description: Validated JWT claims or authentication error
        implementation:
          rust: |
            use jsonwebtoken::{decode, Algorithm, DecodingKey, Validation};
            use serde::{Deserialize, Serialize};
            use std::collections::HashMap;

            #[derive(Debug, Serialize, Deserialize, Clone)]
            pub struct JWTClaims {
                pub sub: String,                // user_id
                pub exp: usize,                 // expiration timestamp (Unix seconds)
                pub iat: usize,                 // issued at timestamp
                pub iss: String,                // issuer (k1_auth)
                pub aud: String,                // audience (k1_websocket)
                pub jti: String,                // JWT ID (unique identifier)
                pub session_id: Option<String>, // K1 session ID
                pub space_id: Option<String>,   // Family space ID
                pub privacy_band: Option<String>, // GREEN/AMBER/RED/BLACK
                pub roles: Option<Vec<String>>, // User roles
                pub capabilities: Option<Vec<String>>, // Agent capabilities
            }

            pub struct JWTWebSocketAuthenticator {
                public_key: DecodingKey,
                validation: Validation,
                metrics: Arc<AuthMetrics>,
            }

            impl JWTWebSocketAuthenticator {
                pub fn new(public_key_pem: &str) -> Result<Self, AuthenticationError> {
                    let public_key = DecodingKey::from_rsa_pem(public_key_pem.as_bytes())
                        .map_err(|e| AuthenticationError::InvalidPublicKey(e.to_string()))?;

                    let mut validation = Validation::new(Algorithm::RS256);
                    validation.set_audience(&["k1_websocket"]);
                    validation.set_issuer(&["k1_auth"]);
                    validation.validate_exp = true;  // Validate expiration

                    Ok(Self {
                        public_key,
                        validation,
                        metrics: Arc::new(AuthMetrics::new()),
                    })
                }

                pub fn validate_jwt_from_query_param(
                    &self,
                    query_params: &HashMap<String, String>,
                    trace_id: &str,
                ) -> Result<JWTClaims, AuthenticationError> {
                    let start = std::time::Instant::now();

                    // 1. Extract JWT from query param
                    let token = query_params
                        .get("token")
                        .ok_or(AuthenticationError::MissingToken)?;

                    tracing::debug!(
                        trace_id = %trace_id,
                        "Validating JWT from query parameter"
                    );

                    // 2. Decode and validate JWT
                    let token_data = decode::<JWTClaims>(
                        token,
                        &self.public_key,
                        &self.validation,
                    ).map_err(|e| match e.kind() {
                        jsonwebtoken::errors::ErrorKind::InvalidSignature => {
                            AuthenticationError::InvalidSignature
                        }
                        jsonwebtoken::errors::ErrorKind::ExpiredSignature => {
                            AuthenticationError::ExpiredToken
                        }
                        jsonwebtoken::errors::ErrorKind::InvalidIssuer => {
                            AuthenticationError::InvalidIssuer
                        }
                        jsonwebtoken::errors::ErrorKind::InvalidAudience => {
                            AuthenticationError::InvalidAudience
                        }
                        _ => AuthenticationError::InvalidToken(e.to_string()),
                    })?;

                    let claims = token_data.claims;

                    // 3. Validate required claims
                    if claims.session_id.is_none() {
                        return Err(AuthenticationError::MissingSessionId);
                    }

                    if claims.space_id.is_none() {
                        return Err(AuthenticationError::MissingSpaceId);
                    }

                    let duration = start.elapsed();

                    tracing::info!(
                        trace_id = %trace_id,
                        user_id = %claims.sub,
                        session_id = ?claims.session_id,
                        space_id = ?claims.space_id,
                        duration_ms = duration.as_millis(),
                        "JWT validated successfully"
                    );

                    // Emit metrics
                    self.metrics.record_authentication(duration, true);

                    // Validate performance budget (<50ms)
                    if duration.as_millis() > 50 {
                        tracing::warn!(
                            trace_id = %trace_id,
                            duration_ms = duration.as_millis(),
                            "JWT validation exceeded 50ms budget"
                        );
                    }

                    Ok(claims)
                }

                /// Extract JWT from Sec-WebSocket-Protocol header (alternative method)
                pub fn validate_jwt_from_protocol_header(
                    &self,
                    sec_websocket_protocol: &str,
                    trace_id: &str,
                ) -> Result<JWTClaims, AuthenticationError> {
                    // Format: "Bearer.<jwt_token>"
                    let token = sec_websocket_protocol
                        .strip_prefix("Bearer.")
                        .ok_or(AuthenticationError::InvalidProtocolFormat)?;

                    let start = std::time::Instant::now();

                    let token_data = decode::<JWTClaims>(
                        token,
                        &self.public_key,
                        &self.validation,
                    ).map_err(|e| AuthenticationError::InvalidToken(e.to_string()))?;

                    let duration = start.elapsed();

                    tracing::info!(
                        trace_id = %trace_id,
                        user_id = %token_data.claims.sub,
                        duration_ms = duration.as_millis(),
                        "JWT validated from Sec-WebSocket-Protocol header"
                    );

                    self.metrics.record_authentication(duration, true);

                    Ok(token_data.claims)
                }
            }

            #[derive(Debug)]
            pub enum AuthenticationError {
                MissingToken,
                InvalidSignature,
                ExpiredToken,
                InvalidIssuer,
                InvalidAudience,
                InvalidToken(String),
                MissingSessionId,
                MissingSpaceId,
                InvalidPublicKey(String),
                InvalidProtocolFormat,
            }
          python: |
            import jwt
            from dataclasses import dataclass
            from typing import Optional, List, Dict
            import time
            import logging

            @dataclass
            class JWTClaims:
                sub: str  # user_id
                exp: int  # expiration timestamp
                iat: int  # issued at timestamp
                iss: str  # issuer
                aud: str  # audience
                jti: str  # JWT ID
                session_id: Optional[str]
                space_id: Optional[str]
                privacy_band: Optional[str]
                roles: Optional[List[str]]
                capabilities: Optional[List[str]]

            class JWTWebSocketAuthenticator:
                """
                JWT-based authentication for WebSocket connections.

                Validates JWT from query parameter or Sec-WebSocket-Protocol header,
                verifies RS256 signature, and extracts claims.
                """

                def __init__(self, public_key_pem: str, metrics):
                    self.logger = logging.getLogger(__name__)
                    self.public_key = public_key_pem
                    self.metrics = metrics

                def validate_jwt_from_query_param(
                    self,
                    query_params: Dict[str, str],
                    trace_id: str
                ) -> JWTClaims:
                    """Extract and validate JWT from query parameter"""
                    start = time.time()

                    # 1. Extract JWT from query param
                    token = query_params.get('token')
                    if not token:
                        raise AuthenticationError("Missing token parameter")

                    self.logger.debug(
                        f"Validating JWT from query parameter",
                        extra={'trace_id': trace_id}
                    )

                    # 2. Decode and validate JWT
                    try:
                        payload = jwt.decode(
                            token,
                            self.public_key,
                            algorithms=['RS256'],
                            audience='k1_websocket',
                            issuer='k1_auth'
                        )
                    except jwt.ExpiredSignatureError:
                        self.metrics.record_authentication(time.time() - start, False)
                        raise AuthenticationError("Token has expired")
                    except jwt.InvalidSignatureError:
                        self.metrics.record_authentication(time.time() - start, False)
                        raise AuthenticationError("Invalid token signature")
                    except jwt.InvalidIssuerError:
                        self.metrics.record_authentication(time.time() - start, False)
                        raise AuthenticationError("Invalid token issuer")
                    except jwt.InvalidAudienceError:
                        self.metrics.record_authentication(time.time() - start, False)
                        raise AuthenticationError("Invalid token audience")
                    except Exception as e:
                        self.metrics.record_authentication(time.time() - start, False)
                        raise AuthenticationError(f"Invalid token: {e}")

                    # 3. Validate required claims
                    if 'session_id' not in payload or not payload['session_id']:
                        raise AuthenticationError("Missing session_id claim")

                    if 'space_id' not in payload or not payload['space_id']:
                        raise AuthenticationError("Missing space_id claim")

                    duration = time.time() - start

                    claims = JWTClaims(
                        sub=payload['sub'],
                        exp=payload['exp'],
                        iat=payload['iat'],
                        iss=payload['iss'],
                        aud=payload['aud'],
                        jti=payload.get('jti', ''),
                        session_id=payload.get('session_id'),
                        space_id=payload.get('space_id'),
                        privacy_band=payload.get('privacy_band'),
                        roles=payload.get('roles'),
                        capabilities=payload.get('capabilities')
                    )

                    self.logger.info(
                        f"JWT validated successfully",
                        extra={
                            'trace_id': trace_id,
                            'user_id': claims.sub,
                            'session_id': claims.session_id,
                            'space_id': claims.space_id,
                            'duration_ms': duration * 1000
                        }
                    )

                    # Emit metrics
                    self.metrics.record_authentication(duration, True)

                    # Validate performance budget (<50ms)
                    if duration * 1000 > 50:
                        self.logger.warning(
                            f"JWT validation exceeded 50ms budget ({duration * 1000:.2f}ms)",
                            extra={'trace_id': trace_id}
                        )

                    return claims

                def validate_jwt_from_protocol_header(
                    self,
                    sec_websocket_protocol: str,
                    trace_id: str
                ) -> JWTClaims:
                    """Extract and validate JWT from Sec-WebSocket-Protocol header"""
                    # Format: "Bearer.<jwt_token>"
                    if not sec_websocket_protocol.startswith('Bearer.'):
                        raise AuthenticationError("Invalid protocol format")

                    token = sec_websocket_protocol[7:]  # Remove "Bearer." prefix

                    # Use same validation logic
                    return self.validate_jwt_from_query_param({'token': token}, trace_id)

            class AuthenticationError(Exception):
                """WebSocket JWT authentication error"""
                pass

authentication_methods:
  - method: query_parameter
    url_format: "wss://k1.example.com/v1/chat?token=<jwt>"
    description: JWT passed as query parameter (recommended for WebSocket)
    pros: [simple_client_implementation, widely_supported, no_header_parsing]
    cons: [token_visible_in_logs, url_length_limit]
    recommended: true
  - method: sec_websocket_protocol_header
    header_format: "Sec-WebSocket-Protocol: Bearer.<jwt>"
    description: JWT passed in Sec-WebSocket-Protocol header (alternative)
    pros: [token_not_in_url, no_url_length_limit]
    cons: [complex_client_implementation, less_widely_used]
    recommended: false

jwt_claims_schema:
  standard_claims:
    - claim: sub
      description: Subject (user_id)
      required: true
      example: "user-12345"
    - claim: exp
      description: Expiration time (Unix timestamp)
      required: true
      example: 1698765432
    - claim: iat
      description: Issued at time (Unix timestamp)
      required: true
      example: 1698761832
    - claim: iss
      description: Issuer (k1_auth)
      required: true
      example: "k1_auth"
    - claim: aud
      description: Audience (k1_websocket)
      required: true
      example: "k1_websocket"
    - claim: jti
      description: JWT ID (unique identifier)
      required: true
      example: "jwt-abc123"

  custom_claims:
    - claim: session_id
      description: K1 session ID
      required: true
      example: "session-67890"
    - claim: space_id
      description: Family space ID
      required: true
      example: "space-family1"
    - claim: privacy_band
      description: Privacy band (GREEN/AMBER/RED/BLACK)
      required: false
      example: "GREEN"
    - claim: roles
      description: User roles
      required: false
      example: ["admin", "operator"]
    - claim: capabilities
      description: Agent capabilities
      required: false
      example: ["TOOL_CALL", "WEB_SEARCH"]

validation_sequence:
  - step: extract_token
    description: Extract JWT from query parameter or Sec-WebSocket-Protocol header
    error_if_missing: 403 Forbidden ("Missing token")
  - step: decode_jwt
    description: Decode JWT header and payload (Base64URL decode)
    error_if_invalid: 403 Forbidden ("Malformed token")
  - step: verify_signature
    description: Verify RS256 signature with RSA public key (2048-bit)
    error_if_invalid: 403 Forbidden ("Invalid signature")
  - step: validate_issuer
    description: Check iss claim equals "k1_auth"
    error_if_invalid: 403 Forbidden ("Invalid issuer")
  - step: validate_audience
    description: Check aud claim equals "k1_websocket"
    error_if_invalid: 403 Forbidden ("Invalid audience")
  - step: validate_expiration
    description: Check exp claim > current_time
    error_if_expired: 403 Forbidden ("Token expired")
  - step: extract_claims
    description: Extract user_id, session_id, space_id, privacy_band from payload
    error_if_missing: 403 Forbidden ("Missing required claims")
  - step: authentication_success
    description: Return JWTClaims for connection authorization

error_responses:
  - error: MissingToken
    status: 403
    message: "Missing token parameter"
  - error: InvalidSignature
    status: 403
    message: "Invalid token signature"
  - error: ExpiredToken
    status: 403
    message: "Token has expired"
  - error: InvalidIssuer
    status: 403
    message: "Invalid token issuer"
  - error: InvalidAudience
    status: 403
    message: "Invalid token audience"
  - error: MissingSessionId
    status: 403
    message: "Missing session_id claim"
  - error: MissingSpaceId
    status: 403
    message: "Missing space_id claim"

performance_budgets:
  - operation: jwt_decode
    target: <10ms
    description: Base64URL decode header + payload
  - operation: signature_verification
    target: <30ms
    description: RS256 signature verification with RSA public key
  - operation: claims_extraction
    target: <5ms
    description: Parse JSON payload and extract claims
  - operation: total_validation
    target: <50ms
    description: Complete JWT validation (decode + verify + extract)
