classes:
  - name: WebSocketUpgradeHandler
    description: HTTP → WebSocket protocol upgrade handler following RFC 6455 handshake specification
    research: RFC 6455 §1.3 (Opening Handshake), RFC 6455 §4 (Handshake), W3C WebSocket API (2012)
    performance_budget: <500ms total connection establishment (<200ms TLS + <50ms JWT + <100ms upgrade + <150ms overhead)
    reliability_properties:
      - rfc_6455_compliance: Full compliance with WebSocket protocol handshake
      - sec_websocket_key_validation: Validate Sec-WebSocket-Key and compute Sec-WebSocket-Accept
      - http_upgrade_mechanism: Transform HTTP GET request to WebSocket connection
      - error_handling: Reject invalid handshakes with appropriate HTTP status codes
      - performance_tracking: Monitor handshake latency and success rates
    methods:
      - name: validate_upgrade_request
        description: Validate HTTP GET request contains required WebSocket upgrade headers
        parameters:
          - name: request
            type: HttpRequest
            description: Incoming HTTP GET request from client
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<UpgradeValidation, HandshakeError>
          description: Validation result with extracted headers or error
        implementation:
          rust: |
            use hyper::{Request, header::{UPGRADE, CONNECTION, SEC_WEBSOCKET_VERSION, SEC_WEBSOCKET_KEY}};

            pub struct WebSocketUpgradeHandler {
                metrics: Arc<ConnectionMetrics>,
            }

            #[derive(Debug)]
            pub struct UpgradeValidation {
                pub sec_websocket_key: String,
                pub sec_websocket_version: u8,
                pub sec_websocket_protocol: Option<String>,
                pub origin: Option<String>,
            }

            impl WebSocketUpgradeHandler {
                pub fn validate_upgrade_request(
                    &self,
                    request: &Request<hyper::Body>,
                    trace_id: &str,
                ) -> Result<UpgradeValidation, HandshakeError> {
                    let start = std::time::Instant::now();

                    // 1. Verify HTTP method is GET
                    if request.method() != hyper::Method::GET {
                        return Err(HandshakeError::InvalidMethod(
                            format!("Expected GET, got {}", request.method())
                        ));
                    }

                    // 2. Verify Upgrade header is "websocket"
                    let upgrade = request.headers()
                        .get(UPGRADE)
                        .and_then(|v| v.to_str().ok())
                        .ok_or(HandshakeError::MissingUpgradeHeader)?;

                    if upgrade.to_lowercase() != "websocket" {
                        return Err(HandshakeError::InvalidUpgradeValue(upgrade.to_string()));
                    }

                    // 3. Verify Connection header contains "Upgrade"
                    let connection = request.headers()
                        .get(CONNECTION)
                        .and_then(|v| v.to_str().ok())
                        .ok_or(HandshakeError::MissingConnectionHeader)?;

                    if !connection.to_lowercase().contains("upgrade") {
                        return Err(HandshakeError::InvalidConnectionValue(connection.to_string()));
                    }

                    // 4. Verify Sec-WebSocket-Version is 13 (RFC 6455)
                    let version = request.headers()
                        .get(SEC_WEBSOCKET_VERSION)
                        .and_then(|v| v.to_str().ok())
                        .ok_or(HandshakeError::MissingVersionHeader)?;

                    if version != "13" {
                        return Err(HandshakeError::UnsupportedVersion(version.to_string()));
                    }

                    // 5. Extract Sec-WebSocket-Key (MUST be present, RFC 6455 §4.2.1)
                    let sec_websocket_key = request.headers()
                        .get(SEC_WEBSOCKET_KEY)
                        .and_then(|v| v.to_str().ok())
                        .ok_or(HandshakeError::MissingSecWebSocketKey)?
                        .to_string();

                    // 6. Verify Sec-WebSocket-Key is base64 encoded and 16 bytes
                    if !Self::validate_sec_websocket_key(&sec_websocket_key) {
                        return Err(HandshakeError::InvalidSecWebSocketKey(sec_websocket_key));
                    }

                    // 7. Extract optional headers
                    let sec_websocket_protocol = request.headers()
                        .get("Sec-WebSocket-Protocol")
                        .and_then(|v| v.to_str().ok())
                        .map(|s| s.to_string());

                    let origin = request.headers()
                        .get("Origin")
                        .and_then(|v| v.to_str().ok())
                        .map(|s| s.to_string());

                    let duration = start.elapsed();

                    tracing::debug!(
                        trace_id = %trace_id,
                        duration_ms = duration.as_millis(),
                        sec_websocket_key = %sec_websocket_key,
                        "WebSocket upgrade request validated"
                    );

                    // Emit metric
                    self.metrics.record_upgrade_validation(duration, true);

                    Ok(UpgradeValidation {
                        sec_websocket_key,
                        sec_websocket_version: 13,
                        sec_websocket_protocol,
                        origin,
                    })
                }

                /// Validate Sec-WebSocket-Key format (RFC 6455 §4.2.1)
                fn validate_sec_websocket_key(key: &str) -> bool {
                    // Must be base64 encoded, 16 bytes (24 chars after encoding)
                    use base64::{Engine as _, engine::general_purpose};

                    match general_purpose::STANDARD.decode(key) {
                        Ok(bytes) => bytes.len() == 16,
                        Err(_) => false,
                    }
                }

                /// Compute Sec-WebSocket-Accept from Sec-WebSocket-Key (RFC 6455 §4.2.2)
                pub fn compute_sec_websocket_accept(sec_websocket_key: &str) -> String {
                    use sha1::{Sha1, Digest};
                    use base64::{Engine as _, engine::general_purpose};

                    // Magic GUID from RFC 6455
                    const WEBSOCKET_GUID: &str = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11";

                    // Concatenate key + GUID
                    let concat = format!("{}{}", sec_websocket_key, WEBSOCKET_GUID);

                    // SHA-1 hash
                    let mut hasher = Sha1::new();
                    hasher.update(concat.as_bytes());
                    let hash = hasher.finalize();

                    // Base64 encode
                    general_purpose::STANDARD.encode(&hash)
                }

                /// Send 101 Switching Protocols response (RFC 6455 §4.2.2)
                pub fn send_upgrade_response(
                    &self,
                    validation: &UpgradeValidation,
                    trace_id: &str,
                ) -> hyper::Response<hyper::Body> {
                    let sec_websocket_accept = Self::compute_sec_websocket_accept(&validation.sec_websocket_key);

                    let mut response = hyper::Response::new(hyper::Body::empty());
                    *response.status_mut() = hyper::StatusCode::SWITCHING_PROTOCOLS;

                    let headers = response.headers_mut();
                    headers.insert(UPGRADE, hyper::header::HeaderValue::from_static("websocket"));
                    headers.insert(CONNECTION, hyper::header::HeaderValue::from_static("Upgrade"));
                    headers.insert(
                        "Sec-WebSocket-Accept",
                        hyper::header::HeaderValue::from_str(&sec_websocket_accept).unwrap()
                    );

                    // Include protocol if requested
                    if let Some(protocol) = &validation.sec_websocket_protocol {
                        headers.insert(
                            "Sec-WebSocket-Protocol",
                            hyper::header::HeaderValue::from_str(protocol).unwrap()
                        );
                    }

                    tracing::info!(
                        trace_id = %trace_id,
                        sec_websocket_accept = %sec_websocket_accept,
                        "Sending 101 Switching Protocols response"
                    );

                    response
                }
            }

            #[derive(Debug)]
            pub enum HandshakeError {
                InvalidMethod(String),
                MissingUpgradeHeader,
                InvalidUpgradeValue(String),
                MissingConnectionHeader,
                InvalidConnectionValue(String),
                MissingVersionHeader,
                UnsupportedVersion(String),
                MissingSecWebSocketKey,
                InvalidSecWebSocketKey(String),
            }
          python: |
            import hashlib
            import base64
            from dataclasses import dataclass
            from typing import Optional, Dict
            import logging

            @dataclass
            class UpgradeValidation:
                sec_websocket_key: str
                sec_websocket_version: int
                sec_websocket_protocol: Optional[str]
                origin: Optional[str]

            class WebSocketUpgradeHandler:
                """
                HTTP → WebSocket protocol upgrade handler.

                Validates HTTP GET request contains required WebSocket upgrade headers,
                computes Sec-WebSocket-Accept, and sends 101 Switching Protocols response.
                """

                WEBSOCKET_GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"

                def __init__(self, metrics):
                    self.logger = logging.getLogger(__name__)
                    self.metrics = metrics

                def validate_upgrade_request(
                    self,
                    headers: Dict[str, str],
                    method: str,
                    trace_id: str
                ) -> UpgradeValidation:
                    """Validate HTTP request contains required WebSocket upgrade headers"""
                    import time
                    start = time.time()

                    # 1. Verify HTTP method is GET
                    if method.upper() != 'GET':
                        raise HandshakeError(f"Invalid method: expected GET, got {method}")

                    # 2. Verify Upgrade header is "websocket"
                    upgrade = headers.get('upgrade', '').lower()
                    if upgrade != 'websocket':
                        raise HandshakeError(f"Invalid Upgrade header: {upgrade}")

                    # 3. Verify Connection header contains "Upgrade"
                    connection = headers.get('connection', '').lower()
                    if 'upgrade' not in connection:
                        raise HandshakeError(f"Invalid Connection header: {connection}")

                    # 4. Verify Sec-WebSocket-Version is 13 (RFC 6455)
                    version = headers.get('sec-websocket-version', '')
                    if version != '13':
                        raise HandshakeError(f"Unsupported version: {version}")

                    # 5. Extract Sec-WebSocket-Key (MUST be present)
                    sec_websocket_key = headers.get('sec-websocket-key', '')
                    if not sec_websocket_key:
                        raise HandshakeError("Missing Sec-WebSocket-Key header")

                    # 6. Verify Sec-WebSocket-Key is base64 encoded and 16 bytes
                    if not self._validate_sec_websocket_key(sec_websocket_key):
                        raise HandshakeError(f"Invalid Sec-WebSocket-Key: {sec_websocket_key}")

                    # 7. Extract optional headers
                    sec_websocket_protocol = headers.get('sec-websocket-protocol')
                    origin = headers.get('origin')

                    duration = time.time() - start

                    self.logger.debug(
                        f"WebSocket upgrade request validated",
                        extra={
                            'trace_id': trace_id,
                            'duration_ms': duration * 1000,
                            'sec_websocket_key': sec_websocket_key
                        }
                    )

                    # Emit metric
                    self.metrics.record_upgrade_validation(duration, True)

                    return UpgradeValidation(
                        sec_websocket_key=sec_websocket_key,
                        sec_websocket_version=13,
                        sec_websocket_protocol=sec_websocket_protocol,
                        origin=origin
                    )

                def _validate_sec_websocket_key(self, key: str) -> bool:
                    """Validate Sec-WebSocket-Key format (RFC 6455 §4.2.1)"""
                    try:
                        decoded = base64.b64decode(key)
                        return len(decoded) == 16
                    except Exception:
                        return False

                @staticmethod
                def compute_sec_websocket_accept(sec_websocket_key: str) -> str:
                    """
                    Compute Sec-WebSocket-Accept from Sec-WebSocket-Key (RFC 6455 §4.2.2).

                    Formula: Base64(SHA-1(Sec-WebSocket-Key + GUID))
                    """
                    # Concatenate key + GUID
                    concat = sec_websocket_key + WebSocketUpgradeHandler.WEBSOCKET_GUID

                    # SHA-1 hash
                    hash_obj = hashlib.sha1(concat.encode('utf-8'))
                    hash_bytes = hash_obj.digest()

                    # Base64 encode
                    return base64.b64encode(hash_bytes).decode('utf-8')

                def send_upgrade_response(
                    self,
                    validation: UpgradeValidation,
                    trace_id: str
                ) -> Dict[str, str]:
                    """Send 101 Switching Protocols response headers"""
                    sec_websocket_accept = self.compute_sec_websocket_accept(validation.sec_websocket_key)

                    headers = {
                        'Upgrade': 'websocket',
                        'Connection': 'Upgrade',
                        'Sec-WebSocket-Accept': sec_websocket_accept
                    }

                    # Include protocol if requested
                    if validation.sec_websocket_protocol:
                        headers['Sec-WebSocket-Protocol'] = validation.sec_websocket_protocol

                    self.logger.info(
                        f"Sending 101 Switching Protocols response",
                        extra={
                            'trace_id': trace_id,
                            'sec_websocket_accept': sec_websocket_accept
                        }
                    )

                    return headers

            class HandshakeError(Exception):
                """WebSocket handshake validation error"""
                pass

handshake_sequence:
  - step: client_sends_upgrade_request
    description: Client sends HTTP GET with Upgrade websocket, Connection Upgrade, Sec-WebSocket-Version 13, Sec-WebSocket-Key (base64, 16 bytes)
    example: "GET /v1/chat?token=<jwt> HTTP/1.1\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
    required_headers: [Upgrade, Connection, Sec-WebSocket-Version, Sec-WebSocket-Key]
  - step: server_validates_request
    description: Server validates HTTP method (GET), Upgrade header (websocket), Connection header (Upgrade), Sec-WebSocket-Version (13), Sec-WebSocket-Key format
    validation_checks: [method=GET, upgrade=websocket, connection=Upgrade, version=13, key_valid]
  - step: server_computes_accept
    description: Server computes Sec-WebSocket-Accept = Base64(SHA-1(Sec-WebSocket-Key + GUID))
    guid: "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"
    formula: Base64(SHA-1(key + guid))
  - step: server_sends_upgrade_response
    description: Server sends 101 Switching Protocols with Upgrade websocket, Connection Upgrade, Sec-WebSocket-Accept
    example: "HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\r\n"
    required_headers: [Upgrade, Connection, Sec-WebSocket-Accept]
  - step: protocol_switched
    description: Connection upgraded from HTTP to WebSocket, bidirectional communication begins
    result: WebSocket connection established

http_headers_required:
  client_to_server:
    - header: Upgrade
      value: websocket
      required: true
      description: Indicates client wishes to upgrade to WebSocket protocol
    - header: Connection
      value: Upgrade
      required: true
      description: Indicates connection should be upgraded
    - header: Sec-WebSocket-Version
      value: "13"
      required: true
      description: WebSocket protocol version (RFC 6455 only supports version 13)
    - header: Sec-WebSocket-Key
      value: base64_encoded_16_bytes
      required: true
      description: Base64-encoded random 16-byte value for handshake validation
    - header: Sec-WebSocket-Protocol
      value: optional_subprotocol
      required: false
      description: Optional subprotocol (e.g., "chat", "graphql-ws")
    - header: Origin
      value: optional_origin_url
      required: false
      description: Optional origin for CORS validation

  server_to_client:
    - header: HTTP Status
      value: "101 Switching Protocols"
      required: true
      description: Indicates server accepts protocol upgrade
    - header: Upgrade
      value: websocket
      required: true
      description: Confirms upgrade to WebSocket protocol
    - header: Connection
      value: Upgrade
      required: true
      description: Confirms connection upgrade
    - header: Sec-WebSocket-Accept
      value: base64_sha1_hash
      required: true
      description: Base64(SHA-1(Sec-WebSocket-Key + GUID)) for validation
    - header: Sec-WebSocket-Protocol
      value: selected_subprotocol
      required: false
      description: Server-selected subprotocol (if client requested)

error_responses:
  - code: 400
    reason: Bad Request
    cases: [missing_upgrade_header, missing_connection_header, missing_sec_websocket_key, invalid_sec_websocket_key_format]
  - code: 426
    reason: Upgrade Required
    cases: [unsupported_websocket_version, missing_upgrade_header]
  - code: 403
    reason: Forbidden
    cases: [jwt_authentication_failed, origin_validation_failed]
  - code: 500
    reason: Internal Server Error
    cases: [upgrade_handshake_failed, connection_setup_error]

performance_budgets:
  - operation: validate_upgrade_request
    target: <50ms
    description: Validate HTTP headers and extract WebSocket upgrade parameters
  - operation: compute_sec_websocket_accept
    target: <5ms
    description: SHA-1 hash and Base64 encode Sec-WebSocket-Accept
  - operation: send_upgrade_response
    target: <10ms
    description: Construct and send 101 Switching Protocols response
  - operation: total_handshake
    target: <100ms
    description: Complete HTTP → WebSocket upgrade (excluding TLS + JWT)
