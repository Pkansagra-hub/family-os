classes:
  - name: WebSocketHandler
    description: Complete WebSocket connection lifecycle handler with HTTP upgrade, authentication, and message loop
    research: RFC 6455 (WebSocket Protocol), tokio async runtime, bidirectional message handling
    performance_budget: <500ms total connection establishment (TLS + JWT + upgrade + registration)
    reliability_properties:
      - complete_lifecycle: Handle entire connection from HTTP upgrade to close
      - authentication_integration: JWT validation before accepting connection
      - bidirectional_messaging: Handle client → server and server → client messages
      - connection_registration: Register in ConnectionRegistry after authentication
      - graceful_error_handling: Proper error responses for failed connections
    methods:
      - name: handle_connection
        description: Handle complete WebSocket connection lifecycle
        parameters:
          - name: stream
            type: TcpStream
            description: Incoming TCP stream (after TLS upgrade)
          - name: query_params
            type: HashMap<String, String>
            description: Query parameters from WebSocket URL
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<(), ConnectionError>
          description: Success or error
        implementation:
          rust: |
            use tokio::net::TcpStream;
            use tokio_tungstenite::{accept_async, WebSocketStream};
            use tokio::sync::mpsc;
            use futures_util::{StreamExt, SinkExt};

            pub struct WebSocketHandler {
                jwt_authenticator: Arc<JWTWebSocketAuthenticator>,
                connection_registry: Arc<ConnectionRegistry>,
                disconnect_handler: Arc<GracefulDisconnectHandler>,
                metrics: Arc<ConnectionMetrics>,
            }

            impl WebSocketHandler {
                pub async fn handle_connection(
                    &self,
                    stream: TcpStream,
                    query_params: HashMap<String, String>,
                    trace_id: String,
                ) -> Result<(), ConnectionError> {
                    let start_total = std::time::Instant::now();

                    tracing::info!(
                        trace_id = %trace_id,
                        "Starting WebSocket connection handling"
                    );

                    // 1. Validate JWT from query params
                    let claims = self.jwt_authenticator
                        .validate_jwt_from_query_param(&query_params, &trace_id)
                        .await
                        .map_err(|e| ConnectionError::AuthenticationFailed(format!("{:?}", e)))?;

                    let session_id = claims.session_id.clone().unwrap();
                    let user_id = claims.sub.clone();
                    let space_id = claims.space_id.clone().unwrap();

                    tracing::info!(
                        trace_id = %trace_id,
                        session_id = %session_id,
                        user_id = %user_id,
                        "JWT authentication successful"
                    );

                    // 2. HTTP → WebSocket upgrade (RFC 6455)
                    let ws_stream = accept_async(stream)
                        .await
                        .map_err(|e| ConnectionError::UpgradeFailed(e.to_string()))?;

                    tracing::info!(
                        trace_id = %trace_id,
                        session_id = %session_id,
                        "WebSocket upgrade complete"
                    );

                    // 3. Create message channel (for server → client messages)
                    let (tx, mut rx) = mpsc::channel::<WebSocketMessage>(100);

                    // 4. Create and register connection
                    let connection = WebSocketConnection::new(
                        session_id.clone(),
                        user_id.clone(),
                        space_id.clone(),
                        tx.clone(),
                    );

                    self.connection_registry.register(session_id.clone(), connection).await
                        .map_err(|e| ConnectionError::RegistrationFailed(format!("{:?}", e)))?;

                    let total_ms = start_total.elapsed().as_millis();

                    tracing::info!(
                        trace_id = %trace_id,
                        session_id = %session_id,
                        duration_ms = total_ms,
                        "Connection established"
                    );

                    // Emit metrics
                    self.metrics.record_connection_established(start_total.elapsed(), true);

                    // Validate performance budget (<500ms)
                    if total_ms > 500 {
                        tracing::warn!(
                            trace_id = %trace_id,
                            duration_ms = total_ms,
                            "Connection establishment exceeded 500ms budget"
                        );
                    }

                    // 5. Send ConnectionEstablished message
                    let established_msg = WebSocketMessage::ConnectionEstablished {
                        session_id: session_id.clone(),
                        user_id: user_id.clone(),
                        server_version: "1.0.0".to_string(),
                        protocol_version: 1,
                    };

                    let _ = tx.send(established_msg).await;

                    // 6. Spawn message loop task (bidirectional)
                    let message_loop_result = self.run_message_loop(
                        ws_stream,
                        session_id.clone(),
                        user_id,
                        space_id,
                        rx,
                        trace_id.clone(),
                    ).await;

                    // 7. Cleanup on disconnect
                    self.disconnect_handler.disconnect(
                        &session_id,
                        1000,  // Normal closure
                        "Connection closed",
                        &trace_id,
                    ).await?;

                    match message_loop_result {
                        Ok(_) => Ok(()),
                        Err(e) => Err(ConnectionError::MessageLoopFailed(e.to_string())),
                    }
                }

                async fn run_message_loop(
                    &self,
                    ws_stream: WebSocketStream<TcpStream>,
                    session_id: String,
                    user_id: String,
                    space_id: String,
                    mut rx: mpsc::Receiver<WebSocketMessage>,
                    trace_id: String,
                ) -> Result<(), MessageLoopError> {
                    let (mut ws_sender, mut ws_receiver) = ws_stream.split();

                    loop {
                        tokio::select! {
                            // Client → Server messages
                            msg = ws_receiver.next() => {
                                match msg {
                                    Some(Ok(tokio_tungstenite::tungstenite::Message::Binary(data))) => {
                                        self.handle_client_message(&session_id, &user_id, &space_id, data, &trace_id).await?;
                                    }
                                    Some(Ok(tokio_tungstenite::tungstenite::Message::Ping(_))) => {
                                        // Automatically handled by tokio-tungstenite
                                    }
                                    Some(Ok(tokio_tungstenite::tungstenite::Message::Close(_))) => {
                                        tracing::info!(
                                            session_id = %session_id,
                                            trace_id = %trace_id,
                                            "Client closed connection"
                                        );
                                        break;
                                    }
                                    Some(Err(e)) => {
                                        tracing::error!(
                                            session_id = %session_id,
                                            error = %e,
                                            "WebSocket error"
                                        );
                                        break;
                                    }
                                    None => break,
                                    _ => {}
                                }
                            }

                            // Server → Client messages (from mpsc channel)
                            msg = rx.recv() => {
                                match msg {
                                    Some(ws_msg) => {
                                        let binary_data = self.serialize_message(ws_msg)?;
                                        ws_sender.send(tokio_tungstenite::tungstenite::Message::Binary(binary_data)).await?;
                                    }
                                    None => break,
                                }
                            }
                        }
                    }

                    Ok(())
                }

                async fn handle_client_message(
                    &self,
                    session_id: &str,
                    user_id: &str,
                    space_id: &str,
                    binary_data: Vec<u8>,
                    trace_id: &str,
                ) -> Result<(), MessageLoopError> {
                    // Deserialize FlatBuffers message
                    // Route to appropriate handler
                    // (Implementation in ADR-0040b Message Framing)
                    Ok(())
                }

                fn serialize_message(&self, msg: WebSocketMessage) -> Result<Vec<u8>, MessageLoopError> {
                    // Serialize to FlatBuffers
                    // (Implementation in ADR-0040b Message Framing)
                    Ok(vec![])
                }
            }

            #[derive(Debug)]
            pub enum ConnectionError {
                AuthenticationFailed(String),
                UpgradeFailed(String),
                RegistrationFailed(String),
                MessageLoopFailed(String),
            }

            #[derive(Debug)]
            pub enum MessageLoopError {
                DeserializationFailed(String),
                SendFailed(String),
            }
          python: |
            import asyncio
            import time
            import logging

            class WebSocketHandler:
                """Complete WebSocket connection lifecycle handler"""

                def __init__(self, jwt_authenticator, connection_registry, disconnect_handler, metrics):
                    self.logger = logging.getLogger(__name__)
                    self.jwt_authenticator = jwt_authenticator
                    self.connection_registry = connection_registry
                    self.disconnect_handler = disconnect_handler
                    self.metrics = metrics

                async def handle_connection(
                    self,
                    websocket,
                    query_params: dict,
                    trace_id: str
                ) -> None:
                    """Handle complete WebSocket connection lifecycle"""
                    start_total = time.time()

                    self.logger.info(
                        f"Starting WebSocket connection handling",
                        extra={'trace_id': trace_id}
                    )

                    try:
                        # 1. Validate JWT
                        claims = self.jwt_authenticator.validate_jwt_from_query_param(
                            query_params,
                            trace_id
                        )

                        session_id = claims.session_id
                        user_id = claims.sub
                        space_id = claims.space_id

                        # 2. Create message queue
                        tx = asyncio.Queue(maxsize=100)

                        # 3. Create and register connection
                        connection = WebSocketConnection(session_id, user_id, space_id, tx)
                        await self.connection_registry.register(session_id, connection)

                        total_ms = (time.time() - start_total) * 1000

                        self.logger.info(
                            f"Connection established",
                            extra={
                                'trace_id': trace_id,
                                'session_id': session_id,
                                'duration_ms': total_ms
                            }
                        )

                        # 4. Send ConnectionEstablished
                        await tx.put({'type': 'ConnectionEstablished', 'session_id': session_id})

                        # 5. Run message loop
                        await self.run_message_loop(websocket, session_id, user_id, space_id, tx, trace_id)

                    finally:
                        # Cleanup on disconnect
                        await self.disconnect_handler.disconnect(session_id, 1000, "Connection closed", trace_id)

                async def run_message_loop(
                    self,
                    websocket,
                    session_id: str,
                    user_id: str,
                    space_id: str,
                    tx: asyncio.Queue,
                    trace_id: str
                ) -> None:
                    """Bidirectional message loop"""
                    # Implementation details...
                    pass

connection_establishment_sequence:
  - step: accept_tcp_connection
    description: Accept incoming TCP connection (after TLS upgrade)
    timing: <50ms
  - step: validate_jwt
    description: Extract and validate JWT from query parameter
    timing: <50ms
    error_handling: Return 403 if invalid
  - step: http_websocket_upgrade
    description: Upgrade HTTP connection to WebSocket (RFC 6455)
    timing: <100ms
    error_handling: Return 426 if upgrade fails
  - step: create_message_channel
    description: Create mpsc channel (capacity 100)
    timing: <1ms
  - step: register_connection
    description: Add to ConnectionRegistry
    timing: <5ms
    error_handling: Return 500 if registration fails
  - step: send_connection_established
    description: Send ConnectionEstablished message to client
    timing: <2ms
  - step: spawn_message_loop
    description: Start bidirectional message loop task
    timing: Async (non-blocking)

message_loop_design:
  - pattern: tokio_select_bidirectional
    description: Use tokio::select! for concurrent client→server and server→client message handling
    benefits: [true_bidirectional, no_polling, efficient_async]
  - pattern: split_websocket_stream
    description: Split WebSocket into sender and receiver for independent operations
    benefits: [concurrent_send_receive, no_mutex_needed]
  - pattern: mpsc_channel_for_outbound
    description: Use mpsc channel for server→client messages (100 capacity)
    benefits: [non_blocking_send, backpressure_handling]

error_handling:
  - error: AuthenticationFailed
    status: 403
    action: Close TCP connection, log error, increment auth_failures_total metric
  - error: UpgradeFailed
    status: 426
    action: Return Upgrade Required, log error
  - error: RegistrationFailed
    status: 500
    action: Close connection, log error, return Internal Server Error
  - error: MessageLoopFailed
    status: 1011 (close code)
    action: Graceful disconnect with server error close code

performance_budgets:
  - operation: total_connection_establishment
    target: <500ms
    breakdown: [tls_200ms, jwt_50ms, upgrade_100ms, registration_5ms, overhead_145ms]
  - operation: message_loop_iteration
    target: <10ms
    description: Single iteration of tokio::select! loop
