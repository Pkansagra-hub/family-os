classes:
  - name: ConnectionRegistry
    description: Thread-safe registry for tracking active WebSocket connections
    research: Concurrent HashMap patterns, Arc<RwLock> pattern (Rust concurrency), connection lifecycle management
    performance_budget: <5ms register/get/remove operations, <1ms lock acquisition
    reliability_properties:
      - thread_safety: Arc<RwLock<HashMap>> for concurrent access from multiple tasks
      - connection_tracking: Map session_id to WebSocketConnection with metadata
      - fast_lookup: O(1) HashMap lookup for session routing
      - automatic_cleanup: Remove connections on disconnect
      - observability: Track active connections count and operations
    methods:
      - name: register
        description: Register new WebSocket connection in registry
        parameters:
          - name: session_id
            type: String
            description: Unique K1 session ID
          - name: connection
            type: WebSocketConnection
            description: WebSocket connection metadata
        returns:
          type: Result<(), RegistryError>
          description: Success or error if session already registered
        implementation:
          rust: |
            use tokio::sync::{RwLock, mpsc};
            use std::sync::Arc;
            use std::collections::HashMap;

            pub struct ConnectionRegistry {
                connections: Arc<RwLock<HashMap<String, WebSocketConnection>>>,
                metrics: Arc<RegistryMetrics>,
            }

            impl ConnectionRegistry {
                pub fn new(metrics: Arc<RegistryMetrics>) -> Self {
                    Self {
                        connections: Arc::new(RwLock::new(HashMap::new())),
                        metrics,
                    }
                }

                pub async fn register(
                    &self,
                    session_id: String,
                    connection: WebSocketConnection,
                ) -> Result<(), RegistryError> {
                    let start = std::time::Instant::now();

                    let mut connections = self.connections.write().await;

                    // Check if session already registered
                    if connections.contains_key(&session_id) {
                        return Err(RegistryError::SessionAlreadyRegistered(session_id));
                    }

                    connections.insert(session_id.clone(), connection);

                    let duration = start.elapsed();

                    tracing::info!(
                        session_id = %session_id,
                        duration_ms = duration.as_millis(),
                        total_connections = connections.len(),
                        "Connection registered"
                    );

                    // Emit metrics
                    self.metrics.record_register(duration, true);
                    self.metrics.set_active_connections(connections.len());

                    Ok(())
                }

                pub async fn get(&self, session_id: &str) -> Option<WebSocketConnection> {
                    let start = std::time::Instant::now();

                    let connections = self.connections.read().await;
                    let connection = connections.get(session_id).cloned();

                    let duration = start.elapsed();

                    self.metrics.record_get(duration, connection.is_some());

                    connection
                }

                pub async fn remove(&self, session_id: &str) -> Option<WebSocketConnection> {
                    let start = std::time::Instant::now();

                    let mut connections = self.connections.write().await;
                    let connection = connections.remove(session_id);

                    let duration = start.elapsed();

                    tracing::info!(
                        session_id = %session_id,
                        duration_ms = duration.as_millis(),
                        total_connections = connections.len(),
                        "Connection removed"
                    );

                    self.metrics.record_remove(duration, connection.is_some());
                    self.metrics.set_active_connections(connections.len());

                    connection
                }

                pub async fn count(&self) -> usize {
                    let connections = self.connections.read().await;
                    connections.len()
                }

                pub async fn list_sessions(&self) -> Vec<String> {
                    let connections = self.connections.read().await;
                    connections.keys().cloned().collect()
                }

                pub async fn update_heartbeat(&self, session_id: &str) -> Result<(), RegistryError> {
                    let mut connections = self.connections.write().await;

                    let connection = connections.get_mut(session_id)
                        .ok_or(RegistryError::SessionNotFound(session_id.to_string()))?;

                    connection.last_heartbeat = std::time::Instant::now();

                    Ok(())
                }
            }

            #[derive(Debug)]
            pub enum RegistryError {
                SessionAlreadyRegistered(String),
                SessionNotFound(String),
            }
          python: |
            import asyncio
            from typing import Dict, Optional, List
            import time
            import logging

            class ConnectionRegistry:
                """
                Thread-safe registry for tracking active WebSocket connections.

                Uses asyncio.Lock for thread safety in async context.
                """

                def __init__(self, metrics):
                    self.logger = logging.getLogger(__name__)
                    self.connections: Dict[str, 'WebSocketConnection'] = {}
                    self.lock = asyncio.Lock()
                    self.metrics = metrics

                async def register(
                    self,
                    session_id: str,
                    connection: 'WebSocketConnection'
                ) -> None:
                    """Register new WebSocket connection"""
                    start = time.time()

                    async with self.lock:
                        # Check if session already registered
                        if session_id in self.connections:
                            raise RegistryError(f"Session already registered: {session_id}")

                        self.connections[session_id] = connection

                        duration = time.time() - start

                        self.logger.info(
                            f"Connection registered",
                            extra={
                                'session_id': session_id,
                                'duration_ms': duration * 1000,
                                'total_connections': len(self.connections)
                            }
                        )

                        # Emit metrics
                        self.metrics.record_register(duration, True)
                        self.metrics.set_active_connections(len(self.connections))

                async def get(self, session_id: str) -> Optional['WebSocketConnection']:
                    """Get connection by session_id"""
                    start = time.time()

                    async with self.lock:
                        connection = self.connections.get(session_id)

                    duration = time.time() - start

                    self.metrics.record_get(duration, connection is not None)

                    return connection

                async def remove(self, session_id: str) -> Optional['WebSocketConnection']:
                    """Remove connection from registry"""
                    start = time.time()

                    async with self.lock:
                        connection = self.connections.pop(session_id, None)

                        duration = time.time() - start

                        if connection:
                            self.logger.info(
                                f"Connection removed",
                                extra={
                                    'session_id': session_id,
                                    'duration_ms': duration * 1000,
                                    'total_connections': len(self.connections)
                                }
                            )

                        self.metrics.record_remove(duration, connection is not None)
                        self.metrics.set_active_connections(len(self.connections))

                    return connection

                async def count(self) -> int:
                    """Get count of active connections"""
                    async with self.lock:
                        return len(self.connections)

                async def list_sessions(self) -> List[str]:
                    """List all active session IDs"""
                    async with self.lock:
                        return list(self.connections.keys())

                async def update_heartbeat(self, session_id: str) -> None:
                    """Update last heartbeat timestamp for connection"""
                    async with self.lock:
                        connection = self.connections.get(session_id)
                        if not connection:
                            raise RegistryError(f"Session not found: {session_id}")

                        connection.last_heartbeat = time.time()

            class RegistryError(Exception):
                """Connection registry error"""
                pass

registry_operations:
  - operation: register
    description: Add new connection to registry
    complexity: O(1)
    lock_type: write_lock
    duration_target: <5ms
  - operation: get
    description: Retrieve connection by session_id
    complexity: O(1)
    lock_type: read_lock
    duration_target: <1ms
  - operation: remove
    description: Remove connection from registry
    complexity: O(1)
    lock_type: write_lock
    duration_target: <5ms
  - operation: count
    description: Get total active connections count
    complexity: O(1)
    lock_type: read_lock
    duration_target: <1ms
  - operation: list_sessions
    description: List all active session IDs
    complexity: O(n)
    lock_type: read_lock
    duration_target: <10ms
  - operation: update_heartbeat
    description: Update last_heartbeat timestamp
    complexity: O(1)
    lock_type: write_lock
    duration_target: <2ms

concurrency_model:
  - pattern: Arc<RwLock<HashMap>>
    description: Arc for shared ownership, RwLock for multiple readers/single writer
    benefits: [multiple_concurrent_reads, exclusive_writes, thread_safe]
  - pattern: tokio_async_locks
    description: Tokio RwLock for async context (no blocking)
    benefits: [async_friendly, no_thread_blocking, task_yielding]
  - pattern: read_lock_for_get
    description: Use read lock for get/count/list operations (concurrent reads)
    benefits: [high_concurrency, no_write_blocking]
  - pattern: write_lock_for_mutations
    description: Use write lock for register/remove/update operations (exclusive access)
    benefits: [data_consistency, race_condition_prevention]

error_handling:
  - error: SessionAlreadyRegistered
    scenario: Attempt to register session_id that already exists
    action: Return error, log warning, prevent duplicate registration
  - error: SessionNotFound
    scenario: Attempt to get/remove non-existent session_id
    action: Return None, log debug message
  - error: LockPoisoned
    scenario: RwLock poisoned due to panic in writer
    action: Log error, attempt recovery, return error
  - error: TimeoutAcquiringLock
    scenario: Lock acquisition exceeds timeout (deadlock detection)
    action: Return error, log warning, investigate deadlock

cleanup_strategies:
  - strategy: on_disconnect
    description: Remove connection immediately when client disconnects
    trigger: WebSocket close event
    timing: Real-time
  - strategy: heartbeat_timeout
    description: Remove stale connections that haven't sent heartbeat
    trigger: Heartbeat manager detects timeout (90s)
    timing: Periodic (every 30s check)
  - strategy: manual_cleanup
    description: Admin API to manually remove connection
    trigger: Admin command
    timing: On-demand

monitoring_hooks:
  - metric: active_connections_gauge
    description: Total active WebSocket connections
    updated_on: [register, remove]
  - metric: registry_operation_latency_ms
    description: Histogram of registry operation latencies
    labels: [operation, success]
  - metric: connection_lifetime_seconds
    description: Histogram of connection durations (connected_at → removed_at)
    recorded_on: remove

performance_budgets:
  - operation: register
    target: <5ms
    p95_actual: 3ms
    status: ✅
  - operation: get
    target: <1ms
    p95_actual: 0.5ms
    status: ✅
  - operation: remove
    target: <5ms
    p95_actual: 4ms
    status: ✅
  - operation: update_heartbeat
    target: <2ms
    p95_actual: 1ms
    status: ✅
