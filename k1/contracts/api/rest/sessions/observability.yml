observability:
  name: "Session API Observability Contract"
  purpose: "Prometheus metrics for session lifecycle endpoints"
  version: "1.0"
  adr_source: "ADR-0041a (Session CRUD) lines 1001-1626 (Observability)"
  module: "k1/l5_infrastructure/api_gateway/rest/metrics.py"
  capability: "Observability & Monitoring"

  description: |
    Observability contract for REST API session endpoints defining Prometheus
    metrics for throughput, latency, errors, and cache performance.

    Key metrics:
    - Request throughput (counter)
    - Latency histograms (P50/P95/P99)
    - Cache hit rate (gauge)
    - Error rates (counter)

  prometheus_metrics:
    sessions_created_total:
      type: "counter"
      description: "Total sessions created via POST /v1/sessions"
      labels:
        - "persona"
        - "privacy_band"

      usage: |
        sessions_created_total.labels(
          persona="helpful_assistant",
          privacy_band="GREEN"
        ).inc()

    session_creation_latency_ms:
      type: "histogram"
      description: "Session creation latency in milliseconds"
      buckets: [50, 100, 200, 300, 500, 1000]
      labels: []

      usage: |
        with session_creation_latency_ms.time():
          create_session(params)

    session_read_latency_ms:
      type: "histogram"
      description: "Session read latency (GET /v1/sessions/{id})"
      buckets: [5, 10, 50, 100, 200]
      labels:
        - "cache_status" # Values: "hit", "miss"

      usage: |
        session_read_latency_ms.labels(
          cache_status="hit"
        ).observe(8.5)

    cache_hit_rate:
      type: "gauge"
      description: "HTTP cache hit rate (target 82%)"
      labels: []

      calculation: "cache_hits / (cache_hits + cache_misses)"

      usage: |
        cache_hit_rate.set(0.82)

    sessions_read_total:
      type: "counter"
      description: "Total session reads"
      labels:
        - "cache_status" # Values: "hit" (304), "miss" (200)

      usage: |
        sessions_read_total.labels(cache_status="hit").inc()

    sessions_updated_total:
      type: "counter"
      description: "Total session updates via PATCH"
      labels:
        - "field_updated" # Values: "metadata", "ttl"

      usage: |
        sessions_updated_total.labels(field_updated="metadata").inc()

    sessions_terminated_total:
      type: "counter"
      description: "Total session terminations via DELETE"
      labels:
        - "reason" # Values: "user_request", "ttl_expired", "error"

      usage: |
        sessions_terminated_total.labels(reason="user_request").inc()

    session_termination_latency_ms:
      type: "histogram"
      description: "Session termination latency"
      buckets: [100, 200, 300, 500, 1000]
      labels: []

    rest_requests_total:
      type: "counter"
      description: "Total REST API requests"
      labels:
        - "method" # Values: "GET", "POST", "PATCH", "DELETE"
        - "endpoint" # Values: "/v1/sessions", "/v1/sessions/{id}"
        - "status" # Values: "200", "201", "304", "400", "404", "500"

      usage: |
        rest_requests_total.labels(
          method="GET",
          endpoint="/v1/sessions/{id}",
          status="200"
        ).inc()

    rest_api_latency_ms:
      type: "histogram"
      description: "REST API request latency"
      buckets: [10, 50, 100, 200, 500, 1000, 2000, 5000]
      labels:
        - "method"
        - "endpoint"
        - "status"

      usage: |
        rest_api_latency_ms.labels(
          method="GET",
          endpoint="/v1/sessions/{id}",
          status="200"
        ).observe(85.3)

    etag_generation_latency_ms:
      type: "histogram"
      description: "ETag computation latency"
      buckets: [0.5, 1, 2, 5]
      labels: []

    active_sessions:
      type: "gauge"
      description: "Number of active sessions"
      labels: []

      usage: |
        active_sessions.inc()  # On session creation
        active_sessions.dec()  # On session termination

  performance_targets:
    post_create_session:
      p50_latency_ms: 150
      p95_latency_ms: 500
      p99_latency_ms: 1000
      throughput_rps: 100

    get_session_uncached:
      p50_latency_ms: 50
      p95_latency_ms: 100
      p99_latency_ms: 150
      throughput_rps: 500

    get_session_cached:
      p50_latency_ms: 5
      p95_latency_ms: 10
      p99_latency_ms: 20
      throughput_rps: 5000

    get_sessions_list:
      p50_latency_ms: 50
      p95_latency_ms: 200
      p99_latency_ms: 500
      throughput_rps: 200

    patch_update_session:
      p50_latency_ms: 100
      p95_latency_ms: 200
      p99_latency_ms: 300
      throughput_rps: 50

    delete_terminate_session:
      p50_latency_ms: 150
      p95_latency_ms: 300
      p99_latency_ms: 500
      throughput_rps: 20

  grafana_dashboard:
    panels:
      - title: "Requests per Second"
        type: "graph"
        query: "rate(rest_requests_total{endpoint=~'/v1/sessions.*'}[5m])"
        legend: "{{method}} {{status}}"

      - title: "P95 Latency by Endpoint"
        type: "stat"
        query: "histogram_quantile(0.95, rate(rest_api_latency_ms_bucket{endpoint=~'/v1/sessions.*'}[5m]))"
        thresholds:
          - value: 500
            color: "red"
          - value: 200
            color: "yellow"
          - value: 0
            color: "green"

      - title: "Cache Hit Rate"
        type: "stat"
        query: "rate(sessions_read_total{cache_status='hit'}[5m]) / rate(sessions_read_total[5m])"
        format: "percent"
        thresholds:
          - value: 0.8
            color: "green"
          - value: 0.5
            color: "yellow"
          - value: 0
            color: "red"

      - title: "Active Sessions"
        type: "stat"
        query: "active_sessions"

      - title: "Error Rate"
        type: "graph"
        query: "rate(rest_requests_total{status=~'4..|5..'}[5m])"
        legend: "{{status}} {{endpoint}}"

      - title: "Session Creation Latency"
        type: "heatmap"
        query: "rate(session_creation_latency_ms_bucket[5m])"

  alerting_rules:
    high_latency:
      alert: "SessionAPIHighLatency"
      expr: "histogram_quantile(0.95, rate(rest_api_latency_ms_bucket{endpoint='/v1/sessions/{id}'}[5m])) > 200"
      for: "5m"
      severity: "warning"
      message: "Session GET P95 latency exceeds 200ms (current: {{$value}}ms)"

    low_cache_hit_rate:
      alert: "SessionAPILowCacheHitRate"
      expr: "rate(sessions_read_total{cache_status='hit'}[5m]) / rate(sessions_read_total[5m]) < 0.7"
      for: "10m"
      severity: "warning"
      message: "Cache hit rate below 70% (current: {{$value}})"

    high_error_rate:
      alert: "SessionAPIHighErrorRate"
      expr: "rate(rest_requests_total{status=~'5..'}[5m]) > 0.01"
      for: "5m"
      severity: "critical"
      message: "Session API error rate exceeds 1% (current: {{$value}})"

  structured_logging:
    session_created:
      level: "info"
      fields:
        - "session_id"
        - "user_id"
        - "persona"
        - "privacy_band"
        - "latency_ms"
        - "trace_id"

      example: |
        log.info(
          "session_created",
          session_id="session-abc123",
          user_id="user-xyz789",
          persona="helpful_assistant",
          privacy_band="GREEN",
          latency_ms=420,
          trace_id="trace-123"
        )

    session_read:
      level: "info"
      fields:
        - "session_id"
        - "cache_status"
        - "latency_ms"
        - "trace_id"

      example: |
        log.info(
          "session_read",
          session_id="session-abc123",
          cache_status="hit",
          latency_ms=8,
          trace_id="trace-456"
        )

    session_terminated:
      level: "info"
      fields:
        - "session_id"
        - "user_id"
        - "total_turns"
        - "session_duration_seconds"
        - "latency_ms"
        - "trace_id"

      example: |
        log.info(
          "session_terminated",
          session_id="session-abc123",
          user_id="user-xyz789",
          total_turns=5,
          session_duration_seconds=900,
          latency_ms=263,
          trace_id="trace-789"
        )

  trace_integration:
    opentelemetry:
      enabled: true

      spans:
        - name: "POST /v1/sessions"
          attributes:
            - "http.method: POST"
            - "http.route: /v1/sessions"
            - "session.persona"
            - "session.privacy_band"

        - name: "GET /v1/sessions/{id}"
          attributes:
            - "http.method: GET"
            - "http.route: /v1/sessions/{id}"
            - "cache.status: hit|miss"

        - name: "DELETE /v1/sessions/{id}"
          attributes:
            - "http.method: DELETE"
            - "http.route: /v1/sessions/{id}"
            - "session.total_turns"

  production_metrics:
    six_month_summary:
      total_requests: 5000000

      by_endpoint:
        POST_sessions: 500000
        GET_sessions_id: 3000000
        GET_sessions: 800000
        PATCH_sessions_id: 500000
        DELETE_sessions_id: 200000

      cache_performance:
        total_gets: 3000000
        cache_hits: 2460000
        cache_misses: 540000
        hit_rate_percent: 82

      latency_p95:
        POST_sessions_ms: 420
        GET_sessions_id_uncached_ms: 85
        GET_sessions_id_cached_ms: 8
        GET_sessions_ms: 78
        PATCH_sessions_id_ms: 136
        DELETE_sessions_id_ms: 263

  related_contracts:
    - "post_create_session.yml"
    - "get_session.yml"
    - "get_sessions_list.yml"
    - "patch_update_session.yml"
    - "delete_terminate_session.yml"
    - "http_caching.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition from ADR-0041a"
      author: "Contract Development Team"
