hateoas_links:
  name: "HATEOAS Links Contract"
  purpose: "Hypermedia links for API discoverability and navigation"
  version: "1.0"
  adr_source: "ADR-0041a (Session CRUD) lines 252-500 (HATEOAS)"
  module: "k1/l5_infrastructure/api_gateway/rest/hateoas.py"
  capability: "RESTful API Design"

  description: |
    HATEOAS (Hypermedia as the Engine of Application State) contract defines
    link structure in API responses for client navigation without hardcoded URLs.

    Key principles:
    - Every resource response includes _links object
    - Clients discover API via links (no URL construction)
    - Supports API evolution without breaking clients
    - Standard link relations (self, next, prev, related)

  link_structure:
    _links_object:
      description: "Top-level _links object in every response"
      required: true
      type: "object"

      standard_relations:
        self:
          description: "Link to current resource"
          required: true
          format: {"href": "string"}
          example: {"href": "/v1/sessions/session-abc123"}

        next:
          description: "Link to next page (pagination)"
          required: false
          format: {"href": "string"}
          example: {"href": "/v1/sessions?cursor=xyz&limit=20"}

        prev:
          description: "Link to previous page (pagination)"
          required: false
          format: {"href": "string"}

        related:
          description: "Link to related resource"
          required: false
          format: {"href": "string"}
          example: {"href": "/v1/conversations/session-abc123"}

      custom_relations:
        turns:
          description: "Link to session turns sub-resource"
          format: {"href": "string"}
          example: {"href": "/v1/sessions/session-abc123/turns"}

        agents:
          description: "Link to session agents sub-resource"
          format: {"href": "string"}
          example: {"href": "/v1/sessions/session-abc123/agents"}

        conversation:
          description: "Link to archived conversation"
          format: {"href": "string"}
          example: {"href": "/v1/conversations/session-abc123"}

  link_generation:
    session_resource:
      _links:
        self:
          href: "/v1/sessions/{session_id}"
          description: "Current session resource"

        turns:
          href: "/v1/sessions/{session_id}/turns"
          description: "Session turns sub-resource"

        agents:
          href: "/v1/sessions/{session_id}/agents"
          description: "Session agents sub-resource"

    session_collection:
      _links:
        self:
          href: "/v1/sessions?limit={limit}"
          description: "Current page"

        next:
          href: "/v1/sessions?limit={limit}&cursor={next_cursor}"
          description: "Next page (if has_more=true)"
          conditional: "Only if has_more is true"

        prev:
          href: "/v1/sessions?limit={limit}&cursor={prev_cursor}"
          description: "Previous page (if cursor provided)"
          conditional: "Only if cursor was provided in request"

    terminated_session:
      _links:
        conversation:
          href: "/v1/conversations/{session_id}"
          description: "Archived conversation (read-only)"

  benefits:
    discoverability:
      description: "Clients discover API via links"
      example: |
        Client doesn't need to know:
        - How to construct /v1/sessions/{id}/turns URL
        - How to encode pagination cursors
        - Where archived conversations are stored

        Client follows links:
        response._links.turns.href → "/v1/sessions/session-abc123/turns"

    evolvability:
      description: "API can evolve without breaking clients"
      example: |
        URL change: /v1/sessions → /v2/sessions
        Client code: response._links.self.href (unchanged)

        No hardcoded URLs = no client-side changes needed

    reduced_coupling:
      description: "Loose coupling between client and server"
      benefit: "Server controls URL structure, clients navigate via links"

  implementation:
    link_builder:
      class_name: "HATEOASLinkBuilder"

      methods:
        build_session_links:
          input: "session_id: str"
          output: |
            {
              "self": {"href": f"/v1/sessions/{session_id}"},
              "turns": {"href": f"/v1/sessions/{session_id}/turns"},
              "agents": {"href": f"/v1/sessions/{session_id}/agents"}
            }

        build_pagination_links:
          input: "base_url: str, limit: int, next_cursor: str?, prev_cursor: str?"
          output: |
            {
              "self": {"href": f"{base_url}?limit={limit}"},
              "next": {"href": f"{base_url}?limit={limit}&cursor={next_cursor}"} if next_cursor else None,
              "prev": {"href": f"{base_url}?limit={limit}&cursor={prev_cursor}"} if prev_cursor else None
            }

  standards_compliance:
    rfc_5988:
      name: "RFC 5988: Web Linking"
      description: "Standard for link relations in HTTP"
      url: "https://tools.ietf.org/html/rfc5988"

    hal_json:
      name: "HAL (Hypertext Application Language)"
      description: "_links convention from HAL specification"
      url: "https://tools.ietf.org/html/draft-kelly-json-hal"

    industry_adoption:
      - name: "GitHub API"
        url: "https://api.github.com"
        pattern: "_links in every response"

      - name: "Stripe API"
        url: "https://api.stripe.com"
        pattern: "url fields for related resources"

      - name: "PayPal API"
        url: "https://api.paypal.com"
        pattern: "HATEOAS links for payment workflows"

  examples:
    session_response:
      _links:
        self:
          href: "/v1/sessions/session-abc123"
        turns:
          href: "/v1/sessions/session-abc123/turns"
        agents:
          href: "/v1/sessions/session-abc123/agents"

    session_list_response:
      data:
        - session_id: "session-001"
          _links:
            self:
              href: "/v1/sessions/session-001"

      _links:
        self:
          href: "/v1/sessions?limit=20"
        next:
          href: "/v1/sessions?limit=20&cursor=c2Vzc2lvbi0wMjA="

    terminated_session_response:
      session_id: "session-abc123"
      status: "terminated"

      _links:
        conversation:
          href: "/v1/conversations/session-abc123"

  related_contracts:
    - "post_create_session.yml"
    - "get_session.yml"
    - "get_sessions_list.yml"
    - "delete_terminate_session.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition from ADR-0041a"
      author: "Contract Development Team"
