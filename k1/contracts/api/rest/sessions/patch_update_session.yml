patch_update_session:
  name: "PATCH /v1/sessions/{id} - Update Session Contract"
  purpose: "Partial update of session metadata and TTL"
  version: "1.0"
  adr_source: "ADR-0041a (Session CRUD) lines 501-750"
  endpoint: "PATCH /v1/sessions/{session_id}"
  module: "k1/l5_infrastructure/api_gateway/rest/session_api.py"
  capability: "Session Lifecycle Management"

  description: |
    PATCH /v1/sessions/{id} performs partial update of session metadata and TTL.
    Supports JSON Patch (RFC 6902) or simple JSON object merge. Invalidates HTTP
    cache after update.

    Key features:
    - Partial update (only modified fields)
    - Cache invalidation after update
    - <200ms P95 performance
    - Returns updated session details

  http_request:
    method: "PATCH"
    path: "/v1/sessions/{session_id}"

    path_parameters:
      session_id:
        type: "string"
        format: "session-{uuid}"
        description: "Session identifier"

    headers:
      required:
        Authorization:
          type: "string"
          format: "Bearer <jwt_token>"

        Content-Type:
          type: "string"
          value: "application/json"

    body_schema:
      metadata:
        type: "object"
        required: false
        description: "Custom metadata to merge (max 10KB)"
        merge_strategy: "Deep merge with existing metadata"

      ttl_seconds:
        type: "integer"
        required: false
        min: 300
        max: 86400
        description: "New session TTL in seconds"

  http_response:
    success:
      status_code: 200
      description: "OK"

      headers:
        Content-Type:
          type: "string"
          value: "application/json"

      body_schema:
        session_id:
          type: "string"

        user_id:
          type: "string"

        metadata:
          type: "object"
          description: "Updated metadata"

        updated_at:
          type: "string"
          format: "ISO 8601"
          description: "Timestamp of update"

        expires_at:
          type: "string"
          format: "ISO 8601"
          description: "New expiration timestamp (if ttl_seconds updated)"

        _links:
          type: "object"
          schema:
            self:
              type: "object"
              properties:
                href:
                  type: "string"

    errors:
      400:
        error_type: "invalid_input"
        description: "Invalid request body"
        examples:
          - "metadata exceeds 10KB limit"
          - "ttl_seconds out of range"

      401:
        error_type: "unauthorized"
        description: "Missing or invalid JWT"

      403:
        error_type: "forbidden"
        description: "User lacks access to session"

      404:
        error_type: "session_not_found"
        description: "Session ID does not exist"

  implementation:
    workflow:
      - step: 1
        name: "Extract JWT"
        description: "Validate JWT and extract user_id"
        latency: "<2ms"

      - step: 2
        name: "Fetch Session"
        description: "Retrieve existing session"
        validation: "session.user_id == JWT.claims.sub"
        latency: "<80ms"

      - step: 3
        name: "Update Fields"
        description: "Merge metadata and update TTL"

        metadata_update:
          if_provided:
            strategy: "Deep merge"
            example: |
              existing: {"source": "slack", "channel_id": "C123"}
              update: {"user_context": "meeting"}
              result: {"source": "slack", "channel_id": "C123", "user_context": "meeting"}

        ttl_update:
          if_provided:
            action: "expires_at = now + ttl_seconds"

      - step: 4
        name: "Save Session"
        description: "Persist updated session to K1 kernel"
        update_timestamp: true
        latency: "<50ms"

      - step: 5
        name: "Invalidate Cache"
        description: "Delete cached session data"
        cache_keys:
          - "session:{session_id}"
          - "etag:session:{session_id}"
        latency: "<1ms"

      - step: 6
        name: "Build Response"
        description: "Return updated session details"

      - step: 7
        name: "Return Response"
        description: "Return 200 OK"

  performance:
    budgets:
      p50_latency_ms: 100
      p95_latency_ms: 200
      p99_latency_ms: 300
      target: "<200ms P95"

    breakdown:
      jwt_validation_ms: 2
      fetch_session_ms: 80
      metadata_merge_ms: 3
      save_session_ms: 50
      cache_invalidation_ms: 1
      json_serialization_ms: 3
      total_ms: 139

  observability:
    metrics:
      - name: "session_update_latency_ms"
        type: "histogram"
        buckets: [50, 100, 200, 300]
        description: "Session update latency"

      - name: "sessions_updated_total"
        type: "counter"
        labels: ["field_updated"]
        description: "Total session updates"

  examples:
    update_metadata:
      request:
        method: "PATCH"
        path: "/v1/sessions/session-abc123"
        headers:
          Authorization: "Bearer <jwt>"
        body:
          metadata:
            source: "slack_integration"
            channel_id: "C456DEF"
            user_context: "updated context"

      response:
        status: 200
        body:
          session_id: "session-abc123"
          user_id: "user-xyz789"
          metadata:
            source: "slack_integration"
            channel_id: "C456DEF"
            user_context: "updated context"
          updated_at: "2025-10-11T14:40:00Z"
          expires_at: "2025-10-11T15:30:00Z"
          _links:
            self:
              href: "/v1/sessions/session-abc123"

    update_ttl:
      request:
        method: "PATCH"
        path: "/v1/sessions/session-abc123"
        headers:
          Authorization: "Bearer <jwt>"
        body:
          ttl_seconds: 7200

      response:
        status: 200
        body:
          session_id: "session-abc123"
          updated_at: "2025-10-11T14:40:00Z"
          expires_at: "2025-10-11T16:40:00Z"

  related_contracts:
    - "get_session.yml"
    - "post_create_session.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition from ADR-0041a"
      author: "Contract Development Team"
