# RFC 7807 Problem Details - Standardized Error Format
# Part of: ADR-0041d (OpenAPI Spec & RFC 7807 Error Handling)
# Purpose: Consistent error structure across all REST API endpoints
# Research: RFC 7807 (2016), Problem Details for HTTP APIs

version: "1.0"
type: "rest_error_format"
status: "approved"

metadata:
  component: "REST API - RFC 7807 Error Format"
  layer: "API Gateway"
  performance_budget:
    error_response_generation: "<10ms"
  research:
    - "RFC 7807 - Problem Details for HTTP APIs (M. Nottingham, E. Wilde, 2016)"
    - "GitHub API - Problem Details usage"
    - "Stripe API - Error format inspiration"

# RFC 7807 Overview
rfc7807_overview:
  description: "Standard error format for HTTP APIs"

  specification: "RFC 7807 (2016)"
  full_name: "Problem Details for HTTP APIs"
  authors: ["M. Nottingham", "E. Wilde"]

  purpose: "Machine-readable error format with human-readable descriptions"

  benefits:
    - "Consistent error structure across all endpoints"
    - "Machine-readable error types (URL to documentation)"
    - "Human-readable error messages"
    - "Context-specific error details"
    - "Debugging support with trace IDs"

# Problem Details Schema
problem_details_schema:
  description: "RFC 7807 error response structure"

  required_fields:
    type:
      type: "string"
      format: "uri"
      description: "URL to error documentation"
      example: "https://api.k1.com/errors/session-not-found"
      purpose: "Machine-readable error type identifier"

    title:
      type: "string"
      description: "Human-readable error title (short summary)"
      example: "Session Not Found"
      purpose: "Brief description for UI display"

    status:
      type: "integer"
      description: "HTTP status code"
      example: 404
      purpose: "Redundant with HTTP status (useful in logs)"

    detail:
      type: "string"
      description: "Specific error message with context"
      example: "Session 'session-abc123' does not exist or was terminated"
      purpose: "Detailed explanation with request-specific context"

    instance:
      type: "string"
      description: "Request path that caused the error"
      example: "/v1/sessions/session-abc123"
      purpose: "Identify which request triggered error"

  optional_fields:
    trace_id:
      type: "string"
      description: "OpenTelemetry trace ID for server-side debugging"
      example: "trace-xyz789"
      purpose: "Link error to server logs and traces"

    errors:
      type: "array"
      description: "Validation errors (for 400 Bad Request)"
      items: "ValidationError"
      purpose: "List all validation failures"

  json_schema:
    type: "object"
    required: ["type", "title", "status", "detail", "instance"]
    properties:
      type: "string (uri)"
      title: "string"
      status: "integer"
      detail: "string"
      instance: "string"
      trace_id: "string (optional)"
      errors: "array<ValidationError> (optional)"

# Example Error Responses
example_error_responses:
  description: "RFC 7807 error examples for common scenarios"

  session_not_found_404:
    http_status: 404
    response:
      type: "https://api.k1.com/errors/session-not-found"
      title: "Session Not Found"
      status: 404
      detail: "Session 'session-abc123' does not exist or was terminated"
      instance: "/v1/sessions/session-abc123"
      trace_id: "trace-xyz789"
    usage: "GET /v1/sessions/{session_id} when session doesn't exist"

  rate_limit_exceeded_429:
    http_status: 429
    response:
      type: "https://api.k1.com/errors/rate-limit-exceeded"
      title: "Rate Limit Exceeded"
      status: 429
      detail: "Rate limit of 100 requests/minute exceeded. Retry after 2025-01-30T12:05:00Z"
      instance: "/v1/sessions"
      trace_id: "trace-abc456"
    headers:
      Retry-After: "60"
    usage: "Any endpoint when rate limit exceeded"

  invalid_input_400:
    http_status: 400
    response:
      type: "https://api.k1.com/errors/invalid-input"
      title: "Invalid Input"
      status: 400
      detail: "2 validation error(s)"
      instance: "/v1/sessions"
      trace_id: "trace-def789"
      errors:
        - field: "persona"
          message: "persona must be one of [helpful_assistant, coding_expert, travel_advisor]"
        - field: "ttl_seconds"
          message: "ttl_seconds must be between 60 and 86400"
    usage: "POST /v1/sessions with invalid request body"

  unauthorized_401:
    http_status: 401
    response:
      type: "https://api.k1.com/errors/unauthorized"
      title: "Unauthorized"
      status: 401
      detail: "Invalid JWT token: signature verification failed"
      instance: "/v1/sessions"
      trace_id: "trace-ghi012"
    usage: "Any endpoint with invalid/expired JWT"

  forbidden_403:
    http_status: 403
    response:
      type: "https://api.k1.com/errors/forbidden"
      title: "Forbidden"
      status: 403
      detail: "Insufficient permissions. Required role: admin. Current roles: [user]"
      instance: "/v1/admin/sessions"
      trace_id: "trace-jkl345"
    usage: "Admin endpoints without admin role"

  agent_limit_exceeded_409:
    http_status: 409
    response:
      type: "https://api.k1.com/errors/agent-limit-exceeded"
      title: "Agent Limit Exceeded"
      status: 409
      detail: "Maximum 3 agents per session. Currently 3 agents. Terminate an agent before hiring new one."
      instance: "/v1/sessions/session-abc123/agents"
      trace_id: "trace-mno678"
    usage: "POST /v1/sessions/{id}/agents when 3 agents already hired"

  internal_error_500:
    http_status: 500
    response:
      type: "https://api.k1.com/errors/internal-error"
      title: "Internal Server Error"
      status: 500
      detail: "An unexpected error occurred. Please retry or contact support."
      instance: "/v1/sessions"
      trace_id: "trace-pqr901"
    usage: "Any endpoint when unhandled exception occurs"

# Validation Error Structure
validation_error_structure:
  description: "Structure for 400 Bad Request validation errors"

  validation_error_schema:
    type: "object"
    required: ["field", "message"]
    properties:
      field:
        type: "string"
        description: "Field name that failed validation"
        example: "persona"
      message:
        type: "string"
        description: "Validation error message"
        example: "persona must be one of [helpful_assistant, coding_expert, travel_advisor]"

  example_multi_error:
    type: "https://api.k1.com/errors/invalid-input"
    title: "Invalid Input"
    status: 400
    detail: "3 validation error(s)"
    instance: "/v1/sessions"
    trace_id: "trace-stu234"
    errors:
      - field: "persona"
        message: "persona is required"
      - field: "privacy_band"
        message: "privacy_band must be one of [GREEN, AMBER, RED]"
      - field: "ttl_seconds"
        message: "ttl_seconds must be between 60 and 86400"

# Error Type URLs
error_type_urls:
  description: "Error type URLs link to documentation pages"

  url_pattern: "https://api.k1.com/errors/{error-type-slug}"

  documentation_pages:
    session_not_found:
      url: "https://api.k1.com/errors/session-not-found"
      content:
        - "What it means: The requested session doesn't exist or was terminated"
        - "Common causes: Invalid session ID, session expired, session deleted"
        - "How to fix: Verify session ID, create new session if needed"
        - "HTTP status: 404 Not Found"

    rate_limit_exceeded:
      url: "https://api.k1.com/errors/rate-limit-exceeded"
      content:
        - "What it means: Too many requests from your client"
        - "Common causes: Exceeded 100 requests/minute limit"
        - "How to fix: Wait until Retry-After timestamp, implement exponential backoff"
        - "HTTP status: 429 Too Many Requests"

    invalid_input:
      url: "https://api.k1.com/errors/invalid-input"
      content:
        - "What it means: Request body failed validation"
        - "Common causes: Missing required fields, invalid enum values, out-of-range values"
        - "How to fix: Check 'errors' array for specific field validation failures"
        - "HTTP status: 400 Bad Request"

# Content-Type Header
content_type:
  description: "RFC 7807 specifies application/problem+json media type"

  standard_media_type: "application/problem+json"

  k1_implementation: "application/json"

  rationale: "Use application/json for simplicity (clients already parse JSON)"

  headers:
    Content-Type: "application/json"
    Cache-Control: "no-cache, no-store, must-revalidate"

# Client Error Handling
client_error_handling:
  description: "How clients should handle RFC 7807 errors"

  typescript_example: |
    // TypeScript error handling
    try {
      const session = await k1Client.sessions.getSession('session-invalid');
    } catch (error) {
      if (error.status === 404) {
        // Check error type URL
        if (error.type === 'https://api.k1.com/errors/session-not-found') {
          console.error('Session not found:', error.detail);
          // Show user-friendly message
          showMessage('Session not found. Please create a new session.');
        }
      } else if (error.status === 429) {
        // Rate limit - retry after delay
        const retryAfter = error.detail.match(/Retry after (.+)/)[1];
        console.log('Rate limited. Retry after:', retryAfter);
        await sleep(60000);  // Wait 1 minute
        retry();
      } else if (error.status === 400) {
        // Validation errors - show field-specific messages
        error.errors.forEach(err => {
          showFieldError(err.field, err.message);
        });
      }
    }

  python_example: |
    # Python error handling
    try:
        session = k1_client.sessions.get_session('session-invalid')
    except K1APIError as e:
        if e.status == 404:
            if e.type == 'https://api.k1.com/errors/session-not-found':
                print(f'Session not found: {e.detail}')
        elif e.status == 429:
            retry_after = int(e.response.headers['Retry-After'])
            time.sleep(retry_after)
            retry()
        elif e.status == 400:
            for err in e.errors:
                print(f'Validation error on {err["field"]}: {err["message"]}')

# Server-Side Implementation
server_implementation:
  description: "How to generate RFC 7807 responses in K1"

  rust_example: |
    // Rust implementation (k1/api/rest/error_handler.rs)
    use actix_web::{error::ResponseError, HttpResponse};
    use serde::Serialize;

    #[derive(Serialize)]
    pub struct ProblemDetails {
        #[serde(rename = "type")]
        pub problem_type: String,
        pub title: String,
        pub status: u16,
        pub detail: String,
        pub instance: String,
        #[serde(skip_serializing_if = "Option::is_none")]
        pub trace_id: Option<String>,
        #[serde(skip_serializing_if = "Option::is_none")]
        pub errors: Option<Vec<ValidationError>>,
    }

    impl APIError {
        pub fn to_problem_details(&self, instance: &str) -> ProblemDetails {
            match self {
                APIError::SessionNotFound(session_id) => ProblemDetails {
                    problem_type: "https://api.k1.com/errors/session-not-found".to_string(),
                    title: "Session Not Found".to_string(),
                    status: 404,
                    detail: format!("Session '{}' does not exist or was terminated", session_id),
                    instance: instance.to_string(),
                    trace_id: Some(get_current_trace_id()),
                    errors: None,
                },
                // ... other error types
            }
        }
    }

# Production Metrics (6 months)
production_metrics:
