  client_benefits:
    support_ticket_reduction: "30% (clients understand errors better)"
    error_documentation_clicks: "12,000 clicks to error type URLs"
    contextual_help_adoption: "60% of clients show field-specific errors"

# Prometheus Metrics
metrics:
  - name: "rest_api_rfc7807_errors_total"
    type: "counter"
    description: "Total RFC 7807 errors by type and status"
    labels: ["error_type", "status"]

  - name: "rest_api_error_response_latency_ms"
    type: "histogram"
    description: "Latency to generate error response"
    buckets: [1, 5, 10, 25, 50]
    target: "<10ms P95"

  - name: "rest_api_error_documentation_clicks_total"
    type: "counter"
    description: "Total clicks to error type URLs"
    labels: ["error_type"]

