# Prometheus Metrics
metrics:
  - name: "rest_api_errors_by_type_total"
    type: "counter"
    description: "Total errors by error type"
    labels: ["error_type", "status"]

  - name: "rest_api_error_rate_gauge"
    type: "gauge"
    description: "Overall error rate (percentage)"
    target: "<0.5%"
    actual: "0.3%"

  - name: "rest_api_error_documentation_clicks_total"
    type: "counter"
    description: "Clicks to error type documentation URLs"
    labels: ["error_type"]

# Related Contracts
related_contracts:
  - "rfc7807_error_format.yml - Error response structure"
  - "http_status_codes.yml - HTTP status code semantics"
  - "error_handler.yml - ErrorHandler implementation"
