# ErrorHandler - 880-Line Error Conversion to RFC 7807
# Part of: ADR-0041d (OpenAPI Spec & RFC 7807 Error Handling)
# Purpose: Convert internal K1 errors to RFC 7807 Problem Details format
# Research: Rust error handling, actix-web ResponseError trait

version: "1.0"
type: "rest_error_handler"
status: "approved"

metadata:
  component: "REST API - ErrorHandler"
  layer: "API Gateway"
  implementation_size: "880 lines Rust code"
  performance_budget:
    error_response_generation: "<10ms"
  research:
    - "Rust Error Handling - std::error::Error trait"
    - "actix-web ResponseError - HTTP error responses"
    - "RFC 7807 - Problem Details for HTTP APIs"

# ErrorHandler Architecture
error_handler_architecture:
  description: "ErrorHandler converts internal errors to RFC 7807 responses"

  components:
    - component: "APIError enum"
      purpose: "Typed internal errors"
      lines: 150

    - component: "ProblemDetails struct"
      purpose: "RFC 7807 response schema"
      lines: 50

    - component: "ResponseError trait impl"
      purpose: "Convert APIError to HTTP response"
      lines: 600

    - component: "Metrics & logging"
      purpose: "Record error events"
      lines: 80

  total_lines: 880

# APIError Enum Definition
api_error_enum:
  description: "Typed internal errors for K1 REST API"

  enum_definition: |
    #[derive(Debug)]
    pub enum APIError {
        SessionNotFound(String),
        TurnNotFound(String),
        AgentNotFound(String),
        AgentLimitExceeded { current: usize, max: usize },
        RateLimitExceeded { limit: usize, reset_at: i64 },
        InvalidInput(Vec<ValidationError>),
        Unauthorized(String),
        Forbidden(String),
        Conflict(String),
        InternalError(String),
        Timeout(String),
        InvalidCursor(String),
    }

  error_types: 12

  derive_traits: ["Debug"]

# ProblemDetails Struct
problem_details_struct:
  description: "RFC 7807 Problem Details response schema"

  struct_definition: |
    #[derive(Serialize)]
    pub struct ProblemDetails {
        #[serde(rename = "type")]
        pub problem_type: String,
        pub title: String,
        pub status: u16,
        pub detail: String,
        pub instance: String,
        #[serde(skip_serializing_if = "Option::is_none")]
        pub trace_id: Option<String>,
        #[serde(skip_serializing_if = "Option::is_none")]
        pub errors: Option<Vec<ValidationError>>,
    }

  fields:
    problem_type: "URL to error documentation"
    title: "Human-readable error title"
    status: "HTTP status code"
    detail: "Specific error message with context"
    instance: "Request path that caused error"
    trace_id: "OpenTelemetry trace ID (optional)"
    errors: "Validation errors (optional, for 400 responses)"

# ResponseError Trait Implementation
response_error_trait:
  description: "Convert APIError to actix-web HTTP response"

  trait_methods:
    error_response:
      signature: "fn error_response(&self) -> HttpResponse"
      purpose: "Generate HTTP response with RFC 7807 body"
      return_type: "HttpResponse"

    status_code:
      signature: "fn status_code(&self) -> StatusCode"
      purpose: "Return HTTP status code for error"
      return_type: "StatusCode"

  implementation_example: |
    impl ResponseError for APIError {
        fn error_response(&self) -> HttpResponse {
            let (problem, status_code) = match self {
                APIError::SessionNotFound(session_id) => (
                    ProblemDetails {
                        problem_type: "https://api.k1.com/errors/session-not-found".to_string(),
                        title: "Session Not Found".to_string(),
                        status: 404,
                        detail: format!(
                            "Session '{}' does not exist or was terminated",
                            session_id
                        ),
                        instance: format!("/v1/sessions/{}", session_id),
                        trace_id: Self::get_trace_id(),
                        errors: None,
                    },
                    404,
                ),

                APIError::RateLimitExceeded { limit, reset_at } => (
                    ProblemDetails {
                        problem_type: "https://api.k1.com/errors/rate-limit-exceeded".to_string(),
                        title: "Rate Limit Exceeded".to_string(),
                        status: 429,
                        detail: format!(
                            "Rate limit of {} requests/minute exceeded. Retry after {}",
                            limit,
                            chrono::DateTime::from_timestamp(*reset_at, 0)
                                .unwrap()
                                .to_rfc3339()
                        ),
                        instance: "/v1".to_string(),
                        trace_id: Self::get_trace_id(),
                        errors: None,
                    },
                    429,
                ),

                // ... 10 more error types
            };

            // Record metrics
            API_ERRORS_TOTAL
                .with_label_values(&[&problem.problem_type, &problem.status.to_string()])
                .inc();

            // Log error
            log::error!(
                "api_error";
                "type" => &problem.problem_type,
                "status" => problem.status,
                "detail" => &problem.detail,
                "trace_id" => problem.trace_id.as_deref().unwrap_or("none")
            );

            HttpResponse::build(StatusCode::from_u16(status_code).unwrap())
                .json(problem)
        }

        fn status_code(&self) -> StatusCode {
            match self {
                APIError::SessionNotFound(_) | APIError::TurnNotFound(_) | APIError::AgentNotFound(_) => {
                    StatusCode::NOT_FOUND
                }
                APIError::AgentLimitExceeded { .. } | APIError::Conflict(_) => {
                    StatusCode::CONFLICT
                }
                APIError::RateLimitExceeded { .. } => StatusCode::TOO_MANY_REQUESTS,
                APIError::InvalidInput(_) | APIError::InvalidCursor(_) => {
                    StatusCode::BAD_REQUEST
                }
                APIError::Unauthorized(_) => StatusCode::UNAUTHORIZED,
                APIError::Forbidden(_) => StatusCode::FORBIDDEN,
                APIError::InternalError(_) => StatusCode::INTERNAL_SERVER_ERROR,
                APIError::Timeout(_) => StatusCode::GATEWAY_TIMEOUT,
            }
        }
    }

# Error Conversion Logic
error_conversion_logic:
  description: "How to convert each APIError to RFC 7807"

  conversion_steps:
    - step: 1
      action: "Match on APIError variant"
      example: "APIError::SessionNotFound(session_id)"

    - step: 2
      action: "Construct ProblemDetails struct"
      fields:
        - "problem_type: URL to error docs"
        - "title: Human-readable error title"
        - "status: HTTP status code"
        - "detail: Context-specific message (include session_id)"
        - "instance: Request path"
        - "trace_id: Current trace ID from context"

    - step: 3
      action: "Record Prometheus metrics"
      metric: "API_ERRORS_TOTAL counter"

    - step: 4
      action: "Log error to structured logs"
      log_fields: ["type", "status", "detail", "trace_id"]

    - step: 5
      action: "Build HTTP response"
      status_code: "From status field"
      body: "JSON-serialized ProblemDetails"

  performance: "<10ms total (step 1-5)"

# Trace ID Extraction
trace_id_extraction:
  description: "Extract OpenTelemetry trace ID from current context"

  implementation: |
    impl APIError {
        fn get_trace_id() -> Option<String> {
            // Extract from OpenTelemetry context
            use opentelemetry::trace::TraceContextExt;
            let context = opentelemetry::Context::current();
            let span = context.span();
            let span_context = span.span_context();

            if span_context.is_valid() {
                Some(span_context.trace_id().to_string())
            } else {
                // Fallback: generate UUID
                Some(format!("trace-{}", uuid::Uuid::new_v4()))
            }
        }
    }

  fallback: "Generate UUID if OpenTelemetry not available"

# ValidationError Struct
validation_error_struct:
  description: "Structure for 400 Bad Request validation errors"

  struct_definition: |
    #[derive(Serialize, Clone)]
    pub struct ValidationError {
        pub field: String,
        pub message: String,
    }

  usage_example: |
    APIError::InvalidInput(vec![
        ValidationError {
            field: "persona".to_string(),
            message: "persona must be one of [helpful_assistant, coding_expert, travel_advisor]".to_string(),
        },
        ValidationError {
            field: "ttl_seconds".to_string(),
            message: "ttl_seconds must be between 60 and 86400".to_string(),
        },
    ])

# Error Handler Usage in Endpoints
endpoint_usage:
  description: "How to use ErrorHandler in REST API endpoints"

  example_get_session: |
    // GET /v1/sessions/{session_id}
    pub async fn get_session(
        path: web::Path<String>,
        session_manager: web::Data<SessionManager>,
    ) -> Result<HttpResponse, APIError> {
        let session_id = path.into_inner();

        // Fetch session from K1 kernel
        let session = session_manager
            .get_session(&session_id)
            .await
            .map_err(|_| APIError::SessionNotFound(session_id.clone()))?;

        // Success: 200 OK
        Ok(HttpResponse::Ok().json(session))
    }

  example_create_session: |
    // POST /v1/sessions
    pub async fn create_session(
        req: web::Json<CreateSessionRequest>,
        session_manager: web::Data<SessionManager>,
    ) -> Result<HttpResponse, APIError> {
        // Validate request
        req.validate()
            .map_err(|errs| APIError::InvalidInput(errs.into_iter().map(|e| ValidationError {
                field: e.field,
                message: e.message,
            }).collect()))?;

        // Create session
        let session = session_manager
            .create_session(req.into_inner())
            .await
            .map_err(|e| APIError::InternalError(e.to_string()))?;

        // Success: 201 Created
        Ok(HttpResponse::Created()
            .insert_header(("Location", format!("/v1/sessions/{}", session.session_id)))
            .json(session))
    }

  example_hire_agent: |
    // POST /v1/sessions/{session_id}/agents
    pub async fn hire_agent(
        path: web::Path<String>,
        req: web::Json<HireAgentRequest>,
        agent_fabric: web::Data<AgentFabric>,
    ) -> Result<HttpResponse, APIError> {
        let session_id = path.into_inner();

        // Check agent limit
        let current_agents = agent_fabric.count_agents(&session_id).await;
        if current_agents >= 3 {
            return Err(APIError::AgentLimitExceeded {
                current: current_agents,
                max: 3,
            });
        }

        // Hire agent
        let agent = agent_fabric
            .hire_agent(&session_id, req.into_inner())
            .await
            .map_err(|e| APIError::InternalError(e.to_string()))?;

        // Success: 201 Created
        Ok(HttpResponse::Created().json(agent))
    }

# Metrics & Logging
metrics_logging:
  description: "ErrorHandler emits metrics and structured logs"

  prometheus_metrics:
    api_errors_total:
      type: "counter"
      name: "rest_api_errors_total"
      labels: ["error_type", "status"]
      description: "Total API errors by type and status code"
      example: "rest_api_errors_total{error_type='session-not-found', status='404'}"

    error_response_latency:
      type: "histogram"
      name: "rest_api_error_response_latency_ms"
      buckets: [1, 5, 10, 25, 50]
      target: "<10ms P95"

  structured_logging:
    log_level: "ERROR"
    log_format: "JSON"
    fields:
      - "type: Error type URL"
      - "status: HTTP status code"
      - "detail: Error message"
      - "trace_id: Trace ID for correlation"
      - "timestamp: ISO 8601 timestamp"

    example_log: |
      {
        "level": "ERROR",
        "timestamp": "2025-01-30T12:00:00Z",
        "type": "https://api.k1.com/errors/session-not-found",
        "status": 404,
        "detail": "Session 'session-abc123' does not exist or was terminated",
        "trace_id": "trace-xyz789",
        "instance": "/v1/sessions/session-abc123"
      }

# Error Response Examples
error_response_examples:
  description: "Complete HTTP responses for different error types"

  session_not_found:
    request: "GET /v1/sessions/session-invalid"
    response:
      status: 404
      headers:
        Content-Type: "application/json"
        Cache-Control: "no-cache, no-store, must-revalidate"
      body:
        type: "https://api.k1.com/errors/session-not-found"
        title: "Session Not Found"
        status: 404
        detail: "Session 'session-invalid' does not exist or was terminated"
        instance: "/v1/sessions/session-invalid"
        trace_id: "trace-xyz789"

  validation_error:
    request: "POST /v1/sessions"
    request_body:
      persona: "invalid_persona"
    response:
      status: 400
      headers:
        Content-Type: "application/json"
      body:
        type: "https://api.k1.com/errors/invalid-input"
        title: "Invalid Input"
        status: 400
        detail: "1 validation error(s)"
        instance: "/v1/sessions"
        trace_id: "trace-abc123"
        errors:
          - field: "persona"
            message: "persona must be one of [helpful_assistant, coding_expert, travel_advisor]"

  rate_limit:
    request: "POST /v1/sessions"
    response:
      status: 429
      headers:
        Content-Type: "application/json"
        Retry-After: "60"
        X-RateLimit-Limit: "100"
        X-RateLimit-Remaining: "0"
      body:
        type: "https://api.k1.com/errors/rate-limit-exceeded"
        title: "Rate Limit Exceeded"
        status: 429
        detail: "Rate limit of 100 requests/minute exceeded. Retry after 2025-01-30T12:05:00Z"
        instance: "/v1/sessions"
        trace_id: "trace-def456"

