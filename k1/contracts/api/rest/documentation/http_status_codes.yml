# Prometheus Metrics
metrics:
  - name: "rest_api_requests_total"
    type: "counter"
    description: "Total requests by status code"
    labels: ["status", "endpoint"]

  - name: "rest_api_success_rate_gauge"
    type: "gauge"
    description: "Success rate (2xx + 304) percentage"
    target: ">99%"
    actual: "99.7%"

  - name: "rest_api_client_error_rate_gauge"
    type: "gauge"
    description: "Client error rate (4xx) percentage"
    target: "<0.5%"
    actual: "0.29%"

  - name: "rest_api_server_error_rate_gauge"
    type: "gauge"
    description: "Server error rate (5xx) percentage"
    target: "<0.1%"
    actual: "0.014%"

