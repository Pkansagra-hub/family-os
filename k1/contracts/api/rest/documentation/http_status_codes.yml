# HTTP Status Codes - Standard Status Code Usage
# Part of: ADR-0041d (OpenAPI Spec & RFC 7807 Error Handling)
# Purpose: Standard HTTP status codes for REST API responses
# Research: RFC 7231 (HTTP/1.1 Semantics), RFC 6585 (Additional Status Codes)

version: "1.0"
type: "rest_http_status_codes"
status: "approved"

metadata:
  component: "REST API - HTTP Status Codes"
  layer: "API Gateway"
  research:
    - "RFC 7231 - HTTP/1.1 Semantics and Content (R. Fielding, J. Reschke, 2014)"
    - "RFC 6585 - Additional HTTP Status Codes (M. Nottingham, R. Fielding, 2012)"
    - "REST API Design Guidelines - Microsoft, Google, GitHub"

# HTTP Status Code Overview
status_code_overview:
  description: "Standard HTTP status codes used in K1 REST API"

  status_code_ranges:
    - range: "2xx Success"
      description: "Request succeeded"
      codes: [200, 201, 202, 304]

    - range: "4xx Client Error"
      description: "Client error (bad request, auth, not found)"
      codes: [400, 401, 403, 404, 409, 429]

    - range: "5xx Server Error"
      description: "Server error (internal, timeout)"
      codes: [500, 504]

  total_status_codes_used: 10

# 2xx Success Codes
success_codes:
  description: "Success responses (2xx)"

  code_200_ok:
    code: 200
    name: "OK"
    description: "Request succeeded"

    usage:
      - "GET /v1/sessions/{id} - Retrieve session details"
      - "GET /v1/sessions - List sessions"
      - "PATCH /v1/sessions/{id} - Update session metadata"
      - "DELETE /v1/sessions/{id} - Terminate session"
      - "POST /v1/sessions/{id}/turns - Submit turn (sync mode, completed)"

    response_body: "Resource representation (JSON)"

    example:
      request: "GET /v1/sessions/session-abc123"
      status: 200
      body:
        session_id: "session-abc123"
        user_id: "user-xyz789"
        status: "active"

  code_201_created:
    code: 201
    name: "Created"
    description: "Resource created successfully"

    usage:
      - "POST /v1/sessions - Create new session"
      - "POST /v1/sessions/{id}/agents - Hire new agent"
      - "POST /v1/sessions/{id}/memories - Store memory"

    headers:
      Location: "URL to created resource"

    response_body: "Created resource representation (JSON)"

    example:
      request: "POST /v1/sessions"
      status: 201
      headers:
        Location: "/v1/sessions/session-abc123"
      body:
        session_id: "session-abc123"
        status: "active"

  code_202_accepted:
    code: 202
    name: "Accepted"
    description: "Request accepted for asynchronous processing"

    usage:
      - "POST /v1/sessions/{id}/turns - Submit turn (async mode)"

    response_body: "Operation status with turn_id"

    example:
      request: "POST /v1/sessions/session-abc123/turns?mode=async"
      status: 202
      body:
        turn_id: "turn-xyz789"
        status: "processing"
        callback_url: "https://webhook.example.com/turns"

  code_304_not_modified:
    code: 304
    name: "Not Modified"
    description: "Cached response is still valid (ETag match)"

    usage:
      - "GET /v1/sessions/{id} with If-None-Match header"

    headers:
      ETag: "Entity tag (MD5 hash)"
      Cache-Control: "Cache directives"

    response_body: "Empty (client uses cached response)"

    cache_hit_rate: "82% (2.46M of 3M GET requests)"

    example:
      request: "GET /v1/sessions/session-abc123"
      headers:
        If-None-Match: "\"abc123def456\""
      status: 304
      body: null

# 4xx Client Error Codes
client_error_codes:
  description: "Client errors (4xx)"

  code_400_bad_request:
    code: 400
    name: "Bad Request"
    description: "Invalid request syntax or validation failure"

    usage:
      - "POST /v1/sessions - Invalid request body (validation errors)"
      - "GET /v1/sessions?limit=abc - Invalid query parameter"
      - "PATCH /v1/sessions/{id} - Invalid update fields"

    error_type: "https://api.k1.com/errors/invalid-input"

    response_body: "RFC 7807 Problem Details with validation errors"

    example:
      request: "POST /v1/sessions"
      body:
        persona: "invalid_persona"
      status: 400
      error:
        type: "https://api.k1.com/errors/invalid-input"
        title: "Invalid Input"
        status: 400
        detail: "1 validation error(s)"
        errors:
          - field: "persona"
            message: "persona must be one of [helpful_assistant, coding_expert, travel_advisor]"

  code_401_unauthorized:
    code: 401
    name: "Unauthorized"
    description: "Missing or invalid authentication credentials"

    usage:
      - "Any endpoint without Authorization header"
      - "Any endpoint with invalid JWT token"
      - "Any endpoint with expired JWT token"

    headers:
      WWW-Authenticate: "Bearer realm=\"K1 API\""

    error_type: "https://api.k1.com/errors/unauthorized"

    response_body: "RFC 7807 Problem Details"

    example:
      request: "GET /v1/sessions"
      headers: {} # Missing Authorization
      status: 401
      error:
        type: "https://api.k1.com/errors/unauthorized"
        title: "Unauthorized"
        status: 401
        detail: "Missing Authorization header"

  code_403_forbidden:
    code: 403
    name: "Forbidden"
    description: "Valid credentials but insufficient permissions"

    usage:
      - "Admin endpoints without admin role"
      - "Cross-space session access"
      - "Insufficient privacy band"

    error_type: "https://api.k1.com/errors/forbidden"

    response_body: "RFC 7807 Problem Details"

    example:
      request: "GET /v1/admin/sessions"
      jwt_roles: ["user"]
      required_role: "admin"
      status: 403
      error:
        type: "https://api.k1.com/errors/forbidden"
        title: "Forbidden"
        status: 403
        detail: "Insufficient permissions. Required role: admin. Current roles: [user]"

  code_404_not_found:
    code: 404
    name: "Not Found"
    description: "Resource doesn't exist"

    usage:
      - "GET /v1/sessions/{id} - Session not found"
      - "GET /v1/turns/{id} - Turn not found"
      - "DELETE /v1/sessions/{id}/agents/{id} - Agent not found"

    error_types:
      - "https://api.k1.com/errors/session-not-found"
      - "https://api.k1.com/errors/turn-not-found"
      - "https://api.k1.com/errors/agent-not-found"

    response_body: "RFC 7807 Problem Details"

    example:
      request: "GET /v1/sessions/session-invalid"
      status: 404
      error:
        type: "https://api.k1.com/errors/session-not-found"
        title: "Session Not Found"
        status: 404
        detail: "Session 'session-invalid' does not exist or was terminated"

  code_409_conflict:
    code: 409
    name: "Conflict"
    description: "Request conflicts with current resource state"

    usage:
      - "POST /v1/sessions/{id}/agents - Agent limit exceeded (3 max)"
      - "POST /v1/sessions/{id}/turns - Session terminated (can't submit turn)"
      - "DELETE /v1/sessions/{id}/agents/{id} - Agent already fired"

    error_types:
      - "https://api.k1.com/errors/agent-limit-exceeded"
      - "https://api.k1.com/errors/conflict"

    response_body: "RFC 7807 Problem Details"

    example:
      request: "POST /v1/sessions/session-abc123/agents"
      current_agents: 3
      max_agents: 3
      status: 409
      error:
        type: "https://api.k1.com/errors/agent-limit-exceeded"
        title: "Agent Limit Exceeded"
        status: 409
        detail: "Maximum 3 agents per session. Currently 3 agents."

  code_429_too_many_requests:
    code: 429
    name: "Too Many Requests"
    description: "Rate limit exceeded"

    usage:
      - "Any endpoint when 100 requests/minute exceeded"

    headers:
      Retry-After: "Seconds until rate limit resets"
      X-RateLimit-Limit: "100"
      X-RateLimit-Remaining: "0"
      X-RateLimit-Reset: "Unix timestamp"

    error_type: "https://api.k1.com/errors/rate-limit-exceeded"

    response_body: "RFC 7807 Problem Details"

    example:
      request: "POST /v1/sessions"
      status: 429
      headers:
        Retry-After: "60"
        X-RateLimit-Limit: "100"
        X-RateLimit-Remaining: "0"
        X-RateLimit-Reset: "1643548800"
      error:
        type: "https://api.k1.com/errors/rate-limit-exceeded"
        title: "Rate Limit Exceeded"
        status: 429
        detail: "Rate limit of 100 requests/minute exceeded. Retry after 2025-01-30T12:05:00Z"

# 5xx Server Error Codes
server_error_codes:
  description: "Server errors (5xx)"

  code_500_internal_server_error:
    code: 500
    name: "Internal Server Error"
    description: "Unexpected server error"

    usage:
      - "Unhandled exception in API handler"
      - "Database connection failure"
      - "K0 kernel crash"
      - "Memory exhaustion"

    error_type: "https://api.k1.com/errors/internal-error"

    response_body: "RFC 7807 Problem Details with trace_id"

    monitoring: "Alert on spike, investigate trace_id logs"

    example:
      request: "GET /v1/sessions/session-abc123"
      status: 500
      error:
        type: "https://api.k1.com/errors/internal-error"
        title: "Internal Server Error"
        status: 500
        detail: "An unexpected error occurred. Please retry or contact support."
        trace_id: "trace-xyz789"

  code_504_gateway_timeout:
    code: 504
    name: "Gateway Timeout"
    description: "Request timed out (exceeded 30s deadline)"

    usage:
      - "POST /v1/sessions/{id}/turns - Sync turn timeout (>30s)"
      - "Database query timeout"
      - "LLM response timeout"

    error_type: "https://api.k1.com/errors/timeout"

    response_body: "RFC 7807 Problem Details"

    mitigation: "Use async mode for long-running operations"

    example:
      request: "POST /v1/sessions/session-abc123/turns"
      status: 504
      error:
        type: "https://api.k1.com/errors/timeout"
        title: "Gateway Timeout"
        status: 504
        detail: "Request timed out after 30 seconds. Please retry or use async mode."

# Status Code Selection Guidelines
status_code_guidelines:
  description: "How to choose correct HTTP status code"

  success_scenarios:
    - scenario: "Resource retrieved successfully"
      status: 200
      example: "GET /v1/sessions/{id}"

    - scenario: "Resource created successfully"
      status: 201
      example: "POST /v1/sessions"

    - scenario: "Async operation accepted"
      status: 202
      example: "POST /v1/sessions/{id}/turns?mode=async"

    - scenario: "Cached response valid"
      status: 304
      example: "GET /v1/sessions/{id} with If-None-Match"

  client_error_scenarios:
    - scenario: "Validation error"
      status: 400
      error_type: "invalid-input"

    - scenario: "Missing authentication"
      status: 401
      error_type: "unauthorized"

    - scenario: "Insufficient permissions"
      status: 403
      error_type: "forbidden"

    - scenario: "Resource not found"
      status: 404
      error_type: "session-not-found | turn-not-found | agent-not-found"

    - scenario: "State conflict"
      status: 409
      error_type: "agent-limit-exceeded | conflict"

    - scenario: "Rate limit exceeded"
      status: 429
      error_type: "rate-limit-exceeded"

  server_error_scenarios:
    - scenario: "Unhandled exception"
      status: 500
      error_type: "internal-error"

    - scenario: "Request timeout"
      status: 504
      error_type: "timeout"

