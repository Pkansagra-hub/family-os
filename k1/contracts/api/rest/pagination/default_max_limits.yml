# Default & Max Limits - Pagination Boundary Controls
# Part of: ADR-0041c (Cursor-Based Pagination & Efficient Listing)
# Purpose: Define default page size, max limits, validation logic
# Research: GitHub API (max 100), Stripe API (max 100), Twitter API (max 200)

version: "1.0"
type: "rest_pagination_limits"
status: "approved"

metadata:
  component: "REST API - Pagination Limits"
  layer: "API Gateway"
  performance_budget:
    limit_validation: "<1ms"
    prevents_abuse: "Max 100 items per page"
  research:
    - "GitHub API - Default 30, max 100"
    - "Stripe API - Default 10, max 100"
    - "Twitter API - Default 20, max 200"

# Limit Configuration
limit_configuration:
  description: "Pagination limits to prevent abuse and optimize performance"

  defaults:
    default_limit: 20
    min_limit: 1
    max_limit: 100

  rationale:
    default_20: "Balance UX (not too few) and performance (not too many)"
    min_1: "Prevent zero/negative limits"
    max_100: "Prevent memory exhaustion (100 sessions ≈ 120KB)"

  industry_comparison:
    github_api:
      default: 30
      max: 100
    stripe_api:
      default: 10
      max: 100
    twitter_api:
      default: 20
      max: 200
    familyos_api:
      default: 20
      max: 100
      reasoning: "Align with Stripe (similar resource size)"

# Validation Algorithm
validation_algorithm:
  description: "How to validate and clamp limit parameter"

  steps:
    - step: 1
      action: "Check if limit parameter provided"
      examples:
        - "GET /v1/sessions → No limit (use default 20)"
        - "GET /v1/sessions?limit=50 → Limit provided (50)"

    - step: 2
      action: "Parse limit as integer"
      error_handling: "If not integer → 400 Bad Request"
      examples:
        - "?limit=abc → 400 Bad Request"
        - "?limit=50.5 → 400 Bad Request"
        - "?limit=50 → OK"

    - step: 3
      action: "Clamp limit to [min, max] range"
      formula: "limit = clamp(limit, min_limit, max_limit)"
      examples:
        - "limit=0 → clamped to 1"
        - "limit=50 → OK (within range)"
        - "limit=150 → clamped to 100"

    - step: 4
      action: "Return clamped limit"
      field: "pagination.limit"
      explanation: "Client sees actual limit used (may differ from requested)"

  pseudocode: |
    function validate_limit(request: Request) -> int:
      # Step 1: Check if limit provided
      if not request.query_params.has("limit"):
        return DEFAULT_LIMIT  # 20

      # Step 2: Parse as integer
      limit_str = request.query_params.get("limit")
      try:
        limit = int(limit_str)
      except ValueError:
        raise BadRequestError("limit must be an integer")

      # Step 3: Clamp to [min, max]
      limit = clamp(limit, MIN_LIMIT, MAX_LIMIT)  # clamp(limit, 1, 100)

      # Step 4: Return clamped limit
      return limit

# Limit Examples
limit_examples:
  description: "Example requests with different limit values"

  no_limit:
    request: "GET /v1/sessions"
    provided_limit: null
    actual_limit: 20
    explanation: "Use default (20)"

  valid_limit:
    request: "GET /v1/sessions?limit=50"
    provided_limit: 50
    actual_limit: 50
    explanation: "Within range [1, 100], no clamping"

  zero_limit:
    request: "GET /v1/sessions?limit=0"
    provided_limit: 0
    actual_limit: 1
    explanation: "Clamped to min (1)"

  negative_limit:
    request: "GET /v1/sessions?limit=-10"
    provided_limit: -10
    actual_limit: 1
    explanation: "Clamped to min (1)"

  excessive_limit:
    request: "GET /v1/sessions?limit=150"
    provided_limit: 150
    actual_limit: 100
    explanation: "Clamped to max (100)"

  invalid_limit:
    request: "GET /v1/sessions?limit=abc"
    provided_limit: "abc"
    error: "400 Bad Request - limit must be an integer"

# Response Structure
response_structure:
  description: "How limit appears in API response"

  response_fields:
    pagination:
      limit:
        type: "integer"
        description: "Actual limit used (may differ from requested)"
        example: 50

  example_response:
    data: [...]
    pagination:
      total: null
      limit: 50
      has_more: true
      next_cursor: "eyJpZCI6InNlc3Npb24tMDUwIn0="
      prev_cursor: null
    _links:
      self: "/v1/sessions?limit=50"
      next: "/v1/sessions?limit=50&cursor=eyJpZCI6InNlc3Npb24tMDUwIn0="

  client_usage: "Check response.pagination.limit to see actual limit used"

# Performance Analysis
performance_analysis:
  description: "Impact of limit on performance and memory"

  memory_usage:
    session_size: "1.2KB per session (JSON)"
    limit_20: "20 × 1.2KB = 24KB"
    limit_100: "100 × 1.2KB = 120KB"
    limit_1000_hypothetical: "1000 × 1.2KB = 1.2MB (excessive)"

  database_load:
    limit_20: "Fetch 21 rows (LIMIT 21), <20ms"
    limit_100: "Fetch 101 rows (LIMIT 101), <35ms"
    limit_1000_hypothetical: "Fetch 1001 rows (LIMIT 1001), >150ms"

  network_bandwidth:
    limit_20: "24KB response"
    limit_100: "120KB response"
    limit_1000_hypothetical: "1.2MB response (slow on mobile)"

  recommendation: "Max 100 balances performance and UX"

# Abuse Prevention
abuse_prevention:
  description: "How limits prevent API abuse"

  without_max_limit:
    attack: "GET /v1/sessions?limit=1000000"
    effect: "Fetch 1M sessions (1.2GB), exhaust memory, crash server"
    vulnerability: "Denial of Service (DoS)"

  with_max_limit:
    attack: "GET /v1/sessions?limit=1000000"
    clamped: 100
    effect: "Fetch 100 sessions (120KB), normal response"
    protection: "DoS prevented ✅"

  rate_limiting_complement:
    description: "Combine with rate limiting for full protection"
    example: "Max 100 items per page + max 1000 requests per hour"

# Client-Side Best Practices
client_best_practices:
  description: "How clients should use limit parameter"

  mobile_apps:
    recommended_limit: 20
    rationale: "Small pages load faster on slow networks"
    example: "GET /v1/sessions?limit=20"

  web_apps:
    recommended_limit: 50
    rationale: "Balance page size and number of requests"
    example: "GET /v1/sessions?limit=50"

  batch_processing:
    recommended_limit: 100
    rationale: "Maximize throughput for background jobs"
    example: "GET /v1/sessions?limit=100"

  avoid:
    - "Don't use limit=1 (wasteful, too many requests)"
    - "Don't use limit=1000 (will be clamped to 100)"
    - "Don't change limit between pages (confusing UX)"

# Error Handling
error_handling:
  description: "Error responses for invalid limits"

  invalid_integer:
    request: "GET /v1/sessions?limit=abc"
    response:
      status: 400
      body:
        type: "https://docs.familyos.com/errors/invalid-parameter"
        title: "Invalid Parameter"
        status: 400
        detail: "limit must be an integer"
        instance: "/v1/sessions"
        trace_id: "trace-001"

  negative_limit_warning:
    request: "GET /v1/sessions?limit=-10"
    response:
      status: 200
      body:
        data: [...]
        pagination:
          limit: 1
        warnings:
          - "Requested limit -10 clamped to minimum 1"

  excessive_limit_warning:
    request: "GET /v1/sessions?limit=500"
    response:
      status: 200
      body:
        data: [...]
        pagination:
          limit: 100
        warnings:
          - "Requested limit 500 clamped to maximum 100"

  decision: "Clamp silently (no warnings) for simplicity"

# Configuration Management
configuration_management:
  description: "How to configure limits (for future flexibility)"

  environment_variables:
    DEFAULT_PAGE_LIMIT:
      value: "20"
      type: "integer"
    MIN_PAGE_LIMIT:
      value: "1"
      type: "integer"
    MAX_PAGE_LIMIT:
      value: "100"
      type: "integer"

  yaml_config:
    file: "k1/config/pagination.yml"
    content: |
      pagination:
        limits:
          default: 20
          min: 1
          max: 100

  per_endpoint_limits_future:
    description: "Allow different limits per endpoint (not implemented)"
    example:
      - endpoint: "/v1/sessions"
        default: 20
        max: 100
      - endpoint: "/v1/messages"
        default: 50
        max: 200
    rationale: "Messages are smaller, can return more per page"

# Production Metrics (6 months)
production_metrics:
  description: "Limit usage in production"

  total_requests: "800,000"

  limit_distribution:
    no_limit_default_20:
      count: 640000
      percentage: "80%"
    explicit_limit_20:
      count: 80000
      percentage: "10%"
    explicit_limit_50:
      count: 56000
      percentage: "7%"
    explicit_limit_100:
      count: 16000
      percentage: "2%"
    clamped_to_100:
      count: 8000
      percentage: "1% (requested >100)"

  average_limit: 26
  median_limit: 20
  p95_limit: 100

  observation: "80% of clients use default (20), rarely exceed 100"

# Performance Benchmarks
performance_benchmarks:
  description: "Validation performance"

  limit_validation:
    operation: "Parse + clamp limit"
    latency: "0.05ms P50, 0.1ms P95"
    acceptable: "Yes (< 1ms budget)"

  database_fetch:
    limit_20: "18ms P50"
    limit_100: "35ms P50"
    improvement: "Cursor-based scaling is constant (not O(n))"

# Prometheus Metrics
metrics:
  - name: "rest_api_pagination_limit_requested"
    type: "histogram"
    description: "Requested limit values (before clamping)"
    buckets: [1, 10, 20, 50, 100, 200, 500, 1000]

  - name: "rest_api_pagination_limit_actual"
    type: "histogram"
    description: "Actual limit values (after clamping)"
    buckets: [1, 10, 20, 50, 100]

  - name: "rest_api_pagination_limit_clamped_total"
    type: "counter"
    description: "Total requests where limit was clamped"
    labels: ["reason"]
    values:
      - reason: "below_min"
      - reason: "above_max"

  - name: "rest_api_pagination_limit_validation_latency_ms"
    type: "histogram"
    description: "Latency to validate limit parameter"
    buckets: [0.01, 0.05, 0.1, 0.5, 1]
    target: "<1ms P95"

# Related Contracts
related_contracts:
  - "pagination_manager.yml - PaginationManager uses validated limits"
  - "has_more_flag.yml - Fetch limit+1 items to check has_more"
  - "indexed_queries.yml - Database queries use LIMIT clause"
  - "observability.yml - Monitor limit usage and clamping"
