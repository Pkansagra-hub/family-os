  total_requests: "800,000"

  next_cursor_generated:
    count: 480000
    percentage: "60% (has_more = true)"
    latency: "0.3ms P50, 0.5ms P95"

  next_cursor_null:
    count: 320000
    percentage: "40% (last page)"

  prev_cursor_usage:
    count: 24000
    percentage: "3% (clients rarely go back)"
    observation: "Forward-only pagination dominates (infinite scroll)"

  link_following:
    clients_using_links: "720,000 (90%)"
    clients_building_urls: "80,000 (10%)"
    recommendation: "Prefer _links.next over building URLs manually"

# Performance Benchmarks
performance_benchmarks:
  description: "Cursor generation performance"

  encode_cursor:
    operation: "Base64 encode JSON {id: 'session-020'}"
    latency: "0.3ms P50, 0.5ms P95"

  build_url:
    operation: "String concatenation for _links"
    latency: "0.1ms P50, 0.2ms P95"

  total_overhead:
    operation: "Generate cursors + links"
    latency: "0.8ms P50, 1.2ms P95"
    acceptable: "Yes (< 100ms budget)"

# Prometheus Metrics
metrics:
  - name: "rest_api_pagination_next_cursor_generated_total"
    type: "counter"
    description: "Total next_cursor generated (has_more = true)"

  - name: "rest_api_pagination_next_cursor_null_total"
    type: "counter"
    description: "Total next_cursor null (last page)"

  - name: "rest_api_pagination_prev_cursor_usage_total"
    type: "counter"
    description: "Total requests with prev_cursor (going back)"

  - name: "rest_api_pagination_cursor_generation_latency_ms"
    type: "histogram"
    description: "Latency to generate next_cursor + prev_cursor"
    buckets: [0.1, 0.5, 1, 2, 5]
    target: "<1ms P95"

