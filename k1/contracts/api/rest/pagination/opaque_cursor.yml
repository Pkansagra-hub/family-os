# Opaque Cursor Encoding - Cursor-Based Pagination
# Part of: ADR-0041c (Cursor-Based Pagination & Efficient Listing)
# Purpose: Base64-encoded cursor prevents client manipulation
# Research: Facebook Graph API (2010), Stripe API (2015)

version: "1.0"
type: "rest_cursor_encoding"
status: "approved"

metadata:
  component: "REST API - Pagination"
  layer: "API Gateway"
  performance_budget:
    encoding_latency: "<1ms"
    decoding_latency: "<1ms"
  research:
    - "Facebook Graph API cursor-based pagination (2010-present)"
    - "Stripe API pagination with starting_after/ending_before (2015)"
    - "Base64 encoding for opaque tokens (RFC 4648)"

# Cursor Structure
cursor_structure:
  description: "Opaque cursor structure (base64-encoded JSON)"

  internal_format:
    description: "Internal JSON structure (before encoding)"
    schema:
      id: "string (last item ID in page)"
    example: '{"id": "session-020"}'

  encoded_format:
    description: "Base64-encoded cursor (client-facing)"
    encoding: "Base64 standard (RFC 4648)"
    example: "eyJpZCI6InNlc3Npb24tMDIwIn0="
    length: "~32 characters for typical session ID"

# Encoding Process
encoding_process:
  description: "Encode last item ID to opaque cursor"

  steps:
    - step: 1
      action: "Get last item ID from page"
      input: 'session_id = "session-020"'

    - step: 2
      action: "Create cursor JSON"
      code: 'cursor_json = {"id": "session-020"}'

    - step: 3
      action: "Serialize to JSON string"
      result: '{"id":"session-020"}'

    - step: 4
      action: "Base64 encode"
      algorithm: "base64.standard.encode(json_bytes)"
      result: "eyJpZCI6InNlc3Npb24tMDIwIn0="

    - step: 5
      action: "Return opaque cursor"
      output: "eyJpZCI6InNlc3Npb24tMDIwIn0="

  performance:
    p50: "0.3ms"
    p95: "0.8ms"
    p99: "1.2ms"
    target: "<1ms P95"

# Decoding Process
decoding_process:
  description: "Decode opaque cursor to extract item ID"

  steps:
    - step: 1
      action: "Receive cursor from client"
      input: "eyJpZCI6InNlc3Npb24tMDIwIn0="

    - step: 2
      action: "Base64 decode"
      algorithm: "base64.standard.decode(cursor_string)"
      result: '{"id":"session-020"} (bytes)'

    - step: 3
      action: "Parse JSON"
      result: '{"id": "session-020"} (dict)'

    - step: 4
      action: "Extract ID"
      code: 'after_id = cursor_dict["id"]'
      result: "session-020"

    - step: 5
      action: "Return item ID for query"
      output: "session-020"

  performance:
    p50: "0.4ms"
    p95: "0.9ms"
    p99: "1.5ms"
    target: "<1ms P95"

# Security Properties
security_properties:
  description: "Why opaque cursor prevents abuse"

  opacity:
    description: "Client can't decode cursor structure"
    benefit: "Can't manipulate cursor to jump to arbitrary pages"
    example_attack_prevented: "Client can't change cursor from session-020 to session-999 to skip pages"

  validation:
    description: "Server validates cursor structure"
    checks:
      - "Valid Base64 encoding"
      - "Valid JSON structure"
      - "Contains 'id' field"
      - "ID exists in database"
    on_failure: "Return 400 Bad Request with error message"

  no_predictability:
    description: "Client can't predict next cursor"
    benefit: "Must follow _links.next to get next page"
    forces_intended_flow: "Ensures sequential pagination"

# Cursor Validation
cursor_validation:
  description: "Validation rules for cursor decoding"

  validation_steps:
    - rule: "Check Base64 validity"
      invalid_example: "invalid_base64!@#$"
      error: "400 Bad Request - Invalid base64 in cursor"

    - rule: "Check UTF-8 validity"
      invalid_example: "0xFF 0xFE (invalid UTF-8)"
      error: "400 Bad Request - Invalid UTF-8 in cursor"

    - rule: "Check JSON validity"
      invalid_example: '{id: "session-020"} (missing quotes)'
      error: "400 Bad Request - Invalid JSON in cursor"

    - rule: "Check required fields"
      invalid_example: '{"session_id": "session-020"} (wrong field name)'
      error: "400 Bad Request - Missing 'id' field in cursor"

    - rule: "Check ID format"
      valid_pattern: "^[a-z0-9-]+$"
      invalid_example: '{"id": "session-020; DROP TABLE sessions;"}'
      error: "400 Bad Request - Invalid ID format"

# Client-Side Behavior
client_behavior:
  description: "How clients should use opaque cursors"

  correct_usage:
    description: "Follow HATEOAS links"
    example: |
      1. GET /v1/sessions?limit=20
      2. Extract next_cursor from response.pagination.next_cursor
      3. GET /v1/sessions?limit=20&cursor=<next_cursor>
      4. Repeat until has_more = false

  incorrect_usage:
    description: "Don't manipulate cursors"
    examples:
      - "Decode cursor to see structure ❌"
      - "Modify cursor to skip pages ❌"
      - "Store cursors long-term (they may expire) ❌"
      - "Share cursors between users (user-specific) ❌"

  cursor_lifetime:
    description: "Cursors are ephemeral (short-lived)"
    validity: "Valid for pagination session (typically 5 minutes)"
    expiry: "Cursors may become invalid if underlying data deleted"
    retry: "If cursor invalid, re-fetch first page"

# Error Handling
error_handling:
  description: "Handle cursor decoding errors"

  error_scenarios:
    - error: "Invalid Base64"
      http_status: 400
      response:
        type: "https://familyos.dev/errors/invalid-cursor"
        title: "Invalid Cursor"
        status: 400
        detail: "Cursor contains invalid base64 encoding"
        instance: "/v1/sessions?cursor=invalid_base64"

    - error: "Invalid JSON"
      http_status: 400
      response:
        type: "https://familyos.dev/errors/invalid-cursor"
        title: "Invalid Cursor"
        status: 400
        detail: "Cursor JSON structure is malformed"

    - error: "Missing ID field"
      http_status: 400
      response:
        type: "https://familyos.dev/errors/invalid-cursor"
        title: "Invalid Cursor"
        status: 400
        detail: "Cursor missing required 'id' field"

    - error: "Item not found"
      http_status: 404
      response:
        type: "https://familyos.dev/errors/cursor-item-not-found"
        title: "Cursor Item Not Found"
        status: 404
        detail: "Item referenced by cursor no longer exists"

# Production Metrics (6 months)
production_metrics:
  description: "Opaque cursor usage metrics from production"

  total_cursors_encoded: "400,000 (50% of 800K requests used cursor)"
  total_cursors_decoded: "400,000"

  encoding_latency:
    p50: "0.3ms"
    p95: "0.8ms"
    p99: "1.2ms"
    target: "<1ms P95"
    status: "✅ Within budget"

  decoding_latency:
    p50: "0.4ms"
    p95: "0.9ms"
    p99: "1.5ms"
    target: "<1ms P95"
    status: "✅ Within budget"

  cursor_errors:
    invalid_base64: 250
    invalid_json: 80
    missing_id_field: 120
    total: 450
    error_rate: "0.056% (450 / 800,000)"

# Prometheus Metrics
metrics:
  - name: "rest_api_cursor_encode_latency_ms"
    type: "histogram"
    description: "Cursor encoding latency in milliseconds"
    buckets: [0.1, 0.5, 1, 2, 5]
    target_p95: "<1ms"

  - name: "rest_api_cursor_decode_latency_ms"
    type: "histogram"
    description: "Cursor decoding latency in milliseconds"
    buckets: [0.1, 0.5, 1, 2, 5]
    target_p95: "<1ms"

  - name: "rest_api_cursor_errors_total"
    type: "counter"
    description: "Total cursor decoding errors"
    labels:
      error_type: "invalid_base64 | invalid_json | missing_field | item_not_found"

# Related Contracts
related_contracts:
  - "pagination_manager.yml - PaginationManager class implementation"
  - "has_more_flag.yml - has_more flag calculation"
  - "next_prev_cursors.yml - next_cursor/prev_cursor generation"
