# No Total Count - Trade-off Analysis
# Part of: ADR-0041c (Cursor-Based Pagination & Efficient Listing)
# Purpose: Explain why pagination.total = null (no COUNT(*) queries)
# Research: Facebook API (no count), Stripe API (no count), Twitter API (no count)

version: "1.0"
type: "rest_pagination_no_total"
status: "approved"

metadata:
  component: "REST API - No Total Count"
  layer: "API Gateway"
  performance_budget:
    count_query_avoided: ">1000ms saved per request"
    pagination_latency: "<100ms P95"
  research:
    - "Facebook Graph API - No count for billions of posts (2010)"
    - "Stripe API - No count for scalability (2015)"
    - "Twitter API - No count, cursor-only (2013)"

# Problem: COUNT(*) Queries Don't Scale
count_problem:
  description: "Why COUNT(*) queries are expensive at scale"

  count_query:
    sql: "SELECT COUNT(*) FROM sessions WHERE user_id = ?"
    algorithm: "Scan all rows matching filter (even with index)"
    complexity: "O(n) where n = total matching rows"
    latency_examples:
      1000_rows: "50ms"
      10000_rows: "250ms"
      100000_rows: "800ms"
      1000000_rows: "1,200ms ❌"

  problem_summary: "COUNT(*) becomes bottleneck (>1s latency for 1M rows)"

  additional_issues:
    - "Locks table/index during count (blocks concurrent writes)"
    - "Doesn't scale with dataset growth (linear time complexity)"
    - "Client rarely needs exact count (approximate sufficient)"
    - "Total can change during pagination (stale count)"

# Decision: pagination.total = null
decision:
  description: "Always return pagination.total = null"

  rationale:
    - "Avoid expensive COUNT(*) queries (save 1+ second per request)"
    - "Maintain constant <100ms P95 latency regardless of dataset size"
    - "Mobile-first UX: infinite scroll doesn't need total count"
    - "has_more flag sufficient for most use cases"

  response_structure:
    data: [...]
    pagination:
      total: null
      limit: 20
      has_more: true
      next_cursor: "eyJpZCI6InNlc3Npb24tMDIwIn0="
      prev_cursor: null

  client_interpretation: "Client should use has_more flag, not total"

# Trade-off Analysis
trade_off_analysis:
  description: "What we lose vs what we gain"

  lost_capabilities:
    - "Can't show 'Page X of Y' UI"
    - "Can't show 'Showing 1-20 of 147 sessions'"
    - "Can't show progress bar (e.g., '67% complete')"
    - "Can't calculate total pages"

  gained_capabilities:
    - "Constant O(log n) latency (no O(n) COUNT(*) scan)"
    - "Scales to millions/billions of items (Facebook, Twitter scale)"
    - "No database locking (COUNT(*) doesn't block writes)"
    - "Consistent performance regardless of dataset size"

  verdict: "Gained capabilities >> lost capabilities (mobile-first, scalable)"

# Alternative UX Patterns (Without Total Count)
alternative_ux:
  description: "How to build good UX without total count"

  infinite_scroll:
    description: "Load more items as user scrolls (dominant mobile pattern)"
    benefit: "No need for total count or page numbers"
    example: "Instagram, Twitter, Facebook feed"
    implementation: |
      while (has_more) {
        const response = await fetch(`/v1/sessions?cursor=${cursor}`);
        appendItems(response.data);
        cursor = response.pagination.next_cursor;
        has_more = response.pagination.has_more;
      }

  load_more_button:
    description: "Show 'Load More' button instead of page numbers"
    benefit: "Explicit user action, no total count needed"
    example: "GitHub issues, Slack messages"
    implementation: |
      <button onClick={loadMore} disabled={!has_more}>
        Load More
      </button>

  show_current_page:
    description: "Show 'Showing 1-20 of many' instead of total"
    benefit: "Gives context without exact count"
    example: "Google search results ('About 1,000,000 results')"
    implementation: |
      Showing {start}-{end} of many sessions

  disable_next_button:
    description: "Disable 'Next' button when has_more = false"
    benefit: "Visual indicator of last page"
    implementation: |
      <button disabled={!has_more}>Next</button>

# When Total Count IS Acceptable
acceptable_use_cases:
  description: "Rare cases where COUNT(*) is acceptable"

  small_datasets:
    condition: "Dataset < 1000 rows"
    count_latency: "<50ms (acceptable)"
    example: "User's own sessions (typically <100)"
    recommendation: "Still use has_more (consistency across endpoints)"

  admin_dashboards:
    condition: "Low-traffic, high-privilege users"
    count_latency: "1000ms (acceptable for admins)"
    example: "Admin views all sessions (not user-facing)"
    recommendation: "Separate admin endpoint /v1/admin/sessions/count"

  cached_counts:
    condition: "Count updated daily (not real-time)"
    count_latency: "0ms (cached)"
    example: "Dashboard shows 'Total sessions: ~1.2M' (updated nightly)"
    recommendation: "Background job updates cached count"

  small_filtered_queries:
    condition: "Filter reduces results to <1000 rows"
    count_latency: "<50ms (acceptable)"
    example: "WHERE status = 'active' (only 500 active sessions)"
    recommendation: "Use has_more (avoid special-casing)"

# Alternatives to Total Count
alternatives:
  description: "Alternatives to exact total count"

  approximate_count:
    description: "Show approximate count (e.g., '~1.2M sessions')"
    sql: "SELECT estimated_rows FROM sqlite_stat1 WHERE tbl = 'sessions'"
    latency: "<1ms (cached statistics)"
    accuracy: "±10% (sufficient for display)"
    example: "Google search ('About 1,000,000 results')"

  range_count:
    description: "Show range instead of exact count"
    examples:
      - "1-20 of 100+"
      - "1-20 of 1000+"
      - "1-20 of many"
    benefit: "No COUNT(*) needed"

  incremental_count:
    description: "Count only first N pages (e.g., first 1000 items)"
    sql: "SELECT COUNT(*) FROM (SELECT 1 FROM sessions LIMIT 1000)"
    latency: "<100ms (count up to 1000 rows, then stop)"
    display: "Showing 1-20 of 1000+ sessions"
    benefit: "Bounded COUNT(*) latency"

  cached_count:
    description: "Background job updates count hourly"
    latency: "0ms (no query during pagination)"
    staleness: "Up to 1 hour old"
    acceptable_for: "Analytics dashboards, reports"

# Performance Comparison
performance_comparison:
  description: "Pagination latency with vs without COUNT(*)"

  dataset: "1,000,000 sessions"

  with_count:
    sql: |
      -- Two queries per page
      SELECT COUNT(*) FROM sessions WHERE user_id = ?;
      SELECT * FROM sessions WHERE user_id = ? AND id > ? LIMIT 21;
    latency:
      count_query: "1,200ms"
      data_query: "18ms"
      total: "1,218ms ❌"
    acceptable: "No (>100ms budget)"

  without_count:
    sql: |
      -- One query per page
      SELECT * FROM sessions WHERE user_id = ? AND id > ? LIMIT 21;
    latency:
      data_query: "18ms"
      total: "18ms ✅"
    acceptable: "Yes (<100ms budget)"

  improvement: "67× faster (1218ms → 18ms)"

# Client-Side Behavior
client_behavior:
  description: "How clients should adapt to no total count"

  dont_assume_total:
    bad: |
      // ❌ Bad: Assume total exists
      const totalPages = Math.ceil(response.pagination.total / response.pagination.limit);
    good: |
      // ✅ Good: Use has_more flag
      if (response.pagination.has_more) {
        showLoadMoreButton();
      }

  dont_show_page_numbers:
    bad: |
      // ❌ Bad: Show page numbers (requires total)
      <button>1</button> <button>2</button> ... <button>10</button>
    good: |
      // ✅ Good: Show prev/next buttons
      <button disabled={!prev_cursor}>Previous</button>
      <button disabled={!has_more}>Next</button>

  show_current_range:
    bad: |
      // ❌ Bad: Show 'Page 5 of 10'
      <div>Page {currentPage} of {totalPages}</div>
    good: |
      // ✅ Good: Show 'Showing 1-20'
      <div>Showing {start}-{end}</div>

# Edge Cases
edge_cases:
  description: "Edge cases for no total count"

  empty_result:
    response:
      data: []
      pagination:
        total: null
        has_more: false
    client_display: "No sessions found"

  single_page_result:
    response:
      data: [...]  # 7 items
      pagination:
        total: null
        has_more: false
    client_display: "Showing 1-7 sessions"

  large_dataset:
    response:
      data: [...]  # 20 items
      pagination:
        total: null
        has_more: true
    client_display: "Showing 1-20 of many sessions"

# Production Metrics (6 months)
production_metrics:
  description: "Impact of no total count in production"

  total_requests: "800,000"

  count_queries_avoided: "800,000"
  time_saved: "800,000 × 1200ms = 960,000s = 267 hours"
  database_load_reduced: "800,000 × O(n) scans avoided"

  client_complaints: 0
  observation: "No client complaints about missing total count (mobile-first UX)"

  client_adaptation:
    infinite_scroll: "720,000 requests (90%)"
    load_more_button: "80,000 requests (10%)"
    page_numbers_requested: "0 (no one needs it)"

  recommendation: "Keep pagination.total = null (proven success)"

# Future Consideration: Optional Total Count
future_consideration:
  description: "Allow opt-in total count for specific use cases"

  query_parameter:
    request: "GET /v1/sessions?limit=20&include_total=true"
    response:
      data: [...]
      pagination:
        total: 147
        limit: 20
        has_more: true

  implementation:
    condition: "if include_total query param"
    sql: "SELECT COUNT(*) FROM sessions WHERE user_id = ?"
    latency: "+1200ms (acceptable for opt-in)"
    warning: "Add X-Warning header: 'include_total adds 1200ms latency'"

  decision: "Not implemented (no demand, avoid complexity)"

# Prometheus Metrics
metrics:
  - name: "rest_api_pagination_count_queries_avoided_total"
    type: "counter"
    description: "Total COUNT(*) queries avoided (saved 1200ms each)"

  - name: "rest_api_pagination_time_saved_ms"
    type: "counter"
    description: "Total time saved by avoiding COUNT(*) queries"
    calculation: "count_queries_avoided_total × 1200ms"

  - name: "rest_api_pagination_total_field_checked_total"
    type: "counter"
    description: "Total times clients accessed pagination.total (should be 0)"
    labels: ["field_value"]
    values:
      - field_value: "null"

# Related Contracts
related_contracts:
  - "has_more_flag.yml - Alternative to total count"
  - "infinite_scrolling.yml - UX pattern without total count"
  - "pagination_manager.yml - PaginationManager sets total = null"
  - "indexed_queries.yml - Avoid COUNT(*) full table scans"
  - "observability.yml - Monitor time saved by avoiding COUNT(*)"
