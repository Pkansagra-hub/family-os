# has_more Flag - Efficient Pagination Without COUNT(*)
# Part of: ADR-0041c (Cursor-Based Pagination & Efficient Listing)
# Purpose: Determine if more items exist without expensive COUNT(*) query
# Research: Facebook Graph API (2010), Stripe API (2015)

version: "1.0"
type: "rest_pagination_has_more"
status: "approved"

metadata:
  component: "REST API - Pagination has_more Flag"
  layer: "API Gateway"
  performance_budget:
    has_more_calculation: "<1ms"
    avoids_count_query: ">1000ms saved"
  research:
    - "Facebook Graph API - No total count for billions of posts"
    - "Stripe API - has_more flag instead of total pages"
    - "Martin Fowler (2015) - Pagination Patterns"

# has_more Flag Purpose
has_more_purpose:
  description: "Indicate if more items available without COUNT(*) query"

  problem: "COUNT(*) queries don't scale"
  example_slow_query:
    sql: "SELECT COUNT(*) FROM sessions WHERE user_id = ?"
    rows: "1,000,000"
    latency: "1,200ms ❌ (full table scan)"

  solution: "Fetch limit + 1 items"
  example_fast_query:
    sql: "SELECT * FROM sessions WHERE user_id = ? ORDER BY created_at DESC LIMIT 21"
    logic: "If 21 items returned (when limit = 20) → has_more = true"
    latency: "15ms ✅ (index scan)"

  performance_improvement: "80× faster (1200ms → 15ms)"

# Calculation Algorithm
calculation_algorithm:
  description: "How to calculate has_more flag efficiently"

  steps:
    - step: 1
      action: "Fetch limit + 1 items from database"
      example: "Client requests limit=20 → Fetch 21 items"
      rationale: "Extra item tells us if more exist"

    - step: 2
      action: "Count fetched items"
      example: "items.len() = 21"

    - step: 3
      action: "Compare with limit"
      logic: "has_more = (items.len() > limit)"
      example: "21 > 20 → has_more = true"

    - step: 4
      action: "Remove extra item (if has_more)"
      logic: "if has_more: data.pop()"
      result: "Return exactly limit items to client"
      example: "Return 20 items, keep 21st in memory to calculate has_more"

    - step: 5
      action: "Return has_more in response"
      response_field: "pagination.has_more = true"

  performance: "<1ms overhead (in-memory list operation)"

# Example Scenarios
example_scenarios:
  description: "has_more flag calculation examples"

  scenario_1_more_items:
    request: "GET /v1/sessions?limit=20"
    database_query: "SELECT * FROM sessions WHERE user_id = ? LIMIT 21"
    fetched_items: 21
    calculation: "21 > 20 → has_more = true"
    returned_items: 20
    next_cursor: "eyJpZCI6InNlc3Npb24tMDIwIn0="
    interpretation: "More items available, client can fetch next page"

  scenario_2_last_page_full:
    request: "GET /v1/sessions?limit=20&cursor=<cursor>"
    database_query: "SELECT * FROM sessions WHERE user_id = ? AND id > ? LIMIT 21"
    fetched_items: 20
    calculation: "20 == 20 → has_more = false"
    returned_items: 20
    next_cursor: null
    interpretation: "Last page (exactly limit items, no more after)"

  scenario_3_last_page_partial:
    request: "GET /v1/sessions?limit=20&cursor=<cursor>"
    database_query: "SELECT * FROM sessions WHERE user_id = ? AND id > ? LIMIT 21"
    fetched_items: 7
    calculation: "7 < 20 → has_more = false"
    returned_items: 7
    next_cursor: null
    interpretation: "Last page (partial, 7 items remaining)"

  scenario_4_empty_page:
    request: "GET /v1/sessions?limit=20&cursor=<invalid>"
    database_query: "SELECT * FROM sessions WHERE user_id = ? AND id > ? LIMIT 21"
    fetched_items: 0
    calculation: "0 < 20 → has_more = false"
    returned_items: 0
    next_cursor: null
    interpretation: "No items (cursor beyond last item or no items match)"

# Trade-offs
trade_offs:
  description: "Trade-offs of has_more flag vs total count"

  has_more_flag_benefits:
    - "80× faster (no COUNT(*) query)"
    - "Scales to millions/billions of items"
    - "Consistent performance regardless of dataset size"
    - "No database lock contention from COUNT(*)"

  has_more_flag_limitations:
    - "Can't show 'Page X of Y' UI"
    - "Can't show progress bar (e.g., '67% complete')"
    - "Client doesn't know total items or pages"

  acceptable_for:
    - "Mobile infinite scroll (most common use case)"
    - "Web apps with 'Load More' button"
    - "Feed-style UIs (e.g., social media, activity logs)"

  not_acceptable_for:
    - "Admin dashboards requiring 'Showing 1-20 of 147 sessions'"
    - "Reports with pagination controls (Page 1, 2, 3, ... 10)"
    - "UIs requiring total count display"

  recommendation: "Use has_more flag (mobile-first, scales better)"

# Client-Side UX Patterns
client_ux_patterns:
  description: "How clients should use has_more flag"

  infinite_scroll:
    description: "Load more items as user scrolls"
    implementation: |
      // Pseudo-code
      let cursor = null;
      while (has_more) {
        const response = await fetch(`/v1/sessions?limit=20&cursor=${cursor}`);
        appendItems(response.data);
        cursor = response.pagination.next_cursor;
        has_more = response.pagination.has_more;
      }
    benefit: "Seamless UX without page numbers"

  load_more_button:
    description: "Show 'Load More' button when has_more = true"
    implementation: |
      if (has_more) {
        showButton("Load More");
      } else {
        showMessage("No more items");
      }
    benefit: "Explicit user action for next page"

  disable_next_button:
    description: "Disable 'Next' button when has_more = false"
    implementation: |
      <button disabled={!has_more}>Next Page</button>
    benefit: "Visual indicator of last page"

# Performance Analysis
performance_analysis:
  description: "has_more flag performance vs COUNT(*) query"

  dataset_size: "1,000,000 sessions"

  count_query_performance:
    sql: "SELECT COUNT(*) FROM sessions WHERE user_id = ?"
    latency: "1,200ms"
    explanation: "Full table scan (or index scan of 1M rows)"
    database_load: "High (locks table/index)"

  has_more_flag_performance:
    sql: "SELECT * FROM sessions WHERE user_id = ? ORDER BY created_at DESC LIMIT 21"
    latency: "15ms"
    explanation: "Index scan of 21 rows only"
    database_load: "Low (no locking)"

  improvement: "80× faster (1200ms → 15ms)"

  extra_row_overhead:
    fetched_rows: 21
    returned_rows: 20
    wasted_bandwidth: "~2KB (1 session object)"
    acceptable: "Yes (negligible compared to 1200ms saved)"

# Database Query Optimization
database_optimization:
  description: "Optimize queries for has_more calculation"

  index_requirements:
    - "Primary key index on id column"
    - "Composite index on (user_id, created_at) for filtered queries"
    - "Ensure ORDER BY columns are indexed"

  query_pattern:
    sql: "SELECT * FROM sessions WHERE user_id = ? AND id > ? ORDER BY created_at DESC LIMIT 21"
    index_used: "id primary key index"
    scan_type: "Index range scan (O(log n) lookup + 21 rows)"
    performance: "<25ms P95"

  avoid:
    sql: "SELECT * FROM sessions WHERE user_id = ? OFFSET 1000 LIMIT 21"
    problem: "O(n) scan of 1000 rows before returning 21"
    performance: ">1000ms"

# Production Metrics (6 months)
production_metrics:
  description: "has_more flag usage in production"

  total_pagination_requests: "800,000"

  has_more_distribution:
    has_more_true: 480000
    has_more_false: 320000
    percentage_true: "60% (not last page)"
    percentage_false: "40% (last page)"

  performance_impact:
    count_query_saved: "800,000 × 1200ms = 960,000 seconds = 267 hours"
    has_more_overhead: "800,000 × 1ms = 800 seconds = 13 minutes"
    net_savings: "266 hours 47 minutes ✅"

  client_behavior:
    infinite_scroll_usage: "720,000 requests (90%)"
    load_more_button_usage: "80,000 requests (10%)"
    observation: "Infinite scroll is dominant pattern (mobile-first)"

# Error Scenarios
error_scenarios:
  description: "Handle edge cases for has_more calculation"

  empty_result:
    fetched_items: 0
    has_more: false
    next_cursor: null
    client_action: "Show 'No items found' message"

  exactly_limit_items:
    fetched_items: 20
    has_more: false
    next_cursor: null
    ambiguity: "Could be last page OR more items exist (unlikely)"
    resolution: "Fetch limit + 1 (21) to disambiguate"

  concurrent_writes:
    scenario: "Items added/deleted during pagination"
    effect: "has_more may become stale"
    mitigation: "Cursor-based pagination is consistent (no skipped items)"

# Prometheus Metrics
metrics:
  - name: "rest_api_pagination_has_more_true_total"
    type: "counter"
    description: "Total pages with has_more = true"

  - name: "rest_api_pagination_has_more_false_total"
    type: "counter"
    description: "Total pages with has_more = false (last page)"

  - name: "rest_api_pagination_has_more_calculation_latency_ms"
    type: "histogram"
    description: "Latency to calculate has_more flag (should be <1ms)"
    buckets: [0.1, 0.5, 1, 2, 5]
    target: "<1ms P95"

# Related Contracts
related_contracts:
  - "pagination_manager.yml - PaginationManager implementation"
  - "next_prev_cursors.yml - Cursor generation based on has_more"
  - "no_total_count.yml - Trade-off analysis"
  - "infinite_scrolling.yml - Client-side UX patterns"
