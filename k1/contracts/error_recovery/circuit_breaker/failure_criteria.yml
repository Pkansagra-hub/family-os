# Circuit Breaker Failure Criteria - Failure Detection & Classification
# Purpose: Define what counts as a failure, how failures are detected, and failure classification
# Source ADR: ADR-0009 & ADR-0009a (Circuit Breaker Pattern & FSM Implementation)
# Layer: Layer 2 - Orchestration (Error Recovery)
#
# Research Citations:
#   - Netflix Hystrix Failure Detection (2011) - Exception types, timeout thresholds, custom predicates
#   - Martin Fowler Circuit Breaker (2014) - Failure classification and recovery strategies

---

# SECTION 1: FAILURE DETECTION CRITERIA

failure_detection:
  description: "What counts as a failure for circuit breaker tracking"

  failure_type_1_exceptions:
    name: "Exception-Based Failures"
    description: "Exception raised during service call"

    exception_types:
      asyncio_timeout_error:
        - "asyncio.TimeoutError"
        - "Description: Call exceeded timeout_s deadline"
        - "Example: Tool call takes 6s, timeout is 5s → TimeoutError raised"
        - "Counted as: Failure"

      aiohttp_client_error:
        - "aiohttp.ClientError"
        - "Description: Network-level error from HTTP client"
        - "Sub-types: ClientConnectorError, ClientSSLError"
        - "Counted as: Failure"

      connection_error:
        - "ConnectionError"
        - "Description: Socket-level connection error"
        - "Reasons: Connection refused, Connection reset"
        - "Counted as: Failure"

      payload_error:
        - "requests.TimeoutError / aiohttp.ClientPayloadError"
        - "Description: Request-level timeout or payload error"
        - "Counted as: Failure"

      application_error:
        - "ValueError / TypeError / RuntimeError"
        - "Description: Application-level exceptions"
        - "Counted as: Failure"

      http_5xx:
        - "HTTP Status Code 5xx (500, 502, 503, 504)"
        - "Description: Server error responses"
        - "Examples: 500 crashed, 502 proxy error, 503 overloaded, 504 timeout"
        - "Counted as: Failure"

      http_429:
        - "HTTP Status Code 429 (optional)"
        - "Description: Rate limiting (service says slow down)"
        - "Config: May be treated as failure or success (configurable)"
        - "Rationale: 429 = transient, service will recover"
        - "Counted as: Failure (by default in K1)"

    implementation: |
      async def call(self, func, *args, **kwargs):
          try:
              result = await asyncio.wait_for(
                  func(*args, **kwargs),
                  timeout=self.config.slow_call_threshold_ms / 1000
              )
              return result
          except (asyncio.TimeoutError, aiohttp.ClientError, ConnectionError, Exception) as e:
              # All exceptions count as failures
              await self._record_failure(e, latency_ms)
              raise

  failure_type_2_timeouts:
    name: "Timeout-Based Failures"
    description: "Service call exceeded slow_call_threshold_ms"

    mechanism: |
      latency_ms = (end_time - start_time) * 1000
      if latency_ms > slow_call_threshold_ms:
          counted_as = "Failure"  # Slow call = failure

    thresholds_by_service:
      tool_runner: "5000ms (5s) - API calls should be fast"
      model_hub_local: "1000ms (1s) - Local LLM should be <500ms"
      model_hub_remote: "10000ms (10s) - Remote LLM, higher latency acceptable"
      k0_bridge: "100ms - WAL writes should be <10ms"
      mcp_gateway: "3000ms (3s) - Tool call budget"
      streaming_engine: "5000ms (5s) - Stream should start within 5s"

    rationale: |
      Slow calls degrade user experience (TTFT, E2E latency budgets).
      Should be treated as failures and counted toward circuit opening.
      Alternative: Use timeout mechanism to enforce deadlines (asyncio.wait_for).

    example_scenario:
      - "Tool call starts at T=0, completes at T=5.2s"
      - "slow_call_threshold_ms = 5000"
      - "latency_ms = 5200 > 5000 → Counted as failure"
      - "failure_count incremented"

  failure_type_3_slow_call_combined:
    name: "Timeout + Exception-Based Failures (Combined)"
    description: "Call times out AND exception is raised"

    mechanism: |
      asyncio.wait_for(func, timeout=timeout_s) raises asyncio.TimeoutError
      This is caught, recorded as failure_type="timeout", failure_count incremented

    example_scenario:
      - "Tool call starts at T=0"
      - "timeout_s = 5s"
      - "Service takes 6s to respond (slow service)"
      - "asyncio.wait_for raises TimeoutError at T=5s"
      - "Exception caught, recorded as failure_type='timeout'"
      - "failure_count incremented"

    note: "Timeout exception is the PRIMARY failure mechanism (not latency check)"

  failure_type_4_custom_predicate:
    name: "Custom Failure Predicates (Optional)"
    description: "Application-specific failure detection logic"

    examples:
      - example_1_llm_empty_response:
          scenario: "LLM returns empty or None response"
          predicate: |
            def is_failure(result):
              if result is None or result.strip() == "":
                return True  # Failure
              return False
          use_case: "Detect hallucination or LLM error without exception"

      - example_2_tool_error_payload:
          scenario: "Tool returns error object instead of result"
          predicate: |
            def is_failure(result):
              if isinstance(result, dict) and 'error' in result:
                return True  # Error payload = failure
              return False
          use_case: "Tool API returns structured error response"

      - example_3_missing_required_fields:
          scenario: "API response missing critical fields"
          predicate: |
            def is_failure(result):
              if isinstance(result, dict):
                required_fields = ['id', 'status', 'timestamp']
                if not all(field in result for field in required_fields):
                  return True  # Missing fields = failure
              return False
          use_case: "Validate API response structure"

    implementation: |
      async def call(self, func, *args, **kwargs):
          try:
              result = await asyncio.wait_for(func(*args, **kwargs), timeout=timeout_s)

              # Check custom predicate
              if self.config.custom_predicate and self.config.custom_predicate(result):
                await self._record_failure(CustomFailureError("Custom predicate"), latency_ms)
                raise CustomFailureError("Response validation failed")

              return result
          except Exception as e:
              await self._record_failure(e, latency_ms)
              raise

    configuration: |
      # In circuit_breaker_config
      custom_predicate: callable = None  # Optional custom function

---

# SECTION 2: SUCCESS CRITERIA

success_criteria:
  description: "What counts as a successful call"

  conditions_all_required:
    - "No exception raised"
    - "Service call completed before timeout_s"
    - "Call latency <= slow_call_threshold_ms"
    - "HTTP status code 2xx or 3xx (for HTTP services)"
    - "Custom predicate returns False (if defined)"

  logic: |
    success = (
      no_exception AND
      not_timed_out AND
      latency <= slow_call_threshold AND
      (http_status in [2xx, 3xx] OR not_http_service) AND
      (custom_predicate(result) == False OR not_defined)
    )

  example_success:
    - "Tool API call completes in 2.5s → success"
    - "Local LLM inference completes in 150ms → success"
    - "K0 WAL write completes in 8ms → success"
    - "API returns HTTP 200 with valid JSON → success"

  example_failure:
    - "Tool API call takes 5.2s (> 5s threshold) → failure"
    - "Local LLM crashes (exception raised) → failure"
    - "API returns HTTP 503 → failure"
    - "Response missing required fields (custom predicate) → failure"

---

# SECTION 3: FAILURE CLASSIFICATION

failure_classification:
  description: "Categorize failures for recovery strategy selection"

  classification_1_transient_failures:
    name: "TRANSIENT"
    description: "Temporary failures, likely to resolve with retry"

    http_status_codes:
      status_429:
        - "429 (Rate Limiting)"
        - "Example: OpenAI API rate limit, will recover in <1s"
      status_503:
        - "503 (Service Unavailable)"
        - "Example: Load balancer overloaded, auto-scaling in progress"
      status_504:
        - "504 (Gateway Timeout)"
        - "Example: Proxy timeout, service recovering"

    exceptions:
      timeout_error:
        - "asyncio.TimeoutError"
        - "Example: Network packet loss, route flapping"
      connection_error:
        - "ConnectionError / aiohttp.ClientError"
        - "Example: Temporary network partition, will heal"
      socket_timeout:
        - "socket.timeout"
        - "Example: Slow network response, transient"

    recovery_strategy: "Retry with exponential backoff (5 retries, max 3.1s)"

    rationale: |
      Transient failures are temporary and usually resolve within seconds.
      Retry logic gives service time to recover (auto-scaling, failover, etc.).
      Should not trigger circuit open immediately.

    example_scenario:
      - "API timeout (network latency spike)"
      - "Retries: 1, 2, 3, 4 → all timeout"
      - "Retry 5 succeeds → success"
      - "Request completes successfully"

  classification_2_permanent_failures:
    name: "PERMANENT"
    description: "Failures that won't resolve with retry"

    http_status_codes:
      status_400:
        - "400 (Bad Request)"
        - "Example: Invalid parameter, client error (not service error)"
      status_401:
        - "401 (Unauthorized)"
        - "Example: API key expired or invalid"
      status_403:
        - "403 (Forbidden)"
        - "Example: Permission denied, not authorized for this resource"
      status_404:
        - "404 (Not Found)"
        - "Example: Resource doesn't exist, won't appear on retry"

    exceptions:
      value_error:
        - "ValueError / TypeError"
        - "Example: Invalid argument to function"
      attribute_error:
        - "AttributeError"
        - "Example: Accessing non-existent attribute"
      application_error:
        - "Custom ApplicationError"
        - "Example: Business logic error (invalid state, constraint violation)"

    recovery_strategy: "Rollback immediately (don't retry, wastes time)"

    rationale: |
      Permanent failures are due to client error or permanent state.
      Retrying won't help, will just waste resources.
      Should trigger circuit open immediately or skip compensation.

    example_scenario:
      - "API call with invalid parameters → HTTP 400"
      - "No retry (permanent error)"
      - "Saga compensation triggered immediately"

  classification_3_ambiguous_failures:
    name: "AMBIGUOUS"
    description: "Failures where recovery is unclear (depends on idempotency)"

    http_status_codes:
      status_500:
        - "500 (Internal Server Error)"
        - "Example: Server crashed or database error (might be transient or permanent)"
      status_502:
        - "502 (Bad Gateway)"
        - "Example: Proxy error (could be transient or permanent)"

    decision_logic: |
      if is_idempotent(operation):
        strategy = "RETRY_FORWARD"  # Safe to retry
      else:
        strategy = "ROLLBACK_BACKWARD"  # Risky to retry, might double-execute

    rationale: |
      500 errors might be transient (temporary database downtime) or permanent (logic bug).
      If operation is idempotent (safe to execute multiple times), retry.
      If operation is NOT idempotent (unsafe to retry), rollback immediately.

    example_scenario_idempotent:
      - "Operation: GET /user/123 (read-only, idempotent)"
      - "Server returns 500 (temporary database error)"
      - "Safe to retry → RETRY_FORWARD"
      - "Request succeeds on retry"

    example_scenario_not_idempotent:
      - "Operation: POST /payment (charge credit card, NOT idempotent)"
      - "Server returns 500 (database transaction rolled back)"
      - "Unsafe to retry (might charge twice)"
      - "Must ROLLBACK_BACKWARD immediately"

---

# SECTION 4: FAILURE DETECTION LOGIC

detection_logic:
  description: "Algorithm for detecting and classifying failures"

  pseudocode: |
    async def call(func, *args, **kwargs):
      start_time = time.time()

      try:
        # Execute function with timeout
        result = await asyncio.wait_for(
          func(*args, **kwargs),
          timeout=slow_call_threshold_ms / 1000
        )

        # Check custom predicate (if defined)
        if custom_predicate and custom_predicate(result):
          await _record_failure(CustomFailureError(...))
          raise CustomFailureError(...)

        # Success: record and return
        await _record_success(latency_ms)
        return result

      except asyncio.TimeoutError as e:
        latency_ms = (time.time() - start_time) * 1000

        # Timeout = TRANSIENT failure
        await _record_failure(e, latency_ms, failure_type="timeout")
        await _classify_failure("TRANSIENT")
        raise

      except (aiohttp.ClientError, ConnectionError) as e:
        latency_ms = (time.time() - start_time) * 1000

        # Network error = TRANSIENT failure
        await _record_failure(e, latency_ms, failure_type="network")
        await _classify_failure("TRANSIENT")
        raise

      except HTTPError as e:
        latency_ms = (time.time() - start_time) * 1000

        # Classify based on HTTP status code
        if e.status_code in [429, 503, 504]:
          await _classify_failure("TRANSIENT")
        elif e.status_code in [400, 401, 403, 404]:
          await _classify_failure("PERMANENT")
        elif e.status_code in [500, 502]:
          await _classify_failure("AMBIGUOUS")  # Check idempotency

        await _record_failure(e, latency_ms, failure_type="http_error")
        raise

      except Exception as e:
        latency_ms = (time.time() - start_time) * 1000

        # Unknown exception = PERMANENT (application error)
        await _classify_failure("PERMANENT")
        await _record_failure(e, latency_ms, failure_type="exception")
        raise

---

# SECTION 5: PERFORMANCE BUDGETS

performance:
  exception_detection: "<0.1ms (check exception type)"
  timeout_detection: "<0.1ms (compare elapsed time)"
  custom_predicate_execution: "<1ms (application-specific)"
  total_failure_detection: "<1ms (all checks)"
  verdict: "✅ Negligible overhead"

---

# SECTION 6: INTEGRATION WITH RECOVERY STRATEGIES

recovery_integration:
  description: "How failure classification drives recovery strategy"

  transient_failure_recovery:
    strategy: "Retry Forward (ADR-0008b)"
    implementation: |
      if classification == "TRANSIENT":
        # Retry with exponential backoff
        for attempt in range(1, 6):
          sleep_ms = 100 * (2 ** (attempt - 1))  # 100, 200, 400, 800, 1600ms
          try:
            result = await call(func, *args, **kwargs)
            return result  # Success
          except Exception:
            if attempt == 5:
              raise  # All retries exhausted
            await asyncio.sleep(sleep_ms / 1000)

    example: "API timeout → retry 5× → succeeds on retry"

  permanent_failure_recovery:
    strategy: "Rollback Backward (ADR-0008b)"
    implementation: |
      if classification == "PERMANENT":
        # Don't retry, immediately rollback
        await saga_coordinator.rollback(saga_id)

    example: "Invalid parameter (400) → fail immediately → start compensation"

  ambiguous_failure_recovery:
    strategy: "Idempotency Check (ADR-0008a)"
    implementation: |
      if classification == "AMBIGUOUS":
        if is_idempotent(operation):
          # Safe to retry
          result = await retry_with_backoff(func, *args, **kwargs)
        else:
          # Unsafe to retry, rollback
          await saga_coordinator.rollback(saga_id)

    example_idempotent: "Server error (500) on read-only GET → retry (idempotent)"
    example_not_idempotent: "Server error (500) on POST /payment → rollback (not idempotent)"

---

# SECTION 7: TESTING STRATEGY (WARD Framework)

testing:

  test_1_exception_detection:
    description: "Verify exceptions are detected as failures"
    implementation: |
      @test("circuit breaker detects TimeoutError as failure")
      async def _():
          circuit = CircuitBreaker("test", config)

          async def timeout_func():
              await asyncio.sleep(10)  # Will timeout

          with raises(asyncio.TimeoutError):
              await circuit.call(timeout_func)

          assert circuit.failure_count == 1

      @test("circuit breaker detects ConnectionError as failure")
      async def _():
          circuit = CircuitBreaker("test", config)

          async def connection_error_func():
              raise ConnectionError("Connection refused")

          with raises(ConnectionError):
              await circuit.call(connection_error_func)

          assert circuit.failure_count == 1

  test_2_timeout_detection:
    description: "Verify slow calls are detected as failures"
    implementation: |
      @test("circuit breaker detects slow call as failure")
      async def _():
          config = CircuitBreakerConfig(slow_call_threshold_ms=1000)
          circuit = CircuitBreaker("test", config)

          async def slow_func():
              await asyncio.sleep(0.5)  # 500ms
              return "OK"

          # Call completes successfully
          result = await circuit.call(slow_func)
          assert result == "OK"
          assert circuit.failure_count == 0  # No failure

          async def very_slow_func():
              await asyncio.sleep(1.5)  # 1500ms > 1000ms threshold
              return "OK"

          # Call times out
          with raises(asyncio.TimeoutError):
              await circuit.call(very_slow_func)

          assert circuit.failure_count == 1  # Failure

  test_3_custom_predicate:
    description: "Verify custom predicates work"
    implementation: |
      @test("circuit breaker uses custom predicate")
      async def _():
          def custom_pred(result):
              return result is None  # None = failure

          config = CircuitBreakerConfig(custom_predicate=custom_pred)
          circuit = CircuitBreaker("test", config)

          async def returns_none():
              return None

          with raises(CustomFailureError):
              await circuit.call(returns_none)

          assert circuit.failure_count == 1

  test_4_failure_classification:
    description: "Verify failures are classified correctly"
    implementation: |
      @test("transient failures are classified as TRANSIENT")
      async def _():
          circuit = CircuitBreaker("test", config)

          failure = TimeoutError()
          classification = circuit._classify_failure(failure)

          assert classification == "TRANSIENT"

      @test("permanent failures are classified as PERMANENT")
      async def _():
          circuit = CircuitBreaker("test", config)

          failure = ValueError("Invalid argument")
          classification = circuit._classify_failure(failure)

          assert classification == "PERMANENT"

