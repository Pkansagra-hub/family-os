# Circuit Breaker 3-State FSM - CLOSED → OPEN → HALF_OPEN State Machine
# Purpose: Define circuit breaker finite state machine for cascading failure prevention
# Source ADR: ADR-0009 & ADR-0009a (Circuit Breaker Pattern & FSM Implementation)
# Layer: Layer 2 - Orchestration (Error Recovery)
#
# Research Citations:
#   - Release It! Pattern (Nygard 2007) - 3-state FSM for fail-fast and automatic recovery
#   - Netflix Hystrix (2011) - Production-grade circuit breaker with state transitions
#   - Martin Fowler (2014) - Canonical circuit breaker pattern definition

---

# SECTION 1: 3-STATE FINITE STATE MACHINE

circuit_breaker_fsm:
  description: "Circuit breaker prevents cascading failures via 3-state FSM"

  states:
    closed:
      name: "CLOSED"
      description: "Normal operation - all requests pass through to service"
      behavior: "Accept requests, track failures"
      latency: "<service latency + 0.1ms circuit overhead"
      rejection: "None (accept all requests)"

      entry_condition: |
        - success_count >= success_threshold (from HALF_OPEN)
        - OR system startup (initial state)

      transitions:
        - event: "success"
          condition: "No action (stay in CLOSED)"
          action: "Reset failure_count = 0, last_failure_time = None"
          next_state: "CLOSED"

        - event: "failure"
          condition: "failure_count < failure_threshold OR outside time_window"
          action: "Increment failure_count, update last_failure_time"
          next_state: "CLOSED"

        - event: "failure_threshold_reached"
          condition: "failure_count >= failure_threshold within time_window_ms"
          action: "Set opened_at = now(), log warning, emit metric"
          next_state: "OPEN"

      metrics_recorded:
        - circuit_breaker_calls_total{service, result=success}
        - circuit_breaker_latency_ms{service, state=CLOSED}
        - circuit_breaker_state_gauge{service} = 0

    open:
      name: "OPEN"
      description: "Failing - all requests rejected immediately (fail-fast mode)"
      behavior: "Reject requests, invoke fallback strategy"
      latency: "<10ms (fallback invocation only, no service call)"
      rejection: "All requests rejected, fallback invoked"

      entry_condition: |
        - failure_count >= failure_threshold (from CLOSED)
        - OR failure detected (from HALF_OPEN)

      transitions:
        - event: "request_arrives"
          condition: "now() < opened_at + timeout_duration_ms"
          action: "Reject request, invoke fallback, increment rejection counter"
          next_state: "OPEN"

        - event: "timeout_elapsed"
          condition: "now() >= opened_at + timeout_duration_ms"
          action: "Transition to HALF_OPEN, allow next request through, reset counters"
          next_state: "HALF_OPEN"

      metrics_recorded:
        - circuit_breaker_state_gauge{service} = 1
        - circuit_breaker_calls_total{service, result=rejected}
        - circuit_breaker_fallbacks_total{service, fallback_strategy}

      example_duration:
        - "timeout_duration_ms = 30000 (30s)"
        - "Request arrives at T=0s → OPEN"
        - "Requests at T=1s, 2s, 5s, 10s → all rejected (fail-fast)"
        - "At T=30s → transition to HALF_OPEN"

    half_open:
      name: "HALF_OPEN"
      description: "Testing - allow limited requests to test service recovery"
      behavior: "Allow 1 probe request through, reject others"
      latency: "<service latency + 0.1ms circuit overhead (probe call)"
      rejection: "All but 1 request rejected (concurrency limit = 1)"

      entry_condition: |
        - timeout_duration_ms elapsed from OPEN state
        - System attempts to probe service health

      transitions:
        - event: "probe_success"
          condition: "success_count >= success_threshold"
          action: "Reset all counters, transition to CLOSED, log info"
          next_state: "CLOSED"

        - event: "probe_failure"
          condition: "Any failure in HALF_OPEN state"
          action: "Set opened_at = now(), transition to OPEN, log warning"
          next_state: "OPEN"

        - event: "concurrent_request"
          condition: "More than 1 request arrives in HALF_OPEN"
          action: "First request allowed through (probe), others rejected (fail-fast)"
          next_state: "HALF_OPEN"

      metrics_recorded:
        - circuit_breaker_state_gauge{service} = 2
        - circuit_breaker_calls_total{service, result=success|failure}
        - circuit_breaker_latency_ms{service, state=HALF_OPEN}

      example_duration:
        - "Circuit transitions to HALF_OPEN at T=30s"
        - "Probe request issued at T=30.001s"
        - "If success → immediately transition to CLOSED (no wait)"
        - "If failure → back to OPEN, wait another 30s"

---

# SECTION 2: STATE TRANSITION RULES MATRIX

state_transitions:
  description: "Complete transition matrix with conditions and actions"

  transition_table:
    - from_state: "CLOSED"
      event: "success"
      condition: "Service call succeeds"
      action: "failure_count = 0, last_failure_time = None"
      to_state: "CLOSED"
      example: "10 successful tool calls → stay CLOSED"

    - from_state: "CLOSED"
      event: "failure"
      condition: "Service call fails, but failure_count < threshold"
      action: "failure_count++, last_failure_time = now()"
      to_state: "CLOSED"
      example: "1st API call fails → failure_count=1, stay CLOSED"

    - from_state: "CLOSED"
      event: "failure_threshold_reached"
      condition: "failure_count >= failure_threshold within time_window_ms"
      action: "opened_at = now(), log warning, emit metric"
      to_state: "OPEN"
      example: "5th API call fails within 60s window → Circuit OPENS"

    - from_state: "CLOSED"
      event: "failure_window_reset"
      condition: "time since last_failure_time > time_window_ms"
      action: "failure_count = 0 (reset window)"
      to_state: "CLOSED"
      example: "Last failure 61s ago, new failure → failure_count=1 (reset)"

    - from_state: "OPEN"
      event: "request_arrives_too_early"
      condition: "now() < opened_at + timeout_duration_ms"
      action: "Reject request, invoke fallback, increment rejection counter"
      to_state: "OPEN"
      example: "Circuit opened at T=0, request at T=10s → reject (20s remaining)"

    - from_state: "OPEN"
      event: "timeout_elapsed"
      condition: "now() >= opened_at + timeout_duration_ms"
      action: "Transition to HALF_OPEN, reset success_count=0, failure_count=0"
      to_state: "HALF_OPEN"
      example: "Circuit opened at T=0, at T=30s → transition to HALF_OPEN"

    - from_state: "HALF_OPEN"
      event: "probe_success"
      condition: "Service responds successfully"
      action: "success_count++, check if success_count >= success_threshold"
      to_state: "HALF_OPEN or CLOSED"
      example: "1st probe succeeds, success_threshold=1 → transition to CLOSED"

    - from_state: "HALF_OPEN"
      event: "probe_failure"
      condition: "Service fails during probe"
      action: "opened_at = now(), revert to OPEN, log warning"
      to_state: "OPEN"
      example: "Probe request fails → back to OPEN, wait another 30s"

    - from_state: "HALF_OPEN"
      event: "concurrent_request"
      condition: "More than 1 request arrives simultaneously"
      action: "Allow first request (probe), reject others (fail-fast)"
      to_state: "HALF_OPEN"
      example: "3 requests arrive at T=30s, 1 allowed, 2 rejected"

---

# SECTION 3: FAILURE DETECTION CRITERIA

failure_detection:
  description: "What counts as a failure for circuit breaker tracking"

  failure_types:
    exception:
      description: "Exception raised during service call"
      examples:
        - "asyncio.TimeoutError (call exceeded timeout_s)"
        - "aiohttp.ClientError (network error)"
        - "ConnectionError (socket error)"
        - "HTTP 5xx status code (server error)"
        - "Custom application exception"
      counted_as: "Failure (increment failure_count)"
      latency_impact: "Variable (depends on exception type)"

    timeout:
      description: "Service call exceeded timeout deadline"
      threshold: "slow_call_threshold_ms"
      examples:
        - "Tool API call takes 6s, threshold is 5s → counted as failure"
        - "LLM inference takes 1.5s, threshold is 1s → counted as failure"
        - "K0 WAL write takes 150ms, threshold is 100ms → counted as failure"
      rationale: "Slow calls degrade UX, should fail-fast"
      counted_as: "Failure (increment failure_count)"
      latency_impact: "exactly timeout_ms (awaitables aborted)"

    slow_call:
      description: "Service call completed but exceeded latency threshold"
      threshold: "slow_call_threshold_ms"
      examples:
        - "Tool API call: 5s (threshold), actual: 5.2s → slow"
        - "LLM inference: 1s (threshold), actual: 1.5s → slow"
        - "K0 WAL write: 100ms (threshold), actual: 120ms → slow"
      counted_as: "Failure (increment failure_count)"
      latency_impact: "actual service latency (recorded in histogram)"

    custom_predicate:
      description: "Application-specific failure detection (optional)"
      examples:
        - "LLM response is empty or None"
        - "Tool result contains error payload"
        - "API response missing required fields"
      implementation: |
        def custom_failure_check(result) -> bool:
          if result is None:
            return True  # Failure
          if isinstance(result, dict) and 'error' in result:
            return True  # Failure
          return False  # Success
      counted_as: "Failure (if predicate returns True)"
      latency_impact: "None (check occurs after response received)"

  success_criteria:
    - "No exception raised"
    - "Service call completed within timeout_s"
    - "Call latency <= slow_call_threshold_ms"
    - "HTTP status code 2xx or 3xx (for HTTP services)"
    - "Custom predicate returns False (if defined)"

---

# SECTION 4: CONCURRENCY & THREAD SAFETY

concurrency_handling:
  description: "How circuit breaker handles concurrent requests"

  thread_safety:
    mechanism: "asyncio.Lock() for state transitions"
    purpose: "Prevent race conditions when multiple requests check/update state"

    scenario_1_concurrent_failures:
      description: |
        10 concurrent tool calls all fail simultaneously
        - All 10 check failure_count (currently 4)
        - All 10 fail at same time (within microseconds)
        - Need to atomically update failure_count to 5 and transition to OPEN

      solution: |
        async with self._lock:
          # Only 1 request enters this block at a time
          self.failure_count += 1
          if self.failure_count >= self.config.failure_threshold:
            self._transition_to_open()

      result: "Only 1 request actually increments counter and opens circuit"

    scenario_2_half_open_concurrency:
      description: |
        3 requests arrive at same time while circuit is HALF_OPEN
        - Need to allow only 1 probe request through
        - Other 2 should be rejected immediately

      solution: |
        async with self._lock:
          if self.state == CircuitState.HALF_OPEN:
            if self.success_count == 0 and self.failure_count == 0:
              # First request allowed (probe)
              return True
            else:
              # Subsequent requests rejected
              return False

      result: "First request probes, other 2 rejected (fail-fast)"

    lock_scope:
      operations_inside_lock:
        - "State check"
        - "Failure count update"
        - "Success count update"
        - "State transition"

      operations_outside_lock:
        - "Actual service call (can take seconds)"
        - "Fallback invocation (can take milliseconds)"
        - "Latency observation (logging/metrics)"

    rationale: "Minimize lock time to prevent contention"

---

# SECTION 5: CANONICAL VALUES

canonical_values:
  # Circuit breaker states (numeric values for Prometheus)
  states:
    closed: 0
    open: 1
    half_open: 2

  # Failure detection thresholds (ADR-0009a)
  failure_thresholds:
    tool_runner: 5
    model_hub_local: 3
    model_hub_remote: 5
    k0_bridge: 3
    mcp_gateway: 5
    streaming_engine: 3

  # Timeout durations (ADR-0009b)
  timeout_durations_ms:
    tool_runner: 30000
    model_hub_local: 10000
    model_hub_remote: 60000
    k0_bridge: 5000
    mcp_gateway: 30000
    streaming_engine: 10000

  # Success thresholds (HALF_OPEN state)
  success_thresholds:
    all_services: 1  # Or 2 for remote services

  # Slow call thresholds (ADR-0009b)
  slow_call_thresholds_ms:
    tool_runner: 5000
    model_hub_local: 1000
    model_hub_remote: 10000
    k0_bridge: 100
    mcp_gateway: 3000
    streaming_engine: 5000

  # Time windows for failure tracking (ADR-0009a)
  time_windows_ms:
    tool_runner: 60000
    model_hub_local: 30000
    model_hub_remote: 120000
    k0_bridge: 30000
    mcp_gateway: 60000
    streaming_engine: 30000

---

# SECTION 6: ERROR HANDLING & EDGE CASES

edge_cases:
  case_1_clock_skew:
    description: "System clock goes backwards (NTP adjustment)"
    scenario: |
      - opened_at = 1000000000
      - now() = 1000000100
      - NTP adjustment: now() = 999999900 (clock skew -200ms)
      - Condition: now() >= opened_at + timeout_duration_ms evaluates incorrectly

    prevention: "Use monotonic clock (time.monotonic()) instead of wall clock"
    implementation: |
      import time
      opened_at_mono = time.monotonic()
      # Later:
      now_mono = time.monotonic()
      elapsed = now_mono - opened_at_mono
      if elapsed >= timeout_duration_ms / 1000:
        transition_to_half_open()

  case_2_rapid_state_changes:
    description: "Circuit transitions rapidly (CLOSED → OPEN → HALF_OPEN → CLOSED)"
    scenario: |
      - T=0s: 5 failures → Circuit OPENS
      - T=5s: Still in OPEN state
      - T=30s: Transitions to HALF_OPEN
      - T=30.1s: Probe succeeds → Transitions to CLOSED
      - T=30.2s: New failure → Transitions to OPEN
      - Total transitions in 1s: 2 (HALF_OPEN → CLOSED → OPEN)

    handling: "Emit metric for each transition, log state changes"
    monitoring: |
      If transition rate > 10 transitions/5min → flapping circuit
      Action: Alert operators (ADR-0009c)

  case_3_fallback_failure:
    description: "Fallback itself fails when circuit is OPEN"
    scenario: |
      - Circuit OPEN, cached_result fallback invoked
      - Redis cache unavailable (connection error)
      - Fallback raises exception

    handling: "Fallback exceptions should not reopen circuit (fallback is escape path)"
    implementation: |
      try:
        result = await self._invoke_fallback()
      except Exception as e:
        logger.error("fallback_failed", error=str(e))
        # Return None or raise instead of re-recording failure
        raise FallbackUnavailableError(str(e))

  case_4_circuit_stuck_open:
    description: "Circuit remains OPEN for hours (service recovered but circuit didn't)"
    scenario: |
      - Service was down, circuit opened at T=0
      - Service recovers at T=60s (within timeout)
      - But no new requests arrive (no one calls service)
      - At T=3600s (1 hour): Circuit still OPEN

    prevention: "Use background health check or active probing"
    implementation: |
      # Option 1: Background active probe
      async def background_probe():
        while True:
          await asyncio.sleep(timeout_duration_ms)
          if self.state == CircuitState.OPEN:
            # Actively probe service
            result = await self._attempt_probe()
            if result.success:
              self._transition_to_half_open()

      # Option 2: Timeout on OPEN state (max 2x timeout_duration_ms)
      if now() - opened_at > 2 * timeout_duration_ms:
        # Force transition to HALF_OPEN after 2x timeout
        self._transition_to_half_open()

---

# SECTION 7: ADR CROSS-REFERENCES

adr_references:
  - "ADR-0009: Circuit Breaker Pattern (main pattern definition)"
  - "ADR-0009a: Circuit Breaker FSM Implementation (FSM design)"
  - "ADR-0009b: Per-Service Circuit Configuration (threshold tuning)"
  - "ADR-0009c: Circuit Breaker Metrics & Observability (monitoring)"
  - "ADR-0008: Saga Pattern (circuit breaker prevents compensation retry storms)"
  - "ADR-0008b: Forward Recovery vs Backward Recovery (retry strategy integration)"

