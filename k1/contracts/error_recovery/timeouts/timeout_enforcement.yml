# Section 7: Timeout Enforcement - Level 4: Session Timeout
# ==========================================================

level_4_session_timeout_enforcement:
  description: |
    Session lifetime timeout cleanup.

  implementation: |
    class SessionManager:
        """Session manager with timeout cleanup"""

        async def create_session(
            self,
            user_id: str,
            timeout_ms: int = 600000
        ) -> Session:
            """Create session with timeout"""
            session = Session(
                session_id=str(uuid.uuid4()),
                user_id=user_id,
                created_at=time.time(),
                expires_at=time.time() + (timeout_ms / 1000)
            )

            # Schedule cleanup
            asyncio.create_task(
                self._cleanup_session_after_timeout(session, timeout_ms)
            )

            return session

        async def _cleanup_session_after_timeout(
            self,
            session: Session,
            timeout_ms: int
        ):
            """Clean up session after timeout"""
            try:
                # Wait for timeout
                await asyncio.sleep(timeout_ms / 1000)

                logger.info(
                    "session_timeout_cleanup_start",
                    session_id=session.session_id,
                    user_id=session.user_id
                )

                # Abort all active sagas
                for saga_id in session.active_sagas:
                    try:
                        await self.abort_saga(saga_id)
                    except Exception as e:
                        logger.error(
                            "saga_abort_failed",
                            saga_id=saga_id,
                            error=str(e)
                        )

                # Delete session
                await self.delete_session(session.session_id)

                logger.info(
                    "session_timeout_cleanup_complete",
                    session_id=session.session_id,
                    sagas_aborted=len(session.active_sagas)
                )

            except Exception as e:
                logger.error(
                    "session_cleanup_error",
                    session_id=session.session_id,
                    error=str(e)
                )

