# Section 8: Timeout Context Manager
# ===================================

timeout_context_manager:
  description: |
    Context manager for scoped timeout tracking.

  implementation: |
    @contextmanager
    def timeout_scope(
        timeout_ms: int,
        operation_name: str,
        trace_id: str
    ):
        """Context manager for timeout-scoped operations"""
        start_time = time.time()

        try:
            yield
        finally:
            elapsed_ms = (time.time() - start_time) * 1000

            if elapsed_ms > timeout_ms:
                logger.warning(
                    "operation_exceeded_timeout",
                    operation=operation_name,
                    timeout_ms=timeout_ms,
                    actual_ms=elapsed_ms,
                    trace_id=trace_id
                )
            else:
                logger.debug(
                    "operation_within_timeout",
                    operation=operation_name,
                    timeout_ms=timeout_ms,
                    actual_ms=elapsed_ms,
                    trace_id=trace_id
                )

  usage: |
    with timeout_scope(
        timeout_ms=30000,
        operation_name="tool_execution",
        trace_id=trace_id
    ):
        # Execute tool
        result = await tool_runner.run_tool(step)

---

# Section 9: Cancellation & Cleanup
# ==================================

cancellation_and_cleanup:
  description: |
    Proper cleanup when timeout cancels a task.

  cancellation_handling: |
    async def safe_cleanup_on_timeout(coro, timeout_ms):
        """Execute coroutine with safe cancellation cleanup"""
        task = asyncio.create_task(coro)

        try:
            result = await asyncio.wait_for(task, timeout=timeout_ms/1000)
            return result

        except asyncio.TimeoutError:
            # Cancel the task
            task.cancel()

            try:
                # Wait for cancellation to complete
                await task
            except asyncio.CancelledError:
                logger.debug("Task cancelled due to timeout")

            raise TimeoutError(f"Operation exceeded {timeout_ms}ms")

  cleanup_best_practices:
    - "Always await cancelled tasks to allow cleanup"
    - "Use try/finally to guarantee cleanup"
    - "Log cancellation for debugging"
    - "Don't suppress CancelledError unless necessary"

