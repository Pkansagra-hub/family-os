# Timeout Enforcement - Timeout Injection & Cancellation
# ========================================================
#
# **Purpose:** Enforce timeouts using asyncio primitives and implement timeout wrapper patterns
#
# **Scope:** All async operations (tool calls, compensations, sagas, sessions)
#
# **Research:** Timeout patterns (Nygard 2007), asyncio timeout mechanisms
#
# **ADR References:** ADR-0008d (Timeout & Deadlock Handling), ADR-0008 (Saga Pattern)
#
# **Performance Budget:** Timeout overhead <0.1ms per operation

---

# Section 1: Timeout Enforcement Mechanism
# =========================================

timeout_enforcement_overview:
  description: |
    Timeout enforcement uses Python's asyncio.wait_for() to enforce
    wall-clock time limits on async operations.

    Any async operation exceeding timeout_ms will:
    1. Be cancelled
    2. Raise asyncio.TimeoutError
    3. Be caught and converted to application-specific error
    4. Trigger appropriate recovery (retry, compensation, abort)

  design_principles:
    principle_1_wall_clock_time: "Timeout is wall-clock time, not operation time"
    principle_2_deterministic: "Timeout is deterministic and verifiable"
    principle_3_zero_overhead: "Timeout overhead negligible (<0.1ms)"
    principle_4_cancellation: "Cancelled tasks must be cleaned up properly"

---

# Section 2: asyncio.wait_for() Pattern
# ======================================

asyncio_wait_for_pattern:
  description: |
    asyncio.wait_for(awaitable, timeout) enforces timeout on any awaitable.

    Mechanism:
    1. Schedule cancellation after timeout seconds
    2. Await the coroutine
    3. If completes before timeout: Success
    4. If not: CancelledError → TimeoutError

  basic_usage: |
    try:
        result = await asyncio.wait_for(
            coro=async_operation(),
            timeout=30.0  # seconds
        )
    except asyncio.TimeoutError:
        # Handle timeout

  example_tool_execution: |
    async def execute_tool_with_timeout(tool, args, timeout_sec):
        """Execute tool with timeout enforcement"""
        try:
            result = await asyncio.wait_for(
                tool.run_async(**args),
                timeout=timeout_sec
            )
            return result

        except asyncio.TimeoutError:
            logger.error(f"Tool {tool.name} timeout after {timeout_sec}s")
            raise ToolTimeoutError(...)

  latency_overhead:
    asyncio_wait_for_overhead: "0.05ms"
    cancellation_handling: "0.03ms"
    context_creation: "0.02ms"
    total: "0.1ms"

---

# Section 3: Timeout Wrapper Pattern
# ===================================

timeout_wrapper_pattern:
  description: |
    Standard wrapper pattern for timeout enforcement with:
    - Latency tracking
    - Error conversion
    - Structured logging
    - Trace ID propagation

  generic_wrapper: |
    async def with_timeout(
        coro: Coroutine,
        timeout_ms: int,
        operation_name: str,
        trace_id: str,
        fallback_fn: Optional[Callable] = None
    ) -> Any:
        """
        Execute coroutine with timeout.

        Args:
            coro: Coroutine to execute
            timeout_ms: Timeout in milliseconds
            operation_name: Name for logging
            trace_id: Trace ID for correlation
            fallback_fn: Optional fallback function if timeout

        Returns:
            Result from coro or fallback result

        Raises:
            TimeoutError: If coro exceeds timeout
        """
        start_time = time.time()

        try:
            result = await asyncio.wait_for(
                coro,
                timeout=timeout_ms / 1000
            )

            # Success path
            latency_ms = (time.time() - start_time) * 1000
            logger.info(
                "operation_complete",
                operation=operation_name,
                latency_ms=latency_ms,
                trace_id=trace_id
            )

            return result

        except asyncio.TimeoutError:
            latency_ms = (time.time() - start_time) * 1000

            # Timeout path
            logger.error(
                "operation_timeout",
                operation=operation_name,
                timeout_ms=timeout_ms,
                actual_latency_ms=latency_ms,
                trace_id=trace_id
            )

            # Try fallback if provided
            if fallback_fn:
                logger.info(
                    "timeout_fallback_invoked",
                    operation=operation_name,
                    trace_id=trace_id
                )
                try:
                    return await fallback_fn()
                except Exception as e:
                    logger.error(
                        "timeout_fallback_failed",
                        operation=operation_name,
                        error=str(e),
                        trace_id=trace_id
                    )
                    raise

            # No fallback, raise error
            raise TimeoutError(
                f"{operation_name} exceeded {timeout_ms}ms timeout"
            )

  usage_examples:
    tool_execution: |
      result = await with_timeout(
          coro=tool_runner.run_tool(step),
          timeout_ms=30000,
          operation_name=f"tool_execution_{step.tool}",
          trace_id=trace_id,
          fallback_fn=None
      )

    compensation: |
      comp_result = await with_timeout(
          coro=execute_compensation(comp),
          timeout_ms=3000,
          operation_name=f"compensation_{comp.step_id}",
          trace_id=trace_id,
          fallback_fn=None
      )

    saga_execution: |
      saga_result = await with_timeout(
          coro=coordinator.execute_saga_internal(plan),
          timeout_ms=120000,
          operation_name=f"saga_{saga_id}",
          trace_id=trace_id,
          fallback_fn=None
      )

---

# Section 4: Timeout Enforcement - Level 1: Step Timeout
# =======================================================

level_1_step_timeout_enforcement:
  description: |
    Individual tool call timeout enforcement using asyncio.wait_for()

  implementation: |
    class ToolExecutor:
        """Tool executor with timeout enforcement"""

        async def execute_step_with_timeout(
            self,
            step: PlanStep,
            timeout_ms: int,
            trace_id: str
        ) -> StepResult:
            """Execute step with timeout"""

            async def run_tool():
                """Inner coroutine for tool execution"""
                return await self.tool_runner.run_tool(step)

            try:
                result = await asyncio.wait_for(
                    run_tool(),
                    timeout=timeout_ms / 1000
                )

                # Log success
                logger.info(
                    "step_complete",
                    step_id=step.step_id,
                    tool=step.tool,
                    latency_ms=result.latency_ms,
                    trace_id=trace_id
                )

                return result

            except asyncio.TimeoutError:
                logger.error(
                    "step_timeout",
                    step_id=step.step_id,
                    tool=step.tool,
                    timeout_ms=timeout_ms,
                    trace_id=trace_id
                )

                # Conversion to application error
                raise StepTimeoutError(
                    step_id=step.step_id,
                    timeout_ms=timeout_ms
                )

  timeout_tracking: |
    # Track timeout budget usage per step

    class TimeoutTracker:
        """Track cumulative timeout usage"""

        def __init__(self, total_timeout_ms: int):
            self.total_timeout_ms = total_timeout_ms
            self.used_ms = 0

        async def run_with_budget(
            self,
            coro: Coroutine,
            operation_name: str
        ) -> Any:
            """Run coroutine with remaining budget"""

            remaining_ms = self.total_timeout_ms - self.used_ms

            if remaining_ms <= 0:
                raise TimeoutError("Timeout budget exhausted")

            start_time = time.time()

            try:
                result = await asyncio.wait_for(
                    coro,
                    timeout=remaining_ms / 1000
                )

                elapsed_ms = (time.time() - start_time) * 1000
                self.used_ms += elapsed_ms

                return result

            except asyncio.TimeoutError:
                elapsed_ms = (time.time() - start_time) * 1000
                self.used_ms += elapsed_ms
                raise

  examples:
    fast_step_success:
      description: "Step completes quickly (before timeout)"
      step: "reserve_hotel"
      timeout_ms: 30000
      actual_latency_ms: 500
      result: "✅ SUCCESS (500ms < 30s timeout)"

    slow_step_timeout:
      description: "Step hangs and hits timeout"
      step: "call_external_api"
      timeout_ms: 30000
      actual_latency_ms: 30000
      result: "❌ TIMEOUT (30s >= 30s timeout)"
      handling: "Raise StepTimeoutError → Trigger compensation"

    step_exceeds_timeout:
      description: "Step would exceed timeout, cancelled before completion"
      step: "network_call_stuck"
      timeout_ms: 30000
      actual_latency_ms: 30000
      status: "CANCELLED"
      result: "❌ TIMEOUT"

