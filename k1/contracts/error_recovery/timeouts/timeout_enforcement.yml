# Section 10: WARD Test Examples
# ===============================

ward_test_examples:
  test_1_step_timeout_enforcement:
    description: "Verify step timeout is enforced"
    code: |
      @test("step timeout enforced after configured duration")
      async def _(executor=tool_executor):
          # Create slow coroutine
          async def slow_tool():
              await asyncio.sleep(2.0)  # 2s sleep

          # Execute with 1s timeout
          start = time.time()
          with assert_raises(asyncio.TimeoutError):
              await asyncio.wait_for(slow_tool(), timeout=1.0)

          elapsed = time.time() - start
          assert 1.0 <= elapsed < 1.5  # Timeout at 1s ±0.5s jitter

  test_2_compensation_fail_fast:
    description: "Verify compensation uses fail-fast on timeout"
    code: |
      @test("compensation timeout uses fail-fast")
      async def _(executor=compensation_executor):
          comp = CompensationAction(step_id="test", timeout_ms=100)

          result = await executor.execute_compensation_with_timeout(
              comp,
              timeout_ms=100,
              trace_id="test_trace"
          )

          assert result.success == False
          assert result.retry_count == 0

  test_3_saga_timeout_triggers_compensation:
    description: "Verify saga timeout triggers compensation"
    code: |
      @test("saga timeout triggers compensation phase")
      async def _(coordinator=saga_coordinator):
          plan = ValidatedPlan(
              steps=[
                  PlanStep(step_id="a", tool="slow_tool"),
                  PlanStep(step_id="b", tool="slow_tool"),
              ]
          )

          result = await coordinator.execute_saga(plan, timeout_ms=1000)

          assert result.status == "ABORTED"
          assert result.reason == "Timeout exceeded"
          assert len(result.compensations) > 0

  test_4_session_timeout_cleanup:
    description: "Verify session cleanup on timeout"
    code: |
      @test("session cleanup removes resources after timeout")
      async def _(manager=session_manager):
          session = await manager.create_session(
              user_id="test_user",
              timeout_ms=100
          )

          # Wait for timeout
          await asyncio.sleep(0.15)

          # Session should be cleaned up
          with assert_raises(SessionNotFoundError):
              await manager.get_session(session.session_id)

  test_5_timeout_wrapper_fallback:
    description: "Verify timeout wrapper uses fallback"
    code: |
      @test("timeout wrapper invokes fallback on timeout")
      async def _(wrapper=timeout_wrapper):
          async def failing_coro():
              await asyncio.sleep(5.0)

          async def fallback():
              return "fallback_value"

          result = await with_timeout(
              coro=failing_coro(),
              timeout_ms=100,
              operation_name="test",
              trace_id="test_trace",
              fallback_fn=fallback
          )

          assert result == "fallback_value"

