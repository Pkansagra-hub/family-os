# Section 11: Metrics & Observability
# ====================================

timeout_observability:
  prometheus_metrics:
    - name: "timeout_enforcement_latency_ms"
      type: "Histogram"
      labels: ["operation_type"]
      buckets: [1, 5, 10, 30, 60, 120]
      description: "Timeout enforcement overhead"

    - name: "operations_with_timeout_total"
      type: "Counter"
      labels: ["operation_type", "timeout_status"]
      description: "Operations counted by timeout status (success, timeout, error)"

  structured_logging:
    - "operation_complete"
    - "operation_timeout"
    - "timeout_fallback_invoked"
    - "timeout_fallback_failed"
    - "cancellation_cleanup"

