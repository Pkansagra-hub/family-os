# Section 5: Timeout Enforcement - Level 2: Compensation Timeout
# ==============================================================

level_2_compensation_timeout_enforcement:
  description: |
    Compensation action timeout is enforced with fail-fast behavior.

    Unlike steps (retry on timeout), compensations don't retry.
    If compensation hangs: Log error, move to next compensation.

  implementation: |
    class CompensationExecutor:
        """Compensation executor with timeout enforcement"""

        async def execute_compensation_with_timeout(
            self,
            compensation: CompensationAction,
            timeout_ms: int,
            trace_id: str
        ) -> CompensationResult:
            """Execute compensation with timeout (fail-fast)"""

            try:
                result = await asyncio.wait_for(
                    self._execute_compensation_action(compensation),
                    timeout=timeout_ms / 1000
                )

                logger.info(
                    "compensation_success",
                    step_id=compensation.step_id,
                    latency_ms=result.latency_ms,
                    trace_id=trace_id
                )

                return result

            except asyncio.TimeoutError:
                logger.error(
                    "compensation_timeout",
                    step_id=compensation.step_id,
                    timeout_ms=timeout_ms,
                    trace_id=trace_id
                )

                # Fail-fast: Don't retry, return failed result
                return CompensationResult(
                    step_id=compensation.step_id,
                    success=False,
                    error_message=f"Timeout after {timeout_ms}ms",
                    retry_count=0  # No retries on compensation timeout
                )

  fail_fast_behavior: |
    # Compensation timeout uses fail-fast (no retries)

    def compensation_failure_handling(result: CompensationResult):
        """Handle compensation failure"""
        if result.success:
            logger.info(f"Compensation {result.step_id} succeeded")
        else:
            # Fail-fast: Log and continue (don't retry)
            logger.error(
                f"Compensation {result.step_id} failed: {result.error_message}"
            )
            # Continue with next compensation

  examples:
    compensation_success:
      description: "Compensation completes before timeout"
      compensation: "cancel_hotel_reservation"
      timeout_ms: 3000
      actual_latency_ms: 500
      result: "✅ SUCCESS (500ms < 3s timeout)"

    compensation_timeout_failfast:
      description: "Compensation times out, fail-fast (no retry)"
      compensation: "refund_payment"
      timeout_ms: 3000
      actual_latency_ms: 3000
      retry_policy: "FAIL_FAST"
      next_action: "Continue with next compensation"
      result: "❌ TIMEOUT (fail-fast)"

---

# Section 6: Timeout Enforcement - Level 3: Saga Timeout
# =======================================================

level_3_saga_timeout_enforcement:
  description: |
    Total saga execution timeout ensures all sagas terminate
    within bounded time.

  implementation: |
    class SagaCoordinator:
        """Saga coordinator with timeout enforcement"""

        async def execute_saga(
            self,
            plan: ValidatedPlan,
            timeout_ms: int = 120000,
            trace_id: str = None
        ) -> SagaResult:
            """Execute saga with total timeout"""

            saga_id = self.saga_id
            start_time = time.time()

            try:
                result = await asyncio.wait_for(
                    self._execute_saga_internal(plan),
                    timeout=timeout_ms / 1000
                )

                elapsed_ms = (time.time() - start_time) * 1000

                logger.info(
                    "saga_completed",
                    saga_id=saga_id,
                    status="COMPLETED",
                    latency_ms=elapsed_ms,
                    trace_id=trace_id
                )

                return result

            except asyncio.TimeoutError:
                elapsed_ms = (time.time() - start_time) * 1000

                logger.error(
                    "saga_timeout",
                    saga_id=saga_id,
                    timeout_ms=timeout_ms,
                    actual_latency_ms=elapsed_ms,
                    trace_id=trace_id
                )

                # Trigger compensation
                try:
                    comp_result = await self._execute_compensation_phase()
                    return SagaResult(
                        saga_id=saga_id,
                        status="ABORTED",
                        reason="Timeout exceeded",
                        compensations=comp_result.compensations
                    )
                except Exception as comp_error:
                    logger.error(
                        "compensation_phase_failed",
                        saga_id=saga_id,
                        error=str(comp_error),
                        trace_id=trace_id
                    )
                    raise SagaTimeoutError(saga_id, timeout_ms)

  timeout_budget_tracking: |
    # Track timeout budget across saga lifetime

    class SagaTimeoutBudget:
        """Manage timeout budget for saga"""

        def __init__(self, total_ms: int):
            self.total_ms = total_ms
            self.used_ms = 0
            self.start_time = time.time()

        def remaining_ms(self) -> int:
            """Calculate remaining timeout budget"""
            elapsed = (time.time() - self.start_time) * 1000
            return max(0, self.total_ms - elapsed)

        def is_exhausted(self) -> bool:
            """Check if timeout budget is exhausted"""
            return self.remaining_ms() <= 0

  examples:
    saga_success:
      description: "Saga completes before total timeout"
      saga_id: "saga_123"
      steps: "3 steps × 5s = 15s"
      total_timeout_ms: 120000
      actual_latency_ms: 15000
      result: "✅ COMPLETED (15s < 120s timeout)"

    saga_timeout_triggers_compensation:
      description: "Saga hits timeout, triggers compensation"
      saga_id: "saga_456"
      steps: "4 steps × 30s = 120s (all timeout)"
      total_timeout_ms: 120000
      actual_latency_ms: 120000
      result: "❌ TIMEOUT → Trigger compensation"
      final_status: "ABORTED"

