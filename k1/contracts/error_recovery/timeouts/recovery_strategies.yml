# Section 8: Metrics & Observability
# ===================================

recovery_metrics:
  prometheus_metrics:
    - name: "saga_retries_total"
      type: "Counter"
      labels: ["step_id", "attempt_number"]
      description: "Total retry attempts by step"

    - name: "saga_recovery_actions_total"
      type: "Counter"
      labels: ["action_type"]
      description: "Recovery actions (retry, abort, escalate)"

    - name: "saga_compensations_total"
      type: "Counter"
      labels: ["step_id", "success"]
      description: "Compensation executions by step"

    - name: "saga_escalations_total"
      type: "Counter"
      labels: ["reason"]
      description: "Manual escalations by reason"

  structured_logging:
    - event: "retry_attempt"
      level: "WARNING"
      fields: ["step_id", "attempt_number", "backoff_ms"]

    - event: "recovery_strategy_selected"
      level: "INFO"
      fields: ["step_id", "error_class", "strategy"]

    - event: "compensation_phase_started"
      level: "INFO"
      fields: ["saga_id", "steps_to_compensate"]

    - event: "escalation_required"
      level: "CRITICAL"
      fields: ["saga_id", "ticket_id", "reason"]

