# Section 9: WARD Test Examples
# ==============================

ward_test_examples:
  test_1_exponential_backoff:
    description: "Verify exponential backoff timing"
    code: |
      @test("retry uses exponential backoff")
      async def _(executor=retry_executor):
          attempt_count = 0
          attempt_times = []

          async def failing_coro():
              nonlocal attempt_count
              attempt_count += 1
              attempt_times.append(time.time())
              if attempt_count < 3:
                  raise ConnectionError("Simulated failure")
              return "success"

          result = await executor.retry_with_backoff(
              failing_coro,
              max_retries=5,
              initial_backoff_ms=100
          )

          assert result == "success"
          assert attempt_count == 3

          # Check backoff timing
          backoff_1 = (attempt_times[1] - attempt_times[0]) * 1000
          backoff_2 = (attempt_times[2] - attempt_times[1]) * 1000

          assert 90 <= backoff_1 <= 110  # ~100ms
          assert 190 <= backoff_2 <= 210  # ~200ms

  test_2_transient_recovery:
    description: "Verify transient errors retry"
    code: |
      @test("transient errors trigger retry")
      async def _(engine=recovery_decision_engine):
          error = ConnectionError("Network timeout")
          strategy = engine.determine_recovery_strategy(
              error=error,
              step_idempotent=True,
              retry_count=1,
              max_retries=5
          )

          assert strategy == RecoveryStrategy.RETRY_EXPONENTIAL_BACKOFF

  test_3_permanent_no_retry:
    description: "Verify permanent errors don't retry"
    code: |
      @test("permanent errors skip retry")
      async def _(engine=recovery_decision_engine):
          error = ValueError("Invalid input")
          strategy = engine.determine_recovery_strategy(
              error=error,
              step_idempotent=True,
              retry_count=1,
              max_retries=5
          )

          assert strategy == RecoveryStrategy.ABORT_AND_COMPENSATE

  test_4_compensation_triggered:
    description: "Verify compensation triggered on abort"
    code: |
      @test("abort triggers compensation phase")
      async def _(phase=compensation_phase):
          completed_steps = [
              PlanStep(step_id="step_1"),
              PlanStep(step_id="step_2"),
              PlanStep(step_id="step_3"),
          ]

          result = await phase.trigger_compensation(
              completed_steps=completed_steps,
              trace_id="test_trace"
          )

          assert result.steps_compensated == 3
          assert len(result.compensations_executed) == 3

  test_5_escalation_triggered:
    description: "Verify manual escalation on compensation failure"
    code: |
      @test("compensation failure triggers escalation")
      async def _(escalation=manual_escalation):
          ticket = await escalation.escalate(
              saga_id="saga_123",
              reason="Compensation timeout + max failures",
              context={"steps": 5, "compensations_failed": 2},
              trace_id="test_trace"
          )

          assert ticket is not None
          assert ticket.priority == "HIGH"
          assert "saga_123" in ticket.description

