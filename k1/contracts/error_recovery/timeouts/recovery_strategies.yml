# Recovery Strategies - Timeout-Driven Recovery Actions
# ====================================================
#
# **Purpose:** Define escalation policies for timeouts and recovery strategies
#
# **Scope:** Forward recovery (retry), backward recovery (abort/compensation), manual escalation
#
# **Research:** Recovery patterns (Nygard 2007), Fault tolerance strategies
#
# **ADR References:** ADR-0008d (Timeout & Deadlock Handling), ADR-0008 (Saga Pattern)
#
# **Performance Budget:** Recovery decision latency <10ms

---

# Section 1: Recovery Strategy Overview
# ======================================

recovery_strategy_overview:
  description: |
    Timeout handling triggers automatic recovery actions based on:
    1. Timeout level (step, compensation, saga, session)
    2. Retry budget (forward recovery)
    3. Idempotency (safe to retry?)
    4. Manual escalation (human intervention needed?)

  recovery_cascade:
    level_1_automatic_retry: |
      For transient failures with forward recovery:
      - Timeout on first attempt → Retry (exponential backoff)
      - Retry 5 times maximum
      - Total time ~3 seconds
      - If all retries fail → Move to Level 2

    level_2_automatic_abort: |
      If forward recovery exhausted:
      - Abort step → Trigger compensation
      - Mark saga as ABORTED
      - Begin backward recovery (undo steps)

    level_3_manual_escalation: |
      If compensation fails:
      - Alert human operators
      - Log detailed failure context
      - Wait for manual intervention
      - Options: Retry, Manual fix, Cleanup

  decision_matrix:
    transient_failure: |
      (HTTP 429, 503, 504, timeout)
      → Retry with exponential backoff (5 attempts)
      → If all fail: Abort + Compensate

    permanent_failure: |
      (HTTP 400, 401, 403, 404)
      → No retry (would fail again)
      → Abort + Compensate immediately

    ambiguous_failure: |
      (HTTP 500, 502)
      → Check idempotency
      → If safe: Retry
      → If risky: Abort + Compensate

---

# Section 2: Level 1 - Automatic Retry (Forward Recovery)
# ========================================================

level_1_automatic_retry:
  description: |
    Retry failed steps using exponential backoff.

    Policy:
    - Max retries: 5
    - Initial backoff: 100ms
    - Max backoff: 1600ms
    - Total timeout: ~3 seconds
    - Applies to: Transient failures only

  exponential_backoff_formula:
    formula: "backoff_ms = min(100 * (2 ^ attempt), 1600)"
    explanation: |
      Attempt 1: 100ms backoff
      Attempt 2: 200ms backoff
      Attempt 3: 400ms backoff
      Attempt 4: 800ms backoff
      Attempt 5: 1600ms backoff
      Total: 100+200+400+800+1600 = 3100ms

  configuration:
    max_retries: 5
    initial_backoff_ms: 100
    max_backoff_ms: 1600
    backoff_multiplier: 2.0
    total_timeout_ms: 3100

  implementation: |
    class RetryExecutor:
        """Execute with exponential backoff retries"""

        async def retry_with_backoff(
            self,
            coro_fn: Callable,
            max_retries: int = 5,
            initial_backoff_ms: int = 100,
            max_backoff_ms: int = 1600,
            trace_id: str = None
        ) -> Any:
            """Retry coroutine with exponential backoff"""

            backoff_ms = initial_backoff_ms

            for attempt in range(1, max_retries + 1):
                try:
                    result = await coro_fn()

                    if attempt > 1:
                        logger.info(
                            "retry_success",
                            attempt=attempt,
                            trace_id=trace_id
                        )

                    return result

                except Exception as e:
                    if attempt >= max_retries:
                        logger.error(
                            "retry_exhausted",
                            attempt=attempt,
                            max_retries=max_retries,
                            error=str(e),
                            trace_id=trace_id
                        )
                        raise

                    # Backoff and retry
                    logger.warning(
                        "retry_attempt",
                        attempt=attempt,
                        backoff_ms=backoff_ms,
                        error=str(e),
                        trace_id=trace_id
                    )

                    await asyncio.sleep(backoff_ms / 1000)
                    backoff_ms = min(backoff_ms * 2, max_backoff_ms)

  examples:
    transient_failure_recovery:
      description: "HTTP 503 (Service Unavailable) with retry"
      attempt_1:
        time: "t=0s"
        action: "Call API"
        result: "HTTP 503"
        decision: "Transient → Retry"
        backoff: "100ms"
      attempt_2:
        time: "t=0.1s"
        action: "Call API"
        result: "HTTP 503"
        backoff: "200ms"
      attempt_3:
        time: "t=0.3s"
        action: "Call API"
        result: "HTTP 503"
        backoff: "400ms"
      attempt_4:
        time: "t=0.7s"
        action: "Call API"
        result: "HTTP 503"
        backoff: "800ms"
      attempt_5:
        time: "t=1.5s"
        action: "Call API"
        result: "HTTP 200 ✅"
        decision: "Success on retry"
        total_time: "1.5s"

    timeout_with_retry:
      description: "Timeout with exponential backoff recovery"
      attempt_1:
        time: "t=0s"
        action: "Execute step (30s timeout)"
        result: "TIMEOUT at 30s"
        decision: "Transient → Retry"
      attempt_2:
        time: "t=30.1s"
        backoff: "100ms"
        action: "Execute step (30s timeout)"
        result: "HTTP 200 ✅"
        decision: "Success"

    permanent_failure_no_retry:
      description: "HTTP 404 (Not Found) - no retry"
      attempt_1:
        time: "t=0s"
        action: "Call API"
        result: "HTTP 404"
        decision: "Permanent → NO RETRY"
        recovery: "Abort + Compensate"

---

# Section 3: Level 2 - Automatic Abort & Compensation (Backward Recovery)
# ========================================================================

level_2_automatic_abort_compensation:
  description: |
    If forward recovery (retry) exhausted, abort step and trigger compensation.

    Process:
    1. Abort current step (mark as FAILED)
    2. Trigger compensation phase (undo completed steps)
    3. Mark saga as ABORTED
    4. Return error to caller

  abort_decision_tree:
    decision_1_transient_failure: |
      If transient (429, 503, 504, timeout):
        - Retry with exponential backoff
        - If all retries fail:
          → Proceed to decision_2

    decision_2_idempotency_check: |
      Can we safely retry this step?
      - If YES (idempotent, no side effects):
        → Continue retrying (forward recovery)
      - If NO (non-idempotent, has side effects):
        → Abort + Compensate (backward recovery)

    decision_3_abort_trigger: |
      If forward recovery failed:
        - Stop executing new steps
        - Trigger compensation phase
        - Begin undoing completed steps
        - Return ABORTED status

  compensation_phase_execution: |
    class CompensationPhase:
        """Execute compensation phase on abort"""

        async def trigger_compensation(
            self,
            completed_steps: List[PlanStep],
            trace_id: str
        ) -> CompensationResult:
            """Trigger compensation for completed steps"""

            # Reverse step order (LIFO)
            steps_to_compensate = list(reversed(completed_steps))

            compensations_executed = []

            for step in steps_to_compensate:
                # Get compensation for this step
                compensation = self.get_compensation(step)

                if not compensation:
                    logger.warning(
                        "no_compensation_defined",
                        step_id=step.step_id
                    )
                    continue

                try:
                    # Execute compensation with timeout
                    comp_result = await self.execute_compensation_with_timeout(
                        compensation,
                        timeout_ms=3000,
                        trace_id=trace_id
                    )

                    compensations_executed.append(comp_result)

                    if comp_result.success:
                        logger.info(
                            "compensation_success",
                            step_id=step.step_id,
                            trace_id=trace_id
                        )
                    else:
                        logger.error(
                            "compensation_failed",
                            step_id=step.step_id,
                            error=comp_result.error_message,
                            trace_id=trace_id
                        )

                except Exception as e:
                    logger.error(
                        "compensation_error",
                        step_id=step.step_id,
                        error=str(e),
                        trace_id=trace_id
                    )

            return CompensationResult(
                steps_compensated=len(steps_to_compensate),
                compensations_executed=compensations_executed
            )

  examples:
    abort_and_compensate:
      description: "Step fails after retries, triggers compensation"
      execution:
        step_1: "Book hotel → SUCCESS"
        step_2: "Reserve flight → FAIL (retries exhausted)"
      compensation_triggered:
        step_2_comp: "Cancel flight reservation → SUCCESS"
        step_1_comp: "Cancel hotel reservation → SUCCESS"
      final_status: "ABORTED"
      saga_state: "Reverted to initial state (no booking)"

    partial_compensation:
      description: "Some compensations succeed, some fail"
      execution:
        step_1: "Book hotel → SUCCESS"
        step_2: "Reserve flight → SUCCESS"
        step_3: "Rent car → FAIL"
      compensation_triggered:
        step_3_comp: "Cancel car rental → (no-op)"
        step_2_comp: "Cancel flight → FAIL (timeout)"
        step_1_comp: "Cancel hotel → SUCCESS"
      final_status: "ABORTED (partial compensation)"
      note: "User will need to manually call airline to cancel"

---

# Section 4: Level 3 - Manual Escalation
# =======================================

level_3_manual_escalation:
  description: |
    If automatic recovery fails (compensation failed), escalate to humans.

    Process:
    1. Alert operations team
    2. Log detailed context (saga state, steps, compensations)
    3. Create support ticket
    4. Wait for manual intervention
    5. Options: Retry, Fix manually, Cleanup

  escalation_trigger_conditions:
    - "Saga timeout + compensation failed"
    - "Multiple compensation failures"
    - "Resource deadlock not resolved by timeout"
    - "Permanent data corruption detected"
    - "User-initiated abort on long-running saga"

  alert_and_notification: |
    class ManualEscalation:
        """Escalate failures to human operators"""

        async def escalate(
            self,
            saga_id: str,
            reason: str,
            context: Dict[str, Any],
            trace_id: str
        ):
            """Escalate saga failure to operations team"""

            # Create ticket
            ticket = SupportTicket(
                ticket_id=str(uuid.uuid4()),
                saga_id=saga_id,
                reason=reason,
                created_at=datetime.now(),
                priority="HIGH",
                assignee="on_call_ops"
            )

            # Log escalation
            logger.error(
                "escalation_required",
                saga_id=saga_id,
                ticket_id=ticket.ticket_id,
                reason=reason,
                trace_id=trace_id
            )

            # Send alert (email, Slack, PagerDuty)
            await self.notify_operations(
                ticket=ticket,
                context=context
            )

            # Record in database
            await self.save_ticket(ticket)

            return ticket

  manual_intervention_options:
    option_1_retry:
      description: "Retry the failed step or saga"
      process: |
        1. Operator reviews saga state
        2. Operator clicks "Retry"
        3. Saga resumes from failed step
        4. Observation: Step may succeed now

    option_2_manual_fix:
      description: "Operator manually fixes the issue"
      example: |
        - Issue: Flight reservation system down
        - Fix: Operator manually calls airline
        - Result: Reservation completed manually
        - Operator clicks "Mark as SUCCESS"

    option_3_manual_cleanup:
      description: "Operator manually cleans up partial state"
      example: |
        - Issue: User cancelled after partial compensation
        - Cleanup: Operator manually refunds payment
        - Cleanup: Operator manually cancels car reservation
        - Operator clicks "Mark as CLEANUP_COMPLETE"

    option_4_abort_saga:
      description: "Operator aborts saga and compensates"
      example: |
        - Issue: Saga in WAITING_FOR_MANUAL_INTERVENTION
        - Abort: Operator clicks "Abort Saga"
        - Result: Compensation phase triggered
        - Saga marked as ABORTED

---

# Section 5: Recovery Strategy Decision Engine
# =============================================

recovery_decision_engine:
  description: |
    Decision logic for determining recovery strategy based on error type.

  decision_algorithm: |
    def determine_recovery_strategy(
        error: Exception,
        step_idempotent: bool,
        retry_count: int,
        max_retries: int = 5
    ) -> RecoveryStrategy:
        """Determine recovery strategy for error"""

        # Classify error
        if is_transient_error(error):
            error_class = "TRANSIENT"
        elif is_permanent_error(error):
            error_class = "PERMANENT"
        else:
            error_class = "AMBIGUOUS"

        # Decision tree
        if error_class == "TRANSIENT":
            if retry_count < max_retries:
                return RecoveryStrategy.RETRY_EXPONENTIAL_BACKOFF
            else:
                return RecoveryStrategy.ABORT_AND_COMPENSATE

        elif error_class == "PERMANENT":
            return RecoveryStrategy.ABORT_AND_COMPENSATE

        else:  # AMBIGUOUS
            if step_idempotent and retry_count < max_retries:
                return RecoveryStrategy.RETRY_EXPONENTIAL_BACKOFF
            else:
                return RecoveryStrategy.ABORT_AND_COMPENSATE

  error_classification:
    transient_errors:
      - "asyncio.TimeoutError"
      - "HTTP 429 (Too Many Requests)"
      - "HTTP 503 (Service Unavailable)"
      - "HTTP 504 (Gateway Timeout)"
      - "ConnectionError"
      - "socket.timeout"

    permanent_errors:
      - "HTTP 400 (Bad Request)"
      - "HTTP 401 (Unauthorized)"
      - "HTTP 403 (Forbidden)"
      - "HTTP 404 (Not Found)"
      - "ValueError"
      - "TypeError"

    ambiguous_errors:
      - "HTTP 500 (Internal Server Error)"
      - "HTTP 502 (Bad Gateway)"
      - "OSError"

  decision_table:
    transient_idempotent_under_retries:
      error_class: "TRANSIENT"
      idempotent: true
      retry_count: "<5"
      decision: "→ RETRY_EXPONENTIAL_BACKOFF"

    transient_non_idempotent:
      error_class: "TRANSIENT"
      idempotent: false
      retry_count: "any"
      decision: "→ ABORT_AND_COMPENSATE (risky to retry)"

    transient_retries_exhausted:
      error_class: "TRANSIENT"
      idempotent: "any"
      retry_count: "≥5"
      decision: "→ ABORT_AND_COMPENSATE"

    permanent_error:
      error_class: "PERMANENT"
      idempotent: "any"
      retry_count: "any"
      decision: "→ ABORT_AND_COMPENSATE (no retry)"

    ambiguous_idempotent:
      error_class: "AMBIGUOUS"
      idempotent: true
      retry_count: "<5"
      decision: "→ RETRY_EXPONENTIAL_BACKOFF"

    ambiguous_non_idempotent:
      error_class: "AMBIGUOUS"
      idempotent: false
      retry_count: "any"
      decision: "→ ABORT_AND_COMPENSATE (risky)"

---

# Section 6: Recovery Strategy Configuration
# ============================================

recovery_strategy_config:
  description: "Recovery configuration schema (k1/config/saga.yml)"

  structure:
    saga:
      recovery:
        # Forward recovery (retry)
        retry:
          enabled: true
          max_retries: 5
          initial_backoff_ms: 100
          max_backoff_ms: 1600
          backoff_multiplier: 2.0

        # Backward recovery (abort + compensate)
        compensation:
          enabled: true
          timeout_ms: 3000
          fail_fast: true
          retry_failed_compensations: false

        # Manual escalation
        escalation:
          enabled: true
          timeout_before_escalation_ms: 600000  # 10 minutes
          notification_channels: ["email", "slack"]
          alert_severity: "HIGH"

  canonical_values:
    production:
      saga:
        recovery:
          retry:
            enabled: true
            max_retries: 5
            initial_backoff_ms: 100
            max_backoff_ms: 1600
            backoff_multiplier: 2.0

          compensation:
            enabled: true
            timeout_ms: 3000
            fail_fast: true
            retry_failed_compensations: false

          escalation:
            enabled: true
            timeout_before_escalation_ms: 600000
            notification_channels: ["email", "slack"]
            alert_severity: "HIGH"

