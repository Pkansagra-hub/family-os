# Section 4: Deadlock Detection at Runtime
# =========================================

runtime_deadlock_detection:
  description: |
    Although prevention through ordering is primary defense,
    runtime timeout-based detection provides safety net.

    If resource acquisition exceeds timeout → Deadlock detected → Abort operation

  timeout_based_detection:
    mechanism: "If agent can't acquire all resources within timeout → Deadlock likely"
    timeout: "5000ms (5 seconds)"
    action_on_detection: "Raise DeadlockError → Abort saga → Compensation"

  implementation: |
    async def acquire_multiple_with_detection(
        self,
        resource_ids: List[str],
        agent_id: str,
        timeout_ms: int = 5000
    ) -> None:
        """
        Acquire multiple resources with deadlock detection.

        If timeout exceeded → Deadlock detected → Raise exception
        """
        start_time = time.time()

        for i, resource_id in enumerate(sorted(resource_ids)):
            lock = self.locks.setdefault(resource_id, asyncio.Lock())

            # Remaining time budget
            elapsed_ms = (time.time() - start_time) * 1000
            remaining_ms = timeout_ms - elapsed_ms

            if remaining_ms <= 0:
                # Timeout exceeded
                logger.error(
                    "deadlock_detected_via_timeout",
                    agent_id=agent_id,
                    resources_needed=len(resource_ids),
                    resources_acquired=i,
                    timeout_ms=timeout_ms
                )
                raise DeadlockError(
                    f"Deadlock: Could not acquire all resources within {timeout_ms}ms"
                )

            try:
                # Try to acquire with remaining time budget
                await asyncio.wait_for(
                    lock.acquire(),
                    timeout=remaining_ms / 1000
                )

            except asyncio.TimeoutError:
                logger.error(
                    "resource_acquisition_timeout",
                    agent_id=agent_id,
                    resource_id=resource_id,
                    resource_number=i + 1,
                    total_resources=len(resource_ids)
                )
                raise DeadlockError(f"Deadlock acquiring {resource_id}")

  metrics:
    - name: "deadlock_detected_total"
      type: "Counter"
      labels: ["agent_id", "resource_id"]
      description: "Total deadlocks detected and recovered"

    - name: "resource_acquisition_latency_ms"
      type: "Histogram"
      labels: ["agent_id", "resource_count"]
      buckets: [10, 50, 100, 500, 1000, 5000]
      description: "Latency to acquire all resources"

