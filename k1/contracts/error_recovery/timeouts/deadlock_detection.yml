# Section 7: Configuration
# =======================

deadlock_detection_config:
  description: "Configuration for deadlock detection (k1/config/saga.yml)"

  structure:
    saga:
      deadlock:
        # Prevention through ordering
        resource_ordering_enabled: true
        resource_ordering_strategy: "alphabetical"

        # Timeout-based detection
        resource_acquire_timeout_ms: 5000
        max_wait_cycles: 3

        # DAG cycle detection
        dag_validation_enabled: true

      timeouts:
        # Deadlock timeout (resource acquisition)
        resource_acquire_timeout_ms: 5000

  canonical_values:
    production:
      saga:
        deadlock:
          resource_ordering_enabled: true
          resource_ordering_strategy: "alphabetical"
          resource_acquire_timeout_ms: 5000
          max_wait_cycles: 3
          dag_validation_enabled: true

