# Section 8: WARD Test Examples
# ==============================

ward_test_examples:
  test_1_dag_acyclic:
    description: "Verify acyclic DAG passes validation"
    code: |
      @test("acyclic dag passes validation")
      async def _(validator=plan_validator):
          plan = ValidatedPlan(
              steps=[
                  PlanStep(step_id="a", depends_on=[]),
                  PlanStep(step_id="b", depends_on=["a"]),
                  PlanStep(step_id="c", depends_on=["b"]),
              ]
          )

          result = await validator.validate(plan)
          assert result.valid == True

  test_2_dag_cycle:
    description: "Verify cyclic DAG is rejected"
    code: |
      @test("cyclic dag is rejected at validation")
      async def _(validator=plan_validator):
          plan = ValidatedPlan(
              steps=[
                  PlanStep(step_id="a", depends_on=["b"]),
                  PlanStep(step_id="b", depends_on=["c"]),
                  PlanStep(step_id="c", depends_on=["a"]),
              ]
          )

          with assert_raises(ValidationError):
              await validator.validate(plan)

  test_3_resource_ordering:
    description: "Verify resource ordering prevents deadlock"
    code: |
      @test("resource ordering prevents deadlock")
      async def _(lock_manager=resource_lock_manager):
          # Two agents needing same resources in different orders
          async def agent_a():
              await lock_manager.acquire_multiple(
                  ["tool_a", "tool_b"],
                  agent_id="agent_a"
              )

          async def agent_b():
              await lock_manager.acquire_multiple(
                  ["tool_b", "tool_a"],
                  agent_id="agent_b"
              )

          # Should complete without deadlock (ordering prevents it)
          result = await asyncio.wait_for(
              asyncio.gather(agent_a(), agent_b()),
              timeout=2.0
          )
          assert result is not None  # Completed without timeout

  test_4_timeout_detection:
    description: "Verify timeout detects deadlock"
    code: |
      @test("timeout detection catches potential deadlock")
      async def _(lock_manager=resource_lock_manager):
          lock = asyncio.Lock()
          await lock.acquire()  # Pre-acquire to simulate contention

          with assert_raises(DeadlockError):
              await lock_manager.acquire_multiple(
                  ["resource_locked"],
                  agent_id="test_agent",
                  timeout_ms=100  # Very short timeout
              )

