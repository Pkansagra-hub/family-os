# Section 6: Monitoring & Debugging
# ==================================

deadlock_monitoring:
  description: |
    Comprehensive monitoring for deadlock prevention.

  metrics:
    deadlock_detected_total:
      type: "Counter"
      labels: ["agent_id", "resource_id"]
      description: "Deadlocks detected and prevented"
      example: |
        deadlock_detected_total{agent_id="agent_1", resource_id="tool_a"} = 0
        (No deadlocks in production - prevention working!)

    resource_acquisition_latency:
      type: "Histogram"
      labels: ["agent_id", "resource_count"]
      buckets: [10, 50, 100, 500, 1000, 5000]
      description: "Time to acquire N resources"
      example: |
        resource_acquisition_latency_ms_bucket{
          agent_id="concierge",
          resource_count="3",
          le="1000"
        } = 1000 (all acquisitions <1s)

    dag_cycles_rejected:
      type: "Counter"
      labels: ["plan_id"]
      description: "Plans rejected due to cycles"
      example: |
        dag_cycles_rejected_total = 0
        (All validation-time prevention working!)

  structured_logging:
    events:
      - event: "dag_cycle_detected"
        level: "ERROR"
        fields: ["plan_id", "cycle_steps"]
        example: |
          {
            "event": "dag_cycle_detected",
            "plan_id": "plan_123",
            "cycle_steps": ["step_a", "step_b", "step_a"],
            "validation_error": true
          }

      - event: "deadlock_detected_via_timeout"
        level: "CRITICAL"
        fields: ["agent_id", "resources_needed", "resources_acquired"]
        example: |
          {
            "event": "deadlock_detected_via_timeout",
            "agent_id": "agent_concierge",
            "resources_needed": 3,
            "resources_acquired": 2,
            "timeout_ms": 5000
          }

      - event: "resource_acquisition_success"
        level: "DEBUG"
        fields: ["agent_id", "resource_count", "latency_ms"]
        example: |
          {
            "event": "resource_acquisition_success",
            "agent_id": "agent_planner",
            "resource_count": 3,
            "latency_ms": 42
          }

