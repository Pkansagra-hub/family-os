# Deadlock Detection - Circular Wait Prevention
# ==============================================
#
# **Purpose:** Detect and prevent deadlock conditions through cycle detection & resource ordering
#
# **Scope:** Saga workflow DAG validation, agent resource coordination
#
# **Research:** Deadlock prevention (Coffman et al. 1971), Resource ordering (Havender 1968)
#
# **ADR References:** ADR-0008d (Timeout & Deadlock Handling), ADR-0007c (Validation 2-tier)
#
# **Performance Budget:** DAG validation <1ms, deadlock detection overhead <0.1ms per resource

---

# Section 1: Deadlock Types & Prevention Strategy
# ================================================

deadlock_types:
  description: |
    Two types of deadlock can occur in K1:
    1. Circular dependencies in saga workflow DAG
    2. Resource contention between agents

    Both are prevented through orthogonal mechanisms:
    - Type 1: DAG cycle detection (validation layer)
    - Type 2: Resource ordering (executor layer)

  type_1_dag_cycles:
    description: "Circular step dependencies in saga workflow"
    example: |
      Step A depends on Step B
      Step B depends on Step A
      → Cycle: A → B → A → (infinite loop)
    mechanism: "Kahn's algorithm for topological sort"
    prevention_layer: "Validation stage (ADR-0007c)"
    detection_time: "Validation time (before execution)"

  type_2_resource_deadlock:
    description: "Agent A waiting for Agent B, B waiting for A"
    example: |
      Agent Concierge needs: [Tool_A, Tool_B]
      Agent Planner needs: [Tool_B, Tool_A]

      Concierge acquires Tool_A, waits for Tool_B
      Planner acquires Tool_B, waits for Tool_A
      → Deadlock: Neither proceeds
    mechanism: "Resource ordering (acquire in sorted order)"
    prevention_layer: "Executor layer (runtime prevention)"
    detection_time: "Runtime (timeout-based detection)"

---

# Section 2: Deadlock Prevention - Type 1: DAG Cycles
# ====================================================

type_1_dag_cycle_detection:
  description: |
    Saga workflow DAG is checked for cycles at validation time.

    Circular dependencies are invalid and rejected immediately.
    This prevents infinite loops before execution begins.

  validation_mechanism:
    algorithm: "Kahn's algorithm (topological sort)"
    complexity: "O(V + E) where V=steps, E=dependencies"
    time_budget: "<1ms for typical plans (max 10 steps, ~15 edges)"

  implementation: |
    def detect_dag_cycles(plan: ValidatedPlan) -> bool:
        """
        Detect cycles in step dependency DAG using Kahn's algorithm.

        Returns: True if cycle detected, False if acyclic (valid)
        """
        # Build dependency graph
        graph = {}
        in_degree = {}

        for step in plan.steps:
            if step.step_id not in graph:
                graph[step.step_id] = []
                in_degree[step.step_id] = 0

        # Add edges for dependencies
        for step in plan.steps:
            for dep_id in step.depends_on:
                graph[dep_id].append(step.step_id)
                in_degree[step.step_id] += 1

        # Kahn's algorithm
        queue = [step_id for step_id in in_degree if in_degree[step_id] == 0]
        processed = 0

        while queue:
            node = queue.pop(0)
            processed += 1

            for neighbor in graph[node]:
                in_degree[neighbor] -= 1
                if in_degree[neighbor] == 0:
                    queue.append(neighbor)

        # If all nodes processed: acyclic
        # If some nodes unprocessed: cycle exists
        return processed != len(plan.steps)

  examples:
    valid_dag_no_cycles:
      description: "Valid saga plan with no cycles"
      steps:
        - step_id: "reserve_hotel"
          depends_on: []
        - step_id: "reserve_flight"
          depends_on: []
        - step_id: "book_rental"
          depends_on: ["reserve_hotel", "reserve_flight"]
        - step_id: "confirm_booking"
          depends_on: ["book_rental"]
      graph: "reserve_hotel → confirm_booking; reserve_flight → confirm_booking; book_rental → confirm_booking"
      cycle_detected: false
      validation_result: "✅ VALID (acyclic)"

    invalid_dag_with_cycle:
      description: "Invalid saga plan with circular dependency"
      steps:
        - step_id: "step_a"
          depends_on: ["step_b"]
        - step_id: "step_b"
          depends_on: ["step_c"]
        - step_id: "step_c"
          depends_on: ["step_a"]
      graph: "step_a → step_b → step_c → step_a (cycle)"
      cycle_detected: true
      validation_result: "❌ INVALID (cycle detected)"
      rejection_reason: "Circular dependency: A depends on B, B depends on C, C depends on A"

    complex_dag:
      description: "Complex plan with multiple paths but no cycles"
      steps:
        - step_id: "weather_check"
          depends_on: []
        - step_id: "hotel_check"
          depends_on: ["weather_check"]
        - step_id: "flight_check"
          depends_on: ["weather_check"]
        - step_id: "price_compare"
          depends_on: ["hotel_check", "flight_check"]
        - step_id: "confirm"
          depends_on: ["price_compare"]
      paths: |
        weather_check
        ├── hotel_check ──┐
        └── flight_check ─┼─→ price_compare → confirm
      cycle_detected: false
      validation_result: "✅ VALID (acyclic, multiple paths)"

  integration_with_validation:
    validation_stage: "2-tier validation (ADR-0007c)"
    tier_1_rule: "write_plan_dag_acyclic"
    description: "Ensure plan DAG is acyclic (no circular dependencies)"
    execution_order: "Executed during Validation Stage before plan is committed"
    error_handling: "Validation fails → Plan rejected → User receives error"

  performance_characteristics:
    time_complexity: "O(V + E)"
    space_complexity: "O(V + E)"
    typical_execution:
      steps: 10
      edges: 15
      execution_time_ms: "0.05ms"
    performance_budget: "<1ms for all plans"

