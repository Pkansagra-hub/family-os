# Section 3: Deadlock Prevention - Type 2: Resource Ordering
# ===========================================================

type_2_resource_ordering:
  description: |
    Multiple agents acquiring resources must do so in deterministic order
    to prevent circular wait conditions.

    Principle: All agents acquire resources in same order (e.g., alphabetical)

    If A needs [X, Y] and B needs [Y, X]:
    - Both acquire in order [X, Y] (sorted)
    - No circular wait possible

  prevention_mechanism:
    principle: "Coffman condition #3: Hold and Wait prevention via ordering"
    implementation: "Alphabetical sorting of resource IDs"
    enforcement: "Resource manager ensures acquisition order"

  resource_lock_implementation: |
    class ResourceLock:
        """Resource lock manager with deadlock prevention"""

        def __init__(self):
            self.locks: Dict[str, asyncio.Lock] = {}

        async def acquire_multiple(
            self,
            resource_ids: List[str],
            agent_id: str,
            timeout_ms: int = 5000
        ) -> None:
            """
            Acquire multiple resources in deterministic order.

            All agents acquire in same order (alphabetical) → No circular wait
            """
            # Sort resource IDs (deterministic ordering)
            sorted_resource_ids = sorted(resource_ids)

            acquired_locks = []

            try:
                # Acquire locks in order
                for resource_id in sorted_resource_ids:
                    lock = self.locks.setdefault(resource_id, asyncio.Lock())

                    # Acquire with timeout
                    try:
                        await asyncio.wait_for(
                            lock.acquire(),
                            timeout=timeout_ms / 1000
                        )
                        acquired_locks.append((resource_id, lock))

                    except asyncio.TimeoutError:
                        logger.error(
                            "resource_deadlock_detected",
                            agent_id=agent_id,
                            resource_id=resource_id,
                            timeout_ms=timeout_ms
                        )
                        raise DeadlockError(f"Deadlock acquiring {resource_id}")

            except:
                # Release all acquired locks on error
                for _, lock in acquired_locks:
                    lock.release()
                raise

  examples:
    no_deadlock_with_ordering:
      description: "Two agents, both using resource ordering → No deadlock"
      agent_a:
        needs: ["tool_a", "tool_b"]
        acquisition_order: ["tool_a", "tool_b"]  # Sorted
      agent_b:
        needs: ["tool_b", "tool_a"]
        acquisition_order: ["tool_a", "tool_b"]  # Sorted (same order!)
      execution:
        t1: "Agent A acquires tool_a ✅"
        t2: "Agent B waits for tool_a (A has it) ⏳"
        t3: "Agent A acquires tool_b ✅"
        t4: "Agent A releases tool_a"
        t5: "Agent B acquires tool_a ✅"
        t6: "Agent B acquires tool_b ✅"
      result: "✅ No deadlock (ordering prevents circular wait)"

    deadlock_without_ordering:
      description: "Two agents WITHOUT ordering → Deadlock possible"
      agent_a:
        needs: ["tool_a", "tool_b"]
        acquisition_order: ["tool_a", "tool_b"]  # A→B
      agent_b:
        needs: ["tool_b", "tool_a"]
        acquisition_order: ["tool_b", "tool_a"]  # B→A (opposite!)
      execution:
        t1: "Agent A acquires tool_a ✅"
        t2: "Agent B acquires tool_b ✅"
        t3: "Agent A waits for tool_b (B has it) ⏳"
        t4: "Agent B waits for tool_a (A has it) ⏳"
        t5: "DEADLOCK 🔴 (neither can proceed)"
      result: "❌ Deadlock (circular wait)"

    three_agent_deadlock_prevention:
      description: "Three agents, all using same sorted order → No deadlock"
      agent_a:
        needs: ["resource_x", "resource_y", "resource_z"]
        sorted_order: ["resource_x", "resource_y", "resource_z"]
      agent_b:
        needs: ["resource_z", "resource_x", "resource_y"]
        sorted_order: ["resource_x", "resource_y", "resource_z"]
      agent_c:
        needs: ["resource_y", "resource_z", "resource_x"]
        sorted_order: ["resource_x", "resource_y", "resource_z"]
      reasoning: "All agents acquire in same order (sorted) → Deterministic ordering prevents cycles"
      result: "✅ No deadlock possible (strict ordering)"

