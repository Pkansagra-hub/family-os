# Timeout Policies - Per-Operation Timeout Budgets
# ==================================================
#
# **Purpose:** Define 4-level timeout hierarchy for saga execution
#
# **Scope:** All saga steps, compensations, and session lifetimes
#
# **Research:** Timeout patterns (Nygard 2007), timeout-driven recovery
#
# **ADR References:** ADR-0008d (Timeout & Deadlock Handling), ADR-0008 (Saga Pattern)
#
# **Performance Budget:** Zero timeout overhead (<0.1ms timeout tracking)

---

# Section 1: Timeout Hierarchy Overview
# =====================================
#
# 4-level cascade ensures all operations complete or abort within bounded time.

timeout_hierarchy:
  description: |
    Four-level timeout cascade provides deterministic termination guarantees.

    Level 1 → Level 2 → Level 3 → Level 4
    (Tightest)                  (Loosest)

  level_1_step:
    description: "Individual tool call timeout"
    purpose: "Prevent single tool calls from hanging indefinitely"
    default_ms: 30000
    min_ms: 5000
    max_ms: 60000
    applies_to:
      - tool_runner_calls
      - mcp_tool_invocations
      - model_hub_requests
      - api_gateway_requests

  level_2_compensation:
    description: "Individual compensation action timeout"
    purpose: "Fail-fast on compensations; don't waste time retrying failed undos"
    default_ms: 3000
    min_ms: 1000
    max_ms: 10000
    applies_to:
      - compensation_tool_executions
      - compensation_api_calls
      - compensation_custom_handlers
      - no_op_compensations

  level_3_saga:
    description: "Total saga execution timeout"
    purpose: "Ensure all sagas terminate with COMPLETED or ABORTED state"
    default_ms: 120000
    min_ms: 60000
    max_ms: 300000
    applies_to:
      - entire_saga_workflow
      - all_steps_combined
      - all_compensations_combined
      - retry_loops

  level_4_session:
    description: "Session lifetime timeout"
    purpose: "Prevent sessions from living forever; cleanup abandoned sessions"
    default_ms: 600000
    min_ms: 300000
    max_ms: 1800000
    applies_to:
      - user_session_lifetime
      - all_sagas_in_session
      - session_state_persistence
      - resource_cleanup

---

# Section 2: Level 1 - Step Timeout (30s per tool call)
# =====================================================

level_1_step_timeout:
  description: |
    Individual tool call timeout prevents hanging on external API calls, LLM requests,
    or MCP tool invocations.

  # Standard tool call timeout
  default_configuration:
    timeout_ms: 30000
    enforcement: "asyncio.wait_for(tool_call, timeout=30.0)"
    error_type: "asyncio.TimeoutError"
    handling: "Convert to StepTimeoutError → Trigger compensation"
    log_level: "WARNING"

  # Per-service overrides
  service_overrides:
    # External API calls (network unreliable)
    tool_runner:
      timeout_ms: 30000
      rationale: |
        External APIs may have slow connections. 30s allows:
        - Network latency: ~5s worst-case
        - API processing: ~20s
        - Buffer: ~5s
      examples:
        - "Call weather API: 30s"
        - "Call calendar service: 30s"
        - "Call payment processor: 30s"

    # Local LLM (fast, deterministic)
    model_hub_local:
      timeout_ms: 10000
      rationale: |
        Local LLM runs in-process. Should be fast (<5s). 10s allows:
        - Model inference: ~3s
        - Tokenization: ~0.5s
        - Buffer: ~6.5s
      examples:
        - "Local LLaMA-2 inference: 5-8s"
        - "Local embedding model: 1-2s"

    # Remote LLM (slow, network-dependent)
    model_hub_remote:
      timeout_ms: 60000
      rationale: |
        Remote LLM (OpenAI, Anthropic) may queue requests. 60s allows:
        - Queue wait: ~10s
        - Network latency: ~5s
        - Model inference: ~40s
        - Buffer: ~5s
      examples:
        - "OpenAI GPT-4 request: 30-40s"
        - "Anthropic Claude request: 30-50s"

    # K0 Bridge (critical infrastructure, must be fast)
    k0_bridge:
      timeout_ms: 5000
      rationale: |
        K0 WAL writes must be fast (<1s). 5s is extremely generous:
        - Batch prepare: ~0.5s
        - Network write: ~1s
        - Fsync: ~2s
        - Buffer: ~1.5s
      examples:
        - "Write SAGA_LOG to K0: <1s"
        - "Write COMPENSATION_LOG to K0: <1s"

    # MCP Gateway (tool invocation, variable latency)
    mcp_gateway:
      timeout_ms: 30000
      rationale: |
        MCP tools vary widely. 30s covers most cases:
        - MCP server startup: ~5s
        - Tool execution: ~20s
        - Network overhead: ~5s
      examples:
        - "MCP filesystem tool: 5-10s"
        - "MCP browser tool: 20-30s"

    # Streaming engine (SSE long-polling)
    streaming_engine:
      timeout_ms: 10000
      rationale: |
        Streaming should start quickly. 10s to first chunk:
        - Connection setup: ~1s
        - Initial data generation: ~5s
        - Buffer: ~4s
      examples:
        - "Start streaming response: 5-10s"
        - "First chunk delivery: <3s"

  # Configuration structure
  per_service_timeout_config:
    tool_runner:
      step_timeout_ms: 30000
      override_conditions:
        - condition: "tool_category == 'external_api'"
          timeout_ms: 30000
        - condition: "tool_category == 'file_io'"
          timeout_ms: 20000
        - condition: "tool_category == 'network_call'"
          timeout_ms: 30000

    model_hub_local:
      step_timeout_ms: 10000
      override_conditions:
        - condition: "model_type == 'embedding'"
          timeout_ms: 5000
        - condition: "model_type == 'reasoning'"
          timeout_ms: 15000

    model_hub_remote:
      step_timeout_ms: 60000
      override_conditions:
        - condition: "model_vendor == 'openai'"
          timeout_ms: 60000
        - condition: "model_vendor == 'anthropic'"
          timeout_ms: 60000

    k0_bridge:
      step_timeout_ms: 5000
      override_conditions:
        - condition: "operation == 'write'"
          timeout_ms: 5000
        - condition: "operation == 'batch'"
          timeout_ms: 10000

    mcp_gateway:
      step_timeout_ms: 30000
      override_conditions:
        - condition: "mcp_tool_type == 'sync'"
          timeout_ms: 30000
        - condition: "mcp_tool_type == 'async_long_running'"
          timeout_ms: 60000

    streaming_engine:
      step_timeout_ms: 10000
      override_conditions:
        - condition: "stream_type == 'sse'"
          timeout_ms: 10000
        - condition: "stream_type == 'websocket'"
          timeout_ms: 15000

---

# Section 3: Level 2 - Compensation Timeout (3s per compensation)
# ===============================================================

level_2_compensation_timeout:
  description: |
    Compensation action timeout is SHORT (3s) to enable fail-fast behavior.

    Unlike forward recovery (retry on timeout), backward recovery should:
    - NOT retry compensation timeouts (wasted effort)
    - Log failure and continue with next compensation
    - Best-effort model: If compensation hangs, move on

  default_configuration:
    timeout_ms: 3000
    enforcement: "asyncio.wait_for(compensation_action, timeout=3.0)"
    error_type: "asyncio.TimeoutError"
    handling: "Log failure, continue with next compensation (best-effort)"
    log_level: "ERROR"
    retry_on_timeout: false

  rationale: |
    Compensation timeout is tighter than step timeout because:
    1. We've already failed once (step failed)
    2. Compensation should be simpler/faster than original step
    3. Don't waste time retrying failed compensations
    4. Budget: 10 steps × 3s = 30s total compensation time

  examples:
    # Example 1: Compensating tool call
    tool_compensation:
      original_step:
        step_id: "reserve_hotel"
        tool: "booking_service.reserve_hotel"
        timeout_ms: 30000
        result: "TIMEOUT"
      compensation:
        step_id: "reserve_hotel"
        compensation_type: "tool_based"
        tool: "booking_service.cancel_reservation"
        timeout_ms: 3000
        expected_latency_ms: 500
        description: "Cancel hotel reservation is trivial (<500ms); 3s allows network + retries"

    # Example 2: Compensating API call
    api_compensation:
      original_step:
        step_id: "charge_card"
        api_endpoint: "POST /payments/charge"
        timeout_ms: 30000
        result: "HTTP 500"
      compensation:
        step_id: "charge_card"
        compensation_type: "api_based"
        api_endpoint: "POST /payments/refund"
        timeout_ms: 3000
        expected_latency_ms: 1000
        description: "Refund should be faster than charge; 3s is very generous"

    # Example 3: Compensation timeout exceeded
    timeout_exceeded:
      original_step:
        step_id: "update_database"
        result: "TIMEOUT"
      compensation:
        step_id: "update_database"
        compensation_type: "custom_handler"
        timeout_ms: 3000
        actual_latency_ms: 3500
        result: "TIMEOUT"
        handling: "Fail-fast: Log error, don't retry, continue with next compensation"
        log_message: |
          {
            "event": "compensation_timeout",
            "step_id": "update_database",
            "timeout_ms": 3000,
            "actual_latency_ms": 3500,
            "retry_policy": "FAIL_FAST",
            "next_step": "execute_next_compensation"
          }

  compensation_timeout_per_type:
    tool_based:
      timeout_ms: 3000
      rationale: "Tool call should be fast; 3s is very generous"

    api_based:
      timeout_ms: 3000
      rationale: "API call should complete quickly; timeout means API is down"

    custom_handler:
      timeout_ms: 3000
      rationale: "Custom code should be optimized for compensation; timeout is failure signal"

    no_op:
      timeout_ms: 100
      rationale: "No-op compensation is instant; 100ms prevents accidental hangs"

---

# Section 4: Level 3 - Saga Timeout (120s total)
# ===============================================

level_3_saga_timeout:
  description: |
    Total saga execution timeout (120s) ensures all sagas terminate
    with COMPLETED or ABORTED state.

  default_configuration:
    timeout_ms: 120000
    min_timeout_ms: 60000
    max_timeout_ms: 300000
    enforcement: "asyncio.wait_for(saga_execute(), timeout=120.0)"
    error_type: "asyncio.TimeoutError"
    handling: "Abort saga → Trigger compensation → ABORTED state"
    log_level: "ERROR"

  rationale: |
    Saga timeout = step_time + compensation_time + buffer

    For 3-step saga:
    - 3 steps × 30s/step = 90s
    - 3 compensations × 3s/comp = 9s
    - Buffer = 30s (retry, network jitter)
    - Total = 129s ≈ 120s minimum

    For 4-step saga:
    - 4 steps × 30s/step = 120s
    - 4 compensations × 3s/comp = 12s
    - Total = 132s > 120s → Use dynamic calculation

  dynamic_calculation:
    formula: |
      saga_timeout_ms = (num_steps × 30000)
                      + (num_steps × 3000)
                      + 30000

    example_calculations:
      one_step:
        num_steps: 1
        calculation: "(1 × 30) + (1 × 3) + 30 = 63s"
        saga_timeout_ms: 63000

      two_steps:
        num_steps: 2
        calculation: "(2 × 30) + (2 × 3) + 30 = 96s"
        saga_timeout_ms: 96000

      three_steps:
        num_steps: 3
        calculation: "(3 × 30) + (3 × 3) + 30 = 129s ≈ 120s (min)"
        saga_timeout_ms: 129000

      four_steps:
        num_steps: 4
        calculation: "(4 × 30) + (4 × 3) + 30 = 162s ≈ 150s"
        saga_timeout_ms: 162000

      five_steps:
        num_steps: 5
        calculation: "(5 × 30) + (5 × 3) + 30 = 195s ≈ 200s"
        saga_timeout_ms: 195000

      max_ten_steps:
        num_steps: 10
        calculation: "(10 × 30) + (10 × 3) + 30 = 360s"
        saga_timeout_ms: 360000
        note: "Capped at max_timeout_ms=300000; validation enforces max_steps=10"

  timeout_enforcement:
    implementation: |
      class SagaCoordinator:
          async def execute_saga(self, plan, timeout_ms=120000):
              """Execute saga with timeout"""
              # Dynamic timeout calculation
              calc_timeout = self.calculate_timeout(plan)
              actual_timeout = min(calc_timeout, self.max_timeout_ms)

              try:
                  result = await asyncio.wait_for(
                      self._execute_saga_internal(plan),
                      timeout=actual_timeout / 1000
                  )
                  return result
              except asyncio.TimeoutError:
                  logger.error("saga_timeout", saga_id=self.saga_id)
                  await self.rollback()  # Trigger compensation
                  raise SagaTimeoutError(...)

  examples:
    success_case:
      description: "Saga completes before timeout"
      steps:
        - step_1: "Book hotel (5s)"
        - step_2: "Reserve flight (8s)"
        - step_3: "Rent car (6s)"
      total_time_ms: 19000
      saga_timeout_ms: 120000
      result: "✅ COMPLETED (within timeout)"

    timeout_case:
      description: "Saga hits timeout, triggers compensation"
      steps:
        - step_1: "Book hotel (30s, timeout)"
        - step_2: "Reserve flight (30s, timeout)"
        - step_3: "Rent car (30s, timeout)"
        - step_4: "Pay deposit (30s, timeout)"
      total_time_ms: 120000
      saga_timeout_ms: 120000
      result: "❌ TIMEOUT → Rollback → ABORTED"

    retry_timeout_case:
      description: "Saga with retries hits timeout"
      steps:
        - step_1: "Call API (retry 1: 30s timeout, retry 2: 30s timeout, retry 3: 30s timeout)"
      total_time_ms: 90000
      saga_timeout_ms: 120000
      result: "✅ Within timeout, but retries consumed most budget"

---

# Section 5: Level 4 - Session Timeout (600s = 10 minutes)
# =========================================================

level_4_session_timeout:
  description: |
    Session lifetime timeout (600s) prevents sessions from persisting indefinitely.

    After 600s, session is cleaned up:
    1. All active sagas are aborted
    2. Session state is deleted
    3. Resources are freed

  default_configuration:
    timeout_ms: 600000
    min_timeout_ms: 300000
    max_timeout_ms: 1800000
    enforcement: "SessionManager.cleanup_session_after_timeout(session)"
    error_type: "SessionTimeoutError"
    handling: "Abort all sagas → Delete session → Log cleanup"
    log_level: "INFO"

  rationale: |
    10-minute session lifetime is standard for web applications.

    Supports typical user workflows:
    - User starts session
    - User executes 1-2 sagas (~2-4 minutes)
    - User waits/reads results (~3-8 minutes)
    - Session expires (user gone)

  implementation: |
    class SessionManager:
        async def create_session(self, user_id: str) -> Session:
            """Create session with timeout"""
            session = Session(
                session_id=str(uuid.uuid4()),
                user_id=user_id,
                created_at=time.time(),
                expires_at=time.time() + 600  # 10 minutes
            )

            # Schedule cleanup
            asyncio.create_task(
                self._cleanup_session_after_timeout(session)
            )

            return session

        async def _cleanup_session_after_timeout(self, session: Session):
            """Clean up session after timeout"""
            await asyncio.sleep(600)  # Wait 10 minutes

            # Abort all sagas
            for saga_id in session.active_sagas:
                await self.abort_saga(saga_id)

            # Delete session
            await self.delete_session(session.session_id)

  examples:
    active_session:
      session_id: "sess_abc123"
      user_id: "user_42"
      created_at: "2025-10-15T10:00:00Z"
      expires_at: "2025-10-15T10:10:00Z"
      active_sagas:
        - "saga_1"
        - "saga_2"
      status: "ACTIVE"
      time_remaining: "5 minutes"

    expired_session:
      session_id: "sess_abc123"
      user_id: "user_42"
      created_at: "2025-10-15T10:00:00Z"
      expires_at: "2025-10-15T10:10:00Z"
      cleanup_at: "2025-10-15T10:10:00Z"
      status: "CLEANED_UP"
      cleanup_actions:
        - "Abort saga_1"
        - "Abort saga_2"
        - "Delete session state"
      log_message: |
        {
          "event": "session_timeout_cleanup",
          "session_id": "sess_abc123",
          "sagas_aborted": 2,
          "reason": "session_lifetime_expired"
        }

---

# Section 6: Timeout Configuration Schema
# ========================================

timeout_configuration_schema:
  description: |
    YAML schema for timeout configuration (k1/config/saga.yml).

  structure:
    saga:
      timeouts:
        # Level 1: Per-step timeout
        step_timeout_ms:
          type: "integer"
          range: [5000, 60000]
          default: 30000
          description: "Per-step timeout in milliseconds"

        # Level 2: Per-compensation timeout
        compensation_timeout_ms:
          type: "integer"
          range: [1000, 10000]
          default: 3000
          description: "Per-compensation timeout in milliseconds"

        # Level 3: Per-saga timeout
        saga_timeout_ms:
          type: "integer"
          range: [60000, 300000]
          default: 120000
          description: "Per-saga timeout in milliseconds"

        saga_timeout_buffer_ms:
          type: "integer"
          range: [10000, 60000]
          default: 30000
          description: "Buffer added to dynamic timeout calculation"

        # Level 4: Session timeout
        session_timeout_ms:
          type: "integer"
          range: [300000, 1800000]
          default: 600000
          description: "Session lifetime in milliseconds"

      # Per-service overrides
      service_overrides:
        tool_runner:
          step_timeout_ms: 30000
        model_hub_local:
          step_timeout_ms: 10000
        model_hub_remote:
          step_timeout_ms: 60000
        k0_bridge:
          step_timeout_ms: 5000
        mcp_gateway:
          step_timeout_ms: 30000
        streaming_engine:
          step_timeout_ms: 10000

      # Deadlock prevention
      deadlock:
        resource_acquire_timeout_ms: 5000
        max_wait_cycles: 3

      # Liveness guarantees
      liveness:
        max_steps_per_plan: 10
        max_retries_per_step: 5
        max_saga_iterations: 50

  canonical_values:
    production:
      saga:
        timeouts:
          step_timeout_ms: 30000
          compensation_timeout_ms: 3000
          saga_timeout_ms: 120000
          saga_timeout_buffer_ms: 30000
          session_timeout_ms: 600000

    staging:
      saga:
        timeouts:
          step_timeout_ms: 30000
          compensation_timeout_ms: 3000
          saga_timeout_ms: 120000
          saga_timeout_buffer_ms: 30000
          session_timeout_ms: 600000

    development:
      saga:
        timeouts:
          step_timeout_ms: 30000
          compensation_timeout_ms: 3000
          saga_timeout_ms: 120000
          saga_timeout_buffer_ms: 30000
          session_timeout_ms: 600000

---

# Section 7: Timeout Metrics & Observability
# ==========================================

timeout_metrics:
  description: |
    Prometheus metrics for timeout tracking and debugging.

  prometheus_metrics:
    - name: "saga_timeouts_total"
      type: "Counter"
      labels: ["saga_id", "timeout_level"]
      description: "Total saga timeouts by level (step, compensation, saga)"

    - name: "saga_timeout_latency_ms"
      type: "Histogram"
      labels: ["saga_id", "step_id"]
      buckets: [1000, 5000, 10000, 30000, 60000, 120000]
      description: "Saga execution latency from start to timeout"

    - name: "step_timeouts_total"
      type: "Counter"
      labels: ["step_id", "service"]
      description: "Step timeouts by service"

    - name: "compensation_timeouts_total"
      type: "Counter"
      labels: ["step_id", "compensation_type"]
      description: "Compensation timeouts by type"

    - name: "session_timeouts_total"
      type: "Counter"
      labels: ["user_id"]
      description: "Session timeouts by user"

  structured_logging:
    - event: "step_timeout"
      level: "WARNING"
      fields: ["step_id", "service", "timeout_ms", "actual_latency_ms"]

    - event: "compensation_timeout"
      level: "ERROR"
      fields: ["step_id", "compensation_type", "timeout_ms"]

    - event: "saga_timeout"
      level: "ERROR"
      fields: ["saga_id", "num_steps_completed", "timeout_ms"]

    - event: "session_timeout_cleanup"
      level: "INFO"
      fields: ["session_id", "user_id", "sagas_aborted"]

---

# Section 8: Performance Budget
# =============================

performance_budget:
  description: |
    Timeout overhead must be minimal (<0.1ms per operation).

  timeout_enforcement_overhead:
    asyncio_wait_for_setup: "0.05ms"
    timeout_context_creation: "0.02ms"
    timeout_check_per_operation: "0.01ms"
    cancellation_cleanup: "0.02ms"
    total_per_operation: "0.1ms"

  budget_allocation:
    level_1_step_timeout: "30,000ms (per step)"
    level_2_compensation_timeout: "3,000ms (per compensation)"
    level_3_saga_timeout: "120,000ms (entire saga)"
    level_4_session_timeout: "600,000ms (session lifetime)"

  performance_targets:
    step_timeout_latency: "<30,000ms (99% of steps complete before timeout)"
    compensation_timeout_latency: "<3,000ms (99% of compensations complete before timeout)"
    saga_timeout_latency: "<120,000ms (99% of sagas complete before timeout)"
    timeout_overhead: "<0.1ms (negligible)"

---

# Section 9: WARD Test Examples
# ==============================

ward_test_examples:
  test_1_step_timeout:
    description: "Verify step timeout triggers after timeout_ms"
    code: |
      @test("step timeout triggers after configured duration")
      async def _(orchestrator=orchestrator):
          step = PlanStep(step_id="test_1", tool="test_tool", timeout_ms=1000)

          start_time = time.time()

          with assert_raises(StepTimeoutError):
              await orchestrator.execute_step_with_timeout(step, timeout_ms=1000)

          elapsed_ms = (time.time() - start_time) * 1000
          assert elapsed_ms >= 1000
          assert elapsed_ms < 1200  # Allow 200ms jitter

  test_2_saga_timeout:
    description: "Verify saga timeout triggers compensation"
    code: |
      @test("saga timeout triggers compensation phase")
      async def _(coordinator=saga_coordinator):
          plan = ValidatedPlan(
              steps=[
                  PlanStep(step_id="step_1", tool="slow_tool"),
                  PlanStep(step_id="step_2", tool="slow_tool"),
              ]
          )

          result = await coordinator.execute_saga(plan, timeout_ms=2000)

          assert result.status == "ABORTED"
          assert len(result.compensations_executed) == 2

  test_3_session_timeout:
    description: "Verify session cleanup after timeout"
    code: |
      @test("session cleanup removes inactive sessions")
      async def _(manager=session_manager):
          session = await manager.create_session(user_id="user_1")

          # Wait for timeout
          await asyncio.sleep(1.1)  # 1.1s > 1s timeout

          # Session should be cleaned up
          with assert_raises(SessionNotFoundError):
              await manager.get_session(session.session_id)

  test_4_compensation_timeout:
    description: "Verify compensation timeout doesn't retry"
    code: |
      @test("compensation timeout uses fail-fast, not retry")
      async def _(coordinator=saga_coordinator):
          comp = CompensationAction(
              step_id="comp_1",
              timeout_ms=1000,
              max_retries=5
          )

          result = await coordinator.execute_compensation_with_timeout(
              comp,
              timeout_ms=1000
          )

          # Should NOT retry (fail-fast)
          assert result.retry_count == 0
          assert result.success == False

  test_5_deadlock_timeout:
    description: "Verify resource deadlock detection via timeout"
    code: |
      @test("resource deadlock detected via timeout")
      async def _(lock_manager=resource_lock_manager):
          # Simulate deadlock: A waits for B, B waits for A
          agent_a_resources = ["resource_x", "resource_y"]
          agent_b_resources = ["resource_y", "resource_x"]

          with assert_raises(DeadlockError):
              # Both agents try to acquire in reverse order
              # Deadlock timeout (5s) triggers
              await asyncio.gather(
                  lock_manager.acquire_multiple(
                      agent_a_resources,
                      agent_id="agent_a",
                      timeout_ms=5000
                  ),
                  lock_manager.acquire_multiple(
                      agent_b_resources,
                      agent_id="agent_b",
                      timeout_ms=5000
                  )
              )

---

# End of timeout_policies.yml
