# Timeout & Deadlock Handling - 4-Level Timeout Hierarchy & Liveness Guarantees
# Purpose: Enforce timeouts at 4 levels to prevent infinite waits and deadlocks
# Source ADR: ADR-0008d (Timeout & Deadlock Handling)
# Layer: Layer 2 - Orchestration (Error Recovery)
#
# Research Citations:
#   - Timeout patterns (Nygard 2007) - Release It!
#   - Deadlock prevention (Havender 1968) - Resource ordering
#   - Liveness properties (Lamport 1977) - Temporal logic

---

# SECTION 1: 4-LEVEL TIMEOUT HIERARCHY

timeout_hierarchy:
  description: "Cascading timeouts at 4 levels for bounded execution"

  levels:
    level_1_step_timeout:
      name: "Step Timeout (Per Tool Call)"
      duration_ms: 30000  # 30 seconds
      description: "Maximum time for a single tool execution"

      scope: "Single step execution"
      example: "API call to book restaurant takes max 30s"

      enforcement: |
        async def execute_step_with_timeout(step, timeout_ms=30000):
          try:
            result = await asyncio.wait_for(
              tool_runner.run_tool(step),
              timeout=timeout_ms / 1000
            )
            return result
          except asyncio.TimeoutError:
            raise StepTimeoutError(f"Step {step.id} exceeded {timeout_ms}ms")

      consequences_of_timeout:
        - "Tool call aborted (incomplete)"
        - "Classified as TRANSIENT error"
        - "Trigger forward recovery (retry with backoff)"
        - "If all retries exhaust → Backward recovery (compensation)"

      performance:
        target_p95_ms: 10000
        target_p99_ms: 25000
        timeout_budget_ms: 30000

    level_2_compensation_timeout:
      name: "Compensation Timeout (Per Compensation Action)"
      duration_ms: 3000  # 3 seconds
      description: "Maximum time for a single compensation"
      ratio: "1/10th of step timeout (fail-fast for compensations)"

      scope: "Single compensation execution"
      example: "Cancel booking API call takes max 3s"

      enforcement: |
        async def execute_compensation_with_timeout(comp, timeout_ms=3000):
          try:
            result = await asyncio.wait_for(
              execute_compensation(comp),
              timeout=timeout_ms / 1000
            )
            return result
          except asyncio.TimeoutError:
            logger.error(f"Compensation {comp.id} timeout")
            return CompensationResult(success=False, error="timeout")

      consequences_of_timeout:
        - "Compensation aborted"
        - "Marked as FAILED in K0 log"
        - "Best-effort: Continue to next compensation"
        - "Failed compensation moved to DLQ for manual review"

      performance:
        target_p95_ms: 500
        target_p99_ms: 2500
        timeout_budget_ms: 3000

    level_3_saga_timeout:
      name: "Saga Timeout (Total Workflow Time)"
      duration_ms: 120000  # 120 seconds
      description: "Maximum total time for entire saga (all steps + compensation)"
      ratio: "4x of longest step (multiple steps + compensations)"

      scope: "Entire workflow from start to terminal state"
      example: "Book dinner workflow (5 steps) with potential compensation, max 120s total"

      breakdown:
        step_execution_budget_ms: 60000    # ~30s per step * 2 steps = 60s
        compensation_budget_ms: 60000      # 5 steps * 3s per compensation = 15s
        overhead_buffer_ms: 0              # Reserve for coordination

      enforcement: |
        class SagaCoordinator:
          async def execute_saga(self, workflow, timeout_ms=120000):
            try:
              result = await asyncio.wait_for(
                self._execute_saga_internal(workflow),
                timeout=timeout_ms / 1000
              )
              return result
            except asyncio.TimeoutError:
              # Saga exceeded total timeout
              # Abort current step + trigger compensation
              raise SagaTimeoutError(f"Saga exceeded {timeout_ms}ms")

      consequences_of_timeout:
        - "Current step aborted (if executing)"
        - "Saga transitions to COMPENSATING"
        - "Execute all pending compensations (best-effort)"
        - "Terminal state: ABORTED"

      performance:
        total_execution_budget_ms: 120000
        components:
          "1-5 steps": "30s per step (30s max single tool)"
          "Retry overhead": "3s (exponential backoff)"
          "Compensation": "15s (5 steps * 3s each)"

    level_4_session_timeout:
      name: "Session Timeout (User Session Lifetime)"
      duration_ms: 600000  # 600 seconds = 10 minutes
      description: "Maximum lifetime of user session (multiple sagas)"
      ratio: "5x of saga timeout (multiple sagas per session)"

      scope: "Entire user session (may contain 1-10 sagas)"
      example: "User session can run multiple workflows, max 10 minutes total"

      enforcement: "Enforced by SessionState manager (ADR-0017)"

      consequences_of_timeout:
        - "Session marked as EXPIRED"
        - "All pending sagas aborted"
        - "Session state persisted to K0 for audit"

---

# SECTION 2: TIMEOUT ENFORCEMENT MECHANISM

timeout_enforcement:
  description: "How timeouts are enforced in practice"

  asyncio_wait_for:
    method: "asyncio.wait_for(awaitable, timeout)"
    behavior: |
      1. Start async operation
      2. If operation completes before timeout → Return result
      3. If timeout reached → Raise asyncio.TimeoutError
      4. Cancel the underlying coroutine (cleanup)

    example_code: |
      async def execute_with_timeout(coro, timeout_ms):
        try:
          result = await asyncio.wait_for(
            coro,
            timeout=timeout_ms / 1000.0
          )
          return result
        except asyncio.TimeoutError:
          # Handle timeout
          logger.error(f"Operation timeout after {timeout_ms}ms")
          raise

  timeout_tracking:
    what: "Track time spent in each phase"
    why: "Cumulative timeouts (level 3 budget consumption)"
    mechanism: |
      saga_start_time = time.time()
      for step in workflow.steps:
        step_start = time.time()
        elapsed_total = (time.time() - saga_start_time) * 1000
        remaining_budget = SAGA_TIMEOUT_MS - elapsed_total

        # Adjust step timeout based on remaining budget
        step_timeout = min(STEP_TIMEOUT_MS, remaining_budget)

        result = await execute_step_with_timeout(step, step_timeout)

        if (time.time() - saga_start_time) * 1000 > SAGA_TIMEOUT_MS:
          raise SagaTimeoutError("Saga budget exhausted")

---

# SECTION 3: DEADLOCK DETECTION

deadlock_detection:
  description: "Detect and prevent deadlocks"

  potential_deadlock_scenarios:
    scenario_1_circular_dependency:
      name: "Circular Step Dependencies"
      example: |
        Workflow:
          - Step A depends on Step B
          - Step B depends on Step C
          - Step C depends on Step A

        Result: Infinite loop (all steps waiting for each other)

      prevention:
        check: "DAG cycle detection before workflow execution"
        algorithm: "Topological sort (fail if cycle detected)"
        error: "WorkflowValidationError: Circular dependency detected"

    scenario_2_resource_deadlock:
      name: "Agents Waiting for Each Other"
      example: |
        Agent A: Waiting for Agent B to complete
        Agent B: Waiting for Agent A to complete
        (both blocked indefinitely)

      prevention:
        mechanism: "Resource ordering (total order on resources)"
        timeout: "Timeout + escalation if deadlock detected"

    scenario_3_lock_contention:
      name: "Multiple Sagas Competing for Same Resource"
      example: |
        Saga 1: Booking hotel X
        Saga 2: Booking hotel X
        (both trying to reserve room 101)

      prevention:
        mechanism: "Pessimistic locking with timeout"
        timeout: "Lock acquire timeout (prevent indefinite wait)"

  detection_mechanisms:
    mechanism_1_dag_validation:
      when: "Before workflow execution"
      check: "Detect cycles in step dependency graph"
      algorithm: "Topological sort via DFS"
      example: |
        def has_cycle(workflow):
          visited = set()
          rec_stack = set()

          def dfs(step_id):
            visited.add(step_id)
            rec_stack.add(step_id)

            step = workflow.get_step(step_id)
            for dep in step.depends_on:
              if dep not in visited:
                if dfs(dep):
                  return True
              elif dep in rec_stack:
                return True  # Cycle detected

            rec_stack.remove(step_id)
            return False

          for step in workflow.steps:
            if step.id not in visited:
              if dfs(step.id):
                return True
          return False

    mechanism_2_timeout_escalation:
      when: "During workflow execution"
      trigger: "Step timeout (step max_retries exhausted)"
      action: "Escalate to saga timeout (abort saga)"
      rationale: "If step hanging despite retries, escalate"

    mechanism_3_liveness_monitor:
      when: "Continuous during execution"
      check: "Saga progress (at least one step completing every 30s)"
      if_no_progress: "Potential deadlock detected"
      action: "Abort saga, trigger compensation"

---

# SECTION 4: LIVENESS GUARANTEES

liveness_guarantees:
  description: "Every saga terminates (reaches COMPLETED or ABORTED state)"

  guarantee_1_bounded_steps:
    constraint: "max_steps_per_saga = 10"
    rationale: "Prevent infinite loops"
    guarantee: "At most 10 steps execute"

  guarantee_2_bounded_retries:
    constraint: "max_retries = 5 per step"
    rationale: "Prevent infinite retry loops"
    guarantee: "At most 5 retries per step"

  guarantee_3_timeout_enforcement:
    constraints:
      - "Step timeout: 30s"
      - "Compensation timeout: 3s"
      - "Saga timeout: 120s"
      - "Session timeout: 600s"
    rationale: "All operations bounded by time"
    guarantee: "Saga completes within 120s (COMPLETED or ABORTED)"

  guarantee_4_deadlock_free:
    constraints:
      - "No circular dependencies (DAG validation)"
      - "Timeouts prevent resource deadlock"
      - "Escalation on hung steps"
    guarantee: "No indefinite waits"

  formal_property: |
    For any saga S with workflow W:
    1. S.state != EXECUTING after 120s
    2. S.state != COMPENSATING after 180s total
    3. S.state in [COMPLETED, ABORTED] (terminal state reached)
    4. If K1 crashes, recovery completes within 90s (60s detection + 30s recovery)

---

# SECTION 5: ERROR HANDLING WITH TIMEOUTS

error_handling:
  timeout_classification:
    step_timeout_error:
      description: "Step exceeded 30s timeout"
      classification: "TRANSIENT (could retry)"
      recovery: "Retry with backoff (exponential)"
      if_all_retries_fail: "Backward recovery (compensation)"

    compensation_timeout_error:
      description: "Compensation exceeded 3s timeout"
      classification: "Best-effort failure"
      recovery: "Log to K0, move to DLQ"
      rationale: "Don't retry (fail-fast), manual intervention"

    saga_timeout_error:
      description: "Saga exceeded 120s total timeout"
      classification: "Terminal failure"
      recovery: "Abort current step, trigger compensations"
      result: "Saga reaches ABORTED state"

---

# SECTION 6: CANONICAL VALUES

canonical_values:
  # Timeout hierarchy (ADR-0008d)
  timeouts:
    level_1_step_ms: 30000
    level_2_compensation_ms: 3000
    level_3_saga_ms: 120000
    level_4_session_ms: 600000

  # Constraints
  max_steps_per_saga: 10
  max_retries_per_step: 5

  # Monitoring
  progress_check_interval_ms: 30000
  deadlock_detection_enabled: true

---

# SECTION 7: ADR CROSS-REFERENCES

adr_references:
  - "ADR-0008d: Timeout & Deadlock Handling (primary)"
  - "ADR-0008: Saga Pattern (parent)"
  - "ADR-0008b: Forward Recovery vs Backward Recovery (retry timeouts)"
  - "ADR-0008c: Distributed State Management (saga state tracking)"
  - "ADR-0007c: Validation Stage (DAG validation)"

