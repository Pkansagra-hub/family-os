# Forward Recovery vs Backward Recovery - Failure Classification & Strategy Selection
# Purpose: Classify failures and select optimal recovery strategy (retry forward vs rollback backward)
# Source ADR: ADR-0008b (Forward Recovery vs Backward Recovery)
# Layer: Layer 2 - Orchestration (Error Recovery)
#
# Research Citations:
#   - Exponential backoff (AWS Architecture Blog 2015)
#   - Circuit breaker pattern (Nygard 2007) - Release It!
#   - Transient vs permanent failures (Azure reliability docs)

---

# SECTION 1: FAILURE CLASSIFICATION

failure_classification:
  description: "Classify failures into 3 types for recovery strategy selection"

  failure_types:

    transient:
      name: "Transient Failures (Retry Forward)"
      description: "Temporary errors that may succeed on retry"

      definition: "Error will likely succeed if operation is retried"

      characteristics:
        - "Temporary network issue (timeout, connection reset)"
        - "Service temporarily degraded (rate limit, resource exhaustion)"
        - "Temporary unavailability (503 Service Unavailable, 504 Gateway Timeout)"
        - "Database connection pool exhausted (temporary)"
        - "Disk full (temporary, auto-cleanup)"

      http_status_codes: [429, 503, 504, 599]

      exceptions:
        - "asyncio.TimeoutError"
        - "aiohttp.ClientError (status in [429, 503, 504])"
        - "ConnectionError"
        - "socket.timeout"
        - "asyncio.CancelledError (before send)"

      recovery_strategy:
        action: "Retry forward (exponential backoff)"
        max_retries: 5
        base_delay_ms: 100
        max_delay_ms: 1600
        jitter_percent: 20
        retry_budget_ms: 10000  # 10s total

      rationale:
        - "Service will likely recover shortly"
        - "Retrying has high probability of success"
        - "No state corruption (transient)"
        - "Cheaper than rollback (no compensations needed)"

      example: "Payment API returns 503 (temporarily down) → Retry 5x with backoff → Success on retry 3"

    permanent:
      name: "Permanent Failures (Rollback Backward)"
      description: "Errors that will never succeed on retry"

      definition: "Error indicates fundamental problem, retry will fail identically"

      characteristics:
        - "Invalid input (400 Bad Request)"
        - "Authentication failure (401 Unauthorized)"
        - "Permission denied (403 Forbidden)"
        - "Resource not found (404 Not Found)"
        - "Validation error (schema mismatch)"
        - "Semantic error (invalid business logic)"

      http_status_codes: [400, 401, 403, 404, 405, 422]

      exceptions:
        - "ValueError (invalid parameter)"
        - "PermissionError (insufficient privileges)"
        - "KeyError (missing field)"
        - "aiohttp.ClientError (status in [400, 401, 403, 404])"

      recovery_strategy:
        action: "Rollback backward (execute compensations)"
        rationale: "Retrying won't help, must undo already completed steps"

      rationale:
        - "Retry won't fix the problem"
        - "Need to clean up partial state (compensations)"
        - "Return clear error to user"

      example: "Booking API returns 401 (auth token invalid) → Don't retry → Rollback → Cancel hotel"

    ambiguous:
      name: "Ambiguous Failures (Depends on Idempotency)"
      description: "Unknown status (unclear if operation succeeded or failed)"

      definition: "Cannot determine if operation succeeded on server side"

      characteristics:
        - "Timeout after request sent (did server process it?)"
        - "Internal server error (500, 502) - may be transient or permanent"
        - "Network partition (client disconnected, server continues)"
        - "Unknown error code"

      http_status_codes: [500, 502]

      exceptions:
        - "asyncio.TimeoutError (after send)"
        - "aiohttp.ClientError (status in [500, 502])"
        - "ConnectionResetError"

      recovery_decision:
        if_idempotent: "Retry forward (safe to re-execute)"
        if_not_idempotent: "Rollback backward (prevent duplicate)"

      rationale:
        - "If idempotent: Server can handle duplicate request → Safe to retry"
        - "If not idempotent: Could cause duplicate charge, double booking → Rollback"

      example_idempotent:
        - "Booking API: Timeout after send, but operation is idempotent (idempotency_key ensures exactly_once)"
        - "Decision: Retry forward (idempotency_key prevents double-booking)"

      example_not_idempotent:
        - "Payment API: Timeout after send, operation is NOT idempotent"
        - "Decision: Rollback backward (retry could cause double-charge)"

---

# SECTION 2: FAILURE CLASSIFIER IMPLEMENTATION

failure_classifier:
  description: "Algorithm for classifying failures"

  algorithm:
    step_1_check_error_type:
      pseudocode: |
        if error is TimeoutError:
          if phase == "before_send":
            return TRANSIENT  # Never reached server
          else:
            return AMBIGUOUS  # Reached server, but timed out waiting for response

    step_2_check_http_status:
      pseudocode: |
        if error is HTTPError:
          if status in [429, 503, 504]:
            return TRANSIENT  # Service degraded
          elif status in [400, 401, 403, 404]:
            return PERMANENT  # Client error
          elif status in [500, 502]:
            return AMBIGUOUS  # Server error (could be transient or permanent)

    step_3_check_exception_type:
      pseudocode: |
        if error is ConnectionError or socket.timeout:
          return TRANSIENT  # Network issue
        elif error is ValueError or PermissionError:
          return PERMANENT  # Semantic error
        else:
          return AMBIGUOUS  # Unknown

  classification_matrix:
    headers: ["Error Type", "Classification", "Retry?"]
    rows:
      - ["asyncio.TimeoutError (before send)", "TRANSIENT", "Yes (5x retry)"]
      - ["asyncio.TimeoutError (after send)", "AMBIGUOUS", "If idempotent"]
      - ["aiohttp.ClientError (429)", "TRANSIENT", "Yes (5x retry)"]
      - ["aiohttp.ClientError (503)", "TRANSIENT", "Yes (5x retry)"]
      - ["aiohttp.ClientError (504)", "TRANSIENT", "Yes (5x retry)"]
      - ["aiohttp.ClientError (400)", "PERMANENT", "No (rollback)"]
      - ["aiohttp.ClientError (401)", "PERMANENT", "No (rollback)"]
      - ["aiohttp.ClientError (403)", "PERMANENT", "No (rollback)"]
      - ["aiohttp.ClientError (404)", "PERMANENT", "No (rollback)"]
      - ["aiohttp.ClientError (500)", "AMBIGUOUS", "If idempotent"]
      - ["aiohttp.ClientError (502)", "AMBIGUOUS", "If idempotent"]
      - ["ValueError", "PERMANENT", "No (rollback)"]
      - ["PermissionError", "PERMANENT", "No (rollback)"]
      - ["ConnectionError", "TRANSIENT", "Yes (5x retry)"]

---

# SECTION 3: FORWARD RECOVERY (RETRY WITH EXPONENTIAL BACKOFF)

forward_recovery:
  description: "Retry transient failures with exponential backoff (ADR-0008b)"

  retry_policy:
    max_retries: 5
    base_delay_ms: 100
    max_delay_ms: 1600
    jitter_percent: 20
    retry_budget_ms: 10000  # 10s total

  retry_sequence:
    example: "5 retries with exponential backoff (100ms, 200ms, 400ms, 800ms, 1600ms)"
    total_time_ms: 3100  # Sum: 100+200+400+800+1600 = 3100ms (~3s)

    retry_1:
      delay_ms: 100
      jitter: "±20% (80-120ms)"
      description: "Quick retry for transient network glitch"

    retry_2:
      delay_ms: 200
      jitter: "±20% (160-240ms)"
      description: "Wait a bit longer if service still recovering"

    retry_3:
      delay_ms: 400
      jitter: "±20% (320-480ms)"
      description: "Service recovery in progress"

    retry_4:
      delay_ms: 800
      jitter: "±20% (640-960ms)"
      description: "Service recovery ongoing"

    retry_5:
      delay_ms: 1600
      jitter: "±20% (1280-1920ms)"
      description: "Final retry before giving up"

  circuit_breaker_integration:
    description: "Check circuit breaker before retrying (ADR-0009)"
    logic: |
      if circuit_breaker.state == OPEN:
        # Don't retry, service is down
        raise CircuitBreakerOpenError()
      elif circuit_breaker.state == HALF_OPEN:
        # Allow this retry as probe
        execute_with_retry()
      elif circuit_breaker.state == CLOSED:
        # Normal retry
        execute_with_retry()

  jitter_purpose:
    description: "Prevent thundering herd problem"
    example: |
      100 concurrent users all retrying at the same time (no jitter)
      → All 100 requests hit server simultaneously
      → Thundering herd, server becomes more overloaded

      With jitter:
      100 concurrent users retry at slightly different times
      → Requests spread out (80-120ms, 160-240ms, etc.)
      → Server recovers gradually, not overwhelmed

---

# SECTION 4: BACKWARD RECOVERY (SAGA COMPENSATION)

backward_recovery:
  description: "Rollback completed steps through compensations (ADR-0008)"

  trigger_conditions:
    - "Permanent error (HTTP 400, 401, 403, 404)"
    - "All retries exhausted (5 retries completed)"
    - "Circuit breaker OPEN (service known to be down)"
    - "Ambiguous error + operation not idempotent"

  compensation_execution:
    order: "Reverse (LIFO stack unwinding)"
    example: |
      Completed steps: [step1, step2, step3]
      Error in: step4

      Compensation order:
      1. Compensate step3 (reverse)
      2. Compensate step2 (reverse)
      3. Compensate step1 (reverse)

  performance:
    per_compensation_timeout_ms: 3000  # ADR-0008d: Level 2 timeout
    total_rollback_time_ms: 15000  # 5 steps * 3s = 15s max

  best_effort_guarantees:
    - "All compensations attempted (don't short-circuit on failure)"
    - "Each compensation logged to K0 WAL"
    - "Compensation failures moved to DLQ for manual intervention"
    - "User informed of partial state (clear error message)"

---

# SECTION 5: HYBRID RECOVERY (RETRY FORWARD → ROLLBACK BACKWARD)

hybrid_recovery:
  description: "Combined strategy: Try forward first, fallback to backward"

  decision_flow:
    step_1_classify_error:
      action: "Classify error as TRANSIENT, PERMANENT, or AMBIGUOUS"

    step_2_permanent_error:
      if_classification: "PERMANENT"
      action: "Skip forward recovery, go directly to backward recovery"
      reason: "Retrying won't help"

    step_3_transient_error:
      if_classification: "TRANSIENT"
      action: "Attempt forward recovery (retry with backoff)"
      check_circuit_breaker: "If circuit OPEN, skip to backward recovery"

    step_4_ambiguous_error:
      if_classification: "AMBIGUOUS"
      if_idempotent: "Attempt forward recovery (safe to retry)"
      if_not_idempotent: "Skip to backward recovery (prevent duplicate)"

    step_5_retry_exhausted:
      if_all_retries_failed: "Trigger backward recovery"
      reason: "Transient error persisted, recovery unlikely"

    step_6_backward_recovery:
      action: "Execute compensations in reverse order"
      result: "Saga rolls back, user informed"

  performance_implications:
    best_case:
      scenario: "Transient error succeeds on retry 1"
      latency_ms: 100  # Just 1 retry delay
      user_experience: "Request takes slightly longer, succeeds"

    worst_case:
      scenario: "Permanent error or all retries exhausted"
      latency_ms: 3100  # All 5 retries + 3s delay (not executed actually because permanent)
      user_experience: "Request takes ~3s, then told request failed and rolled back"

---

# SECTION 6: RECOVERY STRATEGY SELECTOR

recovery_strategy_selector:
  description: "Algorithm for selecting optimal recovery strategy"

  pseudocode: |
    def select_recovery_strategy(error, step, retry_count):
      # Step 1: Classify error
      error_type = classify_error(error)

      # Step 2: Permanent errors → Rollback immediately
      if error_type == PERMANENT:
        return ROLLBACK_BACKWARD

      # Step 3: Transient errors → Check retry budget
      elif error_type == TRANSIENT:
        if retry_count < MAX_RETRIES and total_retry_time < RETRY_BUDGET:
          if circuit_breaker.state != OPEN:
            return RETRY_FORWARD
          else:
            return ROLLBACK_BACKWARD  # Circuit open, don't retry
        else:
          return ROLLBACK_BACKWARD  # Retries exhausted

      # Step 4: Ambiguous errors → Depends on idempotency
      elif error_type == AMBIGUOUS:
        if step.is_idempotent():
          if retry_count < MAX_RETRIES:
            return RETRY_FORWARD
          else:
            return ROLLBACK_BACKWARD  # Retries exhausted
        else:
          return ROLLBACK_BACKWARD  # Not idempotent, don't retry

      # Default
      return ROLLBACK_BACKWARD

---

# SECTION 7: CANONICAL VALUES

canonical_values:
  # Retry policy (ADR-0008b)
  retry:
    max_retries: 5
    base_delay_ms: 100
    max_delay_ms: 1600
    jitter_percent: 20
    retry_budget_ms: 10000

  # Compensation (ADR-0008)
  compensation:
    timeout_ms: 3000
    total_rollback_budget_ms: 60000

  # Classification
  transient_status_codes: [429, 503, 504]
  permanent_status_codes: [400, 401, 403, 404]
  ambiguous_status_codes: [500, 502]

---

# SECTION 8: ADR CROSS-REFERENCES

adr_references:
  - "ADR-0008b: Forward Recovery vs Backward Recovery (primary)"
  - "ADR-0008: Saga Pattern (parent)"
  - "ADR-0008a: Compensating Transaction Design (backward recovery)"
  - "ADR-0008d: Timeout & Deadlock Handling (timeout budgets)"
  - "ADR-0009: Circuit Breaker Pattern (circuit integration)"

