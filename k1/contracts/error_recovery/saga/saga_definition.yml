# Saga Pattern Definition - Saga Workflow Structure & State Machine
# Purpose: Define saga execution model for long-running, multi-step transactions
# Source ADR: ADR-0008 (Saga Pattern for Error Recovery)
# Layer: Layer 2 - Orchestration (Saga Coordinator, Pure Actor)
#
# Research Citations:
#   - Garcia-Molina & Salem (1987): Sagas - Long-lived database transactions
#   - Temporal.io (Uber, 2020): Durable execution with compensation support
#   - AWS Step Functions: Managed saga orchestration

---

# SECTION 1: SAGA ARCHITECTURE OVERVIEW

architecture:
  description: "Saga pattern for error recovery in multi-step workflows"

  saga_coordinator:
    type: "Pure Actor (not AI agent)"
    location: "k1/orchestrator/saga.py"
    responsibility: "Orchestrate execution of workflow steps + trigger compensations on failure"
    model_calls: false
    determinism: "deterministic (LIFO stack unwinding)"
    latency_budget_ms:
      compensation_trigger: 5
      step_coordination: 1

  hybrid_architecture:
    description: "Saga coordinates both AI agent steps and pure actor steps"
    ai_agent_steps:
      examples: ["planner.refine_plan", "safety_watch.filter_outputs", "model_hub.inference"]
      compensation: "May involve LLM reasoning (50-500ms)"
    pure_actor_steps:
      examples: ["tool_runner.execute_api", "calendar.create_event", "payment.charge"]
      compensation: "Direct API calls (API cancel <100ms)"

---

# SECTION 2: SAGA STATE MACHINE

state_machine:
  description: "Finite state machine for saga lifecycle"

  states:
    EXECUTING:
      description: "Normal execution phase - running workflow steps"
      transitions_to:
        - COMPLETED    # All steps succeeded
        - COMPENSATING # Step failed, begin rollback
        - CRASHED      # K1 process crashed
      duration_budget_ms: 120000  # 120s per saga (ADR-0008d)

    COMPENSATING:
      description: "Error recovery phase - rolling back completed steps"
      transitions_to:
        - ABORTED  # All compensations complete (success or best-effort)
        - CRASHED  # K1 crashed mid-compensation
      duration_budget_ms: 60000   # 60s for full compensation (5 steps * 3s per compensation)

    COMPLETED:
      description: "Terminal state - all steps succeeded"
      transitions_to: []

    ABORTED:
      description: "Terminal state - saga rolled back (step failed, compensations attempted)"
      transitions_to: []

    CRASHED:
      description: "K1 process crashed - pending recovery"
      transitions_to:
        - COMPENSATING  # Recovery resumes compensation
        - ABORTED       # Recovery completes

  state_transition_log:
    enabled: true
    persistence: "K0 WAL (SAGA_LOG topic)"
    retention_days: 7

---

# SECTION 3: WORKFLOW DEFINITION SCHEMA

workflow_definition:
  schema_name: "WorkflowDef"
  description: "Complete workflow specification with steps and compensation"

  fields:
    workflow_id:
      type: "string"
      required: true
      description: "Unique workflow identifier"
      pattern: "^[a-z_][a-z0-9_-]*$"
      example: "book_dinner_workflow"

    name:
      type: "string"
      required: true
      description: "Human-readable workflow name"
      example: "Book Dinner + Add Calendar + Notify"

    description:
      type: "string"
      required: false
      description: "Detailed workflow purpose"
      example: "Multi-step reservation workflow with calendar sync and confirmation"

    version:
      type: "string"
      required: true
      description: "Semantic version (MAJOR.MINOR.PATCH)"
      example: "1.0.0"

    owner:
      type: "string"
      required: true
      description: "Owner team/service"
      example: "planner_agent"

    max_steps:
      type: "integer"
      required: false
      default: 10
      description: "Maximum steps per workflow (prevent infinite loops)"
      minimum: 1
      maximum: 50

    timeout_ms:
      type: "integer"
      required: true
      default: 120000
      description: "Total workflow timeout (ADR-0008d: Level 3 timeout)"
      minimum: 1000
      maximum: 600000

    steps:
      type: "array of StepDef"
      required: true
      description: "Ordered list of workflow steps"
      minItems: 1
      maxItems: 50

    pre_execution_hooks:
      type: "array of Hook"
      required: false
      description: "Hooks run before workflow execution"
      examples:
        - "validate_user_permissions"
        - "acquire_resource_lock"

    post_completion_hooks:
      type: "array of Hook"
      required: false
      description: "Hooks run after successful completion"
      examples:
        - "send_confirmation_email"
        - "log_analytics_event"

    post_abort_hooks:
      type: "array of Hook"
      required: false
      description: "Hooks run after abort (after compensations complete)"
      examples:
        - "notify_user_of_failure"
        - "release_resource_lock"

---

# SECTION 4: STEP DEFINITION SCHEMA

step_definition:
  schema_name: "StepDef"
  description: "Individual step with optional compensation"

  fields:
    step_id:
      type: "string"
      required: true
      description: "Unique step identifier within workflow"
      pattern: "^step_[0-9]+$|^[a-z_][a-z0-9_]*$"
      example: "book_hotel"

    action:
      type: "enum"
      required: true
      allowed_values:
        - "tool_call"        # Execute tool (weather API, booking API, etc.)
        - "agent_call"       # Delegate to AI agent (planner, safety watch)
        - "api_call"         # Direct API call
        - "custom_logic"     # Custom Python logic
      example: "tool_call"

    tool_id:
      type: "string"
      required: true   # if action = tool_call
      description: "Tool identifier from tool_registry (ADR-0007b)"
      example: "book_hotel"

    parameters:
      type: "object"
      required: true
      description: "Step parameters with support for template substitution"
      properties:
        _template_syntax: "Jinja2 with access to {{previous_step.result}}"
        _example: "{{step_search_hotels.result[0].hotel_id}}"
      example:
        hotel_id: "{{step_search_hotels.result[0].hotel_id}}"
        check_in_date: "2025-10-20"
        party_size: 2

    timeout_ms:
      type: "integer"
      required: false
      default: 30000
      description: "Step execution timeout (ADR-0008d: Level 1 timeout)"
      minimum: 1000
      maximum: 120000

    side_effects:
      type: "string"
      required: true
      allowed_values:
        - "read_only"        # No side effects (search, read, query)
        - "write_external"   # Modifies external state (booking, payment)
        - "write_internal"   # Modifies internal state (database write)
      description: "Declares if step modifies external state"
      example: "write_external"

    retry_policy:
      type: "object"
      required: false
      description: "Retry configuration for transient failures (ADR-0008b)"
      properties:
        max_retries:
          type: "integer"
          default: 5
          description: "Maximum retry attempts"
        base_delay_ms:
          type: "integer"
          default: 100
          description: "Initial backoff delay (exponential)"
        max_delay_ms:
          type: "integer"
          default: 1600
          description: "Maximum backoff delay"
        jitter_percent:
          type: "integer"
          default: 20
          description: "Jitter to prevent thundering herd (±%)"

    compensation:
      type: "CompensationDef"
      required: true   # if side_effects != read_only
      description: "Compensation action if step fails (ADR-0008a)"

    idempotency:
      type: "object"
      required: true   # if side_effects = write
      description: "Idempotency configuration for safe retries"
      properties:
        required:
          type: "boolean"
          default: true
        semantics:
          type: "enum"
          allowed_values: ["exactly_once", "at_least_once", "at_most_once"]
          default: "exactly_once"
        key_template:
          type: "string"
          description: "Template for generating idempotency key"
          example: "session:{{user_id}}:hotel:{{hotel_id}}:{{check_in_date}}"

    depends_on:
      type: "array of string"
      required: false
      description: "Step IDs that must complete before this step"
      examples:
        - "search_hotels"
        - "validate_dates"

    conditional_execution:
      type: "object"
      required: false
      description: "Execute step only if condition is true"
      properties:
        condition:
          type: "string"
          description: "Boolean expression (access to previous results)"
          example: "{{step_search_hotels.result | length > 0}}"
        skip_compensation:
          type: "boolean"
          description: "Skip compensation if condition was false"

---

# SECTION 5: COMPENSATION DEFINITION SCHEMA

compensation_definition:
  schema_name: "CompensationDef"
  description: "Compensation action to undo step on failure (ADR-0008a)"

  fields:
    compensation_id:
      type: "string"
      required: true
      description: "Unique compensation identifier"
      example: "cancel_hotel_booking"

    action:
      type: "enum"
      required: true
      allowed_values:
        - "tool_call"        # Execute compensation tool
        - "api_call"         # Direct HTTP API call
        - "custom_logic"     # Custom Python handler
        - "noop"             # No-op (read-only step)
      example: "tool_call"

    # Tool-based compensation
    tool_id:
      type: "string"
      required: false   # if action = tool_call
      description: "Compensation tool ID (tool_registry)"
      example: "cancel_booking"

    # API-based compensation
    endpoint:
      type: "string"
      required: false   # if action = api_call
      description: "HTTP endpoint for compensation"
      example: "https://booking-api.com/v1/bookings/{booking_id}"

    method:
      type: "enum"
      required: false   # if action = api_call
      allowed_values: ["GET", "POST", "PUT", "DELETE", "PATCH"]
      example: "DELETE"

    # Custom compensation
    handler_function:
      type: "string"
      required: false   # if action = custom_logic
      description: "Module path to handler"
      example: "k1.compensation.handlers.rollback_database_write"

    # Parameters mapping
    params_mapping:
      type: "object"
      required: true
      description: "Map compensation parameters from step result"
      properties:
        _syntax: "Dot notation for nested access"
        _example: "result.booking_id maps to {{step_result.booking_id}}"
      example:
        booking_id: "result.booking_id"
        amount: "result.charge_amount"

    timeout_ms:
      type: "integer"
      required: false
      default: 3000
      description: "Compensation execution timeout (ADR-0008d: Level 2 timeout)"
      minimum: 500
      maximum: 30000

    idempotency:
      type: "object"
      required: true
      description: "Idempotency for safe compensation replay"
      properties:
        enabled: true
        window_seconds: 300  # 5-minute deduplication window (ADR-0008a)
        backend: "redis"     # Deduplication cache (Redis)

---

# SECTION 6: CANONICAL SAGA EXAMPLES

examples:
  - saga_id: "book_dinner_example"
    workflow_id: "book_dinner_workflow"
    name: "Book Dinner + Calendar + Notify"
    steps:
      # Step 1: Search (read-only, no compensation)
      - step_id: "search_restaurants"
        action: "tool_call"
        tool_id: "search_restaurants"
        parameters:
          cuisine: "italian"
          location: "San Francisco"
          party_size: 4
        side_effects: "read_only"
        compensation: null  # No compensation for read-only
        timeout_ms: 5000

      # Step 2: Book Reservation (write, needs compensation)
      - step_id: "book_reservation"
        action: "tool_call"
        tool_id: "book_restaurant"
        parameters:
          restaurant_id: "{{step_search_restaurants.result[0].id}}"
          date: "2025-10-25"
          time: "7pm"
          party_size: 4
        side_effects: "write_external"
        timeout_ms: 10000
        retry_policy:
          max_retries: 3
          base_delay_ms: 100
        idempotency:
          required: true
          semantics: "exactly_once"
          key_template: "session:{{user_id}}:booking:{{restaurant_id}}:{{date}}:{{time}}"
        compensation:
          compensation_id: "cancel_booking"
          action: "tool_call"
          tool_id: "cancel_restaurant_booking"
          params_mapping:
            booking_id: "result.booking_id"
          timeout_ms: 3000
          idempotency:
            enabled: true
            window_seconds: 300

      # Step 3: Add to Calendar (write, needs compensation)
      - step_id: "create_calendar_event"
        action: "tool_call"
        tool_id: "create_calendar_event"
        parameters:
          title: "Dinner at {{step_search_restaurants.result[0].name}}"
          start_time: "{{step_book_reservation.result.reservation_time}}"
          duration_minutes: 120
          location: "{{step_search_restaurants.result[0].address}}"
        side_effects: "write_external"
        timeout_ms: 5000
        compensation:
          compensation_id: "delete_calendar_event"
          action: "tool_call"
          tool_id: "delete_calendar_event"
          params_mapping:
            event_id: "result.event_id"
          timeout_ms: 2000

      # Step 4: Send Confirmation (side effect, but best-effort)
      - step_id: "send_confirmation"
        action: "tool_call"
        tool_id: "send_email"
        parameters:
          to: "{{user_email}}"
          subject: "Your Reservation at {{step_search_restaurants.result[0].name}}"
          body: "Confirmed for {{step_book_reservation.result.reservation_time}}"
        side_effects: "write_external"
        timeout_ms: 3000
        compensation:
          # Email cannot be unsent, so mark as noop
          action: "noop"

    # Total workflow timeout
    timeout_ms: 120000  # 120s total (ADR-0008d: Level 3)

    # Saga execution:
    # 1. ✅ search_restaurants (1s, read-only)
    # 2. ✅ book_reservation (2s, write, compensation defined)
    # 3. ❌ create_calendar_event (TIMEOUT after 5s, calendar API down)
    #    → TRIGGER COMPENSATION:
    #    → Compensate step 2: cancel_booking (2s)
    # 4. ❌ send_confirmation (NOT EXECUTED, aborted after step 3 failure)
    # RESULT: Saga aborted, restaurant booking cancelled, no orphaned state

---

# SECTION 7: SAGA EXECUTION FLOW

execution_flow:
  description: "Standard saga execution lifecycle"

  phases:
    1_initialization:
      steps:
        - "Create saga_id (UUID)"
        - "Load workflow_id from registry"
        - "Validate workflow (all steps have compensation if side_effects != read_only)"
        - "Initialize saga_log with state = EXECUTING"
        - "Start heartbeat (10s interval, ADR-0008c)"
      duration_ms: "<10ms"
      error_handling: "Fail synchronously before execution"

    2_step_execution:
      steps:
        - "For each step in workflow.steps (in order):"
        - "  1. Evaluate template parameters (Jinja2 rendering)"
        - "  2. Execute with timeout (asyncio.wait_for, ADR-0008d)"
        - "  3. On SUCCESS: Add step to completion_stack, write to K0, continue"
        - "  4. On TIMEOUT: Classify as TRANSIENT, retry with backoff (ADR-0008b)"
        - "  5. On PERMANENT ERROR: Trigger compensation (ADR-0008b)"
      loop: "Until all steps complete or failure detected"
      error_handling: "Catch exceptions, classify, decide retry vs rollback"

    3_compensation_on_failure:
      steps:
        - "Trigger backward recovery (step N failed)"
        - "Set saga state = COMPENSATING"
        - "For each completed step (in REVERSE order, LIFO stack):"
        - "  1. Retrieve compensation from step definition"
        - "  2. Build compensation parameters from step result"
        - "  3. Execute compensation with timeout (3s, ADR-0008d)"
        - "  4. Check idempotency (Redis, 5-min window, ADR-0008a)"
        - "  5. Log compensation to K0 WAL (COMPENSATION_LOG)"
        - "  6. Continue to next compensation (best-effort, don't short-circuit)"
      error_handling: "Best-effort - log failures but continue"

    4_completion_or_abort:
      steps:
        - "If all steps succeeded:"
        - "  - Set state = COMPLETED"
        - "  - Write to K0 (SAGA_LOG topic)"
        - "  - Stop heartbeat"
        - "If any step failed and compensations complete:"
        - "  - Set state = ABORTED"
        - "  - Write to K0 (SAGA_LOG topic)"
        - "  - Generate user-friendly error message"
        - "  - Stop heartbeat"
      error_handling: "Always write final state to K0 (audit trail)"

---

# SECTION 8: PERFORMANCE BUDGETS

performance:
  saga_orchestration:
    step_coordination_latency_ms: 1  # Pure actor overhead
    compensation_trigger_latency_ms: 5
    total_saga_latency_target_ms: 120000  # 120s max (ADR-0008d)

  step_execution:
    tool_call_timeout_ms: 30000  # 30s (ADR-0008d: Level 1)
    tool_call_p95_ms: 10000
    tool_call_p99_ms: 25000

  compensation:
    compensation_timeout_ms: 3000  # 3s (ADR-0008d: Level 2)
    compensation_p95_ms: 500
    compensation_p99_ms: 2500
    compensation_rate_target: 0.95  # 95% success rate

  saga_log_persistence:
    wal_write_latency_ms: 5  # K0 WAL write
    wal_retention_days: 7

---

# SECTION 9: ERROR HANDLING & USER MESSAGING

error_handling:
  transient_errors:
    examples:
      - "Network timeout"
      - "Rate limit (HTTP 429)"
      - "Service temporarily unavailable (HTTP 503)"
    strategy: "Retry forward (exponential backoff, max 5 retries)"
    user_message: "Please wait, we're retrying your request..."

  permanent_errors:
    examples:
      - "Invalid input (HTTP 400)"
      - "Permission denied (HTTP 403)"
      - "Resource not found (HTTP 404)"
    strategy: "Rollback backward (execute compensations)"
    user_message: "Your request couldn't be completed. We've cancelled any reservations."

  compensation_failures:
    strategy: "Best-effort, log to DLQ for support team review"
    user_message: "We encountered an issue while rolling back. Our support team has been notified."

---

# SECTION 10: ADR CROSS-REFERENCES

adr_references:
  - "ADR-0008: Saga Pattern for Error Recovery (parent)"
  - "ADR-0008a: Compensating Transaction Design (handlers, registry)"
  - "ADR-0008b: Forward Recovery vs Backward Recovery (retry strategy)"
  - "ADR-0008c: Distributed State Management (crash recovery, heartbeat)"
  - "ADR-0008d: Timeout & Deadlock Handling (timeout hierarchy)"
  - "ADR-0009: Circuit Breaker Pattern (failure prevention)"
  - "ADR-0006: 3-Phase Orchestration (Phase 3 execution integration)"
  - "ADR-0007b: Tool Registry (tool_id reference)"
  - "ADR-0001a: K0 Bridge (saga_log persistence, SAGA_LOG topic)"

---

# END OF saga_definition.yml
