# Compensating Transaction Design - Handler Types & Registry
# Purpose: Define compensation handler patterns and registry for 50+ tools
# Source ADR: ADR-0008a (Compensating Transaction Design)
# Layer: Layer 2 - Orchestration (Error Recovery)
#
# Research Citations:
#   - Korth et al. (1990): Semantic-based transaction management
#   - Garcia-Molina & Salem (1987): Sagas
#   - Temporal.io (Uber, 2020): Compensation handler patterns

---

# SECTION 1: COMPENSATION HANDLER TYPES

handler_types:
  description: "4 compensation handler patterns for different use cases"

  type_1_tool_based:
    name: "Tool-Based Compensation"
    description: "Execute existing tool from tool_registry as compensation"
    use_case: "Pair of tools: write tool + undo tool (e.g., book + cancel)"

    schema:
      tool_id:
        type: "string"
        description: "Compensation tool ID from tool_registry"
        example: "cancel_booking"
      params_mapping:
        type: "object"
        description: "Map step result to compensation parameters"
        example:
          booking_id: "result.booking_id"
          reason: "'Saga compensation'"
      timeout_ms:
        type: "integer"
        default: 3000
        description: "Compensation execution timeout"

    execution_flow:
      - "1. Get original step result"
      - "2. Apply params_mapping (extract values from result)"
      - "3. Call tool_runner.run_tool(tool_id, params)"
      - "4. Await with timeout (3s, ADR-0008d)"
      - "5. Log result to K0 WAL (COMPENSATION_LOG topic)"

    examples:
      - original_tool: "book_restaurant"
        compensation_tool: "cancel_restaurant_booking"
        params_mapping:
          booking_id: "result.booking_id"

      - original_tool: "reserve_flight"
        compensation_tool: "cancel_flight_reservation"
        params_mapping:
          reservation_id: "result.reservation_id"

      - original_tool: "create_calendar_event"
        compensation_tool: "delete_calendar_event"
        params_mapping:
          event_id: "result.event_id"

  type_2_api_based:
    name: "API-Based Compensation"
    description: "Custom HTTP API call for compensation"
    use_case: "No dedicated undo tool, but service has DELETE/cancel endpoint"

    schema:
      endpoint:
        type: "string"
        description: "HTTP endpoint URL (supports templating)"
        example: "https://payment-api.com/v1/transactions/{transaction_id}/refund"
      method:
        type: "enum"
        allowed_values: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        description: "HTTP method"
        example: "POST"
      headers:
        type: "object"
        description: "Additional HTTP headers"
        example:
          "Authorization": "Bearer {{api_key}}"
          "Idempotency-Key": "{{transaction_id}}"
      payload_mapping:
        type: "object"
        description: "Map step result to HTTP request payload"
        example:
          transaction_id: "result.transaction_id"
          amount: "result.amount"
          reason: "'Saga compensation'"
      timeout_ms:
        type: "integer"
        default: 3000

    execution_flow:
      - "1. Template endpoint URL with step result"
      - "2. Build HTTP payload from payload_mapping"
      - "3. Add headers (include Idempotency-Key)"
      - "4. Execute HTTP request (aiohttp)"
      - "5. Check response status (2xx = success)"
      - "6. Log to K0 WAL"

    examples:
      - endpoint: "https://payment-api.com/v1/transactions/{transaction_id}/refund"
        method: "POST"
        payload_mapping:
          transaction_id: "result.transaction_id"
          amount: "result.amount"
          reason: "'Saga compensation'"

      - endpoint: "https://booking-api.com/v1/bookings/{booking_id}"
        method: "DELETE"
        payload_mapping:
          booking_id: "result.booking_id"
          reason: "'Saga compensation'"

  type_3_custom_logic:
    name: "Custom Compensation"
    description: "Application-specific Python handler for complex compensation"
    use_case: "Semantic compensation (e.g., database rollback, state machine reset)"

    schema:
      handler_function:
        type: "string"
        description: "Module path to handler function"
        example: "k1.compensation.handlers.rollback_database_write"
      params_mapping:
        type: "object"
        description: "Map step result to handler parameters"
        example:
          user_id: "step.parameters.user_id"
          old_value: "result.old_value"
      timeout_ms:
        type: "integer"
        default: 3000

    handler_signature:
      description: "Handler function signature"
      signature: "async def handler(params: Dict, trace_id: str) -> CompensationResult"
      returns: "CompensationResult(success: bool, error_message: str)"

    execution_flow:
      - "1. Load handler from compensation registry"
      - "2. Apply params_mapping"
      - "3. Call handler(params, trace_id)"
      - "4. Await with timeout (3s)"
      - "5. Log to K0 WAL"

    examples:
      - handler: "k1.compensation.handlers.rollback_database_write"
        params_mapping:
          table: "step.parameters.table"
          record_id: "result.record_id"
          old_values: "result.old_values"

      - handler: "k1.compensation.handlers.restore_user_profile"
        params_mapping:
          user_id: "step.parameters.user_id"
          backup_version: "result.backup_version"

  type_4_noop:
    name: "No-Op Compensation"
    description: "Read-only steps have no compensation (idempotent, no side effects)"
    use_case: "Search tools, query tools, read operations"

    reasoning:
      - "No external state modified → No need to compensate"
      - "Safe to re-execute (idempotent)"
      - "Reduces complexity (fewer compensations)"

    examples:
      - tool_id: "search_web"
        reason: "Read-only search"

      - tool_id: "read_file"
        reason: "Read-only file operation"

      - tool_id: "query_database"
        reason: "Read-only query"

---

# SECTION 2: COMPENSATION REGISTRY (50+ TOOLS)

compensation_registry:
  description: "Central registry of 50+ tools with compensation handlers"
  total_tools: 50
  categorization: "By domain (booking, calendar, payment, file, email, database)"

  tool_categories:

    booking_domain:
      category: "Booking & Reservation Services"
      tools:
        - tool_id: "book_hotel"
          compensation:
            type: "tool_based"
            compensation_tool: "cancel_booking"
            params_mapping:
              booking_id: "result.booking_id"
            timeout_ms: 3000
          idempotency:
            semantics: "exactly_once"
            window_seconds: 300

        - tool_id: "reserve_flight"
          compensation:
            type: "tool_based"
            compensation_tool: "cancel_flight"
            params_mapping:
              reservation_id: "result.reservation_id"
            timeout_ms: 3000

        - tool_id: "book_restaurant"
          compensation:
            type: "tool_based"
            compensation_tool: "cancel_reservation"
            params_mapping:
              booking_id: "result.booking_id"
            timeout_ms: 3000

        - tool_id: "book_rental_car"
          compensation:
            type: "tool_based"
            compensation_tool: "cancel_rental"
            params_mapping:
              reservation_id: "result.reservation_id"
            timeout_ms: 3000

    calendar_domain:
      category: "Calendar & Event Management"
      tools:
        - tool_id: "create_calendar_event"
          compensation:
            type: "tool_based"
            compensation_tool: "delete_calendar_event"
            params_mapping:
              event_id: "result.event_id"
            timeout_ms: 2000

        - tool_id: "update_calendar_event"
          compensation:
            type: "custom_logic"
            handler_function: "k1.compensation.handlers.restore_calendar_event"
            params_mapping:
              event_id: "result.event_id"
              previous_state: "result.previous_state"
            timeout_ms: 2000

        - tool_id: "add_calendar_attendee"
          compensation:
            type: "tool_based"
            compensation_tool: "remove_calendar_attendee"
            params_mapping:
              event_id: "result.event_id"
              attendee_email: "step.parameters.attendee_email"
            timeout_ms: 2000

    payment_domain:
      category: "Payment & Financial Transactions"
      tools:
        - tool_id: "charge_payment"
          compensation:
            type: "api_based"
            endpoint: "https://payment-api.com/v1/transactions/{transaction_id}/refund"
            method: "POST"
            headers:
              "Idempotency-Key": "{{transaction_id}}"
            payload_mapping:
              transaction_id: "result.transaction_id"
              amount: "result.amount"
              reason: "'Saga compensation'"
            timeout_ms: 5000
          idempotency:
            semantics: "exactly_once"
            window_seconds: 300  # Critical: prevent double-refunds

        - tool_id: "add_funds_to_account"
          compensation:
            type: "api_based"
            endpoint: "https://finance-api.com/v1/accounts/{account_id}/withdraw"
            method: "POST"
            payload_mapping:
              account_id: "result.account_id"
              amount: "result.amount_added"
            timeout_ms: 5000

        - tool_id: "reserve_budget"
          compensation:
            type: "tool_based"
            compensation_tool: "release_budget"
            params_mapping:
              budget_id: "result.budget_id"
            timeout_ms: 3000

    file_domain:
      category: "File & Document Operations"
      tools:
        - tool_id: "write_file"
          compensation:
            type: "tool_based"
            compensation_tool: "delete_file"
            params_mapping:
              file_id: "result.file_id"
            timeout_ms: 2000

        - tool_id: "upload_file"
          compensation:
            type: "tool_based"
            compensation_tool: "delete_upload"
            params_mapping:
              upload_id: "result.upload_id"
            timeout_ms: 2000

        - tool_id: "create_folder"
          compensation:
            type: "tool_based"
            compensation_tool: "delete_folder"
            params_mapping:
              folder_id: "result.folder_id"
            timeout_ms: 2000

    email_domain:
      category: "Email & Communication"
      tools:
        - tool_id: "send_email"
          compensation:
            type: "api_based"
            endpoint: "https://email-api.com/v1/messages/{message_id}/recall"
            method: "POST"
            payload_mapping:
              message_id: "result.message_id"
              reason: "'Saga compensation (best-effort recall)'"
            timeout_ms: 10000
          note: "Best-effort recall (not guaranteed)"

        - tool_id: "schedule_email"
          compensation:
            type: "tool_based"
            compensation_tool: "cancel_scheduled_email"
            params_mapping:
              scheduled_id: "result.scheduled_id"
            timeout_ms: 2000

    database_domain:
      category: "Database & Internal State"
      tools:
        - tool_id: "database_insert"
          compensation:
            type: "custom_logic"
            handler_function: "k1.compensation.handlers.database_delete"
            params_mapping:
              table: "step.parameters.table"
              record_id: "result.record_id"
            timeout_ms: 3000

        - tool_id: "database_update"
          compensation:
            type: "custom_logic"
            handler_function: "k1.compensation.handlers.database_restore"
            params_mapping:
              table: "step.parameters.table"
              record_id: "result.record_id"
              old_values: "result.old_values"
            timeout_ms: 3000

        - tool_id: "database_delete"
          compensation:
            type: "custom_logic"
            handler_function: "k1.compensation.handlers.database_restore"
            params_mapping:
              table: "step.parameters.table"
              record_id: "result.record_id"
              deleted_record: "result.deleted_record"
            timeout_ms: 3000

    read_only_domain:
      category: "Read-Only Operations (No Compensation)"
      tools:
        - tool_id: "search_web"
          compensation:
            type: "noop"

        - tool_id: "read_file"
          compensation:
            type: "noop"

        - tool_id: "get_weather"
          compensation:
            type: "noop"

        - tool_id: "list_events"
          compensation:
            type: "noop"

        - tool_id: "query_database"
          compensation:
            type: "noop"

        - tool_id: "search_restaurants"
          compensation:
            type: "noop"

        - tool_id: "search_flights"
          compensation:
            type: "noop"

        - tool_id: "search_hotels"
          compensation:
            type: "noop"

---

# SECTION 3: IDEMPOTENT COMPENSATION EXECUTION

idempotent_execution:
  description: "Prevent duplicate compensations through deduplication (ADR-0008a)"

  idempotency_key_format:
    template: "{saga_id}:{step_id}:{compensation_id}"
    example: "saga_12345:step_2:cancel_booking"
    scope: "Single compensation execution"
    window_seconds: 300  # 5-minute deduplication window

  deduplication_process:
    step_1_generate_key:
      action: "Generate idempotency key from saga_id, step_id, compensation_id"
      code: "idempotency_key = f'{saga_id}:{step_id}:{compensation_id}'"

    step_2_check_cache:
      action: "Query Redis for cached compensation result"
      code: "cached_result = await redis.get(idempotency_key)"
      if_found: "Return cached result (skip execution)"
      if_not_found: "Continue to step 3"

    step_3_execute:
      action: "Execute compensation (only if not in cache)"
      code: "comp_result = await execute_compensation(...)"

    step_4_cache_result:
      action: "Cache result in Redis (5-minute TTL)"
      code: "await redis.setex(idempotency_key, 300, comp_result.to_json())"

    step_5_return:
      action: "Return compensation result"

  performance:
    cache_check_latency_ms: "<1"
    cache_write_latency_ms: "<1"
    total_overhead_ms: "<2"

  idempotency_guarantee:
    semantic: "Idempotent compensation execution"
    benefit: "Safe to retry compensations after K1 crash (ADR-0008c)"
    example: "If K1 crashes while compensating, recovery coordinator replays → Redis prevents double-refund"

---

# SECTION 4: AUDIT TRAIL (K0 WAL PERSISTENCE)

audit_trail:
  description: "Log all compensations to K0 for audit and debugging (ADR-0008a)"

  compensation_log_schema:
    topic: "COMPENSATION_LOG"
    retention_days: 30
    format: "FlatBuffers (compensation_log.fbs)"
    fields:
      - compensation_id: "UUID for this compensation execution"
      - saga_id: "Parent saga ID"
      - step_id: "Original step ID"
      - tool_id: "Original tool that failed"
      - compensation_type: "TOOL, API, CUSTOM, NOOP"
      - started_at: "Unix timestamp (ms)"
      - completed_at: "Unix timestamp (ms)"
      - latency_ms: "Execution latency"
      - success: "true if compensation succeeded, false otherwise"
      - error_message: "Error message if failed"
      - trace_id: "For correlation with step execution"

  write_frequency:
    when: "After every compensation execution"
    idempotency_key: "compensation_id (prevent duplicate writes)"

  query_examples:
    query_1: "Get all compensations for saga X"
    query_2: "Get compensations with status=FAILED (investigate failed rollbacks)"
    query_3: "Get compensation latency histogram (performance analysis)"
    query_4: "Get compensation success rate by tool (identify fragile tools)"

  audit_use_cases:
    - "Compliance: GDPR requires audit trail of all operations"
    - "Debugging: Why didn't compensation run? Check K0 logs"
    - "Performance: Identify slow compensations (optimize timeouts)"
    - "Reliability: Track compensation success rate (SLO monitoring)"

---

# SECTION 5: COMPENSATION REGISTRY INITIALIZATION

registry_initialization:
  description: "How compensation registry is loaded and maintained"

  initialization_flow:
    step_1: "Load tool_registry_schema.yml (source of truth for tools)"
    step_2: "For each tool with side_effects='write_external' or 'write_internal':"
    step_3: "  - Check if compensation defined"
    step_4: "  - Validate compensation handler"
    step_5: "  - Register in compensation_registry"
    step_6: "Log any tools with missing compensation (linting warning)"

  validation_rules:
    rule_1: "All write tools MUST have compensation defined (linting rule)"
    rule_2: "Compensation tool MUST exist in tool_registry"
    rule_3: "Params mapping MUST reference valid step result fields"
    rule_4: "Timeout MUST be < step timeout (e.g., compensation 3s < step 30s)"

  linting_warnings:
    - "Tool {{tool_id}} has side_effects='write' but NO compensation defined"
    - "Compensation tool {{comp_tool}} not found in tool_registry"
    - "Parameter {{param}} not found in step result schema"

---

# SECTION 6: ERROR HANDLING & BEST-EFFORT COMPENSATION

error_handling:
  philosophy: "Best-effort compensation (continue on failure)"

  compensation_timeout:
    scenario: "Compensation exceeds 3s timeout"
    action: "Log timeout error, mark as FAILED, continue to next compensation"
    rationale: "Don't cascade: 1 slow compensation shouldn't block all others"

  compensation_failure:
    scenario: "Compensation tool returns error"
    action: "Log error, mark as FAILED, continue to next compensation"
    rationale: "Compensate as much as possible, manual intervention for rest"

  idempotency_check_failure:
    scenario: "Redis cache check fails"
    action: "Proceed with compensation (assume not executed)"
    rationale: "Better to compensate twice than not at all"

  manual_intervention:
    dlq_queue: "COMPENSATION_DLQ"
    criteria: "Compensation failed 3+ times"
    action: "Move to DLQ, alert support team"
    resolution: "Support manually investigates and completes compensation"

---

# SECTION 7: CANONICAL VALUES

canonical_values:
  # Compensation timeout (ADR-0008d: Level 2)
  default_compensation_timeout_ms: 3000

  # Idempotency window (ADR-0008a)
  idempotency_window_seconds: 300  # 5 minutes

  # K0 WAL retention
  compensation_log_retention_days: 30

  # Deduplication backend
  deduplication_backend: "redis"
  redis_connection:
    host: "redis.k1.svc.cluster.local"
    port: 6379
    db: 0
    ttl_seconds: 300

---

# SECTION 8: ADR CROSS-REFERENCES

adr_references:
  - "ADR-0008a: Compensating Transaction Design (primary)"
  - "ADR-0008: Saga Pattern (parent)"
  - "ADR-0008c: Distributed State Management (K0 audit trail)"
  - "ADR-0008d: Timeout & Deadlock Handling (3s compensation timeout)"
  - "ADR-0007b: Tool Registry (tool_id reference)"
  - "ADR-0001a: K0 Bridge (COMPENSATION_LOG topic)"

