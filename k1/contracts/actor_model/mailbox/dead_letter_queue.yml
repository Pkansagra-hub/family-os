# Dead Letter Queue (DLQ) Contract
# Issue: 1.2.1 - Mailbox Message Envelope Schema
# Source ADR: ADR-0002a (Mailbox MPSC Queue Implementation)
# Related ADRs: ADR-0020 (Multi-Tier Storage), ADR-0021 (K0 SQLite Schema)

dead_letter_queue_contract:
  name: "Dead Letter Queue for Dropped/Failed Messages"
  version: "1.0"
  description: "Store dropped/expired messages for debugging and forensics"
  applies_to:
    - "ALL queue-based components (mailboxes, K0 bridge, SSE, voice pipeline)"
    - "Overflow policy enforcement"
    - "Message expiration handling"

  dlq_purpose:
    primary: "Debugging slow consumers and analyzing dropped messages"
    secondary: "Forensics for production incidents"
    tertiary: "Audit trail for message loss"

    non_goals:
      - "NOT a retry queue (messages not replayed)"
      - "NOT long-term storage (5min in-memory, 7d in K0)"
      - "NOT a message broker (read-only access)"

  dlq_architecture:
    structure:
      in_memory_ring_buffer:
        capacity: 100  # messages
        type: "ring_buffer (FIFO, oldest dropped when full)"
        retention: "5 minutes (300000ms)"
        location: "Per-component in-memory buffer"

      persistent_storage:
        backend: "K0 SQLite"
        table: "dead_letter_queue"
        retention: "7 days"
        flush_schedule: "Every 5 minutes OR 100 entries"
        location: "K0 Memory Module"

    two_tier_model:
      tier_1_hot:
        storage: "In-memory ring buffer"
        capacity: 100
        retention_ms: 300000
        access: "Real-time via observability API"
        use_case: "Recent drops (debugging active issues)"

      tier_2_cold:
        storage: "K0 SQLite"
        capacity: "Unbounded (7 day retention window)"
        retention_days: 7
        access: "Query via K0 API"
        use_case: "Historical analysis, incident forensics"

  dlq_entry_schema:
    required_fields:
      - name: "dlq_entry_id"
        type: "string (UUID)"
        description: "Unique DLQ entry identifier"
        example: "dlq_abc123"

      - name: "message_id"
        type: "string (UUID)"
        description: "Original message identifier"
        example: "msg_xyz789"

      - name: "message_type"
        type: "string"
        description: "Original message type"
        example: "task_announcement"

      - name: "sender_id"
        type: "string"
        description: "Original sender component ID"
        example: "orchestrator"

      - name: "receiver_id"
        type: "string"
        description: "Original receiver component ID"
        example: "agent_planner_123"

      - name: "drop_reason"
        type: "enum"
        values:
          - "OVERFLOW"                # Mailbox full (backpressure policy applied)
          - "OVERFLOW_CRITICAL"       # Emergency overflow (90% capacity)
          - "TTL_EXPIRED"             # Message age exceeded TTL
          - "CORRUPTION"              # Message failed CRC check or FlatBuffers validation
          - "AUTHN_FAILED"            # lease_id validation failed
          - "SENDER_RATE_LIMIT"       # Sender exceeded rate limit
          - "MERGE_FAILED"            # K0 delta merge failed
          - "SLOW_CLIENT"             # SSE client too slow
          - "VOICE_DEGRADATION"       # Voice pipeline action (drop frames/intents/tools)
          - "GLOBAL_SHED"             # Global backpressure shedding
        description: "Reason message was dropped"
        validation: "Must be one of the defined values"

      - name: "drop_timestamp_ms"
        type: "int64"
        description: "Unix timestamp (nanoseconds) when message was dropped"
        example: 1697097600000000000

      - name: "original_priority"
        type: "int (0-3)"
        description: "Original message priority"
        values: [0, 1, 2, 3]
        mapping: "0=URGENT, 1=REALTIME, 2=INTERACTIVE, 3=BACKGROUND"

      - name: "queue_name"
        type: "string"
        description: "Queue where message was dropped"
        examples: ["agent_mailbox", "k0_outbox", "audio_frames", "sse_subscribers"]

      - name: "mailbox_depth_at_drop"
        type: "int"
        description: "Queue depth when message was dropped"
        example: 52
        use_case: "Analyze queue saturation levels"

      - name: "cognitive_trace_id"
        type: "string (UUID)"
        description: "End-to-end trace ID (for correlation)"
        example: "trace_abc123"

      - name: "payload_hash"
        type: "string (sha256)"
        description: "SHA256 hash of message payload (NOT full payload)"
        rationale: "Save space, payload_hash sufficient for deduplication"
        example: "a3c5f8b..."

      - name: "payload_size_bytes"
        type: "int"
        description: "Original payload size in bytes"
        example: 4096
        use_case: "Analyze message size distribution"

    optional_fields:
      - name: "backpressure_duration_ms"
        type: "int"
        description: "How long component was in backpressure when dropped"
        example: 1250
        use_case: "Correlate drops with sustained backpressure"

      - name: "retry_count"
        type: "int"
        description: "Number of retries before drop (if applicable)"
        example: 3
        use_case: "Analyze retry effectiveness"

      - name: "watermark_level"
        type: "string"
        description: "Watermark level when dropped"
        values: ["HIGH", "ALERT", "CRITICAL"]
        use_case: "Analyze overflow threshold effectiveness"

      - name: "session_id"
        type: "string"
        description: "Session ID (if applicable)"
        example: "sess_abc123"
        use_case: "Correlate drops with specific user sessions"

  drop_reasons_detailed:
    OVERFLOW:
      description: "Mailbox full, DROP_OLDEST policy applied"
      component: "Agent mailbox (BACKGROUND priority)"
      trigger: "queue_depth >= HIGH watermark (50 messages)"
      user_impact: "Background tasks delayed"
      mitigation: "Increase mailbox capacity or improve consumer throughput"

    OVERFLOW_CRITICAL:
      description: "Emergency overflow at 90% capacity"
      component: "Agent mailbox (any priority)"
      trigger: "queue_depth >= 90% capacity"
      user_impact: "Control messages may be dropped (severe)"
      mitigation: "Immediate investigation required"

    TTL_EXPIRED:
      description: "Message age exceeded TTL before processing"
      component: "ALL queues"
      trigger: "current_time_ms() - message.timestamp_ms > message.ttl_ms"
      user_impact: "Stale data not processed (correct behavior)"
      mitigation: "Increase TTL or improve consumer throughput"

    CORRUPTION:
      description: "Message failed CRC check or FlatBuffers validation"
      component: "ALL queues"
      trigger: "Serialization/deserialization error"
      user_impact: "Data integrity issue"
      mitigation: "Investigate sender (potential bug or memory corruption)"

    AUTHN_FAILED:
      description: "lease_id validation failed (invalid capability token)"
      component: "Actor Router"
      trigger: "HMAC-SHA256 signature mismatch or expired lease"
      user_impact: "Unauthorized send prevented (security working as intended)"
      mitigation: "Sender must renew lease"

    SENDER_RATE_LIMIT:
      description: "Sender exceeded rate limit (100 msg/s sustained)"
      component: "Actor Router (token bucket)"
      trigger: "Token bucket depleted"
      user_impact: "DoS protection active"
      mitigation: "Sender must reduce send rate or request higher quota"

    MERGE_FAILED:
      description: "K0 delta merge failed (queue still > 1000 after merge)"
      component: "K0 Bridge outbox"
      trigger: "Merge insufficient to reduce queue depth"
      user_impact: "State synchronization delayed"
      mitigation: "Investigate K0 write throughput"

    SLOW_CLIENT:
      description: "SSE client too slow to consume events (>200 buffered)"
      component: "SSE subscribers"
      trigger: "per_client_queue_depth >= 200 events"
      user_impact: "Client disconnected (must reconnect)"
      mitigation: "Client must improve consumption rate or reduce subscription scope"

    VOICE_DEGRADATION:
      description: "Voice pipeline action (drop frames/intents/tools)"
      component: "Voice pipeline (5 stages)"
      trigger: "Watermark exceeded (stage-specific)"
      user_impact: "Graceful degradation (varies by stage)"
      mitigation: "Tune voice pipeline watermarks or improve throughput"

    GLOBAL_SHED:
      description: "Global backpressure shedding (BACKGROUND priority)"
      component: "ALL queues simultaneously"
      trigger: "total_memory > 512MB OR total_queue_items > 5000"
      user_impact: "System-wide degradation"
      mitigation: "Scale resources or shed upstream load"

  dlq_operations:
    add_entry:
      description: "Add dropped message to DLQ"
      trigger: "Component drops message (any reason)"

      algorithm:
        - step: 1
          action: "Create DLQ entry"
          code: "entry = DLQEntry(message, drop_reason, mailbox_depth)"

        - step: 2
          action: "Add to in-memory ring buffer"
          code: "in_memory_dlq.append(entry)"
          behavior: "If full, oldest entry discarded (FIFO)"

        - step: 3
          action: "Check flush condition"
          condition: "in_memory_dlq.size >= 100 OR last_flush > 5min"

        - step: 4
          action: "Flush to K0 SQLite (if condition met)"
          code: "k0_bridge.flush_dlq(in_memory_dlq.entries)"

        - step: 5
          action: "Log DLQ entry"
          log: "Message dropped: msg_id={message_id}, reason={drop_reason}, trace_id={trace_id}"

        - step: 6
          action: "Emit metric"
          metric: "dlq_entries_total{queue_name, drop_reason}"

      performance: "<0.5ms P95 (in-memory append)"

    query_recent:
      description: "Query recent DLQ entries (in-memory)"
      endpoint: "GET /v1/observability/dlq/{component_id}"

      query_parameters:
        - param: "limit"
          type: "int"
          default: 10
          max: 100
          description: "Number of entries to return"

        - param: "since_ms"
          type: "int64"
          optional: true
          description: "Return entries after timestamp (milliseconds)"

        - param: "reason"
          type: "string"
          optional: true
          description: "Filter by drop_reason"

        - param: "trace_id"
          type: "string"
          optional: true
          description: "Filter by cognitive_trace_id"

      response:
        format: "JSON array of DLQ entries"
        example:
          - dlq_entry_id: "dlq_abc123"
            message_id: "msg_xyz789"
            message_type: "task_announcement"
            sender_id: "orchestrator"
            receiver_id: "agent_planner_123"
            drop_reason: "OVERFLOW"
            drop_timestamp_ms: 1697097600000000000
            original_priority: 3
            queue_name: "agent_mailbox"
            mailbox_depth_at_drop: 52
            cognitive_trace_id: "trace_abc123"
            payload_hash: "a3c5f8b..."
            payload_size_bytes: 4096

      performance: "<10ms P95 (in-memory scan)"

    query_historical:
      description: "Query historical DLQ entries (K0 SQLite)"
      endpoint: "GET /v1/k0/dlq"

      query_parameters:
        - param: "start_time_ms"
          type: "int64"
          required: true
          description: "Start of time range"

        - param: "end_time_ms"
          type: "int64"
          required: true
          description: "End of time range"

        - param: "limit"
          type: "int"
          default: 100
          max: 1000
          description: "Number of entries to return"

        - param: "drop_reason"
          type: "string"
          optional: true
          description: "Filter by drop_reason"

        - param: "sender_id"
          type: "string"
          optional: true
          description: "Filter by sender_id"

        - param: "receiver_id"
          type: "string"
          optional: true
          description: "Filter by receiver_id"

      sql_query: |
        SELECT * FROM dead_letter_queue
        WHERE drop_timestamp_ms >= ? AND drop_timestamp_ms <= ?
          AND (drop_reason = ? OR ? IS NULL)
          AND (sender_id = ? OR ? IS NULL)
          AND (receiver_id = ? OR ? IS NULL)
        ORDER BY drop_timestamp_ms DESC
        LIMIT ?

      performance: "<100ms P95 (SQLite query with indexes)"

    flush_to_k0:
      description: "Flush in-memory DLQ to K0 SQLite"
      trigger: "Every 5 minutes OR 100 entries"

      algorithm:
        - step: 1
          action: "Batch entries for flush"
          code: "batch = in_memory_dlq.entries[0:100]"

        - step: 2
          action: "Insert into K0 SQLite"
          sql: "INSERT INTO dead_letter_queue (...) VALUES (...)"
          batch_size: 100

        - step: 3
          action: "Clear in-memory entries (keep last 10 for hot access)"
          code: "in_memory_dlq.entries = in_memory_dlq.entries[-10:]"

        - step: 4
          action: "Emit metric"
          metric: "dlq_flushed_total{count}"

      performance: "<50ms P95 (batch insert)"

    cleanup_old_entries:
      description: "Delete entries older than 7 days"
      trigger: "Daily cron job (00:00 UTC)"

      sql_query: |
        DELETE FROM dead_letter_queue
        WHERE drop_timestamp_ms < (current_timestamp - 7 days)

      performance: "<200ms P95 (indexed delete)"

  k0_sqlite_schema:
    table_name: "dead_letter_queue"

    columns:
      - column: "dlq_entry_id"
        type: "TEXT PRIMARY KEY"

      - column: "message_id"
        type: "TEXT NOT NULL"

      - column: "message_type"
        type: "TEXT NOT NULL"

      - column: "sender_id"
        type: "TEXT NOT NULL"

      - column: "receiver_id"
        type: "TEXT NOT NULL"

      - column: "drop_reason"
        type: "TEXT NOT NULL"

      - column: "drop_timestamp_ms"
        type: "INTEGER NOT NULL"

      - column: "original_priority"
        type: "INTEGER NOT NULL"

      - column: "queue_name"
        type: "TEXT NOT NULL"

      - column: "mailbox_depth_at_drop"
        type: "INTEGER NOT NULL"

      - column: "cognitive_trace_id"
        type: "TEXT NOT NULL"

      - column: "payload_hash"
        type: "TEXT NOT NULL"

      - column: "payload_size_bytes"
        type: "INTEGER NOT NULL"

      - column: "backpressure_duration_ms"
        type: "INTEGER"

      - column: "retry_count"
        type: "INTEGER"

      - column: "watermark_level"
        type: "TEXT"

      - column: "session_id"
        type: "TEXT"

    indexes:
      - index: "idx_drop_timestamp"
        columns: ["drop_timestamp_ms"]
        purpose: "Time-range queries"

      - index: "idx_drop_reason"
        columns: ["drop_reason"]
        purpose: "Filter by reason"

      - index: "idx_sender_receiver"
        columns: ["sender_id", "receiver_id"]
        purpose: "Component analysis"

      - index: "idx_trace_id"
        columns: ["cognitive_trace_id"]
        purpose: "Trace correlation"

    retention_policy:
      duration_days: 7
      cleanup_schedule: "Daily at 00:00 UTC"
      archive: "Not implemented (future: export to cold storage)"

  observability:
    prometheus_metrics:
      - name: "dlq_entries_total"
        type: "counter"
        labels: ["queue_name", "drop_reason"]
        description: "Total DLQ entries added"

      - name: "dlq_in_memory_size"
        type: "gauge"
        labels: ["component_id"]
        description: "Current in-memory DLQ size"

      - name: "dlq_flushed_total"
        type: "counter"
        labels: ["component_id"]
        description: "Total entries flushed to K0"

      - name: "dlq_k0_size"
        type: "gauge"
        description: "Total entries in K0 SQLite"

      - name: "dlq_query_latency_ms"
        type: "histogram"
        labels: ["query_type"]  # in_memory | k0_sqlite
        buckets: [1, 5, 10, 50, 100, 200]
        description: "DLQ query latency"

    structured_logging:
      - event: "dlq.entry_added"
        level: "WARNING"
        fields: ["dlq_entry_id", "message_id", "drop_reason", "queue_name", "trace_id"]

      - event: "dlq.flushed"
        level: "INFO"
        fields: ["count", "component_id", "flush_duration_ms"]

      - event: "dlq.cleanup"
        level: "INFO"
        fields: ["deleted_count", "retention_days"]

  debugging_workflows:
    workflow_1_recent_drops:
      description: "Investigate recent message drops"
      steps:
        - step: 1
          action: "Query recent DLQ entries"
          endpoint: "GET /v1/observability/dlq/{component_id}?limit=20"

        - step: 2
          action: "Group by drop_reason"
          analysis: "Identify most common drop reasons"

        - step: 3
          action: "Check queue depth metrics"
          metric: "k1_queue_depth{queue_name}"

        - step: 4
          action: "Correlate with backpressure duration"
          metric: "k1_backpressure_duration_ms{queue_name}"

        - step: 5
          action: "Investigate root cause"
          questions:
            - "Is consumer slow?"
            - "Is producer too fast?"
            - "Are watermarks too low?"

    workflow_2_trace_correlation:
      description: "Track message through system using trace_id"
      steps:
        - step: 1
          action: "Query DLQ by trace_id"
          endpoint: "GET /v1/observability/dlq/{component_id}?trace_id={trace_id}"

        - step: 2
          action: "Check OpenTelemetry spans for same trace_id"
          tool: "Jaeger or Tempo"

        - step: 3
          action: "Reconstruct message flow"
          analysis: "Where did message succeed/fail?"

        - step: 4
          action: "Identify bottleneck"
          questions:
            - "Which component dropped message?"
            - "What was queue depth at time of drop?"
            - "Was system in backpressure?"

    workflow_3_historical_analysis:
      description: "Analyze drop patterns over time"
      steps:
        - step: 1
          action: "Query historical DLQ"
          endpoint: "GET /v1/k0/dlq?start_time_ms={}&end_time_ms={}&limit=1000"

        - step: 2
          action: "Aggregate by drop_reason"
          analysis: "SQL: SELECT drop_reason, COUNT(*) FROM dead_letter_queue WHERE ... GROUP BY drop_reason"

        - step: 3
          action: "Identify trends"
          questions:
            - "Are drops increasing over time?"
            - "Which queues drop most frequently?"
            - "Are drops correlated with traffic spikes?"

        - step: 4
          action: "Capacity planning"
          recommendations:
            - "Increase watermarks if drops frequent but transient"
            - "Scale resources if drops sustained"
            - "Tune overflow policies if drops causing user impact"

  testing_requirements:
    unit_tests:
      - test: "Add entry to in-memory DLQ"
      - test: "FIFO eviction when capacity exceeded"
      - test: "Flush to K0 SQLite (batch insert)"
      - test: "Query recent entries (in-memory)"
      - test: "Query historical entries (K0 SQLite)"
      - test: "Cleanup old entries (7 day retention)"

    integration_tests:
      - test: "Mailbox overflow → DLQ entry created"
      - test: "TTL expired → DLQ entry created"
      - test: "Router admission reject → DLQ entry created"
      - test: "Query DLQ via observability API"
      - test: "Flush DLQ after 100 entries"
      - test: "Cleanup cron job deletes old entries"

    performance_tests:
      - test: "Add 1000 entries → verify <0.5ms P95 per entry"
      - test: "Query recent 100 entries → verify <10ms P95"
      - test: "Query historical 1000 entries → verify <100ms P95"
      - test: "Flush 100 entries to K0 → verify <50ms P95"

  related_contracts:
    - contract: "mpsc_queue_contract.yml"
      relation: "MPSC queue sends dropped messages to DLQ"

    - contract: "backpressure_contract.yml"
      relation: "Backpressure overflow actions send to DLQ"

    - contract: "routing_contract.yml"
      relation: "Router admission failures send to DLQ"

  related_adrs:
    - adr: "ADR-0002a"
      section: "Dead Letter Queue"
      lines: "440-520 (DLQ design, retention, access)"

    - adr: "ADR-0020"
      section: "Multi-Tier Storage"
      lines: "K0 SQLite for persistent DLQ"

    - adr: "ADR-0021"
      section: "K0 SQLite Schema"
      lines: "dead_letter_queue table schema"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.1"
      author: "Messaging Infrastructure Lead"
