# MPSC Queue Contract
# Issue: 1.2.1 - Mailbox Message Envelope Schema
# Source ADR: ADR-0002a (Mailbox MPSC Queue Implementation)
# Related ADRs: ADR-0002 (Actor Model), ADR-0005 (Agent Lifecycle FSM)

mpsc_queue_contract:
  name: "Lock-Free MPSC Queue Implementation"
  version: "1.0"
  description: "Multi-Producer Single-Consumer queue with lock-free concurrency"
  applies_to:
    - "ALL 58 agents (4 AI agents + 54 pure actors)"
    - "Each agent has 1 mailbox with 4 priority queues"
    - "Total: 58 mailboxes × 4 queues = 232 MPSC queues"

  queue_architecture:
    queue_type: "MPSC (Multi-Producer Single-Consumer)"

    producers:
      description: "Multiple agents can enqueue simultaneously"
      concurrency: "Lock-free (atomic compare-and-swap)"
      examples:
        - "Orchestrator → Planner mailbox"
        - "Tool Runner → Concierge mailbox"
        - "Supervisor → ALL agents (broadcast)"

    consumer:
      description: "Single agent processes messages sequentially"
      concurrency: "Single-threaded (no synchronization needed)"
      guarantee: "Messages processed one-at-a-time"

    data_structure: "Ring buffer (fixed-size circular array)"
    capacity_per_priority:
      URGENT: 16      # Priority 0
      REALTIME: 32    # Priority 1
      INTERACTIVE: 64 # Priority 2
      BACKGROUND: 128 # Priority 3
    total_capacity: 240  # Sum of all priorities

  ring_buffer_implementation:
    structure:
      buffer: "Fixed-size array[capacity]"
      head: "Atomic int64 (producer write pointer)"
      tail: "int64 (consumer read pointer, single-threaded)"
      dropped_count: "Atomic int64 (overflow counter)"

    memory_layout:
      cache_line_alignment: true
      cache_line_size: 64  # bytes
      alignment_rationale: "Prevent false sharing between head (producer) and tail (consumer)"
      padding: "56 bytes between head and tail (64 - sizeof(int64))"

    enqueue_algorithm:
      description: "Lock-free enqueue using atomic compare-and-swap (CAS)"
      steps:
        - step: 1
          action: "Load current head atomically (ACQUIRE memory order)"
          code: "current_head = head.load(ACQUIRE)"

        - step: 2
          action: "Calculate next_head (wrap around)"
          code: "next_head = (current_head + 1) % capacity"

        - step: 3
          action: "Check if queue full"
          code: "if next_head == tail: return FALSE (full)"

        - step: 4
          action: "Try to claim slot with CAS"
          code: "if head.compare_exchange_weak(current_head, next_head, RELEASE):"
          success: "Slot claimed, write message to buffer[current_head]"
          failure: "Another producer won, retry from step 1"

        - step: 5
          action: "Write message to buffer"
          code: "buffer[current_head] = message"
          guarantee: "Memory ordering ensures visibility to consumer"

      performance: "<0.5ms P95 latency"
      retry_behavior: "Spin-loop with exponential backoff (max 3 retries)"

    dequeue_algorithm:
      description: "Single-threaded dequeue (no synchronization needed)"
      steps:
        - step: 1
          action: "Check if queue empty"
          code: "if tail == head.load(ACQUIRE): return NONE"

        - step: 2
          action: "Read message from buffer"
          code: "message = buffer[tail]"

        - step: 3
          action: "Clear slot (optional, for debugging)"
          code: "buffer[tail] = None"

        - step: 4
          action: "Advance tail pointer"
          code: "tail = (tail + 1) % capacity"

        - step: 5
          action: "Return message"
          code: "return message"

      performance: "<0.5ms P95 latency"
      guarantee: "FIFO ordering within same priority"

  priority_scheduling:
    priority_levels:
      - priority: 0
        name: "URGENT"
        weight: 4
        capacity: 16
        use_cases:
          - "BargeinInitiated (voice interruption)"
          - "AgentCrashNotification (supervisor alert)"
          - "ProtocolViolation (immediate action required)"
        guarantee: "Never starves, always processed first"

      - priority: 1
        name: "REALTIME"
        weight: 3
        capacity: 32
        use_cases:
          - "UserMessage (conversation input)"
          - "ToolResult (LLM waiting for result)"
          - "AgentProposal (3-phase orchestration)"
        max_starvation: "500ms"

      - priority: 2
        name: "INTERACTIVE"
        weight: 2
        capacity: 64
        use_cases:
          - "AgentSelection (orchestration phase 2)"
          - "TaskNegotiation (planning phase)"
          - "PlanValidation (arbiter review)"
        max_starvation: "1000ms"

      - priority: 3
        name: "BACKGROUND"
        weight: 1
        capacity: 128
        use_cases:
          - "MetricsReport (Prometheus export)"
          - "LogEntry (structured logging)"
          - "StateSyncDelta (K1 → K0 flush)"
        max_starvation: "5000ms (aging promotion)"

    weighted_fair_queueing:
      description: "WFQ prevents starvation while prioritizing critical messages"

      virtual_time_calculation:
        formula: "virtual_time[priority] += 1.0 / weight[priority]"
        explanation: "Higher priority (higher weight) advances virtual time slower"
        example:
          - "URGENT (weight=4): virtual_time += 0.25"
          - "BACKGROUND (weight=1): virtual_time += 1.0"
          - "Result: URGENT processed 4x more often than BACKGROUND"

      selection_algorithm:
        rule: "Select message with smallest virtual_time across all non-empty queues"
        implementation:
          - step: 1
            action: "Check all 4 priority queues for non-empty"

          - step: 2
            action: "Find queue with minimum virtual_time"
            code: "selected_priority = argmin(virtual_time[p] for p in [0,1,2,3] if queue[p].size() > 0)"

          - step: 3
            action: "Dequeue message from selected priority"
            code: "message = queue[selected_priority].dequeue()"

          - step: 4
            action: "Update virtual_time for selected priority"
            code: "virtual_time[selected_priority] += 1.0 / weight[selected_priority]"

      aging_mechanism:
        description: "Promote BACKGROUND messages after 5s to prevent starvation"
        threshold: "5000ms"
        action: "Promote BACKGROUND (priority 3) → INTERACTIVE (priority 2)"
        check_frequency: "Every dequeue cycle"
        implementation:
          - step: 1
            action: "Before WFQ selection, check BACKGROUND queue head"

          - step: 2
            action: "Calculate message age"
            code: "age_ms = current_time_ms() - message.timestamp_ms"

          - step: 3
            action: "If age > 5000ms, promote to INTERACTIVE"
            code: "message.priority = 2; return message"

          - step: 4
            action: "Log promotion event"
            metric: "mailbox_message_aged_total{from_priority=3, to_priority=2}"

  backpressure_management:
    watermarks:
      high: 50   # Total messages across all priorities
      low: 25    # Resume threshold
      critical: 90  # Emergency threshold (drop low priority)

    states:
      - state: "NORMAL"
        condition: "total_depth < 50"
        behavior: "Enqueue normally"

      - state: "BACKPRESSURE"
        condition: "total_depth >= 50"
        behavior: "Apply overflow policy"
        emit_metric: "mailbox_backpressure_active{component_id} = 1"

      - state: "CRITICAL"
        condition: "total_depth >= 90"
        behavior: "Drop BACKGROUND messages aggressively"
        emit_metric: "mailbox_critical_backpressure{component_id} = 1"
        alert: "Supervisor notified"

      - state: "RESUME"
        condition: "total_depth < 25"
        behavior: "Exit backpressure mode"
        emit_metric: "mailbox_backpressure_active{component_id} = 0"

    overflow_policies:
      - policy: "DROP_OLDEST"
        default: true
        description: "Drop oldest BACKGROUND message first"
        steps:
          - step: 1
            action: "Check BACKGROUND queue (priority 3) has messages"

          - step: 2
            action: "Dequeue oldest BACKGROUND message"
            code: "dropped = queue[3].dequeue()"

          - step: 3
            action: "Send dropped message to DLQ"
            code: "dlq.add(dropped, reason='OVERFLOW', mailbox_depth=total_depth)"

          - step: 4
            action: "Retry enqueue for new message"
            code: "queue[new_message.priority].enqueue(new_message)"
        use_cases:
          - "Logging messages (non-critical)"
          - "Metrics reports (can tolerate loss)"
          - "State sync deltas (batched, redundant)"

      - policy: "BLOCK_SENDER"
        default: false
        description: "Block sender until mailbox depth < low watermark"
        timeout: "5000ms"
        behavior:
          - "Sender thread blocks (waits on condition variable)"
          - "Unblocked when total_depth < 25"
          - "Throw exception if timeout exceeded"
        use_cases:
          - "URGENT messages (never drop)"
          - "REALTIME messages (critical coordination)"
        danger: "Can cause deadlock if circular dependencies"

      - policy: "ALERT_SUPERVISOR"
        default: false
        description: "Alert supervisor but don't drop message"
        behavior:
          - "Log warning with trace_id"
          - "Emit metric: mailbox_overflow_alert_total{component_id}"
          - "Send notification to Supervisor"
        use_cases:
          - "Debugging slow consumers"
          - "Production monitoring"

  dead_letter_queue:
    description: "Store dropped/expired messages for debugging"

    capacity: 100  # FIFO, oldest dropped when full
    retention_ms: 300000  # 5 minutes

    entry_schema:
      message_id: "string (UUID)"
      message_type: "string"
      sender_id: "string"
      receiver_id: "string"
      payload_hash: "sha256 (for debugging, not full payload)"
      drop_reason: "enum (OVERFLOW | TTL_EXPIRED | CORRUPTION | AUTHN_FAILED)"
      drop_timestamp_ms: "int64"
      original_priority: "int (0-3)"
      mailbox_depth_at_drop: "int"
      cognitive_trace_id: "string (UUID)"

    drop_reasons:
      - reason: "OVERFLOW"
        description: "Mailbox full, DROP_OLDEST policy applied"

      - reason: "TTL_EXPIRED"
        description: "Message age exceeded TTL before processing"

      - reason: "CORRUPTION"
        description: "Message failed CRC check or FlatBuffers validation"

      - reason: "AUTHN_FAILED"
        description: "lease_id validation failed (invalid capability token)"

    access:
      api_endpoint: "GET /v1/observability/dlq/{component_id}"
      query_params: ["limit (default 10)", "since (timestamp_ms)"]
      response: "JSON array of DLQ entries"

    export:
      destination: "K0 SQLite (long-term storage)"
      schedule: "Flush every 5 minutes"
      retention_in_k0: "7 days"

  message_ttl:
    description: "Time-to-live enforcement (prevent stale message processing)"

    default_ttl_ms: 30000  # 30 seconds

    per_message_ttl:
      override: true
      field: "message.ttl_ms"
      examples:
        - message_type: "UserMessage"
          ttl_ms: 60000  # 1 minute (user input is valid longer)

        - message_type: "BargeinInitiated"
          ttl_ms: 5000   # 5 seconds (voice interruption is time-sensitive)

        - message_type: "MetricsReport"
          ttl_ms: 120000 # 2 minutes (metrics can be delayed)

    ttl_check:
      when: "On dequeue (before processing)"
      algorithm:
        - step: 1
          action: "Dequeue message"

        - step: 2
          action: "Calculate message age"
          code: "age_ms = current_time_ms() - message.timestamp_ms"

        - step: 3
          action: "Check if expired"
          code: "if age_ms > message.ttl_ms:"

        - step: 4
          action: "Send to DLQ"
          code: "dlq.add(message, reason='TTL_EXPIRED', mailbox_depth=total_depth)"

        - step: 5
          action: "Try next message"
          code: "return dequeue_next()  # Recursive call"

    observability:
      metric: "mailbox_ttl_expired_total{component_id, message_type}"
      log: "Message expired: msg_id={message_id}, age={age_ms}ms, ttl={ttl_ms}ms"

  batch_operations:
    batch_dequeue:
      description: "Dequeue multiple messages in one call (amortize overhead)"
      max_batch_size: 10
      performance: "~0.1ms per message (5x faster than single dequeue)"
      use_cases:
        - "Voice pipeline processing audio frames"
        - "Tool runner processing batch requests"
        - "K0 bridge flushing state deltas"

      algorithm:
        - step: 1
          action: "Allocate result array"
          code: "messages = []"

        - step: 2
          action: "Loop up to max_batch_size"
          code: "for i in range(max_batch_size):"

        - step: 3
          action: "Dequeue next message (WFQ + aging)"
          code: "message = wfq_scheduler.dequeue_next()"

        - step: 4
          action: "If None, break (queue empty)"
          code: "if message is None: break"

        - step: 5
          action: "Append to result array"
          code: "messages.append(message)"

        - step: 6
          action: "Return batch"
          code: "return messages"

  performance_guarantees:
    enqueue_latency:
      p50: "0.2ms"
      p95: "0.5ms"
      p99: "1.0ms"
      max: "5.0ms (with retries)"

    dequeue_latency:
      p50: "0.1ms"
      p95: "0.5ms"
      p99: "1.0ms"

    batch_dequeue_latency:
      per_message_p95: "0.1ms (10 messages in ~1ms)"

    memory_overhead:
      per_queue: "capacity × sizeof(Message) ≈ 4KB typical"
      per_mailbox: "4 queues × 4KB ≈ 16KB"
      total_system: "58 mailboxes × 16KB ≈ 928KB"

    throughput:
      per_queue: "2000 msg/s (0.5ms per message)"
      per_mailbox: "8000 msg/s (4 priorities × 2000)"

  concurrency_guarantees:
    linearizability: "Enqueue operations are linearizable (atomic CAS)"
    fifo_ordering: "Messages within same priority processed in FIFO order"
    no_message_loss: "Messages never lost (unless dropped by overflow policy)"
    no_message_duplication: "Messages never duplicated (unique message_id)"
    visibility: "Memory ordering (ACQUIRE/RELEASE) ensures cross-thread visibility"

  observability:
    prometheus_metrics:
      - name: "mailbox_enqueue_total"
        type: "counter"
        labels: ["component_id", "priority"]

      - name: "mailbox_dequeue_total"
        type: "counter"
        labels: ["component_id", "priority"]

      - name: "mailbox_queue_depth"
        type: "gauge"
        labels: ["component_id", "priority"]

      - name: "mailbox_enqueue_latency_ms"
        type: "histogram"
        labels: ["component_id", "priority"]
        buckets: [0.1, 0.2, 0.5, 1, 2, 5]

      - name: "mailbox_dequeue_latency_ms"
        type: "histogram"
        labels: ["component_id", "priority"]
        buckets: [0.1, 0.2, 0.5, 1, 2, 5]

      - name: "mailbox_drops_total"
        type: "counter"
        labels: ["component_id", "reason", "priority"]

      - name: "mailbox_backpressure_active"
        type: "gauge"
        labels: ["component_id"]
        values: [0, 1]

      - name: "mailbox_ttl_expired_total"
        type: "counter"
        labels: ["component_id", "message_type"]

      - name: "mailbox_message_aged_total"
        type: "counter"
        labels: ["from_priority", "to_priority"]

    structured_logging:
      - event: "mailbox.enqueue"
        level: "DEBUG"
        fields: ["message_id", "sender_id", "receiver_id", "priority", "queue_depth"]

      - event: "mailbox.dequeue"
        level: "DEBUG"
        fields: ["message_id", "receiver_id", "priority", "wait_time_ms"]

      - event: "mailbox.drop"
        level: "WARNING"
        fields: ["message_id", "reason", "priority", "mailbox_depth", "trace_id"]

      - event: "mailbox.backpressure"
        level: "WARNING"
        fields: ["component_id", "queue_depth", "threshold", "action"]

      - event: "mailbox.aged"
        level: "INFO"
        fields: ["message_id", "from_priority", "to_priority", "age_ms"]

  testing_requirements:
    unit_tests:
      - test: "Enqueue/dequeue single message"
      - test: "Enqueue/dequeue multiple messages (FIFO ordering)"
      - test: "Priority scheduling (URGENT before BACKGROUND)"
      - test: "WFQ virtual time calculation"
      - test: "Aging mechanism (5s threshold)"
      - test: "Backpressure (high/low watermarks)"
      - test: "Overflow policy (DROP_OLDEST)"
      - test: "DLQ (dropped messages logged)"
      - test: "TTL expiration"
      - test: "Batch dequeue (10 messages)"

    concurrency_tests:
      - test: "Multiple producers enqueue simultaneously (100 threads)"
      - test: "Single consumer dequeue (no race conditions)"
      - test: "Linearizability verification (happens-before ordering)"
      - test: "Memory ordering validation (ACQUIRE/RELEASE)"

    performance_tests:
      - test: "Enqueue latency <0.5ms P95 (1M operations)"
      - test: "Dequeue latency <0.5ms P95 (1M operations)"
      - test: "Throughput >2000 msg/s per queue"
      - test: "Batch dequeue ~0.1ms per message"

    integration_tests:
      - test: "Orchestrator → 5 agents broadcast"
      - test: "Planner → Tool Runner → Planner (request-response)"
      - test: "Supervisor → ALL agents health check (58 messages)"
      - test: "Backpressure cascade (slow consumer triggers upstream backpressure)"

  related_contracts:
    - contract: "message_envelope.yml"
      relation: "MPSC queue stores Message envelopes"

    - contract: "routing_contract.yml"
      relation: "Router enqueues messages to MPSC queues"

    - contract: "backpressure_contract.yml"
      relation: "MPSC queue triggers backpressure signals"

  related_adrs:
    - adr: "ADR-0002a"
      section: "Mailbox MPSC Queue Implementation"
      lines: "Complete ADR (lock-free algorithms, WFQ, backpressure)"

    - adr: "ADR-0002"
      section: "Actor Model - Message Passing"
      lines: "500-800 (Mailbox architecture)"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.1"
      author: "Messaging Infrastructure Lead"
