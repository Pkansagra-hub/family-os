# Mailbox Message Envelope Contract
# Issue: 1.2.1 - Mailbox Message Envelope Schema
# Source ADR: ADR-0002 (Actor Model - Agent Isolation)
# Related ADRs: ADR-0002a (Mailbox MPSC Queue Implementation)

mailbox_message_envelope:
  name: "Actor Mailbox Message Envelope"
  version: "1.0"
  description: "Standard message format for ALL Actor Model communications (AI agents + pure actors)"
  applies_to:
    - "ALL 52 K1 modules (AI agents: 4, Pure actors: 48)"
    - "Inter-agent messaging"
    - "Agent → Orchestrator → Agent communication"
    - "Pure actor internal messaging"

  envelope_structure:
    required_fields:
      - name: "message_id"
        type: "string"
        format: "UUID"
        description: "Unique message identifier (for deduplication and tracing)"
        example: "msg_abc123"
        validation: "Must be valid UUIDv4"

      - name: "message_type"
        type: "enum"
        values:
          # Orchestration messages
          - "task_announcement"       # Orchestrator → AI agents (broadcast)
          - "plan_proposal"            # AI agent → Orchestrator
          - "plan_approval"            # Orchestrator → AI agent
          - "plan_rejection"           # Orchestrator → AI agent

          # Tool execution messages
          - "tool_request"             # AI agent → Tool Runner
          - "tool_result"              # Tool Runner → AI agent
          - "tool_error"               # Tool Runner → AI agent

          # Health monitoring messages
          - "health_check"             # Supervisor → ALL components
          - "health_response"          # ALL components → Supervisor
          - "heartbeat"                # Agent → Supervisor (periodic)

          # Protocol enforcement messages
          - "protocol_violation"       # Protocol Monitor → component
          - "protocol_timeout"         # Protocol Monitor → component

          # State synchronization messages
          - "state_delta"              # SessionState → K0 Bridge
          - "state_snapshot"           # SessionState → K0 Bridge

          # Configuration messages
          - "config_update"            # Config Manager → ALL components
          - "config_reload"            # Config Manager → component

          # Model Hub messages
          - "inference_request"        # AI agent → Model Hub
          - "inference_response"       # Model Hub → AI agent
          - "streaming_chunk"          # Model Hub → AI agent

          # Backpressure messages
          - "backpressure_signal"      # Component → upstream component
          - "resume_signal"            # Component → upstream component
        description: "Message type determines payload schema and routing"
        validation: "Must be one of the defined values"

      - name: "sender_id"
        type: "string"
        description: "Sender component ID (agent_id or component_id)"
        example: "agent_planner_123"
        validation: "Must match registered component ID"

      - name: "receiver_id"
        type: "string"
        description: "Receiver component ID ('*' for broadcast)"
        example: "agent_planner_456"
        special_values:
          - "'*' for broadcast to all agents in roster"
          - "'orchestrator' for orchestrator singleton"
        validation: "Must be valid component ID or '*'"

      - name: "timestamp"
        type: "int64"
        description: "Unix timestamp (nanoseconds) when message was created"
        example: 1697097600000000000
        validation: "Must be monotonically increasing per sender"

      - name: "cognitive_trace_id"
        type: "string"
        format: "UUID"
        description: "End-to-end trace ID for observability (spans entire conversation turn)"
        example: "trace_xyz789"
        validation: "Must be valid UUIDv4"

      - name: "priority"
        type: "enum"
        values:
          - "URGENT"      # Priority 0: 50% CPU share, never starves
          - "REALTIME"    # Priority 1: 30% CPU share, 500ms max starvation
          - "INTERACTIVE" # Priority 2: 15% CPU share, 1000ms max starvation
          - "BACKGROUND"  # Priority 3: 5% CPU share, 5000ms max starvation
        default: "INTERACTIVE"
        description: "Message priority for WFQ scheduler (Weighted Fair Queueing)"
        validation: "Must be one of the 4 priority levels"

      - name: "ttl_ms"
        type: "int32"
        description: "Time-to-live in milliseconds (drop if expired)"
        example: 5000
        default: 5000
        validation: "Must be positive integer"
        cleanup: "Periodic cleanup every 100ms checks for expired messages"
        performance_budget: "<1ms cleanup per 1000 messages"

      - name: "payload"
        type: "bytes"
        description: "FlatBuffers serialized payload (message_type determines schema)"
        format: "FlatBuffers binary"
        max_size: "64KB per message (enforced by router)"
        validation: "Must be valid FlatBuffers according to message_type schema"

      - name: "reply_to"
        type: "string"
        optional: true
        description: "Sender mailbox for reply (if expecting response)"
        example: "agent_planner_123"
        use_case: "Request-response patterns (e.g., tool_request expects tool_result)"

    optional_fields:
      - name: "correlation_id"
        type: "string"
        description: "Correlate request with response (for request-response patterns)"
        example: "req_abc123"
        use_case: "Tool call: tool_request has correlation_id, tool_result has same correlation_id"

      - name: "lease_id"
        type: "string"
        description: "Capability token (HMAC-SHA256 signed, unforgeable)"
        format: "HMAC-SHA256 signature"
        validation: "Router validates lease_id before enqueue"
        security: "Prevents unauthenticated sends, DDoS protection"

      - name: "retry_count"
        type: "int32"
        description: "Number of retries (for idempotency)"
        default: 0
        validation: "Max 3 retries before DLQ"

  ai_agent_usage:
    description: "AI agents use mailboxes for Actor Model, call Model Hub internally"

    key_distinction:
      actor_messages: "Protocols validate Actor messages (mailbox send/receive)"
      llm_calls: "AI agents call Model Hub internally (NOT in Actor messages)"
      protocol_scope: "Protocols validate message flow, NOT LLM reasoning"

    example_flow:
      - step: 1
        actor: "Orchestrator"
        action: "send(HireRequest) → Planner mailbox"
        message_type: "task_announcement"
        protocol: "Actor message (MPST validates)"

      - step: 2
        actor: "Planner (AI Agent)"
        action: "receive() → internal Model Hub call for LLM reasoning"
        message_type: "N/A (internal to Planner)"
        protocol: "NOT an Actor message (Protocol Monitor ignores)"

      - step: 3
        actor: "Planner (AI Agent)"
        action: "send(Proposal) → Orchestrator mailbox"
        message_type: "plan_proposal"
        protocol: "Actor message (MPST validates)"

    timeout_semantics:
      protocol_timeout: "Time to receive Actor message in mailbox (500ms for HireRequest → Proposal)"
      llm_timeout: "Time for AI agent Model Hub call (5000ms for Planner LLM reasoning)"
      clarification: "Protocol timeouts are separate from LLM timeouts"

  serialization:
    format: "FlatBuffers"
    schema_file: "contracts/flatbuffers/layer1_kernel/mailbox_message.fbs"
    zero_copy: true
    performance:
      serialization: "<0.5ms P95"
      deserialization: "<0.1ms P95 (zero-copy)"
      message_size: "Typical 1-4KB, max 64KB"

  routing:
    broadcast_semantics:
      receiver_id: "'*'"
      behavior: "Send to all agents in active roster"
      example: "Orchestrator broadcasts TaskAnnouncement to all agents"
      performance: "O(N) where N = number of active agents (typically 3-5)"

    unicast_semantics:
      receiver_id: "specific agent_id"
      behavior: "Send to single mailbox (MPSC enqueue)"
      example: "Orchestrator sends PlanApproval to Planner"
      performance: "O(1) lock-free enqueue"

    multicast:
      support: false
      workaround: "Use multiple unicast sends"
      reason: "Avoid complexity, broadcast sufficient for K1"

  backpressure:
    watermarks:
      low: "25% mailbox capacity"
      medium: "50% mailbox capacity"
      high: "75% mailbox capacity"
      critical: "90% mailbox capacity (drop LOW priority messages)"

    mailbox_capacity:
      default: 100
      voice_pipeline: 200  # Higher capacity for audio frames
      orchestrator: 50     # Lower capacity (fast processor)

    actions:
      - threshold: "low"
        action: "No action (normal operation)"

      - threshold: "medium"
        action: "Emit metric: mailbox_queue_depth{component_id, threshold='medium'}"

      - threshold: "high"
        action: "Log warning, emit metric, send backpressure_signal upstream"

      - threshold: "critical"
        action: "Drop LOW priority messages (BACKGROUND), log to DLQ, alert supervisor"

    drop_policy:
      priority_order: ["BACKGROUND", "INTERACTIVE", "REALTIME", "URGENT"]
      rule: "Drop lowest priority first when mailbox full"
      never_drop: ["URGENT", "health_check", "protocol_violation"]

    overflow_actions:
      voice_specific:
        audio_frames: "Drop oldest if >100 frames queued (keep last 5 seconds)"
        asr_results: "Never drop (critical for user input)"

      coordination_messages:
        task_assignment: "Block sender (critical coordination)"
        health_check: "Never drop (supervisor monitoring)"

  dead_letter_queue:
    description: "Log dropped/failed messages to K0 DLQ for debugging"

    dlq_reasons:
      - reason: "OVERFLOW"
        description: "Mailbox full (critical watermark exceeded)"
        action: "Drop message, log to K0 DLQ"

      - reason: "TTL_EXPIRED"
        description: "Message exceeded TTL before processing"
        action: "Discard message, log to K0 DLQ"

      - reason: "CORRUPTION"
        description: "Message failed CRC check or FlatBuffers validation"
        action: "Discard message, log to K0 DLQ"

      - reason: "AUTHN_FAILED"
        description: "lease_id validation failed (invalid capability token)"
        action: "Reject message, log to K0 DLQ"

      - reason: "SENDER_RATE_LIMIT"
        description: "Sender exceeded rate limit (100 msg/s)"
        action: "Reject message, return ADMISSION_DENIED"

    dlq_schema:
      message_id: "string"
      message_type: "string"
      sender_id: "string"
      receiver_id: "string"
      timestamp: "int64"
      drop_reason: "string"
      payload_hash: "sha256"  # For debugging (not full payload)
      trace_id: "string"

    retention: "7 days in K0 SQLite, then archive to cold storage"

  observability:
    prometheus_metrics:
      - name: "mailbox_messages_sent_total"
        type: "counter"
        labels: ["sender_id", "receiver_id", "message_type", "priority"]
        description: "Total messages sent"

      - name: "mailbox_messages_received_total"
        type: "counter"
        labels: ["receiver_id", "message_type", "priority"]
        description: "Total messages received and processed"

      - name: "mailbox_messages_expired_total"
        type: "counter"
        labels: ["component_id", "priority"]
        description: "Total messages expired (TTL exceeded before processing)"

      - name: "mailbox_cleanup_latency_ms"
        type: "histogram"
        labels: ["component_id"]
        buckets: [0.1, 0.5, 1, 5, 10]
        description: "Time taken for cleanup loop (target: <1ms per 1000 messages)"

      - name: "mailbox_queue_depth"
        type: "gauge"
        labels: ["component_id"]
        description: "Current mailbox queue depth"

      - name: "mailbox_message_latency_ms"
        type: "histogram"
        labels: ["message_type", "priority"]
        buckets: [0.1, 0.5, 1, 5, 10, 50, 100]
        description: "Time from send to receive (mailbox transit)"

      - name: "mailbox_drops_total"
        type: "counter"
        labels: ["component_id", "reason", "priority"]
        description: "Total messages dropped (by reason)"

      - name: "mailbox_backpressure_active"
        type: "gauge"
        labels: ["component_id"]
        description: "1 if component in backpressure, 0 otherwise"

      - name: "mailbox_message_aged_total"
        type: "counter"
        labels: ["from_priority", "to_priority"]
        description: "Total messages promoted due to aging (starvation prevention)"

    opentelemetry_spans:
      - span_name: "mailbox.send"
        attributes: ["message_id", "message_type", "sender_id", "receiver_id", "priority"]

      - span_name: "mailbox.receive"
        attributes: ["message_id", "message_type", "receiver_id", "queue_depth", "wait_time_ms"]

      - span_name: "mailbox.backpressure"
        attributes: ["component_id", "queue_depth", "threshold", "action"]

  security:
    capability_checking:
      mechanism: "lease_id (HMAC-SHA256 signed capability token)"
      validation: "Router validates lease_id before enqueue"
      rejection: "Messages without valid lease_id → AUTHN_FAILED error"

    rate_limiting:
      per_sender: "100 tokens/second (token bucket)"
      burst: "150 tokens (allow short bursts)"
      max_in_flight: "200 messages per sender (hard limit)"
      max_in_flight_bytes: "1MB per sender (prevent memory exhaustion)"

    admission_control:
      session_quota: "500 msg/s per session (all agents combined)"
      session_memory: "10MB in-flight memory budget"
      rejection: "Exceeded limits → ADMISSION_DENIED error with retry_after_ms"

  performance_budget:
    send_latency: "<1ms P95 (MPSC enqueue, lock-free)"
    receive_latency: "<1ms P95 (MPSC dequeue)"
    serialization: "<0.5ms P95 (FlatBuffers)"
    deserialization: "<0.1ms P95 (FlatBuffers zero-copy)"
    router_validation: "<0.5ms P95 (lease_id check + rate limit)"
    end_to_end_latency: "<5ms P95 (send → receive, including routing)"

  ttl_cleanup:
    description: "Periodic cleanup of expired messages (TTL enforcement)"

    cleanup_configuration:
      cleanup_interval_ms: 100
      description: "Run cleanup every 100ms (async background task)"
      rationale: "Balance between TTL accuracy and performance overhead"

      performance_budget: "<1ms cleanup per 1000 messages"
      implementation: "Lightweight scan of message queue, check timestamp vs TTL"

    cleanup_behavior:
      check_frequency: "Every 100ms (configurable)"
      check_method: "(current_time_ms - message.timestamp) > message.ttl_ms"
      expired_action: "Remove from queue, route to DLQ with reason='TTL_EXPIRED'"
      non_blocking_mode: true
      non_blocking_description: "Cleanup runs async, doesn't block enqueue/dequeue operations"
      batch_processing: true
      batch_description: "Process up to 100 expired messages per cleanup cycle (prevent blocking)"

    integration_with_dlq:
      expired_messages: "Moved to DLQ with reason='TTL_EXPIRED'"
      dlq_entry_includes:
        - "message_id"
        - "message_type"
        - "sender_id"
        - "receiver_id"
        - "timestamp"
        - "ttl_ms"
        - "age_at_expiry_ms"
        - "cognitive_trace_id"

      dlq_retention: "5 minutes (per ADR-0002a)"
      dlq_capacity: "100 messages (FIFO, oldest dropped)"

    metrics:
      - name: "mailbox_messages_expired_total"
        type: "counter"
        labels: ["component_id", "priority"]
        description: "Count of messages expired due to TTL"

      - name: "mailbox_cleanup_latency_ms"
        type: "histogram"
        labels: ["component_id"]
        buckets: [0.1, 0.5, 1, 5, 10]
        description: "Cleanup loop execution time"

      - name: "mailbox_cleanup_messages_scanned"
        type: "histogram"
        labels: ["component_id"]
        buckets: [10, 50, 100, 500, 1000]
        description: "Number of messages scanned per cleanup cycle"

    alert_rules:
      - alert: "HighTTLExpiration"
        expr: "rate(mailbox_messages_expired_total[5m]) > 5"
        duration: "2m"
        severity: "warning"
        description: "More than 5 messages/minute expiring (possible slow consumer or too short TTL)"

      - alert: "SlowCleanup"
        expr: "histogram_quantile(0.95, mailbox_cleanup_latency_ms) > 5"
        duration: "1m"
        severity: "warning"
        description: "Cleanup taking >5ms P95 (exceeds performance budget)"

  related_adrs:
    - adr: "ADR-0002"
      section: "Actor Model - Message Passing"
      lines: "500-800 (Mailbox architecture)"

    - adr: "ADR-0002a"
      section: "Mailbox MPSC Queue Implementation"
      lines: "Lock-free queue, backpressure watermarks"

    - adr: "ADR-0002c"
      section: "Actor Router & Admission Control"
      lines: "Rate limiting, capability checking"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.1"
      author: "Messaging Infrastructure Lead"
