# Actor Router Routing Table Schema Contract
# Issue: 1.2.3 - Actor Router & Admission Control
# Source ADR: ADR-0002c (Actor Router & Admission Control)
# Related ADRs: ADR-0002 (Actor Model), ADR-0002a (Mailbox MPSC Queue)
# Research: Actor Model (Hewitt 1973), Location Transparency

actor_router_routing_table:
  name: "Actor Router Routing Table Schema"
  version: "1.0"
  description: "agent_id → mailbox mapping with location transparency"
  applies_to:
    - "ALL 58 agents (4 AI agents + 54 pure actors)"
    - "Centralized Actor Router manages routing table"
    - "Local routing for MVP, remote routing future-ready"

  routing_table_philosophy:
    goal: "Location transparency - agents send messages without knowing physical location"
    strategy: "Routing table abstracts agent_id → mailbox mapping"
    local_routing: "All 58 agents in same process (Python), direct mailbox access"
    future_remote: "Distributed system support (network RPC to remote agents)"

    location_transparency_origin:
      origin: "Actor Model (Hewitt 1973)"
      principle: "Agents address each other by identifier, not physical location"
      benefits:
        - "Agents can move across machines without code changes"
        - "Load balancing transparent to senders"
        - "Failover to backup agents automatic"
      rationale: "Simplifies distributed system design"

  routing_table_structure:
    description: "HashMap of agent_id → RouteEntry"

    route_entry_schema:
      fields:
        - name: "agent_id"
          type: "string"
          description: "Unique agent identifier"
          example: "agent_planner_123"
          format: "agent_<type>_<instance_id>"

        - name: "agent_type"
          type: "string"
          description: "Agent type (for blacklist matching)"
          example: "agent_planner"

        - name: "agent_version"
          type: "string"
          description: "Agent version (semver)"
          example: "v1.2.0"

        - name: "mailbox"
          type: "PriorityMailbox (reference)"
          description: "Reference to agent's mailbox (local agents only)"
          note: "Direct memory reference for local agents"

        - name: "location"
          type: "enum"
          values: ["LOCAL", "REMOTE"]
          description: "Agent location type"
          default: "LOCAL"

        - name: "remote_address"
          type: "string (optional)"
          description: "Network address for remote agents (future)"
          example: "k1-agent-cluster-2:9001"
          format: "host:port"
          note: "Null for local agents"

        - name: "state"
          type: "enum"
          values: ["PENDING", "WARMING", "ACTIVE", "IDLE", "DRAINING", "TERMINATED"]
          description: "Current agent lifecycle state"
          example: "ACTIVE"
          use_case: "Router can reject messages to TERMINATED agents early"

        - name: "registered_at_ms"
          type: "int64"
          description: "Unix timestamp when agent registered"
          example: 1697097600000000000

        - name: "last_heartbeat_ms"
          type: "int64"
          description: "Unix timestamp of last health check pong"
          example: 1697097600000000000
          use_case: "Router can detect stale entries"

        - name: "capabilities"
          type: "list<string>"
          description: "Agent capabilities (for admission control)"
          example: ["send_message", "call_tool", "read_memory"]

        - name: "roles"
          type: "list<string>"
          description: "Agent roles (for RBAC)"
          example: ["orchestrator", "planner"]

      example:
        agent_id: "agent_planner_123"
        agent_type: "agent_planner"
        agent_version: "v1.2.0"
        mailbox: "<PriorityMailbox at 0x7f8c4a0>"
        location: "LOCAL"
        remote_address: null
        state: "ACTIVE"
        registered_at_ms: 1697097600000000000
        last_heartbeat_ms: 1697097600005000000
        capabilities: ["send_message", "call_tool"]
        roles: ["planner"]

    routing_table_data_structure:
      type: "HashMap<string, RouteEntry>"
      key: "agent_id"
      value: "RouteEntry"
      thread_safety: "RwLock (multiple readers, single writer)"
      initial_capacity: 64
      load_factor: 0.75

      performance:
        lookup: "O(1) - <0.05ms P95"
        insert: "O(1) - <0.1ms P95"
        remove: "O(1) - <0.1ms P95"

  routing_table_operations:
    description: "Operations for routing table management"

    register_agent:
      signature: "register_agent(agent_id, agent_type, agent_version, mailbox, capabilities, roles) -> RouteEntry"
      description: "Register agent in routing table (called when agent spawned)"

      steps:
        - step: 1
          action: "Validate agent_id unique"
          code: "if agent_id in routing_table: raise AlreadyRegisteredError"

        - step: 2
          action: "Create RouteEntry"
          code: "entry = RouteEntry(agent_id=agent_id, mailbox=mailbox, location=LOCAL, ...)"

        - step: 3
          action: "Acquire write lock"
          code: "async with routing_table.write_lock():"

        - step: 4
          action: "Insert into routing table"
          code: "routing_table[agent_id] = entry"

        - step: 5
          action: "Emit metric"
          metric: "router_agents_registered_total{agent_type}"

        - step: 6
          action: "Log registration"
          log: "Agent registered: agent_id={id}, type={type}, version={version}"
          level: "INFO"

        - step: 7
          action: "Return RouteEntry"
          code: "return entry"

      performance: "<0.1ms P95 (HashMap insert)"

      errors:
        - error: "AlreadyRegisteredError"
          condition: "agent_id already exists in routing table"
          mitigation: "Unregister old entry first"

    unregister_agent:
      signature: "unregister_agent(agent_id) -> bool"
      description: "Unregister agent from routing table (called when agent terminated)"

      steps:
        - step: 1
          action: "Acquire write lock"
          code: "async with routing_table.write_lock():"

        - step: 2
          action: "Remove from routing table"
          code: "entry = routing_table.pop(agent_id, None)"

        - step: 3
          action: "If not found, already unregistered"
          code: "if entry is None: return False"

        - step: 4
          action: "Emit metric"
          metric: "router_agents_unregistered_total{agent_type}"

        - step: 5
          action: "Log unregistration"
          log: "Agent unregistered: agent_id={id}, uptime_ms={uptime}"
          level: "INFO"

        - step: 6
          action: "Return True"
          code: "return True"

      performance: "<0.1ms P95 (HashMap remove)"

    lookup_route:
      signature: "lookup_route(agent_id) -> Optional[RouteEntry]"
      description: "Lookup agent route (called for every message)"

      steps:
        - step: 1
          action: "Acquire read lock"
          code: "async with routing_table.read_lock():"

        - step: 2
          action: "Lookup agent"
          code: "entry = routing_table.get(agent_id)"

        - step: 3
          action: "If not found, return None"
          code: "if entry is None: return None"

        - step: 4
          action: "Check if agent active"
          condition: "entry.state == TERMINATED"
          action_if_true: "return None  # Agent dead"

        - step: 5
          action: "Return RouteEntry"
          code: "return entry"

      performance: "<0.05ms P95 (HashMap lookup)"
      caching: "No caching needed (HashMap fast enough)"

    update_agent_state:
      signature: "update_agent_state(agent_id, new_state) -> void"
      description: "Update agent lifecycle state (called by supervisor)"

      steps:
        - step: 1
          action: "Acquire write lock"
          code: "async with routing_table.write_lock():"

        - step: 2
          action: "Lookup agent"
          code: "entry = routing_table.get(agent_id)"

        - step: 3
          action: "If not found, skip"
          code: "if entry is None: return"

        - step: 4
          action: "Update state"
          code: "entry.state = new_state"

        - step: 5
          action: "Emit metric"
          metric: "router_agent_state_transitions_total{agent_id, from_state, to_state}"

        - step: 6
          action: "Log state change"
          log: "Agent state updated: agent_id={id}, state={state}"
          level: "DEBUG"

      performance: "<0.1ms P95"

    update_heartbeat:
      signature: "update_heartbeat(agent_id) -> void"
      description: "Update last heartbeat timestamp (called by health check)"

      steps:
        - step: 1
          action: "Acquire write lock"
          code: "async with routing_table.write_lock():"

        - step: 2
          action: "Lookup agent"
          code: "entry = routing_table.get(agent_id)"

        - step: 3
          action: "If not found, skip"
          code: "if entry is None: return"

        - step: 4
          action: "Update heartbeat timestamp"
          code: "entry.last_heartbeat_ms = current_time_ms()"

      performance: "<0.05ms P95"
      frequency: "Every pong received (1Hz per agent)"

    list_active_agents:
      signature: "list_active_agents() -> list[string]"
      description: "List all active agents (for supervisor monitoring)"

      steps:
        - step: 1
          action: "Acquire read lock"
          code: "async with routing_table.read_lock():"

        - step: 2
          action: "Filter by state"
          code: "active = [id for id, entry in routing_table.items() if entry.state == ACTIVE]"

        - step: 3
          action: "Return agent IDs"
          code: "return active"

      performance: "O(n) - <1ms for 58 agents"
      use_case: "Supervisor health check loop"

  local_routing:
    description: "Direct mailbox access for local agents (MVP)"

    local_route_flow:
      steps:
        - step: 1
          action: "Router receives message"
          code: "await router.route_message(message, lease, session_id)"

        - step: 2
          action: "Lookup receiver route"
          code: "entry = routing_table.lookup(message.receiver_id)"

        - step: 3
          action: "If not found, return AGENT_NOT_FOUND"
          code: "if entry is None: return False, 'AGENT_NOT_FOUND'"

        - step: 4
          action: "Check location is LOCAL"
          condition: "entry.location == LOCAL"

        - step: 5
          action: "Get direct mailbox reference"
          code: "mailbox = entry.mailbox"

        - step: 6
          action: "Enqueue message to mailbox"
          code: "success = mailbox.enqueue(message)"

        - step: 7
          action: "If mailbox full, return MAILBOX_FULL"
          code: "if not success: return False, 'MAILBOX_FULL'"

        - step: 8
          action: "Return success"
          code: "return True, ''"

      performance: "<0.05ms P95 (direct memory access)"
      benefits:
        - "Zero serialization overhead (no network)"
        - "Zero copy (pass message reference)"
        - "Fast (<50μs latency)"

  remote_routing:
    description: "Network RPC for remote agents (future)"

    remote_route_flow:
      steps:
        - step: 1
          action: "Lookup receiver route"
          code: "entry = routing_table.lookup(message.receiver_id)"

        - step: 2
          action: "Check location is REMOTE"
          condition: "entry.location == REMOTE"

        - step: 3
          action: "Serialize message (FlatBuffers)"
          code: "serialized = flatbuffers.serialize(message)"

        - step: 4
          action: "Send RPC to remote host"
          code: "response = await rpc_client.send(entry.remote_address, serialized)"

        - step: 5
          action: "Handle RPC errors"
          error_handling: "Retry with exponential backoff, failover to backup host"

        - step: 6
          action: "Return success"
          code: "return True, ''"

      performance: "1-10ms (depends on network latency)"
      status: "Not implemented in MVP (all agents local)"
      future_work: "Week 8-12 (distributed system support)"

  routing_table_consistency:
    description: "Ensure routing table stays consistent with agent state"

    consistency_guarantees:
      - guarantee: "Single writer"
        description: "Only Agent Supervisor can register/unregister agents"
        enforcement: "Write lock required for mutations"

      - guarantee: "Heartbeat staleness"
        description: "Routing table updated every 1s (pong messages)"
        staleness: "<1s P95"

      - guarantee: "State synchronization"
        description: "Agent state transitions propagated to routing table"
        latency: "<10ms P95"

      - guarantee: "Terminated agent removal"
        description: "Agent unregistered when TERMINATED state reached"
        timing: "Immediate (supervisor triggers unregister)"

    stale_entry_cleanup:
      description: "Background task removes stale entries (no heartbeat >10s)"

      steps:
        - step: 1
          action: "Sleep 60 seconds"
          code: "await asyncio.sleep(60)"

        - step: 2
          action: "Acquire read lock"
          code: "async with routing_table.read_lock():"

        - step: 3
          action: "Find stale entries"
          code: "stale = [id for id, e in routing_table.items() if now - e.last_heartbeat_ms > 10000]"

        - step: 4
          action: "Release read lock"

        - step: 5
          action: "Unregister stale agents"
          code: "for agent_id in stale: await unregister_agent(agent_id)"

        - step: 6
          action: "Repeat forever"

      frequency: "Every 60 seconds"
      performance: "<10ms per iteration"

  routing_table_initialization:
    description: "Initialize routing table at K1 startup"

    initialization_steps:
      - step: 1
        action: "Create empty routing table"
        code: "routing_table = RoutingTable()"

      - step: 2
        action: "Spawn 58 agents (supervisor)"
        code: "for agent_config in agent_configs: spawn_agent(agent_config)"

      - step: 3
        action: "Each agent registers on spawn"
        code: "await routing_table.register_agent(agent_id, mailbox, ...)"

      - step: 4
        action: "Wait for all agents ACTIVE"
        code: "await wait_for_all_active(timeout_ms=10000)"

      - step: 5
        action: "Routing table ready"
        log: "Routing table initialized: {len(routing_table)} agents registered"

    startup_time: "<5s for 58 agents (AI agents slow to warm)"

  performance_budgets:
    lookup_latency:
      p50: "0.02ms"
      p95: "0.05ms"
      p99: "0.1ms"
      note: "HashMap lookup O(1)"

    register_latency:
      p50: "0.05ms"
      p95: "0.1ms"
      p99: "0.2ms"
      note: "HashMap insert O(1)"

    unregister_latency:
      p50: "0.05ms"
      p95: "0.1ms"
      p99: "0.2ms"
      note: "HashMap remove O(1)"

    message_routing_total:
      p50: "0.05ms"
      p95: "0.1ms"
      p99: "0.2ms"
      note: "Includes lookup + mailbox enqueue"

  observability:
    prometheus_metrics:
      - name: "router_routing_table_size"
        type: "gauge"
        labels: []
        description: "Number of registered agents in routing table"

      - name: "router_agents_registered_total"
        type: "counter"
        labels: ["agent_type"]
        description: "Total agents registered"

      - name: "router_agents_unregistered_total"
        type: "counter"
        labels: ["agent_type"]
        description: "Total agents unregistered"

      - name: "router_agent_state_transitions_total"
        type: "counter"
        labels: ["agent_id", "from_state", "to_state"]
        description: "Total agent state transitions"

      - name: "router_lookup_latency_ms"
        type: "histogram"
        labels: []
        buckets: [0.01, 0.05, 0.1, 0.5, 1]
        description: "Routing table lookup latency"

      - name: "router_stale_entries_removed_total"
        type: "counter"
        labels: []
        description: "Total stale entries removed (no heartbeat >10s)"

    structured_logging:
      - event: "router.agent_registered"
        level: "INFO"
        fields:
          - "agent_id"
          - "agent_type"
          - "agent_version"
          - "location"

      - event: "router.agent_unregistered"
        level: "INFO"
        fields:
          - "agent_id"
          - "uptime_ms"

      - event: "router.stale_entry_removed"
        level: "WARNING"
        fields:
          - "agent_id"
          - "last_heartbeat_ms"
          - "staleness_ms"

  testing_requirements:
    unit_tests:
      - test: "Register agent (insert into routing table)"
      - test: "Unregister agent (remove from routing table)"
      - test: "Lookup route (HashMap get)"
      - test: "Update agent state (state transition)"
      - test: "Update heartbeat (timestamp update)"
      - test: "List active agents (filter by state)"
      - test: "Stale entry cleanup (no heartbeat >10s)"

    integration_tests:
      - test: "58 agents register on startup"
      - test: "Message routed to local agent (direct mailbox)"
      - test: "Lookup returns None for TERMINATED agent"
      - test: "Routing table consistent with supervisor state"
      - test: "Stale entries removed after 10s no heartbeat"

    performance_tests:
      - test: "Lookup latency <0.05ms P95"
      - test: "Register latency <0.1ms P95"
      - test: "Routing table size 58 agents"
      - test: "Concurrent lookups (1000 lookups/s)"

  related_contracts:
    - contract: "../mailbox/message_envelope.yml"
      relation: "Messages routed to mailboxes defined in envelope"

    - contract: "../mailbox/mpsc_queue_contract.yml"
      relation: "Routing table references PriorityMailbox instances"

    - contract: "../supervisor/health_check_protocol.yml"
      relation: "Heartbeat updates routing table timestamps"

    - contract: "admission_control.yml"
      relation: "Admission control uses routing table for receiver lookup"

  related_adrs:
    - adr: "ADR-0002c"
      section: "Actor Router"
      lines: "453-495 (routing table structure, local routing)"

    - adr: "ADR-0002"
      section: "Actor Model"
      lines: "Location transparency principle"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.3"
      author: "Infrastructure Lead"
