# Actor Router Admission Control Contract
# Issue: 1.2.3 - Actor Router & Admission Control
# Source ADR: ADR-0002c (Actor Router & Admission Control)
# Related ADRs: ADR-0010 (Capability-Based Security), ADR-0002a (Mailbox MPSC)
# Research: Token Bucket Algorithm, RBAC, HMAC-SHA256

actor_router_admission_control:
  name: "Actor Router Admission Control"
  version: "1.0"
  description: "5-layer admission pipeline (capability, role, rate, in-flight, session)"
  applies_to:
    - "ALL messages between 58 agents pass through admission control"
    - "Zero-trust messaging (every message verified)"
    - "DoS protection via rate limiting and quotas"

  admission_control_philosophy:
    goal: "Prevent unauthorized, malicious, or excessive message traffic"
    strategy: "Multi-layer defense (5 independent checks)"
    zero_trust: "No agent trusted by default, capability proof required"
    fail_fast: "Reject at first check failure (no partial admission)"

    security_principles:
      - principle: "Capability-based security"
        description: "HMAC-SHA256 signed leases prove permission"
        origin: "Capability-based systems (Dennis & Van Horn 1966)"

      - principle: "Role-based access control (RBAC)"
        description: "Message types restricted by sender role"
        origin: "RBAC model (Ferraiolo & Kuhn 1992)"

      - principle: "Rate limiting"
        description: "Token bucket prevents message floods"
        origin: "Token bucket algorithm (Ethernet CSMA/CD)"

      - principle: "Resource quotas"
        description: "In-flight and session limits prevent exhaustion"
        origin: "Resource management (Unix ulimit)"

  admission_pipeline:
    description: "5-layer pipeline - message rejected if ANY layer fails"

    pipeline_layers:
      layer_1_capability_verification:
        order: 1
        name: "Capability Verification"
        purpose: "Cryptographic proof of permission to send message"
        checks:
          - check: "Lease signature valid (HMAC-SHA256)"
            error: "AUTHN_FAILED:INVALID_SIGNATURE"
            retryable: false

          - check: "Lease not expired"
            error: "AUTHN_FAILED:EXPIRED_LEASE"
            retryable: false

          - check: "Sender ID matches lease"
            error: "AUTHN_FAILED:SENDER_MISMATCH"
            retryable: false

          - check: "Receiver ID matches lease"
            error: "AUTHN_FAILED:RECEIVER_MISMATCH"
            retryable: false

          - check: "Capability 'send_message' present"
            error: "AUTHN_FAILED:MISSING_CAPABILITY"
            retryable: false

        latency: "<0.05ms P95 (HMAC verification)"

      layer_2_role_attestation:
        order: 2
        name: "Role Attestation (RBAC)"
        purpose: "Verify sender role authorized to send message type"
        checks:
          - check: "Sender has at least one role"
            error: "AUTHZ_FAILED:NO_ROLES"
            retryable: false

          - check: "Sender role allows message type"
            error: "AUTHZ_FAILED:ROLE_POLICY"
            retryable: false

        latency: "<0.01ms P95 (HashMap lookup)"

      layer_3_token_bucket_rate_limit:
        order: 3
        name: "Token Bucket Rate Limit"
        purpose: "Prevent sender from flooding (DoS protection)"
        limits:
          sustained_rate: "100 messages/second"
          burst_capacity: "150 messages"
          per_sender: true
        checks:
          - check: "Token bucket has >= 1 token"
            error: "SENDER_RATE_LIMIT"
            retryable: true
            backoff: "Exponential (100ms → 200ms → 400ms)"

        latency: "<0.01ms P95 (token deduction)"

      layer_4_in_flight_limits:
        order: 4
        name: "In-Flight Limits"
        purpose: "Prevent sender from exhausting mailbox memory"
        limits:
          message_count: "200 messages per sender"
          byte_limit: "1MB per sender"
        checks:
          - check: "In-flight message count < 200"
            error: "SESSION_QUOTA:INFLIGHT_COUNT"
            retryable: true
            backoff: "Wait for messages to be processed"

          - check: "In-flight bytes < 1MB"
            error: "SESSION_QUOTA:INFLIGHT_BYTES"
            retryable: true
            backoff: "Wait for messages to be processed"

        latency: "<0.01ms P95 (counter check)"

      layer_5_global_session_limits:
        order: 5
        name: "Global Session Limits"
        purpose: "Prevent session from consuming all system resources"
        limits:
          session_rate: "500 messages/second"
          session_memory: "10MB total mailbox memory"
        checks:
          - check: "Session rate < 500 msg/s"
            error: "SESSION_QUOTA:RATE_EXCEEDED"
            retryable: true
            backoff: "Wait 1 second"

          - check: "Session memory < 10MB"
            error: "SESSION_QUOTA:SIZE_EXCEEDED"
            retryable: true
            backoff: "Wait for memory to be released"

          - check: "Receiver mailbox not full"
            error: "MAILBOX_FULL"
            retryable: true
            backoff: "Receiver applies backpressure policy"

          - check: "Receiver agent exists"
            error: "AGENT_NOT_FOUND"
            retryable: false

        latency: "<0.02ms P95 (multiple checks)"

    total_admission_latency:
      p50: "0.05ms"
      p95: "0.1ms"
      p99: "0.2ms"
      note: "All 5 layers combined"

  layer_1_capability_verification:
    description: "HMAC-SHA256 signed capabilities (cryptographic proof)"

    lease_schema:
      fields:
        - name: "lease_id"
          type: "string (UUID)"
          description: "Unique lease identifier"
          example: "lease_12345"

        - name: "sender_id"
          type: "string"
          description: "Agent authorized to send"
          example: "agent_planner_123"

        - name: "receiver_id"
          type: "string"
          description: "Agent authorized to receive"
          example: "agent_orchestrator"

        - name: "roles"
          type: "list<string>"
          description: "Sender roles"
          example: ["planner", "researcher"]

        - name: "capabilities"
          type: "list<string>"
          description: "Granted capabilities"
          example: ["send_message", "call_tool"]

        - name: "issued_at_ms"
          type: "int64"
          description: "Unix timestamp when lease issued"
          example: 1697097600000000000

        - name: "expires_at_ms"
          type: "int64"
          description: "Unix timestamp when lease expires"
          example: 1697101200000000000
          calculation: "issued_at_ms + 3600000ms (1 hour)"

        - name: "signature"
          type: "string (hex)"
          description: "HMAC-SHA256 signature"
          example: "a3f2b1c9..."
          length: 64  # 32 bytes hex-encoded

      example:
        lease_id: "lease_12345"
        sender_id: "agent_planner_123"
        receiver_id: "agent_orchestrator"
        roles: ["planner"]
        capabilities: ["send_message", "call_tool"]
        issued_at_ms: 1697097600000000000
        expires_at_ms: 1697101200000000000
        signature: "a3f2b1c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"

    hmac_signing_algorithm:
      description: "Sign lease with HMAC-SHA256"

      steps:
        - step: 1
          action: "Concatenate lease fields"
          code: "payload = f'{lease_id}:{sender_id}:{receiver_id}:{roles}:{capabilities}:{issued_at}:{expires_at}'"

        - step: 2
          action: "Compute HMAC-SHA256"
          code: "signature = hmac.new(secret_key, payload.encode(), hashlib.sha256).hexdigest()"

        - step: 3
          action: "Return signature"
          code: "return signature"

      secret_key: "32-byte key from config (env var K1_CAPABILITY_SECRET)"
      algorithm: "HMAC-SHA256 (RFC 2104)"
      output_length: "64 hex characters (32 bytes)"

    hmac_verification_algorithm:
      description: "Verify lease signature"

      steps:
        - step: 1
          action: "Recompute expected signature"
          code: "expected_sig = hmac_sign_lease(lease, secret_key)"

        - step: 2
          action: "Constant-time comparison"
          code: "is_valid = hmac.compare_digest(lease.signature, expected_sig)"
          rationale: "Prevent timing attacks"

        - step: 3
          action: "Return validity"
          code: "return is_valid"

      performance: "<0.05ms P95 (HMAC computation fast)"

    capability_checks:
      check_signature:
        code: "if not verify_lease_signature(lease, secret_key): return INVALID_SIGNATURE"

      check_expiry:
        code: "if current_time_ms() > lease.expires_at_ms: return EXPIRED_LEASE"

      check_sender:
        code: "if message.sender_id != lease.sender_id: return SENDER_MISMATCH"

      check_receiver:
        code: "if message.receiver_id != lease.receiver_id: return RECEIVER_MISMATCH"

      check_capability:
        code: "if 'send_message' not in lease.capabilities: return MISSING_CAPABILITY"

  layer_2_role_attestation:
    description: "Role-based access control (RBAC)"

    role_permissions_table:
      orchestrator_role:
        allowed_message_types:
          - "TaskAnnouncement"
          - "AgentProposal"
          - "AgentSelection"
          - "TaskResult"

      planner_role:
        allowed_message_types:
          - "PlanSketch"
          - "PlanValidationRequest"
          - "PlanCommit"
          - "PlanFallback"

      researcher_role:
        allowed_message_types:
          - "ResearchQuery"
          - "ResearchResult"
          - "ContextUpdate"

      tool_runner_role:
        allowed_message_types:
          - "ToolCall"
          - "ToolResult"
          - "ToolError"

      supervisor_role:
        allowed_message_types:
          - "PingMessage"
          - "PongMessage"
          - "RestartCommand"
          - "BlacklistNotification"

      router_role:
        allowed_message_types:
          - "RouteUpdate"
          - "AgentRegistered"
          - "AgentUnregistered"

    role_verification_algorithm:
      steps:
        - step: 1
          action: "Extract sender roles from lease"
          code: "sender_roles = lease.roles"

        - step: 2
          action: "Check if sender has any roles"
          code: "if not sender_roles: return NO_ROLES"

        - step: 3
          action: "For each role, check if message type allowed"
          code: "for role in sender_roles: if msg_type in ROLE_PERMISSIONS[role]: return OK"

        - step: 4
          action: "If no role allows, reject"
          code: "return ROLE_NOT_AUTHORIZED"

      performance: "<0.01ms P95 (HashMap lookups)"

  layer_3_token_bucket_rate_limit:
    description: "Token bucket algorithm (100/s sustained, 150 burst)"

    token_bucket_parameters:
      capacity: 150  # Max tokens (burst capacity)
      refill_rate: 100  # Tokens per second
      cost_per_message: 1
      per_sender: true  # Each sender has own bucket

    token_bucket_state:
      fields:
        - name: "tokens"
          type: "float"
          description: "Current token count (0-150)"
          initial_value: 150  # Start full

        - name: "last_refill_ms"
          type: "int64"
          description: "Last time tokens refilled"
          initial_value: "current_time_ms()"

    token_bucket_algorithm:
      refill:
        description: "Refill tokens based on elapsed time"
        steps:
          - step: 1
            action: "Calculate elapsed time"
            code: "elapsed_ms = current_time_ms() - last_refill_ms"

          - step: 2
            action: "Calculate refill amount"
            code: "refill_amount = (elapsed_ms / 1000.0) * refill_rate"

          - step: 3
            action: "Add tokens (cap at capacity)"
            code: "tokens = min(capacity, tokens + refill_amount)"

          - step: 4
            action: "Update last refill timestamp"
            code: "last_refill_ms = current_time_ms()"

      consume:
        description: "Try to consume tokens for message"
        steps:
          - step: 1
            action: "Refill tokens first"
            code: "refill_tokens()"

          - step: 2
            action: "Check if tokens available"
            code: "if tokens >= cost_per_message:"

          - step: 3
            action: "Deduct tokens"
            code: "tokens -= cost_per_message; return True"

          - step: 4
            action: "If not enough tokens, rate limited"
            code: "else: return False"

    token_bucket_manager:
      data_structure: "HashMap<string, TokenBucket>"
      key: "sender_id"
      value: "TokenBucket state"
      thread_safety: "RwLock"

      operations:
        check_rate_limit:
          signature: "check_rate_limit(sender_id) -> bool"
          steps:
            - step: 1
              action: "Get or create bucket for sender"
              code: "bucket = buckets.setdefault(sender_id, TokenBucket(150, 100))"

            - step: 2
              action: "Try to consume token"
              code: "return bucket.try_consume(cost=1)"

          performance: "<0.01ms P95"

    rate_limit_recovery:
      description: "How sender recovers from rate limit"

      recovery_time:
        empty_bucket: "1.5 seconds (150 tokens / 100 per sec)"
        partial_bucket: "10ms per message (1 token / 100 per sec)"

      retry_strategy:
        - attempt: 1
          backoff_ms: 100

        - attempt: 2
          backoff_ms: 200

        - attempt: 3
          backoff_ms: 400

        - attempt: 4
          backoff_ms: 800

  layer_4_in_flight_limits:
    description: "Prevent sender from exhausting mailbox memory"

    in_flight_limits:
      message_count_limit: 200  # messages per sender
      byte_limit: 1048576  # 1MB per sender

    in_flight_tracker_state:
      data_structures:
        inflight_counts:
          type: "HashMap<string, int>"
          key: "sender_id"
          value: "message_count"

        inflight_bytes:
          type: "HashMap<string, int>"
          key: "sender_id"
          value: "byte_count"

    in_flight_tracking_algorithm:
      track_send:
        description: "Track message sent (increment counters)"
        steps:
          - step: 1
            action: "Estimate message size"
            code: "message_size = len(flatbuffers.serialize(message))"

          - step: 2
            action: "Increment message count"
            code: "inflight_counts[sender_id] += 1"

          - step: 3
            action: "Increment byte count"
            code: "inflight_bytes[sender_id] += message_size"

      track_receive:
        description: "Track message received (decrement counters)"
        steps:
          - step: 1
            action: "Decrement message count"
            code: "inflight_counts[sender_id] = max(0, inflight_counts[sender_id] - 1)"

          - step: 2
            action: "Decrement byte count"
            code: "inflight_bytes[sender_id] = max(0, inflight_bytes[sender_id] - message_size)"

      can_send:
        description: "Check if sender can send message"
        steps:
          - step: 1
            action: "Get current in-flight counts"
            code: "count = inflight_counts.get(sender_id, 0); bytes = inflight_bytes.get(sender_id, 0)"

          - step: 2
            action: "Check message count limit"
            code: "if count >= 200: return False, INFLIGHT_COUNT"

          - step: 3
            action: "Check byte limit"
            code: "if bytes + message_size > 1048576: return False, INFLIGHT_BYTES"

          - step: 4
            action: "Allow send"
            code: "return True, ''"

  layer_5_global_session_limits:
    description: "Prevent session from consuming all system resources"

    session_limits:
      session_rate_limit: 500  # messages/second per session
      session_memory_limit: 10485760  # 10MB per session

    session_tracker_state:
      data_structures:
        session_counts:
          type: "HashMap<string, int>"
          key: "session_id"
          value: "message_count (last 1 second)"

        session_memory:
          type: "HashMap<string, int>"
          key: "session_id"
          value: "total_memory_bytes"

        last_reset_ms:
          type: "HashMap<string, int64>"
          key: "session_id"
          value: "last_reset_timestamp"

    session_limit_algorithm:
      reset_counters:
        description: "Reset session counters every 1 second (rolling window)"
        steps:
          - step: 1
            action: "Check if 1 second elapsed"
            code: "if now - last_reset_ms[session_id] > 1000:"

          - step: 2
            action: "Reset message count"
            code: "session_counts[session_id] = 0"

          - step: 3
            action: "Update last reset timestamp"
            code: "last_reset_ms[session_id] = now"

      can_send:
        description: "Check if session can send message"
        steps:
          - step: 1
            action: "Reset counters if needed"
            code: "reset_counters_if_needed(session_id)"

          - step: 2
            action: "Check session rate limit"
            code: "if session_counts[session_id] >= 500: return False, RATE_EXCEEDED"

          - step: 3
            action: "Check session memory limit"
            code: "if session_memory[session_id] + message_size > 10485760: return False, SIZE_EXCEEDED"

          - step: 4
            action: "Allow send"
            code: "return True, ''"

  admission_error_codes:
    description: "13 error codes for admission rejection"

    error_taxonomy:
      authentication_failures:
        - code: "AUTHN_FAILED:INVALID_SIGNATURE"
          meaning: "Lease HMAC-SHA256 signature invalid"
          retryable: false
          mitigation: "Renew lease from Capability Manager"

        - code: "AUTHN_FAILED:EXPIRED_LEASE"
          meaning: "Lease expired (current_time > expires_at)"
          retryable: false
          mitigation: "Renew lease (pre-emptive renewal at 90% TTL)"

        - code: "AUTHN_FAILED:SENDER_MISMATCH"
          meaning: "Message sender_id != lease sender_id"
          retryable: false
          mitigation: "Fix message sender_id or get correct lease"

        - code: "AUTHN_FAILED:RECEIVER_MISMATCH"
          meaning: "Message receiver_id != lease receiver_id"
          retryable: false
          mitigation: "Fix message receiver_id or get correct lease"

        - code: "AUTHN_FAILED:MISSING_CAPABILITY"
          meaning: "'send_message' not in lease capabilities"
          retryable: false
          mitigation: "Request 'send_message' capability"

      authorization_failures:
        - code: "AUTHZ_FAILED:NO_ROLES"
          meaning: "Sender has no roles in lease"
          retryable: false
          mitigation: "Request role assignment"

        - code: "AUTHZ_FAILED:ROLE_POLICY"
          meaning: "Sender role not authorized for message type"
          retryable: false
          mitigation: "Change message type or request different role"

      rate_limit_failures:
        - code: "SENDER_RATE_LIMIT"
          meaning: "Token bucket depleted (<1 token)"
          retryable: true
          mitigation: "Wait for token refill (10ms per token)"
          backoff: "Exponential (100ms → 200ms → 400ms → 800ms)"

      quota_failures:
        - code: "SESSION_QUOTA:INFLIGHT_COUNT"
          meaning: "In-flight message count >= 200"
          retryable: true
          mitigation: "Wait for messages to be processed"
          backoff: "Linear (100ms per retry)"

        - code: "SESSION_QUOTA:INFLIGHT_BYTES"
          meaning: "In-flight bytes >= 1MB"
          retryable: true
          mitigation: "Wait for messages to be processed"
          backoff: "Linear (100ms per retry)"

        - code: "SESSION_QUOTA:RATE_EXCEEDED"
          meaning: "Session rate >= 500 msg/s"
          retryable: true
          mitigation: "Wait 1 second for counter reset"
          backoff: "Fixed (1000ms)"

        - code: "SESSION_QUOTA:SIZE_EXCEEDED"
          meaning: "Session memory >= 10MB"
          retryable: true
          mitigation: "Wait for memory to be released"
          backoff: "Linear (500ms per retry)"

      routing_failures:
        - code: "MAILBOX_FULL"
          meaning: "Receiver mailbox at HIGH watermark"
          retryable: true
          mitigation: "Receiver applies backpressure policy (DROP_OLDEST or BLOCK_SENDER)"
          backoff: "Exponential (100ms → 200ms → 400ms)"
          note: "Receiver's DLQ logs dropped messages with reason=OVERFLOW"

        - code: "AGENT_NOT_FOUND"
          meaning: "Receiver agent not in routing table"
          retryable: false
          mitigation: "Check agent exists and is registered"

  performance_budgets:
    admission_check_latency:
      layer_1_capability: "0.05ms P95"
      layer_2_role: "0.01ms P95"
      layer_3_rate_limit: "0.01ms P95"
      layer_4_in_flight: "0.01ms P95"
      layer_5_session: "0.02ms P95"
      total: "0.1ms P95"

    throughput:
      single_sender: "100 msg/s sustained, 150 burst"
      all_senders: "500 msg/s per session"
      system_total: "5800 msg/s (58 agents * 100 msg/s)"

    memory_overhead:
      token_buckets: "58 * 32 bytes = 1856 bytes"
      in_flight_trackers: "58 * 64 bytes = 3712 bytes"
      session_trackers: "1 * 128 bytes = 128 bytes"
      total: "~6KB"

  observability:
    prometheus_metrics:
      - name: "router_admissions_total"
        type: "counter"
        labels: ["sender_id", "receiver_id"]
        description: "Total admission checks performed"

      - name: "router_admissions_rejected_total"
        type: "counter"
        labels: ["sender_id", "reason"]
        description: "Total admission rejections by reason"

      - name: "router_admission_latency_ms"
        type: "histogram"
        labels: ["layer"]
        buckets: [0.01, 0.05, 0.1, 0.5, 1]
        description: "Admission check latency per layer"

      - name: "router_token_bucket_tokens"
        type: "gauge"
        labels: ["sender_id"]
        description: "Current token count (0-150)"

      - name: "router_inflight_messages"
        type: "gauge"
        labels: ["sender_id"]
        description: "In-flight message count (0-200)"

      - name: "router_inflight_bytes"
        type: "gauge"
        labels: ["sender_id"]
        description: "In-flight byte count (0-1MB)"

    structured_logging:
      - event: "router.admission_rejected"
        level: "WARNING"
        fields:
          - "sender_id"
          - "receiver_id"
          - "message_type"
          - "rejection_reason"
          - "retryable"

      - event: "router.rate_limit_hit"
        level: "WARNING"
        fields:
          - "sender_id"
          - "tokens_remaining"
          - "burst_used"

  testing_requirements:
    unit_tests:
      - test: "HMAC signature verification (valid + invalid)"
      - test: "Lease expiry check"
      - test: "Role attestation (allowed + denied message types)"
      - test: "Token bucket refill and consume"
      - test: "In-flight limits (message count + bytes)"
      - test: "Session limits (rate + memory)"
      - test: "All 13 error codes triggered"

    integration_tests:
      - test: "End-to-end admission (message passes all 5 layers)"
      - test: "Capability verification rejects invalid signature"
      - test: "Rate limit rejects after 150 burst messages"
      - test: "In-flight limit rejects after 200 messages"
      - test: "Session limit rejects after 500 msg/s"
      - test: "Admission latency <0.1ms P95"

    performance_tests:
      - test: "Admission throughput (10000 messages/s)"
      - test: "Concurrent admission (58 senders)"
      - test: "Rate limit recovery time (<1.5s for empty bucket)"

    security_tests:
      - test: "Forged signature rejected"
      - test: "Expired lease rejected"
      - test: "Unauthorized message type rejected"
      - test: "DoS attack blocked (>100 msg/s sustained)"

  related_contracts:
    - contract: "routing_table_schema.yml"
      relation: "Admission control uses routing table for receiver lookup"

    - contract: "../mailbox/message_envelope.yml"
      relation: "Messages include lease_id for capability verification"

    - contract: "../mailbox/backpressure_contract.yml"
      relation: "MAILBOX_FULL error triggers receiver backpressure"

  related_adrs:
    - adr: "ADR-0002c"
      section: "Admission Control Pipeline"
      lines: "84-400 (5-layer pipeline, token bucket, quotas)"

    - adr: "ADR-0010"
      section: "Capability-Based Security"
      lines: "HMAC-SHA256 signed leases"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.3"
      author: "Infrastructure Lead"
