# Actor Router Priority Routing Contract
# Issue: 1.2.3 - Actor Router & Admission Control
# Source ADR: ADR-0002c (Actor Router & Admission Control)
# Related ADRs: ADR-0002a (Mailbox MPSC Queue), ADR-0010 (Backpressure)
# Research: Priority Queue, Weighted Fair Queuing

actor_router_priority_routing:
  name: "Actor Router Priority Routing"
  version: "1.0"
  description: "Priority-based message routing with token bucket and WFQ"
  applies_to:
    - "ALL messages routed to priority mailboxes"
    - "4 priority levels (URGENT, HIGH, NORMAL, LOW)"
    - "Weighted Fair Queuing (WFQ) for fairness"

  priority_routing_philosophy:
    goal: "Ensure critical messages processed before background messages"
    strategy: "Priority queue per mailbox + WFQ for fairness"
    starvation_prevention: "Aging mechanism promotes LOW → NORMAL after 5s"

    priority_principles:
      - principle: "Urgent messages never dropped"
        description: "URGENT priority (health checks, barge-in) always admitted"
        rationale: "System health and user experience critical"

      - principle: "Priority inversion prevention"
        description: "Aging promotes old LOW messages to NORMAL"
        rationale: "Prevent starvation of background tasks"

      - principle: "Fair bandwidth allocation"
        description: "WFQ ensures all priorities get proportional bandwidth"
        rationale: "Background tasks make progress even under load"

  priority_levels:
    description: "4 priority levels for message routing"

    priority_definitions:
      urgent_priority:
        level: 0
        name: "URGENT"
        description: "Critical system messages (never dropped)"
        examples:
          - "PingMessage (health checks)"
          - "PongMessage (health checks)"
          - "BargeInCommand (user interrupts)"
          - "EmergencyShutdown (system halt)"
        weight: 4  # WFQ weight (40% bandwidth)
        drop_policy: "NEVER"
        aging: "No aging (already highest priority)"

      high_priority:
        level: 1
        name: "HIGH"
        description: "User-facing messages (low latency required)"
        examples:
          - "UserQuery (user input)"
          - "StreamingChunk (LLM output)"
          - "ToolResult (tool execution)"
          - "PlanValidationRequest (blocking)"
        weight: 3  # WFQ weight (30% bandwidth)
        drop_policy: "DROP at 90% mailbox capacity"
        aging: "No aging (user-facing)"

      normal_priority:
        level: 2
        name: "NORMAL"
        description: "Internal coordination messages"
        examples:
          - "TaskAnnouncement (orchestrator)"
          - "AgentProposal (negotiation)"
          - "PlanSketch (planner)"
          - "MemoryUpdate (memory manager)"
        weight: 2  # WFQ weight (20% bandwidth)
        drop_policy: "DROP at 80% mailbox capacity"
        aging: "No aging (standard priority)"

      low_priority:
        level: 3
        name: "LOW"
        description: "Background tasks (deferrable)"
        examples:
          - "MetricFlush (observability)"
          - "LogRotation (maintenance)"
          - "CacheEviction (cleanup)"
          - "DebugTelemetry (diagnostics)"
        weight: 1  # WFQ weight (10% bandwidth)
        drop_policy: "DROP at 50% mailbox capacity"
        aging: "Promote to NORMAL after 5 seconds in queue"

    priority_bandwidth_allocation:
      urgent: "40%"
      high: "30%"
      normal: "20%"
      low: "10%"
      note: "WFQ ensures proportional bandwidth even under saturation"

  priority_mailbox_structure:
    description: "PriorityMailbox with 4 MPSC queues (one per priority)"

    mailbox_architecture:
      queues:
        - priority: "URGENT"
          queue_type: "MPSC (lock-free)"
          capacity: "Unbounded (never dropped)"

        - priority: "HIGH"
          queue_type: "MPSC (lock-free)"
          capacity: "50 messages (bounded)"

        - priority: "NORMAL"
          queue_type: "MPSC (lock-free)"
          capacity: "50 messages (bounded)"

        - priority: "LOW"
          queue_type: "MPSC (lock-free)"
          capacity: "50 messages (bounded)"

      total_capacity: "50 messages (excluding URGENT)"
      overflow_policy: "DROP_OLDEST background message → DLQ"

    mailbox_data_structure:
      fields:
        - name: "component_id"
          type: "string"
          description: "Owner component identifier"

        - name: "urgent_queue"
          type: "MPSC<Message>"
          description: "Unbounded URGENT queue"

        - name: "high_queue"
          type: "MPSC<Message>"
          description: "Bounded HIGH queue (50 messages)"

        - name: "normal_queue"
          type: "MPSC<Message>"
          description: "Bounded NORMAL queue (50 messages)"

        - name: "low_queue"
          type: "MPSC<Message>"
          description: "Bounded LOW queue (50 messages)"

        - name: "total_depth"
          type: "AtomicInt"
          description: "Total messages across all queues"

        - name: "watermarks"
          type: "WatermarkPolicy"
          description: "Backpressure watermarks (25 LOW, 50 HIGH)"

  priority_enqueue_algorithm:
    description: "Enqueue message to appropriate priority queue"

    enqueue_steps:
      - step: 1
        action: "Extract message priority"
        code: "priority = message.priority"

      - step: 2
        action: "Select queue by priority"
        code: "queue = mailbox.queues[priority]"

      - step: 3
        action: "Check if URGENT (never dropped)"
        condition: "priority == URGENT"
        action_if_true: "urgent_queue.push(message); return True"

      - step: 4
        action: "Check mailbox watermark"
        code: "current_depth = mailbox.total_depth.load()"

      - step: 5
        action: "Apply drop policy for priority"
        conditions:
          - priority: "HIGH"
            threshold: "90% (45 messages)"
            action: "if depth > 45: DROP_OLDEST(LOW or NORMAL) → DLQ"

          - priority: "NORMAL"
            threshold: "80% (40 messages)"
            action: "if depth > 40: DROP_OLDEST(LOW) → DLQ"

          - priority: "LOW"
            threshold: "50% (25 messages)"
            action: "if depth > 25: DROP_OLDEST(LOW) → DLQ"

      - step: 6
        action: "Enqueue to priority queue"
        code: "queue.push(message)"

      - step: 7
        action: "Increment total depth"
        code: "mailbox.total_depth.fetch_add(1)"

      - step: 8
        action: "Return success"
        code: "return True"

    drop_oldest_algorithm:
      description: "Drop oldest low-priority message when overflow"

      steps:
        - step: 1
          action: "Try to drop from LOW queue first"
          code: "if low_queue.pop_oldest(): return"

        - step: 2
          action: "If LOW empty, try NORMAL queue"
          code: "if normal_queue.pop_oldest(): return"

        - step: 3
          action: "If both empty, drop new message"
          code: "send_to_dlq(message, reason='OVERFLOW')"

  priority_dequeue_algorithm:
    description: "Dequeue message using Weighted Fair Queuing (WFQ)"

    wfq_algorithm:
      description: "Dequeue from highest non-empty priority queue"

      strict_priority_mode:
        description: "Simple implementation - always dequeue highest priority first"
        steps:
          - step: 1
            action: "Check URGENT queue"
            code: "if urgent_queue.try_pop(): return message"

          - step: 2
            action: "Check HIGH queue"
            code: "if high_queue.try_pop(): return message"

          - step: 3
            action: "Check NORMAL queue"
            code: "if normal_queue.try_pop(): return message"

          - step: 4
            action: "Check LOW queue"
            code: "if low_queue.try_pop(): return message"

          - step: 5
            action: "All queues empty"
            code: "return None"

        note: "Simple but can starve LOW priority under sustained load"

      weighted_fair_queuing_mode:
        description: "Advanced implementation - proportional bandwidth allocation"

        wfq_state:
          - name: "virtual_time"
            type: "float"
            description: "Global virtual clock"

          - name: "finish_times"
            type: "dict[priority, float]"
            description: "Virtual finish time per priority"

        wfq_steps:
          - step: 1
            action: "Calculate virtual finish time for each priority"
            code: "finish_time[p] = virtual_time + message_size / weight[p]"

          - step: 2
            action: "Select message with earliest finish time"
            code: "priority = min(finish_times.keys(), key=lambda p: finish_times[p])"

          - step: 3
            action: "Dequeue from selected priority"
            code: "message = queues[priority].try_pop()"

          - step: 4
            action: "Update virtual time"
            code: "virtual_time = finish_time[priority]"

          - step: 5
            action: "Return message"
            code: "return message"

        benefits:
          - "Proportional bandwidth (40% URGENT, 30% HIGH, 20% NORMAL, 10% LOW)"
          - "Low-priority messages make progress even under load"
          - "No starvation"

        complexity: "O(k) where k = 4 priorities (constant time)"

  aging_mechanism:
    description: "Promote old LOW messages to NORMAL to prevent starvation"

    aging_policy:
      threshold: "5 seconds in queue"
      action: "Promote LOW → NORMAL"
      rationale: "Background tasks should eventually complete"

    aging_algorithm:
      description: "Background task checks message age every 1 second"

      steps:
        - step: 1
          action: "Sleep 1 second"
          code: "await asyncio.sleep(1.0)"

        - step: 2
          action: "Iterate LOW queue messages"
          code: "for message in low_queue:"

        - step: 3
          action: "Check message age"
          code: "age_ms = current_time_ms() - message.timestamp_ms"

        - step: 4
          action: "If age > 5 seconds, promote to NORMAL"
          condition: "age_ms > 5000"

        - step: 5
          action: "Remove from LOW queue"
          code: "low_queue.remove(message)"

        - step: 6
          action: "Update priority to NORMAL"
          code: "message.priority = NORMAL"

        - step: 7
          action: "Enqueue to NORMAL queue"
          code: "normal_queue.push(message)"

        - step: 8
          action: "Emit metric"
          metric: "mailbox_messages_aged_total{from_priority=LOW, to_priority=NORMAL}"

        - step: 9
          action: "Repeat forever"

      performance: "<5ms per aging cycle (50 LOW messages)"
      frequency: "Every 1 second"

  priority_routing_integration:
    description: "Integration with router admission control"

    routing_flow:
      - step: 1
        action: "Router receives message"
        code: "await router.route_message(message, lease, session_id)"

      - step: 2
        action: "Pass through 5-layer admission control"
        see: "admission_control.yml"

      - step: 3
        action: "Admission PASSED - lookup receiver route"
        code: "entry = routing_table.lookup(message.receiver_id)"

      - step: 4
        action: "Get receiver's priority mailbox"
        code: "mailbox = entry.mailbox"

      - step: 5
        action: "Enqueue to priority queue"
        code: "success = mailbox.enqueue(message)  # Uses priority_enqueue_algorithm"

      - step: 6
        action: "If mailbox full, return MAILBOX_FULL"
        code: "if not success: return False, 'MAILBOX_FULL'"

      - step: 7
        action: "Track in-flight (admission control)"
        code: "inflight_tracker.track_send(sender_id, message_size)"

      - step: 8
        action: "Return success"
        code: "return True, ''"

  priority_assignment_rules:
    description: "Rules for assigning message priority"

    assignment_rules:
      - rule: "Health checks always URGENT"
        message_types: ["PingMessage", "PongMessage"]
        priority: "URGENT"
        rationale: "Supervisor must detect crashes <2s"

      - rule: "User interactions always HIGH"
        message_types: ["UserQuery", "StreamingChunk", "BargeInCommand"]
        priority: "HIGH"
        rationale: "User experience requires low latency"

      - rule: "Tool calls HIGH (blocking user)"
        message_types: ["ToolCall", "ToolResult"]
        priority: "HIGH"
        rationale: "User waiting for tool execution"

      - rule: "Internal coordination NORMAL"
        message_types: ["TaskAnnouncement", "AgentProposal", "PlanSketch"]
        priority: "NORMAL"
        rationale: "Not user-facing, but important"

      - rule: "Background tasks LOW"
        message_types: ["MetricFlush", "LogRotation", "CacheEviction"]
        priority: "LOW"
        rationale: "Deferrable, not time-sensitive"

      - rule: "Default priority NORMAL"
        message_types: ["*"]
        priority: "NORMAL"
        rationale: "Safe default for unknown message types"

  performance_budgets:
    enqueue_latency:
      urgent: "0.01ms P95 (unbounded queue)"
      high: "0.02ms P95 (check watermark + enqueue)"
      normal: "0.02ms P95"
      low: "0.02ms P95"

    dequeue_latency:
      strict_priority: "0.01ms P95 (4 queue checks)"
      wfq_mode: "0.05ms P95 (finish time calculation)"

    aging_overhead:
      per_cycle: "<5ms (50 LOW messages)"
      frequency: "Every 1 second"
      cpu_usage: "<0.5% (negligible)"

  observability:
    prometheus_metrics:
      - name: "mailbox_messages_enqueued_total"
        type: "counter"
        labels: ["component_id", "priority"]
        description: "Total messages enqueued by priority"

      - name: "mailbox_messages_dequeued_total"
        type: "counter"
        labels: ["component_id", "priority"]
        description: "Total messages dequeued by priority"

      - name: "mailbox_messages_dropped_total"
        type: "counter"
        labels: ["component_id", "priority", "reason"]
        description: "Total messages dropped (OVERFLOW or BACKPRESSURE)"

      - name: "mailbox_messages_aged_total"
        type: "counter"
        labels: ["from_priority", "to_priority"]
        description: "Total messages promoted by aging mechanism"

      - name: "mailbox_queue_depth_by_priority"
        type: "gauge"
        labels: ["component_id", "priority"]
        description: "Messages in queue per priority level"

      - name: "mailbox_enqueue_latency_ms"
        type: "histogram"
        labels: ["priority"]
        buckets: [0.01, 0.05, 0.1, 0.5, 1]
        description: "Enqueue latency by priority"

      - name: "mailbox_dequeue_latency_ms"
        type: "histogram"
        labels: ["dequeue_mode"]
        buckets: [0.01, 0.05, 0.1, 0.5, 1]
        description: "Dequeue latency (strict_priority vs wfq)"

    structured_logging:
      - event: "mailbox.message_enqueued"
        level: "DEBUG"
        fields:
          - "component_id"
          - "message_id"
          - "priority"
          - "queue_depth"

      - event: "mailbox.message_dropped"
        level: "WARNING"
        fields:
          - "component_id"
          - "message_id"
          - "priority"
          - "drop_reason"
          - "queue_depth"

      - event: "mailbox.message_aged"
        level: "INFO"
        fields:
          - "component_id"
          - "message_id"
          - "from_priority"
          - "to_priority"
          - "age_ms"

  testing_requirements:
    unit_tests:
      - test: "Enqueue to each priority queue"
      - test: "Dequeue strict priority order"
      - test: "Dequeue WFQ proportional bandwidth"
      - test: "Aging promotes LOW → NORMAL after 5s"
      - test: "URGENT never dropped (unbounded queue)"
      - test: "DROP_OLDEST on overflow"
      - test: "Priority assignment rules"

    integration_tests:
      - test: "URGENT messages bypass all queues (health checks)"
      - test: "HIGH messages processed before NORMAL under load"
      - test: "LOW messages eventually processed (aging)"
      - test: "WFQ prevents starvation of LOW priority"
      - test: "Overflow policy drops oldest LOW message"

    performance_tests:
      - test: "Enqueue latency <0.02ms P95"
      - test: "Dequeue latency <0.05ms P95 (WFQ)"
      - test: "Aging cycle <5ms (50 messages)"
      - test: "WFQ bandwidth allocation (40% URGENT, 30% HIGH, 20% NORMAL, 10% LOW)"

    stress_tests:
      - test: "1000 msg/s sustained (all priorities)"
      - test: "10000 LOW messages (aging handles load)"
      - test: "URGENT flood (1000 ping/s) doesn't starve HIGH"

  related_contracts:
    - contract: "../mailbox/mpsc_queue_contract.yml"
      relation: "Priority mailbox uses 4 MPSC queues (one per priority)"

    - contract: "../mailbox/backpressure_contract.yml"
      relation: "Priority routing integrates with watermark backpressure"

    - contract: "admission_control.yml"
      relation: "Router enqueues to priority mailbox after admission"

  related_adrs:
    - adr: "ADR-0002c"
      section: "Priority Routing"
      lines: "227-302 (priority levels, WFQ, aging)"

    - adr: "ADR-0002a"
      section: "Mailbox MPSC Queue"
      lines: "Priority mailbox architecture"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.3"
      author: "Infrastructure Lead"
