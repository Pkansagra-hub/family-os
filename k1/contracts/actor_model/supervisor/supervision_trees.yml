# Supervisor Supervision Trees Contract
# Issue: 1.2.2 - Supervisor Health Check Protocol
# Source ADR: ADR-0002b (Supervisor Monitoring & Crash Recovery)
# Related ADRs: ADR-0005 (Agent Lifecycle FSM), ADR-0003 (Orchestrator 3-Phase)
# Research: Erlang/OTP Supervision Trees (Armstrong et al., 1996)

supervisor_supervision_trees:
  name: "Supervisor Supervision Trees"
  version: "1.0"
  description: "Parent-child hierarchies with ONE_FOR_ONE/ALL_FOR_ONE strategies"
  applies_to:
    - "58 agents organized in parent-child hierarchies"
    - "Centralized Agent Supervisor at root"
    - "Orchestrator supervises Planner/Researcher/Safety Watch"

  supervision_tree_philosophy:
    goal: "Hierarchical fault containment and recovery"
    strategy: "Parent supervises children, decides restart policy"
    fail_fast: "Child crash → notify parent → parent decides action"
    isolation: "Child crash doesn't affect siblings (unless ALL_FOR_ONE)"

    erlang_supervision_tree_origin:
      origin: "Erlang/OTP (Armstrong et al., 1996)"
      principle: "Supervisors form tree structure, each supervises workers or other supervisors"
      strategies:
        - "ONE_FOR_ONE: Restart crashed child only (siblings unaffected)"
        - "ONE_FOR_ALL: Restart all siblings when one crashes (coordinated restart)"
        - "REST_FOR_ONE: Restart crashed child and all younger siblings (order matters)"
      rationale: "Different applications need different failure handling strategies"

    k1_supervision_tree_design:
      root: "Agent Supervisor (supervises all 58 agents)"
      level_1: "Orchestrator (supervises Planner, Researcher, Safety Watch)"
      level_2: "Pure actors (supervised directly by Agent Supervisor)"
      strategy_default: "ONE_FOR_ONE (most agents independent)"
      strategy_orchestrator: "ALL_FOR_ONE (coordinated restart for AI agents)"

  supervision_strategies:
    one_for_one:
      name: "ONE_FOR_ONE"
      description: "Restart only the crashed child, siblings unaffected"
      use_case: "Independent agents (no shared state between siblings)"

      behavior:
        - scenario: "Child A crashes"
          action: "Parent restarts Child A only"
          siblings: "Child B, C, D continue running"

        - scenario: "Child A crashes 5 times"
          action: "Parent blacklists Child A version, other children unaffected"

      k1_examples:
        - parent: "Agent Supervisor"
          children: "54 pure actors (Router, KV Cache, Tool Runner, etc.)"
          rationale: "Pure actors are independent, one crash doesn't affect others"

        - parent: "API Gateway"
          children: "WebSocket Handler, SSE Handler, REST Handler"
          rationale: "Protocol handlers are independent"

    all_for_one:
      name: "ALL_FOR_ONE"
      description: "Restart all siblings when one crashes (coordinated restart)"
      use_case: "Dependent agents (shared state or coordination required)"

      behavior:
        - scenario: "Child A crashes"
          action: "Parent terminates Child B, C, D, then restarts all children in order"
          siblings: "All siblings terminated and restarted"

        - scenario: "Child A crashes 5 times"
          action: "Parent blacklists Child A version, stops restarting all children"

      k1_examples:
        - parent: "Orchestrator"
          children: "Planner, Researcher, Safety Watch"
          rationale: "AI agents coordinate on tasks, shared context requires coordinated restart"

        - parent: "Voice Pipeline"
          children: "VAD, ASR, TTS, Barge-In Handler"
          rationale: "Voice components share audio state, coordinated restart prevents desync"

    rest_for_one:
      name: "REST_FOR_ONE"
      description: "Restart crashed child and all younger siblings (order matters)"
      use_case: "Pipeline agents (earlier stages affect later stages)"

      behavior:
        - scenario: "Child B crashes (order: A, B, C, D)"
          action: "Parent restarts B, C, D in order (A keeps running)"
          rationale: "C and D depend on B output, must restart downstream"

      k1_examples:
        - parent: "SessionState Manager"
          children: "Belief Tracker → Scoreboard → Control State → Persona State"
          rationale: "State sections depend on earlier sections (pipeline order)"

        - parent: "Model Pipeline"
          children: "Tokenizer → Encoder → Attention → Decoder → Output Layer"
          rationale: "Model layers form pipeline, downstream depends on upstream"

      note: "REST_FOR_ONE not currently used in K1, reserved for future use"

  supervision_tree_schema:
    description: "Supervision tree structure"

    supervision_node:
      fields:
        - name: "node_id"
          type: "string"
          description: "Unique supervisor identifier"
          example: "agent_supervisor"

        - name: "node_type"
          type: "enum"
          values: ["ROOT_SUPERVISOR", "SUPERVISOR", "AGENT"]
          description: "Node role in tree"

        - name: "parent_id"
          type: "string (optional)"
          description: "Parent supervisor (null for root)"
          example: "agent_supervisor"

        - name: "children_ids"
          type: "list<string>"
          description: "Child agent/supervisor IDs"
          example: ["agent_orchestrator", "agent_router", "agent_kv_cache"]

        - name: "strategy"
          type: "enum"
          values: ["ONE_FOR_ONE", "ALL_FOR_ONE", "REST_FOR_ONE"]
          description: "Restart strategy for children"
          default: "ONE_FOR_ONE"

        - name: "max_restarts"
          type: "int"
          description: "Max restarts before escalation to parent"
          default: 5

        - name: "restart_window_ms"
          type: "int64"
          description: "Time window for max_restarts"
          default: 600000  # 10 minutes

    supervision_edge:
      fields:
        - name: "parent_id"
          type: "string"
          description: "Supervising agent ID"

        - name: "child_id"
          type: "string"
          description: "Supervised agent ID"

        - name: "child_order"
          type: "int"
          description: "Child order (for REST_FOR_ONE strategy)"
          example: 0  # First child

  k1_supervision_tree_structure:
    description: "K1 Intelligence Module supervision tree"

    tree_visualization: |
      Agent Supervisor (ROOT, ONE_FOR_ONE)
      ├── Orchestrator (SUPERVISOR, ALL_FOR_ONE)
      │   ├── Planner (AGENT)
      │   ├── Researcher (AGENT)
      │   └── Safety Watch (AGENT)
      ├── Router (AGENT)
      ├── KV Cache Manager (AGENT)
      ├── Tool Runner (AGENT)
      ├── MCP Gateway (AGENT)
      ├── SessionState Manager (AGENT)
      ├── Memory Manager (AGENT)
      ├── Protocol Monitor (AGENT)
      ├── Learning Loop (AGENT)
      ├── API Gateway (SUPERVISOR, ONE_FOR_ONE)
      │   ├── WebSocket Handler (AGENT)
      │   ├── SSE Handler (AGENT)
      │   └── REST Handler (AGENT)
      ├── Voice Pipeline (SUPERVISOR, ALL_FOR_ONE)
      │   ├── VAD (AGENT)
      │   ├── ASR (AGENT)
      │   ├── TTS (AGENT)
      │   └── Barge-In Handler (AGENT)
      └── [46 other pure actors] (AGENT)

    tree_statistics:
      total_nodes: 58
      root_supervisors: 1  # Agent Supervisor
      intermediate_supervisors: 3  # Orchestrator, API Gateway, Voice Pipeline
      leaf_agents: 54
      max_depth: 2  # Root → Intermediate → Leaf

    strategy_distribution:
      ONE_FOR_ONE: "55 agents (Agent Supervisor + API Gateway + 53 pure actors)"
      ALL_FOR_ONE: "7 agents (Orchestrator children + Voice Pipeline children)"
      REST_FOR_ONE: "0 agents (reserved for future use)"

  supervision_tree_operations:
    description: "Operations for supervision tree management"

    build_tree:
      signature: "build_tree(config: SupervisionTreeConfig) -> SupervisionTree"
      description: "Build supervision tree from configuration"

      steps:
        - step: 1
          action: "Parse supervision tree config (YAML)"
          code: "config = load_yaml('config/supervision_tree.yml')"

        - step: 2
          action: "Create root supervisor node"
          code: "root = SupervisionNode(id='agent_supervisor', type=ROOT_SUPERVISOR)"

        - step: 3
          action: "Create intermediate supervisor nodes"
          code: "orchestrator = SupervisionNode(id='orchestrator', parent=root, strategy=ALL_FOR_ONE)"

        - step: 4
          action: "Create leaf agent nodes"
          code: "planner = SupervisionNode(id='agent_planner', parent=orchestrator)"

        - step: 5
          action: "Build parent-child relationships"
          code: "root.add_child(orchestrator); orchestrator.add_child(planner)"

        - step: 6
          action: "Validate tree structure (no cycles)"
          code: "validate_tree(root)"

        - step: 7
          action: "Return supervision tree"
          code: "return SupervisionTree(root=root)"

      performance: "<100ms (58 nodes, 57 edges)"

    handle_child_crash:
      signature: "handle_child_crash(parent_id, child_id, crash_type) -> void"
      description: "Parent supervisor handles child crash"

      steps:
        - step: 1
          action: "Parent receives child crash notification"
          code: "await parent.on_child_crash(child_id, crash_type)"

        - step: 2
          action: "Get parent supervision strategy"
          code: "strategy = parent.strategy"

        - step: 3
          action: "If ONE_FOR_ONE, restart crashed child only"
          code: "if strategy == ONE_FOR_ONE: await restart_child(child_id)"

        - step: 4
          action: "If ALL_FOR_ONE, restart all siblings"
          code: "if strategy == ALL_FOR_ONE: await restart_all_children(parent)"

        - step: 5
          action: "If REST_FOR_ONE, restart crashed child and younger siblings"
          code: "if strategy == REST_FOR_ONE: await restart_rest(parent, child_id)"

        - step: 6
          action: "Emit metric"
          metric: "supervisor_child_crash_handled_total{parent, child, strategy}"

        - step: 7
          action: "Log crash handling"
          log: "Child crash handled: parent={p}, child={c}, strategy={s}"
          level: "INFO"

      performance: "<10ms (excluding restart latency)"

    restart_all_children:
      signature: "restart_all_children(parent_id) -> void"
      description: "ALL_FOR_ONE strategy: Restart all children in order"

      steps:
        - step: 1
          action: "Get all children of parent"
          code: "children = parent.children"

        - step: 2
          action: "Terminate all children"
          code: "for child in children: await terminate_agent(child.id)"

        - step: 3
          action: "Wait for all children to reach TERMINATED state"
          code: "await asyncio.gather(*[wait_for_state(c, TERMINATED) for c in children])"

        - step: 4
          action: "Restart all children in order"
          code: "for child in children: await restart_agent(child.id)"

        - step: 5
          action: "Wait for all children to reach ACTIVE state"
          code: "await asyncio.gather(*[wait_for_state(c, ACTIVE) for c in children])"

        - step: 6
          action: "Emit metric"
          metric: "supervisor_all_for_one_restart_total{parent}"

        - step: 7
          action: "Log coordinated restart"
          log: "All children restarted: parent={p}, children={c}"
          level: "INFO"

      performance: "~10s for AI agents (3 children * 3s startup each)"

    escalate_to_parent:
      signature: "escalate_to_parent(child_id, reason) -> void"
      description: "Escalate crash to parent supervisor (max restarts exceeded)"

      steps:
        - step: 1
          action: "Child supervisor gives up (max restarts exceeded)"
          code: "if restart_attempts[child_id] >= 5:"

        - step: 2
          action: "Notify parent supervisor"
          code: "await parent.on_child_supervisor_failed(child_id, reason='MAX_RESTARTS')"

        - step: 3
          action: "Parent decides action (restart child supervisor or blacklist)"
          code: "await parent.handle_escalation(child_id)"

        - step: 4
          action: "If parent also gives up, escalate further up tree"
          code: "if parent_restart_attempts >= 5: await grandparent.on_child_supervisor_failed(...)"

        - step: 5
          action: "If root supervisor gives up, alert operator (critical failure)"
          code: "if parent.type == ROOT_SUPERVISOR: await alert_operator_critical(...)"

      escalation_example:
        level_1: "Planner crashes 5 times → Orchestrator gives up"
        level_2: "Orchestrator escalates to Agent Supervisor"
        level_3: "Agent Supervisor blacklists Planner version or restarts Orchestrator"
        level_4: "If Agent Supervisor gives up, page oncall (critical system failure)"

  supervision_tree_manager:
    description: "Centralized supervision tree manager (singleton)"

    data_structures:
      tree_nodes:
        type: "HashMap<string, SupervisionNode>"
        key: "node_id (agent_id)"
        value: "SupervisionNode"

      parent_child_edges:
        type: "HashMap<string, list<string>>"
        key: "parent_id"
        value: "list of child_ids"

      child_parent_edges:
        type: "HashMap<string, string>"
        key: "child_id"
        value: "parent_id"

    operations:
      get_parent:
        signature: "get_parent(child_id) -> string"
        description: "Get parent supervisor for agent"
        code: "return child_parent_edges[child_id]"
        performance: "O(1) HashMap lookup"

      get_children:
        signature: "get_children(parent_id) -> list<string>"
        description: "Get all children of supervisor"
        code: "return parent_child_edges[parent_id]"
        performance: "O(1) HashMap lookup"

      get_siblings:
        signature: "get_siblings(child_id) -> list<string>"
        description: "Get all siblings of agent (same parent)"
        code: "parent = get_parent(child_id); return get_children(parent)"
        performance: "O(1) two HashMap lookups"

      get_strategy:
        signature: "get_strategy(parent_id) -> SupervisionStrategy"
        description: "Get restart strategy for parent supervisor"
        code: "return tree_nodes[parent_id].strategy"
        performance: "O(1) HashMap lookup"

  supervision_tree_configuration:
    description: "YAML configuration for supervision tree"

    config_file: "k1/config/supervision_tree.yml"

    config_schema:
      supervision_tree:
        root:
          node_id: "agent_supervisor"
          node_type: "ROOT_SUPERVISOR"
          strategy: "ONE_FOR_ONE"
          max_restarts: 5
          restart_window_ms: 600000

        intermediate_supervisors:
          - node_id: "orchestrator"
            parent_id: "agent_supervisor"
            strategy: "ALL_FOR_ONE"
            children:
              - "agent_planner"
              - "agent_researcher"
              - "agent_safety_watch"

          - node_id: "api_gateway"
            parent_id: "agent_supervisor"
            strategy: "ONE_FOR_ONE"
            children:
              - "websocket_handler"
              - "sse_handler"
              - "rest_handler"

          - node_id: "voice_pipeline"
            parent_id: "agent_supervisor"
            strategy: "ALL_FOR_ONE"
            children:
              - "vad_agent"
              - "asr_agent"
              - "tts_agent"
              - "barge_in_handler"

        leaf_agents:
          - agent_id: "agent_router"
            parent_id: "agent_supervisor"
          - agent_id: "agent_kv_cache"
            parent_id: "agent_supervisor"
          # ... 52 more pure actors

  crash_propagation:
    description: "How crashes propagate through supervision tree"

    one_for_one_propagation:
      scenario: "Pure actor crashes (Router)"
      steps:
        - step: 1
          action: "Router crashes"

        - step: 2
          action: "Agent Supervisor detects crash"

        - step: 3
          action: "Agent Supervisor checks strategy (ONE_FOR_ONE)"

        - step: 4
          action: "Agent Supervisor restarts Router only (siblings unaffected)"

        - step: 5
          action: "If Router crashes 5 times, Agent Supervisor blacklists Router version"

        - step: 6
          action: "No escalation (root supervisor handles blacklist)"

    all_for_one_propagation:
      scenario: "Planner crashes (Orchestrator child)"
      steps:
        - step: 1
          action: "Planner crashes"

        - step: 2
          action: "Orchestrator detects crash"

        - step: 3
          action: "Orchestrator checks strategy (ALL_FOR_ONE)"

        - step: 4
          action: "Orchestrator terminates Researcher and Safety Watch"

        - step: 5
          action: "Orchestrator restarts all 3 AI agents (Planner, Researcher, Safety Watch)"

        - step: 6
          action: "If Planner crashes 5 times, Orchestrator escalates to Agent Supervisor"

        - step: 7
          action: "Agent Supervisor blacklists Planner version or restarts entire Orchestrator"

    escalation_chain:
      level_1: "Child agent crashes → Parent supervisor handles"
      level_2: "Child crashes 5 times → Parent supervisor escalates to grandparent"
      level_3: "Parent supervisor crashes → Grandparent handles"
      level_4: "Root supervisor gives up → Alert operator (critical failure)"

  performance_budgets:
    tree_build_latency:
      p50: "50ms"
      p95: "100ms"
      p99: "200ms"
      note: "58 nodes, 57 edges"

    crash_handling_latency:
      one_for_one: "10ms (excluding restart)"
      all_for_one: "10s (includes terminating + restarting 3 AI agents)"
      rest_for_one: "~5s (depends on pipeline depth)"

    escalation_latency:
      p50: "5ms"
      p95: "10ms"
      p99: "20ms"
      note: "Notify parent supervisor"

    tree_lookup_latency:
      get_parent: "O(1) <1ms"
      get_children: "O(1) <1ms"
      get_siblings: "O(1) <1ms"

  observability:
    prometheus_metrics:
      - name: "supervisor_child_crashes_total"
        type: "counter"
        labels: ["parent_id", "child_id", "strategy"]
        description: "Total child crashes handled by parent"

      - name: "supervisor_one_for_one_restarts_total"
        type: "counter"
        labels: ["parent_id", "child_id"]
        description: "Total ONE_FOR_ONE restarts"

      - name: "supervisor_all_for_one_restarts_total"
        type: "counter"
        labels: ["parent_id"]
        description: "Total ALL_FOR_ONE restarts (all siblings)"

      - name: "supervisor_escalations_total"
        type: "counter"
        labels: ["child_id", "parent_id", "reason"]
        description: "Total escalations to parent supervisor"

      - name: "supervisor_tree_depth"
        type: "gauge"
        labels: []
        description: "Max depth of supervision tree"
        value: 2

      - name: "supervisor_tree_nodes"
        type: "gauge"
        labels: []
        description: "Total nodes in supervision tree"
        value: 58

    structured_logging:
      - event: "supervisor.tree_built"
        level: "INFO"
        fields:
          - "total_nodes"
          - "total_edges"
          - "max_depth"
          - "build_latency_ms"

      - event: "supervisor.child_crash_handled"
        level: "INFO"
        fields:
          - "parent_id"
          - "child_id"
          - "strategy"
          - "action (RESTART_ONE, RESTART_ALL, ESCALATE)"

      - event: "supervisor.all_for_one_restart"
        level: "WARNING"
        fields:
          - "parent_id"
          - "children_ids"
          - "restart_latency_ms"

      - event: "supervisor.escalation"
        level: "ERROR"
        fields:
          - "child_id"
          - "parent_id"
          - "reason (MAX_RESTARTS, SUPERVISOR_CRASHED)"

  testing_requirements:
    unit_tests:
      - test: "Build supervision tree from config"
      - test: "Get parent/children/siblings (HashMap lookups)"
      - test: "ONE_FOR_ONE crash handling (single restart)"
      - test: "ALL_FOR_ONE crash handling (all siblings restart)"
      - test: "Escalation to parent (max restarts exceeded)"
      - test: "Tree validation (no cycles)"

    integration_tests:
      - test: "Pure actor crashes → ONE_FOR_ONE restart"
      - test: "Planner crashes → ALL_FOR_ONE restart (Orchestrator children)"
      - test: "Voice component crashes → ALL_FOR_ONE restart (Voice Pipeline)"
      - test: "Escalation chain (child → parent → grandparent)"
      - test: "Root supervisor gives up → operator alert"

    performance_tests:
      - test: "Tree build <100ms P95"
      - test: "ONE_FOR_ONE handling <10ms P95"
      - test: "ALL_FOR_ONE restart ~10s (3 AI agents)"
      - test: "Tree lookup <1ms (get_parent, get_children)"

    chaos_tests:
      - test: "All 58 agents crash simultaneously"
      - test: "Cascading crashes (parent crashes while handling child crash)"
      - test: "Infinite crash loop (agent crashes immediately after restart)"

  related_contracts:
    - contract: "crash_detection.yml"
      relation: "Crash detection notifies parent supervisor"

    - contract: "restart_strategies.yml"
      relation: "Restart strategy (exponential backoff) used by supervision tree"

    - contract: "blacklist_management.yml"
      relation: "Escalation triggers blacklist if max restarts exceeded"

    - contract: "../orchestrator/3phase_coordination.yml"
      relation: "Orchestrator supervises Planner/Researcher/Safety Watch"

  related_adrs:
    - adr: "ADR-0002b"
      section: "Supervision Trees"
      lines: "650-760 (tree structure, strategies, escalation)"

    - adr: "ADR-0005"
      section: "Agent Lifecycle FSM"
      lines: "Agent states during restart (TERMINATED → PENDING → WARMING → ACTIVE)"

    - adr: "ADR-0003"
      section: "Orchestrator 3-Phase"
      lines: "Orchestrator coordinates Planner/Researcher/Safety Watch"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.2"
      author: "Agent Infrastructure Lead"
