# Supervisor Health Check Protocol Contract
# Issue: 1.2.2 - Supervisor Health Check Protocol
# Source ADR: ADR-0002b (Supervisor Monitoring & Crash Recovery)
# Related ADRs: ADR-0005 (Agent Lifecycle FSM)
# Research: Erlang/OTP Supervisor (Armstrong et al., 1996)

supervisor_health_check_protocol:
  name: "Supervisor Health Check Protocol"
  version: "1.0"
  description: "Dual-mode health monitoring (1Hz coarse ping + 200ms event-loop heartbeat)"
  applies_to:
    - "ALL 58 agents (4 AI agents + 54 pure actors)"
    - "Centralized Agent Supervisor monitors all agents"
    - "Crash detection <2s P95 (1.2s average measured)"

  health_check_philosophy:
    goal: "Fast crash detection with minimal overhead"
    strategy: "Coarse ping (1Hz) + fine-grained heartbeat (200ms)"
    fail_fast: "Let agents crash, supervisor restarts (Erlang 'let it crash' philosophy)"

    detection_targets:
      - "Process termination (OS signal SIGTERM/SIGKILL/SIGSEGV)"
      - "Unresponsive agents (no pong within 1.5s)"
      - "Event-loop stalls (heartbeat counter unchanged for 500ms)"

  dual_mode_architecture:
    mode_1_coarse_ping:
      frequency: "1Hz (every 1000ms)"
      purpose: "Detect unresponsive agents (network timeout, agent down)"
      timeout: "1500ms (1.5 seconds)"
      protocol: "Request-response (PingMessage → PongMessage)"
      overhead: "Minimal (1 message/sec per agent, 58 total)"
      detection_latency: "~1500ms worst case"

    mode_2_event_loop_heartbeat:
      frequency: "200ms (agent increments counter)"
      purpose: "Detect event-loop stalls (deadlock, infinite loop)"
      check_interval: "500ms (supervisor checks counter)"
      protocol: "Passive monitoring (atomic counter)"
      overhead: "Zero messages (shared memory counter)"
      detection_latency: "~500ms worst case"

    combined_detection:
      worst_case: "2000ms (2 seconds)"
      average: "1200ms (1.2 seconds measured)"
      target: "<2s P95"

  coarse_ping_protocol:
    description: "1Hz ping-pong health check"

    ping_message_schema:
      message_type: "health_check"
      required_fields:
        - name: "message_id"
          type: "string (UUID)"
          description: "Unique ping identifier"
          example: "ping_12345"

        - name: "sender_id"
          type: "string"
          description: "Always 'agent_supervisor'"
          value: "agent_supervisor"

        - name: "receiver_id"
          type: "string"
          description: "Target agent_id"
          example: "agent_planner_123"

        - name: "timestamp_ms"
          type: "int64"
          description: "Unix timestamp (nanoseconds) when ping sent"
          example: 1697097600000000000

        - name: "sequence_number"
          type: "int"
          description: "Monotonic counter (starts at 0, increments each ping)"
          example: 42
          use_case: "Detect missed pings, measure packet loss"

        - name: "priority"
          type: "int"
          description: "Always URGENT (priority 0)"
          value: 0
          rationale: "Health checks never dropped due to backpressure"

        - name: "ttl_ms"
          type: "int32"
          description: "Time-to-live (3000ms, longer than timeout)"
          value: 3000
          rationale: "Health check messages should not expire"

      example:
        message_id: "ping_12345"
        message_type: "health_check"
        sender_id: "agent_supervisor"
        receiver_id: "agent_planner_123"
        timestamp_ms: 1697097600000000000
        sequence_number: 42
        priority: 0
        ttl_ms: 3000
        payload: "PingMessage{}"

    pong_message_schema:
      message_type: "health_response"
      required_fields:
        - name: "message_id"
          type: "string (UUID)"
          description: "Unique pong identifier"
          example: "pong_12345"

        - name: "sender_id"
          type: "string"
          description: "Responding agent_id"
          example: "agent_planner_123"

        - name: "receiver_id"
          type: "string"
          description: "Always 'agent_supervisor'"
          value: "agent_supervisor"

        - name: "timestamp_ms"
          type: "int64"
          description: "Unix timestamp when pong sent"
          example: 1697097600001000000

        - name: "ping_sequence"
          type: "int"
          description: "Echo back ping sequence_number"
          example: 42
          use_case: "Match pong to ping"

        - name: "agent_state"
          type: "enum"
          values: ["PENDING", "WARMING", "ACTIVE", "IDLE", "DRAINING", "TERMINATED"]
          description: "Current agent lifecycle state"
          example: "ACTIVE"
          use_case: "Supervisor knows agent readiness"

        - name: "mailbox_depth"
          type: "int"
          description: "Current mailbox queue depth (optional)"
          example: 12
          use_case: "Early warning for backpressure"

        - name: "memory_usage_mb"
          type: "int"
          description: "Current memory usage (optional)"
          example: 128
          use_case: "Detect memory leaks"

      example:
        message_id: "pong_12345"
        message_type: "health_response"
        sender_id: "agent_planner_123"
        receiver_id: "agent_supervisor"
        timestamp_ms: 1697097600001000000
        ping_sequence: 42
        agent_state: "ACTIVE"
        mailbox_depth: 12
        memory_usage_mb: 128
        priority: 0
        payload: "PongMessage{ping_seq=42, state=ACTIVE}"

    ping_loop_algorithm:
      description: "Supervisor background loop sends pings every 1s"

      steps:
        - step: 1
          action: "Sleep 1000ms"
          code: "await asyncio.sleep(1.0)"

        - step: 2
          action: "Increment ping sequence number"
          code: "ping_sequence += 1"

        - step: 3
          action: "Iterate all active agents"
          code: "for agent_id in active_agents:"

        - step: 4
          action: "Create PingMessage"
          code: "ping = PingMessage(seq=ping_sequence, receiver_id=agent_id)"

        - step: 5
          action: "Send ping to agent mailbox"
          code: "await router.route_message(ping)"

        - step: 6
          action: "Record pending ping"
          code: "pending_pings[agent_id] = (ping_sequence, current_time_ms())"

        - step: 7
          action: "Check for timeouts (separate loop)"
          code: "await check_ping_timeouts()"

      concurrency: "Single background task (asyncio)"
      performance: "<1ms per ping send (58 agents = 58ms total)"

    pong_handler_algorithm:
      description: "Supervisor handles pong responses"

      steps:
        - step: 1
          action: "Receive PongMessage from agent mailbox"
          trigger: "Agent sends pong"

        - step: 2
          action: "Extract agent_id and ping_sequence"
          code: "agent_id = pong.sender_id; seq = pong.ping_sequence"

        - step: 3
          action: "Check if pending ping exists"
          code: "if agent_id not in pending_pings: return  # Late pong"

        - step: 4
          action: "Verify sequence number matches"
          code: "expected_seq, timestamp = pending_pings[agent_id]"
          validation: "if seq != expected_seq: log_warning('Sequence mismatch')"

        - step: 5
          action: "Calculate round-trip latency"
          code: "latency_ms = current_time_ms() - timestamp"

        - step: 6
          action: "Remove pending ping"
          code: "del pending_pings[agent_id]"

        - step: 7
          action: "Emit metric"
          metric: "supervisor_ping_latency_ms{agent_id}"

        - step: 8
          action: "Update agent health status"
          code: "agent_health_status[agent_id] = 'HEALTHY'"

      performance: "<0.5ms per pong handling"

    timeout_check_algorithm:
      description: "Supervisor checks for ping timeouts (separate loop)"

      steps:
        - step: 1
          action: "Iterate pending pings"
          code: "for agent_id, (seq, timestamp) in pending_pings.items():"

        - step: 2
          action: "Calculate elapsed time"
          code: "elapsed_ms = current_time_ms() - timestamp"

        - step: 3
          action: "Check if timeout exceeded"
          condition: "elapsed_ms > PING_TIMEOUT_MS (1500ms)"

        - step: 4
          action: "Log timeout"
          log: "Agent timeout: agent_id={agent_id}, seq={seq}, elapsed={elapsed_ms}ms"

        - step: 5
          action: "Remove pending ping"
          code: "del pending_pings[agent_id]"

        - step: 6
          action: "Emit metric"
          metric: "supervisor_ping_timeouts_total{agent_id}"

        - step: 7
          action: "Trigger crash handler"
          code: "await supervisor.handle_crash(agent_id, reason='PING_TIMEOUT')"

      check_frequency: "Every 500ms (runs in parallel with ping loop)"
      performance: "<1ms per check (58 agents)"

  event_loop_heartbeat:
    description: "Fine-grained event-loop liveness detection"

    heartbeat_counter:
      type: "Atomic int64"
      location: "Agent instance (shared memory with supervisor)"
      increment_frequency: "200ms (agent event loop)"
      check_frequency: "500ms (supervisor)"
      initial_value: 0

    agent_heartbeat_algorithm:
      description: "Agent increments counter every 200ms in event loop"

      implementation:
        - step: 1
          action: "Start background task in agent event loop"
          code: "asyncio.create_task(heartbeat_loop())"

        - step: 2
          action: "Sleep 200ms"
          code: "await asyncio.sleep(0.2)"

        - step: 3
          action: "Increment atomic counter"
          code: "heartbeat_counter.fetch_add(1, memory_order=RELEASE)"
          memory_ordering: "RELEASE ensures visibility to supervisor"

        - step: 4
          action: "Repeat forever"
          code: "while True: ..."

      overhead: "<0.1ms per increment (atomic operation)"
      failure_modes:
        - "Event loop blocked (infinite loop) → counter stops"
        - "Event loop deadlock → counter stops"
        - "Agent process terminated → counter stops"

    supervisor_heartbeat_check_algorithm:
      description: "Supervisor checks if heartbeat counter changed"

      steps:
        - step: 1
          action: "Sleep 500ms"
          code: "await asyncio.sleep(0.5)"

        - step: 2
          action: "Iterate all active agents"
          code: "for agent_id in active_agents:"

        - step: 3
          action: "Read current heartbeat counter"
          code: "current = agent.heartbeat_counter.load(memory_order=ACQUIRE)"
          memory_ordering: "ACQUIRE ensures reads latest value"

        - step: 4
          action: "Check if in last_heartbeats map"
          code: "if agent_id not in last_heartbeats:"

        - step: 5
          action: "Initialize if first check"
          code: "last_heartbeats[agent_id] = current; continue"

        - step: 6
          action: "Compare with last heartbeat"
          code: "last = last_heartbeats[agent_id]"

        - step: 7
          action: "Check if counter unchanged"
          condition: "current == last"

        - step: 8
          action: "Log event-loop stall"
          log: "Event-loop stall: agent_id={agent_id}, counter={current}"

        - step: 9
          action: "Emit metric"
          metric: "supervisor_event_loop_stalls_total{agent_id}"

        - step: 10
          action: "Trigger crash handler"
          code: "await supervisor.handle_crash(agent_id, reason='EVENT_LOOP_STALL')"

        - step: 11
          action: "Update last heartbeat (if changed)"
          code: "last_heartbeats[agent_id] = current"

      check_frequency: "Every 500ms"
      detection_latency: "500ms-1000ms (depends on when last check was)"
      performance: "<1ms per check (58 agents)"

    benefits:
      - "Detects frozen agents that still respond to pings (rare but possible)"
      - "Zero message overhead (atomic counter in shared memory)"
      - "Fast detection (500ms vs 1500ms ping timeout)"

    limitations:
      - "Only detects event-loop stalls (not CPU-bound infinite loops)"
      - "Requires shared memory (works for local agents only)"

  health_check_lifecycle:
    description: "Health check integration with agent lifecycle FSM"

    agent_states:
      PENDING:
        health_check_enabled: false
        rationale: "Agent not yet initialized"

      WARMING:
        health_check_enabled: true
        ping_timeout_extended: true
        timeout_ms: 5000  # Longer for model loading
        rationale: "Agent initializing, may be slow to respond"

      ACTIVE:
        health_check_enabled: true
        ping_timeout_ms: 1500
        heartbeat_check_enabled: true
        rationale: "Full health monitoring"

      IDLE:
        health_check_enabled: true
        ping_timeout_ms: 2000  # Slightly longer (agent may be sleeping)
        heartbeat_check_enabled: false
        rationale: "Agent idle, less critical"

      DRAINING:
        health_check_enabled: true
        ping_timeout_ms: 3000  # Longer (agent finishing work)
        heartbeat_check_enabled: false
        rationale: "Agent shutting down gracefully"

      TERMINATED:
        health_check_enabled: false
        rationale: "Agent no longer exists"

    transition_handling:
      - transition: "WARMING → ACTIVE"
        action: "Enable heartbeat monitoring, reduce ping timeout to 1500ms"

      - transition: "ACTIVE → IDLE"
        action: "Disable heartbeat monitoring, increase ping timeout to 2000ms"

      - transition: "IDLE → DRAINING"
        action: "Increase ping timeout to 3000ms (graceful shutdown)"

      - transition: "DRAINING → TERMINATED"
        action: "Disable all health checks, remove from active_agents set"

  performance_budgets:
    ping_send_latency:
      p50: "0.5ms"
      p95: "1ms"
      p99: "2ms"

    pong_handling_latency:
      p50: "0.3ms"
      p95: "0.5ms"
      p99: "1ms"

    ping_round_trip:
      p50: "5ms"
      p95: "15ms"
      p99: "50ms"
      rationale: "Includes mailbox enqueue, agent processing, pong send"

    timeout_check_latency:
      p50: "0.5ms"
      p95: "1ms"
      p99: "2ms"

    heartbeat_check_latency:
      p50: "0.3ms"
      p95: "1ms"
      p99: "2ms"

    crash_detection_total:
      worst_case: "2000ms"
      average: "1200ms"
      target: "<2s P95"

  observability:
    prometheus_metrics:
      - name: "supervisor_pings_sent_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total pings sent to agents"

      - name: "supervisor_pongs_received_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total pongs received from agents"

      - name: "supervisor_ping_timeouts_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total ping timeouts (agent unresponsive)"

      - name: "supervisor_ping_latency_ms"
        type: "histogram"
        labels: ["agent_id"]
        buckets: [1, 5, 10, 20, 50, 100, 500]
        description: "Ping round-trip latency"

      - name: "supervisor_heartbeat_checks_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total heartbeat checks performed"

      - name: "supervisor_event_loop_stalls_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total event-loop stalls detected"

      - name: "supervisor_agent_health_status"
        type: "gauge"
        labels: ["agent_id"]
        values: [0, 1]
        description: "1 if agent healthy (recent pong), 0 otherwise"

    structured_logging:
      - event: "supervisor.ping_sent"
        level: "DEBUG"
        fields: ["agent_id", "sequence_number", "timestamp_ms"]

      - event: "supervisor.pong_received"
        level: "DEBUG"
        fields: ["agent_id", "sequence_number", "latency_ms", "agent_state"]

      - event: "supervisor.ping_timeout"
        level: "ERROR"
        fields: ["agent_id", "sequence_number", "elapsed_ms", "timestamp_ms"]

      - event: "supervisor.event_loop_stall"
        level: "ERROR"
        fields: ["agent_id", "heartbeat_counter", "last_check_ms", "timestamp_ms"]

      - event: "supervisor.health_check_enabled"
        level: "INFO"
        fields: ["agent_id", "agent_state", "ping_timeout_ms"]

  testing_requirements:
    unit_tests:
      - test: "Ping message serialization/deserialization"
      - test: "Pong message serialization/deserialization"
      - test: "Ping timeout detection (mock 1.5s delay)"
      - test: "Heartbeat counter increment (agent side)"
      - test: "Heartbeat stall detection (supervisor side)"
      - test: "Pending ping tracking (add/remove)"
      - test: "Sequence number monotonicity"

    integration_tests:
      - test: "End-to-end ping-pong (supervisor → agent → supervisor)"
      - test: "Ping timeout triggers crash handler"
      - test: "Event-loop stall triggers crash handler"
      - test: "Health check lifecycle (WARMING → ACTIVE → IDLE)"
      - test: "58 agents concurrent health checks"
      - test: "Ping round-trip latency <50ms P99"

    performance_tests:
      - test: "Ping send throughput (58 agents in 58ms)"
      - test: "Pong handling throughput (58 pongs in 29ms)"
      - test: "Timeout check latency (<1ms for 58 agents)"
      - test: "Heartbeat check latency (<1ms for 58 agents)"
      - test: "Crash detection latency (<2s P95)"

  related_contracts:
    - contract: "crash_detection.yml"
      relation: "Health check protocol triggers crash detection"

    - contract: "restart_strategies.yml"
      relation: "Crash handler initiates restart with exponential backoff"

    - contract: "../mailbox/message_envelope.yml"
      relation: "Ping/pong messages use standard envelope (priority=URGENT)"

  related_adrs:
    - adr: "ADR-0002b"
      section: "Supervisor Monitoring & Crash Recovery"
      lines: "Complete ADR (health check, crash detection, blacklist, restart)"

    - adr: "ADR-0005"
      section: "Agent Lifecycle FSM"
      lines: "Agent states and transitions"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.2"
      author: "Agent Infrastructure Lead"
