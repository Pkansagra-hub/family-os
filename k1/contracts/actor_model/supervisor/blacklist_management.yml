# Supervisor Blacklist Management Contract
# Issue: 1.2.2 - Supervisor Health Check Protocol
# Source ADR: ADR-0002b (Supervisor Monitoring & Crash Recovery)
# Related ADRs: ADR-0005 (Agent Lifecycle FSM)
# Research: Circuit Breaker Pattern (Netflix Hystrix), Erlang/OTP

supervisor_blacklist_management:
  name: "Supervisor Blacklist Management"
  version: "1.0"
  description: "Per-version blacklist (3 crashes in 10min → 1hr blacklist)"
  applies_to:
    - "ALL 58 agent types (agent_type:version combinations)"
    - "Centralized Agent Supervisor enforces blacklist"
    - "Prevents infinite crash-restart loops"

  blacklist_philosophy:
    goal: "Prevent supervisor from wasting resources on repeatedly crashing agents"
    strategy: "Temporarily ban agent versions that crash too frequently"
    circuit_breaker_analogy: "Like Netflix Hystrix circuit breaker (OPEN → reject requests)"
    fail_fast: "Better to reject hire requests than crash 10 times in a row"

    per_version_rationale:
      description: "Blacklist agent_type:version, not agent_id"
      benefits:
        - "Bug in agent version 1.2 → blacklist 1.2, allow 1.3"
        - "Agent instance crash is transient → only blacklists after 3 crashes"
        - "Different agent types isolated (Planner crash doesn't affect Researcher)"
      example: "agent_planner:v1.2.0 crashes 3x → blacklist v1.2.0, allow v1.3.0"

  blacklist_policy:
    trigger_condition:
      description: "3 crashes within 10-minute sliding window"
      crash_window_ms: 600000  # 10 minutes
      crash_threshold: 3
      rationale: "Transient crashes (1-2x) are normal, persistent crashes (3+) indicate bug"

    blacklist_duration:
      duration_ms: 3600000  # 1 hour
      rationale: "Long enough to prevent immediate retry, short enough to allow recovery"
      expiry: "Automatic after 1 hour (no manual intervention)"

    blacklist_scope:
      granularity: "per-version (agent_type:version)"
      example: "agent_planner:v1.2.0"
      not_blacklisted_example_1: "agent_planner:v1.3.0"
      not_blacklisted_example_2: "agent_researcher:v1.2.0"

    enforcement_points:
      - point: "Agent hire requests (Orchestrator → Supervisor)"
        action: "Reject hire request if agent version blacklisted"
        response: "HireResponse(status=REJECTED, reason=BLACKLISTED)"

      - point: "Agent restart attempts (Crash Handler → Restart Manager)"
        action: "Skip restart if agent version blacklisted"
        response: "Log error, emit metric, alert operator"

  blacklist_entry_schema:
    description: "In-memory blacklist entry"

    fields:
      - name: "agent_type"
        type: "string"
        description: "Agent type identifier"
        example: "agent_planner"

      - name: "agent_version"
        type: "string"
        description: "Agent version (semver)"
        example: "v1.2.0"

      - name: "blacklist_key"
        type: "string"
        description: "Composite key (agent_type:version)"
        example: "agent_planner:v1.2.0"
        use_case: "HashMap key for fast lookups"

      - name: "blacklisted_at_ms"
        type: "int64"
        description: "Unix timestamp when blacklisted"
        example: 1697097600000000000

      - name: "expires_at_ms"
        type: "int64"
        description: "Unix timestamp when blacklist expires"
        example: 1697101200000000000
        calculation: "blacklisted_at_ms + 3600000ms"

      - name: "crash_count"
        type: "int"
        description: "Number of crashes in window (always 3+ when blacklisted)"
        example: 3

      - name: "crash_timestamps_ms"
        type: "list<int64>"
        description: "Timestamps of crashes that triggered blacklist"
        example: [1697097000000, 1697097300000, 1697097600000]
        use_case: "Forensics and debugging"

      - name: "reason"
        type: "string"
        description: "Human-readable blacklist reason"
        example: "3 crashes in 10 minutes (PROCESS_TERMINATION x2, PING_TIMEOUT x1)"

      - name: "operator_notified"
        type: "bool"
        description: "Whether operator alert sent"
        default: false

    example:
      agent_type: "agent_planner"
      agent_version: "v1.2.0"
      blacklist_key: "agent_planner:v1.2.0"
      blacklisted_at_ms: 1697097600000000000
      expires_at_ms: 1697101200000000000
      crash_count: 3
      crash_timestamps_ms: [1697097000000, 1697097300000, 1697097600000]
      reason: "3 crashes in 10 minutes (PROCESS_TERMINATION x2, PING_TIMEOUT x1)"
      operator_notified: true

  crash_history_tracking:
    description: "Track crash history per agent version in sliding window"

    crash_history_entry:
      fields:
        - name: "agent_type"
          type: "string"

        - name: "agent_version"
          type: "string"

        - name: "agent_id"
          type: "string"
          description: "Specific instance that crashed"

        - name: "crash_type"
          type: "enum"
          values: ["PROCESS_TERMINATION", "PING_TIMEOUT", "EVENT_LOOP_STALL"]

        - name: "timestamp_ms"
          type: "int64"

        - name: "context"
          type: "map<string, any>"
          description: "Crash context from crash_detection.yml"

    storage:
      type: "In-memory deque per agent version"
      key: "agent_type:version"
      value: "deque<CrashHistoryEntry>"
      max_size: 100  # Keep last 100 crashes per version
      cleanup: "Remove entries older than 10 minutes"

    sliding_window_algorithm:
      description: "Count crashes in last 10 minutes"

      steps:
        - step: 1
          action: "Agent crashes, crash handler invoked"
          code: "await handle_crash(agent_id, crash_type, ...)"

        - step: 2
          action: "Extract agent_type and agent_version"
          code: "agent_type, agent_version = parse_agent_id(agent_id)"

        - step: 3
          action: "Create crash history entry"
          code: "entry = CrashHistoryEntry(...)"

        - step: 4
          action: "Append to crash history"
          code: "crash_history[agent_key].append(entry)"

        - step: 5
          action: "Remove old crashes (>10 minutes)"
          code: "remove_old_crashes(agent_key, window_ms=600000)"

        - step: 6
          action: "Count crashes in window"
          code: "crash_count = len(crash_history[agent_key])"

        - step: 7
          action: "Check if threshold exceeded"
          condition: "crash_count >= 3"

        - step: 8
          action: "If yes, add to blacklist"
          code: "await blacklist_manager.add_blacklist(agent_key, crash_count, crash_history)"

  blacklist_manager:
    description: "Centralized blacklist manager (singleton)"

    data_structures:
      blacklist_map:
        type: "HashMap<string, BlacklistEntry>"
        key: "agent_type:version"
        value: "BlacklistEntry"
        thread_safety: "RwLock (multiple readers, single writer)"

      crash_history_map:
        type: "HashMap<string, deque<CrashHistoryEntry>>"
        key: "agent_type:version"
        value: "deque<CrashHistoryEntry>"
        thread_safety: "RwLock"

    operations:
      add_blacklist:
        signature: "add_blacklist(agent_type, agent_version, crash_count, crash_timestamps) -> BlacklistEntry"
        description: "Add agent version to blacklist"

        steps:
          - step: 1
            action: "Create blacklist key"
            code: "key = f'{agent_type}:{agent_version}'"

          - step: 2
            action: "Calculate expiry timestamp"
            code: "expires_at = current_time_ms() + BLACKLIST_DURATION_MS"

          - step: 3
            action: "Create blacklist entry"
            code: "entry = BlacklistEntry(...)"

          - step: 4
            action: "Acquire write lock"
            code: "async with blacklist_map.write_lock():"

          - step: 5
            action: "Insert into blacklist map"
            code: "blacklist_map[key] = entry"

          - step: 6
            action: "Emit blacklist metric"
            metric: "supervisor_agent_blacklisted_total{agent_type, agent_version}"

          - step: 7
            action: "Log blacklist event"
            log: "Agent version blacklisted: key={key}, crash_count={count}, expires_at={expires}"
            level: "ERROR"

          - step: 8
            action: "Alert operator"
            code: "await alert_operator(key, reason='BLACKLISTED')"

          - step: 9
            action: "Return blacklist entry"
            code: "return entry"

        performance: "<10ms P95 (HashMap insert + alert)"

      is_blacklisted:
        signature: "is_blacklisted(agent_type, agent_version) -> bool"
        description: "Check if agent version is blacklisted"

        steps:
          - step: 1
            action: "Create blacklist key"
            code: "key = f'{agent_type}:{agent_version}'"

          - step: 2
            action: "Acquire read lock"
            code: "async with blacklist_map.read_lock():"

          - step: 3
            action: "Lookup blacklist entry"
            code: "entry = blacklist_map.get(key)"

          - step: 4
            action: "If not found, not blacklisted"
            code: "if entry is None: return False"

          - step: 5
            action: "Check if expired"
            code: "if current_time_ms() > entry.expires_at_ms:"

          - step: 6
            action: "If expired, remove from blacklist"
            code: "await remove_blacklist(key)"

          - step: 7
            action: "Return False (expired = not blacklisted)"
            code: "return False"

          - step: 8
            action: "If not expired, return True"
            code: "return True"

        performance: "<1ms P95 (HashMap lookup)"

      remove_blacklist:
        signature: "remove_blacklist(agent_type, agent_version) -> bool"
        description: "Remove agent version from blacklist (manual or automatic expiry)"

        steps:
          - step: 1
            action: "Create blacklist key"
            code: "key = f'{agent_type}:{agent_version}'"

          - step: 2
            action: "Acquire write lock"
            code: "async with blacklist_map.write_lock():"

          - step: 3
            action: "Remove from blacklist map"
            code: "entry = blacklist_map.pop(key, None)"

          - step: 4
            action: "If not found, already removed"
            code: "if entry is None: return False"

          - step: 5
            action: "Emit unblacklist metric"
            metric: "supervisor_agent_unblacklisted_total{agent_type, agent_version}"

          - step: 6
            action: "Log unblacklist event"
            log: "Agent version unblacklisted: key={key}, blacklisted_duration_ms={duration}"
            level: "INFO"

          - step: 7
            action: "Return True"
            code: "return True"

        performance: "<5ms P95 (HashMap remove + metric)"

      record_crash:
        signature: "record_crash(agent_id, crash_type, context) -> int"
        description: "Record crash in history, return crash count in window"

        steps:
          - step: 1
            action: "Extract agent_type and agent_version"
            code: "agent_type, agent_version = parse_agent_id(agent_id)"

          - step: 2
            action: "Create crash history entry"
            code: "entry = CrashHistoryEntry(...)"

          - step: 3
            action: "Create crash history key"
            code: "key = f'{agent_type}:{agent_version}'"

          - step: 4
            action: "Acquire write lock"
            code: "async with crash_history_map.write_lock():"

          - step: 5
            action: "Get or create crash history deque"
            code: "history = crash_history_map.setdefault(key, deque(maxlen=100))"

          - step: 6
            action: "Append crash entry"
            code: "history.append(entry)"

          - step: 7
            action: "Remove old crashes (>10 minutes)"
            code: "remove_old_crashes(history, window_ms=600000)"

          - step: 8
            action: "Count crashes in window"
            code: "crash_count = len(history)"

          - step: 9
            action: "Return crash count"
            code: "return crash_count"

        performance: "<5ms P95 (deque append + cleanup)"

      expiry_background_task:
        description: "Background task removes expired blacklist entries every 60s"

        steps:
          - step: 1
            action: "Sleep 60 seconds"
            code: "await asyncio.sleep(60)"

          - step: 2
            action: "Acquire read lock"
            code: "async with blacklist_map.read_lock():"

          - step: 3
            action: "Find expired entries"
            code: "expired = [k for k, v in blacklist_map.items() if current_time_ms() > v.expires_at_ms]"

          - step: 4
            action: "Release read lock"
            code: "# Exit read lock context"

          - step: 5
            action: "Remove expired entries"
            code: "for key in expired: await remove_blacklist(*key.split(':'))"

          - step: 6
            action: "Repeat forever"
            code: "while True: ..."

        performance: "<10ms per iteration (58 agent types)"

  hire_request_enforcement:
    description: "Reject hire requests for blacklisted agent versions"

    hire_request_flow:
      steps:
        - step: 1
          action: "Orchestrator sends hire request"
          code: "hire_req = HireRequest(agent_type='agent_planner', agent_version='v1.2.0')"

        - step: 2
          action: "Supervisor receives hire request"
          code: "await supervisor.hire_agent(hire_req)"

        - step: 3
          action: "Check blacklist before hiring"
          code: "if blacklist_manager.is_blacklisted(hire_req.agent_type, hire_req.agent_version):"

        - step: 4
          action: "If blacklisted, reject immediately"
          code: "return HireResponse(status=REJECTED, reason=BLACKLISTED, blacklist_expires_at=...)"

        - step: 5
          action: "Emit rejection metric"
          metric: "supervisor_hire_rejected_total{agent_type, agent_version, reason=BLACKLISTED}"

        - step: 6
          action: "Log rejection"
          log: "Hire request rejected: agent={type}:{version}, reason=BLACKLISTED"
          level: "WARNING"

        - step: 7
          action: "If not blacklisted, proceed with hire"
          code: "agent = await spawn_agent(hire_req)"

    hire_response_schema:
      status: "REJECTED"
      reason: "BLACKLISTED"
      message: "Agent version blacklisted due to 3 crashes in 10 minutes"
      blacklist_expires_at_ms: 1697101200000000000
      suggested_action: "Try different agent version or wait for blacklist expiry"

  restart_enforcement:
    description: "Skip restart attempts for blacklisted agent versions"

    restart_flow:
      steps:
        - step: 1
          action: "Crash handler triggers restart"
          code: "await restart_manager.restart_agent(agent_id)"

        - step: 2
          action: "Extract agent_type and agent_version"
          code: "agent_type, agent_version = parse_agent_id(agent_id)"

        - step: 3
          action: "Check blacklist before restart"
          code: "if blacklist_manager.is_blacklisted(agent_type, agent_version):"

        - step: 4
          action: "If blacklisted, skip restart"
          code: "log_error('Restart skipped: agent blacklisted'); return"

        - step: 5
          action: "Emit restart skipped metric"
          metric: "supervisor_restart_skipped_total{agent_type, agent_version, reason=BLACKLISTED}"

        - step: 6
          action: "Alert operator (if not already notified)"
          code: "if not entry.operator_notified: await alert_operator(...)"

        - step: 7
          action: "If not blacklisted, proceed with restart"
          code: "await spawn_agent_with_backoff(...)"

  operator_alerts:
    description: "Alert operator when agent version blacklisted"

    alert_trigger:
      condition: "Agent version added to blacklist (3 crashes in 10 minutes)"

    alert_channels:
      - channel: "PagerDuty"
        severity: "warning"
        description: "Non-critical alert (not immediate outage)"

      - channel: "Slack"
        channel_name: "#k1-alerts"
        mention: "@oncall"

      - channel: "Email"
        recipients: ["k1-oncall@company.com"]

    alert_payload:
      fields:
        - field: "agent_type"
          value: "agent_planner"

        - field: "agent_version"
          value: "v1.2.0"

        - field: "blacklist_key"
          value: "agent_planner:v1.2.0"

        - field: "crash_count"
          value: 3

        - field: "crash_timestamps"
          value: [1697097000000, 1697097300000, 1697097600000]

        - field: "crash_types"
          value: ["PROCESS_TERMINATION", "PROCESS_TERMINATION", "PING_TIMEOUT"]

        - field: "blacklist_expires_at"
          value: "2025-10-14T12:00:00Z"

        - field: "suggested_action"
          value: "Investigate agent crashes, deploy bug fix, or rollback to v1.1.0"

        - field: "runbook_link"
          value: "https://wiki.company.com/k1/blacklist-recovery"

    alert_message_template: |
      ⚠️ K1 Agent Version Blacklisted

      Agent: {agent_type}:{agent_version}
      Reason: {crash_count} crashes in 10 minutes
      Crash Types: {crash_types}
      Blacklist Expires: {blacklist_expires_at}

      Suggested Actions:
      1. Review crash logs: {crash_forensics_link}
      2. Deploy bug fix or rollback to stable version
      3. Wait for blacklist expiry (1 hour)

      Runbook: {runbook_link}

  performance_budgets:
    is_blacklisted_latency:
      p50: "0.5ms"
      p95: "1ms"
      p99: "2ms"
      note: "HashMap lookup (O(1))"

    add_blacklist_latency:
      p50: "5ms"
      p95: "10ms"
      p99: "20ms"
      note: "Includes alert sending"

    remove_blacklist_latency:
      p50: "2ms"
      p95: "5ms"
      p99: "10ms"

    record_crash_latency:
      p50: "2ms"
      p95: "5ms"
      p99: "10ms"
      note: "Deque append + cleanup"

    hire_rejection_latency:
      p50: "1ms"
      p95: "2ms"
      p99: "5ms"
      note: "Blacklist check + response creation"

  observability:
    prometheus_metrics:
      - name: "supervisor_agent_blacklisted_total"
        type: "counter"
        labels: ["agent_type", "agent_version"]
        description: "Total agent versions blacklisted"

      - name: "supervisor_agent_unblacklisted_total"
        type: "counter"
        labels: ["agent_type", "agent_version"]
        description: "Total agent versions unblacklisted (expired)"

      - name: "supervisor_blacklist_size"
        type: "gauge"
        labels: []
        description: "Current number of blacklisted agent versions"

      - name: "supervisor_hire_rejected_total"
        type: "counter"
        labels: ["agent_type", "agent_version", "reason"]
        description: "Total hire requests rejected (reason=BLACKLISTED)"

      - name: "supervisor_restart_skipped_total"
        type: "counter"
        labels: ["agent_type", "agent_version", "reason"]
        description: "Total restart attempts skipped (reason=BLACKLISTED)"

      - name: "supervisor_crash_history_size"
        type: "gauge"
        labels: ["agent_type", "agent_version"]
        description: "Number of crashes in 10-minute window"

    structured_logging:
      - event: "supervisor.agent_blacklisted"
        level: "ERROR"
        fields:
          - "agent_type"
          - "agent_version"
          - "crash_count"
          - "crash_timestamps_ms"
          - "blacklist_expires_at_ms"

      - event: "supervisor.agent_unblacklisted"
        level: "INFO"
        fields:
          - "agent_type"
          - "agent_version"
          - "blacklist_duration_ms"

      - event: "supervisor.hire_rejected_blacklist"
        level: "WARNING"
        fields:
          - "agent_type"
          - "agent_version"
          - "blacklist_expires_at_ms"

      - event: "supervisor.restart_skipped_blacklist"
        level: "WARNING"
        fields:
          - "agent_type"
          - "agent_version"
          - "crash_count_in_window"

  testing_requirements:
    unit_tests:
      - test: "Blacklist entry creation"
      - test: "Crash history tracking (append, cleanup)"
      - test: "Sliding window crash count"
      - test: "Blacklist expiry (automatic removal)"
      - test: "is_blacklisted returns True/False correctly"
      - test: "Hire rejection for blacklisted version"
      - test: "Restart skipped for blacklisted version"

    integration_tests:
      - test: "Agent crashes 3x → blacklisted"
      - test: "Blacklist prevents hire request"
      - test: "Blacklist prevents restart"
      - test: "Blacklist expires after 1 hour"
      - test: "Different versions isolated (v1.2 blacklisted, v1.3 allowed)"
      - test: "Operator alert sent on blacklist"

    performance_tests:
      - test: "is_blacklisted <1ms P95"
      - test: "add_blacklist <10ms P95"
      - test: "record_crash <5ms P95"
      - test: "Expiry task <10ms per iteration"

    chaos_tests:
      - test: "100 agent versions blacklisted concurrently"
      - test: "Crash storm (1000 crashes in 1 minute)"
      - test: "Blacklist map memory usage (10k entries)"

  related_contracts:
    - contract: "crash_detection.yml"
      relation: "Crash handler calls blacklist manager after detecting crash"

    - contract: "restart_strategies.yml"
      relation: "Restart manager checks blacklist before restart"

    - contract: "../orchestrator/agent_hiring.yml"
      relation: "Supervisor rejects hire requests for blacklisted versions"

  related_adrs:
    - adr: "ADR-0002b"
      section: "Blacklist Management"
      lines: "400-500 (blacklist policy, duration, enforcement)"

    - adr: "ADR-0005"
      section: "Agent Lifecycle FSM"
      lines: "TERMINATED state (post-blacklist)"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.2"
      author: "Agent Infrastructure Lead"
