# Supervisor Restart Strategies Contract
# Issue: 1.2.2 - Supervisor Health Check Protocol
# Source ADR: ADR-0002b (Supervisor Monitoring & Crash Recovery)
# Related ADRs: ADR-0005 (Agent Lifecycle FSM)
# Research: Exponential Backoff (Ethernet CSMA/CD), Erlang/OTP Supervisor

supervisor_restart_strategies:
  name: "Supervisor Restart Strategies"
  version: "1.0"
  description: "Exponential backoff restart (200ms → 30s cap), max 5 attempts"
  applies_to:
    - "ALL 58 agents (4 AI agents + 54 pure actors)"
    - "Centralized Agent Supervisor manages restart attempts"
    - "Prevents infinite crash-restart loops"

  restart_philosophy:
    goal: "Recover from transient failures without overloading system"
    strategy: "Exponential backoff with cap (retry slower each time)"
    fail_fast: "After 5 failed attempts, give up and blacklist"
    transient_recovery: "Most crashes are transient (temporary), retry resolves them"

    erlang_supervisor_pattern:
      origin: "Erlang/OTP (Armstrong et al., 1996)"
      principle: "Supervisor monitors workers, restarts them on crash"
      strategies: "ONE_FOR_ONE (restart crashed child), ONE_FOR_ALL (restart all children)"
      rationale: "Proven pattern for building fault-tolerant systems"

    exponential_backoff_origin:
      origin: "Ethernet CSMA/CD (Metcalfe & Boggs, 1976)"
      principle: "On collision, wait random time that doubles each retry"
      benefits: "Avoids thundering herd (all agents restart simultaneously)"
      rationale: "If agent crashes repeatedly, slow down retries to avoid waste"

  restart_policy:
    exponential_backoff:
      description: "Wait time doubles each retry"
      initial_delay_ms: 200  # Start fast (transient failures recover quickly)
      backoff_multiplier: 2  # Double each time
      max_delay_ms: 30000    # Cap at 30 seconds (don't wait forever)
      max_attempts: 5        # After 5 failures, blacklist agent version

      sequence:
        - attempt: 1
          delay_ms: 200
          total_wait_ms: 0
          note: "First restart immediate (transient crash)"

        - attempt: 2
          delay_ms: 400
          total_wait_ms: 200
          note: "Second restart after 200ms"

        - attempt: 3
          delay_ms: 800
          total_wait_ms: 600
          note: "Third restart after 400ms"

        - attempt: 4
          delay_ms: 1600
          total_wait_ms: 1400
          note: "Fourth restart after 800ms"

        - attempt: 5
          delay_ms: 3200
          total_wait_ms: 3000
          note: "Fifth restart after 1.6s"

        - attempt: 6
          delay_ms: 6400
          total_wait_ms: 6200
          note: "Sixth restart after 3.2s (if attempts extended)"

        - attempt: 7
          delay_ms: 12800
          total_wait_ms: 12600
          note: "Seventh restart after 6.4s"

        - attempt: 8
          delay_ms: 25600
          total_wait_ms: 25400
          note: "Eighth restart after 12.8s"

        - attempt: 9
          delay_ms: 30000  # Capped
          total_wait_ms: 51000
          note: "Ninth restart after 25.6s (capped at 30s)"

        - attempt: 10
          delay_ms: 30000  # Capped
          total_wait_ms: 81000
          note: "All subsequent restarts wait 30s"

      total_time_5_attempts:
        calculation: "200 + 400 + 800 + 1600 + 3200 = 6200ms (6.2 seconds)"
        note: "Total time before blacklist"

    restart_counter_reset:
      description: "Reset restart counter after stable uptime"
      reset_window_ms: 600000  # 10 minutes
      rationale: "If agent runs for 10 minutes without crash, consider it recovered"
      benefit: "Transient crash doesn't permanently count against agent"

      algorithm:
        - step: 1
          action: "Agent crashes, restart counter incremented"
          code: "restart_attempts[agent_id] += 1"

        - step: 2
          action: "Record last crash timestamp"
          code: "last_crash_timestamp[agent_id] = current_time_ms()"

        - step: 3
          action: "Agent successfully restarts and runs"

        - step: 4
          action: "Background task checks uptime every 60s"
          code: "for agent_id in active_agents: check_uptime(agent_id)"

        - step: 5
          action: "If uptime > 10 minutes"
          condition: "current_time_ms() - last_crash_timestamp[agent_id] > 600000"

        - step: 6
          action: "Reset restart counter"
          code: "restart_attempts[agent_id] = 0"

        - step: 7
          action: "Log reset event"
          log: "Restart counter reset: agent_id={id}, uptime_ms={uptime}"
          level: "INFO"

  restart_state_machine:
    description: "Restart attempt state machine"

    states:
      AWAITING_RESTART:
        description: "Crash detected, waiting for backoff delay"
        duration: "0-30s (depends on attempt number)"
        allowed_transitions: ["RESTARTING", "BLACKLISTED"]

      RESTARTING:
        description: "Spawning new agent process"
        duration: "50-5000ms (depends on agent type)"
        allowed_transitions: ["ACTIVE", "AWAITING_RESTART"]

      ACTIVE:
        description: "Agent successfully restarted and healthy"
        duration: "Until next crash"
        allowed_transitions: ["AWAITING_RESTART"]

      BLACKLISTED:
        description: "Max attempts exceeded, agent version blacklisted"
        duration: "1 hour (blacklist duration)"
        allowed_transitions: []

    transition_diagram:
      CRASH_DETECTED:
        from: "ACTIVE"
        to: "AWAITING_RESTART"
        action: "Increment restart counter, calculate backoff delay"

      BACKOFF_COMPLETE:
        from: "AWAITING_RESTART"
        to: "RESTARTING"
        condition: "elapsed_time >= backoff_delay_ms"
        action: "Spawn new agent process"

      RESTART_SUCCESS:
        from: "RESTARTING"
        to: "ACTIVE"
        condition: "Agent transitioned to ACTIVE state"
        action: "Reset restart timer"

      RESTART_FAILURE:
        from: "RESTARTING"
        to: "AWAITING_RESTART"
        condition: "Agent crashed during startup"
        action: "Increment restart counter, calculate next backoff"

      MAX_ATTEMPTS_EXCEEDED:
        from: "AWAITING_RESTART"
        to: "BLACKLISTED"
        condition: "restart_attempts >= 5"
        action: "Add to blacklist, alert operator"

  restart_manager:
    description: "Centralized restart manager (singleton)"

    data_structures:
      restart_state_map:
        type: "HashMap<string, RestartState>"
        key: "agent_id"
        value: "RestartState"
        thread_safety: "RwLock"

      restart_attempts_map:
        type: "HashMap<string, int>"
        key: "agent_id"
        value: "restart_attempt_count"
        thread_safety: "RwLock"

      last_crash_timestamp_map:
        type: "HashMap<string, int64>"
        key: "agent_id"
        value: "unix_timestamp_ms"
        thread_safety: "RwLock"

    restart_state_schema:
      fields:
        - name: "agent_id"
          type: "string"

        - name: "agent_type"
          type: "string"

        - name: "agent_version"
          type: "string"

        - name: "state"
          type: "enum"
          values: ["AWAITING_RESTART", "RESTARTING", "ACTIVE", "BLACKLISTED"]

        - name: "restart_attempts"
          type: "int"
          description: "Current restart attempt count (0-5)"

        - name: "last_crash_timestamp_ms"
          type: "int64"

        - name: "next_restart_at_ms"
          type: "int64"
          description: "Unix timestamp when next restart allowed"

        - name: "backoff_delay_ms"
          type: "int"
          description: "Current backoff delay"

        - name: "crash_type"
          type: "enum"
          values: ["PROCESS_TERMINATION", "PING_TIMEOUT", "EVENT_LOOP_STALL"]

        - name: "context"
          type: "map<string, any>"
          description: "Crash context from crash_detection.yml"

    operations:
      restart_agent:
        signature: "restart_agent(agent_id, crash_type, context) -> RestartResult"
        description: "Attempt to restart crashed agent with exponential backoff"

        steps:
          - step: 1
            action: "Extract agent_type and agent_version"
            code: "agent_type, agent_version = parse_agent_id(agent_id)"

          - step: 2
            action: "Check if agent version blacklisted"
            code: "if blacklist_manager.is_blacklisted(agent_type, agent_version):"

          - step: 3
            action: "If blacklisted, skip restart"
            code: "return RestartResult(status=BLACKLISTED)"
            see: "blacklist_management.yml"

          - step: 4
            action: "Get or create restart state"
            code: "state = restart_state_map.get(agent_id, new_state())"

          - step: 5
            action: "Increment restart attempts"
            code: "state.restart_attempts += 1"

          - step: 6
            action: "Check if max attempts exceeded"
            condition: "state.restart_attempts > 5"

          - step: 7
            action: "If max exceeded, blacklist agent version"
            code: "await blacklist_manager.add_blacklist(agent_type, agent_version, ...)"

          - step: 8
            action: "Return blacklisted result"
            code: "return RestartResult(status=BLACKLISTED)"

          - step: 9
            action: "Calculate backoff delay"
            code: "backoff_ms = calculate_backoff(state.restart_attempts)"

          - step: 10
            action: "Transition to AWAITING_RESTART state"
            code: "state.state = AWAITING_RESTART"

          - step: 11
            action: "Record next restart timestamp"
            code: "state.next_restart_at_ms = current_time_ms() + backoff_ms"

          - step: 12
            action: "Log restart scheduled"
            log: "Restart scheduled: agent_id={id}, attempt={n}, backoff_ms={ms}"
            level: "INFO"

          - step: 13
            action: "Sleep for backoff delay"
            code: "await asyncio.sleep(backoff_ms / 1000.0)"

          - step: 14
            action: "Transition to RESTARTING state"
            code: "state.state = RESTARTING"

          - step: 15
            action: "Spawn new agent process"
            code: "agent = await supervisor.spawn_agent(agent_type, agent_version)"

          - step: 16
            action: "Wait for agent to reach ACTIVE state"
            code: "await wait_for_state(agent, AgentState.ACTIVE, timeout_ms=5000)"

          - step: 17
            action: "If agent reaches ACTIVE, restart success"
            code: "state.state = ACTIVE; return RestartResult(status=SUCCESS)"

          - step: 18
            action: "If agent crashes during startup, restart failure"
            code: "state.state = AWAITING_RESTART; return RestartResult(status=FAILURE)"

        performance: "50ms-5000ms (depends on agent startup time + backoff)"

      calculate_backoff:
        signature: "calculate_backoff(attempt_number) -> int"
        description: "Calculate exponential backoff delay with cap"

        algorithm:
          - step: 1
            action: "Calculate exponential delay"
            code: "delay_ms = INITIAL_DELAY_MS * (MULTIPLIER ** (attempt - 1))"

          - step: 2
            action: "Apply cap"
            code: "delay_ms = min(delay_ms, MAX_DELAY_MS)"

          - step: 3
            action: "Return delay"
            code: "return delay_ms"

        examples:
          - attempt: 1
            calculation: "200 * (2 ** 0) = 200"
            result: 200

          - attempt: 2
            calculation: "200 * (2 ** 1) = 400"
            result: 400

          - attempt: 3
            calculation: "200 * (2 ** 2) = 800"
            result: 800

          - attempt: 4
            calculation: "200 * (2 ** 3) = 1600"
            result: 1600

          - attempt: 5
            calculation: "200 * (2 ** 4) = 3200"
            result: 3200

          - attempt: 10
            calculation: "200 * (2 ** 9) = 102400 → capped to 30000"
            result: 30000

      reset_restart_counter:
        signature: "reset_restart_counter(agent_id) -> void"
        description: "Reset restart counter after stable uptime"

        steps:
          - step: 1
            action: "Get restart state"
            code: "state = restart_state_map[agent_id]"

          - step: 2
            action: "Reset restart attempts"
            code: "state.restart_attempts = 0"

          - step: 3
            action: "Log reset event"
            log: "Restart counter reset: agent_id={id}"
            level: "INFO"

          - step: 4
            action: "Emit metric"
            metric: "supervisor_restart_counter_reset_total{agent_id}"

      uptime_checker_background_task:
        description: "Background task checks agent uptime every 60s"

        steps:
          - step: 1
            action: "Sleep 60 seconds"
            code: "await asyncio.sleep(60)"

          - step: 2
            action: "Iterate all active agents"
            code: "for agent_id in active_agents:"

          - step: 3
            action: "Get restart state"
            code: "state = restart_state_map.get(agent_id)"

          - step: 4
            action: "If no restart state, skip"
            code: "if state is None: continue"

          - step: 5
            action: "Calculate uptime since last crash"
            code: "uptime_ms = current_time_ms() - state.last_crash_timestamp_ms"

          - step: 6
            action: "If uptime > 10 minutes"
            condition: "uptime_ms > 600000"

          - step: 7
            action: "Reset restart counter"
            code: "await reset_restart_counter(agent_id)"

          - step: 8
            action: "Repeat forever"
            code: "while True: ..."

        performance: "<10ms per iteration (58 agents)"

  restart_coordination:
    description: "Coordinate restart with agent lifecycle FSM"

    lifecycle_integration:
      TERMINATED:
        description: "Agent in TERMINATED state after crash"
        action: "Restart manager spawns new agent process"

      PENDING:
        description: "New agent process created, not yet initialized"
        action: "Restart manager waits for initialization"

      WARMING:
        description: "Agent initializing (loading model, etc.)"
        action: "Restart manager waits for ACTIVE state (timeout 5s)"

      ACTIVE:
        description: "Agent fully initialized and ready"
        action: "Restart manager considers restart successful"

      crash_during_startup:
        description: "Agent crashes during WARMING → ACTIVE transition"
        action: "Restart manager increments counter, retries with backoff"

    spawn_agent_algorithm:
      steps:
        - step: 1
          action: "Create agent process"
          code: "process = spawn_process(agent_type, agent_version)"

        - step: 2
          action: "Transition to PENDING state"
          code: "agent.state = AgentState.PENDING"

        - step: 3
          action: "Start agent initialization"
          code: "await agent.initialize()"

        - step: 4
          action: "Transition to WARMING state"
          code: "agent.state = AgentState.WARMING"

        - step: 5
          action: "Wait for initialization complete"
          timeout: "5000ms (AI agents load models)"

        - step: 6
          action: "Transition to ACTIVE state"
          code: "agent.state = AgentState.ACTIVE"

        - step: 7
          action: "Register with supervisor"
          code: "supervisor.register_agent(agent)"

        - step: 8
          action: "Start health checks"
          code: "supervisor.start_health_checks(agent)"

      failure_modes:
        - mode: "Process spawn failure"
          action: "Immediately retry with backoff"

        - mode: "Initialization timeout"
          action: "Kill process, retry with backoff"

        - mode: "Crash during WARMING"
          action: "Increment counter, retry with backoff"

  performance_budgets:
    restart_latency_breakdown:
      backoff_delay:
        attempt_1: "200ms"
        attempt_2: "400ms"
        attempt_3: "800ms"
        attempt_4: "1600ms"
        attempt_5: "3200ms"

      spawn_process:
        pure_actor: "10-50ms"
        ai_agent: "2000-5000ms (model loading)"

      initialization:
        pure_actor: "10-50ms"
        ai_agent: "1000-3000ms"

      total_restart_time:
        pure_actor_attempt_1: "220-300ms"
        ai_agent_attempt_1: "3200-8200ms"

    restart_throughput:
      sequential_restarts: "1 agent per restart_latency"
      concurrent_restarts: "58 agents in parallel (no limit)"
      note: "Restarts are async and non-blocking"

  observability:
    prometheus_metrics:
      - name: "supervisor_restart_attempts_total"
        type: "counter"
        labels: ["agent_id", "agent_type", "agent_version", "attempt_number"]
        description: "Total restart attempts"

      - name: "supervisor_restart_success_total"
        type: "counter"
        labels: ["agent_id", "agent_type", "agent_version"]
        description: "Total successful restarts"

      - name: "supervisor_restart_failure_total"
        type: "counter"
        labels: ["agent_id", "agent_type", "agent_version"]
        description: "Total failed restarts"

      - name: "supervisor_restart_latency_ms"
        type: "histogram"
        labels: ["agent_type", "attempt_number"]
        buckets: [100, 500, 1000, 2000, 5000, 10000]
        description: "Restart latency (backoff + spawn + init)"

      - name: "supervisor_restart_backoff_ms"
        type: "histogram"
        labels: ["attempt_number"]
        buckets: [100, 200, 500, 1000, 2000, 5000, 10000, 30000]
        description: "Backoff delay per attempt"

      - name: "supervisor_restart_counter_reset_total"
        type: "counter"
        labels: ["agent_id"]
        description: "Total restart counter resets (after 10min uptime)"

    structured_logging:
      - event: "supervisor.restart_scheduled"
        level: "INFO"
        fields:
          - "agent_id"
          - "attempt_number"
          - "backoff_delay_ms"
          - "next_restart_at_ms"

      - event: "supervisor.restart_attempt_started"
        level: "INFO"
        fields:
          - "agent_id"
          - "attempt_number"
          - "timestamp_ms"

      - event: "supervisor.restart_success"
        level: "INFO"
        fields:
          - "agent_id"
          - "attempt_number"
          - "restart_latency_ms"

      - event: "supervisor.restart_failure"
        level: "ERROR"
        fields:
          - "agent_id"
          - "attempt_number"
          - "failure_reason"
          - "next_backoff_ms"

      - event: "supervisor.max_attempts_exceeded"
        level: "ERROR"
        fields:
          - "agent_id"
          - "agent_type"
          - "agent_version"
          - "total_attempts"
          - "action (BLACKLISTED)"

  testing_requirements:
    unit_tests:
      - test: "Calculate backoff (exponential growth)"
      - test: "Calculate backoff (capped at 30s)"
      - test: "Restart counter increment"
      - test: "Restart counter reset (after 10min)"
      - test: "Max attempts exceeded → blacklist"
      - test: "Blacklisted agent skips restart"

    integration_tests:
      - test: "Agent crashes → restart with 200ms backoff"
      - test: "Agent crashes 2x → restart with 400ms backoff"
      - test: "Agent crashes 5x → blacklisted"
      - test: "Agent runs 10min → restart counter reset"
      - test: "Agent crashes during startup → retry"
      - test: "58 agents concurrent restart"

    performance_tests:
      - test: "Restart latency <8s for AI agent (including backoff)"
      - test: "Restart latency <300ms for pure actor"
      - test: "Concurrent restart throughput (58 agents)"

    chaos_tests:
      - test: "Agent crashes 100 times (exponential backoff prevents overload)"
      - test: "All 58 agents crash simultaneously"
      - test: "Agent crashes during every restart attempt"

  related_contracts:
    - contract: "crash_detection.yml"
      relation: "Crash handler calls restart manager after detecting crash"

    - contract: "blacklist_management.yml"
      relation: "Restart manager checks blacklist before restart, adds after max attempts"

    - contract: "../agent_lifecycle/lifecycle_fsm.yml"
      relation: "Restart manager spawns agent and waits for ACTIVE state"

  related_adrs:
    - adr: "ADR-0002b"
      section: "Restart Strategies"
      lines: "500-650 (exponential backoff, max attempts, counter reset)"

    - adr: "ADR-0005"
      section: "Agent Lifecycle FSM"
      lines: "PENDING → WARMING → ACTIVE transition during restart"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.2.2"
      author: "Agent Infrastructure Lead"
