# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_process_spawner_spawn"
      description: "Spawn subprocess, verify PID > 0, state = SPAWNING"

    - test_name: "test_process_spawner_wait_for_ready"
      description: "Initialize completes, state transitions to RUNNING"

    - test_name: "test_process_spawner_terminate_clean"
      description: "Graceful shutdown, process exits cleanly (exit code 0)"

    - test_name: "test_process_spawner_terminate_sigterm"
      description: "Shutdown fails, SIGTERM required, process exits"

    - test_name: "test_process_spawner_terminate_sigkill"
      description: "SIGTERM fails, SIGKILL required, process forced to exit"

    - test_name: "test_process_spawner_kill_immediate"
      description: "kill() sends SIGKILL, process exits immediately"

    - test_name: "test_process_spawner_monitor_crash"
      description: "Background monitor detects crash (non-zero exit)"

