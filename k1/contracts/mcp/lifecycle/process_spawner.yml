# Process Spawner Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 173-372)
# Purpose: Spawn and manage MCP server subprocess lifecycle
# Research: asyncio.subprocess (Python 3.10), Unix signals (POSIX 1990)

contract_metadata:
  name: "process_spawner"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
    - "ADR-0034a: MCP JSON-RPC Protocol"
  status: "approved"
  created: "2025-10-21"
  priority: "CRITICAL"

# =============================================================================
# PROCESS SPAWNER OVERVIEW
# =============================================================================

overview:
  description: |
    Spawn and manage MCP server process using asyncio.subprocess.

    **Problem:** K1 needs to spawn MCP servers as subprocesses, monitor health, enforce timeouts.
    **Solution:** MCPProcessSpawner class with spawn/terminate/kill/monitor methods.
    **Pattern:** Process Manager pattern.

    **Design Decisions:**
    - asyncio.create_subprocess_exec (non-blocking subprocess)
    - stdio pipes for JSON-RPC communication
    - Background monitor task detects crashes
    - Graceful shutdown: shutdown → SIGTERM → SIGKILL

  purpose: "Spawn and manage MCP server subprocess lifecycle"
  pattern: "Process Manager"
  transport: "stdio (stdin/stdout pipes)"
  signals: ["SIGTERM (graceful)", "SIGKILL (force)"]

# =============================================================================
# MCRPROCESSSPAWNER CLASS
# =============================================================================

class_definition:
  name: "MCPProcessSpawner"
  description: "Spawn and manage MCP server processes"

  responsibilities:
    - "Spawn subprocess (asyncio.create_subprocess_exec)"
    - "Track process state (lifecycle FSM)"
    - "Monitor process exit (background task)"
    - "Enforce initialization timeout"
    - "Graceful shutdown (shutdown → SIGTERM → SIGKILL)"
    - "Immediate kill (SIGKILL)"

  attributes:
    server_path:
      type: "str"
      description: "Path to MCP server executable"
      example: "/opt/familyos/mcp_servers/weather_api.py"

    timeout_seconds:
      type: "int"
      description: "Default timeout for tools/call requests"
      default: 30
      example: 30

    process:
      type: "asyncio.subprocess.Process | None"
      description: "Subprocess instance (None before spawn)"
      example: "<Process pid=12345>"

    info:
      type: "ProcessInfo | None"
      description: "Process information (FSM state, PID, timestamps)"
      example: "ProcessInfo(pid=12345, state=RUNNING, ...)"

    monitor_task:
      type: "asyncio.Task | None"
      description: "Background task monitoring process exit"
      example: "<Task pending>"

# =============================================================================
# SPAWN METHOD
# =============================================================================

spawn_method:
  signature: "async def spawn(self) -> ProcessInfo"
  description: "Spawn MCP server subprocess"

  algorithm:
    step_1:
      action: "Call asyncio.create_subprocess_exec"
      code: |
        self.process = await asyncio.create_subprocess_exec(
            "python3", self.server_path,
            stdin=asyncio.subprocess.PIPE,
            stdout=asyncio.subprocess.PIPE,
            stderr=asyncio.subprocess.PIPE
        )
      rationale: "Non-blocking subprocess with stdio pipes"

    step_2:
      action: "Initialize ProcessInfo (SPAWNING state)"
      code: |
        self.info = ProcessInfo(
            pid=self.process.pid,
            state=ProcessState.SPAWNING,
            started_at=time.time()
        )

    step_3:
      action: "Start background monitor task"
      code: |
        self.monitor_task = asyncio.create_task(self._monitor_process())
      rationale: "Detects crashes asynchronously"

    step_4:
      action: "Return ProcessInfo"
      code: "return self.info"

  returns:
    type: "ProcessInfo"
    description: "Process information (PID, state=SPAWNING)"

  raises:
    RuntimeError:
      condition: "Subprocess fails to start (FileNotFoundError, PermissionError)"
      message: "Failed to spawn MCP server: {error}"

  performance:
    target: "<50ms P95"
    actual: "~30ms"
    breakdown:
      process_spawn: "20ms (fork/exec)"
      ProcessInfo_init: "0.1ms"
      monitor_task_start: "10ms (asyncio.create_task)"

  example: |
    spawner = MCPProcessSpawner("/opt/familyos/mcp_servers/weather_api.py", timeout_seconds=30)
    info = await spawner.spawn()

    print(f"Spawned MCP server: PID {info.pid}, state {info.state}")
    # Output: Spawned MCP server: PID 12345, state SPAWNING

# =============================================================================
# WAIT_FOR_READY METHOD
# =============================================================================

wait_for_ready_method:
  signature: "async def wait_for_ready(self, timeout: float = 5.0)"
  description: "Wait for MCP server to initialize (SPAWNING → RUNNING)"

  algorithm:
    step_1:
      action: "Create MCPClient (stdio transport)"
      code: |
        from .jsonrpc import MCPClient, TransportType
        client = MCPClient(TransportType.STDIO, process=self.process)

    step_2:
      action: "Send initialize JSON-RPC request with timeout"
      code: |
        server_info = await asyncio.wait_for(
            client.initialize(),
            timeout=timeout
        )
      rationale: "Handshake with MCP server, verify it's ready"

    step_3:
      action: "Transition to RUNNING state"
      code: "self.info.state = ProcessState.RUNNING"

    step_4:
      action: "Log success"
      code: 'print(f"[MCPProcessSpawner] MCP server ready: {server_info}")'

  parameters:
    timeout:
      type: "float"
      default: 5.0
      description: "Max time to wait for initialization (seconds)"
      example: 5.0

  raises:
    TimeoutError:
      condition: "Initialization exceeds timeout"
      action: "Kill process, raise TimeoutError"
      code: |
        except asyncio.TimeoutError:
            await self.kill()
            raise TimeoutError(f"MCP server initialization timed out after {timeout}s")

    RuntimeError:
      condition: "Initialization fails (JSON-RPC error, crash)"
      action: "Kill process, raise RuntimeError"
      code: |
        except Exception as e:
            await self.kill()
            raise RuntimeError(f"MCP server initialization failed: {e}")

  performance:
    target: "<100ms P95"
    actual: "~50ms"
    breakdown:
      json_rpc_initialize: "40ms (request + response)"
      state_transition: "0.1ms"
      logging: "10ms"

  example: |
    await spawner.spawn()
    await spawner.wait_for_ready(timeout=5.0)

    # Process now in RUNNING state, ready for tools/call
    assert spawner.info.state == ProcessState.RUNNING

# =============================================================================
# TERMINATE METHOD (GRACEFUL SHUTDOWN)
# =============================================================================

terminate_method:
  signature: "async def terminate(self, timeout: float = 5.0)"
  description: "Gracefully terminate MCP server (shutdown → SIGTERM → SIGKILL)"

  shutdown_sequence:
    step_1:
      name: "Send shutdown JSON-RPC request"
      timeout: "2s"
      signal: null
      action: "Request server to shut down gracefully"
      code: |
        from .jsonrpc import MCPClient, TransportType
        client = MCPClient(TransportType.STDIO, process=self.process)
        await asyncio.wait_for(client.shutdown(), timeout=2.0)
      success_transition: "TERMINATED (process exits cleanly)"
      failure_action: "Proceed to step 2 (SIGTERM)"

    step_2:
      name: "Wait for graceful exit"
      timeout: "5s (parameter)"
      signal: null
      action: "Wait for process to exit after shutdown request"
      code: |
        await asyncio.wait_for(self.process.wait(), timeout=timeout)
      success_transition: "TERMINATED (exit code captured)"
      failure_action: "Proceed to step 3 (SIGTERM)"

    step_3:
      name: "Send SIGTERM (interrupt signal)"
      timeout: null
      signal: "SIGTERM (15)"
      action: "Request OS to terminate process gracefully"
      code: |
        self.process.send_signal(signal.SIGTERM)
      rationale: "SIGTERM allows process to run cleanup handlers"

    step_4:
      name: "Wait for SIGTERM exit"
      timeout: "5s (parameter)"
      signal: null
      action: "Wait for process to exit after SIGTERM"
      code: |
        await asyncio.wait_for(self.process.wait(), timeout=timeout)
      success_transition: "TERMINATED (signal=SIGTERM)"
      failure_action: "Proceed to step 5 (SIGKILL)"

    step_5:
      name: "Send SIGKILL (force kill)"
      timeout: null
      signal: "SIGKILL (9)"
      action: "Force kill process (no cleanup)"
      code: |
        self.process.kill()
        await self.process.wait()
      success_transition: "TERMINATED (signal=SIGKILL)"
      failure_action: "None (SIGKILL always succeeds)"

  parameters:
    timeout:
      type: "float"
      default: 5.0
      description: "Max time to wait at each graceful shutdown step"
      example: 5.0

  performance:
    clean_exit:
      description: "Server responds to shutdown and exits cleanly"
      duration: "~65ms"
      breakdown:
        shutdown_json_rpc: "5ms"
        server_cleanup: "50ms"
        process_exit: "10ms"

    sigterm_exit:
      description: "Server doesn't respond to shutdown, SIGTERM required"
      duration: "~5,015ms"
      breakdown:
        shutdown_json_rpc_timeout: "2,000ms"
        wait_timeout: "5,000ms"
        sigterm_signal: "5ms"
        process_exit: "10ms"

    sigkill_exit:
      description: "Server unresponsive, force kill required"
      duration: "~10,015ms"
      breakdown:
        shutdown_json_rpc_timeout: "2,000ms"
        wait_timeout_1: "5,000ms"
        sigterm_signal: "5ms"
        wait_timeout_2: "5,000ms"
        sigkill_signal: "5ms"
        process_exit: "5ms"

  example: |
    # Graceful shutdown
    await spawner.terminate(timeout=5.0)

    # Check final state
    assert spawner.info.state == ProcessState.TERMINATED
    assert spawner.info.exit_code == 0  # Clean exit

# =============================================================================
# KILL METHOD (IMMEDIATE)
# =============================================================================

kill_method:
  signature: "async def kill(self)"
  description: "Immediately kill MCP server (SIGKILL, no cleanup)"

  algorithm:
    step_1:
      action: "Send SIGKILL signal"
      code: "self.process.kill()"
      rationale: "Immediate termination, no cleanup"

    step_2:
      action: "Wait for process to exit"
      code: "await self.process.wait()"
      rationale: "Prevent zombie process"

    step_3:
      action: "Update ProcessInfo (TERMINATED state)"
      code: |
        self.info.state = ProcessState.TERMINATED
        self.info.terminated_at = time.time()
        self.info.exit_code = self.process.returncode
        self.info.signal = signal.SIGKILL

  use_cases:
    - "Timeout enforcement (tool exceeds time limit)"
    - "Emergency shutdown (security violation)"
    - "Initialization timeout (process not responding)"

  performance:
    target: "<20ms"
    actual: "~15ms"
    breakdown:
      sigkill_signal: "5ms"
      process_exit: "5ms"
      state_update: "5ms"

  example: |
    # Tool times out, kill immediately
    await spawner.kill()

    assert spawner.info.state == ProcessState.TERMINATED
    assert spawner.info.signal == signal.SIGKILL

# =============================================================================
# MONITOR PROCESS (BACKGROUND TASK)
# =============================================================================

monitor_process_method:
  signature: "async def _monitor_process(self)"
  description: "Background task monitoring process exit (detects crashes)"

  algorithm:
    step_1:
      action: "Wait for process to exit"
      code: "exit_code = await self.process.wait()"
      rationale: "Blocking wait, task sleeps until process exits"

    step_2:
      action: "Check if already terminated by K1"
      code: |
        if self.info.state == ProcessState.TERMINATING:
            return  # Expected termination, not a crash
      rationale: "Graceful shutdown not considered a crash"

    step_3:
      action: "Mark as CRASHED"
      code: |
        self.info.state = ProcessState.CRASHED
        self.info.terminated_at = time.time()
        self.info.exit_code = exit_code

    step_4:
      action: "Check if killed by signal"
      code: |
        if exit_code < 0:
            self.info.signal = -exit_code
            print(f"[MCPProcessSpawner] MCP server crashed (signal {-exit_code}): PID {self.process.pid}")
        else:
            print(f"[MCPProcessSpawner] MCP server crashed (exit code {exit_code}): PID {self.process.pid}")
      rationale: "Negative exit codes indicate signals (SIGSEGV=-11)"

    step_5:
      action: "Emit crash event"
      code: "await self._emit_crash_event()"
      rationale: "Notify supervisor, circuit breaker"

  crash_detection:
    non_zero_exit_code:
      condition: "exit_code > 0"
      example: "exit_code = 1 (general error)"
      action: "Mark as CRASHED, log error"

    signal_termination:
      condition: "exit_code < 0"
      example: "exit_code = -11 (SIGSEGV)"
      action: "Mark as CRASHED, capture signal, log error"

  example_crash_scenarios:
    segmentation_fault:
      description: "Process crashes with SIGSEGV (signal 11)"
      exit_code: -11
      signal: 11
      log_message: "MCP server crashed (signal 11): PID 12345"

    python_exception:
      description: "Uncaught Python exception, process exits"
      exit_code: 1
      signal: null
      log_message: "MCP server crashed (exit code 1): PID 12345"

    out_of_memory:
      description: "Process killed by OOM killer (signal 9)"
      exit_code: -9
      signal: 9
      log_message: "MCP server crashed (signal 9): PID 12345"

# =============================================================================
# EMIT CRASH EVENT
# =============================================================================

emit_crash_event_method:
  signature: "async def _emit_crash_event(self)"
  description: "Emit crash event to K1 supervisor"

  integration_points:
    supervisor:
      adr: "ADR-0002b"
      action: "Notify supervisor of process crash"
      data:
        - "tool_name"
        - "pid"
        - "exit_code"
        - "signal"
        - "uptime_seconds"
        - "total_requests"

    circuit_breaker:
      adr: "ADR-0034c"
      action: "Increment failure counter, possibly open circuit"
      data:
        - "tool_name"
        - "failure_type: crash"

    telemetry:
      action: "Emit crash metric"
      metric: "mcp_process_crashes_total"
      labels: ["tool_name", "exit_code", "signal"]

  example: |
    async def _emit_crash_event(self):
        # Emit to supervisor
        await supervisor.notify_crash(
            tool_name=self.tool_name,
            pid=self.info.pid,
            exit_code=self.info.exit_code,
            signal=self.info.signal,
            uptime_seconds=self.info.uptime_seconds()
        )

        # Emit to circuit breaker
        await circuit_breaker.record_failure(
            tool_name=self.tool_name,
            failure_type="crash"
        )

        # Emit metric
        mcp_process_crashes_total.labels(
            tool_name=self.tool_name,
            exit_code=self.info.exit_code,
            signal=self.info.signal
        ).inc()

# =============================================================================
# FULL IMPLEMENTATION EXAMPLE
# =============================================================================

python_implementation: |
  import asyncio
  import signal
  import time
  from typing import Optional
  from .lifecycle_fsm import ProcessState, ProcessInfo

  class MCPProcessSpawner:
      """
      Spawn and manage MCP server processes.

      Responsibilities:
      - Spawn subprocess (asyncio.create_subprocess_exec)
      - Track process state (lifecycle FSM)
      - Monitor process exit (wait_closed task)
      - Enforce timeout (asyncio.wait_for)
      - Graceful shutdown (SIGTERM → SIGKILL)
      """

      def __init__(self, server_path: str, timeout_seconds: int = 30):
          """
          Initialize process spawner.

          Args:
              server_path: Path to MCP server executable
              timeout_seconds: Default timeout for tools/call requests
          """
          self.server_path = server_path
          self.timeout_seconds = timeout_seconds

          self.process: Optional[asyncio.subprocess.Process] = None
          self.info: Optional[ProcessInfo] = None
          self.monitor_task: Optional[asyncio.Task] = None

      async def spawn(self) -> ProcessInfo:
          """Spawn MCP server subprocess"""
          self.process = await asyncio.create_subprocess_exec(
              "python3", self.server_path,
              stdin=asyncio.subprocess.PIPE,
              stdout=asyncio.subprocess.PIPE,
              stderr=asyncio.subprocess.PIPE
          )

          self.info = ProcessInfo(
              pid=self.process.pid,
              state=ProcessState.SPAWNING,
              started_at=time.time()
          )

          self.monitor_task = asyncio.create_task(self._monitor_process())

          print(f"[MCPProcessSpawner] Spawned MCP server: PID {self.process.pid}")

          return self.info

      async def wait_for_ready(self, timeout: float = 5.0):
          """Wait for MCP server to initialize (SPAWNING → RUNNING)"""
          from .jsonrpc import MCPClient, TransportType

          client = MCPClient(TransportType.STDIO, process=self.process)

          try:
              server_info = await asyncio.wait_for(
                  client.initialize(),
                  timeout=timeout
              )

              self.info.state = ProcessState.RUNNING

              print(f"[MCPProcessSpawner] MCP server ready: {server_info}")

          except asyncio.TimeoutError:
              await self.kill()
              raise TimeoutError(f"MCP server initialization timed out after {timeout}s")

          except Exception as e:
              await self.kill()
              raise RuntimeError(f"MCP server initialization failed: {e}")

      async def terminate(self, timeout: float = 5.0):
          """Gracefully terminate MCP server (shutdown → SIGTERM → SIGKILL)"""
          if not self.process or not self.info.is_alive():
              return

          self.info.state = ProcessState.TERMINATING

          print(f"[MCPProcessSpawner] Terminating MCP server PID {self.process.pid}")

          # Step 1: Send shutdown JSON-RPC
          try:
              from .jsonrpc import MCPClient, TransportType
              client = MCPClient(TransportType.STDIO, process=self.process)
              await asyncio.wait_for(client.shutdown(), timeout=2.0)
          except:
              pass  # Ignore errors

          # Step 2: Wait for graceful exit
          try:
              await asyncio.wait_for(self.process.wait(), timeout=timeout)
              self.info.state = ProcessState.TERMINATED
              self.info.terminated_at = time.time()
              self.info.exit_code = self.process.returncode
              return
          except asyncio.TimeoutError:
              pass

          # Step 3: Send SIGTERM
          print(f"[MCPProcessSpawner] Sending SIGTERM to PID {self.process.pid}")
          self.process.send_signal(signal.SIGTERM)

          try:
              await asyncio.wait_for(self.process.wait(), timeout=timeout)
              self.info.state = ProcessState.TERMINATED
              self.info.terminated_at = time.time()
              self.info.exit_code = self.process.returncode
              self.info.signal = signal.SIGTERM
              return
          except asyncio.TimeoutError:
              pass

          # Step 4: Send SIGKILL
          print(f"[MCPProcessSpawner] Sending SIGKILL to PID {self.process.pid}")
          self.process.kill()
          await self.process.wait()

          self.info.state = ProcessState.TERMINATED
          self.info.terminated_at = time.time()
          self.info.exit_code = self.process.returncode
          self.info.signal = signal.SIGKILL

      async def kill(self):
          """Immediately kill MCP server (SIGKILL)"""
          if not self.process or not self.info.is_alive():
              return

          print(f"[MCPProcessSpawner] Killing MCP server PID {self.process.pid}")
          self.process.kill()
          await self.process.wait()

          self.info.state = ProcessState.TERMINATED
          self.info.terminated_at = time.time()
          self.info.exit_code = self.process.returncode
          self.info.signal = signal.SIGKILL

      async def _monitor_process(self):
          """Background task: monitor process exit"""
          exit_code = await self.process.wait()

          if self.info.state == ProcessState.TERMINATING:
              return

          self.info.state = ProcessState.CRASHED
          self.info.terminated_at = time.time()
          self.info.exit_code = exit_code

          if exit_code < 0:
              self.info.signal = -exit_code
              print(f"[MCPProcessSpawner] MCP server crashed (signal {-exit_code})")
          else:
              print(f"[MCPProcessSpawner] MCP server crashed (exit code {exit_code})")

          await self._emit_crash_event()

      async def _emit_crash_event(self):
          """Emit crash event to supervisor"""
          print(f"[MCPProcessSpawner] Crash event: PID {self.process.pid}")

