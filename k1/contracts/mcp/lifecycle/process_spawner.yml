# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  process_spawn_latency:
    target: "<50ms P95"
    actual: "~30ms"
    measurement: "Time from spawn() call to return"

  initialization_latency:
    target: "<100ms P95"
    actual: "~50ms"
    measurement: "Time for wait_for_ready() to complete"

  graceful_shutdown_latency:
    target: "<100ms P95 (clean exit)"
    actual: "~65ms"
    measurement: "Time for terminate() with clean exit"

  force_kill_latency:
    target: "<10s worst case"
    actual: "~10s"
    measurement: "Time for terminate() with force kill"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_process_spawns_total:
    type: "counter"
    labels: ["tool_name"]
    description: "Total MCP process spawns"

  mcp_process_spawn_duration_ms:
    type: "histogram"
    buckets: [10, 20, 50, 100, 200]
    labels: ["tool_name"]
    description: "Process spawn duration"

  mcp_process_crashes_total:
    type: "counter"
    labels: ["tool_name", "exit_code", "signal"]
    description: "Total process crashes"

logging:
  process_spawned:
    level: "INFO"
    message: "MCP process spawned"
    fields: ["pid", "tool_name", "server_path"]

  process_ready:
    level: "INFO"
    message: "MCP process ready"
    fields: ["pid", "tool_name", "initialization_duration_ms"]

  process_terminated:
    level: "INFO"
    message: "MCP process terminated"
    fields: ["pid", "tool_name", "exit_code", "signal", "uptime_seconds"]

  process_crashed:
    level: "ERROR"
    message: "MCP process crashed"
    fields: ["pid", "tool_name", "exit_code", "signal", "uptime_seconds", "total_requests"]

