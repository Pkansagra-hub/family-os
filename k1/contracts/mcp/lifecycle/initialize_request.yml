# Initialize Request Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 194-217)
# Purpose: MCP initialize handshake for capability negotiation
# Research: MCP Specification (Anthropic 2024), JSON-RPC 2.0

contract_metadata:
  name: "initialize_request"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
    - "ADR-0034a: MCP JSON-RPC Protocol"
  status: "approved"
  created: "2025-10-21"
  priority: "HIGH"

# =============================================================================
# INITIALIZE OVERVIEW
# =============================================================================

overview:
  description: |
    MCP initialize handshake for capability negotiation.

    **Problem:** K1 needs to verify MCP server is ready, negotiate protocol version/capabilities.
    **Solution:** Send initialize JSON-RPC request after process spawn.
    **Pattern:** Handshake pattern (capability negotiation).

    **Design Decisions:**
    - First request sent after process spawn (SPAWNING → RUNNING transition)
    - Timeout enforced (5s default)
    - Protocol version negotiation (client proposes, server accepts/rejects)
    - Capability negotiation (future: streaming, cancellation, etc.)

  purpose: "Handshake with MCP server to verify readiness and negotiate capabilities"
  method: "initialize"
  protocol: "JSON-RPC 2.0"
  timeout: "5s default"

# =============================================================================
# REQUEST FORMAT
# =============================================================================

request_format:
  json_rpc_method: "initialize"

  parameters:
    protocolVersion:
      type: "string"
      required: false
      default: "2024-11-05"
      description: "MCP protocol version client supports"
      example: "2024-11-05"
      rationale: "Allows version negotiation (future compatibility)"

    capabilities:
      type: "object"
      required: false
      default: {}
      description: "Client capabilities (future use)"
      example: {}
      future_capabilities:
        - "streaming: true (support streaming responses)"
        - "cancellation: true (support request cancellation)"
        - "batch: true (support batched requests)"

    clientInfo:
      type: "object"
      required: false
      description: "Client information (name, version)"
      properties:
        name:
          type: "string"
          example: "k1-intelligence"
        version:
          type: "string"
          example: "1.0.0"

  example_request: |
    {
      "jsonrpc": "2.0",
      "method": "initialize",
      "params": {
        "protocolVersion": "2024-11-05",
        "capabilities": {},
        "clientInfo": {
          "name": "k1-intelligence",
          "version": "1.0.0"
        }
      },
      "id": "init-req-1"
    }

# =============================================================================
# RESPONSE FORMAT
# =============================================================================

response_format:
  success_response:
    result:
      protocolVersion:
        type: "string"
        description: "MCP protocol version server supports"
        example: "2024-11-05"
        validation: "Must match or be compatible with client version"

      capabilities:
        type: "object"
        description: "Server capabilities"
        example:
          tools: {}
        future_capabilities:
          - "tools: {} (server supports tools/list, tools/call)"
          - "resources: {} (server supports resources/list, resources/read)"
          - "prompts: {} (server supports prompts/list, prompts/get)"

      serverInfo:
        type: "object"
        description: "Server information (name, version)"
        properties:
          name:
            type: "string"
            example: "weather_api"
          version:
            type: "string"
            example: "1.0.0"

  example_success_response: |
    {
      "jsonrpc": "2.0",
      "result": {
        "protocolVersion": "2024-11-05",
        "capabilities": {
          "tools": {}
        },
        "serverInfo": {
          "name": "weather_api",
          "version": "1.0.0"
        }
      },
      "id": "init-req-1"
    }

  error_response:
    protocol_version_mismatch:
      code: -32602
      message: "Invalid params"
      data:
        error: "Protocol version mismatch: client=2024-11-05, server=2024-06-18"
      example: |
        {
          "jsonrpc": "2.0",
          "error": {
            "code": -32602,
            "message": "Invalid params",
            "data": {
              "error": "Protocol version mismatch: client=2024-11-05, server=2024-06-18"
            }
          },
          "id": "init-req-1"
        }

    initialization_failed:
      code: -32603
      message: "Internal error"
      data:
        error: "Server initialization failed: database connection timeout"
      example: |
        {
          "jsonrpc": "2.0",
          "error": {
            "code": -32603,
            "message": "Internal error",
            "data": {
              "error": "Server initialization failed: database connection timeout"
            }
          },
          "id": "init-req-1"
        }

# =============================================================================
# INITIALIZATION TIMEOUT ENFORCEMENT
# =============================================================================

timeout_enforcement:
  description: "Enforce timeout on initialize request (prevent hung processes)"

  timeout_configuration:
    default: "5s"
    rationale: "MCP servers should initialize quickly (<100ms typical)"
    configurable: true
    example_config: |
      # k1/config/mcp_timeouts.yml
      initialize_timeout_seconds: 5

  timeout_mechanism:
    implementation: "asyncio.wait_for wraps client.initialize()"
    example: |
      try:
          server_info = await asyncio.wait_for(
              client.initialize(),
              timeout=5.0
          )
      except asyncio.TimeoutError:
          await spawner.kill()
          raise TimeoutError("MCP server initialization timed out after 5s")

  timeout_action:
    step_1: "Log timeout error"
    step_2: "Kill process (SIGKILL)"
    step_3: "Set state to TERMINATED"
    step_4: "Raise TimeoutError to caller"

  timeout_scenarios:
    slow_server:
      description: "Server takes >5s to initialize (database connection slow)"
      action: "Kill process, raise TimeoutError"
      user_impact: "Tool initialization fails, user notified"

    hung_server:
      description: "Server deadlocked during initialization (infinite loop)"
      action: "Kill process after 5s, raise TimeoutError"
      user_impact: "Tool initialization fails, user notified"

# =============================================================================
# STATE TRANSITION
# =============================================================================

state_transition:
  trigger: "initialize response received successfully"
  from_state: "SPAWNING"
  to_state: "RUNNING"

  transition_logic: |
    # Before initialize
    info.state = ProcessState.SPAWNING

    # Send initialize
    server_info = await client.initialize()

    # After successful response
    info.state = ProcessState.RUNNING

    print(f"[MCPProcessSpawner] MCP server ready: {server_info}")

  failure_transitions:
    timeout:
      from_state: "SPAWNING"
      to_state: "TERMINATED"
      action: "Kill process, raise TimeoutError"

    error_response:
      from_state: "SPAWNING"
      to_state: "TERMINATED"
      action: "Kill process, raise RuntimeError"

    crash_during_init:
      from_state: "SPAWNING"
      to_state: "CRASHED"
      action: "Monitor detects exit, emit crash event"

# =============================================================================
# PROTOCOL VERSION NEGOTIATION
# =============================================================================

protocol_version_negotiation:
  description: "Negotiate MCP protocol version between client and server"

  negotiation_algorithm:
    step_1:
      action: "Client sends initialize with protocolVersion (e.g., '2024-11-05')"
      code: |
        await client.initialize(protocol_version="2024-11-05")

    step_2:
      action: "Server validates client version"
      logic: |
        if client_version in SUPPORTED_VERSIONS:
            return {"protocolVersion": client_version, ...}
        else:
            raise JsonRpcError(-32602, "Protocol version not supported")

    step_3:
      action: "Client validates server version"
      logic: |
        if server_version != client_version:
            raise RuntimeError(f"Protocol version mismatch: {server_version}")

  version_compatibility:
    exact_match:
      description: "Client and server versions match exactly"
      example: "client=2024-11-05, server=2024-11-05"
      action: "Success, proceed with initialization"

    minor_version_mismatch:
      description: "Minor version difference (future: allow backward compatibility)"
      example: "client=2024-11-05, server=2024-12-01"
      action: "Currently rejected (future: may allow if compatible)"

    major_version_mismatch:
      description: "Major protocol change"
      example: "client=2024-11-05, server=2025-06-01"
      action: "Reject with error -32602"

  version_pinning:
    description: "K1 pins to specific MCP version to ensure compatibility"
    pinned_version: "2024-11-05"
    rationale: "Avoid breaking changes from spec updates"
    update_process: "ADR required to update pinned version"

# =============================================================================
# CAPABILITY NEGOTIATION (FUTURE)
# =============================================================================

capability_negotiation:
  description: "Negotiate optional capabilities (future enhancement)"

  client_capabilities:
    streaming:
      description: "Client supports streaming responses"
      value: true
      future_use: "Large tool outputs (e.g., video transcoding progress)"

    cancellation:
      description: "Client supports request cancellation"
      value: true
      future_use: "User can cancel long-running tool (e.g., video processing)"

    batch:
      description: "Client supports batched requests"
      value: false
      rationale: "K1 uses concurrent individual requests (not batch)"

  server_capabilities:
    tools:
      description: "Server supports tools/list, tools/call"
      value: {}
      required: true

    resources:
      description: "Server supports resources/list, resources/read"
      value: {}
      required: false
      future_use: "MCP servers can expose resources (files, data)"

    prompts:
      description: "Server supports prompts/list, prompts/get"
      value: {}
      required: false
      future_use: "MCP servers can provide prompt templates"

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  initialize_latency:
    target: "<100ms P95"
    actual: "~50ms"
    breakdown:
      json_rpc_request: "5ms (serialize + write)"
      server_processing: "30ms (server startup logic)"
      json_rpc_response: "5ms (read + deserialize)"
      state_transition: "0.1ms"
      logging: "10ms"

  timeout_overhead:
    description: "asyncio.wait_for overhead"
    overhead: "<1ms"
    rationale: "Negligible compared to network/processing time"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_initialize_requests_total:
    type: "counter"
    labels: ["tool_name", "status"]  # status: success | timeout | error
    description: "Total initialize requests"

  mcp_initialize_duration_ms:
    type: "histogram"
    buckets: [10, 20, 50, 100, 200, 500, 1000]
    labels: ["tool_name"]
    description: "Initialize request duration"

  mcp_initialize_timeouts_total:
    type: "counter"
    labels: ["tool_name"]
    description: "Total initialize timeouts"

logging:
  initialize_sent:
    level: "DEBUG"
    message: "MCP initialize request sent"
    fields:
      - "pid"
      - "tool_name"
      - "protocol_version"

  initialize_success:
    level: "INFO"
    message: "MCP initialize successful"
    fields:
      - "pid"
      - "tool_name"
      - "server_name"
      - "server_version"
      - "duration_ms"

  initialize_timeout:
    level: "ERROR"
    message: "MCP initialize timeout"
    fields:
      - "pid"
      - "tool_name"
      - "timeout_seconds"

  initialize_error:
    level: "ERROR"
    message: "MCP initialize error"
    fields:
      - "pid"
      - "tool_name"
      - "error_code"
      - "error_message"

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_initialize_request_format"
      description: "Verify initialize request has correct format"
      assertion: "Request has jsonrpc, method, params, id fields"

    - test_name: "test_initialize_success_response"
      description: "Verify successful initialize response parsed correctly"
      assertion: "Response contains protocolVersion, capabilities, serverInfo"

    - test_name: "test_initialize_timeout"
      description: "Verify timeout kills process and raises TimeoutError"
      assertion: "TimeoutError raised, process state = TERMINATED"

    - test_name: "test_initialize_error_response"
      description: "Verify error response kills process and raises RuntimeError"
      assertion: "RuntimeError raised, process state = TERMINATED"

    - test_name: "test_initialize_state_transition"
      description: "Verify successful initialize transitions SPAWNING → RUNNING"
      assertion: "info.state == ProcessState.RUNNING"

# =============================================================================
# REFERENCES
# =============================================================================

references:
  standards:
    - name: "Model Context Protocol (MCP)"
      url: "https://github.com/anthropics/model-context-protocol"
      section: "initialize method"
      year: 2024

    - name: "JSON-RPC 2.0 Specification"
      url: "https://www.jsonrpc.org/specification"
      section: "Request object"
      year: 2010

  design_patterns:
    - name: "Handshake Pattern"
      description: "Initial message exchange to establish connection"
      reference: "Distributed Systems (Tanenbaum 2007)"

    - name: "Capability Negotiation"
      description: "Client and server agree on supported features"
      reference: "HTTP Content Negotiation (RFC 2616)"

  related_contracts:
    - "lifecycle_fsm_5_states.yml"
    - "process_spawner.yml"
    - "timeout_enforcement.yml"
    - "jsonrpc_request_format.yml"

contract_status:
  version: "1.0.0"
  status: "approved"
  approved_by: "K1 Architecture Team"
  approved_date: "2025-10-21"
  next_review: "2026-04-21"
