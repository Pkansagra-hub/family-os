# REFERENCES
# =============================================================================

references:
  standards:
    - name: "Unix Process Exit Codes"
      url: "https://www.gnu.org/software/libc/manual/html_node/Exit-Status.html"
      description: "0 = success, 1-255 = error, negative = signal"

    - name: "Unix Signals — POSIX 1990"
      url: "https://en.wikipedia.org/wiki/Signal_(IPC)"
      description: "SIGSEGV (11), SIGKILL (9), SIGTERM (15), etc."

  design_patterns:
    - name: "Process Monitor Pattern"
      description: "Background task monitors process health"
      reference: "Patterns of Distributed Systems (Verma 2023)"

  related_contracts:
    - "lifecycle_fsm_5_states.yml"
    - "process_spawner.yml"
    - "graceful_shutdown.yml"

