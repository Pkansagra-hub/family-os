# Crash Detection Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 304-337)
# Purpose: Detect MCP server crashes and emit crash events
# Research: Unix Process Exit Codes, Signal Handling (POSIX 1990)

contract_metadata:
  name: "crash_detection"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
    - "ADR-0002b: Agent Supervisor"
  status: "approved"
  created: "2025-10-21"
  priority: "HIGH"

# =============================================================================
# CRASH DETECTION OVERVIEW
# =============================================================================

overview:
  description: |
    Detect MCP server crashes via background monitor task.

    **Problem:** K1 needs to detect when MCP server dies unexpectedly.
    **Solution:** Background task monitors process.wait(), checks exit code/signal.
    **Pattern:** Process Monitor pattern.

    **Design Decisions:**
    - Background asyncio.Task runs _monitor_process()
    - Task blocks on process.wait() (sleeps until exit)
    - Exit code checked (0 = clean, non-zero = crash)
    - Negative exit codes indicate signals (SIGSEGV = -11)
    - Crash event emitted to supervisor, circuit breaker

  purpose: "Detect MCP server crashes and emit crash events"
  mechanism: "Background monitor task (asyncio.Task)"
  crash_indicators: ["Non-zero exit code", "Signal termination"]
  integrations: ["Supervisor (ADR-0002b)", "Circuit Breaker (ADR-0034c)"]

# =============================================================================
# MONITOR PROCESS METHOD
# =============================================================================

monitor_process_method:
  signature: "async def _monitor_process(self)"
  description: "Background task monitoring process exit"

  algorithm:
    step_1:
      action: "Wait for process to exit (blocking)"
      code: "exit_code = await self.process.wait()"
      rationale: "Task sleeps until process terminates"

    step_2:
      action: "Check if expected termination"
      code: |
        if self.info.state == ProcessState.TERMINATING:
            return  # Expected termination, not a crash
      rationale: "Graceful shutdown (terminate() called) is not a crash"

    step_3:
      action: "Mark as CRASHED"
      code: |
        self.info.state = ProcessState.CRASHED
        self.info.terminated_at = time.time()
        self.info.exit_code = exit_code
      rationale: "Unexpected exit is a crash"

    step_4:
      action: "Check if killed by signal"
      code: |
        if exit_code < 0:
            self.info.signal = -exit_code
            print(f"[MCPProcessSpawner] MCP server crashed (signal {-exit_code}): PID {self.process.pid}")
        else:
            print(f"[MCPProcessSpawner] MCP server crashed (exit code {exit_code}): PID {self.process.pid}")
      rationale: "Negative exit codes indicate signals"

    step_5:
      action: "Emit crash event"
      code: "await self._emit_crash_event()"
      rationale: "Notify supervisor, circuit breaker, telemetry"

  execution_context:
    task_type: "Background asyncio.Task"
    created_at: "spawn() method"
    runs_until: "Process exits (any reason)"
    cancellation: "Not explicitly cancelled (completes when process exits)"

# =============================================================================
# CRASH INDICATORS
# =============================================================================

crash_indicators:
  non_zero_exit_code:
    description: "Process exits with code > 0"
    detection: "exit_code > 0"

    examples:
      general_error:
        exit_code: 1
        meaning: "General error (unhandled exception, sys.exit(1))"
        example_cause: "Python uncaught exception, manual sys.exit(1)"

      command_not_found:
        exit_code: 127
        meaning: "Command not found (wrong executable path)"
        example_cause: "subprocess.Popen with invalid executable"

      segmentation_fault:
        exit_code: 139
        meaning: "Segmentation fault (signal 11)"
        example_cause: "Native code crash, buffer overflow"

  signal_termination:
    description: "Process killed by signal"
    detection: "exit_code < 0"
    signal_value: "-exit_code (absolute value is signal number)"

    common_signals:
      SIGHUP:
        number: 1
        exit_code: -1
        meaning: "Hangup (terminal closed)"
        action: "Mark as crash, log signal"

      SIGINT:
        number: 2
        exit_code: -2
        meaning: "Interrupt (Ctrl+C)"
        action: "Mark as crash, log signal"

      SIGQUIT:
        number: 3
        exit_code: -3
        meaning: "Quit (Ctrl+\\)"
        action: "Mark as crash, log signal"

      SIGKILL:
        number: 9
        exit_code: -9
        meaning: "Force kill (cannot be caught)"
        action: "Check if expected (timeout kill) or unexpected (OOM killer)"

      SIGSEGV:
        number: 11
        exit_code: -11
        meaning: "Segmentation fault (invalid memory access)"
        action: "Mark as crash, high priority alert"

      SIGTERM:
        number: 15
        exit_code: -15
        meaning: "Termination request (graceful)"
        action: "Check if expected (graceful shutdown) or unexpected"

      SIGABRT:
        number: 6
        exit_code: -6
        meaning: "Abort (assertion failure, abort() called)"
        action: "Mark as crash, likely bug in server code"

# =============================================================================
# CRASH SCENARIOS
# =============================================================================

crash_scenarios:
  python_uncaught_exception:
    description: "Python MCP server has uncaught exception"
    example_code: |
      # MCP server code
      def handle_tool_call(request):
          result = some_api.get_data(request.params)  # API raises exception
          return result

      # Exception not caught, process exits with code 1

    detection:
      exit_code: 1
      signal: null

    monitor_action:
      state_transition: "RUNNING → CRASHED"
      log_message: "MCP server crashed (exit code 1): PID 12345"
      crash_event_emitted: true

  segmentation_fault:
    description: "Native code (e.g., C extension) crashes with SIGSEGV"
    example_cause: "Buffer overflow, invalid pointer dereference"

    detection:
      exit_code: -11
      signal: 11  # SIGSEGV

    monitor_action:
      state_transition: "RUNNING → CRASHED"
      log_message: "MCP server crashed (signal 11): PID 12345"
      crash_event_emitted: true
      alert_priority: "HIGH (likely memory corruption bug)"

  out_of_memory:
    description: "Process killed by OS OOM killer (signal 9)"
    example_cause: "Memory leak, large dataset loaded into memory"

    detection:
      exit_code: -9
      signal: 9  # SIGKILL

    monitor_action:
      state_transition: "RUNNING → CRASHED"
      log_message: "MCP server crashed (signal 9): PID 12345"
      crash_event_emitted: true
      alert_priority: "MEDIUM (check memory limits)"

  assertion_failure:
    description: "Python assertion fails, process aborts"
    example_code: |
      assert result is not None, "Expected result to be non-null"
      # Assertion fails, Python calls abort()

    detection:
      exit_code: -6
      signal: 6  # SIGABRT

    monitor_action:
      state_transition: "RUNNING → CRASHED"
      log_message: "MCP server crashed (signal 6): PID 12345"
      crash_event_emitted: true

# =============================================================================
# CRASH EVENT EMISSION
# =============================================================================

crash_event_emission:
  method_signature: "async def _emit_crash_event(self)"
  description: "Emit crash event to supervisor, circuit breaker, telemetry"

  integration_supervisor:
    adr: "ADR-0002b"
    action: "Notify supervisor of process crash"

    event_data:
      tool_name:
        type: "str"
        example: "weather_api"
      pid:
        type: "int"
        example: 12345
      exit_code:
        type: "int"
        example: 1
      signal:
        type: "int | None"
        example: null
      uptime_seconds:
        type: "float"
        example: 45.2
      total_requests:
        type: "int"
        example: 8
      total_timeouts:
        type: "int"
        example: 0

    supervisor_action:
      - "Log crash event"
      - "Check if restart policy applies"
      - "Update agent blacklist if crash threshold exceeded"

  integration_circuit_breaker:
    adr: "ADR-0034c"
    action: "Increment failure counter, possibly open circuit"

    event_data:
      tool_name:
        type: "str"
        example: "weather_api"
      failure_type:
        type: "str"
        example: "crash"

    circuit_breaker_action:
      - "Increment failure count"
      - "Check if threshold exceeded (e.g., 5 failures in 60s)"
      - "Open circuit if threshold exceeded (prevent further requests)"

  integration_telemetry:
    action: "Emit crash metric"

    prometheus_metric:
      name: "mcp_process_crashes_total"
      type: "counter"
      labels: ["tool_name", "exit_code", "signal"]
      example_increment: |
        mcp_process_crashes_total.labels(
            tool_name="weather_api",
            exit_code=1,
            signal=None
        ).inc()

  implementation_example: |
    async def _emit_crash_event(self):
        """Emit crash event to supervisor, circuit breaker, telemetry"""

        # Emit to supervisor
        await supervisor.notify_crash(
            tool_name=self.tool_name,
            pid=self.info.pid,
            exit_code=self.info.exit_code,
            signal=self.info.signal,
            uptime_seconds=self.info.uptime_seconds(),
            total_requests=self.info.total_requests,
            total_timeouts=self.info.total_timeouts
        )

        # Emit to circuit breaker
        await circuit_breaker.record_failure(
            tool_name=self.tool_name,
            failure_type="crash"
        )

        # Emit metric
        mcp_process_crashes_total.labels(
            tool_name=self.tool_name,
            exit_code=self.info.exit_code or 0,
            signal=self.info.signal or 0
        ).inc()

        print(f"[MCPProcessSpawner] Crash event emitted: PID {self.info.pid}")

# =============================================================================
# EXPECTED VS UNEXPECTED TERMINATION
# =============================================================================

expected_vs_unexpected:
  description: "Distinguish expected termination (graceful shutdown) from crash"

  expected_termination:
    trigger: "terminate() called (user action or K1 shutdown)"
    state_before_exit: "TERMINATING"
    monitor_action: "Return early (not a crash)"
    code: |
      if self.info.state == ProcessState.TERMINATING:
          return  # Expected termination, not a crash

  unexpected_termination:
    trigger: "Process exits without terminate() call"
    state_before_exit: "SPAWNING or RUNNING"
    monitor_action: "Mark as CRASHED, emit crash event"
    code: |
      # state != TERMINATING, so unexpected exit
      self.info.state = ProcessState.CRASHED
      await self._emit_crash_event()

# =============================================================================
# ZOMBIE PROCESS PREVENTION
# =============================================================================

zombie_prevention:
  description: "Prevent zombie processes by waiting for exit"

  problem:
    description: "When process exits, it becomes zombie until parent calls wait()"
    zombie_state: "Process terminated but not yet reaped by parent"
    risk: "Zombie processes accumulate, exhaust process table"

  solution:
    description: "Monitor task calls process.wait() automatically"
    mechanism: "asyncio.subprocess.Process.wait() reaps zombie"
    result: "No zombies (all processes reaped)"

  verification:
    command: "ps aux | grep defunct"
    expected_output: "Empty (no defunct processes)"

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  monitor_task_overhead:
    description: "Background monitor task overhead"
    cpu_usage: "0% (task blocks on process.wait())"
    memory_usage: "~1KB (asyncio.Task object)"
    rationale: "Task sleeps until process exits, no polling"

  crash_detection_latency:
    target: "<10ms"
    actual: "~5ms"
    measurement: "Time from process exit to crash event emission"
    breakdown:
      process_wait_returns: "immediate (blocked task wakes up)"
      state_update: "0.1ms"
      logging: "2ms"
      emit_crash_event: "3ms"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_process_crashes_total:
    type: "counter"
    labels: ["tool_name", "exit_code", "signal"]
    description: "Total MCP process crashes"
    example_value: 3

  mcp_crash_uptime_seconds:
    type: "histogram"
    buckets: [1, 10, 60, 300, 600, 1800, 3600]
    labels: ["tool_name"]
    description: "Process uptime at crash"

  mcp_crash_requests_handled:
    type: "histogram"
    buckets: [0, 1, 5, 10, 50, 100, 500]
    labels: ["tool_name"]
    description: "Number of requests handled before crash"

logging:
  crash_detected:
    level: "ERROR"
    message: "MCP process crashed"
    fields:
      - "pid"
      - "tool_name"
      - "exit_code"
      - "signal"
      - "uptime_seconds"
      - "total_requests"
      - "total_timeouts"
    example: |
      [ERROR] MCP process crashed: pid=12345, tool_name=weather_api, exit_code=1,
              signal=None, uptime_seconds=45.2, total_requests=8, total_timeouts=0

  crash_signal_detected:
    level: "ERROR"
    message: "MCP process crashed (signal)"
    fields:
      - "pid"
      - "tool_name"
      - "signal"
      - "signal_name"
      - "uptime_seconds"
    example: |
      [ERROR] MCP process crashed (signal): pid=12345, tool_name=video_transcoder,
              signal=11, signal_name=SIGSEGV, uptime_seconds=120.5

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_crash_detection_non_zero_exit"
      description: "Monitor detects crash (exit code 1)"
      assertion: "info.state == CRASHED, info.exit_code == 1"

    - test_name: "test_crash_detection_signal"
      description: "Monitor detects crash (SIGSEGV)"
      assertion: "info.state == CRASHED, info.signal == 11"

    - test_name: "test_crash_detection_expected_termination_ignored"
      description: "Graceful shutdown not marked as crash"
      assertion: "info.state == TERMINATED (not CRASHED)"

    - test_name: "test_crash_event_emitted"
      description: "Crash event sent to supervisor, circuit breaker"
      assertion: "supervisor.notify_crash called, circuit_breaker.record_failure called"

    - test_name: "test_no_zombie_processes"
      description: "No zombie processes after crash"
      assertion: "ps aux | grep defunct returns empty"

