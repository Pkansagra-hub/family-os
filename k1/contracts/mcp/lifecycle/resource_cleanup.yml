# Resource Cleanup Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 240-298)
# Purpose: Clean up MCP server process resources (pipes, handles, connections)
# Research: Unix Resource Management, File Descriptor Leaks

contract_metadata:
  name: "resource_cleanup"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
  status: "approved"
  created: "2025-10-21"
  priority: "HIGH"

# =============================================================================
# RESOURCE CLEANUP OVERVIEW
# =============================================================================

overview:
  description: |
    Clean up MCP server process resources to prevent leaks.

    **Problem:** Process termination can leak resources (pipes, FDs, connections).
    **Solution:** Explicit cleanup sequence after process exit.
    **Pattern:** Resource Acquisition Is Initialization (RAII) pattern.

    **Design Decisions:**
    - Cleanup happens after process.wait() (process fully terminated)
    - asyncio automatically closes pipes (stdin/stdout/stderr)
    - Manual cleanup for server-side resources (DB, sockets, files)
    - Graceful shutdown preferred (allows server cleanup)

  purpose: "Clean up process resources to prevent leaks"
  pattern: "Resource Acquisition Is Initialization (RAII)"
  cleanup_stages: ["Automatic (asyncio)", "Graceful (server)", "Manual (K1)"]

# =============================================================================
# RESOURCE TYPES
# =============================================================================

resource_types:
  stdio_pipes:
    description: "stdin, stdout, stderr pipes for JSON-RPC communication"
    owner: "K1 (parent process)"
    cleanup_mechanism: "Automatic (asyncio)"
    cleanup_timing: "After process.wait()"

    leak_risk:
      description: "File descriptor leak if not closed"
      impact: "Exhaust FD limit (ulimit -n, typically 1024)"
      symptom: "OSError: [Errno 24] Too many open files"

    cleanup_implementation:
      automatic: true
      code: |
        # asyncio automatically closes pipes after process.wait()
        await self.process.wait()
        # Pipes automatically closed (no manual action needed)

    verification:
      command: "lsof -p <K1_PID> | grep pipe"
      expected_output: "No pipes for terminated process"

  process_handle:
    description: "Process handle (PID) for subprocess"
    owner: "K1 (parent process)"
    cleanup_mechanism: "Automatic (process.wait())"
    cleanup_timing: "After process exit"

    leak_risk:
      description: "Zombie process if not waited"
      impact: "Zombie processes accumulate, exhaust process table"
      symptom: "ps aux shows <defunct> processes"

    cleanup_implementation:
      automatic: true
      code: |
        # Always call process.wait() to reap zombie
        await self.process.wait()
        # Process reaped, no zombie

    verification:
      command: "ps aux | grep defunct"
      expected_output: "Empty (no defunct processes)"

  tcp_connections:
    description: "Network connections (HTTP transport)"
    owner: "MCP server"
    cleanup_mechanism: "Server-side (graceful shutdown)"
    cleanup_timing: "During shutdown JSON-RPC or SIGTERM handler"

    leak_risk:
      description: "Socket exhaustion, TIME_WAIT buildup"
      impact: "Cannot create new connections (EMFILE, EADDRNOTAVAIL)"
      symptom: "Connection refused, slow connection establishment"

    cleanup_implementation:
      graceful_shutdown: |
        # MCP server closes sockets in shutdown handler
        async def handle_shutdown(request):
            await http_server.close()  # Close listening socket
            for conn in active_connections:
                conn.close()  # Close active connections
            sys.exit(0)

      force_kill:
        description: "SIGKILL skips cleanup (sockets remain in TIME_WAIT)"
        impact: "Sockets in TIME_WAIT for 60s (TCP timeout)"
        mitigation: "Prefer graceful shutdown (shutdown JSON-RPC → SIGTERM)"

    verification:
      command: "netstat -an | grep TIME_WAIT"
      expected_output: "Minimal TIME_WAIT sockets after graceful shutdown"

  file_handles:
    description: "Open files (logs, temp files, data files)"
    owner: "MCP server"
    cleanup_mechanism: "Server-side (graceful shutdown)"
    cleanup_timing: "During shutdown JSON-RPC or SIGTERM handler"

    leak_risk:
      description: "File descriptor leak, corrupted logs, temp file accumulation"
      impact: "Exhaust FD limit, disk space leak"
      symptom: "OSError: Too many open files, /tmp full"

    cleanup_implementation:
      graceful_shutdown: |
        # MCP server closes files in shutdown handler
        async def handle_shutdown(request):
            for f in open_files:
                f.flush()  # Flush buffers
                f.close()  # Close file
            logging.shutdown()  # Flush log buffers
            sys.exit(0)

      force_kill:
        description: "SIGKILL skips cleanup (files not flushed, buffers lost)"
        impact: "Corrupted logs, incomplete writes"
        mitigation: "Prefer graceful shutdown"

    verification:
      command: "lsof -p <SERVER_PID>"
      expected_output: "No open files after graceful shutdown"

  database_connections:
    description: "Database connection pool"
    owner: "MCP server"
    cleanup_mechanism: "Server-side (graceful shutdown)"
    cleanup_timing: "During shutdown JSON-RPC"

    leak_risk:
      description: "Connection pool exhaustion, orphaned transactions"
      impact: "Database rejects new connections (max_connections exceeded)"
      symptom: "Connection refused, timeout on connection acquire"

    cleanup_implementation:
      graceful_shutdown: |
        # MCP server closes DB pool in shutdown handler
        async def handle_shutdown(request):
            await db_pool.close()  # Close all connections
            sys.exit(0)

      force_kill:
        description: "SIGKILL skips cleanup (connections remain open)"
        impact: "DB holds connections until timeout (default 8h for PostgreSQL)"
        mitigation: "DB connection timeout enforced server-side"

    verification:
      command: "SELECT COUNT(*) FROM pg_stat_activity WHERE application_name='mcp_server'"
      expected_output: "0 connections after graceful shutdown"

  distributed_locks:
    description: "Distributed locks (Redis, etcd)"
    owner: "MCP server"
    cleanup_mechanism: "Server-side (graceful shutdown)"
    cleanup_timing: "During shutdown JSON-RPC or SIGTERM handler"

    leak_risk:
      description: "Locks not released, other processes blocked"
      impact: "Deadlock, other processes wait indefinitely"
      symptom: "Processes hang waiting for lock"

    cleanup_implementation:
      graceful_shutdown: |
        # MCP server releases locks in shutdown handler
        async def handle_shutdown(request):
            await distributed_lock.release()
            sys.exit(0)

      force_kill:
        description: "SIGKILL skips cleanup (locks remain acquired)"
        impact: "Other processes blocked until lock timeout (e.g., 30s)"
        mitigation: "Locks have TTL (auto-expire after timeout)"

    verification:
      command: "redis-cli KEYS 'lock:*'"
      expected_output: "Empty (all locks released)"

# =============================================================================
# CLEANUP SEQUENCE
# =============================================================================

cleanup_sequence:
  description: "Order of cleanup operations after process exit"

  stage_1_process_wait:
    action: "Wait for process to fully exit"
    code: "await self.process.wait()"
    result: "Process reaped (no zombie), exit code captured"

  stage_2_automatic_cleanup:
    action: "asyncio closes stdio pipes automatically"
    code: "# Automatic (no manual action needed)"
    result: "Pipes closed, FDs released"

  stage_3_state_update:
    action: "Update ProcessInfo state"
    code: |
      self.info.state = ProcessState.TERMINATED
      self.info.terminated_at = time.time()
      self.info.exit_code = self.process.returncode
    result: "State reflects process termination"

  stage_4_logging:
    action: "Log termination event"
    code: |
      print(f"[MCPProcessSpawner] MCP server terminated: PID {self.process.pid}, exit_code {self.info.exit_code}")
    result: "Termination logged for debugging"

# =============================================================================
# SERVER-SIDE CLEANUP (GRACEFUL SHUTDOWN)
# =============================================================================

server_side_cleanup:
  description: "Cleanup performed by MCP server during graceful shutdown"

  shutdown_handler_example: |
    import signal
    import sys

    # Graceful shutdown handler
    async def shutdown_handler(request):
        """
        Handle shutdown JSON-RPC request.

        Cleanup sequence:
        1. Close database connections
        2. Flush log buffers
        3. Close file handles
        4. Release distributed locks
        5. Close network sockets
        6. Exit with code 0
        """
        print("[MCP Server] Received shutdown request, cleaning up...")

        # 1. Close database
        if db_pool:
            await db_pool.close()
            print("[MCP Server] Database connections closed")

        # 2. Flush logs
        logging.shutdown()
        print("[MCP Server] Log buffers flushed")

        # 3. Close files
        for f in open_files:
            f.close()
        print("[MCP Server] File handles closed")

        # 4. Release locks
        if distributed_lock:
            await distributed_lock.release()
            print("[MCP Server] Distributed locks released")

        # 5. Close network sockets
        if http_server:
            await http_server.close()
            print("[MCP Server] Network sockets closed")

        print("[MCP Server] Cleanup complete, exiting...")

        # 6. Exit cleanly
        sys.exit(0)

    # Register SIGTERM handler (fallback if shutdown JSON-RPC fails)
    def sigterm_handler(signum, frame):
        print("[MCP Server] Received SIGTERM, cleaning up...")
        # Run async cleanup
        asyncio.create_task(shutdown_handler(None))

    signal.signal(signal.SIGTERM, sigterm_handler)

# =============================================================================
# LEAK DETECTION
# =============================================================================

leak_detection:
  description: "Detect resource leaks in development/testing"

  file_descriptor_leak:
    detection_method: "lsof monitoring"
    command: |
      # Before spawning processes
      lsof -p <K1_PID> | wc -l  # Baseline FD count

      # After spawning + terminating 100 processes
      lsof -p <K1_PID> | wc -l  # Should be ~same as baseline

    expected_behavior: "FD count stable (no growth)"
    leak_symptom: "FD count grows with each spawn/terminate cycle"

  zombie_process_leak:
    detection_method: "ps monitoring"
    command: |
      # After terminating processes
      ps aux | grep defunct | wc -l

    expected_behavior: "0 defunct processes"
    leak_symptom: "Defunct processes accumulate"

  memory_leak:
    detection_method: "Process RSS monitoring"
    command: |
      # Monitor K1 process memory
      ps -o pid,rss,cmd -p <K1_PID>

    expected_behavior: "RSS stable (no growth)"
    leak_symptom: "RSS grows with each spawn/terminate cycle"

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  cleanup_latency:
    target: "<10ms"
    actual: "~5ms"
    breakdown:
      process_wait: "immediate (process already exited)"
      pipe_close: "automatic (~1ms)"
      state_update: "0.1ms"
      logging: "4ms"

  cleanup_cpu_overhead:
    description: "CPU usage for cleanup"
    overhead: "<0.1% (negligible)"
    rationale: "Simple state updates, no heavy computation"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_resource_leaks_total:
    type: "counter"
    labels: ["resource_type"]  # resource_type: pipe | zombie | memory
    description: "Total detected resource leaks"
    example_value: 0

  mcp_cleanup_duration_ms:
    type: "histogram"
    buckets: [1, 5, 10, 20, 50]
    labels: ["tool_name"]
    description: "Cleanup duration"

logging:
  cleanup_complete:
    level: "DEBUG"
    message: "MCP process cleanup complete"
    fields:
      - "pid"
      - "tool_name"
      - "exit_code"
      - "cleanup_duration_ms"

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_resource_cleanup_no_fd_leak"
      description: "Spawn/terminate 100 processes, verify FD count stable"
      assertion: "FD count after == FD count before (±5)"

    - test_name: "test_resource_cleanup_no_zombie"
      description: "Terminate process, verify no zombie"
      assertion: "ps aux | grep defunct returns empty"

    - test_name: "test_resource_cleanup_no_memory_leak"
      description: "Spawn/terminate 100 processes, verify RSS stable"
      assertion: "RSS after ~= RSS before (±10MB)"

