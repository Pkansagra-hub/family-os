# Process Monitor Task Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 304-337)
# Purpose: Background asyncio task monitoring MCP server process health
# Research: asyncio.Task (Python 3.10), Background Task Pattern

contract_metadata:
  name: "process_monitor_task"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
  status: "approved"
  created: "2025-10-21"
  priority: "HIGH"

# =============================================================================
# PROCESS MONITOR TASK OVERVIEW
# =============================================================================

overview:
  description: |
    Background asyncio task monitoring MCP server process health.

    **Problem:** K1 needs to detect process crashes asynchronously (non-blocking).
    **Solution:** Background asyncio.Task runs _monitor_process() method.
    **Pattern:** Background Task pattern.

    **Design Decisions:**
    - Task created at spawn() time
    - Task blocks on process.wait() (sleeps until exit)
    - Task detects crashes, emits events
    - Task completes when process exits (not explicitly cancelled)

  purpose: "Monitor MCP server process health in background"
  pattern: "Background Task"
  lifecycle: "Created at spawn(), completes at process exit"
  blocking_point: "process.wait() (sleeps until exit)"

# =============================================================================
# TASK LIFECYCLE
# =============================================================================

task_lifecycle:
  description: "Background monitor task lifecycle"

  creation:
    trigger: "spawn() method called"
    code: |
      async def spawn(self) -> ProcessInfo:
          # ... spawn process ...

          # Start background monitor
          self.monitor_task = asyncio.create_task(self._monitor_process())

          return self.info

    timing: "Immediately after subprocess.Popen"
    rationale: "Monitor from process start to catch early crashes"

  execution:
    description: "Task runs _monitor_process() method"
    blocking_point: "await self.process.wait()"
    cpu_usage: "0% (task sleeps until process exits)"
    memory_usage: "~1KB (asyncio.Task object)"

  completion:
    trigger: "Process exits (any reason)"
    action: "Task completes, emits crash event if unexpected"
    cleanup: "None (task automatically cleaned up by asyncio)"

  cancellation:
    description: "Task is NOT explicitly cancelled"
    rationale: "Task completes naturally when process exits"
    exception_handling: "Task should not raise exceptions (all caught internally)"

# =============================================================================
# MONITOR PROCESS METHOD
# =============================================================================

monitor_process_method:
  signature: "async def _monitor_process(self)"
  description: "Background task monitoring process exit"
  execution_context: "asyncio.Task (background)"

  algorithm:
    step_1:
      action: "Wait for process to exit"
      code: "exit_code = await self.process.wait()"
      blocking: true
      cpu_usage: "0% (task sleeps)"
      wakeup_condition: "Process exits"

    step_2:
      action: "Check if expected termination"
      code: |
        if self.info.state == ProcessState.TERMINATING:
            return  # Expected, not a crash
      rationale: "Graceful shutdown is not a crash"

    step_3:
      action: "Mark as CRASHED"
      code: |
        self.info.state = ProcessState.CRASHED
        self.info.terminated_at = time.time()
        self.info.exit_code = exit_code

    step_4:
      action: "Determine crash reason"
      code: |
        if exit_code < 0:
            self.info.signal = -exit_code
            print(f"[Monitor] Crashed (signal {-exit_code}): PID {self.process.pid}")
        else:
            print(f"[Monitor] Crashed (exit code {exit_code}): PID {self.process.pid}")

    step_5:
      action: "Emit crash event"
      code: "await self._emit_crash_event()"
      integrations: ["Supervisor", "Circuit Breaker", "Telemetry"]

  exception_handling:
    description: "All exceptions caught internally (task should never raise)"
    implementation: |
      async def _monitor_process(self):
          try:
              exit_code = await self.process.wait()

              # ... crash detection logic ...

          except Exception as e:
              # Should never happen, but catch to prevent task crash
              print(f"[Monitor] Unexpected exception in monitor task: {e}")
              import traceback
              traceback.print_exc()

# =============================================================================
# TASK CREATION PATTERN
# =============================================================================

task_creation_pattern:
  description: "Pattern for creating background monitor task"

  create_task:
    code: |
      # Create task without awaiting
      self.monitor_task = asyncio.create_task(self._monitor_process())

    rationale: "Fire-and-forget pattern (task runs in background)"
    behavior: "Task starts immediately, runs concurrently with spawn()"

  store_reference:
    code: "self.monitor_task = ..."
    rationale: "Keep reference for debugging (can inspect task state)"
    usage: |
      # Check if task is done
      if self.monitor_task.done():
          print("Process has exited")

      # Get task exception (if any)
      if self.monitor_task.exception():
          print(f"Task exception: {self.monitor_task.exception()}")

  no_await:
    description: "Do NOT await the task in spawn()"
    wrong_pattern: |
      # WRONG: This blocks spawn() until process exits
      await self.monitor_task

    correct_pattern: |
      # CORRECT: Task runs in background, spawn() returns immediately
      self.monitor_task = asyncio.create_task(self._monitor_process())
      return self.info

# =============================================================================
# TASK VS THREAD COMPARISON
# =============================================================================

task_vs_thread:
  description: "Why use asyncio.Task instead of threading.Thread?"

  asyncio_task:
    pros:
      - "Lightweight (~1KB memory)"
      - "No GIL contention (single-threaded async)"
      - "Integrates with asyncio event loop"
      - "await process.wait() non-blocking"
    cons:
      - "Requires asyncio event loop"

    performance:
      memory: "~1KB per task"
      cpu_overhead: "0% (sleeps until wakeup)"
      context_switch: "None (single-threaded)"

  threading_thread:
    pros:
      - "Can run outside asyncio event loop"
    cons:
      - "Heavyweight (~8MB stack per thread)"
      - "GIL contention (Python threads)"
      - "Thread synchronization complexity"
      - "process.wait() blocks thread"

    performance:
      memory: "~8MB per thread"
      cpu_overhead: "Thread scheduling overhead"
      context_switch: "OS context switches (expensive)"

  decision:
    choice: "asyncio.Task"
    rationale: "Lightweight, integrates with asyncio, perfect for I/O-bound monitoring"

# =============================================================================
# TASK STATES
# =============================================================================

task_states:
  description: "Monitor task states during lifecycle"

  pending:
    description: "Task created but process not yet exited"
    check: "not self.monitor_task.done()"
    action: "Task blocked on process.wait()"

  done:
    description: "Task completed (process exited)"
    check: "self.monitor_task.done()"
    action: "Task emitted crash event (if applicable)"

  cancelled:
    description: "Task cancelled (should not happen)"
    check: "self.monitor_task.cancelled()"
    action: "Unexpected (task should complete naturally)"

  exception:
    description: "Task raised exception (should not happen)"
    check: "self.monitor_task.exception() is not None"
    action: "Log exception, investigate bug"

# =============================================================================
# CONCURRENCY SAFETY
# =============================================================================

concurrency_safety:
  description: "Thread safety and race condition handling"

  process_info_mutations:
    issue: "Monitor task mutates ProcessInfo concurrently with other code"
    example: |
      # Monitor task sets state to CRASHED
      self.info.state = ProcessState.CRASHED

      # Meanwhile, main code checks state
      if self.info.state == ProcessState.RUNNING:
          # Race condition: state may have changed

    mitigation:
      approach: "Python GIL guarantees atomic assignment"
      safe_operations:
        - "self.info.state = ..."  # Atomic
        - "self.info.exit_code = ..."  # Atomic
      unsafe_operations:
        - "self.info.total_requests += 1"  # NOT atomic (read-modify-write)

      solution_for_counters: |
        # Use asyncio.Lock for counters
        self.lock = asyncio.Lock()

        async with self.lock:
            self.info.total_requests += 1

  terminating_state_check:
    issue: "Race between terminate() and monitor detecting crash"
    scenario: |
      # Main code calls terminate()
      self.info.state = ProcessState.TERMINATING

      # Monitor detects exit (race: who sets state first?)

    resolution:
      approach: "Monitor checks state before marking as crash"
      code: |
        if self.info.state == ProcessState.TERMINATING:
            return  # Expected termination, not a crash

        # Only mark as crash if not TERMINATING
        self.info.state = ProcessState.CRASHED

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  task_creation_latency:
    target: "<1ms"
    actual: "~0.5ms"
    measurement: "Time to create asyncio.Task"

  task_memory_overhead:
    target: "<10KB per task"
    actual: "~1KB"
    measurement: "Memory used by asyncio.Task object"

  task_cpu_overhead:
    target: "0% (sleeping)"
    actual: "0%"
    measurement: "CPU usage while blocked on process.wait()"

  crash_detection_latency:
    target: "<10ms"
    actual: "~5ms"
    measurement: "Time from process exit to crash event emission"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_monitor_tasks_active:
    type: "gauge"
    description: "Number of active monitor tasks"
    expected_value: "Equal to number of running MCP servers"

  mcp_monitor_task_duration_seconds:
    type: "histogram"
    buckets: [1, 10, 60, 300, 600, 1800, 3600]
    labels: ["tool_name"]
    description: "Monitor task duration (process uptime)"

logging:
  monitor_task_started:
    level: "DEBUG"
    message: "Monitor task started"
    fields: ["pid", "tool_name"]

  monitor_task_completed:
    level: "DEBUG"
    message: "Monitor task completed"
    fields: ["pid", "tool_name", "duration_seconds"]

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_monitor_task_created_at_spawn"
      description: "Verify monitor task created when spawn() called"
      assertion: "self.monitor_task is not None, not self.monitor_task.done()"

    - test_name: "test_monitor_task_detects_crash"
      description: "Process crashes, monitor task detects and emits event"
      assertion: "info.state == CRASHED, crash event emitted"

    - test_name: "test_monitor_task_ignores_expected_termination"
      description: "Graceful shutdown, monitor task does not mark as crash"
      assertion: "info.state == TERMINATED (not CRASHED)"

    - test_name: "test_monitor_task_completes_naturally"
      description: "Monitor task completes when process exits"
      assertion: "self.monitor_task.done() == True after process exit"

    - test_name: "test_monitor_task_no_exception"
      description: "Monitor task does not raise exceptions"
      assertion: "self.monitor_task.exception() is None"

# =============================================================================
# DEBUGGING TIPS
# =============================================================================

debugging_tips:
  check_task_state:
    description: "Inspect monitor task state for debugging"
    code: |
      # Check if task is done
      if spawner.monitor_task.done():
          print("Process has exited")
      else:
          print("Process still running")

      # Check for exception
      if spawner.monitor_task.exception():
          print(f"Task exception: {spawner.monitor_task.exception()}")

  await_task_for_testing:
    description: "Await monitor task in tests to ensure process exited"
    code: |
      # In tests, await monitor task to wait for process exit
      await spawner.monitor_task

      # Now process is guaranteed to have exited
      assert spawner.info.state in (ProcessState.TERMINATED, ProcessState.CRASHED)

# =============================================================================
# FULL IMPLEMENTATION
# =============================================================================

python_implementation: |
  import asyncio
  import time
  from typing import Optional

  class MCPProcessSpawner:
      def __init__(self, server_path: str, timeout_seconds: int = 30):
          self.server_path = server_path
          self.timeout_seconds = timeout_seconds

          self.process: Optional[asyncio.subprocess.Process] = None
          self.info: Optional[ProcessInfo] = None
          self.monitor_task: Optional[asyncio.Task] = None

      async def spawn(self) -> ProcessInfo:
          """Spawn MCP server subprocess"""
          # Spawn process
          self.process = await asyncio.create_subprocess_exec(
              "python3", self.server_path,
              stdin=asyncio.subprocess.PIPE,
              stdout=asyncio.subprocess.PIPE,
              stderr=asyncio.subprocess.PIPE
          )

          # Initialize ProcessInfo
          self.info = ProcessInfo(
              pid=self.process.pid,
              state=ProcessState.SPAWNING,
              started_at=time.time()
          )

          # Start background monitor (fire-and-forget)
          self.monitor_task = asyncio.create_task(self._monitor_process())

          print(f"[MCPProcessSpawner] Spawned MCP server: PID {self.process.pid}")

          return self.info

      async def _monitor_process(self):
          """
          Background task: monitor process exit.

          Detects crashes (non-zero exit, signals).
          Task runs until process exits.
          """
          try:
              # Wait for process to exit (blocks until exit)
              exit_code = await self.process.wait()

              # Check if expected termination (graceful shutdown)
              if self.info.state == ProcessState.TERMINATING:
                  return  # Expected, not a crash

              # Unexpected exit (crash)
              self.info.state = ProcessState.CRASHED
              self.info.terminated_at = time.time()
              self.info.exit_code = exit_code

              # Check if killed by signal
              if exit_code < 0:
                  self.info.signal = -exit_code
                  print(f"[Monitor] MCP server crashed (signal {-exit_code}): PID {self.process.pid}")
              else:
                  print(f"[Monitor] MCP server crashed (exit code {exit_code}): PID {self.process.pid}")

              # Emit crash event
              await self._emit_crash_event()

          except Exception as e:
              # Should never happen, but catch to prevent task crash
              print(f"[Monitor] Unexpected exception in monitor task: {e}")
              import traceback
              traceback.print_exc()

      async def _emit_crash_event(self):
          """Emit crash event to supervisor, circuit breaker, telemetry"""
          print(f"[Monitor] Crash event emitted: PID {self.info.pid}")

