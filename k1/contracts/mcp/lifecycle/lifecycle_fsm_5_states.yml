references:
  standards:
    - name: "Finite State Machine (FSM)"
      description: "Mathematical model of computation with states and transitions"
      reference: "Mealy (1955), Moore (1956)"
      url: "https://en.wikipedia.org/wiki/Finite-state_machine"

    - name: "Unix Process States"
      description: "Process lifecycle states in Unix systems"
      reference: "Stevens & Rago (2013) - Advanced Programming in the UNIX Environment"
      url: "https://en.wikipedia.org/wiki/Process_state"

  design_patterns:
    - name: "State Pattern"
      description: "Object behavior changes based on internal state"
      reference: "Gang of Four (1994)"

    - name: "Lifecycle Management"
      description: "Managing object/process lifecycle with explicit states"
      reference: "Fowler (2002) - Patterns of Enterprise Application Architecture"

  related_contracts:
    - "process_spawner.yml"
    - "initialize_request.yml"
    - "graceful_shutdown.yml"
    - "crash_detection.yml"

