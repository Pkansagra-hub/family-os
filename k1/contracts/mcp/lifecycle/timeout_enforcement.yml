# Timeout Enforcement Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 376-430)
# Purpose: Enforce per-tool timeout for MCP tools/call requests
# Research: asyncio.wait_for (Python 3.10), Timeout Pattern

contract_metadata:
  name: "timeout_enforcement"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
    - "ADR-0034a: MCP JSON-RPC Protocol"
  status: "approved"
  created: "2025-10-21"
  priority: "CRITICAL"

# =============================================================================
# TIMEOUT ENFORCEMENT OVERVIEW
# =============================================================================

overview:
  description: |
    Enforce configurable timeout for MCP tools/call requests.

    **Problem:** Runaway tools block K1 indefinitely (infinite loop, network hang).
    **Solution:** asyncio.wait_for with per-tool timeout, kill process on timeout.
    **Pattern:** Timeout pattern (deadline enforcement).

    **Design Decisions:**
    - Per-tool timeout configuration (calculator: 5s, video: 300s, default: 30s)
    - Timeout tracked per request (not process uptime)
    - asyncio.wait_for wraps tools/call execution
    - On timeout: kill process (SIGKILL), raise TimeoutError

  purpose: "Enforce per-tool timeout to prevent runaway tools"
  mechanism: "asyncio.wait_for"
  action_on_timeout: "Kill process (SIGKILL)"
  configuration: "Per-tool YAML config"

# =============================================================================
# TIMEOUT ENFORCER CLASS
# =============================================================================

timeout_enforcer_class:
  name: "TimeoutEnforcer"
  description: "Enforce timeout for MCP tools/call requests"

  responsibilities:
    - "Wrap tools/call with asyncio.wait_for"
    - "Track request counters (total_requests, total_timeouts)"
    - "Kill process on timeout"
    - "Raise TimeoutError to caller"

  attributes:
    spawner:
      type: "MCPProcessSpawner"
      description: "Process spawner (used to kill process on timeout)"
      example: "MCPProcessSpawner('/path/to/mcp_server.py', 30)"

  methods:
    call_tool_with_timeout:
      signature: "async def call_tool_with_timeout(self, client, tool_name, arguments, timeout=None) -> dict"
      description: "Call tool with timeout enforcement"

# =============================================================================
# CALL_TOOL_WITH_TIMEOUT METHOD
# =============================================================================

call_tool_with_timeout_method:
  signature: "async def call_tool_with_timeout(self, client, tool_name: str, arguments: dict, timeout: float = None) -> dict"
  description: "Call tool with timeout enforcement"

  parameters:
    client:
      type: "MCPClient"
      description: "JSON-RPC client for MCP server"
      example: "MCPClient(TransportType.STDIO, process=spawner.process)"

    tool_name:
      type: "str"
      description: "Tool name to invoke"
      example: "get_weather"

    arguments:
      type: "dict"
      description: "Tool arguments"
      example: {"city": "Seattle", "units": "metric"}

    timeout:
      type: "float | None"
      description: "Timeout in seconds (None = use spawner default)"
      default: null
      example: 30.0

  returns:
    type: "dict"
    description: "Tool execution result"
    example: {"temperature": 18, "units": "C", "city": "Seattle"}

  raises:
    TimeoutError:
      condition: "Tool execution exceeds timeout"
      action: "Kill process, raise TimeoutError"
      example: "TimeoutError: Tool get_weather timed out after 30s"

    JsonRpcError:
      condition: "Tool returns JSON-RPC error"
      action: "Propagate error to caller"
      example: "JsonRpcError: Tool execution failed (code -32099)"

  algorithm:
    step_1:
      action: "Determine timeout value"
      code: |
        if timeout is None:
            timeout = self.spawner.timeout_seconds

    step_2:
      action: "Increment request counter"
      code: "self.spawner.info.total_requests += 1"

    step_3:
      action: "Start timer"
      code: "start = time.time()"

    step_4:
      action: "Execute tool with timeout"
      code: |
        try:
            result = await asyncio.wait_for(
                client.call_tool(tool_name, arguments),
                timeout=timeout
            )
        except asyncio.TimeoutError:
            # Timeout: kill process
            self.spawner.info.total_timeouts += 1
            await self.spawner.kill()
            raise TimeoutError(f"Tool {tool_name} timed out after {timeout}s")

    step_5:
      action: "Log success"
      code: |
        latency_ms = (time.time() - start) * 1000
        print(f"[TimeoutEnforcer] Tool {tool_name} completed in {latency_ms:.1f}ms")

    step_6:
      action: "Return result"
      code: "return result"

# =============================================================================
# TIMEOUT CONFIGURATION
# =============================================================================

timeout_configuration:
  description: "Per-tool timeout configuration in YAML"

  config_file_path: "k1/config/tool_timeouts.yml"

  config_schema:
    tool_timeouts:
      type: "dict[str, int]"
      description: "Map tool name to timeout in seconds"
      example:
        calculator: 5
        unit_converter: 5
        text_search: 10
        weather_api: 30
        web_search: 30
        calendar_sync: 60
        video_transcoder: 300
        image_processor: 120
        llm_inference: 120
        default: 30

  example_config: |
    # k1/config/tool_timeouts.yml
    tool_timeouts:
      # Fast tools (5-10s)
      calculator: 5
      unit_converter: 5
      text_search: 10

      # Medium tools (30-60s)
      weather_api: 30
      web_search: 30
      calendar_sync: 60

      # Slow tools (120-300s)
      video_transcoder: 300
      image_processor: 120
      llm_inference: 120

      # Default timeout (if tool not specified)
      default: 30

  timeout_config_loader:
    class_name: "TimeoutConfig"
    description: "Load per-tool timeout configuration"
    implementation: |
      import yaml

      class TimeoutConfig:
          """Load per-tool timeout configuration"""

          def __init__(self, config_path: str = "k1/config/tool_timeouts.yml"):
              with open(config_path) as f:
                  data = yaml.safe_load(f)

              self.timeouts: dict[str, int] = data["tool_timeouts"]
              self.default_timeout: int = self.timeouts.get("default", 30)

          def get_timeout(self, tool_name: str) -> int:
              """Get timeout for tool (fallback to default)"""
              return self.timeouts.get(tool_name, self.default_timeout)

    usage_example: |
      # Load config
      timeout_config = TimeoutConfig()

      # Get timeouts
      weather_timeout = timeout_config.get_timeout("weather_api")  # 30s
      video_timeout = timeout_config.get_timeout("video_transcoder")  # 300s
      unknown_timeout = timeout_config.get_timeout("unknown_tool")  # 30s (default)

# =============================================================================
# TIMEOUT ACTION (KILL PROCESS)
# =============================================================================

timeout_action:
  description: "Action taken when tool execution exceeds timeout"

  sequence:
    step_1:
      action: "Detect timeout (asyncio.TimeoutError raised)"
      code: "except asyncio.TimeoutError:"

    step_2:
      action: "Increment timeout counter"
      code: "self.spawner.info.total_timeouts += 1"

    step_3:
      action: "Log timeout event"
      code: |
        print(f"[TimeoutEnforcer] Tool {tool_name} timed out after {timeout}s, killing PID {self.spawner.process.pid}")

    step_4:
      action: "Kill process (SIGKILL)"
      code: "await self.spawner.kill()"
      rationale: "Immediate termination, no cleanup (tool is stuck)"

    step_5:
      action: "Raise TimeoutError to caller"
      code: |
        raise TimeoutError(f"Tool {tool_name} timed out after {timeout}s")

  rationale:
    why_kill_process: "Tool is stuck (infinite loop, network hang), cannot be recovered"
    why_sigkill: "SIGTERM may not work if process is deadlocked, SIGKILL guarantees termination"
    why_no_retry: "Timeout indicates fundamental issue (tool bug, environment problem), retry unlikely to succeed"

# =============================================================================
# TIMEOUT SCENARIOS
# =============================================================================

timeout_scenarios:
  infinite_loop:
    description: "Tool enters infinite loop (e.g., bug in algorithm)"
    example: |
      def calculate_fibonacci(n):
          while True:  # Bug: infinite loop
              pass
    timeout: "Tool times out after configured duration"
    action: "Process killed, TimeoutError raised"
    user_impact: "User notified: 'Tool fibonacci_calculator timed out after 5s'"

  network_hang:
    description: "Tool waits for network response that never arrives"
    example: |
      response = requests.get("https://slow-api.example.com", timeout=None)
    timeout: "Tool times out after configured duration"
    action: "Process killed, TimeoutError raised"
    user_impact: "User notified: 'Tool web_search timed out after 30s'"

  slow_computation:
    description: "Tool legitimately takes long time (e.g., video transcoding)"
    example: |
      transcode_video("input.mp4", "output.mp4")  # Takes 4 minutes
    timeout: "Configured as 300s (5 minutes) for video_transcoder"
    action: "No timeout, tool completes successfully"
    user_impact: "Tool completes normally"

  timeout_too_aggressive:
    description: "Timeout set too low, tool killed prematurely"
    example: |
      # video_transcoder configured with 30s timeout (should be 300s)
      transcode_video("input.mp4", "output.mp4")  # Takes 4 minutes
    timeout: "Tool times out after 30s (misconfigured)"
    action: "Process killed, TimeoutError raised (false positive)"
    user_impact: "User frustrated, tool fails unnecessarily"
    mitigation: "Careful timeout configuration per tool characteristics"

# =============================================================================
# TIMEOUT ACCURACY
# =============================================================================

timeout_accuracy:
  description: "Timeout enforcement accuracy (how close to configured timeout)"

  target_accuracy: "±100ms"

  factors_affecting_accuracy:
    asyncio_wait_for_precision:
      description: "asyncio.wait_for checks timeout periodically"
      impact: "~10ms variance"

    sigkill_latency:
      description: "OS scheduler delay for signal delivery"
      impact: "~5-20ms variance"

    python_gil:
      description: "Python GIL may delay timeout check"
      impact: "~10-50ms variance (rare)"

  measured_accuracy:
    scenario: "Tool configured with 30s timeout, enters infinite loop"
    expected_kill_time: "30.0s"
    measured_kill_times:
      - "29.98s"
      - "30.02s"
      - "30.05s"
      - "29.95s"
      - "30.01s"
    variance: "±50ms"
    conclusion: "Accuracy well within ±100ms target"

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  timeout_overhead:
    target: "<1ms"
    actual: "~0.5ms"
    measurement: "asyncio.wait_for wrapper overhead"
    rationale: "Negligible compared to tool execution time"

  kill_latency:
    target: "<20ms"
    actual: "~15ms"
    measurement: "Time from timeout detection to SIGKILL completion"
    breakdown:
      timeout_detection: "1ms (asyncio.TimeoutError raised)"
      counter_increment: "0.1ms"
      logging: "5ms"
      sigkill_signal: "5ms"
      process_wait: "5ms"

  timeout_config_load_latency:
    target: "<10ms"
    actual: "~5ms"
    measurement: "Time to load YAML config file"
    frequency: "Once at K1 startup"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_tool_timeouts_total:
    type: "counter"
    labels: ["tool_name", "timeout_seconds"]
    description: "Total tool timeouts (process killed)"
    example_value: 3

  mcp_tool_duration_ms:
    type: "histogram"
    buckets: [10, 50, 100, 500, 1000, 5000, 10000, 30000, 60000, 300000]
    labels: ["tool_name", "status"]  # status: success | timeout | error
    description: "Tool execution duration"

  mcp_timeout_kills_total:
    type: "counter"
    labels: ["tool_name"]
    description: "Total processes killed due to timeout"

logging:
  timeout_detected:
    level: "WARNING"
    message: "Tool timeout detected"
    fields:
      - "tool_name"
      - "timeout_seconds"
      - "pid"
      - "total_timeouts"
    example: |
      [WARNING] Tool timeout detected: tool_name=video_transcoder, timeout_seconds=300,
                pid=12345, total_timeouts=1

  process_killed:
    level: "ERROR"
    message: "Process killed due to timeout"
    fields:
      - "tool_name"
      - "pid"
      - "timeout_seconds"
      - "uptime_seconds"
    example: |
      [ERROR] Process killed due to timeout: tool_name=video_transcoder, pid=12345,
              timeout_seconds=300, uptime_seconds=300.2

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_timeout_enforcer_success"
      description: "Tool completes within timeout, returns result"
      assertion: "result == expected_result, no TimeoutError"

    - test_name: "test_timeout_enforcer_timeout"
      description: "Tool exceeds timeout, process killed, TimeoutError raised"
      assertion: "TimeoutError raised, process state = TERMINATED"

    - test_name: "test_timeout_enforcer_counter_incremented"
      description: "total_requests and total_timeouts counters incremented correctly"
      assertion: "total_requests == 2, total_timeouts == 1"

    - test_name: "test_timeout_config_load"
      description: "Timeout config loaded from YAML correctly"
      assertion: "timeout_config.get_timeout('calculator') == 5"

    - test_name: "test_timeout_config_default"
      description: "Unknown tool falls back to default timeout"
      assertion: "timeout_config.get_timeout('unknown') == 30"

    - test_name: "test_timeout_accuracy"
      description: "Timeout enforced within ±100ms of configured value"
      assertion: "abs(actual_kill_time - timeout) < 0.1"

# =============================================================================
# FULL IMPLEMENTATION
# =============================================================================

python_implementation: |
  import asyncio
  import time

  class TimeoutEnforcer:
      """
      Enforce timeout for MCP tools/call requests.

      Wraps asyncio.wait_for for timeout enforcement.
      On timeout: kills MCP server process.
      """

      def __init__(self, spawner):
          """
          Initialize timeout enforcer.

          Args:
              spawner: MCPProcessSpawner instance
          """
          self.spawner = spawner

      async def call_tool_with_timeout(
          self,
          client,
          tool_name: str,
          arguments: dict,
          timeout: float = None
      ) -> dict:
          """
          Call tool with timeout enforcement.

          Args:
              client: MCPClient instance
              tool_name: Tool name
              arguments: Tool arguments
              timeout: Timeout in seconds (None = use spawner default)

          Returns:
              dict: Tool result

          Raises:
              TimeoutError: If tool exceeds timeout (process killed)
              JsonRpcError: If tool returns error
          """
          if timeout is None:
              timeout = self.spawner.timeout_seconds

          # Track request
          self.spawner.info.total_requests += 1

          start = time.time()
          try:
              # Execute with timeout
              result = await asyncio.wait_for(
                  client.call_tool(tool_name, arguments),
                  timeout=timeout
              )

              # Success
              latency_ms = (time.time() - start) * 1000
              print(f"[TimeoutEnforcer] Tool {tool_name} completed in {latency_ms:.1f}ms")

              return result

          except asyncio.TimeoutError:
              # Timeout: kill process
              self.spawner.info.total_timeouts += 1

              print(f"[TimeoutEnforcer] Tool {tool_name} timed out after {timeout}s, killing PID {self.spawner.process.pid}")

              await self.spawner.kill()

              raise TimeoutError(f"Tool {tool_name} timed out after {timeout}s")

