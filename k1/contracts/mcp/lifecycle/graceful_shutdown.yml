# Graceful Shutdown Contract
# ADR: 0034b-mcp-process-lifecycle.md (lines 240-298)
# Purpose: Graceful MCP server termination (shutdown → SIGTERM → SIGKILL)
# Research: Unix Signals (POSIX 1990), Graceful Shutdown Pattern (Fowler)

contract_metadata:
  name: "graceful_shutdown"
  version: "1.0.0"
  parent_adr: "ADR-0034b"
  related_adrs:
    - "ADR-0034: MCP Protocol Adoption"
    - "ADR-0034a: MCP JSON-RPC Protocol"
  status: "approved"
  created: "2025-10-21"
  priority: "HIGH"

# =============================================================================
# GRACEFUL SHUTDOWN OVERVIEW
# =============================================================================

overview:
  description: |
    Graceful MCP server termination with fallback to force kill.

    **Problem:** Immediate SIGKILL leaves resources leaked (connections, files, locks).
    **Solution:** Multi-stage shutdown (shutdown JSON-RPC → SIGTERM → SIGKILL).
    **Pattern:** Graceful Shutdown Pattern (Martin Fowler).

    **Design Decisions:**
    - 3-stage escalation (graceful → interrupt → force)
    - 5s timeout per stage (configurable)
    - shutdown JSON-RPC gives server chance to cleanup
    - SIGTERM allows signal handlers to run
    - SIGKILL as last resort (no cleanup)

  purpose: "Terminate MCP server gracefully with fallback to force kill"
  stages: 3
  pattern: "Graceful Shutdown Pattern"
  signals: ["shutdown (JSON-RPC)", "SIGTERM (15)", "SIGKILL (9)"]

# =============================================================================
# SHUTDOWN SEQUENCE
# =============================================================================

shutdown_sequence:
  description: "3-stage shutdown escalation with timeouts"

  stage_1_shutdown_json_rpc:
    name: "Send shutdown JSON-RPC request"
    timeout: "2s"
    signal: null
    method: "shutdown"

    purpose: "Request server to shut down gracefully (close connections, flush logs)"

    json_rpc_request: |
      {
        "jsonrpc": "2.0",
        "method": "shutdown",
        "params": {},
        "id": "shutdown-req-1"
      }

    expected_server_actions:
      - "Close database connections"
      - "Flush log buffers"
      - "Close file handles"
      - "Release locks"
      - "Send final metrics"
      - "Exit with code 0"

    implementation: |
      try:
          from .jsonrpc import MCPClient, TransportType
          client = MCPClient(TransportType.STDIO, process=self.process)
          await asyncio.wait_for(client.shutdown(), timeout=2.0)
      except:
          pass  # Ignore errors (server may already be dead)

    success_criteria:
      - "Server exits with code 0 within 2s"
      - "Process.wait() returns successfully"

    failure_action: "Proceed to stage 2 (wait for graceful exit)"

  stage_2_wait_graceful_exit:
    name: "Wait for process to exit gracefully"
    timeout: "5s (configurable)"
    signal: null

    purpose: "Give server time to complete cleanup after shutdown request"

    implementation: |
      try:
          await asyncio.wait_for(self.process.wait(), timeout=timeout)
          print(f"[MCPProcessSpawner] MCP server exited gracefully")
          self.info.state = ProcessState.TERMINATED
          self.info.terminated_at = time.time()
          self.info.exit_code = self.process.returncode
          return  # Success
      except asyncio.TimeoutError:
          pass  # Proceed to stage 3

    success_criteria:
      - "Process exits within 5s"
      - "Exit code captured (typically 0)"

    failure_action: "Proceed to stage 3 (SIGTERM)"

  stage_3_sigterm:
    name: "Send SIGTERM (interrupt signal)"
    timeout: null
    signal: "SIGTERM (15)"

    purpose: "Request OS to terminate process gracefully (allows signal handlers)"

    signal_characteristics:
      catchable: true
      description: "Process can catch SIGTERM and run cleanup handlers"
      default_action: "Terminate process"

    implementation: |
      print(f"[MCPProcessSpawner] Sending SIGTERM to PID {self.process.pid}")
      self.process.send_signal(signal.SIGTERM)

    expected_server_actions:
      - "Signal handler executes"
      - "Cleanup code runs (finally blocks, atexit handlers)"
      - "Process exits"

    wait_for_exit:
      timeout: "5s (configurable)"
      implementation: |
        try:
            await asyncio.wait_for(self.process.wait(), timeout=timeout)
            print(f"[MCPProcessSpawner] MCP server exited after SIGTERM")
            self.info.state = ProcessState.TERMINATED
            self.info.terminated_at = time.time()
            self.info.exit_code = self.process.returncode
            self.info.signal = signal.SIGTERM
            return  # Success
        except asyncio.TimeoutError:
            pass  # Proceed to stage 4

    success_criteria:
      - "Process exits within 5s after SIGTERM"
      - "Signal captured (info.signal = SIGTERM)"

    failure_action: "Proceed to stage 4 (SIGKILL)"

  stage_4_sigkill:
    name: "Send SIGKILL (force kill)"
    timeout: null
    signal: "SIGKILL (9)"

    purpose: "Force kill process (no cleanup, immediate termination)"

    signal_characteristics:
      catchable: false
      description: "Process cannot catch SIGKILL, kernel terminates immediately"
      default_action: "Immediate termination"

    implementation: |
      print(f"[MCPProcessSpawner] Sending SIGKILL to PID {self.process.pid}")
      self.process.kill()
      await self.process.wait()

      print(f"[MCPProcessSpawner] MCP server killed")
      self.info.state = ProcessState.TERMINATED
      self.info.terminated_at = time.time()
      self.info.exit_code = self.process.returncode
      self.info.signal = signal.SIGKILL

    success_criteria:
      - "Process always terminates (SIGKILL cannot be ignored)"
      - "Signal captured (info.signal = SIGKILL)"

    failure_action: "None (SIGKILL always succeeds)"

# =============================================================================
# SHUTDOWN SCENARIOS
# =============================================================================

shutdown_scenarios:
  clean_exit:
    description: "Server responds to shutdown JSON-RPC, exits cleanly"
    duration: "~65ms"
    stages_executed: ["shutdown JSON-RPC", "wait graceful exit"]

    sequence:
      - stage: "shutdown JSON-RPC"
        action: "Client sends shutdown request"
        server_response: "Server receives shutdown, starts cleanup"
        duration: "5ms"

      - stage: "server cleanup"
        action: "Server closes connections, flushes logs"
        duration: "50ms"

      - stage: "process exit"
        action: "Server exits with code 0"
        duration: "10ms"

      - stage: "wait completes"
        action: "process.wait() returns successfully"
        duration: "0ms (immediate)"

    final_state:
      state: "TERMINATED"
      exit_code: 0
      signal: null
      uptime: "varies"

  unresponsive_to_shutdown:
    description: "Server doesn't respond to shutdown, requires SIGTERM"
    duration: "~5,015ms"
    stages_executed: ["shutdown JSON-RPC (timeout)", "wait (timeout)", "SIGTERM", "wait"]

    sequence:
      - stage: "shutdown JSON-RPC"
        action: "Client sends shutdown request"
        server_response: "No response (hung)"
        duration: "2,000ms (timeout)"

      - stage: "wait graceful exit"
        action: "Wait for process to exit"
        server_response: "Process still running"
        duration: "5,000ms (timeout)"

      - stage: "SIGTERM"
        action: "Send SIGTERM signal"
        server_response: "Signal handler executes, process exits"
        duration: "5ms"

      - stage: "wait after SIGTERM"
        action: "Wait for process to exit"
        duration: "10ms"

    final_state:
      state: "TERMINATED"
      exit_code: 0
      signal: 15  # SIGTERM
      uptime: "varies"

  deadlocked_server:
    description: "Server deadlocked, requires SIGKILL"
    duration: "~10,015ms"
    stages_executed: ["shutdown JSON-RPC (timeout)", "wait (timeout)", "SIGTERM", "wait (timeout)", "SIGKILL"]

    sequence:
      - stage: "shutdown JSON-RPC"
        action: "Client sends shutdown request"
        server_response: "No response (deadlocked)"
        duration: "2,000ms (timeout)"

      - stage: "wait graceful exit"
        action: "Wait for process to exit"
        server_response: "Process still running"
        duration: "5,000ms (timeout)"

      - stage: "SIGTERM"
        action: "Send SIGTERM signal"
        server_response: "Signal handler deadlocked, no exit"
        duration: "5ms"

      - stage: "wait after SIGTERM"
        action: "Wait for process to exit"
        server_response: "Process still running"
        duration: "5,000ms (timeout)"

      - stage: "SIGKILL"
        action: "Send SIGKILL signal"
        server_response: "Kernel terminates process immediately"
        duration: "5ms"

      - stage: "wait after SIGKILL"
        action: "Wait for process to exit"
        duration: "5ms (immediate)"

    final_state:
      state: "TERMINATED"
      exit_code: -9  # Killed by signal
      signal: 9  # SIGKILL
      uptime: "varies"

# =============================================================================
# RESOURCE CLEANUP
# =============================================================================

resource_cleanup:
  description: "Resources released during graceful shutdown"

  stdio_pipes:
    resource: "stdin, stdout, stderr pipes"
    cleanup_stage: "After process exit (any stage)"
    action: "asyncio closes pipes automatically"
    risk_if_not_cleaned: "File descriptor leak"

  process_handle:
    resource: "Process handle (PID)"
    cleanup_stage: "After process.wait()"
    action: "Wait for process to exit, prevent zombie"
    risk_if_not_cleaned: "Zombie process (defunct process in process table)"

  tcp_connections:
    resource: "Network connections (if server uses HTTP transport)"
    cleanup_stage: "Stage 1 (shutdown JSON-RPC) or Stage 3 (SIGTERM handler)"
    action: "Server closes sockets in shutdown handler"
    risk_if_not_cleaned: "Socket exhaustion, TIME_WAIT buildup"

  file_handles:
    resource: "Open files (logs, temp files)"
    cleanup_stage: "Stage 1 (shutdown JSON-RPC) or Stage 3 (SIGTERM handler)"
    action: "Server closes files, flushes buffers"
    risk_if_not_cleaned: "Corrupted logs, temp file accumulation"

  database_connections:
    resource: "Database connections"
    cleanup_stage: "Stage 1 (shutdown JSON-RPC)"
    action: "Server closes DB connections gracefully"
    risk_if_not_cleaned: "Connection pool exhaustion, orphaned transactions"

  locks:
    resource: "File locks, distributed locks"
    cleanup_stage: "Stage 1 (shutdown JSON-RPC) or Stage 3 (SIGTERM handler)"
    action: "Server releases locks"
    risk_if_not_cleaned: "Deadlock, other processes blocked"

# =============================================================================
# SHUTDOWN JSON-RPC SPECIFICATION
# =============================================================================

shutdown_json_rpc:
  method: "shutdown"

  request_format: |
    {
      "jsonrpc": "2.0",
      "method": "shutdown",
      "params": {},
      "id": "shutdown-req-1"
    }

  response_format: |
    {
      "jsonrpc": "2.0",
      "result": null,
      "id": "shutdown-req-1"
    }

  server_implementation_example: |
    async def handle_shutdown(request):
        """
        Handle shutdown request.

        Cleanup sequence:
        1. Close database connections
        2. Flush log buffers
        3. Close file handles
        4. Release locks
        5. Exit with code 0
        """
        print("[MCP Server] Received shutdown request, cleaning up...")

        # Close database
        await db_pool.close()

        # Flush logs
        logging.shutdown()

        # Close files
        for f in open_files:
            f.close()

        # Release locks
        await distributed_lock.release()

        print("[MCP Server] Cleanup complete, exiting...")

        # Exit cleanly
        sys.exit(0)

# =============================================================================
# PERFORMANCE REQUIREMENTS
# =============================================================================

performance_requirements:
  clean_exit_duration:
    target: "<100ms P95"
    actual: "~65ms"
    breakdown:
      shutdown_json_rpc: "5ms"
      server_cleanup: "50ms"
      process_exit: "10ms"

  sigterm_exit_duration:
    target: "<5.1s"
    actual: "~5.015s"
    breakdown:
      shutdown_timeout: "2.0s"
      wait_timeout: "5.0s"
      sigterm_signal: "5ms"
      process_exit: "10ms"

  sigkill_exit_duration:
    target: "<10.1s"
    actual: "~10.015s"
    breakdown:
      shutdown_timeout: "2.0s"
      wait_timeout_1: "5.0s"
      sigterm_signal: "5ms"
      wait_timeout_2: "5.0s"
      sigkill_signal: "5ms"
      process_exit: "5ms"

# =============================================================================
# OBSERVABILITY
# =============================================================================

metrics:
  mcp_graceful_shutdowns_total:
    type: "counter"
    labels: ["tool_name", "success"]  # success: true | false
    description: "Total graceful shutdown attempts"

  mcp_shutdown_duration_ms:
    type: "histogram"
    buckets: [10, 50, 100, 500, 1000, 5000, 10000]
    labels: ["tool_name", "final_stage"]  # final_stage: shutdown | sigterm | sigkill
    description: "Shutdown duration"

  mcp_sigterm_exits_total:
    type: "counter"
    labels: ["tool_name"]
    description: "Total exits requiring SIGTERM"

  mcp_sigkill_exits_total:
    type: "counter"
    labels: ["tool_name"]
    description: "Total exits requiring SIGKILL (force kill)"

logging:
  shutdown_initiated:
    level: "INFO"
    message: "MCP graceful shutdown initiated"
    fields: ["pid", "tool_name", "uptime_seconds"]

  shutdown_clean_exit:
    level: "INFO"
    message: "MCP server exited gracefully"
    fields: ["pid", "tool_name", "exit_code", "duration_ms"]

  shutdown_sigterm_required:
    level: "WARNING"
    message: "MCP server unresponsive, sending SIGTERM"
    fields: ["pid", "tool_name", "waited_seconds"]

  shutdown_sigkill_required:
    level: "ERROR"
    message: "MCP server deadlocked, sending SIGKILL"
    fields: ["pid", "tool_name", "waited_seconds"]

# =============================================================================
# TESTING REQUIREMENTS
# =============================================================================

test_coverage:
  unit_tests:
    - test_name: "test_graceful_shutdown_clean_exit"
      description: "Server responds to shutdown, exits cleanly"
      assertion: "exit_code == 0, signal == null, duration < 100ms"

    - test_name: "test_graceful_shutdown_sigterm_required"
      description: "Server unresponsive, SIGTERM required"
      assertion: "exit_code == 0, signal == SIGTERM, duration ~5s"

    - test_name: "test_graceful_shutdown_sigkill_required"
      description: "Server deadlocked, SIGKILL required"
      assertion: "exit_code == -9, signal == SIGKILL, duration ~10s"

    - test_name: "test_graceful_shutdown_no_zombie"
      description: "Verify no zombie processes after shutdown"
      assertion: "process not in ps output (defunct)"

# =============================================================================
# REFERENCES
# =============================================================================

references:
  standards:
    - name: "Unix Signals — POSIX 1990"
      url: "https://en.wikipedia.org/wiki/Signal_(IPC)"
      description: "SIGTERM (15) catchable, SIGKILL (9) uncatchable"

    - name: "Graceful Shutdown Pattern — Martin Fowler"
      url: "https://martinfowler.com/articles/patterns-of-distributed-systems/graceful-shutdown.html"
      description: "Shutdown hooks, resource cleanup"

  design_patterns:
    - name: "Escalation Pattern"
      description: "Try graceful methods first, escalate to forceful methods"
      reference: "Patterns of Distributed Systems (Verma 2023)"

  related_contracts:
    - "lifecycle_fsm_5_states.yml"
    - "process_spawner.yml"
    - "resource_cleanup.yml"

