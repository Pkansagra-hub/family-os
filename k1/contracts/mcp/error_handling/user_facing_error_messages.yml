# Contract: User-Facing Error Messages
# Source: ADR-0034d (MCP Error Handling & Recovery Strategies)
# Purpose: Generate friendly, actionable error messages for users (no technical jargon)
# Version: 1.0.0
# Last Updated: 2025-10-21

contract:
  name: "user_facing_error_messages"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  owner: "K1 Tool Runner"
  source_adr: "ADR-0034d"
  adr_lines: "4251-4500 (user-facing messages), 4501-4750 (message templates)"

overview:
  purpose: |
    Generate friendly, actionable error messages for users:
    - No technical jargon (no error codes, stack traces, internal names)
    - Actionable suggestions (try again later, manual steps)
    - Empathetic tone (acknowledge frustration)

    Bad: "Error: NETWORK_TIMEOUT (code: 408, trace: abc123)"
    Good: "I couldn't reach the service right now. Let me try again..."

error_messages:
  NETWORK_TIMEOUT: "I couldn't reach the service right now. Let me try again..."
  SERVICE_UNAVAILABLE: "The service is temporarily unavailable. I'll try an alternative..."
  RATE_LIMIT_EXCEEDED: "I've made too many requests. Let me wait a moment and try again..."
  INVALID_PARAMS: "I need to adjust my request. Let me try again with corrected parameters..."
  NOT_FOUND: "I couldn't find what you're looking for."
  CIRCUIT_BREAKER_OPEN: "This service is having issues. Let me try an alternative approach..."
  TOOL_CRASH: "This tool is currently unavailable. Let me try an alternative approach..."

user_facing_message_method:
  implementation: |
    def user_facing_message(self) -> str:
        if self.error_code == ErrorCode.NETWORK_TIMEOUT:
            return "I couldn't reach the service right now. Let me try again..."
        elif self.error_code == ErrorCode.SERVICE_UNAVAILABLE:
            return "The service is temporarily unavailable. I'll try an alternative..."
        elif self.error_code == ErrorCode.RATE_LIMIT_EXCEEDED:
            return "I've made too many requests. Let me wait a moment and try again..."
        elif self.error_code == ErrorCode.INVALID_PARAMS:
            return "I need to adjust my request. Let me try again with corrected parameters..."
        elif self.error_code == ErrorCode.NOT_FOUND:
            return "I couldn't find what you're looking for."
        elif self.error_code == ErrorCode.CIRCUIT_BREAKER_OPEN:
            return "This service is having issues. Let me try an alternative approach..."
        elif self.error_code == ErrorCode.TOOL_CRASH:
            return "This tool is currently unavailable. Let me try an alternative approach..."
        else:
            return f"I encountered an error: {self.message}"

references:
  adr:
    - id: "ADR-0034d"
      title: "MCP Error Handling & Recovery Strategies"
      lines: "4251-4500 (user-facing messages)"

  related_contracts:
    - error_classification_3_categories.yml: "ToolError.user_facing_message() method"
    - fallback_tier4_graceful_degradation.yml: "Uses user_facing_message() in Tier 4"
