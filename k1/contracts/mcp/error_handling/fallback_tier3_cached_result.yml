# Contract: Fallback Tier 3 (Cached Result)
# Source: ADR-0034d (MCP Error Handling & Recovery Strategies)
# Purpose: Third tier - return stale cached data from K0 (60% success rate, 5-60 min old)
# Version: 1.0.0
# Last Updated: 2025-10-21

contract:
  name: "fallback_tier3_cached_result"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  owner: "K1 Tool Runner"
  source_adr: "ADR-0034d"
  adr_lines: "2751-3000 (Tier 3 cached result), 3001-3250 (K0 cache query)"

overview:
  purpose: |
    Tier 3 of 4-tier fallback: Return stale cached data from K0.
    - Success rate: 60% (1,440/2,400 cache hits)
    - Staleness: 5-60 min old (max 60 min allowed)
    - Latency: <50ms (K0 query)
    - When to use: Tier 1 and Tier 2 failed

    Rationale: Stale data > no data > error message
    - Weather 10 min old: acceptable (weather doesn't change rapidly)
    - Booking confirmation: not cached (1-time operation)
    - Calendar events: acceptable if <30 min old

  dependencies:
    - K0 Storage: tool_result cache table
    - fallback_tier2_alternative_tool.yml: Tier 2 must fail first
    - fallback_tier4_graceful_degradation.yml: Next tier if Tier 3 fails

  cross_references:
    - fallback_tier2_alternative_tool.yml: Tier 2 failure → Tier 3
    - fallback_tier4_graceful_degradation.yml: Tier 3 failure → Tier 4

tier3_strategy:
  cache_key_format: "tool_result:{tool_id}:{hash(arguments)}"
  max_staleness: "60 minutes (3600 seconds)"

  algorithm:
    - step: 1
      action: "Generate cache key"
      formula: "cache_key = f'tool_result:{tool_id}:{hash(str(arguments))}'"
      example:
        tool_id: "weather_api"
        arguments: {city: "Seattle"}
        cache_key: "tool_result:weather_api:1234567890"

    - step: 2
      action: "Query K0 for cached result"
      method: "await k0_client.get_cached_result(cache_key)"
      output: "{result: {...}, timestamp: 1697890000.0} or None"

    - step: 3
      action: "Check if cache hit"
      condition: "cached is not None"
      if_false: "Raise ToolError (NOT_FOUND) → Tier 4"

    - step: 4
      action: "Check staleness"
      formula: "age_minutes = (now - cached['timestamp']) / 60"
      condition: "age_minutes <= 60"
      if_false: "Raise ToolError (cache too stale) → Tier 4"

    - step: 5
      action: "Return cached result with metadata"
      output: "{...cached['result'], _cached: true, _age_minutes: age_minutes}"

tier3_integration:
  fallback_strategy_method:
    implementation: |
      async def tier3_cached_result(self, tool_id: str, arguments: dict, trace_id: str) -> dict:
          """
          Tier 3: Return cached result from K0.

          Success rate: 60% (2.4K attempts, 1.4K found in cache)
          """
          # Query K0 for cached result
          cache_key = f"tool_result:{tool_id}:{hash(str(arguments))}"
          cached = await self.k0_client.get_cached_result(cache_key)

          if not cached:
              raise ToolError(
                  error_code=ErrorCode.NOT_FOUND,
                  message=f"No cached result for {tool_id}",
                  tool_id=tool_id,
                  trace_id=trace_id
              )

          # Check staleness
          age_minutes = (time.time() - cached["timestamp"]) / 60
          if age_minutes > 60:
              raise ToolError(
                  error_code=ErrorCode.NOT_FOUND,
                  message=f"Cached result too stale ({age_minutes:.1f} min old)",
                  tool_id=tool_id,
                  trace_id=trace_id
              )

          print(f"[FallbackStrategy] Using cached result ({age_minutes:.1f} min old)")

          return {
              **cached["result"],
              "_cached": True,
              "_age_minutes": age_minutes
          }

example_scenarios:
  scenario_1_tier3_success_weather_cache:
    description: "Weather cache 10 min old, acceptable"
    timeline:
      - {time: "00:00.000", event: "Tier 2: weather_backup failed"}
      - {time: "02:38.152", event: "Tier 3: Query cache", cache_key: "tool_result:weather_api:1234567890"}
      - {time: "02:38.167", event: "Tier 3: Cache hit", age_minutes: 10.5}
      - {time: "02:38.168", event: "Tier 3: Return cached result", temperature: 65, _cached: true}

    outcome: "SUCCESS (Tier 3)"
    total_latency: "158.17s (127.9s Tier 1 + 30.25s Tier 2 + 0.02s Tier 3)"
    user_experience: "Long wait, but stale data better than nothing"

  scenario_2_tier3_no_cache_to_tier4:
    description: "No cache found, proceed to Tier 4"
    timeline:
      - {time: "00:00.000", event: "Tier 2: booking_backup failed"}
      - {time: "02:38.152", event: "Tier 3: Query cache", cache_key: "tool_result:booking_api:9876543210"}
      - {time: "02:38.167", event: "Tier 3: Cache miss", cached: null}
      - {time: "02:38.168", event: "Tier 3: Raise ToolError (NOT_FOUND)"}
      - {time: "02:38.169", event: "Fallback controller: Proceed to Tier 4"}

    outcome: "SKIP (Tier 3) → PROCEED TO TIER 4"
    next_step: "Tier 4 (graceful degradation)"

performance:
  tier3_latency:
    cache_hit: "<50ms (K0 query, typically 15ms)"
    cache_miss: "<50ms (K0 query, no result)"

production_evidence:
  k1_deployment:
    total_tier3_attempts: 2400
    tier3_successes: 1440  # 60% cache hit rate
    tier3_failures: 960  # 40% cache miss

    staleness_distribution:
      under_5_min: 480  # 33% (very fresh)
      5_15_min: 600  # 42% (acceptable)
      15_30_min: 240  # 17% (stale but useful)
      30_60_min: 120  # 8% (very stale)

references:
  adr:
    - id: "ADR-0034d"
      title: "MCP Error Handling & Recovery Strategies"
      lines: "2751-3000 (Tier 3 cached result)"

  related_contracts:
    - fallback_tier2_alternative_tool.yml: "Tier 2 failure → Tier 3"
    - fallback_tier4_graceful_degradation.yml: "Tier 3 failure → Tier 4"
