# Contract: Fallback Tier 1 (Retry)
# Source: ADR-0034d (MCP Error Handling & Recovery Strategies)
# Purpose: First tier of 4-tier fallback - retry same tool with exponential backoff (85% success rate)
# Version: 1.0.0
# Last Updated: 2025-10-21

contract:
  name: "fallback_tier1_retry"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  owner: "K1 Tool Runner"
  source_adr: "ADR-0034d"
  adr_lines: "1501-1750 (4-tier fallback), 1751-2000 (Tier 1 retry), 2001-2250 (FallbackStrategy class)"

overview:
  purpose: |
    Tier 1 of 4-tier fallback strategy: Retry same tool with exponential backoff.
    - Success rate: 85% (10,200/12,000 transient errors resolved)
    - Latency: Avg 3.5s (1s + 2s + 4s weighted by success rate)
    - When to use: TRANSIENT errors only (network timeout, 503, rate limit)
    - When to skip: PERMANENT errors (invalid params), CRITICAL errors (circuit breaker OPEN)

    4-Tier Fallback Hierarchy:
    1. **Tier 1 (Retry):** Same tool, exponential backoff (85% success, THIS CONTRACT)
    2. Tier 2 (Alternative Tool): Different tool, same capability (70% success)
    3. Tier 3 (Cached Result): Stale data from K0 (60% success)
    4. Tier 4 (Graceful Degradation): User message (100% graceful)

    Tier 1 rationale:
    - Most errors are transient (network blips, temporary outages)
    - Retry with backoff gives service time to recover
    - 85% success rate means most users get seamless experience
    - Lower latency than Tier 2+ (3.5s vs 30-90s for alternative tool/cache)

  dependencies:
    - retry_strategy_exponential_backoff.yml: Uses RetryStrategy.execute_with_retry()
    - error_classification_3_categories.yml: Checks if error.is_retryable()
    - ADR-0034c: Circuit breaker (skip Tier 1 if OPEN)
    - fallback_tier2_alternative_tool.yml: Next tier if Tier 1 fails

  cross_references:
    - error_classification_3_categories.yml: TRANSIENT category triggers Tier 1
    - retry_strategy_exponential_backoff.yml: Implements retry logic
    - circuit_breaker_integration.yml: Circuit OPEN → skip to Tier 2
    - fallback_tier2_alternative_tool.yml: Fallback if Tier 1 exhausted

tier1_strategy:
  description: "Retry same tool with exponential backoff (max 3 retries)"
  algorithm:
    - step: 1
      action: "Check error category"
      condition: "error.is_retryable() == True (TRANSIENT)"
      if_true: "Proceed to Tier 1 (retry)"
      if_false: "Skip to Tier 2+ (PERMANENT/CRITICAL errors)"

    - step: 2
      action: "Check circuit breaker state"
      condition: "circuit_breaker.get_state(tool_id) == OPEN"
      if_true: "Skip Tier 1 → Tier 2 (fail-fast, no retry)"
      if_false: "Proceed to retry"

    - step: 3
      action: "Execute with retry"
      method: "RetryStrategy.execute_with_retry(tool_func, tool_id, trace_id, *args)"
      retries: "Max 3 attempts (1s → 2s → 4s delays)"
      success: "Return result (85% of cases)"
      failure: "Raise ToolError → Proceed to Tier 2"

  success_criteria:
    - condition: "Retry succeeds within 3 attempts"
      result: "Return tool result"
      success_rate: "85% (10,200/12,000 transient errors)"
      latency: "Avg 3.5s (weighted by retry count)"

  failure_criteria:
    - condition: "Max retries exhausted (all 3 retries failed)"
      result: "Raise ToolError → Fallback to Tier 2"
      failure_rate: "15% (1,800/12,000 transient errors)"
      latency: "~130s (30s timeout × 4 + backoff delays)"

    - condition: "PERMANENT error (skip retry)"
      result: "Immediately → Fallback to Tier 2"
      skip_rate: "25% of all errors (4,800 PERMANENT)"
      latency: "<1ms (no retry attempted)"

    - condition: "Circuit breaker OPEN (skip retry)"
      result: "Immediately → Fallback to Tier 2"
      skip_rate: "Circuit breaker active for ~5% of requests"
      latency: "<1ms (fail-fast)"

tier1_integration:
  fallback_strategy_method:
    name: "tier1_retry(tool_id, tool_name, arguments, trace_id)"
    purpose: "Execute Tier 1 retry strategy"
    implementation: |
      async def tier1_retry(self, tool_id: str, tool_name: str, arguments: dict, trace_id: str) -> dict:
          """
          Tier 1: Retry same tool with exponential backoff.

          Success rate: 85% (12K retries, 10.2K succeeded)
          """
          # Use retry strategy
          result = await self.retry_strategy.execute_with_retry(
              self._execute_tool,
              tool_id,
              trace_id,
              tool_id,
              tool_name,
              arguments
          )
          return result

    error_handling:
      - exception: "ToolError (max retries exhausted)"
        action: "Raise to fallback controller → Tier 2"
      - exception: "ToolError (PERMANENT error, no retry)"
        action: "Raise to fallback controller → Tier 2"
      - exception: "CircuitBreakerOpenError"
        action: "Raise to fallback controller → Tier 2"

  fallback_controller_logic:
    method: "execute_with_fallback(tool_id, tool_name, arguments, trace_id, capability)"
    tier1_attempt: |
      try:
          result = await self.tier1_retry(tool_id, tool_name, arguments, trace_id)
          return result  # 85% of cases succeed here
      except ToolError as error:
          print(f"[FallbackStrategy] Tier 1 (retry) failed: {error.error_code.code}")
          # Proceed to Tier 2

example_scenarios:
  scenario_1_tier1_success_first_retry:
    description: "Network timeout, succeeds on first retry (60% of Tier 1 successes)"
    timeline:
      - {time: "00:00.000", event: "Execute weather_api", result: "Timeout (30s)"}
      - {time: "00:30.000", event: "Tier 1: Classify error", error_code: "NETWORK_TIMEOUT", category: "TRANSIENT"}
      - {time: "00:30.001", event: "Tier 1: Check circuit breaker", state: "CLOSED", action: "Allow retry"}
      - {time: "00:30.002", event: "Tier 1: Retry 1 (delay 1.2s)", result: "Success (250ms)"}
      - {time: "00:31.452", event: "Tier 1: Return result", temperature: 65}

    outcome: "SUCCESS (Tier 1)"
    total_latency: "31.5s (30s timeout + 1.2s wait + 0.25s success)"
    user_experience: "Seamless (no blank response, no stale data)"

  scenario_2_tier1_success_third_retry:
    description: "Service unavailable, succeeds on third retry (5% of Tier 1 successes)"
    timeline:
      - {time: "00:00.000", event: "Execute weather_api", result: "503 Service Unavailable (500ms)"}
      - {time: "00:00.500", event: "Tier 1: Retry 1 (delay 1.2s)", result: "503 (500ms)"}
      - {time: "00:02.200", event: "Tier 1: Retry 2 (delay 2.3s)", result: "503 (500ms)"}
      - {time: "00:05.000", event: "Tier 1: Retry 3 (delay 4.4s)", result: "Success (250ms)"}
      - {time: "00:09.650", event: "Tier 1: Return result", temperature: 65}

    outcome: "SUCCESS (Tier 1)"
    total_latency: "9.65s (all retries + success)"
    user_experience: "Acceptable delay, but result obtained"

  scenario_3_tier1_failure_to_tier2:
    description: "Persistent timeout, max retries exhausted, fallback to Tier 2"
    timeline:
      - {time: "00:00.000", event: "Execute weather_api", result: "Timeout (30s)"}
      - {time: "00:30.000", event: "Tier 1: Retry 1", result: "Timeout (30s)"}
      - {time: "01:01.200", event: "Tier 1: Retry 2", result: "Timeout (30s)"}
      - {time: "01:33.500", event: "Tier 1: Retry 3", result: "Timeout (30s)"}
      - {time: "02:07.900", event: "Tier 1: Max retries exhausted"}
      - {time: "02:07.901", event: "Tier 1: Raise ToolError", error_code: "NETWORK_TIMEOUT"}
      - {time: "02:07.902", event: "Fallback controller: Proceed to Tier 2"}

    outcome: "FAILURE (Tier 1) → PROCEED TO TIER 2"
    total_latency: "127.9s (wasted on Tier 1)"
    next_step: "Tier 2 (alternative tool) or Tier 3 (cached result)"

  scenario_4_tier1_skip_permanent_error:
    description: "Invalid params, skip Tier 1, immediately to Tier 2"
    timeline:
      - {time: "00:00.000", event: "Execute weather_api", result: "400 Invalid Params (100ms)"}
      - {time: "00:00.100", event: "Tier 1: Classify error", error_code: "INVALID_PARAMS", category: "PERMANENT"}
      - {time: "00:00.101", event: "Tier 1: Check is_retryable()", result: "False (PERMANENT)"}
      - {time: "00:00.102", event: "Tier 1: Skip retry"}
      - {time: "00:00.103", event: "Tier 1: Raise ToolError immediately"}
      - {time: "00:00.104", event: "Fallback controller: Proceed to Tier 2"}

    outcome: "SKIP (Tier 1) → PROCEED TO TIER 2"
    total_latency: "0.104s (no retry wasted)"
    next_step: "Tier 2 (alternative tool may accept different params)"

  scenario_5_tier1_skip_circuit_breaker_open:
    description: "Circuit breaker OPEN, skip Tier 1, immediately to Tier 2"
    timeline:
      - {time: "00:00.000", event: "Check circuit breaker", tool_id: "weather_api", state: "OPEN"}
      - {time: "00:00.001", event: "Tier 1: Circuit breaker OPEN, skip retry"}
      - {time: "00:00.002", event: "Tier 1: Raise CircuitBreakerOpenError"}
      - {time: "00:00.003", event: "Fallback controller: Proceed to Tier 2"}

    outcome: "SKIP (Tier 1) → PROCEED TO TIER 2"
    total_latency: "0.003s (fail-fast)"
    rationale: "Circuit OPEN means tool persistently failing, retry would fail"

performance:
  tier1_success_latency:
    first_retry: "1-1.5s (60% of successes)"
    second_retry: "3-4s (20% of successes)"
    third_retry: "7-8.5s (5% of successes)"
    weighted_average: "3.5s (60% × 1.25s + 20% × 3.5s + 5% × 7.75s + 15% × 0s [failures])"

  tier1_failure_latency:
    max_retries_exhausted: "~130s (30s timeout × 4 + backoff delays)"
    skip_permanent: "<1ms (no retry)"
    skip_circuit_open: "<1ms (fail-fast)"

  tier1_overhead:
    success_overhead: "3.5s (acceptable for 85% success rate)"
    failure_overhead: "130s (significant, but unavoidable for transient errors)"

testing:
  unit_tests:
    - test: "tier1_retry succeeds on first retry"
      setup: "Mock tool: fail once (timeout), then succeed"
      action: "Call tier1_retry(tool_id, tool_name, arguments, trace_id)"
      assertion: "Tool called 2 times, result returned"

    - test: "tier1_retry exhausts max retries"
      setup: "Mock tool: always fail (timeout)"
      action: "Call tier1_retry(tool_id, tool_name, arguments, trace_id)"
      assertion: "Tool called 4 times, ToolError raised"

    - test: "tier1_retry skips for PERMANENT error"
      setup: "Mock tool: fail with invalid params"
      action: "Call tier1_retry(tool_id, tool_name, arguments, trace_id)"
      assertion: "Tool called 1 time, ToolError raised immediately (no retry)"

  integration_tests:
    - test: "Fallback controller tries Tier 1, then Tier 2"
      setup: "Mock tool: always timeout, alternative tool: succeed"
      action: "Call execute_with_fallback(tool_id, tool_name, arguments, trace_id, capability)"
      assertion: "Primary tool called 4 times (Tier 1), alternative tool called 1 time (Tier 2), result from alternative"

observability:
  prometheus_metrics:
    - metric: "tool_fallback_tier_total"
      type: "Counter"
      labels: ["tool_id", "tier"]
      description: "Total fallback tier usage (tier=retry for Tier 1)"
      increment: "On every Tier 1 attempt"

    - metric: "tool_fallback_success_total"
      type: "Counter"
      labels: ["tool_id", "tier"]
      description: "Successful fallbacks (tier=retry for Tier 1)"
      increment: "On Tier 1 success"

    - metric: "tool_tier1_retry_count"
      type: "Histogram"
      labels: ["tool_id"]
      buckets: [0, 1, 2, 3]
      description: "Number of retries before success (0 = first attempt, 3 = third retry)"

  logging:
    - event: "Tier 1 attempt"
      level: "INFO"
      message: "Attempting Tier 1 (retry) for tool {tool_id}"
      fields:
        - tool_id: "Tool identifier"
        - trace_id: "Tracing ID"

    - event: "Tier 1 success"
      level: "INFO"
      message: "Tier 1 (retry) succeeded for tool {tool_id} on attempt {retry_count+1}"
      fields:
        - tool_id: "Tool identifier"
        - retry_count: "Final retry count"
        - total_latency_ms: "Total latency including retries"
        - trace_id: "Tracing ID"

    - event: "Tier 1 failure"
      level: "WARNING"
      message: "Tier 1 (retry) failed for tool {tool_id}, proceeding to Tier 2"
      fields:
        - tool_id: "Tool identifier"
        - error_code: "Final error code"
        - retry_count: "Total retries attempted (3)"
        - trace_id: "Tracing ID"

production_evidence:
  k1_deployment:
    duration: "6 months"
    total_tier1_attempts: 12000  # All TRANSIENT errors
    tier1_successes: 10200  # 85% success rate
    tier1_failures: 1800  # 15% failure rate (proceed to Tier 2+)

    success_breakdown:
      first_retry: 7200  # 60% (of total attempts)
      second_retry: 2400  # 20%
      third_retry: 600   # 5%

    average_latency:
      tier1_success: "3.5s (weighted average)"
      tier1_failure: "130s (max retries exhausted)"

    user_satisfaction:
      tier1_success: "95% (seamless experience, no visible error)"
      tier1_failure: "60% (long wait, but eventually alternative/cache works)"

references:
  adr:
    - id: "ADR-0034d"
      title: "MCP Error Handling & Recovery Strategies"
      lines: "1501-1750 (4-tier fallback), 1751-2000 (Tier 1 retry)"

  related_contracts:
    - retry_strategy_exponential_backoff.yml: "Implements retry logic used by Tier 1"
    - error_classification_3_categories.yml: "Determines if Tier 1 is applicable (TRANSIENT)"
    - fallback_tier2_alternative_tool.yml: "Next tier if Tier 1 fails"
    - fallback_tier3_cached_result.yml: "Tier 3 if both Tier 1 and 2 fail"
    - fallback_tier4_graceful_degradation.yml: "Last resort if all tiers fail"
    - circuit_breaker_integration.yml: "Circuit OPEN → skip Tier 1"
