      max_retries_exhausted: 1800  # 15% (all retries failed)

    overall_success_rate: "85% (10,200/12,000 transient errors resolved by retry)"
    average_retry_latency: "3.5s (weighted by success rate)"
    latency_overhead_acceptable: "Yes (3.5s overhead vs permanent failure)"

