# Contract: Circuit Breaker Integration (Error Handling)
# Source: ADR-0034d (MCP Error Handling & Recovery Strategies)
# Purpose: Integrate circuit breaker with error handling (skip retry when OPEN, allow 1 retry when HALF_OPEN)
# Version: 1.0.0
# Last Updated: 2025-10-21

contract:
  name: "circuit_breaker_integration"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  owner: "K1 Tool Runner"
  source_adr: "ADR-0034d"
  adr_lines: "3751-4000 (circuit breaker integration), 4001-4250 (state-aware error handling)"

overview:
  purpose: |
    Integrate circuit breaker with error handling to prevent wasted retries:
    - Circuit OPEN → Skip Tier 1 (retry), go directly to Tier 2+ (fail-fast)
    - Circuit HALF_OPEN → Allow 1 retry (probe request to test recovery)
    - Circuit CLOSED → Normal retry logic (Tier 1, max 3 retries)

    Rationale:
    - OPEN means tool persistently failing → retry would waste time
    - HALF_OPEN means testing recovery → 1 retry allowed (probe)
    - CLOSED means normal operation → full retry logic

circuit_breaker_states:
  closed_state:
    description: "Normal operation, requests allowed"
    error_handling: "Full retry logic (Tier 1, max 3 retries)"
    fallback: "Tier 1 → Tier 2 → Tier 3 → Tier 4"

  open_state:
    description: "Too many failures, reject immediately"
    error_handling: "Skip Tier 1 (retry), go directly to Tier 2+ (alternative tool/cache/graceful)"
    fallback: "Tier 2 → Tier 3 → Tier 4 (skip Tier 1)"
    rationale: "Retry would fail, waste time (tool persistently down)"

  half_open_state:
    description: "Testing recovery, allow probe"
    error_handling: "Allow 1 retry (probe request), no exponential backoff"
    fallback: "1 retry → Tier 2 → Tier 3 → Tier 4 (limited Tier 1)"
    rationale: "Test if tool recovered, but don't waste time on multiple retries"

integration_logic:
  retry_strategy_should_retry:
    modification: |
      def should_retry(self, error: ToolError) -> bool:
          if not error.is_retryable():
              return False
          if error.retry_count >= self.max_retries:
              return False

          # NEW: Check circuit breaker state
          if error.error_code == ErrorCode.CIRCUIT_BREAKER_OPEN:
              return False  # Skip retry

          # NEW: HALF_OPEN state → limit to 1 retry (probe)
          if circuit_breaker.get_state(tool_id) == CircuitBreakerState.HALF_OPEN:
              if error.retry_count >= 1:
                  return False  # Only 1 retry allowed in HALF_OPEN

          return True

references:
  adr:
    - id: "ADR-0034d"
      title: "MCP Error Handling & Recovery Strategies"
      lines: "3751-4000 (circuit breaker integration)"
    - id: "ADR-0034c"
      title: "Circuit Breaker Integration"
      relevance: "CircuitBreakerState enum, get_state() method"

  related_contracts:
    - retry_strategy_exponential_backoff.yml: "Modified should_retry() logic"
    - ../circuit_breaker/circuit_breaker_fsm_3_states.yml: "CircuitBreakerState enum"
