# Contract: Fallback Tier 4 (Graceful Degradation)
# Source: ADR-0034d (MCP Error Handling & Recovery Strategies)
# Purpose: Fourth tier - user-facing error message, suggest alternatives (100% graceful)
# Version: 1.0.0
# Last Updated: 2025-10-21

contract:
  name: "fallback_tier4_graceful_degradation"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  owner: "K1 Tool Runner"
  source_adr: "ADR-0034d"
  adr_lines: "3251-3500 (Tier 4 graceful degradation), 3501-3750 (user-facing messages)"

overview:
  purpose: |
    Tier 4 of 4-tier fallback: Graceful degradation with user-facing error message.
    - Success rate: 100% (always graceful, never blank response)
    - Latency: <1ms (message generation)
    - When to use: All other tiers failed (last resort)

    Rationale: User message > blank response > system crash
    - Friendly, actionable message (no technical jargon)
    - Suggest alternatives (try again later, manual action)
    - Continue conversation (don't block user)

tier4_strategy:
  algorithm:
    - step: 1
      action: "Generate user-facing message"
      method: "error.user_facing_message()"
      input: "ToolError (from Tier 1/2/3)"

    - step: 2
      action: "Return graceful result"
      output: |
        {
          "_error": True,
          "_error_code": error.error_code.code,
          "_message": user_facing_message,
          "_tool_id": tool_id,
          "_trace_id": trace_id,
          "_retry_count": error.retry_count
        }

tier4_integration:
  fallback_strategy_method:
    implementation: |
      def tier4_graceful_degradation(self, error: ToolError, tool_id: str, trace_id: str) -> dict:
          """
          Tier 4: Graceful degradation (user notification).

          100% graceful (always returns user-facing message)
          """
          print(f"[FallbackStrategy] Graceful degradation: {error.error_code.code}")

          return {
              "_error": True,
              "_error_code": error.error_code.code,
              "_message": error.user_facing_message(),
              "_tool_id": tool_id,
              "_trace_id": trace_id,
              "_retry_count": error.retry_count
          }

example_scenarios:
  scenario_1_tier4_weather_unavailable:
    description: "All tiers failed, graceful message"
    timeline:
      - {time: "00:00.000", event: "Tier 3: Cache miss"}
      - {time: "02:38.169", event: "Tier 4: Generate message", error_code: "NETWORK_TIMEOUT"}
      - {time: "02:38.170", event: "Tier 4: Return graceful result", _error: true, _message: "I couldn't reach the service right now. Let me try again later."}

    outcome: "GRACEFUL (Tier 4)"
    total_latency: "158.17s"
    user_experience: "Friendly error message, conversation continues"

references:
  adr:
    - id: "ADR-0034d"
      title: "MCP Error Handling & Recovery Strategies"
      lines: "3251-3500 (Tier 4 graceful degradation)"
