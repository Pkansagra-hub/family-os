# Timeout Cooldown Configuration Contract
# Issue: 2.8.3 - Circuit Breaker Integration
# Source: ADR-0034c (MCP Circuit Breaker Integration), lines 651-800

contract:
  name: "timeout_cooldown_config"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  source_adr: "ADR-0034c"
  parent_issue: "2.8.3"

overview:
  purpose: "Define configurable per-tool cooldown periods for circuit breaker OPEN → HALF_OPEN transitions"
  scope: "Timeout duration, per-tool customization, recovery testing strategy"
  context: "Different tools have different recovery characteristics requiring customized cooldown periods (weather_api: 30s, video_transcoder: 90s)"

cooldown_concept:
  definition: "Duration to wait in OPEN state before transitioning to HALF_OPEN for recovery testing"
  unit: "seconds"
  range: "10-300 seconds (typical)"
  default: "30 seconds"
  purpose: "Allow tool time to recover before testing with probe request"

timeout_behavior:
  OPEN_state:
    - "Circuit opens due to failure threshold"
    - "Record circuit_open_time (timestamp)"
    - "Reject all requests immediately"
    - "Wait timeout_seconds before testing recovery"

  transition_to_HALF_OPEN:
    trigger: "(now - circuit_open_time) ≥ timeout_seconds"
    action: "Transition from OPEN to HALF_OPEN"
    result: "Allow probe request to test recovery"

  probe_outcomes:
    success: "HALF_OPEN → CLOSED (tool recovered)"
    failure: "HALF_OPEN → OPEN (reset circuit_open_time, restart cooldown)"

per_tool_timeouts:
  weather_api:
    tool_id: "weather_api"
    timeout_seconds: 30
    rationale:
      - "Public API (OpenWeatherMap, Weather.gov)"
      - "Transient failures recover quickly (network blips)"
      - "Fast recovery expected (30s sufficient)"
      - "Don't wait too long (user experience)"
    recovery_scenarios:
      - "Network timeout resolved in ~10s"
      - "Rate limit cooldown in ~20s"
      - "Service maintenance in ~60s"
    probe_strategy: "Single probe after 30s"

  calendar_sync:
    tool_id: "calendar_sync"
    timeout_seconds: 20
    rationale:
      - "Internal API (Google Calendar, Outlook)"
      - "Should recover quickly if healthy"
      - "Shorter timeout (20s) for faster retry"
      - "OAuth token refresh fast"
    recovery_scenarios:
      - "OAuth token refresh in ~5s"
      - "API quota reset at minute boundary"
      - "Transient service blip in ~10s"
    probe_strategy: "Single probe after 20s"

  booking_api:
    tool_id: "booking_api"
    timeout_seconds: 60
    rationale:
      - "External API (OpenTable, Resy)"
      - "Rate limits strict (may take 60s to reset)"
      - "Longer timeout to respect rate limits"
      - "Avoid wasting probe requests"
    recovery_scenarios:
      - "Rate limit cooldown in 60s"
      - "Server load stabilizes in 90s"
      - "Cache invalidation in 30s"
    probe_strategy: "Single probe after 60s"

  model_hub:
    tool_id: "model_hub"
    timeout_seconds: 90
    rationale:
      - "LLM inference (OpenAI, Anthropic)"
      - "Model loading/warmup takes time (~60s)"
      - "Cold start penalty after OPEN"
      - "Longer timeout for warmup"
    recovery_scenarios:
      - "Model loading from disk in 30-60s"
      - "GPU allocation in 10-20s"
      - "Rate limit cooldown in 60s"
    probe_strategy: "2 probes (verify stability)"

  video_transcoder:
    tool_id: "video_transcoder"
    timeout_seconds: 120
    rationale:
      - "Resource-intensive operation"
      - "Needs resource cleanup after OOM"
      - "Long warmup time (GPU allocation)"
      - "Conservative timeout (120s)"
    recovery_scenarios:
      - "Memory cleanup after OOM in 60s"
      - "GPU allocation in 30s"
      - "Process restart in 90s"
    probe_strategy: "Single probe after 120s"

  email_send:
    tool_id: "email_send"
    timeout_seconds: 45
    rationale:
      - "External SMTP/SendGrid"
      - "Connection establishment takes time"
      - "Rate limit cooldown moderate"
    recovery_scenarios:
      - "SMTP connection timeout in 30s"
      - "Rate limit cooldown in 60s"
      - "DNS resolution in 10s"
    probe_strategy: "Single probe after 45s"

  web_search:
    tool_id: "web_search"
    timeout_seconds: 30
    rationale:
      - "Public API (Google, Bing)"
      - "Transient failures recover quickly"
      - "Default timeout sufficient"
    recovery_scenarios:
      - "Rate limit cooldown in 60s"
      - "Network timeout resolved in 10s"
    probe_strategy: "Single probe after 30s"

  default:
    timeout_seconds: 30
    rationale:
      - "Fallback for unconfigured tools"
      - "Balanced timeout (not too short, not too long)"
      - "30s standard practice (Netflix Hystrix default)"

timeout_selection_guidelines:
  short_timeout_10_30:
    duration: "10-30 seconds"
    use_when:
      - "Transient failures recover quickly"
      - "Internal APIs (reliable, fast recovery)"
      - "User experience critical (fast retry)"
    examples: ["calendar_sync: 20s", "weather_api: 30s"]
    risks:
      - "May probe before tool fully recovered"
      - "Probe failures reset cooldown (loop)"

  moderate_timeout_30_60:
    duration: "30-60 seconds"
    use_when:
      - "Standard external APIs"
      - "Moderate recovery time expected"
      - "Default for most tools"
    examples: ["booking_api: 60s", "email_send: 45s"]
    benefits:
      - "Balanced (recovery time + user experience)"
      - "Works for most scenarios"

  long_timeout_60_120:
    duration: "60-120 seconds"
    use_when:
      - "Resource-intensive operations"
      - "Warmup/loading time needed"
      - "Expensive probe failures"
    examples: ["model_hub: 90s", "video_transcoder: 120s"]
    benefits:
      - "Ensures tool fully recovered"
      - "Reduces probe failure rate"
    risks:
      - "User waits longer for recovery"
      - "May be too conservative"

half_open_attempts:
  concept: "Number of probe requests allowed in HALF_OPEN state"
  default: 1

  single_probe:
    half_open_attempts: 1
    use_when:
      - "Standard tools (fast recovery expected)"
      - "Probe success indicates full recovery"
      - "Most common pattern"
    examples: ["weather_api", "calendar_sync", "booking_api"]
    behavior:
      success: "HALF_OPEN → CLOSED (1 success confirms recovery)"
      failure: "HALF_OPEN → OPEN (1 failure restarts cooldown)"

  multiple_probes:
    half_open_attempts: 2
    use_when:
      - "Tool stability needs verification"
      - "Intermittent failures common"
      - "Expensive to reopen circuit"
    examples: ["model_hub: 2 probes"]
    behavior:
      success_1: "Allow 2nd probe"
      success_2: "HALF_OPEN → CLOSED (2 successes confirm stability)"
      failure: "HALF_OPEN → OPEN (any failure restarts cooldown)"

cooldown_reset_behavior:
  probe_success:
    event: "Probe request succeeds in HALF_OPEN"
    state_transition: "HALF_OPEN → CLOSED"
    cooldown_reset: "Not applicable (circuit closed)"
    failure_count: "Reset to 0"

  probe_failure:
    event: "Probe request fails in HALF_OPEN"
    state_transition: "HALF_OPEN → OPEN"
    cooldown_reset: "Reset circuit_open_time to now"
    cooldown_restart: "Wait another timeout_seconds before next HALF_OPEN"
    rationale: "Tool not fully recovered, wait longer"

  example_sequence:
    timeline:
      - {time: "10:00:00", event: "Circuit opens (5 failures)", state: "OPEN", cooldown_remaining: "30s"}
      - {time: "10:00:30", event: "Timeout elapsed", state: "HALF_OPEN"}
      - {time: "10:00:31", event: "Probe fails", state: "OPEN", cooldown_remaining: "30s"}
      - {time: "10:01:01", event: "Timeout elapsed again", state: "HALF_OPEN"}
      - {time: "10:01:02", event: "Probe succeeds", state: "CLOSED"}
    result: "Circuit took 62s to recover (30s + 1s probe + 30s + 1s probe)"

implementation_example:
  yaml_config: |
    # k1/config/circuit_breaker.yml
    circuit_breaker:
      weather_api:
        timeout_seconds: 30
        half_open_attempts: 1

      calendar_sync:
        timeout_seconds: 20
        half_open_attempts: 1

      booking_api:
        timeout_seconds: 60
        half_open_attempts: 1

      model_hub:
        timeout_seconds: 90
        half_open_attempts: 2

      video_transcoder:
        timeout_seconds: 120
        half_open_attempts: 1

      email_send:
        timeout_seconds: 45
        half_open_attempts: 1

      web_search:
        timeout_seconds: 30
        half_open_attempts: 1

      default:
        timeout_seconds: 30
        half_open_attempts: 1

  python_code: |
    @dataclass
    class CircuitBreakerConfig:
        tool_id: str
        timeout_seconds: int = 30
        half_open_attempts: int = 1

    @dataclass
    class CircuitBreakerState:
        config: CircuitBreakerConfig
        state: CircuitState
        circuit_open_time: float = 0
        half_open_attempts_made: int = 0

        def should_allow_request(self) -> bool:
            now = time.time()

            if self.state == CircuitState.OPEN:
                # Check if cooldown elapsed
                if now - self.circuit_open_time >= self.config.timeout_seconds:
                    # Transition to HALF_OPEN
                    self.state = CircuitState.HALF_OPEN
                    self.half_open_attempts_made = 0
                    return True  # Allow probe
                else:
                    return False  # Still cooling down

            elif self.state == CircuitState.HALF_OPEN:
                # Allow probe if under limit
                if self.half_open_attempts_made < self.config.half_open_attempts:
                    self.half_open_attempts_made += 1
                    return True
                else:
                    return False  # Already probed, wait for result

            return True  # CLOSED state

        def record_failure(self):
            if self.state == CircuitState.HALF_OPEN:
                # Probe failed, reset cooldown
                self.state = CircuitState.OPEN
                self.circuit_open_time = time.time()  # Reset timer
                print(f"[CircuitBreaker] {self.config.tool_id}: HALF_OPEN → OPEN (cooldown reset)")

timeout_tuning_guidance:
  increase_timeout:
    when:
      - "Probe failures common (tool not recovered)"
      - "Circuit reopens immediately after HALF_OPEN"
      - "Tool needs longer warmup time"
    action: "Increase by 10-30 seconds"
    example: "model_hub: 60s → 90s (model warmup needs more time)"

  decrease_timeout:
    when:
      - "Tool recovers quickly (probe always succeeds)"
      - "User experience suffers (waiting too long)"
      - "Transient failures short-lived"
    action: "Decrease by 5-15 seconds"
    example: "calendar_sync: 30s → 20s (OAuth refresh is fast)"

  add_probes:
    when:
      - "Single probe insufficient (intermittent failures)"
      - "Need to verify stability"
      - "Expensive to reopen circuit"
    action: "Increase half_open_attempts: 1 → 2"
    example: "model_hub: 1 → 2 probes (verify model stability)"

monitoring_recommendations:
  track_metrics:
    - "Cooldown duration per tool"
    - "Probe success rate (HALF_OPEN → CLOSED)"
    - "Probe failure rate (HALF_OPEN → OPEN)"
    - "Circuit open duration (time to recovery)"

  alert_conditions:
    - "Probe failure rate >50% (timeout too short)"
    - "Probe success rate 100% (timeout too long)"
    - "Circuit open duration >300s (excessive wait)"

  optimization_signals:
    high_probe_failure:
      metric: "probe_failure_rate > 50%"
      diagnosis: "Timeout too short, tool not recovered"
      action: "Increase timeout by 20-30s"

    high_probe_success:
      metric: "probe_success_rate = 100%"
      diagnosis: "Timeout too long, overconservative"
      action: "Decrease timeout by 10-15s"

    long_open_duration:
      metric: "open_duration_p95 > 120s"
      diagnosis: "Circuit open too long, user experience suffers"
      action: "Decrease timeout or increase probes"

performance_characteristics:
  timeout_check: "<0.01ms (timestamp subtraction + comparison)"
  cooldown_overhead: "0ms (passive waiting, no CPU)"
  memory_per_timeout: "~16 bytes (2 timestamps)"

testing_requirements:
  unit_tests:
    - "Load timeout config from YAML"
    - "Apply default timeout for unconfigured tool"
    - "OPEN → HALF_OPEN after timeout elapsed"
    - "HALF_OPEN → OPEN resets cooldown on probe failure"
    - "Multiple probes allowed when configured"

  integration_tests:
    - "weather_api transitions after 30s"
    - "video_transcoder transitions after 120s"
    - "model_hub allows 2 probes"
    - "Probe failure restarts cooldown"
    - "Config reload updates timeouts"

  performance_tests:
    - "Timeout check <0.01ms"
    - "No CPU overhead during cooldown"
    - "1000 tools with independent timeouts"

observability:
  metrics:
    circuit_breaker_timeout_seconds:
      type: "Gauge"
      labels: ["tool_id"]
      description: "Configured cooldown timeout per tool"
      query: "circuit_breaker_timeout_seconds{tool_id='weather_api'}"

    circuit_breaker_open_duration_seconds:
      type: "Histogram"
      labels: ["tool_id"]
      buckets: [10, 30, 60, 120, 300, 600]
      description: "Duration circuit was OPEN before recovery"
      query: "histogram_quantile(0.95, circuit_breaker_open_duration_seconds{tool_id='weather_api'})"

    circuit_breaker_probe_success_rate:
      type: "Gauge"
      labels: ["tool_id"]
      description: "Probe success rate (HALF_OPEN → CLOSED)"
      query: "circuit_breaker_probe_success_rate{tool_id='weather_api'}"

    circuit_breaker_probe_failure_total:
      type: "Counter"
      labels: ["tool_id"]
      description: "Probe failures (HALF_OPEN → OPEN)"
      query: "rate(circuit_breaker_probe_failure_total{tool_id='weather_api'}[1h])"

  logging:
    timeout_elapsed:
      message: "[CircuitBreaker] {tool_id}: OPEN → HALF_OPEN (timeout elapsed: {timeout}s)"
      level: "INFO"

    probe_success:
      message: "[CircuitBreaker] {tool_id}: HALF_OPEN → CLOSED (probe succeeded)"
      level: "INFO"

    probe_failure:
      message: "[CircuitBreaker] {tool_id}: HALF_OPEN → OPEN (probe failed, cooldown reset)"
      level: "WARNING"

    cooldown_reset:
      message: "[CircuitBreaker] {tool_id}: Cooldown reset (restart {timeout}s wait)"
      level: "INFO"

references:
  - type: "ADR"
    id: "ADR-0034c"
    title: "MCP Circuit Breaker Integration"
    lines: "651-800 (timeout cooldown configuration)"

  - type: "Contract"
    id: "circuit_breaker_fsm_3_states.yml"
    description: "OPEN → HALF_OPEN transition based on timeout"

  - type: "Contract"
    id: "per_tool_circuit_breaker.yml"
    description: "Per-tool timeout configuration"

  - type: "Research"
    citation: "Netflix Hystrix - Circuit Breaker Configuration"
    url: "https://github.com/Netflix/Hystrix/wiki/Configuration#circuitbreakersleepwindowinmilliseconds"
    topic: "Cooldown timeout best practices (default: 5000ms = 5s)"
