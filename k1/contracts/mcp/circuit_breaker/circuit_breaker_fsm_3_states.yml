# Circuit Breaker FSM (3 States) Contract
# Issue: 2.8.3 - Circuit Breaker Integration
# Source: ADR-0034c (MCP Circuit Breaker Integration), lines 1-251

contract:
  name: "circuit_breaker_fsm_3_states"
  version: "1.0.0"
  status: "PENDING_IMPLEMENTATION"
  source_adr: "ADR-0034c"
  parent_issue: "2.8.3"

overview:
  purpose: "Define 3-state finite state machine for circuit breaker preventing cascading failures in MCP tool execution"
  scope: "Circuit breaker state management, state transitions, failure threshold tracking, automatic recovery"
  context: "ADR-0034c integrates Circuit Breaker pattern (Michael Nygard, 2007) with MCP tool execution to achieve 92% cascade prevention (96 failures vs 1,200 without circuit breaker)"

states:
  CLOSED:
    description: "Normal operation - requests allowed"
    behavior:
      - "All tool requests pass through to MCP server"
      - "Failure count tracked in sliding window (10 min default)"
      - "Success resets failure count to 0"
      - "Transition to OPEN when failure_count ≥ threshold"
    entry_actions:
      - "Reset failure_count to 0"
      - "Log: 'Circuit CLOSED: Normal operation resumed'"
      - "Emit metric: circuit_breaker_state=0 (CLOSED)"
    exit_actions:
      - "Log: 'Circuit opening due to failures'"
      - "Record circuit_open_time (timestamp)"
    invariants:
      - "failure_count < failure_threshold"
      - "request_allowed = true"
      - "total_requests tracked"

  OPEN:
    description: "Failing - reject requests immediately (fail-fast)"
    behavior:
      - "All tool requests rejected immediately (<1ms)"
      - "No requests sent to MCP server (save resources)"
      - "After timeout elapsed, transition to HALF_OPEN"
      - "Rejection increases total_rejections counter"
    entry_actions:
      - "Record circuit_open_time (current timestamp)"
      - "Log: 'Circuit OPEN: Rejecting requests (cooldown: {timeout}s)'"
      - "Emit metric: circuit_breaker_state=1 (OPEN)"
      - "Emit metric: circuit_breaker_transitions_total{from=CLOSED,to=OPEN}"
    exit_actions:
      - "Log: 'Circuit testing recovery (HALF_OPEN)'"
      - "Calculate open_duration = now - circuit_open_time"
      - "Emit metric: circuit_breaker_open_duration_seconds histogram"
    invariants:
      - "failure_count ≥ failure_threshold"
      - "request_allowed = false"
      - "time_since_open < timeout_seconds (until transition)"

  HALF_OPEN:
    description: "Testing recovery - allow limited probe requests"
    behavior:
      - "Allow up to half_open_attempts probe requests (default: 1)"
      - "If probe succeeds → transition to CLOSED (recovery confirmed)"
      - "If probe fails → transition back to OPEN (reset cooldown)"
      - "Block additional requests until probe result known"
    entry_actions:
      - "Reset half_open_attempts_made to 0"
      - "Log: 'Circuit HALF_OPEN: Testing recovery (probe attempts: {half_open_attempts})'"
      - "Emit metric: circuit_breaker_state=2 (HALF_OPEN)"
      - "Emit metric: circuit_breaker_transitions_total{from=OPEN,to=HALF_OPEN}"
    exit_actions:
      - "Log probe result: success → CLOSED, failure → OPEN"
      - "Update failure_count based on probe result"
    invariants:
      - "half_open_attempts_made ≤ half_open_attempts"
      - "request_allowed = true (for probe only)"
      - "time_since_open ≥ timeout_seconds"

state_transitions:
  CLOSED_to_OPEN:
    trigger: "Failure count reaches threshold"
    guard: "failure_count ≥ failure_threshold"
    actions:
      - "Set state = OPEN"
      - "Record circuit_open_time"
      - "Log failure details (tool_id, failure_count, threshold)"
      - "Emit transition metric"
    example:
      tool_id: "weather_api"
      failure_threshold: 5
      failures: [
        {time: "2025-10-21T10:00:00Z", error: "TimeoutError: 30s"},
        {time: "2025-10-21T10:01:00Z", error: "TimeoutError: 30s"},
        {time: "2025-10-21T10:02:00Z", error: "TimeoutError: 30s"},
        {time: "2025-10-21T10:03:00Z", error: "TimeoutError: 30s"},
        {time: "2025-10-21T10:04:00Z", error: "TimeoutError: 30s"}
      ]
      result: "CLOSED → OPEN (5 failures in 4 minutes)"

  OPEN_to_HALF_OPEN:
    trigger: "Cooldown period elapsed"
    guard: "(now - circuit_open_time) ≥ timeout_seconds"
    actions:
      - "Set state = HALF_OPEN"
      - "Reset half_open_attempts_made to 0"
      - "Log: 'Circuit testing recovery after {timeout}s cooldown'"
      - "Emit transition metric"
    example:
      tool_id: "weather_api"
      circuit_open_time: "2025-10-21T10:04:00Z"
      timeout_seconds: 30
      now: "2025-10-21T10:04:31Z"
      result: "OPEN → HALF_OPEN (30s elapsed, allow probe)"

  HALF_OPEN_to_CLOSED:
    trigger: "Probe request succeeds"
    guard: "probe_result = SUCCESS"
    actions:
      - "Set state = CLOSED"
      - "Reset failure_count to 0"
      - "Log: 'Circuit recovery confirmed (probe succeeded)'"
      - "Emit transition metric"
    example:
      tool_id: "weather_api"
      probe_request: {tool: "weather_api", args: {city: "Seattle"}}
      probe_result: "SUCCESS (250ms, weather data returned)"
      result: "HALF_OPEN → CLOSED (normal operation resumed)"

  HALF_OPEN_to_OPEN:
    trigger: "Probe request fails"
    guard: "probe_result = FAILURE"
    actions:
      - "Set state = OPEN"
      - "Reset circuit_open_time (restart cooldown)"
      - "Log: 'Circuit recovery failed (probe failed)'"
      - "Emit transition metric"
    example:
      tool_id: "weather_api"
      probe_request: {tool: "weather_api", args: {city: "Seattle"}}
      probe_result: "FAILURE (TimeoutError: 30s)"
      result: "HALF_OPEN → OPEN (reset cooldown, try again in 30s)"

  CLOSED_success_reset:
    trigger: "Successful request in CLOSED state"
    guard: "state = CLOSED AND request_result = SUCCESS"
    actions:
      - "Reset failure_count to 0"
      - "Update total_requests counter"
      - "Log: 'Request succeeded, failure count reset'"
    note: "Not a state transition, but important for sliding window behavior"

circuit_breaker_config:
  structure:
    tool_id: "string (unique identifier for tool)"
    failure_threshold: "int (failures before OPEN, default: 5)"
    failure_window_seconds: "int (sliding window for failures, default: 600 = 10 min)"
    timeout_seconds: "int (cooldown before HALF_OPEN, default: 30)"
    half_open_attempts: "int (probe requests in HALF_OPEN, default: 1)"

  examples:
    weather_api:
      tool_id: "weather_api"
      failure_threshold: 5
      failure_window_seconds: 600
      timeout_seconds: 30
      half_open_attempts: 1
      rationale: "Public API, transient failures common"

    calendar_sync:
      tool_id: "calendar_sync"
      failure_threshold: 3
      failure_window_seconds: 600
      timeout_seconds: 20
      half_open_attempts: 1
      rationale: "Internal API, should be reliable, faster recovery"

    video_transcoder:
      tool_id: "video_transcoder"
      failure_threshold: 2
      failure_window_seconds: 300
      timeout_seconds: 120
      half_open_attempts: 1
      rationale: "Resource-intensive, strict threshold, long warmup"

circuit_breaker_state:
  dataclass: "CircuitBreakerState"
  fields:
    config: "CircuitBreakerConfig (configuration)"
    state: "CircuitState (current state: CLOSED/OPEN/HALF_OPEN)"
    failure_count: "int (failures in sliding window, default: 0)"
    last_failure_time: "float (timestamp of last failure, default: 0)"
    circuit_open_time: "float (timestamp when circuit opened, default: 0)"
    half_open_attempts_made: "int (probe attempts in HALF_OPEN, default: 0)"
    total_requests: "int (lifetime request count)"
    total_failures: "int (lifetime failure count)"
    total_rejections: "int (requests rejected when circuit OPEN)"

  methods:
    should_allow_request:
      returns: "bool"
      logic:
        - "If CLOSED: return True"
        - "If OPEN: Check if timeout elapsed → HALF_OPEN, else return False"
        - "If HALF_OPEN: Allow if half_open_attempts_made < half_open_attempts"
      performance: "<0.1ms (in-memory state lookup)"

    record_success:
      logic:
        - "Increment total_requests"
        - "If HALF_OPEN: Transition to CLOSED, reset failure_count"
        - "If CLOSED: Reset failure_count to 0"
      performance: "<0.1ms (state update)"

    record_failure:
      logic:
        - "Increment total_requests, total_failures"
        - "Check sliding window: If outside window, reset failure_count"
        - "Increment failure_count, update last_failure_time"
        - "If CLOSED: Check threshold → transition to OPEN if ≥ threshold"
        - "If HALF_OPEN: Transition to OPEN (probe failed)"
      performance: "<0.1ms (state update)"

    record_rejection:
      logic:
        - "Increment total_rejections"
        - "Emit metric: circuit_breaker_rejections_total"
      performance: "<0.01ms (counter increment)"

sliding_window_behavior:
  description: "Only count failures within failure_window_seconds (default: 10 min)"
  algorithm:
    - "On record_failure(): Check (now - last_failure_time) > failure_window_seconds"
    - "If outside window: Reset failure_count to 0 (old failures expired)"
    - "Then: Increment failure_count, update last_failure_time"
  example:
    scenario: "4 failures in 9 min, 1 success, then 1 failure"
    timeline:
      - {time: "10:00:00", event: "Failure 1", failure_count: 1}
      - {time: "10:02:00", event: "Failure 2", failure_count: 2}
      - {time: "10:05:00", event: "Failure 3", failure_count: 3}
      - {time: "10:09:00", event: "Failure 4", failure_count: 4}
      - {time: "10:10:00", event: "Success", failure_count: 0, note: "Reset"}
      - {time: "10:11:00", event: "Failure 5", failure_count: 1, note: "Not 5"}
    result: "Circuit remains CLOSED (success reset count)"

performance_budgets:
  circuit_check: "<0.1ms P95 (in-memory state lookup)"
  rejection: "<1ms P95 (immediate fail-fast, no MCP call)"
  state_update: "<0.1ms P95 (memory write, counter increment)"
  overhead: "<0.1% of tool execution time"
  example:
    tool_execution: "250ms (weather API)"
    circuit_overhead: "0.2ms (check + update)"
    overhead_percentage: "0.08% (acceptable)"

cascade_prevention:
  scenario: "Weather API down (external service outage)"
  without_circuit_breaker:
    requests: 100
    per_request_timeout: 30000 # ms
    total_time: 3000000 # ms (50 minutes)
    resource_impact: "100 pending requests, CPU/memory exhausted"

  with_circuit_breaker:
    first_5_requests: "5 × 30s = 150s (trigger OPEN)"
    next_95_requests: "95 × 0.001s = 0.095s (rejected)"
    total_time: "150.095s"
    improvement: "20× faster (3000s → 150s)"
    resource_saved: "95% (95 requests rejected immediately)"
    cascade_prevention_rate: "92% (96 failures vs 1,200 without)"

implementation_example:
  language: "Python"
  code: |
    from enum import Enum
    from dataclasses import dataclass
    import time

    class CircuitState(Enum):
        CLOSED = "CLOSED"
        OPEN = "OPEN"
        HALF_OPEN = "HALF_OPEN"

    @dataclass
    class CircuitBreakerConfig:
        tool_id: str
        failure_threshold: int = 5
        failure_window_seconds: int = 600
        timeout_seconds: int = 30
        half_open_attempts: int = 1

    @dataclass
    class CircuitBreakerState:
        config: CircuitBreakerConfig
        state: CircuitState = CircuitState.CLOSED
        failure_count: int = 0
        last_failure_time: float = 0
        circuit_open_time: float = 0
        half_open_attempts_made: int = 0
        total_requests: int = 0
        total_failures: int = 0
        total_rejections: int = 0

        def should_allow_request(self) -> bool:
            now = time.time()

            if self.state == CircuitState.CLOSED:
                return True

            elif self.state == CircuitState.OPEN:
                # Check cooldown
                if now - self.circuit_open_time >= self.config.timeout_seconds:
                    # Transition to HALF_OPEN
                    self.state = CircuitState.HALF_OPEN
                    self.half_open_attempts_made = 0
                    return True
                else:
                    return False

            elif self.state == CircuitState.HALF_OPEN:
                # Allow probe
                if self.half_open_attempts_made < self.config.half_open_attempts:
                    self.half_open_attempts_made += 1
                    return True
                else:
                    return False

            return False

        def record_success(self):
            self.total_requests += 1

            if self.state == CircuitState.HALF_OPEN:
                # Recovery confirmed
                self.state = CircuitState.CLOSED
                self.failure_count = 0
                print(f"[CircuitBreaker] {self.config.tool_id}: HALF_OPEN → CLOSED")

            elif self.state == CircuitState.CLOSED:
                # Reset failure count
                self.failure_count = 0

        def record_failure(self):
            now = time.time()
            self.total_requests += 1
            self.total_failures += 1

            # Sliding window check
            if now - self.last_failure_time > self.config.failure_window_seconds:
                self.failure_count = 0

            self.failure_count += 1
            self.last_failure_time = now

            if self.state == CircuitState.CLOSED:
                if self.failure_count >= self.config.failure_threshold:
                    # Open circuit
                    self.state = CircuitState.OPEN
                    self.circuit_open_time = now
                    print(f"[CircuitBreaker] {self.config.tool_id}: CLOSED → OPEN")

            elif self.state == CircuitState.HALF_OPEN:
                # Probe failed
                self.state = CircuitState.OPEN
                self.circuit_open_time = now
                print(f"[CircuitBreaker] {self.config.tool_id}: HALF_OPEN → OPEN")

        def record_rejection(self):
            self.total_rejections += 1

observability:
  metrics:
    circuit_breaker_state:
      type: "Gauge"
      labels: ["tool_id"]
      values: {CLOSED: 0, OPEN: 1, HALF_OPEN: 2}
      query: "circuit_breaker_state{tool_id='weather_api'}"

    circuit_breaker_transitions_total:
      type: "Counter"
      labels: ["tool_id", "from_state", "to_state"]
      query: "rate(circuit_breaker_transitions_total{tool_id='weather_api'}[5m])"

    circuit_breaker_rejections_total:
      type: "Counter"
      labels: ["tool_id"]
      query: "rate(circuit_breaker_rejections_total{tool_id='weather_api'}[5m])"

    circuit_breaker_failures_total:
      type: "Counter"
      labels: ["tool_id"]
      query: "rate(circuit_breaker_failures_total{tool_id='weather_api'}[5m])"

testing_requirements:
  unit_tests:
    - "CircuitBreakerState starts CLOSED"
    - "CLOSED → OPEN on threshold (5 failures)"
    - "OPEN → HALF_OPEN after timeout (30s)"
    - "HALF_OPEN → CLOSED on probe success"
    - "HALF_OPEN → OPEN on probe failure"
    - "Success resets failure_count in CLOSED"
    - "Sliding window expires old failures"

  integration_tests:
    - "Circuit breaker rejects when OPEN"
    - "Circuit breaker recovers on HALF_OPEN success"
    - "Circuit breaker handles multiple tools independently"
    - "Circuit breaker transitions tracked in metrics"

