# =============================================================================
# GLOSSARY
# =============================================================================

glossary:
  json_rpc: "Remote procedure call protocol encoded in JSON (2010 spec)"
  request_id: "Unique identifier (UUID v4) for matching async responses"
  method: "String identifying the method to invoke on the server"
  params: "Structured parameters (always Object, not Array in K1)"
  validation: "Pre-send checks ensuring request meets JSON-RPC 2.0 spec"

