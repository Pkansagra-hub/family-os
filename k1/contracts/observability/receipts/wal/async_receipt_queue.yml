classes:
  - name: AsyncReceiptQueue
    description: MPSC channel implementation for async receipt queuing with backpressure
    research: ADR-0038b (async writes), tokio mpsc channels, backpressure patterns
    performance_budget: <1ms per send/recv operation (P95)
    reliability_properties:
      - bounded_capacity: Fixed capacity prevents unbounded memory growth
      - backpressure_safety: Send blocks when queue full, prevents OOM
      - graceful_shutdown: Clean shutdown with pending receipt handling
    methods:
      - name: new
        description: Create new async receipt queue with specified capacity
        parameters:
          - name: capacity
            type: int
            description: Maximum queue capacity (default 10,000)
        returns:
          type: (Sender<Receipt>, Receiver<Receipt>)
          description: MPSC channel sender and receiver pair
        implementation:
          rust: |
            use tokio::sync::mpsc::{self, Sender, Receiver};
            use std::sync::Arc;
            use tokio::sync::Mutex;

            pub struct AsyncReceiptQueue {
                capacity: usize,
                sender: Sender<Receipt>,
                receiver: Receiver<Receipt>,
                metrics: Arc<QueueMetrics>,
            }

            impl AsyncReceiptQueue {
                pub fn new(capacity: usize, metrics: Arc<QueueMetrics>) -> Self {
                    let (sender, receiver) = mpsc::channel(capacity);

                    Self {
                        capacity,
                        sender,
                        receiver,
                        metrics,
                    }
                }

                pub fn split(self) -> (ReceiptSender, ReceiptReceiver) {
                    (
                        ReceiptSender {
                            sender: self.sender,
                            capacity: self.capacity,
                            metrics: self.metrics.clone(),
                        },
                        ReceiptReceiver {
                            receiver: self.receiver,
                            metrics: self.metrics,
                        }
                    )
                }
            }

            pub struct ReceiptSender {
                sender: Sender<Receipt>,
                capacity: usize,
                metrics: Arc<QueueMetrics>,
            }

            impl ReceiptSender {
                pub async fn send(&self, receipt: Receipt) -> Result<(), SendError> {
                    let start = std::time::Instant::now();

                    match self.sender.try_send(receipt.clone()) {
                        Ok(()) => {
                            let send_time_ms = start.elapsed().as_millis() as f64;
                            self.metrics.record_send_time(send_time_ms);
                            self.metrics.increment_queue_depth();

                            // Check backpressure threshold (90% capacity)
                            if self.sender.capacity() < (self.capacity / 10) {
                                self.metrics.record_backpressure();
                            }

                            Ok(())
                        }
                        Err(mpsc::error::TrySendError::Full(_)) => {
                            self.metrics.record_queue_full();
                            Err(SendError::QueueFull)
                        }
                        Err(mpsc::error::TrySendError::Closed(_)) => {
                            self.metrics.record_channel_closed();
                            Err(SendError::ChannelClosed)
                        }
                    }
                }

                pub async fn send_with_timeout(
                    &self,
                    receipt: Receipt,
                    timeout_ms: u64
                ) -> Result<(), SendError> {
                    let start = std::time::Instant::now();

                    match tokio::time::timeout(
                        std::time::Duration::from_millis(timeout_ms),
                        self.sender.send(receipt.clone())
                    ).await {
                        Ok(Ok(())) => {
                            let send_time_ms = start.elapsed().as_millis() as f64;
                            self.metrics.record_send_time(send_time_ms);
                            self.metrics.increment_queue_depth();
                            Ok(())
                        }
                        Ok(Err(_)) => {
                            self.metrics.record_channel_closed();
                            Err(SendError::ChannelClosed)
                        }
                        Err(_) => {
                            self.metrics.record_send_timeout();
                            Err(SendError::Timeout)
                        }
                    }
                }

                pub fn capacity(&self) -> usize {
                    self.sender.capacity()
                }

                pub fn max_capacity(&self) -> usize {
                    self.capacity
                }
            }

            pub struct ReceiptReceiver {
                receiver: Receiver<Receipt>,
                metrics: Arc<QueueMetrics>,
            }

            impl ReceiptReceiver {
                pub async fn recv(&mut self) -> Option<Receipt> {
                    let start = std::time::Instant::now();

                    match self.receiver.recv().await {
                        Some(receipt) => {
                            let recv_time_ms = start.elapsed().as_millis() as f64;
                            self.metrics.record_recv_time(recv_time_ms);
                            self.metrics.decrement_queue_depth();
                            Some(receipt)
                        }
                        None => {
                            self.metrics.record_channel_closed();
                            None
                        }
                    }
                }

                pub async fn recv_batch(&mut self, max_batch_size: usize) -> Vec<Receipt> {
                    let mut batch = Vec::with_capacity(max_batch_size);
                    let start = std::time::Instant::now();

                    // Try to fill batch up to max_batch_size or until channel empty
                    for _ in 0..max_batch_size {
                        match self.receiver.try_recv() {
                            Ok(receipt) => {
                                batch.push(receipt);
                                self.metrics.decrement_queue_depth();
                            }
                            Err(mpsc::error::TryRecvError::Empty) => break,
                            Err(mpsc::error::TryRecvError::Disconnected) => {
                                self.metrics.record_channel_closed();
                                break;
                            }
                        }
                    }

                    if !batch.is_empty() {
                        let batch_time_ms = start.elapsed().as_millis() as f64;
                        self.metrics.record_batch_recv_time(batch_time_ms, batch.len());
                    }

                    batch
                }
            }
          python: |
            import asyncio
            from typing import Optional, Tuple
            from asyncio import Queue, QueueFull, QueueEmpty
            import time

            class AsyncReceiptQueue:
                """Async queue for receipt processing with backpressure"""

                def __init__(self, capacity: int = 10000, metrics: Optional[QueueMetrics] = None):
                    self.capacity = capacity
                    self.queue = Queue(maxsize=capacity)
                    self.metrics = metrics or QueueMetrics()

                def split(self) -> Tuple['ReceiptSender', 'ReceiptReceiver']:
                    """Split into sender and receiver"""
                    return ReceiptSender(self.queue, self.metrics), ReceiptReceiver(self.queue, self.metrics)

            class ReceiptSender:
                """Queue sender with backpressure handling"""

                def __init__(self, queue: Queue, metrics: QueueMetrics):
                    self.queue = queue
                    self.metrics = metrics

                async def send(self, receipt: Receipt) -> None:
                    """Send receipt with backpressure"""
                    start_time = time.time()

                    try:
                        # Try immediate send first
                        self.queue.put_nowait(receipt)
                        send_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_send_time(send_time_ms)
                        self.metrics.increment_queue_depth()

                        # Check backpressure (90% capacity)
                        if self.queue.qsize() > (self.queue.maxsize * 0.9):
                            self.metrics.record_backpressure()

                    except QueueFull:
                        self.metrics.record_queue_full()
                        raise QueueFullError("Queue is full")

                async def send_with_timeout(self, receipt: Receipt, timeout_ms: float) -> None:
                    """Send with timeout"""
                    start_time = time.time()

                    try:
                        await asyncio.wait_for(
                            self.queue.put(receipt),
                            timeout=timeout_ms / 1000
                        )
                        send_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_send_time(send_time_ms)
                        self.metrics.increment_queue_depth()

                    except asyncio.TimeoutError:
                        self.metrics.record_send_timeout()
                        raise SendTimeoutError(f"Send timeout after {timeout_ms}ms")

                def capacity(self) -> int:
                    """Current available capacity"""
                    return self.queue.maxsize - self.queue.qsize()

                def max_capacity(self) -> int:
                    """Maximum capacity"""
                    return self.queue.maxsize

            class ReceiptReceiver:
                """Queue receiver with batch support"""

                def __init__(self, queue: Queue, metrics: QueueMetrics):
                    self.queue = queue
                    self.metrics = metrics

                async def recv(self) -> Optional[Receipt]:
                    """Receive single receipt"""
                    start_time = time.time()

                    try:
                        receipt = await self.queue.get()
                        recv_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_recv_time(recv_time_ms)
                        self.metrics.decrement_queue_depth()
                        return receipt

                    except Exception as e:
                        self.metrics.record_recv_error(str(e))
                        return None

                async def recv_batch(self, max_batch_size: int) -> list[Receipt]:
                    """Receive batch of receipts"""
                    batch = []
                    start_time = time.time()

                    try:
                        # Try to get up to max_batch_size items immediately
                        for _ in range(max_batch_size):
                            try:
                                receipt = self.queue.get_nowait()
                                batch.append(receipt)
                                self.metrics.decrement_queue_depth()
                            except QueueEmpty:
                                break

                        if batch:
                            batch_time_ms = (time.time() - start_time) * 1000
                            self.metrics.record_batch_recv_time(batch_time_ms, len(batch))

                    except Exception as e:
                        self.metrics.record_recv_error(str(e))

                    return batch

        performance_requirements:
          - send_latency: <1ms per send operation (P95)
          - recv_latency: <1ms per recv operation (P95)
          - memory_efficiency: O(1) memory per queued item
          - batch_efficiency: 10× throughput improvement with batching
        error_handling:
          - queue_full: Return error, don't block indefinitely
          - channel_closed: Graceful shutdown, return None
          - timeout: Configurable timeout with error return

      - name: close
        description: Gracefully close the queue
        implementation_notes: Clean shutdown with pending receipt handling

    dependencies:
      - name: tokio::sync::mpsc
        description: Async multi-producer single-consumer channel
      - name: QueueMetrics
        description: Metrics collection for queue performance

testing_requirements:
  - unit_tests:
      - capacity_limits: Queue respects capacity limits
      - backpressure: Send blocks when queue full
      - batch_operations: Batch recv improves throughput
      - graceful_shutdown: Clean shutdown preserves pending items
  - integration_tests:
      - producer_consumer: Multiple producers, single consumer
      - high_throughput: 1000 items/sec sustained
      - memory_bounds: Memory usage stays within limits
  - performance_tests:
      - latency_distribution: P95 <1ms for send/recv
      - throughput_scaling: Linear scaling with batch size
      - contention: Performance under high contention

observability:
  metrics:
    - name: receipt_queue_capacity
      type: gauge
      description: Maximum queue capacity
    - name: receipt_queue_current_depth
      type: gauge
      description: Current number of items in queue
    - name: receipt_queue_send_time_ms
      type: histogram
      buckets: [0.1, 0.5, 1.0, 5.0]
      description: Time to send item to queue
    - name: receipt_queue_recv_time_ms
      type: histogram
      buckets: [0.1, 0.5, 1.0]
      description: Time to receive item from queue
    - name: receipt_queue_full_events_total
      type: counter
      description: Total queue full events
    - name: receipt_queue_timeout_events_total
      type: counter
      description: Total send timeout events

alerting_rules:
  - name: ReceiptQueueFull
    condition: receipt_queue_full_events_total > 0
    severity: warning
    description: Receipt queue is full - backpressure active
    runbook: Check batch writer performance, consider increasing capacity

  - name: ReceiptQueueDepthHigh
    condition: receipt_queue_current_depth / receipt_queue_capacity > 0.9
    severity: warning
    description: Queue >90% full - approaching backpressure
    runbook: Monitor batch writer throughput

compliance:
  - soc2: CC7.2 (system monitoring with capacity management)
