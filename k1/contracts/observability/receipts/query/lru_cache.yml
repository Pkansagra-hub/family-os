classes:
  - name: LRUCache
    description: Session-based LRU cache with 10-minute TTL for receipt queries
    research: ADR-0038d (query interface), LRU caching, cache invalidation strategies
    performance_budget: <1ms cache operations (P95), >75% hit rate target
    reliability_properties:
      - cache_consistency: Cache invalidation maintains data consistency
      - memory_bounds: Memory usage stays within configured limits
      - ttl_compliance: Cache entries expire exactly at TTL boundaries
      - thread_safety: Concurrent access properly synchronized
    methods:
      - name: get
        description: Retrieve item from cache with TTL check
        parameters:
          - name: key
            type: string
            description: Cache key to retrieve
        returns:
          type: Optional[T]
          description: Cached value if present and not expired, None otherwise
        implementation:
          rust: |
            use std::collections::HashMap;
            use std::sync::Arc;
            use tokio::sync::RwLock;
            use chrono::{DateTime, Utc, Duration};

            #[derive(Clone)]
            pub struct CacheEntry<T> {
                pub value: T,
                pub expires_at: DateTime<Utc>,
                pub created_at: DateTime<Utc>,
                pub access_count: u64,
                pub last_accessed: DateTime<Utc>,
            }

            pub struct LRUCache<T> {
                cache: Arc<RwLock<HashMap<String, CacheEntry<T>>>>,
                max_entries: usize,
                ttl_seconds: i64,
                observability: Arc<QueryObservability>,
            }

            impl<T: Clone + Send + Sync> LRUCache<T> {
                pub fn new(max_entries: usize, ttl_seconds: i64, observability: Arc<QueryObservability>) -> Self {
                    Self {
                        cache: Arc::new(RwLock::new(HashMap::new())),
                        max_entries,
                        ttl_seconds,
                        observability,
                    }
                }

                pub async fn get(&self, key: &str) -> Option<T> {
                    let start_time = std::time::Instant::now();
                    let mut cache = self.cache.write().await;

                    if let Some(entry) = cache.get_mut(key) {
                        // Check if entry has expired
                        if Utc::now() > entry.expires_at {
                            // Remove expired entry
                            cache.remove(key);
                            self.record_cache_miss(start_time.elapsed(), "expired").await;
                            return None;
                        }

                        // Update access statistics
                        entry.access_count += 1;
                        entry.last_accessed = Utc::now();

                        let value = entry.value.clone();
                        self.record_cache_hit(start_time.elapsed()).await;
                        Some(value)
                    } else {
                        self.record_cache_miss(start_time.elapsed(), "not_found").await;
                        None
                    }
                }

                pub async fn put(&self, key: String, value: T, custom_ttl: Option<Duration>) {
                    let start_time = std::time::Instant::now();
                    let mut cache = self.cache.write().await;

                    let ttl = custom_ttl.unwrap_or(Duration::seconds(self.ttl_seconds));
                    let expires_at = Utc::now() + ttl;

                    let entry = CacheEntry {
                        value,
                        expires_at,
                        created_at: Utc::now(),
                        access_count: 0,
                        last_accessed: Utc::now(),
                    };

                    // Check if we need to evict entries
                    if cache.len() >= self.max_entries && !cache.contains_key(&key) {
                        self.evict_lru(&mut cache).await;
                    }

                    let is_update = cache.contains_key(&key);
                    cache.insert(key, entry);

                    self.record_cache_put(start_time.elapsed(), is_update).await;
                }

                pub async fn invalidate(&self, key: &str) -> bool {
                    let mut cache = self.cache.write().await;
                    let removed = cache.remove(key).is_some();

                    if removed {
                        CACHE_INVALIDATIONS_TOTAL.inc();
                        self.observability.record_cache_invalidation(key).await;
                    }

                    removed
                }

                pub async fn invalidate_pattern(&self, pattern: &str) -> usize {
                    let mut cache = self.cache.write().await;
                    let keys_to_remove: Vec<String> = cache.keys()
                        .filter(|key| key.contains(pattern))
                        .cloned()
                        .collect();

                    let removed_count = keys_to_remove.len();
                    for key in keys_to_remove {
                        cache.remove(&key);
                    }

                    if removed_count > 0 {
                        CACHE_INVALIDATIONS_TOTAL.inc_by(removed_count as u64);
                        self.observability.record_pattern_invalidation(pattern, removed_count).await;
                    }

                    removed_count
                }

                pub async fn clear(&self) {
                    let mut cache = self.cache.write().await;
                    let cleared_count = cache.len();
                    cache.clear();

                    CACHE_INVALIDATIONS_TOTAL.inc_by(cleared_count as u64);
                    self.observability.record_cache_clear(cleared_count).await;
                }

                pub async fn stats(&self) -> CacheStats {
                    let cache = self.cache.read().await;

                    let now = Utc::now();
                    let mut total_accesses = 0u64;
                    let mut entries_by_age = HashMap::new();
                    let mut expired_count = 0usize;

                    for entry in cache.values() {
                        total_accesses += entry.access_count;

                        let age_seconds = (now - entry.created_at).num_seconds();
                        let age_bucket = match age_seconds {
                            0..=60 => "0-1m",
                            61..=300 => "1-5m",
                            301..=600 => "5-10m",
                            _ => "10m+",
                        };

                        *entries_by_age.entry(age_bucket.to_string()).or_insert(0) += 1;

                        if now > entry.expires_at {
                            expired_count += 1;
                        }
                    }

                    CacheStats {
                        total_entries: cache.len(),
                        max_entries: self.max_entries,
                        expired_entries: expired_count,
                        total_accesses,
                        entries_by_age,
                        hit_rate_percent: self.calculate_hit_rate().await,
                        memory_usage_bytes: self.estimate_memory_usage(&cache),
                    }
                }

                async fn evict_lru(&self, cache: &mut HashMap<String, CacheEntry<T>>) {
                    if cache.is_empty() {
                        return;
                    }

                    // Find least recently used entry
                    let mut lru_key = None;
                    let mut lru_time = Utc::now();

                    for (key, entry) in cache.iter() {
                        if entry.last_accessed < lru_time {
                            lru_time = entry.last_accessed;
                            lru_key = Some(key.clone());
                        }
                    }

                    if let Some(key) = lru_key {
                        cache.remove(&key);
                        CACHE_EVICTIONS_TOTAL.inc();
                        self.observability.record_cache_eviction(&key).await;
                    }
                }

                async fn calculate_hit_rate(&self) -> f64 {
                    // This would track hits/misses over a sliding window
                    // Implementation would maintain counters
                    0.85 // Placeholder - actual implementation would calculate from metrics
                }

                fn estimate_memory_usage(&self, cache: &HashMap<String, CacheEntry<T>>) -> usize {
                    // Rough estimation: 256 bytes per entry overhead + value size
                    // Actual implementation would use more sophisticated memory tracking
                    cache.len() * 256
                }

                async fn record_cache_hit(&self, duration: std::time::Duration) {
                    CACHE_HITS_TOTAL.inc();
                    CACHE_OPERATION_LATENCY_MS
                        .with_label_values(&["hit"])
                        .observe(duration.as_millis() as f64);
                }

                async fn record_cache_miss(&self, duration: std::time::Duration, reason: &str) {
                    CACHE_MISSES_TOTAL.with_label_values(&[reason]).inc();
                    CACHE_OPERATION_LATENCY_MS
                        .with_label_values(&["miss"])
                        .observe(duration.as_millis() as f64);
                }

                async fn record_cache_put(&self, duration: std::time::Duration, is_update: bool) {
                    CACHE_PUTS_TOTAL
                        .with_label_values(&[if is_update { "update" } else { "insert" }])
                        .inc();
                    CACHE_OPERATION_LATENCY_MS
                        .with_label_values(&["put"])
                        .observe(duration.as_millis() as f64);
                }
            }

            #[derive(Serialize, Deserialize)]
            pub struct CacheStats {
                pub total_entries: usize,
                pub max_entries: usize,
                pub expired_entries: usize,
                pub total_accesses: u64,
                pub entries_by_age: HashMap<String, usize>,
                pub hit_rate_percent: f64,
                pub memory_usage_bytes: usize,
            }

            lazy_static! {
                static ref CACHE_HITS_TOTAL: Counter = register_counter!(
                    "cache_hits_total",
                    "Total cache hits",
                    &[]
                ).unwrap();

                static ref CACHE_MISSES_TOTAL: Counter = register_counter!(
                    "cache_misses_total",
                    "Total cache misses",
                    &["reason"]
                ).unwrap();

                static ref CACHE_PUTS_TOTAL: Counter = register_counter!(
                    "cache_puts_total",
                    "Total cache puts",
                    &["operation_type"]
                ).unwrap();

                static ref CACHE_EVICTIONS_TOTAL: Counter = register_counter!(
                    "cache_evictions_total",
                    "Total cache evictions due to LRU",
                    &[]
                ).unwrap();

                static ref CACHE_INVALIDATIONS_TOTAL: Counter = register_counter!(
                    "cache_invalidations_total",
                    "Total cache invalidations",
                    &[]
                ).unwrap();

                static ref CACHE_OPERATION_LATENCY_MS: Histogram = register_histogram!(
                    "cache_operation_latency_ms",
                    "Cache operation latency in milliseconds",
                    &["operation"],
                    vec![0.1, 0.5, 1.0, 5.0, 10.0]
                ).unwrap();
            }
          python: |
            from dataclasses import dataclass
            from typing import Dict, Optional, Any, List
            import asyncio
            import time
            from collections import OrderedDict
            import threading

            @dataclass
            class CacheEntry:
                value: Any
                expires_at: float  # Unix timestamp
                created_at: float
                access_count: int
                last_accessed: float

            class LRUCache:
                """Session-based LRU cache with TTL for receipt queries"""

                def __init__(self, max_entries: int = 1000, ttl_seconds: int = 600, observability=None):
                    self.max_entries = max_entries
                    self.ttl_seconds = ttl_seconds
                    self.observability = observability
                    self._cache: OrderedDict[str, CacheEntry] = OrderedDict()
                    self._lock = threading.RLock()
                    self._stats = CacheStats()

                async def get(self, key: str) -> Optional[Any]:
                    """Retrieve item from cache with TTL check"""
                    start_time = time.time()
                    with self._lock:
                        if key in self._cache:
                            entry = self._cache[key]

                            # Check if entry has expired
                            if time.time() > entry.expires_at:
                                del self._cache[key]
                                await self._record_cache_miss(time.time() - start_time, "expired")
                                return None

                            # Move to end (most recently used)
                            self._cache.move_to_end(key)

                            # Update access statistics
                            entry.access_count += 1
                            entry.last_accessed = time.time()

                            await self._record_cache_hit(time.time() - start_time)
                            return entry.value
                        else:
                            await self._record_cache_miss(time.time() - start_time, "not_found")
                            return None

                async def put(self, key: str, value: Any, ttl_seconds: Optional[int] = None):
                    """Store item in cache with TTL"""
                    start_time = time.time()
                    ttl = ttl_seconds or self.ttl_seconds
                    expires_at = time.time() + ttl

                    entry = CacheEntry(
                        value=value,
                        expires_at=expires_at,
                        created_at=time.time(),
                        access_count=0,
                        last_accessed=time.time()
                    )

                    with self._lock:
                        is_update = key in self._cache

                        # Evict if at capacity and new key
                        if len(self._cache) >= self.max_entries and key not in self._cache:
                            self._evict_lru()

                        self._cache[key] = entry
                        self._cache.move_to_end(key)  # Most recently used

                    await self._record_cache_put(time.time() - start_time, is_update)

                async def invalidate(self, key: str) -> bool:
                    """Remove specific key from cache"""
                    with self._lock:
                        removed = self._cache.pop(key, None) is not None

                    if removed and self.observability:
                        await self.observability.record_cache_invalidation(key)

                    return removed

                async def invalidate_pattern(self, pattern: str) -> int:
                    """Remove all keys matching pattern"""
                    keys_to_remove = []
                    with self._lock:
                        for key in list(self._cache.keys()):
                            if pattern in key:
                                keys_to_remove.append(key)

                        for key in keys_to_remove:
                            del self._cache[key]

                    removed_count = len(keys_to_remove)
                    if removed_count > 0 and self.observability:
                        await self.observability.record_pattern_invalidation(pattern, removed_count)

                    return removed_count

                async def clear(self):
                    """Clear entire cache"""
                    with self._lock:
                        cleared_count = len(self._cache)
                        self._cache.clear()

                    if cleared_count > 0 and self.observability:
                        await self.observability.record_cache_clear(cleared_count)

                async def get_stats(self) -> 'CacheStats':
                    """Get comprehensive cache statistics"""
                    with self._lock:
                        now = time.time()
                        total_accesses = sum(entry.access_count for entry in self._cache.values())
                        expired_count = sum(1 for entry in self._cache.values() if now > entry.expires_at)

                        entries_by_age = {}
                        for entry in self._cache.values():
                            age_seconds = now - entry.created_at
                            if age_seconds <= 60:
                                bucket = "0-1m"
                            elif age_seconds <= 300:
                                bucket = "1-5m"
                            elif age_seconds <= 600:
                                bucket = "5-10m"
                            else:
                                bucket = "10m+"
                            entries_by_age[bucket] = entries_by_age.get(bucket, 0) + 1

                    return CacheStats(
                        total_entries=len(self._cache),
                        max_entries=self.max_entries,
                        expired_entries=expired_count,
                        total_accesses=total_accesses,
                        entries_by_age=entries_by_age,
                        hit_rate_percent=await self._calculate_hit_rate(),
                        memory_usage_bytes=self._estimate_memory_usage()
                    )

                def _evict_lru(self):
                    """Evict least recently used entry"""
                    if self._cache:
                        lru_key, _ = self._cache.popitem(last=False)  # Remove first (LRU)
                        if self.observability:
                            asyncio.create_task(self.observability.record_cache_eviction(lru_key))

                async def _calculate_hit_rate(self) -> float:
                    """Calculate cache hit rate over sliding window"""
                    # Implementation would track hits/misses over time window
                    return 0.85  # Placeholder

                def _estimate_memory_usage(self) -> int:
                    """Estimate memory usage of cache"""
                    # Rough estimation: 256 bytes per entry
                    return len(self._cache) * 256

                async def _record_cache_hit(self, duration: float):
                    """Record cache hit metrics"""
                    if self.observability:
                        await self.observability.record_cache_operation("hit", duration)

                async def _record_cache_miss(self, duration: float, reason: str):
                    """Record cache miss metrics"""
                    if self.observability:
                        await self.observability.record_cache_operation("miss", duration, reason=reason)

                async def _record_cache_put(self, duration: float, is_update: bool):
                    """Record cache put metrics"""
                    if self.observability:
                        operation = "update" if is_update else "insert"
                        await self.observability.record_cache_operation("put", duration, operation_type=operation)

            @dataclass
            class CacheStats:
                total_entries: int
                max_entries: int
                expired_entries: int
                total_accesses: int
                entries_by_age: Dict[str, int]
                hit_rate_percent: float
                memory_usage_bytes: int

    dependencies:
      - name: tokio
        description: Async runtime for concurrent cache operations
      - name: chrono
        description: Date/time handling for TTL calculations
      - name: prometheus
        description: Cache performance metrics collection

testing_requirements:
  - unit_tests:
      - ttl_expiration: Cache entries expire correctly at TTL boundaries
      - lru_eviction: LRU policy evicts correct entries when at capacity
      - thread_safety: Concurrent operations don't cause data corruption
  - integration_tests:
      - query_integration: Cache integrates properly with receipt queries
      - invalidation_patterns: Pattern-based invalidation works correctly
      - memory_bounds: Cache stays within configured memory limits
  - performance_tests:
      - operation_latency: All operations meet <1ms P95 budget
      - hit_rate_target: Cache achieves >75% hit rate under load
      - concurrent_access: Cache handles high concurrency without bottlenecks

cache_configuration:
  - max_entries: 1000 (sessions)
  - default_ttl: 600 seconds (10 minutes)
  - eviction_policy: LRU (Least Recently Used)
  - memory_limit: 256MB (rough estimate)
  - cleanup_interval: 60 seconds (background expiration check)

compliance:
  - gdpr: Article 5(1)(e) (storage limitation with automatic expiration)
  - hipaa: § 164.530(j) (administrative safeguards with data lifecycle management)
  - soc2: CC6.1 (logical access controls with session management)
