    dependencies:
      - name: axum
        description: Web framework for REST API endpoints
      - name: fastapi
        description: Python web framework for API endpoints
      - name: serde
        description: Serialization for API responses
      - name: tokio
        description: Async runtime for API handlers

testing_requirements:
  - unit_tests:
      - endpoint_responses: All endpoints return correct response schemas
      - parameter_validation: Query parameters properly validated
      - error_handling: Proper HTTP status codes for error conditions
  - integration_tests:
      - database_queries: API calls result in correct database queries
      - cache_behavior: LRU cache properly utilized and invalidated
      - observability: Metrics and tracing collected for all requests
  - security_tests:
      - authentication: All endpoints require valid authentication
      - authorization: Users can only access their own receipts
      - rate_limiting: Query endpoints properly rate limited
  - performance_tests:
      - response_time: Session queries <50ms P95, user queries <500ms P95
      - concurrent_requests: API handles multiple concurrent queries
      - memory_usage: No memory leaks under load

rate_limits:
  - session_receipts: 100 requests per minute per user
  - user_receipts: 10 requests per minute per user
  - export_requests: 1 request per hour per user

authentication:
  - bearer_token: JWT token with user identity and permissions
  - api_key: Service-to-service authentication for internal queries

compliance:
  - gdpr: Article 15 (right of access by data subject)
  - gdpr: Article 30 (records of processing activities)
  - hipaa: § 164.524 (access of individuals to protected health information)
  - soc2: CC7.1 (access to systems and data)
