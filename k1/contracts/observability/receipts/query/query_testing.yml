                    let error_result = self.test_query_error_handling().await?;
                    results.add_result(error_result);

                    Ok(results)
                }

                async fn test_hash_verification_class(&self, trace_id: &str) -> Result<UnitTestResults, TestError> {
                    let mut results = UnitTestResults::default();

                    // Test valid hash chain verification
                    let valid_result = self.test_valid_hash_chain().await?;
                    results.add_result(valid_result);

                    // Test tampered hash chain detection
