                    results.add_result(ttl_result);

                    // Test concurrent access
                    let concurrent_result = self.test_concurrent_cache_access().await?;
                    results.add_result(concurrent_result);

                    Ok(results)
                }

                async fn test_query_security_class(&self, trace_id: &str) -> Result<UnitTestResults, TestError> {
                    let mut results = UnitTestResults::default();

                    // Test authorization logic
                    let auth_result = self.test_authorization_logic().await?;
                    results.add_result(auth_result);

                    // Test rate limiting
                    let rate_limit_result = self.test_rate_limiting().await?;
                    results.add_result(rate_limit_result);

                    // Test privilege escalation prevention
                    let privilege_result = self.test_privilege_escalation_prevention().await?;
                    results.add_result(privilege_result);

                    Ok(results)
                }

                async fn run_integration_tests(&self, config: &QueryTestConfig, trace_id: &str) -> Result<IntegrationTestResults, TestError> {
                    let mut results = IntegrationTestResults::default();

                    // Test complete query pipeline
                    let pipeline_result = self.test_complete_query_pipeline(config).await?;
                    results.add_result(pipeline_result);

                    // Test database integration
                    let db_result = self.test_database_integration().await?;
                    results.add_result(db_result);

                    // Test cache integration
                    let cache_result = self.test_cache_integration().await?;
                    results.add_result(cache_result);

                    Ok(results)
                }

                async fn run_security_tests(&self, config: &QueryTestConfig, trace_id: &str) -> Result<SecurityTestResults, TestError> {
                    let mut results = SecurityTestResults::default();

                    // Test authentication bypass attempts
                    let auth_bypass_result = self.test_authentication_bypass().await?;
                    results.add_result(auth_bypass_result);

                    // Test authorization bypass attempts
                    let authz_bypass_result = self.test_authorization_bypass().await?;
                    results.add_result(authz_bypass_result);

                    // Test rate limit bypass attempts
                    let rate_bypass_result = self.test_rate_limit_bypass().await?;
                    results.add_result(rate_bypass_result);

                    // Test SQL injection attempts
                    let sql_injection_result = self.test_sql_injection_attempts().await?;
