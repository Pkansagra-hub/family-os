            // Supporting structs for test results
            #[derive(Serialize, Deserialize, Debug, Default)]
            struct UnitTestResults {
                total: usize,
                passed: usize,
                failed: usize,
                errors: Vec<String>,
            }

            impl UnitTestResults {
                fn add_result(&mut self, result: TestResult) {
                    self.total += 1;
                    if result.passed {
                        self.passed += 1;
                    } else {
                        self.failed += 1;
                        self.errors.push(format!("Test {} failed", result.name));
                    }
                }
            }

            #[derive(Serialize, Deserialize, Debug)]
            struct TestResult {
                passed: bool,
                name: String,
                duration_ms: u64,
            }

            #[derive(Serialize, Deserialize, Debug, Default)]
            struct IntegrationTestResults {
                total: usize,
                passed: usize,
                failed: usize,
                errors: Vec<String>,
            }

            impl IntegrationTestResults {
                fn add_result(&mut self, result: TestResult) {
                    self.total += 1;
                    if result.passed {
                        self.passed += 1;
                    } else {
                        self.failed += 1;
                        self.errors.push(format!("Integration test {} failed", result.name));
                    }
                }
            }

            #[derive(Serialize, Deserialize, Debug, Default)]
            struct SecurityTestResults {
                total: usize,
                passed: usize,
                failed: usize,
                authorization_passed: usize,
                rate_limit_passed: usize,
                authentication_passed: usize,
                privilege_escalation_blocked: usize,
                violations: Vec<String>,
                errors: Vec<String>,
            }

            impl SecurityTestResults {
                fn add_result(&mut self, result: TestResult) {
                    self.total += 1;
                    if result.passed {
                        self.passed += 1;
                        // Categorize security tests
                        match result.name.as_str() {
                            "authentication_bypass" => self.authentication_passed += 1,
                            "authorization_bypass" => self.authorization_passed += 1,
                            "rate_limit_bypass" => self.rate_limit_passed += 1,
                            "privilege_escalation_prevention" => self.privilege_escalation_blocked += 1,
                            _ => {}
                        }
                    } else {
                        self.failed += 1;
                        self.errors.push(format!("Security test {} failed", result.name));
                        self.violations.push(format!("Security violation in {}", result.name));
                    }
                }
            }

            #[derive(Serialize, Deserialize, Debug, Default)]
            struct PerformanceTestResults {
                total: usize,
                passed: usize,
                failed: usize,
                results: HashMap<String, PerformanceResult>,
                errors: Vec<String>,
            }

            impl PerformanceTestResults {
                fn add_result(&mut self, name: &str, result: PerformanceResult) {
                    self.total += 1;
                    // Check if performance meets budgets
                    let passed = match name {
                        "session_query" => result.p95_response_time_ms <= 50.0,
                        "user_query" => result.p95_response_time_ms <= 500.0,
                        "gdpr_export" => result.p95_response_time_ms <= 500.0,
                        _ => result.p95_response_time_ms <= 200.0,
                    };

                    if passed {
                        self.passed += 1;
                    } else {
                        self.failed += 1;
                        self.errors.push(format!("Performance test {} failed: P95 {}ms > budget", name, result.p95_response_time_ms));
                    }

                    self.results.insert(name.to_string(), result);
                }
            }

            #[derive(Serialize, Deserialize, Debug, Default)]
            struct ComplianceTestResults {
                total: usize,
                passed: usize,
                failed: usize,
                gdpr_passed: usize,
                hipaa_passed: usize,
                soc2_passed: usize,
                violations: Vec<String>,
                errors: Vec<String>,
            }

            impl ComplianceTestResults {
                fn add_result(&mut self, result: TestResult) {
                    self.total += 1;
                    if result.passed {
                        self.passed += 1;
                        match result.name.as_str() {
                            "gdpr_compliance" => self.gdpr_passed += 1,
                            "hipaa_compliance" => self.hipaa_passed += 1,
                            "soc2_compliance" => self.soc2_passed += 1,
                            _ => {}
                        }
                    } else {
                        self.failed += 1;
                        self.errors.push(format!("Compliance test {} failed", result.name));
                        self.violations.push(format!("Compliance violation in {}", result.name));
                    }
                }
            }

            #[derive(Debug)]
            pub struct TestError {
                pub message: String,
            }

            impl std::fmt::Display for TestError {
                fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                    write!(f, "Test error: {}", self.message)
                }
            }

            impl std::error::Error for TestError {}
          python: |
            from dataclasses import dataclass, field
            from typing import Dict, List, Any, Optional
            import asyncio
            import time
            import logging
            from datetime import datetime

            @dataclass
            class QueryTestConfig:
                environment: str
                test_data_size: int
                concurrent_users: int
                rate_limit_test_duration_seconds: int
                performance_test_iterations: int

            @dataclass
            class TestResults:
                total_tests: int
                passed_tests: int
                failed_tests: int
                skipped_tests: int
                execution_time_ms: int
                coverage_percentage: float
                performance_results: Dict[str, 'PerformanceResult']
                security_results: 'SecurityTestResults'
                compliance_results: 'ComplianceTestResults'
                error_details: List[str]

            @dataclass
            class PerformanceResult:
                test_name: str
                avg_response_time_ms: float
                p95_response_time_ms: float
                throughput_qps: float
                success_rate: float

            @dataclass
            class SecurityTestResults:
                authorization_tests_passed: int
                rate_limit_tests_passed: int
                authentication_tests_passed: int
                privilege_escalation_attempts_blocked: int
                security_violations: List[str]

            @dataclass
            class ComplianceTestResults:
                gdpr_tests_passed: int
                hipaa_tests_passed: int
                soc2_tests_passed: int
                compliance_violations: List[str]

            class QueryTesting:
                """Comprehensive testing suite for receipt query interface"""

                def __init__(self):
                    self.logger = logging.getLogger(__name__)

                async def run_query_tests(
                    self,
                    config: QueryTestConfig,
                    trace_id: str,
                ) -> TestResults:
                    """Execute complete query interface test suite"""
                    start_time = time.time()

                    # Initialize test environment
                    await self._setup_test_environment(config)

                    # Run unit tests
                    unit_results = await self._run_unit_tests(trace_id)

                    # Run integration tests
                    integration_results = await self._run_integration_tests(config, trace_id)

                    # Run security tests
                    security_results = await self._run_security_tests(config, trace_id)

                    # Run performance tests
                    performance_results = await self._run_performance_tests(config, trace_id)

                    # Run compliance tests
                    compliance_results = await self._run_compliance_tests(config, trace_id)

                    # Calculate overall results
                    total_tests = (unit_results.total + integration_results.total +
                                 security_results.total + performance_results.total +
                                 compliance_results.total)

                    passed_tests = (unit_results.passed + integration_results.passed +
                                  security_results.passed + performance_results.passed +
                                  compliance_results.passed)

                    failed_tests = (unit_results.failed + integration_results.failed +
                                  security_results.failed + performance_results.failed +
                                  compliance_results.failed)

                    execution_time_ms = int((time.time() - start_time) * 1000)

                    # Calculate coverage
                    coverage_percentage = await self._calculate_code_coverage()

                    # Aggregate performance results
                    all_performance_results = performance_results.results.copy()

                    # Aggregate security results
                    security_test_results = SecurityTestResults(
                        authorization_tests_passed=security_results.authorization_passed,
                        rate_limit_tests_passed=security_results.rate_limit_passed,
                        authentication_tests_passed=security_results.authentication_passed,
                        privilege_escalation_attempts_blocked=security_results.privilege_escalation_blocked,
                        security_violations=security_results.violations.copy(),
                    )

                    # Aggregate compliance results
                    compliance_test_results = ComplianceTestResults(
                        gdpr_tests_passed=compliance_results.gdpr_passed,
                        hipaa_tests_passed=compliance_results.hipaa_passed,
                        soc2_tests_passed=compliance_results.soc2_passed,
                        compliance_violations=compliance_results.violations.copy(),
                    )

                    # Collect all error details
                    error_details = []
                    error_details.extend(unit_results.errors)
                    error_details.extend(integration_results.errors)
                    error_details.extend(security_results.errors)
                    error_details.extend(performance_results.errors)
                    error_details.extend(compliance_results.errors)

                    results = TestResults(
                        total_tests=total_tests,
                        passed_tests=passed_tests,
                        failed_tests=failed_tests,
                        skipped_tests=0,  # Not implemented
                        execution_time_ms=execution_time_ms,
                        coverage_percentage=coverage_percentage,
                        performance_results=all_performance_results,
                        security_results=security_test_results,
                        compliance_results=compliance_test_results,
                        error_details=error_details,
                    )

                    # Log test completion
                    self.logger.info(
                        f"Query interface tests completed",
                        extra={
                            'trace_id': trace_id,
                            'total_tests': total_tests,
                            'passed_tests': passed_tests,
                            'failed_tests': failed_tests,
                            'execution_time_ms': execution_time_ms,
                            'coverage_percentage': coverage_percentage,
                        }
                    )

                    return results

