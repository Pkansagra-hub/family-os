                async fn run_performance_tests(&self, config: &QueryTestConfig, trace_id: &str) -> Result<PerformanceTestResults, TestError> {
                    let mut results = PerformanceTestResults::default();

                    // Test session query performance
                    let session_perf = self.test_session_query_performance(config).await?;
                    results.add_result("session_query", session_perf);

                    // Test user query performance
                    let user_perf = self.test_user_query_performance(config).await?;
