classes:
  - name: QueryTesting
    description: Comprehensive testing suite for receipt query interface and security controls
    research: ADR-0038d (query interface testing), GDPR Article 15 testing requirements
    performance_budget: <100ms test execution (P95), <50ms per test case
    reliability_properties:
      - test_coverage: 100% code coverage for query interface
      - security_validation: All security controls properly tested
      - performance_validation: Query performance meets budgets
      - compliance_validation: GDPR/HIPAA/SOC2 requirements verified
    methods:
      - name: run_query_tests
        description: Execute complete query interface test suite
        parameters:
          - name: test_config
            type: QueryTestConfig
            description: Test configuration with environment and parameters
          - name: trace_id
            type: string
            description: Cognitive trace ID for test execution
        returns:
          type: TestResults
          description: Comprehensive test results with coverage and performance metrics
        implementation:
          rust: |
            use serde::{Serialize, Deserialize};
            use std::collections::HashMap;
            use std::time::{Duration, Instant};

            #[derive(Serialize, Deserialize, Debug)]
            pub struct QueryTestConfig {
                pub environment: String,
                pub test_data_size: usize,
                pub concurrent_users: usize,
                pub rate_limit_test_duration_seconds: u64,
                pub performance_test_iterations: usize,
            }

            #[derive(Serialize, Deserialize, Debug)]
            pub struct TestResults {
                pub total_tests: usize,
                pub passed_tests: usize,
                pub failed_tests: usize,
                pub skipped_tests: usize,
                pub execution_time_ms: u64,
                pub coverage_percentage: f64,
                pub performance_results: HashMap<String, PerformanceResult>,
                pub security_results: SecurityTestResults,
                pub compliance_results: ComplianceTestResults,
                pub error_details: Vec<String>,
            }

            #[derive(Serialize, Deserialize, Debug)]
            pub struct PerformanceResult {
                pub test_name: String,
                pub avg_response_time_ms: f64,
                pub p95_response_time_ms: f64,
                pub throughput_qps: f64,
                pub success_rate: f64,
            }

            #[derive(Serialize, Deserialize, Debug)]
            pub struct SecurityTestResults {
                pub authorization_tests_passed: usize,
                pub rate_limit_tests_passed: usize,
                pub authentication_tests_passed: usize,
                pub privilege_escalation_attempts_blocked: usize,
                pub security_violations: Vec<String>,
            }

            #[derive(Serialize, Deserialize, Debug)]
            pub struct ComplianceTestResults {
                pub gdpr_tests_passed: usize,
                pub hipaa_tests_passed: usize,
                pub soc2_tests_passed: usize,
                pub compliance_violations: Vec<String>,
            }

            impl QueryTesting {
                pub async fn run_query_tests(
                    &self,
                    config: QueryTestConfig,
                    trace_id: &str,
                ) -> Result<TestResults, TestError> {
                    let start_time = Instant::now();

                    // Initialize test environment
                    self.setup_test_environment(&config).await?;

                    // Run unit tests
                    let unit_results = self.run_unit_tests(trace_id).await?;

                    // Run integration tests
                    let integration_results = self.run_integration_tests(&config, trace_id).await?;

                    // Run security tests
                    let security_results = self.run_security_tests(&config, trace_id).await?;

                    // Run performance tests
                    let performance_results = self.run_performance_tests(&config, trace_id).await?;

                    // Run compliance tests
                    let compliance_results = self.run_compliance_tests(&config, trace_id).await?;

                    // Calculate overall results
                    let total_tests = unit_results.total + integration_results.total +
                                    security_results.total + performance_results.total +
                                    compliance_results.total;

                    let passed_tests = unit_results.passed + integration_results.passed +
                                     security_results.passed + performance_results.passed +
                                     compliance_results.passed;

                    let failed_tests = unit_results.failed + integration_results.failed +
                                     security_results.failed + performance_results.failed +
                                     compliance_results.failed;

                    let execution_time = start_time.elapsed().as_millis() as u64;

                    // Calculate coverage
                    let coverage_percentage = self.calculate_code_coverage().await?;

                    // Aggregate performance results
                    let mut all_performance_results = HashMap::new();
                    all_performance_results.extend(performance_results.results);

                    // Aggregate security results
                    let security_test_results = SecurityTestResults {
                        authorization_tests_passed: security_results.authorization_passed,
                        rate_limit_tests_passed: security_results.rate_limit_passed,
                        authentication_tests_passed: security_results.authentication_passed,
                        privilege_escalation_attempts_blocked: security_results.privilege_escalation_blocked,
                        security_violations: security_results.violations.clone(),
                    };

                    // Aggregate compliance results
                    let compliance_test_results = ComplianceTestResults {
                        gdpr_tests_passed: compliance_results.gdpr_passed,
                        hipaa_tests_passed: compliance_results.hipaa_passed,
                        soc2_tests_passed: compliance_results.soc2_passed,
                        compliance_violations: compliance_results.violations.clone(),
                    };

                    // Collect all error details
                    let mut error_details = Vec::new();
                    error_details.extend(unit_results.errors);
                    error_details.extend(integration_results.errors);
                    error_details.extend(security_results.errors);
                    error_details.extend(performance_results.errors);
                    error_details.extend(compliance_results.errors);

                    let results = TestResults {
                        total_tests,
                        passed_tests,
                        failed_tests,
                        skipped_tests: 0, // Not implemented in this example
                        execution_time_ms: execution_time,
                        coverage_percentage,
                        performance_results: all_performance_results,
                        security_results: security_test_results,
                        compliance_results: compliance_test_results,
                        error_details,
                    };

                    // Log test completion
                    tracing::info!(
                        trace_id = %trace_id,
                        total_tests = total_tests,
                        passed_tests = passed_tests,
                        failed_tests = failed_tests,
                        execution_time_ms = execution_time,
                        coverage_percentage = coverage_percentage,
                        "Query interface tests completed"
                    );

                    Ok(results)
                }

                async fn setup_test_environment(&self, config: &QueryTestConfig) -> Result<(), TestError> {
                    // Create test database with sample receipts
                    self.create_test_database(config.test_data_size).await?;

                    // Setup test users with different permission levels
                    self.create_test_users().await?;

                    // Initialize test caches and rate limit stores
                    self.initialize_test_stores().await?;

                    Ok(())
                }

                async fn run_unit_tests(&self, trace_id: &str) -> Result<UnitTestResults, TestError> {
                    let mut results = UnitTestResults::default();

                    // Test QueryAPI class
                    results += self.test_query_api_class(trace_id).await?;
                    results += self.test_hash_verification_class(trace_id).await?;
                    results += self.test_lru_cache_class(trace_id).await?;
                    results += self.test_gdpr_export_class(trace_id).await?;
                    results += self.test_query_security_class(trace_id).await?;
                    results += self.test_query_observability_class(trace_id).await?;

                    Ok(results)
                }

                async fn test_query_api_class(&self, trace_id: &str) -> Result<UnitTestResults, TestError> {
                    let mut results = UnitTestResults::default();

                    // Test session receipts query
                    let session_result = self.test_session_receipts_query().await?;
                    results.add_result(session_result);

                    // Test user receipts query
                    let user_result = self.test_user_receipts_query().await?;
                    results.add_result(user_result);

                    // Test GDPR export query
