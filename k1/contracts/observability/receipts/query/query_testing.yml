            # Supporting dataclasses for test results
            @dataclass
            class UnitTestResults:
                total: int = 0
                passed: int = 0
                failed: int = 0
                errors: List[str] = field(default_factory=list)

                def __add__(self, other: 'UnitTestResults') -> 'UnitTestResults':
                    return UnitTestResults(
                        total=self.total + other.total,
                        passed=self.passed + other.passed,
                        failed=self.failed + other.failed,
                        errors=self.errors + other.errors,
                    )

                def add_result(self, result: 'TestResult'):
                    self.total += 1
                    if result.passed:
                        self.passed += 1
                    else:
                        self.failed += 1
                        self.errors.append(f"Test {result.name} failed")

            @dataclass
            class TestResult:
                passed: bool
                name: str
                duration_ms: int

            @dataclass
            class IntegrationTestResults:
                total: int = 0
                passed: int = 0
                failed: int = 0
                errors: List[str] = field(default_factory=list)

                def add_result(self, result: TestResult):
                    self.total += 1
                    if result.passed:
                        self.passed += 1
                    else:
                        self.failed += 1
                        self.errors.append(f"Integration test {result.name} failed")

            @dataclass
            class SecurityTestResults:
                total: int = 0
                passed: int = 0
                failed: int = 0
                authorization_passed: int = 0
                rate_limit_passed: int = 0
                authentication_passed: int = 0
                privilege_escalation_blocked: int = 0
                violations: List[str] = field(default_factory=list)
                errors: List[str] = field(default_factory=list)

                def add_result(self, result: TestResult):
                    self.total += 1
                    if result.passed:
                        self.passed += 1
                        # Categorize security tests
                        if result.name == "authentication_bypass":
                            self.authentication_passed += 1
                        elif result.name == "authorization_bypass":
                            self.authorization_passed += 1
                        elif result.name == "rate_limit_bypass":
                            self.rate_limit_passed += 1
                        elif result.name == "privilege_escalation_prevention":
                            self.privilege_escalation_blocked += 1
                    else:
                        self.failed += 1
                        self.errors.append(f"Security test {result.name} failed")
                        self.violations.append(f"Security violation in {result.name}")

            @dataclass
            class PerformanceTestResults:
                total: int = 0
                passed: int = 0
                failed: int = 0
                results: Dict[str, PerformanceResult] = field(default_factory=dict)
                errors: List[str] = field(default_factory=list)

                def add_result(self, name: str, result: PerformanceResult):
                    self.total += 1
                    # Check if performance meets budgets
                    passed = True
                    if name == "session_query" and result.p95_response_time_ms > 50.0:
                        passed = False
                    elif name == "user_query" and result.p95_response_time_ms > 500.0:
                        passed = False
                    elif name == "gdpr_export" and result.p95_response_time_ms > 500.0:
                        passed = False
                    elif result.p95_response_time_ms > 200.0:
                        passed = False

                    if passed:
                        self.passed += 1
                    else:
                        self.failed += 1
                        self.errors.append(f"Performance test {name} failed: P95 {result.p95_response_time_ms}ms > budget")

                    self.results[name] = result

            @dataclass
            class ComplianceTestResults:
                total: int = 0
                passed: int = 0
                failed: int = 0
                gdpr_passed: int = 0
                hipaa_passed: int = 0
                soc2_passed: int = 0
                violations: List[str] = field(default_factory=list)
                errors: List[str] = field(default_factory=list)

                def add_result(self, result: TestResult):
                    self.total += 1
                    if result.passed:
                        self.passed += 1
                        if result.name == "gdpr_compliance":
                            self.gdpr_passed += 1
                        elif result.name == "hipaa_compliance":
                            self.hipaa_passed += 1
                        elif result.name == "soc2_compliance":
                            self.soc2_passed += 1
                    else:
                        self.failed += 1
                        self.errors.append(f"Compliance test {result.name} failed")
                        self.violations.append(f"Compliance violation in {result.name}")

