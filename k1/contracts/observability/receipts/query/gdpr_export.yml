            class GDPRExport:
                """GDPR Article 15 compliance export functionality"""

                def __init__(self, db_connection, receipt_store, observability):
                    self.db = db_connection
                    self.receipt_store = receipt_store
                    self.obs = observability

                async def export_user_data(
                    self,
                    user_id: str,
                    export_format: str = "json",
                    include_processing_log: bool = True,
                    trace_id: str = "",
                ) -> GDPRExportResult:
                    """Export complete user data in GDPR Article 15 format"""
                    start_time = asyncio.get_event_loop().time()
                    export_id = f"gdpr_export_{user_id}_{int(datetime.now(timezone.utc).timestamp())}"

                    # Gather all data sections
                    personal_data = await self._gather_personal_data(user_id)
                    processing_log = await self._gather_processing_log(user_id) if include_processing_log else None
                    rights_exercised = await self._gather_rights_exercised(user_id)
                    data_portability = await self._prepare_data_portability(user_id, export_format)
                    security_measures = await self._gather_security_measures()

                    # Create preliminary export for hashing
                    preliminary_export = {
                        "personal_data": personal_data.__dict__,
                        "processing_log": processing_log.__dict__ if processing_log else None,
                        "rights_exercised": rights_exercised.__dict__,
                        "data_portability": data_portability.__dict__,
                        "security_measures": security_measures.__dict__,
                    }

                    export_hash = self._calculate_export_hash(preliminary_export)

                    duration_ms = (asyncio.get_event_loop().time() - start_time) * 1000

                    export_metadata = ExportMetadata(
                        export_id=export_id,
                        user_id=user_id,
                        export_timestamp=datetime.now(timezone.utc),
                        gdpr_version="GDPR 2016/679",
                        controller_info=self._get_controller_info(),
                        export_format=export_format,
                        data_volume_bytes=len(json.dumps(preliminary_export)),
                        processing_duration_ms=duration_ms,
                        export_hash=export_hash
                    )

                    audit_trail = self._create_audit_trail(export_id, user_id, trace_id)

                    result = GDPRExportResult(
                        export_metadata=export_metadata,
                        personal_data=personal_data,
                        processing_log=processing_log,
                        rights_exercised=rights_exercised,
                        data_portability=data_portability,
                        security_measures=security_measures,
                        audit_trail=audit_trail
                    )

                    # Log compliance export
                    await self._log_gdpr_export(result, trace_id)

                    # Record observability metrics
                    self.obs.record_compliance_check("gdpr_export", "SUCCESS", trace_id)

                    return result

                async def _gather_personal_data(self, user_id: str) -> PersonalDataSection:
                    """Gather all personal data categories for user"""
                    categories = await self._get_data_categories(user_id)
                    recipients = await self._get_data_recipients(user_id)
                    retention_schedule = await self._get_retention_schedule(user_id)
                    automated_decisions = await self._get_automated_decisions(user_id)

                    return PersonalDataSection(
                        categories=categories,
                        recipients=recipients,
                        retention_schedule=retention_schedule,
                        automated_decisions=automated_decisions,
                        data_subjects_rights=[
                            "Right to access",
                            "Right to rectification",
                            "Right to erasure",
                            "Right to data portability",
                            "Right to object",
                            "Rights related to automated decision making"
                        ]
                    )

                async def _gather_processing_log(self, user_id: str) -> ProcessingLogSection:
                    """Gather Article 30 processing log for user"""
                    processing_activities = await self._get_processing_activities(user_id)
                    data_transfers = await self._get_data_transfers(user_id)
                    security_incidents = await self._get_security_incidents(user_id)
                    retention_actions = await self._get_retention_actions(user_id)

                    return ProcessingLogSection(
                        processing_activities=processing_activities,
                        data_transfers=data_transfers,
                        security_incidents=security_incidents,
                        retention_actions=retention_actions
                    )

                async def _gather_rights_exercised(self, user_id: str) -> RightsExercisedSection:
                    """Gather record of GDPR rights exercised by user"""
                    access_requests = await self._get_access_requests(user_id)
                    rectification_requests = await self._get_rectification_requests(user_id)
                    erasure_requests = await self._get_erasure_requests(user_id)
                    portability_requests = await self._get_portability_requests(user_id)

                    return RightsExercisedSection(
                        access_requests=access_requests,
                        rectification_requests=rectification_requests,
                        erasure_requests=erasure_requests,
                        portability_requests=portability_requests
                    )

                async def _prepare_data_portability(self, user_id: str, export_format: str) -> DataPortabilitySection:
                    """Prepare data in portable format"""
                    structured_data = await self._gather_structured_user_data(user_id)
                    data_lineage = await self._build_data_lineage(user_id)

                    return DataPortabilitySection(
                        structured_data=structured_data,
                        machine_readable=True,
                        compatible_formats=["json", "xml", "csv"],
                        data_lineage=data_lineage
                    )

                async def _gather_security_measures(self) -> SecurityMeasuresSection:
                    """Gather information about security measures"""
                    return SecurityMeasuresSection(
                        encryption_methods=[
                            "AES-256 encryption at rest",
                            "TLS 1.3 in transit",
                            "SHA-256 hash chaining for audit trails"
                        ],
                        access_controls=[
                            "Role-based access control",
                            "Multi-factor authentication",
                            "Least privilege principle"
                        ],
                        audit_logging=[
                            "Comprehensive audit trails",
                            "Real-time security monitoring",
                            "Automated incident response"
                        ],
                        data_protection_officer="dpo@familyos.com"
                    )

                def _calculate_export_hash(self, export_data: Dict[str, Any]) -> str:
                    """Calculate SHA-256 hash of export data for integrity"""
                    canonical_json = json.dumps(export_data, sort_keys=True, default=str)
                    return hashlib.sha256(canonical_json.encode()).hexdigest()

                def _create_audit_trail(self, export_id: str, user_id: str, trace_id: str) -> List[AuditEntry]:
                    """Create audit trail for export operation"""
                    return [
                        AuditEntry(
                            timestamp=datetime.now(timezone.utc),
                            action="GDPR_ARTICLE_15_EXPORT",
                            details=f"Complete data export for user {user_id} with ID {export_id}",
                            trace_id=trace_id
                        )
                    ]

                async def _log_gdpr_export(self, export: GDPRExportResult, trace_id: str):
                    """Log GDPR export to audit system"""
                    # Implementation would log to audit database
                    pass

                def _get_controller_info(self) -> ControllerInfo:
                    """Get controller information for export"""
                    return ControllerInfo(
                        controller_name="FamilyOS",
                        controller_address="123 Privacy Street, Data City, DC 12345",
                        data_protection_officer="Data Protection Officer",
                        contact_email="dpo@familyos.com"
                    )

                # Additional helper methods for data gathering would be implemented

    dependencies:
      - name: serde
        description: Data serialization for export formats
      - name: chrono
        description: Date/time handling for export timestamps
      - name: sha2
        description: SHA-256 hashing for export integrity

testing_requirements:
  - unit_tests:
      - export_completeness: All required GDPR sections included
      - data_integrity: Export hash matches calculated hash
      - format_validation: Export conforms to GDPR Article 15 requirements
  - integration_tests:
      - database_queries: All data gathering queries work correctly
      - export_formats: JSON/XML/CSV export formats generated properly
      - audit_logging: Export operations properly audited
  - security_tests:
      - data_leakage: No unauthorized data in exports
      - access_control: Only authorized users can request exports
      - pii_protection: Sensitive data properly redacted

compliance:
  - gdpr: Article 15 (right of access by the data subject)
  - gdpr: Article 20 (right to data portability)
  - gdpr: Article 30 (records of processing activities)
  - hipaa: § 164.524 (access of individuals to protected health information)
  - soc2: CC7.1 (access to systems and data)
