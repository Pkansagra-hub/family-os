classes:
  - name: GDPRExport
    description: GDPR Article 15 compliance export functionality for user data access requests
    research: GDPR Article 15 (right of access), ADR-0038d (compliance export), data portability
    performance_budget: <500ms for user export (P95), export size <50MB per request
    reliability_properties:
      - export_completeness: All user data included in export (100% coverage)
      - data_portability: Export format supports data portability requirements
      - privacy_protection: PII redaction applied based on privacy band
      - audit_completeness: All exports logged for compliance verification
    methods:
      - name: export_user_data
        description: Export complete user data in GDPR Article 15 format
        parameters:
          - name: user_id
            type: string
            description: User identifier for data export
          - name: export_format
            type: string
            description: Export format (json, xml, pdf)
          - name: include_processing_log
            type: bool
            description: Include Article 30 processing log in export
          - name: trace_id
            type: string
            description: Cognitive trace ID for audit trail
        returns:
          type: GDPRExportResult
          description: Complete GDPR export with data, metadata, and compliance information
        implementation:
          rust: |
            use serde::{Serialize, Deserialize};
            use chrono::{DateTime, Utc};
            use std::collections::HashMap;
            use sha2::{Sha256, Digest};

            #[derive(Serialize, Deserialize)]
            pub struct GDPRExportResult {
                pub export_metadata: ExportMetadata,
                pub personal_data: PersonalDataSection,
                pub processing_log: Option<ProcessingLogSection>,
                pub rights_exercised: RightsExercisedSection,
                pub data_portability: DataPortabilitySection,
                pub security_measures: SecurityMeasuresSection,
                pub audit_trail: Vec<AuditEntry>,
            }

            #[derive(Serialize, Deserialize)]
            pub struct ExportMetadata {
                pub export_id: String,
                pub user_id: String,
                pub export_timestamp: DateTime<Utc>,
                pub gdpr_version: String,
                pub controller_info: ControllerInfo,
                pub export_format: String,
                pub data_volume_bytes: usize,
                pub processing_duration_ms: f64,
                pub export_hash: String,
            }

            #[derive(Serialize, Deserialize)]
            pub struct PersonalDataSection {
                pub categories: Vec<DataCategory>,
                pub recipients: Vec<DataRecipient>,
                pub retention_schedule: RetentionSchedule,
                pub automated_decisions: Vec<AutomatedDecision>,
                pub data_subjects_rights: Vec<String>,
            }

            #[derive(Serialize, Deserialize)]
            pub struct ProcessingLogSection {
                pub processing_activities: Vec<ProcessingActivity>,
                pub data_transfers: Vec<DataTransfer>,
                pub security_incidents: Vec<SecurityIncident>,
                pub retention_actions: Vec<RetentionAction>,
            }

            #[derive(Serialize, Deserialize)]
            pub RightsExercisedSection {
                pub access_requests: Vec<AccessRequest>,
                pub rectification_requests: Vec<RectificationRequest>,
                pub erasure_requests: Vec<ErasureRequest>,
                pub portability_requests: Vec<PortabilityRequest>,
            }

            #[derive(Serialize, Deserialize)]
            pub DataPortabilitySection {
                pub structured_data: serde_json::Value,
                pub machine_readable: bool,
                pub compatible_formats: Vec<String>,
                pub data_lineage: Vec<DataLineageEntry>,
            }

            #[derive(Serialize, Deserialize)]
            pub SecurityMeasuresSection {
                pub encryption_methods: Vec<String>,
                pub access_controls: Vec<String>,
                pub audit_logging: Vec<String>,
                pub data_protection_officer: String,
            }

            #[derive(Serialize, Deserialize)]
            pub DataCategory {
                pub category_name: String,
                pub data_points: Vec<String>,
                pub legal_basis: String,
                pub purpose: String,
                pub retention_period_days: i32,
            }

            #[derive(Serialize, Deserialize)]
            pub DataRecipient {
                pub recipient_name: String,
                pub recipient_type: String,
                pub data_categories: Vec<String>,
                pub transfer_mechanism: String,
                pub adequacy_decision: Option<String>,
            }

            #[derive(Serialize, Deserialize)]
            pub RetentionSchedule {
                pub privacy_band: String,
                pub retention_days: i32,
                pub grace_period_days: i32,
                pub next_review_date: DateTime<Utc>,
                pub legal_basis: String,
            }

            #[derive(Serialize, Deserialize)]
            pub AutomatedDecision {
                pub decision_type: String,
                pub logic_description: String,
                pub significance_consequences: String,
                pub right_to_human_intervention: bool,
            }

            #[derive(Serialize, Deserialize)]
            pub ProcessingActivity {
                pub activity_id: String,
                pub purpose: String,
                pub categories_processed: Vec<String>,
                pub legal_basis: String,
                pub timestamp: DateTime<Utc>,
                pub recipients: Vec<String>,
            }

            #[derive(Serialize, Deserialize)]
            pub DataTransfer {
                pub transfer_id: String,
                pub destination: String,
                pub data_categories: Vec<String>,
                pub legal_basis: String,
                pub safeguards: Vec<String>,
                pub timestamp: DateTime<Utc>,
            }

            #[derive(Serialize, Deserialize)]
            pub SecurityIncident {
                pub incident_id: String,
                pub description: String,
                pub affected_data: Vec<String>,
                pub remediation_actions: Vec<String>,
                pub timestamp: DateTime<Utc>,
            }

            #[derive(Serialize, Deserialize)]
            pub RetentionAction {
                pub action_id: String,
                pub action_type: String,
                pub data_categories: Vec<String>,
                pub retention_days: i32,
                pub timestamp: DateTime<Utc>,
            }

            #[derive(Serialize, Deserialize)]
            pub AccessRequest {
                pub request_id: String,
                pub timestamp: DateTime<Utc>,
                pub response_time_days: i32,
                pub data_provided: bool,
            }

            #[derive(Serialize, Deserialize)]
            pub RectificationRequest {
                pub request_id: String,
                pub timestamp: DateTime<Utc>,
                pub fields_rectified: Vec<String>,
                pub completion_status: String,
            }

            #[derive(Serialize, Deserialize)]
            pub ErasureRequest {
                pub request_id: String,
                pub timestamp: DateTime<Utc>,
                pub data_erased: Vec<String>,
                pub completion_status: String,
            }

            #[derive(Serialize, Deserialize)]
            pub PortabilityRequest {
                pub request_id: String,
                pub timestamp: DateTime<Utc>,
                pub data_exported: Vec<String>,
                pub format_provided: String,
            }

            #[derive(Serialize, Deserialize)]
            pub DataLineageEntry {
                pub data_point: String,
                pub source_system: String,
                pub collection_timestamp: DateTime<Utc>,
                pub processing_steps: Vec<String>,
            }

            #[derive(Serialize, Deserialize)]
            pub ControllerInfo {
                pub controller_name: String,
                pub controller_address: String,
                pub data_protection_officer: String,
                pub contact_email: String,
            }

            impl GDPRExport {
                pub async fn export_user_data(
                    &self,
                    user_id: &str,
                    export_format: &str,
                    include_processing_log: bool,
                    trace_id: &str,
                ) -> Result<GDPRExportResult, GDPRExportError> {
                    let start_time = std::time::Instant::now();
                    let export_id = format!("gdpr_export_{}_{}", user_id, Utc::now().timestamp());

                    // Gather all user data sections
                    let personal_data = self.gather_personal_data(user_id).await?;
                    let processing_log = if include_processing_log {
                        Some(self.gather_processing_log(user_id).await?)
                    } else {
                        None
                    };
                    let rights_exercised = self.gather_rights_exercised(user_id).await?;
                    let data_portability = self.prepare_data_portability(user_id, export_format).await?;
                    let security_measures = self.gather_security_measures().await?;

                    // Calculate export hash for integrity
                    let export_data = serde_json::to_value(&GDPRExportResult {
                        export_metadata: ExportMetadata::default(),
                        personal_data: personal_data.clone(),
                        processing_log: processing_log.clone(),
                        rights_exercised: rights_exercised.clone(),
                        data_portability: data_portability.clone(),
                        security_measures: security_measures.clone(),
                        audit_trail: vec![],
                    })?;
                    let export_hash = self.calculate_export_hash(&export_data);

                    let export_metadata = ExportMetadata {
                        export_id: export_id.clone(),
                        user_id: user_id.to_string(),
                        export_timestamp: Utc::now(),
                        gdpr_version: "GDPR 2016/679".to_string(),
                        controller_info: self.get_controller_info(),
                        export_format: export_format.to_string(),
                        data_volume_bytes: serde_json::to_string(&export_data)?.len(),
                        processing_duration_ms: start_time.elapsed().as_millis() as f64,
                        export_hash,
                    };

                    let audit_trail = self.create_audit_trail(&export_id, user_id, trace_id)?;

                    let result = GDPRExportResult {
                        export_metadata,
                        personal_data,
                        processing_log,
                        rights_exercised,
                        data_portability,
                        security_measures,
                        audit_trail,
                    };

                    // Log compliance export
                    self.log_gdpr_export(&result, trace_id)?;

                    Ok(result)
                }

                async fn gather_personal_data(&self, user_id: &str) -> Result<PersonalDataSection, GDPRExportError> {
                    // Query all personal data categories for user
                    let categories = self.get_data_categories(user_id).await?;
                    let recipients = self.get_data_recipients(user_id).await?;
                    let retention_schedule = self.get_retention_schedule(user_id).await?;
                    let automated_decisions = self.get_automated_decisions(user_id).await?;
                    let data_subjects_rights = vec![
                        "Right to access".to_string(),
                        "Right to rectification".to_string(),
                        "Right to erasure".to_string(),
                        "Right to data portability".to_string(),
                        "Right to object".to_string(),
                        "Rights related to automated decision making".to_string(),
                    ];

                    Ok(PersonalDataSection {
                        categories,
                        recipients,
                        retention_schedule,
                        automated_decisions,
                        data_subjects_rights,
                    })
                }

                async fn gather_processing_log(&self, user_id: &str) -> Result<ProcessingLogSection, GDPRExportError> {
                    let processing_activities = self.get_processing_activities(user_id).await?;
                    let data_transfers = self.get_data_transfers(user_id).await?;
                    let security_incidents = self.get_security_incidents(user_id).await?;
                    let retention_actions = self.get_retention_actions(user_id).await?;

                    Ok(ProcessingLogSection {
                        processing_activities,
                        data_transfers,
                        security_incidents,
                        retention_actions,
                    })
                }

                async fn gather_rights_exercised(&self, user_id: &str) -> Result<RightsExercisedSection, GDPRExportError> {
                    let access_requests = self.get_access_requests(user_id).await?;
                    let rectification_requests = self.get_rectification_requests(user_id).await?;
                    let erasure_requests = self.get_erasure_requests(user_id).await?;
                    let portability_requests = self.get_portability_requests(user_id).await?;

                    Ok(RightsExercisedSection {
                        access_requests,
                        rectification_requests,
                        erasure_requests,
                        portability_requests,
                    })
                }

                async fn prepare_data_portability(
                    &self,
                    user_id: &str,
                    export_format: &str,
                ) -> Result<DataPortabilitySection, GDPRExportError> {
                    // Gather all user data in structured format
                    let user_data = self.gather_structured_user_data(user_id).await?;
                    let data_lineage = self.build_data_lineage(user_id).await?;

                    Ok(DataPortabilitySection {
                        structured_data: user_data,
                        machine_readable: true,
                        compatible_formats: vec!["json".to_string(), "xml".to_string(), "csv".to_string()],
                        data_lineage,
                    })
                }

                async fn gather_security_measures(&self) -> Result<SecurityMeasuresSection, GDPRExportError> {
                    Ok(SecurityMeasuresSection {
                        encryption_methods: vec![
                            "AES-256 encryption at rest".to_string(),
                            "TLS 1.3 in transit".to_string(),
                            "SHA-256 hash chaining".to_string(),
                        ],
                        access_controls: vec![
                            "Role-based access control".to_string(),
                            "Multi-factor authentication".to_string(),
                            "Least privilege principle".to_string(),
                        ],
                        audit_logging: vec![
                            "Comprehensive audit trails".to_string(),
                            "Real-time security monitoring".to_string(),
                            "Automated incident response".to_string(),
                        ],
                        data_protection_officer: "dpo@familyos.com".to_string(),
                    })
                }

                fn calculate_export_hash(&self, export_data: &serde_json::Value) -> String {
                    let canonical_json = serde_json::to_string(export_data).unwrap_or_default();
                    let mut hasher = Sha256::new();
                    hasher.update(canonical_json.as_bytes());
                    format!("{:x}", hasher.finalize())
                }

                fn create_audit_trail(
                    &self,
                    export_id: &str,
                    user_id: &str,
                    trace_id: &str,
                ) -> Result<Vec<AuditEntry>, GDPRExportError> {
                    Ok(vec![
                        AuditEntry {
                            timestamp: Utc::now(),
                            action: "GDPR_ARTICLE_15_EXPORT".to_string(),
                            details: format!("Complete data export for user {} with ID {}", user_id, export_id),
                            trace_id: trace_id.to_string(),
                        }
                    ])
                }

                fn log_gdpr_export(&self, export: &GDPRExportResult, trace_id: &str) -> Result<(), GDPRExportError> {
                    // Log to compliance audit system
                    tracing::info!(
                        export_id = %export.export_metadata.export_id,
                        user_id = %export.export_metadata.user_id,
                        data_volume_bytes = export.export_metadata.data_volume_bytes,
                        trace_id = %trace_id,
                        "GDPR Article 15 data export completed"
                    );
                    Ok(())
                }

                fn get_controller_info(&self) -> ControllerInfo {
                    ControllerInfo {
                        controller_name: "FamilyOS".to_string(),
                        controller_address: "123 Privacy Street, Data City, DC 12345".to_string(),
                        data_protection_officer: "Data Protection Officer".to_string(),
                        contact_email: "dpo@familyos.com".to_string(),
                    }
                }

                // Additional helper methods would be implemented for data gathering
            }
          python: |
            from dataclasses import dataclass, field
            from typing import List, Dict, Any, Optional
            from datetime import datetime, timezone
            import json
            import hashlib
            import asyncio

            @dataclass
            class GDPRExportResult:
                export_metadata: 'ExportMetadata'
                personal_data: 'PersonalDataSection'
                processing_log: Optional['ProcessingLogSection']
                rights_exercised: 'RightsExercisedSection'
                data_portability: 'DataPortabilitySection'
                security_measures: 'SecurityMeasuresSection'
                audit_trail: List['AuditEntry']

            @dataclass
            class ExportMetadata:
                export_id: str
                user_id: str
                export_timestamp: datetime
                gdpr_version: str
                controller_info: 'ControllerInfo'
