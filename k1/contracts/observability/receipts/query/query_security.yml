classes:
  - name: QuerySecurity
    description: Security controls and access management for receipt query operations
    research: ADR-0038d (query interface), GDPR Article 15 access controls, rate limiting
    performance_budget: <1ms per authorization check (P95), <0.5ms per rate limit check
    reliability_properties:
      - access_control: All queries properly authenticated and authorized
      - rate_limiting: Query rates stay within configured limits
      - audit_completeness: All security events logged for compliance
      - privacy_protection: PII access properly controlled based on privacy bands
    methods:
      - name: authorize_query
        description: Authorize a receipt query based on user permissions and privacy bands
        parameters:
          - name: user_id
            type: string
            description: User requesting the query
          - name: query_type
            type: string
            description: Type of query being requested
          - name: target_user_id
            type: string
            description: User whose data is being queried (for access checks)
          - name: privacy_band
            type: string
            description: Privacy band of the target user
          - name: trace_id
            type: string
            description: Cognitive trace ID for audit trail
        returns:
          type: AuthorizationResult
          description: Result of authorization check with permissions and restrictions
        implementation:
          rust: |
            use serde::{Serialize, Deserialize};
            use std::collections::HashMap;

            #[derive(Serialize, Deserialize, Debug)]
            pub struct AuthorizationResult {
                pub authorized: bool,
                pub permissions: Vec<String>,
                pub restrictions: Vec<String>,
                pub privacy_access_level: String,
                pub rate_limit_status: RateLimitStatus,
                pub audit_required: bool,
                pub justification_required: bool,
            }

            #[derive(Serialize, Deserialize, Debug)]
            pub struct RateLimitStatus {
                pub within_limit: bool,
                pub current_usage: u32,
                pub limit: u32,
                pub reset_time_seconds: i64,
                pub window_seconds: u32,
            }

            impl QuerySecurity {
                pub async fn authorize_query(
                    &self,
                    user_id: &str,
                    query_type: &str,
                    target_user_id: &str,
                    privacy_band: &str,
                    trace_id: &str,
                ) -> Result<AuthorizationResult, SecurityError> {
                    // Check rate limiting first
                    let rate_limit_status = self.check_rate_limit(user_id, query_type).await?;

                    if !rate_limit_status.within_limit {
                        self.log_rate_limit_exceeded(user_id, query_type, trace_id).await;
                        return Ok(AuthorizationResult {
                            authorized: false,
                            permissions: vec![],
                            restrictions: vec!["RATE_LIMIT_EXCEEDED".to_string()],
                            privacy_access_level: "NONE".to_string(),
                            rate_limit_status,
                            audit_required: true,
                            justification_required: false,
                        });
                    }

                    // Check authentication
                    let user_permissions = self.get_user_permissions(user_id).await?;
                    let is_authenticated = self.verify_user_authentication(user_id).await?;

                    if !is_authenticated {
                        self.log_unauthorized_access(user_id, "NOT_AUTHENTICATED", trace_id).await;
                        return Ok(AuthorizationResult {
                            authorized: false,
                            permissions: vec![],
                            restrictions: vec!["NOT_AUTHENTICATED".to_string()],
                            privacy_access_level: "NONE".to_string(),
                            rate_limit_status,
                            audit_required: true,
                            justification_required: false,
                        });
                    }

                    // Check authorization based on query type and privacy band
                    let authorization_result = match query_type {
                        "session_receipts" => {
                            self.authorize_session_query(user_id, target_user_id, privacy_band, &user_permissions).await?
                        }
                        "user_receipts" => {
                            self.authorize_user_query(user_id, target_user_id, privacy_band, &user_permissions).await?
                        }
                        "gdpr_export" => {
                            self.authorize_gdpr_export(user_id, target_user_id, privacy_band, &user_permissions).await?
                        }
                        _ => {
                            self.log_unauthorized_access(user_id, "UNKNOWN_QUERY_TYPE", trace_id).await;
                            return Ok(AuthorizationResult {
                                authorized: false,
                                permissions: vec![],
                                restrictions: vec!["UNKNOWN_QUERY_TYPE".to_string()],
                                privacy_access_level: "NONE".to_string(),
                                rate_limit_status,
                                audit_required: true,
                                justification_required: false,
                            });
                        }
                    };

                    // Log authorization decision
                    self.log_authorization_decision(
                        user_id,
                        query_type,
                        target_user_id,
                        authorization_result.authorized,
                        trace_id,
                    ).await;

                    Ok(authorization_result)
                }

                async fn authorize_session_query(
                    &self,
                    user_id: &str,
                    target_user_id: &str,
                    privacy_band: &str,
                    permissions: &[String],
                ) -> Result<AuthorizationResult, SecurityError> {
                    let mut authorized = false;
                    let mut access_permissions = Vec::new();
                    let mut restrictions = Vec::new();
                    let mut privacy_access_level = "NONE".to_string();
                    let mut audit_required = false;
                    let mut justification_required = false;

                    // Users can always access their own session receipts
                    if user_id == target_user_id {
                        authorized = true;
                        access_permissions.push("OWN_SESSION_ACCESS".to_string());
                        privacy_access_level = "FULL".to_string();
                    }
                    // Administrators can access any session receipts
                    else if permissions.contains(&"ADMIN_RECEIPT_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("ADMIN_SESSION_ACCESS".to_string());
                        privacy_access_level = "FULL".to_string();
                        audit_required = true;
                        justification_required = true;

                        // Additional restrictions based on privacy band
                        match privacy_band {
                            "RED" => {
                                restrictions.push("ADMIN_RED_BAND_ACCESS".to_string());
                                restrictions.push("ENHANCED_AUDIT_REQUIRED".to_string());
                            }
                            "AMBER" => {
                                restrictions.push("ADMIN_AMBER_BAND_ACCESS".to_string());
                                audit_required = true;
                            }
                            _ => {}
                        }
                    }
                    // Support agents can access customer session receipts with restrictions
                    else if permissions.contains(&"SUPPORT_RECEIPT_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("SUPPORT_SESSION_ACCESS".to_string());
                        audit_required = true;

                        // Privacy band restrictions for support
                        match privacy_band {
                            "GREEN" => {
                                privacy_access_level = "FULL".to_string();
                            }
                            "AMBER" => {
                                privacy_access_level = "MASKED".to_string();
                                restrictions.push("PII_MASKED".to_string());
                            }
                            "RED" => {
                                authorized = false; // Support cannot access RED band data
                                restrictions.push("RED_BAND_DENIED".to_string());
                            }
                            _ => {}
                        }
                    }

                    Ok(AuthorizationResult {
                        authorized,
                        permissions: access_permissions,
                        restrictions,
                        privacy_access_level,
                        rate_limit_status: RateLimitStatus::default(), // Will be set by caller
                        audit_required,
                        justification_required,
                    })
                }

                async fn authorize_user_query(
                    &self,
                    user_id: &str,
                    target_user_id: &str,
                    privacy_band: &str,
                    permissions: &[String],
                ) -> Result<AuthorizationResult, SecurityError> {
                    // Similar logic to session queries but for user-level access
                    // More restrictive due to broader data access
                    let mut authorized = false;
                    let mut access_permissions = Vec::new();
                    let mut restrictions = Vec::new();
                    let mut privacy_access_level = "NONE".to_string();
                    let mut audit_required = true; // User queries always audited
                    let mut justification_required = false;

                    // Users can access their own data
                    if user_id == target_user_id {
                        authorized = true;
                        access_permissions.push("OWN_USER_ACCESS".to_string());
                        privacy_access_level = "FULL".to_string();
                        justification_required = false;
                    }
                    // GDPR data access requests
                    else if permissions.contains(&"GDPR_DATA_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("GDPR_ACCESS".to_string());
                        privacy_access_level = "FULL".to_string(); // GDPR requires full access
                        audit_required = true;
                        justification_required = true;
                        restrictions.push("GDPR_COMPLIANCE_REQUIRED".to_string());
                    }
                    // Legal/comppliance access
                    else if permissions.contains(&"LEGAL_RECEIPT_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("LEGAL_ACCESS".to_string());
                        privacy_access_level = "FULL".to_string();
                        audit_required = true;
                        justification_required = true;
                        restrictions.push("LEGAL_HOLD_REQUIRED".to_string());
                    }

                    Ok(AuthorizationResult {
                        authorized,
                        permissions: access_permissions,
                        restrictions,
                        privacy_access_level,
                        rate_limit_status: RateLimitStatus::default(),
                        audit_required,
                        justification_required,
                    })
                }

                async fn authorize_gdpr_export(
                    &self,
                    user_id: &str,
                    target_user_id: &str,
                    privacy_band: &str,
                    permissions: &[String],
                ) -> Result<AuthorizationResult, SecurityError> {
                    // GDPR exports have the most stringent requirements
                    let mut authorized = false;
                    let mut access_permissions = Vec::new();
                    let mut restrictions = Vec::new();
                    let mut privacy_access_level = "FULL".to_string(); // GDPR requires complete data
                    let mut audit_required = true;
                    let mut justification_required = true;

                    // Users can export their own data
                    if user_id == target_user_id {
                        authorized = true;
                        access_permissions.push("GDPR_SELF_EXPORT".to_string());
                        justification_required = false; // Self-export doesn't require justification
                    }
                    // Data protection officers can export any user's data
                    else if permissions.contains(&"DPO_EXPORT_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("DPO_EXPORT_ACCESS".to_string());
                        restrictions.push("DPO_COMPLIANCE_REQUIRED".to_string());
                    }
                    // Legal basis for third-party access
                    else if permissions.contains(&"GDPR_LEGAL_BASIS_ACCESS".to_string()) {
                        authorized = true;
                        access_permissions.push("GDPR_LEGAL_BASIS_EXPORT".to_string());
                        restrictions.push("LEGAL_BASIS_DOCUMENTATION_REQUIRED".to_string());
                    }

                    Ok(AuthorizationResult {
                        authorized,
                        permissions: access_permissions,
                        restrictions,
                        privacy_access_level,
                        rate_limit_status: RateLimitStatus::default(),
                        audit_required,
                        justification_required,
                    })
                }

                async fn check_rate_limit(
                    &self,
                    user_id: &str,
                    query_type: &str,
                ) -> Result<RateLimitStatus, SecurityError> {
                    // Rate limiting logic based on query type
                    let (limit, window_seconds) = match query_type {
                        "session_receipts" => (100, 60), // 100 per minute
                        "user_receipts" => (10, 60),    // 10 per minute
                        "gdpr_export" => (1, 3600),     // 1 per hour
                        _ => (50, 60),                  // Default
                    };

                    // Check current usage (would query Redis/database)
                    let current_usage = self.get_current_usage(user_id, query_type, window_seconds).await?;

                    let within_limit = current_usage < limit;

                    Ok(RateLimitStatus {
                        within_limit,
                        current_usage,
                        limit,
                        reset_time_seconds: self.get_reset_time(window_seconds),
                        window_seconds,
                    })
                }

                async fn get_user_permissions(&self, user_id: &str) -> Result<Vec<String>, SecurityError> {
                    // Query user permissions from database
                    // Implementation would check user roles and permissions
                    Ok(vec!["BASIC_USER".to_string()]) // Placeholder
                }

                async fn verify_user_authentication(&self, user_id: &str) -> Result<bool, SecurityError> {
                    // Verify user authentication (JWT, session, etc.)
                    // Implementation would validate auth tokens
                    Ok(true) // Placeholder
                }

                async fn get_current_usage(
                    &self,
                    user_id: &str,
                    query_type: &str,
                    window_seconds: u32,
                ) -> Result<u32, SecurityError> {
                    // Query current usage from rate limit store
                    // Implementation would check Redis or database
                    Ok(0) // Placeholder
                }

                fn get_reset_time(&self, window_seconds: u32) -> i64 {
                    // Calculate next reset time
                    (chrono::Utc::now().timestamp() + window_seconds as i64)
                }

                async fn log_authorization_decision(
                    &self,
                    user_id: &str,
                    query_type: &str,
                    target_user_id: &str,
                    authorized: bool,
                    trace_id: &str,
                ) {
                    // Log authorization decision for audit
                    tracing::info!(
                        user_id = %user_id,
                        query_type = %query_type,
                        target_user_id = %target_user_id,
                        authorized = authorized,
                        trace_id = %trace_id,
                        "Query authorization decision"
                    );
                }

                async fn log_unauthorized_access(
                    &self,
                    user_id: &str,
                    reason: &str,
                    trace_id: &str,
                ) {
                    // Log unauthorized access attempt
                    tracing::warn!(
                        user_id = %user_id,
                        reason = %reason,
                        trace_id = %trace_id,
                        "Unauthorized query access attempt"
                    );
                }

                async fn log_rate_limit_exceeded(
                    &self,
                    user_id: &str,
                    query_type: &str,
                    trace_id: &str,
                ) {
                    // Log rate limit violation
                    tracing::warn!(
                        user_id = %user_id,
                        query_type = %query_type,
                        trace_id = %trace_id,
                        "Rate limit exceeded for query"
                    );
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import List, Dict, Any, Optional
            import asyncio
            import time
            import logging

            @dataclass
            class AuthorizationResult:
                authorized: bool
                permissions: List[str]
                restrictions: List[str]
                privacy_access_level: str
                rate_limit_status: 'RateLimitStatus'
                audit_required: bool
                justification_required: bool

            @dataclass
            class RateLimitStatus:
                within_limit: bool
                current_usage: int
                limit: int
                reset_time_seconds: int
                window_seconds: int

            class QuerySecurity:
                """Security controls for receipt query operations"""

                def __init__(self, rate_limit_store=None, permission_store=None):
                    self.rate_limit_store = rate_limit_store
                    self.permission_store = permission_store
                    self.logger = logging.getLogger(__name__)

                async def authorize_query(
                    self,
                    user_id: str,
                    query_type: str,
                    target_user_id: str,
                    privacy_band: str,
                    trace_id: str,
                ) -> AuthorizationResult:
                    """Authorize a receipt query with comprehensive security checks"""

                    # Check rate limiting first
                    rate_limit_status = await self._check_rate_limit(user_id, query_type)

                    if not rate_limit_status.within_limit:
                        await self._log_rate_limit_exceeded(user_id, query_type, trace_id)
                        return AuthorizationResult(
                            authorized=False,
                            permissions=[],
                            restrictions=["RATE_LIMIT_EXCEEDED"],
                            privacy_access_level="NONE",
                            rate_limit_status=rate_limit_status,
                            audit_required=True,
                            justification_required=False,
                        )

                    # Check authentication
                    user_permissions = await self._get_user_permissions(user_id)
                    is_authenticated = await self._verify_user_authentication(user_id)

                    if not is_authenticated:
                        await self._log_unauthorized_access(user_id, "NOT_AUTHENTICATED", trace_id)
                        return AuthorizationResult(
                            authorized=False,
                            permissions=[],
                            restrictions=["NOT_AUTHENTICATED"],
                            privacy_access_level="NONE",
                            rate_limit_status=rate_limit_status,
                            audit_required=True,
                            justification_required=False,
                        )

                    # Check authorization based on query type
                    if query_type == "session_receipts":
                        auth_result = await self._authorize_session_query(
                            user_id, target_user_id, privacy_band, user_permissions
                        )
                    elif query_type == "user_receipts":
                        auth_result = await self._authorize_user_query(
                            user_id, target_user_id, privacy_band, user_permissions
                        )
                    elif query_type == "gdpr_export":
                        auth_result = await self._authorize_gdpr_export(
                            user_id, target_user_id, privacy_band, user_permissions
                        )
                    else:
                        await self._log_unauthorized_access(user_id, "UNKNOWN_QUERY_TYPE", trace_id)
                        return AuthorizationResult(
                            authorized=False,
                            permissions=[],
                            restrictions=["UNKNOWN_QUERY_TYPE"],
                            privacy_access_level="NONE",
                            rate_limit_status=rate_limit_status,
                            audit_required=True,
                            justification_required=False,
                        )

                    # Set rate limit status in result
                    auth_result.rate_limit_status = rate_limit_status

                    # Log authorization decision
                    await self._log_authorization_decision(
                        user_id, query_type, target_user_id, auth_result.authorized, trace_id
                    )

                    return auth_result

                async def _authorize_session_query(
                    self,
                    user_id: str,
                    target_user_id: str,
                    privacy_band: str,
                    permissions: List[str],
                ) -> AuthorizationResult:
                    """Authorize session receipt query"""
                    authorized = False
                    access_permissions = []
                    restrictions = []
                    privacy_access_level = "NONE"
                    audit_required = False
                    justification_required = False

                    # Users can always access their own session receipts
                    if user_id == target_user_id:
                        authorized = True
                        access_permissions.append("OWN_SESSION_ACCESS")
                        privacy_access_level = "FULL"
                    # Administrators can access any session receipts
                    elif "ADMIN_RECEIPT_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("ADMIN_SESSION_ACCESS")
                        privacy_access_level = "FULL"
                        audit_required = True
                        justification_required = True

                        # Additional restrictions based on privacy band
                        if privacy_band == "RED":
                            restrictions.extend(["ADMIN_RED_BAND_ACCESS", "ENHANCED_AUDIT_REQUIRED"])
                        elif privacy_band == "AMBER":
                            restrictions.append("ADMIN_AMBER_BAND_ACCESS")
                            audit_required = True
                    # Support agents can access customer session receipts with restrictions
                    elif "SUPPORT_RECEIPT_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("SUPPORT_SESSION_ACCESS")
                        audit_required = True

                        # Privacy band restrictions for support
                        if privacy_band == "GREEN":
                            privacy_access_level = "FULL"
                        elif privacy_band == "AMBER":
                            privacy_access_level = "MASKED"
                            restrictions.append("PII_MASKED")
                        elif privacy_band == "RED":
                            authorized = False  # Support cannot access RED band data
                            restrictions.append("RED_BAND_DENIED")

                    return AuthorizationResult(
                        authorized=authorized,
                        permissions=access_permissions,
                        restrictions=restrictions,
                        privacy_access_level=privacy_access_level,
                        rate_limit_status=RateLimitStatus(False, 0, 0, 0, 0),  # Placeholder
                        audit_required=audit_required,
                        justification_required=justification_required,
                    )

                async def _authorize_user_query(
                    self,
                    user_id: str,
                    target_user_id: str,
                    privacy_band: str,
                    permissions: List[str],
                ) -> AuthorizationResult:
                    """Authorize user receipt query"""
                    authorized = False
                    access_permissions = []
                    restrictions = []
                    privacy_access_level = "NONE"
                    audit_required = True  # User queries always audited
                    justification_required = False

                    # Users can access their own data
                    if user_id == target_user_id:
                        authorized = True
                        access_permissions.append("OWN_USER_ACCESS")
                        privacy_access_level = "FULL"
                    # GDPR data access requests
                    elif "GDPR_DATA_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("GDPR_ACCESS")
                        privacy_access_level = "FULL"  # GDPR requires full access
                        justification_required = True
                        restrictions.append("GDPR_COMPLIANCE_REQUIRED")
                    # Legal/comppliance access
                    elif "LEGAL_RECEIPT_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("LEGAL_ACCESS")
                        privacy_access_level = "FULL"
                        justification_required = True
                        restrictions.append("LEGAL_HOLD_REQUIRED")

                    return AuthorizationResult(
                        authorized=authorized,
                        permissions=access_permissions,
                        restrictions=restrictions,
                        privacy_access_level=privacy_access_level,
                        rate_limit_status=RateLimitStatus(False, 0, 0, 0, 0),  # Placeholder
                        audit_required=audit_required,
                        justification_required=justification_required,
                    )

                async def _authorize_gdpr_export(
                    self,
                    user_id: str,
                    target_user_id: str,
                    privacy_band: str,
                    permissions: List[str],
                ) -> AuthorizationResult:
                    """Authorize GDPR export request"""
                    authorized = False
                    access_permissions = []
                    restrictions = []
                    privacy_access_level = "FULL"  # GDPR requires complete data
                    audit_required = True
                    justification_required = True

                    # Users can export their own data
                    if user_id == target_user_id:
                        authorized = True
                        access_permissions.append("GDPR_SELF_EXPORT")
                        justification_required = False  # Self-export doesn't require justification
                    # Data protection officers can export any user's data
                    elif "DPO_EXPORT_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("DPO_EXPORT_ACCESS")
                        restrictions.append("DPO_COMPLIANCE_REQUIRED")
                    # Legal basis for third-party access
                    elif "GDPR_LEGAL_BASIS_ACCESS" in permissions:
                        authorized = True
                        access_permissions.append("GDPR_LEGAL_BASIS_EXPORT")
                        restrictions.append("LEGAL_BASIS_DOCUMENTATION_REQUIRED")

                    return AuthorizationResult(
                        authorized=authorized,
                        permissions=access_permissions,
                        restrictions=restrictions,
                        privacy_access_level=privacy_access_level,
                        rate_limit_status=RateLimitStatus(False, 0, 0, 0, 0),  # Placeholder
                        audit_required=audit_required,
                        justification_required=justification_required,
                    )

                async def _check_rate_limit(self, user_id: str, query_type: str) -> RateLimitStatus:
                    """Check if user is within rate limits"""
                    # Rate limiting based on query type
                    if query_type == "session_receipts":
                        limit, window_seconds = 100, 60  # 100 per minute
                    elif query_type == "user_receipts":
                        limit, window_seconds = 10, 60   # 10 per minute
                    elif query_type == "gdpr_export":
                        limit, window_seconds = 1, 3600  # 1 per hour
                    else:
                        limit, window_seconds = 50, 60   # Default

                    # Check current usage
                    current_usage = await self._get_current_usage(user_id, query_type, window_seconds)
                    within_limit = current_usage < limit

                    reset_time = int(time.time()) + window_seconds

                    return RateLimitStatus(
                        within_limit=within_limit,
                        current_usage=current_usage,
                        limit=limit,
                        reset_time_seconds=reset_time,
                        window_seconds=window_seconds,
                    )

                async def _get_user_permissions(self, user_id: str) -> List[str]:
                    """Get user permissions"""
                    # Implementation would query permission store
                    return ["BASIC_USER"]

                async def _verify_user_authentication(self, user_id: str) -> bool:
                    """Verify user authentication"""
                    # Implementation would validate auth tokens
                    return True

                async def _get_current_usage(self, user_id: str, query_type: str, window_seconds: int) -> int:
                    """Get current usage for rate limiting"""
                    # Implementation would query rate limit store
                    return 0

                async def _log_authorization_decision(
                    self,
                    user_id: str,
                    query_type: str,
                    target_user_id: str,
                    authorized: bool,
                    trace_id: str,
                ):
                    """Log authorization decision"""
                    self.logger.info(
                        f"Query authorization decision",
                        extra={
                            'user_id': user_id,
                            'query_type': query_type,
                            'target_user_id': target_user_id,
                            'authorized': authorized,
                            'trace_id': trace_id
                        }
                    )

                async def _log_unauthorized_access(self, user_id: str, reason: str, trace_id: str):
                    """Log unauthorized access attempt"""
                    self.logger.warning(
                        f"Unauthorized query access attempt: {reason}",
                        extra={
                            'user_id': user_id,
                            'reason': reason,
                            'trace_id': trace_id
                        }
                    )

                async def _log_rate_limit_exceeded(self, user_id: str, query_type: str, trace_id: str):
                    """Log rate limit violation"""
                    self.logger.warning(
                        f"Rate limit exceeded for query",
                        extra={
                            'user_id': user_id,
                            'query_type': query_type,
                            'trace_id': trace_id
                        }
                    )

    dependencies:
      - name: redis
        description: Rate limiting and session storage
      - name: jwt
        description: JWT token validation for authentication
      - name: cryptography
        description: Cryptographic operations for secure authorization

testing_requirements:
  - unit_tests:
      - authorization_logic: All authorization rules properly enforced
      - rate_limiting: Rate limits correctly applied and reset
      - permission_checks: User permissions properly validated
  - integration_tests:
      - authentication_flow: Complete auth flow with JWT validation
      - rate_limit_enforcement: Rate limits enforced across requests
      - audit_logging: Security events properly logged
  - security_tests:
      - privilege_escalation: Cannot bypass authorization checks
      - rate_limit_bypass: Cannot circumvent rate limiting
      - audit_integrity: Security logs cannot be tampered with

rate_limit_policies:
  - session_receipts: 100 requests per minute per user
  - user_receipts: 10 requests per minute per user
  - gdpr_export: 1 request per hour per user
  - admin_queries: 1000 requests per minute (admin users only)

security_policies:
  - authentication_required: All query endpoints require valid authentication
  - authorization_enforced: Access controls based on user roles and privacy bands
  - audit_logging: All security events logged with full context
  - rate_limiting: Query rates limited to prevent abuse
  - privacy_protection: PII access restricted based on privacy band and user role

compliance:
  - gdpr: Article 15 (right of access with proper authentication)
  - gdpr: Article 30 (records of processing with audit logging)
  - hipaa: § 164.312(a)(1) (access control with authentication)
  - soc2: CC6.1 (access to systems and data with authorization)