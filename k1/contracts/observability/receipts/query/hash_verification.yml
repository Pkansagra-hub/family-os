classes:
  - name: HashVerification
    description: Tamper-evident hash chain verification for receipt queries and exports
    research: ADR-0038d (query interface), SHA-256 hash chains, cryptographic integrity
    performance_budget: <1ms per hash verification (P95), <10ms for full chain verification
    reliability_properties:
      - cryptographic_integrity: SHA-256 hash chains detect all tampering attempts
      - verification_speed: Hash verification doesn't impact query performance budgets
      - error_detection: All hash chain breaks are detected and reported
      - audit_completeness: Hash verification failures are fully audited
    methods:
      - name: verify_receipt_hash
        description: Verify individual receipt hash matches its data
        parameters:
          - name: receipt
            type: Receipt
            description: Receipt to verify hash for
          - name: trace_id
            type: string
            description: Cognitive trace ID for audit trail
        returns:
          type: HashVerificationResult
          description: Result of hash verification with details
        implementation:
          rust: |
            use sha2::{Sha256, Digest};
            use serde::{Serialize, Deserialize};

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct HashVerificationResult {
                pub receipt_id: String,
                pub hash_verified: bool,
                pub expected_hash: String,
                pub actual_hash: String,
                pub verification_errors: Vec<String>,
                pub verification_duration_ms: f64,
            }

            impl HashVerification {
                pub fn verify_receipt_hash(
                    &self,
                    receipt: &Receipt,
                    trace_id: &str,
                ) -> HashVerificationResult {
                    let start_time = std::time::Instant::now();

                    // Compute expected hash from receipt data
                    let expected_hash = self.compute_receipt_hash(receipt);
                    let hash_verified = expected_hash == receipt.current_hash;

                    let mut verification_errors = Vec::new();
                    if !hash_verified {
                        verification_errors.push(format!(
                            "Hash mismatch for receipt {}: expected {}, got {}",
                            receipt.id, expected_hash, receipt.current_hash
                        ));
                    }

                    let duration_ms = start_time.elapsed().as_millis() as f64;

                    // Record observability metrics
                    self.record_verification_metrics(
                        "receipt_hash",
                        hash_verified,
                        duration_ms,
                        trace_id,
                    );

                    // Log verification failure for audit
                    if !hash_verified {
                        self.log_verification_failure(
                            &receipt.id,
                            &expected_hash,
                            &receipt.current_hash,
                            trace_id,
                        );
                    }

                    HashVerificationResult {
                        receipt_id: receipt.id.clone(),
                        hash_verified,
                        expected_hash,
                        actual_hash: receipt.current_hash.clone(),
                        verification_errors,
                        verification_duration_ms: duration_ms,
                    }
                }

                pub fn verify_hash_chain(
                    &self,
                    receipts: &[Receipt],
                    trace_id: &str,
                ) -> HashChainVerificationResult {
                    let start_time = std::time::Instant::now();

                    let mut broken_links = 0;
                    let mut verification_errors = Vec::new();
                    let mut link_results = Vec::new();

                    for (i, receipt) in receipts.iter().enumerate() {
                        // Verify individual receipt hash
                        let receipt_result = self.verify_receipt_hash(receipt, trace_id);
                        link_results.push(receipt_result.clone());

                        if !receipt_result.hash_verified {
                            broken_links += 1;
                            verification_errors.push(format!(
                                "Receipt {} hash verification failed",
                                receipt.id
                            ));
                        }

                        // Verify chain linkage (except for first receipt)
                        if i > 0 {
                            let prev_receipt = &receipts[i - 1];
                            if receipt.previous_hash.as_ref() != Some(&prev_receipt.current_hash) {
                                broken_links += 1;
                                verification_errors.push(format!(
                                    "Hash chain broken between receipts {} and {}: expected prev_hash {}, got {}",
                                    prev_receipt.id, receipt.id,
                                    prev_receipt.current_hash,
                                    receipt.previous_hash.as_deref().unwrap_or("None")
                                ));
                            }
                        } else if receipt.previous_hash.is_some() {
                            // First receipt should not have previous hash
                            broken_links += 1;
                            verification_errors.push(format!(
                                "First receipt {} should not have previous_hash",
                                receipt.id
                            ));
                        }
                    }

                    let chain_verified = broken_links == 0;
                    let duration_ms = start_time.elapsed().as_millis() as f64;

                    // Record observability metrics
                    self.record_verification_metrics(
                        "hash_chain",
                        chain_verified,
                        duration_ms,
                        trace_id,
                    );

                    // Log chain verification failure
                    if !chain_verified {
                        self.log_chain_verification_failure(
                            receipts.len(),
                            broken_links,
                            &verification_errors,
                            trace_id,
                        );
                    }

                    HashChainVerificationResult {
                        total_receipts: receipts.len(),
                        chain_verified,
                        broken_links,
                        verification_errors,
                        link_results,
                        verification_duration_ms: duration_ms,
                    }
                }

                pub fn verify_export_integrity(
                    &self,
                    export_data: &[ReceiptExport],
                    export_hash: &str,
                    trace_id: &str,
                ) -> ExportIntegrityResult {
                    let start_time = std::time::Instant::now();

                    // Compute expected export hash
                    let expected_hash = self.compute_export_hash(export_data);
                    let integrity_verified = expected_hash == export_hash;

                    let mut verification_errors = Vec::new();
                    if !integrity_verified {
                        verification_errors.push(format!(
                            "Export hash mismatch: expected {}, got {}",
                            expected_hash, export_hash
                        ));
                    }

                    // Verify all receipt hashes in export
                    let mut receipt_verifications = Vec::new();
                    for export_receipt in export_data {
                        // Convert export receipt back to full receipt for verification
                        let receipt = self.receipt_from_export(export_receipt);
                        let result = self.verify_receipt_hash(&receipt, trace_id);
                        receipt_verifications.push(result);
                    }

                    let all_receipts_verified = receipt_verifications
                        .iter()
                        .all(|r| r.hash_verified);

                    let duration_ms = start_time.elapsed().as_millis() as f64;

                    // Record observability metrics
                    self.record_verification_metrics(
                        "export_integrity",
                        integrity_verified && all_receipts_verified,
                        duration_ms,
                        trace_id,
                    );

                    ExportIntegrityResult {
                        export_integrity_verified: integrity_verified,
                        all_receipts_verified,
                        expected_export_hash: expected_hash,
                        actual_export_hash: export_hash.to_string(),
                        receipt_verifications,
                        verification_errors,
                        verification_duration_ms: duration_ms,
                    }
                }

                fn compute_receipt_hash(&self, receipt: &Receipt) -> String {
                    // Canonical receipt data for hashing
                    let canonical_data = format!(
                        "{}\n{}\n{}\n{}\n{}",
                        receipt.id,
                        receipt.receipt_type,
                        receipt.timestamp.timestamp_millis(),
                        receipt.session_id,
                        serde_json::to_string(&receipt.data).unwrap_or_default()
                    );

                    // Include previous hash if present
                    let hash_input = if let Some(prev_hash) = &receipt.previous_hash {
                        format!("{}\n{}", canonical_data, prev_hash)
                    } else {
                        canonical_data
                    };

                    let mut hasher = Sha256::new();
                    hasher.update(hash_input.as_bytes());
                    format!("{:x}", hasher.finalize())
                }

                fn compute_export_hash(&self, export_data: &[ReceiptExport]) -> String {
                    // Canonical export data for integrity verification
                    let canonical_export = export_data
                        .iter()
                        .map(|r| format!(
                            "{},{},{},{},{}",
                            r.receipt_id,
                            r.receipt_type,
                            r.timestamp.timestamp_millis(),
                            r.session_id,
                            serde_json::to_string(&r.data).unwrap_or_default()
                        ))
                        .collect::<Vec<_>>()
                        .join("\n");

                    let mut hasher = Sha256::new();
                    hasher.update(canonical_export.as_bytes());
                    format!("{:x}", hasher.finalize())
                }

                fn receipt_from_export(&self, export: &ReceiptExport) -> Receipt {
                    // Convert export format back to full receipt
                    // This is a simplified conversion - actual implementation
                    // would need full receipt reconstruction
                    Receipt {
                        id: export.receipt_id.clone(),
                        receipt_type: export.receipt_type.clone(),
                        timestamp: export.timestamp,
                        session_id: export.session_id.clone(),
                        data: export.data.clone(),
                        current_hash: export.hash_chain.current_hash.clone(),
                        previous_hash: export.hash_chain.previous_hash.clone(),
                        // Other fields would be reconstructed from export metadata
                        ..Default::default()
                    }
                }

                fn record_verification_metrics(
                    &self,
                    verification_type: &str,
                    success: bool,
                    duration_ms: f64,
                    trace_id: &str,
                ) {
                    // Prometheus metrics
                    HASH_VERIFICATION_TOTAL
                        .with_label_values(&[verification_type, if success { "success" } else { "failure" }])
                        .inc();

                    HASH_VERIFICATION_LATENCY_MS
                        .with_label_values(&[verification_type])
                        .observe(duration_ms);

                    // OpenTelemetry tracing
                    let tracer = opentelemetry::global::tracer("hash_verification");
                    let mut span = tracer
                        .span_builder(format!("hash.verify.{}", verification_type))
                        .with_trace_id(trace_id.parse().unwrap_or_default())
                        .start(&tracer);

                    span.set_attribute("verification.success", success);
                    span.set_attribute("verification.duration_ms", duration_ms);
                    span.set_attribute("verification.type", verification_type.to_string());

                    if !success {
                        span.set_status(Status::Error, "Hash verification failed");
                    }

                    span.end();
                }

                fn log_verification_failure(
                    &self,
                    receipt_id: &str,
                    expected_hash: &str,
                    actual_hash: &str,
                    trace_id: &str,
                ) {
                    // Log to audit system
                    tracing::error!(
                        receipt_id = %receipt_id,
                        expected_hash = %expected_hash,
                        actual_hash = %actual_hash,
                        trace_id = %trace_id,
                        "Receipt hash verification failed - possible tampering detected"
                    );
                }

                fn log_chain_verification_failure(
                    &self,
                    total_receipts: usize,
                    broken_links: usize,
                    errors: &[String],
                    trace_id: &str,
                ) {
                    tracing::error!(
                        total_receipts = total_receipts,
                        broken_links = broken_links,
                        trace_id = %trace_id,
                        "Hash chain verification failed - integrity compromised"
                    );

                    for error in errors {
                        tracing::error!(error = %error, "Chain verification error");
                    }
                }
            }

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct HashChainVerificationResult {
                pub total_receipts: usize,
                pub chain_verified: bool,
                pub broken_links: usize,
                pub verification_errors: Vec<String>,
                pub link_results: Vec<HashVerificationResult>,
                pub verification_duration_ms: f64,
            }

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct ExportIntegrityResult {
                pub export_integrity_verified: bool,
                pub all_receipts_verified: bool,
                pub expected_export_hash: String,
                pub actual_export_hash: String,
                pub receipt_verifications: Vec<HashVerificationResult>,
                pub verification_errors: Vec<String>,
                pub verification_duration_ms: f64,
            }

            lazy_static! {
                static ref HASH_VERIFICATION_TOTAL: Counter = register_counter!(
                    "hash_verification_total",
                    "Total hash verifications performed",
                    &["verification_type", "result"]
                ).unwrap();

                static ref HASH_VERIFICATION_LATENCY_MS: Histogram = register_histogram!(
                    "hash_verification_latency_ms",
                    "Hash verification latency in milliseconds",
                    &["verification_type"],
                    vec![0.1, 0.5, 1.0, 5.0, 10.0, 50.0]
                ).unwrap();
            }
          python: |
            from dataclasses import dataclass
            from typing import List, Dict, Any, Optional
            import hashlib
            import json
            import time
            import logging

            @dataclass
            class HashVerificationResult:
                receipt_id: str
                hash_verified: bool
                expected_hash: str
                actual_hash: str
                verification_errors: List[str]
                verification_duration_ms: float

            @dataclass
            class HashChainVerificationResult:
                total_receipts: int
                chain_verified: bool
                broken_links: int
                verification_errors: List[str]
                link_results: List[HashVerificationResult]
                verification_duration_ms: float

            @dataclass
            class ExportIntegrityResult:
                export_integrity_verified: bool
                all_receipts_verified: bool
                expected_export_hash: str
                actual_export_hash: str
                receipt_verifications: List[HashVerificationResult]
                verification_errors: List[str]
                verification_duration_ms: float

            class HashVerification:
                """Tamper-evident hash chain verification for receipts"""

                def __init__(self, observability):
                    self.obs = observability
                    self.logger = logging.getLogger(__name__)

                def verify_receipt_hash(self, receipt: Dict[str, Any], trace_id: str) -> HashVerificationResult:
                    """Verify individual receipt hash matches its data"""
                    start_time = time.time()

                    expected_hash = self._compute_receipt_hash(receipt)
                    hash_verified = expected_hash == receipt.get('current_hash', '')

                    verification_errors = []
                    if not hash_verified:
                        verification_errors.append(
                            f"Hash mismatch for receipt {receipt['id']}: expected {expected_hash}, got {receipt.get('current_hash')}"
                        )

                    duration_ms = (time.time() - start_time) * 1000

                    # Record observability metrics
                    self.obs.record_verification_metrics("receipt_hash", hash_verified, duration_ms, trace_id)

                    # Log verification failure
                    if not hash_verified:
                        self._log_verification_failure(
                            receipt['id'], expected_hash, receipt.get('current_hash', ''), trace_id
                        )

                    return HashVerificationResult(
                        receipt_id=receipt['id'],
                        hash_verified=hash_verified,
                        expected_hash=expected_hash,
                        actual_hash=receipt.get('current_hash', ''),
                        verification_errors=verification_errors,
                        verification_duration_ms=duration_ms
                    )

                def verify_hash_chain(self, receipts: List[Dict[str, Any]], trace_id: str) -> HashChainVerificationResult:
                    """Verify integrity of entire hash chain"""
                    start_time = time.time()

                    broken_links = 0
                    verification_errors = []
                    link_results = []

                    for i, receipt in enumerate(receipts):
                        # Verify individual receipt hash
                        receipt_result = self.verify_receipt_hash(receipt, trace_id)
                        link_results.append(receipt_result)

                        if not receipt_result.hash_verified:
                            broken_links += 1
                            verification_errors.append(f"Receipt {receipt['id']} hash verification failed")

                        # Verify chain linkage
                        if i > 0:
                            prev_receipt = receipts[i - 1]
                            expected_prev_hash = prev_receipt.get('current_hash')
                            actual_prev_hash = receipt.get('previous_hash')

                            if actual_prev_hash != expected_prev_hash:
                                broken_links += 1
                                verification_errors.append(
                                    f"Hash chain broken between receipts {prev_receipt['id']} and {receipt['id']}: "
                                    f"expected prev_hash {expected_prev_hash}, got {actual_prev_hash}"
                                )
                        elif receipt.get('previous_hash'):
                            # First receipt should not have previous hash
                            broken_links += 1
                            verification_errors.append(f"First receipt {receipt['id']} should not have previous_hash")

                    chain_verified = broken_links == 0
                    duration_ms = (time.time() - start_time) * 1000

                    # Record observability metrics
                    self.obs.record_verification_metrics("hash_chain", chain_verified, duration_ms, trace_id)

                    # Log chain verification failure
                    if not chain_verified:
                        self._log_chain_verification_failure(len(receipts), broken_links, verification_errors, trace_id)

                    return HashChainVerificationResult(
                        total_receipts=len(receipts),
                        chain_verified=chain_verified,
                        broken_links=broken_links,
                        verification_errors=verification_errors,
                        link_results=link_results,
                        verification_duration_ms=duration_ms
                    )

                def verify_export_integrity(
                    self,
                    export_data: List[Dict[str, Any]],
                    export_hash: str,
                    trace_id: str
                ) -> ExportIntegrityResult:
                    """Verify integrity of exported receipt data"""
                    start_time = time.time()

                    expected_hash = self._compute_export_hash(export_data)
                    integrity_verified = expected_hash == export_hash

                    verification_errors = []
                    if not integrity_verified:
                        verification_errors.append(
                            f"Export hash mismatch: expected {expected_hash}, got {export_hash}"
                        )

                    # Verify all receipt hashes in export
                    receipt_verifications = []
                    for export_receipt in export_data:
                        receipt_result = self.verify_receipt_hash(export_receipt, trace_id)
                        receipt_verifications.append(receipt_result)

                    all_receipts_verified = all(r.hash_verified for r in receipt_verifications)
                    duration_ms = (time.time() - start_time) * 1000

                    # Record observability metrics
                    self.obs.record_verification_metrics(
                        "export_integrity",
                        integrity_verified and all_receipts_verified,
                        duration_ms,
                        trace_id
                    )

                    return ExportIntegrityResult(
                        export_integrity_verified=integrity_verified,
                        all_receipts_verified=all_receipts_verified,
                        expected_export_hash=expected_hash,
                        actual_export_hash=export_hash,
                        receipt_verifications=receipt_verifications,
                        verification_errors=verification_errors,
                        verification_duration_ms=duration_ms
                    )

                def _compute_receipt_hash(self, receipt: Dict[str, Any]) -> str:
                    """Compute SHA-256 hash for receipt data"""
                    # Canonical receipt data for hashing
                    canonical_data = "\n".join([
                        receipt['id'],
                        receipt['receipt_type'],
                        str(receipt['timestamp'].timestamp() * 1000),  # milliseconds
                        receipt['session_id'],
                        json.dumps(receipt['data'], sort_keys=True)
                    ])

                    # Include previous hash if present
                    hash_input = canonical_data
                    if receipt.get('previous_hash'):
                        hash_input = f"{canonical_data}\n{receipt['previous_hash']}"

                    return hashlib.sha256(hash_input.encode()).hexdigest()

                def _compute_export_hash(self, export_data: List[Dict[str, Any]]) -> str:
                    """Compute SHA-256 hash for export data integrity"""
                    # Canonical export data
                    canonical_lines = []
                    for receipt in export_data:
                        line = ",".join([
                            receipt['receipt_id'],
                            receipt['receipt_type'],
                            str(receipt['timestamp'].timestamp() * 1000),
                            receipt['session_id'],
                            json.dumps(receipt['data'], sort_keys=True)
                        ])
                        canonical_lines.append(line)

                    canonical_export = "\n".join(canonical_lines)
                    return hashlib.sha256(canonical_export.encode()).hexdigest()

                def _log_verification_failure(self, receipt_id: str, expected: str, actual: str, trace_id: str):
                    """Log hash verification failure for audit"""
                    self.logger.error(
                        f"Receipt hash verification failed - possible tampering detected",
                        extra={
                            'receipt_id': receipt_id,
                            'expected_hash': expected,
                            'actual_hash': actual,
                            'trace_id': trace_id
                        }
                    )

                def _log_chain_verification_failure(self, total: int, broken: int, errors: List[str], trace_id: str):
                    """Log hash chain verification failure"""
                    self.logger.error(
                        f"Hash chain verification failed - integrity compromised",
                        extra={
                            'total_receipts': total,
                            'broken_links': broken,
                            'trace_id': trace_id
                        }
                    )

                    for error in errors:
                        self.logger.error(f"Chain verification error: {error}")

    dependencies:
      - name: sha2
        description: SHA-256 cryptographic hashing
      - name: serde
        description: Data serialization for hash computation
      - name: opentelemetry
        description: Distributed tracing for verification operations

testing_requirements:
  - unit_tests:
      - hash_computation: SHA-256 hashes computed correctly from receipt data
      - chain_verification: Hash chain linkages verified properly
      - tampering_detection: All forms of data tampering detected
  - integration_tests:
      - database_consistency: Hash verification works with stored receipts
      - export_integrity: Exported data integrity properly verified
      - performance_budget: Verification meets <1ms per receipt budget
  - security_tests:
      - collision_resistance: SHA-256 provides adequate collision resistance
      - timing_attacks: No timing-based side channels in verification
      - audit_completeness: All verification failures properly logged

cryptographic_properties:
  - algorithm: SHA-256 (FIPS 180-4 compliant)
  - collision_resistance: 128-bit security level
  - preimage_resistance: 256-bit security level
  - canonical_data: Deterministic JSON serialization with sorted keys

compliance:
  - gdpr: Article 30 (records of processing activities with integrity verification)
  - hipaa: § 164.312(c)(1) (integrity safeguards)
  - soc2: CC6.1 (logical and physical access controls with integrity monitoring)
