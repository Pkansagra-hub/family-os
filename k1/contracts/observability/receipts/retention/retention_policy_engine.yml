classes:
  - name: RetentionPolicyEngine
    description: Engine for managing band-specific retention policies and auto-deletion
    research: ADR-0038c (retention policies), GDPR Article 30, privacy band retention, auto-deletion
    performance_budget: <5 seconds hourly pruning job (P95), <80% space reduction
    reliability_properties:
      - atomic_deletion: All deletions in batch succeed or fail together
      - audit_compliance: All deletions logged for compliance verification
      - privacy_respect: Band-specific retention strictly enforced
    methods:
      - name: execute_retention_policy
        description: Execute retention policy to delete expired receipts
        parameters:
          - name: current_time
            type: timestamp
            description: Current timestamp for retention calculation
          - name: dry_run
            type: bool
            description: If true, only report what would be deleted
        returns:
          type: Result<RetentionResult, RetentionError>
          description: Retention execution results or error
        implementation:
          rust: |
            use chrono::{DateTime, Utc, Duration};
            use std::collections::HashMap;
            use rusqlite::Connection;
            use std::sync::Arc;
            use tokio::sync::Mutex;

            pub struct RetentionPolicyEngine {
                db: Arc<Mutex<Connection>>,
                metrics: Arc<RetentionMetrics>,
                policies: HashMap<PrivacyBand, RetentionPolicy>,
            }

            #[derive(Debug, Clone)]
            pub struct RetentionPolicy {
                pub max_age_days: i64,
                pub grace_period_days: i64,
                pub auto_delete: bool,
            }

            impl Default for RetentionPolicy {
                fn default() -> Self {
                    Self {
                        max_age_days: 365,  // 1 year default
                        grace_period_days: 7,  // 7 day grace period
                        auto_delete: true,
                    }
                }
            }

            impl RetentionPolicyEngine {
                pub fn new(
                    db: Arc<Mutex<Connection>>,
                    metrics: Arc<RetentionMetrics>,
                ) -> Self {
                    let mut policies = HashMap::new();

                    // GDPR/HIPAA compliant retention policies
                    policies.insert(PrivacyBand::Green, RetentionPolicy {
                        max_age_days: 365,  // 1 year for non-sensitive data
                        grace_period_days: 7,
                        auto_delete: true,
                    });

                    policies.insert(PrivacyBand::Amber, RetentionPolicy {
                        max_age_days: 180,  // 6 months for sensitive data
                        grace_period_days: 7,
                        auto_delete: true,
                    });

                    policies.insert(PrivacyBand::Red, RetentionPolicy {
                        max_age_days: 90,   // 3 months for highly sensitive data
                        grace_period_days: 7,
                        auto_delete: true,
                    });

                    Self { db, metrics, policies }
                }

                pub async fn execute_retention_policy(
                    &self,
                    current_time: DateTime<Utc>,
                    dry_run: bool,
                ) -> Result<RetentionResult, RetentionError> {
                    let start = std::time::Instant::now();
                    self.metrics.record_retention_started();

                    let mut total_deleted = 0;
                    let mut band_results = HashMap::new();

                    // Execute retention for each privacy band
                    for (band, policy) in &self.policies {
                        let band_result = self.execute_band_retention(
                            *band,
                            policy,
                            current_time,
                            dry_run,
                        ).await?;

                        total_deleted += band_result.deleted_count;
                        band_results.insert(*band, band_result);
                    }

                    let duration_ms = start.elapsed().as_millis() as u64;

                    // Record metrics
                    self.metrics.record_retention_completed(
                        total_deleted,
                        duration_ms,
                        dry_run
                    );

                    // Validate performance budget
                    if duration_ms > 5000 && !dry_run {  // 5 second budget
                        eprintln!(
                            "WARNING: Retention execution exceeded 5s budget ({}ms)",
                            duration_ms
                        );
                    }

                    Ok(RetentionResult {
                        total_deleted,
                        band_results,
                        duration_ms,
                        dry_run,
                    })
                }

                async fn execute_band_retention(
                    &self,
                    band: PrivacyBand,
                    policy: &RetentionPolicy,
                    current_time: DateTime<Utc>,
                    dry_run: bool,
                ) -> Result<BandRetentionResult, RetentionError> {
                    let db = self.db.lock().await;

                    // Calculate cutoff timestamp
                    let cutoff_time = current_time - Duration::days(policy.max_age_days);
                    let grace_cutoff = cutoff_time - Duration::days(policy.grace_period_days);

                    // Find receipts eligible for deletion
                    let mut stmt = db.prepare(
                        "SELECT receipt_id, session_id, user_id, timestamp
                         FROM receipts
                         WHERE privacy_band = ? AND timestamp < ?
                         ORDER BY timestamp ASC"
                    )?;

                    let band_str = match band {
                        PrivacyBand::Green => "GREEN",
                        PrivacyBand::Amber => "AMBER",
                        PrivacyBand::Red => "RED",
                    };

                    let mut rows = stmt.query(rusqlite::params![
                        band_str,
                        grace_cutoff.timestamp_millis()
                    ])?;

                    let mut eligible_receipts = Vec::new();
                    while let Some(row) = rows.next()? {
                        let receipt_id: String = row.get(0)?;
                        let session_id: String = row.get(1)?;
                        let user_id: String = row.get(2)?;
                        let timestamp: i64 = row.get(3)?;

                        eligible_receipts.push(ReceiptDeletionInfo {
                            receipt_id,
                            session_id,
                            user_id,
                            timestamp,
                        });
                    }

                    if eligible_receipts.is_empty() {
                        return Ok(BandRetentionResult {
                            band,
                            eligible_count: 0,
                            deleted_count: 0,
                            errors: Vec::new(),
                        });
                    }

                    if dry_run {
                        return Ok(BandRetentionResult {
                            band,
                            eligible_count: eligible_receipts.len(),
                            deleted_count: 0,
                            errors: Vec::new(),
                        });
                    }

                    // Perform actual deletion with audit logging
                    self.perform_deletion_with_audit(&db, &eligible_receipts, band).await
                }

                async fn perform_deletion_with_audit(
                    &self,
                    db: &Connection,
                    receipts: &[ReceiptDeletionInfo],
                    band: PrivacyBand,
                ) -> Result<BandRetentionResult, RetentionError> {
                    let tx = db.unchecked_transaction()?;

                    let mut deleted_count = 0;
                    let mut errors = Vec::new();

                    // Log deletion audit trail
                    let audit_stmt = tx.prepare_cached(
                        "INSERT INTO deletion_audit (
                            receipt_id, session_id, user_id, privacy_band,
                            deletion_timestamp, deletion_reason
                        ) VALUES (?, ?, ?, ?, ?, ?)"
                    )?;

                    let deletion_timestamp = Utc::now().timestamp_millis();

                    for receipt in receipts {
                        // Log the deletion
                        audit_stmt.execute(rusqlite::params![
                            &receipt.receipt_id,
                            &receipt.session_id,
                            &receipt.user_id,
                            &match band {
                                PrivacyBand::Green => "GREEN",
                                PrivacyBand::Amber => "AMBER",
                                PrivacyBand::Red => "RED",
                            },
                            deletion_timestamp,
                            "RETENTION_POLICY_EXPIRED"
                        ])?;

                        // Delete the receipt
                        match tx.execute(
                            "DELETE FROM receipts WHERE receipt_id = ?",
                            [&receipt.receipt_id],
                        ) {
                            Ok(_) => {
                                deleted_count += 1;
                                self.metrics.record_receipt_deleted(band);
                            }
                            Err(e) => {
                                errors.push(format!("Failed to delete {}: {}", receipt.receipt_id, e));
                            }
                        }
                    }

                    tx.commit()?;

                    Ok(BandRetentionResult {
                        band,
                        eligible_count: receipts.len(),
                        deleted_count,
                        errors,
                    })
                }

                pub fn get_retention_policy(&self, band: PrivacyBand) -> Option<&RetentionPolicy> {
                    self.policies.get(&band)
                }
            }

            #[derive(Debug)]
            pub struct RetentionResult {
                pub total_deleted: usize,
                pub band_results: HashMap<PrivacyBand, BandRetentionResult>,
                pub duration_ms: u64,
                pub dry_run: bool,
            }

            #[derive(Debug)]
            pub struct BandRetentionResult {
                pub band: PrivacyBand,
                pub eligible_count: usize,
                pub deleted_count: usize,
                pub errors: Vec<String>,
            }

            #[derive(Debug, Clone)]
            struct ReceiptDeletionInfo {
                receipt_id: String,
                session_id: String,
                user_id: String,
                timestamp: i64,
            }

            #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
            pub enum PrivacyBand {
                Green,
                Amber,
                Red,
            }
          python: |
            from datetime import datetime, timedelta
            from typing import Dict, List, Optional, Tuple
            import sqlite3
            from dataclasses import dataclass
            from enum import Enum

            class RetentionPolicyEngine:
                """Engine for managing band-specific retention policies"""

                @dataclass
                class RetentionPolicy:
                    max_age_days: int = 365
                    grace_period_days: int = 7
                    auto_delete: bool = True

                def __init__(self, db_connection, metrics: RetentionMetrics):
                    self.db = db_connection
                    self.metrics = metrics
                    self.policies = {
                        PrivacyBand.GREEN: self.RetentionPolicy(max_age_days=365),  # 1 year
                        PrivacyBand.AMBER: self.RetentionPolicy(max_age_days=180),  # 6 months
                        PrivacyBand.RED: self.RetentionPolicy(max_age_days=90),     # 3 months
                    }

                async def execute_retention_policy(
                    self,
                    current_time: Optional[datetime] = None,
                    dry_run: bool = False
                ) -> 'RetentionResult':
                    """Execute retention policy for all bands"""
                    if current_time is None:
                        current_time = datetime.utcnow()

                    start_time = datetime.utcnow()
                    self.metrics.record_retention_started()

                    total_deleted = 0
                    band_results = {}

                    # Execute retention for each band
                    for band, policy in self.policies.items():
                        band_result = await self._execute_band_retention(
                            band, policy, current_time, dry_run
                        )
                        total_deleted += band_result.deleted_count
                        band_results[band] = band_result

                    duration_ms = int((datetime.utcnow() - start_time).total_seconds() * 1000)

                    self.metrics.record_retention_completed(total_deleted, duration_ms, dry_run)

                    # Performance validation
                    if duration_ms > 5000 and not dry_run:
                        print(f"WARNING: Retention execution exceeded 5s budget ({duration_ms}ms)")

                    return RetentionResult(
                        total_deleted=total_deleted,
                        band_results=band_results,
                        duration_ms=duration_ms,
                        dry_run=dry_run
                    )

                async def _execute_band_retention(
                    self,
                    band: 'PrivacyBand',
                    policy: RetentionPolicy,
                    current_time: datetime,
                    dry_run: bool
                ) -> 'BandRetentionResult':
                    """Execute retention for a specific privacy band"""
                    # Calculate cutoff times
                    cutoff_time = current_time - timedelta(days=policy.max_age_days)
                    grace_cutoff = cutoff_time - timedelta(days=policy.grace_period_days)

                    # Find eligible receipts
                    cursor = self.db.cursor()
                    cursor.execute("""
                        SELECT receipt_id, session_id, user_id, timestamp
                        FROM receipts
                        WHERE privacy_band = ? AND timestamp < ?
                        ORDER BY timestamp ASC
                    """, (band.value, int(grace_cutoff.timestamp() * 1000)))

                    eligible_receipts = [
                        ReceiptDeletionInfo(
                            receipt_id=row[0],
                            session_id=row[1],
                            user_id=row[2],
                            timestamp=row[3]
                        )
                        for row in cursor.fetchall()
                    ]

                    if not eligible_receipts:
                        return BandRetentionResult(
                            band=band,
                            eligible_count=0,
                            deleted_count=0,
                            errors=[]
                        )

                    if dry_run:
                        return BandRetentionResult(
                            band=band,
                            eligible_count=len(eligible_receipts),
                            deleted_count=0,
                            errors=[]
                        )

                    # Perform actual deletion
                    return await self._perform_deletion_with_audit(
                        eligible_receipts, band
                    )

                async def _perform_deletion_with_audit(
                    self,
                    receipts: List['ReceiptDeletionInfo'],
                    band: 'PrivacyBand'
                ) -> 'BandRetentionResult':
                    """Delete receipts with audit logging"""
                    deleted_count = 0
                    errors = []

                    with self.db:
                        cursor = self.db.cursor()
                        deletion_timestamp = int(datetime.utcnow().timestamp() * 1000)

                        for receipt in receipts:
                            try:
                                # Log deletion in audit table
                                cursor.execute("""
                                    INSERT INTO deletion_audit (
                                        receipt_id, session_id, user_id, privacy_band,
                                        deletion_timestamp, deletion_reason
                                    ) VALUES (?, ?, ?, ?, ?, ?)
                                """, (
                                    receipt.receipt_id,
                                    receipt.session_id,
                                    receipt.user_id,
                                    band.value,
                                    deletion_timestamp,
                                    "RETENTION_POLICY_EXPIRED"
                                ))

                                # Delete the receipt
                                cursor.execute(
                                    "DELETE FROM receipts WHERE receipt_id = ?",
                                    (receipt.receipt_id,)
                                )

                                deleted_count += 1
                                self.metrics.record_receipt_deleted(band)

                            except Exception as e:
                                errors.append(f"Failed to delete {receipt.receipt_id}: {e}")

                    return BandRetentionResult(
                        band=band,
                        eligible_count=len(receipts),
                        deleted_count=deleted_count,
                        errors=errors
                    )

                def get_retention_policy(self, band: 'PrivacyBand') -> Optional[RetentionPolicy]:
                    """Get retention policy for a band"""
                    return self.policies.get(band)

            class PrivacyBand(Enum):
                GREEN = "GREEN"
                AMBER = "AMBER"
                RED = "RED"

            @dataclass
            class RetentionResult:
                total_deleted: int
                band_results: Dict[PrivacyBand, 'BandRetentionResult']
                duration_ms: int
                dry_run: bool

            @dataclass
            class BandRetentionResult:
                band: PrivacyBand
                eligible_count: int
                deleted_count: int
                errors: List[str]

            @dataclass
            class ReceiptDeletionInfo:
                receipt_id: str
                session_id: str
                user_id: str
                timestamp: int

        performance_requirements:
          - execution_time: <5 seconds hourly pruning job (P95)
          - space_reduction: 80% space reduction after deletion
          - memory_usage: O(number of eligible receipts)
          - audit_overhead: <10% additional time for audit logging
        error_handling:
          - deletion_failure: Log error, continue with other receipts
          - audit_failure: Fail entire batch, maintain consistency
          - timeout_exceeded: Partial completion with detailed reporting

      - name: validate_retention_compliance
        description: Validate that retention policies meet compliance requirements
        returns:
          type: Result<ComplianceCheck, ComplianceError>
          description: Compliance validation results
        implementation_notes: GDPR/HIPAA compliance verification

    dependencies:
      - name: chrono
        description: Date/time handling for retention calculations
      - name: rusqlite
        description: Database operations for receipt deletion
      - name: RetentionMetrics
        description: Metrics collection for retention operations

testing_requirements:
  - unit_tests:
      - policy_calculation: Retention policies calculate cutoffs correctly
      - band_separation: Different bands have different retention periods
      - audit_logging: All deletions properly logged
      - dry_run_accuracy: Dry run reports match actual execution
  - integration_tests:
      - end_to_end_deletion: Receipts deleted according to policy
      - audit_trail_integrity: Deletion audit trail maintained
      - concurrent_execution: Multiple retention jobs don't conflict
  - performance_tests:
      - large_dataset_pruning: Efficient pruning of millions of receipts
      - memory_bounds: Memory usage stays within limits
      - audit_overhead: Audit logging doesn't significantly slow deletion

observability:
  metrics:
    - name: retention_executions_total
      type: counter
      labels: [dry_run]
      description: Total retention policy executions
    - name: retention_duration_ms
      type: histogram
      buckets: [1000, 5000, 10000, 30000]
      description: Time taken for retention execution
    - name: receipts_deleted_total
      type: counter
      labels: [privacy_band]
      description: Total receipts deleted by privacy band
    - name: retention_errors_total
      type: counter
      labels: [error_type]
      description: Total retention execution errors

alerting_rules:
  - name: RetentionExecutionFailed
    condition: retention_errors_total > 0
    severity: error
    description: Retention policy execution failed
    runbook: Check database connectivity, review error logs

  - name: RetentionDurationHigh
    condition: histogram_quantile(0.95, rate(retention_duration_ms_bucket[5m])) > 5000
    severity: warning
    description: Retention execution exceeds 5s budget
    runbook: Check database performance, consider retention tuning

  - name: NoReceiptsDeleted
    condition: rate(receipts_deleted_total[7d]) == 0
    severity: info
    description: No receipts deleted in past week - check retention policies
    runbook: Verify retention policies are active, check data age distribution

compliance:
  - gdpr: Article 30 (processing records retention), Article 17 (right to erasure)
  - hipaa: § 164.530(j) (administrative safeguards for retention)
  - soc2: CC7.2 (system monitoring with retention compliance)
