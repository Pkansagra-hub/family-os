# Seccomp BPF Filter Contract - Issue 2.5.5, Filesystem Layer 4
# Purpose: Syscall filtering to block dangerous operations (mount, ptrace, reboot)
# Source ADR: ADR-0032b (Filesystem Egress Control)
# Last Updated: 2025-10-15

name: "Seccomp BPF Filter"
purpose: "Block dangerous syscalls with seccomp-bpf (<0.1ms load, 0ms runtime overhead)"
scope: ["Syscall Filtering", "Privilege Escalation Prevention", "System Tampering"]
version: "1.0"

# ============================================================================
# SECCOMP-BPF OVERVIEW
# ============================================================================

seccomp_technology:

  definition: "Secure Computing Mode (seccomp) with Berkeley Packet Filter (BPF)"

  how_it_works:
    step_1_define_filter:
      - "Create list of syscalls to block or allow"
      - "Use seccomp/libseccomp library to compile filter"

    step_2_load_filter:
      - "Apply filter to process via prctl(PR_SET_SECCOMP)"
      - "Filter applies to all threads in process"

    step_3_enforce:
      - "When process makes syscall, kernel checks filter"
      - "If blocked: Kill process or return error"
      - "If allowed: Syscall executes normally"

  kernel_support:
    - "Linux kernel 3.5+ (seccomp-bpf support)"
    - "Most modern systems supported (Ubuntu 16.04+, Debian 8+, RHEL 7+)"

  performance:
    filter_load_time: "<0.1ms (one-time, per tool start)"
    runtime_overhead: "0ms (kernel-level enforcement, negligible)"
    syscall_check_time: "<1µs (fast BPF evaluation)"

# ============================================================================
# BLOCKED SYSCALLS BY BAND
# ============================================================================

blocked_syscalls:

  green_and_amber_bands:
    description: "Block dangerous syscalls, allow standard I/O and computation"

    critical_blocks:

      system_tampering:
        - "mount, umount, umount2 (prevent filesystem changes)"
        - "pivot_root (prevent jail escape)"
        - "chroot (prevent jail escape)"
        - "swapon, swapoff (prevent swap manipulation)"

      privilege_escalation:
        - "setuid, setgid, setreuid, setregid, setfsgid, setfsuid"
        - "ptrace (prevent process hijacking)"
        - "process_vm_readv, process_vm_writev (prevent memory read/write)"
        - "capset (prevent capability escalation)"

      kernel_modules:
        - "init_module, finit_module (prevent kernel module loading)"
        - "delete_module (prevent module unloading)"

      raw_networking:
        - "socket(AF_PACKET, ...) (prevent raw packet capture)"
        - "socket(AF_NETLINK, ...) (prevent netlink access)"

      device_access:
        - "ioctl (restricted to safe operations)"
        - "ioperm, iopl (prevent port I/O)"
        - "open(/dev/mem), open(/dev/kmem)"

      namespace_manipulation:
        - "unshare (prevent new namespace creation)"
        - "clone(CLONE_NEWNET), clone(CLONE_NEWUSER)"

      low_level_operations:
        - "kexec_load, kexec_unload (prevent system takeover)"
        - "reboot (prevent system reboot)"
        - "acct (prevent accounting changes)"

    allowed_syscalls:
      description: "Everything else (standard I/O, file ops, memory management)"
      examples:
        - "read, write, open, close, dup, dup2 (file I/O)"
        - "stat, fstat, lstat, fstatat (file metadata)"
        - "mmap, munmap, brk (memory management)"
        - "fork, vfork, clone (with CLONE_VM to stay in same namespace)"
        - "exit, exit_group (process termination)"
        - "signal handlers (rt_sigaction, rt_sigprocmask, rt_sigpending)"
        - "getpid, getppid, getpgrp (process info read-only)"
        - "arithmetic, syscalls, libc calls"

  red_band:
    description: "Allow minimal syscalls (highly restricted)"

    allowed_syscalls_only:
      - "read (from /tmp/input)"
      - "write (to /tmp/output)"
      - "open, close (file descriptors)"
      - "stat, fstat (file metadata)"
      - "mmap, munmap (memory management)"
      - "exit, exit_group (termination)"
      - "rt_sigaction, rt_sigprocmask (signal handling)"
      - "getpid, getppid (process info)"

    blocked_by_omission: "Everything not in allowed list is killed"
    use_case: "Extremely sensitive operations (financial, medical)"

  black_band:
    description: "Kill process on ANY syscall (no execution)"

    implementation: |
      Set default action to KILL_PROCESS
      Result: Process terminates on first syscall

    use_case: "Completely untrusted code (experimental, fuzzing)"

# ============================================================================
# FILTER ACTION RESPONSES
# ============================================================================

filter_actions:

  action_allow:
    value: "SECCOMP_RET_ALLOW"
    effect: "Syscall executes normally"
    example: "read() syscall on GREEN band → executes, returns data"

  action_errno:
    value: "SECCOMP_RET_ERRNO(errno_code)"
    effect: "Syscall returns error without executing"
    errno: "Typically EPERM (1) or ENOSYS (38)"
    example: "mount() syscall → returns EPERM, never executed"
    benefit: "Tools can catch and handle errors (more graceful than kill)"

  action_kill_thread:
    value: "SECCOMP_RET_KILL_THREAD"
    effect: "Kill only the thread that made the syscall"
    example: "Thread tries ptrace() → thread killed, other threads continue"
    note: "For multi-threaded tools"

  action_kill_process:
    value: "SECCOMP_RET_KILL_PROCESS"
    effect: "Kill entire process immediately"
    example: "BLACK band tool makes any syscall → process killed"
    note: "All threads terminated, no cleanup, SIGKILL equivalent"

  action_trace:
    value: "SECCOMP_RET_TRACE"
    effect: "Notify tracer (ptrace) of syscall (for debugging)"
    use_case: "Development/testing only (not production)"

# ============================================================================
# FILTER DESIGN PATTERNS
# ============================================================================

filter_design:

  pattern_1_blocklist:
    description: "DEFAULT ALLOW, specific syscalls blocked"
    suitable_for: "GREEN/AMBER bands (need most syscalls)"

    pseudocode: |
      if (syscall == mount)
        return KILL_PROCESS
      if (syscall == ptrace)
        return KILL_PROCESS
      ...
      return ALLOW  # Default

    advantage: "Fewer rules (only block ~20 dangerous syscalls)"
    disadvantage: "Allows unknown/new syscalls (security risk)"

  pattern_2_allowlist:
    description: "DEFAULT DENY, only whitelisted syscalls allowed"
    suitable_for: "RED band (minimal syscalls needed)"

    pseudocode: |
      if (syscall == read)
        return ALLOW
      if (syscall == write)
        return ALLOW
      ...
      return KILL_PROCESS  # Default

    advantage: "Explicitly safe (only listed syscalls)"
    disadvantage: "More rules (list all allowed syscalls)"

  pattern_3_architecture_specific:
    description: "Different rules for x86_64 vs ARM"

    reason: "Syscall numbers differ between architectures"

    implementation: |
      # seccomp supports architecture constraints
      if (arch == x86_64)
        # x86_64 syscall numbers
        mount_syscall_num = 165
      elif (arch == ARM)
        # ARM syscall numbers
        mount_syscall_num = 21

      # Block by architecture-specific number

# ============================================================================
# LIBSECCOMP USAGE (PYTHON EXAMPLE)
# ============================================================================

libseccomp_implementation:

  install: |
    # Ubuntu/Debian
    apt-get install libseccomp-dev python3-seccomp

    # CentOS/RHEL
    yum install libseccomp-devel

  python_code: |
    import seccomp

    # Create filter (default: ALLOW)
    f = seccomp.SyscallFilter(defaction=seccomp.ALLOW)

    # Add blocklist rules (GREEN/AMBER pattern)
    blocked = [
      "mount", "umount", "umount2", "pivot_root", "chroot",
      "ptrace", "process_vm_readv", "init_module",
      "reboot", "kexec_load", "acct"
    ]

    for syscall_name in blocked:
      # Resolve syscall number for current architecture
      syscall_num = seccomp.resolve_syscall(
        seccomp.Arch.NATIVE,
        syscall_name
      )
      # Add rule: return EPERM on this syscall
      f.add_rule(seccomp.ERRNO(1), syscall_num)

    # Load filter into current process
    f.load()

    # From now on: blocked syscalls return EPERM, others allowed

  red_band_allowlist: |
    import seccomp

    # Create filter (default: KILL_PROCESS for RED band)
    f = seccomp.SyscallFilter(defaction=seccomp.KILL_PROCESS)

    # Allowlist: add only safe syscalls
    allowed = [
      "read", "write", "open", "close", "stat", "fstat",
      "mmap", "munmap", "brk", "exit", "exit_group",
      "rt_sigaction", "rt_sigprocmask", "getpid"
    ]

    for syscall_name in allowed:
      syscall_num = seccomp.resolve_syscall(
        seccomp.Arch.NATIVE,
        syscall_name
      )
      # Add rule: ALLOW this syscall
      f.add_rule(seccomp.ALLOW, syscall_num)

    f.load()

    # From now on: only allowed syscalls work, all others kill process

# ============================================================================
# FILTER LOADING TIMING
# ============================================================================

filter_loading_sequence:

  step_1_after_fork:
    action: "Parent forks tool process"
    timing: "Before execve() of tool binary"

  step_2_before_execve:
    action: "Load seccomp filter in child process"
    syscall: "prctl(PR_SET_SECCOMP, SECCOMP_MODE_FILTER, filter)"
    timing: "<1ms per tool"
    note: "Must be before execve() (child inherits filter)"

  step_3_after_execve:
    action: "Tool binary starts executing"
    filter_active: "YES (child inherited filter)"
    any_blocked_syscall: "Process killed or error returned"

  performance: "<0.1ms total (one-time per tool launch)"

# ============================================================================
# ERROR HANDLING & TROUBLESHOOTING
# ============================================================================

error_scenarios:

  scenario_1_kernel_missing_seccomp:
    trigger: "System doesn't support seccomp-bpf (old kernel)"
    handling: |
      1. Check: grep -o 'seccomp' /proc/cpuinfo (should exist)
      2. Or: test if PR_SET_SECCOMP available
      3. If missing: Skip seccomp (fallback, security degraded)"
      4. Alert: WARNING
    outcome: "Tools run without seccomp protection"

  scenario_2_library_missing:
    trigger: "libseccomp or python3-seccomp not installed"
    handling: |
      1. Check: ldconfig -p | grep libseccomp
      2. If missing: apt-get install libseccomp-dev python3-seccomp
      3. Alert: CRITICAL
    outcome: "Fail to load filter, tool launch fails"

  scenario_3_permission_denied:
    trigger: "prctl(PR_SET_SECCOMP) returns EPERM"
    handling: |
      1. Verify process is unprivileged (not root after setuid)"
      2. Some sandboxes don't allow prctl (e.g., older Docker)"
      3. Try loading with CAP_SYS_ADMIN"
      4. Alert: WARNING
    outcome: "Skip seccomp, log degradation"

# ============================================================================
# SECURITY IMPACT
# ============================================================================

security_impact:

  without_seccomp:
    scenario: "Tool process has full syscall access"
    attacks:
      - "mount /dev/sda /tmp/output → Disk tampering"
      - "ptrace(1) → Hijack init process"
      - "reboot() → System crash"
      - "init_module() → Load malicious kernel module"
    result: "Complete system compromise possible"

  with_seccomp_blocklist:
    scenario: "Blocked syscalls return EPERM or kill process"
    protections:
      - "mount() blocks filesystem tampering (EPERM)"
      - "ptrace() kills process (KILL_PROCESS)"
      - "reboot() blocks system reboot (EPERM)"
      - "init_module() blocks kernel modules (EPERM)"
    result: "Tool cannot escape jail or compromise system"

  with_seccomp_allowlist_red:
    scenario: "Only read/write/exit allowed, kill everything else"
    protections:
      - "Any privilege escalation attempt kills process"
      - "Any system access attempt kills process"
      - "Tool can only do: read input, write output, exit"
    result: "Minimal attack surface (read-only jail + syscall filter)"

# ============================================================================
# PERFORMANCE & OVERHEAD
# ============================================================================

performance:

  filter_loading_time:
    per_tool: "<0.1ms"
    description: "One-time cost at tool launch"
    negligible: "Yes, <100µs"

  runtime_overhead_per_syscall:
    blocked_syscall: "~1µs (filter evaluation) + 0µs (no execution)"
    allowed_syscall: "~0.1µs (filter evaluation) + normal execution"
    total: "Negligible (<1% overhead)"

  comparison:
    - "No seccomp: syscall directly to kernel (~1µs)"
    - "With seccomp: syscall → filter (~1µs) → kernel (~1µs) = ~2µs"
    - "Overhead: ~1µs per syscall (imperceptible for tools)"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:

    seccomp_filter_load_latency:
      type: "Histogram"
      unit: "milliseconds"
      target: "P95 <1ms"
      alert: "P95 > 5ms"

    syscall_blocked_count:
      type: "Counter"
      labels: ["syscall_name", "band", "tool_id"]
      description: "Total blocked syscall attempts"
      expected: "Some blocks are normal (tools may probe)"
      alert: "Unknown syscall blocked (logging error)"

    process_killed_by_seccomp:
      type: "Counter"
      labels: ["reason", "tool_id"]
      alert: "Track processes killed (debugging)"

# ============================================================================
# COMPLIANCE & AUDIT
# ============================================================================

audit_trail:

  events_logged:
    - "seccomp_filter_loaded: tool_id, band, syscall_count"
    - "seccomp_syscall_blocked: tool_id, syscall_name, timestamp"
    - "seccomp_process_killed: tool_id, reason, exit_code"

  retention: "7 years (SOC2/ISO27001)"
  storage: "K0 ToolReceipt (FlatBuffers)"

---

summary:
  capabilities:
    - "Blocklist filter (GREEN/AMBER: block ~20 dangerous syscalls)"
    - "Allowlist filter (RED: allow only read/write/exit)"
    - "Kill filter (BLACK: kill on any syscall)"
    - "<0.1ms filter load time (per tool)"
    - "0ms runtime overhead (kernel-level)"
    - "Architecture-specific rules (x86_64, ARM, etc.)"
    - "Error recovery (fallback if kernel missing seccomp)"
    - "Full audit trail (blocked syscalls logged)"

related_contracts:
  chroot_jail:
    file: "chroot_jail_manager.yml"
    purpose: "Jail that uses this seccomp filter"

  readonly_mounts:
    file: "readonly_mounts_system.yml"
    purpose: "Additional filesystem protection layer"

  output_isolation:
    file: "writable_output_isolation.yml"
    purpose: "Output directory quota (separate layer)"
