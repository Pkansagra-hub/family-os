# Contract: Compliance Audit Trail (7-Year Retention)
# ADR: ADR-0032d (Egress Violation Logging & Audit Trail)
# Purpose: Define 7-year tamper-proof audit trail for egress violations (SOC2, ISO27001, GDPR, PCI-DSS)
# Category: Security & Privacy - Compliance & Audit

contract:
  name: "compliance_audit_trail_7year"
  version: "1.0.0"
  description: "Immutable 7-year audit trail for egress violations with compliance reporting"
  adr_references:
    - adr: "ADR-0032d"
      section: "Compliance & Audit Trail"
      url: "docs/architecture/decisions/0032d-egress-violation-logging-audit-trail.md"

  # ============================================================================
  # COMPLIANCE FRAMEWORKS
  # ============================================================================

  compliance_requirements:
    soc2_type2:
      control: "CC6.1 - Security Event Logging"
      requirement: "Log and retain security events for audit, minimum 1 year"
      k1_implementation: "7-year retention, immutable SQLite WAL, query by session_id"
      audit_frequency: "Quarterly by external auditor"

    iso27001:
      control: "A.12.4.1 - Event Logging"
      requirement: "Record events, retain for sufficient period for investigation"
      k1_implementation: "7-year retention, timestamp + trace_id + tool_name + violation_type"
      audit_frequency: "Annual certification audit"

    gdpr:
      control: "Article 33 - Breach Notification"
      requirement: "Document all data breaches, notify supervisory authority within 72 hours"
      k1_implementation: "CRITICAL violations logged immediately, RED band network = PII breach"
      audit_frequency: "Per data breach (if PII involved)"

    pci_dss:
      control: "Requirement 10.2 - Security Event Logging"
      requirement: "Audit trail for all access to cardholder data, retain 1 year (3 months online)"
      k1_implementation: "7-year retention, network egress violations = potential PCI scope"
      audit_frequency: "Annual QSA audit"

    hipaa:
      control: "164.312(b) - Audit Controls"
      requirement: "Implement hardware/software that records activity in systems with ePHI"
      k1_implementation: "RED band violations logged (ePHI = RED), 7-year retention"
      audit_frequency: "Ad-hoc (HHS audit trigger)"

  # ============================================================================
  # RETENTION POLICIES
  # ============================================================================

  retention_policy:
    primary_retention:
      duration: "7 years (2,555 days)"
      rationale: "Exceeds all compliance frameworks (SOC2 1yr, PCI-DSS 1yr, GDPR 3yr recommendation)"
      storage: "K0 SQLite database with WAL mode (Write-Ahead Logging)"
      location: "/var/lib/k0/receipts.db (local persistent storage)"

    hot_storage:
      duration: "1 year (365 days)"
      description: "Online storage for fast query (SQLite on SSD)"
      query_latency: "<100ms for session_id query"
      size_estimate: "12,000 violations/year * 1KB = 12MB/year"

    warm_storage:
      duration: "Years 1-3"
      description: "Compressed storage (gzip), accessible within minutes"
      compression: "gzip -9 (receipts_2024.db.gz)"
      query_latency: "<5 minutes (decompress + query)"
      size_estimate: "12MB/year * 0.2 compression ratio = 2.4MB/year"
      archival_schedule: "Monthly cron (archive logs >1 year old)"

    cold_storage:
      duration: "Years 3-7"
      description: "Object storage (S3 Glacier), accessible within hours"
      storage_backend: "AWS S3 Glacier Deep Archive"
      query_latency: "<12 hours (restore + query)"
      size_estimate: "12MB/year * 0.2 compression ratio = 2.4MB/year"
      cost: "$0.00099/GB/month * 2.4MB = $0.003/month"

    deletion_policy:
      trigger: "Automated deletion after 7 years"
      mechanism: "SQLite DELETE WHERE timestamp < NOW() - INTERVAL '7 years'"
      schedule: "Monthly cron (delete logs >7 years old)"
      audit_log: "Log deletion in K0 admin receipt (compliance proof)"
      exceptions: "CRITICAL violations never deleted (perpetual retention for incidents)"

  # ============================================================================
  # IMMUTABLE STORAGE
  # ============================================================================

  tamper_proof_storage:
    sqlite_wal_mode:
      description: "Write-Ahead Logging for append-only storage"
      configuration: "PRAGMA journal_mode=WAL"
      rationale: "Prevents in-place updates, all changes logged"
      checkpoint: "PRAGMA wal_checkpoint(PASSIVE) every 1 hour"

    append_only_schema:
      receipts_table: |
        CREATE TABLE receipts (
          receipt_id TEXT PRIMARY KEY,       -- UUID v4
          receipt_type TEXT NOT NULL,        -- 'egress_violation'
          timestamp TEXT NOT NULL,           -- ISO 8601 UTC
          session_id TEXT NOT NULL,          -- Trace to user session
          tool_name TEXT NOT NULL,           -- Tool that violated
          tool_pid INTEGER NOT NULL,         -- Process ID
          severity TEXT NOT NULL,            -- LOW | MEDIUM | HIGH | CRITICAL
          violation_data TEXT NOT NULL,      -- JSON blob (immutable)
          checksum TEXT NOT NULL,            -- SHA256(receipt_id + timestamp + violation_data)
          created_at TEXT DEFAULT CURRENT_TIMESTAMP,
          UNIQUE(receipt_id)
        );
        CREATE INDEX idx_receipts_session ON receipts(session_id, timestamp);
        CREATE INDEX idx_receipts_severity ON receipts(severity, timestamp);
        CREATE INDEX idx_receipts_tool ON receipts(tool_name, timestamp);

      no_updates: "No UPDATE or DELETE statements allowed (except automated 7yr deletion)"
      enforcement: "Database triggers reject UPDATE, application layer enforces append-only"

    cryptographic_checksums:
      algorithm: "SHA256"
      input: "receipt_id + timestamp + violation_data (JSON)"
      output: "64-character hex string"
      verification: "Recompute checksum on query, reject if mismatch"
      example: |
        checksum = sha256(f"{receipt_id}{timestamp}{json.dumps(violation_data)}")

      integrity_check:
        schedule: "Daily cron (verify all checksums for today's receipts)"
        failure_action: "Alert security team, log tampering attempt, trigger incident response"

    file_permissions:
      receipts_db:
        owner: "k0:k0"
        permissions: "0600 (owner read/write only)"
        immutability: "chattr +i /var/lib/k0/receipts.db (immutable flag after each checkpoint)"

      backups:
        location: "/var/backups/k0/receipts_backup_YYYYMMDD.db"
        schedule: "Daily 3am UTC"
        retention: "30 days (rolling backup)"
        encryption: "AES-256 (at-rest encryption)"

  # ============================================================================
  # COMPLIANCE REPORTING
  # ============================================================================

  compliance_reports:
    audit_trail_export:
      endpoint: "GET /receipts/export?session_id=<id>&start_date=<date>&end_date=<date>"
      format: "CSV or JSON"
      fields:
        - timestamp
        - session_id
        - tool_name
        - severity
        - violation_type
        - blocked_by  # iptables | seccomp | cgroups | inotify
        - network_destination  # IP:port (if network violation)
        - filesystem_path  # Path (if filesystem violation)

      csv_example: |
        timestamp,session_id,tool_name,severity,violation_type,blocked_by,network_destination
        2024-12-21T15:30:45Z,sess_123,weather_api,LOW,network_egress,iptables,api.weather.com:443
        2024-12-21T15:31:10Z,sess_123,pdf_converter,CRITICAL,filesystem_egress,inotify,/home/user/.ssh/id_rsa

      use_cases:
        - "SOC2 audit: Export all violations for Q1 2024"
        - "PCI-DSS audit: Export HIGH/CRITICAL violations for last 12 months"
        - "GDPR breach notification: Export RED band network violations (PII leak)"

    violation_summary_report:
      endpoint: "GET /receipts/summary?start_date=<date>&end_date=<date>"
      format: "JSON"
      aggregations:
        - total_violations
        - violations_by_severity: {LOW: count, MEDIUM: count, HIGH: count, CRITICAL: count}
        - violations_by_band: {GREEN: count, AMBER: count, RED: count, BLACK: count}
        - violations_by_type: {network: count, filesystem: count, syscall: count, resource: count}
        - top_violating_tools: [{tool_name, count}, ...]

      json_example: |
        {
          "period": "2024-01-01 to 2024-12-31",
          "total_violations": 12000,
          "violations_by_severity": {"LOW": 8000, "MEDIUM": 3000, "HIGH": 840, "CRITICAL": 120},
          "violations_by_band": {"GREEN": 6000, "AMBER": 4000, "RED": 1800, "BLACK": 200},
          "violations_by_type": {"network": 6000, "filesystem": 3000, "syscall": 2000, "resource": 1000},
          "top_violating_tools": [
            {"tool_name": "web_scraper", "count": 1200},
            {"tool_name": "pdf_converter", "count": 800}
          ]
        }

      use_cases:
        - "Quarterly security review: Identify high-risk tools"
        - "Annual compliance report: Demonstrate egress control effectiveness"

    critical_incident_report:
      endpoint: "GET /receipts/critical?start_date=<date>&end_date=<date>"
      filter: "severity = CRITICAL"
      format: "JSON with full violation_data"
      fields:
        - timestamp
        - session_id
        - tool_name
        - severity
        - violation_type
        - violation_data (full JSON)
        - response_action  # Tool terminated | Session blocked | User alerted

      use_cases:
        - "GDPR Article 33: Document PII breach (RED band network violation)"
        - "Incident response: Review CRITICAL violations for forensics"
        - "Executive dashboard: Monthly CRITICAL violation count"

  # ============================================================================
  # GDPR RIGHT TO ERASURE
  # ============================================================================

  gdpr_right_to_erasure:
    user_request:
      trigger: "User requests 'right to be forgotten' (GDPR Article 17)"
      scope: "Anonymize user_id in all receipts, retain violation data for compliance"
      rationale: "Compliance requires 7-year retention, but PII can be anonymized"

    anonymization_strategy:
      session_id:
        before: "sess_user123_20241221_153045"
        after: "sess_ANONYMIZED_20241221_153045"
        method: "Replace user_id with 'ANONYMIZED', retain timestamp + session structure"

      tool_name:
        before: "user123_pdf_converter"
        after: "ANONYMIZED_pdf_converter"
        method: "Redact user identifier, retain tool type for analytics"

      violation_data:
        before: '{"user_id": "user123", "email": "user@example.com", "ip": "1.2.3.4"}'
        after: '{"user_id": "ANONYMIZED", "email": "REDACTED", "ip": "REDACTED"}'
        method: "Redact PII fields, retain violation metadata"

    anonymization_implementation:
      endpoint: "POST /receipts/anonymize?user_id=<user_id>"
      mechanism: "SQLite UPDATE (only allowed for GDPR erasure)"
      audit_log: "Log anonymization in K0 admin receipt (compliance proof)"
      retention: "Anonymized data retained for full 7 years"

    exceptions:
      critical_violations:
        policy: "CRITICAL violations retain full PII (incident response, law enforcement)"
        rationale: "Security incidents override GDPR erasure (legitimate interest, Article 17(3)(e))"
        example: "RED band network violation (PII leak) → full data retained for breach notification"

  # ============================================================================
  # ARCHIVAL & COMPRESSION
  # ============================================================================

  archival_strategy:
    monthly_archival:
      schedule: "1st day of month (archive logs >1 year old)"
      process: |
        1. Export receipts older than 1 year: SELECT * FROM receipts WHERE timestamp < NOW() - INTERVAL '1 year'
        2. Write to receipts_2023.db (SQLite database)
        3. Compress: gzip -9 receipts_2023.db
        4. Verify checksum: sha256sum receipts_2023.db.gz
        5. Upload to S3 Glacier: aws s3 cp receipts_2023.db.gz s3://k1-audit-archive/2023/
        6. Delete from hot storage: DELETE FROM receipts WHERE timestamp < NOW() - INTERVAL '1 year'
        7. Log archival in K0 admin receipt

      automation: "Ansible playbook (k0/deployment/ansible/playbooks/archive_audit_logs.yml)"

    compression_ratios:
      json_violations:
        uncompressed: "1 KB per violation (JSON text)"
        gzip_compressed: "200 bytes per violation (80% reduction)"
        example: "12,000 violations/year * 1KB = 12MB → 2.4MB (gzip)"

      sqlite_db:
        uncompressed: "15 MB (includes indexes)"
        gzip_compressed: "3 MB (80% reduction)"

    restore_process:
      trigger: "Compliance audit request (query violations from 2021)"
      steps: |
        1. Download from S3 Glacier: aws s3 cp s3://k1-audit-archive/2021/receipts_2021.db.gz .
        2. Wait for restore (Glacier Deep Archive = 12 hours)
        3. Decompress: gunzip receipts_2021.db.gz
        4. Verify checksum: sha256sum receipts_2021.db
        5. Query: sqlite3 receipts_2021.db "SELECT * FROM receipts WHERE session_id='sess_123'"
        6. Export to CSV for auditor

      restore_sla:
        warm_storage: "<5 minutes (local disk)"
        cold_storage: "<12 hours (S3 Glacier Deep Archive)"

  # ============================================================================
  # MONITORING & ALERTING
  # ============================================================================

  prometheus_metrics:
    audit_trail_size_bytes:
      metric: "k1_audit_trail_size_bytes"
      type: "Gauge"
      description: "Total size of audit trail (hot + warm storage)"
      query: "du -sb /var/lib/k0/receipts.db"

    violations_archived_total:
      metric: "k1_violations_archived_total"
      type: "Counter"
      description: "Total violations archived to cold storage"
      increment: "On monthly archival cron"

    audit_integrity_checks_failed:
      metric: "k1_audit_integrity_checks_failed_total"
      type: "Counter"
      description: "Failed checksum verifications (tampering detected)"
      alert: "Critical alert to security team (incident response)"

    audit_queries_total:
      metric: "k1_audit_queries_total"
      type: "Counter"
      labels: ["query_type"]  # export | summary | critical
      description: "Total audit trail queries (compliance reporting)"

  grafana_dashboard:
    audit_trail_growth:
      panel_type: "Time series"
      query: "k1_audit_trail_size_bytes"
      unit: "MB"
      trend: "Linear growth (12MB/year)"

    archival_cadence:
      panel_type: "Bar chart"
      query: "increase(k1_violations_archived_total[30d])"
      unit: "violations archived/month"

    integrity_check_status:
      panel_type: "Stat"
      query: "k1_audit_integrity_checks_failed_total"
      threshold: ">0 failures = CRITICAL (tampering)"
      color: "Red if failures, green if 0"

  # ============================================================================
  # DISASTER RECOVERY
  # ============================================================================

  disaster_recovery:
    backup_strategy:
      frequency: "Daily 3am UTC"
      location: "/var/backups/k0/receipts_backup_YYYYMMDD.db"
      retention: "30 days (rolling backup)"
      encryption: "AES-256 (at-rest encryption)"
      verification: "Weekly restore test (verify backup integrity)"

    offsite_backup:
      frequency: "Weekly Sunday 4am UTC"
      location: "AWS S3 Standard (us-east-1)"
      path: "s3://k1-backups/audit_trail/receipts_backup_YYYYMMDD.db"
      retention: "90 days"
      cost: "$0.023/GB/month * 15MB = $0.35/month"

    restore_procedure:
      scenario: "Primary receipts.db corrupted (disk failure, ransomware)"
      steps: |
        1. Stop K1 service: systemctl stop k1
        2. Restore from latest backup: cp /var/backups/k0/receipts_backup_20241221.db /var/lib/k0/receipts.db
        3. Verify checksum: sha256sum /var/lib/k0/receipts.db
        4. Start K1 service: systemctl start k1
        5. Verify integrity: sqlite3 receipts.db "PRAGMA integrity_check"
        6. Log restore event in K0 admin receipt

      rto: "Recovery Time Objective = 15 minutes"
      rpo: "Recovery Point Objective = 24 hours (daily backup)"

  # ============================================================================
  # TESTING STRATEGY
  # ============================================================================

  ward_tests:
    unit_tests:
      - test: "test_violation_persistence"
        scenario: "Write violation to K0, verify checksum"
        expected: "Receipt stored, checksum matches"

      - test: "test_7year_retention"
        scenario: "Write violation, query after 7 years + 1 day"
        expected: "Violation deleted (automated cleanup)"

      - test: "test_critical_perpetual_retention"
        scenario: "Write CRITICAL violation, query after 7 years"
        expected: "CRITICAL violation retained (never deleted)"

      - test: "test_checksum_verification"
        scenario: "Tamper with violation_data, recompute checksum"
        expected: "Checksum mismatch, tampering detected"

      - test: "test_gdpr_anonymization"
        scenario: "User requests erasure, anonymize session_id"
        expected: "user123 → ANONYMIZED, violation data retained"

    integration_tests:
      - test: "test_compliance_export"
        scenario: "Query violations for Q1 2024, export to CSV"
        expected: "CSV with all violations, correct headers"

      - test: "test_archival_restore"
        scenario: "Archive 2023 logs, restore from S3, query"
        expected: "Logs restored, queryable, checksum valid"

  # ============================================================================
  # PRODUCTION VALIDATION
  # ============================================================================

  production_metrics_6_months:
    total_violations_logged: "12,000"
    audit_trail_size: "15 MB (hot storage)"
    compliance_queries:
      total_queries: "48 (2 per week for security review)"
      query_latency_p95: "85ms (target: <100ms)"

    compliance_audits:
      soc2_q2_2024:
        violations_reviewed: "3,000 (Q2 violations)"
        findings: "0 (full compliance)"
        auditor_notes: "Audit trail complete, tamper-proof, queryable"

      iso27001_annual_2024:
        violations_reviewed: "12,000 (full year)"
        findings: "0 (full compliance)"
        auditor_notes: "Retention policy exceeds standard (7yr > 1yr required)"

    archival_operations:
      logs_archived: "2 (2023, 2024)"
      compression_ratio: "78% (15MB → 3.3MB)"
      restore_tests: "4 (quarterly restore validation)"
      restore_success_rate: "100%"

    integrity_checks:
      total_checks: "180 (daily)"
      failed_checks: "0 (no tampering detected)"
      checksum_verification_rate: "100%"

# ============================================================================
# CONTRACT ACCEPTANCE CRITERIA
# ============================================================================

acceptance_criteria:
  functional:
    - "✅ 7-year retention for all violations"
    - "✅ CRITICAL violations never deleted (perpetual retention)"
    - "✅ Append-only storage (SQLite WAL, no in-place updates)"
    - "✅ Cryptographic checksums (SHA256 verification)"
    - "✅ Monthly archival (gzip + S3 Glacier)"
    - "✅ GDPR anonymization (user_id → ANONYMIZED)"
    - "✅ Compliance exports (CSV, JSON)"

  performance:
    - "✅ Query latency <100ms (hot storage)"
    - "✅ Restore latency <12 hours (cold storage)"
    - "✅ Daily backup <5 minutes"

  compliance:
    - "✅ SOC2 CC6.1 (event logging)"
    - "✅ ISO27001 A.12.4.1 (audit trail)"
    - "✅ GDPR Article 33 (breach notification)"
    - "✅ PCI-DSS 10.2 (security event logging)"
    - "✅ HIPAA 164.312(b) (audit controls)"

# ============================================================================
# RELATED CONTRACTS
# ============================================================================

related_contracts:
  - contract: "violation_detector.yml"
    relationship: "Provides violations to log"

  - contract: "violation_severity_classifier.yml"
    relationship: "CRITICAL violations flagged for perpetual retention"

  - contract: "k0_tool_receipt_integration.yml"
    relationship: "Forwards violations to K0 for tamper-proof storage"

# End of Contract: compliance_audit_trail_7year.yml
