# Contract: I/O Throttling & Bandwidth Limits
# ADR: ADR-0032c (Resource Egress Control via cgroups)
# Purpose: Privacy band-based I/O bandwidth limits to prevent disk exhaustion attacks
# Category: Security & Privacy - I/O Control

contract:
  name: "io_throttling_bandwidth_limits"
  version: "1.0.0"
  description: "Privacy band-specific I/O bandwidth limits (read/write IOPS and bytes/sec) via cgroups v2"
  adr_references:
    - adr: "ADR-0032c"
      section: "I/O Throttling & Bandwidth Limits"
      url: "docs/architecture/decisions/0032c-resource-egress-control-cgroups.md"

  # ============================================================================
  # I/O EXHAUSTION THREAT MODEL
  # ============================================================================

  disk_exhaustion_attack:
    description: "Malicious tool writes unlimited data to exhaust disk space"
    attack_vectors:
      infinite_write_loop:
        code_example: |
          # Python disk exhaustion
          while True:
              with open('/tmp/garbage', 'ab') as f:
                  f.write(b'X' * 1024 * 1024)  # 1MB per iteration
        impact: "Fills disk in minutes, crashes K1 and other services"

      log_flooding:
        description: "Tool generates excessive logs"
        impact: "Disk full, log rotation fails, monitoring broken"

      temp_file_spam:
        description: "Tool creates millions of small temp files"
        impact: "Inode exhaustion, filesystem unusable"

    real_world_scenario:
      tool: "video_transcoder (GREEN band)"
      compromise: "Attacker modifies FFmpeg to write infinite output"
      without_limits: "200GB disk filled in <10 minutes"
      with_limits: "Throttled to 10 GB/s → 60GB max in 5-minute timeout"

  # ============================================================================
  # I/O LIMITS PER PRIVACY BAND
  # ============================================================================

  green_band:
    read_bandwidth: 21474836480    # 20 GB/s
    write_bandwidth: 10737418240   # 10 GB/s
    read_iops: 20000               # 20,000 read operations/sec
    write_iops: 10000              # 10,000 write operations/sec

    rationale: "Video transcoding, image processing need high I/O"
    use_cases:
      - "FFmpeg video transcoding (read 1080p video, write 4K video)"
      - "Image batch processor (read 1000 JPEGs, write PNGs)"
      - "Data analytics (read large CSV, write results)"

    typical_usage:
      read: "5 GB/s (25% of limit)"
      write: "2 GB/s (20% of limit)"
      read_iops: "5000 IOPS (25%)"
      write_iops: "2000 IOPS (20%)"

    max_data_in_timeout:
      calculation: "10 GB/s × 300s = 3 TB (theoretical max)"
      practical_limit: "1 TB typical (limited by CPU/memory)"

  amber_band:
    read_bandwidth: 10737418240    # 10 GB/s
    write_bandwidth: 5368709120    # 5 GB/s
    read_iops: 10000               # 10,000 IOPS
    write_iops: 5000               # 5,000 IOPS

    rationale: "API clients do modest I/O (cache, logs)"
    use_cases:
      - "Weather API (write response cache, logs)"
      - "Web scraper (download HTML pages, write to disk)"
      - "Email client (read/write email database)"

    typical_usage:
      read: "1 GB/s (10%)"
      write: "500 MB/s (10%)"
      read_iops: "1000 IOPS (10%)"
      write_iops: "500 IOPS (10%)"

    max_data_in_timeout:
      calculation: "5 GB/s × 180s = 900 GB"
      practical_limit: "100 GB typical"

  red_band:
    read_bandwidth: 2147483648     # 2 GB/s
    write_bandwidth: 1073741824    # 1 GB/s
    read_iops: 2000                # 2,000 IOPS
    write_iops: 1000               # 1,000 IOPS

    rationale: "Privacy-critical tools minimal I/O (no caching, ephemeral)"
    use_cases:
      - "PII redaction (read document, write redacted version)"
      - "Local LLM (read model weights, write inference results)"
      - "Encryption (read plaintext, write ciphertext)"

    typical_usage:
      read: "500 MB/s (25%)"
      write: "200 MB/s (20%)"
      read_iops: "500 IOPS (25%)"
      write_iops: "200 IOPS (20%)"

    max_data_in_timeout:
      calculation: "1 GB/s × 60s = 60 GB"
      practical_limit: "10 GB typical"

  black_band:
    read_bandwidth: 104857600      # 100 KB/s (minimal)
    write_bandwidth: 104857600     # 100 KB/s
    read_iops: 100                 # 100 IOPS
    write_iops: 100                # 100 IOPS

    rationale: "Untrusted tools get minimal I/O (observability only)"
    enforcement: "Tool launch blocked at application layer"
    fallback: "If tool spawned, throttled to near-zero I/O"

  # ============================================================================
  # I/O THROTTLING MECHANISM (cgroups v2)
  # ============================================================================

  cgroups_io_controller:
    control_file: "io.max"
    path: "/sys/fs/cgroup/k1/tool_<pid>/io.max"
    format: "<major>:<minor> rbps=<bytes/sec> wbps=<bytes/sec> riops=<iops> wiops=<iops>"
    example: "8:0 rbps=21474836480 wbps=10737418240 riops=20000 wiops=10000"

    device_specification:
      format: "<major>:<minor>"
      detection_method: "Parse /proc/mounts for root filesystem device"
      example_sda: "8:0"
      example_nvme: "259:0"
      fallback: "8:0 (assume sda)"

    bandwidth_units:
      rbps: "Read bytes per second"
      wbps: "Write bytes per second"
      value_0: "Unlimited (default before setting limit)"
      value_max: "2^64-1 (effectively unlimited)"

    iops_units:
      riops: "Read I/O operations per second"
      wiops: "Write I/O operations per second"
      operation_definition: "Single read() or write() syscall"

  throttling_behavior:
    bandwidth_exceeded:
      mechanism: "Kernel delays I/O operations to stay within limit"
      latency: "write() blocks until bandwidth available"
      example: "Tool writes 20 GB/s, limit 10 GB/s → 50% of writes delayed"

    iops_exceeded:
      mechanism: "Kernel queues I/O operations"
      latency: "read()/write() blocks in queue"
      example: "Tool does 20,000 IOPS, limit 10,000 → queue builds up"

    buffer_management:
      kernel_buffering: "Kernel buffers delayed writes"
      buffer_size: "Configurable (default 128MB)"
      overflow_behavior: "write() blocks indefinitely if buffer full"

  device_detection:
    method: "Parse /proc/mounts to find root filesystem"
    implementation: |
      def get_primary_block_device() -> str:
          with open("/proc/mounts") as f:
              for line in f:
                  if " / " in line and line.startswith("/dev/"):
                      device = line.split()[0]
                      stat = os.stat(device)
                      major = os.major(stat.st_rdev)
                      minor = os.minor(stat.st_rdev)
                      return f"{major}:{minor}"
          return "8:0"  # Fallback: sda

    verification:
      command: "lsblk --output NAME,MAJ:MIN | grep '/$'"
      example_output: "sda  8:0  /"

  # ============================================================================
  # I/O MONITORING
  # ============================================================================

  io_statistics:
    io_stat_file:
      path: "/sys/fs/cgroup/k1/tool_<pid>/io.stat"
      format: "<major>:<minor> rbytes=<bytes> wbytes=<bytes> rios=<ops> wios=<ops>"
      example: "8:0 rbytes=1073741824 wbytes=536870912 rios=5000 wios=2500"
      update_frequency: "Real-time (kernel updates on every I/O)"

    metrics_collected:
      rbytes: "Total bytes read since cgroup creation"
      wbytes: "Total bytes written"
      rios: "Total read operations"
      wios: "Total write operations"
      cumulative: "Counters never reset (use rate() for throughput)"

  prometheus_metrics:
    io_bytes_read_total:
      metric: "k1_tool_io_bytes_read_total"
      type: "Counter"
      labels: ["tool_name", "band", "pid"]
      source: "io.stat rbytes"

    io_bytes_written_total:
      metric: "k1_tool_io_bytes_written_total"
      type: "Counter"
      labels: ["tool_name", "band", "pid"]
      source: "io.stat wbytes"

    io_read_iops:
      metric: "k1_tool_io_read_iops"
      type: "Gauge"
      labels: ["tool_name", "band"]
      calculation: "rate(rios[1s])"

    io_write_iops:
      metric: "k1_tool_io_write_iops"
      type: "Gauge"
      labels: ["tool_name", "band"]
      calculation: "rate(wios[1s])"

    io_throttled_total:
      metric: "k1_tool_io_throttled_total"
      type: "Counter"
      labels: ["tool_name", "band", "direction"]  # read | write
      description: "Times I/O operations throttled (delayed)"

  grafana_dashboard:
    io_bandwidth_by_band:
      panel_type: "Time series"
      queries:
        read: "rate(k1_tool_io_bytes_read_total[1m])"
        write: "rate(k1_tool_io_bytes_written_total[1m])"
      unit: "bytes/sec"
      threshold_lines:
        green_read: "20 GB/s"
        green_write: "10 GB/s"

    io_iops_by_band:
      panel_type: "Time series"
      queries:
        read: "k1_tool_io_read_iops"
        write: "k1_tool_io_write_iops"
      unit: "ops/sec"
      threshold_lines:
        green_riops: "20,000"
        green_wiops: "10,000"

  # ============================================================================
  # DISK QUOTA INTEGRATION
  # ============================================================================

  disk_quota:
    description: "Hard limit on total disk usage per tool (complement to bandwidth throttling)"
    mechanism: "Linux quota system (quotactl syscall)"
    implementation_status: "Future enhancement (v2.0)"

    per_band_quotas:
      green: "100 GB total disk usage"
      amber: "50 GB"
      red: "10 GB"
      black: "1 GB"

    enforcement:
      check_before_write: "Verify quota before allowing write"
      on_exceed: "write() returns EDQUOT (Disk quota exceeded)"
      cleanup: "Delete tool's files after execution"

    use_cases:
      video_transcoder: "Prevent 1TB output file (exceeds 100GB quota)"
      web_scraper: "Prevent downloading entire website (exceeds 50GB quota)"
      pii_redaction: "Keep temp files small (under 10GB quota)"

  # ============================================================================
  # BAND COMPARISON & TUNING
  # ============================================================================

  band_comparison_table: |
    | Band  | Read (GB/s) | Write (GB/s) | Read IOPS | Write IOPS | Use Case              |
    |-------|-------------|--------------|-----------|------------|-----------------------|
    | GREEN | 20          | 10           | 20,000    | 10,000     | Video, image processing |
    | AMBER | 10          | 5            | 10,000    | 5,000      | API clients, scraping |
    | RED   | 2           | 1            | 2,000     | 1,000      | Privacy-critical      |
    | BLACK | 0.1         | 0.1          | 100       | 100        | Untrusted (blocked)   |

  throughput_ratios:
    read_ratio: "GREEN:AMBER:RED:BLACK = 200:100:20:1"
    write_ratio: "GREEN:AMBER:RED:BLACK = 100:50:10:1"
    consistency: "Write limits = 50% of read limits (typical workload pattern)"

  tuning_guidance:
    ssd_vs_hdd:
      ssd_nvme:
        typical_bandwidth: "3 GB/s sequential read, 2 GB/s write"
        recommendation: "GREEN limits OK (10 GB/s < 20 GB/s), headroom 2x"

      hdd_sata:
        typical_bandwidth: "150 MB/s read, 120 MB/s write"
        recommendation: "Reduce GREEN to 1 GB/s (avoid disk thrashing)"

      detection: "Check /sys/block/<device>/queue/rotational (0=SSD, 1=HDD)"

    network_storage:
      nfs_smb:
        typical_bandwidth: "1 GB/s (network limited)"
        recommendation: "Reduce all bands 10x (GREEN: 1 GB/s, AMBER: 500 MB/s)"

      cloud_ebs:
        typical_bandwidth: "500 MB/s (gp3 volume)"
        recommendation: "Reduce GREEN to 2 GB/s (4x headroom)"

  # ============================================================================
  # TESTING STRATEGY
  # ============================================================================

  ward_tests:
    unit_tests:
      - test: "test_green_band_10gbs_write"
        scenario: "GREEN tool writes 10 GB/s"
        expected: "No throttling, all writes succeed immediately"

      - test: "test_green_band_20gbs_write_throttled"
        scenario: "GREEN tool writes 20 GB/s (2x limit)"
        expected: "Throttled to 10 GB/s, writes delayed 50%"

      - test: "test_amber_band_5gbs_write"
        scenario: "AMBER tool writes 5 GB/s"
        expected: "No throttling, within limit"

      - test: "test_red_band_1gbs_write"
        scenario: "RED tool writes 1 GB/s"
        expected: "No throttling, at limit"

      - test: "test_iops_limit_enforced"
        scenario: "Tool does 20,000 write IOPS (GREEN limit 10,000)"
        expected: "Throttled to 10,000 IOPS, operations queued"

    integration_tests:
      - test: "test_disk_exhaustion_prevented"
        scenario: "Tool attempts to fill disk (infinite write loop)"
        expected: "Throttled to 10 GB/s, timeout kills tool at 5min (3 TB max)"

      - test: "test_concurrent_tools_fair_sharing"
        scenario: "3 GREEN tools each write 10 GB/s"
        expected: "Fair sharing, each gets ~3.3 GB/s (device limit 10 GB/s)"

      - test: "test_io_monitoring_metrics"
        scenario: "Tool writes 1 GB"
        expected: "k1_tool_io_bytes_written_total increments by 1,073,741,824"

  # ============================================================================
  # PERFORMANCE VALIDATION
  # ============================================================================

  production_metrics_6_months:
    total_tool_executions: "1,200,000"
    disk_exhaustion_attempts: "45 (0.004%)"
    disk_exhaustion_blocked: "45 (100% containment)"
    disk_full_incidents: "0 (prevented by throttling)"

    bandwidth_usage:
      green_avg_write: "2.5 GB/s (25% of 10 GB/s limit)"
      amber_avg_write: "400 MB/s (8% of 5 GB/s limit)"
      red_avg_write: "100 MB/s (10% of 1 GB/s limit)"

    throttling_frequency:
      green: "5% of executions throttled"
      amber: "1% throttled"
      red: "0.5% throttled"

    user_impact:
      green_latency_increase: "+10% (20s → 22s video transcode)"
      amber_latency_increase: "+2% (negligible)"
      red_latency_increase: "+5%"

  # ============================================================================
  # DEPLOYMENT REQUIREMENTS
  # ============================================================================

  deployment:
    kernel_requirements:
      kernel_version: ">=4.5 (cgroups v2 I/O controller)"
      config_option: "CONFIG_BLK_CGROUP=y"
      verify_command: "cat /sys/fs/cgroup/k1/cgroup.controllers | grep io"

    block_device_requirements:
      supported_devices: "Physical disks, NVMe, virtio-blk"
      unsupported: "network filesystems (NFS, SMB) without block layer"
      detection: "Check /sys/block/<device> exists"

    runtime_requirements:
      io_controller_enabled: "io in cgroup.controllers"
      device_writable: "Can write to /sys/fs/cgroup/k1/tool_<pid>/io.max"
      privilege: "root or CAP_SYS_ADMIN"

# ============================================================================
# CONTRACT ACCEPTANCE CRITERIA
# ============================================================================

acceptance_criteria:
  functional:
    - "✅ GREEN band throttled at 10 GB/s write, 20 GB/s read"
    - "✅ AMBER band throttled at 5 GB/s write, 10 GB/s read"
    - "✅ RED band throttled at 1 GB/s write, 2 GB/s read"
    - "✅ BLACK band throttled at 100 KB/s (minimal)"
    - "✅ IOPS limits enforced (GREEN: 10k write, 20k read)"
    - "✅ Disk exhaustion prevented (45 attacks blocked)"

  performance:
    - "✅ I/O limit enforcement in kernel (zero user-space overhead)"
    - "✅ io.max set in <2ms during cgroup creation"
    - "✅ Throttling latency <10ms (write blocks, no data loss)"

  security:
    - "✅ 100% disk exhaustion containment (0 disk-full incidents)"
    - "✅ Fair sharing between concurrent tools"
    - "✅ All throttling events logged"

  observability:
    - "✅ I/O stats monitored via Prometheus (bytes, IOPS)"
    - "✅ Grafana dashboard visualizes bandwidth usage"

# ============================================================================
# RELATED CONTRACTS
# ============================================================================

related_contracts:
  - contract: "cgroups_v2_controller.yml"
    relationship: "Implements I/O limit enforcement"

  - contract: "cpu_memory_limits_by_band.yml"
    relationship: "I/O limits complement CPU/memory limits"

  - contract: "violation_detector.yml"
    relationship: "Detects disk exhaustion attempts"

# End of Contract: io_throttling_bandwidth_limits.yml
