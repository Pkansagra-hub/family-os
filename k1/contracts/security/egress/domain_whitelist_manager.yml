# Domain Whitelist Manager Contract - Issue 2.5.5, Part 3
# Purpose: Per-tool domain whitelist management with dynamic reload
# Source ADR: ADR-0032, ADR-0032a
# Last Updated: 2025-10-15

name: "Domain Whitelist Manager"
purpose: "Manage per-tool domain whitelists for GREEN/AMBER bands, dynamic reload <100ms"
scope: ["Network Egress", "Domain Validation", "Dynamic Configuration"]
version: "1.0"

# ============================================================================
# DOMAIN WHITELIST REGISTRY
# ============================================================================

tool_whitelists:

  web_search:
    band: "GREEN"
    description: "Web search via Google Custom Search API"

    domains:
      google_apis:
        - "api.google.com"
        - "cse.google.com"
        - "customsearch.googleapis.com"

      general_web:
        - "*.google.com (Google Search)"
        - "*.bing.com (Bing Search)"
        - "*.wikipedia.org (Wikipedia)"

    ports: [80, 443]
    protocols: ["tcp"]

  image_generation:
    band: "GREEN"
    description: "Image generation via Replicate API"

    domains:
      api:
        - "api.replicate.com"
        - "*.replicate.com"

      models:
        - "huggingface.co (Model downloads)"

    ports: [443]
    protocols: ["tcp"]

  llm_api_openai:
    band: "GREEN"
    description: "OpenAI API (GPT-4, etc.)"

    domains:
      openai:
        - "api.openai.com"
        - "auth.openai.com"
        - "cdn.openai.com"

    ports: [443]
    protocols: ["tcp"]
    note: "HTTPS only, no HTTP"

  llm_api_anthropic:
    band: "GREEN"
    description: "Anthropic API (Claude)"

    domains:
      anthropic:
        - "api.anthropic.com"

    ports: [443]
    protocols: ["tcp"]

  weather_data:
    band: "GREEN"
    description: "Weather information APIs"

    domains:
      weather_services:
        - "api.openweathermap.org"
        - "api.weather.com"
        - "weather.noaa.gov"

    ports: [80, 443]
    protocols: ["tcp"]

  email_smtp:
    band: "AMBER"
    description: "Email SMTP/IMAP with PII masking"

    domains:
      gmail:
        - "smtp.gmail.com"
        - "imap.gmail.com"

      office365:
        - "smtp.office365.com"
        - "imap.outlook.office365.com"

    ports: [587, 993]
    protocols: ["tcp"]
    note: "PII masking enforced on email body"

  slack_api:
    band: "AMBER"
    description: "Slack API for messaging"

    domains:
      slack:
        - "api.slack.com"
        - "*.slack.com"

    ports: [443]
    protocols: ["tcp"]
    note: "PII masking on message content"

  google_calendar:
    band: "AMBER"
    description: "Google Calendar API (authenticated)"

    domains:
      google_calendar:
        - "www.googleapis.com (Calendar API)"
        - "calendar.google.com"

    ports: [443]
    protocols: ["tcp"]
    note: "API key required, PII masking on event data"

  payment_processing:
    band: "AMBER"
    description: "Payment API (Stripe, Square) with PII masking"

    domains:
      stripe:
        - "api.stripe.com"
        - "checkout.stripe.com"

      square:
        - "connect.squareup.com"

    ports: [443]
    protocols: ["tcp"]
    note: "PII masking on customer data (credit cards masked)"

# ============================================================================
# DOMAIN RESOLVER
# ============================================================================

resolver:

  resolution_process:

    step_1_load_whitelist:
      action: "Load tool's domain whitelist from config"
      example: "web_search → ['api.google.com', '*.google.com', '*.wikipedia.org']"

    step_2_resolve_wildcard:
      action: "Expand wildcard domains to IP ranges (if applicable)"
      logic: |
        For *.google.com:
          - Try DNS (getaddrinfo("*.google.com")) → may fail
          - Fall back to approximate range (use google-owned IP ranges)
          - Cache ranges with 300s TTL
      examples:
        - "*.google.com → Google AS15169 (198.41.208.0/24, etc.)"
        - "*.openai.com → OpenAI AS16509 (AWS, many ranges)"

    step_3_dns_resolution:
      action: "Resolve each domain to IP address"
      method: "getaddrinfo(domain)"
      caching: "300s TTL (cache entries)"
      retry: "Exponential backoff (500ms, 1s, 2s)"
      timeout: "5s per domain"
      example: |
        api.google.com → [142.251.32.14, 2607:f8b0:4004:809::200e]

    step_4_cache_result:
      action: "Store IPs in resolver cache"
      key: "domain"
      value: "[ip1, ip2, ...] + ttl_expiry"
      storage: "In-memory LRU cache (1000 entries)"

    step_5_return_ips:
      action: "Return resolved IPs to iptables_egress_controller"
      format: "[{ip: '142.251.32.14', port: 443}, ...]"

  dns_caching:
    strategy: "DNS cache with 300s TTL"
    cache_size: "1000 domain entries"
    eviction_policy: "LRU (least recently used)"
    hit_rate_target: "85%+ (minimize DNS queries)"

    metrics:
      cache_hit_rate: "Track % of cache hits"
      dns_latency: "<50ms P95 (typical, 300s cache)"
      resolution_failures: "Track unresolved domains"

  wildcard_handling:

    strategy_1_dns_expansion:
      description: "Try DNS wildcard expansion"
      limitation: "Most DNS servers don't support *.domain.com queries"
      result: "Usually fails → fallback to strategy 2"

    strategy_2_asn_lookup:
      description: "Use AS (Autonomous System) IP ranges"
      examples:
        - "*.google.com → Google AS15169 owned IP ranges"
        - "*.openai.com → OpenAI/AWS (AS16509)"
      data_source: "MaxMind GeoIP2, TeamCymru"
      coverage: "Coverage for 1000+ major organizations"
      fallback: "If AS not found → block domain (safe default)"

    strategy_3_manual_config:
      description: "Define wildcard expansions in config"
      format: |
        wildcard_expansions:
          "*.google.com": ["142.251.0.0/15", "198.41.208.0/24"]
          "*.openai.com": ["52.84.0.0/15", "44.193.0.0/15"]
      benefit: "Precise, no DNS/ASN lookup needed"

# ============================================================================
# DYNAMIC RELOAD MECHANISM
# ============================================================================

dynamic_reload:

  trigger_conditions:

    on_config_change:
      event: "Tool whitelist updated in config"
      example: "Add google_calendar to web_search whitelist"
      action: "Reload whitelists and regenerate iptables rules"
      latency_target: "<100ms"

    on_ttl_expiry:
      event: "DNS cache entry expires (300s TTL)"
      action: "Re-resolve domain, update iptables rule"
      latency_target: "<50ms"

    on_dns_failure:
      event: "DNS resolution fails"
      action: "Block domain, retry in 60s"
      escalation: "Log as WARNING"

  reload_steps:

    step_1_parse_new_config:
      action: "Parse new whitelist from config file"
      format: "YAML/JSON domain list"
      latency: "<5ms"

    step_2_resolve_domains:
      action: "Resolve new domains to IPs"
      method: "Use DNS cache (already resolved) if available"
      latency: "<20ms (cache hits) or <50ms (new resolution)"

    step_3_generate_iptables:
      action: "Generate iptables rules for new IPs"
      example: |
        iptables -A K1_TOOL_WEB_SEARCH_RULES -d 142.251.32.14 -p tcp --dport 443 -j ACCEPT
      latency: "<10ms"

    step_4_atomic_swap:
      action: "Atomically replace iptables rules"
      method: "iptables-save | iptables-restore (atomic kernel call)"
      latency: "<5ms"

    step_5_verify:
      action: "Confirm new rules active"
      check: "Test connection to whitelisted domain"
      latency: "<10ms"

    total_reload_latency:
      target: "<100ms P95"
      breakdown: "5 + 50 + 10 + 5 + 10 = 80ms worst case"

  zero_downtime:
    strategy: "Never block in-flight connections"
    mechanism: |
      1. Create new iptables chain (K1_TOOL_NEW_RULES)
      2. Add new rules to K1_TOOL_NEW_RULES
      3. Atomically swap OUTPUT chain pointer (single iptables call)
      4. Delete old chain after 1s grace period
    result: "No connection drops during reload"

# ============================================================================
# API: WHITELIST MANAGEMENT
# ============================================================================

api_endpoints:

  POST /whitelists/{tool_id}:
    description: "Add domain to tool whitelist"
    request: |
      {
        "domain": "api.weather.com",
        "ports": [443],
        "protocols": ["tcp"]
      }
    response:
      status: 200
      body: |
        {
          "tool_id": "web_search",
          "domain": "api.weather.com",
          "resolved_ips": ["1.2.3.4", "1.2.3.5"],
          "reload_latency_ms": 42
        }
    side_effects: "Reload iptables rules (<100ms), alert K1 kernel"

  GET /whitelists/{tool_id}:
    description: "Get all domains for tool"
    response:
      status: 200
      body: |
        {
          "tool_id": "web_search",
          "domains": [
            {
              "domain": "api.google.com",
              "resolved_ips": ["142.251.32.14"],
              "ports": [443],
              "protocols": ["tcp"],
              "last_resolved": "2025-10-15T10:00:00Z",
              "cache_ttl_remaining_s": 234
            }
          ]
        }

  DELETE /whitelists/{tool_id}/{domain}:
    description: "Remove domain from tool whitelist"
    response:
      status: 204
      side_effects: "Reload iptables rules (<100ms)"

  POST /whitelists/{tool_id}/reload:
    description: "Force immediate reload (for testing)"
    response:
      status: 200
      body: |
        {
          "reload_latency_ms": 38,
          "rules_updated": 12,
          "status": "SUCCESS"
        }

# ============================================================================
# ERROR HANDLING & RECOVERY
# ============================================================================

error_scenarios:

  scenario_1_dns_resolution_fails:
    trigger: "getaddrinfo(domain) fails or times out"
    handling: |
      1. Log error: "dns_resolution_failed: domain=api.google.com, error=ENOTFOUND"
      2. Retry with exponential backoff (500ms, 1s, 2s, 4s)
      3. After 3 failed retries, block domain (safe default)
      4. Alert: WARNING (not critical, may be temporary)
      5. Attempt retry every 60s until success
    outcome: "Domain blocked until DNS recovers"
    sla: "Restore within 60s of DNS recovery"

  scenario_2_config_reload_fails:
    trigger: "YAML parse error or invalid domain format"
    handling: |
      1. Log error: "config_parse_error: invalid_yaml"
      2. REVERT to previous known-good config
      3. Alert: CRITICAL (manual intervention needed)
      4. Keep existing iptables rules active (no disruption)
    outcome: "Fallback to previous config, operator fixes YAML"

  scenario_3_iptables_permissions_denied:
    trigger: "iptables call returns EPERM"
    handling: |
      1. Verify process runs as root (required)
      2. Log error: "iptables_permission_denied: uid={uid}"
      3. Alert: CRITICAL
      4. Fail-safe: Do NOT create rules (better to block all than crash)
    outcome: "No new rules, existing rules stay active"

  scenario_4_too_many_domains:
    trigger: "Whitelist has >1000 domains per tool"
    handling: |
      1. Compress whitelist (group domains by organization)
      2. Warn: "Too many domains (1234), compressed to 500"
      3. Log which domains were omitted
      4. Monitor for false-negatives (blocked legitimate traffic)
    note: "iptables can handle 10K+ rules, but performance degrades"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:

    dns_resolution_latency:
      type: "Histogram"
      unit: "milliseconds"
      labels: ["domain", "result"]
      values: [10, 20, 30, 50, 100]
      target: "P95 <50ms (mostly cache hits)"

    dns_cache_hit_rate:
      type: "Gauge"
      unit: "percentage"
      target: "85%+"
      alert: "Below 60% (poor cache performance)"

    domain_resolution_failures:
      type: "Counter"
      labels: ["domain", "error_type"]
      error_types: ["ENOTFOUND", "ETIMEDOUT", "ECONNREFUSED"]
      alert: ">5 failures for same domain in 5min"

    reload_latency:
      type: "Histogram"
      unit: "milliseconds"
      target: "P95 <100ms"
      alert: "P95 > 200ms"

    whitelist_size:
      type: "Gauge"
      unit: "domains per tool"
      labels: ["tool_id"]
      alert: ">1000 domains (performance warning)"

# ============================================================================
# COMPLIANCE & AUDIT
# ============================================================================

audit_trail:

  events_logged:
    - "domain_added: tool_id, domain, user"
    - "domain_removed: tool_id, domain, user"
    - "whitelist_reloaded: tool_id, domain_count, latency_ms"
    - "dns_resolution_failed: domain, error, retry_count"
    - "config_reload_failed: error_details"

  retention: "7 years (SOC2/ISO27001)"
  storage: "K0 ToolReceipt (FlatBuffers)"

---

summary:
  capabilities:
    - "Per-tool domain whitelist registry"
    - "Dynamic reload <100ms (atomic iptables swap)"
    - "DNS caching with 300s TTL (85%+ hit rate)"
    - "Wildcard domain support (*.domain.com)"
    - "Error recovery (DNS retry, config fallback)"
    - "API for whitelist management (add/remove/reload)"
    - "Full audit trail (7-year retention)"
    - "Monitoring & alerting (latency, failures, cache hit rate)"

related_contracts:
  iptables_controller:
    file: "iptables_egress_controller.yml"
    purpose: "Rule enforcement"

  privacy_bands:
    file: "privacy_band_network_policies.yml"
    purpose: "Band policy definitions"

  private_ip_blocker:
    file: "private_ip_blocker.yml"
    purpose: "IP range blocking"
