# Read-Only Mounts System Contract - Issue 2.5.5, Filesystem Layer 2
# Purpose: Read-only mount enforcement for system files (MS_RDONLY + MS_NOSUID + MS_NODEV)
# Source ADR: ADR-0032b (Filesystem Egress Control)
# Last Updated: 2025-10-15

name: "Read-Only Mounts System"
purpose: "Enforce read-only mounts for system libraries and config"
scope: ["Filesystem Enforcement", "Mount Flags", "Write Prevention"]
version: "1.0"

# ============================================================================
# MOUNT FLAGS & SEMANTICS
# ============================================================================

mount_flags:

  ms_rdonly:
    name: "Read-Only"
    value: "0x1"
    effect: "Prevent all write operations to filesystem"
    syscalls_blocked: ["open(O_WRONLY)", "open(O_RDWR)", "unlink", "mkdir", "mknod"]
    example: |
      mount -o ro /usr/lib /jail/usr/lib
      Result: All write attempts return EROFS (read-only filesystem)

  ms_nosuid:
    name: "No SUID"
    value: "0x2"
    effect: "Prevent setuid/setgid bits from taking effect"
    protection: "Prevents privilege escalation via setuid binaries"
    scenario: |
      Without MS_NOSUID:
        /usr/bin/sudo (suid root) → Process runs as root ❌

      With MS_NOSUID:
        /usr/bin/sudo (suid root) → Process runs as tool user ✅

  ms_nodev:
    name: "No Device Nodes"
    value: "0x4"
    effect: "Prevent access to device files on this mount"
    protection: "Prevents raw disk/memory access"
    scenario: |
      Without MS_NODEV:
        /dev/sda → Tool can read/write disk ❌

      With MS_NODEV:
        /dev/sda → EACCES (operation not permitted) ✅

# ============================================================================
# READ-ONLY MOUNT CONFIGURATION
# ============================================================================

readonly_mounts_by_band:

  green_band:
    description: "System libraries and binaries are read-only"

    mounts:
      - source: "/usr/lib"
        destination: "{jail_root}/usr/lib"
        flags: "ro,nosuid,nodev"
        purpose: "System libraries (C runtime, etc.)"
        max_size: "500MB"

      - source: "/usr/bin"
        destination: "{jail_root}/usr/bin"
        flags: "ro,nosuid,nodev"
        purpose: "System binaries (python, node, etc.)"
        max_size: "200MB"

      - source: "/lib"
        destination: "{jail_root}/lib"
        flags: "ro,nosuid,nodev"
        purpose: "Essential system libs (libc, libpthread)"
        max_size: "100MB"

      - source: "/lib64"
        destination: "{jail_root}/lib64"
        flags: "ro,nosuid,nodev"
        purpose: "64-bit libraries"
        max_size: "50MB"

      - source: "/etc/ld.so.cache"
        destination: "{jail_root}/etc/ld.so.cache"
        flags: "ro,nosuid,nodev"
        purpose: "Dynamic linker cache (required by libc)"
        note: "Single file mount (loopback)"

  amber_band:
    description: "Same read-only mounts as GREEN (PII masking at I/O boundary)"
    mounts: "Same as GREEN_band (PII masking applied separately)"

  red_band:
    description: "Minimal - only /tmp (no system libraries on mount)"
    mounts: []
    note: "RED uses statically-linked tools or containerized binaries"

  black_band:
    description: "No mounts at all (complete isolation)"
    mounts: []

# ============================================================================
# MOUNT COMMAND SEQUENCES
# ============================================================================

mount_procedures:

  procedure_mount_system_libraries:
    description: "Mount read-only system libraries into jail"

    commands: |
      # GREEN/AMBER Band
      mount --bind /usr/lib {jail_root}/usr/lib
      mount -o remount,ro,nosuid,nodev {jail_root}/usr/lib

      mount --bind /usr/bin {jail_root}/usr/bin
      mount -o remount,ro,nosuid,nodev {jail_root}/usr/bin

      mount --bind /lib {jail_root}/lib
      mount -o remount,ro,nosuid,nodev {jail_root}/lib

      mount --bind /lib64 {jail_root}/lib64
      mount -o remount,ro,nosuid,nodev {jail_root}/lib64

      mount --bind /etc/ld.so.cache {jail_root}/etc/ld.so.cache
      mount -o remount,ro,nosuid,nodev {jail_root}/etc/ld.so.cache

    latency: "<2ms per mount (typical: 10ms total)"

    explanation: |
      1. First mount --bind creates bind mount (writable initially)
      2. Then remount with ro,nosuid,nodev flags
      3. Remount changes flags without unmounting
      4. Result: Read-only + no SUID + no device access

  procedure_verify_readonly:
    description: "Verify mounts are truly read-only"

    test_commands: |
      # Test write attempt
      touch {jail_root}/usr/lib/test_file
      Result: "touch: cannot touch '{...}/test_file': Read-only file system"

      # Test SUID bypass
      cp /usr/bin/sudo {jail_root}/usr/bin/sudo_copy
      chmod +s {jail_root}/usr/bin/sudo_copy  # Set SUID bit
      {jail_root}/usr/bin/sudo_copy -l
      Result: "Process runs as tool user, not root (NOSUID prevents SUID)"

      # Test device access prevention
      ls -la {jail_root}/dev/sda (if present in jail)
      Result: "EACCES (operation not permitted, NODEV prevents access)"

    latency: "<1ms for all verification"

# ============================================================================
# LAYERED WRITE PREVENTION
# ============================================================================

write_prevention_layers:

  layer_1_chroot_boundary:
    description: "Paths outside jail are inaccessible"
    mechanism: "chroot jail (prevents /etc/shadow access)"
    enforced_by: "Kernel chroot boundary"
    strength: "100% (kernel-level)"

  layer_2_mount_flags_readonly:
    description: "Even paths inside jail can be read-only"
    mechanism: "MS_RDONLY flag on bind mount"
    example: |
      /usr/lib is mounted with ro flag
      Result: open('/usr/lib/libc.so.6', O_WRONLY) → EROFS
    enforced_by: "Kernel filesystem layer"
    strength: "100% (kernel-level)"

  layer_3_seccomp_filter:
    description: "Dangerous syscalls blocked (mount, umount)"
    mechanism: "seccomp-bpf filter (see seccomp_bpf_filter.yml)"
    example: |
      mount('none', '/usr/lib', ...) → EPERM (seccomp blocks mount())
    enforced_by: "Kernel seccomp filter"
    strength: "100% (kernel-level)"

  layer_4_capability_dropping:
    description: "CAP_SYS_ADMIN dropped (can't remount)"
    mechanism: "Process capabilities (CAP_SYS_ADMIN, CAP_SYS_CHROOT dropped)"
    effect: "Can't change mount flags or create new mounts"
    enforced_by: "Kernel capability system"
    strength: "100% (kernel-level)"

# ============================================================================
# MOUNT STATISTICS & TRACKING
# ============================================================================

mount_statistics:

  typical_green_band_setup:
    total_mounts: "5 (usr/lib, usr/bin, lib, lib64, ld.so.cache)"
    total_setup_time: "~10ms"
    total_data_mounted: "~850MB"

    breakdown:
      "usr/lib": "~500MB (boost, ssl, compression libs)"
      "usr/bin": "~200MB (python, node, ruby, perl)"
      "lib": "~100MB (libc, math libs)"
      "lib64": "~50MB (64-bit libraries)"

    note: "GREEN template pre-created and cached"

  typical_mount_sizes:
    linux_minimal_system:
      "usr/lib": "~500MB"
      "usr/bin": "~200MB"
      "lib": "~100MB"
      "lib64": "~50MB"

    total: "~850MB per tool (if separate copies)"
    optimization: "Shared templates via CoW reduce to ~10MB per tool"

# ============================================================================
# REMOUNT STRATEGY (ATOMIC FLAG CHANGES)
# ============================================================================

remount_strategy:

  problem: "Cannot mount with 'ro' flag directly (bind mount inherits write)"

  solution_two_stage_mount:
    step_1_mount_rw:
      command: "mount --bind {source} {dest}"
      result: "Bind mount is writable (inherits from source)"

    step_2_remount_ro:
      command: "mount -o remount,ro,nosuid,nodev {dest}"
      result: "Same mount is now read-only + nosuid + nodev"

    benefit: "Atomic flag update (no unmount/remount needed)"
    latency: "<1ms per remount"

  example_full_sequence:
    commands: |
      1. mount --bind /usr/lib /jail/usr/lib                    (rw initially)
      2. mount -o remount,ro,nosuid,nodev /jail/usr/lib        (ro, ro, nodev)
      3. findmnt /jail/usr/lib                                   (verify: ro,nosuid,nodev)

# ============================================================================
# ERROR HANDLING & RECOVERY
# ============================================================================

error_scenarios:

  scenario_1_remount_fails:
    trigger: "mount -o remount fails (e.g., device busy)"
    handling: |
      1. Unmount bind mount: umount /jail/usr/lib
      2. Retry mount sequence
      3. After 3 retries, fail tool launch
    outcome: "Tool fails to start (safe default)"

  scenario_2_source_path_missing:
    trigger: "/usr/lib doesn't exist on host"
    handling: |
      1. Use fallback path (e.g., /usr/lib64 on some systems)
      2. If no fallback, skip mount (tool may fail at runtime)
      3. Log: WARNING
    outcome: "Jail created without this mount"

  scenario_3_mount_table_exhaustion:
    trigger: "Too many mounts (>10K system limit)"
    handling: |
      1. Force cleanup of orphaned jails
      2. If still exhausted, reject new tools
      3. Alert: CRITICAL
    outcome: "New tools fail to launch until cleanup"

# ============================================================================
# SECURITY VALIDATION
# ============================================================================

security_tests:

  test_1_readonly_enforcement:
    action: "Attempt to write to read-only mount"
    command: "echo 'test' > /usr/lib/test.txt"
    expected_result: "Read-only file system"
    security_level: "CRITICAL"

  test_2_suid_bypass:
    action: "Run setuid binary from read-only mount"
    command: "/usr/bin/sudo -l"
    expected_result: "Runs as tool user (not root, NOSUID prevents it)"
    security_level: "CRITICAL"

  test_3_device_access_prevention:
    action: "Attempt to open device file on NODEV mount"
    command: "ls -la /dev/sda (if mounted with NODEV)"
    expected_result: "EACCES or file not found"
    security_level: "HIGH"

# ============================================================================
# PERFORMANCE TARGETS
# ============================================================================

performance:

  mount_setup_latency:
    per_mount: "<2ms"
    total_5_mounts: "<10ms P95"
    target: "Mount all system libs before tool starts"

  remount_flag_change:
    per_remount: "<1ms"
    total_5_remounts: "<5ms P95"

  mount_verification:
    findmnt_query: "<1ms per mount"
    total_5_mounts: "<5ms P95"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:

    readonly_mount_count:
      type: "Gauge"
      labels: ["band", "jail_id"]
      alert: "If any read-only mount becomes rw (data corruption)"

    mount_setup_latency:
      type: "Histogram"
      unit: "milliseconds"
      target: "P95 <10ms"
      alert: "P95 > 20ms"

    remount_latency:
      type: "Histogram"
      unit: "milliseconds"
      target: "P95 <5ms"

    write_attempts_to_readonly:
      type: "Counter"
      description: "Blocked write attempts to read-only mounts"
      expected: "Normal (tools may attempt writes)"
      alert: "Unusually high (>100/min might indicate attack)"

---

summary:
  capabilities:
    - "Read-only mount enforcement (MS_RDONLY)"
    - "SUID bit prevention (MS_NOSUID)"
    - "Device file access prevention (MS_NODEV)"
    - "Atomic remount (no unmount needed)"
    - "Per-band configuration (GREEN/AMBER/RED/BLACK)"
    - "Layered write prevention (4 layers)"
    - "Performance targets (<10ms total mount)"
    - "Security validation tests included"

related_contracts:
  chroot_jail:
    file: "chroot_jail_manager.yml"
    purpose: "Jail creation that uses these mounts"

  seccomp_filter:
    file: "seccomp_bpf_filter.yml"
    purpose: "Syscall blocking (mount/umount protection)"

  output_isolation:
    file: "writable_output_isolation.yml"
    purpose: "Writable /tmp/output with quota"
