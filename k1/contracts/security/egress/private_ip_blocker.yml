# Private IP Blocker Contract - Issue 2.5.5, Part 4
# Purpose: Block private IP ranges and dangerous ports (default-deny)
# Source ADR: ADR-0032, ADR-0032a
# Last Updated: 2025-10-15

name: "Private IP Blocker"
purpose: "Block private/reserved IP ranges and dangerous ports (<1ms evaluation)"
scope: ["Network Egress", "IP Filtering", "Port Filtering"]
version: "1.0"

# ============================================================================
# PRIVATE IP RANGES (IETF STANDARDS)
# ============================================================================

private_ranges:

  ipv4:

    private_rfc1918:
      - cidr: "10.0.0.0/8"
        name: "Class A Private"
        description: "Private network, large organizations"
        block_reason: "Prevent lateral movement within data center"

      - cidr: "172.16.0.0/12"
        name: "Class B Private"
        description: "Private network, medium organizations"
        block_reason: "Prevent lateral movement within data center"

      - cidr: "192.168.0.0/16"
        name: "Class C Private"
        description: "Private network, small LANs"
        block_reason: "Prevent lateral movement within data center"

    special_use_ietf:
      - cidr: "127.0.0.0/8"
        name: "Loopback"
        description: "Localhost (127.0.0.1)"
        block_reason: "Only allowed for RED band via exception"
        exception: "RED band: Allow 127.0.0.1:8080 and :9000"

      - cidr: "169.254.0.0/16"
        name: "Link-Local (APIPA)"
        description: "Automatic Private IP Addressing"
        block_reason: "Prevent metadata service access (AWS IMDS on 169.254.169.254)"
        note: "AWS IMDS vulnerability → credential theft"

      - cidr: "224.0.0.0/4"
        name: "Multicast"
        description: "IP multicast"
        block_reason: "Prevent multicast storms, local network discovery"

      - cidr: "240.0.0.0/4"
        name: "Reserved"
        description: "Reserved for future use"
        block_reason: "Prevent exploitation of unimplemented functionality"

      - cidr: "255.255.255.255/32"
        name: "Broadcast"
        description: "Limited broadcast"
        block_reason: "Prevent broadcast storms"

  ipv6:

    private_rfc4193:
      - cidr: "fc00::/7"
        name: "Unique Local Address (ULA)"
        description: "IPv6 private equivalent of RFC1918"
        block_reason: "Prevent lateral movement within IPv6 network"

    link_local:
      - cidr: "fe80::/10"
        name: "Link-Local Address"
        description: "Link-local, IPv6 equivalent of 169.254.0.0/16"
        block_reason: "Prevent local network discovery"

    loopback:
      - cidr: "::1/128"
        name: "IPv6 Loopback"
        description: "IPv6 equivalent of 127.0.0.1"
        block_reason: "Only allowed for RED band via exception"
        exception: "RED band: Allow [::1]:8080 and [::1]:9000"

# ============================================================================
# DANGEROUS PORTS (MANAGEMENT/DATABASE ACCESS)
# ============================================================================

dangerous_ports:

  management_protocols:

    port_22:
      name: "SSH"
      description: "Secure Shell"
      why_dangerous: "Remote shell access, lateral movement vector"
      block_reason: "Prevent unauthorized system access"

    port_23:
      name: "Telnet"
      description: "Unencrypted shell"
      why_dangerous: "Legacy protocol, credentials in clear text"
      block_reason: "Prevent unauthorized system access"

    port_3389:
      name: "RDP"
      description: "Remote Desktop Protocol"
      why_dangerous: "Windows remote access, brute-force target"
      block_reason: "Prevent unauthorized system access"

    port_5900:
      name: "VNC"
      description: "Virtual Network Computing"
      why_dangerous: "GUI remote access, weak authentication"
      block_reason: "Prevent unauthorized system access"

  database_protocols:

    port_3306:
      name: "MySQL"
      description: "MySQL database"
      why_dangerous: "Direct database access, credential theft"
      block_reason: "Prevent unauthorized data access"

    port_5432:
      name: "PostgreSQL"
      description: "PostgreSQL database"
      why_dangerous: "Direct database access, SQL injection"
      block_reason: "Prevent unauthorized data access"

    port_6379:
      name: "Redis"
      description: "Redis in-memory database"
      why_dangerous: "Often has no auth by default"
      block_reason: "Prevent cache poisoning, data theft"

    port_27017:
      name: "MongoDB"
      description: "MongoDB database"
      why_dangerous: "Common default port, often exposed"
      block_reason: "Prevent unauthorized data access"

  service_protocols:

    port_25:
      name: "SMTP"
      description: "Simple Mail Transfer Protocol"
      why_dangerous: "Open relay exploitation, spam"
      block_reason: "Prevent spam/email abuse (AMBER+ has 587)"

    port_445:
      name: "SMB"
      description: "Server Message Block"
      why_dangerous: "Windows file sharing, ransomware vector"
      block_reason: "Prevent lateral movement"

    port_139:
      name: "NetBIOS"
      description: "Network BIOS"
      why_dangerous: "Windows legacy protocol, enumeration"
      block_reason: "Prevent network discovery"

# ============================================================================
# FILTERING RULES (IPTABLES IMPLEMENTATION)
# ============================================================================

iptables_implementation:

  reusable_chain_k1_private_blocks:
    description: "Shared chain for all private IP blocking"
    purpose: "Single definition, used by all tool chains"

    rules: |
      # IPv4 Private Ranges
      -A K1_PRIVATE_BLOCKS -d 10.0.0.0/8 -j DROP
      -A K1_PRIVATE_BLOCKS -d 172.16.0.0/12 -j DROP
      -A K1_PRIVATE_BLOCKS -d 192.168.0.0/16 -j DROP
      -A K1_PRIVATE_BLOCKS -d 169.254.0.0/16 -j DROP

      # IPv4 Special Use
      -A K1_PRIVATE_BLOCKS -d 224.0.0.0/4 -j DROP
      -A K1_PRIVATE_BLOCKS -d 240.0.0.0/4 -j DROP
      -A K1_PRIVATE_BLOCKS -d 255.255.255.255 -j DROP

      # IPv6 Private Ranges
      -A K1_PRIVATE_BLOCKS -d fc00::/7 -j DROP
      -A K1_PRIVATE_BLOCKS -d fe80::/10 -j DROP

  per_tool_port_blocking:
    description: "Tool-specific dangerous port blocking"
    purpose: "Prevent specific port access per tool"

    rules_all_bands: |
      # SSH, Telnet, RDP, VNC (management)
      -A K1_TOOL_{tool_id}_RULES -p tcp -m multiport --dports 22,23,3389,5900 -j DROP

      # MySQL, PostgreSQL, Redis, MongoDB (databases)
      -A K1_TOOL_{tool_id}_RULES -p tcp -m multiport --dports 3306,5432,6379,27017 -j DROP

      # SMB, NetBIOS (Windows file sharing)
      -A K1_TOOL_{tool_id}_RULES -p tcp -m multiport --dports 139,445 -j DROP

    rules_green_band: |
      # GREEN: Block SMTP (port 25 - spam)
      # AMBER can use 587 (authenticated)
      # RED has no internet anyway
      -A K1_TOOL_{tool_id}_RULES -p tcp --dport 25 -j DROP

    integration:
      - "iptables rules added to tool-specific chain"
      - "Tool chain includes both port and IP blocking"
      - "Combined with domain whitelist (all 3 layers)"

# ============================================================================
# RED BAND EXCEPTION (127.0.0.1)
# ============================================================================

red_band_exception:

  purpose: "RED band tools can access K1 kernel and K0 bridge (localhost only)"

  allowed_addresses:
    - "127.0.0.1:8080 (K1 kernel event bus)"
    - "127.0.0.1:9000 (K0 bridge, memory access)"
    - "[::1]:8080 (IPv6 K1 kernel)"
    - "[::1]:9000 (IPv6 K0 bridge)"

  iptables_rules: |
    # RED band: Allow K1/K0 local access before blocking 127.0.0.0/8
    -A K1_TOOL_RED_RULES -d 127.0.0.1 -p tcp --dport 8080 -j ACCEPT
    -A K1_TOOL_RED_RULES -d 127.0.0.1 -p tcp --dport 9000 -j ACCEPT
    -A K1_TOOL_RED_RULES -d ::1 -p tcp --dport 8080 -j ACCEPT
    -A K1_TOOL_RED_RULES -d ::1 -p tcp --dport 9000 -j ACCEPT

    # Then block everything else
    -A K1_TOOL_RED_RULES -d 127.0.0.0/8 -j DROP
    -A K1_TOOL_RED_RULES -j DROP  # Implicit default deny

  verification: "No other localhost ports accessible (8000, 8001, etc.)"

# ============================================================================
# EVALUATION PERFORMANCE
# ============================================================================

performance:

  rule_matching_latency:
    description: "How fast iptables matches a packet against rules"
    mechanism: "Kernel netfilter (O(n) worst case, optimized)"

    benchmarks:
      typical:
        - "1-10 rules: <0.1ms (single rule match)"
        - "100 rules: <0.2ms (linear search with kernel optimization)"
        - "1000 rules: <0.5ms (hash table lookup for destination IP)"

    target: "P95 <1ms for all packets"
    note: "Evaluated per PACKET, not per connection (UDP, TCP initial SYN)"

  optimization_techniques:

    technique_1_rule_order:
      - "Put most common denials first (better cache locality)"
      - "Example: Put port blocking before IP blocking (more hits)"

    technique_2_hash_table_lookup:
      - "iptables uses hash tables for destination IP matching"
      - "Large CIDR blocks are expanded into hash sets"
      - "Result: O(1) lookup even with 100+ IP ranges"

    technique_3_kernel_optimization:
      - "iptables JIT compiles rules to optimized bytecode"
      - "Modern kernels (4.4+) use eBPF (extended Berkeley Packet Filter)"
      - "Result: Near-native performance (<0.1ms typical)"

# ============================================================================
# BYPASS DETECTION & PREVENTION
# ============================================================================

attack_scenarios:

  scenario_1_ipv4_to_ipv6_transition:
    attack: "Use IPv6 address to bypass IPv4 blocking"
    example: "Tool blocked from 10.0.0.1, tries fc00::1 instead"
    prevention: "Block same ranges in IPv6 (fc00::/7, fe80::/10)"
    coverage: "Dual IP filtering prevents both stacks"

  scenario_2_dns_rebinding:
    attack: "DNS resolves to whitelisted domain but actually points to 192.168.1.1"
    example: "Attacker controls DNS, rebinds google.com → 192.168.1.1"
    prevention: "OS-level iptables blocks regardless of hostname"
    strength: "Effective (rules work on IP, not DNS)"

  scenario_3_port_obscuration:
    attack: "Use non-standard port for SSH (e.g., SSH on 8022)"
    example: "Tool connects to 192.168.1.1:8022 instead of :22"
    prevention: "Block all private IPs (not just specific ports)"
    strength: "Effective (entire range blocked)"

  scenario_4_tunneling:
    attack: "Tunnel SSH through HTTPS to bypass port blocking"
    example: "SSH over HTTPS (port 443, inside TLS)"
    prevention: "Block private IP ranges at all ports"
    strength: "Very effective (private IPs blocked everywhere)"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:

    blocked_private_ip_attempts:
      type: "Counter"
      labels: ["cidr_range", "tool_id", "direction"]
      direction: ["inbound", "outbound"]
      alert_threshold: ">10 attempts/min (potential attack)"

    blocked_dangerous_port_attempts:
      type: "Counter"
      labels: ["port", "tool_id", "band"]
      alert_threshold: ">5 attempts/min (potential attack)"

    private_ip_blocking_latency:
      type: "Histogram"
      unit: "microseconds"
      target: "P95 <1000µs (1ms)"
      note: "Kernel netfilter latency per packet"

    red_band_localhost_access:
      type: "Counter"
      labels: ["port", "tool_id"]
      expected: "Normal (K1/K0 access)"
      alert: "Non-8080/9000 port access (anomaly)"

# ============================================================================
# ERROR HANDLING
# ============================================================================

error_scenarios:

  scenario_1_iptables_rule_conflict:
    trigger: "New rule conflicts with existing rule"
    example: "Try to add -d 192.168.0.0/16 but it already exists"
    handling: |
      1. Check if rule already exists (deduplicate)
      2. If identical, skip (safe)
      3. If conflicting, log error and fail
    outcome: "Rules deduplicated, no duplicates"

  scenario_2_ipv6_not_supported:
    trigger: "IPv6 support disabled in kernel"
    handling: |
      1. Log warning: "IPv6 not supported, IPv6 private ranges not blocked"
      2. Continue with IPv4-only blocking
      3. Alert: IPv6 bypass possible
    outcome: "Fallback to IPv4, flag IPv6 limitation"

  scenario_3_multiport_not_supported:
    trigger: "Kernel doesn't support -m multiport extension"
    handling: |
      1. Fall back to individual port rules
      2. Generate separate -A rule per port
      3. Log performance degradation (more rules = slower)
    outcome: "Functional but potentially slower (O(n) worst case)"

# ============================================================================
# COMPLIANCE & AUDIT
# ============================================================================

audit_trail:

  events_logged:
    - "private_ip_blocked: src_ip, dst_ip, port, tool_id, band"
    - "dangerous_port_blocked: src_ip, dst_ip, port, tool_id"
    - "red_band_localhost_allowed: dst_ip, port, tool_id (expected)"

  retention: "7 years (SOC2/ISO27001)"
  storage: "K0 ToolReceipt (FlatBuffers)"

  compliance_use_cases:
    gdpr: "Prove private customer data (192.168.*.*, 10.0.*.*) never accessed"
    soc2: "Document security controls blocking private networks"
    iso27001: "Audit trail for access control effectiveness"

---

summary:
  capabilities:
    - "Block all private IP ranges (RFC1918 + APIPA + multicast)"
    - "Block dangerous ports (SSH 22, RDP 3389, DB 3306/5432/6379)"
    - "IPv4 and IPv6 dual protection"
    - "RED band exception (127.0.0.1 local access only)"
    - "Kernel-level performance (<1ms P95 per packet)"
    - "Bypass attack detection (DNS rebinding, tunneling)"
    - "Full audit trail (7-year retention)"
    - "Default-deny policy (all unmatched traffic blocked)"

related_contracts:
  iptables_controller:
    file: "iptables_egress_controller.yml"
    purpose: "Rule enforcement engine"

  privacy_bands:
    file: "privacy_band_network_policies.yml"
    purpose: "Band policy definitions"

  domain_whitelist:
    file: "domain_whitelist_manager.yml"
    purpose: "Per-tool domain whitelisting"
