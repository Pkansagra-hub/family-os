# iptables Egress Controller Contract - Issue 2.5.5, Part 1
# Purpose: Per-tool firewall rules with process isolation and privacy band enforcement
# Source ADR: ADR-0032a (Network Egress Control - iptables + Privacy Bands)
# Last Updated: 2025-10-15

name: "iptables Egress Controller"
purpose: "Per-tool firewall rules via iptables --pid-owner, <5ms setup, default-deny DROP policy"
scope: ["Network Egress", "Tool Execution", "Privacy Band Enforcement"]
version: "1.0"

# ============================================================================
# ARCHITECTURE OVERVIEW
# ============================================================================

architecture:
  description: "Process-isolated iptables rules per tool execution"

  layers:
    layer1_band_policy:
      description: "Determine allowed network scope per privacy band"
      input: "privacy_band: GREEN | AMBER | RED | BLACK"
      output: "network_policy: allowed_domains, allowed_ips, blocked_ips"

    layer2_domain_whitelist:
      description: "Explicit allowed domains per tool"
      input: "tool_id, domains: List[str]"
      output: "ip_whitelist: Set[str] (DNS resolved)"

    layer3_private_ip_blocker:
      description: "Block private IP ranges except RED band"
      input: "band, ip_range: str"
      output: "iptables_rule: DROP or ACCEPT"

    layer4_process_isolation:
      description: "iptables --pid-owner per tool process"
      input: "tool_pid: int, iptables_rules: List[str]"
      output: "tool_process_rules: Set[iptables rules]"

  performance_targets:
    rule_setup: "<5ms per tool"
    rule_cleanup: "<2ms on tool exit"
    runtime_overhead: "0ms (kernel-enforced netfilter)"
    dns_resolution: "<50ms (domain → IP)"
    total_latency_p95: "<100ms (setup + DNS)"

# ============================================================================
# IPTABLES CHAIN ARCHITECTURE
# ============================================================================

iptables_chains:

  filter_table:
    description: "Linux netfilter filter table (main firewall)"
    chains:

      output_chain:
        description: "Outgoing traffic (tool → remote)"
        rules_order:
          1: "K1_TOOL_WHITELIST chain (user-defined, per-tool)"
          2: "K1_PRIVATE_IP_BLOCK chain (always active)"
          3: "K1_DEFAULT_DENY chain (DROP all by default)"

        rule_structure: |
          -A OUTPUT -p tcp -m owner --uid-owner tool_uid -j K1_TOOL_<tool_id>_RULES
          -A OUTPUT -p udp -m owner --uid-owner tool_uid -j K1_TOOL_<tool_id>_RULES
          -A K1_TOOL_<tool_id>_RULES -d allowed_ip_1 -p tcp -m tcp --dport 443 -j ACCEPT
          -A K1_TOOL_<tool_id>_RULES -d allowed_ip_2 -p tcp -m tcp --dport 80 -j ACCEPT
          -A K1_TOOL_<tool_id>_RULES -j DROP

  nat_table:
    description: "NAT table for domain resolution"
    chains:
      prerouting_chain: "Pre-routing hook (if needed)"
      postrouting_chain: "Post-routing for masquerading"

    usage: "Optional DNS masquerading for AMBER band PII masking"

# ============================================================================
# RULE SETUP FLOW
# ============================================================================

rule_setup_flow:

  step_1_resolve_domains:
    description: "DNS resolution for allowed domains"
    input: "domains: ['api.weather.com', 'api.openweathermap.org']"
    process:
      - "For each domain in whitelist:"
      - "1. Resolve domain to IPv4 (getaddrinfo)"
      - "2. Resolve domain to IPv6 (getaddrinfo)"
      - "3. Store resolved IPs"
      - "4. Set cache TTL (300s, refresh before expiry)"
    output: "ip_set: {'192.0.2.1', '2001:db8::1'} (IPv4 + IPv6)"
    latency: "<50ms for typical DNS queries (cached)"
    error_handling: "If DNS fails, log warning and ACCEPT (fallback)"

    dns_cache:
      ttl_seconds: 300
      refresh_threshold: "5 minutes before expiry"
      purpose: "Avoid DNS query on every tool launch"

  step_2_create_tool_chain:
    description: "Create iptables chain for specific tool"
    command: "iptables -N K1_TOOL_<tool_id>_RULES"
    output: "New user-defined chain for tool"
    idempotency: "If chain exists, skip creation"
    cleanup: "Chain deleted on tool exit"

  step_3_add_whitelist_rules:
    description: "Add ACCEPT rules for whitelisted IPs"
    rules:
      - description: "ACCEPT on port 443 (HTTPS)"
        command: "iptables -A K1_TOOL_<tool_id>_RULES -d {ip} -p tcp -m tcp --dport 443 -j ACCEPT"
        applies_to: "All bands (HTTPS default)"

      - description: "ACCEPT on port 80 (HTTP, GREEN/AMBER bands only)"
        command: "iptables -A K1_TOOL_<tool_id>_RULES -d {ip} -p tcp -m tcp --dport 80 -j ACCEPT"
        applies_to: "GREEN and AMBER bands only"

      - description: "ACCEPT on band-specific ports"
        command: "iptables -A K1_TOOL_<tool_id>_RULES -d {ip} -p tcp -m tcp --dport {port} -j ACCEPT"
        applies_to: "Tool-specific ports (e.g., 8080 for K1 local services)"

    order: "Order matters (first matching rule wins)"
    efficiency: "Batch add rules (iptables-save + iptables-restore for <5ms)"

  step_4_add_band_policy_rules:
    description: "Add band-specific rules (RED local-only, etc.)"

    rules_by_band:
      green_band:
        - "DROP 192.168.0.0/16 (private network block)"
        - "DROP 10.0.0.0/8"
        - "DROP 172.16.0.0/12"
        - "DROP 169.254.0.0/16 (link-local)"
        - "DROP port 22, 23, 3389 (SSH, Telnet, RDP - prevent lateral movement)"

      amber_band:
        - "Same as GREEN (private IP blocking)"
        - "DROP port 25, 587, 465 (SMTP - prevent spam)"

      red_band:
        - "DROP 0.0.0.0/0 (all traffic, except 127.0.0.1)"
        - "ACCEPT 127.0.0.1 only (localhost)"
        - "ACCEPT port 8080, 9000 (K1 local ports only)"

      black_band:
        - "DROP 0.0.0.0/0 (all traffic)"

  step_5_add_default_deny:
    description: "Final DROP rule (default-deny policy)"
    command: "iptables -A K1_TOOL_<tool_id>_RULES -j DROP"
    purpose: "All unmatched traffic dropped (zero explicit allow = zero permit)"
    order: "Last rule in chain (always processed last)"

  step_6_link_to_output:
    description: "Link tool chain to OUTPUT chain"
    command: "iptables -A OUTPUT -p tcp -m owner --uid-owner {tool_uid} -j K1_TOOL_<tool_id>_RULES"
    command_2: "iptables -A OUTPUT -p udp -m owner --uid-owner {tool_uid} -j K1_TOOL_<tool_id>_RULES"
    purpose: "Intercept all tool traffic and apply rules"
    uid_matching: "Uses Linux UID-based process identification (--uid-owner)"

# ============================================================================
# IPTABLES OPTIMIZATION: BATCH SETUP
# ============================================================================

batch_setup_optimization:
  description: "Optimize <5ms rule setup via iptables-save + iptables-restore"

  standard_approach:
    commands: |
      for ip in $allowed_ips; do
        iptables -A K1_TOOL_RULES -d $ip -p tcp --dport 443 -j ACCEPT
      done
      iptables -A K1_TOOL_RULES -j DROP
    latency: "~1-2ms per rule × N rules = 50-100ms for 50 domains (TOO SLOW)"
    reason: "Each iptables command forks process, acquires kernel lock"

  optimized_approach:
    method: "iptables-save + iptables-restore (atomic batch update)"
    steps: |
      1. Generate iptables rules to text file (iptables.rules)
      2. Call: iptables-restore < iptables.rules
      3. Kernel applies ALL rules atomically in single kernel call
    latency: "<5ms for 50 rules (single kernel call)"
    reason: "Batch processing + single kernel lock acquisition"

    example_ruleset:
      file: /tmp/k1_tool_rules.txt
      content: |
        # Generated by K1 Tool Runner for tool_123
        *filter
        :K1_TOOL_123_RULES - [0:0]
        :K1_PRIVATE_BLOCKS - [0:0]
        -A K1_TOOL_123_RULES -d 192.0.2.1 -p tcp --dport 443 -j ACCEPT
        -A K1_TOOL_123_RULES -d 198.51.100.1 -p tcp --dport 80 -j ACCEPT
        -A K1_TOOL_123_RULES -d 203.0.113.1 -p tcp --dport 443 -j ACCEPT
        -A K1_PRIVATE_BLOCKS -d 192.168.0.0/16 -j DROP
        -A K1_PRIVATE_BLOCKS -d 10.0.0.0/8 -j DROP
        -A K1_TOOL_123_RULES -j K1_PRIVATE_BLOCKS
        -A K1_TOOL_123_RULES -j DROP
        -A OUTPUT -m owner --uid-owner 1001 -j K1_TOOL_123_RULES
        COMMIT

# ============================================================================
# RULE CLEANUP & TEARDOWN
# ============================================================================

rule_cleanup:

  on_tool_exit:
    description: "Clean up iptables rules when tool process terminates"
    triggers:
      - "Tool process exits (exit code 0 or non-zero)"
      - "Tool exceeds timeout (SIGKILL)"
      - "Tool violates egress (killed by seccomp)"

    cleanup_steps:
      step_1_unlink_from_output:
        description: "Remove rule from OUTPUT chain"
        command: "iptables -D OUTPUT -m owner --uid-owner {tool_uid} -j K1_TOOL_<tool_id>_RULES"
        error_handling: "Ignore if rule doesn't exist (idempotent)"

      step_2_flush_tool_chain:
        description: "Delete all rules in tool's chain"
        command: "iptables -F K1_TOOL_<tool_id>_RULES"
        purpose: "Clear all rules before deleting chain"

      step_3_delete_tool_chain:
        description: "Delete the tool's chain"
        command: "iptables -X K1_TOOL_<tool_id>_RULES"
        error_handling: "Fail gracefully if chain doesn't exist"

      step_4_verify_cleanup:
        description: "Verify rules are deleted"
        command: "iptables -L OUTPUT | grep K1_TOOL_<tool_id>"
        expected: "No output (tool rules removed)"

    latency: "<2ms total cleanup"
    async_cleanup: "Background task, non-blocking tool exit"

# ============================================================================
# PROCESS ISOLATION: UID-BASED MATCHING
# ============================================================================

process_isolation:

  mechanism: "Linux iptables --uid-owner option (process-based firewall)"

  how_it_works:
    description: "iptables matches on process UID"
    flow:
      1: "Tool Runner spawns tool process: subprocess.Popen(...)"
      2: "Tool process gets UID (e.g., 1001)"
      3: "iptables rule created: -m owner --uid-owner 1001"
      4: "All outbound traffic from UID 1001 matches rule"
      5: "Traffic routed through K1_TOOL_<tool_id>_RULES chain"
      6: "Tool can only access whitelisted IPs/ports"

    isolation_guarantees:
      - "Each tool process has unique UID (UID → tool_id mapping)"
      - "Sibling tools have different UIDs (isolated rules)"
      - "Rules only apply to specific UID (no cross-contamination)"
      - "If multiple tools share UID (rare), rules apply to all (shared sandbox)"

  uid_assignment:
    strategy: "Map tool_id to UID range"
    range: "2000-9999 (reserved for K1 tools)"
    formula: "tool_uid = 2000 + hash(tool_id) % 8000"
    collision_handling: "If collision, use tool_uid + 10000 (fallback range)"

  performance:
    lookup: "O(1) hash table lookup (UID → chain)"
    overhead: "Negligible (<1µs per packet)"
    kernel_level: "Enforced by netfilter kernel module (zero application overhead)"

# ============================================================================
# PRIVATE IP BLOCKING
# ============================================================================

private_ip_blocking:

  purpose: "Prevent tools from accessing internal networks/services"

  ipv4_ranges_blocked:
    - "192.168.0.0/16 (private network RFC 1918)"
    - "10.0.0.0/8 (private network RFC 1918)"
    - "172.16.0.0/12 (private network RFC 1918)"
    - "127.0.0.0/8 (loopback, except RED band local ports)"
    - "169.254.0.0/16 (link-local/APIPA)"
    - "0.0.0.0/8 (this host)"
    - "224.0.0.0/4 (multicast)"
    - "240.0.0.0/4 (reserved)"

  ipv6_ranges_blocked:
    - "::1/128 (loopback)"
    - "fe80::/10 (link-local)"
    - "fc00::/7 (private)"
    - "ff00::/8 (multicast)"

  exceptions:
    red_band:
      - "Allow 127.0.0.1 (localhost for K1 local services)"
      - "Allow ::1 (IPv6 loopback)"
      - "Allow specific ports: 8080, 9000 (K1 kernel IPC)"

    other_bands:
      - "Block all private IPs unconditionally (no exceptions)"

  rules_in_iptables:
    rule_1: "iptables -A K1_PRIVATE_BLOCKS -d 192.168.0.0/16 -j DROP"
    rule_2: "iptables -A K1_PRIVATE_BLOCKS -d 10.0.0.0/8 -j DROP"
    rule_3: "iptables -A K1_PRIVATE_BLOCKS -d 172.16.0.0/12 -j DROP"
    rule_4: "iptables -A K1_PRIVATE_BLOCKS -d 169.254.0.0/16 -j DROP"
    # ... (more IPv4 ranges)

    red_band_exceptions:
      rule_1: "iptables -A K1_TOOL_<RED_id>_RULES -d 127.0.0.1 -p tcp --dport 8080 -j ACCEPT"
      rule_2: "iptables -A K1_TOOL_<RED_id>_RULES -d 127.0.0.1 -p tcp --dport 9000 -j ACCEPT"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:
    rules_created_total:
      type: "Counter"
      labels: ["tool_id", "band"]
      description: "Total iptables rules created"

    rules_creation_latency_ms:
      type: "Histogram"
      buckets: [1, 2, 3, 5, 10]
      description: "iptables rule creation latency"
      target: "P95 <5ms"

    rule_violation_count:
      type: "Counter"
      labels: ["tool_id", "band", "violation_type"]
      values:
        violation_type: ["dropped_packet", "private_ip_attempt", "unauthorized_port"]
      description: "Packets dropped by iptables rules"

    dns_resolution_latency:
      type: "Histogram"
      buckets: [10, 20, 50, 100, 200]
      description: "Domain DNS resolution latency (ms)"
      target: "P95 <50ms"

    dns_cache_hit_rate:
      type: "Gauge"
      description: "Percentage of DNS queries served from cache"
      target: ">90%"

  logging:
    iptables_rule_created:
      event: "iptables_rule_created"
      fields: ["tool_id", "band", "rule_count", "latency_ms"]
      example: "tool_id=weather_123, band=AMBER, rule_count=5, latency_ms=3"

    iptables_violation:
      event: "iptables_violation"
      fields: ["tool_id", "packet_dest_ip", "packet_dest_port", "blocked_reason"]
      example: "tool_id=weather_123, dest_ip=192.168.1.1, reason=private_ip_blocked"

    iptables_cleanup:
      event: "iptables_cleanup"
      fields: ["tool_id", "rules_deleted", "latency_ms"]
      example: "tool_id=weather_123, rules_deleted=5, latency_ms=1"

# ============================================================================
# ERROR HANDLING & RESILIENCE
# ============================================================================

error_handling:

  scenario_1_dns_resolution_fails:
    description: "Domain cannot be resolved to IP"
    causes: ["Domain doesn't exist", "DNS server unavailable", "Network timeout"]
    behavior: "Log warning, ACCEPT rule (fail-open to avoid tool crash)"
    rationale: "Better to allow tool and log than block it (app reliability)"
    monitoring: "Alert on 5+ DNS failures in 1 minute (possible attack)"

  scenario_2_iptables_permission_denied:
    description: "Process lacks privileges to create iptables rules"
    causes: ["Tool Runner not running as root", "SELinux/AppArmor blocking"]
    behavior: "Fail tool launch with error: 'Insufficient privileges for network egress'"
    prevention: "Tool Runner must run as root (or use container capabilities)"
    fallback: "Container/VM where capabilities are pre-granted"

  scenario_3_iptables_kernel_module_missing:
    description: "netfilter kernel module not loaded"
    causes: ["Linux kernel compiled without iptables", "Module not loaded"]
    behavior: "Fail tool launch, recommend: sudo modprobe iptables_filter"
    prevention: "Check on K1 startup: verify iptables availability"

  scenario_4_rule_conflict_with_existing_rules:
    description: "K1 rule conflicts with system rules (Docker, firewall, etc.)"
    causes: ["System firewall policy already in place", "Docker container rules"]
    behavior: "Chain INSERT instead of APPEND (higher priority)"
    resolution: "Use iptables priority/weight system"

# ============================================================================
# DEPLOYMENT & ACTIVATION
# ============================================================================

deployment:

  prerequisites:
    - "Linux kernel 4.14+ (iptables v1.6+)"
    - "Tool Runner running as root (or with CAP_NET_ADMIN capability)"
    - "netfilter kernel module loaded (iptables_filter.ko)"
    - "iptables and iptables-restore commands available"

  initialization:
    step_1: "Create base chains on K1 startup: K1_PRIVATE_BLOCKS, K1_TOOL_DEFAULTS"
    step_2: "Load base rules for private IP blocking"
    step_3: "Verify iptables functionality (test rule creation)"

  on_tool_launch:
    step_1: "Resolve tool domains to IPs (DNS)"
    step_2: "Create tool-specific iptables chain"
    step_3: "Add whitelist rules (iptables-restore batch)"
    step_4: "Link to OUTPUT chain (--uid-owner)"
    step_5: "Verify rules active (iptables -L check)"
    total_latency: "<100ms P95"

  on_tool_exit:
    step_1: "Unlink from OUTPUT chain"
    step_2: "Delete tool chain"
    step_3: "Verify cleanup (iptables -L)"
    total_latency: "<2ms"

summary:
  name: "iptables Egress Controller - Network Isolation"
  capabilities:
    - "Process Isolation: UID-based rules (--uid-owner) per tool process"
    - "Privacy Band Enforcement: GREEN (internet + whitelist), AMBER (limited + PII masking), RED (local-only), BLACK (no network)"
    - "5ms Setup: iptables-restore batch optimization"
    - "Default-Deny Policy: Explicit allow only, DROP all by default"
    - "Private IP Blocking: 192.168.x, 10.x, 172.16.x, 169.254.x blocked for non-RED"
    - "Observability: Metrics for rules, violations, DNS latency"
    - "Error Handling: DNS failures, permission issues, conflicts"

related_contracts:
  privacy_band_network_policies:
    file: "privacy_band_network_policies.yml"
    purpose: "Band policy definitions"

  domain_whitelist_manager:
    file: "domain_whitelist_manager.yml"
    purpose: "Per-tool domain lists"

  private_ip_blocker:
    file: "private_ip_blocker.yml"
    purpose: "Private IP blocking rules"

  violation_detector:
    file: "violation_detector.yml"
    purpose: "iptables violation monitoring"
