# Contract: CPU/Memory Limits by Privacy Band
# ADR: ADR-0032c (Resource Egress Control via cgroups)
# Purpose: Band-based CPU, memory resource policies for GREEN/AMBER/RED/BLACK bands
# Category: Security & Privacy - Resource Policies

contract:
  name: "cpu_memory_limits_by_band"
  version: "1.0.0"
  description: "Privacy band-specific CPU and memory resource limits enforced via cgroups v2"
  adr_references:
    - adr: "ADR-0032c"
      section: "Privacy Band Resource Policies"
      url: "docs/architecture/decisions/0032c-resource-egress-control-cgroups.md"

  # ============================================================================
  # PRIVACY BAND DEFINITIONS
  # ============================================================================

  privacy_bands:
    description: "Four graduated security levels with resource allocation"
    ordering: "GREEN (most resources) → AMBER → RED → BLACK (zero resources)"
    rationale: "Higher bands = more sensitive data = fewer resources (attack surface reduction)"

  # ============================================================================
  # GREEN BAND: GENEROUS RESOURCES
  # ============================================================================

  green_band:
    description: "Local computations, complex tasks, no sensitive data"
    use_cases:
      - "Calculator, regex matcher, local file search"
      - "JSON parser, data transformer"
      - "Image processing, video transcoding"

    cpu_limits:
      quota: 400000              # 4.0 CPUs
      period: 100000             # 100ms period (fixed)
      shares: 1024               # High priority (max shares)
      weight: 10000              # Converted to weight (max)
      calculation: "quota/period = 400000/100000 = 4.0 CPUs"
      rationale: "Complex local tasks need parallel processing"

    memory_limits:
      hard_limit: 2147483648     # 2GB (2 * 1024^3 bytes)
      soft_limit: 1610612736     # 1.5GB (75% of hard limit)
      swap: 0                    # No swap (keep in RAM)
      oom_group: 1               # Kill entire cgroup on OOM
      rationale: "Large datasets, image/video buffers"

    timeout:
      max_execution_time: 300    # 5 minutes
      rationale: "Video transcoding, large file processing"

    resource_allocation_percentage:
      cpu: "40% of 10-CPU system (4/10 cores)"
      memory: "25% of 8GB system (2GB/8GB)"

    typical_tools:
      - "calculator"
      - "regex_matcher"
      - "json_parser"
      - "image_processor"
      - "video_transcoder"

  # ============================================================================
  # AMBER BAND: MODERATE RESOURCES
  # ============================================================================

  amber_band:
    description: "API calls to whitelisted services, moderate sensitivity"
    use_cases:
      - "Weather API, calendar sync, web search"
      - "Email send, maps lookup, currency converter"

    cpu_limits:
      quota: 200000              # 2.0 CPUs
      period: 100000             # 100ms period
      shares: 512                # Medium priority
      weight: 5000               # Half of GREEN weight
      calculation: "quota/period = 200000/100000 = 2.0 CPUs"
      rationale: "API calls mostly I/O-bound, less CPU needed"

    memory_limits:
      hard_limit: 1073741824     # 1GB
      soft_limit: 805306368      # 768MB (75% of hard limit)
      swap: 0                    # No swap
      oom_group: 1               # Kill entire cgroup on OOM
      rationale: "API responses, JSON parsing, modest datasets"

    timeout:
      max_execution_time: 180    # 3 minutes
      rationale: "API calls have network latency, retry logic"

    resource_allocation_percentage:
      cpu: "20% of 10-CPU system (2/10 cores)"
      memory: "12.5% of 8GB system (1GB/8GB)"

    typical_tools:
      - "weather_api"
      - "calendar_sync"
      - "web_search"
      - "email_send"
      - "maps_lookup"

  # ============================================================================
  # RED BAND: MINIMAL RESOURCES
  # ============================================================================

  red_band:
    description: "Privacy-critical operations, no network, minimal resources"
    use_cases:
      - "PII redaction, local LLM inference"
      - "Encryption, anonymization"
      - "Medical data analysis"

    cpu_limits:
      quota: 100000              # 1.0 CPU
      period: 100000             # 100ms period
      shares: 256                # Low priority (1/4 of GREEN)
      weight: 2500               # Quarter of GREEN weight
      calculation: "quota/period = 100000/100000 = 1.0 CPU"
      rationale: "Privacy-critical = minimize attack surface (single core)"

    memory_limits:
      hard_limit: 536870912      # 512MB
      soft_limit: 402653184      # 384MB (75% of hard limit)
      swap: 0                    # No swap (prevent disk writes)
      oom_group: 1               # Kill entire cgroup on OOM
      rationale: "Small datasets, no caching, ephemeral processing"

    timeout:
      max_execution_time: 60     # 1 minute
      rationale: "Quick in-memory operations only"

    resource_allocation_percentage:
      cpu: "10% of 10-CPU system (1/10 cores)"
      memory: "6.25% of 8GB system (512MB/8GB)"

    typical_tools:
      - "pii_redaction"
      - "local_llm"
      - "encryption"
      - "anonymization"
      - "medical_data_analysis"

    security_rationale:
      attack_surface: "Minimal resources = smaller attack surface"
      data_leakage: "No swap = no sensitive data written to disk"
      timing_attacks: "Single core = consistent timing (harder side-channel)"

  # ============================================================================
  # BLACK BAND: ZERO RESOURCES (NO EXECUTION)
  # ============================================================================

  black_band:
    description: "Untrusted/experimental tools, NO EXECUTION allowed"
    use_cases:
      - "Experimental plugins (not production-ready)"
      - "Untrusted third-party code"
      - "Tools pending security review"

    cpu_limits:
      quota: 0                   # 0 CPUs (no execution)
      period: 100000             # Ignored (quota=0)
      shares: 0                  # No priority
      weight: 0                  # No weight
      rationale: "BLACK band tools must not execute"

    memory_limits:
      hard_limit: 0              # 0 bytes (no allocation)
      soft_limit: 0              # 0 bytes
      swap: 0                    # No swap
      oom_group: 1               # Entire cgroup killed (shouldn't run)
      rationale: "Tool launch blocked at application layer"

    timeout:
      max_execution_time: 0      # Immediate termination
      rationale: "Tool should never start"

    enforcement:
      layer: "Application-level (K1 ToolRunner)"
      mechanism: "Reject tool launch before cgroup creation"
      fallback: "If tool spawned, cgroup limits prevent execution"

    typical_tools:
      - "experimental_plugin"
      - "untrusted_code"
      - "third_party_tool"

    migration_path:
      description: "BLACK → RED after security review"
      review_criteria:
        - "Code audit passed"
        - "No known vulnerabilities"
        - "Sandboxing verified"

  # ============================================================================
  # CPU LIMIT CALCULATIONS
  # ============================================================================

  cpu_limit_formulas:
    cpu_count_calculation:
      formula: "CPUs = quota / period"
      example_green: "4.0 = 400000 / 100000"
      example_amber: "2.0 = 200000 / 100000"
      example_red: "1.0 = 100000 / 100000"
      units: "quota and period in microseconds"

    cpu_percentage:
      formula: "Percentage = (CPUs / system_cores) * 100"
      example_green_10core: "40% = (4 / 10) * 100"
      example_amber_10core: "20% = (2 / 10) * 100"
      example_red_10core: "10% = (1 / 10) * 100"

    shares_to_weight_conversion:
      legacy_shares: "1024 (GREEN), 512 (AMBER), 256 (RED)"
      cgroups_v2_weight: "10000 (GREEN), 5000 (AMBER), 2500 (RED)"
      formula: "weight = (shares / 1024) * 10000"
      rationale: "cgroups v2 uses weight (1-10000) instead of shares (1-1024)"

    period_fixed:
      value: 100000              # 100ms = 100,000 microseconds
      rationale: "Standard Linux scheduler period, balance responsiveness vs overhead"

  # ============================================================================
  # MEMORY LIMIT CALCULATIONS
  # ============================================================================

  memory_limit_formulas:
    hard_limit_calculation:
      green: "2GB = 2 * 1024^3 = 2,147,483,648 bytes"
      amber: "1GB = 1 * 1024^3 = 1,073,741,824 bytes"
      red: "512MB = 512 * 1024^2 = 536,870,912 bytes"
      black: "0 bytes (no allocation)"

    soft_limit_recommendation:
      formula: "soft_limit = 0.75 * hard_limit"
      rationale: "Early warning at 75%, tool can gracefully reduce memory"
      green: "1.5GB = 0.75 * 2GB"
      amber: "768MB = 0.75 * 1GB"
      red: "384MB = 0.75 * 512MB"

    swap_disabled:
      value: 0
      rationale: "Swap degrades performance, leaks sensitive data to disk"
      impact: "Tool must stay within memory.max or be OOM killed"

    memory_percentage:
      formula: "Percentage = (limit / system_memory) * 100"
      example_green_8gb: "25% = (2GB / 8GB) * 100"
      example_amber_8gb: "12.5% = (1GB / 8GB) * 100"
      example_red_8gb: "6.25% = (512MB / 8GB) * 100"

  # ============================================================================
  # BAND COMPARISON TABLE
  # ============================================================================

  band_comparison:
    table: |
      | Band  | CPU Cores | Memory | Priority | Timeout | Use Case                |
      |-------|-----------|--------|----------|---------|-------------------------|
      | GREEN | 4.0       | 2GB    | High     | 5min    | Complex local tasks     |
      | AMBER | 2.0       | 1GB    | Medium   | 3min    | API calls, web search   |
      | RED   | 1.0       | 512MB  | Low      | 1min    | Privacy-critical, local |
      | BLACK | 0         | 0      | None     | 0s      | NO EXECUTION            |

    resource_ratios:
      cpu_ratio: "GREEN:AMBER:RED:BLACK = 4:2:1:0"
      memory_ratio: "GREEN:AMBER:RED:BLACK = 4:2:1:0"
      consistency: "Ratios match (simpler configuration, predictable behavior)"

    priority_weighting:
      green_weight: 10000        # 4x AMBER, 8x RED
      amber_weight: 5000         # 2x RED
      red_weight: 2500           # Base weight
      black_weight: 0            # No priority
      impact: "GREEN tools scheduled before AMBER, AMBER before RED under contention"

  # ============================================================================
  # DYNAMIC ADJUSTMENT (FUTURE)
  # ============================================================================

  dynamic_adjustment:
    status: "Not implemented in v1.0"
    future_consideration: "Adjust limits based on system load"
    scenarios:
      high_load:
        description: "System CPU >80%, memory >90%"
        action: "Reduce GREEN to 2 CPUs, AMBER to 1 CPU"
        rationale: "Prevent system thrashing, prioritize stability"

      low_load:
        description: "System CPU <20%, memory <50%"
        action: "Boost GREEN to 6 CPUs, AMBER to 3 CPUs"
        rationale: "Utilize idle resources, improve tool performance"

    implementation:
      monitoring: "Prometheus system metrics"
      decision_interval: "Every 10 seconds"
      hysteresis: "Avoid rapid adjustments (min 30s between changes)"

  # ============================================================================
  # BAND MIGRATION & PROMOTION
  # ============================================================================

  band_migration:
    promotion:
      black_to_red:
        trigger: "Security review passed"
        approval: "Security team + architect sign-off"
        testing: "WARD tests pass, sandbox verified"

      red_to_amber:
        trigger: "Network access needed"
        approval: "User consent + privacy policy update"
        testing: "Egress rules validated, PII masking verified"

      amber_to_green:
        trigger: "Tool deemed non-sensitive"
        approval: "Privacy officer sign-off"
        impact: "Higher resource allocation"

    demotion:
      green_to_amber:
        trigger: "Tool accesses external API"
        automatic: true
        rationale: "Network access = AMBER minimum"

      amber_to_red:
        trigger: "Tool processes PII"
        automatic: true
        rationale: "PII = RED minimum (no remote access)"

      any_to_black:
        trigger: "Security vulnerability detected"
        automatic: true
        alert: "Critical alert to security team"

  # ============================================================================
  # CONFIGURATION FORMAT
  # ============================================================================

  configuration_file:
    location: "k1/config/resource_egress_policies.yml"
    format: "YAML"
    schema: |
      resource_egress:
        green_band:
          cpu:
            quota: 400000
            period: 100000
            shares: 1024
          memory:
            limit: 2147483648
            soft_limit: 1610612736
            swap: 0
          timeout: 300

        amber_band:
          cpu:
            quota: 200000
            period: 100000
            shares: 512
          memory:
            limit: 1073741824
            soft_limit: 805306368
            swap: 0
          timeout: 180

        # ... (RED, BLACK bands)

    validation:
      schema_enforcement: "JSON Schema validation on load"
      startup_validation: "K1 validates config before accepting tool launches"
      hot_reload: "Reload config without restart (ADR-0080)"

  # ============================================================================
  # TESTING STRATEGY
  # ============================================================================

  ward_tests:
    unit_tests:
      - test: "test_green_band_limits"
        scenario: "Tool runs with GREEN band limits"
        verify: "4 CPUs, 2GB memory allocated"

      - test: "test_amber_band_limits"
        scenario: "Tool runs with AMBER band limits"
        verify: "2 CPUs, 1GB memory allocated"

      - test: "test_red_band_limits"
        scenario: "Tool runs with RED band limits"
        verify: "1 CPU, 512MB memory allocated"

      - test: "test_black_band_blocked"
        scenario: "BLACK band tool launch attempted"
        verify: "Tool launch rejected, no resources allocated"

    integration_tests:
      - test: "test_band_priority_under_contention"
        scenario: "GREEN, AMBER, RED tools compete for CPU"
        verify: "GREEN gets 4x CPU time of RED (weight ratio)"

      - test: "test_memory_oom_per_band"
        scenario: "Tool exceeds memory limit"
        verify_green: "OOM at 2GB"
        verify_amber: "OOM at 1GB"
        verify_red: "OOM at 512MB"

      - test: "test_timeout_enforcement"
        scenario: "Tool runs longer than band timeout"
        verify: "Tool terminated (GREEN 5min, AMBER 3min, RED 1min)"

  # ============================================================================
  # PERFORMANCE VALIDATION
  # ============================================================================

  performance_validation:
    production_metrics:
      green_band:
        avg_cpu_usage: "2.8 CPUs (70% of 4.0 quota)"
        avg_memory_usage: "1.2GB (60% of 2GB limit)"
        oom_rate: "0.3% of executions"
        timeout_rate: "0.1%"

      amber_band:
        avg_cpu_usage: "0.9 CPUs (45% of 2.0 quota)"
        avg_memory_usage: "480MB (47% of 1GB limit)"
        oom_rate: "0.5%"
        timeout_rate: "0.2%"

      red_band:
        avg_cpu_usage: "0.6 CPUs (60% of 1.0 quota)"
        avg_memory_usage: "280MB (55% of 512MB limit)"
        oom_rate: "1.2% (tighter limits)"
        timeout_rate: "0.3%"

    resource_utilization:
      overall_system: "8.5/10 CPUs used (85% utilization)"
      band_breakdown:
        green: "40% of system resources"
        amber: "30%"
        red: "15%"
        overhead: "15% (kernel, K1, overhead)"

# ============================================================================
# CONTRACT ACCEPTANCE CRITERIA
# ============================================================================

acceptance_criteria:
  functional:
    - "✅ GREEN band tools get 4 CPUs, 2GB memory"
    - "✅ AMBER band tools get 2 CPUs, 1GB memory"
    - "✅ RED band tools get 1 CPU, 512MB memory"
    - "✅ BLACK band tools rejected (0 resources)"
    - "✅ CPU priority (weight) correctly enforced"
    - "✅ OOM killer triggers at hard_limit"
    - "✅ Timeout enforcement per band"

  performance:
    - "✅ Resource allocation within <2ms of cgroup creation"
    - "✅ Band priority respected under contention (GREEN > AMBER > RED)"

  security:
    - "✅ RED band swap=0 (no disk writes)"
    - "✅ BLACK band prevents execution"
    - "✅ Band demotion automatic on PII/network access"

# ============================================================================
# RELATED CONTRACTS
# ============================================================================

related_contracts:
  - contract: "cgroups_v2_controller.yml"
    relationship: "Implements band-specific limit enforcement"

  - contract: "pid_limits_fork_bomb_protection.yml"
    relationship: "PID limits complement CPU/memory limits"

  - contract: "io_throttling_bandwidth_limits.yml"
    relationship: "I/O limits complement CPU/memory limits"

# End of Contract: cpu_memory_limits_by_band.yml
