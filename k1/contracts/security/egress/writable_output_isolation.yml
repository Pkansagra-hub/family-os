# Writable Output Isolation Contract - Issue 2.5.5, Filesystem Layer 3
# Purpose: Isolate writable output directory with quota enforcement
# Source ADR: ADR-0032b (Filesystem Egress Control)
# Last Updated: 2025-10-15

name: "Writable Output Isolation"
purpose: "Isolate /tmp/output with per-tool quota and overflow prevention"
scope: ["Output Isolation", "Quota Enforcement", "Disk Protection"]
version: "1.0"

# ============================================================================
# OUTPUT DIRECTORY STRUCTURE
# ============================================================================

output_directory_layout:

  mount_point: "/tmp/output"

  by_band:

    green_band:
      path: "/session/{session_id}/tools/{tool_id}/output"
      type: "Host filesystem bind mount"
      quota: "100MB per tool (soft limit 80MB)"
      persistence: "Retained after tool exit (user retrieves output)"
      access: "Tool: read-write | Host: read-only"
      cleanup: "Manual or after 7 days (configurable retention)"

    amber_band:
      path: "/session/{session_id}/tools/{tool_id}/output_masked"
      type: "Host filesystem with PII masking"
      quota: "100MB per tool"
      persistence: "Retained after tool exit (PII-masked outputs only)"
      access: "Tool: write | Host: read (masked)"
      cleanup: "Manual or after 7 days"

    red_band:
      path: "/session/{session_id}/tools/{tool_id}/output_ephemeral"
      type: "tmpfs (in-memory temporary filesystem)"
      quota: "10MB per tool (max, no fallback to disk)"
      persistence: "Destroyed immediately on tool exit"
      access: "Tool: write | Host: none (ephemeral only)"
      cleanup: "Automatic (unmount tmpfs)"

    black_band:
      path: null
      type: "No output directory"
      quota: "0MB"
      persistence: "None"

# ============================================================================
# QUOTA MANAGEMENT SYSTEM
# ============================================================================

quota_enforcement:

  per_band_quotas:

    green_band:
      hard_limit: "100MB"
      soft_limit: "80MB"

      behavior_at_soft_limit:
        - "Log warning: 'Tool approaching quota (80MB/100MB used)'"
        - "Send signal to tool (advisory)"
        - "Allow continued writing (grace period)"

      behavior_at_hard_limit:
        - "All write operations return ENOSPC (no space)"
        - "Tool cannot write more data"
        - "Tool should exit gracefully (or is killed by SIGKILL)"

    amber_band:
      hard_limit: "100MB"
      soft_limit: "80MB"
      note: "Same as GREEN (PII masking doesn't change quota)"

    red_band:
      hard_limit: "10MB"
      soft_limit: "8MB"
      note: "Minimal ephemeral storage"
      enforcement: "tmpfs max 10MB (kernel enforced)"

  quota_units:
    - "Per tool (each tool isolated)"
    - "Not per session (tools don't share quota)"
    - "Checked on every write() syscall"

# ============================================================================
# QUOTA ENFORCEMENT IMPLEMENTATION
# ============================================================================

quota_implementation:

  method_1_ext4_project_quotas:
    description: "Linux filesystem project quota (inode-based)"
    supported_filesystems: "ext4 (modern systems)"

    setup: |
      # Enable project quotas on /tmp
      mount -o usrquota,grpquota,prjquota /tmp

      # Create project for tool
      projectid=12345  # tool_id
      mkdir -p /tmp/output/{tool_id}

      # Assign project
      chattr -p 12345 /tmp/output/{tool_id}

      # Set quota (100MB)
      setproject -d 12345 100M /tmp/output/{tool_id}

    advantage: "Kernel-enforced, no per-write overhead"
    latency: "0ms runtime (enforced by kernel)"

  method_2_tmpfs_max_size:
    description: "tmpfs with size limit (RED band ephemeral)"

    setup: |
      # RED band: Mount tmpfs with 10MB max
      mount -t tmpfs -o size=10M tmpfs /tmp/output

    behavior: "Kernel automatically returns ENOSPC when full"
    latency: "0ms runtime (kernel enforced)"

    example: |
      $ dd if=/dev/zero of=/tmp/output/large_file bs=1M count=15
      dd: memory exhausted by output file at offset 10485760
      Result: Only 10MB written, write fails

  method_3_application_quota_check:
    description: "Fallback: Application checks quota before write"

    implementation: |
      def write_with_quota_check(tool_id, filename, data):
        current_usage = get_directory_size(f"/tmp/output/{tool_id}")
        quota_limit = 100 * 1024 * 1024  # 100MB

        if current_usage + len(data) > quota_limit:
          raise IOError(28, "No space left on device")  # ENOSPC

        with open(filename, 'wb') as f:
          f.write(data)

    latency: "<1ms per check (fast, but less reliable)"
    note: "Used as fallback if filesystem doesn't support quotas"

# ============================================================================
# OUTPUT ISOLATION: READ/WRITE SEPARATION
# ============================================================================

read_write_separation:

  tool_perspective:
    reads: "Cannot read other tools' outputs"
    reason: "Each tool has isolated /tmp/output directory"
    example: |
      Tool A: /tmp/output → /session/{sess}/tools/tool_a/output
      Tool B: /tmp/output → /session/{sess}/tools/tool_b/output

      Tool A tries: open('/tmp/output/../tool_b/file')
      Result: Path traversal blocked by chroot (tool_b outside chroot)

  host_perspective:
    writes: "Cannot write to tool's output after mount"
    reason: "Tool's /tmp/output is mount point (bind mount with ro from host side)"
    result: "Host sees tool output, but cannot modify it"

  isolation_mechanism:
    - "chroot jail per tool (each sees only their /tmp/output)"
    - "Mount bind per tool (separate directory per tool)"
    - "Permissions: tool user owns output (0700)"

# ============================================================================
# OVERFLOW HANDLING & ERROR CONDITIONS
# ============================================================================

error_handling:

  scenario_1_quota_hard_limit_hit:
    trigger: "write() syscall when quota exhausted"

    kernel_behavior:
      syscall_return: "ENOSPC (errno 28)"
      errno_string: "No space left on device"
      tool_behavior: "open() succeeds, write() fails"

    tool_responsibility:
      - "Check write() return value"
      - "Handle ENOSPC gracefully (e.g., truncate output)"
      - "Log error: 'Output quota exceeded'"
      - "Exit cleanly (or K1 timeout kills it)"

    example: |
      # Tool code
      try:
        with open('/tmp/output/result.json', 'w') as f:
          f.write(large_json)  # Fails with ENOSPC
      except IOError as e:
        if e.errno == 28:  # ENOSPC
          logger.error("Output quota exceeded, truncating result")
          # Write truncated output or summary

      Result: Tool handles overflow, exits cleanly

  scenario_2_tool_continues_after_quota:
    trigger: "Tool ignores ENOSPC and continues running"

    behavior:
      - "Tool has incomplete output"
      - "K1 timeout (5min default) kills tool"
      - "Partial output returned to user"

    fallback: "K1 returns whatever was written (partial results)"

  scenario_3_tmpfs_oom:
    trigger: "RED band tool exhausts 10MB tmpfs (should not happen)"

    behavior:
      - "write() returns ENOSPC"
      - "Tool should handle like scenario 1"

    prevention: "tmpfs quota is hard kernel limit (cannot exceed)"

# ============================================================================
# OUTPUT STAGING & CLEANUP
# ============================================================================

output_staging:

  during_tool_execution:
    status: "Tool writes to /tmp/output continuously"
    data_state: "Partial (may not be complete until tool exits)"
    accessibility: "Not yet accessible to user"

  after_tool_success_exit:
    step_1_finalize:
      - "Verify output directory exists"
      - "Check output files are valid (green band: no validation)"
      - "Compute output hash (for auditing)"

    step_2_archive:
      - "Copy output to permanent storage (if green band)"
      - "Or mask output (if amber band)"
      - "Or delete immediately (if red band)"

    step_3_cleanup_jail:
      - "Unmount /tmp/output from jail"
      - "Destroy jail directory"
      - "Mark session output as ready"

    step_4_return_to_user:
      - "User retrieves output via API"
      - "GREEN: original output"
      - "AMBER: PII-masked output"
      - "RED: no output (ephemeral only)"

  after_tool_timeout_or_error:
    - "Output may be partial"
    - "GREEN: partial output returned to user (with warning)"
    - "AMBER: partial output masked and returned"
    - "RED: no output returned (ephemeral)"
    - "Cleanup proceeds as normal"

# ============================================================================
# PERFORMANCE TARGETS
# ============================================================================

performance:

  quota_check_latency:
    method: "kernel-enforced (ext4 project quotas)"
    overhead: "0ms (kernel-level enforcement)"
    note: "Checked only on actual write, not per-file"

  tmpfs_mount_latency:
    per_tool: "<1ms"
    typical: "<100µs (in-memory filesystem)"

  enospc_handling:
    tool_perception: "Instant (write fails immediately)"
    k1_handling: "Kill tool, cleanup, return partial output"

# ============================================================================
# SECURITY: QUOTA BYPASS PREVENTION
# ============================================================================

quota_bypass_prevention:

  attack_1_hardlink_to_same_file:
    attack: "Create hardlink to same file to fake size"
    example: |
      ln /tmp/output/file1 /tmp/output/file2  # Hardlink
      du /tmp/output/  # Shows 2x size, but only 1 block used
    prevention: |
      1. Hardlinks do NOT bypass quota (kernel counts inodes)
      2. Project quota counts unique inodes, not file names
      3. Multiple hardlinks = same inode = same quota
    strength: "100% (kernel-level)"

  attack_2_sparse_files:
    attack: "Create large sparse file with holes"
    example: |
      dd if=/dev/zero of=/tmp/output/sparse bs=1M seek=1000 count=1
      Creates 1MB file with 1GB hole (no space used)
    prevention: |
      1. Quota counts actual disk blocks allocated (not virtual size)"
      2. Sparse files occupy minimal space (only blocks written matter)
      3. Quota limit applies to real blocks, not apparent size
    strength: "100% (kernel-level)"

  attack_3_symlink_outside_quota:
    attack: "Create symlink to outside /tmp/output"
    example: |
      ln -s /home/data /tmp/output/link
    prevention: |
      1. Symlink itself counts against quota"
      2. Symlink target is outside /tmp/output (outside jail)"
      3. chroot prevents accessing /home anyway
    strength: "100% (chroot + quota)"

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

monitoring:

  metrics:

    output_directory_usage:
      type: "Gauge"
      unit: "bytes"
      labels: ["tool_id", "band"]
      alert: "Approaching soft limit (80/100)"

    quota_exhaustion:
      type: "Counter"
      description: "Tools that hit hard quota limit"
      labels: ["tool_id", "band"]
      alert: ">5/min (excessive quota exhaustion)"

    enospc_rate:
      type: "Counter"
      description: "Number of ENOSPC errors"
      labels: ["tool_id", "reason"]
      alert: "Monitor for unexpected patterns"

    tmpfs_usage:
      type: "Gauge"
      unit: "bytes"
      labels: ["tool_id"]
      target: "RED band <10MB per tool"
      alert: ">10MB (should not happen)"

    output_cleanup_latency:
      type: "Histogram"
      unit: "milliseconds"
      target: "P95 <500ms"
      alert: "P95 > 1000ms"

# ============================================================================
# COMPLIANCE & AUDIT
# ============================================================================

audit_trail:

  events_logged:
    - "output_created: tool_id, band, quota_limit"
    - "output_quota_soft: tool_id, current_usage, soft_limit"
    - "output_quota_hard: tool_id, current_usage, hard_limit (quota exhausted)"
    - "output_finalized: tool_id, size_bytes, hash"
    - "output_deleted: tool_id, reason (red band ephemeral)"

  retention: "7 years (SOC2/ISO27001)"
  storage: "K0 ToolReceipt (FlatBuffers)"

---

summary:
  capabilities:
    - "Per-tool output quotas (GREEN/AMBER: 100MB, RED: 10MB)"
    - "Kernel-enforced quota (ext4 project quotas)"
    - "Soft limit warnings (80MB) + hard limit blocking (100MB)"
    - "tmpfs ephemeral storage for RED band"
    - "ENOSPC error handling and tool error recovery"
    - "Quota bypass prevention (hardlinks, sparse files, symlinks)"
    - "Output staging and cleanup workflow"
    - "Full audit trail (7-year retention)"

related_contracts:
  chroot_jail:
    file: "chroot_jail_manager.yml"
    purpose: "Jail that mounts this output directory"

  readonly_mounts:
    file: "readonly_mounts_system.yml"
    purpose: "System library read-only mounts"

  seccomp_filter:
    file: "seccomp_bpf_filter.yml"
    purpose: "Syscall filtering (mount prevention)"
