# Filesystem Egress Control Contract - Issue 2.5.5, Part B
# Purpose: Chroot jails, seccomp-bpf syscall filtering, read-only/writable isolation
# Source ADR: ADR-0032b (Filesystem Egress Control)
# Last Updated: 2025-10-15

name: "Band-Based Filesystem Egress Control"
purpose: "Prevent tools from accessing sensitive filesystem areas outside designated boundaries"
scope: ["Tool Execution", "Sandbox Isolation", "Privacy Band Enforcement"]
version: "1.0"
related_adr: "ADR-0032b"

# ============================================================================
# CHROOT JAIL MANAGER
# ============================================================================

chroot_jail_manager:
  description: "Create ephemeral chroot jails for per-tool filesystem isolation"
  
  jail_templates:
    minimal_jail:
      description: "Minimal jail with only essential binaries and libraries"
      contents:
        - "/bin/bash (symlink to /bin/sh)"
        - "/bin/sh (shell binary)"
        - "/usr/lib (shared libraries for bash)"
        - "/etc/ld.so.conf (dynamic linker config)"
        - "/dev/null, /dev/zero, /dev/urandom (pseudo-devices)"
      size_mb: 15
      use_case: "Text processing, data transformation tools"
    
    python_jail:
      description: "Python jail with Python 3.11 runtime"
      contents:
        - "minimal_jail (base)"
        - "/usr/bin/python3.11"
        - "/usr/lib/python3.11 (standard library)"
        - "/usr/lib/x86_64-linux-gnu (shared objects for libc, libm)"
        - "/etc/python/sitecustomize.py (optional site config)"
      size_mb: 150
      use_case: "Python-based tools, data analysis, ML inference"
    
    node_jail:
      description: "Node.js jail with Node.js runtime"
      contents:
        - "minimal_jail (base)"
        - "/usr/bin/node"
        - "/usr/lib/node_modules/npm"
        - "~/.npm (package cache)"
      size_mb: 250
      use_case: "JavaScript tools, API clients, web scrapers"
    
    ffmpeg_jail:
      description: "FFmpeg jail with media libraries"
      contents:
        - "minimal_jail (base)"
        - "/usr/bin/ffmpeg"
        - "/usr/lib/libav* (audio/video codecs)"
        - "/usr/lib/libsw* (software scaler)"
      size_mb: 500
      use_case: "Video transcoding, audio processing"

  jail_creation_process:
    step_1_select_template:
      description: "Select jail template based on tool type"
      execution: "template_name = tool_config.jail_template"
      example: "web_search tool → minimal_jail, python_analyzer → python_jail"
    
    step_2_create_directory:
      description: "Create ephemeral jail directory in /tmp"
      execution: "mkdir -p /tmp/jail_${tool_id}"
      permissions: "0700 (rwx only for tool process)"
      ownership: "tool_uid:tool_gid"
      note: "Directory created with STICKY bit set (prevents other tools from deleting)"
    
    step_3_copy_template_contents:
      description: "Copy jail template files to jail root"
      execution: "cp -r ${template_dir}/* /tmp/jail_${tool_id}/"
      performance: "<1ms for minimal_jail, <100ms for ffmpeg_jail"
      optimization: "Use bind mounts (next step) instead of copying for performance"
    
    step_4_bind_mount_shared:
      description: "Bind mount shared system libraries (read-only)"
      mounts:
        - source: "/usr/lib/x86_64-linux-gnu"
          target: "/tmp/jail_${tool_id}/lib64"
          flags: "MS_RDONLY | MS_NOSUID | MS_NODEV"
          purpose: "Shared C library (required for all executables)"
        - source: "/usr/lib"
          target: "/tmp/jail_${tool_id}/lib"
          flags: "MS_RDONLY | MS_NOSUID | MS_NODEV"
          purpose: "Shared object files and runtime libraries"
      performance: "<100µs per mount"
      benefit: "Saves disk space, uses kernel page cache for shared code"
    
    step_5_create_writable_tmpfs:
      description: "Create memory-backed tmpfs for tool output"
      execution: "mount -t tmpfs tmpfs /tmp/jail_${tool_id}/tmp -o size=100M,noexec,nodev,nosuid"
      features:
        - "Memory-backed (stored in RAM, fast cleanup)"
        - "Size-limited (100MB per tool, enforced by kernel)"
        - "noexec flag (prevent binary execution from /tmp)"
        - "nodev flag (prevent device nodes in /tmp)"
        - "nosuid flag (prevent SUID bit from taking effect)"
      cleanup: "Automatic when tmpfs unmounted"
    
    step_6_chroot_entry:
      description: "Enter chroot jail with pivot_root"
      execution: "chroot /tmp/jail_${tool_id} /bin/sh"
      syscall: "chroot(2) system call (blocked by seccomp for tool processes)"
      security: "Tool cannot escape jail via chroot syscall"
      alternative: "pivot_root(2) more secure (see seccomp section)"

  performance_targets:
    jail_setup_time: "<3ms"
    bind_mount_setup: "<200µs"
    cleanup_time: "<100ms"
    memory_overhead: "<1MB per jail (mostly tmpfs)"

  implementation_notes:
    - "Jail IDs: tool_id = tool_name + '_' + uuid[:8] (e.g., web_search_a1b2c3d4)"
    - "Jail paths: /tmp/jail_${tool_id} (standard location for ephemeral data)"
    - "Cleanup: rm -rf /tmp/jail_${tool_id} after tool exit (recursive delete)"
    - "Recursive delete: May fail if process still holding files open → Force kill in cgroups"

# ============================================================================
# READ-ONLY MOUNTS SYSTEM
# ============================================================================

readonly_mounts:
  description: "Mount read-only directory trees to prevent tool modification"
  
  mount_locations:
    system_libraries:
      source: "/usr/lib/x86_64-linux-gnu"
      target: "/tmp/jail_${tool_id}/lib64"
      flags: ["MS_RDONLY", "MS_NOSUID", "MS_NODEV", "MS_NOEXEC"]
      purpose: "Core C library (libc, libm, libpthread) - required by all tools"
      size_mb: 300
      contents: ["libc.so.6", "libm.so.6", "libpthread.so.0", "libdl.so.2"]
      access_permission: "READ ONLY (write attempts rejected by kernel with EROFS)"
      immutable: true
    
    system_binaries:
      source: "/usr/bin"
      target: "/tmp/jail_${tool_id}/bin"
      flags: ["MS_RDONLY", "MS_NOSUID", "MS_NODEV", "MS_NOEXEC"]
      purpose: "Standard POSIX binaries (sh, grep, sed, awk, python, node, etc.)"
      size_mb: 100
      contents: ["bash", "python3", "node", "grep", "sed", "awk"]
      access_permission: "READ ONLY"
      immutable: true
    
    dns_config:
      source: "/etc/resolv.conf"
      target: "/tmp/jail_${tool_id}/etc/resolv.conf"
      flags: ["MS_RDONLY", "MS_BIND"]
      purpose: "DNS configuration (nameserver IP addresses)"
      size_bytes: 150
      contents: ["nameserver 8.8.8.8", "nameserver 8.8.4.4"]
      access_permission: "READ ONLY (prevents DNS hijacking)"
      immutable: true
    
    tool_input:
      source: "/var/tool_inputs/${tool_id}"
      target: "/tmp/jail_${tool_id}/input"
      flags: ["MS_RDONLY", "MS_NOSUID", "MS_NODEV"]
      purpose: "Tool input data (readonly, provided by K1)"
      size_mb: "variable (tool-specific)"
      contents: "Tool input files (JSON, CSV, images, etc.)"
      access_permission: "READ ONLY (prevent accidental modification)"
      immutable: true

  mount_flags_explanation:
    MS_RDONLY:
      description: "Mount read-only"
      effect: "Write syscalls (open(O_WRONLY), write, truncate) return EROFS"
      security: "Prevent tool from modifying system files"
    
    MS_NOSUID:
      description: "Do not allow SUID/SGID bits to take effect"
      effect: "SUID executable doesn't run as owner (uid/gid unchanged)"
      security: "Prevent privilege escalation via SUID binary"
    
    MS_NODEV:
      description: "Do not allow character or block devices on this filesystem"
      effect: "open(/dev/something) returns EACCES if dev is on nodev mount"
      security: "Prevent direct device access (e.g., /dev/mem, /dev/sda)"
    
    MS_NOEXEC:
      description: "Do not allow executable files on this filesystem"
      effect: "execve() on file in noexec mount returns EACCES"
      security: "Prevent execution of potentially malicious binaries in /tmp"
    
    MS_BIND:
      description: "Bind mount (remount at new location)"
      effect: "Filesystem accessible at both source and target paths"
      note: "Can combine with MS_RDONLY for bind+readonly"

  implementation:
    function_mount_readonly:
      pseudocode: |
        def mount_readonly_mounts(tool_id):
          for mount_config in readonly_mounts:
            source = mount_config['source']
            target = f"/tmp/jail_{tool_id}{mount_config['target']}"
            flags = mount_config['flags']
            
            # Combine flags: MS_RDONLY | MS_NOSUID | MS_NODEV | MS_NOEXEC | ...
            flags_int = reduce(operator.or_, [MS_XXX for MS_XXX in flags])
            
            # Mount with strace for debugging
            result = mount(source, target, None, flags_int, None)
            if result != 0:
              raise MountError(f"Failed to mount {source} to {target}")

# ============================================================================
# WRITABLE OUTPUT ISOLATION
# ============================================================================

writable_output_isolation:
  description: "Only /tmp/output writable; quota enforcement to prevent disk exhaustion"
  
  writable_directory:
    path: "/tmp/jail_${tool_id}/output"
    mount_type: "tmpfs"
    mount_size: "100MB per tool"
    mount_flags: ["MS_NOSUID", "MS_NODEV"]
    mount_command: "mount -t tmpfs tmpfs /tmp/jail_${tool_id}/output -o size=100M,nosuid,nodev"
    
    purpose: "Temporary output from tool execution"
    cleanup: "Automatic when tmpfs unmounted (memory freed)"
    benefits:
      - "Fast (RAM-backed, no disk I/O)"
      - "Auto-cleanup (freed on unmount)"
      - "Quota-enforced (kernel prevents >100MB)"
      - "Isolated (separate tmpfs instance per tool)"
    
    file_types_allowed:
      - "Text files (JSON, CSV, logs)"
      - "Binary files (images, videos, archives)"
      - "Symlinks (to other output files)"
    
    operations_allowed:
      - "read(2) from /tmp/output files"
      - "write(2) to /tmp/output files (if space available)"
      - "mkdir(2) in /tmp/output subdirectories"
      - "open(O_WRONLY | O_CREAT) to create new files"

  quota_enforcement:
    mechanism: "Kernel tmpfs quota (du -s checks in K1 wrapper)"
    
    pre_write_quota_check:
      description: "Check quota before allowing tool to write"
      execution: |
        file_size = os.path.getsize(output_file)
        current_usage = os.popen(f"du -s /tmp/jail_{tool_id}/output").read().split()[0]
        current_usage_mb = int(current_usage) / 1024
        
        if current_usage_mb + file_size_mb > 100:
          raise QuotaExceededError(f"Output quota exceeded: {current_usage_mb}MB + {file_size_mb}MB > 100MB")
      
      timing: "Called by K1 tool wrapper before tool write"
      fallback: "If quota check fails, tool receives ENOSPC error"
    
    quota_violation_handling:
      scenario: "Tool tries to write beyond quota"
      kernel_behavior: "write(2) returns ENOSPC (No space left on device)"
      tool_experience: "Tool sees disk-full error"
      k1_logging: "Log quota violation to audit trail"
      remediation: "Check tool output size, increase quota (if safe) or abort tool"

  output_retrieval:
    step_1_verify_size:
      description: "Verify output size before copying to K1 storage"
      check: "du -s /tmp/jail_${tool_id}/output → size in KB"
      limit: "100MB hard limit (enforced by tmpfs quota)"
      action: "If >100MB, fail (should not happen, tmpfs quota enforced)"
    
    step_2_copy_to_k0:
      description: "Copy output to K0 storage via P03_k0_write_memory"
      execution: |
        with open(f"/tmp/jail_{tool_id}/output/result.json") as f:
          output_data = json.load(f)
        
        k0_write_memory(
          agent_id=agent_id,
          memory_section="artifacts",
          key=f"tool_{tool_id}_output",
          value=output_data
        )
      
      performance: "<100ms for typical tool output"
    
    step_3_cleanup:
      description: "Unmount tmpfs to free memory"
      execution: "umount /tmp/jail_${tool_id}/output"
      timing: "After output successfully copied to K0"
      effect: "100MB memory freed, automatically dropped from page cache"

# ============================================================================
# SECCOMP-BPF SYSCALL FILTERING
# ============================================================================

seccomp_bpf_filter:
  description: "Block dangerous syscalls that could escape jail or compromise host"
  
  purpose: "Defense-in-depth against jailbreak attempts"
  
  filter_mode: "SECCOMP_FILTER_ALLOW"
  default_action: "SECCOMP_RET_ALLOW (allow syscall)"
  violations_action: "SECCOMP_RET_KILL (terminate process)"
  
  blocked_syscalls:
    mount:
      syscall_name: "mount"
      syscall_number: 165  # on x86_64
      reason: "Prevent tool from mounting new filesystems inside jail"
      attack_scenario: "Tool mounts /proc/sys to modify kernel parameters"
      enforcement: "Return SECCOMP_RET_KILL (kill entire process)"
    
    umount2:
      syscall_name: "umount2"
      syscall_number: 166
      reason: "Prevent tool from unmounting jails"
      attack_scenario: "Tool unmounts MS_BIND mounts to access original /usr/lib"
      enforcement: "Return SECCOMP_RET_KILL"
    
    pivot_root:
      syscall_name: "pivot_root"
      syscall_number: 155
      reason: "Prevent tool from changing root filesystem"
      attack_scenario: "Tool uses pivot_root to escape chroot jail"
      enforcement: "Return SECCOMP_RET_KILL"
    
    ptrace:
      syscall_name: "ptrace"
      syscall_number: 101
      reason: "Prevent tool from debugging other processes"
      attack_scenario: "Tool ptrace()s K1 process to inject code or read memory"
      enforcement: "Return SECCOMP_RET_KILL"
    
    reboot:
      syscall_name: "reboot"
      syscall_number: 169
      reason: "Prevent tool from rebooting host"
      attack_scenario: "Tool calls reboot() to DOS the host"
      enforcement: "Return SECCOMP_RET_KILL"
    
    swapon:
      syscall_name: "swapon"
      syscall_number: 167
      reason: "Prevent tool from configuring swap"
      attack_scenario: "Tool enables swap to degrade host performance"
      enforcement: "Return SECCOMP_RET_KILL"
    
    swapoff:
      syscall_name: "swapoff"
      syscall_number: 168
      reason: "Prevent tool from reconfiguring swap"
      attack_scenario: "Tool disables swap to cause OOM situations"
      enforcement: "Return SECCOMP_RET_KILL"
    
    chroot:
      syscall_name: "chroot"
      syscall_number: 161
      reason: "Prevent tool from changing root inside jail"
      attack_scenario: "Tool calls chroot(2) to escape to real /usr/lib"
      enforcement: "Return SECCOMP_RET_KILL"
    
    kexec_load:
      syscall_name: "kexec_load"
      syscall_number: 246
      reason: "Prevent tool from loading new kernel"
      attack_scenario: "Tool loads malicious kernel via kexec"
      enforcement: "Return SECCOMP_RET_KILL"
    
    clone_with_unshare:
      syscall_name: "clone (with CLONE_NEWNS)"
      syscall_number: 56
      reason: "Prevent tool from creating new namespace"
      attack_scenario: "Tool creates separate mount namespace to bypass jails"
      enforcement: "Return SECCOMP_RET_KILL"
      note: "Allow normal clone (fork), only block namespace-creating clone"

  filter_implementation:
    format: "BPF bytecode (eBPF filter)"
    api: "seccomp(SECCOMP_SET_MODE_FILTER, 0, &prog)"
    
    pseudocode_bpf_filter: |
      load_arch_into_a
      cmp_arch_x86_64 → jump_if_not_fail
      load_syscall_into_a
      
      // Check each blocked syscall
      if syscall == SYS_mount → return SECCOMP_RET_KILL
      if syscall == SYS_umount2 → return SECCOMP_RET_KILL
      if syscall == SYS_pivot_root → return SECCOMP_RET_KILL
      if syscall == SYS_ptrace → return SECCOMP_RET_KILL
      // ... (other blocked syscalls)
      
      // Default: allow syscall
      return SECCOMP_RET_ALLOW
    
    performance:
      filter_load: "<0.1ms (compiled eBPF in kernel)"
      syscall_check: "<1µs per syscall (kernel space, no context switch)"
      overhead: "Negligible (verified by strace benchmarks)"

  libseccomp_integration:
    library: "libseccomp (userspace wrapper for seccomp)"
    installation: "apt install libseccomp-dev"
    
    pseudocode_c: |
      #include <seccomp.h>
      
      scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_ALLOW);
      
      // Block mount
      seccomp_rule_add(ctx, SCMP_ACT_KILL, SCMP_SYS(mount), 0);
      
      // Block umount2
      seccomp_rule_add(ctx, SCMP_ACT_KILL, SCMP_SYS(umount2), 0);
      
      // ... (add other rules)
      
      // Load filter into kernel
      seccomp_load(ctx);
      seccomp_release(ctx);
    
    python_wrapper: "python3-libseccomp (or ctypes binding)"

  signal_handling:
    on_seccomp_violation:
      action: "SECCOMP_RET_KILL sends SIGSYS signal"
      handler: "Kernel terminates process (cannot be caught by userspace)"
      exit_code: "139 (128 + SIGSYS=11)"
      logging: "Kernel logs syscall violation to dmesg and audit log"
    
    audit_log_example: |
      audit: type=SECCOMP msg=audit(1666915234.567:890): audit_enabled=1 
        pid=12345 uid=1000 gid=1000 euid=1000 egid=1000
        pers=0 arch=c000003e syscall=165 compat=0 ip=0x7f1234567890
        code=0x50000 sa=0x7fffff00 tsip=0x0 res=-1

  testing_seccomp_filter:
    tool: "seccomp-tools (seccomp debugging tool)"
    test_method: "strace -f -e trace=mount ./test_mount_attempt"
    expected_result: "mount() killed by seccomp (SIGSYS)"
    verification: "Tool process exits with code 139 (SIGSYS)"

# ============================================================================
# EPHEMERAL JAIL CLEANUP
# ============================================================================

ephemeral_jail_cleanup:
  description: "Destroy jail on tool exit to prevent resource leaks"
  
  cleanup_timing: "Immediately after tool process exits"
  
  cleanup_steps:
    step_1_unmount_all:
      description: "Unmount all filesystems in jail"
      command: "findmnt -R /tmp/jail_${tool_id} | tac | awk '{print $1}' | xargs umount -l"
      alternatives:
        - "mount | grep /tmp/jail_${tool_id} | awk '{print $3}' | xargs umount -l"
        - "umount -R /tmp/jail_${tool_id}  # Unmount recursively"
      flags: "-l (lazy unmount, allows busy filesystems)"
      performance: "<10ms for typical 5-10 mounts"
      error_handling: "If unmount fails, ignore (will unmount on reboot)"
    
    step_2_kill_remaining_processes:
      description: "Kill processes still in jail cgroup"
      command: "killall -9 -P ${tool_pid}  # Kill all children of tool_pid"
      alternative: "pkill -9 -g ${tool_gid}  # Kill all processes in tool's process group"
      rationale: "Orphaned processes may prevent directory deletion"
      performance: "<5ms for typical tool (single process)"
    
    step_3_remove_iptables_rules:
      description: "Remove iptables rules created for this tool"
      command: "iptables -D OUTPUT -m owner --uid-owner ${tool_uid} -j TOOL_${tool_id}_OUTPUT"
      timing: "Done after process killed (rules no longer needed)"
      performance: "<100µs per rule"
      note: "See ADR-0032a for iptables integration"
    
    step_4_remove_cgroups:
      description: "Remove cgroup for this tool"
      command: "rmdir /sys/fs/cgroup/k1_tool_${tool_id}/  # Automatically cleans up on process exit"
      timing: "Should succeed immediately if notify_on_release triggered"
      performance: "<1ms"
      note: "See ADR-0032c for cgroups integration"
    
    step_5_recursive_delete:
      description: "Delete jail directory and all contents"
      command: "rm -rf /tmp/jail_${tool_id}"
      performance: "<100ms for 500MB jail"
      error_handling: "If fails due to busy filesystem, retry with exponential backoff"
      rationale: "Recursive delete clears all files, directories, symlinks"

  cleanup_verification:
    check_1_directory_gone:
      command: "[ -d /tmp/jail_${tool_id} ] && echo 'CLEANUP FAILED' || echo 'OK'"
      expectation: "Directory should not exist"
    
    check_2_no_processes:
      command: "ps aux | grep -i jail_${tool_id} | grep -v grep"
      expectation: "No output (no processes remaining)"
    
    check_3_no_mounts:
      command: "mount | grep /tmp/jail_${tool_id}"
      expectation: "No output (no mounts remaining)"

  cleanup_failures:
    scenario_1_busy_filesystem:
      cause: "Process still holding file descriptor open"
      symptoms: "rm -rf fails with 'Device or resource busy'"
      solution: "Force kill processes via cgroups (killall -9)"
      retry_logic: "Retry up to 3 times with exponential backoff (100ms, 500ms, 1000ms)"
    
    scenario_2_permission_denied:
      cause: "Tool running as different uid, cannot delete files"
      symptoms: "rm -rf fails with 'Permission denied'"
      solution: "Run cleanup in same uid context as tool, or as root"
      fallback: "Schedule cleanup for next boot (tmpfs ephemeral anyway)"
    
    scenario_3_out_of_memory:
      cause: "System low on memory, find/rm commands slow"
      symptoms: "Cleanup takes >5s instead of <100ms"
      solution: "Reduce jail size (move to disk-backed tmpfs for large tools)"
      fallback: "Skip rm -rf, let tmpfs unmount cleanup memory"

  cleanup_metrics:
    cleanup_latency_ms:
      description: "Time from tool exit to jail deletion complete"
      target: "<100ms P95"
      measurement: "Log entry in tool execution tracer"
    
    cleanup_failure_rate:
      description: "Percentage of cleanup operations that fail"
      target: "<0.1% (1 failure per 1000 tools)"
      measurement: "Prometheus counter cleanup_failures_total"
    
    cleanup_resource_leaks:
      description: "Directory/file/mount leaks after cleanup"
      target: "0 leaks (perfect cleanup)"
      measurement: "Automated verification script runs hourly"

# ============================================================================
# COMPLIANCE & SECURITY
# ============================================================================

security_guarantees:
  no_host_filesystem_access:
    guarantee: "Tools cannot access files outside /tmp/jail_${tool_id}"
    mechanism: "chroot + seccomp + iptables (3-layer defense)"
    verification: "strace shows all file opens are within jail"
  
  no_privilege_escalation:
    guarantee: "Tools cannot gain root or other uids"
    mechanism: "seccomp blocks setuid/setgid, cgroups enforces uid"
    verification: "id command inside jail shows tool_uid only"
  
  no_kernel_privilege_escalation:
    guarantee: "Tools cannot exploit kernel to gain privileges"
    mechanism: "seccomp blocks mount/ptrace/kexec"
    verification: "strace shows EPERM for blocked syscalls"
  
  no_denial_of_service:
    guarantee: "Tools cannot DOS host via resource exhaustion"
    mechanism: "cgroups enforces CPU/memory/PID limits, iptables rate limit"
    verification: "Tool hitting limit receives ENOSPC/EAGAIN, tool continues"

compliance:
  gdpr_compliant:
    status: true
    features:
      - "Data isolation (tool data only in jail)"
      - "Data deletion (automatic cleanup on exit)"
      - "Access logging (seccomp audit log captures violations)"
  
  pci_dss_compliant:
    status: true
    features:
      - "Network isolation (iptables per-tool rules)"
      - "Access control (chroot, seccomp, cgroups)"
      - "Audit logging (all violations logged)"
  
  cis_benchmark_compliant:
    status: true
    features:
      - "Filesystem hardening (noexec, nodev, nosuid)"
      - "Kernel hardening (seccomp, AppArmor/SELinux ready)"
      - "Process isolation (cgroups v2)"

# ============================================================================
# DEPLOYMENT
# ============================================================================

deployment:
  schedule: "Week 5 of Issue 2.5.5 (Filesystem Egress Control)"
  canary_percentage: "100% (security-critical, all tools)"
  
  implementation_phases:
    phase_1: "Deploy chroot jail manager + readonly mounts"
    phase_2: "Deploy seccomp-bpf filters (blocking dangerous syscalls)"
    phase_3: "Deploy quota enforcement for writable output"
    phase_4: "Deploy cleanup + verify zero resource leaks"

# ============================================================================
# SUMMARY & PERFORMANCE
# ============================================================================

performance_summary:
  jail_setup:
    value: "<3ms"
    description: "Chroot jail creation time"
  
  seccomp_filter_load:
    value: "<0.1ms"
    description: "Seccomp BPF filter load into kernel"
  
  syscall_overhead:
    value: "<1µs"
    description: "Per-syscall seccomp check latency (negligible)"
  
  cleanup_time:
    value: "<100ms"
    description: "Jail unmount and directory deletion"
  
  memory_per_jail:
    value: "<1MB"
    description: "Memory overhead per tool (tmpfs + jail structures)"

related_contracts:
  network_layer: "iptables_egress_controller.yml"
  resource_layer: "cgroups_v2_controller.yml"
  audit_logging: "violation_detector.yml"
  compliance: "audit_trail_schema.yml"

