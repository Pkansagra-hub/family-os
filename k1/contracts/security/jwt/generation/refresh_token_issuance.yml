---
# ADR-0037: Refresh Token Issuance Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Refresh Token Issuance Contract
# Defines the process for issuing 7-day refresh tokens with minimal claims

contract:
  name: refresh_token_issuance
  version: "1.0.0"
  description: "Refresh token issuance with 7-day expiry and Redis storage"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "3 days"

# Refresh Token Issuance Process
refresh_token_issuance:
  process_name: "issue_refresh_token"
  description: "Create and store 7-day refresh token"

  input_parameters:
    - name: "user_id"
      type: "String"
      description: "User identifier"
      validation: "Required, non-empty"
    - name: "jti"
      type: "String"
      description: "JWT ID (shared with access token)"
      validation: "Required, valid UUID v4"

  process_steps:
    create_minimal_claims:
      description: "Create Claims struct with minimal fields"
      fields:
        - "iss: Configured issuer"
        - "sub: user_id"
        - "aud: API audience"
        - "exp: now + 7 days"
        - "iat: current timestamp"
        - "jti: provided JTI (same as access token)"
        - "token_type: 'refresh'"
      rationale: "Minimal claims reduce token size and exposure risk"

    serialize_payload:
      description: "Serialize claims to JSON"
      format: "Compact JSON without whitespace"
      encoding: "UTF-8"
      validation: "Valid JSON structure"

    create_jwt_header:
      description: "Create JWT header"
      fields:
        - "alg: 'RS256'"
        - "typ: 'JWT'"
        - "kid: key identifier"
      encoding: "Base64URL"

    base64url_encode_payload:
      description: "Encode payload with Base64URL"
      standard: "RFC 4648 Section 5"
      padding: "No padding"
      validation: "Valid Base64URL characters only"

    sign_token:
      description: "Sign header.payload with RS256"
      algorithm: "RSASSA-PKCS1-v1_5 with SHA-256"
      key: "RSA 2048-bit private key"
      keystore: "Secure keystore access"
      performance: "<35ms signing time"

    assemble_jwt:
      description: "Combine header.payload.signature"
      format: "header.payload.signature"
      separator: "."
      validation: "Valid JWT format"

    store_in_redis:
      description: "Store refresh token metadata in Redis"
      key: "refresh:{jti}"
      value: "user_id"
      ttl: "7 days (604800 seconds)"
      purpose: "Token validation and revocation"
      performance: "<10ms storage time"

  output:
    type: "String"
    format: "JWT string (header.payload.signature)"
    expiry: "7 days from issuance"
    storage: "Metadata stored in Redis with TTL"

# Token Characteristics
token_characteristics:
  expiry: "7 days (604800 seconds)"
  rationale: "Longer lifetime for better UX, requires secure storage"
  claims: "Minimal (iss, sub, aud, exp, iat, jti, token_type)"
  size: "Smaller than access tokens due to fewer claims"
  usage: "Single-use with rotation"

# Redis Storage
redis_storage:
  key_format: "refresh:{jti}"
  value: "user_id (string)"
  ttl_seconds: 604800
  purpose: "Validate token existence and get user_id"
  indexing: "No additional indexes needed"
  cleanup: "Automatic expiration"

  operations:
    store:
      command: "SET refresh:{jti} {user_id} EX 604800"
      success_criteria: "OK response"
      error_handling: "Retry with exponential backoff"

    validate:
      command: "GET refresh:{jti}"
      success_criteria: "Returns user_id"
      error_handling: "Token not found = invalid/expired"

    revoke:
      command: "DEL refresh:{jti}"
      success_criteria: "1 (deleted) or 0 (not found)"
      error_handling: "Log if token was not found"

# Security Considerations
security_considerations:
  minimal_claims:
    - "No roles or capabilities in refresh tokens"
    - "No space_id (inferred from user_id)"
    - "Reduced exposure if token compromised"

  secure_storage:
    - "Redis with authentication"
    - "TLS encryption for Redis connections"
    - "Automatic expiration prevents accumulation"

  single_use_design:
    - "Consumed on use (deleted from Redis)"
    - "Prevents replay attacks"
    - "Forces token rotation"

  rotation_mechanism:
    - "New refresh token issued with each use"
    - "Old token invalidated immediately"
    - "Prevents token theft exploitation"

# Performance Requirements
performance_requirements:
  total_latency: "<50ms"
  breakdown:
    - "Claims creation: <2ms"
    - "JSON serialization: <5ms"
    - "Base64URL encoding: <2ms"
    - "Token signing: <35ms"
    - "JWT assembly: <1ms"
    - "Redis storage: <10ms"

  success_rate: ">99.9%"
  redis_availability: "Required for token issuance"

# Error Handling
error_handling:
  redis_unavailable:
    error: "RedisError"
    handling: "Return error, do not issue token"
    logging: "Log availability issue"
    fallback: "None - Redis required"

  keystore_unavailable:
    error: "KeystoreError"
    handling: "Return error, do not issue token"
    logging: "Log security event"

  signing_failure:
    error: "SigningError"
    handling: "Return error, do not issue token"
    logging: "Log security event with high priority"

  invalid_parameters:
    error: "InvalidParameters"
    handling: "Validate input parameters"
    logging: "Log validation failure"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "jsonwebtoken = \"8.3\""
      - "redis = \"0.23\""
      - "serde_json = \"1.0\""
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"

    code_example: |
      pub async fn issue_refresh_token(
          keystore: &dyn KeystoreClient,
          redis_client: &redis::Client,
          user_id: &str,
          jti: &str,
      ) -> Result<String, AuthError> {
          // Create minimal claims
          let claims = Claims::new_refresh_token(user_id, jti);

          // Get private key
          let private_key = keystore.get_private_key().await?;

          // Sign token
          let token = jsonwebtoken::encode(
              &jsonwebtoken::Header::new(jsonwebtoken::Algorithm::RS256),
              &claims,
              &jsonwebtoken::EncodingKey::from_rsa_pem(private_key.as_bytes())?,
          )?;

          // Store in Redis
          let mut conn = redis_client.get_async_connection().await?;
          let key = format!("refresh:{}", jti);
          redis::cmd("SET")
              .arg(&key)
              .arg(user_id)
              .arg("EX")
              .arg(604800)
              .query_async(&mut conn)
              .await?;

          Ok(token)
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"
      - "redis==4.5.5"

    code_example: |
      async def issue_refresh_token(
          keystore_client,
          redis_client,
          user_id: str,
          jti: str
      ) -> str:
          # Create minimal claims
          claims = Claims.new_refresh_token(user_id, jti)

          # Get private key
          private_key = await keystore_client.get_private_key()

          # Sign token
          token = jwt.encode(
              claims.dict(),
              private_key,
              algorithm='RS256'
          )

          # Store in Redis
          redis_client.setex(f'refresh:{jti}', 604800, user_id)

          return token

# Testing Requirements
testing:
  unit_tests:
    - "Token issuance with valid parameters"
    - "Token expiry calculation (7 days)"
    - "Minimal claims structure"
    - "Redis storage operations"
    - "JWT format validation"

  integration_tests:
    - "Full refresh token workflow"
    - "Token validation after issuance"
    - "Redis persistence and expiry"
    - "Concurrent token issuance"

  security_tests:
    - "Token signature verification"
    - "Redis data security"
    - "Token replay prevention"
    - "Secure key handling"

  performance_tests:
    - "Token issuance latency (<50ms)"
    - "Redis operation performance (<10ms)"
    - "Concurrent operations (100 req/sec)"

# Dependencies
dependencies:
  upstream:
    - "claims_structure.yml: Defines claims format"
    - "rs256_signing.yml: Defines signing process"
    - "private_key_security.yml: Defines key access"
  downstream:
    - "refresh_token_store.yml: Uses Redis storage pattern"
    - "refresh_endpoint.yml: Validates and consumes tokens"

# Success Criteria
success_criteria:
  functional:
    - "Refresh tokens issued successfully"
    - "Tokens contain minimal claims only"
    - "Tokens stored in Redis with correct TTL"
    - "Tokens have valid RS256 signatures"
    - "Tokens expire in 7 days"

  performance:
    - "Token issuance <50ms"
    - "Redis operations <10ms"
    - "Handles 100 concurrent requests"
    - "Stable memory usage"

  security:
    - "Minimal claims reduce exposure"
    - "Secure Redis storage"
    - "Cryptographically secure signatures"
    - "Automatic token expiration"

  reliability:
    - "High success rate (>99.9%)"
    - "Redis availability critical"
    - "Proper error handling"
    - "Automatic cleanup on expiry"
