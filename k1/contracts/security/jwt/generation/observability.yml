---
# ADR-0037: JWT Generation Observability Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# JWT Generation Observability Contract
# Defines metrics, logging, and monitoring for JWT token generation

contract:
  name: observability
  version: "1.0.0"
  description: "Observability, metrics, and monitoring for JWT generation operations"
  parent_adr: "ADR-0037"
  priority: "HIGH"
  effort: "2 days"

# Prometheus Metrics
prometheus_metrics:
  token_issuance_metrics:
    token_issuance_total:
      name: "jwt_token_issuance_total"
      type: "counter"
      description: "Total number of JWT tokens issued"
      labels:
        - "token_type: access|refresh"
        - "user_id: hashed user identifier"
        - "space_id: workspace identifier"
        - "privacy_band: RED|AMBER|GREEN"
      example: 'jwt_token_issuance_total{token_type="access", space_id="space_123"} 1500'

    token_issuance_duration_ms:
      name: "jwt_token_issuance_duration_ms"
      type: "histogram"
      description: "Time taken to issue JWT tokens"
      buckets: "[10, 25, 50, 100, 250, 500, 1000]"
      labels:
        - "token_type: access|refresh"
        - "operation: generation|signing|storage"
      example: 'jwt_token_issuance_duration_ms_bucket{token_type="access", operation="generation", le="50"} 1420'

    token_issuance_errors_total:
      name: "jwt_token_issuance_errors_total"
      type: "counter"
      description: "Total number of token issuance errors"
      labels:
        - "token_type: access|refresh"
        - "error_type: keystore_error|redis_error|signing_error|validation_error"
      example: 'jwt_token_issuance_errors_total{token_type="access", error_type="keystore_error"} 5'

  keystore_metrics:
    keystore_operation_total:
      name: "jwt_keystore_operation_total"
      type: "counter"
      description: "Total keystore operations"
      labels:
        - "operation: get_private_key|get_public_key|rotate_key"
        - "backend: os_keychain|local_hsm|encrypted_file|cloud_kms"
        - "status: success|error"
      example: 'jwt_keystore_operation_total{operation="get_private_key", backend="os_keychain", status="success"} 5000'

    keystore_operation_duration_ms:
      name: "jwt_keystore_operation_duration_ms"
      type: "histogram"
      description: "Keystore operation latency"
      buckets: "[1, 5, 10, 25, 50, 100, 250]"
      labels:
        - "operation: get_private_key|get_public_key|rotate_key"
        - "backend: os_keychain|local_hsm|encrypted_file|cloud_kms"
      example: 'jwt_keystore_operation_duration_ms_bucket{operation="get_private_key", backend="os_keychain", le="5"} 4980'

  signing_metrics:
    jwt_signing_total:
      name: "jwt_signing_total"
      type: "counter"
      description: "Total JWT signing operations"
      labels:
        - "algorithm: RS256"
        - "key_id: current key identifier"
        - "status: success|error"
      example: 'jwt_signing_total{algorithm="RS256", status="success"} 2500'

    jwt_signing_duration_ms:
      name: "jwt_signing_duration_ms"
      type: "histogram"
      description: "JWT signing operation latency"
      buckets: "[5, 10, 25, 50, 100, 250]"
      labels:
        - "algorithm: RS256"
        - "key_id: current key identifier"
      example: 'jwt_signing_duration_ms_bucket{algorithm="RS256", le="35"} 2480'

# Structured Logging
structured_logging:
  log_levels:
    info: "Normal operations"
    warning: "Degraded performance or recoverable errors"
    error: "Operation failures"
    security: "Security-related events"

  log_events:
    token_issued:
      level: "info"
      message: "JWT token issued successfully"
      fields:
        - "token_type: access|refresh"
        - "user_id: hashed identifier"
        - "space_id: workspace ID"
        - "jti: JWT ID"
        - "duration_ms: operation time"
        - "trace_id: request trace ID"

    token_issuance_failed:
      level: "error"
      message: "JWT token issuance failed"
      fields:
        - "token_type: access|refresh"
        - "user_id: hashed identifier"
        - "error_type: keystore|redis|signing|validation"
        - "error_message: detailed error"
        - "trace_id: request trace ID"

    keystore_operation:
      level: "info"
      message: "Keystore operation completed"
      fields:
        - "operation: get_private_key|get_public_key|rotate_key"
        - "backend: os_keychain|local_hsm|etc"
        - "duration_ms: operation time"
        - "status: success|error"
        - "trace_id: request trace ID"

    key_rotation_started:
      level: "info"
      message: "Key rotation initiated"
      fields:
        - "old_key_id: previous key identifier"
        - "reason: scheduled|manual|emergency"
        - "trace_id: request trace ID"

    key_rotation_completed:
      level: "info"
      message: "Key rotation completed successfully"
      fields:
        - "new_key_id: new key identifier"
        - "duration_ms: rotation time"
        - "trace_id: request trace ID"

    security_event:
      level: "security"
      message: "Security-related event in JWT generation"
      fields:
        - "event_type: keystore_failure|signing_error|key_compromise"
        - "severity: low|medium|high|critical"
        - "details: event-specific information"
        - "trace_id: request trace ID"

# Alerting Rules
alerting_rules:
  critical_alerts:
    - name: "JWT Token Issuance High Error Rate"
      condition: "rate(jwt_token_issuance_errors_total[5m]) / rate(jwt_token_issuance_total[5m]) > 0.05"
      severity: "critical"
      description: "JWT token issuance error rate >5%"

    - name: "JWT Keystore Unavailable"
      condition: "rate(jwt_keystore_operation_total{status='error'}[5m]) / rate(jwt_keystore_operation_total[5m]) > 0.01"
      severity: "critical"
      description: "Keystore error rate >1%"

    - name: "JWT Signing High Latency"
      condition: "histogram_quantile(0.95, rate(jwt_signing_duration_ms_bucket[5m])) > 100"
      severity: "critical"
      description: "JWT signing P95 latency >100ms"

  warning_alerts:
    - name: "JWT Token Issuance Increased Latency"
      condition: "histogram_quantile(0.95, rate(jwt_token_issuance_duration_ms_bucket[5m])) > 75"
      severity: "warning"
      description: "JWT issuance P95 latency >75ms"

    - name: "JWT Keystore Slow Operations"
      condition: "histogram_quantile(0.95, rate(jwt_keystore_operation_duration_ms_bucket[5m])) > 25"
      severity: "warning"
      description: "Keystore operation P95 latency >25ms"

  informational_alerts:
    - name: "JWT Key Rotation Completed"
      condition: "increase(jwt_key_rotation_completed_total[1h]) > 0"
      severity: "info"
      description: "Key rotation completed successfully"

# Dashboards
grafana_dashboards:
  jwt_generation_dashboard:
    panels:
      - title: "Token Issuance Rate"
        type: "graph"
        metrics: "rate(jwt_token_issuance_total[5m])"
        breakdown: "by token_type"

      - title: "Token Issuance Latency"
        type: "heatmap"
        metrics: "jwt_token_issuance_duration_ms"
        percentiles: "p50, p95, p99"

      - title: "Error Rate by Type"
        type: "barchart"
        metrics: "rate(jwt_token_issuance_errors_total[1h])"
        breakdown: "by error_type"

      - title: "Keystore Performance"
        type: "graph"
        metrics: "jwt_keystore_operation_duration_ms"
        breakdown: "by backend"

      - title: "Signing Performance"
        type: "singlestat"
        metrics: "histogram_quantile(0.95, rate(jwt_signing_duration_ms_bucket[5m]))"
        format: "ms"

    variables:
      - name: "space_id"
        type: "query"
        query: "label_values(space_id)"
      - name: "time_range"
        type: "interval"
        values: ["1h", "6h", "24h", "7d"]

# Tracing
distributed_tracing:
  trace_operations:
    token_issuance:
      operation: "jwt.token_issuance"
      tags:
        - "token_type: access|refresh"
        - "user_id: hashed"
        - "space_id"
      duration: "Full issuance time"

    keystore_access:
      operation: "jwt.keystore_access"
      tags:
        - "operation: get_private_key|get_public_key"
        - "backend: os_keychain|local_hsm|etc"
      duration: "Key access time"

    signing_operation:
      operation: "jwt.signing"
      tags:
        - "algorithm: RS256"
        - "key_id"
      duration: "Signing time"

  trace_sampling:
    rate: "10% for normal operations, 100% for errors"
    retention: "30 days"
    integration: "Jaeger/OpenTelemetry"

# Health Checks
health_checks:
  keystore_health:
    endpoint: "/health/keystore"
    checks:
      - "Private key accessible"
      - "Public key retrievable"
      - "Key rotation possible"
    interval: "30 seconds"
    timeout: "5 seconds"

  jwt_generation_health:
    endpoint: "/health/jwt-generation"
    checks:
      - "Token issuance works"
      - "Signing operations functional"
      - "Redis connectivity"
    interval: "30 seconds"
    timeout: "10 seconds"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "prometheus = \"0.13\""
      - "tracing = \"0.1\""
      - "opentelemetry = \"0.18\""

    code_example: |
      use prometheus::{Counter, Histogram, Encoder, TextEncoder};
      use tracing::{info, error, instrument};

      pub struct AuthMetrics {
          pub token_issuance_total: Counter,
          pub token_issuance_duration: Histogram,
          pub keystore_operation_total: Counter,
          pub keystore_operation_duration: Histogram,
      }

      impl AuthMetrics {
          pub fn new() -> Self {
              Self {
                  token_issuance_total: Counter::new(
                      "jwt_token_issuance_total",
                      "Total number of JWT tokens issued"
                  ).unwrap(),
                  // ... other metrics
              }
          }
      }

      #[instrument(skip(claims, keystore))]
      pub async fn issue_access_token(
          claims: &Claims,
          keystore: &dyn KeystoreClient,
          metrics: &AuthMetrics,
      ) -> Result<String, AuthError> {
          let timer = metrics.token_issuance_duration.start_timer();

          // Implementation...

          timer.observe_duration();
          metrics.token_issuance_total.inc();

          info!(
              token_type = "access",
              jti = %claims.jti,
              duration_ms = timer.elapsed().as_millis(),
              "JWT token issued successfully"
          );

          Ok(token)
      }

  python:
    dependencies:
      - "prometheus_client==0.16.0"
      - "opentelemetry-distro==0.39b0"
      - "opentelemetry-instrumentation==0.39b0"

    code_example: |
      from prometheus_client import Counter, Histogram
      import logging
      import time

      class AuthMetrics:
          def __init__(self):
              self.token_issuance_total = Counter(
                  'jwt_token_issuance_total',
                  'Total number of JWT tokens issued',
                  ['token_type']
              )
              self.token_issuance_duration = Histogram(
                  'jwt_token_issuance_duration_ms',
                  'Token issuance duration',
                  ['token_type']
              )

      logger = logging.getLogger(__name__)

      async def issue_access_token(claims: dict, keystore_client, metrics: AuthMetrics) -> str:
          start_time = time.time()

          try:
              # Implementation...

              duration_ms = (time.time() - start_time) * 1000
              metrics.token_issuance_duration.labels(token_type='access').observe(duration_ms)
              metrics.token_issuance_total.labels(token_type='access').inc()

              logger.info(
                  "JWT token issued successfully",
                  extra={
                      'token_type': 'access',
                      'jti': claims['jti'],
                      'duration_ms': duration_ms
                  }
              )

              return token
          except Exception as e:
              logger.error(
                  "JWT token issuance failed",
                  extra={
                      'token_type': 'access',
                      'error': str(e),
                      'duration_ms': (time.time() - start_time) * 1000
                  }
              )
              raise

# Testing Requirements
testing:
  unit_tests:
    - "Metrics collection accuracy"
    - "Log message formatting"
    - "Alert condition evaluation"
    - "Health check functionality"

  integration_tests:
    - "Metrics export to Prometheus"
    - "Log aggregation and search"
    - "Alert triggering and notification"
    - "Tracing span collection"

  performance_tests:
    - "Metrics collection overhead"
    - "Logging performance impact"
    - "Tracing performance impact"
    - "Health check response time"

  monitoring_tests:
    - "Dashboard data accuracy"
    - "Alert false positive/negative rates"
    - "Health check reliability"
    - "Observability data retention"

# Dependencies
dependencies:
  upstream:
    - "auth_service.yml: Provides operations to monitor"
    - "rs256_signing.yml: Provides signing operations"
    - "private_key_security.yml: Provides keystore operations"
  downstream:
    - "monitoring_systems: Consume metrics and logs"
    - "alerting_systems: Consume alerts"

# Success Criteria
success_criteria:
  functional:
    - "All required metrics collected"
    - "Structured logging implemented"
    - "Alerts trigger on correct conditions"
    - "Health checks work properly"
    - "Tracing spans generated"

  observability:
    - "Complete visibility into JWT operations"
    - "Performance bottlenecks identifiable"
    - "Security events detectable"
    - "System health monitorable"
    - "Issues diagnosable from logs/metrics"

  alerting:
    - "Critical issues alerted immediately"
    - "Warning conditions flagged"
    - "No false positive alerts"
    - "Alert resolution tracked"

  performance:
    - "Observability overhead <5% of total latency"
    - "Metrics collection doesn't impact operations"
    - "Logging doesn't cause bottlenecks"
    - "Health checks respond quickly"
