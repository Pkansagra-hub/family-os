---
# ADR-0037: Refresh Endpoint Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Refresh Endpoint Contract
# Defines POST /auth/refresh endpoint for token renewal

contract:
  name: refresh_endpoint
  version: "1.0.0"
  description: "POST /auth/refresh endpoint for token renewal"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "1.5 days"

# Refresh Endpoint Specification
refresh_endpoint:
  http_method: "POST"
  path: "/auth/refresh"
  content_type: "application/json"
  authentication: "None (uses refresh token)"

  request_format:
    json_body:
      required_fields:
        - "refresh_token: The refresh token string"
      optional_fields:
        - "client_id: OAuth2 client identifier"
        - "client_secret: OAuth2 client secret"
        - "scope: Requested scope (subset of original)"

  response_format:
    success_response:
      status_code: 200
      content_type: "application/json"
      body:
        access_token: "New access token (JWT)"
        refresh_token: "New refresh token (optional)"
        token_type: "Bearer"
        expires_in: "Access token lifetime in seconds"
        scope: "Granted scope"

    error_responses:
      invalid_request:
        status_code: 400
        error: "invalid_request"
        description: "Missing or invalid refresh token"

      invalid_grant:
        status_code: 400
        error: "invalid_grant"
        description: "Refresh token invalid, expired, or revoked"

      unauthorized_client:
        status_code: 400
        error: "unauthorized_client"
        description: "Client not authorized for this operation"

      unsupported_grant_type:
        status_code: 400
        error: "unsupported_grant_type"
        description: "Grant type not supported"

      server_error:
        status_code: 500
        error: "server_error"
        description: "Internal server error"

# Refresh Flow Process
refresh_flow_process:
  validate_request:
    description: "Validate incoming request"
    steps:
      - "Check HTTP method (POST)"
      - "Parse JSON body"
      - "Validate required fields"
      - "Sanitize input"
    error_handling: "Return 400 invalid_request"

  authenticate_token:
    description: "Validate refresh token"
    steps:
      - "Extract refresh_token from request"
      - "Retrieve token metadata from store"
      - "Validate token exists and not expired"
      - "Check token not revoked"
    error_handling: "Return 400 invalid_grant"

  authorize_request:
    description: "Authorize the refresh request"
    steps:
      - "Validate client_id (if provided)"
      - "Check client credentials"
      - "Verify scope subset of original"
      - "Apply rate limiting"
    error_handling: "Return 400 unauthorized_client"

  generate_tokens:
    description: "Generate new token pair"
    steps:
      - "Create new access token"
      - "Create new refresh token (rotation)"
      - "Maintain session continuity"
      - "Preserve user claims"
    error_handling: "Return 500 server_error"

  revoke_old_token:
    description: "Revoke old refresh token"
    steps:
      - "Mark old token as used"
      - "Prevent reuse attacks"
      - "Update token family"
    atomicity: "All-or-nothing with new token issuance"

  respond_success:
    description: "Return new tokens"
    steps:
      - "Format OAuth2 response"
      - "Include token metadata"
      - "Set appropriate headers"
    security: "No token leakage in logs"

# Security Considerations
security_considerations:
  token_rotation:
    description: "Automatic token rotation"
    rationale: "Prevent refresh token reuse attacks"
    implementation: "New refresh token on each use"
    compliance: "OAuth2 Security Best Current Practice"

  single_use_tokens:
    description: "One-time use tokens"
    rationale: "Immediate invalidation on use"
    implementation: "Revoke after successful refresh"
    monitoring: "Reuse attempt detection"

  rate_limiting:
    description: "Prevent refresh token abuse"
    limits: "10 refresh requests per minute per token"
    enforcement: "Token-based limiting"
    monitoring: "Rate limit violations"

  audit_logging:
    description: "Comprehensive audit trail"
    events:
      - "Refresh request received"
      - "Token validation result"
      - "New tokens issued"
      - "Old tokens revoked"
    retention: "90 days"
    compliance: "Security auditing requirements"

# Performance Requirements
performance_requirements:
  latency_budget: "<200ms"
  breakdown:
    - "Request validation: <10ms"
    - "Token retrieval: <20ms"
    - "Token generation: <100ms"
    - "Storage operations: <50ms"
    - "Response formatting: <20ms"
  throughput: "100+ requests per second"
  concurrent_requests: "Support high concurrency"

# Error Handling
error_handling:
  malformed_request:
    error: "MalformedRequest"
    response: "400 invalid_request"
    logging: "Info level"
    monitoring: "Client error metrics"

  invalid_refresh_token:
    error: "InvalidRefreshToken"
    response: "400 invalid_grant"
    logging: "Info level (common)"
    security: "Log security event"

  expired_refresh_token:
    error: "ExpiredRefreshToken"
    response: "400 invalid_grant"
    logging: "Info level"
    monitoring: "Token expiry metrics"

  revoked_refresh_token:
    error: "RevokedRefreshToken"
    response: "400 invalid_grant"
    logging: "Warning level"
    security: "Security event"

  rate_limit_exceeded:
    error: "RateLimitExceeded"
    response: "429 Too Many Requests"
    logging: "Warning level"
    headers: "Retry-After"

  token_generation_failed:
    error: "TokenGenerationFailed"
    response: "500 server_error"
    logging: "Error level"
    alerting: "Immediate alert"

  storage_unavailable:
    error: "StorageUnavailable"
    response: "500 server_error"
    logging: "Error level"
    fallback: "No fallback"

# Rate Limiting
rate_limiting:
  token_based_limiting:
    description: "Per-token rate limiting"
    algorithm: "Token bucket"
    capacity: "10 requests"
    refill_rate: "1 request per 6 seconds"
    burst_allowance: "2 extra requests"

  ip_based_limiting:
    description: "IP address rate limiting"
    algorithm: "Fixed window"
    window: "1 minute"
    limit: "100 requests per IP"
    enforcement: "After token validation"

  user_based_limiting:
    description: "Per-user rate limiting"
    algorithm: "Sliding window"
    window: "5 minutes"
    limit: "50 requests per user"
    tracking: "By subject claim"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "axum = \"0.6\""
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "tower = \"0.4\""

    code_example: |
      use axum::{
          extract::Json,
          http::StatusCode,
          response::Json as JsonResponse,
      };
      use serde::{Deserialize, Serialize};

      #[derive(Deserialize)]
      pub struct RefreshRequest {
          pub refresh_token: String,
          pub client_id: Option<String>,
          pub scope: Option<String>,
      }

      #[derive(Serialize)]
      pub struct RefreshResponse {
          pub access_token: String,
          pub refresh_token: Option<String>,
          pub token_type: String,
          pub expires_in: u32,
          pub scope: Option<String>,
      }

      #[derive(Serialize)]
      pub struct ErrorResponse {
          pub error: String,
          pub error_description: Option<String>,
      }

      pub async fn refresh_handler(
          Json(request): Json<RefreshRequest>,
      ) -> Result<Json<RefreshResponse>, (StatusCode, Json<ErrorResponse>)> {
          // Validate request
          if request.refresh_token.is_empty() {
              return Err((
                  StatusCode::BAD_REQUEST,
                  Json(ErrorResponse {
                      error: "invalid_request".to_string(),
                      error_description: Some("refresh_token is required".to_string()),
                  }),
              ));
          }

          // Retrieve and validate token
          let token_store = get_token_store();
          let metadata = token_store
              .retrieve_token(&request.refresh_token)
              .await
              .map_err(|_| (
                  StatusCode::INTERNAL_SERVER_ERROR,
                  Json(ErrorResponse {
                      error: "server_error".to_string(),
                      error_description: None,
                  }),
              ))?
              .ok_or_else(|| (
                  StatusCode::BAD_REQUEST,
                  Json(ErrorResponse {
                      error: "invalid_grant".to_string(),
                      error_description: Some("Invalid refresh token".to_string()),
                  }),
              ))?;

          // Check expiry
          let now = chrono::Utc::now().timestamp();
          if metadata.expires_at <= now {
              return Err((
                  StatusCode::BAD_REQUEST,
                  Json(ErrorResponse {
                      error: "invalid_grant".to_string(),
                      error_description: Some("Refresh token expired".to_string()),
                  }),
              ));
          }

          // Generate new tokens
          let auth_service = get_auth_service();
          let token_pair = auth_service
              .generate_token_pair(&metadata.subject, &metadata.session_id)
              .await
              .map_err(|_| (
                  StatusCode::INTERNAL_SERVER_ERROR,
                  Json(ErrorResponse {
                      error: "server_error".to_string(),
                      error_description: None,
                  }),
              ))?;

          // Revoke old token
          token_store
              .revoke_token(&request.refresh_token)
              .await
              .map_err(|_| (
                  StatusCode::INTERNAL_SERVER_ERROR,
                  Json(ErrorResponse {
                      error: "server_error".to_string(),
                      error_description: None,
                  }),
              ))?;

          // Return response
          Ok(Json(RefreshResponse {
              access_token: token_pair.access_token,
              refresh_token: Some(token_pair.refresh_token),
              token_type: "Bearer".to_string(),
              expires_in: 3600, // 1 hour
              scope: request.scope,
          }))
      }

  python:
    dependencies:
      - "fastapi==0.100.0"
      - "pydantic==2.0.0"
      - "uvicorn==0.23.0"

    code_example: |
      from fastapi import FastAPI, HTTPException, Depends
      from pydantic import BaseModel
      from typing import Optional

      app = FastAPI()

      class RefreshRequest(BaseModel):
          refresh_token: str
          client_id: Optional[str] = None
          scope: Optional[str] = None

      class RefreshResponse(BaseModel):
          access_token: str
          refresh_token: Optional[str] = None
          token_type: str = "Bearer"
          expires_in: int = 3600
          scope: Optional[str] = None

      class ErrorResponse(BaseModel):
          error: str
          error_description: Optional[str] = None

      @app.post("/auth/refresh", response_model=RefreshResponse)
      async def refresh_token(request: RefreshRequest):
          """Refresh token endpoint"""
          try:
              # Validate request
              if not request.refresh_token:
                  raise HTTPException(
                      status_code=400,
                      detail=ErrorResponse(
                          error="invalid_request",
                          error_description="refresh_token is required"
                      ).dict()
                  )

              # Get token store
              token_store = get_token_store()

              # Retrieve and validate token
              metadata = await token_store.retrieve_token(request.refresh_token)
              if not metadata:
                  raise HTTPException(
                      status_code=400,
                      detail=ErrorResponse(
                          error="invalid_grant",
                          error_description="Invalid refresh token"
                      ).dict()
                  )

              # Check expiry
              import time
              now = int(time.time())
              if metadata.expires_at <= now:
                  raise HTTPException(
                      status_code=400,
                      detail=ErrorResponse(
                          error="invalid_grant",
                          error_description="Refresh token expired"
                      ).dict()
                  )

              # Generate new tokens
              auth_service = get_auth_service()
              token_pair = await auth_service.generate_token_pair(
                  metadata.subject,
                  metadata.session_id
              )

              # Revoke old token
              await token_store.revoke_token(request.refresh_token)

              # Return response
              return RefreshResponse(
                  access_token=token_pair.access_token,
                  refresh_token=token_pair.refresh_token,
                  scope=request.scope
              )

          except HTTPException:
              raise
          except Exception as e:
              raise HTTPException(
                  status_code=500,
                  detail=ErrorResponse(
                      error="server_error"
                  ).dict()
              )

# Testing Requirements
testing:
  unit_tests:
