---
# ADR-0037: Single Use Rotation Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Single Use Rotation Contract
# Defines one-time use refresh tokens with automatic rotation

contract:
  name: single_use_rotation
  version: "1.0.0"
  description: "One-time use refresh tokens with automatic rotation"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "1.5 days"

# Single Use Token Rotation
single_use_rotation:
  description: "Refresh tokens are consumed on use and replaced"
  security_benefit: "Prevents token reuse attacks"
  oauth2_compliance: "RFC 6749 Security Best Current Practice"

  rotation_mechanism:
    token_consumption:
      description: "Token invalidated immediately after use"
      operations:
        - "Validate token exists"
        - "Check token not previously used"
        - "Mark token as consumed"
        - "Generate replacement token"
      atomicity: "All-or-nothing operation"

    replacement_generation:
      description: "Generate new refresh token"
      operations:
        - "Create new token with same family"
        - "Maintain session continuity"
        - "Preserve user permissions"
        - "Update token metadata"
      inheritance: "Same subject, session, family"

  token_family_concept:
    description: "Tokens grouped by family for revocation"
    family_id: "UUID identifying token lineage"
    inheritance: "New tokens inherit family from parent"
    revocation: "Revoke entire family on compromise"
    tracking: "Family size monitoring"

# Rotation Process
rotation_process:
  validate_single_use:
    description: "Ensure token hasn't been used before"
    operations:
      - "Check token consumption status"
      - "Verify token not in used state"
      - "Log access attempt"
    error_handling: "Reject as invalid_grant"

  mark_token_used:
    description: "Mark token as consumed"
    operations:
      - "Update token status to 'used'"
      - "Set consumption timestamp"
      - "Prevent future use"
    atomicity: "With token validation"

  generate_replacement:
    description: "Create new refresh token"
    operations:
      - "Generate new token ID"
      - "Copy metadata from old token"
      - "Set new expiry (7 days from now)"
      - "Store in token store"
    error_handling: "Fail rotation, don't consume old token"

  update_family:
    description: "Update token family tracking"
    operations:
      - "Maintain family continuity"
      - "Update family metadata"
      - "Track family size"
    monitoring: "Family size limits"

  cleanup_old_token:
    description: "Remove consumed token"
    operations:
      - "Delete from storage"
      - "Log cleanup event"
      - "Update metrics"
    timing: "After successful replacement"

# Security Properties
security_properties:
  reuse_prevention:
    description: "Prevent refresh token reuse attacks"
    mechanism: "Single use with immediate invalidation"
    detection: "Attempted reuse logged as security event"
    alerting: "Immediate security alert"

  forward_secrecy:
    description: "Compromised tokens don't compromise future tokens"
    mechanism: "Each use generates new token"
    key_rotation: "Independent of JWT signing keys"
    compromise_recovery: "Revoke token family"

  session_binding:
    description: "Tokens bound to specific sessions"
    mechanism: "Session ID in token metadata"
    validation: "Session continuity check"
    termination: "Session logout revokes family"

  audit_trail:
    description: "Complete token usage audit"
    events:
      - "Token validation attempt"
      - "Token consumption"
      - "Replacement generation"
      - "Family updates"
    retention: "90 days"
    compliance: "Security auditing"

# Token State Management
token_state_management:
  token_states:
    active: "Token available for use"
    used: "Token consumed, replacement generated"
    expired: "Token naturally expired"
    revoked: "Token manually revoked"

  state_transitions:
    active_to_used:
      trigger: "Successful token use"
      actions: ["Mark used", "Generate replacement", "Cleanup"]
      logging: "Token rotation event"

    active_to_expired:
      trigger: "TTL expiration"
      actions: ["Automatic cleanup"]
      logging: "Token expiry event"

    active_to_revoked:
      trigger: "Manual revocation"
      actions: ["Immediate deletion"]
      logging: "Token revocation event"

  state_validation:
    description: "Validate token state before use"
    checks:
      - "Token exists"
      - "Token not used"
      - "Token not expired"
      - "Token not revoked"
    error_responses: "Invalid token state"

# Family Management
token_family_management:
  family_creation:
    description: "Establish token family on initial login"
    operations:
      - "Generate unique family_id"
      - "Associate with user session"
      - "Track initial token"
    inheritance: "All subsequent tokens in family"

  family_tracking:
    description: "Monitor family size and activity"
    metrics:
      - "Active tokens per family"
      - "Family creation rate"
      - "Family revocation rate"
    limits:
      - "Max 10 active tokens per family"
      - "Max 100 total tokens per family history"

  family_revocation:
    description: "Revoke entire token family"
    triggers:
      - "Security incident"
      - "Suspicious activity"
      - "User logout"
      - "Account deactivation"
    operations:
      - "Find all active family tokens"
      - "Revoke all tokens"
      - "Log family revocation"
    atomicity: "Best effort (continue on partial failures)"

# Error Handling
error_handling:
  token_already_used:
    error: "TokenAlreadyUsed"
    handling: "Reject as invalid_grant"
    logging: "Security event"
    alerting: "Potential reuse attack"

  rotation_failed:
    error: "RotationFailed"
    handling: "Don't consume old token, return server_error"
    logging: "Error level"
    recovery: "Manual intervention may be needed"

  family_limit_exceeded:
    error: "FamilyLimitExceeded"
    handling: "Reject new token generation"
    logging: "Warning level"
    monitoring: "Family size metrics"

  concurrent_usage:
    error: "ConcurrentUsage"
    handling: "Reject second usage attempt"
    logging: "Security event"
    detection: "Race condition detection"

# Performance Requirements
performance_requirements:
  rotation_latency: "<150ms"
  breakdown:
    - "Token validation: <20ms"
    - "State update: <30ms"
    - "Replacement generation: <80ms"
    - "Cleanup: <20ms"
  throughput: "100+ rotations per second"
  atomicity: "Database transaction guarantees"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"
      - "chrono = \"0.4\""

    code_example: |
      use uuid::Uuid;

      #[derive(Debug, Clone)]
      pub enum TokenState {
          Active,
          Used,
          Expired,
          Revoked,
      }

      #[derive(Debug)]
      pub struct TokenRotationResult {
          pub new_refresh_token: String,
          pub consumed_token_id: String,
          pub family_id: String,
      }

      pub struct SingleUseRotator {
          token_store: Arc<dyn RefreshTokenStore>,
          auth_service: Arc<dyn AuthService>,
      }

      impl SingleUseRotator {
          pub async fn rotate_token(
              &self,
              refresh_token: &str,
          ) -> Result<TokenRotationResult, RotationError> {
              // Retrieve token metadata
              let metadata = self.token_store
                  .retrieve_token(refresh_token)
                  .await?
                  .ok_or(RotationError::TokenNotFound)?;

              // Check if already used (shouldn't happen due to storage)
              // but add defensive check
              if self.is_token_used(&metadata).await? {
                  return Err(RotationError::TokenAlreadyUsed);
              }

              // Check family size limits
              self.validate_family_limits(&metadata.family_id).await?;

              // Generate new token pair
              let token_pair = self.auth_service
                  .generate_token_pair(&metadata.subject, &metadata.session_id)
                  .await?;

              // Store new refresh token with same family
              let new_metadata = RefreshTokenMetadata {
                  token_id: Uuid::new_v4().to_string(),
                  subject: metadata.subject.clone(),
                  session_id: metadata.session_id.clone(),
                  issued_at: chrono::Utc::now().timestamp(),
                  expires_at: chrono::Utc::now().timestamp() + 604800, // 7 days
                  family_id: metadata.family_id.clone(),
                  client_id: metadata.client_id.clone(),
                  device_fingerprint: metadata.device_fingerprint.clone(),
              };

              let new_token_id = self.token_store
                  .store_token(new_metadata)
                  .await?;

              // Mark old token as used and delete
              self.token_store
                  .revoke_token(refresh_token)
                  .await?;

              Ok(TokenRotationResult {
                  new_refresh_token: new_token_id,
                  consumed_token_id: refresh_token.to_string(),
                  family_id: metadata.family_id,
              })
          }

          async fn is_token_used(&self, metadata: &RefreshTokenMetadata) -> Result<bool, RotationError> {
              // Check if token still exists (used tokens are deleted)
              // This is a simplified check - in practice you'd have a used flag
              Ok(false) // Assume not used if retrievable
          }

          async fn validate_family_limits(&self, family_id: &str) -> Result<(), RotationError> {
              // Simplified family size check
              // In practice, you'd query token count per family
              Ok(())
          }
      }

  python:
    dependencies:
      - "pydantic==2.0.0"
      - "uuid"
      - "asyncio"

    code_example: |
      from pydantic import BaseModel
      from enum import Enum
      from typing import Optional
      import uuid
      import time

      class TokenState(str, Enum):
          ACTIVE = "active"
          USED = "used"
          EXPIRED = "expired"
          REVOKED = "revoked"

      class TokenRotationResult(BaseModel):
          new_refresh_token: str
          consumed_token_id: str
          family_id: str

      class SingleUseRotator:
          def __init__(self, token_store, auth_service):
              self.token_store = token_store
              self.auth_service = auth_service

          async def rotate_token(self, refresh_token: str) -> TokenRotationResult:
              """Rotate refresh token with single-use semantics"""
              # Retrieve token metadata
              metadata = await self.token_store.retrieve_token(refresh_token)
              if not metadata:
                  raise RotationError("Token not found")

              # Check family limits (simplified)
              await self._validate_family_limits(metadata.family_id)

              # Generate new token pair
              token_pair = await self.auth_service.generate_token_pair(
                  metadata.subject,
                  metadata.session_id
              )

              # Create new refresh token metadata
              new_metadata = RefreshTokenMetadata(
                  token_id=str(uuid.uuid4()),
                  subject=metadata.subject,
                  session_id=metadata.session_id,
                  issued_at=int(time.time()),
                  expires_at=int(time.time()) + 604800,  # 7 days
                  family_id=metadata.family_id,
                  client_id=metadata.client_id,
                  device_fingerprint=metadata.device_fingerprint
              )

              # Store new token
              new_token_id = await self.token_store.store_token(new_metadata)

              # Revoke old token
              await self.token_store.revoke_token(refresh_token)

              return TokenRotationResult(
                  new_refresh_token=new_token_id,
                  consumed_token_id=refresh_token,
                  family_id=metadata.family_id
              )

          async def _validate_family_limits(self, family_id: str) -> None:
              """Validate token family size limits"""
              # Simplified implementation
              pass

# Testing Requirements
testing:
  unit_tests:
    - "Token rotation logic"
    - "State validation"
    - "Family limit checking"
    - "Error handling"
    - "Concurrent rotation"

  integration_tests:
    - "Full rotation workflow"
    - "Token store integration"
    - "Auth service integration"
    - "Race condition handling"

  security_tests:
    - "Reuse attack prevention"
    - "Token state integrity"
    - "Family isolation"
    - "Audit trail completeness"

  performance_tests:
    - "Rotation latency"
    - "Concurrent rotations"
    - "Family size impact"
    - "Storage performance"

# Dependencies
dependencies:
  upstream:
    - "refresh_token_store.yml: Provides token storage"
    - "auth_service.yml: Provides token generation"
    - "refresh_endpoint.yml: Triggers rotation"
  downstream:
    - "reuse_detection.yml: Monitors for reuse attempts"
    - "token_family_revocation.yml: Uses family concept"

# Success Criteria
success_criteria:
  functional:
    - "Tokens consumed on use"
    - "New tokens generated correctly"
    - "Family continuity maintained"
    - "Old tokens cleaned up"

  performance:
    - "Rotation <150ms"
    - "High throughput maintained"
    - "No performance degradation"

  security:
    - "Reuse attacks prevented"
    - "Forward secrecy maintained"
    - "Audit trail complete"

  reliability:
    - "Atomic operations"
    - "Error recovery"
    - "Monitoring and alerting"
