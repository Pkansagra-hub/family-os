metadata:
  title: "Tool Runner Capability Enforcement Contract"
  description: "Per-tool capability validation and enforcement at tool execution boundary"
  adr_references:
    - "ADR-0010b: Agent Capability Assignment Policy"
    - "ADR-0010c: Capability Enforcement at Runtime"
  version: "1.0.0"
  last_updated: "2025-10-15"

########################################
# SECTION 1: TOOL RUNNER ROLE
########################################
tool_runner_role:
  name: "tool_runner"
  classification: "Pure Actor (Infrastructure)"
  purpose: "Enforce capability-based access control for tool execution (reference monitor)"

  responsibilities:
    - "Validate capability token before tool execution"
    - "Enforce constraints (max_invocations, budget, rate limit)"
    - "Request user approval for high-risk tools"
    - "Execute tool with validated parameters"
    - "Write tool result to scoreboard"
    - "Audit log all tool executions (allowed/denied)"

  reference_monitor_properties:
    tamperproof: true                   # Tool runner code protected (immutable)
    always_invoked: true                # All tool calls go through tool runner
    small_and_verifiable: true          # <500 lines of capability validation logic

########################################
# SECTION 2: CAPABILITY VALIDATION FLOW (10 STEPS)
########################################
capability_validation_flow:
  description: "Reference monitor validation at tool execution boundary (P95 latency: 0.14ms)"

  step_1_cache_check:
    action: "Check L0 local cache for capability token"
    latency_ms: 0.05
    cache_hit_rate: 0.80                # 80% of verifications hit L0 cache

    cache_key: "cap_token:{agent_id}:{tool_id}"
    cache_entry_structure:
      cap_id: "01JCEXAMPLE123"
      agent_id: "agent_tool_001"
      tool_id: "book_hotel"
      permissions: ["execute"]
      constraints:
        max_invocations: 10
        invocations_used: 3
        requires_user_approval: true
      signature: "hmac-sha256:abcd1234..."
      cached_at: "2025-10-15T14:30:00Z"

    if_cache_miss:
      action: "Retrieve from L1 Redis cache"
      latency_ms: 0.15
      cache_hit_rate: 0.95

  step_2_signature_verification:
    action: "Verify HMAC-SHA256 signature of capability token"
    latency_ms: 0.30

    signature_validation:
      algorithm: "HMAC-SHA256"
      secret_key_source: "Vault (capability_manager secret key)"
      validation_logic: |
        def verify_signature(token: str, secret_key: bytes) -> bool:
            header, payload, signature = token.split(".")

            # Recreate signature
            message = f"{header}.{payload}".encode()
            expected_sig = hmac.new(secret_key, message, hashlib.sha256).hexdigest()

            # Constant-time comparison (prevent timing attacks)
            return hmac.compare_digest(signature, expected_sig)

    if_signature_invalid:
      result: "DENIED"
      reason: "Capability token signature invalid (possible tampering)"
      logging: "capability_verification_denied (ALERT level)"
      audit: "Increment security incident counter"

  step_3_revocation_check:
    action: "Check Redis revocation blacklist"
    latency_ms: 0.10

    redis_key: "revoked_caps"
    redis_operation: "SISMEMBER revoked_caps {cap_id}"

    if_revoked:
      result: "DENIED"
      reason: "Capability has been revoked"
      logging: "capability_verification_denied (WARNING level)"

  step_4_expiration_check:
    action: "Check capability expiration timestamp"
    latency_ms: 0.05

    validation_logic: |
      if datetime.utcnow() > capability.expires_at:
          return DENIED("Capability expired")

    if_expired:
      result: "DENIED"
      reason: "Capability expired"
      logging: "capability_verification_denied (DEBUG level)"

  step_5_agent_ownership_check:
    action: "Verify agent_id in token matches requesting agent"
    latency_ms: 0.05

    validation_logic: |
      if token.agent_id != request.agent_id:
          return DENIED("Agent ID mismatch (possible token theft)")

    if_mismatch:
      result: "DENIED"
      reason: "Agent ID mismatch"
      logging: "capability_verification_denied (ALERT level)"

  step_6_resource_type_match:
    action: "Verify resource_type in token matches requested tool"
    latency_ms: 0.05

    validation_logic: |
      if token.resource_type != "TOOL":
          return DENIED("Resource type mismatch (expected TOOL)")

    if_mismatch:
      result: "DENIED"
      reason: "Resource type mismatch"
      logging: "capability_verification_denied (WARNING level)"

  step_7_resource_id_match:
    action: "Verify resource_id (tool name) matches requested tool"
    latency_ms: 0.05

    validation_logic: |
      if token.resource_id != request.tool_name:
          return DENIED("Tool name mismatch (trying to execute unauthorized tool)")

    if_mismatch:
      result: "DENIED"
      reason: "Tool name mismatch"
      logging: "capability_verification_denied (ALERT level)"

  step_8_permission_check:
    action: "Verify 'execute' permission present in token"
    latency_ms: 0.05

    validation_logic: |
      if "execute" not in token.permissions:
          return DENIED("Missing execute permission")

    if_missing:
      result: "DENIED"
      reason: "Missing execute permission"
      logging: "capability_verification_denied (WARNING level)"

  step_9_constraint_validation:
    action: "Validate all capability constraints (max_invocations, budget, rate limit, user approval)"
    latency_ms: 0.15

    constraint_checks:
      check_1_max_invocations:
        validation: "invocations_used < max_invocations"
        if_exceeded:
          result: "DENIED"
          reason: "Max invocations exceeded"
          action: "Revoke capability (AUTOMATIC revocation)"

      check_2_budget_usd:
        validation: "spent_usd < budget_usd"
        if_exceeded:
          result: "DENIED"
          reason: "Budget exhausted"
          action: "Revoke capability (AUTOMATIC revocation)"

      check_3_rate_limit:
        validation: "requests_last_minute < rate_limit.requests_per_minute"
        if_exceeded:
          result: "DENIED"
          reason: "Rate limit exceeded (temporary)"
          action: "Return 429 error (retry after 60s)"

      check_4_user_approval_required:
        validation: "requires_user_approval == true"
        if_true:
          action: "Suspend execution, request user approval"
          latency_ms: "Variable (user response time)"

  step_10_cache_result:
    action: "Cache verification result in L0 for future requests"
    latency_ms: 0.05

    cache_ttl: "60 seconds"
    cache_entry:
      cap_id: "01JCEXAMPLE123"
      agent_id: "agent_tool_001"
      tool_id: "book_hotel"
      verification_result: "ALLOWED"
      cached_at: "2025-10-15T14:30:15Z"

########################################
# SECTION 3: PER-TOOL CAPABILITY REQUIREMENTS
########################################
per_tool_capabilities:
  tool_1_search_web:
    tool_name: "search_web"
    resource_type: "TOOL"
    required_permissions: ["execute"]

    side_effects: false                 # Information-gathering only
    privacy_band: "GREEN"               # Public web data
    financial_risk: false
    requires_user_approval: false

    default_constraints:
      max_invocations: 50
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 5
        burst: 2

    assigned_to_agents:
      - "planning_agent (default)"
      - "tool_agent (escalation)"

  tool_2_book_hotel:
    tool_name: "book_hotel"
    resource_type: "TOOL"
    required_permissions: ["execute"]

    side_effects: true                  # Creates reservation
    privacy_band: "AMBER"               # Contains user PII
    financial_risk: true                # User incurs cost
    requires_user_approval: true        # CRITICAL: User must confirm

    default_constraints:
      max_invocations: 10
      expires_at: "session_end"
      requires_user_approval: true
      max_cost_usd: 100.0               # Trust level 1 default
      rate_limit:
        requests_per_minute: 2
        burst: 1

    assigned_to_agents:
      - "booking_agent (default)"

  tool_3_charge_payment:
    tool_name: "charge_payment"
    resource_type: "TOOL"
    required_permissions: ["execute"]

    side_effects: true                  # Charges user payment method
    privacy_band: "RED"                 # Contains payment method PII
    financial_risk: true                # User incurs cost
    requires_user_approval: true        # CRITICAL: User must confirm

    default_constraints:
      max_invocations: 1                # One-time use
      expires_at: "1h"                  # Short expiration (1 hour)
      requires_user_approval: true
      max_amount_usd: 100.0             # Trust level 1 default
      rate_limit:
        requests_per_minute: 1
        burst: 1

    assigned_to_agents:
      - "payment_agent (escalation only)"

  tool_4_send_email:
    tool_name: "send_email"
    resource_type: "TOOL"
    required_permissions: ["execute"]

    side_effects: true                  # Sends external email
    privacy_band: "AMBER"               # Contains user email address
    financial_risk: false
    requires_user_approval: true        # User confirms email content

    default_constraints:
      max_invocations: 5
      expires_at: "session_end"
      requires_user_approval: true
      rate_limit:
        requests_per_minute: 2
        burst: 1

    assigned_to_agents:
      - "tool_agent (escalation)"

  tool_5_delete_file:
    tool_name: "delete_file"
    resource_type: "TOOL"
    required_permissions: ["execute", "admin"]

    side_effects: true                  # Deletes user file (irreversible)
    privacy_band: "RED"                 # High-risk operation
    financial_risk: false
    requires_user_approval: true        # User confirms deletion
    requires_arbiter_approval: true     # Arbiter confirms (high-risk)

    default_constraints:
      max_invocations: 1
      expires_at: "5m"                  # Very short expiration (5 minutes)
      requires_user_approval: true
      requires_arbiter_approval: true
      rate_limit:
        requests_per_minute: 1
        burst: 1

    assigned_to_agents:
      - "supervisor_agent (escalation only)"

  tool_6_create_calendar_event:
    tool_name: "create_calendar_event"
    resource_type: "TOOL"
    required_permissions: ["execute"]

    side_effects: true                  # Creates calendar event (external API)
    privacy_band: "AMBER"               # Contains user calendar data
    financial_risk: false
    requires_user_approval: false       # Low-risk operation (user can delete)

    default_constraints:
      max_invocations: 10
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 3
        burst: 2

    assigned_to_agents:
      - "tool_agent (default)"

########################################
# SECTION 4: USER APPROVAL INTEGRATION
########################################
user_approval_integration:
  description: "Tool runner requests user approval for high-risk tools before execution"

  trigger_conditions:
    - "requires_user_approval=true in capability constraints"
    - "financial_risk=true in tool definition"
    - "privacy_band=RED in tool definition"

  approval_request_flow:
    step_1_suspend_execution:
      action: "Tool runner suspends execution, creates approval request"
      latency_ms: 10

      approval_request_structure:
        request_id: "01JCAPPROVAL123"
        agent_id: "agent_booking_001"
        tool_name: "book_hotel"
        tool_params:
          hotel_id: "tokyo_imperial"
          check_in: "2025-11-01"
          check_out: "2025-11-04"
          guests: 2
        estimated_cost_usd: 450.00
        requires_user_approval: true
        timeout: "5 minutes"

    step_2_send_to_frontend:
      action: "Send approval request to user interface (WebSocket)"
      latency_ms: 5

      websocket_message:
        type: "APPROVAL_REQUEST"
        payload: "{approval_request_structure}"

    step_3_wait_for_user_response:
      action: "Block tool execution until user responds or timeout"
      timeout: "5 minutes"

      user_response_options:
        - "APPROVED: User confirms, return approval_token"
        - "DENIED: User cancels, return error to agent"
        - "TIMEOUT: No response, return timeout error"

    step_4_validate_approval_token:
      action: "Verify approval_token signature and params_hash (prevent TOCTOU)"
      latency_ms: 5

      validation_logic: |
        def validate_approval_token(token: ApprovalToken, params: dict) -> bool:
            # Verify signature
            if not verify_hmac_signature(token.signature):
                return False

            # Verify params hash (prevent parameter tampering after approval)
            params_hash = hashlib.sha256(json.dumps(params, sort_keys=True).encode()).hexdigest()
            if params_hash != token.params_hash:
                return False

            # Verify not expired
            if datetime.utcnow() > token.expires_at:
                return False

            return True

    step_5_execute_tool_with_approval:
      action: "Execute tool with validated approval_token"
      latency_ms: "Variable (tool-dependent)"

########################################
# SECTION 5: CONSTRAINT ENFORCEMENT
########################################
constraint_enforcement:
  max_invocations:
    description: "Track invocation count, deny when exceeded"
    storage: "Redis counter (atomic increment)"

    enforcement_logic: |
      redis_key = f"cap_invocations:{cap_id}"
      invocations_used = redis.incr(redis_key)

      if invocations_used > capability.max_invocations:
          # Revoke capability (AUTOMATIC revocation)
          await capability_supervisor.revoke_capability(
              cap_id=cap_id,
              reason="Max invocations exceeded"
          )

          return DENIED("Max invocations exceeded")

    latency_ms: 0.15                    # Redis INCR operation

  budget_usd:
    description: "Track cumulative cost, deny when budget exhausted"
    storage: "Redis counter (atomic increment by cost)"

    enforcement_logic: |
      redis_key = f"cap_budget:{cap_id}"
      spent_usd = redis.incrbyfloat(redis_key, tool_cost_usd)

      if spent_usd > capability.budget_usd:
          # Revoke capability (AUTOMATIC revocation)
          await capability_supervisor.revoke_capability(
              cap_id=cap_id,
              reason="Budget exhausted"
          )

          return DENIED("Budget exhausted")

    latency_ms: 0.15                    # Redis INCRBYFLOAT operation

  rate_limit:
    description: "Track requests per minute, deny when rate limit exceeded (temporary)"
    storage: "Redis sorted set (sliding window)"

    enforcement_logic: |
      redis_key = f"cap_rate_limit:{cap_id}"
      current_time = time.time()
      window_start = current_time - 60  # 1 minute window

      # Remove old requests outside window
      redis.zremrangebyscore(redis_key, 0, window_start)

      # Count requests in window
      requests_in_window = redis.zcard(redis_key)

      if requests_in_window >= capability.rate_limit.requests_per_minute:
          return DENIED("Rate limit exceeded (retry after 60s)")

      # Add current request
      redis.zadd(redis_key, {current_time: current_time})
      redis.expire(redis_key, 60)       # Expire after 1 minute

    latency_ms: 0.20                    # Redis sorted set operations

  requires_user_approval:
    description: "Suspend execution, request user approval"
    storage: "None (approval flow state in memory)"

    enforcement_logic: |
      if capability.requires_user_approval:
          approval = await user_interface.request_approval(
              agent_id=agent_id,
              tool_name=tool_name,
              tool_params=tool_params,
              timeout=timedelta(minutes=5)
          )

          if approval.status != "APPROVED":
              return DENIED(f"User approval denied: {approval.reason}")

    latency_ms: "Variable (user response time, 0-300000ms)"

########################################
# SECTION 6: AUDIT LOGGING
########################################
audit_logging:
  description: "Log all tool executions (allowed/denied) for security review and compliance"

  log_level_mapping:
    allowed: "DEBUG"                    # Successful executions (low noise)
    denied_expired: "DEBUG"             # Expected denials (capability expired)
    denied_constraint: "WARNING"        # Constraint violations (e.g., rate limit, budget)
    denied_signature: "ALERT"           # Signature tampering (security incident)
    denied_agent_mismatch: "ALERT"      # Token theft attempt (security incident)

  log_entry_structure:
    timestamp: "2025-10-15T14:35:12.456Z"
    level: "DEBUG|WARNING|ALERT"
    event_type: "tool_execution_allowed|tool_execution_denied"
    agent_id: "agent_tool_001"
    tool_name: "book_hotel"
    cap_id: "01JCEXAMPLE123"
    verification_step: "step_2_signature_verification"
    result: "ALLOWED|DENIED"
    reason: "Signature valid, constraints satisfied"
    latency_ms: 0.14
    cognitive_trace_id: "trace_abc123"

  storage:
    tier_1: "K0 WAL (FlatBuffers binary, 30-day retention)"
    tier_2: "Elasticsearch (searchable, 90-day retention)"
    tier_3: "S3 GLACIER (compliance, 7-year retention)"

  query_patterns:
    query_1_denied_by_agent:
      description: "Find all denied tool executions for specific agent"
      elasticsearch_query: |
        GET /k1_audit/_search
        {
          "query": {
            "bool": {
              "must": [
                {"term": {"event_type": "tool_execution_denied"}},
                {"term": {"agent_id": "agent_tool_001"}}
              ]
            }
          },
          "sort": [{"timestamp": {"order": "desc"}}]
        }

    query_2_signature_tampering_incidents:
      description: "Find all signature tampering attempts (security incidents)"
      elasticsearch_query: |
        GET /k1_audit/_search
        {
          "query": {
            "bool": {
              "must": [
                {"term": {"level": "ALERT"}},
                {"term": {"reason": "Signature invalid"}}
              ]
            }
          }
        }

########################################
# SECTION 7: PERFORMANCE METRICS
########################################
performance_metrics:
  capability_verification_latency_ms:
    p50: 0.05                           # Cached (80% hit rate)
    p95: 0.14                           # Cached or uncached
    p99: 0.50                           # Uncached + constraint checks
    target: 0.30                        # Budget: <0.3ms P95
    status: "PASS (0.14ms < 0.30ms)"

  cache_hit_rate:
    l0_local: 0.80                      # 80% hit rate
    l1_redis: 0.95                      # 95% hit rate (if L0 miss)
    overall: 0.81                       # 80% L0 + 19% L1 = 99% total
    target: 0.80                        # Target: 80% L0 hit rate
    status: "PASS"

  constraint_check_latency_ms:
    max_invocations: 0.15               # Redis INCR
    budget_usd: 0.15                    # Redis INCRBYFLOAT
    rate_limit: 0.20                    # Redis sorted set ops
    user_approval: "Variable"           # User response time

  tool_execution_throughput:
    concurrent_tools: 100               # Max concurrent tool executions
    qps_target: 500                     # Queries per second (tool executions)
    qps_current: 420                    # Current throughput
    status: "PASS (420 QPS >= 500 QPS target)"

########################################
# SECTION 8: TESTING SCENARIOS
########################################
testing_scenarios:
  scenario_1_allowed_execution:
    description: "Tool agent executes search_web with valid capability, verification passes"

    setup: |
      agent = await agent_fabric.hire_agent(role="tool_agent", assigned_tool="search_web")
      capability = await capability_manager.issue_capability(
          agent_id=agent.id,
          resource_type="TOOL",
          resource_id="search_web",
          permissions=["execute"],
          constraints={"max_invocations": 50}
      )

    execution: |
      result = await tool_runner.execute_tool(
          agent_id=agent.id,
          tool_name="search_web",
          tool_params={"query": "weather Tokyo"},
          capability_token=capability.token
      )

    expected_result: "ALLOWED"
    expected_latency_ms: 0.14           # Verification latency
    expected_audit_log:
      level: "DEBUG"
      event_type: "tool_execution_allowed"
      tool_name: "search_web"

  scenario_2_denied_signature_invalid:
    description: "Attacker tampers with capability token, signature verification fails"

    setup: |
      agent = await agent_fabric.hire_agent(role="tool_agent", assigned_tool="search_web")
      capability = await capability_manager.issue_capability(...)

      # Attacker modifies token (e.g., increases max_invocations)
      tampered_token = capability.token.replace("max_invocations\":50", "max_invocations\":500")

    execution: |
      result = await tool_runner.execute_tool(
          agent_id=agent.id,
          tool_name="search_web",
          tool_params={"query": "weather Tokyo"},
          capability_token=tampered_token
      )

    expected_result: "DENIED"
    expected_reason: "Capability token signature invalid (possible tampering)"
    expected_audit_log:
      level: "ALERT"
      event_type: "tool_execution_denied"
      verification_step: "step_2_signature_verification"

  scenario_3_denied_max_invocations_exceeded:
    description: "Agent exceeds max_invocations constraint, capability auto-revoked"

    setup: |
      agent = await agent_fabric.hire_agent(role="tool_agent", assigned_tool="search_web")
      capability = await capability_manager.issue_capability(
          constraints={"max_invocations": 3}
      )

      # Agent calls search_web 3 times (exhausts invocations)
      for i in range(3):
          await tool_runner.execute_tool(agent_id=agent.id, tool_name="search_web")

    execution: |
      # 4th attempt (should be denied)
      result = await tool_runner.execute_tool(
          agent_id=agent.id,
          tool_name="search_web",
          capability_token=capability.token
      )

    expected_result: "DENIED"
    expected_reason: "Max invocations exceeded"
    expected_action: "Capability auto-revoked (AUTOMATIC revocation)"

  scenario_4_user_approval_required:
    description: "Booking agent calls book_hotel, tool runner requests user approval"

    setup: |
      agent = await agent_fabric.hire_agent(role="booking_agent", assigned_tool="book_hotel")
      capability = await capability_manager.issue_capability(
          constraints={"requires_user_approval": true, "max_cost_usd": 100.0}
      )

    execution: |
      result = await tool_runner.execute_tool(
          agent_id=agent.id,
          tool_name="book_hotel",
          tool_params={"hotel_id": "tokyo_imperial", "check_in": "2025-11-01"},
          capability_token=capability.token
      )

    expected_result: "AWAITING_USER_APPROVAL"
    expected_approval_request:
      tool_name: "book_hotel"
      estimated_cost_usd: 450.00
      timeout: "5 minutes"
