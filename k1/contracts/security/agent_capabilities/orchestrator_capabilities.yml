metadata:
  title: "Orchestrator Capability Delegation Contract"
  description: "Capability delegation and attenuation for orchestrator agent (coordinator role)"
  adr_references:
    - "ADR-0010b: Agent Capability Assignment Policy"
    - "ADR-0006: 3-Phase Orchestration (Negotiation, Selection, Execution)"
  version: "1.0.0"
  last_updated: "2025-10-15"

########################################
# SECTION 1: ORCHESTRATOR ROLE DEFINITION
########################################
orchestrator_role:
  name: "orchestrator_agent"
  classification: "AI Agent (Coordinator)"
  purpose: "Coordinate multi-agent execution via capability delegation (grant attenuated capabilities to sub-agents)"
  trust_level_default: 3                # High trust (critical role)

  operational_characteristics:
    - "Receives task from planning agent with plan"
    - "Negotiates with agents during 3-phase orchestration"
    - "Selects agents for execution based on capabilities"
    - "Delegates attenuated capabilities to selected agents"
    - "Monitors agent execution and handles failures"
    - "Does NOT execute tools directly (delegates to tool agents)"

  delegation_principle: |
    Orchestrator delegates capabilities with attenuation:
    - Grants sub-agents subset of orchestrator capabilities
    - Attenuates constraints (50% budget, 50% invocations)
    - Enforces expiration (child expires after 10 min max)
    - Tracks delegation chain for audit

########################################
# SECTION 2: DEFAULT CAPABILITIES
########################################
default_capabilities:
  capability_1_agent_management:
    resource_type: "AGENT_FABRIC"
    resource_id: "hire_agent"
    permissions:
      - "execute"

    constraints:
      max_agent_hires: 10               # Max 10 agents per orchestration
      expires_at: "session_end"
      rate_limit:
        hires_per_minute: 5
        burst: 3

    justification: "Orchestrator hires agents during 3-phase orchestration (selection phase)"

    performance_cost:
      latency_ms: 150                   # Agent hire latency (state initialization)
      cost_usd_per_hire: 0.0            # No API cost (internal)
      memory_mb_per_agent: 50           # SessionState allocation

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "orchestration_complete"
      - "agent_crash"
      - "session_end"

  capability_2_capability_delegation:
    resource_type: "CAPABILITY_MANAGER"
    resource_id: "delegate_capability"
    permissions:
      - "execute"

    constraints:
      max_delegations: 50               # Max 50 capability delegations per orchestration
      expires_at: "session_end"
      rate_limit:
        delegations_per_minute: 10
        burst: 5

    justification: "Orchestrator delegates attenuated capabilities to sub-agents during task execution"

    performance_cost:
      latency_ms: 2                     # Capability creation + signing
      cost_usd_per_delegation: 0.0      # No API cost
      memory_mb: 0                      # Shared capability registry

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "orchestration_complete"
      - "session_end"

  capability_3_memory_scoreboard_read:
    resource_type: "MEMORY"
    resource_id: "scoreboard"
    permissions:
      - "read"

    constraints:
      expires_at: "session_end"
      max_reads_per_minute: 50

    justification: "Orchestrator reads scoreboard to aggregate results from sub-agents"

    performance_cost:
      latency_ms: 5                     # Memory read (L0 cache)
      cost_usd_per_invocation: 0.0
      memory_mb: 0

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "session_end"

  capability_4_llm_access:
    resource_type: "LLM"
    resource_id: "gemma-2b"
    permissions:
      - "execute"

    constraints:
      max_invocations: 50               # For orchestration decisions
      expires_at: "session_end"
      budget_usd: 0.0                   # Local LLM (no cost)
      rate_limit:
        requests_per_minute: 10
        burst: 5

    justification: "Orchestrator uses LLM for agent selection and coordination decisions"

    performance_cost:
      latency_ms: 120                   # gemma-2b inference
      cost_usd_per_invocation: 0.0
      memory_mb: 350                    # Shared model (no per-agent allocation)

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "session_end"

########################################
# SECTION 3: CAPABILITY DELEGATION WORKFLOW
########################################
capability_delegation_workflow:
  description: "Orchestrator delegates attenuated capabilities to sub-agents during 3-phase orchestration"

  phase_1_negotiation:
    action: "Orchestrator announces task, agents bid with capability requirements"
    latency_ms: 150                     # Task announcement + bid collection

    task_announcement:
      task_id: "task_001"
      task_type: "book_hotel"
      required_capabilities:
        - resource_type: "TOOL"
          resource_id: "book_hotel"
          permissions: ["execute"]
          constraints:
            max_invocations: 1
            requires_user_approval: true

    agent_bid_example:
      agent_id: "agent_booking_001"
      agent_role: "booking_agent"
      bid_score: 0.85                   # Hiring score (skill + availability)
      capability_requirements:
        - resource_type: "TOOL"
          resource_id: "book_hotel"
          permissions: ["execute"]
        - resource_type: "MEMORY"
          resource_id: "scoreboard"
          permissions: ["write"]

  phase_2_selection:
    action: "Orchestrator selects agent based on bid score and capability match"
    latency_ms: 50                      # Selection logic

    selection_criteria:
      - "Agent has required capabilities or can escalate"
      - "Agent trust level sufficient for task"
      - "Agent bid score highest among bidders"

    selected_agent:
      agent_id: "agent_booking_001"
      agent_role: "booking_agent"
      trust_level: 2
      bid_score: 0.85

  phase_3_execution:
    action: "Orchestrator delegates attenuated capabilities to selected agent"
    latency_ms: 2                       # Capability creation + signing

    delegation_step_1_attenuation:
      description: "Create child capability with reduced constraints"

      parent_capability:
        resource_type: "TOOL"
        resource_id: "book_hotel"
        permissions: ["execute"]
        constraints:
          max_invocations: 10
          budget_usd: 1000.0
          expires_at: "2025-10-15T18:00:00Z"

      child_capability:
        resource_type: "TOOL"
        resource_id: "book_hotel"
        permissions: ["execute"]
        constraints:
          max_invocations: 5            # 50% of parent
          budget_usd: 500.0             # 50% of parent
          expires_at: "2025-10-15T14:50:00Z"  # min(parent, current+10min)

      attenuation_rules:
        budget_multiplier: 0.5          # Child gets 50% of parent budget
        invocations_multiplier: 0.5     # Child gets 50% of parent invocations
        max_child_expiration_minutes: 10  # Child expires after 10 min max

    delegation_step_2_issue_capability:
      description: "Issue capability token to child agent"

      capability_token_creation: |
        child_cap = await capability_manager.create_capability(
            agent_id="agent_booking_001",
            resource_type="TOOL",
            resource_id="book_hotel",
            permissions=["execute"],
            constraints={
                "max_invocations": 5,
                "budget_usd": 500.0,
                "expires_at": "2025-10-15T14:50:00Z",
                "requires_user_approval": true
            },
            issued_by="orchestrator_agent",
            parent_cap_id="01JCPARENT123"
        )

      delegation_chain_tracking:
        parent_cap_id: "01JCPARENT123"
        child_cap_id: "01JCCHILD456"
        delegation_depth: 1             # 1 level deep (orchestrator → booking_agent)
        delegated_at: "2025-10-15T14:40:00Z"

    delegation_step_3_send_to_agent:
      description: "Send capability token to selected agent"

      message_to_agent:
        type: "CAPABILITY_GRANTED"
        cap_id: "01JCCHILD456"
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        resource_type: "TOOL"
        resource_id: "book_hotel"
        permissions: ["execute"]
        constraints:
          max_invocations: 5
          budget_usd: 500.0
          expires_at: "2025-10-15T14:50:00Z"

########################################
# SECTION 4: ATTENUATION RULES
########################################
attenuation_rules:
  description: "Rules for reducing constraints when delegating capabilities to sub-agents"

  rule_1_budget_reduction:
    formula: "child_budget = parent_budget * 0.5"
    rationale: "Prevent budget exhaustion via agent spawning"

    examples:
      - parent_budget: 1000.0
        child_budget: 500.0
      - parent_budget: 100.0
        child_budget: 50.0

    edge_cases:
      parent_budget_zero:
        parent_budget: 0.0
        child_budget: 0.0             # Cannot delegate if parent has no budget

  rule_2_invocations_reduction:
    formula: "child_invocations = floor(parent_invocations * 0.5)"
    rationale: "Prevent runaway loops via agent spawning"

    examples:
      - parent_invocations: 10
        child_invocations: 5
      - parent_invocations: 7
        child_invocations: 3          # floor(7 * 0.5) = 3

    edge_cases:
      parent_invocations_one:
        parent_invocations: 1
        child_invocations: 0          # Cannot delegate if parent has 1 invocation

  rule_3_expiration_reduction:
    formula: "child_expires_at = min(parent_expires_at, current_time + 10 minutes)"
    rationale: "Child cannot outlive parent"

    examples:
      - parent_expires_at: "2025-10-15T18:00:00Z"
        current_time: "2025-10-15T14:40:00Z"
        child_expires_at: "2025-10-15T14:50:00Z"  # current + 10 min

      - parent_expires_at: "2025-10-15T14:45:00Z"
        current_time: "2025-10-15T14:40:00Z"
        child_expires_at: "2025-10-15T14:45:00Z"  # min(parent, current+10min)

    edge_cases:
      parent_expires_soon:
        parent_expires_at: "2025-10-15T14:42:00Z"
        current_time: "2025-10-15T14:40:00Z"
        child_expires_at: "2025-10-15T14:42:00Z"  # Parent expires in 2 min

  rule_4_permissions_restriction:
    formula: "child_permissions ⊆ parent_permissions"
    rationale: "Child cannot have more permissions than parent"

    examples:
      - parent_permissions: ["execute", "read"]
        child_permissions: ["execute"]  # Subset allowed

      - parent_permissions: ["execute"]
        child_permissions: ["execute", "write"]  # INVALID (not subset)

  rule_5_delegation_depth_limit:
    formula: "delegation_depth <= 3"
    rationale: "Prevent deep delegation chains (complexity, audit difficulty)"

    examples:
      - orchestrator → booking_agent: depth=1 (allowed)
      - orchestrator → booking_agent → payment_agent: depth=2 (allowed)
      - orchestrator → ... → agent4: depth=4 (DENIED)

    enforcement: |
      if parent_cap.delegation_depth >= 3:
          return DENIED("Max delegation depth exceeded (3)")

########################################
# SECTION 5: DELEGATION CHAIN TRACKING
########################################
delegation_chain_tracking:
  description: "Track capability delegation lineage for audit and revocation cascade"

  delegation_record_structure:
    parent_cap_id: "01JCPARENT123"
    child_cap_id: "01JCCHILD456"
    parent_agent_id: "agent_orchestrator_001"
    child_agent_id: "agent_booking_001"
    delegation_depth: 1
    delegated_at: "2025-10-15T14:40:00Z"
    attenuation_applied:
      budget_multiplier: 0.5
      invocations_multiplier: 0.5
      expiration_reduced: true

  storage:
    tier_1: "Redis hash (delegation_chain:{parent_cap_id})"
    tier_2: "K0 WAL (FlatBuffers binary, 30-day retention)"
    tier_3: "Elasticsearch (searchable, 90-day retention)"

  query_patterns:
    query_1_find_children:
      description: "Find all child capabilities delegated from parent"
      redis_operation: "SMEMBERS delegation_children:{parent_cap_id}"
      result_example: ["01JCCHILD456", "01JCCHILD789"]

    query_2_find_delegation_chain:
      description: "Find full delegation chain (orchestrator → ... → leaf agent)"
      algorithm: "Recursive BFS traversal"

      implementation: |
        async def find_delegation_chain(cap_id: str) -> list[str]:
            chain = [cap_id]
            children = await redis.smembers(f"delegation_children:{cap_id}")

            for child_id in children:
                child_chain = await find_delegation_chain(child_id)
                chain.extend(child_chain)

            return chain

      result_example: ["01JCPARENT123", "01JCCHILD456", "01JCGRANDCHILD789"]

########################################
# SECTION 6: REVOCATION CASCADE
########################################
revocation_cascade:
  description: "When parent capability revoked, automatically revoke all child capabilities (cascade)"

  trigger: "Parent capability revoked (e.g., orchestrator agent crashes)"
  action: "Revoke all child capabilities in delegation chain"
  latency_ms: "0.5ms base + 0.1ms per child capability"

  cascade_algorithm: |
    async def revoke_with_cascade(cap_id: str, reason: str):
        # Step 1: Revoke parent capability
        await capability_supervisor.revoke_capability(cap_id, reason)

        # Step 2: Find all children
        children = await redis.smembers(f"delegation_children:{cap_id}")

        # Step 3: Revoke all children recursively
        for child_id in children:
            await revoke_with_cascade(child_id, f"Parent revoked: {reason}")

        # Step 4: Cleanup delegation chain
        await redis.delete(f"delegation_children:{cap_id}")

  example_scenario:
    parent_revoked:
      cap_id: "01JCPARENT123"
      reason: "Orchestrator agent crashed"
      children: ["01JCCHILD456", "01JCCHILD789"]

    cascade_result:
      revoked_capabilities:
        - "01JCPARENT123 (orchestrator)"
        - "01JCCHILD456 (booking_agent)"
        - "01JCCHILD789 (tool_agent)"

      total_latency_ms: 0.7           # 0.5 base + 0.1*2 children

########################################
# SECTION 7: ESCALATION CAPABILITIES (TRUST LEVEL 3)
########################################
escalation_capabilities_trust_level_3:
  trust_level: 3
  trust_level_definition: "High trust (50-199 successful orchestrations completed, <2% failure rate)"

  escalation_1_increased_agent_limit:
    resource_type: "AGENT_FABRIC"
    resource_id: "hire_agent"
    permissions: ["execute"]

    approval_required: false            # Auto-approved for high trust
    approval_criteria: {}

    constraints:
      max_agent_hires: 20               # Increased from 10 to 20
      expires_at: "session_end"
      rate_limit:
        hires_per_minute: 10
        burst: 5

    justification: "High trust orchestrator can hire more agents for complex multi-agent workflows"

    issued_at: "escalation_request"
    issued_by: "capability_manager"
    revoked_on:
      - "session_end"

  escalation_2_gpt4o_mini_for_coordination:
    resource_type: "LLM"
    resource_id: "gpt-4o-mini"
    permissions: ["execute"]

    approval_required: false            # Auto-approved for high trust
    approval_criteria: {}

    constraints:
      max_invocations: 20
      budget_usd: 2.0
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 5
        burst: 3

    justification: "High trust orchestrator can use cloud LLM for complex coordination decisions"

    issued_at: "escalation_request"
    issued_by: "capability_manager"
    revoked_on:
      - "budget_exhausted"
      - "session_end"

########################################
# SECTION 8: FORBIDDEN CAPABILITIES
########################################
forbidden_capabilities:
  description: "Capabilities that orchestrator CANNOT escalate to (separation of concerns)"

  forbidden_1_direct_tool_execution:
    resource_type: "TOOL"
    resource_ids: ["*"]
    permissions: ["execute"]
    reason: "Orchestrator coordinates agents, does NOT execute tools directly. Tool execution delegated to tool agents."
    enforcement: "Escalation request rejected at supervisor evaluation"

  forbidden_2_memory_write:
    resource_type: "MEMORY"
    resource_ids: ["beliefs", "scoreboard", "persona"]
    permissions: ["write"]
    reason: "Orchestrator reads scoreboard for result aggregation. Only memory agent and tool agents write to memory."
    enforcement: "Escalation request rejected at supervisor evaluation"

  forbidden_3_k0_wal_write:
    resource_type: "K0_WAL"
    resource_ids: ["*"]
    permissions: ["write"]
    reason: "Orchestrator does not write to K0 WAL. Only memory agent and supervisor have write access."
    enforcement: "Escalation request rejected at supervisor evaluation"

########################################
# SECTION 9: TESTING SCENARIOS
########################################
testing_scenarios:
  scenario_1_default_capabilities_at_hire:
    description: "Orchestrator agent hired, receives default capabilities"

    setup: |
      agent = await agent_fabric.hire_agent(role="orchestrator_agent")

    expected_capabilities:
      - "AGENT_FABRIC:hire_agent (execute, max_agent_hires=10)"
      - "CAPABILITY_MANAGER:delegate_capability (execute, max_delegations=50)"
      - "MEMORY:scoreboard (read)"
      - "LLM:gemma-2b (execute)"

    validation: |
      caps = await capability_manager.list_agent_capabilities(agent.id)
      assert len(caps) == 4
      assert any(c.resource_id == "hire_agent" for c in caps)
      assert any(c.resource_id == "delegate_capability" for c in caps)

  scenario_2_capability_delegation_with_attenuation:
    description: "Orchestrator delegates booking capability to booking agent with attenuation"

    setup: |
      orchestrator = await agent_fabric.hire_agent(role="orchestrator_agent")
      orchestrator_cap = await capability_manager.issue_capability(
          agent_id=orchestrator.id,
          resource_type="TOOL",
          resource_id="book_hotel",
          permissions=["execute"],
          constraints={"max_invocations": 10, "budget_usd": 1000.0}
      )

      booking_agent = await agent_fabric.hire_agent(role="booking_agent", assigned_tool="book_hotel")

    execution: |
      # Orchestrator delegates attenuated capability
      child_cap = await capability_manager.delegate_capability(
          parent_cap_id=orchestrator_cap.cap_id,
          child_agent_id=booking_agent.id
      )

    expected_child_capability:
      resource_type: "TOOL"
      resource_id: "book_hotel"
      permissions: ["execute"]
      constraints:
        max_invocations: 5              # 50% of parent (10)
        budget_usd: 500.0               # 50% of parent (1000)
        expires_at: "current + 10min"

    validation: |
      assert child_cap.constraints["max_invocations"] == 5
      assert child_cap.constraints["budget_usd"] == 500.0

      # Verify delegation chain
      chain = await delegation_tracker.find_chain(orchestrator_cap.cap_id)
      assert len(chain) == 2
      assert chain[1] == child_cap.cap_id

  scenario_3_revocation_cascade:
    description: "Orchestrator agent crashes, all delegated capabilities revoked (cascade)"

    setup: |
      orchestrator = await agent_fabric.hire_agent(role="orchestrator_agent")
      orchestrator_cap = await capability_manager.issue_capability(...)

      # Orchestrator delegates to 3 booking agents
      booking_agents = []
      child_caps = []
      for i in range(3):
          agent = await agent_fabric.hire_agent(role="booking_agent")
          booking_agents.append(agent)

          child_cap = await capability_manager.delegate_capability(
              parent_cap_id=orchestrator_cap.cap_id,
              child_agent_id=agent.id
          )
          child_caps.append(child_cap)

    execution: |
      # Orchestrator crashes
      await agent_fabric.terminate_agent(orchestrator.id, reason="Agent crashed")

      # Trigger revocation cascade
      await capability_supervisor.revoke_with_cascade(
          cap_id=orchestrator_cap.cap_id,
          reason="Orchestrator crashed"
      )

    expected_result:
      revoked_capabilities: 4           # 1 orchestrator + 3 booking agents
      total_latency_ms: 0.8             # 0.5 base + 0.1*3 children

    validation: |
      # Verify all child capabilities revoked
      for child_cap in child_caps:
          cap = await capability_manager.get_capability(child_cap.cap_id)
          assert cap.status == "REVOKED"

      # Verify orchestrator capability revoked
      orch_cap = await capability_manager.get_capability(orchestrator_cap.cap_id)
      assert orch_cap.status == "REVOKED"

  scenario_4_delegation_depth_limit_enforced:
    description: "Orchestrator attempts 4-level delegation, denied (max depth=3)"

    setup: |
      # Level 1: Orchestrator
      orchestrator = await agent_fabric.hire_agent(role="orchestrator_agent")
      cap_level_1 = await capability_manager.issue_capability(...)

      # Level 2: Sub-orchestrator
      sub_orch = await agent_fabric.hire_agent(role="orchestrator_agent")
      cap_level_2 = await capability_manager.delegate_capability(
          parent_cap_id=cap_level_1.cap_id,
          child_agent_id=sub_orch.id
      )

      # Level 3: Booking agent
      booking = await agent_fabric.hire_agent(role="booking_agent")
      cap_level_3 = await capability_manager.delegate_capability(
          parent_cap_id=cap_level_2.cap_id,
          child_agent_id=booking.id
      )

    execution: |
      # Level 4: Tool agent (should be DENIED)
      tool_agent = await agent_fabric.hire_agent(role="tool_agent")

      try:
          cap_level_4 = await capability_manager.delegate_capability(
              parent_cap_id=cap_level_3.cap_id,
              child_agent_id=tool_agent.id
          )
      except DelegationError as e:
          assert str(e) == "Max delegation depth exceeded (3)"

    expected_result: "DENIED"
    expected_reason: "Max delegation depth exceeded (3)"
