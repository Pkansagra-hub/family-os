metadata:
  title: "Planner Agent Capability Assignment Contract"
  description: "Default and escalation capabilities for Planning agents in K1 Intelligence Module"
  adr_references:
    - "ADR-0010b: Agent Capability Assignment Policy"
    - "ADR-0010a: Capability Token Design & Lifecycle"
  version: "1.0.0"
  last_updated: "2025-10-15"

########################################
# SECTION 1: AGENT ROLE DEFINITION
########################################
agent_role:
  name: "planning_agent"
  purpose: "Generate execution plans using LLM, query memory, call information-gathering tools"
  classification: "AI Agent (LLM-driven)"
  trust_level_default: 1                # Low trust (new agent)

  operational_characteristics:
    - "Uses local LLM (gemma-2b) for plan generation"
    - "Queries memory (beliefs section) for conversation context"
    - "Calls information-gathering tools (search_web) for context"
    - "Does NOT execute side-effecting tools (booking, payment, email)"
    - "Does NOT write to memory (read-only access)"
    - "Can escalate to more powerful LLMs (gpt-4o-mini, gpt-4o) with approval"

  least_privilege_principle: |
    Planning agent receives minimum capabilities for plan generation:
    - Local LLM only (no expensive cloud LLMs by default)
    - Read-only memory access (no corruption risk)
    - Information-gathering tools only (no side effects)
    - Escalation available for complex tasks (with supervisor approval)

########################################
# SECTION 2: DEFAULT CAPABILITIES
########################################
default_capabilities:
  capability_1_local_llm:
    resource_type: "LLM"
    resource_id: "gemma-2b"
    permissions:
      - "execute"

    constraints:
      max_invocations: 100
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 10
        burst: 5

    justification: "Planning requires LLM for plan generation"

    performance_cost:
      latency_ms: 120                   # P95 latency for gemma-2b inference
      cost_usd_per_invocation: 0.0      # Local LLM (no API cost)
      memory_mb: 350                    # gemma-2b model size

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "agent_crash"
      - "session_end"
      - "policy_violation"

    example_token_claims:
      cap_id: "01JCEXAMPLE123"
      agent_id: "agent_planning_001"
      resource_type: "LLM"
      resource_id: "gemma-2b"
      permissions: ["execute"]
      constraints:
        max_invocations: 100
        expires_at: "2025-10-15T18:00:00Z"
      issued_at: "2025-10-15T14:23:45Z"
      signature: "hmac-sha256:abcd1234..."

  capability_2_search_web:
    resource_type: "TOOL"
    resource_id: "search_web"
    permissions:
      - "execute"

    constraints:
      max_invocations: 50
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 5
        burst: 2

    justification: "Planning may require web search for context (information-gathering only)"

    performance_cost:
      latency_ms: 850                   # P95 latency for web search API
      cost_usd_per_invocation: 0.0      # Free tier search API
      memory_mb: 0                      # No model loading

    tool_characteristics:
      side_effects: false               # Information-gathering only (no state mutation)
      privacy_band: "GREEN"             # Public web data
      requires_user_approval: false

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "agent_crash"
      - "session_end"
      - "policy_violation"

  capability_3_memory_beliefs_read:
    resource_type: "MEMORY"
    resource_id: "beliefs"
    permissions:
      - "read"

    constraints:
      expires_at: "session_end"
      max_reads_per_minute: 20

    justification: "Planning requires conversation context from beliefs section"

    performance_cost:
      latency_ms: 5                     # P95 latency for memory read (L0 cache)
      cost_usd_per_invocation: 0.0      # In-memory operation
      memory_mb: 0                      # Shared memory (no allocation)

    memory_section_characteristics:
      section: "beliefs"
      privacy_band: "GREEN"             # Conversation context (non-sensitive)
      size_kb_typical: 50               # Typical beliefs section size
      read_only: true

    issued_at: "agent_hire"
    issued_by: "capability_manager"
    revoked_on:
      - "agent_crash"
      - "session_end"

########################################
# SECTION 3: ESCALATION CAPABILITIES (TRUST LEVEL 1)
########################################
escalation_capabilities_trust_level_1:
  trust_level: 1
  trust_level_definition: "Low trust (1-9 successful tasks completed)"

  escalation_1_gpt4o_mini:
    resource_type: "LLM"
    resource_id: "gpt-4o-mini"
    permissions:
      - "execute"

    approval_required: true             # Requires supervisor approval
    approval_criteria:
      task_complexity: "high"           # Planning task complexity >= high
      local_llm_failed: true            # gemma-2b failed after 3 attempts
      user_confirmation: false          # No user confirmation needed (information task)

    constraints:
      budget_usd: 0.50
      max_invocations: 5
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 2
        burst: 1

    justification: "Local LLM failed to generate valid plan after 3 attempts, escalate to cloud LLM"

    performance_cost:
      latency_ms: 450                   # P95 latency for gpt-4o-mini API
      cost_usd_per_invocation: 0.10     # OpenAI pricing (avg)
      memory_mb: 0                      # Cloud API (no local model)

    issued_at: "escalation_request"
    issued_by: "supervisor_agent"
    revoked_on:
      - "budget_exhausted"
      - "agent_crash"
      - "session_end"

    escalation_request_example: |
      request = CapabilityRequestMessage(
          agent_id="agent_planning_001",
          resource_type="LLM",
          resource_id="gpt-4o-mini",
          permissions=["execute"],
          constraints={"budget_usd": 0.50, "max_invocations": 5},
          justification="Local LLM failed to generate valid plan after 3 attempts",
          context={
              "task": "Book hotel in Tokyo for 3 nights",
              "local_llm_attempts": 3,
              "failure_reason": "Invalid JSON output (missing 'steps' key)"
          }
      )

    supervisor_evaluation_logic: |
      # Step 1: Check trust level (must be >= 1)
      if agent.trust_level < 1:
          return DENIED("Trust level too low")

      # Step 2: Check local LLM failure
      if not context["local_llm_attempts"] >= 3:
          return DENIED("Must exhaust local LLM attempts first")

      # Step 3: Check budget constraints
      if constraints["budget_usd"] > 0.50:
          return DENIED("Budget exceeds $0.50 limit for trust level 1")

      # Step 4: Approve
      return APPROVED("Supervisor approved escalation")

########################################
# SECTION 4: ESCALATION CAPABILITIES (TRUST LEVEL 2)
########################################
escalation_capabilities_trust_level_2:
  trust_level: 2
  trust_level_definition: "Medium trust (10-49 successful tasks completed, <5% failure rate)"

  escalation_1_gpt4o_mini_auto_approved:
    resource_type: "LLM"
    resource_id: "gpt-4o-mini"
    permissions:
      - "execute"

    approval_required: false            # Auto-approved for medium trust
    approval_criteria: {}               # No additional criteria (trust level sufficient)

    constraints:
      budget_usd: 1.0
      max_invocations: 10
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 5
        burst: 2

    justification: "Medium trust agent can use gpt-4o-mini without supervisor approval"

    performance_cost:
      latency_ms: 450
      cost_usd_per_invocation: 0.10
      memory_mb: 0

    issued_at: "escalation_request"
    issued_by: "capability_manager"     # Auto-issued (no supervisor)
    revoked_on:
      - "budget_exhausted"
      - "agent_crash"
      - "session_end"

  escalation_2_gpt4o_requires_approval:
    resource_type: "LLM"
    resource_id: "gpt-4o"
    permissions:
      - "execute"

    approval_required: true             # Still requires supervisor approval (expensive)
    approval_criteria:
      task_complexity: "critical"       # Only for critical tasks
      gpt_4o_mini_failed: true          # gpt-4o-mini failed after attempts

    constraints:
      budget_usd: 1.0
      max_invocations: 3
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 1
        burst: 1

    justification: "Critical task requires most powerful LLM (gpt-4o)"

    performance_cost:
      latency_ms: 650                   # P95 latency for gpt-4o API
      cost_usd_per_invocation: 0.30     # OpenAI pricing (avg)
      memory_mb: 0

    issued_at: "escalation_request"
    issued_by: "supervisor_agent"
    revoked_on:
      - "budget_exhausted"
      - "agent_crash"
      - "session_end"

########################################
# SECTION 5: ESCALATION CAPABILITIES (TRUST LEVEL 3)
########################################
escalation_capabilities_trust_level_3:
  trust_level: 3
  trust_level_definition: "High trust (50-199 successful tasks completed, <2% failure rate)"

  escalation_1_gpt4o_auto_approved:
    resource_type: "LLM"
    resource_id: "gpt-4o"
    permissions:
      - "execute"

    approval_required: false            # Auto-approved for high trust
    approval_criteria: {}               # No additional criteria

    constraints:
      budget_usd: 2.0
      max_invocations: 10
      expires_at: "session_end"
      rate_limit:
        requests_per_minute: 2
        burst: 1

    justification: "High trust agent can use gpt-4o without supervisor approval"

    performance_cost:
      latency_ms: 650
      cost_usd_per_invocation: 0.30
      memory_mb: 0

    issued_at: "escalation_request"
    issued_by: "capability_manager"     # Auto-issued
    revoked_on:
      - "budget_exhausted"
      - "agent_crash"
      - "session_end"

########################################
# SECTION 6: FORBIDDEN CAPABILITIES
########################################
forbidden_capabilities:
  description: "Capabilities that planning agent CANNOT escalate to (security/safety boundaries)"

  forbidden_1_side_effecting_tools:
    resource_type: "TOOL"
    resource_ids:
      - "book_hotel"
      - "charge_payment"
      - "send_email"
      - "create_calendar_event"
      - "delete_file"
    reason: "Planning agent is read-only (information-gathering). Side-effecting tools assigned to tool agents only."
    enforcement: "Escalation request rejected at supervisor evaluation"

  forbidden_2_memory_write:
    resource_type: "MEMORY"
    resource_ids:
      - "beliefs"
      - "scoreboard"
      - "control"
      - "persona"
      - "multimodal"
      - "meta"
    permissions: ["write"]
    reason: "Planning agent has read-only memory access. Only memory agent can write to memory sections."
    enforcement: "Escalation request rejected at supervisor evaluation"

  forbidden_3_k0_wal_write:
    resource_type: "K0_WAL"
    resource_ids: ["*"]
    permissions: ["write"]
    reason: "Planning agent cannot write to K0 WAL (event persistence). Only memory agent and supervisor have write access."
    enforcement: "Escalation request rejected at supervisor evaluation"

########################################
# SECTION 7: CAPABILITY INHERITANCE
########################################
capability_inheritance:
  scenario: "Planning agent spawns sub-planning agent for complex subtask"

  parent_capability:
    resource_type: "LLM"
    resource_id: "gpt-4o-mini"
    permissions: ["execute"]
    constraints:
      budget_usd: 1.0
      max_invocations: 10
      expires_at: "2025-10-15T18:00:00Z"

  child_capability:
    resource_type: "LLM"
    resource_id: "gpt-4o-mini"
    permissions: ["execute"]
    constraints:
      budget_usd: 0.5                   # 50% of parent budget
      max_invocations: 5                # 50% of parent invocations
      expires_at: "2025-10-15T14:40:00Z"  # min(parent, current + 10min)

  inheritance_rules:
    budget_multiplier: 0.5              # Child gets 50% of parent budget
    invocations_multiplier: 0.5         # Child gets 50% of parent invocations
    max_child_expiration_minutes: 10    # Child expires after 10 min max

  inheritance_implementation: |
    def create_child_capability(parent: CapabilityToken, child_agent_id: str):
        parent_claims = jwt.decode(parent, verify=False)

        child_constraints = {
            "budget_usd": parent_claims["constraints"]["budget_usd"] * 0.5,
            "max_invocations": int(parent_claims["constraints"]["max_invocations"] * 0.5),
            "expires_at": min(
                parent_claims["constraints"]["expires_at"],
                (datetime.utcnow() + timedelta(minutes=10)).isoformat()
            )
        }

        return capability_factory.create_capability(
            agent_id=child_agent_id,
            resource_type=parent_claims["resource_type"],
            resource_id=parent_claims["resource_id"],
            permissions=parent_claims["permissions"],
            constraints=child_constraints,
            issued_by="parent_agent"
        )

########################################
# SECTION 8: REVOCATION TRIGGERS
########################################
revocation_triggers:
  trigger_1_agent_crash:
    trigger: "Agent raises unhandled exception, enters TERMINATED state"
    action: "Revoke all agent capabilities immediately"
    latency_ms: 15                      # P95 revocation latency
    reason: "Crashed agent may be compromised or malfunctioning"

    implementation: |
      async def on_agent_crash(agent: Agent):
          await capability_supervisor.revoke_all_agent_capabilities(
              agent_id=agent.id,
              reason="Agent crashed"
          )

  trigger_2_policy_violation:
    trigger: "Agent violates K1 policy (invalid tool call, memory corruption attempt)"
    action: "Revoke all agent capabilities immediately, demote trust level to 0"
    latency_ms: 15
    reason: "Policy violation indicates malicious or buggy agent"

    implementation: |
      async def on_policy_violation(agent: Agent, violation: str):
          await capability_supervisor.revoke_all_agent_capabilities(
              agent_id=agent.id,
              reason=f"Policy violation: {violation}"
          )
          agent.trust_level = 0         # Demote to untrusted

  trigger_3_session_end:
    trigger: "Session terminates (user disconnects, timeout)"
    action: "Revoke all session capabilities"
    latency_ms: 10
    reason: "Session-bound capabilities no longer valid"

    implementation: |
      async def on_session_end(session_id: str):
          agents = agent_registry.get_by_session(session_id)
          for agent in agents:
              await capability_supervisor.revoke_all_agent_capabilities(
                  agent_id=agent.id,
                  reason="Session ended"
              )

  trigger_4_budget_exhausted:
    trigger: "Agent consumes budget_usd fully"
    action: "Revoke LLM capability automatically"
    latency_ms: 5
    reason: "Prevent cost overrun"

    implementation: |
      async def on_budget_exhausted(cap_id: str, agent_id: str):
          await capability_supervisor.revoke_capability(
              cap_id=cap_id,
              reason="Budget exhausted"
          )
          logger.warning("llm_budget_exhausted", cap_id=cap_id, agent_id=agent_id)

########################################
# SECTION 9: TRUST LEVEL PROGRESSION
########################################
trust_level_progression:
  promotion_triggers:
    level_0_to_level_1:
      condition: "After 1 successful task completion"
      latency_ms: 0.5                   # Trust level update latency
      automatic: true

    level_1_to_level_2:
      condition: "After 10 successful task completions"
      latency_ms: 0.5
      automatic: true

    level_2_to_level_3:
      condition: "After 50 successful task completions"
      latency_ms: 0.5
      automatic: true

    level_3_to_level_4:
      condition: "Never (admin reserved for supervisor agent only)"
      automatic: false

  demotion_triggers:
    any_level_to_level_0_policy_violation:
      condition: "Agent crash, policy violation, security incident"
      latency_ms: 0.5
      automatic: true

    any_level_to_level_0_failure_rate:
      condition: "Failure rate exceeds 10%"
      latency_ms: 0.5
      automatic: true

  trust_level_tracking:
    state_per_agent:
      successful_tasks: 0               # Count of successful task completions
      failed_tasks: 0                   # Count of failed tasks
      total_tasks: 0                    # Total tasks attempted
      failure_rate: 0.0                 # failed_tasks / total_tasks
      current_trust_level: 1            # Current trust level (0-4)
      last_promotion: null              # Timestamp of last promotion
      last_demotion: null               # Timestamp of last demotion

########################################
# SECTION 10: TESTING SCENARIOS
########################################
testing_scenarios:
  scenario_1_default_capabilities_at_hire:
    description: "Planning agent hired, receives default capabilities (gemma-2b, search_web, beliefs read)"

    setup: |
      agent = await agent_fabric.hire_agent(role="planning_agent")

    expected_capabilities:
      - "LLM:gemma-2b (execute)"
      - "TOOL:search_web (execute)"
      - "MEMORY:beliefs (read)"

    validation: |
      caps = await capability_manager.list_agent_capabilities(agent.id)
      assert len(caps) == 3
      assert any(c.resource_id == "gemma-2b" for c in caps)
      assert any(c.resource_id == "search_web" for c in caps)
      assert any(c.resource_id == "beliefs" for c in caps)

  scenario_2_escalation_denied_low_trust:
    description: "Planning agent (trust level 0) requests gpt-4o, denied due to insufficient trust"

    setup: |
      agent = await agent_fabric.hire_agent(role="planning_agent")
      agent.trust_level = 0             # Untrusted

    escalation_request: |
      request = CapabilityRequestMessage(
          agent_id=agent.id,
          resource_type="LLM",
          resource_id="gpt-4o",
          permissions=["execute"],
          constraints={"budget_usd": 1.0},
          justification="Need gpt-4o for complex task"
      )

    expected_result: "DENIED"
    expected_reason: "Trust level too low (level 0, requires level 2+)"

  scenario_3_escalation_approved_medium_trust:
    description: "Planning agent (trust level 2) requests gpt-4o-mini, auto-approved"

    setup: |
      agent = await agent_fabric.hire_agent(role="planning_agent")
      agent.trust_level = 2             # Medium trust
      agent.successful_tasks = 15       # 15 successful tasks completed

    escalation_request: |
      request = CapabilityRequestMessage(
          agent_id=agent.id,
          resource_type="LLM",
          resource_id="gpt-4o-mini",
          permissions=["execute"],
          constraints={"budget_usd": 1.0, "max_invocations": 10},
          justification="Need gpt-4o-mini for complex planning task"
      )

    expected_result: "APPROVED"
    expected_reason: "Auto-approved (trust level 2)"
    expected_latency_ms: 3              # Escalation evaluation latency

  scenario_4_capability_inheritance:
    description: "Planning agent spawns sub-planning agent, child inherits reduced capabilities"

    setup: |
      parent_agent = await agent_fabric.hire_agent(role="planning_agent")
      parent_agent.trust_level = 2

      # Parent escalates to gpt-4o-mini
      parent_cap = await capability_manager.issue_capability(
          agent_id=parent_agent.id,
          resource_type="LLM",
          resource_id="gpt-4o-mini",
          permissions=["execute"],
          constraints={"budget_usd": 1.0, "max_invocations": 10}
      )

      # Parent spawns child
      child_agent = await agent_fabric.hire_agent(
          role="planning_agent",
          parent_agent_id=parent_agent.id
      )

    expected_child_capability:
      resource_type: "LLM"
      resource_id: "gpt-4o-mini"
      permissions: ["execute"]
      constraints:
        budget_usd: 0.5                 # 50% of parent
        max_invocations: 5              # 50% of parent
        expires_at: "current + 10min"   # min(parent, current+10min)

    validation: |
      child_caps = await capability_manager.list_agent_capabilities(child_agent.id)
      gpt4o_mini_cap = next(c for c in child_caps if c.resource_id == "gpt-4o-mini")
      assert gpt4o_mini_cap.constraints["budget_usd"] == 0.5
      assert gpt4o_mini_cap.constraints["max_invocations"] == 5
