#
# Role-Based Capability Templates
# EPIC 2.5.2: Capability Manager Implementation
# ADR-0010b: Agent Capability Assignment Policy
#
# Purpose: Define default capability templates for each agent role
# Foundation: Least privilege with role-based assignment
# Integration: Loaded from capability_policies.yml YAML configuration
#

metadata:
  title: "Role-Based Capability Templates"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-15"
  adr_references:
    - "ADR-0010b: Agent Capability Assignment Policy"
    - "ADR-0010: Capability-Based Security"

role_template_overview:
  description: "Pre-defined capability sets for each agent role"
  principle: "Least privilege - each role gets minimal permissions needed"
  configuration_source: "Loaded from contracts/security/capability_manager/role_based_templates.yml"
  application: "Applied on agent hire (Agent Fabric)"

agent_roles_and_templates:
  planning_agent:
    description: "Agent that plans tool sequences using LLM"
    hire_trigger: "Orchestrator selects planner for task"
    default_trust_level: 1

    auto_issued_capabilities:
      capability_1:
        resource_type: "LLM"
        resource_id: "gemma-2b"
        permissions: ["execute", "read"]
        constraints:
          max_invocations: 1000
          budget_usd: 5.0
          max_invocations_per_minute: 10
        purpose: "Plan tasks using local LLM (no API cost)"

      capability_2:
        resource_type: "TOOL"
        resource_id: "*"
        permissions: ["execute", "read"]
        constraints:
          max_invocations_per_minute: 5
          requires_approval: false
        purpose: "Check tool registry (read-only)"

      capability_3:
        resource_type: "MEMORY"
        resource_id: "beliefs"
        permissions: ["read"]
        constraints: {}
        purpose: "Read session beliefs for context"

      capability_4:
        resource_type: "MEMORY"
        resource_id: "scoreboard"
        permissions: ["read"]
        constraints: {}
        purpose: "Read scoreboard for task tracking"

    optional_capabilities:
      high_trust_3:
        # If trust_level >= 3
        resource_type: "LLM"
        resource_id: "gpt-4o"
        permissions: ["execute", "read"]
        constraints:
          budget_usd: 2.0
          max_invocations: 100
        requirement: "trust_level >= 3"

    revocation_triggers:
      - "Agent enters TERMINATED state"
      - "Agent crashes 3+ times in 10 minutes"
      - "Unauthorized access attempt detected"

  tool_agent:
    description: "Agent that executes assigned tools"
    hire_trigger: "Orchestrator selects tool executor"
    default_trust_level: 1

    auto_issued_capabilities:
      capability_1:
        resource_type: "TOOL"
        resource_id: "{assigned_tool_id}"
        permissions: ["execute", "read"]
        constraints:
          max_invocations: 100
          # Budget depends on tool (booking tools higher than search)
          budget_usd: 10.0
        purpose: "Execute assigned tool"

      capability_2:
        resource_type: "MEMORY"
        resource_id: "scoreboard"
        permissions: ["write", "read"]
        constraints: {}
        purpose: "Update task progress in scoreboard"

      capability_3:
        resource_type: "K0_WAL"
        resource_id: "*"
        permissions: ["write"]
        constraints: {}
        purpose: "Write execution events to WAL"

    dynamic_assignment:
      assigned_tool_id: "Determined at hire time"
      assignment_example: "booking_agent hired → TOOL:book_hotel capability"
      per_tool_budget:
        search_web: 0.0
        book_hotel: 50.0
        charge_payment: 100.0
        send_email: 1.0

    permission_restrictions:
      cannot_do:
        - "Read other agents' memory"
        - "Modify beliefs or persona"
        - "Access LLM (use planner for reasoning)"

  memory_agent:
    description: "Agent managing session memory and history"
    hire_trigger: "SessionManager on session init"
    default_trust_level: 2

    auto_issued_capabilities:
      capability_1:
        resource_type: "MEMORY"
        resource_id: "*"
        permissions: ["read", "write"]
        constraints: {}
        purpose: "Full access to session memory"

      capability_2:
        resource_type: "K0_WAL"
        resource_id: "*"
        permissions: ["read", "write"]
        constraints: {}
        purpose: "Read and archive to WAL"

      capability_3:
        resource_type: "TOOL"
        resource_id: "none"
        permissions: []
        constraints: {}
        purpose: "No tool access (pure state management)"

    special_privileges:
      - "Can read all memory sections (beliefs, persona, multimodal, etc.)"
      - "Can write to control section (critical updates)"

  supervisor_agent:
    description: "Supervisor with administrative capabilities"
    hire_trigger: "Agent Fabric init (singleton per session)"
    default_trust_level: 4

    auto_issued_capabilities:
      capability_all:
        resource_type: "*"
        resource_id: "*"
        permissions: ["execute", "read", "write", "delete", "delegate", "attenuate", "admin"]
        constraints: {}
        purpose: "Full administrative access"

    special_authorities:
      - "Can grant capabilities to other agents"
      - "Can revoke capabilities (immediate)"
      - "Can escalate to user/arbitration"
      - "Can override agent decisions (with audit)"

trust_level_escalation:
  level_0_untrusted:
    initial_state: "Agent just hired, unknown behavior"
    default_capabilities:
      max_invocations: 10
      budget_usd: 0.0
      max_invocations_per_minute: 2
    escalation_path: "1 successful task → level 1"

  level_1_low_trust:
    initial_state: "Agent completed 1 task without incident"
    default_capabilities:
      max_invocations: 100
      budget_usd: 1.0
      max_invocations_per_minute: 5
    escalation_path: "10 successful tasks → level 2"

  level_2_medium_trust:
    initial_state: "Agent completed 10 tasks, 95%+ success rate"
    default_capabilities:
      max_invocations: 1000
      budget_usd: 10.0
      max_invocations_per_minute: 10
    escalation_path: "50 successful tasks, 98%+ success → level 3"

  level_3_high_trust:
    initial_state: "Agent completed 50+ tasks, demonstrated reliability"
    default_capabilities:
      max_invocations: 10000
      budget_usd: 100.0
      max_invocations_per_minute: 50
    escalation_path: "Supervisor manual approval → level 4 (admin)"

  level_4_admin:
    initial_state: "Supervisor or manual escalation"
    default_capabilities: "All permissions, no limits"
    escalation_path: "N/A (max level)"

  escalation_mechanism:
    automatic_escalation:
      trigger: "Agent reaches task threshold with high success rate"
      condition: |
        if tasks_completed >= threshold AND
           success_rate >= 0.95 AND
           no_security_violations:
            escalate_trust_level()
      action: "Automatically issued new capabilities with higher limits"
      audit: "Logged as TRUST_LEVEL_ESCALATION event"

    manual_escalation:
      trigger: "Supervisor or user requests acceleration"
      approval: "Requires supervisor approval"
      action: "Immediate trust level increase + capability reissuance"
      audit: "Logged with approver info"

    trust_revocation:
      trigger: "Policy violation, crash, or incident"
      degradation: "Demote to lower trust level, revoke high-trust capabilities"
      action: "Automatic + notification"
      recovery: "Can re-escalate after cool-down period"

role_template_configuration:
  yaml_format: |
    role_based_templates:
      planning_agent:
        default_trust_level: 1
        auto_capabilities:
          - resource_type: LLM
            resource_id: gemma-2b
            permissions: [execute, read]
            constraints:
              max_invocations: 1000
              budget_usd: 5.0

      tool_agent:
        default_trust_level: 1
        auto_capabilities:
          - resource_type: TOOL
            resource_id: "{assigned_tool_id}"
            permissions: [execute, read]
            constraints:
              max_invocations: 100
              budget_usd: 10.0

      # ... more roles ...

  loading_at_startup:
    implementation: |
      class CapabilityManager:
          def __init__(self):
              self.role_templates = load_yaml(
                  "contracts/security/capability_manager/role_based_templates.yml"
              )
              self.trust_levels = load_yaml(
                  "contracts/security/capability_manager/trust_levels.yml"
              )

  dynamic_template_reloading:
    trigger: "Config change in ConfigManager"
    mechanism: "Hot-reload without agent restart"
    effect: "New agents get updated templates; existing agents unaffected"

capability_issuance_at_agent_hire:
  flow:
    step_1_agent_hire:
      description: "Agent Fabric hires agent"
      data: "agent_id, role, trust_level"

    step_2_lookup_role_template:
      description: "CapabilityManager.lookup_template(role)"
      result: "List of capability specs for this role"

    step_3_apply_trust_defaults:
      description: "Merge role defaults with trust level"
      logic: |
        template = get_role_template(role)
        trust = get_trust_level_constraints(trust_level)
        constraints = merge_constraints(template, trust)
        # Apply most restrictive (min)

    step_4_issue_capabilities:
      description: "Issue all auto capabilities for role"
      action: |
        for cap_spec in template.auto_capabilities:
            cap = await capability_manager.issue_capability(
                agent_id=agent_id,
                resource_type=cap_spec['resource_type'],
                permissions=cap_spec['permissions'],
                constraints=constraints
            )

    step_5_log_issuance:
      description: "Audit trail"
      log: "AGENT_HIRED_CAPABILITIES_ISSUED event"

  performance:
    latency_for_role: "<10ms per role (4-5 capabilities)"
    scaling: "Linear with number of auto capabilities"

template_customization:
  per_session_overrides:
    use_case: "Tool agent assigned specific tool instead of default"
    mechanism: |
      tool_agent_template = get_role_template("tool_agent")
      tool_agent_template['auto_capabilities'][0]['resource_id'] = "book_hotel"

    persistence: "Override only for this session (not global)"

  user_custom_roles:
    use_case: "Application defines custom agent role"
    mechanism: |
      custom_template = {
          "my_custom_agent": {
              "default_trust_level": 2,
              "auto_capabilities": [...]
          }
      }
      register_role_template("my_custom_agent", custom_template)

role_separation_and_least_privilege:
  principle: "Each role has exactly the permissions it needs, no more"

  enforcement:
    planning_agent: "Cannot execute tools (must delegate to tool_agent)"
    tool_agent: "Cannot plan or reason (must follow orchestrator routing)"
    memory_agent: "Cannot execute tools or LLMs"
    supervisor_agent: "Can do everything (but logged)"

  benefits:
    blast_radius: "Compromise of tool_agent doesn't affect planner"
    auditability: "Can trace which role performed each operation"
    testing: "Easy to test each role independently"

default_capability_comparison:
  planning_vs_tool_agent:
    planning:
      - "LLM:gemma-2b (reasoning)"
      - "TOOL:* (read-only, no execute)"
      - "MEMORY:beliefs (read)"
    tool:
      - "TOOL:{specific} (execute)"
      - "MEMORY:scoreboard (write)"
      - "K0_WAL:* (write)"

template_versioning:
  current_version: "1.0"
  breaking_changes:
    "1.0 → 2.0": "Adding 'delegate' permission to planning_agent"
  migration: "Old agents keep 1.0 templates; new agents use 2.0"

testing_scenarios:
  test_planning_agent_issuance:
    setup: "Agent hired as planning_agent with trust_level=1"
    expected: "4 capabilities issued (LLM, TOOL*, MEMORY:beliefs, MEMORY:scoreboard)"

  test_trust_escalation:
    setup: "tool_agent completes 50 tasks with 98% success"
    expected: "Automatic escalation to trust_level=2, higher limits"

  test_role_separation:
    setup: "tool_agent attempts to call LLM"
    expected: "DENIED (PERMISSION_DENIED, no LLM capability)"

  test_custom_tool_assignment:
    setup: "tool_agent assigned specific tool_id=book_hotel"
    expected: "Capability has resource_id=book_hotel (not default)"

references:
  adr_0010b: "Agent Capability Assignment Policy"
  adr_0010: "Capability-Based Security"
