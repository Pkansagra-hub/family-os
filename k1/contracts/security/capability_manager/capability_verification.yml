#
# Capability Verification Contract
# EPIC 2.5.2: Capability Manager Implementation
# ADR-0010c: Capability Enforcement at Runtime
#
# Purpose: Define API for verifying (validating) capability tokens
# Foundation: 10-step reference monitor validation
# Integration: CapabilityManager.verify_capability()
#

metadata:
  title: "Capability Verification Contract"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-15"
  adr_references:
    - "ADR-0010c: Capability Enforcement at Runtime"
    - "ADR-0010a: Capability Token Design & Lifecycle"

capability_verification_api:
  description: "CapabilityManager.verify_capability() interface"

  method_signature: |
    async def verify_capability(
        self,
        capability_token: str,              # JWT token
        agent_id: str,                      # Requesting agent
        resource_type: str,                 # TOOL | MEMORY | LLM | K0_WAL | MCP
        resource_id: str,                   # Specific resource
        operation: str,                     # execute | read | write | delete | delegate | attenuate
        context: VerificationContext = None,
        trace_id: str = None
    ) -> VerificationResult

  input_parameters:
    capability_token:
      type: "string"
      description: "JWT token to verify (header.payload.signature)"
      format: "RFC 7519 compact serialization"
      validation: "Must be valid JWT format"
      example: "eyJ..."

    agent_id:
      type: "string"
      description: "Agent making the request"
      validation: "Must match token's agent_id (non-transferable)"

    resource_type:
      type: "enum"
      values: ["TOOL", "MEMORY", "LLM", "K0_WAL", "MCP"]
      description: "Resource being accessed"

    resource_id:
      type: "string"
      description: "Specific resource or '*' if unrestricted"

    operation:
      type: "enum"
      values: ["execute", "read", "write", "delete", "delegate", "attenuate"]
      description: "Operation being attempted"

    context:
      type: "VerificationContext"
      description: "Additional context for verification"
      fields:
        current_time: "datetime (default: now_utc())"
        ip_address: "string (optional, for audit)"
        session_id: "string (optional)"
        cost_estimate: "float (for budget pre-check)"
        estimated_invocations: "int (for rate limit pre-check)"

    trace_id:
      type: "string"
      description: "Distributed trace ID"
      optional: true

  output_return:
    type: "VerificationResult"
    fields:
      result: "ALLOWED | DENIED"
      cap_id: "Capability ID (for logging)"
      reason: "Detailed reason if denied"
      latency_ms: "Verification latency"
      cache_hit: "Boolean (was this a cache hit?)"
      remaining_invocations: "int (if constraint exists)"
      remaining_budget: "float (if budget constraint exists)"

  result_allowed:
    meaning: "Operation is permitted to proceed"
    includes:
      cap_id: "Verified capability ID"
      latency_ms: "Verification latency"
      cache_hit: "true if from L1 cache"
      timestamp: "Verification time"

  result_denied:
    meaning: "Operation is blocked"
    possible_reasons:
      - "SIGNATURE_INVALID: HMAC signature does not match"
      - "REVOKED: Capability is in revocation list"
      - "EXPIRED: expires_at has passed"
      - "OWNERSHIP_MISMATCH: agent_id does not match token"
      - "RESOURCE_TYPE_MISMATCH: resource_type not in capability"
      - "RESOURCE_ID_NOT_ALLOWED: resource_id not in capability"
      - "PERMISSION_DENIED: operation not in permissions"
      - "CONSTRAINT_VIOLATED: invocation limit / budget / rate limit exceeded"
      - "APPROVAL_PENDING: Requires user/supervisor approval (async)"
      - "PRIVACY_BAND_MISMATCH: Resource band more restrictive than capability"

verification_flow_10_steps:
  description: "Reference Monitor pattern (Anderson 1972) - 10-step validation"
  total_target_latency_ms: 0.3
  cache_hit_rate_target: 0.8

  step_1_l1_cache_check:
    description: "Check local in-memory L1 cache"
    implementation: |
      cache_key = f"cap_verify:{cap_id}:{agent_id}:{operation}"
      cached = L1_CACHE.get(cache_key)
      if cached and not_expired(cached):
          metrics.cache_hits += 1
          return cached.result
    latency_ms: 0.05
    hit_rate: "80% (target)"
    ttl_seconds: 10
    cache_hit_cost: "Early return (0.05ms total)"

  step_2_signature_verification:
    description: "Verify HMAC-SHA256 signature"
    implementation: |
      parts = token.split('.')
      header, payload, signature = parts[0], parts[1], parts[2]
      expected_sig = base64_url_encode(
          HMAC_SHA256(self.secret_key, f"{header}.{payload}")
      )
      if not constant_time_compare(signature, expected_sig):
          raise SignatureError()
    latency_ms: 0.3
    failure_reason: "SIGNATURE_INVALID"
    security: "Constant-time comparison prevents timing attacks"

  step_3_revocation_check:
    description: "Check Redis revocation list"
    implementation: |
      is_revoked = REDIS.exists(f"capability:revoked:{cap_id}")
      if is_revoked:
          raise RevocationError()
    latency_ms: 0.1
    failure_reason: "REVOKED"
    storage: "Redis key exists = revoked"

  step_4_expiration_check:
    description: "Check if token has expired"
    implementation: |
      payload = jwt_decode(payload_b64)
      if context.current_time > payload['expires_at']:
          raise ExpirationError()
    latency_ms: 0.05
    failure_reason: "EXPIRED"
    uses_claims: ["expires_at"]

  step_5_agent_ownership_check:
    description: "Verify agent_id matches (non-transferable)"
    implementation: |
      if agent_id != payload['agent_id']:
          raise OwnershipError()
    latency_ms: 0.05
    failure_reason: "OWNERSHIP_MISMATCH"
    security: "Prevents capability theft/delegation"

  step_6_resource_type_match:
    description: "Check resource_type matches"
    implementation: |
      cap_resource_type = payload['resource_type']
      if cap_resource_type != resource_type and cap_resource_type != '*':
          raise ResourceTypeError()
    latency_ms: 0.05
    failure_reason: "RESOURCE_TYPE_MISMATCH"

  step_7_resource_id_match:
    description: "Check resource_id is in capability"
    implementation: |
      cap_resource_id = payload['resource_id']
      if cap_resource_id != resource_id and cap_resource_id != '*':
          raise ResourceIdError()
    latency_ms: 0.05
    failure_reason: "RESOURCE_ID_NOT_ALLOWED"

  step_8_permission_check:
    description: "Check if operation is in permissions list"
    implementation: |
      if operation not in payload['permissions']:
          raise PermissionError()
    latency_ms: 0.05
    failure_reason: "PERMISSION_DENIED"

  step_9_constraints_validation:
    description: "Validate all constraints"
    implementation: |
      # Pre-check constraints before operation
      max_inv = payload['constraints']['max_invocations']
      spent = REDIS.get(f"cap:{cap_id}:invocations") or 0
      if spent >= max_inv:
          raise ConstraintError("invocations exhausted")

      budget = payload['constraints']['budget_usd']
      cost = context.cost_estimate or 0
      spent_budget = float(REDIS.get(f"cap:{cap_id}:budget") or 0)
      if spent_budget + cost >= budget:
          raise ConstraintError("budget exhausted")
    latency_ms: 0.15
    checks:
      - "max_invocations counter"
      - "budget_usd spending"
      - "max_invocations_per_minute rate"
      - "privacy_band requirement"
      - "time_window (if set)"
      - "requires_approval (if set)"
    failure_reason: "CONSTRAINT_VIOLATED"

  step_10_cache_result:
    description: "Cache verification result for 10 seconds"
    implementation: |
      cache_key = f"cap_verify:{cap_id}:{agent_id}:{operation}"
      L1_CACHE.set(cache_key, result=ALLOWED, ttl=10)
    latency_ms: 0.05
    side_effect: "All prior steps skipped on next call (if cache hit)"

verification_latency_analysis:
  cached_path_80_percent:
    steps: "Step 1 only"
    total_ms: 0.05
    frequency: "80%"

  uncached_path_20_percent:
    steps: "Steps 2-10"
    latency_breakdown:
      step_2_signature: 0.30
      step_3_revocation: 0.10
      step_4_expiration: 0.05
      step_5_ownership: 0.05
      step_6_resource_type: 0.05
      step_7_resource_id: 0.05
      step_8_permission: 0.05
      step_9_constraints: 0.15
      step_10_cache: 0.05
    total_ms: 0.50
    frequency: "20%"

  p95_calculation:
    formula: "(0.8 × 0.05) + (0.2 × 0.5) = 0.04 + 0.1 = 0.14ms"
    target_ms: 0.30
    budget_utilization: "47%"
    safety_margin: "2.1x"

error_cases:
  signature_invalid:
    trigger: "HMAC signature does not match"
    failure_step: 2
    result: "DENIED"
    reason: "SIGNATURE_INVALID"
    audit_level: "ALERT (possible tampering)"

  revoked:
    trigger: "Capability in revocation list"
    failure_step: 3
    result: "DENIED"
    reason: "REVOKED"
    audit_level: "INFO"

  expired:
    trigger: "Current time > expires_at"
    failure_step: 4
    result: "DENIED"
    reason: "EXPIRED"
    audit_level: "INFO"

  ownership_mismatch:
    trigger: "agent_id does not match token"
    failure_step: 5
    result: "DENIED"
    reason: "OWNERSHIP_MISMATCH"
    audit_level: "WARNING (potential theft)"

  resource_type_mismatch:
    trigger: "resource_type not in capability"
    failure_step: 6
    result: "DENIED"
    reason: "RESOURCE_TYPE_MISMATCH"
    audit_level: "DEBUG"

  resource_id_not_allowed:
    trigger: "resource_id not in capability (and not '*')"
    failure_step: 7
    result: "DENIED"
    reason: "RESOURCE_ID_NOT_ALLOWED"
    audit_level: "DEBUG"

  permission_denied:
    trigger: "operation not in permissions list"
    failure_step: 8
    result: "DENIED"
    reason: "PERMISSION_DENIED"
    audit_level: "DEBUG"

  constraint_violated:
    trigger: "Invocations or budget limit exceeded"
    failure_step: 9
    result: "DENIED"
    reason: "CONSTRAINT_VIOLATED"
    audit_level: "INFO"

enforcement_point_integration:
  tool_runner:
    validates_before: "execute_tool()"
    operation: "execute"
    calls: "verify_capability(cap_token, agent_id, TOOL, tool_id, execute)"

  memory_manager:
    validates_before: "read_section() or write_section()"
    operation: "read | write"
    calls: "verify_capability(cap_token, agent_id, MEMORY, section_id, read|write)"

  model_hub:
    validates_before: "generate()"
    operation: "execute"
    calls: "verify_capability(cap_token, agent_id, LLM, model_id, execute)"

  k0_bridge:
    validates_before: "write_event()"
    operation: "write"
    calls: "verify_capability(cap_token, agent_id, K0_WAL, '*', write)"

audit_logging:
  on_allowed:
    log_level: "DEBUG"
    fields: ["timestamp", "cap_id", "agent_id", "resource_type", "operation", "latency_ms", "cache_hit"]
    storage: "K0 WAL (sampled 10%)"

  on_denied:
    log_level: "WARNING"
    fields: ["timestamp", "cap_id", "agent_id", "operation", "denial_reason", "failed_step", "latency_ms"]
    storage: "K0 WAL (100%), Elasticsearch"

  on_tampered_signature:
    log_level: "ALERT"
    fields: ["timestamp", "signature", "agent_id", "operation"]
    storage: "K0 WAL, Elasticsearch, security_alerts"

performance_budgets:
  verification_latency_p95: 0.3
  cache_hit_rate: 0.75
  signature_verification: 0.3
  constraint_check: 0.15

testing_scenarios:
  test_valid_verification:
    input: "Valid token, matching agent_id, valid operation"
    expected: "ALLOWED in <0.05ms (cache hit)"

  test_invalid_signature:
    input: "Token with tampered signature"
    expected: "DENIED (SIGNATURE_INVALID) at step 2"

  test_expired_token:
    input: "Token past expires_at"
    expected: "DENIED (EXPIRED) at step 4"

  test_budget_exceeded:
    input: "Token with budget_usd=1.0, already spent 1.0"
    expected: "DENIED (CONSTRAINT_VIOLATED) at step 9"

  test_rate_limit:
    input: "Token with max_invocations_per_minute=5, 5 calls already in window"
    expected: "DENIED (CONSTRAINT_VIOLATED) at step 9"

references:
  adr_0010c: "Capability Enforcement at Runtime"
  anderson_1972: "Reference Monitor Pattern"
  rfc_7519: "JWT specification"
