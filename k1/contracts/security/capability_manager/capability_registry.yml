#
# Capability Registry Contract
# EPIC 2.5.2: Capability Manager Implementation
# ADR-0010a: Capability Token Design & Lifecycle
#
# Purpose: Define in-memory storage and retrieval of capabilities
# Foundation: Redis-based registry with K0 WAL backup
# Integration: CapabilityRegistry (in-memory cache + Redis persistence)
#

metadata:
  title: "Capability Registry Contract"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-15"
  adr_references:
    - "ADR-0010a: Capability Token Design & Lifecycle"
    - "ADR-0010: Capability-Based Security"

capability_registry_overview:
  description: "Multi-tier storage for capability tokens and metadata"
  tiers:
    l0_local_cache:
      storage: "Process-local in-memory cache"
      backend: "Python dict + LRU"
      ttl: "10 seconds"
      size_limit: "10,000 entries"
      use_case: "Sub-millisecond lookups during verification"

    l1_redis_cache:
      storage: "Redis cluster (K8s redis-service)"
      ttl: "24 hours"
      size_estimate: "1MB per 1000 capabilities"
      use_case: "Distributed cache, recovery, session persistence"
      backup: "AOF (append-only file) persistence"

    l2_k0_wal:
      storage: "K0 Write-Ahead Log (binary FlatBuffers)"
      retention: "30 days (sliding window)"
      format: "Binary events: CAPABILITY_ISSUED, CAPABILITY_REVOKED, etc."
      use_case: "Crash recovery, replay, audit trail"

    l3_elasticsearch:
      storage: "Elasticsearch cluster (searchable)"
      retention: "90 days"
      format: "JSON documents, indexed by cap_id, agent_id, event_type"
      use_case: "Long-term audit search, compliance queries"

    l4_s3_glacier:
      storage: "S3 GLACIER (compliance archive)"
      retention: "7 years"
      format: "Gzip + AES-256 encrypted"
      use_case: "Long-term compliance, legal holds"

registry_data_structures:
  capability_token_entry:
    structure: |
      {
        cap_id: str (ULID),
        agent_id: str,
        resource_type: str,
        resource_id: str,
        permissions: List[str],
        constraints: {
          max_invocations: int,
          budget_usd: float,
          privacy_band: str
        },
        issued_at: datetime,
        expires_at: datetime,
        status: str (ISSUED|ACTIVE|EXHAUSTED|EXPIRED|REVOKED),
        token: str (JWT),
        signature: str
      }

  capability_index_entries:
    by_cap_id:
      redis_key: "capability:{cap_id}"
      value_type: "JSON (full token)"
      ttl: "24 hours"
      use_case: "Direct lookup by cap_id"

    by_agent_id:
      redis_key: "agent:{agent_id}:caps"
      value_type: "List of cap_ids (ULID)"
      ttl: "24 hours"
      use_case: "Find all caps for agent (revocation, cleanup)"

    revocation_list:
      redis_key: "capability:revoked:{cap_id}"
      value_type: "Boolean (exists=revoked)"
      ttl: "24 hours"
      use_case: "Fast revocation check (step 3 of verification)"

    counter_entries:
      redis_key: "cap:{cap_id}:invocations"
      value_type: "Integer counter"
      ttl: "24 hours (with INCR)"
      use_case: "Track invocation usage"

    budget_entries:
      redis_key: "cap:{cap_id}:budget"
      value_type: "Float (INCRBYFLOAT)"
      ttl: "24 hours"
      use_case: "Track USD cost spending"

    rate_limit_entries:
      redis_key: "cap:{cap_id}:rate_window"
      value_type: "Timestamp + count (sliding window)"
      ttl: "60 seconds"
      use_case: "Rate limiting per minute"

registry_operations:
  store_capability:
    description: "Store newly issued capability"
    implementation: |
      async def store_capability(self, cap: CapabilityToken):
          # L0: Local cache
          self.l0_cache.set(cap.cap_id, cap, ttl=10)

          # L1: Redis
          REDIS.set(
              f"capability:{cap.cap_id}",
              json.dumps(cap.to_dict()),
              ex=86400  # 24h TTL
          )

          # L1: Agent index
          REDIS.lpush(f"agent:{cap.agent_id}:caps", cap.cap_id)
          REDIS.expire(f"agent:{cap.agent_id}:caps", 86400)

          # L2: K0 WAL
          WAL.write_event({
              type: "CAPABILITY_ISSUED",
              cap_id: cap.cap_id,
              agent_id: cap.agent_id,
              resource_type: cap.resource_type,
              permissions: cap.permissions,
              timestamp: now_utc()
          })

    latency_ms: 0.3
    breakdown:
      l0_cache: 0.05
      l1_redis: 0.2
      l2_wal: 0.05

  retrieve_capability:
    description: "Retrieve capability for verification"
    implementation: |
      async def retrieve_capability(self, cap_id: str):
          # L0: Local cache (fastest)
          cap = self.l0_cache.get(cap_id)
          if cap:
              metrics.cache_hits_l0 += 1
              return cap

          # L1: Redis (fast)
          cap_json = REDIS.get(f"capability:{cap_id}")
          if cap_json:
              cap = CapabilityToken.from_json(cap_json)
              self.l0_cache.set(cap_id, cap, ttl=10)
              metrics.cache_hits_l1 += 1
              return cap

          # L2: K0 WAL (slower, for recovery)
          cap = await WAL.read_capability_by_id(cap_id)
          if cap:
              metrics.cache_hits_l2 += 1
              return cap

          # Not found
          raise CapabilityNotFoundError()

    latency_ms:
      l0_hit: 0.05
      l1_hit: 0.15
      l2_hit: 0.5
      not_found: 0.2

  update_counter:
    description: "Increment invocation or budget counter"
    implementation: |
      async def update_counter(self, cap_id: str, counter_type: str, amount: int|float):
          if counter_type == "invocations":
              REDIS.incr(f"cap:{cap_id}:invocations", amount)
          elif counter_type == "budget":
              REDIS.incrbyfloat(f"cap:{cap_id}:budget", amount)

          # Atomic operation, no race conditions

    latency_ms: 0.1
    atomicity: "Redis INCR/INCRBYFLOAT is atomic"

  mark_revoked:
    description: "Add capability to revocation list"
    implementation: |
      async def mark_revoked(self, cap_id: str):
          REDIS.set(f"capability:revoked:{cap_id}", True, ex=86400)
          REDIS.delete(f"capability:{cap_id}")  # Remove from active store

    latency_ms: 0.1
    effect: "Verified at step 3 (revocation check) on next operation"

  list_agent_capabilities:
    description: "Get all capabilities for an agent"
    implementation: |
      async def list_agent_capabilities(self, agent_id: str):
          cap_ids = REDIS.lrange(f"agent:{agent_id}:caps", 0, -1)
          caps = []
          for cap_id in cap_ids:
              cap_json = REDIS.get(f"capability:{cap_id}")
              if cap_json:
                  caps.append(CapabilityToken.from_json(cap_json))
          return caps

    latency_ms: "0.5 + (0.05 per capability)"
    use_case: "Agent termination revocation, listing, debugging"

  cleanup_expired:
    description: "Remove expired capabilities"
    implementation: |
      async def cleanup_expired(self):
          # Run hourly cron job
          current_time = now_utc()
          all_cap_ids = REDIS.scan("capability:*")  # O(N) scan

          expired_count = 0
          for cap_id in all_cap_ids:
              cap = retrieve_capability(cap_id)
              if current_time > cap.expires_at:
                  REDIS.delete(f"capability:{cap_id}")
                  expired_count += 1

          metrics.capabilities_cleaned_up = expired_count

    frequency: "Hourly cron job"
    performance: "<1 second for 10,000 capabilities"

registry_consistency:
  transactional_updates:
    description: "Multi-key consistency for store_capability"
    implementation: |
      # Redis MULTI/EXEC for atomic multi-key updates
      with REDIS.pipeline() as pipe:
          pipe.set(f"capability:{cap_id}", cap_json, ex=86400)
          pipe.lpush(f"agent:{agent_id}:caps", cap_id)
          pipe.execute()
    guarantee: "All-or-nothing atomicity"

  conflict_resolution:
    description: "Handling concurrent updates"
    scenario: "Two processes try to revoke same capability"
    resolution: |
      # Idempotent revocation
      if REDIS.exists(f"capability:revoked:{cap_id}"):
          # Already revoked, no-op
          return OK
      else:
          # First time, revoke
          REDIS.set(f"capability:revoked:{cap_id}", True)

  replication:
    description: "Redis replication for HA"
    model: "Redis cluster with master-replica"
    consistency: "Eventual consistency (max 100ms lag)"
    tolerance: "Replica promotion on master failure"

performance_optimization:
  l0_cache_sizing:
    typical_hit_rate: "80% (first request cached for 10s)"
    max_entries: "10,000 (per process)"
    eviction: "LRU when full"
    memory_per_entry: "~1KB"
    total_memory: "~10MB per process"

  l1_redis_sizing:
    typical_entries: "1,000 per session"
    memory_per_entry: "~1KB"
    sessions_per_deployment: "1,000 (simultaneous)"
    total_memory: "~1GB"
    scaling: "Redis cluster (3-node minimum for HA)"

  batch_operations:
    store_batch_capabilities:
      operation: "Store 100 capabilities at once"
      latency: "<10ms (pipelined Redis commands)"
      use_case: "Session initialization with multiple agents"

    revoke_batch_capabilities:
      operation: "Revoke all caps for terminated agent"
      latency: "<100ms for 50 capabilities"
      use_case: "Emergency revocation"

query_patterns:
  find_all_caps_for_agent:
    query: "LRANGE agent:{agent_id}:caps 0 -1"
    latency_ms: 0.2
    use_case: "List, revoke, cleanup"

  find_by_cap_id:
    query: "GET capability:{cap_id}"
    latency_ms: 0.1
    use_case: "Direct lookup (fastest)"

  find_all_revoked:
    query: "SCAN capability:revoked:*"
    latency_ms: "Variable (O(N) scan)"
    use_case: "Debugging, auditing"

  count_capabilities:
    query: "DBSIZE (all keys) or custom counter"
    latency_ms: 0.5
    use_case: "Monitoring, capacity planning"

monitoring_and_observability:
  metrics:
    capability_store_latency:
      unit: "milliseconds"
      p95_target: 0.5

    capability_retrieve_latency:
      unit: "milliseconds"
      p95_target: 0.2

    cache_hit_rate_l0:
      unit: "percentage"
      target: ">80%"

    cache_hit_rate_l1:
      unit: "percentage"
      target: ">95% (for misses from L0)"

    redis_connection_pool:
      metric: "Active connections, queued commands"
      alert_threshold: ">100 connections"

  dashboards:
    capability_registry:
      panels:
        - "Cache hit rates (L0, L1, L2)"
        - "Storage latency (p50, p95, p99)"
        - "Redis memory usage"
        - "Capability count trend"

    performance:
      panels:
        - "Store latency over time"
        - "Retrieve latency by tier"
        - "Batch operation performance"

cleanup_and_retention:
  automatic_cleanup:
    frequency: "Hourly cron job"
    action: "Remove expired capabilities from Redis"
    performance: "<1 second per 10,000 capabilities"

  manual_cleanup:
    trigger: "On session end or agent termination"
    action: "Delete all agent capabilities"
    performance: "0.1ms per capability"

  retention_tiers:
    redis: "24 hours (active)"
    k0_wal: "30 days (recovery)"
    elasticsearch: "90 days (search)"
    s3: "7 years (compliance)"

testing_scenarios:
  test_store_and_retrieve:
    action: "Store capability, retrieve it"
    expected: "Retrieved capability matches stored"

  test_counter_increment:
    action: "Increment invocation counter 100 times"
    expected: "Final value = 100, atomicity guaranteed"

  test_l0_cache_hit:
    action: "Retrieve capability within 10s window"
    expected: "Hit L0 cache, latency <0.05ms"

  test_l1_redis_hit:
    action: "Retrieve after L0 TTL expired"
    expected: "Hit L1 Redis, latency ~0.15ms"

  test_concurrent_revocation:
    action: "Revoke same capability twice concurrently"
    expected: "Both succeed (idempotent), no errors"

  test_batch_operations:
    action: "Store 100 capabilities in batch"
    expected: "All stored within 10ms"

references:
  adr_0010a: "Capability Token Design & Lifecycle"
  adr_0010: "Capability-Based Security"
  redis_docs: "Redis INCR, LPUSH, pipeline atomicity"
