#
# Capability Revocation Contract
# EPIC 2.5.2: Capability Manager Implementation
# ADR-0010d: Capability Revocation & Audit Trail
#
# Purpose: Define API for revoking (terminating) capabilities
# Foundation: 3-tier revocation (immediate, automatic, emergency)
# Integration: CapabilityManager.revoke_capability()
#

metadata:
  title: "Capability Revocation Contract"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-15"
  adr_references:
    - "ADR-0010d: Capability Revocation & Audit Trail"
    - "ADR-0010a: Capability Token Design & Lifecycle"

capability_revocation_api:
  description: "CapabilityManager.revoke_capability() interface"

  method_signature: |
    async def revoke_capability(
        self,
        cap_id: str,
        revocation_reason: str,
        revocation_type: str = "IMMEDIATE",  # IMMEDIATE | AUTOMATIC | EMERGENCY
        revoked_by: str = "SYSTEM",
        usage_stats: RevocationStats = None,
        trace_id: str = None
    ) -> RevocationResult

  input_parameters:
    cap_id:
      type: "string"
      description: "ULID of capability to revoke"
      validation: "Must exist in Redis or K0 WAL"

    revocation_reason:
      type: "string"
      description: "Human-readable reason for revocation"
      required: true
      examples:
        - "Agent crash detected (state=TERMINATED)"
        - "Budget constraint exhausted (spent=$100.0)"
        - "User requested via API"
        - "Policy violation: unauthorized access attempt"
        - "Session ended"
        - "Timeout: unused for 30 days"

    revocation_type:
      type: "enum"
      values: ["IMMEDIATE", "AUTOMATIC", "EMERGENCY"]
      description: "Type of revocation"
      default: "IMMEDIATE"
      behavior:
        IMMEDIATE: "Synchronous revocation (add to blacklist, delete from Redis)"
        AUTOMATIC: "Lazy revocation (mark as exhausted, validate on next use)"
        EMERGENCY: "Batch agent-wide revocation (all caps for agent or session)"

    revoked_by:
      type: "string"
      description: "Authority revoking the capability"
      values: ["SYSTEM", "supervisor_agent_id", "user"]
      default: "SYSTEM"

    usage_stats:
      type: "RevocationStats"
      description: "Optional stats at time of revocation"
      fields:
        invocations_used: "int"
        cost_spent_usd: "float"
        session_id: "string"
        final_status: "EXHAUSTED | EXPIRED | REVOKED | DELEGATED"

    trace_id:
      type: "string"
      description: "Distributed trace ID"
      optional: true

  output_return:
    type: "RevocationResult"
    fields:
      cap_id: "Revoked capability ID"
      status: "REVOKED"
      revocation_timestamp: "ISO 8601"
      latency_ms: "Revocation operation latency"
      affected_count: "Number of capabilities revoked (>1 for EMERGENCY)"

revocation_types_and_mechanisms:
  immediate_revocation:
    description: "Synchronous revocation - immediate effect"
    mechanism: |
      # Add to Redis blacklist
      REDIS.set(f"capability:revoked:{cap_id}", True, ex=86400)

      # Delete from active storage
      REDIS.delete(f"capability:{cap_id}")
      REDIS.delete(f"capability:{cap_id}:invocations")
      REDIS.delete(f"capability:{cap_id}:budget")

      # Write to K0 WAL
      WAL.write_event({
          type: "CAPABILITY_REVOKED",
          cap_id: cap_id,
          revocation_reason: reason,
          timestamp: now_utc()
      })
    latency_ms: 0.15
    effect: "Immediate - next verification fails at step 3 (revocation check)"
    use_cases:
      - "Supervisor manual revocation"
      - "Policy violation detected"
      - "User request via API"

  automatic_revocation:
    description: "Lazy revocation - happens on next use"
    mechanism: |
      # Mark capability as exhausted (no Redis operations)
      # Status update happens in K0 WAL
      WAL.write_event({
          type: "CAPABILITY_EXHAUSTED",
          cap_id: cap_id,
          reason: reason,  # budget_exhausted | invocations_exhausted
          timestamp: now_utc()
      })

      # Next verification at step 9 (constraints check) will fail
      # because counter >= max_invocations or spent_budget >= budget
    latency_ms: 0.05
    effect: "Lazy - verified on next operation attempt"
    use_cases:
      - "Budget constraint exhausted"
      - "Invocation limit reached"
      - "Rate limit exceeded"

  emergency_revocation:
    description: "Batch revocation for agent or session"
    mechanism: |
      # Get all capabilities for agent/session
      if revocation_scope == "AGENT":
          cap_ids = REDIS.lrange(f"agent:{agent_id}:caps", 0, -1)
      elif revocation_scope == "SESSION":
          cap_ids = REDIS.lrange(f"session:{session_id}:caps", 0, -1)

      # Revoke each capability (in parallel if large batch)
      for cap_id in cap_ids:
          await self.revoke_capability(cap_id, reason, type=IMMEDIATE)

      # Write batch event to K0 WAL
      WAL.write_event({
          type: "EMERGENCY_REVOCATION",
          scope: "AGENT | SESSION",
          scope_id: agent_id | session_id,
          cap_count: len(cap_ids),
          timestamp: now_utc()
      })
    latency_ms: "0.5 + (0.1 per capability)"
    effect: "Immediate for all capabilities"
    use_cases:
      - "Agent termination (TERMINATED state)"
      - "Session end"
      - "Security incident (mass compromise)"

revocation_flow:
  step_1_validate_cap_exists:
    action: "Check if capability exists"
    latency_ms: 0.05
    checks:
      - "REDIS.exists(f'capability:{cap_id}')"
      - "Or check K0 WAL for historical record"
    error_if_not_found: "CapabilityNotFoundError (but proceed anyway)"

  step_2_retrieve_current_stats:
    action: "Get usage statistics before revocation"
    latency_ms: 0.05
    retrieval:
      invocations_used: "REDIS.get(f'cap:{cap_id}:invocations')"
      budget_spent: "REDIS.get(f'cap:{cap_id}:budget')"
      session_id: "From K0 WAL lookup"

  step_3_determine_revocation_type:
    action: "Choose IMMEDIATE vs AUTOMATIC vs EMERGENCY"
    latency_ms: 0.02
    logic: |
      if revocation_type == EMERGENCY:
          # Get all related capabilities
          batch_size = get_related_cap_count()
          if batch_size > 100:
              # Async revocation for large batches
              queue_async_revocation_job()
          else:
              # Synchronous for small batches
              perform_revocation_immediately()
      else:
          # IMMEDIATE or AUTOMATIC
          perform_type_specific_revocation()

  step_4_update_storage:
    action: "Update Redis + K0 WAL"
    latency_ms: "0.05 (IMMEDIATE) or 0.02 (AUTOMATIC)"
    redis_updates:
      immediate:
        - "SET revoked:{cap_id} = True (24h TTL)"
        - "DEL capability:{cap_id}"
        - "DEL cap:{cap_id}:* (counters)"
      automatic:
        - "No Redis changes (lazy)"

    k0_wal_writes:
      - "CAPABILITY_REVOKED event"
      - "Includes: cap_id, agent_id, reason, revoked_by, usage_stats"

  step_5_emit_metrics:
    action: "Record revocation metrics"
    latency_ms: 0.02
    metrics:
      - "capability_revoked_total{reason} += 1"
      - "capability_revocation_latency_ms histogram"

  step_6_audit_log:
    action: "Log revocation in audit trail"
    latency_ms: 0.05
    log_level: "INFO (IMMEDIATE) or DEBUG (AUTOMATIC)"
    fields:
      - "timestamp"
      - "cap_id"
      - "agent_id"
      - "revocation_reason"
      - "revocation_type"
      - "revoked_by"
      - "usage_stats (invocations, cost)"

total_revocation_latency:
  immediate_type:
    target_ms: 0.2
    breakdown:
      validate: 0.05
      retrieve_stats: 0.05
      determine_type: 0.02
      redis_update: 0.05
      metrics: 0.02
      audit: 0.05
    p95_ms: 0.25

  automatic_type:
    target_ms: 0.1
    breakdown:
      validate: 0.05
      determine_type: 0.02
      metrics: 0.02
      audit: 0.01
    p95_ms: 0.12

  emergency_type:
    target_ms: "0.5 for batch of 10 caps"
    formula: "0.2 (first cap) + (0.1 × remaining caps)"
    per_capability: 0.1

revocation_triggers:
  agent_crash:
    trigger_condition: "Agent enters TERMINATED state"
    detection: "SupervisorAgent.on_state_change(agent_id, TERMINATED)"
    revocation_type: "EMERGENCY (all agent capabilities)"
    reason: "Agent crash detected (state=TERMINATED)"
    latency_budget: "10ms"

  policy_violation:
    trigger_condition: "Unauthorized access attempt or tampering"
    detection: "Verification flow detects signature forgery or unauthorized operation"
    revocation_type: "IMMEDIATE + ALERT"
    reason: "Policy violation: {violation_type}"
    latency_budget: "<100ms"

  constraint_exhaustion:
    trigger_condition: "Invocation limit or budget limit reached"
    detection: "Constraint check (step 9) returns CONSTRAINT_VIOLATED"
    revocation_type: "AUTOMATIC (lazy)"
    reason: "Constraint exhausted: {constraint_type}"
    latency_budget: "0ms (lazy)"

  user_request:
    trigger_condition: "User or supervisor calls revoke API"
    detection: "HTTP POST /capabilities/{cap_id}/revoke"
    revocation_type: "IMMEDIATE"
    reason: "User requested revocation"
    latency_budget: "<200ms"

  session_end:
    trigger_condition: "Session terminates"
    detection: "SessionManager.on_session_end(session_id)"
    revocation_type: "EMERGENCY (all session capabilities)"
    reason: "Session ended: {session_id}"
    latency_budget: "5ms per capability"

  timeout:
    trigger_condition: "Capability unused for 30 days"
    detection: "Cron job (hourly check of last_used timestamp)"
    revocation_type: "AUTOMATIC (marked as expired)"
    reason: "Timeout: unused for 30 days"
    latency_budget: "None (async cron)"

cascade_revocation_scenarios:
  agent_termination:
    scenario: "planning_agent enters TERMINATED"
    triggered_revocations:
      - "All capabilities for planning_agent (EMERGENCY)"
      - "All delegated capabilities from planning_agent (if any)"
    total_capabilities_affected: "1-50 (typically 5-10)"
    expected_latency: "50-500ms total"

  mass_compromise:
    scenario: "Multiple agents detected with forged signatures"
    triggered_revocations:
      - "All affected agents' capabilities (EMERGENCY)"
      - "Security alert + notify supervisor"
      - "Trigger capability reissuance for legitimate agents"
    protection: "Revocation list in Redis prevents reuse"

  budget_exhaustion:
    scenario: "LLM capability budget fully spent"
    triggered_revocations:
      - "Single capability marked as exhausted (AUTOMATIC)"
      - "Agent remains active but cannot use capability"
      - "Manual reissuance by supervisor if needed"

storage_cleanup_after_revocation:
  redis_keys_deleted:
    - "capability:{cap_id}"
    - "cap:{cap_id}:invocations"
    - "cap:{cap_id}:budget"
    - "cap:{cap_id}:rate_window"
    - "cap:{cap_id}:approval_status"

  redis_keys_set_for_revocation:
    - "capability:revoked:{cap_id} (24h TTL)"
    - "capability:revoked_at:{cap_id}"

  retention_policy:
    redis: "24 hours after revocation (blacklist TTL)"
    k0_wal: "30 days (full event history)"
    elasticsearch: "90 days (searchable)"
    s3_glacier: "7 years (compliance)"

testing_scenarios:
  test_immediate_revocation:
    setup: "Valid capability in Redis"
    action: "revoke_capability(cap_id, reason='test', type=IMMEDIATE)"
    expected:
      - "Redis blacklist set"
      - "Capability deleted from active store"
      - "Next verification fails at step 3"

  test_automatic_revocation:
    setup: "Valid capability"
    action: "revoke_capability(cap_id, reason='budget exhausted', type=AUTOMATIC)"
    expected:
      - "No immediate Redis changes"
      - "K0 WAL event recorded"
      - "Next verification at step 9 fails with constraint error"

  test_emergency_revocation:
    setup: "Agent with 10 active capabilities"
    action: "revoke_capability(agent_id=*, revocation_type=EMERGENCY)"
    expected:
      - "All 10 capabilities revoked synchronously"
      - "Latency: ~1.0ms total"
      - "K0 WAL batch event recorded"

  test_revocation_idempotence:
    setup: "Already revoked capability"
    action: "revoke_capability(cap_id) twice"
    expected:
      - "No error on second revocation"
      - "Idempotent operation"

references:
  adr_0010d: "Capability Revocation & Audit Trail"
  adr_0010a: "Capability Token Design & Lifecycle"
