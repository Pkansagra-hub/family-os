---
# ADR-0036a: AES-256-GCM Authentication Tag Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Authentication Tag Contract
# Defines 128-bit GMAC authentication tags for AES-256-GCM integrity

contract:
  name: authentication_tag
  version: "1.0.0"
  description: "128-bit GMAC authentication tag generation and validation"
  parent_adr: "ADR-0036a"
  priority: "CRITICAL"
  effort: "1 week"

# Tag Overview
tag_overview:
  algorithm: "GMAC (Galois Message Authentication Code)"
  size_bits: 128
  size_bytes: 16
  purpose: "Integrity and authenticity verification"
  generation: "During AES-256-GCM encryption"

# Tag Properties
tag_properties:
  length:
    bits: 128
    bytes: 16
    standard: "NIST SP 800-38D (GCM)"

  cryptographic_strength:
    description: "128-bit security level"
    collision_probability: "2^-128 (negligible)"
    forgery_probability: "2^-128 (negligible)"

  binding:
    plaintext: "Authenticates encrypted data"
    associated_data: "Authenticates section name"
    key: "Bound to encryption key"
    nonce: "Bound to nonce"

# Tag Generation
tag_generation:
  algorithm: "GMAC as part of AES-256-GCM"
  input: "Ciphertext + associated data + key + nonce"
  output: "128-bit authentication tag"
  performance: "<0.1ms additional to encryption"

# Tag Validation
tag_validation:
  algorithm: "GMAC verification during decryption"
  input: "Ciphertext + associated data + key + nonce + tag"
  output: "Valid/Invalid boolean"
  failure_action: "Abort decryption, return error"

# Security Properties
security_properties:
  integrity:
    description: "Detects any modification to ciphertext"
    detection: "Bit-for-bit accuracy required"
    probability: "2^-128 false negative rate"

  authenticity:
    description: "Proves data encrypted with correct key"
    binding: "Tag only valid for specific key + nonce + data"
    forgery: "Computationally infeasible to forge"

  non_repudiation:
    description: "Cryptographic proof of encryption"
    evidence: "Valid tag proves data integrity"
    timestamp: "Tag generation time can be verified"

# Tag Storage
tag_storage:
  format: "Binary blob (16 bytes)"
  location: "With ciphertext in encrypted SessionState"
  persistence: "Same as encrypted data"
  transmission: "Included in encrypted payload"

# Tag Lifecycle
tag_lifecycle:
  generation:
    trigger: "During encryption operation"
    storage: "Appended to ciphertext"
    validation: "Immediate (during generation)"

  validation:
    trigger: "During decryption operation"
    success: "Return decrypted plaintext"
    failure: "Abort, log security incident"

  error_handling:
    invalid_tag:
      cause: "Data tampered, wrong key, wrong nonce, wrong AAD"
      action: "Log security event, return error"
      recovery: "No automatic recovery (security violation)"

# Implementation Interface
implementation:
  rust:
    type: "AuthenticationTag = [u8; 16]"
    generation: "Generated by AES-256-GCM encrypt"
    validation: "Verified by AES-256-GCM decrypt"
    error: "DecryptionError::AuthenticationFailed"

  python:
    type: "bytes (16 bytes)"
    generation: "Returned by encrypt_section()"
    validation: "Verified by decrypt_section()"
    exception: "DecryptionError (authentication failed)"

# Performance Budget
performance_budget:
  generation_overhead_ms: 0.05  # Included in encryption time
  validation_overhead_ms: 0.05  # Included in decryption time
  memory_usage_bytes: 16
  cpu_usage_percent: 2

# Security Incident Response
security_incident_response:
  tag_validation_failure:
    severity: "HIGH"
    actions:
      - "Log detailed incident (trace_id, key_id, section)"
      - "Increment security violation counter"
      - "Alert security monitoring system"
      - "Do not return any decrypted data"
      - "Consider key revocation if pattern detected"

  tag_forgery_attempt:
    severity: "CRITICAL"
    actions:
      - "Immediate security alert"
      - "Block user session"
      - "Initiate incident response procedure"
      - "Preserve all evidence for forensic analysis"

# Testing Requirements
testing:
  unit_tests:
    - "Tag generation produces 128-bit values"
    - "Valid tag passes validation"
    - "Invalid tag fails validation"
    - "Tag bound to correct key"
    - "Tag bound to correct nonce"
    - "Tag bound to correct associated data"

  security_tests:
    - "Tamper detection (single bit flip)"
    - "Key mismatch detection"
    - "Nonce mismatch detection"
    - "Associated data mismatch detection"
    - "Forgery resistance testing"

  performance_tests:
    - "Tag operations within budget"
    - "No performance impact on encryption/decryption"

  fuzzing_tests:
    - "Random tag corruption"
    - "Malformed tag inputs"
    - "Edge case tag values"

# Error Scenarios
error_scenarios:
  tag_too_short:
    description: "Tag less than 16 bytes"
    handling: "Return validation error"
    logging: "Input validation error"

  tag_too_long:
    description: "Tag more than 16 bytes"
    handling: "Return validation error"
    logging: "Input validation error"

  tag_corrupted:
    description: "Tag modified by attacker"
    handling: "Validation fails, security incident"
    logging: "Authentication failure"

  tag_missing:
    description: "No tag provided for validation"
    handling: "Return error"
    logging: "Missing authentication tag"

# Dependencies
dependencies:
  upstream:
    - "encrypt_operation.yml: Generates authentication tag"
    - "decrypt_operation.yml: Validates authentication tag"
  downstream:
    - "ADR-0036c: Selective encryption uses tags"

# Success Criteria
success_criteria:
  functional:
    - "128-bit GMAC tags generated correctly"
    - "Tag validation works for valid data"
    - "Tag validation fails for tampered data"
    - "Associated data binding enforced"

  performance:
    - "Tag operations <0.1ms overhead"
    - "No impact on encryption/decryption performance"

  security:
    - "2^-128 forgery probability"
    - "Tamper detection guaranteed"
    - "Security incidents properly logged"
    - "No data leakage on validation failure"

  compliance:
    - "NIST SP 800-38D compliance"
    - "FIPS 140-2 validated algorithms"
    - "GDPR/HIPAA integrity requirements"
