---
# ADR-0036a: Hardware Acceleration Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Hardware Acceleration Contract
# Defines AES-NI and other hardware acceleration for AES-256-GCM

contract:
  name: hardware_acceleration
  version: "1.0.0"
  description: "Hardware-accelerated AES-256-GCM encryption/decryption"
  parent_adr: "ADR-0036a"
  priority: "HIGH"
  effort: "2 weeks"

# Hardware Acceleration Overview
hardware_acceleration_overview:
  primary: "AES-NI (Intel Advanced Encryption Standard New Instructions)"
  secondary: "ARM Cryptographic Extensions"
  tertiary: "Software fallback"
  availability: "95%+ modern CPUs support AES-NI"
  speedup: "5-10x faster than software-only AES"

# AES-NI Support
aes_ni:
  architecture: "x86/x86-64"
  instructions: ["AESENC", "AESENCLAST", "AESDEC", "AESDECLAST", "AESKEYGENASSIST", "AESIMC", "PCLMULQDQ"]
  availability: "Intel Westmere (2010+) and AMD equivalents"
  market_share: "95%+ of modern desktop/server CPUs"

  performance:
    encryption_speedup: "5-8x faster than software"
    decryption_speedup: "5-8x faster than software"
    gcm_speedup: "3-5x faster (PCLMULQDQ for GMAC)"

  detection:
    method: "CPUID instruction"
    flag: "ECX bit 25 (AESNI)"
    runtime_check: "Required before using AES-NI"

# ARM Cryptographic Extensions
arm_crypto:
  architecture: "ARM64"
  instructions: ["AESD", "AESE", "AESMC", "AESIMC", "PMULL", "PMULL2"]
  availability: "ARMv8-A with crypto extensions (Apple M1/M2, modern ARM servers)"
  market_share: "Growing (mobile, Apple Silicon)"

  performance:
    encryption_speedup: "3-5x faster than software"
    decryption_speedup: "3-5x faster than software"
    gcm_speedup: "2-3x faster (PMULL for GMAC)"

  detection:
    method: "ID_AA64ISAR0_EL1 register"
    flag: "AES and PMULL support"
    runtime_check: "Required for ARM64"

# Hardware Detection
hardware_detection:
  runtime_detection:
    description: "Detect hardware support at startup"
    method: "Assembly CPUID (x86) or system registers (ARM)"
    caching: "Cache result for session lifetime"
    fallback: "Software implementation if unsupported"

  library_support:
    rust:
      - "aesni (Intel AES-NI)"
      - "aes-armv8 (ARM crypto)"
      - "aes-soft (software fallback)"
    python:
      - "cryptography (auto-detects hardware)"
      - "pycryptodome (hardware acceleration)"

# Performance Budget
performance_budget:
  detection_ms: 0.1  # One-time at startup
  encryption_1kb_hardware_ms: 0.02
  encryption_1kb_software_ms: 0.15
  decryption_1kb_hardware_ms: 0.02
  decryption_1kb_software_ms: 0.15

# Implementation Strategy
implementation_strategy:
  automatic_detection:
    description: "Automatically detect and use best available implementation"
    priority: "AES-NI > ARM Crypto > Software"
    fallback: "Graceful degradation to software"

  library_integration:
    description: "Use hardware-accelerated crypto libraries"
    rust: "rust-crypto with aesni feature"
    python: "cryptography library (automatic detection)"

  performance_monitoring:
    description: "Monitor actual performance vs. software baseline"
    metrics: "hardware_acceleration_ratio"
    alerting: "Alert if hardware not utilized on supported CPUs"

# Fallback Strategy
fallback_strategy:
  software_implementation:
    description: "Pure software AES-256-GCM"
    library: "OpenSSL or native implementation"
    performance: "Baseline for comparison"
    compatibility: "Works on all platforms"

  graceful_degradation:
    description: "Automatic fallback if hardware fails"
    detection: "Try hardware, fallback to software on error"
    logging: "Log hardware acceleration status"

# Security Considerations
security_considerations:
  side_channel_attacks:
    mitigation: "Constant-time implementations"
    validation: "No timing differences between hardware/software"

  hardware_tampering:
    risk: "Hardware backdoors (theoretical)"
    mitigation: "Software fallback available"
    monitoring: "Performance monitoring for anomalies"

  compatibility:
    requirement: "Same cryptographic results"
    validation: "Cross-implementation testing"

# Testing Requirements
testing:
  unit_tests:
    - "Hardware detection works correctly"
    - "AES-NI instructions utilized when available"
    - "ARM crypto instructions utilized when available"
    - "Software fallback works on all platforms"

  performance_tests:
    - "Hardware acceleration provides expected speedup"
    - "Software fallback meets minimum performance"
    - "Detection overhead minimal"

  compatibility_tests:
    - "Same results: hardware vs software"
    - "Cross-platform consistency"
    - "Big-endian/little-endian compatibility"

  security_tests:
    - "No side channels in hardware implementation"
    - "Timing attack resistance"
    - "Hardware failure doesn't compromise security"

# Implementation Interface
implementation:
  rust:
    feature_flags: "aesni, aes-armv8"
    detection: "fn detect_aesni() -> bool"
    selection: "Automatic based on compile-time features + runtime detection"
    fallback: "Software implementation always available"

  python:
    library: "cryptography"
    detection: "Automatic (library handles)"
    acceleration: "Transparent to application code"

# Error Handling
error_handling:
  hardware_unavailable:
    error_code: "HARDWARE_UNAVAILABLE"
    description: "AES-NI/ARM crypto not supported"
    handling: "Fallback to software"
    logging: "Info level (expected on older hardware)"

  hardware_failure:
    error_code: "HARDWARE_FAILURE"
    description: "Hardware acceleration failed during operation"
    handling: "Fallback to software for this operation"
    logging: "Warning level"

  detection_failure:
    error_code: "DETECTION_FAILURE"
    description: "Cannot detect hardware support"
    handling: "Assume software-only"
    logging: "Warning level"

# Dependencies
dependencies:
  upstream:
    - "encrypt_operation.yml: Uses hardware acceleration"
    - "decrypt_operation.yml: Uses hardware acceleration"
  downstream:
    - "performance_validation.yml: Validates acceleration benefits"

# Success Criteria
success_criteria:
  functional:
    - "Hardware acceleration automatically detected"
    - "AES-NI utilized on Intel/AMD CPUs"
    - "ARM crypto utilized on ARM64 CPUs"
    - "Software fallback works on all platforms"

  performance:
    - "5-10x speedup on hardware-accelerated CPUs"
    - "Detection <0.1ms overhead"
    - "No performance regression on unsupported hardware"

  security:
    - "Same cryptographic security as software"
    - "No side channels or timing differences"
    - "Hardware failures don't compromise security"

  compatibility:
    - "Cross-platform cryptographic consistency"
    - "Graceful degradation on all platforms"
    - "Library integration transparent to application"
