---
# ADR-0036a: AES-256-GCM Nonce Management Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Nonce Management Contract
# Defines nonce generation and management for AES-256-GCM operations

contract:
  name: nonce_management
  version: "1.0.0"
  description: "96-bit nonce generation and management for AES-256-GCM encryption"
  parent_adr: "ADR-0036a"
  priority: "CRITICAL"
  effort: "1 week"

# Nonce Overview
nonce_overview:
  size_bits: 96
  size_bytes: 12
  uniqueness: "Must be unique per key"
  reuse_consequence: "Complete security breach (key recovery possible)"
  generation: "Counter-based deterministic generation"

# Nonce Properties
nonce_properties:
  length:
    bits: 96
    bytes: 12
    standard: "NIST SP 800-38D (GCM)"

  uniqueness:
    requirement: "Never reuse nonce with same key"
    scope: "Per encryption key"
    consequence: "Authentication tag becomes predictable"

  randomness:
    requirement: "Cryptographically secure"
    source: "OS CSPRNG or counter-based"
    validation: "FIPS 140-2 compliant"

  predictability:
    requirement: "Non-predictable to attackers"
    mechanism: "Counter + random salt"
    collision_probability: "2^-96 (negligible)"

# Generation Strategies
generation_strategies:
  counter_based:
    description: "Deterministic counter-based generation"
    algorithm: "nonce = base_nonce + counter"
    base_nonce: "96-bit random value per key"
    counter: "64-bit incrementing counter"
    capacity: "2^64 nonces per key (adequate)"
    advantage: "No collision risk, deterministic"

  random:
    description: "Pure random generation"
    algorithm: "nonce = random_bytes(12)"
    collision_probability: "2^-96 per nonce"
    advantage: "Simple implementation"
    disadvantage: "Theoretical collision risk"

  hybrid:
    description: "Counter + random salt"
    algorithm: "nonce = random_salt(4 bytes) + counter(8 bytes)"
    collision_probability: "Extremely low"
    advantage: "Combines benefits of both"

# Recommended Strategy
recommended_strategy:
  name: "counter_based"
  rationale: "Zero collision risk, deterministic, efficient"
  implementation: "base_nonce stored with key metadata"

# Nonce Storage
nonce_storage:
  base_nonce:
    storage: "With key metadata in keystore"
    encryption: "Same encryption as key material"
    access: "Retrieved with key"

  counter:
    storage: "In memory (not persisted)"
    initialization: "Start from 0 for new keys"
    persistence: "Not needed (can restart from 0)"
    overflow: "2^64 capacity (never reached)"

# Nonce Lifecycle
nonce_lifecycle:
  generation:
    trigger: "Each encryption operation"
    method: "base_nonce + atomic_increment(counter)"
    validation: "Check for overflow (never happens)"

  validation:
    uniqueness: "Enforced by counter increment"
    format: "96 bits exactly"
    reuse_detection: "Automatic (counter prevents)"

  error_handling:
    counter_overflow:
      probability: "Zero (2^64 capacity)"
      handling: "Rotate encryption key"

    collision_detected:
      probability: "Zero (counter-based)"
      handling: "Impossible scenario"

# Implementation Interface
implementation:
  rust:
    struct: "NonceGenerator"
    methods:
      - "new(base_nonce: [u8; 12]) -> Self"
      - "generate() -> [u8; 12]"
      - "peek_next() -> [u8; 12]"  # For testing
    thread_safety: "Atomic counter for concurrent access"

  python:
    class: "NonceGenerator"
    methods:
      - "__init__(base_nonce: bytes)"
      - "generate() -> bytes"
      - "peek_next() -> bytes"
    thread_safety: "Lock-based counter protection"

# Performance Budget
performance_budget:
  generation_ns: 50  # 0.05 microseconds
  memory_usage_bytes: 16  # 12-byte base + 4-byte counter
  thread_safety_overhead: "Minimal (atomic operations)"

# Security Requirements
security_requirements:
  - "Nonce never reused with same key"
  - "Base nonce cryptographically secure"
  - "Counter monotonically increasing"
  - "No nonce predictability to attackers"
  - "Collision probability negligible (2^-96)"

# Testing Requirements
testing:
  unit_tests:
    - "Nonce generation produces 96-bit values"
    - "Counter increments monotonically"
    - "No nonce reuse within same generator"
    - "Different generators produce different nonces"
    - "Base nonce properly incorporated"

  security_tests:
    - "Nonce uniqueness verified"
    - "No predictable patterns"
    - "Collision resistance tested"
    - "Counter overflow handling"

  performance_tests:
    - "Generation within 50ns budget"
    - "Concurrent access thread-safe"
    - "Memory usage minimal"

  fuzzing_tests:
    - "Random base_nonce inputs"
    - "High-frequency generation"
    - "Concurrent generation stress test"

# Error Scenarios
error_scenarios:
  counter_overflow:
    description: "Counter reaches 2^64 (impossible in practice)"
    handling: "Rotate encryption key, reset counter"
    logging: "Security event (key rotation required)"

  base_nonce_invalid:
    description: "Base nonce not 12 bytes"
    handling: "Return error, do not generate nonce"
    logging: "Configuration error"

  concurrent_access:
    description: "Multiple threads generating nonces"
    handling: "Atomic operations ensure uniqueness"
    logging: "Normal operation"

# Dependencies
dependencies:
  upstream:
    - "encryption_key.yml: Key structure with base_nonce"
  downstream:
    - "encrypt_operation.yml: Uses nonce generation"
    - "decrypt_operation.yml: Uses same nonce"

# Success Criteria
success_criteria:
  functional:
    - "96-bit nonces generated correctly"
    - "Counter-based uniqueness guaranteed"
    - "No nonce reuse possible"
    - "Thread-safe concurrent generation"

  performance:
    - "<50ns nonce generation"
    - "Minimal memory overhead"
    - "No performance degradation under load"

  security:
    - "Cryptographically secure generation"
    - "Zero collision risk"
    - "No predictable patterns"
    - "Replay attack protection"

  compliance:
    - "NIST SP 800-38D compliance"
    - "FIPS 140-2 randomness requirements"
    - "GDPR/HIPAA security standards"
