---
# ADR-0036b: Local HSM Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Local HSM Contract
# Defines hardware security module integration for key storage

contract:
  name: local_hsm
  version: "1.0.0"
  description: "Hardware security module integration for AES-256 key storage"
  parent_adr: "ADR-0036b"
  priority: "HIGH"
  effort: "3 weeks"

# Supported HSM Devices
supported_hsm_devices:
  yubihsm2:
    manufacturer: "Yubico"
    model: "YubiHSM 2"
    interface: "USB"
    security_level: "FIPS 140-2 Level 3"
    key_capacity: "256 keys"
    algorithms: ["AES-128", "AES-256", "RSA-2048", "RSA-4096", "ECDSA", "Ed25519"]

  nitrokey_hsm2:
    manufacturer: "Nitrokey"
    model: "HSM 2"
    interface: "USB"
    security_level: "FIPS 140-2 Level 3"
    key_capacity: "300 keys"
    algorithms: ["AES-128", "AES-256", "RSA-2048", "RSA-4096", "ECDSA"]

  opensc_generic:
    manufacturer: "Generic"
    model: "OpenSC compatible HSM"
    interface: "PKCS#11"
    security_level: "Varies by device"
    key_capacity: "Varies by device"
    algorithms: ["Varies by device"]

# HSM Operations
hsm_operations:
  initialize_hsm:
    function: "initialize_hsm(device_path: str, auth_key: bytes)"
    description: "Initialize HSM device for use"
    parameters:
      device_path: "Path to HSM device (/dev/hsm0, etc.)"
      auth_key: "HSM authentication key"
    security: "Auth key never stored, used only for session"
    error_handling: "DeviceNotFound, AuthFailed, AlreadyInitialized"

  store_key:
    function: "store_key(key_id: str, key_material: bytes, metadata: dict)"
    description: "Store key in HSM"
    parameters:
      key_id: "Unique identifier for the key"
      key_material: "Raw AES-256 key bytes (32 bytes)"
      metadata: "Key metadata (stored separately)"
    security: "Key never leaves HSM, generated inside when possible"
    error_handling: "KeyExists, StorageFull, AuthFailed"

  retrieve_key:
    function: "retrieve_key(key_id: str) -> bytes"
    description: "Retrieve key from HSM for use"
    parameters:
      key_id: "Unique identifier for the key"
    returns: "Raw AES-256 key bytes"
    security: "Key used within HSM when possible, exported only when necessary"
    error_handling: "KeyNotFound, AuthFailed, KeyCompromised"

  delete_key:
    function: "delete_key(key_id: str)"
    description: "Delete key from HSM"
    parameters:
      key_id: "Unique identifier for the key"
    security: "Cryptographic erasure, key destroyed"
    error_handling: "KeyNotFound, AuthFailed, KeyInUse"

  list_keys:
    function: "list_keys() -> list[str]"
    description: "List all key IDs in HSM"
    returns: "List of key ID strings"
    security: "Only returns keys current user can access"
    performance: "Cached for performance"

  perform_operation:
    function: "perform_operation(key_id: str, operation: str, data: bytes) -> bytes"
    description: "Perform cryptographic operation using key in HSM"
    parameters:
      key_id: "Key to use for operation"
      operation: "encrypt/decrypt/sign/verify"
      data: "Data for operation"
    returns: "Result of cryptographic operation"
    security: "Data processed inside HSM, never exported"
    error_handling: "KeyNotFound, InvalidOperation, AuthFailed"

# Security Model
security_model:
  hardware_security:
    tamper_evident: "Physical tamper detection"
    secure_boot: "Verified boot process"
    secure_enclave: "Keys stored in secure memory"
    side_channel_protection: "Timing attack mitigation"

  key_protection:
    never_exported: "Keys generated and used inside HSM"
    cryptographic_erasure: "Keys destroyed on deletion"
    access_control: "HSM authentication required"
    audit_logging: "All operations logged inside HSM"

  authentication:
    auth_key: "HSM administrator authentication"
    user_auth: "Per-user authentication keys"
    session_auth: "Session-based authentication"
    multi_factor: "Hardware token + PIN when supported"

  compliance:
    fips_140_2: "Level 3 certified devices"
    common_criteria: "EAL5+ certified"
    gdpr_hardware: "Hardware-level data protection"
    hipaa_hsm: "Hardware security for PHI"

# PKCS#11 Interface
pkcs11_interface:
  library_path:
    linux: "/usr/lib/x86_64-linux-gnu/pkcs11/yubihsm_pkcs11.so"
    macos: "/usr/local/lib/pkcs11/yubihsm_pkcs11.dylib"
    windows: "C:\\Program Files\\Yubico\\YubiHSM\\bin\\yubihsm_pkcs11.dll"

  standard_functions:
    - "C_Initialize: Initialize PKCS#11 library"
    - "C_GetSlotList: Get available HSM slots"
    - "C_OpenSession: Open session with HSM"
    - "C_Login: Authenticate to HSM"
    - "C_GenerateKey: Generate key inside HSM"
    - "C_UnwrapKey: Import wrapped key"
    - "C_DestroyObject: Delete key"
    - "C_EncryptInit/C_Encrypt: Encrypt data"
    - "C_DecryptInit/C_Decrypt: Decrypt data"

  session_management:
    read_write_session: "For key management operations"
    read_only_session: "For key usage operations"
    session_timeout: "5 minutes of inactivity"
    concurrent_sessions: "Up to 10 concurrent sessions"

# Key Generation in HSM
hsm_key_generation:
  generate_key:
    function: "generate_key_in_hsm(key_id: str, algorithm: str, key_size: int)"
    description: "Generate AES-256 key inside HSM"
    parameters:
      key_id: "Unique identifier for the key"
      algorithm: "AES"
      key_size: 256
    security: "Key never leaves HSM"
    advantage: "True random generation, hardware security"

  import_key:
    function: "import_key_to_hsm(key_id: str, wrapped_key: bytes, wrapping_key: str)"
    description: "Import existing key into HSM"
    parameters:
      key_id: "Unique identifier for the key"
      wrapped_key: "Key wrapped for transport"
      wrapping_key: "HSM key used for unwrapping"
    security: "Key decrypted inside HSM only"
    use_case: "Migrate keys from software to hardware"

# Cryptographic Operations in HSM
hsm_cryptographic_operations:
  aes_gcm_encrypt:
    function: "encrypt_in_hsm(key_id: str, plaintext: bytes, iv: bytes, aad: bytes) -> (bytes, bytes)"
    description: "AES-GCM encryption inside HSM"
    parameters:
      key_id: "AES key ID"
      plaintext: "Data to encrypt"
      iv: "12-byte initialization vector"
      aad: "Additional authenticated data"
    returns:
      ciphertext: "Encrypted data"
      tag: "16-byte authentication tag"
    security: "All operations inside secure boundary"

  aes_gcm_decrypt:
    function: "decrypt_in_hsm(key_id: str, ciphertext: bytes, iv: bytes, tag: bytes, aad: bytes) -> bytes"
    description: "AES-GCM decryption inside HSM"
    parameters:
      key_id: "AES key ID"
      ciphertext: "Data to decrypt"
      iv: "12-byte initialization vector"
      tag: "16-byte authentication tag"
      aad: "Additional authenticated data"
    returns: "Decrypted plaintext"
    security: "Authentication verification inside HSM"

# Performance Requirements
performance_requirements:
  initialization: "< 2 seconds"
  key_generation: "< 100ms"
  key_storage: "< 500ms"
  key_retrieval: "< 50ms"
  cryptographic_operation: "< 10ms per operation"
  session_establishment: "< 200ms"

  throughput:
    aes_operations: "1000 operations/second"
    concurrent_sessions: "10 simultaneous sessions"
    memory_usage: "< 100MB"

# Error Handling
error_handling:
  device_not_found:
    error_code: "HSM_DEVICE_NOT_FOUND"
    description: "HSM device not connected"
    recovery: "Check USB connection, retry detection"
    fallback: "Use encrypted file backend"

  authentication_failed:
    error_code: "HSM_AUTH_FAILED"
    description: "HSM authentication rejected"
    recovery: "Verify auth key, check device state"
    fallback: "Use encrypted file backend"

  device_locked:
    error_code: "HSM_DEVICE_LOCKED"
    description: "HSM locked due to failed auth attempts"
    recovery: "Wait for lockout period, use recovery procedure"
    fallback: "Use encrypted file backend"

  storage_full:
    error_code: "HSM_STORAGE_FULL"
    description: "HSM key capacity reached"
    recovery: "Delete unused keys, use key rotation"
    fallback: "Use encrypted file backend"

  operation_failed:
    error_code: "HSM_OPERATION_FAILED"
    description: "Cryptographic operation failed"
    recovery: "Retry operation, check key validity"
    fallback: "Software fallback for operation"

# Device Management
device_management:
  device_detection:
    usb_detection: "Monitor USB device insertion/removal"
    automatic_setup: "Initialize detected HSM devices"
    user_confirmation: "Require user approval for HSM use"

  firmware_updates:
    version_check: "Verify HSM firmware version"
    secure_update: "Authenticated firmware updates"
    compatibility_check: "Ensure update doesn't break functionality"

  backup_recovery:
    key_backup: "Encrypted backup of HSM contents"
    device_replacement: "Restore keys to new HSM device"
    disaster_recovery: "Offline key recovery procedures"

# Monitoring and Alerting
monitoring_alerting:
  device_health:
    metric: "hsm_device_status"
    labels: ["device_id", "status"]
    alerting: "Device disconnection triggers alert"

  operation_metrics:
    metric: "hsm_operations_total"
    labels: ["operation", "success"]
    alerting: "High failure rates trigger alert"

  performance_metrics:
    metric: "hsm_operation_duration_seconds"
    labels: ["operation"]
    alerting: "Performance degradation alerts"

  security_events:
    metric: "hsm_security_events_total"
    labels: ["event_type"]
    alerting: "Security events trigger immediate alert"

# Implementation Interface
implementation:
  rust:
    trait: "HsmBackend"
    struct: "LocalHsmBackend"
    functions:
      - "new(device_path: &str) -> Result<Self, HsmError>"
      - "initialize(auth_key: &[u8]) -> Result<(), HsmError>"
      - "store_key(key_id: &str, key_material: &[u8], metadata: &Value) -> Result<(), HsmError>"
      - "retrieve_key(key_id: &str) -> Result<Vec<u8>, HsmError>"
      - "delete_key(key_id: &str) -> Result<(), HsmError>"
      - "list_keys() -> Result<Vec<String>, HsmError>"
      - "perform_operation(key_id: &str, operation: &str, data: &[u8]) -> Result<Vec<u8>, HsmError>"

  python:
    class: "LocalHSMBackend"
    methods:
      - "__init__(self, device_path: str)"
      - "initialize(self, auth_key: bytes)"
      - "store_key(self, key_id: str, key_material: bytes, metadata: dict)"
      - "retrieve_key(self, key_id: str) -> bytes"
      - "delete_key(self, key_id: str)"
      - "list_keys(self) -> list[str]"
      - "perform_operation(self, key_id: str, operation: str, data: bytes) -> bytes"

# Testing Requirements
testing:
  unit_tests:
    - "HSM device detection and initialization"
    - "Key storage and retrieval operations"
    - "Cryptographic operations in HSM"
    - "Error conditions and fallbacks"

  integration_tests:
    - "Full key lifecycle in HSM"
    - "PKCS#11 interface compliance"
    - "Device hotplug handling"
    - "Firmware update process"

  security_tests:
    - "Key non-exportability verification"
    - "Tamper detection testing"
    - "Side channel attack mitigation"
    - "FIPS compliance validation"

  hardware_tests:
    - "YubiHSM 2 compatibility"
    - "Nitrokey HSM 2 compatibility"
    - "OpenSC generic device support"
    - "USB hotplug scenarios"

# Dependencies
dependencies:
  upstream:
    - "key_storage.yml: Uses HSM as tertiary backend"
  downstream:
    - "os_keychain.yml: Primary backend"
    - "encrypted_file.yml: Secondary backend"

# Success Criteria
success_criteria:
  functional:
    - "Keys stored securely in HSM"
    - "Cryptographic operations work inside HSM"
    - "Device detection and initialization"
    - "Fallback to software backends"

  security:
    - "Keys never leave HSM boundary"
    - "Hardware tamper protection"
    - "FIPS 140-2 Level 3 compliance"
    - "Complete audit trail"

  performance:
    - "Operations within time budgets"
    - "High throughput for crypto operations"
    - "Low latency for key operations"

  reliability:
    - "Device disconnection handling"
    - "Error recovery and fallbacks"
    - "Firmware update support"
    - "Concurrent session management"
