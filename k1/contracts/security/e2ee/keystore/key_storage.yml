---
# ADR-0036b: Key Storage Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Key Storage Contract
# Defines secure storage of encryption keys in OS keychain or encrypted file

contract:
  name: key_storage
  version: "1.0.0"
  description: "Secure storage of 256-bit AES encryption keys"
  parent_adr: "ADR-0036b"
  priority: "CRITICAL"
  effort: "2 weeks"

# Storage Backends
storage_backends:
  primary:
    os_keychain:
      description: "Operating system secure key storage"
      platforms:
        windows: "Credential Manager (DPAPI)"
        macos: "Keychain Access (Secure Enclave)"
        linux: "Secret Service (GNOME Keyring/KWallet)"
      security: "Hardware-backed, OS authentication required"
      availability: "Default on all platforms"

  secondary:
    encrypted_file:
      description: "Password-protected local file storage"
      format: "SQLite database with AES-256-GCM encryption"
      password: "User-provided password (PBKDF2/Argon2 derived)"
      security: "Password-protected, local-only"
      availability: "Fallback when OS keychain unavailable"

  tertiary:
    local_hsm:
      description: "USB hardware security module"
      devices: "YubiHSM, Nitrokey, SmartCard"
      security: "Air-gapped, hardware-backed"
      availability: "Enterprise/paranoid users only"

# Storage Architecture
storage_architecture:
  separation:
    description: "Keys stored separately from encrypted data"
    location: "OS keychain, not K0 database"
    reference: "K0 stores key_id reference only"

  atomicity:
    description: "All-or-nothing storage operations"
    transaction: "Key + metadata stored together"
    rollback: "Failed storage doesn't leave partial state"

  backup:
    description: "User-controlled key backup"
    format: "Encrypted bundle exportable by user"
    security: "Password-protected, user responsibility"

# OS Keychain Implementation
os_keychain_implementation:
  service_name: "FamilyOS-K1"
  key_format: "Hex-encoded 256-bit key"
  metadata_storage: "Separate from key material"
  access_control: "OS authentication required"

  windows_credential_manager:
    api: "Windows Data Protection API (DPAPI)"
    encryption: "User-specific, TPM-backed when available"
    authentication: "Windows login credentials"

  macos_keychain:
    api: "Security.framework"
    encryption: "Secure Enclave when available"
    authentication: "User password, Touch ID, Face ID"

  linux_secret_service:
    api: "org.freedesktop.Secret.Service"
    encryption: "User session key"
    authentication: "User login credentials"

# Encrypted File Implementation
encrypted_file_implementation:
  database: "SQLite with encryption"
  master_key: "PBKDF2/Argon2 derived from user password"
  encryption: "AES-256-GCM for stored keys"
  schema:
    table: "encryption_keys"
    columns:
      - "key_id TEXT PRIMARY KEY"
      - "encrypted_key_material BLOB"
      - "nonce BLOB"
      - "space_id TEXT"
      - "user_id TEXT"
      - "created_at INTEGER"
      - "metadata TEXT"

# Storage Operations
storage_operations:
  store_key:
    input: "EncryptionKey, KeyMetadata"
    process: "Encrypt key material, store in backend"
    validation: "Verify storage succeeded"
    atomicity: "Key + metadata stored together"

  retrieve_key:
    input: "key_id"
    process: "Fetch from backend, decrypt if needed"
    validation: "Verify key integrity"
    caching: "Cache decrypted key in memory"

  delete_key:
    input: "key_id"
    process: "Remove from backend"
    validation: "Verify deletion succeeded"
    audit: "Log deletion operation"

# Performance Budget
performance_budget:
  store_key_ms: 5
  retrieve_key_ms: 1
  delete_key_ms: 2
  memory_usage_mb: 0.01

# Security Requirements
security_requirements:
  confidentiality:
    description: "Key material encrypted at rest"
    os_keychain: "OS-provided encryption"
    encrypted_file: "AES-256-GCM with user password"

  integrity:
    description: "Key material tamper-evident"
    validation: "Verify key format on retrieval"
    corruption_detection: "Fail on malformed keys"

  access_control:
    description: "OS authentication required"
    os_keychain: "User password/biometric"
    encrypted_file: "User-provided password"

# Error Handling
error_handling:
  storage_failure:
    error_code: "KEY_STORAGE_FAILED"
    description: "Cannot store key in backend"
    recovery: "Retry, try different backend"

  retrieval_failure:
    error_code: "KEY_RETRIEVAL_FAILED"
    description: "Cannot retrieve key from backend"
    recovery: "Check backend availability, regenerate if needed"

  corruption_detected:
    error_code: "KEY_CORRUPTED"
    description: "Stored key material corrupted"
    recovery: "Alert user, regenerate key"

  authentication_failed:
    error_code: "BACKEND_AUTH_FAILED"
    description: "OS keychain authentication failed"
    recovery: "Prompt user for credentials"

# Implementation Interface
implementation:
  rust:
    trait: "KeyStorageBackend"
    methods:
      - "store_key(key: &EncryptionKey, metadata: &KeyMetadata) -> Result<(), StorageError>"
      - "retrieve_key(key_id: &str) -> Result<EncryptionKey, StorageError>"
      - "delete_key(key_id: &str) -> Result<(), StorageError>"
    backends: "OsKeychainBackend, EncryptedFileBackend, LocalHsmBackend"

  python:
    class: "KeyStorageBackend"
    methods:
      - "store_key(key: EncryptionKey, metadata: KeyMetadata)"
      - "retrieve_key(key_id: str) -> EncryptionKey"
      - "delete_key(key_id: str)"

# Testing Requirements
testing:
  unit_tests:
    - "Keys stored and retrieved correctly"
    - "Different backends work independently"
    - "Key metadata stored with key material"
    - "Storage operations are atomic"

  security_tests:
    - "Key material not exposed in storage"
    - "OS authentication required for access"
    - "Tamper detection works"
    - "Encrypted file requires password"

  performance_tests:
    - "Storage operations within budget"
    - "Retrieval uses caching effectively"
    - "Concurrent access thread-safe"

  integration_tests:
    - "Cross-backend key migration"
    - "Backup and restore functionality"
    - "Key lifecycle operations work end-to-end"

# Dependencies
dependencies:
  upstream:
    - "key_generation.yml: Generates keys to store"
  downstream:
    - "key_rotation.yml: Updates stored keys"
    - "key_revocation.yml: Removes stored keys"

# Success Criteria
success_criteria:
  functional:
    - "Keys stored securely in all backends"
    - "Keys retrieved correctly with authentication"
    - "Key metadata preserved with key material"

  security:
    - "Key material encrypted at rest"
    - "OS authentication required for access"
    - "Tamper-evident storage"

  performance:
    - "Storage operations within performance budget"
    - "Retrieval uses efficient caching"
    - "No performance degradation under load"

  reliability:
    - "Storage failures handled gracefully"
    - "Backend switching works transparently"
    - "Data integrity maintained"
