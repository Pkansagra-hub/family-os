---
# ADR-0036: SessionState Integration Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# SessionState Integration Contract
# Defines integration of E2EE encryption with SessionState processing

contract:
  name: sessionstate_integration
  version: "1.0.0"
  description: "Integration of E2EE encryption with SessionState processing pipeline"
  parent_adr: "ADR-0036"
  priority: "HIGH"
  effort: "3 weeks"

# Integration Points
integration_points:
  sessionstate_creation:
    hook_point: "post_creation"
    description: "Encrypt RED sections after SessionState creation"
    timing: "Synchronous with < 500ms latency"
    failure_handling: "Fail SessionState creation on encryption failure"

  sessionstate_loading:
    hook_point: "pre_access"
    description: "Decrypt RED sections before SessionState access"
    timing: "Lazy decryption on first RED section access"
    caching: "Cache decrypted sections for session duration"

  sessionstate_saving:
    hook_point: "pre_save"
    description: "Encrypt RED sections before SessionState persistence"
    timing: "Synchronous with save operation"
    atomicity: "Encryption failure prevents save"

  sessionstate_replication:
    hook_point: "pre_replication"
    description: "Ensure RED sections encrypted for replication"
    timing: "Synchronous with replication"
    consistency: "All replicas have same encryption state"

# SessionState Structure Extensions
sessionstate_extensions:
  encryption_metadata:
    encrypted_sections: "List of encrypted section paths"
    encryption_timestamp: "When sections were encrypted"
    encryption_version: "E2EE protocol version used"
    key_fingerprint: "Hash of encryption key used"
    integrity_hash: "Hash of unencrypted SessionState"

  section_encryption_marker:
    encryption_flag: "Boolean indicating section is encrypted"
    encryption_method: "AES-256-GCM"
    decryption_key_hint: "Hint for key retrieval (not the key)"
    original_size: "Size of unencrypted section"
    compression_info: "If section was compressed before encryption"

  access_control_metadata:
    owner_id: "User ID of SessionState owner"
    access_policy: "Who can decrypt sections"
    consent_required: "Whether explicit consent needed for access"
    audit_trail: "Access history for compliance"

# Encryption State Management
encryption_state_management:
  state_tracking:
    encryption_state: "NOT_ENCRYPTED, ENCRYPTING, ENCRYPTED, DECRYPTING, DECRYPTED"
    state_transitions: "Valid state transition graph"
    state_persistence: "State stored with SessionState"
    concurrency_control: "Prevent concurrent encryption operations"

  state_validation:
    integrity_checks: "Verify encryption state consistency"
    key_validation: "Ensure correct key used for encryption"
    timestamp_validation: "Check encryption/decryption timestamps"
    access_validation: "Verify user has decryption permission"

  state_recovery:
    corrupted_state: "Recover from inconsistent encryption state"
    failed_encryption: "Handle partially encrypted SessionState"
    key_unavailable: "Handle missing encryption keys"
    emergency_access: "Allow access in emergency situations"

# Lazy Decryption
lazy_decryption:
  decryption_trigger:
    first_access: "Decrypt section on first read access"
    write_access: "Decrypt section on write access"
    full_load: "Decrypt all sections when needed"

  decryption_caching:
    session_cache: "Cache decrypted sections for session"
    memory_limits: "Limit cached decrypted data size"
    cache_invalidation: "Invalidate on key rotation, logout"
    performance_monitoring: "Track cache hit rates"

  decryption_batching:
    related_sections: "Decrypt related sections together"
    prefetching: "Prefetch likely-to-be-accessed sections"
    background_decryption: "Decrypt in background when possible"

# Atomic Operations
atomic_operations:
  encryption_transaction:
    begin_transaction: "Mark SessionState as encrypting"
    encrypt_sections: "Encrypt all selected sections"
    update_metadata: "Update encryption metadata"
    commit_transaction: "Mark as encrypted, make visible"
    rollback: "On failure, revert to pre-encryption state"

  decryption_transaction:
    begin_transaction: "Mark sections as decrypting"
    decrypt_sections: "Decrypt required sections"
    validate_integrity: "Verify decrypted data integrity"
    update_cache: "Update decryption cache"
    commit_transaction: "Mark as decrypted, allow access"

  consistency_guarantees:
    all_or_nothing: "Either all sections encrypted or none"
    metadata_consistency: "Metadata always consistent with data state"
    failure_recovery: "Can recover from any failure point"

# Access Control Integration
access_control_integration:
  authorization_checks:
    owner_check: "Only owner can decrypt their SessionState"
    delegate_check: "Check for valid delegation tokens"
    emergency_access: "Allow emergency access with audit"
    compliance_check: "Verify GDPR/HIPAA compliance"

  permission_model:
    read_access: "Can decrypt and read RED sections"
    write_access: "Can decrypt, modify, re-encrypt sections"
    admin_access: "Can manage encryption keys and policies"
    audit_access: "Can view encryption audit logs"

  consent_management:
    explicit_consent: "User must consent to E2EE"
    consent_withdrawal: "User can withdraw consent"
    consent_audit: "Track consent decisions"
    consent_verification: "Verify consent before decryption"

# Performance Integration
performance_integration:
  latency_budgets:
    sessionstate_creation: "< 2000ms total (including encryption)"
    sessionstate_loading: "< 500ms (lazy decryption)"
    section_access: "< 50ms (cached decryption)"
    sessionstate_save: "< 1000ms (including encryption)"

  optimization_strategies:
    incremental_encryption: "Only encrypt changed sections"
    compression_before_encryption: "Compress to reduce encryption time"
    parallel_processing: "Use parallel encryption for multiple sections"
    caching_optimization: "Optimize decryption caching strategy"

  resource_limits:
    memory_limit: "< 500MB for SessionState processing"
    cpu_limit: "< 50% CPU during encryption operations"
    io_limit: "Control I/O bandwidth for encryption"

# Error Handling Integration
error_handling_integration:
  encryption_failures:
    key_unavailable: "Cannot retrieve encryption key"
    hardware_failure: "Encryption hardware unavailable"
    data_corruption: "SessionState data corrupted"
    timeout_exceeded: "Encryption taking too long"

  decryption_failures:
    authentication_failure: "Invalid authentication tag"
    key_mismatch: "Wrong key used for decryption"
    data_tampered: "Data modified after encryption"
    permission_denied: "User not authorized for decryption"

  recovery_strategies:
    retry_logic: "Retry failed operations with backoff"
    fallback_modes: "Use software encryption, skip encryption"
    emergency_access: "Allow read-only access to unencrypted data"
    data_recovery: "Recover from backups when possible"

# Monitoring Integration
monitoring_integration:
  operation_metrics:
    metric: "sessionstate_e2ee_operations_total"
    labels: ["operation", "result", "section_type"]
    description: "E2EE operations on SessionState"

  performance_metrics:
    metric: "sessionstate_e2ee_duration_seconds"
    labels: ["operation", "cache_hit"]
    description: "E2EE operation timing"

  error_metrics:
    metric: "sessionstate_e2ee_errors_total"
    labels: ["error_type", "operation"]
    description: "E2EE error counts"

  security_metrics:
    metric: "sessionstate_e2ee_access_attempts_total"
    labels: ["authorized", "consent_given"]
    description: "Access attempt tracking"

# Implementation Interface
implementation:
  rust:
    trait: "SessionStateEncryptor"
    struct: "E2EESessionStateManager"
    functions:
      - "new(config: E2EEConfig) -> Result<Self, IntegrationError>"
      - "process_sessionstate(&self, sessionstate: SessionState, operation: OperationType, context: ProcessingContext) -> Result<SessionState, IntegrationError>"
      - "encrypt_sections(&self, sessionstate: &mut SessionState, sections: &[String]) -> Result<(), IntegrationError>"
      - "decrypt_sections(&self, sessionstate: &mut SessionState, sections: &[String], context: &AccessContext) -> Result<(), IntegrationError>"
      - "validate_encryption_state(&self, sessionstate: &SessionState) -> ValidationResult"

  python:
    class: "E2EESessionStateManager"
    methods:
      - "__init__(self, config: dict)"
      - "process_sessionstate(self, sessionstate: dict, operation: str, context: dict) -> dict"
      - "encrypt_sections(self, sessionstate: dict, sections: list) -> None"
      - "decrypt_sections(self, sessionstate: dict, sections: list, context: dict) -> None"
      - "validate_encryption_state(self, sessionstate: dict) -> dict"

# Testing Requirements
testing:
  unit_tests:
    - "SessionState encryption/decryption integration"
    - "Lazy decryption functionality"
    - "Atomic operation guarantees"
    - "Access control integration"
    - "Error handling and recovery"

  integration_tests:
    - "Full SessionState lifecycle with E2EE"
    - "Concurrent access to encrypted SessionState"
    - "Key rotation impact on SessionState"
    - "Backup and recovery of encrypted data"
    - "Cross-session consistency"

  performance_tests:
    - "SessionState creation with encryption"
    - "Lazy decryption performance"
    - "Concurrent access performance"
    - "Memory usage with caching"
    - "Large SessionState handling"

  security_tests:
    - "Access control enforcement"
    - "Data integrity verification"
    - "Encryption key management"
    - "Audit trail completeness"
    - "Emergency access procedures"

# Dependencies
dependencies:
  upstream:
    - "e2ee_manager.yml: Provides E2EE coordination"
    - "parallel_encryption.yml: Provides encryption capabilities"
    - "key_storage.yml: Provides encryption keys"
  downstream:
    - "async_encryption.yml: Handles asynchronous encryption"
    - "graceful_degradation.yml: Handles integration failures"

# Success Criteria
success_criteria:
  functional:
    - "SessionState processing integrates seamlessly with E2EE"
    - "Lazy decryption works transparently"
    - "Atomic operations maintain consistency"
    - "Access controls properly enforced"

  performance:
    - "SessionState operations within latency budgets"
    - "Efficient caching and lazy loading"
    - "Scalable concurrent access"
    - "Memory usage within limits"

  security:
    - "RED sections properly encrypted at rest"
    - "Access controls prevent unauthorized decryption"
    - "Data integrity maintained through operations"
    - "Complete audit trail for compliance"

  reliability:
    - "Robust error handling and recovery"
    - "Consistent state management"
    - "Graceful handling of failures"
    - "Comprehensive monitoring and alerting"
