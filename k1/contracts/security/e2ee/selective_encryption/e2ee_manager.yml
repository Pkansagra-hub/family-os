---
# ADR-0036: E2EE Manager Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# E2EE Manager Contract
# Defines the main E2EE manager coordinating selective encryption

contract:
  name: e2ee_manager
  version: "1.0.0"
  description: "Main E2EE manager for coordinating selective RED band encryption"
  parent_adr: "ADR-0036"
  priority: "CRITICAL"
  effort: "4 weeks"

# Manager Architecture
manager_architecture:
  components:
    - "band_detector: Detects privacy bands in SessionState"
    - "section_selector: Identifies sections requiring encryption"
    - "encryption_orchestrator: Coordinates encryption operations"
    - "key_manager: Manages encryption keys"
    - "audit_logger: Logs all E2EE operations"
    - "performance_monitor: Tracks encryption performance"

  data_flow:
    1: "SessionState arrives for processing"
    2: "Band detector analyzes privacy bands"
    3: "Section selector identifies RED sections"
    4: "Encryption orchestrator coordinates encryption"
    5: "Key manager provides appropriate keys"
    6: "Audit logger records operation"
    7: "Performance monitor tracks metrics"

# Core Operations
core_operations:
  process_sessionstate:
    function: "process_sessionstate(sessionstate: SessionState, context: ProcessingContext) -> SessionState"
    description: "Process SessionState for selective E2EE encryption"
    parameters:
      sessionstate: "SessionState object to process"
      context: "Processing context (user, space, operation type)"
    returns: "Processed SessionState with RED sections encrypted"
    async: true
    timeout: "2000ms (E2E latency budget)"

  encrypt_red_sections:
    function: "encrypt_red_sections(sessionstate: SessionState, red_sections: list) -> dict"
    description: "Encrypt identified RED sections"
    parameters:
      sessionstate: "SessionState containing the sections"
      red_sections: "List of section paths to encrypt"
    returns: "Dictionary of encrypted section data"
    parallel: "Sections encrypted in parallel"
    performance: "< 500ms for typical SessionState"

  decrypt_red_sections:
    function: "decrypt_red_sections(encrypted_sections: dict, context: ProcessingContext) -> dict"
    description: "Decrypt RED sections for authorized access"
    parameters:
      encrypted_sections: "Dictionary of encrypted section data"
      context: "Processing context for authorization"
    returns: "Dictionary of decrypted section data"
    authorization: "Verify user has RED band access"
    performance: "< 200ms for decryption"

  validate_encryption:
    function: "validate_encryption(sessionstate: SessionState) -> ValidationResult"
    description: "Validate E2EE encryption integrity"
    parameters:
      sessionstate: "SessionState to validate"
    returns: "Validation result with integrity status"
    checks: "Authentication tags, key validity, data integrity"

# Privacy Band Detection
privacy_band_detection:
  band_analysis:
    function: "analyze_privacy_bands(sessionstate: SessionState) -> BandAnalysis"
    description: "Analyze SessionState for privacy band classification"
    returns:
      red_sections: "List of RED band section paths"
      amber_sections: "List of AMBER band section paths"
      green_sections: "List of GREEN band section paths"
      classification_confidence: "Confidence score for classifications"

  section_mapping:
    beliefs: "RED - User beliefs and mental models"
    scoreboard: "RED - Performance metrics and evaluations"
    control: "RED - Control state and decision logic"
    metadata: "AMBER - Session metadata and timestamps"
    telemetry: "GREEN - Usage telemetry and analytics"

# Selective Encryption Logic
selective_encryption_logic:
  encryption_criteria:
    - "Section classified as RED band"
    - "User has not opted out of E2EE"
    - "Space policy allows E2EE"
    - "Encryption key available"
    - "Performance budget allows encryption"

  encryption_scope:
    full_section_encryption: "Entire section encrypted as single unit"
    field_level_encryption: "Individual sensitive fields encrypted"
    partial_encryption: "Only sensitive portions encrypted"

  encryption_modes:
    synchronous: "Block until encryption complete (< 500ms)"
    asynchronous: "Encrypt in background, return immediately"
    lazy: "Encrypt on first access to RED data"

# Key Management Integration
key_management_integration:
  key_selection:
    function: "select_encryption_key(user_id: str, space_id: str) -> KeyInfo"
    description: "Select appropriate encryption key"
    criteria: ["user ownership", "space membership", "key validity", "performance"]
    preference: "Most recent valid key for user/space"

  key_rotation_handling:
    rotation_detection: "Detect when key rotation needed"
    graceful_transition: "Support old keys during transition"
    data_reencryption: "Re-encrypt data with new keys"
    cleanup: "Remove old encrypted data after transition"

  key_availability:
    cache_first: "Check key cache first (< 1ms)"
    backend_fallback: "Fetch from keystore if not cached"
    offline_handling: "Handle key unavailability gracefully"
    user_notification: "Notify user of key issues"

# Performance Management
performance_management:
  latency_budgets:
    total_e2e: "< 2000ms"
    encryption_only: "< 500ms"
    decryption_only: "< 200ms"
    key_retrieval: "< 50ms"

  performance_monitoring:
    operation_timing: "Track encryption/decryption timing"
    throughput_metrics: "Operations per second"
    error_rates: "Encryption failure rates"
    cache_hit_rates: "Key cache effectiveness"

  optimization_strategies:
    parallel_encryption: "Encrypt multiple sections concurrently"
    batch_operations: "Batch encryption for multiple SessionStates"
    caching: "Cache frequently used keys and results"
    hardware_acceleration: "Use AES-NI when available"

# Error Handling and Recovery
error_handling_recovery:
  encryption_failures:
    key_unavailable:
      error_code: "KEY_UNAVAILABLE"
      recovery: "Use cached key or notify user"
      fallback: "Skip encryption for session"
    hardware_failure:
      error_code: "HARDWARE_ENCRYPTION_FAILED"
      recovery: "Fallback to software encryption"
      performance_impact: "2-5x slower"
    data_corruption:
      error_code: "ENCRYPTION_CORRUPTION"
      recovery: "Reject corrupted data, request re-encryption"
      security: "Alert security team"

  decryption_failures:
    authentication_failure:
      error_code: "AUTH_TAG_INVALID"
      recovery: "Reject tampered data"
      security: "Log security incident"
    key_mismatch:
      error_code: "KEY_MISMATCH"
      recovery: "Try alternative keys, notify user"
      fallback: "Return encrypted data marker"

  graceful_degradation:
    encryption_bypass: "Skip encryption when performance critical"
    reduced_security: "Use faster but less secure encryption"
    offline_mode: "Defer encryption until connectivity restored"
    user_notification: "Inform user of security status"

# Security and Compliance
security_compliance:
  access_control:
    red_band_access: "Verify user authorization for RED data"
    audit_logging: "Log all encryption/decryption operations"
    data_classification: "Maintain data classification metadata"
    compliance_markers: "Mark encrypted data for compliance"

  integrity_protection:
    authentication_tags: "AES-GCM authentication tags"
    data_integrity: "Detect tampering attempts"
    replay_protection: "Prevent replay of encrypted data"
    freshness_guarantees: "Ensure data freshness"

  privacy_protection:
    minimal_data_collection: "Only encrypt necessary RED data"
    data_minimization: "Remove unnecessary data before encryption"
    user_consent: "Respect user E2EE preferences"
    transparency: "Clear indication of encrypted content"

# Monitoring and Alerting
monitoring_alerting:
  operational_metrics:
    metric: "e2ee_operations_total"
    labels: ["operation", "result", "band"]
    alerting: "High failure rates trigger alert"

  performance_metrics:
    metric: "e2ee_operation_duration_seconds"
    labels: ["operation", "band"]
    alerting: "Performance budget violations trigger alert"

  security_events:
    metric: "e2ee_security_events_total"
    labels: ["event_type", "severity"]
    alerting: "Security events trigger immediate alert"

  compliance_metrics:
    metric: "e2ee_compliance_status"
    labels: ["check_type"]
    alerting: "Compliance violations trigger alert"

# Implementation Interface
implementation:
  rust:
    struct: "E2EEManager"
    functions:
      - "new(config: E2EEConfig) -> Result<Self, E2EEError>"
      - "process_sessionstate(&self, sessionstate: SessionState, context: ProcessingContext) -> Result<SessionState, E2EEError>"
      - "encrypt_red_sections(&self, sessionstate: &SessionState, sections: &[String]) -> Result<HashMap<String, EncryptedSection>, E2EEError>"
      - "decrypt_red_sections(&self, encrypted_sections: &HashMap<String, EncryptedSection>, context: &ProcessingContext) -> Result<HashMap<String, DecryptedSection>, E2EEError>"
      - "validate_encryption(&self, sessionstate: &SessionState) -> ValidationResult"

  python:
    class: "E2EEManager"
    methods:
      - "__init__(self, config: dict)"
      - "process_sessionstate(self, sessionstate: dict, context: dict) -> dict"
      - "encrypt_red_sections(self, sessionstate: dict, sections: list) -> dict"
      - "decrypt_red_sections(self, encrypted_sections: dict, context: dict) -> dict"
      - "validate_encryption(self, sessionstate: dict) -> dict"

# Testing Requirements
testing:
  unit_tests:
    - "Privacy band detection accuracy"
    - "Selective encryption logic"
    - "Key selection and management"
    - "Error handling and recovery"
    - "Performance within budgets"

  integration_tests:
    - "Full SessionState E2EE processing"
    - "Key lifecycle integration"
    - "Audit logging completeness"
    - "Performance under load"
    - "Concurrent SessionState processing"

  security_tests:
    - "Encryption strength and integrity"
    - "Access control enforcement"
    - "Tamper detection"
    - "Key compromise handling"
    - "GDPR/HIPAA compliance"

  performance_tests:
    - "Encryption/decryption latency"
    - "Throughput under load"
    - "Memory usage during operations"
    - "Cache effectiveness"
    - "Hardware acceleration utilization"

# Dependencies
dependencies:
  upstream:
    - "band_detection.yml: Detects privacy bands"
    - "section_selection.yml: Identifies sections to encrypt"
    - "key_storage.yml: Provides encryption keys"
    - "e2ee_audit_logger.yml: Logs operations"
  downstream:
    - "sessionstate_integration.yml: Integrates with SessionState processing"
    - "parallel_encryption.yml: Handles parallel encryption"
    - "graceful_degradation.yml: Handles failures"

# Success Criteria
success_criteria:
  functional:
    - "RED sections encrypted selectively"
    - "AMBER/GREEN sections remain unencrypted"
    - "Encryption/decryption operations work correctly"
    - "Key management integration works"
    - "Error handling robust"

  security:
    - "AES-256-GCM encryption with authentication"
    - "Access controls enforced"
    - "Data integrity protected"
    - "Complete audit trail"
    - "GDPR/HIPAA compliance"

  performance:
    - "Operations within latency budgets"
    - "High throughput for SessionState processing"
    - "Efficient key caching"
    - "Hardware acceleration utilized"

  reliability:
    - "Error recovery works"
    - "Graceful degradation functions"
    - "Monitoring and alerting effective"
    - "Concurrent access safe"
