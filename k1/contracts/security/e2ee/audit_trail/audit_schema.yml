---
# ADR-0036: Audit Schema Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Audit Schema Contract
# Defines the data schema and structure for E2EE audit trails

contract:
  name: audit_schema
  version: "1.0.0"
  description: "Data schema and structure definitions for E2EE audit trails"
  parent_adr: "ADR-0036"
  priority: "HIGH"
  effort: "2 weeks"

# Core Audit Event Schema
audit_event_schema:
  version: "1.0"
  schema_type: "JSON Schema Draft 7"
  id: "https://familyos.org/schemas/audit/e2ee-event-v1.0.json"

  properties:
    event_id:
      type: "string"
      format: "uuid"
      description: "Unique event identifier"
      required: true

    timestamp:
      type: "string"
      format: "date-time"
      description: "Event timestamp in ISO 8601 format"
      required: true

    event_type:
      type: "string"
      enum: ["KEY_LIFECYCLE", "ENCRYPTION", "ACCESS", "SECURITY", "SYSTEM"]
      description: "Audit event category"
      required: true

    event_subtype:
      type: "string"
      description: "Specific event type within category"
      required: true
      examples: ["key_created", "encryption_completed", "data_accessed"]

    severity:
      type: "string"
      enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
      description: "Event severity level"
      default: "MEDIUM"

    user_context:
      type: "object"
      description: "User-related context information"
      properties:
        user_id:
          type: "string"
          format: "uuid"
          description: "User identifier"
        user_type:
          type: "string"
          enum: ["HUMAN", "SERVICE", "SYSTEM"]
          description: "Type of user"
        session_id:
          type: "string"
          format: "uuid"
          description: "User session identifier"
        ip_address:
          type: "string"
          format: "ipv4"
          description: "Client IP address"
        user_agent:
          type: "string"
          description: "Client user agent"
        geo_location:
          type: "object"
          properties:
            country:
              type: "string"
              description: "ISO 3166-1 alpha-2 country code"
            region:
              type: "string"
              description: "Region/state"
            city:
              type: "string"
              description: "City name"

    resource_context:
      type: "object"
      description: "Resource-related context information"
      properties:
        space_id:
          type: "string"
          format: "uuid"
          description: "Space identifier"
        sessionstate_id:
          type: "string"
          format: "uuid"
          description: "SessionState identifier"
        section_path:
          type: "string"
          description: "Section path within SessionState"
        resource_type:
          type: "string"
          enum: ["SESSIONSTATE", "KEY", "METADATA", "CONFIG"]
          description: "Type of resource affected"

    cryptographic_context:
      type: "object"
      description: "Cryptographic operation context"
      properties:
        algorithm:
          type: "string"
          enum: ["AES-256-GCM", "RSA-2048", "HMAC-SHA256"]
          description: "Cryptographic algorithm used"
        key_fingerprint:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
          description: "SHA256 fingerprint of key"
        key_version:
          type: "integer"
          minimum: 1
          description: "Key version number"
        operation_mode:
          type: "string"
          enum: ["ENCRYPT", "DECRYPT", "SIGN", "VERIFY"]
          description: "Cryptographic operation mode"

    operation_details:
      type: "object"
      description: "Detailed operation information"
      properties:
        operation_id:
          type: "string"
          format: "uuid"
          description: "Unique operation identifier"
        start_time:
          type: "string"
          format: "date-time"
          description: "Operation start timestamp"
        end_time:
          type: "string"
          format: "date-time"
          description: "Operation end timestamp"
        duration_ms:
          type: "integer"
          minimum: 0
          description: "Operation duration in milliseconds"
        data_size_bytes:
          type: "integer"
          minimum: 0
          description: "Size of data processed"
        sections_processed:
          type: "integer"
          minimum: 0
          description: "Number of sections processed"
        performance_metrics:
          type: "object"
          properties:
            cpu_usage_percent:
              type: "number"
              minimum: 0
              maximum: 100
            memory_usage_mb:
              type: "number"
              minimum: 0
            io_operations:
              type: "integer"
              minimum: 0

    result:
      type: "object"
      description: "Operation result information"
      properties:
        status:
          type: "string"
          enum: ["SUCCESS", "FAILURE", "PARTIAL_SUCCESS", "DENIED", "TIMEOUT"]
          required: true
        error_code:
          type: "string"
          description: "Machine-readable error code"
        error_message:
          type: "string"
          description: "Human-readable error message"
        affected_resources:
          type: "array"
          items:
            type: "string"
          description: "Resources affected by operation"

    compliance_context:
      type: "object"
      description: "Compliance and regulatory context"
      properties:
        compliance_requirements:
          type: "array"
          items:
            type: "string"
            enum: ["GDPR", "HIPAA", "PCI_DSS", "SOX", "BYOK"]
          description: "Applicable compliance requirements"
        data_classification:
          type: "string"
          enum: ["PUBLIC", "INTERNAL", "CONFIDENTIAL", "RESTRICTED"]
          description: "Data classification level"
        retention_category:
          type: "string"
          enum: ["STANDARD", "EXTENDED", "PERMANENT"]
          description: "Audit retention category"

    custom_fields:
      type: "object"
      description: "Event-specific custom fields"
      additionalProperties: true
      maxProperties: 50

  required: ["event_id", "timestamp", "event_type", "event_subtype", "result"]

# Schema Extensions
schema_extensions:
  key_lifecycle_events:
    additional_properties:
      key_metadata:
        type: "object"
        properties:
          key_type:
            type: "string"
            enum: ["AES256", "HMAC", "RSA_PUBLIC", "RSA_PRIVATE"]
          key_purpose:
            type: "string"
            enum: ["ENCRYPTION", "SIGNATURE", "DERIVATION"]
          storage_backend:
            type: "string"
            enum: ["OS_KEYCHAIN", "ENCRYPTED_FILE", "LOCAL_HSM"]
          predecessor_key:
            type: "string"
            format: "uuid"
          successor_key:
            type: "string"
            format: "uuid"

  encryption_events:
    additional_properties:
      encryption_details:
        type: "object"
        properties:
          sections_encrypted:
            type: "array"
            items:
              type: "string"
            description: "Paths of sections encrypted"
          total_data_size:
            type: "integer"
            description: "Total size of encrypted data"
          compression_ratio:
            type: "number"
            minimum: 0
            description: "Data compression ratio"
          hardware_accelerated:
            type: "boolean"
            description: "Whether hardware acceleration was used"

  access_events:
    additional_properties:
      access_details:
        type: "object"
        properties:
          access_type:
            type: "string"
            enum: ["READ", "WRITE", "DELETE", "ADMIN"]
          authorization_method:
            type: "string"
            enum: ["OWNER", "DELEGATE", "ADMIN", "EMERGENCY"]
          consent_provided:
            type: "boolean"
            description: "Whether user consent was provided"
          access_duration_ms:
            type: "integer"
            description: "Duration of data access"

  security_events:
    additional_properties:
      security_details:
        type: "object"
        properties:
          incident_type:
            type: "string"
            enum: ["BREACH_ATTEMPT", "UNAUTHORIZED_ACCESS", "DATA_TAMPERING", "KEY_COMPROMISE"]
          threat_level:
            type: "string"
            enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
          affected_users:
            type: "integer"
            description: "Number of users affected"
          remediation_actions:
            type: "array"
            items:
              type: "string"
            description: "Actions taken to remediate"

# Schema Validation
schema_validation:
  validation_rules:
    - "All required fields must be present"
    - "Data types must match schema specifications"
    - "Enum values must be from allowed list"
    - "Format validations must pass (UUID, date-time, etc.)"
    - "Custom fields limited to 50 properties maximum"
    - "Nested objects must conform to their schemas"

  validation_modes:
    strict: "Reject events that don't conform to schema"
    lenient: "Accept events but log schema violations"
    adaptive: "Learn from violations and update schema"

  validation_performance:
    validation_time: "< 5ms per event"
    memory_usage: "< 1MB per validation"
    error_reporting: "Detailed error messages for debugging"

# Schema Evolution
schema_evolution:
  versioning:
    semantic_versioning: "MAJOR.MINOR.PATCH"
    backward_compatibility: "New versions backward compatible"
    migration_support: "Automatic migration of old events"

  extension_mechanism:
    custom_properties: "Allow custom fields in events"
    schema_additions: "Add new optional fields"
    enum_expansion: "Add new values to enums"
    deprecation_policy: "Deprecate old fields with warnings"

  migration_rules:
    automatic_migration: "Migrate old events to new schema"
    migration_logging: "Log migration operations"
    rollback_support: "Rollback migrations if needed"
    data_integrity: "Ensure data integrity during migration"

# Storage Schema
storage_schema:
  database_schema:
    table: "e2ee_audit_events"
    columns:
      - name: "event_id"
        type: "UUID PRIMARY KEY"
        indexed: true
      - name: "timestamp"
        type: "TIMESTAMPTZ"
        indexed: true
      - name: "event_type"
        type: "VARCHAR(50)"
        indexed: true
      - name: "event_subtype"
        type: "VARCHAR(100)"
        indexed: true
      - name: "user_id"
        type: "UUID"
        indexed: true
        nullable: true
      - name: "space_id"
        type: "UUID"
        indexed: true
        nullable: true
      - name: "sessionstate_id"
        type: "UUID"
        indexed: true
        nullable: true
      - name: "event_data"
        type: "JSONB"
        description: "Complete event data as JSON"
      - name: "created_at"
        type: "TIMESTAMPTZ"
        default: "NOW()"

  indexes:
    - name: "idx_audit_timestamp"
      columns: ["timestamp"]
      type: "BRIN"
    - name: "idx_audit_user_time"
      columns: ["user_id", "timestamp"]
      type: "BTREE"
    - name: "idx_audit_space_time"
      columns: ["space_id", "timestamp"]
      type: "BTREE"
    - name: "idx_audit_event_type"
      columns: ["event_type", "timestamp"]
      type: "BTREE"
    - name: "idx_audit_sessionstate"
      columns: ["sessionstate_id"]
      type: "HASH"

  partitioning:
    strategy: "Time-based partitioning"
    interval: "Monthly partitions"
    retention: "7 years online, 10+ years archive"
    compression: "LZ4 compression for old partitions"

# Query Schema
query_schema:
  query_parameters:
    time_range:
      start_time: "datetime"
      end_time: "datetime"
      description: "Query events within time range"

    filters:
      event_type: "string[]"
      event_subtype: "string[]"
      user_id: "uuid[]"
      space_id: "uuid[]"
      severity: "string[]"
      status: "string[]"

    pagination:
      limit: "integer (max 1000)"
      offset: "integer"
      sort_by: "string (timestamp, event_type, etc.)"
      sort_order: "ASC|DESC"

  query_response:
    events: "AuditEvent[]"
    total_count: "integer"
    has_more: "boolean"
    query_time_ms: "integer"
    schema_version: "string"

# Implementation Interface
implementation:
  rust:
    struct: "AuditEvent"
    functions:
      - "validate(&self) -> Result<(), ValidationError>"
      - "serialize(&self) -> Result<String, SerializationError>"
      - "deserialize(json: &str) -> Result<Self, DeserializationError>"
      - "migrate_from_version(&self, from_version: &str) -> Result<Self, MigrationError>"

  python:
    class: "AuditEvent"
    methods:
      - "validate(self) -> None"
      - "to_dict(self) -> dict"
      - "from_dict(data: dict) -> AuditEvent"
      - "migrate(self, from_version: str) -> AuditEvent"

# Testing Requirements
testing:
  unit_tests:
    - "Schema validation for all event types"
    - "Serialization/deserialization accuracy"
    - "Schema evolution and migration"
    - "Query schema functionality"
    - "Storage schema operations"

  integration_tests:
    - "Full audit event lifecycle"
    - "Schema validation in audit pipeline"
    - "Query performance with schema"
    - "Migration of historical events"
    - "Storage and retrieval with schema"

  validation_tests:
    - "Schema compliance for all events"
    - "Backward compatibility testing"
    - "Performance impact of validation"
    - "Error handling for invalid events"

  evolution_tests:
    - "Schema version upgrades"
    - "Migration accuracy and performance"
    - "Rollback capability testing"
    - "Multi-version coexistence"

# Dependencies
dependencies:
  upstream:
    - "e2ee_audit_logger.yml: Uses audit schema for logging"
  downstream:
    - "gdpr_compliance.yml: GDPR-specific schema requirements"
    - "hipaa_compliance.yml: HIPAA-specific schema requirements"
    - "compliance_metrics.yml: Schema for compliance metrics"

# Success Criteria
success_criteria:
  functional:
    - "All audit events conform to schema"
    - "Schema validation works correctly"
    - "Schema evolution maintains compatibility"
    - "Queries work efficiently with schema"

  data_integrity:
    - "Schema prevents invalid data entry"
    - "Migrations preserve data integrity"
    - "Storage schema supports all queries"
    - "Partitioning and retention work correctly"

  performance:
    - "Schema validation within performance budgets"
    - "Storage operations efficient"
    - "Query performance meets requirements"
    - "Migration operations fast"

  maintainability:
    - "Schema easily extensible"
    - "Clear documentation of all fields"
    - "Version control for schema changes"
    - "Automated validation and testing"
