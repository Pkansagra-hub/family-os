---
# ADR-0036: E2EE Audit Logger Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# E2EE Audit Logger Contract
# Defines comprehensive audit logging for E2EE operations

contract:
  name: e2ee_audit_logger
  version: "1.0.0"
  description: "Comprehensive audit logging system for E2EE encryption operations"
  parent_adr: "ADR-0036"
  priority: "CRITICAL"
  effort: "3 weeks"

# Audit Event Types
audit_event_types:
  key_lifecycle_events:
    key_created: "New encryption key generated"
    key_stored: "Key stored in backend"
    key_retrieved: "Key retrieved for use"
    key_rotated: "Key rotated to new version"
    key_revoked: "Key revoked and marked unusable"
    key_deleted: "Key permanently deleted"

  encryption_events:
    encryption_started: "Encryption operation initiated"
    encryption_completed: "Encryption operation successful"
    encryption_failed: "Encryption operation failed"
    decryption_started: "Decryption operation initiated"
    decryption_completed: "Decryption operation successful"
    decryption_failed: "Decryption operation failed"

  access_events:
    data_accessed: "Encrypted data accessed by user"
    data_modified: "Encrypted data modified"
    permission_granted: "Access permission granted"
    permission_denied: "Access permission denied"
    consent_given: "User consent for E2EE given"
    consent_revoked: "User consent for E2EE revoked"

  security_events:
    bypass_activated: "Encryption bypass activated"
    bypass_deactivated: "Encryption bypass deactivated"
    degradation_started: "System entered degradation mode"
    degradation_ended: "System exited degradation mode"
    security_incident: "Security incident detected"

  system_events:
    system_started: "E2EE system initialized"
    system_stopped: "E2EE system shut down"
    config_changed: "E2EE configuration modified"
    maintenance_mode: "System entered maintenance mode"

# Audit Event Schema
audit_event_schema:
  event_id:
    type: "UUID"
    description: "Unique identifier for the audit event"
    format: "RFC 4122 UUID v4"

  timestamp:
    type: "timestamp"
    description: "Event timestamp in UTC"
    format: "ISO 8601 with microsecond precision"

  event_type:
    type: "enum"
    values: ["KEY_LIFECYCLE", "ENCRYPTION", "ACCESS", "SECURITY", "SYSTEM"]
    description: "Category of audit event"

  event_subtype:
    type: "string"
    description: "Specific event type within category"
    examples: ["key_created", "encryption_completed", "data_accessed"]

  user_id:
    type: "UUID"
    description: "User initiating or affected by the event"
    nullable: true

  space_id:
    type: "UUID"
    description: "Space context for the event"
    nullable: true

  sessionstate_id:
    type: "UUID"
    description: "SessionState involved in the event"
    nullable: true

  key_fingerprint:
    type: "string"
    description: "Hash of encryption key used"
    format: "SHA256 hex string"
    nullable: true

  operation_details:
    type: "object"
    description: "Detailed information about the operation"
    properties:
      algorithm: "Encryption algorithm used"
      key_size: "Key size in bits"
      data_size: "Size of data processed"
      sections_affected: "List of sections affected"
      performance_metrics: "Timing and performance data"

  result:
    type: "enum"
    values: ["SUCCESS", "FAILURE", "PARTIAL", "DENIED"]
    description: "Outcome of the operation"

  error_details:
    type: "object"
    description: "Error information if operation failed"
    nullable: true
    properties:
      error_code: "Machine-readable error code"
      error_message: "Human-readable error description"
      stack_trace: "Stack trace for debugging"

  ip_address:
    type: "string"
    description: "Client IP address"
    format: "IPv4 or IPv6"

  user_agent:
    type: "string"
    description: "Client user agent string"
    nullable: true

  geo_location:
    type: "object"
    description: "Geographic location information"
    nullable: true
    properties:
      country: "ISO 3166-1 alpha-2 country code"
      region: "Region/state code"
      city: "City name"

  compliance_flags:
    type: "array"
    items: "string"
    description: "Compliance requirements for this event"
    values: ["GDPR", "HIPAA", "PCI_DSS", "SOX", "BYOK"]

  custom_fields:
    type: "object"
    description: "Additional event-specific fields"
    additional_properties: true

# Audit Storage
audit_storage:
  storage_backends:
    primary_storage:
      type: "Encrypted database"
      encryption: "AES-256-GCM with separate audit key"
      retention: "7 years for GDPR/HIPAA compliance"
      indexing: "Full indexing for efficient queries"

    secondary_storage:
      type: "Immutable log storage"
      format: "Append-only log files"
      integrity: "Cryptographic hashing for tamper detection"
      retention: "Permanent storage for critical events"

    tertiary_storage:
      type: "Off-site backup"
      frequency: "Daily backup of audit logs"
      encryption: "Separate encryption from primary"
      retention: "10+ years for regulatory requirements"

  storage_format:
    serialization: "JSON with schema validation"
    compression: "LZ4 compression for storage efficiency"
    partitioning: "Partition by date and event type"
    indexing: "Multi-column indexes for common queries"

# Audit Query Interface
audit_query_interface:
  query_types:
    event_lookup:
      function: "get_event(event_id: str) -> AuditEvent"
      description: "Retrieve specific audit event"

    time_range_query:
      function: "query_events(start_time: datetime, end_time: datetime, filters: dict) -> list[AuditEvent]"
      description: "Query events within time range"

    user_activity_query:
      function: "get_user_activity(user_id: str, start_time: datetime, end_time: datetime) -> list[AuditEvent]"
      description: "Get all activity for a user"

    security_incident_query:
      function: "get_security_events(start_time: datetime, end_time: datetime, severity: str) -> list[AuditEvent]"
      description: "Query security-related events"

    compliance_report_query:
      function: "get_compliance_events(compliance_type: str, start_time: datetime, end_time: datetime) -> list[AuditEvent]"
      description: "Query events for compliance reporting"

  query_filters:
    event_type: "Filter by event type/category"
    user_id: "Filter by user"
    space_id: "Filter by space"
    result: "Filter by operation result"
    ip_address: "Filter by IP address"
    geo_location: "Filter by geographic location"

  query_performance:
    index_usage: "Queries use database indexes"
    pagination: "Support for paginated results"
    timeout: "Query timeout protection"
    rate_limiting: "Prevent audit log abuse"

# Real-time Audit Streaming
real_time_streaming:
  streaming_endpoints:
    websocket_stream:
      url: "/api/v1/audit/stream"
      authentication: "JWT token required"
      filters: "Real-time event filtering"
      backpressure: "Handle slow consumers"

    webhook_notifications:
      configuration: "Configurable webhook URLs"
      retry_logic: "Retry failed webhook deliveries"
      batching: "Batch multiple events for efficiency"
      security: "HMAC-signed webhook payloads"

    event_bus_integration:
      topic: "audit.events"
      partitioning: "Partition by event type"
      retention: "Configurable message retention"
      consumers: "Multiple consumer support"

  streaming_filters:
    event_type_filter: "Only stream specific event types"
    user_filter: "Only stream events for specific users"
    severity_filter: "Only stream events above severity threshold"
    space_filter: "Only stream events for specific spaces"

# Audit Integrity
audit_integrity:
  tamper_detection:
    cryptographic_hashes: "SHA256 hash chain for log integrity"
    merkle_trees: "Merkle tree for batch integrity verification"
    digital_signatures: "Sign audit logs with audit key"
    timestamp_authority: "Trusted timestamping service"

  integrity_verification:
    periodic_checks: "Daily integrity verification"
    on_demand_verification: "API for integrity verification"
    alert_on_tampering: "Immediate alerts for tampering detection"
    recovery_procedures: "Procedures for handling compromised logs"

  chain_of_custody:
    log_access_logging: "Log all access to audit logs"
    export_controls: "Controlled audit log export"
    backup_integrity: "Verify backup integrity"
    archival_procedures: "Secure long-term archival"

# Performance Requirements
performance_requirements:
  logging_latency:
    sync_logging: "< 10ms per event"
    async_logging: "< 1ms per event (queued)"
    batch_logging: "< 5ms per batch"

  query_performance:
    simple_queries: "< 100ms"
    complex_queries: "< 1 second"
    large_result_sets: "< 10 seconds with pagination"

  storage_performance:
    write_throughput: "10,000 events/second"
    storage_efficiency: "< 1KB per event average"
    retention_overhead: "Minimal overhead for long retention"

  streaming_performance:
    real_time_latency: "< 100ms end-to-end"
    throughput: "1,000 events/second per stream"
    concurrent_consumers: "100+ concurrent streaming consumers"

# Security and Access Control
security_access_control:
  access_policies:
    admin_access: "Full audit log access for administrators"
    security_access: "Access for security investigations"
    compliance_access: "Access for compliance officers"
    user_access: "Limited access to own audit events"

  authentication:
    multi_factor: "MFA required for audit access"
    session_limits: "Time and location restrictions"
    audit_access_logging: "Log all audit system access"

  encryption:
    data_at_rest: "Audit logs encrypted at rest"
    data_in_transit: "TLS 1.3 for audit API access"
    key_separation: "Separate keys for audit encryption"

  data_protection:
    pii_masking: "Mask PII in audit logs"
    data_minimization: "Minimize stored audit data"
    retention_limits: "Automatic cleanup after retention"

# Implementation Interface
implementation:
  rust:
    struct: "E2EEAuditLogger"
    functions:
      - "new(config: AuditConfig) -> Result<Self, AuditError>"
      - "log_event(&self, event: AuditEvent) -> Result<EventId, AuditError>"
      - "query_events(&self, query: AuditQuery) -> Result<Vec<AuditEvent>, AuditError>"
      - "verify_integrity(&self, start_time: DateTime, end_time: DateTime) -> IntegrityReport"
      - "stream_events(&self, filters: StreamFilters) -> EventStream"

  python:
    class: "E2EEAuditLogger"
    methods:
      - "__init__(self, config: dict)"
      - "log_event(self, event: dict) -> str"
      - "query_events(self, query: dict) -> list"
      - "verify_integrity(self, start_time: str, end_time: str) -> dict"
      - "stream_events(self, filters: dict) -> object"

# Testing Requirements
testing:
  unit_tests:
    - "Event logging functionality"
    - "Query interface accuracy"
    - "Integrity verification"
    - "Performance within budgets"
    - "Error handling robustness"

  integration_tests:
    - "Full audit trail for E2EE operations"
    - "Real-time streaming functionality"
    - "Query performance under load"
    - "Integrity verification across restarts"
    - "Backup and recovery procedures"

  security_tests:
    - "Access control enforcement"
    - "Audit log encryption"
    - "Tamper detection accuracy"
    - "Data protection compliance"
    - "Chain of custody maintenance"

  performance_tests:
    - "Logging latency under load"
    - "Query performance scaling"
    - "Streaming throughput"
    - "Storage efficiency"
    - "Concurrent access handling"

# Dependencies
dependencies:
  upstream:
    - "e2ee_manager.yml: Provides events to audit"
    - "key_storage.yml: Audit key operations"
    - "encryption_bypass.yml: Audit bypass operations"
  downstream:
    - "audit_schema.yml: Defines audit data schema"
    - "gdpr_compliance.yml: GDPR audit requirements"
    - "hipaa_compliance.yml: HIPAA audit requirements"

# Success Criteria
success_criteria:
  functional:
    - "All E2EE operations fully audited"
    - "Audit queries perform efficiently"
    - "Real-time streaming works reliably"
    - "Integrity verification detects tampering"

  security:
    - "Audit logs tamper-proof"
    - "Access controls properly enforced"
    - "Data encrypted and protected"
    - "Chain of custody maintained"

  compliance:
    - "GDPR/HIPAA audit requirements met"
    - "7-year retention capability"
    - "Complete audit trail for investigations"
    - "Regulatory reporting support"

  performance:
    - "Logging within latency budgets"
    - "Queries within performance budgets"
    - "Streaming scales to requirements"
    - "Storage efficient for long retention"
