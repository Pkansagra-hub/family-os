#
# Privacy Band Enumeration
# EPIC 2.5.1: Capability Token Design Contracts
# ADR-0010c: Capability Enforcement at Runtime
#
# Purpose: Define privacy classification levels for resources
# Foundation: Privacy Band Classification (Multi-tier security)
# Usage: Capabilities must satisfy privacy band requirements for access
#

metadata:
  title: "Privacy Band Enumeration"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-12"
  adr_references:
    - "ADR-0010: Capability-Based Security"
    - "ADR-0010c: Capability Enforcement at Runtime"

privacy_bands:
  green:
    classification: "PUBLIC"
    description: "Unrestricted public data (no privacy concerns)"
    access_policy: "Any capability satisfying basic constraints"
    examples:
      - "LLM model names (gpt-4o, gemma-2b)"
      - "Public tool results (weather data)"
      - "Generic memory section (instructions)"
    enforcement: "No additional access control"
    approval_required: false
    audit_required: false

  amber:
    classification: "SENSITIVE"
    description: "Sensitive data (requires careful access control)"
    access_policy: "Explicit capability grant required"
    examples:
      - "User identity (agent_id, session_id)"
      - "Tool parameters (user_id, order_id)"
      - "Financial data (budget tracking)"
      - "Session state (beliefs, personas)"
    enforcement: "Capability must explicitly list resource"
    approval_required_for: ["write", "delete"]
    approval_required: false
    audit_required: true

  red:
    classification: "CONFIDENTIAL"
    description: "Highly sensitive data (requires explicit user approval)"
    access_policy: "Capability grant requires user authorization"
    examples:
      - "User credentials (API keys, tokens)"
      - "PII (payment method, email)"
      - "Personal memory (preferences, history)"
      - "Escalation decisions"
    enforcement: "Capability must have user_approval=true"
    approval_required_for: ["read", "write", "delete"]
    approval_required: true
    user_confirmation_needed: true
    audit_required: true

  black:
    classification: "FORBIDDEN"
    description: "Prohibited operations (auto-denied)"
    access_policy: "Access denied regardless of capability"
    examples:
      - "Supervisor override bypasses (cannot bypass supervisor)"
      - "Agent self-termination (cannot self-terminate)"
      - "Session force-end (requires supervisor only)"
    enforcement: "Reference monitor blocks at all boundaries"
    approval_required: false
    audit_required: true
    always_denied: true

band_enforcement_rules:
  for_green:
    pre_access: "Check basic constraint satisfaction (timeout, cost)"
    require_capability_explicit: false
    require_approval: false
    cache_validation: true
    ttl_seconds: 3600

  for_amber:
    pre_access: "Check capability mentions resource"
    require_capability_explicit: true
    require_approval: false
    cache_validation: false
    ttl_seconds: 60
    audit_log_level: "INFO"

  for_red:
    pre_access: "Check user_approval flag, verify user context"
    require_capability_explicit: true
    require_approval: true
    require_user_confirmation: true
    cache_validation: false
    ttl_seconds: 30
    audit_log_level: "WARNING"

  for_black:
    pre_access: "Auto-deny, log security event"
    require_capability_explicit: false
    require_approval: false
    always_deny: true
    cache_validation: false
    audit_log_level: "ALERT"

band_assignment_by_resource_type:
  TOOL:
    green_examples:
      - "search_web (public search)"
      - "get_weather (public data)"
    amber_examples:
      - "book_hotel (user context)"
      - "create_event (personal calendar)"
    red_examples:
      - "charge_payment (financial)"
      - "send_email (contact info)"
    black_examples:
      - "terminate_agent (admin only)"
      - "override_decision (forbidden)"

  MEMORY:
    green_examples:
      - "instructions (generic)"
      - "system_info (metadata)"
    amber_examples:
      - "beliefs (session state)"
      - "scoreboard (session tracking)"
    red_examples:
      - "preferences (user settings)"
      - "history (session history)"
    black_examples:
      - "master_key (forbidden)"

  LLM:
    green_examples:
      - "gemma-2b (public model)"
      - "model_list (metadata)"
    amber_examples:
      - "gpt-4o (cost tracking)"
    red_examples: []
    black_examples: []

  K0_WAL:
    green_examples: []
    amber_examples:
      - "general_events (session events)"
    red_examples:
      - "security_events (authorization)"
    black_examples: []

band_migration_rules:
  green_to_amber: "Allowed (more restrictive)"
  green_to_red: "Allowed (more restrictive)"
  amber_to_green: "NOT allowed (less restrictive)"
  amber_to_red: "Allowed (more restrictive)"
  red_to_amber: "NOT allowed (less restrictive)"
  red_to_black: "Allowed (forbidden)"

audit_requirements_per_band:
  green:
    log_on_access: false
    log_on_denied: false
    retention_days: 0

  amber:
    log_on_access: true
    log_on_denied: true
    retention_days: 30
    includes: ["capability_id", "agent_id", "resource", "operation"]

  red:
    log_on_access: true
    log_on_denied: true
    retention_days: 90
    includes: ["capability_id", "agent_id", "resource", "operation", "user_id", "approval_status"]

  black:
    log_on_access: true
    log_on_denied: true
    retention_days: 365
    includes: ["attempt_timestamp", "agent_id", "resource", "attempted_operation", "denial_reason", "severity_level"]

enforcement_points_band_validation:
  tool_runner:
    validates_band: "TOOL resource band"
    enforcement_level: "GREEN|AMBER|RED"
    check_user_approval: "if RED"

  memory_manager:
    validates_band: "MEMORY section band"
    enforcement_level: "GREEN|AMBER|RED|BLACK"
    check_user_approval: "if RED"

  model_hub:
    validates_band: "LLM resource band"
    enforcement_level: "GREEN|AMBER"

  k0_bridge:
    validates_band: "WAL event band"
    enforcement_level: "GREEN|AMBER|RED"
    check_user_approval: "if RED"

references:
  adr_0010: "Capability-Based Security"
  adr_0010c: "Capability Enforcement at Runtime"
