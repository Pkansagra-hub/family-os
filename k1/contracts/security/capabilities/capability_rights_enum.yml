#
# Capability Rights Enumeration
# EPIC 2.5.1: Capability Token Design Contracts
# ADR-0010c: Capability Enforcement at Runtime
#
# Purpose: Define standard rights that can be granted via capabilities
# Foundation: Object-Capability Model (Miller et al. 2003)
# Usage: Capabilities specify which rights (execute, read, write, etc.) are allowed
#

metadata:
  title: "Capability Rights Enumeration"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-12"
  adr_references:
    - "ADR-0010: Capability-Based Security"
    - "ADR-0010c: Capability Enforcement at Runtime"

rights_enumeration:
  execute:
    description: "Execute/invoke operation (tool call, LLM inference)"
    applies_to: ["TOOL", "LLM", "MCP"]
    examples:
      - "Tool: execute_tool(book_hotel)"
      - "LLM: generate(model=gpt-4o)"
      - "MCP: call_mcp_endpoint()"
    enforcement: "Checked before operation execution"

  read:
    description: "Read data or results (memory section, LLM output)"
    applies_to: ["TOOL", "MEMORY", "LLM", "K0_WAL"]
    examples:
      - "Memory: read_section(beliefs)"
      - "Tool: read_tool_result()"
      - "LLM: read_inference_output()"
    enforcement: "Checked before data access"

  write:
    description: "Write/modify data (memory section, state)"
    applies_to: ["MEMORY", "K0_WAL"]
    examples:
      - "Memory: write_section(scoreboard, data)"
      - "K0_WAL: write_event(event)"
    enforcement: "Checked before write operation"

  delete:
    description: "Delete data (memory section, event)"
    applies_to: ["MEMORY", "K0_WAL"]
    examples:
      - "Memory: delete_section(persona)"
      - "K0_WAL: delete_event(event_id)"
    enforcement: "Checked before deletion"

  delegate:
    description: "Delegate capability to another agent (create child capability)"
    applies_to: ["TOOL", "MEMORY", "LLM", "K0_WAL", "MCP"]
    examples:
      - "Orchestrator delegates TOOL:book_hotel to sub-agent"
      - "Planning agent delegates LLM:gpt-4o-mini to sub-planner"
    enforcement: "Checked before capability delegation"
    constraints:
      - "delegation_depth < 3 (max 3 levels)"
      - "Child capabilities cannot gain new rights"

  attenuate:
    description: "Create weaker version of capability (reduce rights, tighten constraints)"
    applies_to: ["TOOL", "MEMORY", "LLM", "K0_WAL", "MCP"]
    examples:
      - "Attenuate TOOL:charge_payment to max_cost=50.0 (original 100.0)"
      - "Attenuate LLM:gpt-4o to budget_usd=0.50 (original 1.0)"
    enforcement: "Checked during capability attenuation"
    rules:
      - "Can only reduce rights (intersection)"
      - "Can only add constraints (merge more restrictively)"

  admin:
    description: "Administrative rights (grant, revoke, audit capabilities)"
    applies_to: ["TOOL", "MEMORY", "LLM", "K0_WAL", "MCP"]
    examples:
      - "Supervisor: revoke_capability(cap_id)"
      - "Supervisor: grant_capability(agent, resource, rights)"
    enforcement: "Restricted to supervisor agent only"
    restricted_to: ["supervisor_agent"]

rights_by_resource_type:
  TOOL:
    allowed_rights: ["execute", "read", "delegate", "attenuate"]
    required_for_operation: ["execute"]
    examples:
      - "Tool execution requires EXECUTE right"
      - "Delegation requires DELEGATE right"

  MEMORY:
    allowed_rights: ["read", "write", "delete", "delegate", "attenuate"]
    required_for_operation:
      - "read_section requires READ right"
      - "write_section requires WRITE right"
      - "delete_section requires DELETE right"

  LLM:
    allowed_rights: ["execute", "read", "delegate", "attenuate"]
    required_for_operation: ["execute"]
    examples:
      - "LLM inference requires EXECUTE right"
      - "Reading output requires READ right"

  K0_WAL:
    allowed_rights: ["read", "write", "delegate", "attenuate"]
    required_for_operation:
      - "Reading WAL requires READ right"
      - "Writing events requires WRITE right"

  MCP:
    allowed_rights: ["execute", "read", "delegate", "attenuate"]
    required_for_operation: ["execute"]

default_rights_by_role:
  planning_agent:
    TOOL:
      - "execute"
      - "read"
    LLM:
      - "execute"
      - "read"
    MEMORY:
      - "read"

  tool_agent:
    TOOL:
      - "execute"
      - "read"
    MEMORY:
      - "write"

  memory_agent:
    MEMORY:
      - "read"
      - "write"
    K0_WAL:
      - "read"

  supervisor_agent:
    TOOL:
      - "execute"
      - "read"
      - "delegate"
      - "attenuate"
      - "admin"
    MEMORY:
      - "read"
      - "write"
      - "delete"
      - "delegate"
      - "attenuate"
      - "admin"
    LLM:
      - "execute"
      - "read"
      - "delegate"
      - "attenuate"
      - "admin"
    K0_WAL:
      - "read"
      - "write"
      - "delete"
      - "delegate"
      - "attenuate"
      - "admin"

right_combinations:
  execute_only:
    description: "Can execute but not read results or delegate"
    use_case: "Restricted tool execution (no result access)"
    example: "charge_payment with only EXECUTE right"

  execute_and_read:
    description: "Can execute and read results"
    use_case: "Standard tool/LLM usage"
    example: "Most tool and LLM capabilities"

  execute_delegate_attenuate:
    description: "Can execute, delegate to others, and attenuate"
    use_case: "Supervisor delegation"
    example: "Orchestrator with full control over capability propagation"

  read_only:
    description: "Can read but not modify"
    use_case: "Read-only memory access"
    example: "MEMORY:beliefs with READ right only"

  read_write:
    description: "Can read and write but not delete"
    use_case: "Normal memory management"
    example: "MEMORY:scoreboard with READ and WRITE"

enforcement_points:
  tool_runner:
    validates_right: "execute"
    validates_resource: "tool_name"
    fails_with: "PermissionError"

  memory_manager:
    validates_right: "read OR write"
    validates_operation: "read_section OR write_section"
    fails_with: "CapabilityError"

  model_hub:
    validates_right: "execute"
    validates_resource: "model_id"
    fails_with: "CapabilityError"

  k0_bridge:
    validates_right: "write"
    validates_operation: "write_event"
    fails_with: "CapabilityError"

references:
  adr_0010: "Capability-Based Security"
  adr_0010c: "Capability Enforcement at Runtime"
  miller_2003: "Capability Myths Demolished"
