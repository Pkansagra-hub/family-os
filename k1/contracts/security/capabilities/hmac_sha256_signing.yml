#
# HMAC-SHA256 Cryptographic Signing for Capability Tokens
# EPIC 2.5.1: Capability Token Design Contracts
# ADR-0010a: Capability Token Design & Lifecycle
#
# Purpose: Define cryptographic signing mechanism for unforgeable tokens
# Research: HMAC (RFC 2104), SHA-256 (FIPS 180-4)
# Performance: Signature generation <0.3ms, verification <0.3ms
#

metadata:
  title: "HMAC-SHA256 Signing Contract"
  version: "1.0"
  status: "accepted"
  updated: "2025-10-12"
  adr_references:
    - "ADR-0010a: Capability Token Design & Lifecycle"
  principles:
    - "Unforgeable: only server with secret key can create valid signatures"
    - "Deterministic: same input always produces same signature"
    - "Fast: <0.3ms signature generation and verification"
    - "Secure: 256-bit key space (2^256 possibilities)"

secret_key_management:
  description: "Server-side secret key for signing capability tokens"

  generation:
    algorithm: "CSPRNG (cryptographically secure random)"
    size_bits: 256
    size_bytes: 32
    example_generation: "secrets.token_bytes(32)"
    python_code: |
      import secrets
      secret_key = secrets.token_bytes(32)  # 256-bit random key

  storage:
    location: "Environment variable or secure vault"
    env_var: "K1_CAPABILITY_SECRET_KEY"
    vault_options: ["HashiCorp Vault", "AWS Secrets Manager", "Azure Key Vault"]
    security_level: "CRITICAL (must be protected)"
    access_control: "Supervisor agent only"

  rotation:
    frequency_days: 90
    procedure: "Generate new key, sign future tokens with new key, old key signs revocations for 24h"
    downtime_required: "None (overlapping key periods)"
    rollback_procedure: "Revert to previous key if necessary"

  backup:
    strategy: "Store encrypted backups in secure vault"
    frequency: "Continuous (vault handles)"
    retention_days: 365
    encryption: "AES-256 encryption at rest"

signature_algorithm:
  description: "HMAC-SHA256 for token signing"

  hmac:
    algorithm: "HMAC (Hash-based Message Authentication Code)"
    specification: "RFC 2104"
    purpose: "Ensure token authenticity and integrity"

  sha256:
    algorithm: "SHA-256 (Secure Hash Algorithm)"
    specification: "FIPS 180-4"
    output_size_bits: 256
    output_size_bytes: 32
    hexadecimal_length: 64

  combined:
    name: "HMAC-SHA256"
    jwt_algorithm: "HS256"
    security_level: "256-bit symmetric (equivalent to 256-bit asymmetric)"
    complexity: "O(n) where n = message length"

signature_generation:
  description: "Generate unforgeable signature for capability token"

  step_1_prepare_payload:
    action: "Encode JWT header and payload"
    format: "Base64URL encoding (RFC 4648)"
    example: |
      header_b64 = base64.urlsafe_b64encode(json.dumps(header)).decode()
      payload_b64 = base64.urlsafe_b64encode(json.dumps(payload)).decode()
      signing_input = f"{header_b64}.{payload_b64}"

  step_2_compute_hmac:
    action: "Compute HMAC-SHA256 of signing input"
    pseudocode: |
      import hmac
      import hashlib
      signature_hex = hmac.new(
        secret_key.encode(),
        signing_input.encode(),
        hashlib.sha256
      ).hexdigest()
    output_format: "Hexadecimal string (64 characters)"
    example_output: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

  step_3_format_signature:
    action: "Format signature as JWT signature"
    format: "sha256:{hexdigest}"
    example: "sha256:abcdef0123456789..."

  step_4_assemble_token:
    action: "Combine header.payload.signature"
    format: "Compact JWT form (3 parts separated by dots)"
    example: "eyJhbGc...iOiJKV...iOiA.eyJjYXB...fQ.abcdef..."

performance:
  generation_ms: 0.3
  verification_ms: 0.3
  target_p95_ms: 0.5

signature_verification:
  description: "Verify signature is authentic and token not tampered"

  step_1_extract_components:
    action: "Split token into header, payload, signature"
    input: "JWT token (header.payload.signature)"
    python_code: |
      parts = token.split(".")
      header_b64, payload_b64, signature = parts[0], parts[1], parts[2]

  step_2_reconstruct_signing_input:
    action: "Reconstruct the original signing input"
    input: "Header and payload parts"
    python_code: |
      signing_input = f"{header_b64}.{payload_b64}"

  step_3_recompute_hmac:
    action: "Recompute HMAC-SHA256 with secret key"
    python_code: |
      expected_signature = hmac.new(
        secret_key.encode(),
        signing_input.encode(),
        hashlib.sha256
      ).hexdigest()

  step_4_compare_signatures:
    action: "Compare recomputed signature with provided signature"
    comparison: "Constant-time comparison (prevent timing attacks)"
    python_code: |
      import secrets
      if secrets.compare_digest(expected_signature, signature_hex):
        return VALID
      else:
        raise CapabilityError("Signature verification failed")

  step_5_decode_claims:
    action: "If signature valid, decode and parse claims"
    output: "Dictionary of JWT claims"
    error_handling: "If signature invalid, raise error before decoding"

security_properties:
  authenticity:
    guarantee: "Signature proves token was issued by server"
    mechanism: "Only server with secret_key can generate valid HMAC"
    attack_resistance: "Attacker cannot forge signature without secret_key"

  integrity:
    guarantee: "Any modification to token invalidates signature"
    mechanism: "Signature computed over all claims"
    example: "Change budget_usd from 0.50 to 50.0 → HMAC changes → verification fails"

  non_repudiation:
    guarantee: "Server cannot deny issuing token"
    mechanism: "Signature proves server had secret_key at signing time"

  timing_attack_resistance:
    guarantee: "Signature comparison immune to timing attacks"
    mechanism: "Use constant-time comparison (secrets.compare_digest)"
    python_code: |
      import secrets
      secrets.compare_digest(expected, actual)  # Constant time

attack_scenarios:
  brute_force_attack:
    attack: "Attacker tries to forge signature"
    defense: "2^256 possibilities for secret_key (infeasible)"
    time_to_break_seconds: ">1000 years (with current hardware)"
    mitigation: "Use 256-bit keys, rotate every 90 days"

  replay_attack:
    attack: "Attacker replays captured token for unauthorized access"
    defense: "Token bound to agent_id, non-transferable"
    mitigation: "Verify agent_id during validation"

  tampering_attack:
    attack: "Attacker modifies token claims (e.g., increase budget)"
    defense: "Signature verification fails if any claim modified"
    mitigation: "Always verify signature before trusting claims"

  timing_attack:
    attack: "Attacker measures signature comparison time to guess correct bytes"
    defense: "Use constant-time comparison (not length-dependent)"
    mitigation: "Use secrets.compare_digest for all signature checks"

  key_compromise:
    attack: "Attacker obtains secret_key through theft/breach"
    defense: "Immediate key rotation, revoke all tokens, issue new tokens"
    mitigation: "Protect secret_key in vault, audit key access, rotate every 90 days"

algorithm_choice_justification:
  why_hmac_not_rsa:
    hmac_advantage: "Symmetric (faster), sufficient for server-side signing"
    rsa_disadvantage: "Asymmetric (slower), overkill for single server"

  why_sha256_not_md5:
    sha256_advantage: "Cryptographically strong (no known vulnerabilities)"
    md5_disadvantage: "Broken (collision attacks exist)"

  why_256bit_not_128bit:
    security_level: "256-bit key space (128-bit considered weak by modern standards)"
    future_proof: "Resistant to quantum computing (for now)"

test_vectors:
  test_vector_1:
    description: "Test vector for signature generation and verification"
    secret_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    payload_json: '{"cap_id":"cap_001","agent_id":"agent_001"}'
    expected_signature: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

implementation:
  python_code_example: |
    import hmac
    import hashlib
    import secrets
    import json
    import base64

    class CapabilitySigningManager:
      def __init__(self):
        self.secret_key = secrets.token_bytes(32)  # 256-bit key

      def sign_token(self, header, payload):
        # Encode header and payload
        header_b64 = base64.urlsafe_b64encode(
          json.dumps(header).encode()
        ).decode()
        payload_b64 = base64.urlsafe_b64encode(
          json.dumps(payload).encode()
        ).decode()

        # Create signing input
        signing_input = f"{header_b64}.{payload_b64}"

        # Generate HMAC-SHA256 signature
        signature_hex = hmac.new(
          self.secret_key,
          signing_input.encode(),
          hashlib.sha256
        ).hexdigest()

        # Return JWT token
        return f"{signing_input}.{signature_hex}"

      def verify_token(self, token):
        # Split token
        parts = token.split(".")
        if len(parts) != 3:
          raise ValueError("Invalid JWT format")

        header_b64, payload_b64, signature_hex = parts
        signing_input = f"{header_b64}.{payload_b64}"

        # Recompute signature
        expected_sig = hmac.new(
          self.secret_key,
          signing_input.encode(),
          hashlib.sha256
        ).hexdigest()

        # Constant-time comparison
        if not secrets.compare_digest(expected_sig, signature_hex):
          raise ValueError("Signature verification failed")

        # Decode and return payload
        payload_json = base64.urlsafe_b64decode(payload_b64)
        return json.loads(payload_json)

performance_benchmarks:
  signature_generation:
    payload_size_bytes: 256
    time_ms: 0.28
    p95_ms: 0.35
    p99_ms: 0.42

  signature_verification:
    payload_size_bytes: 256
    time_ms: 0.29
    p95_ms: 0.36
    p99_ms: 0.43

  combined_sign_and_verify:
    time_ms: 0.57
    target_ms: 0.6

