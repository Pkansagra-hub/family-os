hysteresis_fsm_5c_buffer:
  name: "Thermal Hysteresis FSM with 5°C Buffer"
  purpose: "Implement asymmetric hysteresis with 5°C dead band to prevent thermal flapping"
  version: "1.0"
  source_adr: "ADR-0026b"
  hysteresis_band_celsius: 5

  asymmetric_thresholds:
    upgrade_thresholds:
      cool_to_warm: "60°C (immediate upgrade on crossing)"
      warm_to_hot: "75°C (immediate upgrade on crossing)"
      hot_to_critical: "85°C (immediate upgrade on crossing)"
      critical_to_emergency: "95°C (immediate upgrade on crossing)"

    downgrade_thresholds:
      warm_to_cool: "55°C (60°C - 5°C hysteresis)"
      hot_to_warm: "70°C (75°C - 5°C hysteresis)"
      critical_to_hot: "80°C (85°C - 5°C hysteresis)"
      emergency_to_critical: "90°C (95°C - 5°C hysteresis)"

  state_machine:
    states: ["COOL", "WARM", "HOT", "CRITICAL", "EMERGENCY"]
    initial_state: "COOL"
    transitions:
      - from: "COOL"
        to: "WARM"
        condition: "temperature >= 60°C"
        cooldown_required: false
      - from: "WARM"
        to: "COOL"
        condition: "temperature <= 55°C"
        cooldown_required: true
        cooldown_seconds: 30
      - from: "WARM"
        to: "HOT"
        condition: "temperature >= 75°C"
        cooldown_required: false
      - from: "HOT"
        to: "WARM"
        condition: "temperature <= 70°C"
        cooldown_required: true
        cooldown_seconds: 60
      - from: "HOT"
        to: "CRITICAL"
        condition: "temperature >= 85°C"
        cooldown_required: false
      - from: "CRITICAL"
        to: "HOT"
        condition: "temperature <= 80°C"
        cooldown_required: true
        cooldown_seconds: 30
      - from: "CRITICAL"
        to: "EMERGENCY"
        condition: "temperature >= 95°C"
        cooldown_required: false
      - from: "EMERGENCY"
        to: "CRITICAL"
        condition: "temperature <= 90°C"
        cooldown_required: true
        cooldown_seconds: 10

  cooldown_logic:
    upgrade_cooldown_seconds: 10
    downgrade_cooldown_seconds: "30-60 (state-dependent)"
    cooldown_timer_reset: "Reset on any temperature change"
    cooldown_enforcement: "Block state transitions during cooldown"

  flapping_detection:
    flap_threshold: "3 transitions within 60 seconds"
    flap_prevention: "Force 5-minute cooldown after flap detection"
    flap_events: "Emit thermal_flap_detected event"

  performance_targets:
    fsm_transition_latency_ms: "<5"
    cooldown_timer_overhead_ms: "<2"
    memory_overhead_kb: "<3"

  observability:
    metrics:
      - "thermal_hysteresis_transitions_total{from_state, to_state, hysteresis_applied}"
      - "thermal_cooldown_active_seconds{state}"
      - "thermal_flap_events_total"

  related_contracts:
    - "state_transition_thresholds.yml"
    - "state_persistence_timer.yml"
    - "upgrade_cooldown_10s.yml"
    - "downgrade_cooldown_30_60s.yml"
    - "ADR-0026b: Thermal Hysteresis State Machine"
