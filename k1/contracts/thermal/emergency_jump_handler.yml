emergency_jump_handler:
  name: "Emergency Jump Handler"
  purpose: "Handle critical thermal conditions with immediate Remote placement bypass"
  version: "1.0"
  source_adr: "ADR-0026c"

  emergency_conditions:
    critical_temperature_celsius: 85
    emergency_temperature_celsius: 95
    thermal_state_triggers: ["CRITICAL", "EMERGENCY"]
    emergency_jump_threshold: ">= 85°C OR thermal_state IN (CRITICAL, EMERGENCY)"

  jump_logic:
    bypass_cascade: "Skip NPU/GPU/CPU tiers, jump directly to Remote"
    immediate_action: "Force placement to Remote accelerator"
    override_conditions: "Emergency conditions override all placement policies"
    jump_duration: "Remain on Remote until temperature < 80°C AND thermal_state = HOT"

  recovery_logic:
    recovery_threshold_celsius: 80
    recovery_thermal_state: "HOT"
    recovery_condition: "temperature < 80°C AND thermal_state = HOT"
    gradual_return: "Return to normal cascade after recovery"

  flapping_prevention:
    emergency_jump_cooldown_seconds: 300
    jump_frequency_limit: "Max 3 emergency jumps per hour"
    jump_overuse_protection: "Extended cooldown after frequent jumps"

  performance_targets:
    emergency_detection_latency_ms: "<5"
    jump_execution_latency_ms: "<20"
    recovery_transition_latency_ms: "<10"

  observability:
    metrics:
      - "thermal_emergency_jumps_total{temperature_celsius, thermal_state}"
      - "thermal_emergency_jump_duration_seconds"
      - "thermal_emergency_jump_cooldown_active_seconds"

  related_contracts:
    - "thermal_placement_manager.yml"
    - "cpu_remote_placement_policy.yml"
    - "thermal_user_notifications.yml"
    - "ADR-0026c: Model Placement Integration"
