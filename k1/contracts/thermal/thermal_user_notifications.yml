thermal_user_notifications:
  name: "Thermal User Notifications"
  purpose: "Provide user feedback during thermal events and state changes"
  version: "1.0"
  source_adr: "ADR-0026d"

  notification_triggers:
    emergency_state: "EMERGENCY thermal state (>95°C)"
    critical_state: "CRITICAL thermal state (85-95°C)"
    thermal_recovery: "Return to HOT state from CRITICAL/EMERGENCY"
    emergency_jump: "Emergency placement to Remote accelerator"

  notification_messages:
    emergency_notification:
      title: "Device Overheating"
      message: "Device temperature is critically high. Switching to cloud processing to cool down."
      priority: "HIGH"
      display_duration_seconds: 10

    critical_notification:
      title: "Device Warming"
      message: "Device is getting warm. Performance may be reduced."
      priority: "MEDIUM"
      display_duration_seconds: 5

    recovery_notification:
      title: "Device Cooled"
      message: "Device temperature has normalized. Full performance restored."
      priority: "LOW"
      display_duration_seconds: 3

    emergency_jump_notification:
      title: "Thermal Protection Active"
      message: "Switching to cloud processing due to high temperature."
      priority: "HIGH"
      display_duration_seconds: 8

  notification_logic:
    state_change_trigger: "Notify on transition to EMERGENCY or CRITICAL states"
    recovery_trigger: "Notify on return to HOT state from higher states"
    emergency_jump_trigger: "Notify when emergency jump to Remote occurs"
    notification_cooldown: "5-minute cooldown between similar notifications"

  user_interface:
    notification_style: "Non-intrusive overlay with thermal icon"
    dismiss_behavior: "Auto-dismiss after display duration"
    history_access: "Available in device settings > Thermal status"
    customization: "User can disable thermal notifications"

  performance_targets:
    notification_generation_latency_ms: "<10"
    notification_display_overhead_ms: "<5"
    memory_overhead_kb: "<2"

  observability:
    metrics:
      - "thermal_notifications_sent_total{type, priority}"
      - "thermal_notification_cooldown_blocks_total"

  related_contracts:
    - "emergency_jump_handler.yml"
    - "thermal_state_detection.yml"
    - "ADR-0026d: Thermal User Notifications"
