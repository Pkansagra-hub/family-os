gpu_placement_policy:
  name: "GPU Placement Policy (50ms, 12W)"
  purpose: "Define GPU placement constraints and thermal requirements"
  version: "1.0"
  source_adr: "ADR-0026c"

  gpu_characteristics:
    latency_ms: 50
    power_watts: 12
    thermal_limit_celsius: 85
    supported_models: "FP16, INT8 models"
    memory_limit_gb: 8

  placement_constraints:
    thermal_states_allowed: ["COOL", "WARM", "HOT"]
    temperature_max_celsius: 85
    thermal_state_exclusion: "CRITICAL, EMERGENCY"
    placement_condition: "temperature < 85°C AND thermal_state IN (COOL, WARM, HOT)"

  placement_logic:
    availability_check: "GPU available if thermal constraints met"
    preference_score: 80
    fallback_behavior: "Cascade to CPU if GPU unavailable"
    thermal_override: "Skip GPU if temperature >= 85°C"

  performance_targets:
    placement_check_latency_ms: "<2"
    gpu_inference_latency_ms: "<50"
    power_consumption_watts: "<12"

  observability:
    metrics:
      - "gpu_placement_attempts_total{thermal_state, success}"
      - "gpu_thermal_rejections_total{temperature_celsius}"

  related_contracts:
    - "thermal_placement_manager.yml"
    - "npu_placement_policy.yml"
    - "cpu_remote_placement_policy.yml"
    - "ADR-0026c: Model Placement Integration"
