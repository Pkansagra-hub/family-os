# K1 AI Agent Classification Contract
# Epic 1.4 - Issue 1.4.1 - Architecture Component 3 of 5
# Version: 1.0.0
# Status: DRAFT
# Owner: Architecture Team
# ADR References: ADR-0004 (Section: AI Agent Classification)

metadata:
  contract_id: "ai_agent_classification"
  contract_name: "AI Agent Classification Contract"
  version: "1.0.0"
  description: |
    Classification and specifications for K1's 4 AI agents that use LLM reasoning.
    Defines Model Hub integration patterns, performance budgets, cost tracking.
    Implements contract from ADR-0004 Section "AI Agent Classification".
  component_type: "architecture_governance"
  layer: "layer_3_execution"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

overview:
  purpose: |
    AI Agent Classification Contract defines K1's 4 LLM-powered agents.

    Key Features:
    1. 4 AI agents (Concierge, Planner, Researcher, Safety Watch)
    2. Model Hub integration (centralized LLM access)
    3. Performance budgets (TTFT, E2E, cost per turn)
    4. Provider diversity (OpenAI, Anthropic, vLLM, Ollama)
    5. Cost tracking (tokens, latency, provider spend)

    Purpose:
    - Centralize LLM reasoning in 4 agents (48 pure actors = zero LLM)
    - Enforce performance budgets (TTFT <2000ms P95 target)
    - Track costs (per-turn token spend, provider billing)
    - Enable provider flexibility (multi-LLM routing)

  ai_vs_pure_actor:
    ai_agent:
      - "Uses LLM reasoning (OpenAI, Anthropic, vLLM, Ollama)"
      - "Non-deterministic outputs (same input → different outputs possible)"
      - "Higher latency (50ms-5000ms per LLM call)"
      - "Cost per turn (tokens billed by provider)"
      - "Examples: Concierge (NLU), Planner (task planning), Researcher (knowledge synthesis), Safety Watch (content filtering)"

    pure_actor:
      - "Zero LLM calls (deterministic logic only)"
      - "Deterministic outputs (same input → same output guaranteed)"
      - "Low latency (<5ms typical, <50ms max)"
      - "Zero LLM cost (no provider billing)"
      - "Examples: Agent Registry (lifecycle FSM), SessionState (memory management), Tool Runner (deterministic function calls)"

  research_foundation:
    - "Actor Model (Hewitt 1973) - All agents use message-passing"
    - "LLM-as-a-Service (Brown et al. 2020, GPT-3)"
    - "Chain-of-Thought Reasoning (Wei et al. 2022)"

total_counts:
  total_modules: 52
  ai_agents: 4
  pure_actors: 48
  ai_agent_percentage: 7.7  # 4/52 = 7.7% use LLM

ai_agents:
  agent1_concierge:
    module_name: "agents/concierge"
    module_path: "k1/agents/concierge.py"
    layer: "Layer 3 (Execution)"

    purpose: |
      Concierge handles user intent classification and NLU (Natural Language Understanding).
      First agent in the hot path (processes every user message).
      Classifies intent into: question, command, clarification, barge-in.

    llm_usage:
      model: "gpt-4o-mini (OpenAI)"
      fallback_model: "claude-3-5-haiku-20241022 (Anthropic)"
      prompt_template: |
        You are an intent classifier. Classify the user's message into one of:
        - question (user asks for information)
        - command (user requests action)
        - clarification (user responds to system question)
        - barge_in (user interrupts ongoing task)

        User message: {user_input}

        Output JSON: {"intent": "question|command|clarification|barge_in", "confidence": 0.0-1.0}

      prompt_tokens: 150  # Average input tokens
      completion_tokens: 20  # Average output tokens (JSON classification)
      total_tokens_per_turn: 170

    performance:
      ttft_target_ms: 50  # Time to First Token (P95)
      e2e_target_ms: 100  # End-to-End Turn Latency (P95)
      current_ttft_ms: 35
      current_e2e_ms: 70
      status: "✅ PASS (within budget)"

    cost:
      cost_per_1k_tokens_usd: 0.00015  # gpt-4o-mini input pricing
      cost_per_turn_usd: 0.0000255  # 170 tokens * $0.00015/1k
      daily_turns: 10000  # Assumption: 10k messages/day
      daily_cost_usd: 0.255  # $0.26/day
      monthly_cost_usd: 7.65  # $7.65/month

    model_hub_integration:
      provider: "openai"
      model_id: "gpt-4o-mini"
      temperature: 0.0  # Deterministic classification
      max_tokens: 50
      timeout_ms: 3000
      retry_policy:
        max_retries: 2
        backoff_ms: 500

      example_call: |
        from k1.model_hub.client import ModelHubClient

        client = ModelHubClient(trace_id=trace_id)
        response = await client.generate(
            model_id="gpt-4o-mini",
            prompt=prompt,
            temperature=0.0,
            max_tokens=50,
            timeout_ms=3000,
        )

    actor_model_patterns:
      mailbox:
        capacity: 100
        overflow_policy: "drop_oldest"

      supervision:
        supervisor: "orchestration/agent_registry (Supervisor FSM)"
        restart_policy: "one_for_one"
        max_restarts: 3
        time_window_ms: 600000  # 10 minutes

      message_types:
        incoming:
          - "ClassifyIntentMessage (from IntentRouter)"
        outgoing:
          - "IntentClassifiedEvent (to Orchestrator)"

    observability:
      metrics:
        - "concierge_intent_classification_total (counter)"
        - "concierge_latency_ms (histogram)"
        - "concierge_llm_tokens_total (counter)"
        - "concierge_cost_usd_total (counter)"

      traces:
        - "span_name: concierge.classify_intent"
        - "attributes: {intent, confidence, ttft_ms, e2e_ms}"

      logs:
        - "logger.info('intent_classified', intent=intent, confidence=confidence, trace_id=trace_id)"

  agent2_planner:
    module_name: "orchestration/planner"
    module_path: "k1/orchestration/planner.py"
    layer: "Layer 2 (Orchestration)"

    purpose: |
      Planner generates multi-step task execution plans (4-stage pipeline).
      Uses LLM for Sketch stage (creative plan generation).
      Deterministic stages (Expand, Validate, Commit) are rule-based.

    llm_usage:
      model: "gpt-4o (OpenAI)"
      fallback_model: "claude-3-5-sonnet-20241022 (Anthropic)"
      prompt_template: |
        You are a task planner. Generate a multi-step plan to accomplish:
        User request: {user_request}

        Available tools: {tool_catalog}
        Context: {session_context}

        Output JSON: {"steps": [{"step_id": 1, "action": "...", "tool": "...", "args": {...}}]}

      prompt_tokens: 800  # Larger context (tool catalog + session state)
      completion_tokens: 200  # Detailed plan JSON
      total_tokens_per_turn: 1000

    performance:
      ttft_target_ms: 500  # Higher budget (creative planning)
      e2e_target_ms: 5000  # Includes validation stages
      current_ttft_ms: 420
      current_e2e_ms: 4200
      status: "✅ PASS (within budget)"

    cost:
      cost_per_1k_tokens_usd: 0.0025  # gpt-4o input pricing
      cost_per_turn_usd: 0.0025  # 1000 tokens * $0.0025/1k
      daily_turns: 2000  # Assumption: 2k planning requests/day
      daily_cost_usd: 5.0  # $5/day
      monthly_cost_usd: 150.0  # $150/month

    model_hub_integration:
      provider: "openai"
      model_id: "gpt-4o"
      temperature: 0.7  # Creative planning (not deterministic)
      max_tokens: 500
      timeout_ms: 10000
      retry_policy:
        max_retries: 2
        backoff_ms: 1000

      example_call: |
        from k1.model_hub.client import ModelHubClient

        client = ModelHubClient(trace_id=trace_id)
        response = await client.generate(
            model_id="gpt-4o",
            prompt=prompt,
            temperature=0.7,
            max_tokens=500,
            timeout_ms=10000,
        )

    actor_model_patterns:
      mailbox:
        capacity: 50
        overflow_policy: "reject_new"

      supervision:
        supervisor: "orchestration/agent_registry (Supervisor FSM)"
        restart_policy: "one_for_one"
        max_restarts: 3
        time_window_ms: 600000

      message_types:
        incoming:
          - "PlanTaskMessage (from Orchestrator)"
        outgoing:
          - "PlanCompletedEvent (to Orchestrator)"
          - "PlanFailedEvent (if validation fails)"

    observability:
      metrics:
        - "planner_sketch_total (counter)"
        - "planner_latency_ms (histogram)"
        - "planner_llm_tokens_total (counter)"
        - "planner_cost_usd_total (counter)"
        - "planner_plan_steps_total (histogram)"

      traces:
        - "span_name: planner.4stage_pipeline"
        - "attributes: {stages: [sketch, expand, validate, commit], ttft_ms, e2e_ms}"

      logs:
        - "logger.info('plan_generated', step_count=len(plan.steps), trace_id=trace_id)"

  agent3_researcher:
    module_name: "agents/researcher"
    module_path: "k1/agents/researcher.py"
    layer: "Layer 3 (Execution)"

    purpose: |
      Researcher synthesizes knowledge from multiple sources (web search, RAG, databases).
      Uses LLM for knowledge integration and summarization.
      Not on hot path (only called when user asks research-heavy questions).

    llm_usage:
      model: "gpt-4o (OpenAI)"
      fallback_model: "claude-3-5-sonnet-20241022 (Anthropic)"
      prompt_template: |
        You are a researcher. Synthesize the following information:
        User question: {user_question}

        Sources:
        {source1}
        {source2}
        {source3}

        Output: Comprehensive answer with citations.

      prompt_tokens: 2000  # Large context (multiple sources)
      completion_tokens: 500  # Detailed synthesis
      total_tokens_per_turn: 2500

    performance:
      ttft_target_ms: 500
      e2e_target_ms: 3000
      current_ttft_ms: 450
      current_e2e_ms: 2800
      status: "✅ PASS (within budget)"

    cost:
      cost_per_1k_tokens_usd: 0.0025  # gpt-4o input pricing
      cost_per_turn_usd: 0.00625  # 2500 tokens * $0.0025/1k
      daily_turns: 500  # Lower frequency (research-heavy only)
      daily_cost_usd: 3.125  # $3.13/day
      monthly_cost_usd: 93.75  # $93.75/month

    model_hub_integration:
      provider: "openai"
      model_id: "gpt-4o"
      temperature: 0.3  # Factual synthesis (lower creativity)
      max_tokens: 1000
      timeout_ms: 10000
      retry_policy:
        max_retries: 2
        backoff_ms: 1000

      example_call: |
        from k1.model_hub.client import ModelHubClient

        client = ModelHubClient(trace_id=trace_id)
        response = await client.generate(
            model_id="gpt-4o",
            prompt=prompt,
            temperature=0.3,
            max_tokens=1000,
            timeout_ms=10000,
        )

    actor_model_patterns:
      mailbox:
        capacity: 20
        overflow_policy: "reject_new"

      supervision:
        supervisor: "orchestration/agent_registry (Supervisor FSM)"
        restart_policy: "one_for_one"
        max_restarts: 3
        time_window_ms: 600000

      message_types:
        incoming:
          - "ResearchQuestionMessage (from Orchestrator)"
        outgoing:
          - "ResearchCompletedEvent (to Orchestrator)"

    observability:
      metrics:
        - "researcher_synthesis_total (counter)"
        - "researcher_latency_ms (histogram)"
        - "researcher_llm_tokens_total (counter)"
        - "researcher_cost_usd_total (counter)"
        - "researcher_sources_count (histogram)"

      traces:
        - "span_name: researcher.synthesize_knowledge"
        - "attributes: {source_count, ttft_ms, e2e_ms}"

      logs:
        - "logger.info('research_completed', source_count=count, trace_id=trace_id)"

  agent4_safety_watch:
    module_name: "model_hub/safety_filter"
    module_path: "k1/model_hub/safety_filter.py"
    layer: "Layer 3 (Execution)"

    purpose: |
      Safety Watch filters harmful content (violence, hate speech, PII leaks).
      Uses LLM for content moderation (OpenAI Moderation API).
      On hot path (every LLM output filtered before user delivery).

    llm_usage:
      model: "text-moderation-latest (OpenAI)"
      fallback_model: "claude-3-5-haiku-20241022 (Anthropic, custom moderation prompt)"
      prompt_template: |
        # OpenAI Moderation API (no custom prompt, uses built-in endpoint)
        POST https://api.openai.com/v1/moderations
        {
          "input": "{llm_output_text}"
        }

      prompt_tokens: 0  # Moderation API doesn't count prompt tokens separately
      completion_tokens: 0  # Returns JSON categories (hate, violence, etc.)
      total_tokens_per_turn: 150  # Estimate based on input text length

    performance:
      ttft_target_ms: 50  # Fast moderation (hot path)
      e2e_target_ms: 100
      current_ttft_ms: 40
      current_e2e_ms: 85
      status: "✅ PASS (within budget)"

    cost:
      cost_per_1k_tokens_usd: 0.0002  # Moderation API pricing
      cost_per_turn_usd: 0.00003  # 150 tokens * $0.0002/1k
      daily_turns: 10000  # Filters every LLM output
      daily_cost_usd: 0.30  # $0.30/day
      monthly_cost_usd: 9.00  # $9.00/month

    model_hub_integration:
      provider: "openai"
      model_id: "text-moderation-latest"
      timeout_ms: 2000
      retry_policy:
        max_retries: 2
        backoff_ms: 300

      example_call: |
        from k1.model_hub.client import ModelHubClient

        client = ModelHubClient(trace_id=trace_id)
        response = await client.moderate(
            text=llm_output_text,
            timeout_ms=2000,
        )

        if response.flagged:
            # Block output, log violation
            logger.warning("safety_violation", categories=response.categories, trace_id=trace_id)

    actor_model_patterns:
      mailbox:
        capacity: 200  # High throughput (hot path)
        overflow_policy: "drop_oldest"

      supervision:
        supervisor: "orchestration/agent_registry (Supervisor FSM)"
        restart_policy: "one_for_one"
        max_restarts: 3
        time_window_ms: 600000

      message_types:
        incoming:
          - "FilterContentMessage (from Model Hub)"
        outgoing:
          - "ContentSafeEvent (to Model Hub)"
          - "ContentBlockedEvent (if flagged)"

    observability:
      metrics:
        - "safety_filter_total (counter)"
        - "safety_violations_total (counter, by category)"
        - "safety_latency_ms (histogram)"
        - "safety_cost_usd_total (counter)"

      traces:
        - "span_name: safety_filter.moderate_content"
        - "attributes: {flagged, categories, ttft_ms}"

      logs:
        - "logger.info('content_filtered', flagged=flagged, trace_id=trace_id)"

model_hub_integration:
  overview: |
    Model Hub centralizes all LLM access for 4 AI agents.
    Provides unified interface for provider diversity (OpenAI, Anthropic, vLLM, Ollama).

  architecture:
    component: "model_hub/client.py"
    layer: "Layer 3 (Execution)"

    features:
      - "Multi-provider support (OpenAI, Anthropic, vLLM, Ollama)"
      - "Automatic failover (primary → fallback provider)"
      - "Cost tracking (tokens, latency, provider spend)"
      - "Rate limiting (per-provider quotas)"
      - "Caching (semantic cache for repeated prompts)"
      - "Observability (metrics, traces, logs)"

  provider_configurations:
    openai:
      provider_id: "openai"
      api_key_env: "OPENAI_API_KEY"
      base_url: "https://api.openai.com/v1"
      models:
        - model_id: "gpt-4o-mini"
          cost_per_1k_input_tokens_usd: 0.00015
          cost_per_1k_output_tokens_usd: 0.0006
          rpm_limit: 10000  # Requests per minute
          tpm_limit: 2000000  # Tokens per minute
        - model_id: "gpt-4o"
          cost_per_1k_input_tokens_usd: 0.0025
          cost_per_1k_output_tokens_usd: 0.01
          rpm_limit: 10000
          tpm_limit: 800000
        - model_id: "text-moderation-latest"
          cost_per_1k_tokens_usd: 0.0002
          rpm_limit: 10000

    anthropic:
      provider_id: "anthropic"
      api_key_env: "ANTHROPIC_API_KEY"
      base_url: "https://api.anthropic.com/v1"
      models:
        - model_id: "claude-3-5-haiku-20241022"
          cost_per_1k_input_tokens_usd: 0.0008
          cost_per_1k_output_tokens_usd: 0.004
          rpm_limit: 5000
          tpm_limit: 400000
        - model_id: "claude-3-5-sonnet-20241022"
          cost_per_1k_input_tokens_usd: 0.003
          cost_per_1k_output_tokens_usd: 0.015
          rpm_limit: 5000
          tpm_limit: 400000

    vllm:
      provider_id: "vllm"
      base_url: "http://localhost:8000/v1"  # Local vLLM server
      models:
        - model_id: "Qwen/Qwen2.5-7B-Instruct"
          cost_per_1k_tokens_usd: 0.0  # Self-hosted (zero API cost)
          rpm_limit: 1000
          tpm_limit: 100000

    ollama:
      provider_id: "ollama"
      base_url: "http://localhost:11434/v1"  # Local Ollama server
      models:
        - model_id: "llama3.2:3b"
          cost_per_1k_tokens_usd: 0.0  # Self-hosted (zero API cost)
          rpm_limit: 500
          tpm_limit: 50000

  client_api:
    generate_method: |
      from k1.model_hub.client import ModelHubClient

      client = ModelHubClient(trace_id=trace_id)
      response = await client.generate(
          model_id="gpt-4o-mini",
          prompt="Classify intent: ...",
          temperature=0.0,
          max_tokens=50,
          timeout_ms=3000,
      )

      # Response object:
      # - text: str (LLM output)
      # - tokens: int (total tokens)
      # - latency_ms: int (TTFT + generation time)
      # - cost_usd: float (provider cost)
      # - provider: str (openai, anthropic, etc.)

    moderate_method: |
      from k1.model_hub.client import ModelHubClient

      client = ModelHubClient(trace_id=trace_id)
      response = await client.moderate(
          text="LLM output to filter",
          timeout_ms=2000,
      )

      # Response object:
      # - flagged: bool (true if harmful)
      # - categories: dict (hate, violence, etc.)
      # - latency_ms: int
      # - cost_usd: float

cost_tracking:
  overview: |
    Cost tracking aggregates LLM spend across 4 AI agents.
    Tracks per-agent, per-provider, per-day costs.

  cost_breakdown_monthly:
    agent1_concierge:
      model: "gpt-4o-mini"
      daily_turns: 10000
      tokens_per_turn: 170
      cost_per_turn_usd: 0.0000255
      monthly_cost_usd: 7.65

    agent2_planner:
      model: "gpt-4o"
      daily_turns: 2000
      tokens_per_turn: 1000
      cost_per_turn_usd: 0.0025
      monthly_cost_usd: 150.0

    agent3_researcher:
      model: "gpt-4o"
      daily_turns: 500
      tokens_per_turn: 2500
      cost_per_turn_usd: 0.00625
      monthly_cost_usd: 93.75

    agent4_safety_watch:
      model: "text-moderation-latest"
      daily_turns: 10000
      tokens_per_turn: 150
      cost_per_turn_usd: 0.00003
      monthly_cost_usd: 9.0

    total_monthly_cost_usd: 260.4  # $260.40/month (all 4 agents)

  cost_optimization_strategies:
    - strategy: "Use gpt-4o-mini for simple tasks (Concierge)"
      savings_pct: 94  # vs gpt-4o ($0.0000255 vs $0.00042 per turn)
    - strategy: "Cache repeated prompts (semantic cache)"
      savings_pct: 30  # ~30% of prompts are repeated
    - strategy: "Fallback to self-hosted vLLM/Ollama for non-critical tasks"
      savings_pct: 100  # Zero API cost for self-hosted

performance_budgets:
  overview: |
    Performance budgets for 4 AI agents (P95 targets).

  ttft_budget_ms:
    concierge: 50
    planner: 500
    researcher: 500
    safety_watch: 50

  e2e_budget_ms:
    concierge: 100
    planner: 5000
    researcher: 3000
    safety_watch: 100

  hot_path_total_ms:
    description: "Hot path includes: Concierge + Safety Watch"
    concierge_ms: 100
    safety_watch_ms: 100
    total_ms: 200
    budget_ms: 300
    status: "✅ PASS (within hot path budget)"

compliance:
  adr_references:
    - "ADR-0004: 52-Module 5-Layer Architecture (Section: AI Agent Classification)"

  research_validation:
    - citation: "Actor Model (Hewitt 1973)"
      compliance: "All 4 AI agents use message-passing mailboxes"
    - citation: "LLM-as-a-Service (Brown et al. 2020)"
      compliance: "Centralized Model Hub for provider diversity"
    - citation: "Chain-of-Thought Reasoning (Wei et al. 2022)"
      compliance: "Planner uses LLM for creative task planning"

  performance_requirements:
    - "TTFT <2000ms P95 (overall system budget)"
    - "Hot path <300ms (Concierge + Safety Watch)"
    - "Planner <5000ms (creative planning budget)"

  cost_requirements:
    - "Monthly cost <$500 (4 agents combined)"
    - "Cost tracking per agent, per provider"

cross_references:
  related_contracts:
    - contract: "module_manifest.yml"
      relationship: "defines_52_modules_including_4_ai_agents"
    - contract: "pure_actor_classification.yml"
      relationship: "defines_48_pure_actors_zero_llm"
    - contract: "layer_dependencies.yml"
      relationship: "enforces_layer_3_execution_boundaries"

notes:
  - "4 AI agents (7.7% of 52 modules) concentrate all LLM reasoning"
  - "48 pure actors (92.3% of modules) use zero LLM (deterministic logic)"
  - "Model Hub centralizes LLM access (multi-provider, cost tracking)"
  - "Hot path agents (Concierge, Safety Watch) have strict budgets (50ms TTFT)"
  - "Off-hot-path agents (Planner, Researcher) have relaxed budgets (500ms TTFT)"
  - "Cost tracking enables optimization (semantic cache, self-hosted fallbacks)"
