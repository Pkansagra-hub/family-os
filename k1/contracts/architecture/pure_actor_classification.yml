metadata:
  contract_id: "pure_actor_classification"
  contract_name: "Pure Actor Classification Contract"
  version: "1.0.0"
  description: |
    Classification and specifications for K1's 48 pure actors (zero LLM spend).
    Defines deterministic logic patterns, performance targets, Actor Model usage.
    Implements contract from ADR-0004 Section "Pure Actor Classification".
  component_type: "architecture_governance"
  layer: "all_layers"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

overview:
  purpose: |
    Pure Actor Classification Contract defines K1's 48 deterministic actors.

    Key Features:
    1. 48 pure actors (zero LLM calls, deterministic logic)
    2. Actor Model patterns (mailboxes, supervision, message-passing)
    3. Performance targets (<5ms typical, <50ms max)
    4. Configuration management (YAML-based, hot-reload)
    5. Zero LLM cost (no provider billing)

    Purpose:
    - Isolate deterministic logic from LLM reasoning (48 vs 4 split)
    - Enforce low-latency operations (<5ms for most actors)
    - Enable fast testing (deterministic = same input → same output)
    - Reduce costs (48 actors = zero LLM spend)

  pure_actor_definition:
    characteristics:
      - "Zero LLM calls (no OpenAI, Anthropic, vLLM, Ollama usage)"
      - "Deterministic outputs (same input → same output guaranteed)"
      - "Low latency (<5ms typical, <50ms max for most actors)"
      - "Zero LLM cost (no provider billing)"
      - "Configuration-driven (YAML files, hot-reload capability)"
      - "State machines, rule engines, algorithms (no LLM reasoning)"

    examples:
      - "Agent Registry (lifecycle FSM: PENDING → WARMING → ACTIVE → IDLE → DRAINING → TERMINATED)"
      - "SessionState (memory management: 6 sections, 3-tier eviction)"
      - "Tool Runner (deterministic function calls: math, file I/O, API calls)"
      - "Protocol Monitor (MPST validation: FSM execution, timeout enforcement)"
      - "Intent Router (rule-based routing: if intent=question → route to Concierge)"

  research_foundation:
    - "Actor Model (Hewitt 1973) - Message-passing, mailboxes, supervision"
    - "Finite State Machines (Moore 1956) - Agent lifecycle, protocol validation"
    - "Deterministic Algorithms (Knuth 1968) - Same input → same output"

