actor_model_patterns:
  overview: |
    All 48 pure actors use Actor Model patterns (Hewitt 1973).

    Key Patterns:
    1. Message-passing (no shared state)
    2. Mailboxes (actor-local message queues)
    3. Supervision (restart policies for failures)
    4. Isolation (each actor has private state)

  mailbox_pattern:
    description: "Each actor has a mailbox (message queue)"
    example: |
      # File: k1/execution/agent_registry.py (Pure Actor)
      class AgentRegistry:
          def __init__(self):
              self.mailbox = asyncio.Queue(maxsize=100)  # Mailbox capacity: 100
              self.state = {}  # Private state (not shared)

          async def run(self):
              while True:
                  # Receive message from mailbox
                  message = await self.mailbox.get()

                  # Process message (deterministic logic)
                  if message.type == "HIRE_AGENT":
                      self._hire_agent(message.payload)
                  elif message.type == "TERMINATE_AGENT":
                      self._terminate_agent(message.payload)

          async def send_message(self, message):
              # Send message to actor's mailbox
              await self.mailbox.put(message)

    capacity_guidelines:
      - "Hot path actors: 100-200 capacity (high throughput)"
      - "Off-hot-path actors: 20-50 capacity (lower throughput)"
      - "Overflow policy: drop_oldest (hot path), reject_new (off-hot-path)"

  supervision_pattern:
    description: "Supervisor monitors actors, restarts on failure"
    example: |
      # File: k1/execution/agent_supervisor.py (Pure Actor)
      class AgentSupervisor:
          def __init__(self):
              self.supervised_actors = {}  # actor_id → Actor instance
              self.restart_policy = "one_for_one"  # Restart only failed actor
              self.max_restarts = 3
              self.time_window_ms = 600000  # 10 minutes

          async def monitor(self, actor_id):
              while True:
                  # Check actor health
                  actor = self.supervised_actors[actor_id]
                  if actor.is_crashed():
                      # Restart actor (one_for_one policy)
                      self._restart_actor(actor_id)

                  await asyncio.sleep(1.0)  # Check every 1 second

          def _restart_actor(self, actor_id):
              # Restart failed actor (deterministic restart logic)
              actor = self.supervised_actors[actor_id]
              actor.reset_state()
              actor.restart()

    restart_policies:
      - "one_for_one: Restart only failed actor (default)"
      - "one_for_all: Restart all supervised actors (if failure cascades)"
      - "rest_for_one: Restart failed actor + all actors started after it"

    blacklist_policy:
      - "If actor crashes 3+ times in 10 minutes → blacklist (stop restarting)"
      - "Blacklist duration: 1 hour (prevent infinite restart loops)"

  message_passing_pattern:
    description: "Actors communicate via messages (no shared state)"
    example: |
      # Actor A sends message to Actor B (no shared state)

      # File: k1/orchestration/agent_registry.py (Actor A)
      from k1.infrastructure.message_broker import message_broker

      async def hire_agent(self, agent_id: str):
          # Send message to Actor B (tool_runner)
          message = Message(
              to="tool_runner",
              type="PREPARE_TOOLS",
              payload={"agent_id": agent_id},
          )
          await message_broker.send(message)

      # File: k1/execution/tool_runner.py (Actor B)
      async def receive_message(self, message: Message):
          if message.type == "PREPARE_TOOLS":
              agent_id = message.payload["agent_id"]
              self._prepare_tools(agent_id)

    benefits:
      - "No race conditions (no shared mutable state)"
      - "Easy to test (actor inputs/outputs are explicit)"
      - "Scalable (actors can run on different cores/machines)"

deterministic_logic_patterns:
  overview: |
    48 pure actors use deterministic logic (state machines, rule engines, algorithms).
    Same input → same output (guaranteed, no LLM randomness).

  state_machine_pattern:
    description: "Finite State Machines (Moore 1956)"
    example: |
      # File: k1/orchestration/agent_registry.py (Pure Actor)
      class AgentLifecycleFSM:
          """
          6 states: PENDING → WARMING → ACTIVE → IDLE → DRAINING → TERMINATED
          """
          def __init__(self):
              self.state = AgentState.PENDING

          def transition(self, event: str) -> AgentState:
              # Deterministic state transitions
              if self.state == AgentState.PENDING and event == "HIRE":
                  self.state = AgentState.WARMING
              elif self.state == AgentState.WARMING and event == "READY":
                  self.state = AgentState.ACTIVE
              elif self.state == AgentState.ACTIVE and event == "IDLE_TIMEOUT":
                  self.state = AgentState.IDLE
              # ... more transitions

              return self.state

    usage:
      - "Agent lifecycle (6 states, 10 transitions)"
      - "Protocol validation (MPST FSM execution)"
      - "Dialogue flow (user → system → user states)"

  rule_engine_pattern:
    description: "If-then-else rules for decision-making"
    example: |
      # File: k1/input/intent_router.py (Pure Actor)
      class IntentRouter:
          def route(self, intent: str, confidence: float) -> str:
              # Deterministic routing rules
              if intent == "question" and confidence > 0.8:
                  return "concierge"
              elif intent == "command" and confidence > 0.8:
                  return "planner"
              elif confidence <= 0.8:
                  return "clarification_handler"  # Low confidence → ask user
              else:
                  return "default_handler"

    usage:
      - "Intent routing (if intent=X → route to Y)"
      - "Capability verification (if agent has capability → allow, else reject)"
      - "Privacy band enforcement (if band=RED → require arbiter approval)"

  algorithm_pattern:
    description: "Standard algorithms (sorting, searching, caching, etc.)"
    example: |
      # File: k1/runtime/kv_cache.py (Pure Actor)
      class KVCache:
          def __init__(self):
              self.cache = {}  # key → value
              self.lru_order = []  # Least Recently Used order

          def get(self, key: str) -> Optional[str]:
              # Deterministic cache lookup (O(1))
              if key in self.cache:
                  # Update LRU order
                  self.lru_order.remove(key)
                  self.lru_order.append(key)
                  return self.cache[key]
              return None

          def put(self, key: str, value: str):
              # Deterministic cache insertion
              if len(self.cache) >= MAX_CACHE_SIZE:
                  # Evict LRU key
                  lru_key = self.lru_order.pop(0)
                  del self.cache[lru_key]

              self.cache[key] = value
              self.lru_order.append(key)

    usage:
      - "KV cache (LRU eviction)"
      - "SessionState eviction (3-tier: hot/warm/cold)"
      - "Semantic cache (embedding similarity search)"

