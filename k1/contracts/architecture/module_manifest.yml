performance_budgets_summary:
  overview: |
    Performance budgets (P95 latency targets) per layer and critical paths.

    Hot Path Budget:
    - Layer 1 (Input Processing): <50ms
    - Layer 2 (Orchestration): <250ms
    - Layer 3 (Execution): <1800ms
    - Total TTFT: <2000ms P95 (user input → agent response)

  critical_paths:
    ttft_path:
      description: "Time to First Token (user input → agent response)"
      budget_ms: 2000
      breakdown:
        - component: "Layer 1 (intent classification)"
          budget_ms: 50
          current_ms: 35
        - component: "Layer 5 (event bus delivery)"
          budget_ms: 10
          current_ms: 8
        - component: "Layer 2 (orchestration)"
          budget_ms: 250
          current_ms: 220
        - component: "Layer 3 (agent hire)"
          budget_ms: 600
          current_ms: 550
        - component: "Layer 3 (model hub call)"
          budget_ms: 50
          current_ms: 45
        - component: "Layer 1 (TTS if voice)"
          budget_ms: 800
          current_ms: 750
        - total_budget_ms: 2000
          total_current_ms: 1850
          status: "✅ PASS (within budget)"

    barge_in_path:
      description: "Voice interrupt handling"
      budget_ms: 115
      breakdown:
        - component: "VAD detection"
          budget_ms: 20
        - component: "Event publish"
          budget_ms: 2
        - component: "Event delivery"
          budget_ms: 5
        - component: "Turn manager action"
          budget_ms: 10
        - component: "Agent interrupt"
          budget_ms: 50
        - total_budget_ms: 115
          status: "✅ CRITICAL (barge-in <115ms required)"

