# K1 Intelligence Module - Complete 52-Module Manifest
# Epic 1.4 - Issue 1.4.1 - Architecture Component 1 of 5
# Version: 1.0.0
# Status: DRAFT
# Owner: Architecture Team
# ADR References: ADR-0004 (52-Module 5-Layer Architecture)

metadata:
  contract_id: "module_manifest"
  contract_name: "K1 Module Manifest Contract"
  version: "1.0.0"
  description: |
    Complete registry of all 52 K1 Intelligence Module components organized into 5 layers.
    Defines module purpose, type (AI agent vs pure actor), dependencies, and performance budgets.
    Implements contract from ADR-0004 Section "52-Module Component Classification".
  component_type: "architecture_documentation"
  layer: "all_layers"
  critical: true
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

overview:
  purpose: |
    Module Manifest provides authoritative source of truth for K1's 52-module architecture.

    Key Features:
    1. Complete module registry (52 modules across 5 layers)
    2. AI agent classification (4 AI agents: Concierge, Planner, Researcher, Safety Watch)
    3. Pure actor classification (48 pure actors with deterministic logic)
    4. Layer dependency rules (strict layering enforcement)
    5. Performance budgets per module (latency, memory, throughput)

    This manifest is used by:
    - Developers (understand module structure, find code)
    - Import linter (validate layering rules)
    - CI/CD (generate module READMEs, validate architecture)
    - Documentation (auto-generate architecture diagrams)

  architecture_principles:
    - "Layered microkernel (QNX, L4, seL4 inspiration)"
    - "Actor Model for ALL 52 modules (message-passing, supervision)"
    - "4 AI agents use Model Hub for LLM reasoning"
    - "48 pure actors use deterministic logic (no LLM calls)"
    - "Strict layering (L1→L5 only, L2→all, L3→L4/L5, L4→L5, L5→none)"

  research_foundation:
    - "Microkernel Architecture (Liedtke 1995)"
    - "Actor Model (Hewitt 1973)"
    - "Layered Architecture (Parnas 1972)"

architecture_summary:
  total_modules: 52
  total_files: 1592
  total_loc: 56000

  classification_summary:
    ai_agents:
      count: 4
      description: "Use Model Hub for LLM reasoning (non-deterministic)"
      modules:
        - "orchestration/planner"
        - "agents/concierge"
        - "agents/researcher"
        - "model_hub/safety_filter"

    pure_actors:
      count: 48
      description: "Deterministic logic, no LLM calls (zero LLM spend)"
      characteristics:
        - "Use rule-based logic, state machines, algorithms"
        - "Have config in k1/config/*.yml"
        - "Latency <5ms (CPU-bound)"
        - "Cost $0.00 (no LLM API calls)"

  layer_summary:
    layer1_input_processing:
      module_count: 4
      purpose: "Multi-modal input perception and intent routing"
      performance_target: "Intent classification <5ms P95 (T2 SLM)"

    layer2_orchestration:
      module_count: 3
      purpose: "Multi-agent coordination and plan generation"
      performance_target: "Plan generation 50-80ms P95"

    layer3_execution:
      module_count: 22
      purpose: "Agent lifecycle, AI integration (Model Hub), tool execution"
      performance_target: "Model Hub call <50ms P95, Tool call <3s P95"

    layer4_runtime_core:
      module_count: 8
      purpose: "State management, flow execution, learning loop"
      performance_target: "SessionState serialize <1ms, Flow step <5ms"

    layer5_infrastructure:
      module_count: 15
      purpose: "Scheduling, backpressure, observability, configuration"
      performance_target: "Config reload <100ms P95, Scheduler overhead <1% CPU"

layer_dependencies:
  rules:
    layer1:
      can_import:
        - "Layer 5 (Infrastructure)"
      forbidden_imports:
        - "Layer 2 (Orchestration)"
        - "Layer 3 (Execution)"
        - "Layer 4 (Runtime Core)"
      rationale: "L1 is input processing, communicates with L2 via event bus (L5)"

    layer2:
      can_import:
        - "Layer 1 (Input Processing)"
        - "Layer 3 (Execution)"
        - "Layer 4 (Runtime Core)"
        - "Layer 5 (Infrastructure)"
      forbidden_imports: []
      rationale: "L2 is orchestrator, needs visibility into all layers"

    layer3:
      can_import:
        - "Layer 4 (Runtime Core)"
        - "Layer 5 (Infrastructure)"
      forbidden_imports:
        - "Layer 1 (Input Processing)"
        - "Layer 2 (Orchestration)"
      rationale: "L3 is execution, depends on runtime state (L4) and infrastructure (L5)"

    layer4:
      can_import:
        - "Layer 5 (Infrastructure)"
      forbidden_imports:
        - "Layer 1 (Input Processing)"
        - "Layer 2 (Orchestration)"
        - "Layer 3 (Execution)"
      rationale: "L4 is runtime core, foundation for L3, must not depend on it"

    layer5:
      can_import: []
      forbidden_imports:
        - "Layer 1 (Input Processing)"
        - "Layer 2 (Orchestration)"
        - "Layer 3 (Execution)"
        - "Layer 4 (Runtime Core)"
      rationale: "L5 is foundation, all layers depend on it, cannot import from any layer"

# ============================================================
# LAYER 1: INPUT PROCESSING (4 modules)
# ============================================================

layer1_input_processing:
  layer_id: 1
  layer_name: "Input Processing"
  module_count: 4
  purpose: "Multi-modal input perception and intent routing"
  performance_budget:
    intent_classification_ms: 5
    stream_processing_ms: 10
    event_publish_ms: 2

  modules:
    - module_id: "m001"
      name: "streams/stream_switch"
      type: "pure_actor"
      llm_usage: false
      purpose: "Unified multi-modal input bus (audio, video, text, sensors)"
      responsibilities:
        - "Normalize input from multiple sources (microphone, camera, keyboard)"
        - "Route streams to operators (VAD, ASR, TTS, vision)"
        - "Manage stream lifecycle (open, pause, resume, close)"
      files: 12
      loc: 800
      performance_budgets:
        stream_open_latency_ms: 50
        stream_processing_latency_ms: 10
      dependencies:
        layer5:
          - "infrastructure/metrics"
          - "infrastructure/event_bus"
      tests:
        unit: "tests/unit/streams/test_stream_switch.py"
        integration: "tests/integration/layer1/test_stream_processing.py"

    - module_id: "m002"
      name: "streams/operators"
      type: "pure_actor"
      llm_usage: false
      purpose: "Stream transformations (VAD, ASR, TTS, vision, sensor processing)"
      responsibilities:
        - "Voice Activity Detection (VAD) - detect speech in audio stream"
        - "Automatic Speech Recognition (ASR) - audio → text"
        - "Text-to-Speech (TTS) - text → audio"
        - "Vision processing - image/video → structured data"
      files: 12
      loc: 900
      performance_budgets:
        vad_latency_ms: 20
        asr_latency_ms: 500
        tts_latency_ms: 800
      dependencies:
        layer5:
          - "infrastructure/metrics"
      external_dependencies:
        - "whisper (ASR)"
        - "piper (TTS)"
      tests:
        unit: "tests/unit/streams/test_operators.py"
        integration: "tests/integration/layer1/test_stream_processing.py"

    - module_id: "m003"
      name: "orchestration/intent_router"
      type: "pure_actor"
      llm_usage: false
      purpose: "3-tier intent classification (T1: regex <1ms, T2: SLM 2-3ms, T3: LLM <50ms)"
      responsibilities:
        - "Tier 1 (regex): Simple command patterns (40% coverage, <1ms)"
        - "Tier 2 (SLM): Medium complexity (50% coverage, 2-3ms)"
        - "Tier 3 (LLM): Complex/ambiguous (95% coverage, <50ms)"
        - "Publish IntentDetected events to Layer 5 event bus"
      files: 12
      loc: 700
      performance_budgets:
        tier1_latency_ms: 1
        tier2_latency_ms: 3
        tier3_latency_ms: 50
      dependencies:
        layer5:
          - "infrastructure/event_bus"
          - "infrastructure/metrics"
      comment: "T3 uses LLM BUT router itself is pure actor (delegates to Model Hub)"
      tests:
        unit: "tests/unit/orchestration/test_intent_router.py"
        integration: "tests/integration/layer1/test_intent_classification.py"

    - module_id: "m004"
      name: "orchestration/meta_policy"
      type: "pure_actor"
      llm_usage: false
      purpose: "Proactivity + clarification engines (rule-based)"
      responsibilities:
        - "Proactivity engine: Suggest follow-up actions"
        - "Clarification engine: Detect ambiguous requests, request clarification"
        - "Grounding engine: Confirm understanding (explicit/implicit)"
      files: 12
      loc: 800
      performance_budgets:
        proactivity_check_ms: 10
        clarification_check_ms: 5
      dependencies:
        layer5:
          - "infrastructure/metrics"
      tests:
        unit: "tests/unit/orchestration/test_meta_policy.py"

# ============================================================
# LAYER 2: ORCHESTRATION (3 modules)
# ============================================================

layer2_orchestration:
  layer_id: 2
  layer_name: "Orchestration"
  module_count: 3
  purpose: "Multi-agent coordination and plan generation"
  performance_budget:
    orchestration_latency_ms: 250
    planning_latency_ms: 5000
    protocol_validation_ms: 10

  modules:
    - module_id: "m005"
      name: "orchestration/planner"
      type: "ai_agent"
      llm_usage: true
      model_hub_calls: true
      purpose: "4-stage planner (sketch → expand → validate → commit)"
      responsibilities:
        - "Stage 1 (Sketch): LLM generates high-level plan steps"
        - "Stage 2 (Expand): Deterministic expansion (tool calls, parameters)"
        - "Stage 3 (Validate): Rule validation + arbiter approval (RED band)"
        - "Stage 4 (Commit): Store validated plan in SessionState"
      files: 24
      loc: 1400
      llm_budget_ms: 5000
      llm_providers:
        - "OpenAI GPT-4"
        - "Anthropic Claude"
        - "vLLM"
        - "Ollama"
      performance_budgets:
        sketch_latency_ms: 5000
        expand_latency_ms: 50
        validate_latency_ms: 30
        commit_latency_ms: 10
      dependencies:
        layer1:
          - "orchestration/intent_router"
        layer3:
          - "model_hub/router"
        layer4:
          - "runtime/session_state"
        layer5:
          - "infrastructure/metrics"
          - "infrastructure/event_bus"
      tests:
        unit: "tests/unit/orchestration/test_planner.py"
        integration: "tests/integration/layer2/test_planning_pipeline.py"

    - module_id: "m006"
      name: "orchestration/orchestrator"
      type: "pure_actor"
      llm_usage: false
      purpose: "Multi-agent coordinator (Contract Net Protocol)"
      responsibilities:
        - "Phase 1 (Negotiation): Broadcast task, collect proposals"
        - "Phase 2 (Selection): Select best agent based on score"
        - "Phase 3 (Execution): Execute task with selected agent"
        - "Subscribe to IntentDetected events from Layer 1 (via Layer 5 event bus)"
      files: 24
      loc: 1500
      performance_budgets:
        negotiation_latency_ms: 100
        selection_latency_ms: 50
        execution_overhead_ms: 100
      dependencies:
        layer1:
          - "orchestration/intent_router"
        layer3:
          - "agents/registry"
          - "agents/hire_fire"
        layer4:
          - "runtime/session_state"
        layer5:
          - "infrastructure/event_bus"
          - "infrastructure/metrics"
      comment: "Uses deterministic scoring (no Model Hub calls)"
      tests:
        unit: "tests/unit/orchestration/test_orchestrator.py"
        integration: "tests/integration/layer2/test_3phase_orchestration.py"

    - module_id: "m007"
      name: "orchestration/protocol_monitor"
      type: "pure_actor"
      llm_usage: false
      purpose: "MPST/Scribble protocol validation (6 protocols)"
      responsibilities:
        - "FSM Registry: Store 6 core protocol FSMs"
        - "Session Tracker: Track protocol states per session"
        - "Validator: Validate message_type against current state"
        - "Violation Handler: Block/warn/repair/fallback/abort on violations"
      files: 12
      loc: 1000
      performance_budgets:
        fsm_lookup_ms: 1
        transition_validation_ms: 2
        violation_handling_ms: 5
      dependencies:
        layer4:
          - "runtime/session_state"
        layer5:
          - "infrastructure/metrics"
      protocols:
        - "agent_hire"
        - "task_execution"
        - "clarification"
        - "barge_in"
        - "tool_call"
        - "saga_rollback"
      tests:
        unit: "tests/unit/orchestration/test_protocol_monitor.py"
        integration: "tests/integration/layer2/test_protocol_validation.py"

# ============================================================
# LAYER 3: EXECUTION (22 modules)
# ============================================================

layer3_execution:
  layer_id: 3
  layer_name: "Execution"
  module_count: 22
  purpose: "Agent lifecycle, AI integration (Model Hub), tool execution"
  performance_budget:
    agent_hire_ms: 600
    model_hub_call_ms: 50
    tool_call_ms: 3000

  subsections:
    agent_lifecycle:
      module_count: 6
      modules:
        - module_id: "m008"
          name: "agents/registry"
          type: "pure_actor"
          llm_usage: false
          purpose: "Agent YAML specifications (4 AI agents + future agents)"
          responsibilities:
            - "Load agent specs from k1/agents/registry/*.yml"
            - "Provide agent lookup by agent_id"
            - "Store agent capabilities, roles, prompts"
          files: 12
          loc: 600
          performance_budgets:
            agent_lookup_ms: 1
          dependencies:
            layer4:
              - "runtime/session_state"
            layer5:
              - "config/global"
          tests:
            unit: "tests/unit/agents/test_registry.py"

        - module_id: "m009"
          name: "agents/hire_fire"
          type: "pure_actor"
          llm_usage: false
          purpose: "Agent lifecycle FSM (PENDING → WARMING → ACTIVE → IDLE → DRAINING → TERMINATED)"
          responsibilities:
            - "Hire agent: PENDING → WARMING → ACTIVE (<600ms)"
            - "Fire agent: DRAINING → TERMINATED"
            - "Track agent state transitions (6 states)"
            - "Enforce max agents per session (default: 3)"
          files: 18
          loc: 1200
          performance_budgets:
            hire_latency_ms: 600
            fire_latency_ms: 100
            state_transition_ms: 10
          dependencies:
            layer4:
              - "runtime/leases"
              - "runtime/session_state"
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/agents/test_hire_fire.py"
            integration: "tests/integration/layer3/test_agent_lifecycle.py"

        - module_id: "m010"
          name: "agents/supervisor"
          type: "pure_actor"
          llm_usage: false
          purpose: "Health monitoring, crash detection (1Hz checks)"
          responsibilities:
            - "Periodic health checks (every 1 second)"
            - "Crash detection (agent unresponsive for >3 checks)"
            - "Automatic restart (up to 3 retries)"
            - "Blacklist agents (3 crashes in 10 minutes)"
          files: 15
          loc: 1000
          performance_budgets:
            health_check_ms: 50
            crash_detection_ms: 100
          dependencies:
            layer4:
              - "runtime/session_state"
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/agents/test_supervisor.py"

        - module_id: "m011"
          name: "agents/personality"
          type: "pure_actor"
          llm_usage: false
          purpose: "Persona adaptation (tone, verbosity, empathy)"
          responsibilities:
            - "Adapt persona based on user preferences (config)"
            - "Tone: formal, casual, professional, friendly"
            - "Verbosity: concise, moderate, detailed"
            - "Empathy: low, medium, high"
          files: 10
          loc: 700
          performance_budgets:
            persona_adaptation_ms: 10
          dependencies:
            layer4:
              - "runtime/session_state"
          tests:
            unit: "tests/unit/agents/test_personality.py"

        - module_id: "m012"
          name: "agents/mailbox"
          type: "pure_actor"
          llm_usage: false
          purpose: "Inter-agent messaging (lock-free MPSC queues)"
          responsibilities:
            - "Per-agent mailbox (lock-free MPSC queue)"
            - "Message delivery (async, non-blocking)"
            - "Backpressure handling (queue full → block sender)"
          files: 12
          loc: 800
          performance_budgets:
            message_send_ms: 1
            message_receive_ms: 1
          dependencies:
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/agents/test_mailbox.py"

        - module_id: "m013"
          name: "agents/active_roster"
          type: "pure_actor"
          llm_usage: false
          purpose: "Runtime agent tracking (active agents per session)"
          responsibilities:
            - "Track active agents in session"
            - "Enforce max agents limit (default: 3)"
            - "Provide agent lookup by ID"
          files: 8
          loc: 500
          performance_budgets:
            agent_lookup_ms: 1
          dependencies:
            layer4:
              - "runtime/session_state"
          tests:
            unit: "tests/unit/agents/test_active_roster.py"

    model_hub:
      description: "AI integration infrastructure (ONLY for 4 AI agents)"
      module_count: 7
      modules:
        - module_id: "m014"
          name: "model_hub/router"
          type: "pure_actor"
          llm_usage: false
          purpose: "Model request routing (sync/async, multi-provider)"
          responsibilities:
            - "Route LLM requests to providers (OpenAI, Anthropic, vLLM, Ollama)"
            - "Sync/async routing (streaming vs batch)"
            - "Load balancing across providers"
          files: 18
          loc: 1200
          performance_budgets:
            routing_overhead_ms: 5
          dependencies:
            layer4:
              - "runtime/session_state"
            layer5:
              - "infrastructure/metrics"
          comment: "Routes TO LLMs, doesn't call them (pure actor)"
          tests:
            unit: "tests/unit/model_hub/test_router.py"

        - module_id: "m015"
          name: "model_hub/placement_planner"
          type: "pure_actor"
          llm_usage: false
          purpose: "NPU/GPU/CPU/Remote selector (thermal-aware)"
          responsibilities:
            - "Select best execution target (NPU/GPU/CPU/Remote)"
            - "Thermal-aware placement (avoid overheating)"
            - "Fallback cascade (NPU → GPU → CPU → Remote)"
          files: 15
          loc: 1000
          performance_budgets:
            placement_decision_ms: 10
          dependencies:
            layer5:
              - "infrastructure/thermal"
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/model_hub/test_placement_planner.py"

        - module_id: "m016"
          name: "model_hub/adapters"
          type: "pure_actor"
          llm_usage: false
          purpose: "Provider adapters (OpenAI, Anthropic, vLLM, Ollama)"
          responsibilities:
            - "Unified interface to LLM providers"
            - "API client implementations (OpenAI, Anthropic, vLLM, Ollama)"
            - "Request/response normalization"
          files: 20
          loc: 1500
          performance_budgets:
            adapter_overhead_ms: 5
          dependencies:
            layer5:
              - "infrastructure/metrics"
          external_dependencies:
            - "openai"
            - "anthropic"
            - "vllm"
            - "ollama"
          comment: "API clients, not AI agents themselves"
          tests:
            unit: "tests/unit/model_hub/test_adapters.py"

        - module_id: "m017"
          name: "model_hub/kv_cache_broker"
          type: "pure_actor"
          llm_usage: false
          purpose: "Global KV cache manager (75% hit rate target)"
          responsibilities:
            - "Manage KV cache across sessions"
            - "Eviction policy (LRU + priority tiers)"
            - "Target 75% hit rate (reduce LLM calls)"
          files: 12
          loc: 900
          performance_budgets:
            cache_lookup_ms: 1
            cache_eviction_ms: 10
          memory_budget:
            kv_cache_size_mb: 128
          dependencies:
            layer5:
              - "infrastructure/cache"
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/model_hub/test_kv_cache_broker.py"

        - module_id: "m018"
          name: "model_hub/prompt_library"
          type: "pure_actor"
          llm_usage: false
          purpose: "Prompt templates (role-based, size-based)"
          responsibilities:
            - "Store agent persona prompts (Concierge, Planner, Researcher, Safety Watch)"
            - "Jinja2 template rendering"
            - "Prompt versioning (A/B testing)"
          files: 10
          loc: 700
          performance_budgets:
            template_render_ms: 5
          dependencies:
            layer5:
              - "config/global"
          tests:
            unit: "tests/unit/model_hub/test_prompt_library.py"

        - module_id: "m019"
          name: "model_hub/fallback_cascade"
          type: "pure_actor"
          llm_usage: false
          purpose: "Model fallback routing (primary → backup → local → template)"
          responsibilities:
            - "Fallback cascade: Primary model → Backup model → Local model → Template response"
            - "Timeout handling (retry with fallback)"
            - "Circuit breaker (disable failing models)"
          files: 12
          loc: 800
          performance_budgets:
            fallback_decision_ms: 10
          dependencies:
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/model_hub/test_fallback_cascade.py"

        - module_id: "m020"
          name: "model_hub/safety_filter"
          type: "ai_agent"
          llm_usage: true
          model_hub_calls: true
          purpose: "Content safety (3-tier: regex <1ms, ONNX 2-3ms, LLM <50ms)"
          responsibilities:
            - "Tier 1 (regex): Explicit banned words (<1ms)"
            - "Tier 2 (ONNX): Semantic safety classifier (2-3ms)"
            - "Tier 3 (LLM): Complex safety judgment (<50ms)"
            - "Block unsafe content (hate, violence, CSAM)"
          files: 15
          loc: 1000
          llm_budget_ms: 50
          performance_budgets:
            tier1_latency_ms: 1
            tier2_latency_ms: 3
            tier3_latency_ms: 50
          dependencies:
            layer4:
              - "runtime/session_state"
            layer5:
              - "infrastructure/metrics"
          comment: "Safety Watch AI agent (4th AI agent)"
          tests:
            unit: "tests/unit/model_hub/test_safety_filter.py"

    tool_execution:
      module_count: 5
      modules:
        - module_id: "m021"
          name: "tools/runner"
          type: "pure_actor"
          llm_usage: false
          purpose: "Tool execution engine (MCP/WASM/Process sandboxes)"
          responsibilities:
            - "Execute tools in sandboxes (MCP stdio, WASM WASI, process cgroups)"
            - "Timeout enforcement (default: 30 seconds)"
            - "Resource limits (CPU, memory, network)"
          files: 18
          loc: 1200
          performance_budgets:
            tool_spawn_ms: 100
            tool_execute_ms: 3000
          dependencies:
            layer4:
              - "runtime/session_state"
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/tools/test_runner.py"
            integration: "tests/integration/layer3/test_tool_execution.py"

        - module_id: "m022"
          name: "tools/sandbox"
          type: "pure_actor"
          llm_usage: false
          purpose: "Isolation layers (MCP stdio, WASM WASI, process cgroups)"
          responsibilities:
            - "MCP sandbox: stdio isolation (localhost only)"
            - "WASM sandbox: WASI runtime (filesystem, network limits)"
            - "Process sandbox: cgroups (CPU, memory, network)"
          files: 15
          loc: 1000
          performance_budgets:
            sandbox_setup_ms: 50
          dependencies:
            layer5:
              - "infrastructure/metrics"
          external_dependencies:
            - "wasmtime (WASM runtime)"
            - "cgroups (process isolation)"
          tests:
            unit: "tests/unit/tools/test_sandbox.py"

        - module_id: "m023"
          name: "tools/registry"
          type: "pure_actor"
          llm_usage: false
          purpose: "Tool catalog (JSON specs with side_effects, latency_hint, cost_hint)"
          responsibilities:
            - "Load tool specs from k1/tools/registry/*.json"
            - "Provide tool lookup by tool_name"
            - "Store tool metadata (side_effects, latency, cost)"
          files: 10
          loc: 700
          performance_budgets:
            tool_lookup_ms: 1
          dependencies:
            layer5:
              - "config/global"
          tests:
            unit: "tests/unit/tools/test_registry.py"

        - module_id: "m024"
          name: "tools/adapters"
          type: "pure_actor"
          llm_usage: false
          purpose: "Protocol adapters (MCP, REST, CLI)"
          responsibilities:
            - "MCP adapter: stdio protocol"
            - "REST adapter: HTTP API calls"
            - "CLI adapter: command-line tool execution"
          files: 15
          loc: 1000
          performance_budgets:
            adapter_overhead_ms: 10
          dependencies:
            layer5:
              - "infrastructure/metrics"
          tests:
            unit: "tests/unit/tools/test_adapters.py"

        - module_id: "m025"
          name: "tools/control"
          type: "pure_actor"
          llm_usage: false
          purpose: "Runtime tool management (enable/disable, version, shed)"
          responsibilities:
