prompt_contract:
  name: tasks_activity_v1
  version: "1.0.0"
  domain:
    - tasks
    - family
    - coordination
  description: Task activity execution guidance.
  activity_profile: tasks.v1
  intent_match:
    - create family task
    - update task assignment
    - review task list
  variables: []
  template_file: k1/prompts/activities/tasks_activity_v1.md
  max_tokens: 900
  output_format: TEXT
  compatible_tools:
    - tool.read.tasks.list_tasks
    - tool.read.tasks.get_task
    - tool.execute.tasks.create_task
    - tool.execute.tasks.update_task
    - tool.execute.tasks.complete_task
    - tool.execute.tasks.reopen_task
    - tool.execute.tasks.reassign_task
    - tool.execute.tasks.delete_task
    - tool.execute.tasks.create_list
    - tool.read.tasks.list_lists
