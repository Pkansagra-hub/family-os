prompt_contract:
  name: shopping_activity_v1
  version: "1.0.0"
  domain:
    - shopping
    - family
    - coordination
  description: Shopping activity execution guidance.
  activity_profile: shopping.v1
  intent_match:
    - add shopping item
    - review shopping list
    - approve child shopping request
    - check off shopping item
  variables: []
  template_file: k1/prompts/activities/shopping_activity_v1.md
  max_tokens: 900
  output_format: TEXT
  compatible_tools:
    - tool.read.shopping.list_lists
    - tool.read.shopping.list_items
    - tool.read.shopping.get_item
    - tool.execute.shopping.create_list
    - tool.execute.shopping.add_item
    - tool.execute.shopping.update_item
    - tool.execute.shopping.approve_item
    - tool.execute.shopping.reject_item
    - tool.execute.shopping.check_off_item
    - tool.execute.shopping.delete_item
    - tool.execute.shopping.delete_list
