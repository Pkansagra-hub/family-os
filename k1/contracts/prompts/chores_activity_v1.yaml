prompt_contract:
  name: chores_activity_v1
  version: "1.0.0"
  domain:
    - chores
    - family
    - coordination
  description: Chore activity execution guidance.
  activity_profile: chores.v1
  intent_match:
    - create family chore
    - assign chore occurrence
    - complete chore
    - review chore board
    - review chore points
  variables: []
  template_file: k1/prompts/activities/chores_activity_v1.md
  max_tokens: 900
  output_format: TEXT
  compatible_tools:
    - tool.read.chores.list_chores
    - tool.read.chores.chore_summary
    - tool.execute.chores.create_template
    - tool.execute.chores.update_template
    - tool.execute.chores.delete_template
    - tool.execute.chores.assign_chore
    - tool.execute.chores.complete_chore
    - tool.execute.chores.skip_chore
    - tool.execute.chores.reopen_chore
