prompt_contract:
  name: reminders_activity_v1
  version: "1.0.0"
  domain:
    - reminders
    - family
    - coordination
  description: Reminder activity execution guidance.
  activity_profile: reminders.v1
  intent_match:
    - create reminder
    - update reminder trigger
    - review upcoming reminders
  variables: []
  template_file: k1/prompts/activities/reminders_activity_v1.md
  max_tokens: 900
  output_format: TEXT
  compatible_tools:
    - tool.read.reminders.list_reminders
    - tool.read.reminders.get_reminder
    - tool.execute.reminders.create_reminder
    - tool.execute.reminders.update_reminder
    - tool.execute.reminders.snooze_reminder
    - tool.execute.reminders.dismiss_reminder
    - tool.execute.reminders.delete_reminder
