classes:
  - name: ApiGatewayResponse
    description: API Gateway backpressure handler implementing tier-based admission control and HTTP response throttling
    research: ADR-0039b (backpressure propagation & signal flow), API gateway patterns, admission control
    performance_budget: <1ms admission check, <10ms response throttling, <100ms request rejection
    reliability_properties:
      - tier_based_responses: Different HTTP responses based on backpressure tier
      - admission_control: Request filtering based on current backpressure state
      - graceful_degradation: Service unavailable responses instead of crashes
      - load_shedding: Reject requests before they consume resources
    methods:
      - name: on_backpressure_signal
        description: Handle backpressure signal and update admission control state
        parameters:
          - name: signal
            type: BackpressureSignal
            description: Backpressure signal with tier and reason
        returns:
          type: Result<(), BackpressureError>
          description: Success or error if signal handling fails
        implementation:
          rust: |
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use serde::{Serialize, Deserialize};

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub enum AdmissionResponse {
                Allow,
                Reject { status_code: u16, message: String, retry_after_seconds: Option<u32> },
            }

            #[derive(Debug)]
            pub enum BackpressureError {
                InvalidSignal,
                StateUpdateFailure,
            }

            pub struct ApiGatewayResponse {
                current_tier: Arc<Mutex<super::super::watermark_thresholds::BackpressureTier>>,
                admission_rate: Arc<Mutex<f64>>, // 0.0 to 1.0
            }

            impl ApiGatewayResponse {
                pub fn new() -> Self {
                    Self {
                        current_tier: Arc::new(Mutex::new(super::super::watermark_thresholds::BackpressureTier::NORMAL)),
                        admission_rate: Arc::new(Mutex::new(1.0)), // 100% admission in normal state
                    }
                }

                pub async fn on_backpressure_signal(
                    &self,
                    signal: super::backpressure_signal::BackpressureSignal,
                ) -> Result<(), BackpressureError> {
                    tracing::info!(
                        tier = ?signal.tier,
                        reason = %signal.reason,
                        trace_id = %signal.trace_id,
                        "API Gateway received backpressure signal"
                    );

                    // Update current tier
                    {
                        let mut tier = self.current_tier.lock().await;
                        *tier = signal.tier;
                    }

                    // Update admission rate based on tier
                    let new_admission_rate = match signal.tier {
                        super::super::watermark_thresholds::BackpressureTier::NORMAL => 1.0,      // 100% admission
                        super::super::watermark_thresholds::BackpressureTier::REJECT_NEW => 0.5, // 50% admission (reject background)
                        super::super::watermark_thresholds::BackpressureTier::CANCEL_BG => 0.2,  // 20% admission (throttle heavily)
                        super::super::watermark_thresholds::BackpressureTier::EMERGENCY => 0.0,  // 0% admission (reject all)
                    };

                    {
                        let mut rate = self.admission_rate.lock().await;
                        *rate = new_admission_rate;
                    }

                    // Emit metrics
                    metrics::gauge!("api_gateway_admission_rate")
                        .with_label_values(&[])
                        .set(new_admission_rate);

                    metrics::counter!("api_gateway_backpressure_signals_received_total")
                        .with_label_values(&[&signal.tier.as_str()])
                        .inc();

                    tracing::warn!(
                        tier = ?signal.tier,
                        admission_rate = new_admission_rate,
                        "API Gateway admission control updated"
                    );

                    Ok(())
                }

                pub async fn check_admission(&self) -> AdmissionResponse {
                    let tier = *self.current_tier.lock().await;
                    let admission_rate = *self.admission_rate.lock().await;

                    match tier {
                        super::super::watermark_thresholds::BackpressureTier::NORMAL => {
                            AdmissionResponse::Allow
                        }
                        super::super::watermark_thresholds::BackpressureTier::REJECT_NEW => {
                            // Reject background requests (non-interactive)
                            // In practice, this would check request type/metadata
                            AdmissionResponse::Reject {
                                status_code: 503,
                                message: "Service temporarily unavailable - background requests rejected".to_string(),
                                retry_after_seconds: Some(30),
                            }
                        }
                        super::super::watermark_thresholds::BackpressureTier::CANCEL_BG => {
                            // Reject most requests
                            AdmissionResponse::Reject {
                                status_code: 503,
                                message: "Service temporarily unavailable - high load".to_string(),
                                retry_after_seconds: Some(60),
                            }
                        }
                        super::super::watermark_thresholds::BackpressureTier::EMERGENCY => {
                            // Reject all requests
                            AdmissionResponse::Reject {
                                status_code: 503,
                                message: "Service temporarily unavailable - emergency backpressure".to_string(),
                                retry_after_seconds: Some(120),
                            }
                        }
                    }
                }

                pub async fn get_current_tier(&self) -> super::super::watermark_thresholds::BackpressureTier {
                    *self.current_tier.lock().await
                }

                pub async fn get_admission_rate(&self) -> f64 {
                    *self.admission_rate.lock().await
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Optional, Any
            from enum import Enum
            import logging

            class AdmissionResponse(Enum):
                """Response to admission check"""
                ALLOW = "allow"
                REJECT = "reject"

            @dataclass
            class RejectionDetails:
                """Details for rejected requests"""
                status_code: int
                message: str
                retry_after_seconds: Optional[int] = None

            class BackpressureError(Exception):
                """Error in backpressure handling"""
                pass

            class ApiGatewayResponse:
                """API Gateway backpressure handler with tier-based admission control"""

                def __init__(self):
                    self.current_tier = None  # BackpressureTier.NORMAL initially
                    self.admission_rate = 1.0  # 100% admission in normal state
                    self.logger = logging.getLogger(__name__)

                async def on_backpressure_signal(self, signal: Any) -> None:  # signal: BackpressureSignal
                    """Handle backpressure signal and update admission control"""
                    self.logger.info(
                        f"API Gateway received backpressure signal: {signal.tier.name}",
                        extra={
                            'tier': signal.tier.name,
                            'reason': signal.reason,
                            'trace_id': signal.trace_id
                        }
                    )

                    # Update current tier
                    self.current_tier = signal.tier

                    # Update admission rate based on tier
                    if signal.tier.name == "NORMAL":
                        self.admission_rate = 1.0  # 100% admission
                    elif signal.tier.name == "REJECT_NEW":
                        self.admission_rate = 0.5  # 50% admission (reject background)
                    elif signal.tier.name == "CANCEL_BG":
                        self.admission_rate = 0.2  # 20% admission (throttle heavily)
                    elif signal.tier.name == "EMERGENCY":
                        self.admission_rate = 0.0  # 0% admission (reject all)
                    else:
                        raise BackpressureError(f"Unknown backpressure tier: {signal.tier}")

                    # Emit metrics (placeholder)
                    self._emit_admission_metrics(signal.tier.name, self.admission_rate)

                    self.logger.warning(
                        f"API Gateway admission control updated: {signal.tier.name} (rate: {self.admission_rate})",
                        extra={
                            'tier': signal.tier.name,
                            'admission_rate': self.admission_rate
                        }
                    )

                def check_admission(self) -> AdmissionResponse | RejectionDetails:
                    """Check if request should be admitted based on current backpressure state"""
                    if not self.current_tier:
                        return AdmissionResponse.ALLOW

                    tier_name = self.current_tier.name

                    if tier_name == "NORMAL":
                        return AdmissionResponse.ALLOW
                    elif tier_name == "REJECT_NEW":
                        # Reject background requests (non-interactive)
                        return RejectionDetails(
                            status_code=503,
                            message="Service temporarily unavailable - background requests rejected",
                            retry_after_seconds=30
                        )
                    elif tier_name == "CANCEL_BG":
                        # Reject most requests
                        return RejectionDetails(
                            status_code=503,
                            message="Service temporarily unavailable - high load",
                            retry_after_seconds=60
                        )
                    elif tier_name == "EMERGENCY":
                        # Reject all requests
                        return RejectionDetails(
                            status_code=503,
                            message="Service temporarily unavailable - emergency backpressure",
                            retry_after_seconds=120
                        )
                    else:
                        # Fallback to allow for unknown tiers
                        return AdmissionResponse.ALLOW

                def get_current_tier(self) -> Any:  # Returns BackpressureTier
                    """Get current backpressure tier"""
                    return self.current_tier

                def get_admission_rate(self) -> float:
                    """Get current admission rate (0.0 to 1.0)"""
                    return self.admission_rate

                def _emit_admission_metrics(self, tier_name: str, admission_rate: float):
                    """Emit admission control metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                # BackpressureComponent interface implementation
                def name(self) -> str:
                    return "api_gateway"

                def component_type(self) -> Any:  # Returns ComponentType
                    return None  # Would be ComponentType.API_GATEWAY

                def priority(self) -> int:
                    return 100  # High priority - API Gateway is critical

                def capabilities(self) -> list[str]:
                    return ["admission_control", "http_responses", "load_shedding"]

admission_control_logic:
  - normal_tier: Allow all requests (HTTP 200)
  - reject_new_tier: Reject background/non-interactive requests (HTTP 503)
  - cancel_bg_tier: Reject most requests, allow only critical (HTTP 503)
  - emergency_tier: Reject all requests (HTTP 503)

http_response_codes:
  - 200: Request allowed
  - 503: Service unavailable due to backpressure
  - retry_after: Seconds to wait before retrying

load_shedding_strategy:
  - request_classification: Background vs interactive requests
  - priority_based: Critical requests allowed even in high tiers
  - graceful_rejection: Proper HTTP responses with retry guidance
  - metrics_tracking: Admission rate and rejection counts monitored
