classes:
  - name: BackpressureSignal
    description: Immutable signal representing a backpressure tier change with priority ordering for event-driven propagation
    research: ADR-0039b (backpressure propagation & signal flow), event-driven architecture, priority queues
    performance_budget: <1ms signal creation, <0.1ms priority comparison, <10MB memory per 1000 signals
    reliability_properties:
      - immutable_signal: Once created, signal properties cannot be modified
      - priority_based_ordering: Higher tier signals take precedence in queues
      - timestamp_accuracy: Unix timestamp with millisecond precision for debugging
      - trace_correlation: Cognitive trace ID links signals to originating events
    methods:
      - name: new
        description: Create a new backpressure signal with current timestamp and trace correlation
        parameters:
          - name: tier
            type: BackpressureTier
            description: The backpressure tier this signal represents
          - name: reason
            type: String
            description: Human-readable explanation of why this tier was triggered
          - name: trace_id
            type: String
            description: Cognitive trace ID for debugging and correlation
        returns:
          type: BackpressureSignal
          description: New immutable signal instance
        implementation:
          rust: |
            use serde::{Serialize, Deserialize};
            use std::cmp::Ordering;

            #[derive(Serialize, Deserialize, Debug, Clone, PartialEq, Eq)]
            pub struct BackpressureSignal {
                pub tier: super::super::watermark_thresholds::BackpressureTier,
                pub timestamp: f64,
                pub reason: String,
                pub trace_id: String,
            }

            impl BackpressureSignal {
                pub fn new(
                    tier: super::super::watermark_thresholds::BackpressureTier,
                    reason: String,
                    trace_id: String,
                ) -> Self {
                    Self {
                        tier,
                        timestamp: std::time::SystemTime::now()
                            .duration_since(std::time::UNIX_EPOCH)
                            .unwrap()
                            .as_secs_f64(),
                        reason,
                        trace_id,
                    }
                }

                pub fn priority(&self) -> i32 {
                    // Higher tier = higher priority (EMERGENCY = 3, CANCEL_BG = 2, REJECT_NEW = 1, NORMAL = 0)
                    self.tier as i32
                }
            }

            impl PartialOrd for BackpressureSignal {
                fn partial_cmp(&self, other: &Self) -> Option<Ordering> {
                    Some(self.priority().cmp(&other.priority()))
                }
            }

            impl Ord for BackpressureSignal {
                fn cmp(&self, other: &Self) -> Ordering {
                    self.priority().cmp(&other.priority())
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Any
            import time

            @dataclass(frozen=True)  # Immutable
            class BackpressureSignal:
                """Immutable backpressure signal with priority ordering"""

                tier: 'BackpressureTier'
                timestamp: float
                reason: str
                trace_id: str

                def __post_init__(self):
                    if self.timestamp == 0:
                        object.__setattr__(self, 'timestamp', time.time())

                @property
                def priority(self) -> int:
                    """Higher tier = higher priority for queue ordering"""
                    return self.tier.value

                def __lt__(self, other: 'BackpressureSignal') -> bool:
                    """Less than comparison for priority queue (heapq)"""
                    return self.priority < other.priority

                def __le__(self, other: 'BackpressureSignal') -> bool:
                    """Less than or equal comparison"""
                    return self.priority <= other.priority

                def __gt__(self, other: 'BackpressureSignal') -> bool:
                    """Greater than comparison"""
                    return self.priority > other.priority

                def __ge__(self, other: 'BackpressureSignal') -> bool:
                    """Greater than or equal comparison"""
                    return self.priority >= other.priority

                @classmethod
                def create(
                    cls,
                    tier: 'BackpressureTier',
                    reason: str,
                    trace_id: str
                ) -> 'BackpressureSignal':
                    """Factory method for creating signals with current timestamp"""
                    return cls(
                        tier=tier,
                        timestamp=time.time(),
                        reason=reason,
                        trace_id=trace_id
                    )

signal_properties:
  - tier_hierarchy: EMERGENCY (3) > CANCEL_BG (2) > REJECT_NEW (1) > NORMAL (0)
  - timestamp_precision: Millisecond precision Unix timestamp
  - reason_context: Human-readable explanation (e.g., "queue_depth > 200", "memory > 480MB")
  - trace_correlation: Links to cognitive trace ID for debugging
  - immutability: Signals cannot be modified after creation
  - priority_queuing: Higher tier signals processed first in event queues

usage_patterns:
  - watermark_transitions: WatermarkManager creates signal on tier change
  - event_propagation: Signals broadcast to all registered components
  - queue_prioritization: Higher priority signals preempt lower priority ones
  - debugging_correlation: Trace ID links signals to originating metrics
