classes:
  - name: AgentFabricResponse
    description: Agent Fabric backpressure handler managing agent lifecycle, resource allocation, and garbage collection based on tier
    research: ADR-0039b (backpressure propagation & signal flow), agent lifecycle management, resource allocation
    performance_budget: <10ms agent draining, <50ms resource cleanup, <100ms garbage collection
    reliability_properties:
      - tier_based_lifecycle: Different agent lifecycle behaviors per backpressure tier
      - resource_conservation: Reduce resource allocation in high tiers
      - garbage_collection: Force GC and cache eviction in emergency
      - graceful_degradation: Drain agents before force termination
    methods:
      - name: on_backpressure_signal
        description: Handle backpressure signal and adjust agent lifecycle management
        parameters:
          - name: signal
            type: BackpressureSignal
            description: Backpressure signal with tier and reason
        returns:
          type: Result<(), BackpressureError>
          description: Success or error if signal handling fails
        implementation:
          rust: |
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use std::collections::HashMap;
            use serde::{Serialize, Deserialize};

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub enum AgentLifecycleDecision {
                AllowHiring,
                RejectHiring { reason: String },
                DrainIdleAgents,
                DrainAllAgents,
                ForceGC,
            }

            #[derive(Debug)]
            pub enum BackpressureError {
                AgentDrainingFailure,
                ResourceCleanupFailure,
            }

            pub struct AgentFabricResponse {
                current_tier: Arc<Mutex<super::super::watermark_thresholds::BackpressureTier>>,
                active_agents: Arc<Mutex<HashMap<String, AgentState>>>,
                idle_agents: Arc<Mutex<HashMap<String, AgentState>>>,
                resource_limits: Arc<Mutex<ResourceLimits>>,
            }

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct AgentState {
                pub agent_id: String,
                pub state: String, // PENDING, WARMING, ACTIVE, IDLE, DRAINING, TERMINATED
                pub created_at: f64,
                pub last_active: f64,
            }

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct ResourceLimits {
                pub max_agents: usize,
                pub memory_limit_mb: usize,
                pub cpu_limit_percent: f64,
            }

            impl AgentFabricResponse {
                pub fn new() -> Self {
                    Self {
                        current_tier: Arc::new(Mutex::new(super::super::watermark_thresholds::BackpressureTier::NORMAL)),
                        active_agents: Arc::new(Mutex::new(HashMap::new())),
                        idle_agents: Arc::new(Mutex::new(HashMap::new())),
                        resource_limits: Arc::new(Mutex::new(ResourceLimits {
                            max_agents: 100,
                            memory_limit_mb: 1024,
                            cpu_limit_percent: 80.0,
                        })),
                    }
                }

                pub async fn on_backpressure_signal(
                    &self,
                    signal: super::backpressure_signal::BackpressureSignal,
                ) -> Result<(), BackpressureError> {
                    tracing::info!(
                        tier = ?signal.tier,
                        reason = %signal.reason,
                        trace_id = %signal.trace_id,
                        "Agent Fabric received backpressure signal"
                    );

                    // Update current tier
                    {
                        let mut tier = self.current_tier.lock().await;
                        *tier = signal.tier;
                    }

                    // Adjust behavior based on tier
                    match signal.tier {
                        super::super::watermark_thresholds::BackpressureTier::NORMAL => {
                            // Normal operation - full agent lifecycle
                            self.restore_normal_operation().await;
                            tracing::info!("Agent Fabric: Normal operation resumed");
                        }
                        super::super::watermark_thresholds::BackpressureTier::REJECT_NEW => {
                            // No change to existing agents, reject background hiring
                            tracing::warn!("Agent Fabric: Rejecting background agent hiring");
                        }
                        super::super::watermark_thresholds::BackpressureTier::CANCEL_BG => {
                            // Drain idle agents, reject background hiring
                            let drained_count = self.drain_idle_agents().await;
                            tracing::warn!(
                                drained_count = drained_count,
                                "Agent Fabric: Drained idle agents"
                            );
                        }
                        super::super::watermark_thresholds::BackpressureTier::EMERGENCY => {
                            // Drain all agents, force GC, evict caches
                            let drained_count = self.drain_all_agents().await;
                            self.force_garbage_collection().await;
                            tracing::error!(
                                drained_count = drained_count,
                                "Agent Fabric: Emergency - drained all agents and forced GC"
                            );
                        }
                    }

                    // Emit metrics
                    let active_count = self.active_agents.lock().await.len();
                    let idle_count = self.idle_agents.lock().await.len();

                    metrics::gauge!("agent_fabric_active_agents")
                        .with_label_values(&[])
                        .set(active_count as f64);

                    metrics::gauge!("agent_fabric_idle_agents")
                        .with_label_values(&[])
                        .set(idle_count as f64);

                    metrics::counter!("agent_fabric_backpressure_signals_received_total")
                        .with_label_values(&[&signal.tier.as_str()])
                        .inc();

                    Ok(())
                }

                pub async fn make_lifecycle_decision(&self, is_background_hiring: bool) -> AgentLifecycleDecision {
                    let tier = *self.current_tier.lock().await;

                    match tier {
                        super::super::watermark_thresholds::BackpressureTier::NORMAL => {
                            AgentLifecycleDecision::AllowHiring
                        }
                        super::super::watermark_thresholds::BackpressureTier::REJECT_NEW => {
                            if is_background_hiring {
                                AgentLifecycleDecision::RejectHiring {
                                    reason: "Background agent hiring rejected in Tier 1".to_string(),
                                }
                            } else {
                                AgentLifecycleDecision::AllowHiring
                            }
                        }
                        super::super::watermark_thresholds::BackpressureTier::CANCEL_BG => {
                            if is_background_hiring {
                                AgentLifecycleDecision::RejectHiring {
                                    reason: "Background agent hiring rejected in Tier 2".to_string(),
                                }
                            } else {
                                AgentLifecycleDecision::DrainIdleAgents
                            }
                        }
                        super::super::watermark_thresholds::BackpressureTier::EMERGENCY => {
                            AgentLifecycleDecision::DrainAllAgents
                        }
                    }
                }

                async fn drain_idle_agents(&self) -> usize {
                    let mut idle_agents = self.idle_agents.lock().await;
                    let drain_count = idle_agents.len();

                    for (agent_id, _) in idle_agents.drain() {
                        // Signal agent to terminate
                        self.terminate_agent(&agent_id).await;
                        tracing::debug!(agent_id = %agent_id, "Drained idle agent");
                    }

                    metrics::counter!("agent_fabric_idle_agents_drained_total")
                        .with_label_values(&[])
                        .inc_by(drain_count as u64);

                    drain_count
                }

                async fn drain_all_agents(&self) -> usize {
                    let mut active_agents = self.active_agents.lock().await;
                    let mut idle_agents = self.idle_agents.lock().await;

                    let active_count = active_agents.len();
                    let idle_count = idle_agents.len();
                    let total_count = active_count + idle_count;

                    // Drain idle agents first
                    for (agent_id, _) in idle_agents.drain() {
                        self.terminate_agent(&agent_id).await;
                    }

                    // Then drain active agents
                    for (agent_id, _) in active_agents.drain() {
                        self.terminate_agent(&agent_id).await;
                    }

                    metrics::counter!("agent_fabric_agents_drained_total")
                        .with_label_values(&["emergency"])
                        .inc_by(total_count as u64);

                    tracing::warn!(
                        active_drained = active_count,
                        idle_drained = idle_count,
                        "Emergency agent draining completed"
                    );

                    total_count
                }

                async fn force_garbage_collection(&self) {
                    // Force garbage collection and cache eviction
                    tracing::info!("Agent Fabric: Forcing garbage collection and cache eviction");

                    // In practice, this would:
                    // 1. Force GC on agent runtimes
                    // 2. Evict agent caches
                    // 3. Clear temporary files
                    // 4. Release unused memory

                    metrics::counter!("agent_fabric_gc_forced_total")
                        .with_label_values(&[])
                        .inc();
                }

                async fn restore_normal_operation(&self) {
                    // Restore normal resource limits
                    let mut limits = self.resource_limits.lock().await;
                    limits.max_agents = 100;
                    limits.memory_limit_mb = 1024;
                    limits.cpu_limit_percent = 80.0;

                    tracing::info!("Agent Fabric: Normal resource limits restored");
                }

                async fn terminate_agent(&self, agent_id: &str) {
                    // Signal agent to terminate gracefully
                    // In practice, this would send termination signal to agent
                    tracing::debug!(agent_id = %agent_id, "Terminating agent");
                }

                pub async fn register_agent(&self, agent_id: String, is_active: bool) {
                    let agent_state = AgentState {
                        agent_id: agent_id.clone(),
                        state: if is_active { "ACTIVE" } else { "IDLE" }.to_string(),
                        created_at: std::time::SystemTime::now()
                            .duration_since(std::time::UNIX_EPOCH)
                            .unwrap()
                            .as_secs_f64(),
                        last_active: std::time::SystemTime::now()
                            .duration_since(std::time::UNIX_EPOCH)
                            .unwrap()
                            .as_secs_f64(),
                    };

                    if is_active {
                        let mut active_agents = self.active_agents.lock().await;
                        active_agents.insert(agent_id, agent_state);
                    } else {
                        let mut idle_agents = self.idle_agents.lock().await;
                        idle_agents.insert(agent_id, agent_state);
                    }
                }

                pub async fn get_current_tier(&self) -> super::super::watermark_thresholds::BackpressureTier {
                    *self.current_tier.lock().await
                }

                pub async fn get_agent_counts(&self) -> (usize, usize) {
                    let active_count = self.active_agents.lock().await.len();
                    let idle_count = self.idle_agents.lock().await.len();
                    (active_count, idle_count)
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Dict, Optional, Any, Tuple
            from enum import Enum
            import time
            import logging

            class AgentLifecycleDecision(Enum):
                """Decision on agent lifecycle management"""
                ALLOW_HIRING = "allow_hiring"
                REJECT_HIRING = "reject_hiring"
                DRAIN_IDLE_AGENTS = "drain_idle_agents"
                DRAIN_ALL_AGENTS = "drain_all_agents"
                FORCE_GC = "force_gc"

            @dataclass
            class RejectionReason:
                """Reason for rejecting agent hiring"""
                reason: str

            class BackpressureError(Exception):
                """Error in backpressure handling"""
                pass

            @dataclass
            class AgentState:
                """State of an agent"""
                agent_id: str
                state: str  # PENDING, WARMING, ACTIVE, IDLE, DRAINING, TERMINATED
                created_at: float
                last_active: float

            @dataclass
            class ResourceLimits:
                """Resource limits for agent fabric"""
                max_agents: int
                memory_limit_mb: int
                cpu_limit_percent: float

            class AgentFabricResponse:
                """Agent Fabric backpressure handler managing agent lifecycle"""

                def __init__(self):
                    self.current_tier = None  # BackpressureTier.NORMAL initially
                    self.active_agents: Dict[str, AgentState] = {}
                    self.idle_agents: Dict[str, AgentState] = {}
                    self.resource_limits = ResourceLimits(
                        max_agents=100,
                        memory_limit_mb=1024,
                        cpu_limit_percent=80.0
                    )
                    self.logger = logging.getLogger(__name__)

                async def on_backpressure_signal(self, signal: Any) -> None:  # signal: BackpressureSignal
                    """Handle backpressure signal and adjust agent lifecycle"""
                    self.logger.info(
                        f"Agent Fabric received backpressure signal: {signal.tier.name}",
                        extra={
                            'tier': signal.tier.name,
                            'reason': signal.reason,
                            'trace_id': signal.trace_id
                        }
                    )

                    # Update current tier
                    self.current_tier = signal.tier
                    tier_name = signal.tier.name

                    # Adjust behavior based on tier
                    if tier_name == "NORMAL":
                        # Normal operation - full agent lifecycle
                        await self._restore_normal_operation()
                        self.logger.info("Agent Fabric: Normal operation resumed")

                    elif tier_name == "REJECT_NEW":
                        # No change to existing agents, reject background hiring
                        self.logger.warning("Agent Fabric: Rejecting background agent hiring")

                    elif tier_name == "CANCEL_BG":
                        # Drain idle agents, reject background hiring
                        drained_count = await self._drain_idle_agents()
                        self.logger.warning(
                            f"Agent Fabric: Drained {drained_count} idle agents"
                        )

                    elif tier_name == "EMERGENCY":
                        # Drain all agents, force GC, evict caches
                        drained_count = await self._drain_all_agents()
                        await self._force_garbage_collection()
                        self.logger.error(
                            f"Agent Fabric: Emergency - drained {drained_count} agents and forced GC"
                        )
                    else:
                        raise BackpressureError(f"Unknown backpressure tier: {tier_name}")

                    # Emit metrics (placeholder)
                    active_count, idle_count = self._get_agent_counts()
                    self._emit_agent_metrics(tier_name, active_count, idle_count)

                def make_lifecycle_decision(self, is_background_hiring: bool) -> AgentLifecycleDecision | RejectionReason:
                    """Decide on agent lifecycle management based on current backpressure state"""
                    if not self.current_tier:
                        return AgentLifecycleDecision.ALLOW_HIRING

                    tier_name = self.current_tier.name

                    if tier_name == "NORMAL":
                        return AgentLifecycleDecision.ALLOW_HIRING
                    elif tier_name == "REJECT_NEW":
                        if is_background_hiring:
                            return RejectionReason(reason="Background agent hiring rejected in Tier 1")
                        else:
                            return AgentLifecycleDecision.ALLOW_HIRING
                    elif tier_name == "CANCEL_BG":
                        if is_background_hiring:
                            return RejectionReason(reason="Background agent hiring rejected in Tier 2")
                        else:
                            return AgentLifecycleDecision.DRAIN_IDLE_AGENTS
                    elif tier_name == "EMERGENCY":
                        return AgentLifecycleDecision.DRAIN_ALL_AGENTS
                    else:
                        # Fallback to allow for unknown tiers
                        return AgentLifecycleDecision.ALLOW_HIRING

                async def _drain_idle_agents(self) -> int:
                    """Drain all idle agents"""
                    drain_count = len(self.idle_agents)
                    agents_to_drain = list(self.idle_agents.keys())

                    for agent_id in agents_to_drain:
                        await self._terminate_agent(agent_id)
                        del self.idle_agents[agent_id]
                        self.logger.debug(f"Drained idle agent: {agent_id}")

                    # Emit metrics (placeholder)
                    self._emit_draining_metrics("idle", drain_count)

                    return drain_count

                async def _drain_all_agents(self) -> int:
                    """Drain all active and idle agents"""
                    active_count = len(self.active_agents)
                    idle_count = len(self.idle_agents)
                    total_count = active_count + idle_count

                    # Drain idle agents first
                    for agent_id in list(self.idle_agents.keys()):
                        await self._terminate_agent(agent_id)
                        del self.idle_agents[agent_id]

                    # Then drain active agents
                    for agent_id in list(self.active_agents.keys()):
                        await self._terminate_agent(agent_id)
                        del self.active_agents[agent_id]

                    self.logger.warning(
                        f"Emergency agent draining: {active_count} active, {idle_count} idle"
                    )

                    # Emit metrics (placeholder)
                    self._emit_draining_metrics("emergency", total_count)

                    return total_count

                async def _force_garbage_collection(self):
                    """Force garbage collection and cache eviction"""
                    self.logger.info("Agent Fabric: Forcing garbage collection and cache eviction")

                    # In practice, this would:
                    # 1. Force GC on agent runtimes
                    # 2. Evict agent caches
                    # 3. Clear temporary files
                    # 4. Release unused memory

                    # Emit metrics (placeholder)
                    self._emit_gc_metrics()

                async def _restore_normal_operation(self):
                    """Restore normal resource limits"""
                    self.resource_limits = ResourceLimits(
                        max_agents=100,
                        memory_limit_mb=1024,
                        cpu_limit_percent=80.0
                    )
                    self.logger.info("Agent Fabric: Normal resource limits restored")

                async def _terminate_agent(self, agent_id: str):
                    """Terminate an agent gracefully"""
                    # In practice, this would send termination signal to agent
                    self.logger.debug(f"Terminating agent: {agent_id}")

                def register_agent(self, agent_id: str, is_active: bool):
                    """Register an agent for tracking"""
                    agent_state = AgentState(
                        agent_id=agent_id,
                        state="ACTIVE" if is_active else "IDLE",
                        created_at=time.time(),
                        last_active=time.time()
                    )

                    if is_active:
                        self.active_agents[agent_id] = agent_state
                    else:
                        self.idle_agents[agent_id] = agent_state

                def get_current_tier(self) -> Any:  # Returns BackpressureTier
                    """Get current backpressure tier"""
                    return self.current_tier

                def _get_agent_counts(self) -> Tuple[int, int]:
                    """Get counts of active and idle agents"""
                    return len(self.active_agents), len(self.idle_agents)

                def _emit_agent_metrics(self, tier_name: str, active_count: int, idle_count: int):
                    """Emit agent metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                def _emit_draining_metrics(self, drain_type: str, count: int):
                    """Emit agent draining metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                def _emit_gc_metrics(self):
                    """Emit garbage collection metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                # BackpressureComponent interface implementation
                def name(self) -> str:
                    return "agent_fabric"

                def component_type(self) -> Any:  # Returns ComponentType
                    return None  # Would be ComponentType.AGENT_FABRIC

                def priority(self) -> int:
                    return 80  # High priority - agent fabric is critical

                def capabilities(self) -> list[str]:
                    return ["agent_lifecycle", "resource_management", "garbage_collection"]

agent_lifecycle_logic:
  - normal_tier: Full agent lifecycle, hiring allowed
  - reject_new_tier: Reject background hiring, existing agents continue
  - cancel_bg_tier: Drain idle agents, reject background hiring
  - emergency_tier: Drain all agents, force GC, evict caches

resource_conservation:
  - memory_limits: Reduced memory allocation in high tiers
  - cpu_limits: CPU usage caps enforced
  - agent_limits: Maximum agent counts reduced
  - cache_eviction: Aggressive cache cleanup in emergency

garbage_collection:
  - forced_gc: Runtime GC triggered in emergency
  - cache_eviction: All caches cleared
  - temp_cleanup: Temporary files removed
  - memory_release: Unused memory freed

graceful_degradation:
  - idle_first: Idle agents terminated before active ones
  - background_priority: Background agents terminated first
  - graceful_termination: Allow agents to cleanup before termination
  - state_preservation: Agent state saved before termination
