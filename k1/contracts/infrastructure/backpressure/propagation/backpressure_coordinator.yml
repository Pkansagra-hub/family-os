classes:
  - name: BackpressureCoordinator
    description: Event-driven coordinator for backpressure signal propagation with <50ms latency guarantee and component isolation
    research: ADR-0039b (backpressure propagation & signal flow), actor model messaging, event-driven architecture
    performance_budget: <50ms total propagation latency (P95), <45ms per component callback, <25ms measured latency
    reliability_properties:
      - event_driven_broadcast: Actor model message passing for component isolation
      - parallel_execution: All components notified simultaneously via fan-out
      - failure_isolation: Component failures don't block signal propagation to others
      - latency_guarantee: <50ms total propagation to all registered components
      - priority_preemption: Higher tier signals override lower tier signals in flight
    methods:
      - name: register_callback
        description: Register a component callback for receiving backpressure signals
        parameters:
          - name: component_name
            type: String
            description: Unique identifier for the registering component
          - name: callback
            type: BackpressureCallback
            description: Async callback function to handle signals
        returns:
          type: Result<(), RegistrationError>
          description: Success or error if component already registered
        implementation:
          rust: |
            use std::collections::HashMap;
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use std::time::{Duration, Instant};

            pub type BackpressureCallback = Arc<dyn Fn(super::backpressure_signal::BackpressureSignal) -> Result<(), PropagationError> + Send + Sync>;

            #[derive(Debug)]
            pub enum RegistrationError {
                ComponentAlreadyRegistered(String),
                InvalidComponentName,
            }

            #[derive(Debug)]
            pub enum PropagationError {
                ComponentFailure(String, String), // component_name, error_message
                Timeout(Duration),
                BroadcastFailure(String),
            }

            pub struct BackpressureCoordinator {
                callbacks: Arc<Mutex<HashMap<String, BackpressureCallback>>>,
                current_signal: Arc<Mutex<Option<super::backpressure_signal::BackpressureSignal>>>,
                propagation_timeout: Duration,
            }

            impl BackpressureCoordinator {
                pub fn new() -> Self {
                    Self {
                        callbacks: Arc::new(Mutex::new(HashMap::new())),
                        current_signal: Arc::new(Mutex::new(None)),
                        propagation_timeout: Duration::from_millis(50), // <50ms target
                    }
                }

                pub async fn register_callback(
                    &self,
                    component_name: String,
                    callback: BackpressureCallback,
                ) -> Result<(), RegistrationError> {
                    if component_name.is_empty() {
                        return Err(RegistrationError::InvalidComponentName);
                    }

                    let mut callbacks = self.callbacks.lock().await;
                    if callbacks.contains_key(&component_name) {
                        return Err(RegistrationError::ComponentAlreadyRegistered(component_name));
                    }

                    callbacks.insert(component_name.clone(), callback);

                    tracing::info!(
                        component = %component_name,
                        total_callbacks = callbacks.len(),
                        "Backpressure callback registered"
                    );

                    Ok(())
                }

                pub async fn broadcast(
                    &self,
                    signal: super::backpressure_signal::BackpressureSignal,
                ) -> Result<(), PropagationError> {
                    let start = Instant::now();

                    // Only broadcast if tier changed or this is the first signal
                    {
                        let current = self.current_signal.lock().await;
                        if let Some(current_signal) = current.as_ref() {
                            if signal.tier == current_signal.tier {
                                return Ok(());
                            }
                        }
                    }

                    tracing::warn!(
                        tier = ?signal.tier,
                        reason = %signal.reason,
                        trace_id = %signal.trace_id,
                        "Backpressure signal broadcast initiated"
                    );

                    let callbacks = self.callbacks.lock().await.clone();
                    let num_callbacks = callbacks.len();

                    if num_callbacks == 0 {
                        tracing::warn!("No components registered for backpressure signals");
                        return Ok(());
                    }

                    // Fan-out to all components in parallel
                    let mut tasks = Vec::new();
                    for (component_name, callback) in callbacks {
                        let signal_clone = signal.clone();
                        let callback_clone = Arc::clone(&callback);

                        let task = tokio::spawn(async move {
                            let component_start = Instant::now();

                            let result = tokio::time::timeout(
                                Duration::from_millis(45), // Leave 5ms buffer for total <50ms
                                callback_clone(signal_clone)
                            ).await;

                            let latency_ms = component_start.elapsed().as_millis() as f64;

                            match result {
                                Ok(Ok(())) => {
                                    tracing::debug!(
                                        component = %component_name,
                                        latency_ms = latency_ms,
                                        "Component backpressure callback completed"
                                    );
                                    Ok(())
                                }
                                Ok(Err(e)) => {
                                    tracing::error!(
                                        component = %component_name,
                                        error = ?e,
                                        latency_ms = latency_ms,
                                        "Component backpressure callback failed"
                                    );
                                    Err(e)
                                }
                                Err(_) => {
                                    tracing::error!(
                                        component = %component_name,
                                        latency_ms = latency_ms,
                                        "Component backpressure callback timed out"
                                    );
                                    Err(PropagationError::Timeout(Duration::from_millis(45)))
                                }
                            }
                        });

                        tasks.push(task);
                    }

                    // Wait for all callbacks to complete (with overall timeout)
                    let results = match tokio::time::timeout(
                        self.propagation_timeout,
                        futures::future::join_all(tasks)
                    ).await {
                        Ok(results) => results,
                        Err(_) => {
                            return Err(PropagationError::Timeout(self.propagation_timeout));
                        }
                    };

                    // Check results and collect failures
                    let mut failures = Vec::new();
                    for result in results {
                        match result {
                            Ok(Ok(())) => {} // Success
                            Ok(Err(e)) => failures.push(e),
                            Err(e) => {
                                tracing::error!(error = ?e, "Task join error in backpressure broadcast");
                                failures.push(PropagationError::BroadcastFailure(e.to_string()));
                            }
                        }
                    }

                    // Update current signal
                    {
                        let mut current = self.current_signal.lock().await;
                        *current = Some(signal.clone());
                    }

                    // Measure total propagation latency
                    let total_latency_ms = start.elapsed().as_millis() as f64;

                    // Emit metrics
                    metrics::histogram!("backpressure_propagation_latency_ms")
                        .with_label_values(&[])
                        .observe(total_latency_ms);

                    metrics::counter!("backpressure_signals_broadcast_total")
                        .with_label_values(&[&signal.tier.as_str()])
                        .inc();

                    metrics::gauge!("backpressure_registered_components")
                        .with_label_values(&[])
                        .set(num_callbacks as f64);

                    if total_latency_ms > 50.0 {
                        tracing::error!(
                            total_latency_ms = total_latency_ms,
                            target_ms = 50.0,
                            num_callbacks = num_callbacks,
                            "Backpressure propagation slow"
                        );
                    } else {
                        tracing::debug!(
                            total_latency_ms = total_latency_ms,
                            num_callbacks = num_callbacks,
                            "Backpressure propagation completed"
                        );
                    }

                    // Return first failure if any (but don't fail the broadcast)
                    if let Some(first_failure) = failures.into_iter().next() {
                        return Err(first_failure);
                    }

                    Ok(())
                }

                pub async fn get_current_signal(&self) -> Option<super::backpressure_signal::BackpressureSignal> {
                    let signal = self.current_signal.lock().await;
                    signal.clone()
                }

                pub async fn get_registered_components(&self) -> Vec<String> {
                    let callbacks = self.callbacks.lock().await;
                    callbacks.keys().cloned().collect()
                }

                pub async fn unregister_callback(&self, component_name: &str) -> bool {
                    let mut callbacks = self.callbacks.lock().await;
                    let removed = callbacks.remove(component_name).is_some();
                    if removed {
                        tracing::info!(component = %component_name, "Backpressure callback unregistered");
                    }
                    removed
                }
            }
          python: |
            from dataclasses import dataclass, field
            from typing import Dict, List, Optional, Callable, Awaitable, Any
            from enum import Enum
            import asyncio
            import time
            import logging
            from concurrent.futures import ThreadPoolExecutor

            class RegistrationError(Exception):
                """Error during component registration"""
                pass

            class PropagationError(Exception):
                """Error during signal propagation"""
                pass

            BackpressureCallback = Callable[[Any], Awaitable[None]]  # Any is BackpressureSignal

            class BackpressureCoordinator:
                """Coordinates backpressure signal propagation across components"""

                def __init__(self):
                    self.callbacks: Dict[str, BackpressureCallback] = {}
                    self.current_signal: Optional[Any] = None  # BackpressureSignal
                    self.propagation_timeout_seconds = 0.050  # 50ms target
                    self.logger = logging.getLogger(__name__)

                def register_callback(self, callback: BackpressureCallback, component_name: str) -> None:
                    """Register a component callback for backpressure signals"""
                    if not component_name:
                        raise RegistrationError("Component name cannot be empty")

                    if component_name in self.callbacks:
                        raise RegistrationError(f"Component {component_name} already registered")

                    self.callbacks[component_name] = callback
                    self.logger.info(
                        f"Backpressure callback registered for {component_name}",
                        extra={
                            'component': component_name,
                            'total_callbacks': len(self.callbacks)
                        }
                    )

                async def broadcast(self, signal: Any) -> None:  # signal: BackpressureSignal
                    """
                    Broadcast backpressure signal to all registered components.

                    Target: <50ms total propagation latency
                    """
                    start = time.monotonic()

                    # Only broadcast if tier changed or this is the first signal
                    if self.current_signal and signal.tier == self.current_signal.tier:
                        return

                    self.logger.warning(
                        f"Backpressure signal broadcast: {signal.tier.name}",
                        extra={
                            'tier': signal.tier.name,
                            'reason': signal.reason,
                            'trace_id': signal.trace_id,
                            'num_callbacks': len(self.callbacks)
                        }
                    )

                    if not self.callbacks:
                        self.logger.warning("No components registered for backpressure signals")
                        return

                    # Fan-out to all components in parallel
                    tasks = []
                    for component_name, callback in self.callbacks.items():
                        task = asyncio.create_task(
                            self._invoke_callback_safe(component_name, callback, signal)
                        )
                        tasks.append(task)

                    # Wait for all callbacks to complete (with overall timeout)
                    try:
                        await asyncio.wait_for(
                            asyncio.gather(*tasks, return_exceptions=True),
                            timeout=self.propagation_timeout_seconds
                        )
                    except asyncio.TimeoutError:
                        self.logger.error(
                            f"Backpressure propagation timeout after {self.propagation_timeout_seconds}s",
                            extra={
                                'timeout_seconds': self.propagation_timeout_seconds,
                                'num_callbacks': len(self.callbacks)
                            }
                        )
                        raise PropagationError(f"Propagation timeout after {self.propagation_timeout_seconds}s")

                    # Update current signal
                    self.current_signal = signal

                    # Measure total propagation latency
                    total_latency_ms = (time.monotonic() - start) * 1000

                    # Emit metrics (placeholder - would integrate with actual metrics system)
                    self._emit_propagation_metrics(total_latency_ms, signal.tier.name, len(self.callbacks))

                    if total_latency_ms > 50.0:
                        self.logger.error(
                            f"Backpressure propagation slow: {total_latency_ms:.1f}ms > 50ms target",
                            extra={
                                'latency_ms': total_latency_ms,
                                'target_ms': 50.0,
                                'num_callbacks': len(self.callbacks)
                            }
                        )
                    else:
                        self.logger.debug(
                            f"Backpressure propagation completed in {total_latency_ms:.1f}ms",
                            extra={
                                'latency_ms': total_latency_ms,
                                'num_callbacks': len(self.callbacks)
                            }
                        )

                async def _invoke_callback_safe(
                    self,
                    component_name: str,
                    callback: BackpressureCallback,
                    signal: Any
                ) -> None:
                    """Invoke callback with error handling and timeout"""
                    component_start = time.monotonic()

                    try:
                        # Individual component timeout (45ms to leave buffer for total <50ms)
                        await asyncio.wait_for(
                            callback(signal),
                            timeout=0.045
                        )

                        latency_ms = (time.monotonic() - component_start) * 1000
                        self.logger.debug(
                            f"Component {component_name} callback completed in {latency_ms:.1f}ms",
                            extra={
                                'component': component_name,
                                'latency_ms': latency_ms
                            }
                        )

                    except asyncio.TimeoutError:
                        self.logger.error(
                            f"Component {component_name} callback timed out",
                            extra={'component': component_name}
                        )
                        raise PropagationError(f"Component {component_name} timeout")

                    except Exception as e:
                        self.logger.error(
                            f"Component {component_name} callback failed: {e}",
                            extra={
                                'component': component_name,
                                'error': str(e)
                            }
                        )
                        raise PropagationError(f"Component {component_name} failed: {e}")

                def _emit_propagation_metrics(self, latency_ms: float, tier_name: str, num_callbacks: int):
                    """Emit propagation metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                def get_current_signal(self) -> Optional[Any]:
                    """Get current backpressure signal"""
                    return self.current_signal

                def get_registered_components(self) -> List[str]:
                    """Get list of registered component names"""
                    return list(self.callbacks.keys())

                def unregister_callback(self, component_name: str) -> bool:
                    """Unregister a component callback"""
                    if component_name in self.callbacks:
                        del self.callbacks[component_name]
                        self.logger.info(f"Backpressure callback unregistered for {component_name}")
                        return True
                    return False

coordinator_requirements:
  - registration: Components register callbacks at startup
  - broadcast_efficiency: Parallel fan-out to all components
  - failure_isolation: Component failures don't affect others
  - latency_budget: <50ms total propagation (P95)
  - component_timeout: <45ms per callback
  - signal_deduplication: Only broadcast on tier changes
  - observability: Full metrics and tracing integration

component_callbacks:
  - api_gateway: HTTP 503 responses based on tier
  - orchestrator: Cancel background tasks in Tier 2+
  - agent_fabric: Drain agents in Tier 3, reduce hiring in Tier 2
  - tool_runner: Reduce tool timeouts and cancel pending tools in Tier 3
