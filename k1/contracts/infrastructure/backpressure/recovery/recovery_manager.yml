classes:
  - name: RecoveryManager
    description: Manages backpressure recovery process with gradual admission rate increases and background monitoring
    research: ADR-0039c (backpressure recovery), rate limiting algorithms, gradual recovery patterns
    performance_budget: <10ms recovery decisions, <1ms admission rate updates, <50ms background task overhead
    reliability_properties:
      - gradual_increase: Admission rate increases 10% every 5 seconds to prevent thundering herd
      - health_monitored: Recovery pauses on health check failures
      - automatic_rollback: Failed recovery triggers rollback to previous tier
      - capacity_bounded: Admission rate never exceeds 100% capacity
    methods:
      - name: start_recovery
        description: Initiate recovery process from emergency tier to normal operation
        parameters:
          - name: from_tier
            type: BackpressureTier
            description: Starting tier for recovery
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<RecoveryHandle, RecoveryError>
          description: Recovery handle for monitoring or error
        implementation:
          rust: |
            use std::sync::Arc;
            use tokio::sync::RwLock;
            use tokio::task::JoinHandle;

            pub struct RecoveryManager {
                state_machine: Arc<RwLock<RecoveryStateMachine>>,
                rate_limiter: Arc<RwLock<AdmissionRateLimiter>>,
                health_checker: Arc<dyn HealthChecker>,
                metrics: Arc<RecoveryObservability>,
                recovery_task: Option<JoinHandle<()>>,
            }

            impl RecoveryManager {
                pub async fn start_recovery(
                    &mut self,
                    from_tier: BackpressureTier,
                    trace_id: String,
                ) -> Result<RecoveryHandle, RecoveryError> {
                    // Validate starting tier
                    if from_tier == BackpressureTier::NORMAL {
                        return Err(RecoveryError::InvalidStartTier);
                    }

                    // Initialize recovery state
                    {
                        let mut state_machine = self.state_machine.write().await;
                        state_machine.current_tier = from_tier;
                    }

                    // Start admission rate at 10%
                    {
                        let mut rate_limiter = self.rate_limiter.write().await;
                        rate_limiter.set_rate_percent(10.0).await;
                    }

                    // Spawn recovery background task
                    let state_machine_clone = self.state_machine.clone();
                    let rate_limiter_clone = self.rate_limiter.clone();
                    let health_checker_clone = self.health_checker.clone();
                    let metrics_clone = self.metrics.clone();

                    let recovery_handle = tokio::spawn(async move {
                        Self::recovery_loop(
                            state_machine_clone,
                            rate_limiter_clone,
                            health_checker_clone,
                            metrics_clone,
                            trace_id,
                        ).await;
                    });

                    self.recovery_task = Some(recovery_handle);

                    Ok(RecoveryHandle {
                        task_handle: self.recovery_task.as_ref().unwrap().abort_handle(),
                    })
                }

                async fn recovery_loop(
                    state_machine: Arc<RwLock<RecoveryStateMachine>>,
                    rate_limiter: Arc<RwLock<AdmissionRateLimiter>>,
                    health_checker: Arc<dyn HealthChecker>,
                    metrics: Arc<RecoveryObservability>,
                    trace_id: String,
                ) {
                    let mut current_rate = 10.0;
                    let mut recovery_start = std::time::Instant::now();

                    loop {
                        // Determine next target tier based on current tier
                        let target_tier = {
                            let state_machine = state_machine.read().await;
                            match state_machine.current_tier {
                                BackpressureTier::TIER_3_EMERGENCY => BackpressureTier::TIER_2_CANCEL_BG,
                                BackpressureTier::TIER_2_CANCEL_BG => BackpressureTier::TIER_1_REJECT_NEW,
                                BackpressureTier::TIER_1_REJECT_NEW => BackpressureTier::NORMAL,
                                BackpressureTier::NORMAL => break, // Recovery complete
                            }
                        };

                        let sustained_duration = match target_tier {
                            BackpressureTier::TIER_2_CANCEL_BG => std::time::Duration::from_secs(30),
                            BackpressureTier::TIER_1_REJECT_NEW => std::time::Duration::from_secs(10),
                            BackpressureTier::NORMAL => std::time::Duration::from_secs(10),
                            _ => unreachable!(),
                        };

                        // Attempt tier transition
                        let transition_result = {
                            let mut state_machine = state_machine.write().await;
                            state_machine.transition_to_tier(target_tier, sustained_duration).await
                        };

                        match transition_result {
                            Ok(()) => {
                                // Transition successful - increase admission rate
                                current_rate = (current_rate + 10.0).min(100.0);
                                {
                                    let mut rate_limiter = rate_limiter.write().await;
                                    rate_limiter.set_rate_percent(current_rate).await;
                                }

                                metrics.record_recovery_progress(target_tier, current_rate);

                                tracing::info!(
                                    target_tier = %target_tier,
                                    admission_rate = current_rate,
                                    trace_id = %trace_id,
                                    "Recovery tier transition successful"
                                );

                                // Continue to next tier
                                continue;
                            }
                            Err(e) => {
                                // Transition failed - rollback
                                metrics.record_recovery_rollback(&e);

                                tracing::error!(
                                    error = %e,
                                    current_tier = %target_tier,
                                    trace_id = %trace_id,
                                    "Recovery tier transition failed - rolling back"
                                );

                                // Decrease admission rate on failure
                                current_rate = (current_rate - 20.0).max(10.0);
                                {
                                    let mut rate_limiter = rate_limiter.write().await;
                                    rate_limiter.set_rate_percent(current_rate).await;
                                }

                                // Wait before retrying
                                tokio::time::sleep(std::time::Duration::from_secs(30)).await;
                            }
                        }
                    }

                    // Recovery complete
                    let total_duration = recovery_start.elapsed();
                    metrics.record_recovery_complete(total_duration);

                    tracing::info!(
                        total_duration = ?total_duration,
                        trace_id = %trace_id,
                        "Recovery process completed successfully"
                    );
                }

                pub async fn get_recovery_status(&self) -> RecoveryStatus {
                    let state_machine = self.state_machine.read().await;
                    let rate_limiter = self.rate_limiter.read().await;

                    RecoveryStatus {
                        current_tier: state_machine.current_tier,
                        admission_rate_percent: rate_limiter.get_current_rate_percent().await,
                        progress: state_machine.get_recovery_progress(),
                        is_recovering: self.recovery_task.is_some(),
                    }
                }

                pub async fn stop_recovery(&mut self) -> Result<(), RecoveryError> {
                    if let Some(task) = self.recovery_task.take() {
                        task.abort();
                        Ok(())
                    } else {
                        Err(RecoveryError::NoRecoveryInProgress)
                    }
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Optional, Any, Dict
            import asyncio
            import time
            import logging

            class RecoveryManager:
                """
                Manages backpressure recovery process with gradual admission increases.

                Coordinates state machine transitions, admission rate limiting,
                and health check validation for safe recovery from overload.
                """

                def __init__(self, state_machine: Any, rate_limiter: Any, health_checker: Any, metrics: Any):
                    self.logger = logging.getLogger(__name__)
                    self.state_machine = state_machine
                    self.rate_limiter = rate_limiter
                    self.health_checker = health_checker
                    self.metrics = metrics
                    self.recovery_task: Optional[asyncio.Task] = None

                async def start_recovery(self, from_tier: Any, trace_id: str) -> 'RecoveryHandle':
                    """Initiate recovery process from emergency tier"""
                    if from_tier == BackpressureTier.NORMAL:
                        raise RecoveryError("Cannot start recovery from NORMAL tier")

                    # Initialize recovery state
                    self.state_machine.current_tier = from_tier

                    # Start admission rate at 10%
                    await self.rate_limiter.set_rate_percent(10.0)

                    # Start recovery background task
                    self.recovery_task = asyncio.create_task(
                        self._recovery_loop(trace_id)
                    )

                    return RecoveryHandle(task=self.recovery_task)

                async def _recovery_loop(self, trace_id: str) -> None:
                    """Background recovery loop with tier transitions"""
                    current_rate = 10.0
                    recovery_start = time.time()

                    try:
                        while True:
                            # Determine next target tier
                            current_tier = self.state_machine.get_current_tier()

                            if current_tier == BackpressureTier.NORMAL:
                                break  # Recovery complete

                            # Map current tier to next target
                            if current_tier == BackpressureTier.TIER_3_EMERGENCY:
                                target_tier = BackpressureTier.TIER_2_CANCEL_BG
                                sustained_duration = 30.0
                            elif current_tier == BackpressureTier.TIER_2_CANCEL_BG:
                                target_tier = BackpressureTier.TIER_1_REJECT_NEW
                                sustained_duration = 10.0
                            elif current_tier == BackpressureTier.TIER_1_REJECT_NEW:
                                target_tier = BackpressureTier.NORMAL
                                sustained_duration = 10.0
                            else:
                                break

                            try:
                                # Attempt tier transition
                                await self.state_machine.transition_to_tier(
                                    target_tier, sustained_duration
                                )

                                # Transition successful - increase admission rate
                                current_rate = min(current_rate + 10.0, 100.0)
                                await self.rate_limiter.set_rate_percent(current_rate)

                                self.metrics.record_recovery_progress(target_tier, current_rate)

                                self.logger.info(
                                    f"Recovery tier transition successful: {current_tier} -> {target_tier}",
                                    extra={
                                        'from_tier': str(current_tier),
                                        'to_tier': str(target_tier),
                                        'admission_rate': current_rate,
                                        'trace_id': trace_id
                                    }
                                )

                            except Exception as e:
                                # Transition failed - rollback
                                self.metrics.record_recovery_rollback(str(e))

                                self.logger.error(
                                    f"Recovery tier transition failed: {e}",
                                    extra={
                                        'target_tier': str(target_tier),
                                        'error': str(e),
                                        'trace_id': trace_id
                                    }
                                )

                                # Decrease admission rate on failure
                                current_rate = max(current_rate - 20.0, 10.0)
                                await self.rate_limiter.set_rate_percent(current_rate)

                                # Wait before retrying
                                await asyncio.sleep(30.0)

                    except Exception as e:
                        self.logger.error(f"Recovery loop failed: {e}", exc_info=True)
                        raise
                    finally:
                        # Recovery complete
                        total_duration = time.time() - recovery_start
                        self.metrics.record_recovery_complete(total_duration)

                        self.logger.info(
                            f"Recovery process completed",
                            extra={
                                'total_duration': total_duration,
                                'trace_id': trace_id
                            }
                        )

                async def get_recovery_status(self) -> Dict[str, Any]:
                    """Get current recovery status"""
                    progress = self.state_machine.get_recovery_progress()
                    admission_rate = await self.rate_limiter.get_current_rate_percent()

                    return {
                        'current_tier': str(self.state_machine.get_current_tier()),
                        'admission_rate_percent': admission_rate,
                        'progress': progress,
                        'is_recovering': self.recovery_task is not None and not self.recovery_task.done()
                    }

                async def stop_recovery(self) -> None:
                    """Stop ongoing recovery process"""
                    if self.recovery_task and not self.recovery_task.done():
                        self.recovery_task.cancel()
                        try:
                            await self.recovery_task
                        except asyncio.CancelledError:
                            pass
                    self.recovery_task = None

recovery_phases:
  - phase: initialization
    admission_rate_percent: 10
    description: Start recovery at 10% capacity to prevent thundering herd
  - phase: gradual_increase
    admission_rate_percent: "10% every 5 seconds"
    description: Increase admission rate gradually to 100% over recovery period
  - phase: stabilization
    admission_rate_percent: 100
    description: Full capacity restored, monitor for stability

background_task_behavior:
  - interval: 5 seconds
    action: increase admission rate by 10%
    condition: health checks passing and tier transition successful
  - interval: 30 seconds
    action: retry failed tier transition
    condition: previous transition failed
  - interval: continuous
    action: monitor health and rollback on failure
    condition: always active during recovery

error_handling:
  - health_check_failure: rollback to previous tier, decrease admission rate
  - tier_transition_timeout: emergency escalation, full rollback
  - rate_limiter_failure: log error, continue with current rate
  - task_cancellation: graceful shutdown, cleanup resources
