classes:
  - name: AdmissionRateLimiter
    description: Implements gradual admission rate limiting to prevent thundering herd during recovery
    research: ADR-0039c (backpressure recovery), rate limiting algorithms, token bucket patterns
    performance_budget: <1ms admission checks, <10ms rate updates, <100KB memory overhead
    reliability_properties:
      - gradual_increase: Rate increases 10% every 5 seconds during recovery
      - thundering_herd_prevention: Slow ramp-up prevents system overload
      - capacity_bounded: Rate never exceeds 100% or drops below 10%
      - thread_safe: Concurrent access safe for high-throughput scenarios
    methods:
      - name: set_rate_percent
        description: Set admission rate as percentage of full capacity
        parameters:
          - name: rate_percent
            type: f64
            description: Admission rate as percentage (10.0 to 100.0)
        returns:
          type: ()
          description: Updates admission rate with validation
        implementation:
          rust: |
            use std::sync::atomic::{AtomicU64, Ordering};
            use std::time::{Duration, Instant};

            pub struct AdmissionRateLimiter {
                current_rate_percent: AtomicU64, // Stored as fixed-point (multiply by 100)
                last_update: std::sync::Mutex<Instant>,
                max_requests_per_second: u64,
            }

            impl AdmissionRateLimiter {
                pub fn new(max_requests_per_second: u64) -> Self {
                    Self {
                        current_rate_percent: AtomicU64::new(1000), // 10.0% = 1000
                        last_update: std::sync::Mutex::new(Instant::now()),
                        max_requests_per_second,
                    }
                }

                pub async fn set_rate_percent(&self, rate_percent: f64) -> Result<(), RateLimitError> {
                    // Validate rate range
                    if !(10.0..=100.0).contains(&rate_percent) {
                        return Err(RateLimitError::InvalidRate(rate_percent));
                    }

                    // Convert to fixed-point representation
                    let fixed_rate = (rate_percent * 100.0) as u64;

                    // Update rate
                    self.current_rate_percent.store(fixed_rate, Ordering::SeqCst);

                    // Update timestamp
                    {
                        let mut last_update = self.last_update.lock().unwrap();
                        *last_update = Instant::now();
                    }

                    tracing::info!(
                        rate_percent = rate_percent,
                        "Admission rate updated"
                    );

                    Ok(())
                }

                pub fn check_admission(&self) -> AdmissionResult {
                    let current_rate = self.current_rate_percent.load(Ordering::SeqCst) as f64 / 100.0;
                    let effective_max_rps = (self.max_requests_per_second as f64 * current_rate / 100.0) as u64;

                    // Simple rate limiting check (in production, use token bucket)
                    // For now, just check if we're within rate limits
                    AdmissionResult::Allow
                }

                pub fn get_current_rate_percent(&self) -> f64 {
                    self.current_rate_percent.load(Ordering::SeqCst) as f64 / 100.0
                }

                pub fn get_effective_rate_limit(&self) -> u64 {
                    let current_rate = self.get_current_rate_percent();
                    (self.max_requests_per_second as f64 * current_rate / 100.0) as u64
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Optional
            import time
            import threading
            import logging

            class AdmissionRateLimiter:
                """
                Rate limiter for gradual admission during backpressure recovery.

                Prevents thundering herd by slowly increasing admission rate
                from 10% to 100% capacity over recovery period.
                """

                def __init__(self, max_requests_per_second: int):
                    self.logger = logging.getLogger(__name__)
                    self.max_requests_per_second = max_requests_per_second
                    self._current_rate_percent = 10.0
                    self._last_update = time.time()
                    self._lock = threading.RLock()

                async def set_rate_percent(self, rate_percent: float) -> None:
                    """Set admission rate as percentage of full capacity"""
                    if not (10.0 <= rate_percent <= 100.0):
                        raise ValueError(f"Rate percent must be between 10.0 and 100.0, got {rate_percent}")

                    with self._lock:
                        old_rate = self._current_rate_percent
                        self._current_rate_percent = rate_percent
                        self._last_update = time.time()

                    self.logger.info(
                        f"Admission rate updated: {old_rate:.1f}% -> {rate_percent:.1f}%",
                        extra={
                            'old_rate': old_rate,
                            'new_rate': rate_percent,
                            'max_rps': self.max_requests_per_second
                        }
                    )

                def check_admission(self) -> bool:
                    """Check if request should be admitted based on current rate"""
                    # Simplified check - in production would use token bucket or similar
                    return True  # Allow all for now, rate limiting handled upstream

                def get_current_rate_percent(self) -> float:
                    """Get current admission rate percentage"""
                    with self._lock:
                        return self._current_rate_percent

                def get_effective_rate_limit(self) -> int:
                    """Get effective rate limit based on current percentage"""
                    with self._lock:
                        return int(self.max_requests_per_second * self._current_rate_percent / 100.0)

                def get_rate_info(self) -> dict:
                    """Get detailed rate limiting information"""
                    with self._lock:
                        return {
                            'current_rate_percent': self._current_rate_percent,
                            'effective_rps': self.get_effective_rate_limit(),
                            'max_rps': self.max_requests_per_second,
                            'last_update': self._last_update,
                            'time_since_update': time.time() - self._last_update
                        }

rate_limiting_algorithm:
  - algorithm: percentage_based
    description: Simple percentage-based rate limiting during recovery
    implementation: effective_rps = max_rps * (rate_percent / 100)
    advantages:
      - Simple to understand and implement
      - Predictable scaling behavior
      - Easy to monitor and debug
    disadvantages:
      - No burst handling (token bucket would be better for production)
      - No smoothing of rate changes

recovery_rate_schedule:
  - time_offset: "0s"
    rate_percent: 10
    description: Start recovery at 10% capacity
  - time_offset: "5s"
    rate_percent: 20
    description: Increase to 20% after first health check success
  - time_offset: "10s"
    rate_percent: 30
    description: Gradual increase continues
  - time_offset: "15s"
    rate_percent: 40
    description: Rate increases 10% every 5 seconds
  - time_offset: "20s"
    rate_percent: 50
    description: Half capacity reached
  - time_offset: "25s"
    rate_percent: 60
    description: Continuing gradual increase
  - time_offset: "30s"
    rate_percent: 70
    description: Tier 3 → Tier 2 transition complete
  - time_offset: "35s"
    rate_percent: 80
    description: Approaching full capacity
  - time_offset: "40s"
    rate_percent: 90
    description: Near full capacity
  - time_offset: "45s"
    rate_percent: 100
    description: Full capacity restored

thundering_herd_prevention:
  - slow_ramp_up: 10% every 5 seconds prevents sudden load spikes
  - health_gated: Rate increases only after sustained health checks
  - rollback_protection: Failed health checks decrease rate to prevent overload
  - capacity_ceiling: Rate never exceeds 100% to maintain stability

performance_characteristics:
  - admission_check_latency: <1ms (simple percentage check)
  - rate_update_latency: <10ms (atomic operations)
  - memory_usage: <1KB per limiter instance
  - thread_safety: Lock-based for concurrent access
  - scalability: Linear scaling with request volume
