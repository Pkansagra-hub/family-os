classes:
  - name: RecoveryObservability
    description: Prometheus metrics and monitoring for backpressure recovery processes with latency tracking and success rates
    research: ADR-0039c (backpressure recovery), observability patterns, recovery monitoring
    performance_budget: <1ms metrics recording, <10MB memory overhead, <100ms metrics export latency
    reliability_properties:
      - comprehensive_tracking: All recovery events and transitions metered
      - latency_monitoring: Recovery duration and tier transition times tracked
      - success_rate_monitoring: Recovery success/failure rates by tier
      - alerting_integration: Metrics designed for alerting on recovery issues
    methods:
      - name: record_recovery_progress
        description: Record recovery progress metrics for monitoring
        parameters:
          - name: current_tier
            type: BackpressureTier
            description: Current recovery tier
          - name: admission_rate_percent
            type: f64
            description: Current admission rate percentage
        returns:
          type: ()
          description: Records recovery progress metrics
        implementation:
          rust: |
            use prometheus::{register_histogram_vec, register_counter_vec, register_gauge_vec, register_histogram};

            lazy_static::lazy_static! {
                static ref RECOVERY_DURATION_SECONDS: prometheus::HistogramVec = register_histogram_vec!(
                    "backpressure_recovery_duration_seconds",
                    "Time taken for backpressure recovery transitions",
                    &["from_tier", "to_tier"],
                    prometheus::exponential_buckets(10.0, 2.0, 7).unwrap() // 10s to 1280s
                ).unwrap();

                static ref RECOVERY_TRANSITIONS_TOTAL: prometheus::CounterVec = register_counter_vec!(
                    "backpressure_recovery_transitions_total",
                    "Total number of recovery tier transitions",
                    &["from_tier", "to_tier", "result"]
                ).unwrap();

                static ref RECOVERY_ROLLBACKS_TOTAL: prometheus::CounterVec = register_counter_vec!(
                    "backpressure_recovery_rollbacks_total",
                    "Total number of recovery rollbacks",
                    &["from_tier", "to_tier", "reason"]
                ).unwrap();

                static ref ADMISSION_RATE_GAUGE: prometheus::GaugeVec = register_gauge_vec!(
                    "backpressure_admission_rate_percent",
                    "Current admission rate during recovery",
                    &[]
                ).unwrap();

                static ref HEALTH_CHECKS_PASSED_TOTAL: prometheus::CounterVec = register_counter_vec!(
                    "backpressure_recovery_health_checks_passed_total",
                    "Total number of health checks passed during recovery",
                    &["tier"]
                ).unwrap();

                static ref RECOVERY_ACTIVE: prometheus::GaugeVec = register_gauge_vec!(
                    "backpressure_recovery_active",
                    "Whether recovery is currently active (1) or not (0)",
                    &[]
                ).unwrap();

                static ref RECOVERY_TIME_BUDGET_UTILIZATION: prometheus::HistogramVec = register_histogram_vec!(
                    "backpressure_recovery_time_budget_utilization_percent",
                    "Recovery time budget utilization percentage",
                    &["transition"],
                    prometheus::linear_buckets(0.0, 10.0, 11).unwrap() // 0% to 100% in 10% buckets
                ).unwrap();
            }

            pub struct RecoveryObservability;

            impl RecoveryObservability {
                pub fn record_recovery_progress(tier: BackpressureTier, admission_rate: f64) {
                    ADMISSION_RATE_GAUGE
                        .with_label_values(&[])
                        .set(admission_rate);

                    RECOVERY_ACTIVE
                        .with_label_values(&[])
                        .set(1.0);

                    tracing::debug!(
                        tier = %tier,
                        admission_rate = admission_rate,
                        "Recovery progress recorded"
                    );
                }

                pub fn record_recovery_complete(total_duration: std::time::Duration) {
                    RECOVERY_ACTIVE
                        .with_label_values(&[])
                        .set(0.0);

                    tracing::info!(
                        total_duration_seconds = total_duration.as_secs_f64(),
                        "Recovery process completed"
                    );
                }

                pub fn record_tier_transition(
                    from_tier: BackpressureTier,
                    to_tier: BackpressureTier,
                    success: bool,
                    duration: std::time::Duration
                ) {
                    let result = if success { "success" } else { "failure" };

                    RECOVERY_TRANSITIONS_TOTAL
                        .with_label_values(&[&from_tier.as_str(), &to_tier.as_str(), result])
                        .inc();

                    if success {
                        RECOVERY_DURATION_SECONDS
                            .with_label_values(&[&from_tier.as_str(), &to_tier.as_str()])
                            .observe(duration.as_secs_f64());
                    }

                    tracing::info!(
                        from_tier = %from_tier,
                        to_tier = %to_tier,
                        success = success,
                        duration_seconds = duration.as_secs_f64(),
                        "Tier transition recorded"
                    );
                }

                pub fn record_recovery_rollback(reason: &str) {
                    // Note: Would need from/to tier context in real implementation
                    RECOVERY_ROLLBACKS_TOTAL
                        .with_label_values(&["unknown", "unknown", reason])
                        .inc();

                    tracing::warn!(
                        reason = %reason,
                        "Recovery rollback recorded"
                    );
                }

                pub fn record_health_check_passed(tier: BackpressureTier) {
                    HEALTH_CHECKS_PASSED_TOTAL
                        .with_label_values(&[&tier.as_str()])
                        .inc();
                }

                pub fn record_time_budget_utilization(transition: &str, utilization_percent: f64) {
                    RECOVERY_TIME_BUDGET_UTILIZATION
                        .with_label_values(&[transition])
                        .observe(utilization_percent);

                    if utilization_percent > 100.0 {
                        tracing::error!(
                            transition = %transition,
                            utilization_percent = utilization_percent,
                            "Recovery time budget exceeded"
                        );
                    } else if utilization_percent > 80.0 {
                        tracing::warn!(
                            transition = %transition,
                            utilization_percent = utilization_percent,
                            "Recovery time budget utilization high"
                        );
                    }
                }

                pub fn export_metrics() -> Result<String, Box<dyn std::error::Error>> {
                    let encoder = prometheus::TextEncoder::new();
                    let metric_families = prometheus::gather();
                    let mut buffer = Vec::new();
                    encoder.encode(&metric_families, &mut buffer)?;
                    Ok(String::from_utf8(buffer)?)
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Dict, List, Optional, Any
            import time
            import logging

            class RecoveryObservability:
                """
                Observability for backpressure recovery processes.

                Tracks recovery progress, tier transitions, rollbacks, and
                admission rates with Prometheus-style metrics.
                """

                def __init__(self):
                    self.logger = logging.getLogger(__name__)
                    self._recovery_durations: Dict[str, List[float]] = {}
                    self._transition_counts: Dict[str, int] = {}
                    self._rollback_counts: Dict[str, int] = {}
                    self._health_check_counts: Dict[str, int] = {}
                    self._budget_utilizations: List[float] = []

                def record_recovery_progress(self, current_tier: Any, admission_rate_percent: float) -> None:
                    """Record recovery progress metrics"""
                    # In real implementation, would update Prometheus gauges
                    self.logger.debug(
                        f"Recovery progress: tier={current_tier}, rate={admission_rate_percent:.1f}%"
                    )

                def record_recovery_complete(self, total_duration: float) -> None:
                    """Record recovery completion"""
                    self.logger.info(
                        f"Recovery completed in {total_duration:.1f}s",
                        extra={'total_duration': total_duration}
                    )

                def record_tier_transition(
                    self,
                    from_tier: Any,
                    to_tier: Any,
                    success: bool,
                    duration: float
                ) -> None:
                    """Record tier transition metrics"""
                    transition_key = f"{from_tier}_to_{to_tier}_{'success' if success else 'failure'}"
                    self._transition_counts[transition_key] = self._transition_counts.get(transition_key, 0) + 1

                    if success:
                        transition_duration_key = f"{from_tier}_to_{to_tier}"
                        if transition_duration_key not in self._recovery_durations:
                            self._recovery_durations[transition_duration_key] = []
                        self._recovery_durations[transition_duration_key].append(duration)

                        # Keep only last 100 measurements
                        if len(self._recovery_durations[transition_duration_key]) > 100:
                            self._recovery_durations[transition_duration_key] = self._recovery_durations[transition_duration_key][-100:]

                    self.logger.info(
                        f"Tier transition: {from_tier} -> {to_tier} ({'success' if success else 'failure'}) in {duration:.1f}s",
                        extra={
                            'from_tier': str(from_tier),
                            'to_tier': str(to_tier),
                            'success': success,
                            'duration': duration
                        }
                    )

                def record_recovery_rollback(self, reason: str) -> None:
                    """Record recovery rollback"""
                    self._rollback_counts[reason] = self._rollback_counts.get(reason, 0) + 1

                    self.logger.warning(
                        f"Recovery rollback: {reason}",
                        extra={'reason': reason}
                    )

                def record_health_check_passed(self, tier: Any) -> None:
                    """Record successful health check"""
                    tier_name = str(tier)
                    self._health_check_counts[tier_name] = self._health_check_counts.get(tier_name, 0) + 1

                def record_time_budget_utilization(self, transition: str, utilization_percent: float) -> None:
                    """Record time budget utilization"""
                    self._budget_utilizations.append(utilization_percent)

                    # Keep only last 100 measurements
                    if len(self._budget_utilizations) > 100:
                        self._budget_utilizations = self._budget_utilizations[-100:]

                    if utilization_percent > 100.0:
                        self.logger.error(
                            f"Recovery time budget exceeded: {utilization_percent:.1f}% for {transition}",
                            extra={
                                'transition': transition,
                                'utilization_percent': utilization_percent
                            }
                        )
                    elif utilization_percent > 80.0:
                        self.logger.warning(
                            f"Recovery time budget utilization high: {utilization_percent:.1f}% for {transition}",
                            extra={
                                'transition': transition,
                                'utilization_percent': utilization_percent
                            }
                        )

                def get_recovery_stats(self) -> Dict[str, Any]:
                    """Get recovery statistics"""
                    stats = {
                        'transitions': self._transition_counts.copy(),
                        'rollbacks': self._rollback_counts.copy(),
                        'health_checks': self._health_check_counts.copy(),
                        'budget_utilizations': self._budget_utilizations.copy() if self._budget_utilizations else [],
                    }

                    # Calculate averages for duration measurements
                    for transition, durations in self._recovery_durations.items():
                        if durations:
                            stats[f'{transition}_avg_duration'] = sum(durations) / len(durations)
                            stats[f'{transition}_count'] = len(durations)

                    return stats

                def export_metrics(self) -> str:
                    """Export metrics in Prometheus format"""
                    lines = []
                    stats = self.get_recovery_stats()

                    # Recovery transitions
                    for transition_key, count in stats.get('transitions', {}).items():
                        lines.append("# HELP backpressure_recovery_transitions_total Total number of recovery tier transitions")
                        lines.append("# TYPE backpressure_recovery_transitions_total counter")
                        lines.append(f"backpressure_recovery_transitions_total{{transition=\"{transition_key}\"}} {count}")

                    # Recovery rollbacks
                    for reason, count in stats.get('rollbacks', {}).items():
                        lines.append("# HELP backpressure_recovery_rollbacks_total Total number of recovery rollbacks")
                        lines.append("# TYPE backpressure_recovery_rollbacks_total counter")
                        lines.append(f"backpressure_recovery_rollbacks_total{{reason=\"{reason}\"}} {count}")

                    # Health checks passed
                    for tier, count in stats.get('health_checks', {}).items():
                        lines.append("# HELP backpressure_recovery_health_checks_passed_total Health checks passed during recovery")
                        lines.append("# TYPE backpressure_recovery_health_checks_passed_total counter")
                        lines.append(f"backpressure_recovery_health_checks_passed_total{{tier=\"{tier}\"}} {count}")

                    # Recovery durations
                    for key, value in stats.items():
                        if key.endswith('_avg_duration'):
                            transition = key.replace('_avg_duration', '')
                            lines.append("# HELP backpressure_recovery_duration_seconds Recovery transition duration")
                            lines.append("# TYPE backpressure_recovery_duration_seconds gauge")
                            lines.append(f"backpressure_recovery_duration_seconds{{transition=\"{transition}\"}} {value}")

                    return "\n".join(lines)

recovery_metrics:
  - recovery_duration_seconds: Histogram of time taken for each tier transition
  - recovery_transitions_total: Counter of successful/failed tier transitions
  - recovery_rollbacks_total: Counter of recovery rollbacks by reason
  - admission_rate_gauge: Current admission rate percentage during recovery
  - health_checks_passed_total: Counter of health checks passed by target tier
  - recovery_active: Gauge indicating if recovery is currently active
  - recovery_time_budget_utilization_percent: Histogram of time budget utilization

alerting_rules:
  - name: RecoveryDurationHigh
    condition: histogram_quantile(0.95, rate(backpressure_recovery_duration_seconds_bucket[5m])) > 120
    severity: warning
    description: Recovery transitions taking longer than 2 minutes P95
    annotations:
      summary: "Recovery duration high: {{ $value }}s P95 > 120s target"
      description: "Recovery from backpressure is slower than expected"

  - name: RecoveryRollbackRateHigh
    condition: increase(backpressure_recovery_rollbacks_total[5m]) > 3
    severity: warning
    description: High rate of recovery rollbacks
    annotations:
      summary: "Recovery rollbacks: {{ $value }} in 5m"
      description: "System is having difficulty recovering from backpressure"

  - name: RecoveryTimeBudgetExceeded
    condition: backpressure_recovery_time_budget_utilization_percent > 100
    severity: error
    description: Recovery time budget exceeded
    annotations:
      summary: "CRITICAL: Recovery time budget exceeded"
      description: "Recovery is taking longer than budgeted, may need intervention"

  - name: RecoveryStuck
    condition: backpressure_recovery_active == 1 and increase(backpressure_recovery_transitions_total[10m]) == 0
    severity: error
    description: Recovery appears stuck with no progress
    annotations:
      summary: "CRITICAL: Recovery appears stuck"
      description: "Recovery has been active for 10+ minutes with no tier transitions"

observability_requirements:
  - transition_tracking: All tier transitions recorded with success/failure
  - duration_monitoring: Recovery and transition durations measured
  - rollback_auditing: All rollbacks logged with reasons
  - health_check_monitoring: Health check success rates tracked
  - budget_compliance: Time budget utilization monitored
  - active_recovery_status: Current recovery state visible

performance_overhead:
  - memory_usage: <10MB for metrics storage and histograms
  - cpu_usage: <1ms per metrics recording operation
  - export_latency: <100ms for full metrics export
  - retention: Last 100 measurements per metric type
