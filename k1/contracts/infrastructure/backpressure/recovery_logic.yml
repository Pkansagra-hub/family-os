classes:
  - name: RecoveryManager
    description: Manages gradual recovery from backpressure with stepwise admission rate increases and automatic rollback on health degradation
    research: ADR-0039c (recovery & gradual resume), gradual recovery patterns, circuit breaker patterns
    performance_budget: <5s recovery step interval, <10s health check latency, <30s full recovery time
    reliability_properties:
      - gradual_recovery: 10% admission rate increases every 5 seconds
      - health_based_rollback: Automatic rollback if health metrics degrade
      - circuit_breaker_pattern: Fail-fast on persistent health failures
      - admission_rate_control: Precise control over request admission rates
    methods:
      - name: start_recovery
        description: Initiate gradual recovery from backpressure tier with health monitoring
        parameters:
          - name: from_tier
            type: BackpressureTier
            description: Tier recovering from (must be > NORMAL)
          - name: trace_id
            type: String
            description: Cognitive trace ID for recovery tracking
        returns:
          type: Result<RecoveryHandle, RecoveryError>
          description: Recovery handle for monitoring or error if recovery cannot start
        implementation:
          rust: |
            use serde::{Serialize, Deserialize};
            use std::time::{Duration, Instant};
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use tokio::task::JoinHandle;
            use std::collections::HashMap;

            #[derive(Serialize, Deserialize, Debug, Clone)]
            pub struct RecoveryConfig {
                pub step_interval_seconds: u64,
                pub admission_increase_percent: f64,
                pub max_recovery_steps: u32,
                pub health_check_interval_seconds: u64,
                pub rollback_threshold_health_score: f64,
                pub circuit_breaker_failure_threshold: u32,
            }

            impl Default for RecoveryConfig {
                fn default() -> Self {
                    Self {
                        step_interval_seconds: 5,        // 5s between steps
                        admission_increase_percent: 10.0, // 10% increase per step
                        max_recovery_steps: 10,           // Max 10 steps (100% recovery)
                        health_check_interval_seconds: 2, // Health check every 2s
                        rollback_threshold_health_score: 0.7, // Rollback if health < 70%
                        circuit_breaker_failure_threshold: 3,  // Circuit breaker after 3 failures
                    }
                }
            }

            #[derive(Serialize, Deserialize, Debug, Clone, PartialEq)]
            pub enum RecoveryState {
                Inactive,
                Active { current_step: u32, admission_rate_percent: f64 },
                Paused { reason: String },
                Completed,
                Failed { reason: String },
            }

            #[derive(Debug)]
            pub enum RecoveryError {
                AlreadyRecovering,
                InvalidTier,
                HealthCheckFailure(String),
                CircuitBreakerOpen,
            }

            pub struct RecoveryHandle {
                pub recovery_id: String,
                pub task_handle: JoinHandle<Result<(), RecoveryError>>,
            }

            impl RecoveryHandle {
                pub async fn abort(self) -> Result<(), RecoveryError> {
                    self.task_handle.abort();
                    Ok(())
                }
            }

            pub type HealthCheckFn = Arc<dyn Fn() -> Result<f64, String> + Send + Sync>;

            pub struct RecoveryManager {
                config: RecoveryConfig,
                current_state: Arc<Mutex<RecoveryState>>,
                health_check: HealthCheckFn,
                admission_controller: Arc<dyn AdmissionController>,
                active_recoveries: Arc<Mutex<HashMap<String, RecoveryHandle>>>,
                circuit_breaker_failures: Arc<Mutex<u32>>,
            }

            #[async_trait::async_trait]
            pub trait AdmissionController: Send + Sync {
                async fn set_admission_rate(&self, rate_percent: f64) -> Result<(), String>;
                async fn get_current_admission_rate(&self) -> Result<f64, String>;
            }

            impl RecoveryManager {
                pub fn new(
                    health_check: HealthCheckFn,
                    admission_controller: Arc<dyn AdmissionController>,
                ) -> Self {
                    Self {
                        config: RecoveryConfig::default(),
                        current_state: Arc::new(Mutex::new(RecoveryState::Inactive)),
                        health_check,
                        admission_controller,
                        active_recoveries: Arc::new(Mutex::new(HashMap::new())),
                        circuit_breaker_failures: Arc::new(Mutex::new(0)),
                    }
                }

                pub async fn start_recovery(
                    &self,
                    from_tier: super::watermark_thresholds::BackpressureTier,
                    trace_id: String,
                ) -> Result<RecoveryHandle, RecoveryError> {
                    // Validate tier
                    if from_tier == super::watermark_thresholds::BackpressureTier::NORMAL {
                        return Err(RecoveryError::InvalidTier);
                    }

                    // Check circuit breaker
                    let failures = *self.circuit_breaker_failures.lock().await;
                    if failures >= self.config.circuit_breaker_failure_threshold {
                        return Err(RecoveryError::CircuitBreakerOpen);
                    }

                    // Check if already recovering
                    let mut state = self.current_state.lock().await;
                    if let RecoveryState::Active { .. } = *state {
                        return Err(RecoveryError::AlreadyRecovering);
                    }

                    // Initialize recovery state
                    let recovery_id = format!("recovery_{}_{}", trace_id, chrono::Utc::now().timestamp());
                    *state = RecoveryState::Active {
                        current_step: 0,
                        admission_rate_percent: 0.0, // Start from 0% after backpressure
                    };

                    let recovery_handle = self.spawn_recovery_task(recovery_id.clone(), from_tier, trace_id);

                    // Store handle
                    let mut recoveries = self.active_recoveries.lock().await;
                    recoveries.insert(recovery_id.clone(), RecoveryHandle {
                        recovery_id: recovery_id.clone(),
                        task_handle: recovery_handle,
                    });

                    tracing::info!(
                        recovery_id = %recovery_id,
                        from_tier = ?from_tier,
                        trace_id = %trace_id,
                        "Recovery initiated"
                    );

                    Ok(RecoveryHandle {
                        recovery_id,
                        task_handle: recovery_handle,
                    })
                }

                fn spawn_recovery_task(
                    &self,
                    recovery_id: String,
                    from_tier: super::watermark_thresholds::BackpressureTier,
                    trace_id: String,
                ) -> JoinHandle<Result<(), RecoveryError>> {
                    let config = self.config.clone();
                    let current_state = Arc::clone(&self.current_state);
                    let health_check = Arc::clone(&self.health_check);
                    let admission_controller = Arc::clone(&self.admission_controller);
                    let circuit_breaker_failures = Arc::clone(&self.circuit_breaker_failures);

                    tokio::spawn(async move {
                        let result = Self::run_recovery_loop(
                            recovery_id.clone(),
                            config,
                            current_state,
                            health_check,
                            admission_controller,
                            from_tier,
                            trace_id,
                        ).await;

                        // Handle result
                        match &result {
                            Ok(()) => {
                                tracing::info!(recovery_id = %recovery_id, "Recovery completed successfully");
                            }
                            Err(e) => {
                                tracing::error!(recovery_id = %recovery_id, error = ?e, "Recovery failed");

                                // Increment circuit breaker failures
                                let mut failures = circuit_breaker_failures.lock().await;
                                *failures += 1;

                                // Reset admission rate on failure
                                if let Err(reset_err) = admission_controller.set_admission_rate(0.0).await {
                                    tracing::error!(
                                        recovery_id = %recovery_id,
                                        error = %reset_err,
                                        "Failed to reset admission rate on recovery failure"
                                    );
                                }
                            }
                        }

                        result
                    })
                }

                async fn run_recovery_loop(
                    recovery_id: String,
                    config: RecoveryConfig,
                    current_state: Arc<Mutex<RecoveryState>>,
                    health_check: HealthCheckFn,
                    admission_controller: Arc<dyn AdmissionController>,
                    from_tier: super::watermark_thresholds::BackpressureTier,
                    trace_id: String,
                ) -> Result<(), RecoveryError> {
                    let mut step = 0;
                    let mut current_admission_rate = 0.0;

                    loop {
                        // Health check before each step
                        let health_score = match (health_check)() {
                            Ok(score) => score,
                            Err(e) => {
                                tracing::error!(
                                    recovery_id = %recovery_id,
                                    step = step,
                                    error = %e,
                                    "Health check failed"
                                );
                                return Err(RecoveryError::HealthCheckFailure(e));
                            }
                        };

                        // Check if health degraded (rollback condition)
                        if health_score < config.rollback_threshold_health_score {
                            tracing::warn!(
                                recovery_id = %recovery_id,
                                step = step,
                                health_score = health_score,
                                threshold = config.rollback_threshold_health_score,
                                "Health degraded, rolling back recovery"
                            );

                            // Reset to 0% admission
                            admission_controller.set_admission_rate(0.0).await
                                .map_err(|e| RecoveryError::HealthCheckFailure(e))?;

                            // Update state
                            let mut state = current_state.lock().await;
                            *state = RecoveryState::Failed {
                                reason: format!("Health degraded to {:.2} at step {}", health_score, step)
                            };

                            return Err(RecoveryError::HealthCheckFailure(
                                format!("Health score {:.2} below threshold {:.2}", health_score, config.rollback_threshold_health_score)
                            ));
                        }

                        // Calculate next admission rate
                        current_admission_rate += config.admission_increase_percent;
                        if current_admission_rate > 100.0 {
                            current_admission_rate = 100.0;
                        }

                        // Apply admission rate
                        admission_controller.set_admission_rate(current_admission_rate).await
                            .map_err(|e| RecoveryError::HealthCheckFailure(e))?;

                        // Update state
                        {
                            let mut state = current_state.lock().await;
                            *state = RecoveryState::Active {
                                current_step: step,
                                admission_rate_percent: current_admission_rate,
                            };
                        }

                        tracing::info!(
                            recovery_id = %recovery_id,
                            step = step,
                            admission_rate_percent = current_admission_rate,
                            health_score = health_score,
                            "Recovery step completed"
                        );

                        // Emit metrics
                        metrics::gauge!("recovery_current_step")
                            .with_label_values(&[&recovery_id])
                            .set(step as f64);

                        metrics::gauge!("recovery_admission_rate_percent")
                            .with_label_values(&[&recovery_id])
                            .set(current_admission_rate);

                        metrics::histogram!("recovery_health_score")
                            .with_label_values(&[&recovery_id])
                            .observe(health_score);

                        // Check if recovery complete
                        if step >= config.max_recovery_steps || current_admission_rate >= 100.0 {
                            let mut state = current_state.lock().await;
                            *state = RecoveryState::Completed;

                            tracing::info!(
                                recovery_id = %recovery_id,
                                total_steps = step,
                                final_admission_rate = current_admission_rate,
                                "Recovery completed successfully"
                            );

                            return Ok(());
                        }

                        step += 1;

                        // Wait for next step
                        tokio::time::sleep(Duration::from_secs(config.step_interval_seconds)).await;
                    }
                }

                pub async fn get_recovery_state(&self) -> RecoveryState {
                    let state = self.current_state.lock().await;
                    state.clone()
                }

                pub async fn abort_recovery(&self, recovery_id: &str) -> Result<(), RecoveryError> {
                    let mut recoveries = self.active_recoveries.lock().await;
                    if let Some(handle) = recoveries.remove(recovery_id) {
                        handle.task_handle.abort();

                        // Reset admission rate
                        self.admission_controller.set_admission_rate(0.0).await
                            .map_err(|e| RecoveryError::HealthCheckFailure(e))?;

                        // Update state
                        let mut state = self.current_state.lock().await;
                        *state = RecoveryState::Inactive;

                        tracing::info!(recovery_id = %recovery_id, "Recovery aborted");

                        Ok(())
                    } else {
                        Err(RecoveryError::InvalidTier) // Reuse error for not found
                    }
                }

                pub async fn get_active_recoveries(&self) -> Vec<String> {
                    let recoveries = self.active_recoveries.lock().await;
                    recoveries.keys().cloned().collect()
                }
            }
          python: |
            from dataclasses import dataclass, field
            from typing import Dict, List, Optional, Callable, Awaitable, Any, Protocol
            from enum import Enum
            import asyncio
            import time
            import logging
            import uuid

            @dataclass
            class RecoveryConfig:
                """Configuration for gradual recovery process"""
                step_interval_seconds: int = 5          # 5s between steps
                admission_increase_percent: float = 10.0  # 10% increase per step
                max_recovery_steps: int = 10            # Max 10 steps (100% recovery)
                health_check_interval_seconds: int = 2  # Health check every 2s
                rollback_threshold_health_score: float = 0.7  # Rollback if health < 70%
                circuit_breaker_failure_threshold: int = 3    # Circuit breaker after 3 failures

            class RecoveryState(Enum):
                """Current state of recovery process"""
                INACTIVE = "inactive"
                ACTIVE = "active"
                PAUSED = "paused"
                COMPLETED = "completed"
                FAILED = "failed"

            @dataclass
            class ActiveRecoveryState:
                """State when recovery is actively running"""
                current_step: int
                admission_rate_percent: float

            @dataclass
            class PausedRecoveryState:
                """State when recovery is paused"""
                reason: str

            @dataclass
            class FailedRecoveryState:
                """State when recovery has failed"""
                reason: str

            class RecoveryError(Exception):
                """Error during recovery process"""
                pass

            class AdmissionController(Protocol):
                """Protocol for controlling admission rates"""

                async def set_admission_rate(self, rate_percent: float) -> None:
                    """Set the admission rate as a percentage (0-100)"""
                    ...

                async def get_current_admission_rate(self) -> float:
                    """Get current admission rate as percentage"""
                    ...

            @dataclass
            class RecoveryHandle:
                """Handle for monitoring and controlling a recovery process"""
                recovery_id: str
                task: asyncio.Task[None]

                async def abort(self) -> None:
                    """Abort the recovery process"""
                    self.task.cancel()
                    try:
                        await self.task
                    except asyncio.CancelledError:
                        pass

            class RecoveryManager:
                """Manages gradual recovery from backpressure with health monitoring"""

                def __init__(
                    self,
                    health_check: Callable[[], Awaitable[float]],
                    admission_controller: AdmissionController,
                    config: Optional[RecoveryConfig] = None
                ):
                    self.config = config or RecoveryConfig()
                    self.health_check = health_check
                    self.admission_controller = admission_controller
                    self.current_state: RecoveryState | ActiveRecoveryState | PausedRecoveryState | FailedRecoveryState = RecoveryState.INACTIVE
                    self.active_recoveries: Dict[str, RecoveryHandle] = {}
                    self.circuit_breaker_failures = 0
                    self.logger = logging.getLogger(__name__)

                async def start_recovery(
                    self,
                    from_tier: 'BackpressureTier',
                    trace_id: str
                ) -> RecoveryHandle:
                    """
                    Initiate gradual recovery from backpressure tier.

                    Args:
                        from_tier: Tier recovering from (must be > NORMAL)
                        trace_id: Cognitive trace ID for tracking

                    Returns:
                        RecoveryHandle for monitoring the recovery

                    Raises:
                        RecoveryError: If recovery cannot be started
                    """
                    # Validate tier
                    if from_tier == BackpressureTier.NORMAL:
                        raise RecoveryError("Cannot recover from NORMAL tier")

                    # Check circuit breaker
                    if self.circuit_breaker_failures >= self.config.circuit_breaker_failure_threshold:
                        raise RecoveryError("Circuit breaker is open due to repeated failures")

                    # Check if already recovering
                    if isinstance(self.current_state, ActiveRecoveryState):
                        raise RecoveryError("Recovery already in progress")

                    # Initialize recovery state
                    recovery_id = f"recovery_{trace_id}_{int(time.time())}"
                    self.current_state = ActiveRecoveryState(
                        current_step=0,
                        admission_rate_percent=0.0  # Start from 0% after backpressure
                    )

                    # Start recovery task
                    task = asyncio.create_task(
                        self._run_recovery_loop(recovery_id, from_tier, trace_id)
                    )

                    recovery_handle = RecoveryHandle(recovery_id, task)
                    self.active_recoveries[recovery_id] = recovery_handle

                    self.logger.info(
                        f"Recovery initiated: {recovery_id}",
                        extra={
                            'recovery_id': recovery_id,
                            'from_tier': from_tier.name,
                            'trace_id': trace_id
                        }
                    )

                    return recovery_handle

                async def _run_recovery_loop(
                    self,
                    recovery_id: str,
                    from_tier: 'BackpressureTier',
                    trace_id: str
                ) -> None:
                    """Main recovery loop with gradual admission increases"""
                    try:
                        step = 0
                        current_admission_rate = 0.0

                        while True:
                            # Health check before each step
                            try:
                                health_score = await self.health_check()
                            except Exception as e:
                                self.logger.error(
                                    f"Health check failed in recovery {recovery_id}: {e}",
                                    extra={'recovery_id': recovery_id, 'error': str(e)}
                                )
                                raise RecoveryError(f"Health check failed: {e}")

                            # Check if health degraded (rollback condition)
                            if health_score < self.config.rollback_threshold_health_score:
                                self.logger.warning(
                                    f"Health degraded in recovery {recovery_id}, rolling back",
                                    extra={
                                        'recovery_id': recovery_id,
                                        'step': step,
                                        'health_score': health_score,
                                        'threshold': self.config.rollback_threshold_health_score
                                    }
                                )

                                # Reset to 0% admission
                                await self.admission_controller.set_admission_rate(0.0)

                                # Update state
                                self.current_state = FailedRecoveryState(
                                    reason=f"Health degraded to {health_score:.2f} at step {step}"
                                )

                                raise RecoveryError(
                                    f"Health score {health_score:.2f} below threshold {self.config.rollback_threshold_health_score}"
                                )

                            # Calculate next admission rate
                            current_admission_rate += self.config.admission_increase_percent
                            if current_admission_rate > 100.0:
                                current_admission_rate = 100.0

                            # Apply admission rate
                            await self.admission_controller.set_admission_rate(current_admission_rate)

                            # Update state
                            self.current_state = ActiveRecoveryState(
                                current_step=step,
                                admission_rate_percent=current_admission_rate
                            )

                            self.logger.info(
                                f"Recovery step {step} completed: {current_admission_rate:.1f}% admission",
                                extra={
                                    'recovery_id': recovery_id,
                                    'step': step,
                                    'admission_rate_percent': current_admission_rate,
                                    'health_score': health_score
                                }
                            )

                            # Emit metrics (placeholder)
                            self._emit_recovery_metrics(recovery_id, step, current_admission_rate, health_score)

                            # Check if recovery complete
                            if step >= self.config.max_recovery_steps or current_admission_rate >= 100.0:
                                self.current_state = RecoveryState.COMPLETED

                                self.logger.info(
                                    f"Recovery {recovery_id} completed successfully",
                                    extra={
                                        'recovery_id': recovery_id,
                                        'total_steps': step,
                                        'final_admission_rate': current_admission_rate
                                    }
                                )
                                return

                            step += 1

                            # Wait for next step
                            await asyncio.sleep(self.config.step_interval_seconds)

                    except asyncio.CancelledError:
                        self.logger.info(f"Recovery {recovery_id} cancelled")
                        raise
                    except Exception as e:
                        self.logger.error(f"Recovery {recovery_id} failed: {e}")
                        self.circuit_breaker_failures += 1

                        # Reset admission rate on failure
                        try:
                            await self.admission_controller.set_admission_rate(0.0)
                        except Exception as reset_error:
                            self.logger.error(
                                f"Failed to reset admission rate on recovery failure: {reset_error}"
                            )

                        self.current_state = FailedRecoveryState(reason=str(e))
                        raise

                def _emit_recovery_metrics(
                    self,
                    recovery_id: str,
                    step: int,
                    admission_rate: float,
                    health_score: float
                ):
                    """Emit recovery metrics (placeholder implementation)"""
                    # In real implementation, would integrate with Prometheus/metrics system
                    pass

                async def abort_recovery(self, recovery_id: str) -> None:
                    """Abort an active recovery process"""
                    if recovery_id in self.active_recoveries:
                        handle = self.active_recoveries.pop(recovery_id)
                        await handle.abort()

                        # Reset admission rate
                        await self.admission_controller.set_admission_rate(0.0)

                        # Update state
                        self.current_state = RecoveryState.INACTIVE

                        self.logger.info(f"Recovery {recovery_id} aborted")
                    else:
                        raise RecoveryError(f"Recovery {recovery_id} not found")

                def get_recovery_state(self) -> RecoveryState | ActiveRecoveryState | PausedRecoveryState | FailedRecoveryState:
                    """Get current recovery state"""
                    return self.current_state

                def get_active_recoveries(self) -> List[str]:
                    """Get list of active recovery IDs"""
                    return list(self.active_recoveries.keys())

    dependencies:
      - name: tokio
        description: Async runtime for Rust implementation
      - name: async-trait
        description: Async trait support for Rust
      - name: chrono
        description: Date/time handling for recovery IDs

recovery_requirements:
  - step_interval: 5 seconds between admission rate increases
  - admission_increase: 10% per step (gradual recovery)
  - max_steps: 10 steps maximum (full recovery in 50 seconds)
  - health_monitoring: Continuous health checks during recovery
  - automatic_rollback: Immediate rollback if health degrades below threshold
  - circuit_breaker: Fail-fast after repeated recovery failures

health_check_requirements:
  - latency_budget: <2s health check response time
  - accuracy: Health score 0.0-1.0 (1.0 = perfect health)
  - metrics_included: CPU usage, memory usage, queue depth, error rates
  - failure_handling: Graceful degradation on health check failures

admission_control_requirements:
  - precision: 1% admission rate granularity
  - latency: <100ms to apply admission rate changes
  - persistence: Admission rate survives component restarts
  - monitoring: Admission rate changes are logged and metered
