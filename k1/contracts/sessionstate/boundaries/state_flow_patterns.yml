# State Flow Patterns Contract (K1 ↔ K0)
# Issue: 1.1.3 - State Boundary Management Contracts
# Source ADR: ADR-0001f (State Boundary Management K1 vs K0)
# Related ADRs: ADR-0001a (K0 Bridge Protocol), ADR-0022 (K0 Bridge Batching)

state_flow_patterns:
  name: "K1 ↔ K0 State Flow Patterns"
  version: "1.0"
  purpose: "Define how state flows between K1 working memory and K0 long-term memory"

  flow_patterns:
    # ========================================
    # PATTERN 1: K1 → K0 (Write Patterns)
    # ========================================
    k1_to_k0_write:
      - pattern_id: "write_pattern_1"
        name: "SessionState Delta Batching"
        direction: "K1 → K0"
        semantics: "Write (async)"
        purpose: "Persist K1 SessionState deltas to K0 for durability"

        flow_sequence:
          - step: 1
            action: "K1 updates SessionState in-memory"
            component: "K1 SessionState Manager"
            example: "beliefs.current_task = 'Schedule Emma soccer'"
            latency: "<1ms (in-memory update)"

          - step: 2
            action: "Mark section as dirty (dirty flag set)"
            component: "K1 SessionState Manager"
            example: "dirty_flags['beliefs'] = True"
            latency: "<0.1ms"

          - step: 3
            action: "Wait for batch flush trigger"
            component: "K1 Batch Flush Timer"
            triggers:
              - "250ms timer expires (default)"
              - "64KB buffer full (memory pressure)"
              - "Turn completion (explicit flush)"
            example: "Timer expired after 250ms"

          - step: 4
            action: "Serialize dirty sections to FlatBuffers"
            component: "K1 SessionState Serializer"
            example: "Serialize beliefs section → 8KB FlatBuffers"
            latency: "<1ms (FlatBuffers serialization)"

          - step: 5
            action: "Send batch to K0 Bridge (P02 MemoryWrite)"
            component: "K1 → K0 Bridge Client"
            payload:
              port: "command"
              command_type: "memory_write"
              cognitive_trace_id: "abc123"
              session_id: "sess_xyz"
              qos_band: "GREEN"
              deltas:
                - section: "beliefs"
                  field: "current_task"
                  value: "Schedule Emma's soccer practice"
                  timestamp_ms: 1697097600000
            latency: "<5ms (K0 Bridge HTTP/2 send)"

          - step: 6
            action: "K0 writes to WAL, returns receipt"
            component: "K0 Memory Module"
            wal_guarantees: "ACID (atomic batch write)"
            receipt:
              receipt_id: "rcpt_001"
              timestamp_ms: 1697097600250
              status: "committed"
              signature: "sha256_hash"
            latency: "<5ms (K0 WAL write + receipt)"

          - step: 7
            action: "K1 stores receipt in SessionState.meta"
            component: "K1 SessionState Manager"
            example: "meta.receipts.append(rcpt_001)"
            latency: "<0.1ms"

          - step: 8
            action: "Clear dirty flags"
            component: "K1 SessionState Manager"
            example: "dirty_flags['beliefs'] = False"
            latency: "<0.1ms"

        performance:
          total_latency: "<10ms P95 (measured 8ms average)"
          throughput: "100 flushes/sec per session"
          memory_overhead: "Buffered deltas: <64KB"

        failure_handling:
          k0_unavailable:
            action: "Buffer deltas in K1 memory (up to 10MB)"
            recovery: "Flush on K0 reconnect (bulk replay)"
            data_loss: "Zero (all deltas buffered)"

          k0_timeout:
            action: "Circuit breaker opens after 3 failures"
            recovery: "Exponential backoff (1s, 2s, 4s, ...)"
            data_loss: "Zero (deltas remain in buffer)"

      - pattern_id: "write_pattern_2"
        name: "GroundingCommit (Conversation Turn)"
        direction: "K1 → K0"
        semantics: "Write (sync)"
        purpose: "Commit completed conversation turn to K0 episodic memory"

        flow_sequence:
          - step: 1
            action: "K1 completes conversation turn"
            component: "K1 Orchestrator"
            example: "User: 'When is Emma's soccer?' → Agent: 'Wednesday 4pm'"

          - step: 2
            action: "Generate GroundingCommit"
            component: "K1 Grounding Manager"
            payload:
              port: "command"
              command_type: "memory_write"
              qos_band: "AMBER"  # Smart Lane routing
              memory_type: "episodic"
              content: "User asked Emma's soccer schedule. Planner retrieved calendar, confirmed Wednesday 4pm."
              timestamp_ms: 1697097600000
              participants: ["User", "Planner Agent"]
              obligations: ["calendar.get", "respond_to_user"]
              provenance:
                trace_id: "abc123"
                turn_id: 5
                session_id: "sess_xyz"
            latency: "<5ms (payload generation)"

          - step: 3
            action: "Send to K0 Bridge (P02 MemoryWrite)"
            component: "K1 → K0 Bridge Client"
            routing: "AMBER band → Smart Lane → Hippocampus DG→CA3→CA1"
            latency: "<10ms (K0 Bridge send)"

          - step: 4
            action: "K0 routes to Hippocampus (Smart Lane)"
            component: "K0 Router"
            processing: "DG (pattern separation) → CA3 (pattern completion) → CA1 (consolidation)"
            latency: "<150ms (Hippocampus processing)"

          - step: 5
            action: "K0 stores in episodic memory"
            component: "K0 Episodic Memory Store"
            storage:
              - "SQLite (HOT tier, last 30 days)"
              - "Vector DB (semantic embedding)"
              - "FTS5 index (keyword search)"
            latency: "<15ms (multi-store write)"

          - step: 6
            action: "K0 returns receipt with memory_id"
            component: "K0 Memory Module"
            receipt:
              receipt_id: "rcpt_002"
              memory_id: "mem_001"
              timestamp_ms: 1697097600250
              status: "committed"
            latency: "<5ms"

          - step: 7
            action: "K1 updates turn counter"
            component: "K1 SessionState.control"
            example: "control.turn += 1 (turn 5 → 6)"

        performance:
          total_latency: "<175ms P95 (Smart Lane Hippocampus)"
          throughput: "10 turns/sec per session"
          qos_band: "AMBER (Smart Lane, obligation-aware)"

    # ========================================
    # PATTERN 2: K0 → K1 (Read Patterns)
    # ========================================
    k0_to_k1_read:
      - pattern_id: "read_pattern_1"
        name: "Context Retrieval (Multi-Store Query)"
        direction: "K0 → K1"
        semantics: "Query (sync)"
        purpose: "Load relevant memories from K0 for K1 conversation context"

        flow_sequence:
          - step: 1
            action: "K1 needs context for current task"
            component: "K1 Planner Agent"
            example: "User: 'When is Emma's soccer?' → need context"

          - step: 2
            action: "K1 generates RecallQuery"
            component: "K1 Memory Client"
            payload:
              port: "query"
              command_type: "recall_query"
              qos_band: "GREEN"
              query:
                text: "Emma soccer schedule"
                intent: "episodic_recall"
                context_window_ms: 604800000  # 7 days
                max_results: 10
                cognitive_enhancements:
                  working_memory_boost: true
                  temporal_bias: "recency"
                  social_bias: "family_only"
            latency: "<1ms (query generation)"

          - step: 3
            action: "Send to K0 Bridge (P01 RecallQuery)"
            component: "K1 → K0 Bridge Client"
            latency: "<5ms (HTTP/2 send)"

          - step: 4
            action: "K0 performs multi-store retrieval"
            component: "K0 Memory Module"
            retrieval_stages:
              - stage: "FTS (Full-Text Search)"
                action: "Keyword search 'Emma', 'soccer', 'schedule'"
                latency: "<10ms"
                results: 15

              - stage: "Vector (Semantic Similarity)"
                action: "FAISS k-NN search (768-dim embeddings)"
                latency: "<15ms"
                results: 12

              - stage: "KG (Knowledge Graph)"
                action: "Traverse Emma → Soccer → Schedule"
                latency: "<10ms"
                results: 8

              - stage: "Episodic (Sequential Memory)"
                action: "Time-range query (last 7 days)"
                latency: "<10ms"
                results: 10

              - stage: "Fusion (Rank & Merge)"
                action: "Combine scores (0.4 FTS + 0.3 Vector + 0.2 KG + 0.1 Episodic)"
                latency: "<5ms"
                results: 10 (top-ranked)

            total_latency: "<50ms (P95 multi-store retrieval)"

          - step: 5
            action: "K0 returns ranked results with provenance"
            component: "K0 Memory Module"
            response:
              results:
                - memory_id: "mem_001"
                  content: "Emma's soccer practice is Wednesday 4pm at Riverside Park"
                  timestamp_ms: 1697097600000
                  provenance:
                    fusion_score: 0.92
                    fts_score: 0.85
                    vector_score: 0.88
                    kg_score: 0.95
                    episodic_score: 0.90
            latency: "<5ms (response serialization)"

          - step: 6
            action: "K1 injects top results into SessionState.beliefs"
            component: "K1 SessionState Manager"
            example: "beliefs.context = [mem_001, ...]"
            latency: "<1ms"

        performance:
          total_latency: "<50ms P95 (K0 multi-store retrieval)"
          cache_hit_rate: "75% (CACHE tier <1ms)"
          throughput: "100 queries/sec"

      - pattern_id: "read_pattern_2"
        name: "Persona State Sync"
        direction: "K0 → K1"
        semantics: "Query (sync)"
        purpose: "Load user persona from K0 Self-Model at session start"

        flow_sequence:
          - step: 1
            action: "K1 starts new session"
            component: "K1 Session Manager"
            example: "User initiates conversation"

          - step: 2
            action: "K1 queries K0 for persona"
            component: "K1 → K0 Bridge Client"
            payload:
              port: "query"
              command_type: "personalization_sync"
              user_id: "user_alice"
              traits_requested:
                - "formality"
                - "verbosity"
                - "emoji_use"
                - "diet"
                - "sleep_goal"
            latency: "<1ms"

          - step: 3
            action: "K0 retrieves from Self-Model (HOT tier)"
            component: "K0 Self-Model Store"
            storage: "SQLite (self_model table, indexed by user_id)"
            latency: "<5ms (SQLite hot tier)"

          - step: 4
            action: "K0 returns persona traits"
            component: "K0 Memory Module"
            response:
              traits:
                formality: 0.3
                verbosity: 0.5
                emoji_use: true
                diet: "vegetarian"
                sleep_goal: "8h"
            latency: "<1ms"

          - step: 5
            action: "K1 loads into SessionState.persona"
            component: "K1 SessionState Manager"
            example: "persona.formality = 0.3"
            latency: "<1ms"

        performance:
          total_latency: "<10ms P95 (SQLite hot tier)"
          cache_hit_rate: "90% (persona rarely changes)"

    # ========================================
    # PATTERN 3: K0 → K1 (Recovery Pattern)
    # ========================================
    k0_to_k1_recovery:
      - pattern_id: "recovery_pattern_1"
        name: "WAL Replay (Crash Recovery)"
        direction: "K0 → K1"
        semantics: "Recovery (sync)"
        purpose: "Recover K1 SessionState after crash from K0 WAL"

        flow_sequence:
          - step: 1
            action: "K1 crashes (OOM, segfault, power loss)"
            component: "K1 Process"
            detection: "No graceful shutdown marker"

          - step: 2
            action: "K1 restarts, detects crash"
            component: "K1 Initialization"
            check: "Graceful shutdown marker missing"

          - step: 3
            action: "K1 queries K0 for active sessions"
            component: "K1 → K0 Bridge Client"
            payload:
              port: "sync"
              command_type: "list_active_sessions"
            response:
              sessions: ["sess_xyz", "sess_abc"]
            latency: "<5ms"

          - step: 4
            action: "For each session, request WAL replay"
            component: "K1 → K0 Bridge Client"
            payload:
              port: "sync"
              command_type: "wal_replay"
              session_id: "sess_xyz"
              last_checkpoint_turn: 0  # Start from beginning if unknown
            latency: "<5ms (request)"

          - step: 5
            action: "K0 replays WAL"
            component: "K0 Memory Module"
            replay_stages:
              - stage: "Load checkpoint"
                action: "Load SessionState snapshot at turn 10"
                latency: "<100ms (SQLite query)"

              - stage: "Apply deltas"
                action: "Apply deltas 11-50 from WAL"
                latency: "<4s (50 deltas × 80ms average)"

              - stage: "Rebuild SessionState"
                action: "Reconstruct all 6 sections"
                latency: "<100ms (FlatBuffers deserialization)"

            total_latency: "<4.5s (50 deltas)"

          - step: 6
            action: "K0 returns reconstructed SessionState"
            component: "K0 Memory Module"
            response:
              session_state:
                beliefs: {...}
                scoreboard: {...}
                control: {turn: 15, phase: "execution"}
                persona: {...}
                multimodal: {...}
                meta: {...}
              recovery_info:
                checkpoint_turn: 10
                deltas_applied: 50
                recovery_latency_ms: 4500
            latency: "<100ms (response send)"

          - step: 7
            action: "K1 loads SessionState, resumes from last turn"
            component: "K1 SessionState Manager"
            example: "Resume from turn 15"
            latency: "<100ms (in-memory load)"

          - step: 8
            action: "K1 notifies user"
            component: "K1 UI"
            message: "Session recovered, continuing from turn 15"

        performance:
          total_recovery_time: "<5s P95 (target), measured 4.5s for 50 deltas"
          data_loss: "Minimal (<250ms of SessionState updates between last flush and crash)"
          recovery_success_rate: "99.9% (WAL guarantees durability)"

  observability:
    prometheus_metrics:
      - name: "state_flow_latency_ms"
        type: "histogram"
        labels: ["pattern", "direction", "step"]
        buckets: [1, 5, 10, 25, 50, 100, 250, 1000, 5000]
        description: "Latency of each state flow pattern"

      - name: "state_flow_throughput_ops_per_sec"
        type: "gauge"
        labels: ["pattern"]
        description: "Throughput of state flow operations"

      - name: "state_flow_error_total"
        type: "counter"
        labels: ["pattern", "error_type"]
        description: "Total errors per state flow pattern"

      - name: "k0_wal_replay_duration_ms"
        type: "histogram"
        labels: ["session_id"]
        buckets: [1000, 2000, 5000, 10000]
        description: "WAL replay duration for crash recovery"

  related_adrs:
    - adr: "ADR-0001f"
      section: "State Flow Patterns"
      lines: "K1→K0 write, K0→K1 read, K0→K1 recovery"

    - adr: "ADR-0001a"
      section: "K0 Bridge Communication Protocol"
      lines: "P01 RecallQuery, P02 MemoryWrite, P07 Sync/CRDT, P18 PersonalizationSync"

    - adr: "ADR-0022"
      section: "K0 Bridge Batching Infrastructure"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.1.3"
      author: "Contract Development Team"
