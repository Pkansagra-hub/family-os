# K1 SessionState Allocation Contract
# Issue: 1.1.3 - State Boundary Management Contracts
# Source ADR: ADR-0001f (State Boundary Management K1 vs K0)
# Related ADRs: ADR-0017 (SessionState 6-Section Design), ADR-0018 (3-Tier Eviction)

k1_sessionstate_allocation:
  name: "K1 SessionState Working Memory"
  version: "1.0"
  purpose: "Fast, ephemeral working memory for active conversation turns"
  location: "K1 Intelligence Module (in-memory only, no disk I/O)"

  size_budget:
    soft_limit: "64KB"
    hard_limit: "128KB"
    warning_threshold: "92KB"
    critical_threshold: "115KB"
    description: "Soft limit triggers Tier 1 eviction, hard limit triggers Tier 2 emergency eviction"

  characteristics:
    durability: "Ephemeral - lost on K1 crash (rebuilt from K0 WAL)"
    access_speed: "<1ms P95 (in-memory, no disk I/O)"
    update_rate: "Hundreds of times per session (every turn ~100ms)"
    serialization: "FlatBuffers for K0 flushes (<1ms serialization)"
    consistency: "Eventually consistent (<250ms lag to K0)"

  sections:
    - section_id: 1
      name: "beliefs"
      purpose: "Current task, active goals, assumptions, user intents, conversation context"
      typical_size: "8KB"
      max_size: "16KB"
      update_frequency: "Every turn (~100ms)"
      access_pattern: "read_heavy"

      eviction_policy:
        strategy: "LRU (Least Recently Used)"
        priority: "MEDIUM"
        rule: "Keep top 10 beliefs by recency"
        trigger: "When section exceeds 12KB"

      example_data:
        current_task: "User wants to schedule Emma's soccer practice"
        user_intent: "SCHEDULE_EVENT"
        active_goals:
          - "Find available time slots"
          - "Confirm with user"
        conversation_context:
          - turn: 5
            summary: "User mentioned Emma's soccer on Wednesday"
            timestamp_ms: 1697097600000

      persistence:
        flush_to_k0: true
        flush_frequency: "Every 250ms batch OR at turn completion"
        k0_memory_type: "episodic"
        reason: "Long-term grounding for conversation continuity"

    - section_id: 2
      name: "scoreboard"
      purpose: "Agent proposals, negotiation state, selection scores, task assignments"
      typical_size: "4KB"
      max_size: "8KB"
      update_frequency: "During 3-phase orchestration (negotiation, selection, execution)"
      access_pattern: "write_heavy"

      eviction_policy:
        strategy: "Keep current turn only"
        priority: "MEDIUM"
        rule: "Discard previous turn scores after new turn starts"
        trigger: "Automatic at turn boundary"

      example_data:
        current_turn_scores:
          - agent_id: "planner"
            score: 0.85
            capabilities_match: 0.9
            latency_estimate_ms: 50
            cost_usd: 0.002
          - agent_id: "researcher"
            score: 0.62
            capabilities_match: 0.7
            latency_estimate_ms: 150
            cost_usd: 0.005
        selected_agent: "planner"
        negotiation_phase: "execution"

      persistence:
        flush_to_k0: true
        flush_frequency: "At turn completion only"
        k0_memory_type: "episodic"
        reason: "Audit trail for agent selection decisions"

    - section_id: 3
      name: "control"
      purpose: "Turn state, protocol FSM position, active agent leases, flow position"
      typical_size: "2KB"
      max_size: "4KB"
      update_frequency: "Continuously during turn execution (sub-second updates)"
      access_pattern: "read_write_balanced"

      eviction_policy:
        strategy: "NEVER EVICT"
        priority: "CRITICAL"
        rule: "Essential flow state, required for turn execution"
        trigger: "N/A (never evicted)"

      example_data:
        turn: 5
        phase: "execution"
        protocol: "task_execution"
        active_agents:
          - agent_id: "planner"
            state: "ACTIVE"
            lease_expires_at: 1697097620000
        backpressure_signals:
          - source: "model_hub"
            level: "MEDIUM"

      persistence:
        flush_to_k0: false
        flush_frequency: "Never (ephemeral, rebuilt from K0 WAL on recovery)"
        k0_memory_type: "N/A"
        reason: "Ephemeral flow state, not needed for long-term memory"

    - section_id: 4
      name: "persona"
      purpose: "Dynamic traits from K0, current style, user preferences, adaptations"
      typical_size: "4KB"
      max_size: "8KB"
      update_frequency: "Session start + periodic sync (every 10 turns)"
      access_pattern: "read_heavy"

      eviction_policy:
        strategy: "Keep top 20 traits by relevance score"
        priority: "MEDIUM"
        rule: "Evict lowest relevance traits first"
        trigger: "When section exceeds 6KB"

      example_data:
        formality: 0.3
        verbosity: 0.5
        emoji_use: true
        communication_style: "casual"
        preferred_response_length: "medium"
        time_sensitivity: "flexible"

      persistence:
        flush_to_k0: true
        flush_frequency: "On significant change (delta > 0.1) OR at session end"
        k0_memory_type: "self_model"
        reason: "User preferences for future sessions"

    - section_id: 5
      name: "multimodal"
      purpose: "Audio buffer, pending tool results, streaming state, vision data"
      typical_size: "32KB"
      max_size: "48KB"
      update_frequency: "Voice input, tool calls, SSE streaming (varies by modality)"
      access_pattern: "read_heavy"

      eviction_policy:
        strategy: "LRU eviction for audio buffers"
        priority: "LOW"
        rule: "Keep last 5 seconds of audio, drop oldest first"
        trigger: "When section exceeds 40KB"

      example_data:
        audio_buffer:
          format: "compressed_opus"
          size_kb: 4
          duration_ms: 5000
          last_vad_activity_ms: 1697097600000
        pending_tools:
          - tool_id: "calendar.get"
            status: "PENDING"
            started_at: 1697097599000
        streaming_state:
          active_streams: 2
          total_bytes_sent: 12345

      persistence:
        flush_to_k0: "partial"
        flush_frequency: "Metadata only (pointers to K0 blob storage)"
        k0_memory_type: "working_memory_snapshots"
        reason: "Audio stored in K0 blob storage, SessionState has pointers only"

    - section_id: 6
      name: "meta"
      purpose: "Trace IDs, timestamps, metrics, debug data, observability"
      typical_size: "4KB"
      max_size: "8KB"
      update_frequency: "Continuously for observability (every operation)"
      access_pattern: "write_heavy"

      eviction_policy:
        strategy: "Keep last 100 trace IDs only"
        priority: "LOW"
        rule: "Drop oldest trace IDs first"
        trigger: "When section exceeds 6KB"

      example_data:
        trace_id: "abc123"
        session_id: "sess_xyz789"
        ttft_ms: 140
        turn_start: "2025-10-13T12:34:56.789Z"
        last_k0_flush: 1697097600250
        receipts:
          - receipt_id: "rcpt_001"
            timestamp_ms: 1697097600250
            status: "committed"

      persistence:
        flush_to_k0: false
        flush_frequency: "Never (observability only, not needed for recovery)"
        k0_memory_type: "N/A"
        reason: "Ephemeral telemetry, traces sent to observability pipeline"

  lifecycle:
    creation:
      trigger: "Session start (user initiates conversation)"
      actions:
        - "Allocate SessionState struct (64KB buffer)"
        - "Load persona from K0 (P18 PersonalizationSync)"
        - "Initialize control section (turn=0, phase='start')"
        - "Set meta.session_id, meta.trace_id"
      latency_budget: "10ms P95"

    updates:
      trigger: "Every turn (beliefs, scoreboard, control updated)"
      actions:
        - "Update beliefs with new user input, LLM context"
        - "Update scoreboard during 3-phase orchestration"
        - "Update control with turn state, protocol FSM"
        - "Mark sections as dirty for next batch flush"
      latency_budget: "<1ms per update (in-memory)"

    persistence:
      trigger: "Every 250ms OR 64KB buffer full OR turn completion"
      actions:
        - "Serialize dirty sections to FlatBuffers"
        - "Send batch flush to K0 (P02 MemoryWrite)"
        - "Receive receipt from K0, store in meta.receipts"
        - "Clear dirty flags"
      latency_budget: "10ms P95 (K0 Bridge latency)"

    destruction:
      trigger: "Session end (user closes browser, explicit logout)"
      actions:
        - "Final flush to K0 (all remaining dirty sections)"
        - "Mark session as 'ended' in K0"
        - "Free SessionState memory (64KB reclaimed)"
        - "Clean up control section (terminate active agents)"
      latency_budget: "10ms P95 (final flush)"

    recovery:
      trigger: "K1 crash (OOM, segfault, power loss) → K1 restart"
      actions:
        - "Detect crash (no graceful shutdown marker)"
        - "Query K0 for active sessions (P07 Sync/CRDT)"
        - "Request WAL replay for each session"
        - "K0 replays WAL (load checkpoint + apply deltas)"
        - "K1 receives reconstructed SessionState"
        - "Resume session from last consistent turn"
      latency_budget: "<5s recovery (target), measured 4.5s for 50 deltas"

  memory_allocation:
    per_session_budget: "64KB soft, 128KB hard"
    max_concurrent_sessions: "10-15 sessions"
    total_k1_sessionstate_budget: "640KB-960KB (for SessionState only)"
    k1_total_memory: "500MB (includes agents, Model Hub, buffers)"

  observability:
    prometheus_metrics:
      - name: "sessionstate_size_bytes"
        type: "gauge"
        labels: ["session_id", "section"]
        description: "Current size of each SessionState section"

      - name: "sessionstate_eviction_total"
        type: "counter"
        labels: ["session_id", "section", "reason"]
        description: "Total evictions per section"

      - name: "sessionstate_flush_latency_ms"
        type: "histogram"
        labels: ["session_id"]
        buckets: [1, 5, 10, 25, 50, 100]
        description: "Latency of K0 batch flush"

      - name: "sessionstate_recovery_latency_ms"
        type: "histogram"
        labels: ["session_id"]
        buckets: [1000, 2000, 5000, 10000]
        description: "Time to recover SessionState from K0 WAL"

    opentelemetry_spans:
      - span_name: "sessionstate.create"
        attributes: ["session_id", "persona_load_ms"]

      - span_name: "sessionstate.update"
        attributes: ["session_id", "section", "size_bytes"]

      - span_name: "sessionstate.flush"
        attributes: ["session_id", "sections_flushed", "latency_ms"]

      - span_name: "sessionstate.recovery"
        attributes: ["session_id", "deltas_applied", "recovery_ms"]

  related_adrs:
    - adr: "ADR-0001f"
      section: "State Allocation - K1 State"
      lines: "150-450"

    - adr: "ADR-0017"
      section: "SessionState 6-Section Design"
      lines: "1-1137"

    - adr: "ADR-0018"
      section: "3-Tier Eviction Strategy"
      lines: "HOT tier (in-memory, <1ms)"

  changelog:
    - version: "1.0"
      date: "2025-10-14"
      changes: "Initial contract definition for Issue 1.1.3"
      author: "Contract Development Team"
