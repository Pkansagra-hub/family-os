# Barge-In Protocol - Security & Audit Contract
# Purpose: Security validation, user authentication, audit trails, threat prevention
# ADR Reference: ADR-0003b (Protocols), ADR-0010 (Capability Security), ADR-0035 (PII & Audit)
# Compliance: GDPR, SOC2 Type II

---
security:
  name: "barge_in_protocol_security"
  version: "1.0"
  description: "Security and audit controls for barge-in protocol"

  # ===== AUTHENTICATION =====
  authentication:
    - name: "Session Validation"
      requirement: "User interrupting must have valid session"
      mechanism: "JWT token validation"
      checks:
        - "session_id must exist and be active"
        - "session_id.user_id must match signal.user_id"
        - "session_token must not be expired"
        - "session_must_not_be_suspended (e.g., due to security policy)"
      failure_action: "reject_signal, log_auth_failure, alert_security_team"
      failure_log: "k0_security_audit_log"

    - name: "Device Binding"
      requirement: "Interrupt must come from registered device"
      mechanism: "Device fingerprinting + device whitelist"
      checks:
        - "device_id must be registered to user.account"
        - "device_fingerprint must match (OS, browser, etc.)"
        - "if new device: require re-auth or OTP"
      failure_action: "reject_signal, require_re_authentication"

    - name: "Multi-Factor Authentication"
      requirement: "Optional MFA for sensitive sessions"
      mechanism: "Policy-based MFA enforcement"
      condition: "if session.space_id == RED, require MFA"
      implementation: "TOTP, biometric, or hardware key"

  # ===== AUTHORIZATION =====
  authorization:
    - name: "User Interrupt Capability"
      requirement: "User must have permission to interrupt"
      mechanism: "Capability token validation"
      required_capability: "INTERRUPT_TASK"
      default_for: "all_authenticated_users"
      denial_cases:
        - "user.account_suspended"
        - "user_in_read_only_mode"
        - "session_marked_as_untrusted"

    - name: "Task Ownership"
      requirement: "User can only interrupt their own tasks"
      validation: "signal.user_id == task.owner_user_id"
      exception: "admin users can interrupt any task (with audit trail)"
      failure_action: "reject_signal, log_unauthorized_attempt"

    - name: "Space-Level Authorization"
      requirement: "User must have access to privacy space"
      validation_rules:
        - "GREEN: any authenticated user"
        - "AMBER: user with AMBER_ACCESS capability"
        - "RED: user with RED_ACCESS capability or data owner"
        - "BLACK: restricted, special authorization required"
      failure_action: "reject_signal, log_authorization_failure"

  # ===== INPUT VALIDATION =====
  input_validation:
    - field: "signal_id"
      validation: "UUID v4 format"
      rejection_action: "drop_signal"

    - field: "user_id"
      validation: "matches session.user_id"
      rejection_action: "reject_signal, alert_security"

    - field: "device_id"
      validation: "matches user.registered_devices"
      rejection_action: "reject_signal, require_re_auth"

    - field: "reason"
      validation: "must be one of: STOP, NEW_INPUT, RECONSIDER, CLARIFICATION"
      rejection_action: "drop_signal"

    - field: "force_mode"
      validation: "must be: graceful or immediate"
      rejection_action: "drop_signal"

    - field: "new_input"
      validation: "if present, must not contain injection attempts (SQL, code, etc.)"
      mechanism: "lexical analysis + pattern matching"
      rejection_action: "drop_signal, log_injection_attempt"

    - field: "signature"
      validation: "HMAC-SHA256 signature verification"
      rejection_action: "drop_signal, alert_security (tampering attempt)"

  # ===== THREAT PREVENTION =====
  threat_prevention:
    - threat: "Interrupt Flooding"
      description: "Attacker sends hundreds of interrupt signals"
      detection: "rate limit > 10 signals/second from single user"
      mitigation:
        - "drop signals from user for 60s"
        - "log incident to k0_security_audit_log"
        - "alert security team"

    - threat: "Unauthorized Interrupt"
      description: "User A tries to interrupt User B's task"
      detection: "signal.user_id != task.owner_user_id"
      mitigation:
        - "reject signal"
        - "log attempted unauthorized interrupt"
        - "alert security team if repeated"

    - threat: "Session Hijacking"
      description: "Attacker uses stolen session token"
      detection:
        - "device_fingerprint mismatch"
        - "unusual activity pattern (geography, timing)"
        - "failed MFA"
      mitigation:
        - "invalidate session"
        - "force re-authentication"
        - "send security alert to user email"

    - threat: "State Manipulation"
      description: "Attacker sends invalid drain status to corrupt state"
      detection: "drain status from non-agent (spoofing)"
      mitigation:
        - "verify agent_id is authentic (via capability token)"
        - "validate drain status state machine transitions"
        - "reject invalid transitions"

    - threat: "Privilege Escalation"
      description: "User tries to interrupt RED-band task without permission"
      detection: "space_id == RED, user lacks RED_ACCESS"
      mitigation:
        - "reject interrupt"
        - "log privilege escalation attempt"
        - "alert security team"

  # ===== AUDIT TRAIL =====
  audit_trail:
    storage:
      table: "barge_in_audit_log"
      database: "k0_compliance"
      retention_period_days: 2555  # 7 years
      encryption: "AES-256-GCM"
      backup_frequency: "daily"

    logged_events:
      - event: "interrupt_signal_received"
        fields:
          - "signal_id"
          - "user_id"
          - "device_id"
          - "reason"
          - "interrupted_agent_id"
          - "session_id"
          - "timestamp_utc"
          - "auth_result"  # "success", "failure", "blocked"
        retention: "7 years"

      - event: "authorization_check"
        fields:
          - "signal_id"
          - "user_id"
          - "authorization_result"  # "granted", "denied"
          - "reason_denied"
          - "timestamp_utc"
        retention: "7 years"

      - event: "drain_initiated"
        fields:
          - "signal_id"
          - "drain_id"
          - "agent_id"
          - "tasks_remaining"
          - "timestamp_utc"
        retention: "7 years"

      - event: "resumption_approved"
        fields:
          - "signal_id"
          - "resumption_id"
          - "new_task_id"
          - "state_preserved"
          - "timestamp_utc"
        retention: "7 years"

      - event: "security_violation"
        fields:
          - "signal_id"
          - "user_id"
          - "violation_type"
          - "violation_description"
          - "action_taken"
          - "timestamp_utc"
        retention: "30 years"  # Security incidents retained longer

    access_control:
      who_can_access:
        - role: "security_team"
          access: "read_full_audit"
          fields: "all"

        - role: "compliance_officer"
          access: "read_for_compliance"
          fields: ["user_id", "authorization_result", "security_violations"]

      query_requirements:
        - "require_capability_token(READ_AUDIT_LOG)"
        - "require_mfa_for_queries"
        - "all audit queries logged (audit of audit)"

    integrity_protection:
      mechanism: "HMAC-SHA256 per record"
      verification_on_read: true
      tamper_detection: "immediate_alert"

  # ===== PRIVACY PROTECTION =====
  privacy:
    privacy_bands:
      GREEN: "Standard interrupt, minimal privacy concerns"
      AMBER: "May involve identifiable info"
      RED: "Highly sensitive, strict access controls"

    pii_in_new_input:
      if_detected: "apply PII redaction (hash or vault)"
      storage: "redacted version stored in audit log"
      full_pii: "stored in encrypted vault (if needed)"

  # ===== INCIDENT RESPONSE =====
  incident_response:
    unauthorized_interrupt:
      detection: "signal.user_id != session.user_id OR auth_failure"
      escalation: "alert_security_team"
      investigation: "Review session logs, check for account compromise"

    interrupt_flooding:
      detection: "rate > 10 signals/sec from single user"
      escalation: "block_user_sessions, alert_security"
      investigation: "Is this user compromised? Is this an attack?"

    state_corruption:
      detection: "drain status invalid, state machine violation"
      escalation: "critical_alert"
      investigation: "Check for agent compromise or data corruption"

    security_violation:
      detection: "tampering detected (signature mismatch), privilege escalation"
      escalation: "immediate_investigation"
      action: "invalidate_session, force_re_auth, alert_user"

  # ===== COMPLIANCE =====
  compliance:
    gdpr:
      article_32_security: "Must implement appropriate security measures"
      article_32_implementation: "Authentication, authorization, encryption, audit trails"

      article_5_principles: "Data collection must be lawful and transparent"
      article_5_implementation: "Users must consent to interrupt functionality"

    soc2_type_ii:
      cc_7_1_organization_needs: "Obtain/generate accurate timely information"
      cc_7_1_implementation: "Audit logs with timestamps, traceability"

      cc_7_2_system_monitoring: "Monitor systems for unauthorized access"
      cc_7_2_implementation: "Real-time alerts for security violations"

  # ===== NOTES =====
  notes:
    - "Every interrupt signal requires authentication and authorization"
    - "Audit trail is immutable (HMAC protected)"
    - "7-year retention meets regulatory requirements"
    - "Rate limiting prevents interrupt flooding attacks"
    - "HMAC signature on every signal prevents tampering"
    - "Device binding adds extra layer of security"
