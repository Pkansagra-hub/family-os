# Barge-In Protocol - Finite State Machine
# Purpose: Handle user interrupts during streaming/task execution
# Research: MPST (Honda 2008), Real-Time Interruption (Shneiderman & Plaisant 2005)
# ADR Reference: ADR-0003b (6 Core Protocols), ADR-0046 (Barge-In Fast-Path Optimization)
# Performance Target: <120ms P95 from user input to agent interrupt, <500ms drain

---
protocol:
  name: "barge_in"
  version: "1.0"
  description: "Barge-In protocol for handling user interrupts during agent task execution"
  research:
    - paper: "Multiparty Session Types (Honda et al. 2008)"
      url: "https://doi.org/10.1145/1328438.1315686"
    - paper: "Real-Time Interruption (Shneiderman & Plaisant 2005)"
      url: "https://doi.org/10.1016/B978-155860816-7/50039-X"
    - paper: "Conversational Turn-Taking (Levow 2005)"
      url: "https://dl.acm.org/doi/10.1145/1059478.1059489"

  initial_state: "streaming"
  terminal_states: ["resumed", "terminated", "timeout"]

  # ===== FSM States =====
  states:
    # State 1: STREAMING
    - name: "streaming"
      type: "active"
      description: "Agent streaming response or executing task (normal operation)"
      timeout_ms: null
      llm_aware: true
      entry_action: "track_streaming_start"
      exit_action: "record_streaming_duration"
      notes: "Can be interrupted at any time by user signal"

    # State 2: INTERRUPTED
    - name: "interrupted"
      type: "transition"
      description: "Interrupt signal received, agent paused, waiting for drain"
      timeout_ms: 500          # Max time to drain in-flight operations
      llm_aware: false
      entry_action: "emit_interrupt_metric"
      exit_action: "finalize_interrupt_state"
      sub_states:
        - "signal_received"     # User signal just arrived
        - "agent_notified"      # Agent received InterruptSignal
        - "draining"            # Agent finishing tasks
        - "awaiting_decision"   # Waiting for resume/terminate decision

    # State 3: DRAINING
    - name: "draining"
      type: "transition"
      description: "Agent draining in-flight operations (finishing current turn)"
      timeout_ms: 500          # 500ms max to complete drain
      llm_aware: true
      entry_action: "start_drain_timer"
      exit_action: "complete_drain"
      monitoring:
        - "tasks_remaining"      # How many tasks still running
        - "eta_ms"              # Estimated time to finish
        - "cancellable_flags"   # Which tasks can be cancelled vs must finish

    # State 4: RESUMED
    - name: "resumed"
      type: "exit"
      description: "Agent resumed with new input after barge-in"
      timeout_ms: null
      llm_aware: true
      entry_action: "resume_execution"
      exit_action: null

    # State 5: TERMINATED
    - name: "terminated"
      type: "exit"
      description: "Agent terminated, no resumption"
      timeout_ms: null
      llm_aware: false
      entry_action: "cleanup_resources"
      exit_action: null

    # State 6: TIMEOUT
    - name: "timeout"
      type: "exit"
      description: "Drain timeout exceeded, force termination"
      timeout_ms: null
      llm_aware: false
      entry_action: "force_cleanup"
      exit_action: null

  # ===== FSM Transitions =====
  transitions:
    # T1: streaming → interrupted (user sends barge-in signal)
    - id: "T1_streaming_to_interrupted"
      from: "streaming"
      to: "interrupted"
      message: "BargeInSignal"
      sender: "user"              # Via WebSocket from client
      receivers: ["orchestrator"]
      cardinality: "1"
      condition: null
      trigger: null
      latency_budget_ms: 120      # <120ms from user click to agent interrupt
      critical_path: true
      monitoring: "track_interrupt_latency"

    # T2: interrupted → draining (agent starts draining)
    - id: "T2_interrupted_to_draining"
      from: "interrupted"
      to: "draining"
      message: "DrainInitiated"
      sender: "orchestrator"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: null
      trigger: null
      latency_budget_ms: 10       # Immediate notify agent to drain

    # T3: draining → resumed (drain complete, resuming)
    - id: "T3_draining_to_resumed"
      from: "draining"
      to: "resumed"
      message: "ResumptionApproved"
      sender: "orchestrator"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "drain_complete && new_task_ready"
      trigger: null
      latency_budget_ms: 10

    # T4: draining → terminated (drain complete, task aborted)
    - id: "T4_draining_to_terminated"
      from: "draining"
      to: "terminated"
      message: "TerminationApproved"
      sender: "orchestrator"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "drain_complete && task_aborted"
      trigger: null

    # T5: draining → timeout (drain timeout exceeded)
    - id: "T5_draining_to_timeout"
      from: "draining"
      to: "timeout"
      message: "DrainTimeout"
      sender: "system"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: null
      trigger: "timeout"          # Auto-triggered after 500ms drain
      latency_budget_ms: 500      # Total drain time <500ms

    # T6: interrupted → timeout (direct timeout if drain fails to start)
    - id: "T6_interrupted_timeout_no_drain"
      from: "interrupted"
      to: "timeout"
      message: "InterruptTimeout"
      sender: "system"
      receivers: []
      cardinality: "1"
      condition: "drain_did_not_start"
      trigger: "timeout"

    # T7: resumed → streaming (new streaming started)
    - id: "T7_resumed_to_streaming"
      from: "resumed"
      to: "streaming"
      message: "ExecutionResumed"
      sender: "ai_agent"
      receivers: ["orchestrator"]
      cardinality: "1"
      condition: null
      trigger: null
      latency_budget_ms: 10

  # ===== Timeout Policies =====
  timeouts:
    - state: "draining"
      timeout_ms: 500           # Max time to drain in-flight operations
      action: "force_termination"
      fallback_state: "timeout"
      log_level: "WARN"
      emit_metric: "barge_in_drain_timeout"
      alert_if_exceeded: true
      # Sub-timeouts for monitoring drain progress
      sub_timeouts:
        - stage: "initial_response"
          timeout_ms: 100       # Agent should acknowledge drain within 100ms
          action: "emit_slow_drain_metric"
        - stage: "operation_completion"
          timeout_ms: 400       # Remaining time for operations to complete

    - state: "interrupted"
      timeout_ms: 50            # If can't start draining within 50ms
      action: "force_termination"
      log_level: "ERROR"

  # ===== Interrupt Reasons =====
  interrupt_reasons:
    - reason: "STOP"
      description: "User stops task immediately"
      user_intent: "abort_current_task"
      agent_behavior: "terminate_immediately"
      example: "User clicks 'Stop' button during response streaming"

    - reason: "NEW_INPUT"
      description: "User provides new input, switching tasks"
      user_intent: "switch_to_different_task"
      agent_behavior: "drain_and_resume_with_new_input"
      example: "User starts typing new question while agent is still responding"

    - reason: "RECONSIDER"
      description: "User wants to reconsider before execution"
      user_intent: "pause_for_decision"
      agent_behavior: "pause_and_wait_for_confirmation"
      example: "User clicks 'Wait' before booking confirmation"

    - reason: "CLARIFICATION"
      description: "User needs to clarify something"
      user_intent: "ask_question_about_current_task"
      agent_behavior: "pause_and_handle_clarification"
      example: "User asks 'Why did you choose this restaurant?'"

  # ===== Force Modes =====
  force_modes:
    - mode: "graceful"
      description: "Drain in-flight operations, allow finishing"
      timeout_ms: 500
      cancellable: true
      default_for: ["NEW_INPUT", "RECONSIDER"]

    - mode: "immediate"
      description: "Terminate immediately, no grace period"
      timeout_ms: 10
      cancellable: false
      default_for: ["STOP"]

  # ===== Violation Handling =====
  violations:
    - type: "multiple_concurrent_interrupts"
      description: "User clicks interrupt multiple times"
      action: "coalesce"          # Treat as single interrupt
      log_level: "DEBUG"
      emit_metric: "barge_in_coalesced"

    - type: "interrupt_during_drain"
      description: "Second interrupt while already draining"
      action: "escalate_to_force_termination"
      log_level: "WARN"
      emit_metric: "barge_in_cascade_interrupt"

    - type: "invalid_interrupt_source"
      description: "Interrupt from wrong user or session"
      action: "block"
      log_level: "ERROR"
      emit_metric: "barge_in_security_violation"

    - type: "drain_deadlock"
      description: "Agent stuck draining (not progressing)"
      action: "force_kill_agent_process"
      log_level: "ERROR"
      emit_metric: "barge_in_deadlock_detected"

  # ===== Performance Characteristics =====
  performance:
    description: "Barge-In protocol performance targets"
    latency_budget:
      user_input: 5             # WebSocket parse + validation <5ms
      websocket_transport: 10   # Network latency <10ms (client to server)
      api_gateway_route: 5      # Route to orchestrator <5ms
      orchestrator_dispatch: 10 # Find agent, create interrupt <10ms
      agent_mailbox: 5          # Deliver to agent mailbox <5ms
      agent_processing: 20      # Agent receives and processes <20ms
      total_p95: 120            # <120ms P95 from user click to agent interrupt
      total_p99: 200            # <200ms P99

    throughput:
      max_concurrent_interrupts: "unlimited"
      max_per_second: 10000     # Reasonable limit per K1 instance

    resource_usage:
      memory_per_interrupt: 512 bytes
      storage_per_interrupt: 256 bytes
      cpu_per_interrupt_ms: 1

    composition_overhead:
      with_task_protocol: 5     # <5ms overhead when interrupting task
      with_tool_call_protocol: 10  # <10ms overhead when interrupting tool
      with_clarification_protocol: 5  # <5ms overhead when interrupting clarification

  # ===== State Capture for Resumption =====
  state_capture:
    on_interrupt:
      - "capture_conversation_state"  # Latest message, context
      - "capture_task_state"          # Current task progress
      - "capture_agent_state"         # Agent internal state (if needed)
      - "capture_kv_cache"            # Model KV cache snapshot (for resume optimization)

    storage: "k0_interrupt_state_snapshot"
    retention: "5_minutes_after_resume_or_termination"
    encryption: "AES-256-GCM"

    used_for:
      - "resuming_same_task_with_context"
      - "error_recovery_and_debug"
      - "undo_capability"

  # ===== Notes =====
  notes:
    - "Barge-In has highest priority, can interrupt any protocol"
    - "<120ms P95 latency is critical for good UX"
    - "Drain timeout (500ms) prevents indefinite hangs"
    - "Force mode 'immediate' for STOP reason (no grace period)"
    - "Force mode 'graceful' for NEW_INPUT/RECONSIDER (drain allowed)"
    - "State capture enables resumption or undo"
    - "Multi-interrupt coalescing prevents protocol thrashing"
    - "Security checks required to prevent unauthorized interrupts"
