tool_call_protocol_fsm:
  name: "Tool Call Protocol - FSM Definition"
  description: "5-state FSM for tool execution with approval workflow for RED band tools"
  adr_reference:
    - "ADR-0003: MPST Protocol Validation"
    - "ADR-0003b: 6 Core Protocol Implementations"
    - "ADR-0033: Three-Tier Sandbox Strategy"
    - "ADR-0010: Capability-Based Security"
  version: "1.0.0"

  # ============================================================================
  # FSM State Definitions
  # ============================================================================
  states:
    start:
      description: "Initial state before tool call initiated"
      entry_action: null
      exit_action: null

    requested:
      description: "Tool call requested by agent, awaiting validation"
      entry_action: "validate_tool_exists, check_capability_token, reserve_sandbox_resource"
      exit_action: null
      latency_budget_ms: 50

    approval_pending:
      description: "Awaiting user approval (RED band tools only)"
      entry_action: "generate_approval_request, send_to_user"
      exit_action: null
      timeout_ms: 30000  # 30 second user approval window
      timeout_action: "escalate_to_timeout"
      sub_states:
        - approval_requested_sent
        - awaiting_user_response
        - approval_decision_received

    executing:
      description: "Tool execution in progress (Process/WASM/Container sandbox)"
      entry_action: "spawn_sandbox, load_capability_token, start_monitoring"
      exit_action: "collect_result, capture_metrics, cleanup_resources"
      timeout_ms: 3000  # 3 second execution timeout (configurable per tool)
      timeout_action: "force_terminate_sandbox"
      sub_states:
        - sandbox_initialized
        - tool_running
        - monitoring_active
        - completion_pending

    completed:
      description: "Tool execution succeeded, result available"
      entry_action: "validate_result_schema, store_receipt, emit_success_metric"
      exit_action: null

    failed:
      description: "Tool execution failed or was rejected"
      entry_action: "log_error, emit_failure_metric, store_error_receipt"
      exit_action: null

  # ============================================================================
  # State Transitions with Guards and Latency Budgets
  # ============================================================================
  transitions:
    - transition_id: "T1_start_to_requested"
      from_state: "start"
      to_state: "requested"
      trigger: "ToolCallRequest received"
      guard_conditions:
        - "tool_exists_in_registry"
        - "agent_has_capability_token"
        - "sandbox_resource_available"
        - "user_privacy_band_authorized"
      latency_budget_ms: 50
      on_guard_failure: "reject_tool_call"

    - transition_id: "T2_requested_to_approval_pending"
      from_state: "requested"
      to_state: "approval_pending"
      trigger: "Tool is RED band (requires approval)"
      guard_conditions:
        - "privacy_band == RED"
        - "user_connected_to_session"
        - "approval_message_sent_successfully"
      latency_budget_ms: 100
      description: "RED band tools require explicit user approval before execution"

    - transition_id: "T3_requested_to_executing"
      from_state: "requested"
      to_state: "executing"
      trigger: "GREEN/AMBER band tool (no approval needed)"
      guard_conditions:
        - "privacy_band in [GREEN, AMBER]"
        - "sandbox_ready_to_start"
        - "capability_token_valid"
      latency_budget_ms: 50
      description: "GREEN/AMBER tools proceed directly to execution"

    - transition_id: "T4_approval_pending_to_executing"
      from_state: "approval_pending"
      to_state: "executing"
      trigger: "User approved tool execution"
      guard_conditions:
        - "approval_response_received"
        - "approval_response == APPROVED"
        - "user_signature_valid"
        - "approval_not_expired"
      latency_budget_ms: 100
      description: "User-approved tool proceeds to sandbox execution"

    - transition_id: "T5_approval_pending_to_failed"
      from_state: "approval_pending"
      to_state: "failed"
      trigger: "User rejected tool OR approval timeout"
      guard_conditions:
        - "approval_response == REJECTED OR elapsed_time > timeout_ms"
      latency_budget_ms: 50
      error_code: "APPROVAL_DENIED"
      description: "User rejection or approval timeout (30s) -> tool call fails"

    - transition_id: "T6_executing_to_completed"
      from_state: "executing"
      to_state: "completed"
      trigger: "Tool execution succeeded"
      guard_conditions:
        - "tool_exit_code == 0"
        - "result_schema_valid"
        - "result_size < max_size_bytes"
      latency_budget_ms: 50
      description: "Tool completed successfully with valid result"

    - transition_id: "T7_executing_to_failed"
      from_state: "executing"
      to_state: "failed"
      trigger: "Tool execution failed"
      guard_conditions:
        - "tool_exit_code != 0 OR tool_crashed OR timeout_exceeded"
      latency_budget_ms: 50
      error_code: "EXECUTION_FAILED"
      description: "Tool crashed, timed out, or returned non-zero exit code"

  # ============================================================================
  # Priority Levels for Tool Calls
  # ============================================================================
  priority_levels:
    CRITICAL:
      description: "Critical tool call (security/safety/booking), no fallback allowed"
      timeout_ms: 10000  # 10s for critical operations
      retry_strategy: "exponential_backoff"
      max_retries: 3
      user_approval_required: true  # RED band only
      approval_timeout_ms: 60000  # 1 minute for critical

    HIGH:
      description: "Important tool call (scheduling/information retrieval)"
      timeout_ms: 5000  # 5s default
      retry_strategy: "exponential_backoff"
      max_retries: 2
      user_approval_required: true  # RED band only
      approval_timeout_ms: 30000  # 30 seconds

    NORMAL:
      description: "Standard tool call (weather, news, etc.)"
      timeout_ms: 3000  # 3s default
      retry_strategy: "exponential_backoff"
      max_retries: 1
      user_approval_required: false  # GREEN/AMBER only
      approval_timeout_ms: null

  # ============================================================================
  # Timeout Policies with Sub-timeouts
  # ============================================================================
  timeout_policies:
    approval_timeout:
      stage: "approval_pending"
      timeout_ms: 30000
      default_timeout_ms: 30000
      min_ms: 5000
      max_ms: 120000
      configurable_per_tool: true
      on_timeout: "escalate_to_timeout"
      user_notification: "Approval request expired, tool call cancelled"

    execution_timeout:
      stage: "executing"
      timeout_ms: 3000
      default_timeout_ms: 3000
      min_ms: 500
      max_ms: 30000
      configurable_per_tool: true
      tool_specific_overrides:
        video_transcoder: 300000  # 5 minutes
        image_generation: 60000   # 1 minute
        weather_api: 5000         # 5 seconds
        calculator: 1000          # 1 second
      on_timeout: "force_terminate_sandbox"
      signal_sequence:
        - signal: "SIGTERM"
          wait_ms: 500
          description: "Graceful termination request"
        - signal: "SIGKILL"
          wait_ms: 0
          description: "Force kill after 500ms grace period"

    sub_timeout_monitoring:
      - name: "sandbox_setup_timeout"
        timeout_ms: 1000
        description: "Process/WASM/Container spawn timeout"
        on_timeout: "cleanup_resources, retry_or_fail"

      - name: "first_output_timeout"
        timeout_ms: 2000
        description: "Timeout if tool doesn't produce output in 2s"
        on_timeout: "interrupt_tool, return_partial_result_or_fail"

      - name: "result_retrieval_timeout"
        timeout_ms: 500
        description: "Timeout for result parsing from tool output"
        on_timeout: "cleanup, treat_as_execution_failure"

  # ============================================================================
  # User Approval Workflow (RED Band Tools)
  # ============================================================================
  user_approval_workflow:
    trigger_condition: "privacy_band == RED"
    approval_message_format: "ClarificationRequest (nested protocol)"
    approval_ui_rendering: "modal_dialog"
    required_user_info:
      - tool_name
      - action_description
      - estimated_cost_usd
      - privacy_implications
      - abort_option
    user_response_options:
      - choice: "APPROVED"
        action: "proceed_to_executing"
        retention_ms: null
      - choice: "REJECTED"
        action: "transition_to_failed"
        retention_ms: null
      - choice: "APPROVE_ONCE"
        action: "proceed_to_executing"
        retention_ms: null
      - choice: "APPROVE_ALWAYS"
        action: "proceed_to_executing, cache_approval_token"
        retention_ms: 3600000  # 1 hour
    approval_signature: "HMAC-SHA256 with user session key"
    user_notification_channels:
      - channel: "WebSocket"
        delivery_latency_ms: 50
      - channel: "Browser notification"
        delivery_latency_ms: 500

  # ============================================================================
  # Violation Handling
  # ============================================================================
  violation_handling:
    unexpected_state_transition:
      description: "Transition triggered from invalid state"
      action: "log_violation, emit_metric, reject_tool_call"
      severity: "HIGH"

    capability_token_invalid:
      description: "Agent lacks EXECUTE_TOOL capability"
      action: "block_tool_call, alert_security"
      severity: "CRITICAL"

    tool_not_found:
      description: "Tool not in registry or disabled"
      action: "return_error, suggest_alternatives"
      severity: "MEDIUM"

    sandbox_unavailable:
      description: "No sandbox resources available (Process/WASM/Container pool exhausted)"
      action: "queue_tool_call, retry_later"
      severity: "MEDIUM"

    execution_timeout:
      description: "Tool didn't complete within timeout"
      action: "force_terminate_sandbox, log_timeout, emit_metric"
      severity: "MEDIUM"

    approval_timeout:
      description: "User didn't approve RED band tool within 30s"
      action: "cancel_tool_call, log_timeout"
      severity: "LOW"

    user_rejected_approval:
      description: "User explicitly rejected RED band tool"
      action: "cancel_tool_call, log_rejection"
      severity: "INFO"

    security_violation:
      description: "Tool attempted unauthorized network/filesystem access (caught by sandbox)"
      action: "terminate_sandbox, log_violation, alert_security, block_tool"
      severity: "CRITICAL"

    resource_exhaustion:
      description: "Tool exceeded memory/CPU limits (cgroups or WASM limits)"
      action: "terminate_sandbox, return_error"
      severity: "MEDIUM"

  # ============================================================================
  # Performance Budgets (Per Component)
  # ============================================================================
  performance_budgets:
    total_latency_p95_ms: 5000  # Total tool call latency P95 (excluding user approval time)

    component_budgets:
      request_validation:
        target_ms: 50
        p95_ms: 100

      capability_token_check:
        target_ms: 10
        p95_ms: 50

      sandbox_allocation:
        target_ms: 100
        p95_ms: 500

      tool_execution:
        target_ms: 2000
        p95_ms: 3000

      result_parsing:
        target_ms: 100
        p95_ms: 200

      approval_workflow_user_time:
        target_ms: null  # User-controlled, not measured
        p95_ms: null

      approval_delivery_latency:
        target_ms: 50
        p95_ms: 200

  # ============================================================================
  # Composition Rules (How Tool Call Fits in Other Protocols)
  # ============================================================================
  composition_rules:
    - protocol_name: "Task Execution"
      description: "Tool call nested within task execution"
      nesting_point: "EXECUTING state of task"
      tool_call_isolation: "child protocol (separate state machine)"
      timeout_inheritance: "Tool timeout must fit within task timeout"
      max_nested_tool_calls: 3

    - protocol_name: "Planning Pipeline"
      description: "Planning stage may call tools for information gathering"
      nesting_point: "EXPAND stage"
      tool_call_isolation: "child protocol (separate state machine)"
      timeout_per_tool: "100ms (tight budget for planning)"
      max_nested_tool_calls: 5

    - protocol_name: "Barge-In"
      description: "User can interrupt tool execution with barge-in signal"
      interruption_point: "EXECUTING state"
      interrupt_behavior: "force_terminate_sandbox, signal user, handle cleanup"
      grace_period_ms: 0  # Immediate termination on interrupt

  # ============================================================================
  # Observability Hooks (Instrumentation Points)
  # ============================================================================
  observability_hooks:
    state_transitions:
      - hook: "on_enter_requested"
        metrics: ["tool_call_received_total"]
        spans: ["tool_call_request_received"]

      - hook: "on_enter_approval_pending"
        metrics: ["tool_call_approval_required_total"]
        spans: ["user_approval_requested"]

      - hook: "on_enter_executing"
        metrics: ["tool_call_execution_started_total", "sandbox_allocated"]
        spans: ["tool_execution_started"]

      - hook: "on_enter_completed"
        metrics: ["tool_call_succeeded_total", "tool_execution_latency_ms"]
        spans: ["tool_execution_completed"]

      - hook: "on_enter_failed"
        metrics: ["tool_call_failed_total[reason]"]
        spans: ["tool_execution_failed"]

    timeout_events:
      - event: "approval_timeout"
        metrics: ["tool_call_approval_timeout_total"]
        alert: "Tool approval expired (user inactive)"

      - event: "execution_timeout"
        metrics: ["tool_call_execution_timeout_total"]
        alert: "Tool execution exceeded timeout"

    violation_events:
      - event: "capability_token_invalid"
        metrics: ["tool_call_security_violation_total[type=capability]"]
        alert: "CRITICAL: Tool call with invalid capability"

      - event: "sandbox_security_violation"
        metrics: ["tool_call_security_violation_total[type=sandbox]"]
        alert: "CRITICAL: Tool attempted unauthorized resource access"

---
# ============================================================================
# FSM Visualization (for documentation)
# ============================================================================

# START
#   |
#   | ToolCallRequest
#   v
# REQUESTED (validate tool, check capability)
#   |
#   +--[GREEN/AMBER]---> EXECUTING
#   |
#   +--[RED]--> APPROVAL_PENDING
#                 |
#                 +--[APPROVED]--> EXECUTING
#                 |
#                 +--[REJECTED/TIMEOUT]--> FAILED
#
# EXECUTING
#   |
#   +--[SUCCESS]--> COMPLETED
#   |
#   +--[FAILURE/TIMEOUT]--> FAILED
#
# COMPLETED / FAILED (terminal states)
