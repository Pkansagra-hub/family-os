# Clarification Protocol - Finite State Machine
# Purpose: Handle clarification requests during task execution or planning
# Research: MPST (Honda 2008), Conversation Management (Traum & Larsson 2000)
# ADR Reference: ADR-0003b (6 Core Protocol Implementations), ADR-0003 (MPST Protocol Validation)
# Performance Target: <60s response time (default), P95: <500ms round-trip latency
# Latency Budget: Clarification request: <50ms, Response handling: <50ms

---
protocol:
  name: "clarification"
  version: "1.0"
  description: "Clarification protocol for resolving ambiguities during task execution"
  research:
    - paper: "Multiparty Session Types (Honda et al. 2008)"
      url: "https://doi.org/10.1145/1328438.1315686"
    - paper: "Conversation Management (Traum & Larsson 2000)"
      url: "https://doi.org/10.1145/1073001.1073046"

  initial_state: "start"
  terminal_states: ["resolved", "timeout", "cancelled", "fallback"]

  # ===== FSM States =====
  states:
    # State 1: Protocol Entry
    - name: "start"
      type: "entry"
      description: "Clarification protocol initiated"
      timeout_ms: null
      llm_aware: false
      entry_action: "create_clarification_context"
      exit_action: null

    # State 2: Request Sent
    - name: "request_sent"
      type: "interaction"
      description: "Clarification request sent to user via WebSocket"
      timeout_ms: 500          # Time to send request over WebSocket
      llm_aware: false
      entry_action: "emit_clarification_request_metric"
      exit_action: null

    # State 3: Waiting for Response
    - name: "waiting_response"
      type: "interaction"
      description: "Waiting for user clarification response (default 60s, configurable per agent)"
      timeout_ms: 60000         # 60s default timeout, can be overridden by priority + deadline
      llm_aware: false
      entry_action: "start_response_timer"
      exit_action: "stop_response_timer"
      # Sub-states for monitoring
      sub_states:
        - "awaiting_first_byte"   # 0-1s: no response yet
        - "response_received"      # User started typing/selecting
        - "response_finalized"     # User confirmed response

    # State 4: Resolved (Terminal)
    - name: "resolved"
      type: "exit"
      description: "User provided clarification, resuming original task"
      timeout_ms: null
      llm_aware: false
      entry_action: "store_clarification_response"
      exit_action: "resume_parent_protocol"

    # State 5: Timeout (Terminal)
    - name: "timeout"
      type: "exit"
      description: "No response received within timeout"
      timeout_ms: null
      llm_aware: false
      entry_action: "apply_fallback_strategy"
      exit_action: null

    # State 6: Cancelled (Terminal)
    - name: "cancelled"
      type: "exit"
      description: "Clarification cancelled by user or barge-in interrupt"
      timeout_ms: null
      llm_aware: false
      entry_action: "cleanup_clarification_state"
      exit_action: null

    # State 7: Fallback (Terminal)
    - name: "fallback"
      type: "exit"
      description: "Applied fallback answer (only for OPTIONAL priority)"
      timeout_ms: null
      llm_aware: false
      entry_action: "use_fallback_answer"
      exit_action: "resume_parent_protocol"

  # ===== FSM Transitions =====
  transitions:
    # T1: start → request_sent
    - id: "T1_start_to_request_sent"
      from: "start"
      to: "request_sent"
      message: "ClarificationRequest"
      sender: "ai_agent"          # Planner, Researcher, etc.
      receivers: ["api_gateway"]
      cardinality: "1"
      condition: null
      trigger: null
      latency_budget_ms: 10       # Send request <10ms

    # T2: request_sent → waiting_response
    - id: "T2_request_sent_to_waiting"
      from: "request_sent"
      to: "waiting_response"
      message: "ClarificationRequestAcknowledged"
      sender: "api_gateway"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "websocket_connected"
      trigger: null
      latency_budget_ms: 40       # WebSocket delivery + ACK <40ms

    # T3: waiting_response → resolved (user provided answer)
    - id: "T3_waiting_to_resolved"
      from: "waiting_response"
      to: "resolved"
      message: "ClarificationResponse"
      sender: "user"              # Via WebSocket from browser/client
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "response_valid"  # Guard: response syntax/format valid
      trigger: null
      latency_budget_ms: 50       # Response handling <50ms

    # T4: waiting_response → timeout (no response within deadline)
    - id: "T4_waiting_to_timeout"
      from: "waiting_response"
      to: "timeout"
      message: "ClarificationTimeout"
      sender: "system"
      receivers: []
      cardinality: "1"
      condition: "priority == OPTIONAL"  # Guard: only timeout OPTIONAL clarifications
      trigger: "timeout"          # Auto-triggered after timeout_ms
      latency_budget_ms: 5        # Timeout detection <5ms

    # T5: waiting_response → fallback (timeout, OPTIONAL priority, has fallback)
    - id: "T5_waiting_to_fallback"
      from: "waiting_response"
      to: "fallback"
      message: "FallbackAnswer"
      sender: "system"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "priority == OPTIONAL && has_fallback_answer"
      trigger: "timeout"

    # T6: waiting_response → timeout (no fallback available)
    - id: "T6_waiting_timeout_no_fallback"
      from: "waiting_response"
      to: "timeout"
      message: "ClarificationTimeout"
      sender: "system"
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: "priority == BLOCKING || !has_fallback_answer"
      trigger: "timeout"

    # T7: waiting_response → cancelled (barge-in interrupt)
    - id: "T7_waiting_to_cancelled"
      from: "waiting_response"
      to: "cancelled"
      message: "BargeInSignal"   # Interrupt from parent protocol
      sender: "user"             # Via barge-in mechanism
      receivers: ["ai_agent"]
      cardinality: "1"
      condition: null
      trigger: null
      latency_budget_ms: 120     # Barge-in latency <120ms (see ADR-0046)

  # ===== Timeout Policies =====
  timeouts:
    # Timeout from waiting_response to fallback/timeout
    - state: "waiting_response"
      timeout_ms: 60000         # Default 60s, can be overridden per agent config
      action: "apply_timeout_strategy"
      fallback_state: "timeout"
      fallback_state_optional: "fallback"  # If priority=OPTIONAL and fallback available
      log_level: "INFO"
      emit_metric: "clarification_timeout_total"
      # Sub-timeouts for monitoring response stages
      sub_timeouts:
        - stage: "awaiting_first_byte"
          timeout_ms: 5000      # If no typing indicator after 5s, consider user away
          action: "emit_no_activity_metric"
        - stage: "response_received"
          timeout_ms: 10000     # If started but didn't confirm, consider stuck
          action: "emit_partial_response_metric"

    - state: "request_sent"
      timeout_ms: 500           # WebSocket delivery timeout
      action: "retry_websocket_send"
      retry_count: 3
      retry_backoff_ms: 100
      fallback_state: "timeout"
      log_level: "WARN"

  # ===== Priority Levels =====
  priority_levels:
    # BLOCKING: Must get clarification, no fallback
    - priority: "BLOCKING"
      description: "Clarification is critical, block task until answered"
      timeout_ms: 60000
      allow_fallback: false
      user_ux: "modal_dialog"    # Show modal, prevent dismissal
      example: "Which restaurant did you mean: Alice's Bistro or Alice's Cafe?"

    # OPTIONAL: Can use default/fallback if timeout
    - priority: "OPTIONAL"
      description: "Clarification helpful but not required, use default if timeout"
      timeout_ms: 30000
      allow_fallback: true
      user_ux: "toast_notification"  # Show toast, auto-dismiss after delay
      example: "Should I book for 2 or 4 people? (Using 2 as default)"

    # LOW: Best-effort, don't block if timeout
    - priority: "LOW"
      description: "Clarification is informational only"
      timeout_ms: 10000
      allow_fallback: true
      user_ux: "background_notification"
      example: "Which cuisine preference: Italian or Mexican? (Background suggestion)"

  # ===== Fallback Strategies =====
  fallback_strategies:
    - priority: "OPTIONAL"
      strategy: "use_default_answer"
      description: "Use predefined default answer provided by agent"
      log_level: "INFO"

    - priority: "BLOCKING"
      strategy: "abort_task"
      description: "Cannot proceed without clarification, abort task"
      log_level: "WARN"
      cleanup_action: "restore_previous_state"

    - priority: "OPTIONAL"
      strategy: "progressive_refinement"
      description: "Continue with default, allow user to refine later"
      log_level: "DEBUG"

  # ===== Violation Handling =====
  violations:
    - type: "unexpected_message"
      description: "Received invalid message type in waiting_response state"
      action: "block"
      log_level: "WARN"
      emit_metric: "clarification_violation_unexpected_message"

    - type: "response_format_invalid"
      description: "Response doesn't match expected format (schema validation failed)"
      action: "block_and_request_retry"
      log_level: "WARN"
      max_retries: 3
      emit_metric: "clarification_violation_format_invalid"

    - type: "timeout"
      description: "Response not received within deadline"
      action: "apply_timeout_strategy"
      log_level: "INFO"
      emit_metric: "clarification_timeout_total"

    - type: "deadlock"
      description: "Clarification is itself asking for clarification (nested cycle)"
      action: "abort"
      log_level: "ERROR"
      emit_metric: "clarification_deadlock_detected"

    - type: "security_violation"
      description: "Response contains violation of privacy band or security policy"
      action: "block"
      log_level: "CRITICAL"
      emit_metric: "clarification_security_violation"

  # ===== Performance Characteristics =====
  performance:
    description: "Clarification protocol performance targets"
    latency_budget:
      request_generation: 30    # Agent generates clarification request <30ms
      websocket_delivery: 40    # Send request to user <40ms
      user_response_capture: 50 # Capture response <50ms (mostly network)
      response_processing: 50   # Process response back to agent <50ms
      total_roundtrip_p95: 500   # Total roundtrip (excluding user think time)
    throughput:
      max_concurrent_clarifications_per_session: 1  # Only 1 active clarification per session
      max_total_per_minute: 100                     # Reasonable limit to prevent spam
    resource_usage:
      memory_per_clarification_bytes: 4096  # Clarification context in memory
      storage_per_clarification_bytes: 2048 # Audit trail storage
    composition_overhead:
      with_task_protocol: 0          # No overhead (clarification is subprocess)
      with_barge_in_protocol: 10     # <10ms overhead when interrupted by barge-in

  # ===== Notes =====
  notes:
    - "Clarification always nests inside another protocol (task, planning, etc.)"
    - "Priority defaults to BLOCKING for safety-critical decisions"
    - "Timeout_ms can be overridden per agent in agent config"
    - "Barge-in has priority over clarification (can interrupt waiting_response)"
    - "User think time not included in latency budgets (user is outside the system)"
    - "Fallback strategy is mandatory for OPTIONAL priority"
