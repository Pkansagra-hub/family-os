# Clarification Protocol - WebSocket Delivery Contract
# File: contracts/protocols/clarification/05_websocket_delivery_contract.yml
# Purpose: WebSocket message delivery for clarification requests/responses
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-WEBSOCKET-005"
  name: "Clarification WebSocket Delivery Contract"
  version: "1.0"

# WebSocket Overview
websocket_delivery:
  purpose: "Deliver clarification requests to user, receive responses via WebSocket"
  components:
    - "WebSocket Gateway (Layer 4 - Ingress)"
    - "Orchestrator (Layer 1 - Kernel)"
    - "Client (Web/Mobile app)"
  transport: "WebSocket (bidirectional, persistent connection)"

# WebSocket Message Types
websocket_message_types:

  CLARIFICATION_REQUEST:
    direction: "Server → Client"
    purpose: "Deliver clarification question to user"
    schema: |
      {
        "type": "CLARIFICATION_REQUEST",
        "task_id": "task-xxx",
        "clarification_id": "clarif-aaa",
        "question": "Which restaurant did you mean?",
        "question_type": "MULTIPLE_CHOICE",
        "options": ["Acme Pizza", "Best Pizza"],
        "context": "Both restaurants have similar names.",
        "priority": "BLOCKING",
        "default_answer": null,
        "timeout_ms": 30000
      }

  CLARIFICATION_RESPONSE:
    direction: "Client → Server"
    purpose: "User submits clarification answer"
    schema: |
      {
        "type": "CLARIFICATION_RESPONSE",
        "task_id": "task-xxx",
        "clarification_id": "clarif-aaa",
        "answer": "Acme Pizza",
        "answer_type": "SELECTED_OPTION"
      }

  CLARIFICATION_CANCELLED:
    direction: "Client → Server"
    purpose: "User cancels clarification"
    schema: |
      {
        "type": "CLARIFICATION_CANCELLED",
        "task_id": "task-xxx",
        "clarification_id": "clarif-aaa",
        "reason": "USER_CANCELLED"
      }

  CLARIFICATION_TIMEOUT:
    direction: "Server → Client"
    purpose: "Notify client that clarification timed out"
    schema: |
      {
        "type": "CLARIFICATION_TIMEOUT",
        "task_id": "task-xxx",
        "clarification_id": "clarif-aaa",
        "strategy": "ABORT_TASK",
        "message": "Clarification timed out. Task aborted."
      }

# WebSocket Gateway Handling
websocket_gateway:

  request_delivery:
    step_1_receive_from_orchestrator:
      action: "WebSocket Gateway receives ClarificationRequest from Orchestrator"
      routing: "Orchestrator → WebSocket Gateway (via Actor message)"

    step_2_lookup_session:
      action: "Lookup active WebSocket session for task's user"
      session_tracking: "task_id → user_id → websocket_session_id"
      failure: "If session not found: send CLARIFICATION_ABORT to Orchestrator"

    step_3_send_to_client:
      action: "Send CLARIFICATION_REQUEST message to client via WebSocket"
      encoding: "JSON (newline-delimited)"
      performance: "<50ms (Gateway → Client delivery)"

    step_4_confirm_delivery:
      action: "WebSocket Gateway confirms delivery to Orchestrator"
      mechanism: "Actor message: CLARIFICATION_DELIVERED"

  response_receipt:
    step_1_receive_from_client:
      action: "WebSocket Gateway receives CLARIFICATION_RESPONSE from client"
      validation: "Verify task_id, clarification_id"

    step_2_route_to_orchestrator:
      action: "Forward ClarificationResponse to Orchestrator"
      routing: "WebSocket Gateway → Orchestrator (via Actor message)"
      performance: "<50ms (Client → Gateway → Orchestrator)"

    step_3_orchestrator_routes_to_planner:
      action: "Orchestrator forwards to Planner Agent"
      routing: "Orchestrator → Planner Agent mailbox"

# Client UI Presentation
client_ui:

  ui_components:
    question_display:
      element: "Header text (bold, large font)"
      content: "ClarificationRequest.question"
      example: "Which restaurant did you mean?"

    context_display:
      element: "Subtext (smaller, gray font)"
      content: "ClarificationRequest.context (if provided)"
      example: "Both restaurants have similar names and are within 5 miles."

    input_widget:
      MULTIPLE_CHOICE: "Radio buttons or dropdown menu"
      TEXT: "Text input field (with placeholder default_answer)"
      YES_NO: "Yes/No toggle buttons"
      CONFIRMATION: "Confirm/Cancel buttons (highlight risk if RED band)"

    timeout_countdown:
      element: "Progress bar or countdown timer"
      content: "Remaining time: {timeout_ms - elapsed_ms} / {timeout_ms}"
      warning: "Show warning at 5s remaining (yellow)"
      critical: "Show critical warning at 1s remaining (red)"

    action_buttons:
      submit_button: "Enabled when answer provided"
      cancel_button: "Always enabled (sends CLARIFICATION_CANCELLED)"

  ui_behavior:
    on_user_types:
      action: "Enable Submit button when answer valid"
      validation: |
        MULTIPLE_CHOICE: Option selected
        TEXT: Text field not empty (or optional)
        YES_NO: Yes or No selected

    on_submit:
      action: "Send CLARIFICATION_RESPONSE via WebSocket"
      disable_ui: "Disable Submit button, show 'Sending...' spinner"

    on_timeout:
      action: "Disable UI, show timeout message"
      message:
        optional: "Time's up! I'll proceed with default answer."
        blocking: "Time's up! I need this info to continue. Please try again."

    on_cancel:
      action: "Send CLARIFICATION_CANCELLED, close clarification UI"

# WebSocket Connection Management
connection_management:

  connection_states:
    CONNECTED:
      description: "WebSocket connected, ready to deliver messages"
      behavior: "Normal message delivery"

    DISCONNECTED:
      description: "WebSocket disconnected (network issue, user closed tab)"
      behavior: "Queue messages, attempt reconnect"

    RECONNECTING:
      description: "WebSocket reconnecting after disconnect"
      behavior: "Hold messages until reconnect succeeds"

    TERMINATED:
      description: "Session terminated (user logged out)"
      behavior: "Discard messages, abort clarifications"

  reconnection_handling:
    trigger: "WebSocket disconnect detected"
    strategy: "Exponential backoff reconnection"
    retry_policy: |
      Attempt 1: 1s delay
      Attempt 2: 2s delay
      Attempt 3: 4s delay
      Max attempts: 5
      Total max reconnect time: 31s

    clarification_behavior: |
      If clarification pending during disconnect:
        - Hold ClarificationRequest in queue
        - On reconnect: re-send ClarificationRequest
        - Reset timeout timer (give user fresh timeout window)

      If disconnect persists > 30s:
        - Send CLARIFICATION_ABORT to Orchestrator
        - Orchestrator executes timeout strategy

# Performance Metrics
performance:

  delivery_latency:
    orchestrator_to_gateway: "<10ms (Actor message routing)"
    gateway_to_client: "<50ms (WebSocket send)"
    total_request_delivery: "<60ms (Orchestrator → Client)"

  response_latency:
    client_to_gateway: "<50ms (WebSocket receive)"
    gateway_to_orchestrator: "<10ms (Actor message routing)"
    orchestrator_to_planner: "<10ms (Actor message routing)"
    total_response_latency: "<70ms (Client → Planner)"

  websocket_overhead:
    message_size: "300-500 bytes (JSON)"
    serialization: "<1ms (JSON encoding/decoding)"
    network_latency: "10-50ms (typical internet latency)"

# Observability
observability:

  metrics:
    - name: "websocket_clarification_request_sent_total"
      type: "counter"
      description: "Clarification requests sent to clients"

    - name: "websocket_clarification_response_received_total"
      type: "counter"
      description: "Clarification responses received from clients"

    - name: "websocket_clarification_delivery_latency_ms"
      type: "histogram"
      buckets: [10, 25, 50, 100, 200]
      description: "WebSocket delivery latency"

    - name: "websocket_clarification_session_disconnected_total"
      type: "counter"
      description: "Clarifications aborted due to WebSocket disconnect"

  events:
    - name: "websocket_clarification_request_sent"
      fields: ["task_id", "clarification_id", "session_id", "trace_id"]

    - name: "websocket_clarification_response_received"
      fields: ["task_id", "clarification_id", "session_id", "answer_type", "trace_id"]

    - name: "websocket_clarification_session_disconnected"
      fields: ["task_id", "clarification_id", "session_id", "trace_id"]

# Error Scenarios
error_scenarios:

  scenario_1_websocket_disconnect:
    condition: "User's WebSocket disconnects during clarification"
    detection: "WebSocket Gateway detects disconnect event"
    handling: |
      - Attempt reconnection (max 30s)
      - If reconnect succeeds: re-send ClarificationRequest
      - If reconnect fails: send CLARIFICATION_ABORT to Orchestrator
      - Orchestrator executes timeout strategy

  scenario_2_message_delivery_failure:
    condition: "WebSocket send fails (buffer full, network error)"
    detection: "WebSocket.send() throws exception"
    handling: |
      - Retry send (max 3 attempts, 1s backoff)
      - If all retries fail: send CLARIFICATION_ABORT
      - Log delivery failure event

  scenario_3_malformed_client_message:
    condition: "Client sends invalid JSON or missing required fields"
    detection: "JSON parse error or schema validation failure"
    handling: |
      - Log malformed message warning
      - Send error response to client: CLARIFICATION_ERROR
      - Client should re-send valid message
      - Max 2 retry attempts, then abort

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "REQUESTED → WAITING_RESPONSE (delivery), WAITING_RESPONSE → RESOLVED (response)"

  related_contracts:
    - "01_clarification_protocol_fsm.yml - FSM states"
    - "02_clarification_request_contract.yml - Request schema"
    - "03_clarification_response_contract.yml - Response schema"

# ==============================================================================
