# Clarification Protocol - Priority Levels Contract
# File: contracts/protocols/clarification/06_priority_levels_contract.yml
# Purpose: Define clarification priority levels and behavior
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-PRIORITY-006"
  name: "Clarification Priority Levels Contract"
  version: "1.0"

# Priority Overview
priority_levels:
  purpose: "Define urgency and fallback behavior for clarifications"
  two_levels: ["BLOCKING", "OPTIONAL"]
  key_distinction: "Can task proceed without user answer?"

# BLOCKING Priority
BLOCKING_priority:

  definition:
    value: "BLOCKING"
    meaning: "Task CANNOT proceed without user answer"
    timeout: 30000  # 30 seconds
    strategy_on_timeout: "ABORT_TASK"

  behavior:
    wait_for_user: "Planner suspends execution, waits for user response"
    on_response: "Resume planning with user's answer"
    on_timeout: "Abort task, send TaskFailure (error_code: CLARIFICATION_TIMEOUT)"
    user_message_on_timeout: |
      "I need this information to continue: {question}
       Please provide an answer and try again."

  use_cases:
    disambiguation:
      scenario: "Multiple matching entities (2+ restaurants, contacts, locations)"
      example_questions:
        - "Which 'John Smith' did you mean? I found 3 contacts."
        - "Which restaurant: Acme Pizza (SF) or Acme Pizza (Oakland)?"
        - "Which meeting: 'Team Sync' at 10 AM or 2 PM?"
      rationale: "Cannot proceed without knowing which specific entity user intended"

    missing_required_info:
      scenario: "Required information not provided by user"
      example_questions:
        - "What payment method should I use for the booking?"
        - "What's the recipient's email address?"
        - "What date did you want the reservation?"
      rationale: "Cannot complete action without required data"

    safety_confirmation:
      scenario: "RED band action requires explicit user approval"
      example_questions:
        - "Do you want me to send this email to external recipient? (RED band)"
        - "Should I proceed with this $500 booking?"
        - "Confirm: Delete this important file?"
      rationale: "High-risk action, must have user confirmation for safety/compliance"

    conflicting_constraints:
      scenario: "User's constraints cannot all be satisfied"
      example_questions:
        - "Cheapest option ($50) is slow (3 days). Fastest option (1 day) is expensive ($200). Which do you prefer?"
        - "No restaurants match all criteria (Italian, <$20, 5-star). Should I relax budget or rating?"
      rationale: "User must make trade-off decision"

  timeout_behavior:
    timeout_duration: 30000  # 30s (covers P99 user response time ~20s)
    on_timeout: |
      - FSM transitions WAITING_RESPONSE → TIMEOUT
      - Planner aborts task execution
      - Send TaskFailure:
          error_code: "CLARIFICATION_TIMEOUT"
          error_message: "User did not provide required clarification within 30 seconds"
          retry_after_ms: 0
      - Inform user: "I need this info to continue. Please try again with the answer."

    no_default_answer: "default_answer = null (BLOCKING requires user input)"

  observability:
    - "Log: clarification_requested (priority=BLOCKING, timeout=30000)"
    - "Metric: clarification_blocking_total +1"
    - "If timeout: clarification_timeout_blocking_total +1, task_aborted_total +1"

# OPTIONAL Priority
OPTIONAL_priority:

  definition:
    value: "OPTIONAL"
    meaning: "Task CAN proceed with default answer if user doesn't respond"
    timeout: 15000  # 15 seconds (shorter since non-critical)
    strategy_on_timeout: "USE_DEFAULT"

  behavior:
    wait_for_user: "Planner suspends execution, waits for user response (up to 15s)"
    on_response: "Resume planning with user's answer (preferred)"
    on_timeout: "Use default_answer, continue task execution"
    user_message_on_timeout: |
      "I didn't hear back about: {question}
       I'll assume [{default_answer}]. Let me know if you want to change it."

  use_cases:
    preference_questions:
      scenario: "User preference, but has reasonable default"
      example_questions:
        - "What time should I book? (default: earliest available)"
        - "How many people? (default: 2)"
        - "What format: JSON or CSV? (default: JSON)"
      rationale: "Can proceed with safe default, user preference enhances but not required"

    formatting_options:
      scenario: "Output formatting preference"
      example_questions:
        - "Should I include details in summary? (default: yes)"
        - "What tone: formal or casual? (default: formal)"
        - "Should I CC anyone? (default: no)"
      rationale: "Formatting choice, default is acceptable"

    optional_details:
      scenario: "Non-critical additional information"
      example_questions:
        - "Any special notes for the reservation? (default: none)"
        - "What subject line? (default: auto-generated)"
        - "Any dietary restrictions? (default: none)"
      rationale: "Optional field, can skip if user doesn't provide"

    optimization_preferences:
      scenario: "Trade-off between competing factors"
      example_questions:
        - "Prioritize cost or speed? (default: balanced)"
        - "Maximize quality or minimize price? (default: balanced)"
      rationale: "Can use balanced default, user preference refines"

  timeout_behavior:
    timeout_duration: 15000  # 15s (covers P95 user response time ~10s)
    on_timeout: |
      - FSM transitions WAITING_RESPONSE → TIMEOUT
      - Planner uses default_answer from ClarificationRequest
      - Log: "Assumed default: {default_answer} (user did not respond)"
      - Continue task execution with default
      - Inform user: "I assumed [{default_answer}]. Let me know if you want to change it."

    default_answer_required: "default_answer must be provided in ClarificationRequest"

    default_selection_logic: |
      if default_answer provided:
        use default_answer
      elif question_type == MULTIPLE_CHOICE:
        use options[0]  # First option (most common/safe)
      elif question_type == YES_NO:
        use "No"  # Conservative default (don't take risky action)
      elif question_type == TEXT:
        use null  # Skip optional field

  observability:
    - "Log: clarification_requested (priority=OPTIONAL, timeout=15000, default={default_answer})"
    - "Metric: clarification_optional_total +1"
    - "If timeout: clarification_timeout_optional_total +1, clarification_default_used_total +1"

# Priority Selection Guidelines
priority_selection_guidelines:

  choose_BLOCKING_if:
    criteria:
      - "Task cannot proceed without answer (ambiguity, missing required info)"
      - "Safety/privacy confirmation required (RED band, high-risk action)"
      - "Multiple valid options with significantly different outcomes"
      - "Regulatory/compliance requirement (human approval needed)"

    risk_assessment: "High risk of incorrect outcome if proceed without user input"

  choose_OPTIONAL_if:
    criteria:
      - "Task CAN proceed with reasonable default"
      - "User preference question (style, format, optimization)"
      - "Optional detail that enhances but not required"
      - "Default answer is safe, conservative choice"

    risk_assessment: "Low risk if proceed with default (user can adjust later)"

  examples_comparison:
    scenario_1:
      question: "Which credit card should I use?"
      priority: "BLOCKING (required for payment, cannot guess)"

    scenario_2:
      question: "What payment method? (default: primary credit card)"
      priority: "OPTIONAL (has default, user can use primary card)"

    scenario_3:
      question: "Send this email to external recipient? (RED band)"
      priority: "BLOCKING (safety confirmation required)"

    scenario_4:
      question: "CC your manager on this email? (default: no)"
      priority: "OPTIONAL (has default, low risk)"

# Timeout Duration Rationale
timeout_duration_rationale:

  BLOCKING_30s:
    reasoning: |
      - User response time P99: ~20 seconds
      - 30s covers 99% of users (only 1% timeout)
      - BLOCKING is critical, give user ample time
      - Acceptable wait time for critical decision

  OPTIONAL_15s:
    reasoning: |
      - User response time P95: ~10 seconds
      - 15s covers 95% of users (5% timeout acceptable)
      - OPTIONAL is non-critical, shorter timeout reduces total task latency
      - Default answer available, timeout is safe

  dynamic_timeout_future:
    description: "Adjust timeout based on question complexity (future feature)"
    examples:
      - "Simple YES/NO: 10s"
      - "Multiple choice (2-3 options): 15s"
      - "Multiple choice (10+ options): 30s"
      - "Free-form TEXT: 45s"

# Observability
observability:

  metrics:
    - name: "clarification_priority_distribution"
      type: "gauge"
      labels: ["priority"]
      description: "Distribution of BLOCKING vs OPTIONAL clarifications"

    - name: "clarification_timeout_rate_by_priority"
      type: "gauge"
      labels: ["priority"]
      description: "Timeout rate for BLOCKING vs OPTIONAL"

    - name: "clarification_user_response_time_by_priority"
      type: "histogram"
      labels: ["priority"]
      buckets: [1000, 3000, 5000, 10000, 15000, 30000]
      description: "User response time distribution by priority"

  events:
    - name: "clarification_priority_selected"
      fields: ["task_id", "clarification_id", "priority", "timeout_ms", "has_default", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  priority_determines:
    - "Timeout duration (30s vs 15s)"
    - "Timeout strategy (ABORT vs USE_DEFAULT)"
    - "User messaging (critical vs informational)"
    - "Task outcome (fail vs continue)"

  related_contracts:
    - "01_clarification_protocol_fsm.yml - FSM timeout transitions"
    - "02_clarification_request_contract.yml - Priority field in request"
    - "04_timeout_handling_contract.yml - Priority-based timeout strategies"

