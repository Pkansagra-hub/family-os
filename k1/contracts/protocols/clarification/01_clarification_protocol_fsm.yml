# Clarification Protocol - FSM State Machine Contract
# File: contracts/protocols/clarification/01_clarification_protocol_fsm.yml
# Purpose: Nested protocol for requesting user clarification during task execution
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-FSM-001"
  name: "Clarification Protocol FSM"
  version: "1.0"

# Protocol Overview
clarification_protocol:
  purpose: "Nested protocol within Task Execution for Planner/Agent to request user clarification"
  nested_within: "Task Execution Protocol (EXECUTE phase)"
  trigger: "Planner Agent detects ambiguity or missing information during planning"
  participants:
    - role: "Planner Agent"
      type: "AI Agent"
      responsibility: "Detect ambiguity, generate clarification question, await response"
    - role: "Orchestrator"
      type: "Pure Actor"
      responsibility: "Route clarification to WebSocket, enforce timeout"
    - role: "User"
      type: "Human"
      responsibility: "Provide clarification answer via WebSocket"

  research_basis: "Nested protocol pattern (MPST), Human-in-loop interaction"
  key_principle: "Blocking clarification (wait for user) vs non-blocking (use default)"

# FSM States
fsm_states:

  UNREQUESTED:
    description: "Initial state - no clarification needed"
    entry_action: "None"
    exit_action: "Generate clarification question"
    is_terminal: false

  REQUESTED:
    description: "Clarification sent to user, awaiting response"
    entry_action: |
      - Planner sends ClarificationRequest to Orchestrator
      - Orchestrator forwards to WebSocket Gateway
      - Start timeout timer (30s default, configurable per priority)
    exit_action: "Cancel timeout timer"
    is_terminal: false
    timeout_ms: 30000  # 30 seconds default

  WAITING_RESPONSE:
    description: "WebSocket delivered request, user is typing/thinking"
    entry_action: |
      - WebSocket confirms delivery to user
      - Display clarification UI (question, options, text input)
      - User has 30s to respond (BLOCKING) or use default (OPTIONAL)
    exit_action: "Hide clarification UI"
    is_terminal: false

  RESOLVED:
    description: "User provided answer, clarification complete"
    entry_action: |
      - Receive ClarificationResponse from user via WebSocket
      - Orchestrator forwards to Planner Agent
      - Planner resumes planning with clarification answer
    exit_action: "Resume task execution"
    is_terminal: true
    success: true

  TIMEOUT:
    description: "User did not respond within timeout window"
    entry_action: |
      - Timeout timer expires (30s elapsed)
      - Execute timeout strategy (use default, escalate, abort)
      - Log timeout event
    exit_action: "Resume with fallback or abort"
    is_terminal: true
    success: false
    fallback_strategy: "priority-dependent (BLOCKING: abort, OPTIONAL: use default)"

  ABORTED:
    description: "Clarification aborted by user or system"
    entry_action: |
      - User explicitly cancelled clarification
      - OR system cancelled (task cancelled, barge-in)
      - Planner informed of abortion
    exit_action: "Abort task or resume with fallback"
    is_terminal: true
    success: false

# State Transitions
state_transitions:

  transition_1_request_clarification:
    from_state: "UNREQUESTED"
    to_state: "REQUESTED"
    trigger: "Planner detects ambiguity (e.g., multiple matching restaurants, unclear user intent)"
    guard: "Task in EXECUTE phase AND Planner requires clarification"
    action: |
      - Planner generates ClarificationRequest message
      - Includes: question, options (if multiple choice), context, priority (BLOCKING/OPTIONAL)

    validation:
      - "ClarificationRequest message valid (question not empty)"
      - "Priority is BLOCKING or OPTIONAL"
      - "Options provided if multiple choice question"

    performance: "<10ms (message generation and routing)"

  transition_2_await_response:
    from_state: "REQUESTED"
    to_state: "WAITING_RESPONSE"
    trigger: "WebSocket Gateway confirms delivery to user"
    guard: "User session active AND WebSocket connected"
    action: |
      - WebSocket sends CLARIFICATION_REQUEST message to client
      - Client displays clarification UI (question, options, input field)
      - Start user response timer

    performance: "<50ms (WebSocket delivery confirmation)"

  transition_3_user_responds:
    from_state: "WAITING_RESPONSE"
    to_state: "RESOLVED"
    trigger: "User submits clarification answer via WebSocket"
    guard: "Answer provided within timeout window"
    action: |
      - WebSocket receives ClarificationResponse from client
      - Orchestrator forwards to Planner Agent
      - Planner validates answer and resumes planning

    validation:
      - "ClarificationResponse message valid"
      - "Answer matches question type (text, multiple choice)"
      - "Timestamp within timeout window"

    performance: "<100ms (WebSocket → Orchestrator → Planner)"

  transition_4_timeout_expires:
    from_state: "WAITING_RESPONSE"
    to_state: "TIMEOUT"
    trigger: "Timeout timer expires (30s default, no user response)"
    guard: "Timer reaches timeout_ms AND no response received"
    action: |
      - Execute timeout strategy based on priority:
        BLOCKING priority: Abort task, inform user ("I need this info to continue")
        OPTIONAL priority: Use default answer, log assumption
      - Planner resumes or aborts based on strategy

    fallback_logic: |
      if priority == BLOCKING:
        abort_task()
        send_error_to_user("Unable to proceed without clarification")
      elif priority == OPTIONAL:
        use_default_answer()
        log_assumption("Assumed default: ...")
        resume_planning()

    performance: "<10ms (timeout detection and strategy execution)"

  transition_5_user_cancels:
    from_state: "WAITING_RESPONSE"
    to_state: "ABORTED"
    trigger: "User explicitly cancels clarification (closes UI, navigates away)"
    guard: "User sends cancellation signal"
    action: |
      - WebSocket receives CLARIFICATION_CANCELLED message
      - Orchestrator forwards to Planner Agent
      - Planner aborts planning, sends TaskFailure

    performance: "<100ms (cancellation propagation)"

  transition_6_system_cancels:
    from_state: ["REQUESTED", "WAITING_RESPONSE"]
    to_state: "ABORTED"
    trigger: "System cancels clarification (task cancelled, barge-in, session timeout)"
    guard: "Task no longer active OR session terminated"
    action: |
      - Orchestrator sends CLARIFICATION_ABORT to Planner
      - Planner cancels clarification, cleans up state
      - WebSocket notifies user (if session still active)

    performance: "<50ms (abort propagation)"

# Timeout Policies
timeout_policies:

  BLOCKING_priority:
    description: "Critical clarification - task cannot proceed without answer"
    timeout_ms: 30000  # 30 seconds
    strategy_on_timeout: "ABORT_TASK"
    user_message: "I need this information to continue. Please provide an answer."
    example: "Which restaurant did you mean? (2 options: Acme Pizza, Best Pizza)"

  OPTIONAL_priority:
    description: "Non-critical clarification - task can proceed with default"
    timeout_ms: 15000  # 15 seconds (shorter since non-blocking)
    strategy_on_timeout: "USE_DEFAULT"
    default_behavior: "Use first option, most common choice, or safe default"
    user_message: "I'll assume [default]. Let me know if you want to change it."
    example: "What time should I book? (default: earliest available)"

  timeout_enforcement:
    mechanism: "Protocol Monitor starts timer when entering WAITING_RESPONSE state"
    precision: "±100ms (adequate for 15-30s timeouts)"
    cancellation: "Timer cancelled if user responds before timeout"

# Clarification Priority Levels
priority_levels:

  BLOCKING:
    value: "BLOCKING"
    meaning: "Task CANNOT proceed without user answer"
    behavior: "Wait up to 30s, abort if no response"
    use_cases:
      - "Disambiguation: Multiple matching entities (2+ restaurants with similar names)"
      - "Missing required info: Payment method required for booking"
      - "Safety confirmation: RED band action requires approval"
    timeout_strategy: "ABORT_TASK (inform user, do not proceed)"

  OPTIONAL:
    value: "OPTIONAL"
    meaning: "Task CAN proceed with default answer"
    behavior: "Wait up to 15s, use default if no response"
    use_cases:
      - "Preferences: Time slot selection (default: earliest available)"
      - "Formatting: Output format (default: plain text)"
      - "Optional details: Additional notes (default: none)"
    timeout_strategy: "USE_DEFAULT (log assumption, proceed)"
    default_selection_logic: |
      if multiple_choice:
        return options[0]  # First option
      elif range:
        return safe_default  # E.g., earliest time, lowest cost
      else:
        return null  # Skip optional field

# Nested Protocol Integration
nested_protocol_context:

  parent_protocol: "Task Execution Protocol (EXECUTE phase)"

  suspension_point: |
    Task Execution EXECUTE phase suspends when Planner sends ClarificationRequest.
    Planner Agent enters "waiting for clarification" state.
    Task execution does NOT timeout while waiting (clarification timeout is separate).

  resumption_point: |
    When clarification RESOLVED:
      - Planner receives ClarificationResponse
      - Planner resumes planning with clarification answer
      - Task execution continues (still within 5000ms EXECUTE budget)

    When clarification TIMEOUT/ABORTED:
      - Planner receives timeout/abort signal
      - Execute fallback strategy (use default or abort)
      - Task execution continues or fails

  task_timeout_interaction: |
    Clarification timeout (30s) is SEPARATE from task execution timeout (5000ms).
    Task execution timer PAUSES during clarification (does not count against 5s budget).
    Rationale: User response time should not penalize agent performance.

    Example timeline:
      Task starts: t=0ms
      Planner detects ambiguity: t=500ms
      Clarification requested: t=510ms
      [PAUSE task timeout - waiting for user]
      User responds: t=10,510ms (10 seconds later)
      [RESUME task timeout - continue from 510ms elapsed]
      Task completes: t=11,000ms (total 510ms + 490ms = 1000ms agent time)

      Task latency reported: 1000ms (agent execution time, excludes user wait)
      Total wall-clock time: 11,000ms (includes user wait)

# Performance Budgets
performance_budgets:

  clarification_request_latency: "<10ms (Planner → Orchestrator → WebSocket)"
  websocket_delivery_latency: "<50ms (Orchestrator → WebSocket → Client)"
  user_response_latency: "0-30s (human interaction time, not counted in task budget)"
  clarification_response_latency: "<100ms (Client → WebSocket → Orchestrator → Planner)"

  total_protocol_overhead: "<160ms (excludes user think time)"

  p95_clarification_wall_clock: "5000ms (user typically responds in 3-5s)"
  p99_clarification_wall_clock: "15000ms (slow typers, complex questions)"

# Observability
observability:

  metrics:
    - name: "clarification_requested_total"
      type: "counter"
      labels: ["priority", "question_type"]
      description: "Total clarifications requested by Planner"

    - name: "clarification_resolved_total"
      type: "counter"
      labels: ["priority", "resolution"]
      description: "Clarifications resolved (user_response, timeout, aborted)"

    - name: "clarification_user_response_time_ms"
      type: "histogram"
      buckets: [1000, 3000, 5000, 10000, 15000, 30000]
      description: "Time from request to user response (wall-clock)"

    - name: "clarification_timeout_rate"
      type: "gauge"
      labels: ["priority"]
      description: "Percentage of clarifications that timeout"

    - name: "clarification_abort_rate"
      type: "gauge"
      description: "Percentage of clarifications aborted by user/system"

  events:
    - name: "clarification_requested"
      fields: ["task_id", "agent_id", "question", "priority", "options", "trace_id"]

    - name: "clarification_resolved"
      fields: ["task_id", "agent_id", "answer", "resolution", "user_response_time_ms", "trace_id"]

    - name: "clarification_timeout"
      fields: ["task_id", "agent_id", "priority", "fallback_strategy", "trace_id"]

    - name: "clarification_aborted"
      fields: ["task_id", "agent_id", "reason", "trace_id"]

# Error Scenarios
error_scenarios:

  scenario_1_websocket_disconnected:
    condition: "User's WebSocket disconnects during clarification"
    handling: |
      - WebSocket Gateway detects disconnect
      - Send CLARIFICATION_ABORT to Orchestrator
      - Orchestrator forwards to Planner
      - Planner uses timeout strategy (abort or default)
    recovery: "Wait for WebSocket reconnect, re-send clarification if session active"

  scenario_2_multiple_clarifications:
    condition: "Planner requests 2+ clarifications in single task"
    handling: |
      - Allow sequential clarifications (first must resolve before second)
      - Track clarification count per task (max 3 clarifications)
      - If >3 clarifications: abort task (too complex, needs redesign)
    rationale: "Prevent infinite clarification loops, poor UX"

  scenario_3_malformed_response:
    condition: "User sends invalid clarification response (wrong format, empty)"
    handling: |
      - Validate response format (text, multiple choice selection)
      - If invalid: request clarification again (re-enter REQUESTED state)
      - Max 2 retry attempts, then use timeout strategy
    example: "Multiple choice question, user sends free text (invalid)"

  scenario_4_concurrent_clarifications:
    condition: "Multiple agents request clarification simultaneously"
    handling: |
      - Queue clarifications (FIFO order)
      - Present one clarification at a time to user
      - Other clarifications wait in REQUESTED state
    rationale: "Prevent UI confusion, ensure clear user focus"

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "Nested within Task Execution EXECUTE phase"

  parent_protocol_states:
    - "Task Execution: EXECUTE (Planner Agent executing)"

  protocol_lifecycle:
    start: "Planner detects ambiguity → sends ClarificationRequest"
    active: "Clarification FSM active (REQUESTED → WAITING_RESPONSE)"
    complete: "Clarification RESOLVED or TIMEOUT/ABORTED → Planner resumes"

  related_contracts:
    - "02_clarification_request_contract.yml - ClarificationRequest message"
    - "03_clarification_response_contract.yml - ClarificationResponse message"
    - "04_timeout_handling_contract.yml - Timeout strategies"
    - "../task_execution/01_task_protocol_fsm.yml - Parent protocol"

# ==============================================================================
# Summary: Clarification Protocol FSM
# ==============================================================================
#
# States: 6 (UNREQUESTED, REQUESTED, WAITING_RESPONSE, RESOLVED, TIMEOUT, ABORTED)
# Transitions: 6 (request, await, respond, timeout, user_cancel, system_cancel)
#
# Key Features:
#   - Nested protocol within Task Execution (suspends parent protocol)
#   - Priority-based timeout (BLOCKING 30s, OPTIONAL 15s)
#   - Timeout strategies (BLOCKING: abort, OPTIONAL: use default)
#   - User response time excluded from task execution budget
#   - Sequential clarifications (max 3 per task)
#
# Performance:
#   - Protocol overhead: <160ms (excludes user think time)
#   - User response P95: 5s, P99: 15s
#   - WebSocket delivery: <50ms
#
# ==============================================================================
