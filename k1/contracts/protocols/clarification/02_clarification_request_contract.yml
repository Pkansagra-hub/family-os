# Clarification Protocol - Request Message Contract
# File: contracts/protocols/clarification/02_clarification_request_contract.yml
# Purpose: Planner Agent requests clarification from user
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-REQUEST-002"
  name: "Clarification Request Message Contract"
  version: "1.0"

# Request Overview
clarification_request:
  purpose: "Planner Agent asks user for clarification during planning"
  direction: "Planner Agent (1) → Orchestrator (1) → WebSocket Gateway (1) → User (1)"
  protocol_phase: "UNREQUESTED → REQUESTED transition"
  trigger: "Planner detects ambiguity, missing info, or needs confirmation"

# ClarificationRequest Message Schema
flatbuffers_schema: |
  table ClarificationRequest {
    task_id: string (required)                    # UUID task identifier
    agent_id: string (required)                   # Planner Agent ID
    clarification_id: string (required)           # UUID clarification instance
    question: string (required, max 512 chars)    # Human-readable question
    question_type: string (required)              # Enum: TEXT, MULTIPLE_CHOICE, YES_NO, CONFIRMATION
    options: [string] (optional)                  # Multiple choice options (if applicable)
    context: string (optional, max 1024 chars)    # Additional context for user
    priority: string (required)                   # Enum: BLOCKING, OPTIONAL
    default_answer: string (optional)             # Default if timeout (OPTIONAL priority)
    timeout_ms: uint (required)                   # Timeout for user response
    trace_id: string (required)                   # OpenTelemetry trace ID
    timestamp_ns: ulong (required)                # Request timestamp
  }

# Message Fields
fields:

  task_id:
    type: "UUID (string)"
    required: true
    description: "Must match parent Task Execution task_id"

  agent_id:
    type: "UUID (string)"
    required: true
    description: "Planner Agent requesting clarification"

  clarification_id:
    type: "UUID (string)"
    required: true
    description: "Unique ID for this clarification instance (for tracking)"

  question:
    type: "string (max 512 chars)"
    required: true
    examples:
      - "Which restaurant did you mean? I found 2 matches."
      - "What time should I book the reservation?"
      - "Do you want me to send this email now?"
    description: "Clear, concise question in natural language"
    validation: "Question must end with '?' (question mark)"

  question_type:
    type: "string (enum)"
    required: true
    enum_values:
      - TEXT: "Free-form text answer (e.g., 'What should the subject be?')"
      - MULTIPLE_CHOICE: "User picks from options (e.g., 'Which restaurant?')"
      - YES_NO: "Binary choice (e.g., 'Should I proceed?')"
      - CONFIRMATION: "Confirm action (e.g., 'Send this email?')"
    description: "Question type determines UI presentation"

  options:
    type: "[string] (array, optional)"
    required: false
    required_if: "question_type == MULTIPLE_CHOICE"
    examples:
      - ["Acme Pizza (123 Main St)", "Best Pizza (456 Oak Ave)"]
      - ["12:00 PM", "1:00 PM", "2:00 PM"]
      - ["Option A: Lower cost", "Option B: Faster delivery"]
    description: "Multiple choice options (2-5 options typical)"
    validation: |
      If question_type == MULTIPLE_CHOICE:
        - options must be provided
        - options.length >= 2
        - options.length <= 10 (max 10 options)

  context:
    type: "string (max 1024 chars, optional)"
    required: false
    examples:
      - "I found 2 restaurants named 'Pizza Place' within 5 miles of you."
      - "Your calendar shows conflicts at 12 PM and 2 PM."
      - "This action requires RED band approval (sending external email)."
    description: "Additional context to help user make informed decision"

  priority:
    type: "string (enum)"
    required: true
    enum_values:
      - BLOCKING: "Task cannot proceed without answer (abort if timeout)"
      - OPTIONAL: "Task can proceed with default (use default if timeout)"
    description: "Determines timeout strategy"

  default_answer:
    type: "string (optional)"
    required: false
    required_if: "priority == OPTIONAL"
    examples:
      - "12:00 PM (earliest available)"
      - "Acme Pizza (first match)"
      - "Yes (proceed with default)"
    description: "Default answer used if timeout (OPTIONAL priority only)"
    validation: |
      If priority == OPTIONAL:
        - default_answer should be provided (recommended)
        - If question_type == MULTIPLE_CHOICE: default_answer must match one option

  timeout_ms:
    type: "uint (milliseconds)"
    required: true
    default_values:
      - BLOCKING: 30000  # 30 seconds
      - OPTIONAL: 15000  # 15 seconds
    range: "5000-60000 (5s - 60s)"
    description: "How long to wait for user response"

  trace_id:
    type: "string"
    required: true
    description: "Distributed tracing trace ID"

  timestamp_ns:
    type: "ulong (nanoseconds)"
    required: true
    description: "Request timestamp (when Planner sent request)"

# Example Payloads
example_payloads: |
  # Example 1: BLOCKING - Disambiguation (multiple restaurants)
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "clarification_id": "clarif-aaa",
    "question": "Which restaurant did you mean? I found 2 matches.",
    "question_type": "MULTIPLE_CHOICE",
    "options": [
      "Acme Pizza (123 Main St, San Francisco)",
      "Best Pizza (456 Oak Ave, Oakland)"
    ],
    "context": "Both restaurants have similar names and are within 5 miles.",
    "priority": "BLOCKING",
    "default_answer": null,
    "timeout_ms": 30000,
    "trace_id": "...",
    "timestamp_ns": 1695000001000000000
  }

  # Example 2: OPTIONAL - Time preference (with default)
  {
    "task_id": "task-yyy",
    "agent_id": "agent-ai-planner-002",
    "clarification_id": "clarif-bbb",
    "question": "What time should I book the reservation?",
    "question_type": "MULTIPLE_CHOICE",
    "options": ["12:00 PM", "1:00 PM", "2:00 PM", "3:00 PM"],
    "context": "All times are available. I'll assume earliest if you don't specify.",
    "priority": "OPTIONAL",
    "default_answer": "12:00 PM (earliest available)",
    "timeout_ms": 15000,
    "trace_id": "...",
    "timestamp_ns": 1695000002000000000
  }

  # Example 3: BLOCKING - Confirmation (RED band action)
  {
    "task_id": "task-zzz",
    "agent_id": "agent-ai-planner-003",
    "clarification_id": "clarif-ccc",
    "question": "Do you want me to send this email to external recipient?",
    "question_type": "YES_NO",
    "options": ["Yes, send it", "No, cancel"],
    "context": "This is a RED band action requiring your explicit approval.",
    "priority": "BLOCKING",
    "default_answer": null,
    "timeout_ms": 30000,
    "trace_id": "...",
    "timestamp_ns": 1695000003000000000
  }

  # Example 4: OPTIONAL - Free text (subject line)
  {
    "task_id": "task-www",
    "agent_id": "agent-ai-planner-004",
    "clarification_id": "clarif-ddd",
    "question": "What should the email subject be?",
    "question_type": "TEXT",
    "options": null,
    "context": "I can generate a subject line if you don't provide one.",
    "priority": "OPTIONAL",
    "default_answer": "Meeting Follow-up (auto-generated)",
    "timeout_ms": 15000,
    "trace_id": "...",
    "timestamp_ns": 1695000004000000000
  }

# Planner Logic (When to Send Clarification)
planner_clarification_logic:

  step_1_detect_ambiguity:
    trigger: "Planner detects ambiguity during 4-stage planning"
    examples:
      - "Multiple matching entities (2+ restaurants, 2+ contacts)"
      - "Missing required information (time, location, recipient)"
      - "Conflicting constraints (budget vs quality, time vs cost)"
      - "Safety/privacy confirmation (RED band action)"

    detection_mechanism: |
      - LLM planning step (Sketch stage) identifies uncertainty
      - Tool registry lookup returns multiple matches
      - Validation stage (rules) flags missing required fields
      - Arbiter (for RED band) requires user confirmation

  step_2_generate_question:
    action: "Planner formulates clear, actionable question"
    best_practices:
      - "Be specific: 'Which John Smith?' instead of 'Clarify contact'"
      - "Provide options: Multiple choice > Free text (easier for user)"
      - "Add context: Explain why clarification needed"
      - "Set priority: BLOCKING if critical, OPTIONAL if nice-to-have"

    question_generation: |
      - LLM generates question based on ambiguity type
      - Format options clearly (include distinguishing details)
      - Keep question concise (<512 chars)

  step_3_determine_priority:
    logic: |
      BLOCKING priority if:
        - Task CANNOT proceed without answer (ambiguous entity)
        - Safety/privacy confirmation required (RED band)
        - Multiple valid options with different outcomes

      OPTIONAL priority if:
        - Task CAN proceed with reasonable default
        - Preference question (time, format, style)
        - Non-critical detail (optional notes, labels)

    examples:
      - BLOCKING: "Which credit card?" # required for payment
      - OPTIONAL: "What subject line?" # can auto-generate

  step_4_set_default_if_optional:
    logic: |
      If priority == OPTIONAL:
        - Provide sensible default_answer
        - Default should be safe, conservative choice
        - Examples: earliest time, first option, most common choice
        - Inform user of default in context

  step_5_send_request:
    action: "Send ClarificationRequest to Orchestrator"
    routing: "Orchestrator → WebSocket Gateway → User"

# Orchestrator Handling
orchestrator_handling:

  step_1_receive_request:
    action: "Orchestrator receives ClarificationRequest from Planner Agent"
    validation: "Verify task_id exists, agent_id is valid Planner"

  step_2_route_to_websocket:
    action: "Forward ClarificationRequest to WebSocket Gateway"
    message_type: "CLARIFICATION_REQUEST"
    delivery: "WebSocket Gateway → User's connected client"

  step_3_start_timeout_timer:
    action: "Start timeout timer (30s BLOCKING, 15s OPTIONAL)"
    mechanism: "Protocol Monitor manages timeout enforcement"

  step_4_await_response:
    state: "FSM transitions to WAITING_RESPONSE"
    awaiting: "ClarificationResponse from user via WebSocket"

# WebSocket Delivery
websocket_delivery:

  message_type: "CLARIFICATION_REQUEST"

  websocket_message_format: |
    {
      "type": "CLARIFICATION_REQUEST",
      "task_id": "task-xxx",
      "clarification_id": "clarif-aaa",
      "question": "Which restaurant?",
      "question_type": "MULTIPLE_CHOICE",
      "options": ["Acme Pizza", "Best Pizza"],
      "context": "...",
      "priority": "BLOCKING",
      "default_answer": null,
      "timeout_ms": 30000
    }

  client_ui_presentation:
    MULTIPLE_CHOICE: "Display radio buttons or dropdown with options"
    TEXT: "Display text input field (with placeholder default_answer)"
    YES_NO: "Display Yes/No buttons"
    CONFIRMATION: "Display Confirm/Cancel buttons (highlight risk if RED band)"

  client_behavior:
    user_responds: "Send ClarificationResponse via WebSocket (see 03_clarification_response_contract.yml)"
    user_cancels: "Send CLARIFICATION_CANCELLED message"
    timeout: "Client displays timeout warning at 5s remaining"

# Observability
observability:

  metrics:
    - name: "clarification_request_sent_total"
      type: "counter"
      labels: ["question_type", "priority"]
      description: "Clarification requests sent by Planner"

    - name: "clarification_request_latency_ms"
      type: "histogram"
      buckets: [5, 10, 25, 50, 100]
      description: "Latency from Planner to WebSocket delivery"

    - name: "clarification_question_length_chars"
      type: "histogram"
      buckets: [50, 100, 200, 300, 512]
      description: "Question length distribution"

  events:
    - name: "clarification_request_sent"
      fields: ["task_id", "agent_id", "clarification_id", "question_type", "priority", "timeout_ms", "trace_id"]

    - name: "clarification_request_delivered"
      fields: ["task_id", "clarification_id", "websocket_session_id", "delivery_latency_ms", "trace_id"]

# Validation Rules
validation_rules:

  question_validation:
    - "question not empty"
    - "question length <= 512 chars"
    - "question ends with '?' (best practice)"

  question_type_validation:
    - "question_type in [TEXT, MULTIPLE_CHOICE, YES_NO, CONFIRMATION]"
    - "If MULTIPLE_CHOICE: options must be provided"
    - "If YES_NO or CONFIRMATION: options = ['Yes', 'No'] or similar"

  priority_validation:
    - "priority in [BLOCKING, OPTIONAL]"
    - "If OPTIONAL: default_answer recommended (not enforced)"

  timeout_validation:
    - "timeout_ms in range 5000-60000 (5s - 60s)"
    - "timeout_ms >= 5000 (minimum 5s for user to read and respond)"

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "UNREQUESTED → REQUESTED transition"

  parent_task_state: "Task Execution EXECUTE phase (Planner Agent planning)"

  next_phase: "WAITING_RESPONSE (after WebSocket delivery confirmation)"

  related_contracts:
    - "01_clarification_protocol_fsm.yml - FSM state machine"
    - "03_clarification_response_contract.yml - User response"
    - "04_timeout_handling_contract.yml - Timeout strategies"

