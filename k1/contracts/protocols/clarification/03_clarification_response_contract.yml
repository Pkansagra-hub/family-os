# Clarification Protocol - Response Message Contract
# File: contracts/protocols/clarification/03_clarification_response_contract.yml
# Purpose: User provides clarification answer to Planner Agent
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-RESPONSE-003"
  name: "Clarification Response Message Contract"
  version: "1.0"

# Response Overview
clarification_response:
  purpose: "User answers clarification question from Planner Agent"
  direction: "User (1) → WebSocket Gateway (1) → Orchestrator (1) → Planner Agent (1)"
  protocol_phase: "WAITING_RESPONSE → RESOLVED transition"
  trigger: "User submits answer via WebSocket UI"

# ClarificationResponse Message Schema
flatbuffers_schema: |
  table ClarificationResponse {
    task_id: string (required)                    # UUID task identifier
    clarification_id: string (required)           # UUID clarification instance (from request)
    answer: string (required, max 1024 chars)     # User's answer
    answer_type: string (required)                # Enum: TEXT, SELECTED_OPTION, YES, NO, CANCELLED
    confidence: float (optional)                  # User confidence (0.0-1.0, future feature)
    response_time_ms: uint (required)             # Time from request to response
    trace_id: string (required)                   # OpenTelemetry trace ID
    timestamp_ns: ulong (required)                # Response timestamp
  }

# Message Fields
fields:

  task_id:
    type: "UUID (string)"
    required: true
    description: "Must match ClarificationRequest.task_id"

  clarification_id:
    type: "UUID (string)"
    required: true
    description: "Must match ClarificationRequest.clarification_id (for tracking)"

  answer:
    type: "string (max 1024 chars)"
    required: true
    examples:
      - "Acme Pizza (123 Main St, San Francisco)"  # MULTIPLE_CHOICE selection
      - "12:00 PM"  # MULTIPLE_CHOICE time selection
      - "Yes, send it"  # YES_NO confirmation
      - "Meeting Follow-up: Q4 Planning"  # TEXT free-form
    description: "User's answer to clarification question"
    validation: |
      If question_type == MULTIPLE_CHOICE:
        - answer must match one of the options from request
      If question_type == YES_NO:
        - answer must be "Yes" or "No" (or equivalent)
      If question_type == TEXT:
        - answer can be any text (max 1024 chars)

  answer_type:
    type: "string (enum)"
    required: true
    enum_values:
      - TEXT: "Free-form text answer"
      - SELECTED_OPTION: "User picked from multiple choice options"
      - YES: "User confirmed (YES_NO or CONFIRMATION)"
      - NO: "User declined (YES_NO or CONFIRMATION)"
      - CANCELLED: "User cancelled clarification"
    description: "Answer type (matches question_type from request)"

  confidence:
    type: "float (0.0-1.0, optional)"
    required: false
    description: "User confidence in answer (future feature for ML refinement)"
    example: "0.8 (user somewhat confident)"
    default: null

  response_time_ms:
    type: "uint (milliseconds)"
    required: true
    description: "Time from ClarificationRequest sent to ClarificationResponse received"
    calculation: "response_timestamp_ns - request_timestamp_ns"
    example: 5000  # 5 seconds

  trace_id:
    type: "string"
    required: true
    description: "Same trace_id as ClarificationRequest (distributed tracing)"

  timestamp_ns:
    type: "ulong (nanoseconds)"
    required: true
    description: "Response timestamp (when user submitted answer)"

# Example Payloads
example_payloads: |
  # Example 1: MULTIPLE_CHOICE - Restaurant selection
  {
    "task_id": "task-xxx",
    "clarification_id": "clarif-aaa",
    "answer": "Acme Pizza (123 Main St, San Francisco)",
    "answer_type": "SELECTED_OPTION",
    "confidence": null,
    "response_time_ms": 4500,
    "trace_id": "...",
    "timestamp_ns": 1695000005500000000
  }

  # Example 2: MULTIPLE_CHOICE - Time selection (with default fallback)
  {
    "task_id": "task-yyy",
    "clarification_id": "clarif-bbb",
    "answer": "1:00 PM",
    "answer_type": "SELECTED_OPTION",
    "confidence": null,
    "response_time_ms": 3200,
    "trace_id": "...",
    "timestamp_ns": 1695000005200000000
  }

  # Example 3: YES_NO - Confirmation (RED band action)
  {
    "task_id": "task-zzz",
    "clarification_id": "clarif-ccc",
    "answer": "Yes, send it",
    "answer_type": "YES",
    "confidence": null,
    "response_time_ms": 6800,
    "trace_id": "...",
    "timestamp_ns": 1695000009800000000
  }

  # Example 4: TEXT - Free-form subject line
  {
    "task_id": "task-www",
    "clarification_id": "clarif-ddd",
    "answer": "Meeting Follow-up: Q4 Planning Discussion",
    "answer_type": "TEXT",
    "confidence": null,
    "response_time_ms": 8200,
    "trace_id": "...",
    "timestamp_ns": 1695000012200000000
  }

  # Example 5: CANCELLED - User cancelled clarification
  {
    "task_id": "task-vvv",
    "clarification_id": "clarif-eee",
    "answer": "(user cancelled)",
    "answer_type": "CANCELLED",
    "confidence": null,
    "response_time_ms": 2500,
    "trace_id": "...",
    "timestamp_ns": 1695000004500000000
  }

# User Response Flow
user_response_flow:

  step_1_user_receives_request:
    trigger: "WebSocket delivers ClarificationRequest to client"
    action: "Client displays clarification UI (question, options, input field)"
    ui_components:
      - "Question text (bold, prominent)"
      - "Context text (smaller, gray)"
      - "Input widget (radio buttons, dropdown, text field, buttons)"
      - "Submit button ('Send Answer')"
      - "Cancel button ('Skip' or 'Cancel')"
      - "Timeout countdown (displays remaining time)"

  step_2_user_thinks_types:
    action: "User reads question, considers options, types answer (if TEXT)"
    typical_time: "3-5 seconds (P50), 5-10 seconds (P95)"

  step_3_user_submits:
    action: "User clicks Submit button (or presses Enter)"
    validation: |
      Client validates answer:
        - If MULTIPLE_CHOICE: ensure option selected
        - If TEXT: ensure not empty (unless optional)
        - If YES_NO: ensure Yes or No selected

  step_4_websocket_sends_response:
    action: "Client sends ClarificationResponse via WebSocket"
    message_type: "CLARIFICATION_RESPONSE"
    routing: "WebSocket Gateway → Orchestrator → Planner Agent"

# Planner Handling (Resume Planning)
planner_handling:

  step_1_receive_response:
    action: "Planner Agent receives ClarificationResponse from Orchestrator"
    validation: |
      - Verify clarification_id matches pending clarification
      - Verify answer is valid (not empty, matches question_type)
      - Verify response received before timeout

  step_2_validate_answer:
    validation_logic: |
      If answer_type == SELECTED_OPTION:
        - Verify answer matches one of the options from request
      If answer_type == YES or NO:
        - Update plan based on confirmation result
      If answer_type == TEXT:
        - Parse free-form text, extract relevant info
      If answer_type == CANCELLED:
        - Use timeout strategy (abort or default)

  step_3_resume_planning:
    action: "Planner updates plan with clarification answer"
    examples:
      - "Restaurant selection: Update plan with specific restaurant"
      - "Time selection: Update reservation time in plan"
      - "Confirmation: Proceed with action (or abort if declined)"
      - "Subject line: Update email subject field"

    planning_stage: "Resume from Validation stage (4-stage pipeline)"

  step_4_continue_task_execution:
    action: "Planner continues with updated plan"
    next_steps: |
      - Complete planning (Sketch → Expand → Validate → Commit)
      - Execute plan (call tools, invoke agents)
      - Send TaskResult to Orchestrator

# Orchestrator Handling
orchestrator_handling:

  step_1_receive_from_websocket:
    action: "Orchestrator receives ClarificationResponse from WebSocket Gateway"
    validation: "Verify task_id, clarification_id"

  step_2_cancel_timeout_timer:
    action: "Cancel timeout timer (user responded before timeout)"
    mechanism: "Protocol Monitor cancels timer"

  step_3_route_to_planner:
    action: "Forward ClarificationResponse to Planner Agent"
    routing: "Orchestrator → Planner Agent mailbox"

  step_4_update_fsm_state:
    action: "FSM transitions WAITING_RESPONSE → RESOLVED"

# Response Time Analysis
response_time_analysis:

  typical_response_times:
    p50_response_time_ms: 3000  # 3 seconds (median user)
    p75_response_time_ms: 5000  # 5 seconds
    p95_response_time_ms: 10000  # 10 seconds
    p99_response_time_ms: 20000  # 20 seconds (slow typers, complex questions)

  factors_affecting_response_time:
    - "Question complexity (simple choice vs free-form text)"
    - "User typing speed (TEXT questions slower)"
    - "User attention (multitasking, distracted)"
    - "UI responsiveness (mobile vs desktop)"

  timeout_configuration:
    BLOCKING_timeout: 30000  # 30s (covers P99)
    OPTIONAL_timeout: 15000  # 15s (covers P95, acceptable for defaults)

# Observability
observability:

  metrics:
    - name: "clarification_response_received_total"
      type: "counter"
      labels: ["answer_type"]
      description: "Clarification responses received from user"

    - name: "clarification_response_time_ms"
      type: "histogram"
      buckets: [1000, 3000, 5000, 10000, 15000, 30000]
      description: "User response time distribution"

    - name: "clarification_cancelled_total"
      type: "counter"
      description: "Clarifications cancelled by user"

    - name: "clarification_answer_length_chars"
      type: "histogram"
      buckets: [10, 50, 100, 300, 1024]
      description: "Answer length for TEXT responses"

  events:
    - name: "clarification_response_received"
      fields: ["task_id", "clarification_id", "answer_type", "response_time_ms", "trace_id"]

    - name: "clarification_cancelled"
      fields: ["task_id", "clarification_id", "reason", "trace_id"]

# Validation Rules
validation_rules:

  answer_validation:
    - "answer not empty (unless answer_type == CANCELLED)"
    - "answer length <= 1024 chars"
    - "If SELECTED_OPTION: answer matches one option from request"
    - "If YES/NO: answer is 'Yes' or 'No' (case-insensitive)"

  timing_validation:
    - "response_time_ms > 0"
    - "response_time_ms <= timeout_ms (from request)"
    - "timestamp_ns >= request.timestamp_ns"

  answer_type_validation:
    - "answer_type in [TEXT, SELECTED_OPTION, YES, NO, CANCELLED]"
    - "answer_type matches question_type from request"

# Error Scenarios
error_scenarios:

  scenario_1_invalid_option_selected:
    condition: "User selects option not in original options list"
    cause: "Client bug, stale UI, manual WebSocket message"
    handling: |
      - Planner validates answer against original options
      - If invalid: log warning, request clarification again
      - Max 2 retry attempts, then use timeout strategy

  scenario_2_empty_text_answer:
    condition: "User submits empty TEXT answer for required field"
    cause: "User clicks Submit without typing"
    handling: |
      - Client should prevent submission (disable Submit button)
      - If empty answer received: request clarification again
      - Max 2 retry attempts, then use default or abort

  scenario_3_late_response:
    condition: "User response arrives after timeout expired"
    cause: "Network delay, user slow response, timeout too short"
    handling: |
      - Orchestrator discards late response (timeout already triggered)
      - Log late response event (for timeout tuning)
      - Planner has already executed timeout strategy

  scenario_4_multiple_responses:
    condition: "User submits multiple answers (clicks Submit twice)"
    cause: "Double-click, network retry, client bug"
    handling: |
      - Orchestrator accepts first response, discards duplicates
      - Log duplicate response event
      - FSM already transitioned to RESOLVED (subsequent responses ignored)

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "WAITING_RESPONSE → RESOLVED transition"

  parent_task_state: "Task Execution EXECUTE phase (Planner resumed)"

  next_phase: "Planner resumes planning, task execution continues"

  related_contracts:
    - "01_clarification_protocol_fsm.yml - FSM state machine"
    - "02_clarification_request_contract.yml - Request sent to user"
    - "04_timeout_handling_contract.yml - Timeout if no response"

# ==============================================================================
