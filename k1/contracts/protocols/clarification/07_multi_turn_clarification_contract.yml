# Clarification Protocol - Multi-Turn Clarification Contract
# File: contracts/protocols/clarification/07_multi_turn_clarification_contract.yml
# Purpose: Handle multiple sequential clarifications in single task
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-CLARIFICATION-MULTI-TURN-007"
  name: "Multi-Turn Clarification Contract"
  version: "1.0"

# Multi-Turn Overview
multi_turn_clarification:
  purpose: "Support multiple sequential clarifications within single task"
  scenario: "Planner needs 2+ pieces of information from user"
  constraint: "Max 3 clarifications per task (prevent infinite loops)"

# Sequential Clarification Pattern
sequential_clarification:

  pattern:
    description: "Clarifications must resolve sequentially (one at a time)"
    rationale: |
      - Present one question at a time (clear user focus)
      - Avoid UI confusion (multiple simultaneous questions)
      - Each answer may inform next question (dependency)

  flow:
    step_1_first_clarification:
      action: "Planner requests first clarification"
      fsm_state: "UNREQUESTED → REQUESTED → WAITING_RESPONSE → RESOLVED"
      example: "Which restaurant? (2 options)"

    step_2_resume_planning:
      action: "Planner resumes planning with first answer"
      planning_stage: "Continue through Sketch → Expand → Validate → Commit"

    step_3_detect_second_ambiguity:
      trigger: "Planner detects another ambiguity (e.g., missing time slot)"
      action: "Request second clarification"
      fsm_state: "UNREQUESTED → REQUESTED (new clarification_id)"
      example: "What time should I book? (4 options)"

    step_4_second_resolution:
      action: "User provides second answer"
      fsm_state: "WAITING_RESPONSE → RESOLVED"

    step_5_continue_or_third:
      action: "Planner continues or requests third clarification"
      max_clarifications: 3  # Hard limit per task

# Max Clarifications Policy
max_clarifications_policy:

  limit: 3
  rationale: |
    - 3 clarifications sufficient for most tasks (95% of cases)
    - Prevents infinite clarification loops (bad UX)
    - If >3 needed: task is too complex, needs redesign or more specific initial request

  enforcement:
    mechanism: "Planner tracks clarification_count per task"
    logic: |
      if clarification_count >= 3:
        if need_more_clarifications:
          abort_task()
          error_message: "This task requires too many clarifications. Please provide more specific details and try again."

    observability: |
      - Log: task_max_clarifications_exceeded (task_id, clarification_count)
      - Metric: task_max_clarifications_exceeded_total +1

  user_guidance: |
    After 3 clarifications:
      "This task is getting complex! To help me better, please provide:
       - Specific restaurant name and location
       - Exact date and time
       - Number of people
       Then submit a new request."

# Clarification Dependencies
clarification_dependencies:

  independent_clarifications:
    description: "Clarifications can be resolved in any order (no dependencies)"
    example: |
      Clarification 1: "Which restaurant?" (independent)
      Clarification 2: "What time?" (independent)
      Either order works

  dependent_clarifications:
    description: "Second clarification depends on first answer"
    example: |
      Clarification 1: "Which service: Basic ($10) or Premium ($50)?"
      User answers: "Premium"
      Clarification 2: "Premium includes extras. Do you want express delivery (+$10)?" (depends on Premium selection)

    planning_strategy: "Planner must wait for first answer before generating second question"

# Clarification Queue (Concurrent Tasks)
clarification_queue:

  scenario: "Multiple tasks have pending clarifications simultaneously"
  constraint: "Present one clarification at a time to user"

  queue_behavior:
    queuing_mechanism: "FIFO queue per user_id"
    queue_structure: |
      user_clarification_queue = {
        "user-123": [
          {"task_id": "task-aaa", "clarification_id": "clarif-001", ...},
          {"task_id": "task-bbb", "clarification_id": "clarif-002", ...},
          {"task_id": "task-ccc", "clarification_id": "clarif-003", ...}
        ]
      }

    presentation_logic: |
      - Present first clarification from queue (task-aaa)
      - Hold other clarifications (task-bbb, task-ccc) in REQUESTED state
      - When user responds to task-aaa clarification:
          - Present next clarification (task-bbb)
      - Continue until queue empty

  timeout_handling: |
    If first clarification times out:
      - Execute timeout strategy for task-aaa
      - Immediately present next clarification (task-bbb)
      - Do NOT wait for timeout before showing next

  observability:
    - "Metric: clarification_queue_depth (gauge, per user_id)"
    - "Metric: clarification_queue_wait_time_ms (histogram)"
    - "Event: clarification_queued (task_id, queue_position, user_id)"

# Multi-Turn Performance Impact
performance_impact:

  latency_per_clarification:
    protocol_overhead: "160ms (request + response, excludes user think time)"
    user_response_time: "3000-10000ms (P50-P95)"
    total_per_clarification: "3160-10160ms typical"

  cumulative_latency:
    one_clarification: "3-10 seconds"
    two_clarifications: "6-20 seconds"
    three_clarifications: "9-30 seconds"

    impact_on_task_latency: |
      User response time is EXCLUDED from task execution budget (5000ms).
      Task execution timer pauses during clarification.
      Total wall-clock time includes clarification wait time.

  user_experience:
    one_clarification: "Good UX (single question)"
    two_clarifications: "Acceptable UX (sequential questions)"
    three_clarifications: "Borderline UX (getting tedious)"
    four_plus_clarifications: "Poor UX (abort, request redesign)"

# Example Multi-Turn Scenarios
example_scenarios:

  scenario_1_restaurant_booking_2_clarifications:
    initial_request: "Book a table at Pizza Place"

    clarification_1:
      question: "Which Pizza Place? I found 2 matches."
      options: ["Acme Pizza (SF)", "Best Pizza (Oakland)"]
      priority: "BLOCKING"
      user_answer: "Acme Pizza (SF)"

    clarification_2:
      question: "What time should I book?"
      options: ["12:00 PM", "1:00 PM", "2:00 PM"]
      priority: "OPTIONAL"
      default_answer: "12:00 PM (earliest available)"
      user_answer: "1:00 PM"

    result: "Booked table at Acme Pizza (SF) for 1:00 PM"
    total_clarifications: 2

  scenario_2_email_send_3_clarifications:
    initial_request: "Send email to John about meeting"

    clarification_1:
      question: "Which John? I found 3 contacts."
      options: ["John Smith (CEO)", "John Doe (Engineer)", "John Lee (Sales)"]
      priority: "BLOCKING"
      user_answer: "John Smith (CEO)"

    clarification_2:
      question: "What should the subject be?"
      question_type: "TEXT"
      priority: "OPTIONAL"
      default_answer: "Meeting Follow-up (auto-generated)"
      user_answer: "Q4 Planning Meeting - Follow Up"

    clarification_3:
      question: "Should I CC anyone?"
      options: ["Yes, CC my manager", "No, just John"]
      priority: "OPTIONAL"
      default_answer: "No, just John"
      user_answer: "No, just John"

    result: "Email sent to John Smith (CEO) with subject 'Q4 Planning Meeting - Follow Up', no CC"
    total_clarifications: 3

  scenario_3_exceeded_limit:
    initial_request: "Plan a trip"

    clarification_1: "Where do you want to go?"
    clarification_2: "What dates?"
    clarification_3: "What budget?"

    planner_detects_need_for_clarification_4: "What hotel preferences?"

    action: "Abort task, inform user"
    error_message: |
      "This task requires too many clarifications. Please provide more details:
       - Destination
       - Travel dates
       - Budget
       - Hotel preferences
       Then submit a new request."

# Observability
observability:

  metrics:
    - name: "clarification_count_per_task"
      type: "histogram"
      buckets: [0, 1, 2, 3, 4, 5]
      description: "Distribution of clarification count per task"

    - name: "multi_turn_clarification_total"
      type: "counter"
      labels: ["clarification_count"]
      description: "Tasks with 2+ clarifications"

    - name: "clarification_max_exceeded_total"
      type: "counter"
      description: "Tasks aborted due to >3 clarifications"

    - name: "clarification_cumulative_latency_ms"
      type: "histogram"
      buckets: [3000, 6000, 10000, 20000, 30000]
      description: "Total user wait time for all clarifications in task"

  events:
    - name: "multi_turn_clarification"
      fields: ["task_id", "clarification_count", "cumulative_latency_ms", "trace_id"]

    - name: "clarification_max_exceeded"
      fields: ["task_id", "clarification_count", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  protocol_lifecycle: "Multiple UNREQUESTED → RESOLVED cycles per task"

  parent_task_state: "Task Execution EXECUTE phase (Planner planning)"

  related_contracts:
    - "01_clarification_protocol_fsm.yml - FSM lifecycle per clarification"
    - "02_clarification_request_contract.yml - Each clarification has unique clarification_id"
    - "03_clarification_response_contract.yml - Track clarification_count per task"

