# Role Attestation Contract
# Epic 1.3 - Issue 1.3.4 (Bonus) - Security Component 1 of 2
# Version: 1.0.0
# Status: DRAFT
# Owner: Security Team
# ADR References: ADR-0003d (Role Attestation & Capability Verification)

metadata:
  contract_id: "role_attestation"
  contract_name: "Role Attestation Contract"
  version: "1.0.0"
  description: |
    Role attestation contract for HMAC-SHA256 message signature verification.
    Ensures protocol messages come from legitimate agents with proper capabilities.
    Implements contract from ADR-0003d Section "Role Attestation".
  component_type: "pure_agent"
  layer: "layer1_kernel"
  security_critical: true
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

overview:
  purpose: |
    Role Attestation prevents role spoofing and privilege escalation by verifying:
    1. Message signature (HMAC-SHA256 with agent lease secret)
    2. Lease validity (exists, not expired)
    3. Role consistency (sender_role matches lease.role)
    4. Capability authorization (message_type allowed for role)

    This is Phase 1 of the 2-phase validation pipeline (<1ms P95).

  threat_model:
    primary_threats:
      - "Role spoofing: Malicious agent impersonates orchestrator"
      - "Privilege escalation: Agent sends unauthorized message types"
      - "Zombie agents: Expired leases still operating"
      - "Replay attacks: Captured messages replayed later"

    security_properties:
      - "No role spoofing (HMAC-SHA256 prevents impersonation)"
      - "No privilege escalation (PDL role specification enforced)"
      - "Lease expiry enforcement (zombie agents blocked)"
      - "Audit trail (all failures logged with trace_id)"

  research_foundation:
    - "Capability-Based Security (Dennis & Van Horn 1966)"
    - "Message Authentication Codes (Bellare et al. 1996)"
    - "Actor Model (Hewitt 1973) - Message authenticity"

agent_lease_specification:
  AgentLease:
    description: "Agent capability lease with role and signature secret"
    purpose: "Store agent capabilities and role information (issued by Agent Fabric)"
    lifecycle: "Issued during agent hire, expires after duration (default 1 hour)"
    fields:
      lease_id:
        type: "string"
        format: "uuid"
        required: true
        description: "Unique lease identifier"
      agent_id:
        type: "string"
        format: "uuid"
        required: true
        description: "Agent ID (actor_id)"
      role:
        type: "string"
        required: true
        enum: ["orchestrator", "agent", "tool_runner", "system"]
        description: "Agent role in protocol"
      capabilities:
        type: "set<string>"
        required: true
        description: "Set of capabilities (e.g., TOOL_CALL, MCP_ACCESS)"
        examples:
          - "TOOL_CALL"
          - "MCP_ACCESS"
          - "MODEL_HUB_READ"
          - "PLAN_GENERATION"
      signature_secret:
        type: "bytes"
        required: true
        length: 32
        description: "HMAC-SHA256 secret (256-bit random)"
        generation: "secrets.token_bytes(32)"
        security: "MUST be cryptographically random"
      issued_at:
        type: "float"
        required: true
        description: "Unix timestamp (seconds) of lease issuance"
      expires_at:
        type: "float"
        required: true
        description: "Unix timestamp (seconds) of lease expiry"

    operations:
      issue:
        description: "Issue new agent lease"
        input:
          agent_id: "string"
          role: "string"
          capabilities: "set<string>"
          duration_seconds: "int (default 3600)"
        output:
          lease: "AgentLease"
        security:
          - "signature_secret MUST be cryptographically random (32 bytes)"
          - "lease_id MUST be unique (UUID)"
        performance:
          latency_ms: 1

      is_expired:
        description: "Check if lease expired"
        input:
          current_time: "float"
        output:
          expired: "bool"
        algorithm: "current_time > expires_at"
        performance:
          latency_ms: 0.01

      has_capability:
        description: "Check if lease has capability"
        input:
          capability: "string"
        output:
          has_cap: "bool"
        algorithm: "capability in capabilities"
        performance:
          latency_ms: 0.01

    storage:
      format: "in_memory"
      data_structure: "concurrent_hashmap"
      key: "lease_id"
      memory_per_lease_bytes: 256

    example: |
      # Issue lease for AI agent (Planner)
      planner_lease = AgentLease.issue(
          agent_id="agent_planner_01",
          role="agent",
          capabilities={"TOOL_CALL", "MCP_ACCESS", "MODEL_HUB_READ"},
          duration_seconds=3600,  # 1 hour
      )

      # Check validity
      assert not planner_lease.is_expired()
      assert planner_lease.has_capability("TOOL_CALL")

message_envelope_specification:
  ActorMessage:
    description: "Actor message with role attestation fields"
    purpose: "Carry protocol messages with cryptographic signature"
    fields:
      session_id:
        type: "string"
        format: "uuid"
        required: true
        description: "Protocol session ID"
      message_type:
        type: "string"
        required: true
        max_length: 128
        description: "Message type (e.g., HireRequest, Proposal)"
      payload:
        type: "bytes"
        required: true
        max_size_bytes: 65536
        description: "FlatBuffers-serialized message payload"
      cognitive_trace_id:
        type: "string"
        format: "uuid"
        required: true
        description: "OpenTelemetry trace ID"

      # Role attestation fields
      sender_role:
        type: "string"
        required: true
        description: "Sender's role (orchestrator, agent, etc.)"
      sender_agent_id:
        type: "string"
        format: "uuid"
        required: true
        description: "Sender's agent ID"
      sender_lease_id:
        type: "string"
        format: "uuid"
        required: true
        description: "Sender's lease ID"
      signature:
        type: "bytes"
        required: true
        length: 32
        description: "HMAC-SHA256 signature (256-bit)"

    serialization:
      format: "FlatBuffers"
      schema: "layer1_kernel/actor_message.fbs::ActorMessage"
      max_size_bytes: 65536

message_signing_specification:
  MessageSigner:
    description: "Sign Actor messages with HMAC-SHA256"
    purpose: "Compute and attach message signature before sending"
    algorithm: "HMAC-SHA256"

    sign_operation:
      description: "Sign message with agent lease"
      input:
        message_type: "string"
        session_id: "string"
        payload: "bytes"
        lease: "AgentLease"
        trace_id: "string"
      output:
        signed_message: "ActorMessage"

      algorithm: |
        1. Construct message_digest = f"{message_type}:{session_id}:{len(payload)}"
        2. Compute signature = HMAC-SHA256(message_digest + payload, lease.signature_secret)
        3. Build ActorMessage with:
           - Core fields (session_id, message_type, payload, trace_id)
           - Role attestation fields (sender_role, sender_agent_id, sender_lease_id, signature)
        4. Return signed message

      performance:
        hmac_computation_ms: 0.5
        total_latency_ms: 0.6

      security:
        - "HMAC key = lease.signature_secret (32 bytes)"
        - "HMAC algorithm = SHA256 (256-bit output)"
        - "Signature binds message to lease (agent-specific)"

      pseudocode: |
        FUNCTION sign(message_type, session_id, payload, lease, trace_id):
            message_digest = f"{message_type}:{session_id}:{len(payload)}".encode('utf-8')
            signature = HMAC-SHA256(
                key=lease.signature_secret,
                msg=message_digest + payload
            )
            RETURN ActorMessage(
                session_id=session_id,
                message_type=message_type,
                payload=payload,
                cognitive_trace_id=trace_id,
                sender_role=lease.role,
                sender_agent_id=lease.agent_id,
                sender_lease_id=lease.lease_id,
                signature=signature
            )

lease_registry_specification:
  LeaseRegistry:
    description: "Store and lookup agent leases"
    purpose: "O(1) lease lookup for signature verification"

    operations:
      register:
        description: "Register new lease"
        input:
          lease: "AgentLease"
        output:
          success: "bool"
        side_effects:
          - "Lease added to registry (hash table)"
        performance:
          latency_ms: 0.1

      get:
        description: "Get lease by ID"
        input:
          lease_id: "string"
        output:
          lease: "AgentLease | None"
        algorithm: "O(1) hash table lookup"
        performance:
          latency_ms: 0.05

      cleanup_expired:
        description: "Cleanup expired leases (periodic task)"
        input:
          current_time: "float"
        output:
          removed_count: "int"
        algorithm: |
          1. Iterate all leases
          2. Remove if lease.expires_at < current_time
          3. Return count of removed leases
        schedule: "Every 60 seconds"
        performance:
          latency_ms: 10
          max_leases: 10000

    storage:
      data_structure: "concurrent_hashmap"
      key: "lease_id"
      concurrency: "lock_free_reads"
      memory_per_lease_bytes: 256
      max_leases: 10000

role_verification_specification:
  RoleVerifier:
    description: "Verify message signature and role attestation (Phase 1 of 2-phase validation)"
    purpose: "Prevent role spoofing and privilege escalation"
    performance_budget_ms: 1.0

    verify_operation:
      description: "Verify message role attestation"
      input:
        message: "ActorMessage"
        protocol_name: "string"
      output:
        result: "VerificationResult"

      verification_steps:
        step1_lookup_lease:
          description: "Lookup agent lease"
          algorithm: "lease = lease_registry.get(message.sender_lease_id)"
          failure: "Lease not found → BLOCK"
          latency_target_ms: 0.1

        step2_check_expiry:
          description: "Verify lease not expired"
          algorithm: "IF lease.is_expired() → BLOCK"
          failure: "Lease expired → BLOCK"
          latency_target_ms: 0.01

        step3_verify_agent_id:
          description: "Verify sender_agent_id matches lease"
          algorithm: "IF message.sender_agent_id != lease.agent_id → BLOCK"
          failure: "Agent ID mismatch → BLOCK"
          latency_target_ms: 0.01

        step4_verify_role:
          description: "Verify sender_role matches lease.role"
          algorithm: "IF message.sender_role != lease.role → BLOCK"
          failure: "Role mismatch → BLOCK"
          latency_target_ms: 0.01

        step5_verify_signature:
          description: "Verify HMAC-SHA256 signature"
          algorithm: |
            message_digest = f"{message.message_type}:{message.session_id}:{len(message.payload)}"
            expected_signature = HMAC-SHA256(message_digest + message.payload, lease.signature_secret)
            IF not hmac.compare_digest(expected_signature, message.signature) → BLOCK
          failure: "Invalid signature → BLOCK"
          latency_target_ms: 0.5
          security: "Use constant-time comparison (hmac.compare_digest)"

        step6_verify_capability:
          description: "Verify capability for message_type (PDL protocol spec)"
          algorithm: |
            protocol = fsm_registry.get_protocol(protocol_name)
            allowed_roles = get_allowed_roles_for_message(protocol, message.message_type)
            IF message.sender_role not in allowed_roles → BLOCK
          failure: "Role not allowed to send message_type → BLOCK"
          latency_target_ms: 0.1

      total_budget_ms: 1.0

      pseudocode: |
        FUNCTION verify(message, protocol_name):
            start_time = current_time_ms()

            # Step 1: Lookup lease
            lease = lease_registry.get(message.sender_lease_id)
            IF lease is None:
                RETURN VerificationResult(valid=False, reason="Lease not found", action="BLOCK")

            # Step 2: Check expiry
            IF lease.is_expired():
                RETURN VerificationResult(valid=False, reason="Lease expired", action="BLOCK")

            # Step 3: Verify agent ID
            IF message.sender_agent_id != lease.agent_id:
                RETURN VerificationResult(valid=False, reason="Agent ID mismatch", action="BLOCK")

            # Step 4: Verify role
            IF message.sender_role != lease.role:
                RETURN VerificationResult(valid=False, reason="Role mismatch", action="BLOCK")

            # Step 5: Verify signature
            message_digest = f"{message.message_type}:{message.session_id}:{len(message.payload)}"
            expected_sig = HMAC-SHA256(message_digest + message.payload, lease.signature_secret)
            IF not constant_time_compare(expected_sig, message.signature):
                RETURN VerificationResult(valid=False, reason="Invalid signature", action="BLOCK")

            # Step 6: Verify capability
            protocol = fsm_registry.get_protocol(protocol_name)
            IF not check_capability(protocol, message.sender_role, message.message_type):
                RETURN VerificationResult(valid=False, reason="Capability check failed", action="BLOCK")

            # All checks passed
            latency_ms = current_time_ms() - start_time
            emit_metric("role_verification_latency_ms", latency_ms)

            RETURN VerificationResult(valid=True, reason=None, action="PASS")

verification_result_specification:
  VerificationResult:
    description: "Role verification outcome"
    fields:
      valid:
        type: "bool"
        required: true
        description: "True if all checks passed"
      reason:
        type: "string"
        required: false
        description: "Failure reason (if valid=False)"
      action:
        type: "enum"
        values: ["PASS", "BLOCK"]
        required: true
        description: "Decision (PASS → proceed to Phase 2, BLOCK → reject)"

two_phase_integration:
  overview: |
    Role attestation is Phase 1 of 2-phase validation pipeline.

    Phase 1: Role Attestation (<1ms P95)
      → Verify signature, lease, role, capability
      → Result: PASS (proceed to Phase 2) or BLOCK (reject)

    Phase 2: Protocol Validation (<2ms P95)
      → Validate FSM (current_state + message_type)
      → Result: PASS (deliver) or BLOCK (violation)

    Total: <3ms P95 (within <5ms mailbox budget)

  TwoPhaseValidator:
    description: "2-phase validation pipeline"
    phases:
      phase1_role_attestation:
        component: "RoleVerifier"
        latency_budget_ms: 1.0
        on_pass: "Proceed to Phase 2"
        on_block: "Reject immediately, log, metric"

      phase2_protocol_validation:
        component: "ProtocolValidator"
        latency_budget_ms: 2.0
        on_pass: "Deliver message to actor"
        on_block: "Reject, log, metric, execute violation handler"

    pseudocode: |
      FUNCTION validate(message, protocol_name):
          # Phase 1: Role Attestation
          role_result = role_verifier.verify(message, protocol_name)
          IF not role_result.valid:
              log_warning("role_verification_failed", reason=role_result.reason)
              emit_metric("role_verification_failures_total")
              RETURN ValidationResult(valid=False, action="BLOCK")

          # Phase 2: Protocol Validation
          proto_result = protocol_validator.validate(message, protocol_name)
          RETURN proto_result

security_analysis:
  threat_mitigation:
    threat1_role_spoofing:
      attack: "Malicious agent sends message with fake sender_role='orchestrator'"
      mitigation: "HMAC-SHA256 signature verification (requires lease secret)"
      result: "✅ Attack blocked (no lease secret → signature mismatch)"

    threat2_privilege_escalation:
      attack: "Agent sends message type outside capabilities (e.g., Concierge sends ToolRequest)"
      mitigation: "Capability check (PDL protocol role specification)"
      result: "✅ Attack blocked (Concierge role not allowed to send ToolRequest)"

    threat3_replay_attack:
      attack: "Attacker captures signed message, replays later"
      mitigation: "Lease expiry (leases valid for 1 hour, expired leases rejected)"
      result: "⚠️ Partial protection (replay possible within lease duration)"
      future_enhancement: "Add nonce/timestamp to message signature"

    threat4_lease_theft:
      attack: "Attacker steals agent's lease secret (memory dump, side channel)"
      mitigation: "Lease rotation (periodic re-issue), memory protection"
      result: "⚠️ Partial protection (stolen lease valid until expiry)"
      future_enhancement: "Hardware security module (HSM) for lease storage"

    threat5_signature_forgery:
      attack: "Attacker forges HMAC-SHA256 signature without lease secret"
      mitigation: "HMAC-SHA256 cryptographic strength (256-bit secret, collision-resistant)"
      result: "✅ Computationally infeasible (2^256 brute force)"

  security_properties:
    - property: "No role spoofing"
      guarantee: "Agent cannot send message with role ≠ lease.role"
      proof: "HMAC-SHA256 signature binds message to lease secret, lease secret unique per agent"

    - property: "No privilege escalation"
      guarantee: "Agent cannot send message_type outside lease.capabilities"
      proof: "RoleVerifier checks PDL protocol role specification, blocks unauthorized messages"

    - property: "Lease expiry enforcement"
      guarantee: "Expired leases rejected, zombie agents blocked"
      proof: "RoleVerifier checks lease.expires_at < current_time, blocks expired"

    - property: "Audit trail"
      guarantee: "All role verification failures logged with trace_id"
      proof: "Structured logs in RoleVerifier, Prometheus metrics for failures"

    - property: "Constant-time comparison"
      guarantee: "HMAC signature comparison not vulnerable to timing attacks"
      proof: "hmac.compare_digest() uses constant-time comparison (Python standard library)"

performance_requirements:
  latency_targets:
    hmac_computation_ms: 0.5
    lease_lookup_ms: 0.1
    role_verification_total_ms: 1.0
    two_phase_validation_ms: 3.0
    description: "Per-operation latency targets (P95)"

  throughput_targets:
    verifications_per_second: 100000
    description: "System-wide verification capacity"

  resource_limits:
    memory_per_lease_bytes: 256
    max_leases: 10000
    signature_secret_length: 32
    description: "Resource constraints"

observability:
  metrics:
    counters:
      - name: "role_verification_total"
        labels: ["protocol_name", "result"]
      - name: "role_verification_failures_total"
        labels: ["protocol_name", "reason"]
      - name: "lease_expiry_blocked_total"
        labels: ["agent_id"]
      - name: "signature_mismatch_total"
        labels: ["protocol_name"]

    histograms:
      - name: "role_verification_latency_ms"
        buckets: [0.5, 1, 2, 5]
        labels: ["protocol_name"]
      - name: "hmac_computation_latency_ms"
        buckets: [0.1, 0.25, 0.5, 1]
      - name: "lease_lookup_latency_ms"
        buckets: [0.05, 0.1, 0.2, 0.5]

    gauges:
      - name: "active_leases"
        description: "Number of active leases"
      - name: "expired_leases_pending_cleanup"
        description: "Number of expired leases pending cleanup"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "session_id"
      - "message_type"
      - "sender_role"
      - "sender_agent_id"
      - "verification_result"
      - "trace_id"

    log_levels:
      verification_failed: "WARN"
      signature_mismatch: "ERROR"
      lease_expired: "WARN"
      lease_not_found: "ERROR"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 0.1
    spans:
      - name: "role_verification"
        attributes: ["protocol_name", "sender_role", "result"]

testing_requirements:
  unit_tests:
    - test_agent_lease_issuance
    - test_lease_expiry_check
    - test_message_signing
    - test_signature_verification_valid
    - test_signature_verification_invalid
    - test_lease_lookup
    - test_role_mismatch_detection
    - test_capability_check

  integration_tests:
    - test_complete_verification_flow
    - test_role_spoofing_blocked
    - test_expired_lease_blocked
    - test_two_phase_validation

  security_tests:
    - test_signature_forgery_blocked
    - test_role_impersonation_blocked
    - test_privilege_escalation_blocked
    - test_constant_time_comparison

  performance_tests:
    - test_verification_latency_under_1ms
    - test_throughput_100k_verifications_per_second
    - test_hmac_computation_under_500us

compliance:
  adr_references:
    - "ADR-0003d: Role Attestation & Capability Verification"
    - "ADR-0010: Capability-Based Security"
    - "ADR-0002: Actor Model (mailbox hooks)"

  research_validation:
    - citation: "Capability-Based Security (Dennis & Van Horn 1966)"
      compliance: "Implements fine-grained access control with capabilities"
    - citation: "Message Authentication Codes (Bellare et al. 1996)"
      compliance: "Uses HMAC-SHA256 for cryptographic message authentication"

  performance_requirements:
    - "Role verification must be <1ms P95"
    - "HMAC computation must be <0.5ms P95"
    - "Two-phase validation must be <3ms P95"

  security_requirements:
    - "Signature secret must be 256-bit cryptographically random"
    - "Signature comparison must be constant-time"
    - "Expired leases must be rejected"
    - "All verification failures must be logged"

cross_references:
  related_contracts:
    - contract: "capability_verification.yml"
      relationship: "works_with"
    - contract: "protocol_monitor_api.yml"
      relationship: "integrates_with"
    - contract: "fsm_execution_contract.yml"
      relationship: "phase_2_of"

notes:
  - "Role attestation is Phase 1 of 2-phase validation pipeline"
  - "HMAC-SHA256 with 256-bit secret prevents role spoofing"
  - "Lease expiry (1 hour default) prevents zombie agents"
  - "Constant-time comparison prevents timing attacks"
  - "Replay attacks partially mitigated (within lease duration)"
  - "Future enhancement: Add nonce/timestamp for full replay protection"
  - "Future enhancement: HSM for lease secret storage"
