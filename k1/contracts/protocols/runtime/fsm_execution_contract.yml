# FSM Execution Contract
# Epic 1.3 - Issue 1.3.3 - Runtime Component 2 of 4
# Version: 1.0.0
# Status: DRAFT
# Owner: Protocol Team
# ADR References: ADR-0003c (Protocol Monitor Runtime), ADR-0003a (PDL Specification)

metadata:
  contract_id: "fsm_execution_contract"
  contract_name: "FSM Execution Contract"
  version: "1.0.0"
  description: |
    FSM execution engine contract for state transitions, lookup tables, and validation.
    Defines data structures and algorithms for runtime protocol enforcement.
    Implements contract from ADR-0003c Section 4 (FSM Execution).
  component_type: "pure_agent"
  layer: "layer1_kernel"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

execution_model:
  overview: |
    FSM Execution Engine performs receive-side validation of protocol compliance.
    It uses compiled FSM lookup tables for O(1) transition validation and state management.
    All operations must complete within 2ms mailbox budget.

  design_principles:
    - "O(1) transition lookup using hash tables"
    - "Zero-copy validation where possible"
    - "Stateless validation functions"
    - "Pre-computed transition maps"
    - "Fail-fast error detection"

  execution_flow:
    - step: "1. Message arrives in mailbox"
      duration_target_ms: 0
    - step: "2. Extract session_id, from_state, to_state, trigger, role"
      duration_target_ms: 0.1
    - step: "3. Lookup FSM definition from registry"
      duration_target_ms: 0.5
    - step: "4. Lookup transition in transition_map"
      duration_target_ms: 0.2
    - step: "5. Validate guard conditions"
      duration_target_ms: 0.5
    - step: "6. Validate role permissions"
      duration_target_ms: 0.3
    - step: "7. Execute violation handler if needed"
      duration_target_ms: 0.4
    - step: "8. Update session state"
      duration_target_ms: 0.3
    - step: "9. Return validation result"
      duration_target_ms: 0.2
  total_budget_ms: 2.5

data_structures:
  CompiledFSM:
    description: "Compiled FSM definition with lookup tables"
    flatbuffers_schema: "layer1_kernel/protocol_monitor.fbs::CompiledFSM"
    fields:
      protocol_id:
        type: "string"
        description: "Protocol identifier (e.g., 'agent_hire')"
      version:
        type: "string"
        description: "Semantic version"
      state_count:
        type: "uint16"
        description: "Total number of states"
      transition_count:
        type: "uint16"
        description: "Total number of transitions"
      states:
        type: "vector<StateInfo>"
        description: "Array of state definitions"
      transitions:
        type: "vector<Transition>"
        description: "Array of transition definitions"
      transition_map:
        type: "map<string, TransitionIndex>"
        description: "O(1) transition lookup: 'from_state:trigger' → transition index"
      role_permissions:
        type: "map<string, RolePermissions>"
        description: "Role-based permissions map"
      timeout_policies:
        type: "vector<TimeoutPolicy>"
        description: "Array of timeout policies"
    serialization:
      format: "FlatBuffers"
      max_size_bytes: 65536
      compile_time_ms: 100

  StateInfo:
    description: "State definition with metadata"
    flatbuffers_schema: "layer1_kernel/protocol_monitor.fbs::StateInfo"
    fields:
      state_id:
        type: "string"
        max_length: 64
      state_type:
        type: "enum"
        values: ["initial", "intermediate", "final"]
      valid_roles:
        type: "vector<string>"
        description: "Roles allowed in this state"
      timeout_policy_index:
        type: "int16"
        description: "Index into timeout_policies (-1 if none)"
      estimated_duration_ms:
        type: "uint32"
        description: "Expected state duration"
    size_bytes: 128

  Transition:
    description: "Transition definition with validation rules"
    flatbuffers_schema: "layer1_kernel/protocol_monitor.fbs::Transition"
    fields:
      transition_id:
        type: "string"
        max_length: 128
      from_state:
        type: "string"
        max_length: 64
      to_state:
        type: "string"
        max_length: 64
      trigger:
        type: "string"
        max_length: 64
      guard_conditions:
        type: "vector<string>"
        description: "Conditions that must be true"
      sender_role:
        type: "string"
        max_length: 64
      receiver_role:
        type: "string"
        max_length: 64
      message_type:
        type: "string"
        max_length: 128
      max_duration_ms:
        type: "uint32"
        description: "Maximum transition duration"
    size_bytes: 512

  TransitionIndex:
    description: "Compact transition lookup result"
    fields:
      transition_index:
        type: "uint16"
        description: "Index into transitions array"
      validation_flags:
        type: "uint16"
        description: "Bitfield for fast validation checks"
    size_bytes: 4

  RolePermissions:
    description: "Role-based permissions"
    flatbuffers_schema: "layer1_kernel/protocol_monitor.fbs::RolePermissions"
    fields:
      role_id:
        type: "string"
        max_length: 64
      allowed_states:
        type: "vector<string>"
        description: "States this role can be in"
      can_send:
        type: "vector<string>"
        description: "Message types this role can send"
      can_receive:
        type: "vector<string>"
        description: "Message types this role can receive"
      attestation_required:
        type: "bool"
    size_bytes: 256

  TimeoutPolicy:
    description: "Timeout enforcement policy"
    flatbuffers_schema: "layer1_kernel/protocol_monitor.fbs::TimeoutPolicy"
    fields:
      timeout_id:
        type: "string"
        max_length: 64
      duration_ms:
        type: "uint32"
      scope:
        type: "enum"
        values: ["state", "transition", "protocol"]
      action_on_timeout:
        type: "enum"
        values: ["abort", "fallback", "warn"]
      fallback_transition:
        type: "string"
        required: false
    size_bytes: 128

algorithms:
  transition_validation:
    name: "validate_transition"
    description: "O(1) transition validation using lookup tables"
    input:
      - session_state: "SessionState"
      - fsm: "CompiledFSM"
      - from_state: "string"
      - to_state: "string"
      - trigger: "string"
      - sender_role: "string"
    output:
      - validation_result: "enum (valid | invalid)"
      - violation_type: "string (optional)"
    pseudocode: |
      1. Construct lookup_key = f"{from_state}:{trigger}"
      2. transition_idx = fsm.transition_map.get(lookup_key)
      3. IF transition_idx is None:
           RETURN (invalid, "invalid_transition")
      4. transition = fsm.transitions[transition_idx]
      5. IF transition.to_state != to_state:
           RETURN (invalid, "state_mismatch")
      6. IF sender_role not in transition.sender_role:
           RETURN (invalid, "invalid_role")
      7. FOR condition in transition.guard_conditions:
           IF not evaluate_condition(condition, session_state):
              RETURN (invalid, "guard_condition_failed")
      8. RETURN (valid, None)
    complexity:
      time: "O(1) average, O(n) worst case for guard conditions"
      space: "O(1)"
    performance:
      target_latency_ms: 2
      max_guard_conditions: 5

  timeout_checking:
    name: "check_timeout"
    description: "Check if current state has exceeded timeout"
    input:
      - session_state: "SessionState"
      - fsm: "CompiledFSM"
      - current_time_ms: "uint64"
    output:
      - timeout_exceeded: "bool"
      - timeout_policy: "TimeoutPolicy (optional)"
    pseudocode: |
      1. current_state_info = fsm.states[session_state.current_state]
      2. IF current_state_info.timeout_policy_index < 0:
           RETURN (false, None)
      3. timeout_policy = fsm.timeout_policies[current_state_info.timeout_policy_index]
      4. state_duration_ms = current_time_ms - session_state.state_entry_timestamp
      5. IF state_duration_ms > timeout_policy.duration_ms:
           RETURN (true, timeout_policy)
      6. RETURN (false, None)
    complexity:
      time: "O(1)"
      space: "O(1)"
    performance:
      target_latency_ms: 0.5

  role_validation:
    name: "validate_role"
    description: "Validate role permissions for state and message"
    input:
      - fsm: "CompiledFSM"
      - role: "string"
      - state: "string"
      - message_type: "string"
      - direction: "enum (send | receive)"
    output:
      - validation_result: "enum (valid | invalid)"
      - violation_type: "string (optional)"
    pseudocode: |
      1. role_perms = fsm.role_permissions.get(role)
      2. IF role_perms is None:
           RETURN (invalid, "unknown_role")
      3. IF state not in role_perms.allowed_states:
           RETURN (invalid, "invalid_role_for_state")
      4. IF direction == "send":
           IF message_type not in role_perms.can_send:
              RETURN (invalid, "role_cannot_send_message")
      5. ELSE:
           IF message_type not in role_perms.can_receive:
              RETURN (invalid, "role_cannot_receive_message")
      6. RETURN (valid, None)
    complexity:
      time: "O(1) average"
      space: "O(1)"
    performance:
      target_latency_ms: 0.3

  guard_condition_evaluation:
    name: "evaluate_condition"
    description: "Evaluate guard condition from transition"
    input:
      - condition: "string"
      - session_state: "SessionState"
    output:
      - result: "bool"
    pseudocode: |
      1. MATCH condition:
         CASE "agent_in_active_state":
              RETURN session_state.context.get("agent_state") == "ACTIVE"
         CASE "no_conflicting_tasks":
              RETURN session_state.context.get("conflicting_tasks") == 0
         CASE "plan_has_executable_steps":
              RETURN len(session_state.context.get("plan_steps", [])) > 0
         // Add more condition types as needed
         DEFAULT:
              log_warning("Unknown guard condition: {condition}")
              RETURN false
    complexity:
      time: "O(1) per condition"
      space: "O(1)"
    performance:
      target_latency_ms: 0.1
    extensibility: "Add new condition types without recompiling FSMs"

optimization_strategies:
  transition_lookup:
    strategy: "Pre-computed hash map"
    description: |
      Compile-time generation of transition_map: "from_state:trigger" → transition_index.
      Eliminates linear search through transitions array.
    performance_gain: "O(n) → O(1) lookup"
    memory_cost: "~4 bytes per transition"

  role_permission_caching:
    strategy: "Inline role checks"
    description: |
      Store allowed_states and message permissions inline with transitions.
      Avoids secondary lookup in role_permissions map.
    performance_gain: "~0.2ms per validation"
    memory_cost: "~64 bytes per transition"

  zero_copy_validation:
    strategy: "FlatBuffers zero-copy access"
    description: |
      Access FSM fields directly from serialized buffer without deserialization.
      Critical for <2ms validation latency.
    performance_gain: "~0.5ms per validation"
    memory_cost: "None (reduces memory usage)"

  guard_condition_bitflags:
    strategy: "Pre-evaluated common conditions"
    description: |
      Encode common guard conditions as bitflags in TransitionIndex.
      Fast bitwise AND check instead of string comparison.
    performance_gain: "~0.3ms per guard condition"
    memory_cost: "2 bytes per transition"

validation_modes:
  strict_mode:
    description: "Full validation with all checks"
    enabled_checks:
      - "transition_validity"
      - "role_permissions"
      - "guard_conditions"
      - "timeout_enforcement"
      - "message_schema"
    latency_budget_ms: 2.5
    use_case: "Production deployments"

  permissive_mode:
    description: "Validation with warnings, no blocking"
    enabled_checks:
      - "transition_validity"
      - "timeout_enforcement"
    latency_budget_ms: 1.5
    use_case: "Development and testing"

  monitoring_mode:
    description: "Logging only, no validation"
    enabled_checks: []
    latency_budget_ms: 0.5
    use_case: "Performance profiling"

performance_requirements:
  latency_targets:
    transition_validation_p95_ms: 2
    timeout_check_p95_ms: 0.5
    role_validation_p95_ms: 0.3
    guard_evaluation_p95_ms: 0.1
    description: "Per-operation latency targets"

  throughput_targets:
    validations_per_second: 100000
    concurrent_sessions: 10000
    description: "System-wide throughput"

  resource_limits:
    memory_per_fsm_kb: 64
    memory_per_session_kb: 8
    max_guard_conditions_per_transition: 5
    description: "Resource constraints"

observability:
  metrics:
    counters:
      - name: "fsm_transitions_validated_total"
        labels: ["protocol_id", "from_state", "to_state", "result"]
      - name: "fsm_violations_detected_total"
        labels: ["protocol_id", "violation_type"]
      - name: "fsm_timeouts_detected_total"
        labels: ["protocol_id", "state"]
      - name: "fsm_guard_failures_total"
        labels: ["protocol_id", "condition"]

    histograms:
      - name: "fsm_validation_latency_ms"
        buckets: [0.5, 1, 2, 5, 10]
        labels: ["protocol_id"]
      - name: "fsm_lookup_latency_ms"
        buckets: [0.1, 0.25, 0.5, 1]
      - name: "fsm_guard_evaluation_latency_ms"
        buckets: [0.05, 0.1, 0.2, 0.5]

    gauges:
      - name: "fsm_loaded_count"
        description: "Number of loaded FSM definitions"
      - name: "fsm_memory_usage_bytes"
        description: "Total memory used by FSMs"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "session_id"
      - "protocol_id"
      - "from_state"
      - "to_state"
      - "validation_result"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 0.1
    spans:
      - name: "fsm_transition_validation"
        attributes: ["protocol_id", "transition_id"]

testing_requirements:
  unit_tests:
    - test_transition_lookup_o1
    - test_role_validation
    - test_guard_condition_evaluation
    - test_timeout_checking

  integration_tests:
    - test_complete_protocol_validation
    - test_concurrent_session_validation
    - test_violation_detection

  performance_tests:
    - test_validation_latency_under_2ms
    - test_throughput_100k_validations_per_second
    - test_zero_copy_flatbuffers_access

  correctness_tests:
    - test_all_6_core_protocols
    - test_invalid_transitions_blocked
    - test_role_violations_detected
    - test_timeout_enforcement

compliance:
  adr_references:
    - "ADR-0003c: Protocol Monitor Runtime (Section 4 - FSM Execution)"
    - "ADR-0003a: PDL Specification (Compilation to FSM)"

  performance_requirements:
    - "Transition validation must be <2ms P95"
    - "Timeout checking must be <0.5ms P95"
    - "Role validation must be <0.3ms P95"
    - "Must fit within 5ms mailbox budget"

  correctness_requirements:
    - "All invalid transitions must be blocked"
    - "All role violations must be detected"
    - "All timeouts must be enforced"
    - "Guard conditions must be evaluated correctly"

cross_references:
  related_contracts:
    - contract: "protocol_monitor_api.yml"
      relationship: "implements_for"
    - contract: "pdl_compiler_contract.yml"
      relationship: "consumes_output_of"
    - contract: "violation_handlers.yml"
      relationship: "invokes"

notes:
  - "FSM execution is O(1) for transition lookup using pre-computed hash maps"
  - "Zero-copy FlatBuffers access is critical for <2ms latency"
  - "Guard conditions are evaluated in sequence (early exit on failure)"
  - "Role validation uses inline permissions to avoid secondary lookup"
  - "All FSMs are immutable after compilation"
  - "Session state updates use lock-free concurrent hashmap"
