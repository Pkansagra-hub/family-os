# Violation Handlers Contract
# Epic 1.3 - Issue 1.3.3 - Runtime Component 3 of 4
# Version: 1.0.0
# Status: DRAFT
# Owner: Protocol Team
# ADR References: ADR-0003c (Protocol Monitor Runtime)

metadata:
  contract_id: "violation_handlers"
  contract_name: "Violation Handlers Contract"
  version: "1.0.0"
  description: |
    Violation handler specifications for 6 protocol violation actions.
    Defines handlers for block, warn, dlq, repair, fallback, and abort actions.
    Implements contract from ADR-0003c Section 5 (Violation Handlers).
  component_type: "pure_agent"
  layer: "layer1_kernel"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

violation_types:
  out_of_order_message:
    violation_id: "out_of_order_message"
    description: "Message received in incorrect sequence"
    severity: "HIGH"
    default_action: "block"
    detection_method: "FSM transition validation"
    examples:
      - "Receiving ExecutionPlan before TaskAnnouncement"
      - "Receiving TaskResult before plan execution"

  invalid_role:
    violation_id: "invalid_role"
    description: "Role lacks permission for current operation"
    severity: "CRITICAL"
    default_action: "block"
    detection_method: "Role permission validation"
    examples:
      - "Agent attempting transition reserved for orchestrator"
      - "Unauthorized message send/receive"

  timeout_exceeded:
    violation_id: "timeout_exceeded"
    description: "State or transition duration exceeded limit"
    severity: "MEDIUM"
    default_action: "fallback"
    detection_method: "Timeout policy checking"
    examples:
      - "Planning stage exceeds 5000ms"
      - "Tool execution exceeds 5000ms"

  guard_condition_failed:
    violation_id: "guard_condition_failed"
    description: "Guard condition evaluated to false"
    severity: "HIGH"
    default_action: "block"
    detection_method: "Guard condition evaluation"
    examples:
      - "Agent not in ACTIVE state"
      - "Required capabilities missing"

  message_schema_invalid:
    violation_id: "message_schema_invalid"
    description: "Message payload fails schema validation"
    severity: "HIGH"
    default_action: "block"
    detection_method: "FlatBuffers schema validation"
    examples:
      - "Missing required field"
      - "Invalid field type"

  deadlock_detected:
    violation_id: "deadlock_detected"
    description: "Protocol entered deadlock state"
    severity: "CRITICAL"
    default_action: "abort"
    detection_method: "Deadlock detection algorithm"
    examples:
      - "Circular wait between agents"
      - "No valid transitions from current state"

violation_actions:
  block:
    action_id: "block"
    description: "Block message and prevent state transition"
    severity_threshold: "HIGH"
    side_effects:
      - "Message dropped"
      - "Session state unchanged"
      - "Violation logged"
      - "Metric incremented"
    recovery_strategy: "none"
    performance:
      latency_ms: 0.5
    handler_pseudocode: |
      FUNCTION handle_block(session, violation):
          log_violation(session, violation, level="ERROR")
          increment_metric("violations_blocked_total", violation.type)
          emit_trace_event("violation_blocked", session.trace_id)
          RETURN ActionResult(
              action="block",
              message_dropped=true,
              state_unchanged=true
          )

  warn:
    action_id: "warn"
    description: "Log warning and allow operation to continue"
    severity_threshold: "LOW"
    side_effects:
      - "Message processed"
      - "State transition proceeds"
      - "Warning logged"
      - "Metric incremented"
    recovery_strategy: "none"
    performance:
      latency_ms: 0.3
    handler_pseudocode: |
      FUNCTION handle_warn(session, violation):
          log_violation(session, violation, level="WARN")
          increment_metric("violations_warned_total", violation.type)
          emit_trace_event("violation_warned", session.trace_id)
          RETURN ActionResult(
              action="warn",
              message_dropped=false,
              state_unchanged=false
          )

  dlq:
    action_id: "dlq"
    description: "Send message to dead-letter queue for manual review"
    severity_threshold: "MEDIUM"
    side_effects:
      - "Message sent to DLQ"
      - "Session state unchanged"
      - "Violation logged"
      - "Metric incremented"
      - "Alert sent to operators"
    recovery_strategy: "manual_review"
    performance:
      latency_ms: 2.0
    handler_pseudocode: |
      FUNCTION handle_dlq(session, violation):
          log_violation(session, violation, level="ERROR")
          increment_metric("violations_dlq_total", violation.type)
          dlq_id = send_to_dlq(session, violation)
          emit_trace_event("violation_dlq", session.trace_id, dlq_id=dlq_id)
          notify_operators(session, violation, dlq_id)
          RETURN ActionResult(
              action="dlq",
              message_dropped=true,
              state_unchanged=true,
              dlq_id=dlq_id
          )
    dlq_configuration:
      queue_name: "protocol_violations_dlq"
      retention_days: 7
      max_queue_size: 10000
      alert_threshold: 100

  repair:
    action_id: "repair"
    description: "Attempt automatic repair of violation"
    severity_threshold: "MEDIUM"
    side_effects:
      - "Repair action executed"
      - "State potentially modified"
      - "Repair logged"
      - "Metric incremented"
    recovery_strategy: "automatic_repair"
    performance:
      latency_ms: 1.5
    handler_pseudocode: |
      FUNCTION handle_repair(session, violation):
          log_violation(session, violation, level="WARN")
          increment_metric("violations_repair_attempted_total", violation.type)

          repair_result = execute_repair_strategy(session, violation)

          IF repair_result.success:
              increment_metric("violations_repair_success_total", violation.type)
              emit_trace_event("violation_repaired", session.trace_id)
              RETURN ActionResult(
                  action="repair",
                  message_dropped=false,
                  state_unchanged=false,
                  repair_applied=true
              )
          ELSE:
              increment_metric("violations_repair_failed_total", violation.type)
              emit_trace_event("violation_repair_failed", session.trace_id)
              RETURN handle_fallback(session, violation)
    repair_strategies:
      out_of_order_message:
        strategy: "reorder_buffer"
        description: "Buffer message and process when state is ready"
      timeout_exceeded:
        strategy: "extend_timeout"
        description: "Grant one-time timeout extension"
      guard_condition_failed:
        strategy: "retry_after_delay"
        description: "Retry after 100ms delay"

  fallback:
    action_id: "fallback"
    description: "Execute fallback transition to safe state"
    severity_threshold: "HIGH"
    side_effects:
      - "Fallback transition executed"
      - "State changed to fallback state"
      - "Original message dropped"
      - "Violation logged"
      - "Metric incremented"
    recovery_strategy: "safe_state_transition"
    performance:
      latency_ms: 1.0
    handler_pseudocode: |
      FUNCTION handle_fallback(session, violation):
          log_violation(session, violation, level="ERROR")
          increment_metric("violations_fallback_total", violation.type)

          fallback_transition = get_fallback_transition(session, violation)

          IF fallback_transition is not None:
              execute_transition(session, fallback_transition)
              emit_trace_event("violation_fallback", session.trace_id,
                             fallback_state=fallback_transition.to_state)
              RETURN ActionResult(
                  action="fallback",
                  message_dropped=true,
                  state_unchanged=false,
                  fallback_state=fallback_transition.to_state
              )
          ELSE:
              log_error("No fallback transition available")
              RETURN handle_abort(session, violation)

  abort:
    action_id: "abort"
    description: "Abort protocol session immediately"
    severity_threshold: "CRITICAL"
    side_effects:
      - "Session terminated"
      - "Cleanup actions executed"
      - "Parent protocol notified"
      - "Violation logged"
      - "Metric incremented"
      - "Incident created"
    recovery_strategy: "terminate_session"
    performance:
      latency_ms: 2.0
    handler_pseudocode: |
      FUNCTION handle_abort(session, violation):
          log_violation(session, violation, level="CRITICAL")
          increment_metric("violations_abort_total", violation.type)

          cleanup_resources(session)
          notify_parent_protocol(session, violation)
          create_incident(session, violation)
          terminate_session(session)

          emit_trace_event("violation_abort", session.trace_id)

          RETURN ActionResult(
              action="abort",
              message_dropped=true,
              state_unchanged=true,
              session_terminated=true
          )

action_selection_policy:
  severity_based:
    description: "Select action based on violation severity"
    rules:
      - severity: "LOW"
        default_action: "warn"
      - severity: "MEDIUM"
        default_action: "repair"
      - severity: "HIGH"
        default_action: "block"
      - severity: "CRITICAL"
        default_action: "abort"

  protocol_specific:
    description: "Override default action based on protocol configuration"
    example: |
      # In agent_hire.pdl.yml:
      violation_handlers:
        out_of_order_message:
          action: block  # Override default
          severity: HIGH

  cascading_fallback:
    description: "Cascade to more severe action if recovery fails"
    cascade_chain:
      - action: "repair"
        on_failure: "fallback"
      - action: "fallback"
        on_failure: "abort"
      - action: "block"
        on_failure: "dlq"

violation_context:
  ViolationContext:
    description: "Context information for violation handling"
    fields:
      session_id:
        type: "string"
        format: "uuid"
      protocol_id:
        type: "string"
      violation_type:
        type: "string"
      severity:
        type: "enum"
        values: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
      current_state:
        type: "string"
      attempted_transition:
        type: "string"
      sender_role:
        type: "string"
      receiver_role:
        type: "string"
      message_type:
        type: "string"
      error_message:
        type: "string"
      timestamp:
        type: "integer"
      trace_id:
        type: "string"
        format: "uuid"

handler_configuration:
  global_settings:
    default_action_mode: "strict"
    enable_repair_strategies: true
    enable_dlq: true
    enable_cascading_fallback: true
    max_repair_attempts: 3
    dlq_batch_size: 100
    dlq_flush_interval_ms: 1000

  per_protocol_overrides:
    agent_hire:
      out_of_order_message: "block"
      timeout_exceeded: "fallback"
    task_execution:
      timeout_exceeded: "abort"
      guard_condition_failed: "repair"
    barge_in:
      out_of_order_message: "warn"
      timeout_exceeded: "warn"

performance_requirements:
  latency_targets:
    block_action_ms: 0.5
    warn_action_ms: 0.3
    dlq_action_ms: 2.0
    repair_action_ms: 1.5
    fallback_action_ms: 1.0
    abort_action_ms: 2.0
    description: "Per-action latency targets"

  throughput_targets:
    violations_per_second: 1000
    description: "System-wide violation handling capacity"

  resource_limits:
    max_dlq_size: 10000
    max_repair_buffer_size: 1000
    memory_per_violation_kb: 4
    description: "Resource constraints"

observability:
  metrics:
    counters:
      - name: "violations_detected_total"
        labels: ["protocol_id", "violation_type", "severity"]
      - name: "violations_blocked_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_warned_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_dlq_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_repair_attempted_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_repair_success_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_repair_failed_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_fallback_total"
        labels: ["protocol_id", "violation_type"]
      - name: "violations_abort_total"
        labels: ["protocol_id", "violation_type"]

    histograms:
      - name: "violation_handler_latency_ms"
        buckets: [0.5, 1, 2, 5, 10]
        labels: ["action"]
      - name: "repair_duration_ms"
        buckets: [0.5, 1, 1.5, 2, 5]

    gauges:
      - name: "dlq_size"
        description: "Current DLQ size"
      - name: "repair_buffer_size"
        description: "Current repair buffer size"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "session_id"
      - "protocol_id"
      - "violation_type"
      - "action"
      - "severity"
      - "trace_id"

    log_levels:
      LOW: "WARN"
      MEDIUM: "ERROR"
      HIGH: "ERROR"
      CRITICAL: "CRITICAL"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0
    spans:
      - name: "violation_handling"
        attributes: ["violation_type", "action", "severity"]

testing_requirements:
  unit_tests:
    - test_block_action
    - test_warn_action
    - test_dlq_action
    - test_repair_strategies
    - test_fallback_action
    - test_abort_action
    - test_action_selection_policy

  integration_tests:
    - test_complete_violation_flow
    - test_cascading_fallback
    - test_dlq_processing
    - test_repair_success_and_failure

  chaos_tests:
    - test_high_violation_rate
    - test_dlq_overflow
    - test_repair_buffer_overflow

compliance:
  adr_references:
    - "ADR-0003c: Protocol Monitor Runtime (Section 5 - Violation Handlers)"

  performance_requirements:
    - "Block action must be <0.5ms"
    - "Warn action must be <0.3ms"
    - "All actions must fit within 5ms mailbox budget"

  reliability_requirements:
    - "All violations must be logged"
    - "DLQ must not lose messages"
    - "Abort must cleanup all resources"

cross_references:
  related_contracts:
    - contract: "protocol_monitor_api.yml"
      relationship: "used_by"
    - contract: "fsm_execution_contract.yml"
      relationship: "invoked_by"

notes:
  - "6 violation actions: block, warn, dlq, repair, fallback, abort"
  - "Action selection based on severity and protocol configuration"
  - "Repair strategies are violation-type specific"
  - "DLQ enables manual review of violations"
  - "Cascading fallback prevents infinite repair loops"
  - "All actions have strict latency budgets (<2ms for most)"
