# Agent Hire Protocol - Activation Contracts
# File: contracts/protocols/agent_hire/05_activation_contracts.yml
# Purpose: WARMING → ACTIVE state transition with health checks
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-AGENT-HIRE-ACTIVATION-005"
  name: "Agent Activation Contracts"
  version: "1.0"

# Activation flow (WARMING → ACTIVE)
activation:

  trigger: "Warmup phase 4 (health check) completes successfully"
  state_transition: "Agent state: WARMING → ACTIVE"
  duration_budget_ms: 50        # Health check <50ms

  health_check_protocol:
    description: "Ping-pong health check between Supervisor and Agent"
    timeout_ms: 10              # Agent must respond within 10ms

    flow:
      step_1: "Supervisor sends HealthCheck (ping) to Agent"
      step_2: "Agent receives HealthCheck (verified signature)"
      step_3: "Agent processes ping (validate mailbox, verify health)"
      step_4: "Agent sends HealthCheckResponse (pong)"
      step_5: "Supervisor receives HealthCheckResponse (verify signature)"
      step_6: "Supervisor validates response"
      step_7: "On success: Agent transitions to ACTIVE"
      step_8: "On failure: Retry 3 times (30ms total)"

    message_schemas:
      health_check_request: |
        HealthCheckRequest {
          agent_id: string;
          check_id: uint64;
          timestamp_ns: uint64;
          signature: bytes[32];  // HMAC-SHA256
        }

      health_check_response: |
        HealthCheckResponse {
          agent_id: string;
          check_id: uint64;
          status: enum [OK, UNHEALTHY, OVERLOADED];
          memory_mb: uint32;
          cpu_percent: ubyte;
          latency_ms: uint32;
          timestamp_ns: uint64;
          signature: bytes[32];  // HMAC-SHA256
        }

  success_criteria:
    - "Agent responds within 10ms"
    - "Response signature valid (HMAC-SHA256)"
    - "Agent status = OK (not UNHEALTHY, not OVERLOADED)"
    - "Memory utilization < 80%"
    - "CPU utilization < 80%"

  failure_modes:
    - code: "NO_RESPONSE"
      description: "Agent doesn't respond within 10ms"
      recovery: "RETRY 3 times (30ms total), then FAIL"
      action: "Mark agent as CRASHED"

    - code: "INVALID_SIGNATURE"
      description: "Response signature doesn't match"
      recovery: "Log security incident, mark agent as CRASHED"
      action: "Revoke lease, terminate agent"

    - code: "UNHEALTHY"
      description: "Agent reports unhealthy status"
      recovery: "RETRY health check 1 time, then FAIL"
      action: "Restart agent or fail hire"

    - code: "OVERLOADED"
      description: "Agent reports overloaded (memory/CPU high)"
      recovery: "Try different agent, skip this agent"
      action: "Continue with next candidate"

# Activation observability
observability:

  metrics:
    - name: "activation_health_check_latency_ms"
      type: "histogram"
      buckets: [1, 5, 10, 20, 50]
      description: "Health check response latency"

    - name: "activation_failures_total"
      type: "counter"
      labels: ["reason"]
      description: "Activation failures"

    - name: "agents_activated_total"
      type: "counter"
      description: "Successful agent activations"

    - name: "agents_active"
      type: "gauge"
      description: "Currently active agents"

  events:
    - name: "health_check_sent"
      fields: ["agent_id", "check_id", "trace_id"]

    - name: "health_check_response_received"
      fields: ["agent_id", "check_id", "latency_ms", "status"]

    - name: "agent_activated"
      fields: ["agent_id", "total_warmup_latency_ms", "trace_id"]

    - name: "activation_failed"
      fields: ["agent_id", "reason", "retry_count", "trace_id"]

# Activation integration with hire protocol
hiring_flow_continuation:
  previous_step: "Warmup phase 4 (model loaded, resources allocated, capabilities assigned)"
  current_step: "Health check (activation check)"
  next_step: "Agent moves to ACTIVE state, ready for TaskAssignment"

  state_machine:
    WARMING_state: |
      - Mailbox created
      - Model loaded in KV cache
      - Resources allocated
      - Capabilities assigned
      - Waiting for health check

    ACTIVE_state: |
      - Health check passed
      - Ready for task assignment
      - Supervisor monitoring (1Hz ping)
      - Mailbox active, receiving messages

# Activation performance targets
performance:

  health_check_budget_ms: 10       # Agent response <10ms
  total_activation_budget_ms: 50   # Total activation <50ms
  retry_budget_ms: 30              # 3 retries × 10ms = 30ms max

  total_hire_to_active_budget_ms: 250  # From HireApproval to ACTIVE
    # warmup (200ms) + activation (50ms) = 250ms total

