# Agent Hire Protocol - Drain Initiation Contracts
# File: contracts/protocols/agent_hire/07_drain_initiation_contracts.yml
# Purpose: IDLE → DRAINING graceful shutdown initiation
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-AGENT-HIRE-DRAIN-007"
  name: "Agent Drain Initiation Contracts"
  version: "1.0"

# Drain overview
drain_initiation:

  purpose: "Initiate graceful shutdown of IDLE agents"
  state_transition: "IDLE → DRAINING"
  trigger: "Resource management, session cleanup, or agent blacklist"

  drain_signals:
    session_ending: "User session ending, shutdown all agents"
    resource_pressure: "Memory/CPU high, evict LRU idle agent"
    agent_blacklist: "Agent crashed 3x in 10min, blacklist"
    orchestrator_shutdown: "K1 orchestrator shutting down"

# Draining state definition
draining_state:

  definition: |
    Agent is shutting down gracefully. No new tasks accepted.
    In-flight tasks (if any) complete normally.

  mailbox_behavior: "DRAINING agents REJECT new tasks"

  characteristics:
    - "No new task assignments"
    - "In-flight tasks continue to completion"
    - "Existing leases remain valid"
    - "New leases NOT issued"
    - "Health checks continue"
    - "Timeout: 5000ms max in DRAINING"

# Drain initiation protocol
drain_protocol:

  trigger_scenarios:

    scenario_1_session_ending:
      trigger: "Session ending (user disconnects)"
      action: |
        1. Orchestrator detects session end
        2. For each ACTIVE agent:
          a. IDLE agents: Transition IDLE → DRAINING
          b. ACTIVE agents: Wait for in-flight task completion, then DRAINING

    scenario_2_resource_pressure:
      trigger: "Memory usage > 80% or CPU > 90%"
      action: |
        1. Thermal manager detects high pressure
        2. Select LRU (least recently used) IDLE agent
        3. Send DRAIN_REQUEST to agent
        4. Transition IDLE → DRAINING
        5. Agent begins cleanup

    scenario_3_agent_blacklist:
      trigger: "Agent crashed 3x in 10 min window"
      action: |
        1. Supervisor detects 3rd crash in 10 min
        2. Add agent_id to blacklist (1 hour duration)
        3. Immediately transition agent ACTIVE/IDLE → DRAINING
        4. Begin termination process

    scenario_4_orchestrator_shutdown:
      trigger: "K1 orchestrator shutting down"
      action: |
        1. Orchestrator sends SHUTDOWN_SIGNAL to all agents
        2. All agents transition to DRAINING
        3. Wait for in-flight tasks to complete (timeout 5s)
        4. Transition DRAINING → TERMINATED

# Drain request message contract
drain_request_message:

  message_type: "DrainRequest"

  flatbuffers_schema: |
    table DrainRequest {
      drain_request_id: string (required)        # UUID
      agent_id: string (required)                # UUID
      drain_type: ubyte (required)               # 0=RESOURCE, 1=BLACKLIST, 2=SESSION, 3=ORCHESTRATOR
      drain_timeout_ms: uint (default=5000)      # 5 seconds max drain time
      allow_in_flight_ms: uint (default=3000)    # Allow in-flight tasks 3 more seconds
      trace_id: string (required)                # OpenTelemetry trace ID
      timestamp_ns: ulong (required)             # Nanoseconds since epoch
    }

  fields:
    drain_request_id:
      description: "Unique drain request identifier"
      type: "UUID"
      example: "drain-req-12345678-abcd-efgh"

    agent_id:
      description: "Agent to drain"
      type: "UUID"
      example: "agent-ai-planner-001"

    drain_type:
      description: "Why drain initiated"
      type: "enum: RESOURCE|BLACKLIST|SESSION|ORCHESTRATOR"
      example: "RESOURCE"

    drain_timeout_ms:
      description: "Max time to stay in DRAINING state"
      type: "uint milliseconds"
      default: 5000
      example: 5000

# Drain completion message
drain_completion:

  message_type: "DrainComplete"

  flatbuffers_schema: |
    table DrainComplete {
      drain_request_id: string (required)        # Reference DrainRequest
      agent_id: string (required)                # Which agent
      status: ubyte (required)                   # 0=SUCCESS, 1=TIMEOUT, 2=ERROR
      in_flight_tasks_count: uint (default=0)    # Tasks completed during drain
      drain_duration_ms: uint (required)         # How long drain took
      reason: string (optional)                  # Error reason if status != SUCCESS
      trace_id: string (required)                # OpenTelemetry trace ID
      timestamp_ns: ulong (required)             # Completion timestamp
    }

# Drain state machine
drain_fsm:

  states:
    IDLE:
      type: "current"
      description: "Agent idle, waiting for task"

    DRAINING:
      type: "transition"
      description: "Agent shutting down gracefully"
      timeout_ms: 5000
      behavior: |
        - Reject new task assignments
        - Complete any in-flight tasks
        - Send health checks if needed
        - Prepare for termination

    TERMINATED:
      type: "exit"
      description: "Agent shut down, resources cleaned"

  transitions:
    IDLE_to_DRAINING:
      trigger: "DrainRequest received"
      action: "Update state to DRAINING, reset timeout"
      latency_budget_ms: 10

    DRAINING_to_TERMINATED:
      trigger: "All in-flight tasks completed OR timeout"
      action: "Cleanup resources, send DrainComplete"
      latency_budget_ms: 100

    DRAINING_to_DRAINING_TIMEOUT:
      trigger: "5000ms elapses without completion"
      action: "Force termination, send error DrainComplete"
      latency_budget_ms: 5000

# In-flight task handling during drain
in_flight_task_handling:

  definition: |
    During DRAINING, agent may have active tasks.
    Graceful shutdown means: complete tasks, don't start new ones.

  scenarios:

    scenario_1_no_tasks:
      condition: "Agent has no in-flight tasks"
      action: |
        1. Transition immediately IDLE → DRAINING
        2. No tasks to wait for
        3. Proceed to cleanup

    scenario_2_one_task:
      condition: "Agent executing one task (Model Hub LLM call)"
      action: |
        1. Transition IDLE → DRAINING
        2. Task continues (don't cancel)
        3. Task completes normally, returns result
        4. DRAINING timeout still applies (5s)
        5. If task takes >5s, force terminate after 5s

    scenario_3_multiple_tasks:
      condition: "Agent has 2+ in-flight (multiple tool calls)"
      action: |
        1. Transition IDLE → DRAINING
        2. All tasks continue
        3. Wait for task completion
        4. 5s timeout applies to ALL tasks collectively
        5. Any task exceeding timeout is cancelled

  in_flight_timeout_policy: |
    If tasks not completed in 5 seconds:
      - Cancel remaining tasks
      - Send DrainComplete with status=TIMEOUT
      - Force transition to TERMINATED

  performance_budget:
    drain_completion_latency_ms: 5000  # Hard limit
    in_flight_allow_ms: 3000            # Give tasks 3s to finish

# Drain observability
observability:

  metrics:
    - name: "agent_drain_initiated_total"
      type: "counter"
      labels: ["drain_type"]
      description: "Drain processes initiated"

    - name: "agent_drain_duration_ms"
      type: "histogram"
      buckets: [100, 500, 1000, 3000, 5000]
      description: "Time to complete drain (DRAINING state duration)"

    - name: "agent_drain_in_flight_tasks"
      type: "histogram"
      buckets: [0, 1, 2, 5, 10]
      description: "In-flight tasks at drain time"

    - name: "agent_drain_success_total"
      type: "counter"
      labels: ["drain_type"]
      description: "Successful drain completions"

    - name: "agent_drain_timeout_total"
      type: "counter"
      labels: ["drain_type"]
      description: "Drain timeouts (forced termination)"

  events:
    - name: "agent_drain_initiated"
      fields: ["agent_id", "drain_type", "trace_id"]

    - name: "agent_draining"
      fields: ["agent_id", "in_flight_tasks_count", "drain_timeout_ms", "trace_id"]

    - name: "agent_drain_completed"
      fields: ["agent_id", "drain_duration_ms", "status", "trace_id"]

    - name: "agent_drain_timeout"
      fields: ["agent_id", "drain_timeout_ms", "in_flight_tasks_pending", "trace_id"]

# Lifecycle integration
lifecycle_context:

  agent_lifecycle: |
    PENDING → WARMING → ACTIVE ↔ IDLE → DRAINING → TERMINATED
                                        ↑________↓
                                   Drain flow

  this_contract_covers:
    - "IDLE → DRAINING transition"
    - "Graceful task completion"
    - "Resource cleanup preparation"
    - "Drain timeouts and failure handling"

  related_contracts:
    - "06_idle_detection_contracts.yml - IDLE state"
    - "08_termination_contracts.yml - TERMINATED cleanup"
    - "09_crash_handling_contracts.yml - Blacklist trigger"

# ==============================================================================
