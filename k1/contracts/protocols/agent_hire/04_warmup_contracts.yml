# Agent Hire Protocol - Warmup State Contracts
# File: contracts/protocols/agent_hire/04_warmup_contracts.yml
# Purpose: PENDING → WARMING agent state management in context of hiring
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-AGENT-HIRE-WARMUP-004"
  name: "Agent Warmup Contracts"
  version: "1.0"

  source_adrs:
    - "ADR-0005a: Agent Warming State"
    - "ADR-0003b: Agent Hire Protocol"

# Warmup integration with hiring protocol
warmup_integration:

  trigger: "HireApproval message received"
  state_transition: "Agent hired (FSM state=HIRED) → Agent begins WARMING (ADR-0005)"
  duration_budget_ms: 200        # Total warmup <200ms (from hire to ready)

  warmup_phases:
    phase1_model_loading:
      name: "Model Loading"
      duration_target_ms: 80     # Target: 80ms P95
      description: "Load LLM model into KV cache"
      constraints:
        - "Load model specified in agent config (GPT-4, Claude, local LLM)"
        - "Preload KV cache with persona prompts"
        - "Validate model is operational"
      metrics:
        - "model_load_latency_ms"
        - "kv_cache_warm_tokens"
      error_handling:
        - code: "MODEL_NOT_FOUND"
          recovery: "FALLBACK to backup model"
        - code: "KV_CACHE_FULL"
          recovery: "EVICT old entries (LRU), then load"

    phase2_resource_allocation:
      name: "Resource Allocation"
      duration_target_ms: 50     # Target: 50ms P95
      description: "Allocate CPU, memory, GPU for agent"
      constraints:
        - "Allocate memory: 512MB base + 256MB model cache"
        - "Reserve GPU slot (if available)"
        - "Setup message mailbox (MPSC queue)"
      metrics:
        - "resource_allocation_latency_ms"
        - "memory_allocated_mb"
      error_handling:
        - code: "OOM"
          recovery: "Fail warmup, reject hire"
        - code: "GPU_UNAVAILABLE"
          recovery: "Continue on CPU (slower)"

    phase3_capability_assignment:
      name: "Capability Assignment"
      duration_target_ms: 40     # Target: 40ms P95
      description: "Assign capabilities via signed lease"
      constraints:
        - "Load agent role (orchestrator, agent, tool_runner)"
        - "Load capabilities from lease"
        - "Validate capability signature (HMAC-SHA256)"
      metrics:
        - "capability_assignment_latency_ms"
        - "capabilities_assigned"
      error_handling:
        - code: "INVALID_LEASE"
          recovery: "Fail warmup, revoke agent"
        - code: "SIGNATURE_MISMATCH"
          recovery: "BLOCK warmup, log security incident"

    phase4_health_check:
      name: "Health Check"
      duration_target_ms: 30     # Target: 30ms P95
      description: "Verify agent is healthy (ping-pong)"
      constraints:
        - "Send health check request (10ms timeout)"
        - "Expect health check response (ACK)"
        - "Validate response signature"
      metrics:
        - "health_check_latency_ms"
        - "agents_healthy"
      error_handling:
        - code: "NO_RESPONSE"
          recovery: "RETRY health check (3 attempts)"
        - code: "UNHEALTHY"
          recovery: "Fail warmup, mark agent CRASHED"

# Warmup failure handling
failure_handling:

  warmup_timeout:
    timeout_ms: 200            # Hard SLO: 200ms (from hire to ready)
    action: "ABORT warmup, reject hire"
    user_experience: "Error message, hire failed"
    observability:
      metrics: ["warmup_timeout_total"]
      logs: ["warmup_timeout_latency_ms, phase"]

  resource_exhaustion:
    scenario: "OOM or GPU unavailable"
    action: "Fail warmup, try alternate agent"
    observability:
      metrics: ["warmup_resource_exhaustion_total"]

  model_load_failure:
    scenario: "Model file corrupted or missing"
    action: "Fallback to backup model or reject hire"
    observability:
      metrics: ["model_load_failure_total"]

# Warmup observability
observability:

  metrics:
    - name: "warmup_phase_latency_ms"
      type: "histogram"
      labels: ["phase"]
      buckets: [10, 20, 50, 100, 200]
      description: "Latency per warmup phase"

    - name: "warmup_total_latency_ms"
      type: "histogram"
      buckets: [50, 100, 150, 200, 300]
      description: "Total warmup latency"

    - name: "warmup_failures_total"
      type: "counter"
      labels: ["phase", "reason"]
      description: "Warmup failures by phase"

  events:
    - name: "warmup_started"
      fields: ["agent_id", "trace_id", "timestamp"]

    - name: "warmup_completed"
      fields: ["agent_id", "total_latency_ms", "trace_id"]

    - name: "warmup_failed"
      fields: ["agent_id", "phase", "reason", "trace_id"]

# Warmup integration with hire protocol
hiring_flow:
  step_1: "Orchestrator selects best agent (scoring logic)"
  step_2: "Orchestrator sends HireApproval message"
  step_3: "[PROTOCOL STATE] selection → hired"
  step_4: "[AGENT STATE] PENDING → WARMING (ADR-0005a)"
  step_5: "[WARMUP] Execute 4-phase warmup (this contract)"
  step_6: "[PROTOCOL STATE] Protocol terminates (HIRED)"
  step_7: "[AGENT STATE] WARMING → ACTIVE (health check passes)"
  step_8: "[ORCHESTRATOR] Send TaskAssignment to hired agent"
  step_9: "[TASK] task_execution protocol begins"

# ==============================================================================
# END OF FILE: 04_warmup_contracts.yml
# ==============================================================================
