# Contract: Agent Hire Response Messages
# ADR: ADR-0003b (Agent Hire Protocol)
# Purpose: Define HireApproval, HireRejection, HireTimeout response messages
# Category: Multi-Agent Coordination - Contract Net Protocol Responses

contract:
  name: "hire_response_contract"
  version: "1.0.0"
  description: "Supervisor → Orchestrator response messages for agent hire outcomes"
  adr_references:
    - adr: "ADR-0003b"
      section: "Protocol 1: Agent Hire Protocol"

  # ============================================================================
  # MESSAGE SCHEMAS (FlatBuffers)
  # ============================================================================

  flatbuffers_schemas:
    # Response 1: HireApproval (HIRED)
    hire_approval:
      file: "k1/contracts/flatbuffers/AgentHireApproval.fbs"
      definition: |
        namespace K1.Protocols;

        table AgentHireApproval {
          hire_id: string (required);             // Original HireRequest.hire_id
          session_id: string (required);
          cognitive_trace_id: string (required);
          timestamp: double (required);

          // Hired Agent Details
          agent_id: string (required);            // UUID v4 for hired agent
          agent_type: string (required);          // "planner" | "researcher" | etc.
          agent_capabilities: [Capability];       // Actual capabilities granted

          // Scoring Details
          hire_score: float (required);           // Final score (0.0-1.0)
          proposal_count: int;                    // Number of proposals received
          selected_reason: string;                // Why this agent won (human-readable)

          // Resource Allocation
          allocated_memory_mb: int;               // Actual memory allocated
          allocated_cpu_cores: float;             // Actual CPU allocated
          warmup_duration_ms: int;                // Time spent in WARMING state

          // State Transition
          current_state: AgentState = ACTIVE;     // Agent state after hire (ACTIVE)
        }

        enum AgentState: byte {
          PENDING = 0,
          WARMING = 1,
          ACTIVE = 2,
          IDLE = 3,
          DRAINING = 4,
          TERMINATED = 5,
        }

    # Response 2: HireRejection (REJECTED)
    hire_rejection:
      file: "k1/contracts/flatbuffers/AgentHireRejection.fbs"
      definition: |
        namespace K1.Protocols;

        table AgentHireRejection {
          hire_id: string (required);
          session_id: string (required);
          cognitive_trace_id: string (required);
          timestamp: double (required);

          // Rejection Details
          rejection_reason: RejectionReason (required);
          rejection_message: string;              // Human-readable explanation
          proposal_count: int;                    // Number of proposals received
          best_score: float;                      // Best score (if any proposals)

          // Retry Guidance
          retry_after_ms: int;                    // Suggested retry delay (0 = don't retry)
          retry_recommended: bool = false;        // Should orchestrator retry?
        }

        enum RejectionReason: byte {
          NO_SUITABLE_AGENT = 0,        // All scores < min_hire_score
          MAX_AGENTS_EXCEEDED = 1,      // session_agent_count >= max_agents_per_session
          NO_PROPOSALS = 2,             // No agents responded within timeout
          INSUFFICIENT_RESOURCES = 3,   // Not enough memory/CPU available
          AGENT_BLACKLISTED = 4,        // Agent type blacklisted (3 crashes)
          INVALID_CAPABILITIES = 5,     // requested_capabilities unknown
        }

    # Response 3: HireTimeout (TIMEOUT)
    hire_timeout:
      file: "k1/contracts/flatbuffers/AgentHireTimeout.fbs"
      definition: |
        namespace K1.Protocols;

        table AgentHireTimeout {
          hire_id: string (required);
          session_id: string (required);
          cognitive_trace_id: string (required);
          timestamp: double (required);

          // Timeout Details
          timeout_phase: string;                  // "negotiation" | "selection" | "warmup"
          timeout_duration_ms: int;               // How long we waited before timeout
          expected_duration_ms: int;              // Expected duration (e.g., 500ms for negotiation)
          proposal_count: int;                    // Proposals received before timeout
        }

  # ============================================================================
  # RESPONSE SEMANTICS
  # ============================================================================

  response_semantics:
    hire_approval:
      sender: "supervisor"
      receivers: ["orchestrator"]
      cardinality: "1"
      protocol_phase: "selection"  # Contract Net Protocol phase 2
      timing: "Within 100ms of selection complete"
      triggers_transition: "PENDING → WARMING → ACTIVE"
      side_effects:
        - "Agent added to session agent pool"
        - "Agent marked as ACTIVE in supervisor"
        - "Agent metrics incremented (active_agents_total)"

    hire_rejection:
      sender: "supervisor"
      receivers: ["orchestrator"]
      cardinality: "1"
      protocol_phase: "selection"
      timing: "Within 100ms of rejection decision"
      triggers_transition: "PENDING → TERMINATED"
      side_effects:
        - "Agent not created (no resource allocation)"
        - "Rejection metric incremented (hire_rejection_total)"
        - "Orchestrator may retry hire (if retry_recommended)"

    hire_timeout:
      sender: "system"  # Protocol Monitor auto-triggers
      receivers: []
      cardinality: "1"
      protocol_phase: "negotiation | selection | warmup"
      timing: "Auto-triggered on timeout"
      triggers_transition: "PENDING/WARMING → TERMINATED"
      side_effects:
        - "Protocol aborted, no agent hired"
        - "Timeout metric incremented (hire_timeout_total)"

  # ============================================================================
  # IMPLEMENTATION EXAMPLES
  # ============================================================================

  implementation:
    hire_approval_example: |
      from k1.protocols.messages import AgentHireApproval, AgentState
      import time

      # Supervisor sends approval after selection
      approval = AgentHireApproval(
          hire_id="hire-abc123",
          session_id="session-xyz789",
          cognitive_trace_id="trace-123",
          timestamp=time.time(),

          # Hired agent
          agent_id="agent-uuid-456",
          agent_type="planner",
          agent_capabilities=[Capability.TOOL_CALL, Capability.PLANNING],

          # Scoring
          hire_score=0.85,
          proposal_count=4,
          selected_reason="High score (0.85), low load (2 active tasks)",

          # Resources
          allocated_memory_mb=512,
          allocated_cpu_cores=1.0,
          warmup_duration_ms=150,

          # State
          current_state=AgentState.ACTIVE
      )

      await supervisor.send("orchestrator", approval)

    hire_rejection_example: |
      from k1.protocols.messages import AgentHireRejection, RejectionReason

      # Supervisor rejects hire (no suitable agent)
      rejection = AgentHireRejection(
          hire_id="hire-abc123",
          session_id="session-xyz789",
          cognitive_trace_id="trace-123",
          timestamp=time.time(),

          # Rejection
          rejection_reason=RejectionReason.NO_SUITABLE_AGENT,
          rejection_message="All 4 proposals below threshold (best: 0.55, threshold: 0.6)",
          proposal_count=4,
          best_score=0.55,

          # Retry guidance
          retry_after_ms=1000,     # Retry after 1s
          retry_recommended=True   # Orchestrator may retry
      )

      await supervisor.send("orchestrator", rejection)

  # ============================================================================
  # DECISION LOGIC
  # ============================================================================

  decision_logic:
    hire_approval_conditions:
      - "hire_score > min_hire_score (default 0.6)"
      - "session_agent_count < max_agents_per_session (default 3)"
      - "agent_state == ACTIVE (warmup completed successfully)"
      - "health_check_pass (agent responds to ping)"

    hire_rejection_conditions:
      - "NO_SUITABLE_AGENT: All scores <= min_hire_score"
      - "MAX_AGENTS_EXCEEDED: session_agent_count >= max_agents_per_session"
      - "NO_PROPOSALS: proposal_count == 0 within timeout"
      - "INSUFFICIENT_RESOURCES: Not enough memory/CPU"
      - "AGENT_BLACKLISTED: Agent type has 3 crashes in 10min"
      - "INVALID_CAPABILITIES: required_capabilities unknown"

    hire_timeout_conditions:
      - "negotiation timeout: No ProposalsClosed within proposal_timeout_ms (500ms)"
      - "selection timeout: No decision within 100ms of ProposalsClosed"
      - "warmup timeout: Agent not ACTIVE within warmup_timeout_ms (200ms)"

  # ============================================================================
  # TESTING STRATEGY
  # ============================================================================

  ward_tests:
    approval_tests:
      - test: "test_hire_approval_high_score"
        scenario: "Agent score 0.85, above threshold 0.6"
        expected: "HireApproval sent, PENDING → ACTIVE"

      - test: "test_hire_approval_resources_allocated"
        scenario: "Approval sent, check allocated_memory_mb"
        expected: "allocated_memory_mb == 512 (from HireRequest)"

    rejection_tests:
      - test: "test_hire_rejection_low_score"
        scenario: "Best score 0.55, threshold 0.6"
        expected: "HireRejection (NO_SUITABLE_AGENT)"

      - test: "test_hire_rejection_max_agents"
        scenario: "session_agent_count == 3, max 3"
        expected: "HireRejection (MAX_AGENTS_EXCEEDED)"

      - test: "test_hire_rejection_blacklist"
        scenario: "Agent type 'planner' blacklisted (3 crashes)"
        expected: "HireRejection (AGENT_BLACKLISTED), retry_recommended=False"

    timeout_tests:
      - test: "test_hire_timeout_negotiation"
        scenario: "No proposals within 500ms"
        expected: "HireTimeout (negotiation phase)"

      - test: "test_hire_timeout_warmup"
        scenario: "Warmup exceeds 200ms"
        expected: "HireTimeout (warmup phase)"

  # ============================================================================
  # PRODUCTION METRICS
  # ============================================================================

  production_metrics_6_months:
    total_responses: "12,000"
    response_distribution:
      hire_approval: "11,760 (98%)"
      hire_rejection: "180 (1.5%)"
      hire_timeout: "60 (0.5%)"

    rejection_reasons:
      NO_SUITABLE_AGENT: "80 (44% of rejections)"
      MAX_AGENTS_EXCEEDED: "60 (33%)"
      NO_PROPOSALS: "24 (13%)"
      AGENT_BLACKLISTED: "16 (9%)"

    retry_outcomes:
      retry_recommended_true: "80 (44% of rejections)"
      retry_success_rate: "75% (60 of 80 retries succeeded)"

# ============================================================================
# CONTRACT ACCEPTANCE CRITERIA
# ============================================================================

acceptance_criteria:
  functional:
    - "✅ 3 response types defined (Approval, Rejection, Timeout)"
    - "✅ All rejection reasons enumerated"
    - "✅ Retry guidance provided in rejections"

  performance:
    - "✅ Response sent within 100ms of decision"
    - "✅ Message size < 1KB"

# ============================================================================
# RELATED CONTRACTS
# ============================================================================

related_contracts:
  - contract: "hire_protocol_fsm.yml"
    relationship: "Responses trigger state transitions"

  - contract: "hire_request_contract.yml"
    relationship: "Responses reference hire_id from request"

  - contract: "warmup_contracts.yml"
    relationship: "HireApproval follows successful warmup"

# End of Contract: hire_response_contract.yml
