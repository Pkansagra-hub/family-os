# Agent Hire Protocol - FSM Specification
# File: contracts/protocols/agent_hire/01_hire_protocol_fsm.yml
# Purpose: Complete FSM definition for agent hiring with negotiation and selection
# Status: COMPLETE
# Version: 1.0
# Last Updated: 2025-10-15

# =============================================================================
# CONTRACT DEFINITION: AGENT HIRE PROTOCOL (MPST FSM)
# =============================================================================

contract:
  id: "CONTRACT-AGENT-HIRE-001"
  name: "Agent Hire Protocol FSM"
  version: "1.0"
  status: "APPROVED"

  # Reference to source ADRs
  source_adrs:
    - "ADR-0003: MPST Protocol Validation for Agent Communication"
    - "ADR-0003a: Protocol Definition Language (PDL) Specification"
    - "ADR-0003b: 6 Core Protocol Implementations"
    - "ADR-0003c: Protocol Monitor Runtime Implementation"
    - "ADR-0006: 3-Phase Orchestration & Contract Net Protocol"

  # Research foundations
  research:
    - "Contract Net Protocol (Smith 1980)"
    - "Multiparty Session Types (Honda et al. 2008)"
    - "Actor Model (Hewitt 1973)"

  # Architecture diagrams
  diagrams:
    - "architecture_diagrams/k1_protocol_monitor_fsms.mmd"
    - "architecture_diagrams/k1_orchestrator_3phase.mmd"
    - "architecture_diagrams/k1_agent_lifecycle_fsm.mmd"

# =============================================================================
# SECTION 1: FSM CORE SPECIFICATION
# =============================================================================

protocol:
  name: "agent_hire"
  description: "Hire agent with negotiation and selection (Contract Net Protocol)"
  version: "1.0"
  namespace: "k1.protocols.hire"

  # Protocol classification
  classification:
    protocol_type: "negotiation"        # negotiation | coordination | execution
    interaction_pattern: "contract-net" # contract-net | pub-sub | broadcast
    agent_types: ["orchestrator", "agent", "system"]
    ai_awareness: true                  # AI agents participate with LLM calls
    composability: "standalone"         # standalone | nestable | interruptible

  # Performance targets
  performance:
    negotiation_phase_timeout_ms: 500
    negotiation_phase_target_ms: 400    # Target: 400ms (P95)
    negotiation_phase_budget_ms: 500    # Budget: 500ms (hard SLO)

    selection_phase_timeout_ms: 100
    selection_phase_target_ms: 50       # Target: 50ms (P95) - deterministic
    selection_phase_budget_ms: 100      # Budget: 100ms (hard SLO)

    total_hire_latency_target_ms: 450   # Total: <450ms P95
    total_hire_latency_budget_ms: 600   # Total: <600ms SLO

    validation_latency_p95_ms: 2        # FSM validation: <2ms P95
    validation_latency_p99_ms: 5        # FSM validation: <5ms P99

    # Message counts
    max_proposals_expected: 58           # Max agents that can respond
    avg_proposals_expected: 12           # Typical agents responding

# =============================================================================
# SECTION 2: FSM STATES (6 TOTAL)
# =============================================================================

fsm:
  initial_state: "start"
  terminal_states: ["hired", "rejected", "timeout"]
  total_states: 6
  total_transitions: 8

  states:
    # State 1: START (Entry Point)
    - id: "start"
      name: "Start"
      type: "entry"                    # entry | interaction | decision | exit
      description: "Protocol entry point, waiting for HireRequest"
      timeout_ms: null                 # No timeout in entry state
      llm_aware: false                 # No LLM calls needed at entry
      entry_action: null
      exit_action: null
      constraints:
        - "No prior state (entry point)"
        - "Must transition immediately on HireRequest"
        - "No timeout fallback"

    # State 2: NEGOTIATION (Interaction Phase)
    - id: "negotiation"
      name: "Negotiation"
      type: "interaction"              # Multi-agent message exchange
      description: "Collect proposals from agents (broadcast HireRequest)"
      timeout_ms: 500                  # 500ms to collect all proposals
      llm_aware: true                  # AI agents call LLMs to generate proposals
      entry_action: "broadcast_hire_request"
      exit_action: null
      constraints:
        - "Multiple proposals allowed (cardinality: 0..*)"
        - "AI agents may call Model Hub (LLM reasoning, 100-300ms budget)"
        - "Timeout at 500ms closes negotiation phase"
        - "System can force close negotiation (ProposalsClosed)"
      observability:
        - "metric: negotiation_proposals_received (histogram)"
        - "metric: negotiation_ai_agent_llm_latency_ms (histogram)"
        - "log: proposal received (per agent)"
        - "trace: proposal message trace_id"

    # State 3: SELECTION (Decision Point)
    - id: "selection"
      name: "Selection"
      type: "decision"                 # Orchestrator deterministic decision
      description: "Score proposals, select winner (deterministic)"
      timeout_ms: 100                  # 100ms for scoring logic (no LLM)
      llm_aware: false                 # Pure actor logic, deterministic
      entry_action: "score_proposals"
      exit_action: null
      constraints:
        - "Deterministic scoring logic (no LLM)"
        - "Score = 0.4*confidence + 0.3*latency + 0.3*cost"
        - "Select agent with highest score"
        - "Timeout at 100ms rejects all (no agent hired)"
      observability:
        - "metric: selection_scoring_latency_ms (histogram)"
        - "metric: winning_agent_score (gauge)"
        - "metric: agent_scores (histogram, per agent)"
        - "log: scoring results (scores, winner, rejected)"

    # State 4: HIRED (Success Exit)
    - id: "hired"
      name: "Hired"
      type: "exit"                     # Terminal state (success)
      description: "Agent successfully hired, lease provisioned"
      timeout_ms: null                 # Terminal state, no timeout
      llm_aware: false
      entry_action: "provision_agent_lease"
      exit_action: null
      constraints:
        - "Terminal state (no outgoing transitions)"
        - "Lease provisioned and signed"
        - "Agent moves to WARMING state (ADR-0005a)"
        - "Orchestrator continues with task assignment"
      observability:
        - "metric: agents_hired_total (counter, per_agent_type)"
        - "metric: hiring_latency_ms (histogram)"
        - "event: agent_hired"
        - "trace: lease_id, agent_id, trace_id"

    # State 5: REJECTED (Failure Exit)
    - id: "rejected"
      name: "Rejected"
      type: "exit"                     # Terminal state (failure)
      description: "No suitable agent found"
      timeout_ms: null                 # Terminal state, no timeout
      llm_aware: false
      entry_action: "notify_rejection"
      exit_action: null
      constraints:
        - "Terminal state (no outgoing transitions)"
        - "All agents scored below threshold OR selection timeout"
        - "User experience: fallback handler (escalate, retry, error message)"
        - "Next step: escalation or conversation termination"
      observability:
        - "metric: hiring_rejections_total (counter, per_reason)"
        - "reason: [no_suitable_agent, selection_timeout, no_proposals]"
        - "log: rejection reason, all agent scores"
        - "trace: session_id, trace_id"

    # State 6: TIMEOUT (Timeout Exit)
    - id: "timeout"
      name: "Timeout"
      type: "exit"                     # Terminal state (timeout)
      description: "Negotiation timed out (no proposals received)"
      timeout_ms: null                 # Terminal state, no timeout
      llm_aware: false
      entry_action: "handle_timeout"
      exit_action: null
      constraints:
        - "Terminal state (no outgoing transitions)"
        - "Reached on negotiation timeout with proposal_count == 0"
        - "Reached on selection timeout (all candidates scored too low)"
        - "User experience: error message, retry suggested"
      observability:
        - "metric: hiring_timeouts_total (counter, per_phase)"
        - "phase: [negotiation_timeout, selection_timeout]"
        - "log: timeout reason, elapsed_ms"
        - "trace: session_id, trace_id"

# =============================================================================
# SECTION 3: SUMMARY & METRICS
# =============================================================================

summary:
  total_states: 6
  entry_states: ["start"]
  terminal_states: ["hired", "rejected", "timeout"]
  interaction_states: ["negotiation", "selection"]

  state_transitions_matrix:
    start: ["negotiation"]
    negotiation: ["negotiation", "selection", "timeout"]
    selection: ["hired", "rejected", "timeout"]
    hired: []
    rejected: []
    timeout: []

  total_transitions: 8
  cyclic_states: ["negotiation"]  # Self-loop for multiple proposals

  key_metrics:
    - "Negotiation phase timeout: 500ms (allows AI agent LLM calls)"
    - "Selection phase timeout: 100ms (deterministic, pure actor)"
    - "Total hire SLO: <600ms P95 (from hire request to lease provisioned)"
    - "Progress guarantee: All non-terminal states have timeouts"
    - "LLM awareness: Only negotiation state allows AI agent LLM calls"

# =============================================================================
# SECTION 4: FSM STATE TRANSITION DIAGRAM (TEXT)
# =============================================================================

state_transition_diagram: |

  START
    |
    | HireRequest (orchestrator → broadcast)
    |
    v
  NEGOTIATION  <---+
    |              |
    | Proposal     | (self-loop, 0..* cardinality)
    | (agent → orch)|
    +------+
           |
           | ProposalsClosed (500ms timeout) OR
           | Timeout (proposal_count == 0)
           |
           v
         SELECTION
          |     |
     HIGH |     | LOW
    SCORE |     | SCORE
          |     |
          v     v
        HIRED  REJECTED/TIMEOUT
          |     |
          +-----+
               |
               | Terminal
               v
           END

# =============================================================================
# SECTION 5: COMPLIANCE & AUDIT
# =============================================================================

compliance:
  frameworks:
    - "MPST (Multiparty Session Types)"
    - "Contract Net Protocol (Smith 1980)"
    - "Actor Model (message passing semantics)"

  validation_required:
    - "All non-terminal states have timeout policies"
    - "All transitions have defined message types"
    - "All terminal states are reachable"
    - "No deadlock cycles (circular waits)"

  audit_trail:
    - "All protocol violations logged with cognitive_trace_id"
    - "All state transitions logged (from_state, to_state, message_type)"
    - "All timeouts logged (state, elapsed_ms, action)"
    - "All errors logged (reason, agent_id, session_id)"

# =============================================================================
# END OF FILE: 01_hire_protocol_fsm.yml
# =============================================================================
