# Agent Hire Protocol - Timeout Enforcement Contracts
# File: contracts/protocols/agent_hire/10_timeout_enforcement.yml
# Purpose: Protocol timeout policies, enforcement mechanisms, and fallback strategies
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-AGENT-HIRE-TIMEOUT-010"
  name: "Agent Hire Protocol Timeout Enforcement"
  version: "1.0"

# Timeout enforcement overview
timeout_enforcement:

  purpose: "Ensure all non-terminal states have explicit timeout policies"
  design_principle: |
    MPST Guarantee: "Progress is guaranteed"
    Rule: "Every non-terminal state must have timeout → force transition"

  timeout_model: "MPST-verified, deadlock-free"

  canonical_timeouts:
    negotiation_timeout_ms: 500       # Hire negotiation phase (AI agents call LLM)
    selection_timeout_ms: 100         # Hire selection phase (deterministic)
    total_hire_timeout_ms: 600        # Total time from HireRequest to lease issued
    warmup_timeout_ms: 200            # Model loading + resource allocation
    activation_timeout_ms: 50         # Health check (WARMING → ACTIVE)
    drain_timeout_ms: 5000            # Graceful shutdown (IDLE → DRAINING → TERMINATED)

# Core timeout state machine
timeout_fsm:

  states_with_timeouts:

    start_state:
      state: "IDLE (awaiting task)"
      has_timeout: false
      rationale: "Terminal state, no timeout needed"

    negotiation_state:
      state: "HIRING (negotiation phase)"
      timeout_ms: 500
      timeout_action: "Transition to selection or reject"
      condition: "If no proposals after 500ms, close negotiation"

    selection_state:
      state: "HIRING (selection phase)"
      timeout_ms: 100
      timeout_action: "Trigger selection, pick best or reject"
      condition: "If no selection after 100ms, timeout"

    hired_state:
      state: "WARMING (model loading)"
      timeout_ms: 200
      timeout_action: "Force WARMING → ACTIVE (or crash)"
      condition: "If warmup not done in 200ms, fail hire"

    activation_state:
      state: "WARMING → ACTIVE (health check)"
      timeout_ms: 50
      timeout_action: "If health check fails, restart agent"
      condition: "If no ping-pong in 50ms, unhealthy"

    idle_state:
      state: "ACTIVE / IDLE (awaiting task)"
      timeout_ms: 60000  # 60 seconds (configurable)
      timeout_action: "Transition ACTIVE → IDLE"
      condition: "If no task activity in 60s"

    drain_state:
      state: "IDLE → DRAINING"
      timeout_ms: 5000
      timeout_action: "Force DRAINING → TERMINATED"
      condition: "If drain not done in 5s, force kill"

# Timeout implementation architecture
timeout_implementation:

  component: "Protocol Monitor - Timeout Enforcer"

  architecture: |
    ┌─────────────────────────────────────────────┐
    │ Timeout Enforcer (Background Task)          │
    ├─────────────────────────────────────────────┤
    │ 1. Poll every 100ms                         │
    │ 2. For each agent:                          │
    │    a. Current timestamp                     │
    │    b. State start timestamp                 │
    │    c. Check: elapsed > timeout_ms ?         │
    │    d. If yes: Auto-transition state         │
    │ 3. Log auto-transitions                     │
    │ 4. Emit metrics                             │
    └─────────────────────────────────────────────┘

  polling_interval_ms: 100
  polling_rationale: |
    - 100ms resolution = 10x finer than slowest timeout (5000ms drain)
    - Provides <100ms enforcement latency
    - Sustainable CPU cost on background thread

  timeout_check_logic: |
    def enforce_timeouts():
      while running:
        timestamp_now = time.time_ns()

        for agent in agents:
          state_entry_time = agent.state_entry_timestamp_ns
          elapsed_ms = (timestamp_now - state_entry_time) / 1_000_000

          timeout_policy = get_timeout_for_state(agent.state)
          if timeout_policy and elapsed_ms > timeout_policy.timeout_ms:
            # Timeout fired!
            trigger_auto_transition(agent, timeout_policy)
            log_timeout(agent, elapsed_ms, timeout_policy)
            emit_metric("protocol_timeout_fired", timeout_policy.state)

        sleep(100ms)

# Timeout state tracking
timeout_state_tracking:

  per_agent_tracking:

    flatbuffers_schema: |
      table AgentTimeoutState {
        agent_id: string (required)                    # Agent identifier
        current_state: ubyte (required)                # State enum
        state_entry_timestamp_ns: ulong (required)     # When entered state
        timeout_policy: TimeoutPolicy (required)       # Timeout for this state
      }

      table TimeoutPolicy {
        state: ubyte (required)                        # State identifier
        timeout_ms: uint (required)                    # Timeout in ms
        fallback_state: ubyte (required)               # Where to transition
        auto_retry: bool (default=false)               # Auto-retry?
        max_retries: uint (default=0)                  # How many retries?
      }

    data_structure: |
      agent_timeout_map: HashMap<agent_id, AgentTimeoutState>
      - Fast lookup: O(1)
      - Updated on state transition
      - Checked every 100ms by enforcer

# Timeout-triggered auto-transitions
timeout_transitions:

  transition_1_negotiation_timeout:

    from_state: "HIRING/NEGOTIATION"
    timeout_ms: 500
    condition: "No proposals after 500ms"

    triggered_action: |
      1. Log: "Negotiation timeout, closing proposals"
      2. Transition: HIRING/NEGOTIATION → HIRING/SELECTION
      3. Execute selection logic (pick best proposal or reject)
      4. If reject: HireRejection(reason=NEGOTIATION_TIMEOUT)

    fallback_strategy: |
      If no proposals received:
        a. Auto-reject hire
        b. Orchestrator initiates new hire
        c. Try different agent role

    observability: |
      - Emit event: "negotiation_timeout"
      - Increment counter: "protocol_timeout_fired[negotiation]"

  transition_2_selection_timeout:

    from_state: "HIRING/SELECTION"
    timeout_ms: 100
    condition: "Selection not done after 100ms"

    triggered_action: |
      1. Log: "Selection timeout, picking best proposal"
      2. Score all proposals (if any)
      3. Pick highest score OR auto-reject if <threshold
      4. Send HireApproval or HireRejection

    fallback_strategy: |
      If score < 0.65:
        a. Reject hire automatically
        b. Orchestrator initiates new hire

    observability: |
      - Emit event: "selection_timeout"
      - Increment counter: "protocol_timeout_fired[selection]"

  transition_3_warmup_timeout:

    from_state: "WARMING (model loading)"
    timeout_ms: 200
    condition: "Agent not ready after 200ms"

    triggered_action: |
      1. Log: "Warmup timeout, forcefully activating"
      2. Assumption: Agent either warmed up or crashed
      3. Send health check (10ms)
      4. If responds: Transition WARMING → ACTIVE
      5. If not: Treat as crash, terminate agent

    fallback_strategy: |
      If health check fails:
        a. Force transition: WARMING → TERMINATED
        b. Add agent to crash history (1 of 3 crashes)
        c. Orchestrator hires new agent

    observability: |
      - Emit event: "warmup_timeout"
      - Increment counter: "protocol_timeout_fired[warmup]"

  transition_4_activation_timeout:

    from_state: "WARMING (health check)"
    timeout_ms: 50
    condition: "Health check not responded in 50ms"

    triggered_action: |
      1. Log: "Activation timeout, agent unresponsive"
      2. Assumption: Agent crashed or hung
      3. Treat as crash
      4. Transition: WARMING → CRASHED → TERMINATED
      5. Increment crash counter for agent

    fallback_strategy: |
      Check 3-crash rule:
        If crash_count >= 3 in 10min:
          a. Blacklist agent (1 hour)
          b. Orchestrator hires new agent

    observability: |
      - Emit event: "activation_timeout"
      - Increment counter: "protocol_timeout_fired[activation]"

  transition_5_idle_transition:

    from_state: "ACTIVE (idle)"
    timeout_ms: 60000  # 60 seconds
    condition: "No task activity for 60s"

    triggered_action: |
      1. Log: "Agent idle timeout, transitioning to IDLE"
      2. Transition: ACTIVE → IDLE
      3. Stop active monitoring
      4. Keep mailbox active (can receive tasks)
      5. Update agent state gauge

    fallback_strategy: |
      None needed (IDLE is stable state)

    observability: |
      - Emit event: "agent_idle_transition"
      - Increment counter: "agent_transitioned_idle"

  transition_6_drain_timeout:

    from_state: "DRAINING (graceful shutdown)"
    timeout_ms: 5000
    condition: "Drain not completed in 5s"

    triggered_action: |
      1. Log: "Drain timeout, forcing termination"
      2. In-flight tasks are cancelled
      3. Transition: DRAINING → TERMINATED (forced)
      4. Release all resources immediately

    fallback_strategy: |
      If tasks are killed:
        a. Orchestrator will retry tasks on new hire
        b. Idempotent task_ids prevent double execution

    observability: |
      - Emit event: "drain_timeout_forced_termination"
      - Increment counter: "protocol_timeout_fired[drain]"

# Timeout performance budgets
performance_budgets:

  budget_table: |
    ┌──────────────────────────────┬──────────┬────────────┬──────────────┐
    │ Phase                         │ Timeout  │ Enforcer   │ Enforcement  │
    │                               │ (ms)     │ Poll (ms)  │ Latency (ms) │
    ├──────────────────────────────┼──────────┼────────────┼──────────────┤
    │ Negotiation (AI LLM)         │ 500      │ 100        │ <100         │
    │ Selection (deterministic)    │ 100      │ 100        │ <100         │
    │ Warmup (model loading)       │ 200      │ 100        │ <100         │
    │ Activation (health check)    │ 50       │ 100        │ <100         │
    │ Idle (activity detection)    │ 60000    │ 100        │ <100         │
    │ Drain (shutdown)             │ 5000     │ 100        │ <100         │
    └──────────────────────────────┴──────────┴────────────┴──────────────┘

  enforcement_latency: |
    Worst case: 100ms polling interval
    Actual enforcement: <100ms after timeout expires
    Total latency: timeout_ms + 100ms

    Example:
      - Negotiation timeout: 500ms + 100ms = 600ms max
      - Selection timeout: 100ms + 100ms = 200ms max

  slo_budgets:
    total_hire_slo_ms: 600        # Negotiation 500 + Selection 100
    warmup_slo_ms: 200
    activation_slo_ms: 50
    enforcement_overhead_ms: 100  # Polling latency

# Timeout fallback strategies
fallback_strategies:

  strategy_1_retry_with_backoff:

    applicability: "When hire fails due to timeout"
    backoff_policy: |
      Attempt 1: Immediate (0ms)
      Attempt 2: Wait 100ms, retry
      Attempt 3: Wait 500ms, retry
      Attempt 4: Give up, inform user

    implementation: |
      def retry_hire_with_backoff(task):
        for attempt in [1, 2, 3]:
          result = hire_agent(task)
          if result.success:
            return result

          if result.reason == TIMEOUT:
            backoff_ms = [0, 100, 500][attempt - 1]
            wait(backoff_ms)
          else:
            break  # Non-timeout error, don't retry

        return ERROR

    observability: |
      - "retry_attempt_total[attempt=1/2/3]"
      - "retry_success_rate_pct"

  strategy_2_escalate_to_user:

    applicability: "When retry exhausted"
    action: |
      1. Log: "Unable to hire agent after 3 attempts"
      2. Inform orchestrator: "Hire failed"
      3. Orchestrator informs user: "Please retry request"
      4. User sees: "System busy, please try again"

    observability: |
      - "hire_failed_timeout_total"
      - "user_retry_requested_total"

  strategy_3_timeout_tuning:

    applicability: "When timeouts consistently fire"
    action: |
      1. Monitor timeout_fired rate
      2. If timeout_fired_rate > 5% of transactions:
        a. Alert ops: "Timeouts too aggressive"
        b. Consider increasing timeout
      3. Example: If negotiation timeout consistently fires:
        a. Increase 500ms → 700ms
        b. Re-evaluate performance

    observability: |
      - "timeout_fired_rate_pct[state]"
      - "timeout_tuning_alert"

# Timeout metrics and observability
observability:

  metrics:
    - name: "protocol_timeout_fired_total"
      type: "counter"
      labels: ["state"]  # negotiation, selection, warmup, activation, drain
      description: "Timeouts that triggered auto-transitions"

    - name: "timeout_enforcement_latency_ms"
      type: "histogram"
      buckets: [10, 50, 100, 200]
      description: "Time from timeout expiry to enforcement"

    - name: "agent_state_duration_ms"
      type: "histogram"
      labels: ["state"]
      buckets: [10, 50, 100, 500, 1000, 5000]
      description: "Duration agent spent in each state"

    - name: "timeout_fired_rate_pct"
      type: "gauge"
      labels: ["state"]
      description: "Percentage of transactions hitting timeout"

    - name: "premature_timeout_total"
      type: "counter"
      description: "Timeouts that fired but agent was still working"

    - name: "timeout_tuning_needed_alert"
      type: "counter"
      labels: ["state"]
      description: "Alerts for timeout tuning needed"

  events:
    - name: "timeout_fired"
      fields: ["agent_id", "state", "elapsed_ms", "timeout_ms", "trace_id"]

    - name: "auto_transition_triggered"
      fields: ["agent_id", "from_state", "to_state", "reason", "trace_id"]

    - name: "timeout_enforcement"
      fields: ["agent_id", "enforcement_latency_ms", "trace_id"]

# Timeout compliance and MPST guarantees
mpst_compliance:

  principle_1_progress_guaranteed:
    guarantee: "Every non-terminal state has timeout → force transition"
    implementation: "All 6 protocol states have timeouts, enforcer runs every 100ms"
    verification: |
      ✓ HIRING/NEGOTIATION: 500ms timeout → HIRING/SELECTION
      ✓ HIRING/SELECTION: 100ms timeout → HIRED or REJECTED
      ✓ WARMING: 200ms timeout → ACTIVE or CRASHED
      ✓ ACTIVE: 60s timeout → IDLE
      ✓ IDLE: No timeout (stable state)
      ✓ DRAINING: 5s timeout → TERMINATED

  principle_2_deadlock_free:
    guarantee: "No circular waits, no infinite loops"
    implementation: "All transitions are acyclic (except ACTIVE↔IDLE), timeouts force progress"
    verification: "Mermaid FSM validated for cycles, MPST theorem applied"

  principle_3_no_livelock:
    guarantee: "Agents don't ping-pong between states"
    implementation: "Once in IDLE, agent stays until new task OR drain signal"
    verification: "ACTIVE→IDLE timeout is unidirectional (no reverse timeout)"

# Lifecycle integration
lifecycle_context:

  this_contract_covers:
    - "Timeout enforcement mechanism"
    - "All 6 timeout policies (500, 100, 200, 50, 60000, 5000 ms)"
    - "Auto-transition logic"
    - "Fallback strategies"
    - "Performance budgets"
    - "MPST compliance (progress, deadlock-free)"

  related_contracts:
    - "01_hire_protocol_fsm.yml - FSM states"
    - "04_warmup_contracts.yml - Warmup timeout"
    - "05_activation_contracts.yml - Health check timeout"
    - "06_idle_detection_contracts.yml - Idle timeout"
    - "07_drain_initiation_contracts.yml - Drain timeout"
    - "09_crash_handling_contracts.yml - Crash recovery"

# Configuration for timeout tuning
configuration:

  yaml_config_structure: |
    orchestrator:
      agent_hire:
        negotiation_timeout_ms: 500        # Adjustable
        selection_timeout_ms: 100
        warmup_timeout_ms: 200
        activation_timeout_ms: 50
        idle_timeout_ms: 60000
        drain_timeout_ms: 5000

      timeout_enforcement:
        enforcer_poll_interval_ms: 100     # Adjustable
        enforcement_latency_target_ms: 100
        timeout_tuning_alert_threshold: 5  # % of transactions

