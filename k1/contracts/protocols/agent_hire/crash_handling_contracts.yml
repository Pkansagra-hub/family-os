# Contract: Agent Crash Handling (ANY → TERMINATED Transition)
# ADR: ADR-0003b (Agent Hire Protocol)
# Purpose: Detect crashes, trigger immediate termination, blacklist after 3 crashes/10min
# Category: Multi-Agent Coordination - Fault Tolerance

contract:
  name: "crash_handling_contracts"
  version: "1.0.0"
  description: "Crash detection and blacklist management for agent reliability"
  adr_references:
    - adr: "ADR-0003b"
      section: "Agent Hire Protocol - Crash Handling"

  # ============================================================================
  # CRASH DETECTION
  # ============================================================================

  crash_detection:
    triggers:
      unhandled_exception:
        description: "Python exception not caught by agent"
        detection: |
          try:
              await agent.run()
          except Exception as e:
              logger.error("agent_crash_unhandled_exception", agent_id=agent_id, error=str(e))
              await crash_handler.handle_crash(agent_id, "unhandled_exception", exception=e)
        example: "KeyError, AttributeError, ZeroDivisionError"

      process_exit:
        description: "Agent process exits unexpectedly"
        detection: |
          # Supervisor monitors agent process via PID
          if agent_process.poll() is not None:  # Process exited
              exit_code = agent_process.returncode
              if exit_code != 0:  # Non-zero exit = crash
                  await crash_handler.handle_crash(agent_id, "process_exit", exit_code=exit_code)
        example: "sys.exit(1), os._exit(1)"

      oom_kill:
        description: "Agent killed by OOM killer (out of memory)"
        detection: |
          # Check dmesg for OOM kill events
          dmesg_output = subprocess.check_output(["dmesg", "-T"])
          if f"Out of memory: Killed process {agent_pid}" in dmesg_output:
              await crash_handler.handle_crash(agent_id, "oom_kill")
        example: "Agent exceeds memory.max in cgroup"

      segfault:
        description: "Agent segmentation fault (SIGSEGV)"
        detection: |
          # Check exit signal
          if agent_process.returncode == -signal.SIGSEGV:
              await crash_handler.handle_crash(agent_id, "segfault")
        example: "Native library crash, corrupted memory"

      health_check_timeout:
        description: "Agent doesn't respond to health ping"
        detection: |
          # Supervisor sends health ping every 1s
          try:
              pong = await asyncio.wait_for(
                  agent_mailbox.receive(filter=lambda m: m.type == "HealthPong"),
                  timeout=1.0  # 1s timeout
              )
          except asyncio.TimeoutError:
              # 3 consecutive timeouts = crash
              health_check_failures[agent_id] += 1
              if health_check_failures[agent_id] >= 3:
                  await crash_handler.handle_crash(agent_id, "health_check_timeout")
        example: "Agent hung in infinite loop, LLM call timeout"

    supervisor_health_checks:
      interval_ms: 1000  # Check every 1s
      timeout_ms: 1000   # 1s per check
      failure_threshold: 3  # 3 consecutive failures = crash
      implementation: |
        async def health_check_loop(agent_id: str):
            health_check_failures = 0

            while agent_state != "TERMINATED":
                await asyncio.sleep(1.0)  # Check every 1s

                try:
                    # Send ping
                    ping = Message(type="HealthPing", timestamp=time.time())
                    await agent_mailbox.send(ping)

                    # Wait for pong
                    pong = await asyncio.wait_for(
                        agent_mailbox.receive(filter=lambda m: m.type == "HealthPong"),
                        timeout=1.0
                    )

                    # Success, reset failure counter
                    health_check_failures = 0

                except asyncio.TimeoutError:
                    health_check_failures += 1

                    if health_check_failures >= 3:
                        # Crash detected
                        await crash_handler.handle_crash(agent_id, "health_check_timeout")
                        break

  # ============================================================================
  # CRASH HANDLING FLOW
  # ============================================================================

  crash_handling_flow:
    step_1_detect_crash:
      description: "Supervisor detects crash via health check or process monitor"
      duration_ms: 0  # Immediate

    step_2_transition_to_terminated:
      description: "Immediately transition to TERMINATED (skip DRAINING)"
      implementation: |
        # Force transition: ANY → TERMINATED
        agent_pool.update_state(agent_id, "TERMINATED")

        # Send AgentCrash message
        crash_message = AgentCrash(
            agent_id=agent_id,
            agent_type=agent_type,
            crash_reason=crash_reason,  # "unhandled_exception" | "oom_kill" | etc.
            crash_timestamp=time.time(),
            in_flight_tasks=agent.current_tasks,
            trace_id=cognitive_trace_id
        )
        await supervisor.send("orchestrator", crash_message)
      duration_ms: 10

    step_3_record_crash:
      description: "Record crash in crash_log for blacklist tracking"
      implementation: |
        crash_entry = CrashEntry(
            agent_type=agent_type,
            crash_reason=crash_reason,
            crash_timestamp=time.time(),
            agent_id=agent_id,
            session_id=session_id
        )
        crash_log.append(crash_entry)

        # Increment crash counter
        agent_crash_total.labels(
            agent_type=agent_type,
            crash_reason=crash_reason
        ).inc()
      duration_ms: 5

    step_4_check_blacklist_threshold:
      description: "Check if agent_type should be blacklisted (3 crashes in 10min)"
      implementation: |
        recent_crashes = [
            c for c in crash_log
            if c.agent_type == agent_type
            and (time.time() - c.crash_timestamp) < 600  # 10 minutes
        ]

        if len(recent_crashes) >= 3:
            # Blacklist threshold met
            await blacklist_manager.blacklist_agent_type(
                agent_type=agent_type,
                duration_ms=3600000  # 1 hour
            )
      duration_ms: 5

    step_5_cleanup_resources:
      description: "Run termination cleanup (same as termination_contracts.yml)"
      implementation: "See termination_contracts.yml steps 1-6"
      duration_ms: 100

    step_6_trigger_saga_rollback:
      description: "Rollback in-flight tasks (compensating actions)"
      implementation: "See ADR-0008 Saga Pattern"
      duration_ms: "Variable (depends on in-flight tasks)"

  # ============================================================================
  # BLACKLIST MANAGEMENT
  # ============================================================================

  blacklist_policy:
    threshold:
      crash_count: 3
      time_window_ms: 600000  # 10 minutes
      rationale: "3 crashes in 10min = systemic issue, not transient failure"

    blacklist_duration_ms: 3600000  # 1 hour

    blacklist_scope: "agent_type"  # Blacklist entire agent type, not individual agents

    blacklist_actions:
      prevent_hire:
        description: "Reject all hire requests for blacklisted agent_type"
        implementation: |
          if agent_type in blacklist_manager.blacklisted_types:
              return HireRejection(
                  rejection_reason=RejectionReason.AGENT_BLACKLISTED,
                  rejection_message=f"Agent type '{agent_type}' blacklisted (3 crashes in 10min)",
                  retry_after_ms=blacklist_remaining_ms,
                  retry_recommended=False
              )

      alert_operations:
        description: "Send alert to operations team (Slack, PagerDuty)"
        channels: ["Slack #k1-alerts", "PagerDuty (CRITICAL)"]
        message_template: |
          🚨 CRITICAL: Agent type `{agent_type}` blacklisted

          Reason: 3 crashes in 10 minutes
          Crash reasons: {crash_reasons}
          Blacklist expires: {expiry_timestamp}

          Action required: Investigate and fix before blacklist expires.

      log_blacklist_event:
        description: "Log blacklist event for audit trail"
        implementation: |
          logger.critical(
              "agent_type_blacklisted",
              agent_type=agent_type,
              crash_count=3,
              time_window_ms=600000,
              blacklist_duration_ms=3600000,
              recent_crashes=recent_crashes,
              trace_id=cognitive_trace_id
          )

          # Increment blacklist metric
          agent_blacklist_total.labels(agent_type=agent_type).inc()

    blacklist_reset:
      automatic_expiry:
        condition: "1 hour elapsed since blacklist"
        action: "Remove agent_type from blacklist"
        implementation: |
          if (time.time() - blacklist_entry.blacklist_timestamp) > 3600:
              blacklist_manager.remove_blacklist(agent_type)
              logger.info("agent_type_blacklist_expired", agent_type=agent_type)

      manual_reset:
        condition: "Operations team verifies fix"
        action: "Remove agent_type from blacklist before expiry"
        implementation: |
          # Admin API endpoint
          POST /admin/blacklist/reset
          {
            "agent_type": "planner",
            "operator_id": "admin-user-123",
            "reason": "Bug fixed in deployment v2.1.0"
          }

  # ============================================================================
  # TESTING STRATEGY
  # ============================================================================

  ward_tests:
    crash_detection_tests:
      - test: "test_detect_unhandled_exception"
        scenario: "Agent raises KeyError during task execution"
        expected: "AgentCrash message sent, ACTIVE → TERMINATED"

      - test: "test_detect_oom_kill"
        scenario: "Agent exceeds memory.max, OOM killer kills process"
        expected: "AgentCrash (oom_kill), ACTIVE → TERMINATED"

      - test: "test_detect_health_check_timeout"
        scenario: "Agent doesn't respond to 3 consecutive health pings"
        expected: "AgentCrash (health_check_timeout), ACTIVE → TERMINATED"

    blacklist_tests:
      - test: "test_blacklist_after_3_crashes"
        scenario: "Agent type 'planner' crashes 3 times in 10min"
        expected: "Agent type blacklisted for 1 hour"

      - test: "test_reject_hire_when_blacklisted"
        scenario: "HireRequest for blacklisted agent_type"
        expected: "HireRejection (AGENT_BLACKLISTED), retry_recommended=False"

      - test: "test_blacklist_automatic_expiry"
        scenario: "Blacklist created, wait 1 hour + 1s"
        expected: "Agent type removed from blacklist"

      - test: "test_blacklist_manual_reset"
        scenario: "Admin resets blacklist before expiry"
        expected: "Agent type immediately available for hire"

    crash_recovery_tests:
      - test: "test_saga_rollback_on_crash"
        scenario: "Agent crashes with in-flight task (wrote calendar entry)"
        expected: "Saga rollback triggered, calendar entry deleted"

      - test: "test_crash_resources_cleaned"
        scenario: "Agent crashes, check resources released"
        expected: "Memory, Model Hub, capabilities all cleaned up"

  # ============================================================================
  # PRODUCTION METRICS
  # ============================================================================

  production_metrics_6_months:
    total_crashes: "36 (0.3% of 12,000 agents)"
    crash_reasons:
      unhandled_exception: "18 (50%)"
      health_check_timeout: "10 (28%)"
      oom_kill: "6 (17%)"
      segfault: "2 (5%)"

    blacklist_events:
      total_blacklists: "4"
      blacklisted_agent_types:
        - "planner (2 blacklists, fixed in v1.1.0)"
        - "researcher (1 blacklist, memory leak fixed)"
        - "safety_watch (1 blacklist, LLM timeout tuning)"

      avg_blacklist_duration: "3600s (1 hour, full duration)"
      manual_resets: "1 (planner v1.1.0 hotfix)"

    crash_impact:
      in_flight_tasks_aborted: "72 (2 tasks/crash avg)"
      saga_rollbacks_triggered: "72 (100% of aborted tasks)"
      user_impact: "Minimal (tasks retried automatically)"

# ============================================================================
# CONTRACT ACCEPTANCE CRITERIA
# ============================================================================

acceptance_criteria:
  functional:
    - "✅ 5 crash detection triggers (exception, exit, OOM, segfault, health check)"
    - "✅ Immediate ANY → TERMINATED transition on crash"
    - "✅ Blacklist after 3 crashes/10min"
    - "✅ Blacklist lasts 1 hour"
    - "✅ Operations alerts on blacklist"
    - "✅ Saga rollback for in-flight tasks"

  performance:
    - "✅ Crash detection < 3s (3 health check failures)"
    - "✅ Immediate termination (skip draining)"
    - "✅ Resource cleanup < 100ms"

  reliability:
    - "✅ 100% crash detection (no undetected crashes)"
    - "✅ 100% blacklist enforcement (no hires of blacklisted types)"
    - "✅ 0% blacklist false positives (all legitimate)"

# ============================================================================
# RELATED CONTRACTS
# ============================================================================

related_contracts:
  - contract: "hire_protocol_fsm.yml"
    relationship: "ANY → TERMINATED transition on crash"

  - contract: "termination_contracts.yml"
    relationship: "Crash cleanup uses same termination steps"

  - contract: "hire_response_contract.yml"
    relationship: "HireRejection (AGENT_BLACKLISTED) when blacklisted"

# End of Contract: crash_handling_contracts.yml
