# Task Execution Protocol Contract
# Epic 1.3 - Issue 1.3.2 - Protocol Definition 2 of 6
# Version: 1.0.0
# Status: DRAFT
# Owner: Protocol Team
# ADR References: ADR-0003b (Six Core Protocols), ADR-0006 (Planner Agent), ADR-0007 (Tool Runner)

metadata:
  protocol_id: "task_execution"
  protocol_name: "Task Execution Protocol"
  version: "1.0.0"
  description: |
    Task execution protocol with 4-stage planning pipeline (Sketch → Expand → Validate → Commit).
    Supports AI agent planning with LLM reasoning, tool orchestration, and adaptive replanning.
    Implements contract from ADR-0003b Section 2.2 (Task Execution).
  research_foundation:
    - "Actor Model (Hewitt 1973) - Message-passing coordination"
    - "MPST (Honda et al. 2008) - Protocol validation"
    - "SEDA (Welsh et al. 2001) - Staged event-driven architecture"
    - "ReAct Pattern (Yao et al. 2022) - Reasoning + Acting for LLMs"
  complexity: "HIGH"
  ai_involvement: "CRITICAL"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

protocol_specification:
  overview: |
    Task Execution Protocol governs the complete lifecycle of task processing from announcement
    to completion. It implements a 4-stage planning pipeline:
    1. Sketch: LLM generates high-level plan
    2. Expand: Deterministic expansion to executable steps
    3. Validate: Rule-based + arbiter validation
    4. Commit: Execution with monitoring

    This protocol is the most complex of the 6 core protocols, involving AI agent coordination,
    tool orchestration, error recovery, and adaptive replanning.

  protocol_type: "core"
  state_count: 5
  transition_count: 10
  max_duration_ms: 30000
  timeout_count: 3
  message_count: 6
  role_count: 4

  coordination_pattern: "sequential_with_branching"
  ai_agent_roles:
    - "planner"
    - "executor"
  pure_agent_roles:
    - "orchestrator"
    - "tool_runner"

  research_citations:
    planning_pipeline: "ADR-0006 (4-Stage Planner Agent)"
    tool_orchestration: "ADR-0007 (Tool Runner with Sandboxing)"
    adaptive_replanning: "ADR-0005 (Learning Loop with Feedback Signals)"

fsm_states:
  start:
    state_id: "start"
    state_type: "initial"
    description: "Protocol start state - task announcement received"
    valid_roles: ["orchestrator"]
    entry_actions:
      - "validate_task_structure"
      - "check_agent_capabilities"
      - "initialize_session_state"
    exit_conditions:
      - "task_validation_passed"
      - "planner_agent_available"
    timeout_policy: "none"
    observability:
      metrics:
        - "task_received_total"
        - "task_validation_latency_ms"
      logs:
        - level: "INFO"
          message: "Task execution protocol started"
          fields: ["task_id", "orchestrator_id", "trace_id"]
    estimated_duration_ms: 50

  planning:
    state_id: "planning"
    state_type: "intermediate"
    description: "4-stage planning pipeline execution"
    valid_roles: ["planner"]
    entry_actions:
      - "sketch_plan_llm"
      - "expand_plan_deterministic"
      - "validate_plan_rules"
      - "validate_plan_arbiter"
    exit_conditions:
      - "plan_validated"
      - "plan_rejected_max_retries"
    timeout_policy: "planning_timeout"
    substates:
      sketch:
        description: "LLM generates high-level plan"
        max_duration_ms: 2000
        ai_agent: "planner"
        llm_reasoning: true
      expand:
        description: "Deterministic expansion to executable steps"
        max_duration_ms: 500
        ai_agent: false
      validate:
        description: "Rule-based + arbiter validation"
        max_duration_ms: 1000
        arbiter_involved: true
      commit:
        description: "Plan committed to execution"
        max_duration_ms: 100
    observability:
      metrics:
        - "planning_latency_ms"
        - "planning_retries_total"
        - "plan_sketch_tokens"
        - "plan_validation_failures_total"
      logs:
        - level: "INFO"
          message: "Planning stage completed"
          fields: ["task_id", "plan_id", "stage", "duration_ms"]
      traces:
        - span_name: "planning_pipeline"
          attributes: ["stage", "llm_model", "token_count"]
    estimated_duration_ms: 3600

  execution:
    state_id: "execution"
    state_type: "intermediate"
    description: "Sequential execution of plan steps with tool orchestration"
    valid_roles: ["executor", "tool_runner"]
    entry_actions:
      - "initialize_execution_context"
      - "load_plan_steps"
    loop_conditions:
      - "steps_remaining"
      - "no_critical_errors"
    exit_conditions:
      - "all_steps_completed"
      - "critical_error_occurred"
      - "replanning_required"
    timeout_policy: "execution_timeout"
    tool_orchestration:
      enabled: true
      max_parallel_tools: 3
      tool_timeout_ms: 5000
      sandbox_enabled: true
    observability:
      metrics:
        - "execution_latency_ms"
        - "steps_executed_total"
        - "tool_calls_total"
        - "tool_failures_total"
      logs:
        - level: "INFO"
          message: "Step executed"
          fields: ["task_id", "step_id", "tool_name", "duration_ms"]
      traces:
        - span_name: "step_execution"
          attributes: ["step_id", "tool_name", "result_status"]
    estimated_duration_ms: 20000

  replanning:
    state_id: "replanning"
    state_type: "intermediate"
    description: "Adaptive replanning on execution failures"
    valid_roles: ["planner"]
    entry_actions:
      - "analyze_failure"
      - "generate_replan"
      - "validate_replan"
    exit_conditions:
      - "replan_validated"
      - "max_replans_exceeded"
    timeout_policy: "replanning_timeout"
    max_replans: 2
    observability:
      metrics:
        - "replanning_triggered_total"
        - "replanning_latency_ms"
        - "replan_success_rate"
      logs:
        - level: "WARN"
          message: "Replanning triggered"
          fields: ["task_id", "failure_reason", "replan_attempt"]
    estimated_duration_ms: 4000

  completed:
    state_id: "completed"
    state_type: "final"
    description: "Task execution completed successfully"
    valid_roles: ["orchestrator"]
    entry_actions:
      - "finalize_results"
      - "update_learning_loop"
      - "emit_completion_event"
    exit_conditions: []
    timeout_policy: "none"
    learning_signals:
      - signal_type: "explicit"
        weight: 1.0
        source: "user_feedback"
      - signal_type: "implicit"
        weight: 0.5
        source: "completion_time"
      - signal_type: "behavioral"
        weight: 0.2
        source: "tool_success_rate"
    observability:
      metrics:
        - "task_completed_total"
        - "task_end_to_end_latency_ms"
        - "task_success_rate"
      logs:
        - level: "INFO"
          message: "Task execution completed"
          fields: ["task_id", "total_duration_ms", "steps_count"]
    estimated_duration_ms: 100

fsm_transitions:
  start_to_planning:
    transition_id: "start_to_planning"
    from_state: "start"
    to_state: "planning"
    trigger: "task_validated"
    guard_conditions:
      - "planner_agent_in_active_state"
      - "no_conflicting_tasks"
    message_exchange:
      message_type: "TaskAnnouncement"
      sender_role: "orchestrator"
      receiver_role: "planner"
      delivery_guarantee: "at_least_once"
    actions:
      - "assign_planner_agent"
      - "start_planning_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_start_to_planning_total"
      logs:
        - level: "DEBUG"
          message: "Transition: start → planning"

  planning_to_execution:
    transition_id: "planning_to_execution"
    from_state: "planning"
    to_state: "execution"
    trigger: "plan_validated"
    guard_conditions:
      - "plan_has_executable_steps"
      - "executor_agent_available"
      - "required_tools_available"
    message_exchange:
      message_type: "ExecutionPlan"
      sender_role: "planner"
      receiver_role: "executor"
      delivery_guarantee: "exactly_once"
    actions:
      - "assign_executor_agent"
      - "load_plan_to_executor"
      - "start_execution_timer"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_planning_to_execution_total"
        - "plan_step_count"
      logs:
        - level: "INFO"
          message: "Transition: planning → execution"

  execution_to_replanning:
    transition_id: "execution_to_replanning"
    from_state: "execution"
    to_state: "replanning"
    trigger: "execution_failure_recoverable"
    guard_conditions:
      - "replan_count_below_max"
      - "planner_agent_available"
      - "failure_is_recoverable"
    message_exchange:
      message_type: "ReplanRequest"
      sender_role: "executor"
      receiver_role: "planner"
      delivery_guarantee: "at_least_once"
    actions:
      - "capture_failure_context"
      - "increment_replan_counter"
      - "start_replanning_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_execution_to_replanning_total"
        - "replan_triggers_by_reason"
      logs:
        - level: "WARN"
          message: "Transition: execution → replanning"

  replanning_to_execution:
    transition_id: "replanning_to_execution"
    from_state: "replanning"
    to_state: "execution"
    trigger: "replan_validated"
    guard_conditions:
      - "replan_has_executable_steps"
      - "executor_agent_available"
    message_exchange:
      message_type: "ExecutionPlan"
      sender_role: "planner"
      receiver_role: "executor"
      delivery_guarantee: "exactly_once"
    actions:
      - "load_replan_to_executor"
      - "restart_execution_timer"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_replanning_to_execution_total"
      logs:
        - level: "INFO"
          message: "Transition: replanning → execution"

  execution_to_completed:
    transition_id: "execution_to_completed"
    from_state: "execution"
    to_state: "completed"
    trigger: "all_steps_completed"
    guard_conditions:
      - "no_pending_steps"
      - "all_tools_finalized"
    message_exchange:
      message_type: "TaskResult"
      sender_role: "executor"
      receiver_role: "orchestrator"
      delivery_guarantee: "exactly_once"
    actions:
      - "collect_results"
      - "stop_execution_timer"
      - "emit_completion_metrics"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_execution_to_completed_total"
      logs:
        - level: "INFO"
          message: "Transition: execution → completed"

  planning_to_completed:
    transition_id: "planning_to_completed"
    from_state: "planning"
    to_state: "completed"
    trigger: "plan_rejected_final"
    guard_conditions:
      - "max_planning_retries_exceeded"
    message_exchange:
      message_type: "TaskFailure"
      sender_role: "planner"
      receiver_role: "orchestrator"
      delivery_guarantee: "exactly_once"
    actions:
      - "log_planning_failure"
      - "emit_failure_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_planning_to_completed_failure_total"
      logs:
        - level: "ERROR"
          message: "Transition: planning → completed (failure)"

  replanning_to_completed:
    transition_id: "replanning_to_completed"
    from_state: "replanning"
    to_state: "completed"
    trigger: "max_replans_exceeded"
    guard_conditions:
      - "replan_count_equals_max"
    message_exchange:
      message_type: "TaskFailure"
      sender_role: "planner"
      receiver_role: "orchestrator"
      delivery_guarantee: "exactly_once"
    actions:
      - "log_replanning_failure"
      - "emit_failure_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_replanning_to_completed_failure_total"
      logs:
        - level: "ERROR"
          message: "Transition: replanning → completed (failure)"

  execution_to_completed_error:
    transition_id: "execution_to_completed_error"
    from_state: "execution"
    to_state: "completed"
    trigger: "critical_error_occurred"
    guard_conditions:
      - "error_is_unrecoverable"
    message_exchange:
      message_type: "TaskFailure"
      sender_role: "executor"
      receiver_role: "orchestrator"
      delivery_guarantee: "exactly_once"
    actions:
      - "log_critical_error"
      - "cleanup_resources"
      - "emit_failure_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_execution_to_completed_error_total"
      logs:
        - level: "ERROR"
          message: "Transition: execution → completed (critical error)"

  start_to_completed_abort:
    transition_id: "start_to_completed_abort"
    from_state: "start"
    to_state: "completed"
    trigger: "task_validation_failed"
    guard_conditions:
      - "validation_errors_present"
    message_exchange:
      message_type: "TaskRejection"
      sender_role: "orchestrator"
      receiver_role: "system"
      delivery_guarantee: "at_least_once"
    actions:
      - "log_validation_errors"
      - "emit_rejection_metrics"
    max_duration_ms: 20
    observability:
      metrics:
        - "transition_start_to_completed_abort_total"
      logs:
        - level: "WARN"
          message: "Transition: start → completed (validation failed)"

  any_to_completed_timeout:
    transition_id: "any_to_completed_timeout"
    from_state: "*"
    to_state: "completed"
    trigger: "protocol_timeout"
    guard_conditions:
      - "max_duration_exceeded"
    message_exchange:
      message_type: "TaskTimeout"
      sender_role: "system"
      receiver_role: "orchestrator"
      delivery_guarantee: "best_effort"
    actions:
      - "log_timeout"
      - "cleanup_resources"
      - "emit_timeout_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_any_to_completed_timeout_total"
      logs:
        - level: "ERROR"
          message: "Transition: * → completed (timeout)"

timeout_policies:
  planning_timeout:
    timeout_id: "planning_timeout"
    duration_ms: 5000
    scope: "state"
    target_state: "planning"
    action_on_timeout: "abort"
    fallback_transition: "planning_to_completed"
    retry_allowed: true
    max_retries: 2
    observability:
      metrics:
        - "planning_timeout_total"
      logs:
        - level: "ERROR"
          message: "Planning timeout triggered"

  execution_timeout:
    timeout_id: "execution_timeout"
    duration_ms: 25000
    scope: "state"
    target_state: "execution"
    action_on_timeout: "abort"
    fallback_transition: "execution_to_completed_error"
    retry_allowed: false
    observability:
      metrics:
        - "execution_timeout_total"
      logs:
        - level: "ERROR"
          message: "Execution timeout triggered"

  replanning_timeout:
    timeout_id: "replanning_timeout"
    duration_ms: 5000
    scope: "state"
    target_state: "replanning"
    action_on_timeout: "abort"
    fallback_transition: "replanning_to_completed"
    retry_allowed: false
    observability:
      metrics:
        - "replanning_timeout_total"
      logs:
        - level: "ERROR"
          message: "Replanning timeout triggered"

violation_handlers:
  out_of_order_message:
    violation_type: "out_of_order_message"
    action: "block"
    severity: "HIGH"
    recovery_strategy: "drop_message"
    observability:
      metrics:
        - "violation_out_of_order_total"
      logs:
        - level: "ERROR"
          message: "Out-of-order message detected"

  invalid_role:
    violation_type: "invalid_role"
    action: "block"
    severity: "CRITICAL"
    recovery_strategy: "abort_protocol"
    observability:
      metrics:
        - "violation_invalid_role_total"
      logs:
        - level: "CRITICAL"
          message: "Invalid role attempted state transition"

  timeout_exceeded:
    violation_type: "timeout_exceeded"
    action: "fallback"
    severity: "HIGH"
    recovery_strategy: "execute_fallback_transition"
    observability:
      metrics:
        - "violation_timeout_total"
      logs:
        - level: "ERROR"
          message: "Timeout exceeded"

  max_replans_exceeded:
    violation_type: "max_replans_exceeded"
    action: "abort"
    severity: "MEDIUM"
    recovery_strategy: "abort_with_failure"
    observability:
      metrics:
        - "violation_max_replans_total"
      logs:
        - level: "WARN"
          message: "Max replanning attempts exceeded"

message_schemas:
  TaskAnnouncement:
    message_type: "TaskAnnouncement"
    sender_role: "orchestrator"
    receiver_role: "planner"
    delivery_guarantee: "at_least_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/orchestrator.fbs::TaskAnnouncement"
    fields:
      task_id:
        type: "string"
        required: true
        max_length: 64
        format: "uuid"
      user_message:
        type: "string"
        required: true
        max_length: 4096
        description: "User's original task description"
      intent:
        type: "string"
        required: true
        enum: ["query", "command", "clarification", "multi_turn"]
      context:
        type: "object"
        required: false
        description: "Session context and conversation history"
      required_capabilities:
        type: "array"
        required: true
        items: "string"
        description: "Capabilities required for task execution"
      trace_id:
        type: "string"
        required: true
        format: "uuid"
        description: "Cognitive trace ID for observability"
    validation:
      - "task_id must be valid UUID"
      - "user_message cannot be empty"
      - "intent must be one of allowed values"
      - "required_capabilities must have at least one entry"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 8192

  ExecutionPlan:
    message_type: "ExecutionPlan"
    sender_role: "planner"
    receiver_role: "executor"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/planner.fbs::ExecutionPlan"
    fields:
      plan_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      steps:
        type: "array"
        required: true
        items: "PlanStep"
        min_length: 1
        max_length: 50
        description: "Sequential execution steps"
      estimated_duration_ms:
        type: "integer"
        required: true
        min: 100
        max: 30000
      validation_status:
        type: "string"
        required: true
        enum: ["validated_rules", "validated_arbiter", "validated_both"]
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    nested_types:
      PlanStep:
        step_id:
          type: "string"
          required: true
        step_type:
          type: "string"
          required: true
          enum: ["tool_call", "reasoning", "data_fetch", "aggregation"]
        tool_name:
          type: "string"
          required: false
        parameters:
          type: "object"
          required: false
        dependencies:
          type: "array"
          required: false
          items: "string"
          description: "Step IDs this step depends on"
    validation:
      - "plan_id must be valid UUID"
      - "steps array must not be empty"
      - "step dependencies must form DAG (no cycles)"
      - "all referenced tools must be available"
    performance:
      max_serialization_time_ms: 10
      max_size_bytes: 32768

  ReplanRequest:
    message_type: "ReplanRequest"
    sender_role: "executor"
    receiver_role: "planner"
    delivery_guarantee: "at_least_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/executor.fbs::ReplanRequest"
    fields:
      plan_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      failure_reason:
        type: "string"
        required: true
        max_length: 1024
        description: "Detailed reason for replanning"
      failed_step_id:
        type: "string"
        required: true
      completed_steps:
        type: "array"
        required: true
        items: "string"
        description: "Step IDs successfully completed"
      error_context:
        type: "object"
        required: true
        description: "Error details for replanning analysis"
      replan_attempt:
        type: "integer"
        required: true
        min: 1
        max: 2
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "replan_attempt must be <= max_replans (2)"
      - "failed_step_id must exist in original plan"
      - "error_context must contain stack trace"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 16384

  TaskResult:
    message_type: "TaskResult"
    sender_role: "executor"
    receiver_role: "orchestrator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/executor.fbs::TaskResult"
    fields:
      task_id:
        type: "string"
        required: true
        format: "uuid"
      result_status:
        type: "string"
        required: true
        enum: ["success", "partial_success", "failure"]
      result_data:
        type: "object"
        required: true
        description: "Task execution results"
      steps_executed:
        type: "integer"
        required: true
        min: 0
      total_duration_ms:
        type: "integer"
        required: true
        min: 0
      tool_calls_count:
        type: "integer"
        required: true
        min: 0
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "result_status must be one of allowed values"
      - "steps_executed must be >= 0"
      - "result_data must be serializable"
    performance:
      max_serialization_time_ms: 10
      max_size_bytes: 65536

  TaskFailure:
    message_type: "TaskFailure"
    sender_role: "executor|planner"
    receiver_role: "orchestrator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/orchestrator.fbs::TaskFailure"
    fields:
      task_id:
        type: "string"
        required: true
        format: "uuid"
      failure_reason:
        type: "string"
        required: true
        max_length: 2048
      failure_stage:
        type: "string"
        required: true
        enum: ["planning", "execution", "replanning"]
      error_code:
        type: "string"
        required: true
      stack_trace:
        type: "string"
        required: false
        max_length: 8192
      partial_results:
        type: "object"
        required: false
        description: "Any partial results before failure"
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "failure_stage must be one of allowed values"
      - "error_code must follow error taxonomy"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 16384

  TaskRejection:
    message_type: "TaskRejection"
    sender_role: "orchestrator"
    receiver_role: "system"
    delivery_guarantee: "at_least_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/orchestrator.fbs::TaskRejection"
    fields:
      task_id:
        type: "string"
        required: true
        format: "uuid"
      rejection_reason:
        type: "string"
        required: true
        max_length: 1024
      validation_errors:
        type: "array"
        required: true
        items: "string"
        description: "List of validation errors"
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "validation_errors must not be empty"
    performance:
      max_serialization_time_ms: 2
      max_size_bytes: 4096

role_definitions:
  orchestrator:
    role_id: "orchestrator"
    role_type: "pure_agent"
    description: "Task orchestrator that manages protocol lifecycle"
    capabilities:
      - "task_validation"
      - "agent_coordination"
      - "result_aggregation"
    allowed_states:
      - "start"
      - "completed"
    allowed_transitions:
      - "start_to_planning"
      - "start_to_completed_abort"
    message_permissions:
      can_send:
        - "TaskAnnouncement"
        - "TaskRejection"
      can_receive:
        - "TaskResult"
        - "TaskFailure"
    attestation_required: true
    attestation_method: "hmac_sha256"

  planner:
    role_id: "planner"
    role_type: "ai_agent"
    description: "AI planner agent with 4-stage pipeline and LLM reasoning"
    capabilities:
      - "plan_generation"
      - "llm_reasoning"
      - "plan_validation"
      - "adaptive_replanning"
    allowed_states:
      - "planning"
      - "replanning"
    allowed_transitions:
      - "planning_to_execution"
      - "planning_to_completed"
      - "replanning_to_execution"
      - "replanning_to_completed"
    message_permissions:
      can_send:
        - "ExecutionPlan"
        - "TaskFailure"
      can_receive:
        - "TaskAnnouncement"
        - "ReplanRequest"
    attestation_required: true
    attestation_method: "hmac_sha256"
    llm_model: "gpt-4"
    llm_temperature: 0.7

  executor:
    role_id: "executor"
    role_type: "ai_agent"
    description: "AI executor agent that runs plan steps and orchestrates tools"
    capabilities:
      - "step_execution"
      - "tool_orchestration"
      - "error_detection"
      - "result_aggregation"
    allowed_states:
      - "execution"
    allowed_transitions:
      - "execution_to_completed"
      - "execution_to_replanning"
      - "execution_to_completed_error"
    message_permissions:
      can_send:
        - "ReplanRequest"
        - "TaskResult"
        - "TaskFailure"
      can_receive:
        - "ExecutionPlan"
    attestation_required: true
    attestation_method: "hmac_sha256"

  tool_runner:
    role_id: "tool_runner"
    role_type: "pure_agent"
    description: "Pure agent that executes tools in sandboxed environment"
    capabilities:
      - "tool_execution"
      - "sandboxing"
      - "timeout_enforcement"
      - "result_validation"
    allowed_states:
      - "execution"
    allowed_transitions: []
    message_permissions:
      can_send: []
      can_receive: []
    attestation_required: true
    attestation_method: "hmac_sha256"
    sandbox_enabled: true

performance_requirements:
  latency_targets:
    p50_ms: 8000
    p95_ms: 20000
    p99_ms: 28000
    description: "End-to-end task execution latency from start to completed"

  stage_latencies:
    planning_p95_ms: 3600
    execution_p95_ms: 20000
    replanning_p95_ms: 4000
    description: "Per-stage latency targets"

  throughput_targets:
    tasks_per_second: 10
    concurrent_tasks: 50
    description: "System-wide task processing capacity"

  resource_limits:
    memory_per_task_mb: 100
    cpu_per_task_percent: 25
    max_tool_calls_per_task: 20
    description: "Resource constraints per task"

  validation_requirements:
    compile_time_validation: true
    runtime_validation: true
    validation_latency_budget_ms: 2
    description: "Protocol validation must complete within mailbox budget"

observability:
  metrics:
    counters:
      - name: "task_received_total"
        description: "Total tasks received"
        labels: ["intent"]
      - name: "task_completed_total"
        description: "Total tasks completed"
        labels: ["status"]
      - name: "planning_retries_total"
        description: "Total planning retries"
        labels: ["reason"]
      - name: "tool_calls_total"
        description: "Total tool calls"
        labels: ["tool_name", "status"]
      - name: "replanning_triggered_total"
        description: "Total replanning triggers"
        labels: ["reason"]

    histograms:
      - name: "task_end_to_end_latency_ms"
        description: "End-to-end task latency"
        buckets: [1000, 5000, 10000, 20000, 30000]
      - name: "planning_latency_ms"
        description: "Planning stage latency"
        buckets: [500, 1000, 2000, 3600, 5000]
      - name: "execution_latency_ms"
        description: "Execution stage latency"
        buckets: [5000, 10000, 15000, 20000, 25000]
      - name: "tool_call_latency_ms"
        description: "Individual tool call latency"
        buckets: [100, 500, 1000, 3000, 5000]

    gauges:
      - name: "active_tasks"
        description: "Number of active tasks in execution"
      - name: "pending_tasks"
        description: "Number of tasks waiting for planning"
      - name: "replanning_tasks"
        description: "Number of tasks in replanning"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "task_id"
      - "trace_id"
      - "timestamp"
      - "level"
      - "message"
    optional_fields:
      - "plan_id"
      - "step_id"
      - "tool_name"
      - "duration_ms"
      - "error_code"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0
    spans:
      - name: "task_execution"
        attributes: ["task_id", "intent"]
      - name: "planning_pipeline"
        attributes: ["plan_id", "stage"]
      - name: "step_execution"
        attributes: ["step_id", "tool_name"]
      - name: "replanning"
        attributes: ["replan_attempt", "reason"]

testing_requirements:
  unit_tests:
    - test_fsm_state_transitions
    - test_timeout_enforcement
    - test_role_validation
    - test_message_serialization

  integration_tests:
    - test_complete_task_execution_flow
    - test_planning_pipeline_4_stages
    - test_execution_with_tool_calls
    - test_replanning_on_failure
    - test_timeout_recovery
    - test_validation_failure_paths

  protocol_validation_tests:
    - test_mpst_compliance
    - test_deadlock_freedom
    - test_progress_guarantee

  performance_tests:
    - test_latency_under_p95_20s
    - test_concurrent_task_execution_50_tasks
    - test_tool_call_orchestration_latency

  chaos_tests:
    - test_random_agent_failures
    - test_network_delays
    - test_tool_timeouts
    - test_max_replanning_exhaustion

compliance:
  adr_references:
    - "ADR-0003b: Six Core Protocol Implementations"
    - "ADR-0006: 4-Stage Planner Agent"
    - "ADR-0007: Tool Runner with Sandboxing"
    - "ADR-0005: Learning Loop with Feedback Signals"

  research_validation:
    - citation: "MPST (Honda et al. 2008)"
      compliance: "Protocol guarantees type safety and deadlock freedom"
    - citation: "ReAct Pattern (Yao et al. 2022)"
      compliance: "LLM reasoning integrated in planning stage"
    - citation: "SEDA (Welsh et al. 2001)"
      compliance: "Staged pipeline with event-driven execution"

  security_requirements:
    - "All roles must be attested with HMAC-SHA256"
    - "Tool execution must run in sandboxed environment"
    - "PII must be redacted in logs"

  privacy_requirements:
    - "Task context must respect privacy bands (GREEN/AMBER/RED)"
    - "RED band tasks require arbiter approval"

cross_references:
  related_protocols:
    - protocol: "agent_hire"
      relationship: "precedes"
      description: "Agent hiring must complete before task execution"
    - protocol: "clarification"
      relationship: "can_nest"
      description: "Clarification can be triggered during planning"
    - protocol: "tool_call"
      relationship: "invokes"
      description: "Task execution invokes tool call protocol"
    - protocol: "saga_rollback"
      relationship: "error_recovery"
      description: "Saga rollback handles execution failures"

  related_contracts:
    - contract: "contracts/agent_lifecycle/README.md"
      section: "Agent State Management"
    - contract: "contracts/planning/README.md"
      section: "4-Stage Planning Pipeline"
    - contract: "contracts/tools/README.md"
      section: "Tool Orchestration"

  related_adrs:
    - "ADR-0002: Actor Model with Message-Passing Validation"
    - "ADR-0003: MPST Protocol Validation"
    - "ADR-0003b: Six Core Protocol Implementations"
    - "ADR-0006: 4-Stage Planner Agent"
    - "ADR-0007: Tool Runner with Sandboxing"

notes:
  - "This is the most complex of the 6 core protocols, involving AI agents, LLM reasoning, and tool orchestration"
  - "4-stage planning pipeline is central to K1's adaptive intelligence"
  - "Adaptive replanning allows recovery from execution failures (max 2 replans)"
  - "Tool orchestration supports up to 3 parallel tools with 5s timeout each"
  - "Learning signals (explicit/implicit/behavioral) feed back to learning loop"
  - "P95 latency target is 20s end-to-end, with 3.6s for planning and 20s for execution"
