# Tool Call Protocol Contract
# Epic 1.3 - Issue 1.3.2 - Protocol Definition 5 of 6
# Version: 1.0.0
# Status: DRAFT
# Owner: Protocol Team
# ADR References: ADR-0003b (Six Core Protocols), ADR-0007 (Tool Runner)

metadata:
  protocol_id: "tool_call"
  protocol_name: "Tool Call Protocol"
  version: "1.0.0"
  description: |
    Sandboxed tool execution protocol with timeout enforcement and result validation.
    Handles tool invocation, execution monitoring, and error recovery.
    Implements contract from ADR-0003b Section 2.5 (Tool Call).
  research_foundation:
    - "Actor Model (Hewitt 1973) - Isolated execution"
    - "MPST (Honda et al. 2008) - Protocol validation"
    - "Sandbox Security (Goldberg et al. 1996) - Isolation mechanisms"
  complexity: "MEDIUM"
  ai_involvement: "MINIMAL"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

protocol_specification:
  overview: |
    Tool Call Protocol manages the complete lifecycle of tool execution from invocation
    to result validation. It enforces sandboxing, timeout policies, and error recovery.
    Critical for safe and reliable tool orchestration in K1.

  protocol_type: "core"
  state_count: 4
  transition_count: 7
  max_duration_ms: 5000
  timeout_count: 1
  message_count: 4
  role_count: 3

  coordination_pattern: "request_execute_respond"
  ai_agent_roles: []
  pure_agent_roles:
    - "executor"
    - "tool_runner"
    - "validator"

  security_critical: true
  sandbox_required: true

fsm_states:
  start:
    state_id: "start"
    state_type: "initial"
    description: "Tool call initiated"
    valid_roles: ["executor"]
    entry_actions:
      - "validate_tool_exists"
      - "validate_parameters"
      - "check_tool_availability"
    exit_conditions:
      - "tool_validated"
      - "validation_failed"
    timeout_policy: "none"
    observability:
      metrics:
        - "tool_call_initiated_total"
      logs:
        - level: "INFO"
          message: "Tool call started"
          fields: ["tool_name", "task_id", "trace_id"]
    estimated_duration_ms: 50

  executing:
    state_id: "executing"
    state_type: "intermediate"
    description: "Tool executing in sandbox"
    valid_roles: ["tool_runner"]
    entry_actions:
      - "initialize_sandbox"
      - "load_tool_code"
      - "inject_parameters"
      - "start_execution_timer"
    exit_conditions:
      - "execution_completed"
      - "execution_timeout"
      - "execution_error"
    timeout_policy: "execution_timeout"
    sandbox_config:
      network_access: false
      filesystem_access: "read_only"
      memory_limit_mb: 512
      cpu_limit_percent: 50
    observability:
      metrics:
        - "tool_execution_latency_ms"
        - "sandbox_violations_total"
      logs:
        - level: "INFO"
          message: "Tool executing"
          fields: ["tool_name", "sandbox_id", "trace_id"]
      traces:
        - span_name: "tool_execution"
          attributes: ["tool_name", "sandbox_id"]
    estimated_duration_ms: 3000

  validating:
    state_id: "validating"
    state_type: "intermediate"
    description: "Validating tool output"
    valid_roles: ["validator"]
    entry_actions:
      - "validate_output_schema"
      - "check_output_safety"
      - "verify_execution_logs"
    exit_conditions:
      - "validation_passed"
      - "validation_failed"
    timeout_policy: "none"
    observability:
      metrics:
        - "tool_validation_latency_ms"
        - "validation_failures_total"
      logs:
        - level: "INFO"
          message: "Validating tool output"
          fields: ["tool_name", "output_size_bytes", "trace_id"]
    estimated_duration_ms: 100

  completed:
    state_id: "completed"
    state_type: "final"
    description: "Tool call completed"
    valid_roles: ["executor"]
    entry_actions:
      - "cleanup_sandbox"
      - "emit_metrics"
      - "return_result"
    exit_conditions: []
    timeout_policy: "none"
    observability:
      metrics:
        - "tool_call_completed_total"
        - "tool_call_end_to_end_latency_ms"
      logs:
        - level: "INFO"
          message: "Tool call completed"
          fields: ["tool_name", "status", "total_duration_ms"]
    estimated_duration_ms: 50

fsm_transitions:
  start_to_executing:
    transition_id: "start_to_executing"
    from_state: "start"
    to_state: "executing"
    trigger: "tool_validated"
    guard_conditions:
      - "tool_exists"
      - "parameters_valid"
      - "tool_runner_available"
    message_exchange:
      message_type: "ToolInvocation"
      sender_role: "executor"
      receiver_role: "tool_runner"
      delivery_guarantee: "exactly_once"
    actions:
      - "assign_tool_runner"
      - "start_latency_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_start_to_executing_total"

  executing_to_validating:
    transition_id: "executing_to_validating"
    from_state: "executing"
    to_state: "validating"
    trigger: "execution_completed"
    guard_conditions:
      - "output_produced"
      - "no_sandbox_violations"
      - "validator_available"
    message_exchange:
      message_type: "ToolOutput"
      sender_role: "tool_runner"
      receiver_role: "validator"
      delivery_guarantee: "exactly_once"
    actions:
      - "capture_output"
      - "stop_execution_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_executing_to_validating_total"

  validating_to_completed:
    transition_id: "validating_to_completed"
    from_state: "validating"
    to_state: "completed"
    trigger: "validation_passed"
    guard_conditions:
      - "schema_valid"
      - "output_safe"
    message_exchange:
      message_type: "ToolResult"
      sender_role: "validator"
      receiver_role: "executor"
      delivery_guarantee: "exactly_once"
    actions:
      - "package_result"
      - "emit_success_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_validating_to_completed_success_total"

  validating_to_completed_failure:
    transition_id: "validating_to_completed_failure"
    from_state: "validating"
    to_state: "completed"
    trigger: "validation_failed"
    guard_conditions:
      - "schema_invalid_or_unsafe"
    message_exchange:
      message_type: "ToolError"
      sender_role: "validator"
      receiver_role: "executor"
      delivery_guarantee: "exactly_once"
    actions:
      - "log_validation_failure"
      - "emit_failure_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_validating_to_completed_failure_total"
      logs:
        - level: "ERROR"
          message: "Tool output validation failed"

  executing_to_completed_timeout:
    transition_id: "executing_to_completed_timeout"
    from_state: "executing"
    to_state: "completed"
    trigger: "execution_timeout"
    guard_conditions:
      - "timeout_exceeded"
    message_exchange:
      message_type: "ToolTimeout"
      sender_role: "system"
      receiver_role: "executor"
      delivery_guarantee: "best_effort"
    actions:
      - "kill_sandbox"
      - "log_timeout"
      - "emit_timeout_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_executing_to_completed_timeout_total"
      logs:
        - level: "ERROR"
          message: "Tool execution timeout"

  executing_to_completed_error:
    transition_id: "executing_to_completed_error"
    from_state: "executing"
    to_state: "completed"
    trigger: "execution_error"
    guard_conditions:
      - "error_occurred"
    message_exchange:
      message_type: "ToolError"
      sender_role: "tool_runner"
      receiver_role: "executor"
      delivery_guarantee: "exactly_once"
    actions:
      - "capture_error_logs"
      - "cleanup_sandbox"
      - "emit_error_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_executing_to_completed_error_total"
      logs:
        - level: "ERROR"
          message: "Tool execution error"

  start_to_completed_abort:
    transition_id: "start_to_completed_abort"
    from_state: "start"
    to_state: "completed"
    trigger: "validation_failed"
    guard_conditions:
      - "tool_not_found_or_invalid_params"
    message_exchange:
      message_type: "ToolRejection"
      sender_role: "executor"
      receiver_role: "system"
      delivery_guarantee: "at_least_once"
    actions:
      - "log_rejection"
      - "emit_rejection_metrics"
    max_duration_ms: 20
    observability:
      metrics:
        - "transition_start_to_completed_abort_total"

timeout_policies:
  execution_timeout:
    timeout_id: "execution_timeout"
    duration_ms: 5000
    scope: "state"
    target_state: "executing"
    action_on_timeout: "kill_sandbox"
    fallback_transition: "executing_to_completed_timeout"
    retry_allowed: false
    observability:
      metrics:
        - "tool_execution_timeout_total"
      logs:
        - level: "ERROR"
          message: "Tool execution timeout, killing sandbox"

violation_handlers:
  out_of_order_message:
    violation_type: "out_of_order_message"
    action: "block"
    severity: "HIGH"
    recovery_strategy: "abort_execution"

  invalid_role:
    violation_type: "invalid_role"
    action: "block"
    severity: "CRITICAL"
    recovery_strategy: "kill_sandbox"

  timeout_exceeded:
    violation_type: "timeout_exceeded"
    action: "abort"
    severity: "MEDIUM"
    recovery_strategy: "kill_sandbox"

  sandbox_violation:
    violation_type: "sandbox_violation"
    action: "abort"
    severity: "CRITICAL"
    recovery_strategy: "kill_sandbox_and_quarantine"

message_schemas:
  ToolInvocation:
    message_type: "ToolInvocation"
    sender_role: "executor"
    receiver_role: "tool_runner"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer3_execution/tool_runner.fbs::ToolInvocation"
    fields:
      tool_name:
        type: "string"
        required: true
        max_length: 128
      tool_version:
        type: "string"
        required: true
        format: "semver"
      parameters:
        type: "object"
        required: true
        description: "Tool input parameters"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      timeout_ms:
        type: "integer"
        required: true
        default: 5000
        max: 5000
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "tool_name must be registered"
      - "parameters must match tool schema"
      - "timeout_ms must be <= 5000ms"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 16384

  ToolOutput:
    message_type: "ToolOutput"
    sender_role: "tool_runner"
    receiver_role: "validator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer3_execution/tool_runner.fbs::ToolOutput"
    fields:
      tool_name:
        type: "string"
        required: true
      task_id:
        type: "string"
        required: true
        format: "uuid"
      output_data:
        type: "object"
        required: true
        description: "Tool execution output"
      execution_time_ms:
        type: "integer"
        required: true
      sandbox_id:
        type: "string"
        required: true
      execution_logs:
        type: "string"
        required: false
        max_length: 4096
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "output_data must be serializable"
      - "execution_time_ms must be > 0"
    performance:
      max_serialization_time_ms: 10
      max_size_bytes: 65536

  ToolResult:
    message_type: "ToolResult"
    sender_role: "validator"
    receiver_role: "executor"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer3_execution/tool_runner.fbs::ToolResult"
    fields:
      tool_name:
        type: "string"
        required: true
      task_id:
        type: "string"
        required: true
        format: "uuid"
      result_data:
        type: "object"
        required: true
        description: "Validated tool result"
      validation_status:
        type: "string"
        required: true
        enum: ["validated", "warning", "sanitized"]
      total_latency_ms:
        type: "integer"
        required: true
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "validation_status must be one of allowed values"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 65536

  ToolError:
    message_type: "ToolError"
    sender_role: "tool_runner|validator"
    receiver_role: "executor"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer3_execution/tool_runner.fbs::ToolError"
    fields:
      tool_name:
        type: "string"
        required: true
      task_id:
        type: "string"
        required: true
        format: "uuid"
      error_type:
        type: "string"
        required: true
        enum: ["execution_error", "validation_error", "sandbox_violation", "timeout"]
      error_message:
        type: "string"
        required: true
        max_length: 2048
      stack_trace:
        type: "string"
        required: false
        max_length: 8192
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "error_type must be one of allowed values"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 16384

role_definitions:
  executor:
    role_id: "executor"
    role_type: "pure_agent"
    description: "Executor that orchestrates tool calls"
    capabilities:
      - "tool_invocation"
      - "result_handling"
    allowed_states:
      - "start"
      - "completed"
    allowed_transitions:
      - "start_to_executing"
      - "start_to_completed_abort"
    message_permissions:
      can_send:
        - "ToolInvocation"
        - "ToolRejection"
      can_receive:
        - "ToolResult"
        - "ToolError"
        - "ToolTimeout"
    attestation_required: true
    attestation_method: "hmac_sha256"

  tool_runner:
    role_id: "tool_runner"
    role_type: "pure_agent"
    description: "Pure agent that executes tools in sandboxed environment"
    capabilities:
      - "sandbox_management"
      - "tool_execution"
      - "timeout_enforcement"
    allowed_states:
      - "executing"
    allowed_transitions:
      - "executing_to_validating"
      - "executing_to_completed_error"
    message_permissions:
      can_send:
        - "ToolOutput"
        - "ToolError"
      can_receive:
        - "ToolInvocation"
    attestation_required: true
    attestation_method: "hmac_sha256"
    sandbox_enabled: true

  validator:
    role_id: "validator"
    role_type: "pure_agent"
    description: "Pure agent that validates tool output"
    capabilities:
      - "schema_validation"
      - "safety_checking"
    allowed_states:
      - "validating"
    allowed_transitions:
      - "validating_to_completed"
      - "validating_to_completed_failure"
    message_permissions:
      can_send:
        - "ToolResult"
        - "ToolError"
      can_receive:
        - "ToolOutput"
    attestation_required: true
    attestation_method: "hmac_sha256"

performance_requirements:
  latency_targets:
    p50_ms: 2000
    p95_ms: 2800
    p99_ms: 3000
    description: "End-to-end tool call latency (execution + validation)"

  execution_latency:
    p95_ms: 2500
    description: "Tool execution latency in sandbox"

  validation_latency:
    p95_ms: 100
    description: "Output validation latency"

  throughput_targets:
    tools_per_second: 50
    concurrent_tools: 20
    description: "System-wide tool execution capacity"

  resource_limits:
    memory_per_tool_mb: 512
    cpu_per_tool_percent: 50
    timeout_ms: 5000
    description: "Per-tool resource constraints"

observability:
  metrics:
    counters:
      - name: "tool_call_initiated_total"
        description: "Total tool calls initiated"
        labels: ["tool_name"]
      - name: "tool_call_completed_total"
        description: "Total tool calls completed"
        labels: ["tool_name", "status"]
      - name: "tool_execution_timeout_total"
        description: "Total tool execution timeouts"
        labels: ["tool_name"]
      - name: "sandbox_violations_total"
        description: "Total sandbox violations"
        labels: ["tool_name", "violation_type"]

    histograms:
      - name: "tool_call_end_to_end_latency_ms"
        description: "End-to-end tool call latency"
        buckets: [500, 1000, 2000, 2800, 3000, 5000]
        labels: ["tool_name"]
      - name: "tool_execution_latency_ms"
        description: "Tool execution latency"
        buckets: [500, 1000, 1500, 2000, 2500, 3000]
        labels: ["tool_name"]
      - name: "tool_validation_latency_ms"
        description: "Output validation latency"
        buckets: [10, 25, 50, 75, 100, 150]

    gauges:
      - name: "active_tool_calls"
        description: "Number of active tool executions"
      - name: "active_sandboxes"
        description: "Number of active sandboxes"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "tool_name"
      - "task_id"
      - "trace_id"
      - "sandbox_id"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0
    spans:
      - name: "tool_call_protocol"
        attributes: ["tool_name", "task_id"]
      - name: "tool_execution"
        attributes: ["tool_name", "sandbox_id"]
      - name: "tool_validation"
        attributes: ["tool_name", "validation_status"]

testing_requirements:
  unit_tests:
    - test_fsm_state_transitions
    - test_timeout_enforcement
    - test_sandbox_initialization
    - test_output_validation

  integration_tests:
    - test_complete_tool_execution
    - test_timeout_recovery
    - test_validation_failure_paths
    - test_sandbox_violation_handling

  security_tests:
    - test_network_access_blocked
    - test_filesystem_read_only
    - test_memory_limit_enforcement
    - test_cpu_limit_enforcement

  performance_tests:
    - test_latency_under_p95_2800ms
    - test_concurrent_tool_execution_20_tools

compliance:
  adr_references:
    - "ADR-0003b: Six Core Protocol Implementations (Section 2.5)"
    - "ADR-0007: Tool Runner with Sandboxing"

  security_requirements:
    - "All tools must execute in sandboxed environment"
    - "Network access must be disabled"
    - "Filesystem access must be read-only"
    - "Memory and CPU limits must be enforced"
    - "All roles must be attested with HMAC-SHA256"

  safety_requirements:
    - "Tool output must be validated before returning"
    - "Sandbox violations must kill execution immediately"

cross_references:
  related_protocols:
    - protocol: "task_execution"
      relationship: "invoked_by"
      description: "Task execution invokes tool call protocol"

notes:
  - "Tool execution is sandboxed with 512MB memory and 50% CPU limits"
  - "Timeout is 5000ms (5 seconds) maximum"
  - "Output validation is mandatory for safety"
  - "P95 latency target is 2800ms end-to-end"
