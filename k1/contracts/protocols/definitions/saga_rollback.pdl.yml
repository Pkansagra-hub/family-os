# Saga Rollback Protocol Contract
# Epic 1.3 - Issue 1.3.2 - Protocol Definition 6 of 6
# Version: 1.0.0
# Status: DRAFT
# Owner: Protocol Team
# ADR References: ADR-0003b (Six Core Protocols), ADR-0009 (Error Recovery)

metadata:
  protocol_id: "saga_rollback"
  protocol_name: "Saga Rollback Protocol"
  version: "1.0.0"
  description: |
    Compensating transaction protocol for distributed error recovery.
    Handles rollback of multi-step operations with compensating actions.
    Implements contract from ADR-0003b Section 2.6 (Saga Rollback).
  research_foundation:
    - "Saga Pattern (Garcia-Molina & Salem 1987) - Compensating transactions"
    - "Actor Model (Hewitt 1973) - Distributed coordination"
    - "MPST (Honda et al. 2008) - Protocol validation"
  complexity: "HIGH"
  ai_involvement: "MINIMAL"
  created_date: "2025-01-13"
  last_modified: "2025-01-13"

protocol_specification:
  overview: |
    Saga Rollback Protocol implements the Saga Pattern for distributed error recovery.
    When a multi-step operation fails, it executes compensating actions to undo
    completed steps in reverse order, ensuring system consistency.

  protocol_type: "core"
  state_count: 5
  transition_count: 9
  max_duration_ms: 10000
  timeout_count: 2
  message_count: 5
  role_count: 3

  coordination_pattern: "reverse_sequential_compensation"
  ai_agent_roles: []
  pure_agent_roles:
    - "saga_coordinator"
    - "step_compensator"
    - "orchestrator"

  error_recovery: true
  compensation_required: true

fsm_states:
  start:
    state_id: "start"
    state_type: "initial"
    description: "Saga rollback initiated after failure"
    valid_roles: ["saga_coordinator"]
    entry_actions:
      - "capture_failure_context"
      - "identify_completed_steps"
      - "generate_compensation_plan"
    exit_conditions:
      - "compensation_plan_ready"
      - "no_steps_to_compensate"
    timeout_policy: "none"
    observability:
      metrics:
        - "saga_rollback_triggered_total"
      logs:
        - level: "WARN"
          message: "Saga rollback initiated"
          fields: ["saga_id", "task_id", "failure_reason", "trace_id"]
    estimated_duration_ms: 100

  compensating:
    state_id: "compensating"
    state_type: "intermediate"
    description: "Executing compensating actions in reverse order"
    valid_roles: ["step_compensator"]
    entry_actions:
      - "load_compensation_steps"
      - "start_compensation_timer"
    loop_conditions:
      - "steps_remaining"
      - "no_critical_errors"
    exit_conditions:
      - "all_compensations_completed"
      - "compensation_failed"
      - "timeout_exceeded"
    timeout_policy: "compensation_timeout"
    observability:
      metrics:
        - "compensation_steps_executed_total"
        - "compensation_latency_ms"
      logs:
        - level: "INFO"
          message: "Compensating step"
          fields: ["saga_id", "step_id", "compensation_action", "trace_id"]
      traces:
        - span_name: "compensation_execution"
          attributes: ["saga_id", "step_id", "action"]
    estimated_duration_ms: 5000

  verifying:
    state_id: "verifying"
    state_type: "intermediate"
    description: "Verifying compensation effects"
    valid_roles: ["saga_coordinator"]
    entry_actions:
      - "verify_compensation_effects"
      - "check_system_consistency"
      - "validate_rollback_complete"
    exit_conditions:
      - "verification_passed"
      - "verification_failed"
    timeout_policy: "verification_timeout"
    observability:
      metrics:
        - "saga_verification_latency_ms"
      logs:
        - level: "INFO"
          message: "Verifying rollback"
          fields: ["saga_id", "steps_compensated", "trace_id"]
    estimated_duration_ms: 500

  manual_intervention:
    state_id: "manual_intervention"
    state_type: "intermediate"
    description: "Manual intervention required for unrecoverable state"
    valid_roles: ["saga_coordinator"]
    entry_actions:
      - "log_manual_intervention_required"
      - "create_incident_ticket"
      - "notify_operators"
      - "freeze_affected_state"
    exit_conditions:
      - "manual_resolution_completed"
      - "intervention_timeout"
    timeout_policy: "intervention_timeout"
    observability:
      metrics:
        - "saga_manual_intervention_total"
      logs:
        - level: "CRITICAL"
          message: "Manual intervention required"
          fields: ["saga_id", "failure_details", "affected_resources"]
    estimated_duration_ms: 3600000

  completed:
    state_id: "completed"
    state_type: "final"
    description: "Saga rollback completed"
    valid_roles: ["orchestrator"]
    entry_actions:
      - "finalize_rollback"
      - "update_task_state"
      - "emit_completion_metrics"
      - "notify_orchestrator"
    exit_conditions: []
    timeout_policy: "none"
    observability:
      metrics:
        - "saga_rollback_completed_total"
        - "saga_rollback_end_to_end_latency_ms"
      logs:
        - level: "INFO"
          message: "Saga rollback completed"
          fields: ["saga_id", "status", "total_duration_ms", "steps_compensated"]
    estimated_duration_ms: 100

fsm_transitions:
  start_to_compensating:
    transition_id: "start_to_compensating"
    from_state: "start"
    to_state: "compensating"
    trigger: "compensation_plan_ready"
    guard_conditions:
      - "has_compensatable_steps"
      - "step_compensator_available"
    message_exchange:
      message_type: "CompensationPlan"
      sender_role: "saga_coordinator"
      receiver_role: "step_compensator"
      delivery_guarantee: "exactly_once"
    actions:
      - "assign_compensator"
      - "start_rollback_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_start_to_compensating_total"

  compensating_to_verifying:
    transition_id: "compensating_to_verifying"
    from_state: "compensating"
    to_state: "verifying"
    trigger: "all_compensations_completed"
    guard_conditions:
      - "no_pending_compensations"
      - "no_critical_errors"
    message_exchange:
      message_type: "CompensationReport"
      sender_role: "step_compensator"
      receiver_role: "saga_coordinator"
      delivery_guarantee: "exactly_once"
    actions:
      - "collect_compensation_results"
      - "stop_compensation_timer"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_compensating_to_verifying_total"

  verifying_to_completed:
    transition_id: "verifying_to_completed"
    from_state: "verifying"
    to_state: "completed"
    trigger: "verification_passed"
    guard_conditions:
      - "system_consistent"
      - "rollback_complete"
    message_exchange:
      message_type: "RollbackSuccess"
      sender_role: "saga_coordinator"
      receiver_role: "orchestrator"
      delivery_guarantee: "exactly_once"
    actions:
      - "finalize_success"
      - "emit_success_metrics"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_verifying_to_completed_success_total"

  verifying_to_manual_intervention:
    transition_id: "verifying_to_manual_intervention"
    from_state: "verifying"
    to_state: "manual_intervention"
    trigger: "verification_failed"
    guard_conditions:
      - "inconsistent_state_detected"
    message_exchange:
      message_type: "ManualInterventionRequired"
      sender_role: "saga_coordinator"
      receiver_role: "system"
      delivery_guarantee: "at_least_once"
    actions:
      - "create_incident"
      - "notify_operators"
      - "log_critical_error"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_verifying_to_manual_intervention_total"
      logs:
        - level: "CRITICAL"
          message: "Saga verification failed, manual intervention required"

  compensating_to_manual_intervention:
    transition_id: "compensating_to_manual_intervention"
    from_state: "compensating"
    to_state: "manual_intervention"
    trigger: "compensation_failed"
    guard_conditions:
      - "critical_compensation_error"
      - "unrecoverable_state"
    message_exchange:
      message_type: "ManualInterventionRequired"
      sender_role: "step_compensator"
      receiver_role: "system"
      delivery_guarantee: "at_least_once"
    actions:
      - "create_incident"
      - "freeze_state"
      - "log_critical_error"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_compensating_to_manual_intervention_total"
      logs:
        - level: "CRITICAL"
          message: "Compensation failed, manual intervention required"

  manual_intervention_to_completed:
    transition_id: "manual_intervention_to_completed"
    from_state: "manual_intervention"
    to_state: "completed"
    trigger: "manual_resolution_completed"
    guard_conditions:
      - "operator_confirmed_resolution"
    message_exchange:
      message_type: "ManualResolutionComplete"
      sender_role: "system"
      receiver_role: "saga_coordinator"
      delivery_guarantee: "exactly_once"
    actions:
      - "finalize_manual_resolution"
      - "emit_resolution_metrics"
    max_duration_ms: 100
    observability:
      metrics:
        - "transition_manual_intervention_to_completed_total"

  start_to_completed:
    transition_id: "start_to_completed"
    from_state: "start"
    to_state: "completed"
    trigger: "no_steps_to_compensate"
    guard_conditions:
      - "no_completed_steps"
    message_exchange:
      message_type: "RollbackSkipped"
      sender_role: "saga_coordinator"
      receiver_role: "orchestrator"
      delivery_guarantee: "at_least_once"
    actions:
      - "log_no_compensation_needed"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_start_to_completed_skipped_total"

  compensating_to_completed_timeout:
    transition_id: "compensating_to_completed_timeout"
    from_state: "compensating"
    to_state: "completed"
    trigger: "timeout_exceeded"
    guard_conditions:
      - "compensation_timer_expired"
    message_exchange:
      message_type: "RollbackTimeout"
      sender_role: "system"
      receiver_role: "orchestrator"
      delivery_guarantee: "best_effort"
    actions:
      - "log_timeout"
      - "force_completion"
      - "emit_timeout_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_compensating_to_completed_timeout_total"
      logs:
        - level: "ERROR"
          message: "Saga compensation timeout"

  verifying_to_completed_timeout:
    transition_id: "verifying_to_completed_timeout"
    from_state: "verifying"
    to_state: "completed"
    trigger: "timeout_exceeded"
    guard_conditions:
      - "verification_timer_expired"
    message_exchange:
      message_type: "RollbackTimeout"
      sender_role: "system"
      receiver_role: "orchestrator"
      delivery_guarantee: "best_effort"
    actions:
      - "log_timeout"
      - "assume_success"
      - "emit_timeout_metrics"
    max_duration_ms: 50
    observability:
      metrics:
        - "transition_verifying_to_completed_timeout_total"
      logs:
        - level: "WARN"
          message: "Saga verification timeout, assuming success"

timeout_policies:
  compensation_timeout:
    timeout_id: "compensation_timeout"
    duration_ms: 8000
    scope: "state"
    target_state: "compensating"
    action_on_timeout: "force_completion"
    fallback_transition: "compensating_to_completed_timeout"
    retry_allowed: false
    observability:
      metrics:
        - "saga_compensation_timeout_total"
      logs:
        - level: "ERROR"
          message: "Compensation timeout"

  verification_timeout:
    timeout_id: "verification_timeout"
    duration_ms: 1000
    scope: "state"
    target_state: "verifying"
    action_on_timeout: "assume_success"
    fallback_transition: "verifying_to_completed_timeout"
    retry_allowed: false
    observability:
      metrics:
        - "saga_verification_timeout_total"
      logs:
        - level: "WARN"
          message: "Verification timeout"

  intervention_timeout:
    timeout_id: "intervention_timeout"
    duration_ms: 3600000
    scope: "state"
    target_state: "manual_intervention"
    action_on_timeout: "escalate"
    fallback_transition: "manual_intervention_to_completed"
    retry_allowed: false
    observability:
      metrics:
        - "saga_intervention_timeout_total"
      logs:
        - level: "CRITICAL"
          message: "Manual intervention timeout after 1 hour"

violation_handlers:
  out_of_order_message:
    violation_type: "out_of_order_message"
    action: "warn"
    severity: "MEDIUM"
    recovery_strategy: "continue"

  invalid_role:
    violation_type: "invalid_role"
    action: "block"
    severity: "HIGH"
    recovery_strategy: "abort_protocol"

  timeout_exceeded:
    violation_type: "timeout_exceeded"
    action: "fallback"
    severity: "HIGH"
    recovery_strategy: "execute_fallback_transition"

  compensation_failure:
    violation_type: "compensation_failure"
    action: "manual_intervention"
    severity: "CRITICAL"
    recovery_strategy: "escalate_to_operators"

message_schemas:
  CompensationPlan:
    message_type: "CompensationPlan"
    sender_role: "saga_coordinator"
    receiver_role: "step_compensator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/saga.fbs::CompensationPlan"
    fields:
      saga_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      compensation_steps:
        type: "array"
        required: true
        items: "CompensationStep"
        description: "Steps to compensate in reverse order"
      failure_context:
        type: "object"
        required: true
        description: "Original failure details"
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    nested_types:
      CompensationStep:
        step_id:
          type: "string"
          required: true
        original_action:
          type: "string"
          required: true
        compensation_action:
          type: "string"
          required: true
        compensation_parameters:
          type: "object"
          required: true
        timeout_ms:
          type: "integer"
          required: true
          default: 2000
    validation:
      - "compensation_steps must not be empty"
      - "steps must be in reverse execution order"
    performance:
      max_serialization_time_ms: 10
      max_size_bytes: 32768

  CompensationReport:
    message_type: "CompensationReport"
    sender_role: "step_compensator"
    receiver_role: "saga_coordinator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/saga.fbs::CompensationReport"
    fields:
      saga_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      steps_compensated:
        type: "integer"
        required: true
      compensation_results:
        type: "array"
        required: true
        items: "CompensationResult"
      total_duration_ms:
        type: "integer"
        required: true
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    nested_types:
      CompensationResult:
        step_id:
          type: "string"
          required: true
        status:
          type: "string"
          required: true
          enum: ["success", "failure", "skipped"]
        duration_ms:
          type: "integer"
          required: true
        error_message:
          type: "string"
          required: false
    validation:
      - "steps_compensated must match compensation_results length"
    performance:
      max_serialization_time_ms: 10
      max_size_bytes: 32768

  RollbackSuccess:
    message_type: "RollbackSuccess"
    sender_role: "saga_coordinator"
    receiver_role: "orchestrator"
    delivery_guarantee: "exactly_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/saga.fbs::RollbackSuccess"
    fields:
      saga_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      steps_compensated:
        type: "integer"
        required: true
      total_duration_ms:
        type: "integer"
        required: true
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "steps_compensated must be > 0"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 1024

  ManualInterventionRequired:
    message_type: "ManualInterventionRequired"
    sender_role: "saga_coordinator|step_compensator"
    receiver_role: "system"
    delivery_guarantee: "at_least_once"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer5_infrastructure/incidents.fbs::ManualInterventionRequired"
    fields:
      saga_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      failure_details:
        type: "string"
        required: true
        max_length: 4096
      affected_resources:
        type: "array"
        required: true
        items: "string"
        description: "Resources in inconsistent state"
      severity:
        type: "string"
        required: true
        enum: ["HIGH", "CRITICAL"]
      incident_id:
        type: "string"
        required: true
        format: "uuid"
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "failure_details must not be empty"
      - "affected_resources must not be empty"
    performance:
      max_serialization_time_ms: 5
      max_size_bytes: 8192

  RollbackTimeout:
    message_type: "RollbackTimeout"
    sender_role: "system"
    receiver_role: "orchestrator"
    delivery_guarantee: "best_effort"
    schema_version: "1.0.0"
    flatbuffers_schema: "layer1_kernel/saga.fbs::RollbackTimeout"
    fields:
      saga_id:
        type: "string"
        required: true
        format: "uuid"
      task_id:
        type: "string"
        required: true
        format: "uuid"
      timeout_stage:
        type: "string"
        required: true
        enum: ["compensation", "verification"]
      trace_id:
        type: "string"
        required: true
        format: "uuid"
    validation:
      - "timeout_stage must be one of allowed values"
    performance:
      max_serialization_time_ms: 2
      max_size_bytes: 512

role_definitions:
  saga_coordinator:
    role_id: "saga_coordinator"
    role_type: "pure_agent"
    description: "Coordinator that manages saga rollback lifecycle"
    capabilities:
      - "compensation_planning"
      - "verification"
      - "incident_management"
    allowed_states:
      - "start"
      - "verifying"
      - "manual_intervention"
    allowed_transitions:
      - "start_to_compensating"
      - "start_to_completed"
      - "verifying_to_completed"
      - "verifying_to_manual_intervention"
      - "manual_intervention_to_completed"
    message_permissions:
      can_send:
        - "CompensationPlan"
        - "RollbackSuccess"
        - "ManualInterventionRequired"
      can_receive:
        - "CompensationReport"
        - "ManualResolutionComplete"
    attestation_required: true
    attestation_method: "hmac_sha256"

  step_compensator:
    role_id: "step_compensator"
    role_type: "pure_agent"
    description: "Pure agent that executes compensating actions"
    capabilities:
      - "compensation_execution"
      - "state_restoration"
    allowed_states:
      - "compensating"
    allowed_transitions:
      - "compensating_to_verifying"
      - "compensating_to_manual_intervention"
      - "compensating_to_completed_timeout"
    message_permissions:
      can_send:
        - "CompensationReport"
        - "ManualInterventionRequired"
      can_receive:
        - "CompensationPlan"
    attestation_required: true
    attestation_method: "hmac_sha256"

  orchestrator:
    role_id: "orchestrator"
    role_type: "pure_agent"
    description: "Orchestrator that receives rollback notifications"
    capabilities:
      - "task_state_management"
    allowed_states:
      - "completed"
    allowed_transitions: []
    message_permissions:
      can_send: []
      can_receive:
        - "RollbackSuccess"
        - "RollbackSkipped"
        - "RollbackTimeout"
    attestation_required: true
    attestation_method: "hmac_sha256"

performance_requirements:
  latency_targets:
    p50_ms: 4000
    p95_ms: 8000
    p99_ms: 10000
    description: "End-to-end saga rollback latency"

  compensation_latency:
    per_step_p95_ms: 2000
    description: "Per-step compensation latency"

  verification_latency:
    p95_ms: 500
    description: "Rollback verification latency"

  resource_limits:
    memory_per_saga_mb: 50
    max_compensation_steps: 20
    description: "Resource constraints per saga"

observability:
  metrics:
    counters:
      - name: "saga_rollback_triggered_total"
        description: "Total saga rollbacks triggered"
        labels: ["task_type"]
      - name: "saga_rollback_completed_total"
        description: "Total saga rollbacks completed"
        labels: ["status"]
      - name: "compensation_steps_executed_total"
        description: "Total compensation steps executed"
        labels: ["status"]
      - name: "saga_manual_intervention_total"
        description: "Total manual interventions required"
      - name: "saga_compensation_timeout_total"
        description: "Total compensation timeouts"

    histograms:
      - name: "saga_rollback_end_to_end_latency_ms"
        description: "End-to-end saga rollback latency"
        buckets: [1000, 2000, 4000, 6000, 8000, 10000]
      - name: "compensation_latency_ms"
        description: "Per-step compensation latency"
        buckets: [500, 1000, 1500, 2000, 3000]
      - name: "saga_verification_latency_ms"
        description: "Rollback verification latency"
        buckets: [100, 250, 500, 750, 1000]

    gauges:
      - name: "active_saga_rollbacks"
        description: "Number of active saga rollbacks"
      - name: "pending_manual_interventions"
        description: "Number of pending manual interventions"

  logging:
    structured: true
    format: "json"
    required_fields:
      - "saga_id"
      - "task_id"
      - "trace_id"

  tracing:
    enabled: true
    provider: "opentelemetry"
    sampling_rate: 1.0
    spans:
      - name: "saga_rollback_protocol"
        attributes: ["saga_id", "task_id", "steps_compensated"]
      - name: "compensation_execution"
        attributes: ["saga_id", "step_id", "action"]

testing_requirements:
  unit_tests:
    - test_fsm_state_transitions
    - test_timeout_enforcement
    - test_compensation_plan_generation
    - test_verification_logic

  integration_tests:
    - test_complete_saga_rollback
    - test_partial_compensation_failure
    - test_manual_intervention_path
    - test_timeout_recovery

  chaos_tests:
    - test_random_compensation_failures
    - test_network_delays_during_compensation
    - test_verification_timeout_scenarios

compliance:
  adr_references:
    - "ADR-0003b: Six Core Protocol Implementations (Section 2.6)"
    - "ADR-0009: Error Recovery with Saga Pattern"

  research_validation:
    - citation: "Saga Pattern (Garcia-Molina & Salem 1987)"
      compliance: "Implements compensating transactions for distributed rollback"

  reliability_requirements:
    - "Compensation steps must be idempotent"
    - "Verification must detect inconsistent states"
    - "Manual intervention must be escalated for critical failures"

cross_references:
  related_protocols:
    - protocol: "task_execution"
      relationship: "error_recovery"
      description: "Saga rollback handles task execution failures"

notes:
  - "Saga rollback implements compensating transactions for multi-step operations"
  - "Compensation steps execute in reverse order of original execution"
