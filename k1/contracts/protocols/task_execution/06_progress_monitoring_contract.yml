# Task Execution Protocol - Progress Monitoring Contract
# File: contracts/protocols/task_execution/06_progress_monitoring_contract.yml
# Purpose: Agent sends progress updates during execution
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-PROGRESS-006"
  name: "Progress Monitoring Message Contract"
  version: "1.0"

# Progress Monitoring Overview
progress_monitoring:
  purpose: "Agent sends optional progress updates during execution"
  direction: "Agent (1) → Orchestrator (1) [0..* messages]"
  protocol_phase: "EXECUTE phase (during execution)"
  trigger: "Agent can send anytime during execution (optional)"
  cardinality: "0..* progress updates per task"

# ProgressUpdate Message Schema
flatbuffers_schema: |
  table ProgressUpdate {
    task_id: string (required)                 # UUID task identifier
    agent_id: string (required)                # Agent sending update
    progress_percent: ubyte (required)         # 0-100% completion
    eta_ms: uint (required)                    # Estimated time to completion (milliseconds)
    status_message: string (optional, max 256) # Human-readable status
    tool_calls_completed: uint (optional)      # Number of tool calls done
    tool_calls_total: uint (optional)          # Total tool calls needed
    trace_id: string (required)                # OpenTelemetry trace ID
    timestamp_ns: ulong (required)             # Update timestamp
  }

# Message Fields
fields:

  task_id:
    type: "UUID (string)"
    required: true
    description: "Task being executed"

  agent_id:
    type: "UUID (string)"
    required: true
    description: "Agent sending update"

  progress_percent:
    type: "ubyte (0-100)"
    required: true
    range: [0, 100]
    examples: [0, 25, 50, 75, 100]
    interpretation: |
      0% = Just started
      25% = 1/4 done (e.g., evaluating problem)
      50% = Half done (e.g., calling tools)
      75% = 3/4 done (e.g., assembling result)
      100% = Complete (usually should send TaskResult instead)

    estimation_strategy: |
      For multi-step tasks:
        Step 1: 20% (analyze requirements)
        Step 2: 50% (execute tools)
        Step 3: 80% (format results)
        Step 4: 100% (send TaskResult)

  eta_ms:
    type: "uint (milliseconds)"
    required: true
    interpretation: "Estimated milliseconds remaining until completion"
    examples: [100, 500, 1000, 2000]
    description: |
      Agent's estimate of remaining work
      Total estimated time = progress_time_so_far + eta_ms

  status_message:
    type: "string (max 256 chars, optional)"
    required: false
    examples:
      - "Calling weather API..."
      - "Processing forecast data..."
      - "Formatting results..."
    description: "Human-readable status (for logging, transparency)"

  tool_calls_completed:
    type: "uint (optional)"
    required: false
    example: 2  # 2 tools completed
    description: "Number of tool calls successfully executed"

  tool_calls_total:
    type: "uint (optional)"
    required: false
    example: 3  # 3 tools total needed
    description: "Total number of tool calls planned"

  trace_id:
    type: "string"
    required: true
    description: "Distributed tracing trace ID"

  timestamp_ns:
    type: "ulong (nanoseconds)"
    required: true
    description: "Progress update timestamp"

# Example Payloads
example_payloads: |
  # Example 1: Starting (0%)
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "progress_percent": 0,
    "eta_ms": 3000,
    "status_message": "Starting task evaluation...",
    "trace_id": "...",
    "timestamp_ns": 1695000000000000000
  }

  # Example 2: Calling tools (50%)
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "progress_percent": 50,
    "eta_ms": 1500,
    "status_message": "Calling weather API for forecast...",
    "tool_calls_completed": 1,
    "tool_calls_total": 2,
    "trace_id": "...",
    "timestamp_ns": 1695000000500000000
  }

  # Example 3: Near completion (90%)
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "progress_percent": 90,
    "eta_ms": 200,
    "status_message": "Formatting results...",
    "tool_calls_completed": 2,
    "tool_calls_total": 2,
    "trace_id": "...",
    "timestamp_ns": 1695000001500000000
  }

# Progress Update Usage (Optional)
optionality:

  requirement: "Optional - agents can skip progress updates entirely"

  when_to_send:
    scenario_1_long_running:
      task_type: "Long execution (>1000ms)"
      recommendation: "Send progress updates every 500-1000ms"

    scenario_2_multi_step:
      task_type: "Multi-step tasks (multiple tools/LLM calls)"
      recommendation: "Send update after each major step"

    scenario_3_short_task:
      task_type: "Short execution (<500ms)"
      recommendation: "Can skip (too fast to matter)"

  when_not_to_send:
    "Skip if updates would add overhead (e.g., very fast tasks)"

# Orchestrator Handling
orchestrator_handling:

  receive_progress:
    step_1: "Receive ProgressUpdate message"
    step_2: "Log progress (optional, for UI or debugging)"
    step_3: "Update task state (progress_percent, eta_ms)"
    step_4: "Continue waiting for TaskResult/TaskFailure"

  use_progress_for:
    user_interface: "Show progress bar to user (optional, for transparency)"
    timeout_adjustment: "Extend timeout if progress is being made"
    debugging: "Log progress for post-mortems"

  timeout_handling: |
    Even if progress updates are sent, execution_timeout still applies
    If no TaskResult/TaskFailure within 5000ms: Force timeout
    Progress updates don't reset the deadline

# Validation Rules
validation:

  semantic_validation:

    rule_1_task_exists:
      condition: "task_id must be known"
      action: "Ignore if unknown (stale update)"

    rule_2_progress_range:
      condition: "progress_percent in [0, 100]"
      action: "Clamp to [0, 100]"

    rule_3_progress_monotonic:
      condition: "progress_percent should not decrease"
      rationale: "Progress should increase or stay same"
      action: "Log warning if decreasing"

    rule_4_eta_positive:
      condition: "eta_ms >= 0"
      action: "Clamp to 0 if negative"

    rule_5_tool_counts_consistent:
      condition: "tool_calls_completed <= tool_calls_total"
      action: "Log warning if inconsistent"

# Performance Considerations
performance:

  update_frequency_recommendation: |
    Too frequent: <100ms updates add overhead
    Too sparse: >2000ms loses useful information
    Optimal: 500-1000ms updates for multi-step tasks

  overhead_estimate:
    per_update_latency_ms: 1
    per_update_network_ns: 100  # nanoseconds (local network)
    recommendation: "Limit to 10-20 updates per task (don't spam)"

  observability_impact:
    metrics_overhead: "Low (<0.1% if limited to 10-20 updates)"
    logging_overhead: "Depends on log level (debug: high, info: low)"

# Observability
observability:

  metrics:
    - name: "task_progress_updates_total"
      type: "counter"
      description: "Total ProgressUpdates sent"

    - name: "task_progress_percent_distribution"
      type: "histogram"
      buckets: [10, 25, 50, 75, 90, 100]
      description: "Distribution of progress % at update time"

    - name: "task_progress_eta_accuracy"
      type: "histogram"
      buckets: [100, 500, 1000, 2000, 5000]
      description: "Accuracy of ETA estimates (actual vs predicted)"

  events:
    - name: "task_progress_updated"
      fields: ["task_id", "agent_id", "progress_percent", "eta_ms", "trace_id"]

    - name: "task_progress_completed_steps"
      fields: ["task_id", "tool_calls_completed", "tool_calls_total", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "EXECUTE phase (during execution)"
  trigger: "Agent decides to send progress (optional, 0..* messages)"
  next_phase: "Agent sends TaskResult/TaskFailure when done"

  related_contracts:
    - "01_task_protocol_fsm.yml - FSM state machine"
    - "05_task_assignment_contract.yml - Task started"
    - "07_completion_contract.yml - Task completion"
    - "08_failure_handling_contract.yml - Task failure"

# ==============================================================================
