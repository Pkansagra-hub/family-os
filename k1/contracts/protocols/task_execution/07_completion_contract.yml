# Task Execution Protocol - Completion Contract
# File: contracts/protocols/task_execution/07_completion_contract.yml
# Purpose: Agent sends successful task result
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-COMPLETION-007"
  name: "Task Completion Result Message Contract"
  version: "1.0"

# Task Completion Overview
task_completion:
  purpose: "Agent sends successful task result"
  direction: "Agent (1) → Orchestrator (1)"
  protocol_phase: "EXECUTE phase completion"
  trigger: "Agent successfully executes task"
  result_type: "TaskResult message"

# TaskResult Message Schema
flatbuffers_schema: |
  table TaskResult {
    task_id: string (required)                 # UUID task identifier
    agent_id: string (required)                # Agent that executed task
    success: bool (required)                   # true = successful completion
    result_data: string (required)             # JSON-serialized result
    result_type: string (optional)             # WEATHER, CALENDAR, EMAIL, etc.
    latency_ms: uint (required)                # Actual execution time
    cost_usd: float (required)                 # Actual cost incurred
    tokens_used: uint (optional)               # LLM tokens (if applicable)
    tool_calls_made: uint (optional)           # Number of tool calls
    confidence: float (optional)               # Agent's confidence in result
    receipts: [Receipt] (optional)             # Tool execution receipts
    trace_id: string (required)                # OpenTelemetry trace ID
    timestamp_ns: ulong (required)             # Completion timestamp
  }

  table Receipt {
    tool_name: string                          # Tool that was called
    execution_time_ms: uint                    # Time taken
    cost_usd: float                            # Cost for this tool
    status: ubyte                              # 0=SUCCESS, 1=PARTIAL, 2=FAILED
  }

# Message Fields
fields:

  task_id:
    type: "UUID (string)"
    required: true
    description: "Must match original TaskAnnouncement"

  agent_id:
    type: "UUID (string)"
    required: true
    description: "Agent that executed task"

  success:
    type: "bool"
    required: true
    value: true
    description: "Always true for TaskResult (false → TaskFailure instead)"

  result_data:
    type: "JSON string (max 65536 chars)"
    required: true
    examples:
      - |
        {
          "forecast": "Sunny, 72°F",
          "details": {
            "high": 75,
            "low": 65,
            "humidity": 45
          }
        }
      - |
        {
          "calendar_created": true,
          "event_id": "evt-123456",
          "title": "Team Meeting",
          "time": "2024-01-15T14:00:00Z"
        }
    description: |
      JSON-serialized result data
      Format depends on task intent
      Can be complex nested structure

  result_type:
    type: "string (optional)"
    required: false
    examples: ["WEATHER", "CALENDAR_EVENT", "EMAIL_SENT"]
    description: "Type of result (for parsing/validation)"

  latency_ms:
    type: "uint (milliseconds)"
    required: true
    examples: [150, 500, 1500, 3000]
    description: "Actual execution time (from assignment to result)"

  cost_usd:
    type: "float"
    required: true
    examples: [0.01, 0.05, 0.25]
    description: "Actual cost (may differ from estimate)"

  tokens_used:
    type: "uint (optional)"
    required: false
    examples: [50, 200, 1000]
    description: "LLM tokens consumed (for AI agents)"

  tool_calls_made:
    type: "uint (optional)"
    required: false
    examples: [0, 1, 2, 5]
    description: "Number of tool calls executed"

  confidence:
    type: "float (0.0-1.0, optional)"
    required: false
    examples: [0.85, 0.95]
    description: "Agent's final confidence in result quality"

  receipts:
    type: "[Receipt] array (optional)"
    required: false
    description: |
      Tool execution receipts
      For transparency/auditing
      Cost, latency, status per tool

  trace_id:
    type: "string"
    required: true
    description: "Distributed tracing trace ID"

  timestamp_ns:
    type: "ulong (nanoseconds)"
    required: true
    description: "Result completion timestamp"

# Example Payloads
example_payloads: |
  # Example 1: Weather query result
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "success": true,
    "result_data": "{\"forecast\":\"Sunny, 72°F\",\"high\":75,\"low\":65}",
    "result_type": "WEATHER",
    "latency_ms": 250,
    "cost_usd": 0.025,
    "tokens_used": 85,
    "tool_calls_made": 1,
    "confidence": 0.95,
    "receipts": [
      {"tool_name": "weather_api", "execution_time_ms": 150, "cost_usd": 0.01, "status": 0}
    ],
    "trace_id": "...",
    "timestamp_ns": 1695000001000000000
  }

  # Example 2: Calendar booking result
  {
    "task_id": "task-yyy",
    "agent_id": "agent-ai-concierge-001",
    "success": true,
    "result_data": "{\"created\":true,\"event_id\":\"evt-123\",\"title\":\"Meeting\"}",
    "result_type": "CALENDAR_EVENT",
    "latency_ms": 800,
    "cost_usd": 0.15,
    "tokens_used": 150,
    "tool_calls_made": 2,
    "confidence": 0.88,
    "receipts": [
      {"tool_name": "calendar_api", "execution_time_ms": 300, "cost_usd": 0.05, "status": 0},
      {"tool_name": "email_api", "execution_time_ms": 400, "cost_usd": 0.10, "status": 0}
    ],
    "trace_id": "...",
    "timestamp_ns": 1695000002000000000
  }

# Result Validation
validation:

  semantic_validation:

    rule_1_task_exists:
      condition: "task_id must be known executing task"
      action: "Reject if unknown"

    rule_2_agent_matches:
      condition: "agent_id must be assigned agent"
      action: "Reject if mismatched (possible replay attack)"

    rule_3_result_data_format:
      condition: "result_data must be valid JSON"
      action: "Reject if JSON parse fails"

    rule_4_latency_reasonable:
      condition: "latency_ms should be < execution_timeout"
      action: "Log if exceeds (but accept)"

    rule_5_cost_within_budget:
      condition: "cost_usd <= task_budget_usd"
      action: "Warn if exceeds budget (but accept)"

    rule_6_receipts_consistent:
      condition: "Sum of receipt costs ≈ cost_usd (within 10%)"
      action: "Log warning if inconsistent"

# Orchestrator Handling
orchestrator_handling:

  step_1_receive_result:
    action: "Receive TaskResult message"
    validation: "Verify task_id, agent_id, success=true"

  step_2_record_completion:
    action: "Record task completion"
    state_update: "task.state = COMPLETED"
    metrics_update: |
      - task_completed_total counter ++
      - task_latency_ms histogram += latency_ms
      - task_cost_usd histogram += cost_usd

  step_3_deliver_to_user:
    action: "Return result to user"
    mechanism: |
      - Extract result_data (JSON)
      - Format for user UI
      - Send via WebSocket or HTTP response

  step_4_record_metrics:
    action: "Record performance metrics"
    latency: "Compare actual vs estimated (agent accuracy)"
    cost: "Compare actual vs estimated (cost prediction accuracy)"

# Performance Tracking
performance_tracking:

  latency_accuracy:
    metric: "agent.estimated_latency vs actual.latency_ms"
    target: "Within 20% of estimate"
    tracking: "Per-agent accuracy metric"

  cost_accuracy:
    metric: "agent.estimated_cost vs actual.cost_usd"
    target: "Within 20% of estimate"
    tracking: "Per-agent cost prediction accuracy"

  agent_scoring:
    usage: "Use accuracy to refine future hiring scores"
    logic: |
      If agent consistently underestimates latency:
        Increase latency_score penalty for this agent
      If agent consistently overestimates confidence:
        Reduce confidence weight for this agent

# Result Streaming (Alternative)
streaming:

  option: "For very large results, agent can stream results"
  mechanism: |
    Instead of single TaskResult:
    1. Send TaskResultStarted (latency_ms, total_size_bytes)
    2. Send TaskResultChunk (sequence, data_chunk)
    3. Send TaskResultFinished (checksum, final_cost_usd)

  use_case: "Large results (>10MB) like video transcriptions"

# Observability
observability:

  metrics:
    - name: "task_completed_total"
      type: "counter"
      description: "Tasks successfully completed"

    - name: "task_latency_ms"
      type: "histogram"
      buckets: [100, 500, 1000, 2000, 5000]
      description: "Task execution latency (actual)"

    - name: "task_cost_usd"
      type: "histogram"
      buckets: [0.01, 0.05, 0.10, 0.50, 1.00, 5.00]
      description: "Task actual cost"

    - name: "agent_latency_estimate_accuracy"
      type: "histogram"
      buckets: [0.5, 0.8, 1.0, 1.2, 2.0]  # Ratio: actual/estimated
      description: "Agent latency prediction accuracy"

    - name: "agent_cost_estimate_accuracy"
      type: "histogram"
      buckets: [0.5, 0.8, 1.0, 1.2, 2.0]  # Ratio: actual/estimated
      description: "Agent cost prediction accuracy"

  events:
    - name: "task_result_received"
      fields: ["task_id", "agent_id", "latency_ms", "cost_usd", "confidence", "trace_id"]

    - name: "task_result_returned_to_user"
      fields: ["task_id", "result_type", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "EXECUTE → COMPLETE transition"
  trigger: "Agent sends TaskResult (success=true)"
  next_phase: "Task closed, results delivered to user"

  final_state: "COMPLETE (success path of FSM)"

  related_contracts:
    - "01_task_protocol_fsm.yml - FSM state machine"
    - "05_task_assignment_contract.yml - Task assigned"
    - "06_progress_monitoring_contract.yml - Progress tracking"
    - "08_failure_handling_contract.yml - Failure alternative"

# ==============================================================================
# END OF FILE: 07_completion_contract.yml
# ==============================================================================
