# Task Execution Protocol - Timeout Enforcement Contract
# File: contracts/protocols/task_execution/09_timeout_enforcement.yml
# Purpose: Protocol timeout policies and fallback strategies
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-TIMEOUT-009"
  name: "Task Execution Timeout Enforcement Contract"
  version: "1.0"

# Timeout Enforcement Overview
timeout_enforcement:
  purpose: "Enforce protocol timeouts for Task Execution FSM"
  responsibility: "Protocol Monitor (Layer 1 kernel)"
  research_basis: "MPST progress guarantee (Honda 2008) - prevent indefinite waiting"
  key_principle: "Every state must have explicit timeout to ensure state transition"

# Protocol Phase Timeouts
phase_timeouts:

  ANNOUNCE_PHASE:
    duration_ms: 50
    start_trigger: "FSM enters ANNOUNCE state"
    end_condition: "Proposals received OR timeout"
    timeout_action: "Broadcast timeout - continue to PROPOSE anyway"
    fallback: "Use empty proposal set (error: NO_PROPOSALS)"
    rationale: |
      Some agents may not respond in time (network latency, processing).
      Proceed even with partial proposals to maintain protocol progress.

    observability:
      - "announce_timeout_ms: 50 (hard limit)"
      - "announce_phase_duration_ms histogram"
      - "proposals_received_count distribution"

  PROPOSE_PHASE:
    duration_ms: 100
    start_trigger: "FSM enters PROPOSE state (after ANNOUNCE timeout)"
    end_condition: "Timer expires OR sufficient proposals received"
    timeout_action: "Close proposal window, move to SELECT"
    fallback: "Use proposals received so far (may be 0)"
    rationale: |
      Collect proposals from agents within 100ms window.
      If no proposals: error, retry with different announcement.
      If low-quality proposals (score <0.65): error, retry.

    observability:
      - "propose_timeout_ms: 100 (hard limit)"
      - "propose_phase_duration_ms histogram"
      - "final_proposal_count distribution"

  SELECT_PHASE:
    duration_ms: 50
    start_trigger: "Proposal window closes"
    end_condition: "Selection algorithm completes OR timeout"
    timeout_action: "Force selection (pick best available or TIMEOUT error)"
    fallback: "Highest scoring proposal (or error if none qualify)"
    rationale: |
      Selection algorithm is deterministic O(n) - should complete in ~2ms.
      50ms budget provides 25x safety margin.
      If selection exceeds 50ms: protocol violation (escalate to Protocol Monitor).

    observability:
      - "select_timeout_ms: 50 (hard limit)"
      - "select_phase_duration_ms histogram (target <5ms)"
      - "selection_algorithm_duration_ms"

  EXECUTE_PHASE:
    duration_ms: 5000
    start_trigger: "FSM enters EXECUTE state (after assignment)"
    end_condition: "TaskResult OR TaskFailure received OR timeout"
    timeout_action: "Auto-transition to FAILED with error_code=TIMEOUT"
    fallback: "Terminate agent task, send TaskFailure(TIMEOUT)"
    rationale: |
      Hard deadline for task execution.
      If agent doesn't complete within 5000ms: task is considered failed.
      Do NOT retry automatically (user may adjust deadline and re-submit).

    observability:
      - "execute_timeout_ms: 5000 (hard limit)"
      - "execute_phase_duration_ms histogram"
      - "execute_timeout_triggered_total counter"
      - "task_execution_slo_exceeded_total counter"

# Protocol State Machine Timeout Map
timeout_state_map:

  UNANNOUNCED:
    timeout_duration_ms: null
    description: "Initial state - no timeout"

  ANNOUNCE:
    timeout_duration_ms: 50
    next_state_on_timeout: "PROPOSE (with empty proposals)"
    action_on_timeout: "Broadcast to all eligible agents, wait up to 50ms"

  PROPOSE:
    timeout_duration_ms: 100
    next_state_on_timeout: "SELECT (with proposals received so far)"
    action_on_timeout: "Close proposal window, proceed to selection"

  SELECT:
    timeout_duration_ms: 50
    next_state_on_timeout: "EXECUTE or FAILED"
    action_on_timeout: |
      If selection algorithm didn't complete:
        -> ERROR (protocol violation)
        -> Manual intervention required

      If selection completed, proceed to EXECUTE

  EXECUTE:
    timeout_duration_ms: 5000
    next_state_on_timeout: "FAILED"
    action_on_timeout: |
      Send TaskFailure(error_code=TIMEOUT) to notify agent task is cancelled.
      Transition to FAILED state.
      Do NOT retry.

  COMPLETE:
    timeout_duration_ms: null
    description: "Terminal state - no timeout"

  FAILED:
    timeout_duration_ms: null
    description: "Terminal state - no timeout"

# Timeout Timer Implementation
timer_implementation:

  timer_start:
    mechanism: "Protocol Monitor starts timer when entering state"
    precision: "Millisecond precision (10ms tolerance)"
    code_pattern: |
      protocol_monitor.start_timer(
        task_id=task.id,
        phase=phase_name,
        duration_ms=timeout_ms,
        callback=on_timeout_handler
      )

  timer_check:
    mechanism: "Protocol Monitor checks at state end"
    logic: |
      if current_time >= timer_deadline:
        if reason == TIMEOUT:
          execute_timeout_action()
        else:
          cancel_timer()  # completed before timeout

  timer_cancellation:
    trigger: "State completes normally (before timeout)"
    example: "TaskResult received before 5000ms, cancel EXECUTE timer"

  timer_enforcement:
    enforcement: "Protocol Monitor enforces (layer 1 kernel)"
    visibility: "Not visible to agents (agents don't know timeout)"
    guarantee: "MPST progress guarantee - must transition within timeout"

# Cascade Timeouts (Multi-Level)
cascade_timeouts:

  level_1_phase_timeout:
    duration_ms: "Specific to phase (50/100/50/5000)"
    responsibility: "Protocol Monitor"
    action: "Auto-transition to next phase"

  level_2_task_overall_slo:
    duration_ms: 5200
    description: "Total time for complete protocol (ANNOUNCE → COMPLETE)"
    calculation: "50 + 100 + 50 + 5000 = 5200ms"
    responsibility: "Task Orchestrator"
    action: "Mark task SLO_EXCEEDED if total > 5200ms"

  level_3_user_deadline:
    duration_ms: "deadline_ms from TaskAnnouncement"
    description: "User-specified deadline (may be <5200ms or >5200ms)"
    responsibility: "Task Orchestrator"
    action: |
      Check: current_time > deadline_ms?
      If yes: Prevent new task attempts, inform user deadline passed

  cascade_ordering:
    example: |
      Task deadline: 10000ms (user specified)
      Protocol SLO: 5200ms (hard protocol limit)

      Scenario 1: Complete at 3000ms -> SUCCESS (all levels pass)
      Scenario 2: Complete at 5500ms -> SLO_EXCEEDED warning (protocol exceeded)
      Scenario 3: Complete at 8000ms -> SUCCESS (within user deadline)
      Scenario 4: Complete at 10500ms -> DEADLINE_EXCEEDED (user deadline missed)

# Timeout Triggers & Actions
timeout_triggers:

  trigger_announce_timeout:
    phase: "ANNOUNCE"
    elapsed_time: 50ms
    action: |
      if proposals.empty():
        error_code = "NO_PROPOSALS"
        state_transition = ANNOUNCE -> FAILED
        retry = suggested
      else:
        state_transition = ANNOUNCE -> PROPOSE
        proceed = continue to proposal window

  trigger_propose_timeout:
    phase: "PROPOSE"
    elapsed_time: 100ms
    action: |
      proposals_received = collect_proposals_so_far()

      if proposals_received.empty():
        error_code = "NO_PROPOSALS"
        state_transition = PROPOSE -> FAILED
        retry = suggested

      elif all_scores < 0.65:
        error_code = "LOW_QUALITY_PROPOSALS"
        state_transition = PROPOSE -> FAILED
        retry = suggested

      else:
        state_transition = PROPOSE -> SELECT
        proceed = score selected proposals

  trigger_select_timeout:
    phase: "SELECT"
    elapsed_time: 50ms
    action: |
      if selection_algorithm_duration > 50ms:
        error = "PROTOCOL_VIOLATION - selection took too long"
        notify = Protocol Monitor escalation
        action = manual_review_required
      else:
        state_transition = SELECT -> EXECUTE
        proceed = send TaskAssignment to winner

  trigger_execute_timeout:
    phase: "EXECUTE"
    elapsed_time: 5000ms
    action: |
      if no TaskResult or TaskFailure received:
        error_code = "TIMEOUT"
        state_transition = EXECUTE -> FAILED
        failure_message = create_timeout_failure()

        # Notify agent task is cancelled
        send_task_cancellation(agent_id, task_id)

        # Log metrics
        increment_counter("task_execution_timeout_total")
        record_histogram("execute_phase_duration_ms", 5000)

# Fallback Strategies
fallback_strategies:

  fallback_empty_proposals:
    when: "ANNOUNCE phase timeout with 0 proposals"
    strategy: "Retry with broader agent eligibility"
    options: |
      Option 1: Expand capability requirements (ask less capable agents)
      Option 2: Increase announcement budget (incentivize agents)
      Option 3: Extend announce window (next retry gets 100ms window)
      Option 4: Fail task (if no suitable agents available)

  fallback_low_quality_proposals:
    when: "PROPOSE phase timeout, all scores < 0.65"
    strategy: "Lower hiring threshold or retry"
    options: |
      Option 1: Lower scoring threshold to 0.50 (accept lower quality)
      Option 2: Retry with expanded agent pool
      Option 3: Fail task (impossible request)
      Option 4: Ask user to clarify or adjust budget

  fallback_execute_timeout:
    when: "EXECUTE phase timeout (no completion after 5s)"
    strategy: "Fail task, do NOT retry"
    rationale: |
      Execution timeout is hard deadline.
      If agent can't complete in 5000ms, task is unachievable.
      Retrying won't help (likely same agent or comparable agent will fail again).

    notify_user: |
      "Task execution exceeded 5 second timeout.
       Please clarify requirements or try with higher budget."

# Performance Impact Analysis
performance:

  budget_allocation:
    announce_phase: "50ms (1% of total)"
    propose_phase: "100ms (2% of total)"
    select_phase: "50ms (1% of total)"
    execute_phase: "5000ms (96% of total)"
    total_protocol_slo: "5200ms"

  p95_target: 4500ms
  p99_target: 5200ms

  latency_breakdown:
    announce_latency: "50ms (broadcast overhead)"
    proposal_collection: "100ms (agent response latency)"
    selection_algorithm: "2ms typical (O(n) scoring, n=3-10)"
    selection_buffer: "48ms (25x safety margin on algorithm)"
    execution_time: "50-5000ms (depends on task complexity)"

  timeout_enforcement_overhead:
    cost: "<1ms total"
    mechanism: "Timer checks, state transitions"
    rationale: "Negligible compared to phase durations"

# Observability & Monitoring
observability:

  metrics:
    - name: "task_phase_duration_ms"
      type: "histogram"
      labels: ["phase"]
      buckets: [5, 10, 25, 50, 100, 500, 1000, 5000]
      description: "Duration of each protocol phase"

    - name: "task_timeout_triggered_total"
      type: "counter"
      labels: ["phase"]
      description: "Timeouts triggered per phase"

    - name: "task_protocol_slo_exceeded_total"
      type: "counter"
      description: "Tasks exceeding 5200ms total SLO"

    - name: "task_deadline_missed_total"
      type: "counter"
      description: "Tasks exceeding user-specified deadline"

    - name: "timer_precision_ms"
      type: "histogram"
      description: "Actual timeout vs expected (drift analysis)"

  events:
    - name: "phase_timeout"
      fields: ["task_id", "phase", "duration_ms", "reason", "next_state", "trace_id"]

    - name: "task_slo_exceeded"
      fields: ["task_id", "total_duration_ms", "slo_budget_ms", "trace_id"]

    - name: "fallback_activated"
      fields: ["task_id", "phase", "reason", "fallback_strategy", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  protocol_layer: "Layer 1 - Protocol Monitor (Kernel)"

  responsible_component: "Protocol Monitor daemon"

  related_contracts:
    - "01_task_protocol_fsm.yml - FSM state definitions"
    - "08_failure_handling_contract.yml - Failure scenarios"

  coordination:
    orchestrator: "Initiates tasks, receives results"
    agent: "Executes tasks, sends results"
    protocol_monitor: "Enforces timeouts, manages state transitions"

  state_diagram: |
    UNANNOUNCED
        |
        | [task_start]
        v
    ANNOUNCE (50ms timeout)
        |
        | [announce_timeout OR proposals_received]
        v
    PROPOSE (100ms timeout)
        |
        | [propose_timeout OR proposals_finalized]
        v
    SELECT (50ms timeout)
        |
        | [select_timeout OR selection_complete]
        v
    EXECUTE (5000ms timeout)
        |
        +---> [task_result] ---> COMPLETE
        |
        +---> [task_failure] ---> FAILED
        |
        +---> [execute_timeout] ---> FAILED
        |
        v
    COMPLETE / FAILED (terminal states)

# ==============================================================================
# Summary: Task Execution Protocol Timeout Enforcement
# ==============================================================================
#
# Key Timeouts:
#   - ANNOUNCE: 50ms (broadcast window)
#   - PROPOSE: 100ms (proposal collection)
#   - SELECT: 50ms (selection algorithm)
#   - EXECUTE: 5000ms (task execution hard deadline)
#   - TOTAL SLO: 5200ms (all phases)
#
# Key Principle:
#   Every state has explicit timeout to ensure protocol progress (MPST guarantee).
#   Timeouts are enforced by Protocol Monitor (Layer 1 kernel).
#   Agent doesn't know about timeouts (not visible to agent).
#
# Fallback Strategies:
#   - Empty proposals: Retry with broader eligibility
#   - Low quality proposals: Lower threshold or retry
#   - Execute timeout: Fail (do NOT retry automatically)
#
# Observability:
#   - Phase duration histograms (track each phase)
#   - Timeout trigger counters (when timeout fires)
#   - SLO exceeded tracking (protocol vs user deadline)
#
# ==============================================================================
# END OF FILE: 09_timeout_enforcement.yml
# ==============================================================================
