# Task Execution Protocol - Selection Contract
# File: contracts/protocols/task_execution/04_selection_contract.yml
# Purpose: Orchestrator selection algorithm and decision logic
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-SELECTION-004"
  name: "Task Execution Selection Algorithm"
  version: "1.0"

# Selection Overview
selection:
  purpose: "Apply multi-criteria scoring to proposals and select winner"
  protocol_phase: "SELECT phase (timeout: 50ms)"
  input: "All Proposal messages from agents (0..*)"
  output: "Selected agent_id or FAILED (no winner)"

# Selection Algorithm
algorithm:

  inputs:
    proposals: "[Proposal]"  # List of proposals from agents
    task_budget_usd: "float"
    task_deadline_ms: "uint"

  scoring_formula: |
    score = (0.4 × confidence) + (0.3 × latency_score) + (0.3 × cost_score)
    where:
      latency_score = max(0.0, 1.0 - (estimated_latency_ms / task_deadline_ms))
      cost_score = max(0.0, 1.0 - (estimated_cost_usd / task_budget_usd))

  selection_logic: |
    1. Score all proposals using hiring score formula
    2. Filter: score ≥ 0.65 (hiring threshold)
    3. If filtered empty: return FAILED (no winner)
    4. Pick proposal with highest score (winner)
    5. Return winner_agent_id

  winner_determination:
    threshold: 0.65
    tie_breaking: |
      If multiple proposals with same max score:
        1. Pick agent with lowest cost_usd (prefer cheaper)
        2. If still tied: pick agent with highest confidence
        3. If still tied: pick agent_id alphabetically (deterministic)

# Selection Failure Cases
failure_cases:

  case_1_no_proposals:
    condition: "0 proposals received"
    action: |
      1. Log: "No proposals for task"
      2. Return: FAILED (no winner)
      3. Increment: task_failed_no_proposals_total

  case_2_all_low_scores:
    condition: "All proposals scored <0.65"
    action: |
      1. Log: "No agent meets threshold"
      2. Return: FAILED (no winner)
      3. Increment: task_failed_no_qualified_agents_total

  case_3_budget_exceeded:
    condition: "Lowest cost_usd > task_budget_usd"
    action: |
      1. Log: "All proposals exceed budget"
      2. Consider: user has insufficient budget
      3. Return: FAILED (budget exceeded)
      4. Increment: task_failed_budget_exceeded_total

# Multi-Criteria Scoring Implementation
multi_criteria:

  criteria_1_confidence:
    weight: 0.4
    definition: "Agent's capability confidence (0.0-1.0)"
    calculation: "Direct from Proposal.confidence"
    importance: "Most important (40%)"
    interpretation: |
      Prefer agents that know they can do the job
      0.95 confidence = 0.38 contribution to score
      0.50 confidence = 0.20 contribution to score

  criteria_2_latency:
    weight: 0.3
    definition: "Agent's estimated execution time vs deadline"
    calculation: |
      latency_score = 1.0 - (estimated_latency_ms / deadline_ms)
      clamped to [0.0, 1.0]
    importance: "Second most important (30%)"
    interpretation: |
      Prefer fast agents
      If estimated = 500ms, deadline = 5000ms:
        latency_score = 1.0 - (500/5000) = 0.90
        contribution = 0.3 × 0.90 = 0.27

  criteria_3_cost:
    weight: 0.3
    definition: "Agent's estimated cost vs budget"
    calculation: |
      cost_score = 1.0 - (estimated_cost_usd / budget_usd)
      clamped to [0.0, 1.0]
    importance: "Third (30%, same as latency)"
    interpretation: |
      Prefer cheap agents
      If cost = $0.05, budget = $5.00:
        cost_score = 1.0 - (0.05/5.00) = 0.99
        contribution = 0.3 × 0.99 = 0.297

# Example Scoring Walkthrough
example_selection: |
  Task: WEATHER_QUERY
  Budget: $5.00, Deadline: 5000ms

  Received proposals:
  1. agent-ai-planner-001
     confidence: 0.95, latency_ms: 200, cost_usd: 0.02
     latency_score = 1.0 - (200/5000) = 0.96
     cost_score = 1.0 - (0.02/5.00) = 0.996
     score = (0.4×0.95) + (0.3×0.96) + (0.3×0.996)
           = 0.38 + 0.288 + 0.299 = 0.967 ✓

  2. agent-ai-concierge-001
     confidence: 0.60, latency_ms: 1500, cost_usd: 0.15
     latency_score = 1.0 - (1500/5000) = 0.70
     cost_score = 1.0 - (0.15/5.00) = 0.97
     score = (0.4×0.60) + (0.3×0.70) + (0.3×0.97)
           = 0.24 + 0.21 + 0.291 = 0.741 ✓

  3. agent-safety-watch-001
     confidence: 0.20, latency_ms: 3000, cost_usd: 2.00
     latency_score = 1.0 - (3000/5000) = 0.40
     cost_score = 1.0 - (2.00/5.00) = 0.60
     score = (0.4×0.20) + (0.3×0.40) + (0.3×0.60)
           = 0.08 + 0.12 + 0.18 = 0.38 ✗ (below 0.65)

  Winners filtered (≥0.65):
  - agent-ai-planner-001: 0.967
  - agent-ai-concierge-001: 0.741

  Selected: agent-ai-planner-001 (highest score: 0.967)

# Performance & Latency
performance:

  selection_latency_budget_ms: 50

  algorithm_complexity:
    score_calculation: "O(n) where n = number of proposals"
    max_proposals: "58 agents"
    typical_proposals: "3-10 agents"
    latency_estimate_ms: |
      Per proposal: 0.1ms (score calculation)
      10 proposals × 0.1ms = 1ms
      Sorting/filtering: 1ms
      Total: ~2ms (much less than 50ms budget)

  parallelism:
    scoring: "Parallelizable (score all proposals in parallel)"
    actual_implementation: "Sequential (complexity is negligible)"

# Fallback Strategies
fallback:

  if_selection_fails:
    step_1: "Check if any proposals exist"
    step_2: "If no proposals: Broadcast to non-eligible agents (relaxed capability filter)"
    step_3: "If still no proposals: Fail task"
    step_4: "If proposals exist but all <0.65: Pick highest scorer anyway (best effort)"

# Observability
observability:

  metrics:
    - name: "task_selection_latency_ms"
      type: "histogram"
      buckets: [1, 5, 10, 20, 50]
      description: "Time to select winner"

    - name: "proposal_count_distribution"
      type: "histogram"
      buckets: [1, 2, 5, 10, 20, 58]
      description: "Number of proposals per task"

    - name: "winning_agent_score_distribution"
      type: "histogram"
      buckets: [0.65, 0.70, 0.80, 0.90, 1.00]
      description: "Score of selected agent"

    - name: "task_selection_qualified_agents_total"
      type: "histogram"
      buckets: [0, 1, 2, 5, 10, 20]
      description: "Agents meeting ≥0.65 threshold"

    - name: "task_selection_failed_total"
      type: "counter"
      labels: ["reason"]  # no_proposals, no_qualified_agents, budget_exceeded
      description: "Selection failures"

  events:
    - name: "proposals_scored"
      fields: ["task_id", "proposal_count", "qualified_count", "trace_id"]

    - name: "winner_selected"
      fields: ["task_id", "winner_agent_id", "score", "trace_id"]

    - name: "selection_failed"
      fields: ["task_id", "reason", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "SELECT phase (third phase of 4-phase execution)"
  timeout: "50ms for scoring and selection"
  next_phase: "EXECUTE phase (task assignment to winner)"

  related_contracts:
    - "01_task_protocol_fsm.yml - FSM state machine"
    - "03_proposal_response_contract.yml - Proposals received"
    - "05_task_assignment_contract.yml - Winner assignment"

