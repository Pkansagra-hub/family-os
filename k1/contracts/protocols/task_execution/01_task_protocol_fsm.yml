# Task Execution Protocol - FSM Contract
# File: contracts/protocols/task_execution/01_task_protocol_fsm.yml
# Purpose: 4-phase task execution FSM based on Contract Net Protocol
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-FSM-001"
  name: "Task Execution Protocol FSM"
  version: "1.0"

# Task Execution Protocol Overview
task_execution_protocol:

  purpose: "Multi-agent task execution using Contract Net Protocol"
  design_pattern: "Contract Net Protocol (Smith 1980)"
  phases: 4

  phase_sequence: |
    1. ANNOUNCE - Task announcement to eligible agents
    2. PROPOSE - Agents submit proposals
    3. SELECT - Orchestrator selects winner
    4. EXECUTE - Winner agent executes task, sends results

# FSM State Definitions
fsm:

  states:

    start_state:
      id: "UNANNOUNCED"
      type: "entry"
      description: "Task created, not yet announced"
      timeout_ms: null
      actions: []

    announce_state:
      id: "ANNOUNCE"
      type: "interaction"
      description: "Orchestrator announces task to all eligible agents"
      timeout_ms: 50
      behavior: |
        - Orchestrator broadcasts TaskAnnouncement to all agents
        - All eligible agents (based on required_capabilities) receive notification
        - Agents may start evaluating task (internal processing)
      transitions: "ANNOUNCE → PROPOSE"

    proposal_state:
      id: "PROPOSE"
      type: "interaction"
      description: "Agents submit proposals to orchestrator"
      timeout_ms: 100
      behavior: |
        - Agents evaluate their capability/availability
        - Agents respond with Proposal (confidence, latency, cost)
        - Orchestrator collects all proposals (0..* proposals)
        - Timeout: 100ms (wait for proposals)
      transitions: "PROPOSE → SELECT"

    selection_state:
      id: "SELECT"
      type: "decision"
      description: "Orchestrator applies scoring and selects winner"
      timeout_ms: 50
      behavior: |
        - Orchestrator scores all proposals using hiring score formula
        - Winner: highest score ≥0.65 threshold
        - Losers: rejected (implicit or explicit rejection)
        - If no proposals or all scores <0.65: Task fails, escalate
      transitions: "SELECT → EXECUTE or SELECT → FAILED"

    execution_state:
      id: "EXECUTE"
      type: "interaction"
      description: "Winner agent executes task"
      timeout_ms: 5000
      behavior: |
        - Orchestrator sends TaskAssignment to winner
        - Agent begins execution (call Model Hub for reasoning/planning)
        - Agent may send ProgressUpdate (optional)
        - Agent completes, sends TaskResult or TaskFailure
        - Timeout: 5000ms (hard limit, force cancellation after 5s)
      transitions: "EXECUTE → COMPLETE or EXECUTE → FAILED"

    complete_state:
      id: "COMPLETE"
      type: "exit"
      description: "Task successfully completed"
      result: "TaskResult received, agent returned success"
      observability: "task_completed_total counter, task_latency_ms histogram"

    failed_state:
      id: "FAILED"
      type: "exit"
      description: "Task failed"
      reasons: |
        - ANNOUNCE_TIMEOUT: No proposals within 100ms
        - SELECT_TIMEOUT: No proposal scored ≥0.65
        - EXECUTE_TIMEOUT: Agent didn't complete within 5000ms
        - EXECUTE_ERROR: Agent returned TaskFailure
        - AGENT_CRASHED: Agent crashed during execution
      observability: "task_failed_total counter (by reason)"

# State Transition Matrix
transitions:

  transition_1_announce:
    from: "UNANNOUNCED"
    to: "ANNOUNCE"
    trigger: "Task received by orchestrator"
    action: "Broadcast TaskAnnouncement"
    latency_budget_ms: 50
    observability: "task_announced_total counter"

  transition_2_propose:
    from: "ANNOUNCE"
    to: "PROPOSE"
    trigger: "TaskAnnouncement received by agent"
    action: "Agent evaluates task, responds with Proposal"
    latency_budget_ms: 100  # Total propose phase time
    cardinality: "0..* agents" # 0 = no agents matched, * = multiple agents propose
    observability: "task_proposals_total counter"

  transition_3_select:
    from: "PROPOSE"
    to: "SELECT"
    trigger: "Timeout (100ms) OR all eligible agents responded"
    action: "Orchestrator evaluates proposals, picks winner"
    latency_budget_ms: 50
    observability: "task_selection_latency_ms histogram"

  transition_4_execute_success:
    from: "SELECT"
    to: "EXECUTE"
    trigger: "Winner agent found (score ≥0.65)"
    action: "Send TaskAssignment to winner, agent begins execution"
    latency_budget_ms: 5000
    observability: "task_execution_started_total counter"

  transition_5_execute_fail_no_winner:
    from: "SELECT"
    to: "FAILED"
    trigger: "No proposal scored ≥0.65 OR no proposals received"
    action: "Reject all agents, fail task"
    reason: "SELECT_TIMEOUT or LOW_SCORES"
    observability: "task_failed_no_winner_total counter"

  transition_6_complete:
    from: "EXECUTE"
    to: "COMPLETE"
    trigger: "TaskResult received from agent"
    action: "Record result, signal orchestrator completion"
    observability: "task_completed_total counter"

  transition_7_execute_fail_error:
    from: "EXECUTE"
    to: "FAILED"
    trigger: "TaskFailure received from agent"
    action: "Record error, update retry policy"
    reason: "EXECUTE_ERROR"
    observability: "task_failed_error_total counter"

  transition_8_execute_fail_timeout:
    from: "EXECUTE"
    to: "FAILED"
    trigger: "5000ms elapsed without result"
    action: "Force cancel task, mark agent for timeout tracking"
    reason: "EXECUTE_TIMEOUT"
    observability: "task_failed_timeout_total counter"

# Timeout Enforcement
timeout_enforcement:

  phase_timeouts:
    announce_phase: 50       # <50ms from unannounced to all agents notified
    proposal_phase: 100      # <100ms from announcement to proposal deadline
    selection_phase: 50      # <50ms scoring and selection
    execution_phase: 5000    # <5000ms for agent to complete task

  total_task_slo_ms: 5200    # ~50 + 100 + 50 + 5000 = 5200ms (worst case)

  timeout_triggers:
    announce_timeout:
      condition: "50ms elapsed without all agents receiving notification"
      action: "Proceed to PROPOSE (implicit timeout)"

    proposal_timeout:
      condition: "100ms elapsed without all proposals received"
      action: "Transition PROPOSE → SELECT (close proposal window)"

    selection_timeout:
      condition: "50ms elapsed without selection complete"
      action: "Transition SELECT → EXECUTE with highest score (force selection)"

    execution_timeout:
      condition: "5000ms elapsed without TaskResult/TaskFailure"
      action: "Force transition EXECUTE → FAILED (execution timeout)"
      agent_action: "Cancel task, send TimeoutCancellation signal to agent"

# Performance Budgets
performance_budgets:

  budget_table: |
    ┌────────────────────┬──────────┬──────────┬────────────────┐
    │ Phase              │ Timeout  │ Budget   │ Notes          │
    ├────────────────────┼──────────┼──────────┼────────────────┤
    │ ANNOUNCE           │ 50ms     │ <50ms    │ Broadcast time │
    │ PROPOSE            │ 100ms    │ <100ms   │ Proposal window│
    │ SELECT             │ 50ms     │ <50ms    │ Scoring time   │
    │ EXECUTE            │ 5000ms   │ <5000ms  │ Execution time │
    ├────────────────────┼──────────┼──────────┼────────────────┤
    │ TOTAL              │ 5200ms   │ <5200ms  │ End-to-end     │
    └────────────────────┴──────────┴──────────┴────────────────┘

  slo_targets:
    p50_latency_ms: 2000      # 50% of tasks complete in 2s
    p95_latency_ms: 4500      # 95% of tasks complete in 4.5s
    p99_latency_ms: 5200      # 99% of tasks complete in 5.2s

# Observability
observability:

  metrics:
    - name: "task_announced_total"
      type: "counter"
      description: "Tasks announced to agents"

    - name: "task_proposals_total"
      type: "counter"
      labels: ["task_id"]
      description: "Total proposals received per task"

    - name: "task_selection_latency_ms"
      type: "histogram"
      buckets: [10, 20, 50, 100]
      description: "Time to select winner agent"

    - name: "task_execution_latency_ms"
      type: "histogram"
      buckets: [1000, 2000, 3000, 5000]
      description: "Execution phase latency (from assignment to result)"

    - name: "task_completed_total"
      type: "counter"
      description: "Tasks successfully completed"

    - name: "task_failed_total"
      type: "counter"
      labels: ["reason"]  # SELECT_TIMEOUT, EXECUTE_TIMEOUT, EXECUTE_ERROR, AGENT_CRASHED
      description: "Tasks failed by reason"

    - name: "task_total_latency_ms"
      type: "histogram"
      buckets: [1000, 2000, 3000, 4000, 5000, 5200]
      description: "Total task latency (announce to complete/fail)"

  events:
    - name: "task_announced"
      fields: ["task_id", "intent", "required_capabilities_count", "trace_id"]

    - name: "task_proposal_received"
      fields: ["task_id", "agent_id", "confidence", "estimated_latency_ms", "cost_usd", "trace_id"]

    - name: "task_winner_selected"
      fields: ["task_id", "winner_agent_id", "score", "trace_id"]

    - name: "task_execution_started"
      fields: ["task_id", "agent_id", "timeout_ms", "trace_id"]

    - name: "task_result_received"
      fields: ["task_id", "agent_id", "success", "latency_ms", "trace_id"]

    - name: "task_failed"
      fields: ["task_id", "reason", "details", "trace_id"]

# Lifecycle Integration
lifecycle_context:

  related_contracts:
    - "01_hire_protocol_fsm.yml - Agent lifecycle (must be ACTIVE to execute)"
    - "02_task_announcement_contract.yml - TaskAnnouncement message"
    - "03_proposal_response_contract.yml - Proposal message"
    - "04_selection_contract.yml - Scoring algorithm"
    - "05_task_assignment_contract.yml - TaskAssignment message"
    - "06_progress_monitoring_contract.yml - ProgressUpdate message"
    - "07_completion_contract.yml - TaskResult message"
    - "08_failure_handling_contract.yml - TaskFailure/error handling"
    - "09_timeout_enforcement.yml - Timeout policies"

  protocol_sequence: |
    Orchestrator → ANNOUNCE → TaskAnnouncement → All Eligible Agents
    All Agents → PROPOSE → Proposal → Orchestrator (0..* responses)
    Orchestrator → SELECT → Scoring Algorithm → Winner Selection
    Orchestrator → EXECUTE → TaskAssignment → Winner Agent
    Winner Agent → EXECUTE → TaskResult/TaskFailure → Orchestrator

