# Task Execution Protocol - Failure Handling Contract
# File: contracts/protocols/task_execution/08_failure_handling_contract.yml
# Purpose: Agent sends failure message and error handling
# Status: COMPLETE
# Version: 1.0

contract:
  id: "CONTRACT-TASK-EXECUTION-FAILURE-008"
  name: "Task Failure Handling Message Contract"
  version: "1.0"

# Task Failure Overview
task_failure:
  purpose: "Agent reports task execution failure or non-completion"
  direction: "Agent (1) → Orchestrator (1)"
  protocol_phase: "EXECUTE phase completion (failure path)"
  trigger: "Agent encounters error or cannot complete task"

# TaskFailure Message Schema
flatbuffers_schema: |
  table TaskFailure {
    task_id: string (required)                 # UUID task identifier
    agent_id: string (required)                # Agent that failed
    error_code: string (required)              # Error code (see enum below)
    error_message: string (required)           # Human-readable error message
    error_details: string (optional, max 1024) # Detailed error info (stacktrace)
    retry_after_ms: uint (optional)            # Suggested retry delay (milliseconds)
    partial_result: string (optional)          # Partial result if available
    latency_ms: uint (required)                # Time spent before failure
    cost_usd: float (required)                 # Cost incurred before failure
    trace_id: string (required)                # OpenTelemetry trace ID
    timestamp_ns: ulong (required)             # Failure timestamp
  }

# Error Codes
error_codes:

  CAPABILITY_ERROR:
    code: "CAPABILITY_ERROR"
    meaning: "Agent lacks required capability"
    cause: "Agent doesn't have required tool/model"
    retry: "Try different agent"
    example: "Agent tried weather API but doesn't have API key"

  TOOL_NOT_AVAILABLE:
    code: "TOOL_NOT_AVAILABLE"
    meaning: "Required tool is offline/unavailable"
    cause: "Tool down, circuit breaker open, etc."
    retry: "Retry after 30s (tool recovery time)"
    example: "Weather API returned 503 Service Unavailable"

  BUDGET_EXCEEDED:
    code: "BUDGET_EXCEEDED"
    meaning: "Task cost would exceed budget"
    cause: "Tool pricing higher than expected"
    retry: "Increase budget or try cheaper agent"
    example: "LLM token cost exceeded remaining budget"

  DEADLINE_PASSED:
    code: "DEADLINE_PASSED"
    meaning: "Task deadline has passed"
    cause: "Execution took too long"
    retry: "Not retryable (deadline already missed)"
    example: "Agent detected current time > deadline_ms"

  PRIVACY_VIOLATION:
    code: "PRIVACY_VIOLATION"
    meaning: "Task violates privacy constraints"
    cause: "RED band task without arbiter approval"
    retry: "Get arbiter approval, re-submit"
    example: "Tried to send email with RED band sensitivity"

  TOOL_ERROR:
    code: "TOOL_ERROR"
    meaning: "Tool execution failed"
    cause: "Tool returned error (e.g., API error)"
    retry: "Retry after 5s (transient) or 30s (persistent)"
    example: "Weather API returned malformed response"

  AGENT_INTERNAL_ERROR:
    code: "AGENT_INTERNAL_ERROR"
    meaning: "Internal agent error (exception)"
    cause: "Bug in agent code, resource exhaustion"
    retry: "Retry with different agent"
    example: "Out of memory, null pointer exception"

  LLM_INFERENCE_ERROR:
    code: "LLM_INFERENCE_ERROR"
    meaning: "Model Hub LLM inference failed"
    cause: "Model error, inference timeout"
    retry: "Retry immediately (single transient)"
    example: "LLM inference exceeded 5s timeout"

  INVALID_REQUEST:
    code: "INVALID_REQUEST"
    meaning: "Task request is invalid"
    cause: "Malformed user input, missing fields"
    retry: "Fix request and resubmit"
    example: "User input is empty or invalid intent"

  AGENT_CRASHED:
    code: "AGENT_CRASHED"
    meaning: "Agent process crashed"
    cause: "Unhandled exception, OOM, segfault"
    retry: "Retry with new agent instance"
    example: "Agent died unexpectedly"

  TIMEOUT:
    code: "TIMEOUT"
    meaning: "Execution exceeded timeout"
    cause: "Task took >5000ms"
    retry: "Retry with higher timeout or different agent"
    example: "Tool call took >5s"

# Message Fields
fields:

  task_id:
    type: "UUID (string)"
    required: true
    description: "Must match original TaskAnnouncement"

  agent_id:
    type: "UUID (string)"
    required: true
    description: "Agent that encountered failure"

  error_code:
    type: "string (enum, see error_codes above)"
    required: true
    example: "TOOL_NOT_AVAILABLE"
    description: "Error classification"

  error_message:
    type: "string (max 256 chars)"
    required: true
    examples:
      - "Weather API returned 503 Service Unavailable"
      - "Tool 'calendar_api' requires authentication"
      - "Execution exceeded 5000ms timeout"
    description: "Human-readable error message"

  error_details:
    type: "string (max 1024 chars, optional)"
    required: false
    examples:
      - |
        Traceback (most recent call last):
          File "agent.py", line 42, in execute
            result = tool.call()
        ToolError: API returned 503
      - |
        HTTP/1.1 401 Unauthorized
        Content-Type: application/json
        {"error": "Invalid API Key"}
    description: "Detailed error info (stacktrace, HTTP response)"

  retry_after_ms:
    type: "uint (milliseconds, optional)"
    required: false
    examples: [0, 5000, 30000, 60000]
    description: "Suggested delay before retry (0 = retry immediately)"

  partial_result:
    type: "JSON string (optional)"
    required: false
    example: |
      {
        "forecast": "Incomplete forecast due to API error",
        "temperature": 72,
        "note": "Could not retrieve humidity data"
      }
    description: "Partial result if available (best effort)"

  latency_ms:
    type: "uint (milliseconds)"
    required: true
    example: 150
    description: "Time spent before failure occurred"

  cost_usd:
    type: "float"
    required: true
    example: 0.01
    description: "Cost incurred before failure"

  trace_id:
    type: "string"
    required: true
    description: "Distributed tracing trace ID"

  timestamp_ns:
    type: "ulong (nanoseconds)"
    required: true
    description: "Failure timestamp"

# Example Payloads
example_payloads: |
  # Example 1: Tool not available (503)
  {
    "task_id": "task-xxx",
    "agent_id": "agent-ai-planner-001",
    "error_code": "TOOL_NOT_AVAILABLE",
    "error_message": "Weather API returned 503 Service Unavailable",
    "error_details": "HTTP/1.1 503 Service Unavailable",
    "retry_after_ms": 30000,
    "partial_result": null,
    "latency_ms": 150,
    "cost_usd": 0.001,
    "trace_id": "...",
    "timestamp_ns": 1695000001000000000
  }

  # Example 2: Budget exceeded
  {
    "task_id": "task-yyy",
    "agent_id": "agent-ai-concierge-001",
    "error_code": "BUDGET_EXCEEDED",
    "error_message": "LLM token cost ($0.50) exceeded remaining budget ($0.30)",
    "error_details": null,
    "retry_after_ms": 0,
    "partial_result": null,
    "latency_ms": 100,
    "cost_usd": 0.30,
    "trace_id": "...",
    "timestamp_ns": 1695000002000000000
  }

  # Example 3: Internal error with partial result
  {
    "task_id": "task-zzz",
    "agent_id": "agent-researcher-001",
    "error_code": "AGENT_INTERNAL_ERROR",
    "error_message": "Exception: Out of memory during processing",
    "error_details": "MemoryError: unable to allocate 2.5 GiB for result cache",
    "retry_after_ms": 5000,
    "partial_result": "{\"results_found\": 50, \"results_processed\": 30}",
    "latency_ms": 2500,
    "cost_usd": 0.25,
    "trace_id": "...",
    "timestamp_ns": 1695000003000000000
  }

# Orchestrator Handling (Retry Strategy)
orchestrator_handling:

  step_1_receive_failure:
    action: "Receive TaskFailure message"
    validation: "Verify task_id, agent_id"

  step_2_classify_error:
    action: "Determine if retryable"
    classification: |
      TRANSIENT (retry immediately):
        - TOOL_NOT_AVAILABLE
        - TOOL_ERROR (5s backoff)
        - TIMEOUT

      PERMANENT (try different agent):
        - CAPABILITY_ERROR
        - BUDGET_EXCEEDED
        - DEADLINE_PASSED
        - PRIVACY_VIOLATION

      CRITICAL (escalate):
        - AGENT_CRASHED
        - AGENT_INTERNAL_ERROR

  step_3_decide_action:
    action: "Execute appropriate recovery"
    logic: |
      if error_code == TRANSIENT:
        wait(retry_after_ms)
        retry_with_same_task()

      elif error_code == PERMANENT:
        retry_with_different_agent()

      elif error_code == CRITICAL:
        log_critical_error()
        maybe_increment_crash_counter()
        retry_with_fresh_agent()

  step_4_max_retries:
    limit: "Max 3 retry attempts per task"
    logic: |
      if retry_count >= 3:
        fail_task()
        inform_user("Unable to complete task after 3 attempts")

# Failure Observability
observability:

  metrics:
    - name: "task_failed_total"
      type: "counter"
      labels: ["error_code"]
      description: "Task failures by error code"

    - name: "task_failure_latency_ms"
      type: "histogram"
      buckets: [10, 50, 100, 500, 1000, 5000]
      description: "Time to failure (how far task got)"

    - name: "task_failure_cost_usd"
      type: "histogram"
      buckets: [0.001, 0.01, 0.05, 0.10, 0.50, 1.00]
      description: "Cost incurred before failure"

    - name: "task_retry_total"
      type: "counter"
      labels: ["error_code", "retry_attempt"]
      description: "Task retries by error type and attempt"

    - name: "task_retry_success_rate"
      type: "gauge"
      labels: ["error_code"]
      description: "Success rate of retries (per error type)"

  events:
    - name: "task_failed"
      fields: ["task_id", "agent_id", "error_code", "latency_ms", "cost_usd", "trace_id"]

    - name: "task_retry_initiated"
      fields: ["task_id", "error_code", "retry_attempt", "retry_after_ms", "trace_id"]

    - name: "task_retry_exhausted"
      fields: ["task_id", "error_code", "total_attempts", "trace_id"]

# Failure Recovery Strategies
recovery_strategies:

  strategy_1_immediate_retry:
    when: "Transient error (TOOL_NOT_AVAILABLE, TOOL_ERROR)"
    action: "Retry task immediately with same agent"
    rationale: "Likely temporary condition (service recovering)"
    max_attempts: 3

  strategy_2_backoff_retry:
    when: "Transient error with retry_after_ms > 0"
    action: "Wait retry_after_ms, then retry"
    rationale: "Service indicated recovery time"
    example: "weather API 503 suggests wait 30s"

  strategy_3_alternate_agent:
    when: "Permanent error (CAPABILITY_ERROR, BUDGET_EXCEEDED)"
    action: "Retry with different agent (new hire)"
    rationale: "Original agent can't do it, try another"
    selection: "Use next-best proposal (if available)"

  strategy_4_user_escalation:
    when: "All retries exhausted"
    action: "Inform user of persistent failure"
    message: "Unable to complete task. Please try again later or adjust request."
    suggestion: "Increase budget, clarify requirements, etc."

# Lifecycle Integration
lifecycle_context:

  protocol_phase: "EXECUTE → FAILED transition"
  trigger: "Agent sends TaskFailure (error_code != success)"
  next_phase: "Retry (if applicable) or fail task"

  final_state: "FAILED (failure path of FSM)"

  related_contracts:
    - "01_task_protocol_fsm.yml - FSM state machine"
    - "05_task_assignment_contract.yml - Task assigned"
    - "07_completion_contract.yml - Success alternative"

# ==============================================================================
