# Partial Rollback Contract
# Purpose: Handle partial rollback scenarios when compensation fails
# Research: Saga Pattern failure handling, manual intervention workflows
# Source ADRs: ADR-0003b, ADR-0009
# Version: 1.0.0
# Last Updated: 2025-10-21

partial_rollback_contract:
  name: "Partial Rollback Handling"
  description: "Handle scenarios where some compensations succeed and others fail"
  adr_reference:
    - "ADR-0003b: 6 Core Protocol Implementations"
    - "ADR-0009: Circuit Breaker Pattern"
  version: "1.0.0"

  # ============================================================================
  # Partial Rollback Scenarios
  # ============================================================================
  partial_rollback_scenarios:
    scenario_1_compensation_timeout:
      name: "Compensation Timeout"
      description: "Compensation exceeds timeout budget before completing"
      trigger: "Elapsed time >= compensation_timeout_ms"
      example: |
        Forward: step_1 ✓, step_2 ✓, step_3 ✗ (failed)
        Rollback: step_2 ✓ (compensated in 2s), step_1 ⏱️ (timeout after 5s)
        Result: Partial rollback (step_2 compensated, step_1 timed out)

      impact:
        - "System in inconsistent state (step_1 not rolled back)"
        - "Manual intervention required"
        - "High-priority incident"

      handling:
        - "Log to DLQ (Dead Letter Queue)"
        - "Alert operations team (PagerDuty HIGH)"
        - "Create manual remediation ticket"
        - "Notify user of issue"
        - "Continue with partial rollback (don't abort)"

    scenario_2_compensation_service_unavailable:
      name: "Compensation Service Unavailable"
      description: "Compensation endpoint unreachable or returning errors"
      trigger: "Service returns 5xx, network timeout, circuit breaker OPEN"
      example: |
        Forward: step_1 ✓ (hotel booked), step_2 ✓ (flight booked), step_3 ✗ (payment failed)
        Rollback: step_2 ✗ (flight service DOWN), step_1 ✓ (hotel cancelled)
        Result: Flight booking NOT cancelled (stuck in system)

      impact:
        - "Resource not released (flight reservation still active)"
        - "Potential cost accumulation"
        - "User confusion (believes both cancelled)"

      handling:
        - "Retry with exponential backoff (max 3 retries)"
        - "If still failing, use circuit breaker (ADR-0009)"
        - "Log to DLQ with full context"
        - "Alert operations team"
        - "Create manual remediation ticket with service details"

    scenario_3_compensation_permanent_error:
      name: "Compensation Permanent Error"
      description: "Compensation cannot be performed (invalid state, unauthorized, etc.)"
      trigger: "Service returns 4xx (400-404, 403), INVALID_STATE error"
      example: |
        Forward: Hotel booking checked in (guest arrived)
        Rollback: Cannot cancel (booking already checked in)
        Result: Compensation impossible, manual refund required

      impact:
        - "Cannot automatically restore system state"
        - "Requires manual intervention from operations/finance team"
        - "Potential financial loss"

      handling:
        - "Do NOT retry (permanent error)"
        - "Log to DLQ with ERROR severity"
        - "Alert operations + finance team"
        - "Create CRITICAL remediation ticket"
        - "Notify user with manual intervention plan"

    scenario_4_multiple_compensation_failures:
      name: "Multiple Compensation Failures"
      description: "Multiple compensations fail (cascading failure)"
      trigger: "2+ compensations fail in same saga"
      example: |
        Forward: 5 steps executed
        Rollback: step_5 ✗, step_4 ✗, step_3 ✓, step_2 ✗, step_1 ✓
        Result: 3 of 5 compensations failed

      impact:
        - "Major inconsistency (multiple resources not rolled back)"
        - "High manual cleanup effort"
        - "Potential data corruption"

      handling:
        - "ABORT rollback after 3 failures (prevent further damage)"
        - "Log entire saga state to DLQ"
        - "Alert operations team as CRITICAL"
        - "Create remediation ticket with ALL failed steps"
        - "Escalate to engineering team"

  # ============================================================================
  # Partial Rollback State Tracking
  # ============================================================================
  partial_rollback_state:
    name: "Partial Rollback State Schema"
    description: "Track which compensations succeeded/failed"

    fields:
      saga_id:
        type: "string (UUID v4)"
        required: true
        description: "Saga identifier"

      rollback_status:
        type: "enum"
        required: true
        values: ["IN_PROGRESS", "PARTIAL_SUCCESS", "TOTAL_FAILURE"]
        description: "Overall rollback status"

      total_steps_requiring_compensation:
        type: "integer"
        required: true
        description: "Number of steps that need compensation"

      compensations_attempted:
        type: "integer"
        required: true
        description: "Number of compensations attempted"

      compensations_succeeded:
        type: "integer"
        required: true
        description: "Number of compensations succeeded"

      compensations_failed:
        type: "integer"
        required: true
        description: "Number of compensations failed"

      compensations_skipped:
        type: "integer"
        required: true
        description: "Number of compensations skipped (circuit breaker, timeout)"

      failed_compensation_details:
        type: "array of FailedCompensation"
        required: true
        description: "Details of failed compensations"
        sub_fields:
          step_id:
            type: "string"
            description: "Failed step ID"

          compensation_id:
            type: "string (UUID v4)"
            description: "Compensation request ID"

          failure_reason:
            type: "enum"
            values: ["TIMEOUT", "SERVICE_ERROR", "PERMANENT_ERROR", "CIRCUIT_OPEN", "NETWORK_ERROR"]

          error_code:
            type: "string"
            description: "Error code from service"

          error_message:
            type: "string"
            description: "Human-readable error"

          retry_count:
            type: "integer"
            description: "Number of retries attempted"

          last_attempt_at_ms:
            type: "timestamp"
            description: "When last retry attempted"

      manual_intervention_required:
        type: "boolean"
        required: true
        description: "True if operations team must intervene"

      remediation_ticket_id:
        type: "string"
        required: false
        description: "Ticket ID for manual remediation"

      partial_state_description:
        type: "string"
        required: true
        description: "Human-readable description of inconsistent state"
        max_length: 2000
        example: "Hotel booking cancelled, flight reservation NOT cancelled (service unavailable), payment NOT refunded (compensation timeout)"

      recommended_manual_actions:
        type: "array of string"
        required: true
        description: "Steps operations team should take"
        example:
          - "Manually cancel flight reservation in flight system (reservation_id=FL12345)"
          - "Process manual refund for $199.99 to credit card ending in 1234"
          - "Send user notification with refund tracking number"
          - "Verify hotel cancellation succeeded (confirmation code=ABC123)"

  # ============================================================================
  # Manual Remediation Workflow
  # ============================================================================
  manual_remediation_workflow:
    name: "Manual Remediation Process"
    description: "Step-by-step process for operations team to fix partial rollback"

    step_1_triage:
      name: "Triage Incident"
      description: "Assess severity and assign to appropriate team"
      actions:
        - "Read DLQ entry with full saga context"
        - "Review failed_compensation_details"
        - "Check if user impacted (waiting for refund, etc.)"
        - "Assign to operations team (or escalate to engineering if system issue)"
      sla:
        CRITICAL: "15 minutes"
        HIGH: "1 hour"
        NORMAL: "4 hours"

    step_2_verify_state:
      name: "Verify Current System State"
      description: "Check actual state of resources"
      actions:
        - "Query each failed step's service (hotel, flight, payment)"
        - "Verify which resources are in inconsistent state"
        - "Document current state in remediation ticket"
      tools:
        - "Service admin dashboards"
        - "Direct database queries (read-only)"
        - "API test endpoints"

    step_3_execute_manual_compensation:
      name: "Execute Manual Compensations"
      description: "Manually perform failed compensations"
      actions:
        - "For each failed compensation:"
        - "  - Use service admin UI or API to perform compensation"
        - "  - Verify compensation succeeded"
        - "  - Document action taken in ticket"
        - "  - Update partial_rollback_state"
      safeguards:
        - "Double-check resource IDs before action"
        - "Use service's idempotency features (if available)"
        - "Take screenshots/logs as proof"

    step_4_verify_consistency:
      name: "Verify System Consistency"
      description: "Ensure system now in consistent state"
      actions:
        - "Re-query all resources involved in saga"
        - "Verify all compensations complete (automated + manual)"
        - "Check for any lingering inconsistencies"
        - "Run consistency check script (if available)"
      acceptance_criteria:
        - "All bookings/reservations cancelled"
        - "All payments refunded"
        - "All notifications sent"
        - "No orphaned resources"

    step_5_user_notification:
      name: "Notify User"
      description: "Inform user of resolution"
      actions:
        - "Send email with:"
        - "  - Apology for delay"
        - "  - Confirmation of cancellations"
        - "  - Refund tracking information"
        - "  - Support contact for questions"
        - "Update user's session state (if still active)"
      template: |
        Subject: Your Booking Cancellation - [Saga ID]

        Dear [User],

        We apologize for the delay in processing your cancellation. Due to a temporary
        technical issue, we had to manually complete your refund.

        Status:
        - Hotel Booking: Cancelled ✓
        - Flight Reservation: Cancelled ✓
        - Payment Refund: Processed ✓ (Refund tracking: [Refund ID])

        You should see the refund in 3-5 business days.

        If you have any questions, please contact support@example.com.

        Thank you for your patience.

    step_6_post_mortem:
      name: "Post-Mortem and Prevention"
      description: "Analyze root cause and prevent recurrence"
      actions:
        - "Document root cause (timeout, service outage, etc.)"
        - "Identify preventive measures (increase timeout, circuit breaker tuning)"
        - "Update runbook if new pattern discovered"
        - "File engineering ticket if code/config change needed"
      deliverables:
        - "Post-mortem document"
        - "Action items for prevention"
        - "Updated runbook (if applicable)"

  # ============================================================================
  # Partial Rollback Logging
  # ============================================================================
  partial_rollback_logging:
    name: "DLQ Entry Schema for Partial Rollback"
    description: "Complete context logged to Dead Letter Queue"

    dlq_entry:
      entry_id:
        type: "string (UUID v4)"
        description: "Unique DLQ entry ID"

      saga_id:
        type: "string (UUID v4)"
        description: "Saga that failed partial rollback"

      cognitive_trace_id:
        type: "string (UUID v4)"
        description: "Distributed trace ID"

      severity:
        type: "enum"
        values: ["CRITICAL", "HIGH", "NORMAL"]
        default: "HIGH"
        description: "Incident severity"

      summary:
        type: "string"
        description: "One-line summary"
        example: "Partial rollback: 2 of 3 compensations failed"

      saga_definition:
        type: "object (JSON)"
        description: "Full saga definition"

      failed_step_id:
        type: "string"
        description: "Step that caused saga to fail initially"

      compensation_results:
        type: "array of CompensationResult"
        description: "Result of each compensation (success/failure)"

      failed_compensations:
        type: "array of FailedCompensation"
        description: "Details of failed compensations"

      partial_state_description:
        type: "string"
        description: "Human-readable inconsistent state"

      recommended_actions:
        type: "array of string"
        description: "Manual remediation steps"

      user_context:
        type: "object"
        sub_fields:
          user_id: "string"
          session_id: "string (UUID v4)"
          privacy_band: "enum"

      logged_at_ms:
        type: "timestamp"

      alert_sent:
        type: "boolean"
        description: "Whether operations team alerted"

      remediation_ticket_id:
        type: "string"
        required: false
        description: "Ticket created for manual remediation"

  # ============================================================================
  # Alerting Configuration
  # ============================================================================
  alerting:
    name: "Alerting Rules for Partial Rollback"
    description: "When and how to alert operations team"

    alert_rules:
      rule_1_any_compensation_failure:
        name: "Any Compensation Failure"
        trigger: "compensation_status = FAILED"
        severity: "HIGH"
        channels: ["pagerduty", "slack"]
        message: "Saga [saga_id] compensation failed: [step_id] - [error_message]"

      rule_2_multiple_compensation_failures:
        name: "Multiple Compensation Failures"
        trigger: "compensations_failed >= 2"
        severity: "CRITICAL"
        channels: ["pagerduty", "slack", "email"]
        escalation: "Escalate to engineering after 30 minutes"

      rule_3_compensation_timeout:
        name: "Compensation Timeout"
        trigger: "compensation_latency >= timeout_ms"
        severity: "HIGH"
        channels: ["pagerduty", "slack"]

      rule_4_circuit_breaker_prevents_compensation:
        name: "Circuit Breaker OPEN During Compensation"
        trigger: "circuit_breaker_state = OPEN AND compensation_attempted"
        severity: "CRITICAL"
        channels: ["pagerduty", "slack"]
        message: "Circuit breaker prevented compensation: [step_id] - Service: [service_url]"

    alert_throttling:
      description: "Prevent alert storms"
      policy: "Max 1 alert per saga_id per 5 minutes"
      grouping: "Group alerts by saga_type (e.g., all booking saga failures)"

  # ============================================================================
  # Metrics
  # ============================================================================
  metrics:
    - name: "partial_rollback_total"
      type: "counter"
      labels: ["saga_type", "failure_reason"]
      description: "Total partial rollbacks requiring manual intervention"

    - name: "partial_rollback_compensation_failed_count"
      type: "histogram"
      labels: ["saga_type"]
      buckets: [1, 2, 3, 5, 10]
      description: "Number of failed compensations per partial rollback"

    - name: "manual_remediation_duration_ms"
      type: "histogram"
      labels: ["saga_type", "severity"]
      buckets: [60000, 300000, 900000, 3600000, 14400000]
      description: "Time from partial rollback to manual resolution"

    - name: "partial_rollback_resolution_success_rate"
      type: "gauge"
      labels: ["saga_type"]
      description: "Percentage of partial rollbacks successfully resolved manually"

  # ============================================================================
  # Examples
  # ============================================================================
  examples:
    example_1_hotel_flight_payment_partial:
      saga_id: "saga-123"
      rollback_status: "PARTIAL_SUCCESS"
      total_steps_requiring_compensation: 3
      compensations_attempted: 3
      compensations_succeeded: 1
      compensations_failed: 2
      failed_compensation_details:
        - step_id: "step_book_flight"
          failure_reason: "SERVICE_ERROR"
          error_code: "503"
          error_message: "Flight service temporarily unavailable"
          retry_count: 3
        - step_id: "step_charge_payment"
          failure_reason: "TIMEOUT"
          error_message: "Refund API timed out after 5000ms"
          retry_count: 0
      partial_state_description: "Hotel booking cancelled successfully. Flight reservation NOT cancelled (service down). Payment NOT refunded (timeout)."
      recommended_manual_actions:
        - "Manually cancel flight reservation FL12345 in flight admin portal"
        - "Process manual refund of $500.00 to card ending in 1234"
        - "Send user confirmation email with refund tracking"
