# Saga Definition Contract
# Purpose: Structure and schema for defining sagas (multi-step transactions with compensations)
# Research: Saga Pattern (Garcia-Molina & Salem 1987), Temporal Workflows
# Source ADRs: ADR-0003 (MPST Protocol Validation), ADR-0008 (Saga Pattern)
# Version: 1.0.0
# Last Updated: 2025-10-21

saga_definition_contract:
  name: "Saga Definition Schema"
  description: "Defines saga structure: steps, compensations, dependencies, and execution order"
  adr_reference:
    - "ADR-0003: MPST Protocol Validation"
    - "ADR-0003b: 6 Core Protocol Implementations (Saga Protocol)"
    - "ADR-0009: Circuit Breaker Pattern (Prevents compensation retry storms)"
  version: "1.0.0"

  # ============================================================================
  # Saga Definition Structure
  # ============================================================================
  saga_definition:
    name: "SagaDefinition"
    description: "Complete saga structure with forward steps and compensations"

    fields:
      saga_id:
        type: "string (UUID v4)"
        required: true
        description: "Unique identifier for this saga"
        example: "123e4567-e89b-12d3-a456-426614174000"
        validation:
          - "Must be UUID v4 format"
          - "Must be globally unique"

      saga_name:
        type: "string"
        required: true
        description: "Human-readable saga name"
        example: "hotel_flight_booking_saga"
        validation:
          - "Length: 3-100 characters"
          - "Format: snake_case"
          - "Must be unique within session"

      saga_type:
        type: "enum"
        required: true
        description: "Type of saga for categorization"
        values:
          - "BOOKING"           # Multi-resource booking (hotel, flight, rental)
          - "PAYMENT"           # Multi-step payment processing
          - "PROVISIONING"      # Resource provisioning (cloud resources, accounts)
          - "WORKFLOW"          # Generic multi-step workflow
          - "INTEGRATION"       # Third-party service integration
        default: "WORKFLOW"

      description:
        type: "string"
        required: true
        description: "What this saga accomplishes"
        example: "Book hotel and flight, charge payment, send confirmation"
        max_length: 500

      cognitive_trace_id:
        type: "string (UUID v4)"
        required: true
        description: "Distributed trace ID for observability"

      owner:
        type: "object"
        required: true
        description: "Who initiated this saga"
        sub_fields:
          user_id:
            type: "string"
            description: "User identifier"
          session_id:
            type: "string (UUID v4)"
            description: "Session identifier"
          agent_id:
            type: "string"
            required: false
            description: "Agent that initiated saga"

      priority:
        type: "enum"
        required: true
        description: "Saga execution priority"
        values: ["CRITICAL", "HIGH", "NORMAL", "LOW"]
        default: "NORMAL"
        impact:
          CRITICAL: "Step timeout 10s, compensation timeout 5s, max saga timeout 120s"
          HIGH: "Step timeout 5s, compensation timeout 3s, max saga timeout 60s"
          NORMAL: "Step timeout 3s, compensation timeout 2s, max saga timeout 30s"
          LOW: "Step timeout 2s, compensation timeout 1s, max saga timeout 20s"

      max_saga_timeout_ms:
        type: "integer"
        required: true
        description: "Maximum total saga execution time (includes retries, compensation)"
        example: 60000
        validation:
          - "Range: 5000-300000 (5s-5min)"
          - "Must be >= sum of all step timeouts"

      idempotency_key:
        type: "string (UUID v4)"
        required: true
        description: "Unique key for idempotent saga execution (prevents duplicate sagas)"
        validation:
          - "Must be UUID v4 format"
          - "Same idempotency_key = same saga (deduplicate)"

      # ===== SAGA STEPS =====
      steps:
        type: "array of SagaStep"
        required: true
        description: "Ordered list of saga steps (forward execution order)"
        min_length: 1
        max_length: 100
        validation:
          - "At least 1 step required"
          - "Step IDs must be unique within saga"
          - "Dependencies must reference existing steps"
          - "No circular dependencies"

      # ===== EXECUTION CONFIGURATION =====
      execution_config:
        type: "object"
        required: true
        description: "How saga executes"
        sub_fields:
          execution_mode:
            type: "enum"
            values: ["SEQUENTIAL", "PARALLEL_SAFE"]
            default: "SEQUENTIAL"
            description: "Sequential: steps in order, Parallel: steps without dependencies can run in parallel"

          failure_strategy:
            type: "enum"
            values: ["FAIL_FAST", "CONTINUE_ON_NON_CRITICAL"]
            default: "FAIL_FAST"
            description: "FAIL_FAST: abort on first error, CONTINUE: skip non-critical steps"

          compensation_order:
            type: "enum"
            values: ["REVERSE", "EXPLICIT"]
            default: "REVERSE"
            description: "REVERSE: compensate in reverse order, EXPLICIT: use explicit order"

          circuit_breaker_enabled:
            type: "boolean"
            default: true
            description: "Use circuit breakers for steps (ADR-0009)"

          checkpoint_frequency:
            type: "enum"
            values: ["EVERY_STEP", "ON_FAILURE", "NONE"]
            default: "EVERY_STEP"
            description: "When to save saga state for recovery"

      # ===== METADATA =====
      metadata:
        type: "object"
        required: false
        description: "Additional saga metadata"
        sub_fields:
          tags:
            type: "array of string"
            description: "Tags for categorization"
            example: ["travel", "booking", "payment"]

          estimated_duration_ms:
            type: "integer"
            description: "Estimated saga duration (for UX)"
            example: 15000

          estimated_cost_usd:
            type: "float"
            description: "Estimated total cost"
            example: 500.00

          privacy_band:
            type: "enum"
            values: ["GREEN", "AMBER", "RED", "BLACK"]
            default: "GREEN"
            description: "Data sensitivity level"

      created_at_ms:
        type: "timestamp"
        required: true

      created_by:
        type: "string"
        required: true
        description: "Component that created saga"
        example: "orchestrator"

  # ============================================================================
  # Saga Step Definition
  # ============================================================================
  saga_step:
    name: "SagaStep"
    description: "Single step in saga with forward action and compensation"

    fields:
      step_id:
        type: "string"
        required: true
        description: "Unique step identifier within saga"
        example: "step_book_hotel"
        validation:
          - "Format: step_{action}_{resource}"
          - "Must be unique within saga"
          - "Length: 5-50 characters"

      step_name:
        type: "string"
        required: true
        description: "Human-readable step name"
        example: "Book Hotel Reservation"
        max_length: 100

      step_order:
        type: "integer"
        required: true
        description: "Execution order (0-indexed)"
        example: 0
        validation:
          - "Range: 0 to (total_steps - 1)"
          - "Must be sequential with no gaps"

      step_type:
        type: "enum"
        required: true
        description: "Type of operation"
        values:
          - "SERVICE_CALL"      # External API call
          - "TOOL_EXECUTION"    # Tool call (calendar, email, search)
          - "AGENT_TASK"        # AI agent execution
          - "VALIDATION"        # Data validation step
          - "NOTIFICATION"      # Send notification (email, SMS)
          - "STATE_UPDATE"      # Update session state
        example: "SERVICE_CALL"

      # ===== FORWARD ACTION =====
      action:
        type: "object"
        required: true
        description: "Forward action to execute"
        sub_fields:
          action_type:
            type: "string"
            description: "Semantic action type"
            example: "BOOK"
            values: ["CREATE", "UPDATE", "DELETE", "BOOK", "RESERVE", "CHARGE", "NOTIFY", "VALIDATE"]

          service_url:
            type: "string (URL)"
            required: true
            description: "Service endpoint to call"
            example: "https://hotel-service.example.com/api/v1/bookings"

          http_method:
            type: "enum"
            values: ["GET", "POST", "PUT", "DELETE", "PATCH"]
            default: "POST"

          request_parameters:
            type: "object (JSON)"
            required: true
            description: "Parameters for service call"
            example: '{"hotel_id": "hilton_sf", "check_in": "2025-10-25", "check_out": "2025-10-27", "guests": 2}'

          request_headers:
            type: "object (JSON)"
            required: false
            description: "Custom HTTP headers"
            example: '{"Authorization": "Bearer ${token}", "Content-Type": "application/json"}'

          request_body_template:
            type: "string"
            required: false
            description: "Request body template (if not request_parameters)"
            example: '{"booking": {"hotel_id": "${hotel_id}", "dates": {"check_in": "${check_in}"}}}'

          response_schema:
            type: "string (JSON Schema)"
            required: false
            description: "Expected response schema for validation"

      # ===== COMPENSATION ACTION =====
      compensation:
        type: "object"
        required: true
        description: "Compensation/rollback action"
        sub_fields:
          compensation_id:
            type: "string"
            required: true
            description: "Unique compensation identifier"
            example: "cancel_hotel_booking"

          compensation_type:
            type: "enum"
            required: true
            values:
              - "UNDO"          # Completely undo (DELETE what was CREATED)
              - "COMPENSATE"    # Counteracting action (CANCEL booking + REFUND payment)
              - "BEST_EFFORT"   # Partial rollback (log failure, alert operations)
            default: "COMPENSATE"

          compensation_service_url:
            type: "string (URL)"
            required: true
            description: "Compensation endpoint"
            example: "https://hotel-service.example.com/api/v1/bookings/${booking_id}/cancel"

          compensation_http_method:
            type: "enum"
            values: ["DELETE", "POST", "PUT", "PATCH"]
            default: "POST"

          compensation_parameters:
            type: "object (JSON)"
            required: true
            description: "Parameters for compensation (usually extracted from forward action result)"
            example: '{"booking_id": "${result.booking_id}", "reason": "saga_rollback"}'

          compensation_timeout_ms:
            type: "integer"
            required: true
            description: "Timeout for compensation"
            example: 3000
            validation:
              - "Range: 500-30000"
              - "Should be >= forward action timeout"

          idempotent:
            type: "boolean"
            required: true
            description: "Whether compensation is idempotent (safe to retry)"
            default: true

          retry_on_failure:
            type: "boolean"
            required: true
            description: "Retry compensation if it fails"
            default: true

          max_compensation_retries:
            type: "integer"
            default: 3
            description: "Max retries for compensation"

      # ===== DEPENDENCIES =====
      dependencies:
        type: "array of string"
        required: false
        description: "Step IDs that must complete before this step"
        example: ["step_validate_dates", "step_check_availability"]
        validation:
          - "All referenced step IDs must exist"
          - "No circular dependencies"

      # ===== TIMEOUT & RETRY =====
      timeout_ms:
        type: "integer"
        required: true
        description: "Forward action timeout"
        example: 5000
        validation:
          - "Range: 500-30000"

      retry_policy:
        type: "object"
        required: true
        description: "Retry configuration"
        sub_fields:
          max_retries:
            type: "integer"
            default: 3
            description: "Max retry attempts"

          backoff_strategy:
            type: "enum"
            values: ["exponential", "linear", "fixed"]
            default: "exponential"

          backoff_base_ms:
            type: "integer"
            default: 100
            description: "Base delay for backoff"

          retryable_errors:
            type: "array of string"
            description: "HTTP status codes or error codes to retry"
            example: ["408", "429", "500", "502", "503", "504"]

      # ===== CRITICALITY =====
      is_critical:
        type: "boolean"
        required: true
        description: "If true, failure triggers saga rollback"
        default: true

      skip_if_dependency_failed:
        type: "boolean"
        required: false
        description: "Skip this step if dependency failed (for non-critical steps)"
        default: false

      # ===== RESULT EXTRACTION =====
      result_extraction:
        type: "object"
        required: false
        description: "How to extract result data for next steps"
        sub_fields:
          extract_fields:
            type: "array of string"
            description: "JSON paths to extract from response"
            example: ["$.booking_id", "$.confirmation_code", "$.total_cost"]

          result_variable_name:
            type: "string"
            description: "Variable name to store result"
            example: "hotel_booking_result"

      # ===== OBSERVABILITY =====
      observability:
        type: "object"
        required: false
        sub_fields:
          emit_metric:
            type: "boolean"
            default: true

          metric_name:
            type: "string"
            example: "saga_step_book_hotel_latency_ms"

          log_request:
            type: "boolean"
            default: false
            description: "Log request body (disable for PII)"

          log_response:
            type: "boolean"
            default: false
            description: "Log response body"

  # ============================================================================
  # Saga Dependency Graph
  # ============================================================================
  dependency_graph:
    description: "Directed acyclic graph (DAG) of step dependencies"
    validation_rules:
      - name: "No circular dependencies"
        description: "Step cannot depend on itself (directly or transitively)"
        algorithm: "Topological sort"

      - name: "All dependencies exist"
        description: "Referenced step IDs must be defined"

      - name: "Dependencies execute before dependent"
        description: "Dependency step_order < dependent step_order"

    example: |
      step_validate_dates (order=0) → step_check_availability (order=1) → step_book_hotel (order=2)
                                                                        ↘ step_book_flight (order=3)
      step_book_hotel + step_book_flight → step_charge_payment (order=4)

  # ============================================================================
  # Compensation Strategy Patterns
  # ============================================================================
  compensation_strategies:
    UNDO:
      description: "Completely undo the forward action"
      example:
        forward: "CREATE booking (POST /bookings)"
        compensation: "DELETE booking (DELETE /bookings/{id})"
      use_case: "Resource creation that can be cleanly deleted"

    COMPENSATE:
      description: "Counteracting action (more complex than UNDO)"
      example:
        forward: "CHARGE payment (POST /payments)"
        compensation: "REFUND payment (POST /payments/{id}/refund)"
      use_case: "Operations with side effects (payment processing)"

    BEST_EFFORT:
      description: "Partial rollback with manual intervention"
      example:
        forward: "SEND email notification"
        compensation: "LOG failure (cannot unsend email)"
      use_case: "Irreversible operations (notifications, external integrations)"

  # ============================================================================
  # Validation Rules
  # ============================================================================
  validation_rules:
    rule_1_saga_id_valid:
      description: "Saga ID must be UUID v4"
      condition: "is_uuid_v4(saga_id)"
      on_violation: "reject_definition"

    rule_2_steps_not_empty:
      description: "Saga must have at least 1 step"
      condition: "len(steps) >= 1"
      on_violation: "reject_definition"

    rule_3_step_ids_unique:
      description: "Step IDs must be unique"
      condition: "len(step_ids) == len(set(step_ids))"
      on_violation: "reject_definition"

    rule_4_step_order_sequential:
      description: "Step order must be 0, 1, 2, ... (no gaps)"
      condition: "step_orders == [0, 1, 2, ..., n-1]"
      on_violation: "reject_definition"

    rule_5_dependencies_exist:
      description: "All dependency step IDs must exist"
      condition: "all(dep_id in step_ids for dep_id in dependencies)"
      on_violation: "reject_definition"

    rule_6_no_circular_dependencies:
      description: "No circular dependencies (DAG validation)"
      condition: "is_dag(dependency_graph)"
      algorithm: "Topological sort (Khan's algorithm)"
      on_violation: "reject_definition"

    rule_7_compensation_defined:
      description: "Critical steps must have compensation"
      condition: "if step.is_critical: step.compensation is not null"
      on_violation: "reject_definition"

    rule_8_idempotency_key_valid:
      description: "Idempotency key must be UUID v4"
      condition: "is_uuid_v4(idempotency_key)"
      on_violation: "reject_definition"

    rule_9_timeout_budget_reasonable:
      description: "max_saga_timeout >= sum of step timeouts"
      condition: "max_saga_timeout_ms >= sum(step.timeout_ms for step in steps)"
      on_violation: "warn_and_adjust"

    rule_10_compensation_timeout_sufficient:
      description: "Compensation timeout >= forward timeout"
      condition: "step.compensation.timeout_ms >= step.timeout_ms"
      on_violation: "warn_and_adjust"

  # ============================================================================
  # Examples
  # ============================================================================
  examples:
    example_1_hotel_flight_booking:
      saga_id: "123e4567-e89b-12d3-a456-426614174000"
      saga_name: "hotel_flight_booking_saga"
      saga_type: "BOOKING"
      description: "Book hotel and flight, charge payment, send confirmation"
      cognitive_trace_id: "trace-uuid"
      owner:
        user_id: "user_123"
        session_id: "session_456"
      priority: "HIGH"
      max_saga_timeout_ms: 60000
      idempotency_key: "idempotency-uuid"
      steps:
        - step_id: "step_book_hotel"
          step_name: "Book Hotel Reservation"
          step_order: 0
          step_type: "SERVICE_CALL"
          action:
            action_type: "BOOK"
            service_url: "https://hotel-service/api/bookings"
            http_method: "POST"
            request_parameters:
              hotel_id: "hilton_sf"
              check_in: "2025-10-25"
              check_out: "2025-10-27"
              guests: 2
          compensation:
            compensation_id: "cancel_hotel_booking"
            compensation_type: "COMPENSATE"
            compensation_service_url: "https://hotel-service/api/bookings/${result.booking_id}/cancel"
            compensation_http_method: "POST"
            compensation_parameters:
              booking_id: "${result.booking_id}"
              reason: "saga_rollback"
            compensation_timeout_ms: 3000
            idempotent: true
            retry_on_failure: true
          timeout_ms: 5000
          retry_policy:
            max_retries: 3
            backoff_strategy: "exponential"
            backoff_base_ms: 100
          is_critical: true
          result_extraction:
            extract_fields: ["$.booking_id", "$.total_cost"]
            result_variable_name: "hotel_booking"

        - step_id: "step_book_flight"
          step_name: "Book Flight"
          step_order: 1
          step_type: "SERVICE_CALL"
          action:
            action_type: "BOOK"
            service_url: "https://flight-service/api/reservations"
            http_method: "POST"
          compensation:
            compensation_id: "cancel_flight"
            compensation_type: "COMPENSATE"
            compensation_service_url: "https://flight-service/api/reservations/${result.reservation_id}/cancel"
          timeout_ms: 5000
          is_critical: true

        - step_id: "step_charge_payment"
          step_name: "Charge Payment"
          step_order: 2
          step_type: "SERVICE_CALL"
          dependencies: ["step_book_hotel", "step_book_flight"]
          action:
            action_type: "CHARGE"
            service_url: "https://payment-service/api/charges"
            http_method: "POST"
          compensation:
            compensation_id: "refund_payment"
            compensation_type: "COMPENSATE"
            compensation_service_url: "https://payment-service/api/charges/${result.charge_id}/refund"
          timeout_ms: 5000
          is_critical: true

      execution_config:
        execution_mode: "SEQUENTIAL"
        failure_strategy: "FAIL_FAST"
        compensation_order: "REVERSE"
        circuit_breaker_enabled: true
        checkpoint_frequency: "EVERY_STEP"

  # ============================================================================
  # Performance Budgets
  # ============================================================================
  performance_budgets:
    saga_definition_parsing: 50ms
    dependency_graph_validation: 100ms
    total_definition_validation: 150ms

  # ============================================================================
  # Storage & Persistence
  # ============================================================================
  storage:
    location: "K0 WAL (Write-Ahead Log)"
    persistence: "Durable (synchronous write before saga execution)"
    retention: "7 years (compliance)"
    format: "FlatBuffers or JSON (configurable)"
    indexing: "By saga_id, idempotency_key, user_id, session_id"
