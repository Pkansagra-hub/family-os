# Rollback Strategy Contract
# Purpose: Define rollback strategies (UNDO, COMPENSATE, BEST_EFFORT) and execution policies
# Research: Saga Pattern (Garcia-Molina 1987), compensating transactions strategies
# Source ADRs: ADR-0003b, ADR-0009
# Version: 1.0.0
# Last Updated: 2025-10-21

rollback_strategy_contract:
  name: "Rollback Strategy Configuration"
  description: "Defines available rollback strategies and when to apply each"
  adr_reference:
    - "ADR-0003b: 6 Core Protocol Implementations"
    - "ADR-0009: Circuit Breaker Pattern"
  version: "1.0.0"

  # ============================================================================
  # Rollback Strategy Types
  # ============================================================================
  rollback_strategies:
    UNDO:
      name: "UNDO Strategy"
      description: "Completely undo the forward action (reverse operation)"
      characteristics:
        - "Clean reversal of operation"
        - "Resource deleted or reverted to pre-action state"
        - "No side effects remain"
        - "Idempotent by nature"

      use_cases:
        - "Resource creation (CREATE → DELETE)"
        - "State transitions (ACTIVE → INACTIVE)"
        - "Data updates (UPDATE → REVERT to previous value)"

      examples:
        - forward: "CREATE hotel booking (POST /bookings)"
          compensation: "DELETE hotel booking (DELETE /bookings/{id})"
          result: "Booking removed from system"

        - forward: "UPDATE account balance (balance += 100)"
          compensation: "REVERT account balance (balance -= 100)"
          result: "Balance restored to original value"

        - forward: "INSERT row into database"
          compensation: "DELETE row from database"
          result: "Row removed"

      implementation_requirements:
        - "Compensation endpoint must support DELETE or equivalent"
        - "Resource ID from forward action must be available"
        - "Idempotency: Deleting non-existent resource = success"

      success_criteria:
        - "Resource no longer exists"
        - "Resource state reverted to pre-action state"
        - "No trace of forward action (except audit logs)"

      failure_handling:
        - "If resource not found → SUCCESS (goal achieved)"
        - "If resource locked/in-use → RETRY with backoff"
        - "If unauthorized → ESCALATE to manual intervention"

    COMPENSATE:
      name: "COMPENSATE Strategy"
      description: "Execute counteracting action (more complex than UNDO)"
      characteristics:
        - "May involve multiple sub-actions"
        - "May have side effects (refunds, notifications)"
        - "Resource may remain in system (marked as cancelled)"
        - "Requires explicit compensation logic"

      use_cases:
        - "Payment processing (CHARGE → REFUND)"
        - "Multi-resource operations (BOOK hotel+flight → CANCEL both + REFUND)"
        - "External integrations (NOTIFY → SEND cancellation notice)"

      examples:
        - forward: "CHARGE credit card ($199.99)"
          compensation: "REFUND credit card ($199.99)"
          result: "Payment reversed, refund processed, booking marked cancelled"

        - forward: "BOOK hotel + BOOK flight"
          compensation: "CANCEL hotel + CANCEL flight + REFUND payment + SEND cancellation email"
          result: "All bookings cancelled, payment refunded, user notified"

        - forward: "CREATE account + SEND welcome email"
          compensation: "DEACTIVATE account + SEND account deletion notice"
          result: "Account deactivated, user notified"

      implementation_requirements:
        - "Compensation endpoint must support counteracting action"
        - "May require multiple API calls (CANCEL + REFUND + NOTIFY)"
        - "Idempotency: Refunding already-refunded payment = success"
        - "Order matters: CANCEL first, then REFUND, then NOTIFY"

      success_criteria:
        - "All compensation sub-actions succeed"
        - "System in consistent state (e.g., booking cancelled AND payment refunded)"
        - "Side effects handled (notifications sent)"

      failure_handling:
        - "If partial failure → LOG partial state, ESCALATE to manual"
        - "If compensation endpoint unavailable → RETRY with circuit breaker"
        - "If refund fails → ESCALATE IMMEDIATELY (high-priority incident)"

    BEST_EFFORT:
      name: "BEST_EFFORT Strategy"
      description: "Partial rollback with manual intervention (for irreversible actions)"
      characteristics:
        - "Compensation may be impossible or impractical"
        - "Log failure, alert operations team"
        - "Manual cleanup required"
        - "Used for irreversible operations"

      use_cases:
        - "Notification sent (cannot unsend email)"
        - "Third-party API call with no rollback endpoint"
        - "Audit log entries (cannot delete)"
        - "Analytics events (already sent to data warehouse)"

      examples:
        - forward: "SEND confirmation email"
          compensation: "LOG inability to recall email, SEND cancellation email"
          result: "User receives both emails (confusing but unavoidable)"

        - forward: "LOG analytics event to data warehouse"
          compensation: "LOG compensating event (booking_cancelled)"
          result: "Both events in warehouse (analysts can filter)"

        - forward: "CALL third-party API (no rollback endpoint)"
          compensation: "LOG failure, CREATE manual remediation ticket"
          result: "Operations team manually fixes inconsistency"

      implementation_requirements:
        - "Robust logging to DLQ (Dead Letter Queue)"
        - "Alerting to operations team (PagerDuty, Slack)"
        - "Manual remediation workflow (ticketing system)"
        - "Idempotency: Logging same failure multiple times = OK"

      success_criteria:
        - "Failure logged to DLQ"
        - "Operations team alerted"
        - "Manual remediation ticket created"
        - "User notified of issue (if applicable)"

      failure_handling:
        - "If logging fails → ESCALATE IMMEDIATELY (critical)"
        - "If alerting fails → RETRY with different channel"
        - "If manual ticket creation fails → EMAIL operations team directly"

  # ============================================================================
  # Strategy Selection Decision Tree
  # ============================================================================
  strategy_selection:
    name: "How to Choose Rollback Strategy"
    description: "Decision tree for selecting appropriate rollback strategy"

    decision_flow: |
      Is the action reversible with a single API call?
        YES → UNDO strategy
        NO ↓

      Does the service provide a compensation endpoint?
        YES ↓
          Does compensation involve multiple steps (refund + cancel + notify)?
            YES → COMPENSATE strategy
            NO → UNDO strategy
        NO ↓

      Is the action irreversible (email sent, log written)?
        YES → BEST_EFFORT strategy
        NO → COMPENSATE strategy (try to find workaround)

    decision_factors:
      - factor: "API availability"
        question: "Does service provide DELETE or compensation endpoint?"
        UNDO: "DELETE endpoint available"
        COMPENSATE: "Compensation endpoint available"
        BEST_EFFORT: "No endpoint available"

      - factor: "Side effects"
        question: "Does action have external side effects?"
        UNDO: "No side effects (resource just deleted)"
        COMPENSATE: "Side effects must be reversed (refunds, notifications)"
        BEST_EFFORT: "Side effects irreversible"

      - factor: "Complexity"
        question: "How many steps to compensate?"
        UNDO: "1 step (DELETE resource)"
        COMPENSATE: "2-5 steps (CANCEL + REFUND + NOTIFY)"
        BEST_EFFORT: "N/A (manual remediation)"

      - factor: "Idempotency"
        question: "Is compensation idempotent?"
        UNDO: "Yes (deleting non-existent resource = success)"
        COMPENSATE: "Should be (refunding refunded payment = success)"
        BEST_EFFORT: "Yes (logging same failure multiple times = OK)"

  # ============================================================================
  # Rollback Execution Policies
  # ============================================================================
  execution_policies:
    rollback_order:
      name: "Compensation Execution Order"
      description: "Order in which compensations execute"
      policy: "REVERSE (LIFO - Last In, First Out)"
      rationale: "Undo steps in reverse order to unwind dependencies"
      example: |
        Forward: step_1 → step_2 → step_3 → step_4 [FAILS]
        Rollback: step_3 ← step_2 ← step_1 (reverse order)

      exceptions:
        - "If explicit compensation_order specified in saga definition"
        - "If parallel steps (no dependencies) can compensate in any order"

    parallel_compensation:
      name: "Parallel Compensation Execution"
      description: "Can compensations run in parallel?"
      policy: "SEQUENTIAL by default, PARALLEL if no dependencies"
      rationale: "Avoid race conditions (e.g., REFUND before CANCEL)"
      example: |
        step_book_hotel and step_book_flight (no dependencies)
          → Compensate in parallel (faster rollback)

        step_book_hotel → step_charge_payment (dependency)
          → Compensate sequentially (REFUND before CANCEL booking)

    compensation_timeout:
      name: "Compensation Timeout Budget"
      description: "Time allowed per compensation"
      policy: "compensation_timeout_ms >= forward_timeout_ms"
      rationale: "Compensation should have equal or more time than forward"
      default: "5000ms (total budget for all compensations)"
      per_step_default: "3000ms"
      escalation: "If timeout exceeded → BEST_EFFORT (log + alert)"

    retry_policy:
      name: "Compensation Retry Policy"
      description: "Retry failed compensations"
      policy: "Retry transient errors with exponential backoff"
      max_retries: 3
      backoff_base_ms: 100
      retryable_errors:
        - "TIMEOUT"
        - "RATE_LIMIT"
        - "SERVICE_ERROR (5xx)"
        - "NETWORK_ERROR"
      permanent_errors:
        - "UNAUTHORIZED (403)"
        - "NOT_FOUND (404) - treat as success"
        - "INVALID_STATE (400) - escalate to manual"

    circuit_breaker_integration:
      name: "Circuit Breaker for Compensations"
      description: "Use circuit breaker to prevent compensation retry storms (ADR-0009)"
      policy: "Enable circuit breaker for compensation endpoints"
      configuration:
        failure_threshold: 3
        timeout_s: 60
        half_open_probe: true
      behavior:
        OPEN: "Skip compensation, log to DLQ, escalate to manual"
        HALF_OPEN: "Try single compensation probe"
        CLOSED: "Normal compensation execution"

  # ============================================================================
  # Rollback Strategy Configuration Schema
  # ============================================================================
  rollback_config_schema:
    name: "Rollback Configuration Schema"
    description: "Per-step rollback configuration"

    fields:
      step_id:
        type: "string"
        required: true
        description: "Step identifier"

      rollback_strategy:
        type: "enum"
        required: true
        values: ["UNDO", "COMPENSATE", "BEST_EFFORT"]
        default: "COMPENSATE"

      compensation_endpoint:
        type: "string (URL)"
        required: true
        description: "Compensation service endpoint"
        example: "https://hotel-service/api/bookings/{id}/cancel"

      compensation_method:
        type: "enum"
        values: ["DELETE", "POST", "PUT", "PATCH"]
        default: "POST"

      compensation_timeout_ms:
        type: "integer"
        default: 3000
        validation:
          - "Range: 500-30000"
          - "Must be >= forward_timeout_ms"

      retry_policy:
        type: "object"
        sub_fields:
          max_retries: 3
          backoff_strategy: "exponential"
          backoff_base_ms: 100

      idempotent:
        type: "boolean"
        default: true
        description: "Can compensation be safely retried?"

      best_effort_actions:
        type: "array of string"
        required: false
        description: "Actions to take if BEST_EFFORT strategy"
        example: ["log_to_dlq", "alert_operations", "create_manual_ticket"]

      fallback_strategy:
        type: "enum"
        values: ["BEST_EFFORT", "ESCALATE", "SKIP"]
        default: "BEST_EFFORT"
        description: "What to do if primary compensation fails"

  # ============================================================================
  # Examples
  # ============================================================================
  examples:
    example_1_undo_hotel_booking:
      step_id: "step_book_hotel"
      rollback_strategy: "UNDO"
      compensation_endpoint: "https://hotel-service/api/bookings/{booking_id}"
      compensation_method: "DELETE"
      compensation_timeout_ms: 3000
      retry_policy:
        max_retries: 3
        backoff_strategy: "exponential"
      idempotent: true
      description: "Simple DELETE to remove booking"

    example_2_compensate_payment:
      step_id: "step_charge_payment"
      rollback_strategy: "COMPENSATE"
      compensation_endpoint: "https://payment-service/api/charges/{charge_id}/refund"
      compensation_method: "POST"
      compensation_timeout_ms: 5000
      retry_policy:
        max_retries: 3
        backoff_strategy: "exponential"
      idempotent: true
      best_effort_actions: ["log_to_dlq", "alert_finance_team", "create_manual_refund_ticket"]
      fallback_strategy: "ESCALATE"
      description: "POST to refund endpoint, escalate if refund fails"

    example_3_best_effort_email:
      step_id: "step_send_confirmation_email"
      rollback_strategy: "BEST_EFFORT"
      compensation_endpoint: "https://email-service/api/send"
      compensation_method: "POST"
      compensation_timeout_ms: 1000
      retry_policy:
        max_retries: 0
      idempotent: true
      best_effort_actions:
        - "log_to_dlq"
        - "send_cancellation_email"
        - "alert_customer_support"
      fallback_strategy: "BEST_EFFORT"
      description: "Cannot recall original email, send cancellation email instead"

  # ============================================================================
  # Performance Budgets
  # ============================================================================
  performance_budgets:
    compensation_latency_p95: 2000ms  # Per compensation
    total_compensation_budget: 5000ms  # All compensations
    rollback_initiation_latency: 100ms
    strategy_selection_latency: 50ms

  # ============================================================================
  # Metrics
  # ============================================================================
  metrics:
    - name: "rollback_strategy_selected_total"
      type: "counter"
      labels: ["strategy", "step_id"]
      description: "Which rollback strategy selected"

    - name: "rollback_undo_success_rate"
      type: "gauge"
      labels: ["step_id"]
      description: "Success rate of UNDO compensations"

    - name: "rollback_compensate_success_rate"
      type: "gauge"
      labels: ["step_id"]
      description: "Success rate of COMPENSATE compensations"

    - name: "rollback_best_effort_total"
      type: "counter"
      labels: ["step_id", "reason"]
      description: "BEST_EFFORT compensations (manual intervention required)"
