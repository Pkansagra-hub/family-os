saga_protocol_fsm:
  name: "Saga Rollback Protocol - FSM Definition"
  description: "5-state FSM for distributed transaction error recovery with compensating transactions"
  adr_reference:
    - "ADR-0003: MPST Protocol Validation"
    - "ADR-0003b: 6 Core Protocol Implementations"
    - "ADR-0008: Saga Pattern for Error Recovery"
  version: "1.0.0"

  # ============================================================================
  # FSM State Definitions
  # ============================================================================
  states:
    start:
      description: "Initial state before saga begins"
      entry_action: null
      exit_action: null

    executing:
      description: "Saga steps executing in sequence"
      entry_action: "initialize_saga_log, start_monitoring"
      exit_action: null
      timeout_ms: null  # Per-step timeout, not global
      sub_states:
        - step_1_pending
        - step_1_executing
        - step_1_completed
        - step_2_pending
        - step_2_executing
        - step_2_completed
        - step_n_executing

    compensating:
      description: "Error detected, executing compensating transactions in reverse"
      entry_action: "halt_forward_execution, activate_rollback_mode"
      exit_action: null
      timeout_ms: null  # Per-compensation timeout
      sub_states:
        - compensation_step_n_pending
        - compensation_step_n_executing
        - compensation_step_n_completed
        - compensation_step_2_pending
        - compensation_step_2_executing
        - compensation_step_2_completed
        - compensation_step_1_pending
        - compensation_step_1_executing
        - compensation_step_1_completed

    rolled_back:
      description: "Saga rollback complete, system restored to pre-saga state"
      entry_action: "finalize_rollback, emit_saga_failure_metric"
      exit_action: null

    failed:
      description: "Saga or compensation failed, manual intervention required"
      entry_action: "log_failure, alert_operators, escalate_to_manual_review"
      exit_action: null

  # ============================================================================
  # State Transitions with Guards and Latency Budgets
  # ============================================================================
  transitions:
    - transition_id: "T1_start_to_executing"
      from_state: "start"
      to_state: "executing"
      trigger: "SagaDefinition received"
      guard_conditions:
        - "saga_definition_valid"
        - "all_saga_steps_defined"
        - "compensation_for_each_step_defined"
      latency_budget_ms: 50
      description: "Saga begins execution sequence"

    - transition_id: "T2_executing_to_executing"
      from_state: "executing"
      to_state: "executing"
      trigger: "Step completed successfully"
      guard_conditions:
        - "step_exit_code == 0"
        - "step_result_valid"
        - "next_step_exists"
      latency_budget_ms: 100
      description: "Move to next saga step (loop in EXECUTING state)"

    - transition_id: "T3_executing_terminal"
      from_state: "executing"
      to_state: "start"  # End of saga (success)
      trigger: "All saga steps completed successfully"
      guard_conditions:
        - "step_count == total_steps"
        - "all_steps_successful"
      latency_budget_ms: 50
      description: "Saga completed successfully (terminal state: success)"

    - transition_id: "T4_executing_to_compensating"
      from_state: "executing"
      to_state: "compensating"
      trigger: "Step failed or timeout"
      guard_conditions:
        - "step_exit_code != 0 OR step_timeout OR dependency_failed"
      latency_budget_ms: 100
      description: "Error detected, switch to rollback mode"

    - transition_id: "T5_compensating_to_compensating"
      from_state: "compensating"
      to_state: "compensating"
      trigger: "Compensation step completed"
      guard_conditions:
        - "compensation_exit_code == 0"
        - "compensation_result_valid"
        - "previous_step_has_compensation"
      latency_budget_ms: 100
      description: "Execute next compensation step (in reverse order, loop in COMPENSATING)"

    - transition_id: "T6_compensating_to_rolled_back"
      from_state: "compensating"
      to_state: "rolled_back"
      trigger: "All compensating steps completed successfully"
      guard_conditions:
        - "compensation_count == total_steps"
        - "all_compensations_successful"
      latency_budget_ms: 50
      description: "Rollback complete, system restored to pre-saga state"

    - transition_id: "T7_compensating_to_failed"
      from_state: "compensating"
      to_state: "failed"
      trigger: "Compensation step failed"
      guard_conditions:
        - "compensation_exit_code != 0 OR compensation_timeout"
      latency_budget_ms: 50
      error_code: "SAGA_COMPENSATION_FAILED"
      description: "Compensation failed, manual intervention required"

    - transition_id: "T8_executing_to_failed"
      from_state: "executing"
      to_state: "failed"
      trigger: "Saga step timeout after compensation already attempted"
      guard_conditions:
        - "retry_count >= max_retries"
      latency_budget_ms: 50
      error_code: "SAGA_EXECUTION_FAILED"
      description: "Step failed after retries, rollback also exhausted"

  # ============================================================================
  # Saga Definition Structure
  # ============================================================================
  saga_definition:
    saga_id:
      type: "string (UUID v4)"
      description: "Unique saga identifier"

    saga_name:
      type: "string"
      description: "Human-readable saga name"
      example: "hotel_flight_booking_saga"

    cognitive_trace_id:
      type: "string (UUID v4)"
      description: "Distributed trace ID"

    steps:
      type: "array of SagaStep"
      description: "Ordered list of saga steps"
      min_steps: 1
      max_steps: 100

      step_schema:
        step_id:
          type: "string"
          description: "Unique step identifier"
          example: "step_book_hotel"

        step_name:
          type: "string"
          description: "Human-readable step name"
          example: "Book Hotel Reservation"

        step_type:
          type: "enum"
          description: "Type of step"
          values: ["SERVICE_CALL", "TASK_EXECUTION", "VALIDATION", "NOTIFICATION"]

        service_url:
          type: "string (URL)"
          description: "Service endpoint to call"
          example: "https://hotel-service/api/book"

        timeout_ms:
          type: "integer"
          description: "Step-specific timeout"
          example: 5000
          default: 3000

        parameters:
          type: "object (JSON)"
          description: "Parameters to pass to service"

        retry_policy:
          type: "object"
          description: "Retry configuration for this step"
          sub_fields:
            max_retries: "integer (default 3)"
            backoff_strategy: "enum (exponential, linear)"
            backoff_base_ms: "integer (default 100)"

        compensation:
          type: "object"
          description: "Compensation/rollback action"
          sub_fields:
            compensation_id:
              type: "string"
              example: "cancel_hotel_booking"

            compensation_service_url:
              type: "string (URL)"
              example: "https://hotel-service/api/cancel"

            compensation_parameters:
              type: "object (JSON)"
              description: "Parameters for compensation (usually booking_id from forward step)"

            timeout_ms:
              type: "integer"
              default: 3000

            idempotency_key:
              type: "string"
              description: "Idempotency key for safe retry of compensation"

        dependencies:
          type: "array of string"
          description: "IDs of steps that must complete before this step"
          example: ["step_validate_dates"]

        skip_if_failed:
          type: "boolean"
          description: "Skip this step if dependency failed (optional step)"
          default: false

        retry_on_compensation_failure:
          type: "boolean"
          description: "If compensation fails, retry before escalating"
          default: true

  # ============================================================================
  # Forward Execution Strategy
  # ============================================================================
  forward_execution:
    execution_order: "Sequential by step_id order (no parallelism in base saga)"
    step_execution_flow:
      - "Execute step"
      - "Check result"
      - "Validate output matches expectations"
      - "Move to next step OR trigger compensation on failure"

    success_criteria:
      - "Step returns HTTP 200-299"
      - "Step returns structured result matching schema"
      - "Step completes within timeout_ms"
      - "No timeout or network error"

    failure_criteria:
      - "Step returns HTTP 400-599"
      - "Step doesn't respond within timeout_ms"
      - "Network error (connection refused, timeout)"
      - "Structured result indicates failure (success_flag=false)"

    retry_strategy:
      transient_errors:
        - "HTTP 408 (Request Timeout)"
        - "HTTP 429 (Rate Limited)"
        - "HTTP 500-599 (Server Error)"
        - "Network timeout, DNS resolution failure"
      permanent_errors:
        - "HTTP 400-404 (Client Error, unless retryable)"
        - "HTTP 403 (Forbidden)"
        - "Invalid request parameters"
      retry_logic: "Exponential backoff with jitter, max_retries per step, global saga timeout"

  # ============================================================================
  # Backward Recovery Strategy (Compensation)
  # ============================================================================
  backward_recovery:
    trigger_condition: "Any step fails (after retries exhausted)"
    compensation_order: "Reverse order of executed steps (LIFO - Last In, First Out)"
    compensation_flow:
      - "Halt forward execution immediately"
      - "Start compensation from last successfully completed step"
      - "Execute compensation for each completed step in reverse"
      - "Continue until all completed steps compensated OR compensation fails"

    compensation_idempotency:
      requirement: "ALL compensations must be idempotent (safe to call multiple times)"
      enforcement: "Each compensation request includes idempotency_key (UUID)"
      implication: "Compensation can be safely retried without side effects"
      example: "Cancel booking with idempotency key → If already cancelled, return success"

    compensation_success_criteria:
      - "Compensation returns HTTP 200-299"
      - "Compensation result indicates success"
      - "System state reverted to pre-saga for this step"

    compensation_failure_handling:
      - "Retry compensation with exponential backoff (if retry_on_compensation_failure=true)"
      - "After max retries, escalate to manual intervention"
      - "Log failure to K0 WAL with full state for operator review"

  # ============================================================================
  # Priority Levels & Timeout Budgets
  # ============================================================================
  priority_levels:
    CRITICAL:
      description: "Critical multi-step transaction (payment, booking)"
      step_timeout_default_ms: 10000
      compensation_timeout_default_ms: 5000
      max_saga_timeout_ms: 120000
      retry_strategy: "Retry on transient errors up to 5 times"

    HIGH:
      description: "Important saga (reservation, subscription)"
      step_timeout_default_ms: 5000
      compensation_timeout_default_ms: 3000
      max_saga_timeout_ms: 60000
      retry_strategy: "Retry on transient errors up to 3 times"

    NORMAL:
      description: "Standard saga (workflow coordination)"
      step_timeout_default_ms: 3000
      compensation_timeout_default_ms: 2000
      max_saga_timeout_ms: 30000
      retry_strategy: "Retry on transient errors up to 2 times"

  # ============================================================================
  # Violation Handling
  # ============================================================================
  violation_handling:
    step_timeout:
      description: "Step execution exceeded timeout"
      action: "trigger_compensation, log_timeout"
      severity: "MEDIUM"

    compensation_timeout:
      description: "Compensation step exceeded timeout"
      action: "retry_compensation_or_escalate_to_manual"
      severity: "HIGH"

    all_retries_exhausted:
      description: "Step failed after max retries"
      action: "trigger_compensation"
      severity: "MEDIUM"

    compensation_failed:
      description: "Compensation failed (system in inconsistent state)"
      action: "log_failure, alert_operators, create_manual_remediation_ticket"
      severity: "CRITICAL"

    dependency_failed:
      description: "Step dependency failed, skipping this step"
      action: "mark_step_skipped, continue_saga"
      severity: "LOW"

    saga_deadline_exceeded:
      description: "Entire saga exceeded max_saga_timeout_ms"
      action: "abort_saga, trigger_compensation_from_current_state"
      severity: "HIGH"

    idempotency_key_collision:
      description: "Duplicate idempotency key (saga retry)"
      action: "return_cached_result, skip_duplicate_execution"
      severity: "LOW"

    service_unreachable:
      description: "Service endpoint unreachable"
      action: "retry_with_backoff, or_trigger_compensation"
      severity: "MEDIUM"

  # ============================================================================
  # Observability Hooks
  # ============================================================================
  observability_hooks:
    saga_started:
      metrics: ["saga_started_total"]
      spans: ["saga_execution_started"]
      log_fields: ["saga_id", "saga_name", "step_count"]

    step_started:
      metrics: ["saga_step_started_total"]
      spans: ["saga_step_execution_started"]
      log_fields: ["saga_id", "step_id", "step_name", "timeout_ms"]

    step_completed:
      metrics: ["saga_step_completed_total", "saga_step_latency_ms"]
      spans: ["saga_step_execution_completed"]
      log_fields: ["saga_id", "step_id", "success", "latency_ms"]

    compensation_started:
      metrics: ["saga_compensation_started_total"]
      spans: ["saga_compensation_started"]
      log_fields: ["saga_id", "failed_step_id", "num_steps_to_compensate"]

    compensation_completed:
      metrics: ["saga_compensation_completed_total", "saga_rollback_latency_ms"]
      spans: ["saga_compensation_completed"]
      log_fields: ["saga_id", "success", "latency_ms"]

    saga_failed:
      metrics: ["saga_failed_total"]
      spans: ["saga_execution_failed"]
      log_fields: ["saga_id", "failed_step_id", "error_code", "compensation_status"]

  # ============================================================================
  # Composition Rules
  # ============================================================================
  composition_rules:
    - protocol_name: "Task Execution"
      description: "Saga used for multi-step tasks requiring rollback"
      nesting: "Saga contains multiple task execution steps"
      rollback_trigger: "If any task step fails"

    - protocol_name: "Orchestration"
      description: "Orchestrator may use saga for complex workflows"
      nesting: "Saga orchestrates multiple agents"
      rollback_trigger: "If orchestration fails at any stage"

  # ============================================================================
  # Performance Budgets
  # ============================================================================
  performance_budgets:
    step_latency:
      - step_name: "Service call"
        target_ms: 2000
        p95_ms: 5000

      - step_name: "Validation"
        target_ms: 500
        p95_ms: 1000

    compensation_latency:
      - step_name: "Service compensation"
        target_ms: 1000
        p95_ms: 3000

    total_saga_latency:
      - steps: "3-step saga"
        target_ms: 10000
        p95_ms: 20000
        description: "Average booking + payment + confirmation"

  # ============================================================================
  # Saga State Logging (for Durability)
  # ============================================================================
  saga_logging:
    saga_log_location: "K0 WAL (write-ahead log)"
    saga_log_events:
      - event: "SAGA_STARTED"
        fields: ["saga_id", "saga_definition", "timestamp"]

      - event: "STEP_STARTED"
        fields: ["saga_id", "step_id", "timestamp", "attempt"]

      - event: "STEP_COMPLETED"
        fields: ["saga_id", "step_id", "result", "timestamp"]

      - event: "STEP_FAILED"
        fields: ["saga_id", "step_id", "error_code", "timestamp"]

      - event: "COMPENSATION_STARTED"
        fields: ["saga_id", "failed_step_id", "timestamp"]

      - event: "COMPENSATION_COMPLETED"
        fields: ["saga_id", "compensation_step_id", "result", "timestamp"]

      - event: "SAGA_ROLLBACK_COMPLETE"
        fields: ["saga_id", "timestamp", "all_compensations_successful"]

      - event: "SAGA_FAILED"
        fields: ["saga_id", "reason", "compensation_status", "timestamp"]

    durability_guarantee: "All events written to K0 before returning to caller (synchronous write)"
    recovery: "On system restart, replay saga log to reconstruct state and resume from checkpoint"

---
# ============================================================================
# Saga State Machine Visualization
# ============================================================================

# START
#   |
#   | SagaDefinition received
#   v
# EXECUTING (execute steps in order)
#   |
#   +--[All steps successful]--> SUCCESS (terminal)
#   |
#   +--[Step failed, retry exhausted]--> COMPENSATING
#                                             |
#                                             +--[All compensations successful]--> ROLLED_BACK (terminal)
#                                             |
#                                             +--[Compensation failed]--> FAILED (terminal, manual intervention)
#
# Each saga step transitions within EXECUTING state until success or failure
# Compensation steps transition within COMPENSATING state (reverse order)
