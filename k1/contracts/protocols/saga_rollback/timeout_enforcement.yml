# Timeout Enforcement Contract for Saga Compensations
# Purpose: Define timeout policies, budgets, and enforcement mechanisms
# Research: Distributed systems timeouts, saga pattern performance budgets
# Source ADRs: ADR-0003b, ADR-0009
# Version: 1.0.0
# Last Updated: 2025-10-21

timeout_enforcement_contract:
  name: "Saga Compensation Timeout Enforcement"
  description: "Timeout policies, budgets, and enforcement for saga compensations"
  adr_reference:
    - "ADR-0003b: 6 Core Protocol Implementations (5000ms compensation timeout)"
    - "ADR-0009: Circuit Breaker Pattern (prevents retry storms)"
  version: "1.0.0"

  # ============================================================================
  # Timeout Fundamentals
  # ============================================================================
  timeout_fundamentals:
    name: "Why Timeouts Matter for Sagas"

    reason_1_prevent_infinite_wait:
      description: "Without timeout, saga may wait forever for failed compensation"
      scenario: |
        Compensation request sent → Service hangs → No timeout
        Result: Saga stuck in COMPENSATING state forever
        Impact: Resources locked, user waiting indefinitely
      solution: "Enforce compensation_timeout_ms (default 5000ms)"

    reason_2_fail_fast:
      description: "Quick timeout allows fallback to manual intervention"
      scenario: |
        Compensation times out after 5s → Escalate to operations team
        vs
        Compensation waits 60s → User already abandoned, slower resolution
      solution: "Aggressive timeouts (5s) + manual intervention"

    reason_3_resource_conservation:
      description: "Long timeouts block threads/connections"
      scenario: |
        100 compensations in parallel, each waits 30s
        Result: 100 threads blocked for 30s = resource exhaustion
      solution: "5s timeout = faster thread release"

  # ============================================================================
  # Timeout Hierarchy
  # ============================================================================
  timeout_hierarchy:
    name: "Timeout Hierarchy in Sagas"
    description: "Multiple timeout levels from finest to coarsest granularity"

    level_1_compensation_timeout:
      name: "Per-Compensation Timeout (Finest)"
      description: "Timeout for single compensation request"
      default: 5000ms
      configured_in: "saga_definition.steps[].compensation.timeout_ms"
      enforcement_point: "Orchestrator (client-side timeout)"
      behavior_on_timeout: "Cancel request, mark compensation as FAILED, log to DLQ"
      example: |
        step_book_hotel.compensation.timeout_ms = 3000
        → If hotel cancellation takes >3s, timeout and fail compensation

    level_2_state_timeout:
      name: "Per-State Timeout (Mid-level)"
      description: "Timeout for entire COMPENSATING state (all compensations)"
      default: 5000ms
      configured_in: "saga_protocol_fsm.states.compensating.timeout_ms"
      enforcement_point: "Protocol Monitor (FSM timeout)"
      behavior_on_timeout: "Transition to FAILED state, log to DLQ, alert operations"
      example: |
        compensating.timeout_ms = 5000
        → All compensations must complete within 5s total
        → If 3 compensations take 2s each (6s total), timeout triggers

    level_3_saga_deadline:
      name: "Total Saga Timeout (Coarsest)"
      description: "Maximum time for entire saga (forward + compensation)"
      default: 60000ms
      configured_in: "saga_definition.max_saga_timeout_ms"
      enforcement_point: "Orchestrator (saga-level timeout)"
      behavior_on_timeout: "Abort saga, trigger compensation from current state, CRITICAL alert"
      example: |
        max_saga_timeout_ms = 60000
        → Saga must complete (success or rollback) within 60s
        → If forward execution takes 50s + compensation 15s (65s total), saga timeout triggers

  # ============================================================================
  # Timeout Budget Calculation
  # ============================================================================
  timeout_budget:
    name: "How to Calculate Timeout Budgets"
    description: "Ensure timeouts are consistent (no deadlocks, no premature timeouts)"

    rule_1_compensation_timeout_ge_forward:
      description: "Compensation timeout >= forward timeout"
      formula: "compensation_timeout_ms >= step_timeout_ms"
      rationale: "Compensation may be as complex as forward action"
      example: |
        step_book_hotel.timeout_ms = 5000
        step_book_hotel.compensation.timeout_ms = 5000  ✓ (equal OK)
        step_book_hotel.compensation.timeout_ms = 3000  ✗ (violates rule)

    rule_2_state_timeout_ge_sum_compensation:
      description: "COMPENSATING state timeout >= sum of all compensation timeouts"
      formula: "compensating.timeout_ms >= SUM(step.compensation.timeout_ms)"
      rationale: "Sequential compensations require cumulative time"
      example: |
        3 steps: 3000ms + 2000ms + 1000ms = 6000ms total
        compensating.timeout_ms = 5000ms  ✗ (too short, premature timeout)
        compensating.timeout_ms = 8000ms  ✓ (sufficient buffer)

    rule_3_saga_timeout_ge_forward_plus_compensation:
      description: "Total saga timeout >= forward time + compensation time"
      formula: "max_saga_timeout_ms >= SUM(step.timeout_ms) + compensating.timeout_ms"
      rationale: "Saga may execute all steps + full rollback"
      example: |
        Forward: 3 steps × 5000ms = 15000ms
        Compensation: 5000ms
        Total: 20000ms minimum
        max_saga_timeout_ms = 15000ms  ✗ (too short)
        max_saga_timeout_ms = 30000ms  ✓ (includes buffer)

    rule_4_add_buffer:
      description: "Add 20-50% buffer for network latency, processing overhead"
      formula: "actual_timeout_ms = calculated_timeout_ms × 1.2"
      rationale: "Prevent premature timeouts due to minor delays"
      example: |
        Calculated compensation timeout: 5000ms
        With 20% buffer: 5000 × 1.2 = 6000ms
        Use 6000ms in configuration

  # ============================================================================
  # Timeout Enforcement Mechanisms
  # ============================================================================
  timeout_enforcement:
    enforcement_1_client_side:
      name: "Client-Side Timeout (Orchestrator)"
      description: "Orchestrator enforces timeout when sending compensation request"
      implementation: |
        async def send_compensation_request(compensation_request):
            timeout_ms = compensation_request.timeout_ms

            try:
                # Send with timeout
                response = await http_client.post(
                    url=compensation_request.service_url,
                    json=compensation_request.parameters,
                    timeout=timeout_ms / 1000  # Convert to seconds
                )
                return response

            except asyncio.TimeoutError:
                # Timeout: compensation may or may not have executed
                log.error("Compensation timeout",
                    compensation_id=compensation_request.compensation_id,
                    timeout_ms=timeout_ms,
                    elapsed_ms=elapsed_time()
                )

                # Mark as FAILED, retry with same idempotency_key
                return CompensationResponse(
                    success=False,
                    compensation_status="FAILED",
                    error_code="TIMEOUT"
                )

      advantages:
        - "Fast failure (no waiting for server)"
        - "Prevents thread blocking"

      disadvantages:
        - "Compensation may have succeeded (response lost)"
        - "Requires retry with same idempotency_key"

    enforcement_2_server_side:
      name: "Server-Side Timeout (Service)"
      description: "Service enforces timeout when processing compensation"
      implementation: |
        async def process_compensation(compensation_request):
            timeout_ms = compensation_request.timeout_ms
            deadline = time.now() + timeout_ms

            # Check idempotency
            cached = cache.get(compensation_request.idempotency_key)
            if cached:
                return cached

            # Process with deadline
            try:
                result = await asyncio.wait_for(
                    execute_compensation(compensation_request),
                    timeout=timeout_ms / 1000
                )

                # Cache result
                cache.set(compensation_request.idempotency_key, result)
                return result

            except asyncio.TimeoutError:
                # Service-side timeout
                log.error("Compensation processing timeout",
                    compensation_id=compensation_request.compensation_id
                )
                raise ServiceTimeoutError("Compensation timed out internally")

      advantages:
        - "Service prevents long-running operations"
        - "Consistent timeout enforcement"

      disadvantages:
        - "Requires server changes"
        - "May not work with third-party services"

    enforcement_3_protocol_monitor:
      name: "Protocol Monitor FSM Timeout"
      description: "Protocol Monitor enforces COMPENSATING state timeout"
      implementation: |
        class ProtocolMonitor:
            async def monitor_saga(self, saga_id):
                # Enter COMPENSATING state
                state_entry_time = time.now()
                state_timeout_ms = self.protocol.states.compensating.timeout_ms

                while saga.state == "COMPENSATING":
                    elapsed_ms = time.now() - state_entry_time

                    if elapsed_ms >= state_timeout_ms:
                        # State timeout: transition to FAILED
                        log.error("COMPENSATING state timeout",
                            saga_id=saga_id,
                            timeout_ms=state_timeout_ms,
                            elapsed_ms=elapsed_ms
                        )

                        saga.state = "FAILED"
                        saga.failure_reason = "COMPENSATING_STATE_TIMEOUT"

                        # Alert operations
                        alert_operations(
                            severity="HIGH",
                            message=f"Saga {saga_id} compensation timed out"
                        )

                        break

                    await asyncio.sleep(0.1)

      advantages:
        - "Enforces total compensation time"
        - "Prevents saga from hanging in COMPENSATING state forever"

      disadvantages:
        - "Coarse-grained (state level, not per-compensation)"

  # ============================================================================
  # Timeout Configuration Schema
  # ============================================================================
  timeout_config_schema:
    name: "Timeout Configuration Schema"
    description: "How to configure timeouts at various levels"

    saga_level_timeouts:
      max_saga_timeout_ms:
        type: "integer"
        default: 60000
        validation:
          - "Range: 10000-300000 (10s-5min)"
          - "Must be >= sum of all step timeouts + compensation timeout"
        example: 60000

    step_level_timeouts:
      step_timeout_ms:
        type: "integer"
        default: 5000
        validation:
          - "Range: 500-30000 (0.5s-30s)"
        example: 5000

      compensation_timeout_ms:
        type: "integer"
        default: 5000
        validation:
          - "Range: 500-30000"
          - "Must be >= step_timeout_ms"
        example: 5000

    state_level_timeouts:
      compensating_state_timeout_ms:
        type: "integer"
        default: 5000
        validation:
          - "Range: 1000-60000 (1s-60s)"
          - "Must be >= sum of all compensation timeouts"
        example: 5000

      rolling_back_state_timeout_ms:
        type: "integer"
        default: 2000
        validation:
          - "Range: 500-10000"
        example: 2000

  # ============================================================================
  # Timeout Behavior on Failure
  # ============================================================================
  timeout_behavior:
    scenario_1_compensation_timeout:
      description: "Single compensation times out"
      timeout_level: "Per-compensation (5000ms)"
      behavior:
        - "Mark compensation as FAILED"
        - "Log timeout to DLQ"
        - "Retry with exponential backoff (if retry_policy allows)"
        - "If max retries exhausted, escalate to manual intervention"
      saga_state: "Remains in COMPENSATING (try other compensations)"
      user_impact: "Partial rollback, manual remediation required"

    scenario_2_compensating_state_timeout:
      description: "All compensations exceed total budget (5000ms)"
      timeout_level: "State-level (compensating.timeout_ms)"
      behavior:
        - "Transition saga to FAILED state"
        - "Log entire saga to DLQ"
        - "Alert operations team (HIGH severity)"
        - "Create manual remediation ticket"
      saga_state: "COMPENSATING → FAILED"
      user_impact: "Saga failed, manual cleanup required"

    scenario_3_saga_deadline_exceeded:
      description: "Entire saga exceeds max_saga_timeout_ms"
      timeout_level: "Saga-level (60000ms)"
      behavior:
        - "ABORT saga immediately"
        - "Trigger compensation from current state"
        - "Log to DLQ as CRITICAL"
        - "Alert operations team (CRITICAL severity)"
        - "Escalate to engineering team"
      saga_state: "Any → FAILED"
      user_impact: "Saga failed catastrophically, high-priority incident"

  # ============================================================================
  # Timeout Retry Strategy
  # ============================================================================
  timeout_retry_strategy:
    name: "Retry Strategy for Timeout Errors"
    description: "How to retry compensations that timed out"

    retry_policy:
      timeout_is_transient:
        value: true
        rationale: "Timeout may be due to network congestion, server load (transient)"

      max_retries:
        value: 3
        rationale: "Balance between recovery and fast-fail"

      backoff_strategy:
        value: "exponential"
        formula: "backoff_ms = backoff_base_ms × (2 ^ retry_count)"
        example: |
          Retry 1: 100ms
          Retry 2: 200ms
          Retry 3: 400ms

      same_idempotency_key:
        value: true
        rationale: "Compensation may have succeeded (response lost)"
        critical: "MUST use same idempotency_key for retries"

      circuit_breaker_integration:
        value: true
        behavior: |
          If 3 timeouts in 10s → Circuit OPEN
          Stop retrying, escalate to manual intervention
          After 60s → Circuit HALF_OPEN (try 1 probe)

  # ============================================================================
  # Timeout Monitoring & Alerting
  # ============================================================================
  timeout_monitoring:
    metrics:
      - name: "compensation_timeout_total"
        type: "counter"
        labels: ["saga_type", "step_id"]
        description: "Total compensation timeouts"

      - name: "compensation_timeout_latency_ms"
        type: "histogram"
        labels: ["step_id"]
        buckets: [1000, 2000, 3000, 5000, 10000, 30000]
        description: "Distribution of compensation latencies (including timeouts)"

      - name: "compensating_state_timeout_total"
        type: "counter"
        labels: ["saga_type"]
        description: "Total COMPENSATING state timeouts"

      - name: "saga_deadline_exceeded_total"
        type: "counter"
        labels: ["saga_type"]
        description: "Total sagas exceeding max_saga_timeout_ms (CRITICAL)"

    alerting_rules:
      rule_1_compensation_timeout:
        trigger: "compensation_timeout_total > 10 in 5 minutes"
        severity: "HIGH"
        channels: ["pagerduty", "slack"]
        message: "High compensation timeout rate: {saga_type}/{step_id}"

      rule_2_state_timeout:
        trigger: "compensating_state_timeout_total > 0"
        severity: "HIGH"
        channels: ["pagerduty", "slack"]
        message: "COMPENSATING state timed out: {saga_id}"

      rule_3_saga_deadline:
        trigger: "saga_deadline_exceeded_total > 0"
        severity: "CRITICAL"
        channels: ["pagerduty", "slack", "email"]
        escalation: "Escalate to engineering immediately"
        message: "Saga deadline exceeded (CRITICAL): {saga_id}"

  # ============================================================================
  # Performance Budgets (ADR-0003b)
  # ============================================================================
  performance_budgets:
    per_compensation_p95: 2000ms
    total_compensation_budget: 5000ms
    compensating_state_p95: 5000ms
    rolling_back_state_p95: 2000ms
    max_saga_p95: 60000ms

    budget_validation:
      description: "Validate timeout budgets at saga creation"
      checks:
        - "compensation_timeout_ms >= step_timeout_ms"
        - "compensating.timeout_ms >= SUM(compensation_timeout_ms)"
        - "max_saga_timeout_ms >= forward_time + compensating.timeout_ms"
      on_violation: "Reject saga definition with validation error"

  # ============================================================================
  # Examples
  # ============================================================================
  examples:
    example_1_timeout_configuration:
      saga_definition:
        max_saga_timeout_ms: 60000
        steps:
          - step_id: "step_book_hotel"
            timeout_ms: 5000
            compensation:
              timeout_ms: 5000
          - step_id: "step_book_flight"
            timeout_ms: 5000
            compensation:
              timeout_ms: 5000
          - step_id: "step_charge_payment"
            timeout_ms: 5000
            compensation:
              timeout_ms: 5000
      protocol_fsm:
        states:
          compensating:
            timeout_ms: 15000  # 3 compensations × 5s = 15s
          rolling_back:
            timeout_ms: 2000
      validation: "✓ All constraints satisfied"

    example_2_timeout_violation:
      saga_definition:
        max_saga_timeout_ms: 30000
        steps:
          - step_id: "step_book_hotel"
            timeout_ms: 5000
            compensation:
              timeout_ms: 3000  # ✗ Violates rule: must be >= 5000
      validation: "✗ Rejected: compensation_timeout_ms < step_timeout_ms"
