privacy_aware_responses:
  name: "Privacy-Aware Response Adaptation"
  purpose: "Adapt agent responses based on occupancy and privacy context"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2"
  module: "k1/l2_orchestration/privacy/privacy_adapter.py"
  capability: "#3 Ambient Context Awareness"

  description: |
    Privacy-aware response adaptation modifies agent behaviors based on room
    occupancy and context mode to protect user privacy in multi-person settings.

    Core principles:
    - Single person → Full personalization (RED_BAND allowed)
    - Small group → Limited personalization, speaker diarization
    - Large group → No personalization, public responses only
    - Crowd → Broadcast mode, minimal interaction

    This ensures agents do not reveal personal information in group settings
    while maintaining useful functionality.

  schema:
    type: "object"
    required: ["privacy_mode", "allowed_bands", "restrictions", "timestamp_ms"]
    properties:
      privacy_mode:
        type: "string"
        enum: ["PRIVATE", "SEMI_PRIVATE", "SEMI_PUBLIC", "PUBLIC"]
        description: "Privacy level based on occupancy"

      allowed_bands:
        type: "array"
        items:
          type: "string"
          enum: ["GREEN", "AMBER", "RED"]
        description: "Privacy bands allowed in current context"
        examples: [["GREEN", "AMBER", "RED"], ["GREEN", "AMBER"], ["GREEN"]]

      restrictions:
        type: "object"
        description: "Active privacy restrictions"
        properties:
          personalization_enabled:
            type: "boolean"
            description: "Can use user history/preferences"

          user_identification:
            type: "boolean"
            description: "Can identify users by voice"

          historical_context:
            type: "boolean"
            description: "Can reference past interactions"

          preference_adaptation:
            type: "boolean"
            description: "Can adapt to user preferences"

          proactive_suggestions:
            type: "boolean"
            description: "Can offer proactive suggestions"

      context_basis:
        type: "object"
        description: "Occupancy context that determined privacy mode"
        properties:
          context_mode:
            type: "string"
            enum: ["STANDBY", "WHISPER", "NORMAL", "LOUD", "ANNOUNCEMENT"]

          person_count:
            type: "integer"
            minimum: 0
            maximum: 10

          confidence:
            type: "number"
            minimum: 0.0
            maximum: 1.0

      timestamp_ms:
        type: "integer"
        format: "int64"
        description: "Unix timestamp when privacy mode was determined"

  privacy_modes:
    PRIVATE:
      description: "Single person, intimate setting"
      trigger: "context_mode == WHISPER"
      occupancy: "person_count == 1"
      allowed_bands: ["GREEN", "AMBER", "RED"]

      enabled_features:
        personalization: true
        user_identification: true
        historical_context: true
        preference_adaptation: true
        proactive_suggestions: true
        voice_profile: true
        calendar_access: true
        contact_access: true

      response_characteristics:
        verbosity: "conversational"
        formality: "informal (first name)"
        personal_references: "allowed"
        historical_references: "allowed"
        recommendations: "personalized"

      example_responses:
        query: "What's on my calendar today?"
        response: "Hey Sarah, you have 3 meetings: standup at 9am, design review at 11am, and your dentist appointment at 3pm. Should I navigate you to the dental office at 2:30?"

      privacy_safeguards:
        - "Verify single person via occupancy confidence > 0.6"
        - "Disable if additional person detected mid-interaction"
        - "Log all RED_BAND operations for audit"

    SEMI_PRIVATE:
      description: "Small group, limited personalization"
      trigger: "context_mode == NORMAL AND person_count IN [2, 4]"
      occupancy: "person_count in [2, 4]"
      allowed_bands: ["GREEN", "AMBER"]

      enabled_features:
        personalization: "limited (speaker-specific only)"
        user_identification: true
        historical_context: "limited (no sensitive history)"
        preference_adaptation: false
        proactive_suggestions: false
        voice_profile: true
        calendar_access: false
        contact_access: false

      response_characteristics:
        verbosity: "moderate"
        formality: "semi-formal"
        personal_references: "avoided"
        historical_references: "generic only"
        recommendations: "generic"

      speaker_diarization:
        enabled: true
        purpose: "Identify which group member is speaking"
        limitation: "No personal info revealed unless speaker alone"

      example_responses:
        query: "What's the weather today?"
        response: "It's 72°F and sunny in Seattle. Good day for outdoor activities."
        note: "No personalization, no calendar integration"

      privacy_safeguards:
        - "No RED_BAND operations"
        - "Speaker diarization for turn-taking only"
        - "Generic responses unless speaker confirmed alone"

    SEMI_PUBLIC:
      description: "Large group or high noise, public mode"
      trigger: "context_mode == LOUD"
      occupancy: "person_count in [5, 10] OR ambient_noise_db > 70"
      allowed_bands: ["GREEN"]

      enabled_features:
        personalization: false
        user_identification: false
        historical_context: false
        preference_adaptation: false
        proactive_suggestions: false
        voice_profile: false
        calendar_access: false
        contact_access: false

      response_characteristics:
        verbosity: "brief"
        formality: "formal (no names)"
        personal_references: "prohibited"
        historical_references: "prohibited"
        recommendations: "generic"

      example_responses:
        query: "Play some music"
        response: "Playing popular music."
        note: "No personalized playlist, no user preferences"

      privacy_safeguards:
        - "GREEN_BAND only (public information)"
        - "No user identification"
        - "No historical context"

    PUBLIC:
      description: "Crowd or public setting, broadcast mode"
      trigger: "context_mode == ANNOUNCEMENT"
      occupancy: "person_count > 10"
      allowed_bands: ["GREEN"]

      enabled_features:
        personalization: false
        user_identification: false
        historical_context: false
        preference_adaptation: false
        proactive_suggestions: false
        voice_profile: false
        calendar_access: false
        contact_access: false

      response_characteristics:
        verbosity: "minimal"
        formality: "formal (broadcast style)"
        personal_references: "prohibited"
        historical_references: "prohibited"
        recommendations: "none"

      example_responses:
        query: "What time is it?"
        response: "It's 3:15 PM."
        note: "Broadcast mode, minimal interaction"

      privacy_safeguards:
        - "GREEN_BAND only"
        - "Broadcast mode (no individual targeting)"
        - "No voice recognition beyond wake word"

  adaptation_rules:
    rule_1_occupancy_gating:
      description: "Gate features based on occupancy"
      implementation:
        - condition: "person_count == 0"
          action: "STANDBY mode, disable all interactions"

        - condition: "person_count == 1"
          action: "PRIVATE mode, enable all features"

        - condition: "person_count IN [2, 4]"
          action: "SEMI_PRIVATE mode, limited personalization"

        - condition: "person_count IN [5, 10]"
          action: "SEMI_PUBLIC mode, no personalization"

        - condition: "person_count > 10"
          action: "PUBLIC mode, broadcast only"

    rule_2_dynamic_downgrade:
      description: "Downgrade privacy during interaction if occupancy changes"
      trigger: "person_count increases during active interaction"

      scenarios:
        mid_interaction_entry:
          situation: "Agent revealing personal info, additional person enters"
          action: "Immediately stop personal response, switch to generic"
          example: "Calendaring 'dentist appointment at 3pm' → Additional person enters → Stop mid-sentence, say 'One moment please'"

        proactive_check:
          situation: "Before each RED_BAND operation, re-check occupancy"
          action: "Verify person_count == 1 before revealing sensitive info"

        grace_period:
          duration_ms: 500
          description: "Allow 500ms for transient occupancy changes to settle"

    rule_3_speaker_diarization:
      description: "Use speaker diarization in SEMI_PRIVATE mode"
      enabled_modes: ["SEMI_PRIVATE"]

      workflow:
        step_1: "Identify speaker via voice profile"
        step_2: "If speaker alone → Enable personalization for that speaker"
        step_3: "If others present → Generic responses only"

      limitations:
        - "Speaker identification requires voice profile enrollment"
        - "Cannot reveal personal info even for identified speaker if others present"

    rule_4_explicit_consent:
      description: "Require explicit consent for RED_BAND in groups"
      trigger: "User requests RED_BAND operation in SEMI_PRIVATE/SEMI_PUBLIC"

      workflow:
        step_1: "Detect RED_BAND request (e.g., 'Read my calendar')"
        step_2: "Warn: 'This request requires personal information. Are you alone?'"
        step_3: "Wait for user confirmation"
        step_4: "Re-check occupancy (require person_count == 1)"
        step_5: "If confirmed alone → Allow RED_BAND operation"
        step_6: "If others present → Deny with explanation"

    rule_5_historical_context_filtering:
      description: "Filter historical context based on privacy mode"

      filtering_logic:
        PRIVATE:
          historical_turns: 10
          sensitive_data: "allowed"
          personal_preferences: "allowed"

        SEMI_PRIVATE:
          historical_turns: 3
          sensitive_data: "filtered out"
          personal_preferences: "generic only"

        SEMI_PUBLIC:
          historical_turns: 1
          sensitive_data: "prohibited"
          personal_preferences: "prohibited"

        PUBLIC:
          historical_turns: 0
          sensitive_data: "prohibited"
          personal_preferences: "prohibited"

  privacy_bands_integration:
    GREEN_BAND:
      description: "Public information, allowed in all modes"
      examples:
        - "Weather forecasts"
        - "News headlines"
        - "General knowledge queries"
        - "Public facility information"

      allowed_modes: ["PRIVATE", "SEMI_PRIVATE", "SEMI_PUBLIC", "PUBLIC"]

    AMBER_BAND:
      description: "Moderate sensitivity, allowed in PRIVATE/SEMI_PRIVATE"
      examples:
        - "Generic music preferences"
        - "Non-sensitive reminders"
        - "Location-based suggestions (not specific addresses)"

      allowed_modes: ["PRIVATE", "SEMI_PRIVATE"]
      restriction: "Prohibited in SEMI_PUBLIC/PUBLIC"

    RED_BAND:
      description: "High sensitivity, PRIVATE mode only"
      examples:
        - "Calendar appointments"
        - "Contact information"
        - "Personal health data"
        - "Financial information"
        - "Private messages"

      allowed_modes: ["PRIVATE"]
      restriction: "Prohibited in all group settings"
      consent_required: true

  response_transformation:
    personalized_to_generic:
      description: "Transform personalized responses to generic equivalents"

      transformations:
        calendar_event:
          personalized: "You have a dentist appointment at 3pm"
          generic: "You have an appointment at 3pm"
          public: "An appointment is scheduled"

        contact_name:
          personalized: "Call John Smith (mobile)"
          generic: "Call contact"
          public: "Calling contact"

        music_preference:
          personalized: "Playing your Jazz playlist"
          generic: "Playing Jazz music"
          public: "Playing music"

        location_history:
          personalized: "You usually leave for work at 8:15am"
          generic: "Typical commute time is around 8:15am"
          public: "Commute time information unavailable"

    verbosity_adjustment:
      PRIVATE: "conversational (full context)"
      SEMI_PRIVATE: "moderate (essential context only)"
      SEMI_PUBLIC: "brief (minimal context)"
      PUBLIC: "minimal (broadcast style)"

  performance:
    adaptation_latency_ms:
      p50: 5
      p95: 10
      p99: 15
      note: "Negligible overhead (context check only)"

    occupancy_check_frequency_hz: 10
    memory_kb: 1

  observability:
    metrics:
      - name: "privacy_mode_current"
        type: "gauge"
        labels: ["room_id", "mode"]
        description: "Current privacy mode per room"

      - name: "privacy_downgrades_total"
        type: "counter"
        labels: ["room_id", "from_mode", "to_mode", "reason"]
        description: "Dynamic privacy downgrades during interactions"

      - name: "red_band_denials_total"
        type: "counter"
        labels: ["room_id", "reason"]
        description: "RED_BAND operations denied due to occupancy"

    events:
      - name: "PrivacyModeChanged"
        trigger: "Privacy mode changes"
        payload: "room_id, old_mode, new_mode, occupancy_basis"

      - name: "PrivacyViolationPrevented"
        trigger: "RED_BAND operation blocked in group setting"
        payload: "room_id, operation, person_count"

  example_scenarios:
    single_person_calendar:
      context_mode: "WHISPER"
      person_count: 1
      privacy_mode: "PRIVATE"
      query: "What's on my calendar today?"
      response: "Hey Sarah, you have 3 meetings: standup at 9am, design review at 11am, and your dentist appointment at 3pm."
      allowed_bands: ["GREEN", "AMBER", "RED"]

    group_calendar_blocked:
      context_mode: "NORMAL"
      person_count: 3
      privacy_mode: "SEMI_PRIVATE"
      query: "What's on my calendar today?"
      response: "I can't share personal calendar information in a group setting. Would you like me to send it to your phone instead?"
      allowed_bands: ["GREEN", "AMBER"]

    mid_interaction_downgrade:
      initial_state:
        context_mode: "WHISPER"
        person_count: 1
        privacy_mode: "PRIVATE"

      interaction_start:
        query: "Read my latest email"
        response_start: "Your latest email is from John Smith about the project deadline—"

      occupancy_change:
        person_count: 2
        privacy_mode: "SEMI_PRIVATE"

      interaction_interrupt:
        response_interrupt: "—One moment please."
        action: "Stop reading email, downgrade to SEMI_PRIVATE"

  related_contracts:
    - "context_detector.yml"
    - "room_occupancy.yml"
    - "presence_detection.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
