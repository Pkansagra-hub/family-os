inappropriate_action_detection:
  name: "Inappropriate Action Detection Contract"
  purpose: "Detect and block socially inappropriate or norm-violating actions"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/inappropriate_action_detection.py"
  capability: "Social Norm Modeling"

  description: |
    Inappropriate Action Detection identifies actions that violate social norms,
    safety guidelines, or family preferences. Provides explanations for blocks
    and suggests alternatives.

    Key features:
    - Multi-category detection (norms, safety, preferences)
    - Confidence scoring
    - Alternative suggestions
    - Learning from corrections
    - Audit logging

  detection_categories:
    norm_violations:
      description: "Actions that violate active social norms"

      time_based_violations:
        loud_music_during_quiet_hours:
          norm: "quiet_hours"
          trigger_condition: "intent = play_music AND volume > 50% AND time in quiet_hours"
          confidence: 1.0

          block_message: "Loud music blocked during quiet hours (22:00-07:00)."
          alternatives:
            - "Play at 50% volume"
            - "Use headphones"
            - "Defer until 07:00"

        phone_call_late_night:
          norm: "quiet_hours.no_phone_calls"
          trigger_condition: "intent = make_call AND time > 22:30"
          confidence: 1.0

          block_message: "Phone calls blocked after 22:30."
          alternatives:
            - "Send text message instead"
            - "Call emergency contacts only"
            - "Defer until morning"

        work_interruption_during_meals:
          norm: "meal_times.no_work_interruptions"
          trigger_condition: "intent = work_related AND context = meal_time"
          confidence: 0.9

          block_message: "Work notifications deferred during meal times."
          alternatives:
            - "Defer until after meal"
            - "Mark as urgent (if truly urgent)"

      cost_based_violations:
        exceeds_daily_limit:
          norm: "daily_spend_limit"
          trigger_condition: "cumulative_spend + transaction_amount > daily_limit"
          confidence: 1.0

          block_message: "Daily spending limit of ${daily_limit} reached."
          alternatives:
            - "Defer purchase to tomorrow"
            - "Request admin override"

        high_cost_no_confirmation:
          norm: "high_cost_threshold"
          trigger_condition: "transaction_amount > threshold AND no_confirmation_received"
          confidence: 1.0

          block_message: "High-cost purchase requires confirmation."
          alternatives:
            - "Request confirmation"
            - "Lower purchase amount"

      privacy_based_violations:
        share_personal_info_with_visitors:
          norm: "visitors_present.no_personal_information"
          trigger_condition: "intent = share_info AND privacy_band = AMBER"
          confidence: 0.9

          block_message: "Personal information blocked when visitors present."
          alternatives:
            - "Defer until visitors leave"
            - "Visual display only (no audio)"

        read_calendar_aloud_in_AMBER:
          norm: "visitors_present.no_calendar_reading"
          trigger_condition: "intent = read_calendar AND privacy_band = AMBER"
          confidence: 1.0

          block_message: "Calendar reading blocked when visitors present."
          alternatives:
            - "Show on screen without audio"
            - "Defer until privacy band = GREEN"

    safety_violations:
      description: "Actions that pose safety risks"

      dangerous_advice:
        child_unsafe_activity:
          trigger_condition: "children_present AND advice_category in dangerous_categories"
          dangerous_categories:
            - "handling_chemicals"
            - "using_sharp_objects"
            - "operating_appliances"
            - "climbing_heights"
          confidence: 1.0

          block_message: "This activity requires adult supervision."
          alternatives:
            - "Wait for parent to supervise"
            - "Suggest safe alternative activity"

        medical_diagnosis:
          trigger_condition: "intent = diagnose_symptoms"
          confidence: 0.85

          block_message: "I cannot provide medical diagnosis. Please consult a doctor."
          alternatives:
            - "Suggest calling doctor"
            - "Provide general health information only"

      security_risks:
        unlock_door_unverified:
          trigger_condition: "intent = unlock_door AND speaker_confidence < 0.9"
          confidence: 0.9

          block_message: "Cannot verify your identity. Door unlock blocked."
          alternatives:
            - "Use physical key"
            - "Complete voice verification"

        disable_security_unverified:
          trigger_condition: "intent = disable_security AND speaker_identity != admin"
          confidence: 1.0

          block_message: "Only admin can disable security system."
          alternatives:
            - "Request admin assistance"

      physical_safety:
        extreme_temperature:
          trigger_condition: "intent = set_thermostat AND (temp < 50 OR temp > 85)"
          confidence: 1.0

          block_message: "Temperature {temp}°F is outside safe range (50-85°F)."
          alternatives:
            - "Set to safe temperature"
            - "Override with confirmation"

    preference_violations:
      description: "Actions that contradict user preferences"

      content_filtering:
        inappropriate_content_for_children:
          trigger_condition: "children_present AND content_rating > family_friendly"
          confidence: 0.95

          block_message: "Content not appropriate for children."
          alternatives:
            - "Suggest age-appropriate content"
            - "Defer until children not present"

        dietary_restrictions:
          trigger_condition: "intent = suggest_restaurant AND cuisine violates dietary_prefs"
          confidence: 0.9

          block_message: "Restaurant suggestion blocked due to dietary restrictions ({restrictions})."
          alternatives:
            - "Suggest restaurants matching dietary needs"

      scheduling_conflicts:
        double_booking:
          trigger_condition: "intent = schedule_event AND overlaps_existing_event"
          confidence: 1.0

          block_message: "Scheduling conflict with existing event: {existing_event}."
          alternatives:
            - "Suggest alternative times"
            - "Ask which event to keep"

  detection_workflow:
    step_1:
      name: "Parse Intent"
      action: "Extract intent type, parameters, context"
      output: "intent_struct"

    step_2:
      name: "Check Active Norms"
      action: "Query social_norms for currently active norms"
      filters:
        - "time_of_day"
        - "privacy_band"
        - "room_occupancy"
        - "speaker_identity"
      output: "active_norms[]"

    step_3:
      name: "Evaluate Violations"
      action: "Check if intent violates any active norms"
      algorithm: |
        for each active_norm:
          if intent matches norm.trigger_condition:
            add to violations[] with confidence
      output: "violations[]"

    step_4:
      name: "Check Safety Violations"
      action: "Evaluate intent against safety rules"
      categories:
        - "dangerous_advice"
        - "security_risks"
        - "physical_safety"
      output: "safety_violations[]"

    step_5:
      name: "Check Preference Violations"
      action: "Evaluate intent against user preferences"
      sources:
        - "per_person_context.preferences"
        - "family_preferences"
      output: "preference_violations[]"

    step_6:
      name: "Select Highest Confidence"
      action: "If multiple violations, select highest confidence"
      threshold: 0.75
      output: "primary_violation"

    step_7:
      name: "Generate Block Response"
      action: "Create user-friendly explanation"
      components:
        - "violation_category"
        - "block_message"
        - "alternatives[]"
      output: "block_response"

  confidence_scoring:
    factors:
      exact_match:
        weight: 1.0
        condition: "intent exactly matches trigger condition"

      fuzzy_match:
        weight: 0.8
        condition: "intent partially matches trigger condition"

      contextual_match:
        weight: 0.7
        condition: "context suggests violation"

      learned_pattern:
        weight: 0.6
        condition: "similar intents previously blocked"

    threshold:
      block: 0.75
      warn: 0.5
      allow: "<0.5"

  alternative_suggestions:
    generation_strategies:
      defer_to_later:
        applicable_when: "time_based_violation"
        template: "Defer {action} until {appropriate_time}"

      modify_parameters:
        applicable_when: "parameter_violation"
        template: "Adjust {parameter} from {current_value} to {acceptable_value}"

      change_modality:
        applicable_when: "audio_blocked_in_privacy_mode"
        template: "Show on screen without audio"

      suggest_alternative_action:
        applicable_when: "action_entirely_blocked"
        template: "Instead, try {alternative_action}"

    ranking:
      priority_order:
        1: "defer_to_later"
        2: "modify_parameters"
        3: "change_modality"
        4: "suggest_alternative_action"

  learning_from_corrections:
    user_overrides:
      track: true

      patterns:
        repeated_override:
          threshold: 5
          time_window_days: 7
          action: "Adjust norm threshold or create exception"

        never_overridden:
          threshold_days: 30
          action: "Increase confidence in violation detection"

    false_positives:
      detection:
        condition: "user proceeds after block AND no negative outcome"
        track_count: true

      adjustment:
        threshold: 10
        action: "Reduce confidence or disable rule"

  performance:
    detection_latency_ms:
      p50: 2
      p95: 5
      p99: 10
      target: "<5ms for violation detection"

    alternative_generation_latency_ms:
      p50: 10
      p95: 20
      p99: 50
      target: "<20ms for alternative suggestions"

  observability:
    metrics:
      - name: "inappropriate_actions_detected_total"
        type: "counter"
        labels: ["category", "violation_type"]
        description: "Total inappropriate actions detected"

      - name: "inappropriate_actions_blocked_total"
        type: "counter"
        labels: ["category", "violation_type"]
        description: "Total actions blocked"

      - name: "inappropriate_actions_confidence"
        type: "histogram"
        labels: ["category"]
        buckets: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 1.0]
        description: "Confidence distribution"

      - name: "inappropriate_actions_false_positives_total"
        type: "counter"
        labels: ["violation_type"]
        description: "Total false positives (user overrides)"

    logging:
      events:
        - event: "inappropriate_action_detected"
          level: "info"
          fields:
            - "category"
            - "violation_type"
            - "confidence"
            - "intent"

        - event: "action_blocked"
          level: "warning"
          fields:
            - "violation_type"
            - "block_message"
            - "alternatives"

        - event: "user_override"
          level: "warning"
          fields:
            - "violation_type"
            - "override_reason"

  storage:
    database: "SQLite"

    schema:
      violations:
        columns:
          violation_id: "TEXT PRIMARY KEY"
          category: "TEXT"
          violation_type: "TEXT"
          confidence: "REAL"
          intent: "TEXT"
          blocked: "BOOLEAN"
          user_override: "BOOLEAN"
          timestamp_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_violations_timestamp ON violations(timestamp_ms)"
          - "CREATE INDEX idx_violations_type ON violations(violation_type, timestamp_ms)"

  integration:
    input_sources:
      - name: "Intent Router"
        source: "k1/l1_input/intent_router.py"
        event: "INTENT_CLASSIFIED"

      - name: "Social Norms"
        source: "k1/l1_input/meta_policy/social_norms.py"
        event: "NORM_ACTIVE"

      - name: "Dynamic Privacy Adjuster"
        source: "k1/l1_input/meta_policy/dynamic_privacy_adjuster.py"
        event: "PRIVACY_BAND_CHANGED"

    output_consumers:
      - name: "Orchestrator"
        destination: "k1/l2_orchestration/orchestrator_core.py"
        event: "ACTION_BLOCKED"

      - name: "Meta Policy Event Stream"
        destination: "SSE /api/v1/meta-policy/stream"
        event: "INAPPROPRIATE_ACTION_DETECTED"

  related_contracts:
    - "social_norms.yml"
    - "proactive_confirmation.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
