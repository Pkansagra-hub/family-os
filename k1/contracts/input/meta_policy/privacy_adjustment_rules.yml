privacy_adjustment_rules:
  name: "Privacy Adjustment Rules Contract"
  purpose: "Define rules for privacy band adjustments and response modifications"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/privacy_adjustment_rules.py"
  capability: "Contextual Privacy"

  description: |
    Privacy Adjustment Rules define specific modifications to agent behavior
    when privacy bands change. Rules specify what operations are blocked,
    how responses are modified, and what data can be processed/stored.

    Key features:
    - Per-band operation restrictions
    - Response content modifications
    - Data handling policies
    - Audit requirements
    - Compliance enforcement

  operation_restrictions:
    cloud_processing:
      description: "Cloud LLM API calls"

      GREEN:
        allowed: true
        conditions: []

      AMBER:
        allowed: true
        conditions:
          - "PII must be redacted before sending"
          - "Use anonymization service"
          - "Track data sent to cloud"

      RED:
        allowed: false
        alternatives: ["local_llm_only"]

    voice_recording:
      description: "Audio recording for transcription"

      GREEN:
        allowed: true
        retention_days: 90
        encryption: "AES-256"

      AMBER:
        allowed: true
        conditions:
          - "Exclude visitor voices"
          - "Speaker diarization required"
        retention_days: 30
        encryption: "AES-256"

      RED:
        allowed: false
        alternatives: ["ephemeral_transcription_only"]

    calendar_access:
      description: "Reading calendar events"

      GREEN:
        allowed: true
        operations: ["read", "create", "update", "delete"]

      AMBER:
        allowed: true
        operations: ["read"]
        restrictions:
          - "No reading aloud"
          - "Visual display only"
          - "Redact participant names"

      RED:
        allowed: false
        alternatives: []

    email_access:
      description: "Reading emails"

      GREEN:
        allowed: true
        operations: ["read", "send", "search"]

      AMBER:
        allowed: false
        alternatives: ["notification_count_only"]

      RED:
        allowed: false
        alternatives: []

    message_access:
      description: "Reading messages (SMS, chat)"

      GREEN:
        allowed: true
        operations: ["read", "send", "search"]

      AMBER:
        allowed: false
        alternatives: ["notification_count_only"]

      RED:
        allowed: false
        alternatives: []

    contact_access:
      description: "Reading contact information"

      GREEN:
        allowed: true
        operations: ["read", "search", "dial"]

      AMBER:
        allowed: true
        operations: ["search", "dial"]
        restrictions:
          - "No full name disclosure"
          - "Use first name only"

      RED:
        allowed: false
        alternatives: []

    location_services:
      description: "Location tracking and disclosure"

      GREEN:
        allowed: true
        precision: "exact"

      AMBER:
        allowed: true
        precision: "approximate"
        restrictions:
          - "City-level only"
          - "No exact coordinates"

      RED:
        allowed: false
        alternatives: []

    personalization:
      description: "Personalized responses using user history"

      GREEN:
        allowed: true
        depth: "full_history"

      AMBER:
        allowed: true
        depth: "limited"
        restrictions:
          - "Use generic preferences only"
          - "No family-specific references"

      RED:
        allowed: false
        alternatives: ["generic_responses_only"]

  response_modifications:
    content_redaction:
      description: "Remove PII from responses"

      GREEN:
        enabled: false

      AMBER:
        enabled: true
        redact_patterns:
          - family_member_names: "Replace with pronouns or 'someone'"
          - addresses: "Replace with city only"
          - phone_numbers: "Replace with '[phone number]'"
          - email_addresses: "Replace with '[email]'"
          - dates_of_birth: "Replace with age only"

        example:
          original: "John Smith called from 555-1234 about your appointment at 123 Main St."
          redacted: "Someone called from [phone number] about your appointment in [city]."

      RED:
        enabled: true
        redact_patterns:
          - all_names: "Remove entirely or use '[person]'"
          - all_contact_info: "Remove entirely"
          - all_addresses: "Remove entirely"
          - all_dates: "Remove entirely"

        example:
          original: "John Smith called from 555-1234"
          redacted: "You have a call"

    formality_adjustment:
      description: "Adjust response formality"

      GREEN:
        formality: "casual"
        use_nicknames: true
        conversational_tone: true

      AMBER:
        formality: "moderate"
        use_nicknames: false
        use_full_names: false
        generic_pronouns: true

      RED:
        formality: "formal"
        minimal_personalization: true
        generic_responses: true

    output_modality:
      description: "Restrict output modalities"

      GREEN:
        audio: true
        visual: true
        notifications: true

      AMBER:
        audio: false
        visual: true
        notifications: true
        rationale: "No reading personal info aloud with visitors"

      RED:
        audio: false
        visual: true
        notifications: false
        rationale: "Visual confirmation only in private mode"

    suggestion_filtering:
      description: "Filter proactive suggestions"

      GREEN:
        enabled: false
        suggest_all: true

      AMBER:
        enabled: true
        filter_out:
          - "personal_reminders"
          - "family_specific_suggestions"
          - "calendar_based_suggestions"
        allow:
          - "weather"
          - "news"
          - "general_knowledge"

      RED:
        enabled: true
        filter_out:
          - "all_proactive_suggestions"
        allow:
          - "emergency_only"

  data_handling_policies:
    storage_location:
      description: "Where data can be stored"

      GREEN:
        locations: ["cloud", "local_disk", "local_db"]
        replication: true
        backup: true

      AMBER:
        locations: ["local_disk", "local_db"]
        replication: false
        backup: "encrypted_local_only"
        cloud_storage:
          allowed: false
          exception: "PII redacted data only"

      RED:
        locations: ["RAM_only"]
        replication: false
        backup: false
        persistence: "none"

    retention_policy:
      description: "How long data is retained"

      GREEN:
        conversation_history_days: 90
        voice_recordings_days: 90
        logs_days: 365

      AMBER:
        conversation_history_days: 30
        voice_recordings_days: 0
        logs_days: 90
        pii_redaction: "required"

      RED:
        conversation_history_days: 0
        voice_recordings_days: 0
        logs_days: 0
        immediate_deletion: true

    encryption:
      description: "Encryption requirements"

      GREEN:
        at_rest: "AES-256"
        in_transit: "TLS 1.3"
        key_rotation_days: 90

      AMBER:
        at_rest: "AES-256"
        in_transit: "TLS 1.3"
        key_rotation_days: 30
        pii_fields: "double_encryption"

      RED:
        at_rest: "AES-256 + secure_enclave"
        in_transit: "TLS 1.3 + perfect_forward_secrecy"
        key_rotation_days: 1
        ephemeral_keys: true

    audit_logging:
      description: "Audit log requirements"

      GREEN:
        enabled: true
        log_level: "info"
        pii_in_logs: "allowed"

      AMBER:
        enabled: true
        log_level: "info"
        pii_in_logs: "redacted"
        log_access: "restricted"

      RED:
        enabled: true
        log_level: "warning_and_above"
        pii_in_logs: "never"
        log_access: "admin_only"
        tamper_proof: true

  compliance_enforcement:
    gdpr:
      description: "GDPR compliance requirements"

      GREEN:
        consent_required: true
        data_minimization: "standard"
        right_to_erasure: true
        right_to_portability: true

      AMBER:
        consent_required: true
        data_minimization: "enhanced"
        right_to_erasure: true
        right_to_portability: true
        processing_basis: "legitimate_interest"

      RED:
        consent_required: true
        data_minimization: "maximum"
        right_to_erasure: true
        right_to_portability: true
        processing_basis: "explicit_consent_only"

    ccpa:
      description: "CCPA compliance requirements"

      GREEN:
        opt_out_available: true
        data_sale: "not_applicable"
        disclosure_required: true

      AMBER:
        opt_out_available: true
        data_sale: "prohibited"
        disclosure_required: true
        data_sharing: "limited"

      RED:
        opt_out_available: true
        data_sale: "prohibited"
        disclosure_required: true
        data_sharing: "none"

    biometric_privacy:
      description: "Biometric data handling (Illinois BIPA, etc.)"

      GREEN:
        voice_biometrics: "allowed_with_consent"
        face_recognition: "allowed_with_consent"
        retention: "indefinite_until_withdrawal"

      AMBER:
        voice_biometrics: "limited_use"
        face_recognition: "identification_only"
        retention: "session_only"

      RED:
        voice_biometrics: "disabled"
        face_recognition: "disabled"
        retention: "none"

  rule_evaluation:
    evaluation_workflow:
      step_1:
        name: "Get Active Privacy Band"
        action: "Query current privacy band from dynamic_privacy_adjuster"
        output: "current_band (GREEN/AMBER/RED)"

      step_2:
        name: "Check Operation Restrictions"
        action: "Query operation_restrictions for current_band"
        output: "allowed_operations, blocked_operations"

      step_3:
        name: "Apply Response Modifications"
        action: "Query response_modifications for current_band"
        output: "content_filters, formality_level, output_modality"

      step_4:
        name: "Enforce Data Policies"
        action: "Query data_handling_policies for current_band"
        output: "storage_policy, retention_policy, encryption_policy"

      step_5:
        name: "Return Enforcement Bundle"
        action: "Package all rules for current band"
        output: "enforcement_bundle"

  performance:
    rule_evaluation_latency_ms:
      p50: 0.5
      p95: 1
      p99: 2
      target: "<1ms for rule evaluation"

  observability:
    metrics:
      - name: "privacy_rules_operations_blocked_total"
        type: "counter"
        labels: ["band", "operation"]
        description: "Operations blocked by privacy rules"

      - name: "privacy_rules_modifications_applied_total"
        type: "counter"
        labels: ["band", "modification_type"]
        description: "Response modifications applied"

    logging:
      events:
        - event: "operation_blocked"
          level: "info"
          fields:
            - "band"
            - "operation"
            - "reason"

        - event: "response_modified"
          level: "debug"
          fields:
            - "band"
            - "modification_type"

  storage:
    database: "SQLite"

    schema:
      privacy_rules:
        columns:
          rule_id: "TEXT PRIMARY KEY"
          band: "TEXT"
          rule_category: "TEXT"
          rule_definition: "JSON"

        indexes:
          - "CREATE INDEX idx_privacy_rules_band ON privacy_rules(band)"

  integration:
    input_sources:
      - name: "Dynamic Privacy Adjuster"
        source: "k1/l1_input/meta_policy/dynamic_privacy_adjuster.py"
        event: "PRIVACY_BAND_CHANGED"

    output_consumers:
      - name: "Orchestrator"
        destination: "k1/l2_orchestration/orchestrator_core.py"
        event: "PRIVACY_RULES_ACTIVE"

      - name: "Model Hub"
        destination: "k1/l3_execution/model_hub/router.py"
        event: "PRIVACY_CONSTRAINTS"

  related_contracts:
    - "dynamic_privacy_adjuster.yml"
    - "social_norms.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
