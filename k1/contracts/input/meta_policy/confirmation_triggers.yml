confirmation_triggers:
  name: "Confirmation Trigger Rules Contract"
  purpose: "Define specific trigger conditions for proactive confirmations"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/confirmation_triggers.py"
  capability: "Proactive Confirmations"

  description: |
    Confirmation Trigger Rules define precise conditions that activate proactive
    confirmations. Rules are organized by risk category and include thresholds,
    intent patterns, and context requirements.

    Key features:
    - Threshold-based triggers
    - Pattern-based triggers
    - Context-aware triggers
    - Adaptive threshold learning
    - Override exceptions

  trigger_categories:
    financial_triggers:
      single_transaction:
        threshold_usd: 100
        currency: "USD"

        matching_intents:
          - "purchase_product"
          - "book_service"
          - "pay_bill"
          - "transfer_money"

        exception_merchants:
          - "grocery_stores"
          - "gas_stations"
          - "pharmacies"

        adaptive_learning:
          enabled: true
          increase_threshold_if: "user confirms >80% of time"
          decrease_threshold_if: "user denies >80% of time"

      subscription_signup:
        always_confirm: true

        matching_intents:
          - "subscribe_service"
          - "start_membership"
          - "join_premium"

        required_disclosures:
          - "Billing frequency (monthly/annual)"
          - "Total annual cost"
          - "Cancellation policy"
          - "Auto-renewal status"

      cumulative_daily_spending:
        threshold_usd: 500
        reset_time: "00:00"

        trigger_condition: "daily_total >= threshold"

        warning_thresholds:
          75_percent: "Notification: 75% of daily limit used"
          90_percent: "Warning: 90% of daily limit used"
          100_percent: "Confirmation required: Daily limit reached"

      unusual_transaction:
        trigger_conditions:
          - "amount > 3x average_transaction"
          - "merchant_category not in usual_categories"
          - "transaction_time not in usual_hours"

        require_confidence: 0.8
        always_confirm: true

    privacy_triggers:
      share_contact_info:
        always_confirm: true

        matching_intents:
          - "share_phone_number"
          - "share_email_address"
          - "share_home_address"

        show_recipient: true
        show_purpose: true

      share_location:
        threshold: "exact_location"

        granularity_levels:
          city: "no_confirmation"
          neighborhood: "confirmation_if_RED_band"
          exact_address: "always_confirm"

        matching_intents:
          - "share_current_location"
          - "enable_location_tracking"

      grant_app_permissions:
        always_confirm: true

        high_risk_permissions:
          - "camera"
          - "microphone"
          - "location"
          - "contacts"
          - "files"

        show_implications:
          camera: "App can take photos/videos"
          microphone: "App can record audio"
          location: "App can track your location"
          contacts: "App can access your contacts"
          files: "App can read/write your files"

      data_export:
        always_confirm: true

        matching_intents:
          - "export_all_data"
          - "download_data_archive"

        show_data_scope:
          - "Conversation history"
          - "User preferences"
          - "Usage analytics"
          - "Biometric data"

      privacy_band_downgrade:
        trigger_conditions:
          - "manual_downgrade from RED to AMBER"
          - "manual_downgrade from AMBER to GREEN"

        confirmation_message: "Lower privacy protection from {from_band} to {to_band}?"

        show_implications: true

    safety_triggers:
      unlock_door:
        always_confirm: true

        matching_intents:
          - "unlock_front_door"
          - "unlock_back_door"
          - "unlock_all_doors"

        safety_checks:
          - "Verify user identity (voice biometrics)"
          - "Check for emergency context"
          - "Log action with timestamp"

        exception_contexts:
          - "emergency_mode"
          - "paramedic_access"

      disable_security:
        always_confirm: true
        requires_double_confirmation: true

        matching_intents:
          - "disable_alarm"
          - "turn_off_cameras"
          - "disable_motion_sensors"

        show_warnings:
          - "Security system will be disabled"
          - "Home will be unprotected"
          - "Recommended: Keep security enabled"

      control_thermostat_extreme:
        trigger_conditions:
          - "temperature < 50°F or > 85°F"

        confirmation_message: "Set thermostat to {temperature}°F? This is outside normal range."

        safety_warnings:
          too_cold: "Risk of frozen pipes"
          too_hot: "Risk of overheating"

      send_bulk_messages:
        threshold: 10

        trigger_condition: "contact_count >= threshold"

        confirmation_message: "Send message to {contact_count} contacts?"

        show_preview: true
        preview_max_length: 100

    irreversibility_triggers:
      delete_account:
        always_confirm: true
        requires_double_confirmation: true

        matching_intents:
          - "delete_account"
          - "close_account"

        warnings:
          - "All data will be permanently deleted"
          - "This action cannot be undone"
          - "Consider exporting data first"

        require_typed_confirmation: "DELETE MY ACCOUNT"

      delete_all_data:
        always_confirm: true
        requires_double_confirmation: true

        matching_intents:
          - "delete_all_conversations"
          - "clear_all_history"
          - "factory_reset"

        warnings:
          - "All conversations will be deleted"
          - "All preferences will be reset"
          - "This cannot be undone"

      irreversible_action_marker:
        trigger_condition: "tool_spec.side_effects includes 'irreversible'"

        always_confirm: true

        confirmation_message: "This action cannot be undone: {action_description}. Proceed?"

    context_based_triggers:
      action_in_RED_band:
        trigger_condition: "privacy_band = RED AND action_requires_cloud"

        confirmation_message: "This action requires cloud processing, but you're in private mode. Lower privacy to AMBER?"

        options:
          - "Allow and downgrade to AMBER"
          - "Deny (stay in RED)"

      action_during_meeting:
        trigger_condition: "meeting_in_progress AND action_makes_noise"

        confirmation_message: "You're in a meeting. Play audio anyway?"

        suggest_alternatives:
          - "Defer until meeting ends"
          - "Send to phone instead"

      action_with_visitors:
        trigger_condition: "visitors_present AND action_reveals_personal_info"

        confirmation_message: "Visitors are present. Share personal information anyway?"

        suggest_alternatives:
          - "Defer until alone"
          - "Visual display only (no audio)"

  trigger_evaluation:
    workflow:
      step_1:
        name: "Parse Intent"
        action: "Extract intent type, parameters, context"
        output: "intent_struct"

      step_2:
        name: "Match Against Triggers"
        action: "Check if intent matches any trigger rule"
        matching_criteria:
          - "intent_type"
          - "parameter_thresholds"
          - "context_conditions"
        output: "matched_triggers[]"

      step_3:
        name: "Evaluate Exceptions"
        action: "Check if any exceptions apply"
        exception_types:
          - "trusted_merchants"
          - "emergency_contexts"
          - "user_defined_overrides"
        output: "filtered_triggers[]"

      step_4:
        name: "Select Highest Priority"
        action: "If multiple triggers match, select highest priority"
        priority_order:
          1: "safety_triggers"
          2: "irreversibility_triggers"
          3: "privacy_triggers"
          4: "financial_triggers"
        output: "active_trigger"

      step_5:
        name: "Generate Confirmation Request"
        action: "Create confirmation prompt from trigger template"
        output: "confirmation_request"

  adaptive_thresholds:
    learning_algorithm:
      method: "exponential_moving_average"
      learning_rate: 0.1

      adjustment_triggers:
        frequent_confirmation:
          condition: "user confirms >80% over 20 instances"
          action: "Increase threshold by 25%"
          example: "financial_triggers.single_transaction.threshold_usd: $100 → $125"

        frequent_denial:
          condition: "user denies >80% over 20 instances"
          action: "Decrease threshold by 25%"
          example: "financial_triggers.single_transaction.threshold_usd: $100 → $75"

        never_triggered:
          condition: "trigger not activated in 30 days"
          action: "Propose disabling trigger"

    user_feedback_integration:
      explicit_adjustment:
        command: "FamilyOS, set confirmation threshold to ${amount}"
        immediate: true

      override_to_exception:
        pattern: "User overrides same trigger 5 times for same merchant"
        action: "Add merchant to exception list"

  exception_management:
    trusted_merchants:
      description: "Merchants that don't require confirmation"

      default_trusted:
        - "Amazon (for orders <$50)"
        - "Netflix (subscription)"
        - "Spotify (subscription)"

      add_exception:
        method: "User explicit OR learned pattern"
        learning_threshold: 5

    emergency_contexts:
      description: "Contexts where confirmations are skipped"

      emergency_types:
        - "fire_alarm"
        - "medical_emergency"
        - "security_breach"

      override_all_triggers: true

    user_defined_overrides:
      description: "User-created exceptions"

      create_override:
        command: "FamilyOS, always allow {action_type}"
        requires_confirmation: true

      remove_override:
        command: "FamilyOS, stop allowing {action_type}"
        immediate: true

  performance:
    trigger_evaluation_latency_ms:
      p50: 1
      p95: 2
      p99: 5
      target: "<2ms for trigger evaluation"

  observability:
    metrics:
      - name: "confirmation_triggers_matched_total"
        type: "counter"
        labels: ["trigger_category", "trigger_name"]
        description: "Total trigger matches"

      - name: "confirmation_triggers_threshold_adjusted_total"
        type: "counter"
        labels: ["trigger_name", "adjustment_direction"]
        description: "Total threshold adjustments"

    logging:
      events:
        - event: "trigger_matched"
          level: "info"
          fields:
            - "trigger_category"
            - "trigger_name"
            - "intent"

        - event: "threshold_adjusted"
          level: "info"
          fields:
            - "trigger_name"
            - "old_threshold"
            - "new_threshold"
            - "reason"

  storage:
    database: "SQLite"

    schema:
      triggers:
        columns:
          trigger_id: "TEXT PRIMARY KEY"
          trigger_category: "TEXT"
          trigger_name: "TEXT"
          trigger_definition: "JSON"
          threshold: "REAL"
          enabled: "BOOLEAN"

        indexes:
          - "CREATE INDEX idx_triggers_category ON triggers(trigger_category, enabled)"

      exceptions:
        columns:
          exception_id: "TEXT PRIMARY KEY"
          trigger_id: "TEXT FOREIGN KEY"
          exception_type: "TEXT"
          exception_value: "TEXT"
          created_at_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_exceptions_trigger ON exceptions(trigger_id)"

  integration:
    input_sources:
      - name: "Intent Router"
        source: "k1/l1_input/intent_router.py"
        event: "INTENT_CLASSIFIED"

      - name: "Orchestrator"
        source: "k1/l2_orchestration/orchestrator_core.py"
        event: "ACTION_PLANNED"

    output_consumers:
      - name: "Proactive Confirmation"
        destination: "k1/l1_input/meta_policy/proactive_confirmation.py"
        event: "TRIGGER_MATCHED"

  related_contracts:
    - "proactive_confirmation.yml"
    - "hitl_confirmation.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
