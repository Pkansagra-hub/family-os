proactive_confirmation:
  name: "Proactive Confirmation Contract"
  purpose: "Request user confirmation for high-risk or high-cost actions"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/proactive_confirmation.py"
  capability: "Proactive Confirmations"

  description: |
    Proactive Confirmation detects high-risk actions (cost, privacy, safety, irreversibility)
    and requests explicit user confirmation before proceeding. Prevents accidental expensive
    purchases, privacy violations, and dangerous actions.

    Key features:
    - Multi-trigger detection (cost, privacy, safety)
    - Confirmation UI integration
    - Timeout handling
    - Audit logging
    - Learning from user patterns

  confirmation_triggers:
    cost_based:
      description: "Confirm high-cost actions"

      high_cost_purchase:
        threshold_usd: 100
        trigger_intent_types:
          - "e_commerce_purchase"
          - "subscription_payment"
          - "service_booking"

        confirmation_message: "This purchase costs ${amount}. Confirm?"

        confirmation_required: true
        timeout_seconds: 30
        default_action: "deny"

      daily_limit_exceeded:
        threshold_usd: 500
        trigger_condition: "cumulative_daily_spend >= threshold"

        confirmation_message: "Daily spending limit of $500 reached. Transaction blocked unless override approved."

        confirmation_required: true
        requires_admin: true
        timeout_seconds: 60
        default_action: "deny"

      recurring_subscription:
        trigger_intent_types:
          - "subscription_signup"

        confirmation_message: "This is a recurring subscription of ${amount}/{period}. Confirm?"

        confirmation_required: true
        timeout_seconds: 30
        default_action: "deny"

        additional_info:
          - "Billing frequency"
          - "Cancellation policy"
          - "Total annual cost"

    privacy_based:
      description: "Confirm privacy-sensitive actions"

      share_personal_info:
        trigger_intent_types:
          - "share_contact_info"
          - "share_location"
          - "share_calendar"

        confirmation_message: "This will share your {info_type} with {recipient}. Confirm?"

        confirmation_required: true
        timeout_seconds: 20
        default_action: "deny"

        privacy_band_check:
          AMBER: "require_confirmation"
          RED: "block_entirely"

      grant_permissions:
        trigger_intent_types:
          - "grant_app_permissions"
          - "grant_device_access"

        confirmation_message: "Grant {permission} access to {app}? This allows {capability}."

        confirmation_required: true
        timeout_seconds: 30
        default_action: "deny"

        show_implications: true

      data_export:
        trigger_intent_types:
          - "export_data"
          - "download_archive"

        confirmation_message: "Export all your data? This includes {data_categories}."

        confirmation_required: true
        timeout_seconds: 30
        default_action: "deny"

        data_categories:
          - "conversations"
          - "preferences"
          - "usage_history"

    safety_based:
      description: "Confirm potentially dangerous actions"

      control_physical_devices:
        trigger_intent_types:
          - "unlock_door"
          - "disable_alarm"
          - "adjust_thermostat_extreme"

        confirmation_message: "Control {device}: {action}. Confirm?"

        confirmation_required: true
        timeout_seconds: 15
        default_action: "deny"

        safety_checks:
          - "Verify user identity"
          - "Check for emergency context"
          - "Log action for audit"

      delete_data:
        trigger_intent_types:
          - "delete_account"
          - "delete_all_data"
          - "factory_reset"

        confirmation_message: "This will permanently delete {data_scope}. This cannot be undone. Confirm?"

        confirmation_required: true
        requires_double_confirmation: true
        timeout_seconds: 60
        default_action: "deny"

        additional_warnings:
          - "Action is irreversible"
          - "Data cannot be recovered"
          - "Consider exporting first"

      send_to_contacts:
        trigger_intent_types:
          - "send_email_bulk"
          - "send_message_broadcast"

        confirmation_message: "Send message to {contact_count} contacts? Preview: {message_preview}"

        confirmation_required: true
        timeout_seconds: 30
        default_action: "deny"

        preview_required: true

    irreversibility_based:
      description: "Confirm irreversible actions"

      irreversible_action:
        trigger_conditions:
          - "action_marked_as_irreversible"
          - "no_undo_capability"

        confirmation_message: "This action cannot be undone: {action_description}. Confirm?"

        confirmation_required: true
        requires_double_confirmation: true
        timeout_seconds: 30
        default_action: "deny"

  confirmation_workflow:
    step_1:
      name: "Detect Trigger"
      action: "Monitor intent stream for confirmation triggers"
      sources:
        - "intent_router"
        - "orchestrator"
        - "tool_execution_planner"

    step_2:
      name: "Evaluate Trigger"
      action: "Check if intent matches any confirmation trigger"
      matching_criteria:
        - "intent_type"
        - "cost_threshold"
        - "privacy_sensitivity"
        - "safety_risk"
        - "irreversibility"

    step_3:
      name: "Generate Confirmation Request"
      action: "Create confirmation prompt with context"
      prompt_elements:
        - "Action description"
        - "Risk explanation"
        - "Consequences"
        - "Options (Confirm/Deny/Defer)"

      enrichment:
        - "Add cost details (if cost-based)"
        - "Add privacy implications (if privacy-based)"
        - "Add safety warnings (if safety-based)"

    step_4:
      name: "Present Confirmation UI"
      action: "Display confirmation request to user"
      modalities:
        audio: "Text-to-speech prompt"
        visual: "Modal dialog on screen/app"
        notification: "Push notification if app"

      timeout: "trigger-specific timeout"

    step_5:
      name: "Wait for User Response"
      action: "Block action execution until response"
      timeout_action: "default_action (usually deny)"

      valid_responses:
        - "Confirm"
        - "Deny"
        - "Defer (ask me later)"
        - "Always allow (for this type)"
        - "Never allow (for this type)"

    step_6:
      name: "Process Response"
      action: "Handle user's decision"
      outcomes:
        confirm: "Allow action to proceed"
        deny: "Block action, notify user"
        defer: "Pause action, remind later"
        always_allow: "Add exception, allow now and future"
        never_allow: "Add block rule, deny now and future"

    step_7:
      name: "Log Decision"
      action: "Audit log confirmation outcome"
      log_fields:
        - "trigger_type"
        - "action_description"
        - "user_response"
        - "timestamp"
        - "response_time_ms"

    step_8:
      name: "Learn from Pattern"
      action: "Update confirmation thresholds if user repeatedly confirms/denies"
      learning_signals:
        - "repeated_confirmation → increase threshold"
        - "repeated_denial → decrease threshold"
        - "always_allow → create exception"

  confirmation_ui:
    audio_prompt:
      format: "TTS"

      template: |
        [Attention sound]
        {action_description}
        {risk_explanation}
        {consequences}
        Say 'confirm' to proceed, 'deny' to cancel, or 'defer' to decide later.

      timeout_reminder:
        after_seconds: 10
        message: "Waiting for confirmation. {timeout_remaining} seconds remaining."

    visual_prompt:
      format: "Modal dialog"

      elements:
        title: "{action_type} Confirmation"
        icon: "warning_icon"

        body:
          action_description: "Bold text"
          risk_explanation: "Regular text"
          consequences: "Bulleted list"
          additional_context: "Expandable section"

        buttons:
          primary: "Confirm"
          secondary: "Deny"
          tertiary: "Defer"

        timeout_indicator: "Progress bar"

    notification_prompt:
      format: "Push notification"

      title: "Confirmation Required"
      body: "{action_description}"

      actions:
        - label: "Confirm"
          action: "approve"
        - label: "Deny"
          action: "reject"

  double_confirmation:
    description: "Require two-step confirmation for extra-risky actions"

    trigger_conditions:
      - "irreversible_action"
      - "cost > $1000"
      - "delete_all_data"
      - "factory_reset"

    workflow:
      step_1:
        prompt: "{action_description}. This action is irreversible. Type 'I understand' to proceed."
        required_input: "I understand"

      step_2:
        prompt: "Final confirmation: {action_description}. Confirm?"
        options: ["Confirm", "Deny"]

  learning_from_patterns:
    repeated_confirmation:
      threshold: 5
      time_window_days: 7
      action: "Increase cost threshold by 25%"
      example: "User confirms high_cost_purchase 5 times in 7 days → increase threshold $100 → $125"

    repeated_denial:
      threshold: 5
      time_window_days: 7
      action: "Decrease cost threshold by 25% or create block rule"
      example: "User denies share_personal_info 5 times → add to blocked_intents"

    always_allow_pattern:
      action: "Create exception rule"
      example: "User always allows purchases from Amazon → add Amazon to trusted_merchants"

  performance:
    confirmation_detection_latency_ms:
      p50: 2
      p95: 5
      p99: 10
      target: "<5ms for trigger detection"

    ui_presentation_latency_ms:
      p50: 50
      p95: 100
      p99: 200
      target: "<100ms for UI presentation"

  observability:
    metrics:
      - name: "proactive_confirmations_total"
        type: "counter"
        labels: ["trigger_type", "outcome"]
        description: "Total confirmation requests"

      - name: "proactive_confirmations_response_time_ms"
        type: "histogram"
        labels: ["trigger_type"]
        buckets: [1000, 5000, 10000, 30000, 60000]
        description: "Time for user to respond"

      - name: "proactive_confirmations_timeout_total"
        type: "counter"
        labels: ["trigger_type"]
        description: "Confirmations that timed out"

    logging:
      events:
        - event: "confirmation_requested"
          level: "info"
          fields:
            - "trigger_type"
            - "action_description"
            - "timeout_seconds"

        - event: "confirmation_responded"
          level: "info"
          fields:
            - "trigger_type"
            - "user_response"
            - "response_time_ms"

        - event: "confirmation_timeout"
          level: "warning"
          fields:
            - "trigger_type"
            - "default_action"

  storage:
    database: "SQLite"

    schema:
      confirmations:
        columns:
          confirmation_id: "TEXT PRIMARY KEY"
          trigger_type: "TEXT"
          action_description: "TEXT"
          user_response: "TEXT"
          response_time_ms: "INTEGER"
          timestamp_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_confirmations_timestamp ON confirmations(timestamp_ms)"
          - "CREATE INDEX idx_confirmations_trigger ON confirmations(trigger_type, timestamp_ms)"

  integration:
    input_sources:
      - name: "Intent Router"
        source: "k1/l1_input/intent_router.py"
        event: "INTENT_CLASSIFIED"

      - name: "Orchestrator"
        source: "k1/l2_orchestration/orchestrator_core.py"
        event: "ACTION_PLANNED"

      - name: "Tool Runner"
        source: "k1/l3_execution/tools/runner.py"
        event: "TOOL_EXECUTION_REQUESTED"

    output_consumers:
      - name: "Orchestrator"
        destination: "k1/l2_orchestration/orchestrator_core.py"
        event: "CONFIRMATION_RESULT"

      - name: "HITL Confirmation UI"
        destination: "k1/l1_input/meta_policy/hitl_confirmation.py"
        event: "CONFIRMATION_REQUESTED"

  related_contracts:
    - "confirmation_triggers.yml"
    - "hitl_confirmation.yml"
    - "inappropriate_action_detection.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
