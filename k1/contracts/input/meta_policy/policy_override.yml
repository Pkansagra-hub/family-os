policy_override:
  name: "Policy Override Contract"
  purpose: "Override mechanism for meta policy rules in emergency/admin situations"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/policy_override.py"
  capability: "Social Norm Modeling, Contextual Privacy, Proactive Confirmations"

  description: |
    Policy Override defines override mechanisms for meta policy rules,
    enabling emergency situations, administrative actions, and temporary exceptions.

    Key features:
    - Emergency override (immediate bypass)
    - Admin override (authorized bypass)
    - Temporary exceptions (time-bounded)
    - Override audit trail
    - Learning from overrides

  override_types:
    EMERGENCY_OVERRIDE:
      description: "Immediate bypass for emergency situations"

      priority: 1

      triggers:
        - "fire_alarm"
        - "medical_emergency"
        - "security_breach"
        - "child_in_danger"

      behavior:
        bypasses_all_norms: true
        bypasses_privacy_bands: true
        bypasses_confirmations: true
        requires_authorization: false

        audit_logging: "full"

        automatic_revert:
          enabled: true
          duration_seconds: 300
          require_explicit_end: true

      example:
        scenario: "Fire alarm triggers"
        action: "Unlock all doors, activate evacuation guidance"
        overridden_rules:
          - "privacy_band (RED → GREEN)"
          - "social_norms (all disabled)"
          - "confirmations (all disabled)"
        duration: "5 minutes or until 'emergency ended' command"

    ADMIN_OVERRIDE:
      description: "Authorized bypass for system administrators"

      priority: 2

      authorization_required:
        roles: ["admin", "parent"]

        authentication:
          methods:
            - "voice_biometrics"
            - "pin_code"
            - "mobile_app_confirmation"

          required_confidence: 0.95

          fallback: "Require 2 of 3 methods"

      capabilities:
        - "override_norm"
        - "override_privacy_band"
        - "bypass_confirmation"
        - "create_exception"
        - "modify_threshold"

      audit_requirements:
        log_level: "info"

        required_fields:
          - "admin_id"
          - "override_type"
          - "overridden_rule"
          - "reason"
          - "duration"

      example:
        scenario: "Parent allows late-night movie during sleepover"
        authorization:
          admin_id: "parent_john"
          method: "voice_biometrics"
          confidence: 0.98
        action: "Override quiet_hours norm"
        duration: "3 hours"
        reason: "Special occasion: sleepover"

    TEMPORARY_EXCEPTION:
      description: "Time-bounded exception to specific rule"

      priority: 3

      creation:
        methods:
          manual:
            command: "FamilyOS, ignore [rule] for [duration]"
            requires_confirmation: true

          automatic:
            trigger: "User overrides same rule 5 times in 7 days"
            requires_confirmation: true
            suggestion: "Create permanent exception for [rule]?"

      scope:
        specific_rule: true
        specific_context: true
        expiration: true

      duration_options:
        - "1 hour"
        - "Until end of day"
        - "Until [specific time]"
        - "Next 3 occurrences"

      automatic_revert:
        enabled: true
        notification: "Exception for [rule] has expired"

      example:
        scenario: "User repeatedly plays music during quiet hours"
        creation:
          trigger: "5 overrides in 7 days"
          suggestion: "Always allow music between 22:00-23:00?"
          user_response: "Yes, for next 2 weeks"
        exception:
          rule: "quiet_hours"
          specific_context: "time_range: 22:00-23:00"
          duration: "14 days"
          expires_at: "2025-11-05T22:00:00Z"

    USER_OVERRIDE:
      description: "User explicitly overrides a blocking decision"

      priority: 4

      mechanism:
        command: "FamilyOS, do it anyway"

        confirmation_required: true

        risk_disclosure: true

      learning_integration:
        track_override: true

        patterns:
          frequent_override:
            threshold: 5
            time_window_days: 7
            action: "Suggest creating exception or adjusting threshold"

          never_override:
            threshold_days: 30
            action: "Increase confidence or disable rule"

      limitations:
        cannot_override:
          - "safety_critical_actions"
          - "irreversible_actions (unless double-confirmed)"
          - "privacy_violations"

      example:
        scenario: "High-cost purchase blocked at $105"
        user_action: "FamilyOS, do it anyway"
        system_response: "This purchase costs $105. Confirm purchase?"
        user_confirmation: "Yes"
        learning: "Track override, consider increasing threshold"

  override_workflow:
    steps:
      - step: 1
        name: "Detect Override Request"
        description: "Parse user command or emergency trigger"

        inputs:
          - "User command"
          - "Emergency signal"
          - "Admin action"

        outputs:
          - "override_type"
          - "target_rule"
          - "requested_duration"

      - step: 2
        name: "Validate Authorization"
        description: "Check if requester is authorized"

        authorization_checks:
          EMERGENCY_OVERRIDE:
            required: false
            reason: "Emergency situations bypass authorization"

          ADMIN_OVERRIDE:
            required: true
            method: "voice_biometrics OR pin_code OR mobile_app"

          TEMPORARY_EXCEPTION:
            required: true
            method: "any_authenticated_user"

          USER_OVERRIDE:
            required: true
            method: "current_speaker_verified"

        failure_action: "Deny override, log attempt"

      - step: 3
        name: "Evaluate Risk"
        description: "Assess safety/privacy implications"

        risk_categories:
          safety_critical:
            examples: ["unlock_door_unverified", "disable_security"]
            action: "Require double-confirmation"

          privacy_violating:
            examples: ["share_personal_info", "downgrade_to_GREEN_with_visitors"]
            action: "Require explicit consent"

          irreversible:
            examples: ["delete_data", "send_bulk_messages"]
            action: "Require typed confirmation"

          low_risk:
            examples: ["adjust_volume", "defer_action"]
            action: "Allow immediately"

      - step: 4
        name: "Apply Override"
        description: "Temporarily disable target rule"

        actions:
          - "Disable rule checks for target rule"
          - "Set expiration timer"
          - "Log override event"
          - "Emit OVERRIDE_APPLIED event"

      - step: 5
        name: "Execute Overridden Action"
        description: "Allow action that was previously blocked"

        behavior:
          skip_checks: ["norm_check", "privacy_check"]
          still_check: ["capability_check", "safety_check"]

      - step: 6
        name: "Monitor Override Duration"
        description: "Track active overrides and revert when expired"

        monitoring:
          check_interval_seconds: 10

          on_expiration:
            - "Revert to normal policy enforcement"
            - "Log override_ended event"
            - "Emit OVERRIDE_EXPIRED event"
            - "Notify user: 'Override for [rule] has expired'"

      - step: 7
        name: "Learn from Override"
        description: "Update norm thresholds based on override patterns"

        learning_signals:
          frequent_override:
            weight: 0.8
            action: "Increase threshold or create exception"

          never_override:
            weight: 0.9
            action: "Decrease threshold or increase confidence"

  override_scope:
    by_rule_type:
      social_norms:
        overrideable: true
        requires_admin: false
        max_duration: "24 hours"

      privacy_bands:
        overrideable: true
        requires_admin: true
        max_duration: "1 hour"

        restrictions:
          cannot_downgrade_with_visitors: true
          cannot_disable_RED_during_financial: true

      confirmations:
        overrideable: true
        requires_admin: false
        max_duration: "1 occurrence"

        restrictions:
          cannot_bypass_irreversible: true
          cannot_bypass_safety_critical: true

      safety_rules:
        overrideable: false
        reason: "Safety rules cannot be overridden"

  override_storage:
    database: "SQLite"

    schema:
      overrides_table:
        columns:
          override_id:
            type: "TEXT PRIMARY KEY"
            description: "UUID"

          override_type:
            type: "TEXT NOT NULL"
            values: ["EMERGENCY", "ADMIN", "TEMPORARY_EXCEPTION", "USER"]

          target_rule:
            type: "TEXT NOT NULL"
            description: "Rule being overridden"

          admin_id:
            type: "TEXT"
            description: "Admin who authorized (if ADMIN_OVERRIDE)"

          reason:
            type: "TEXT"
            description: "Reason for override"

          created_at_ms:
            type: "INTEGER NOT NULL"
            description: "When override was created"

          expires_at_ms:
            type: "INTEGER NOT NULL"
            description: "When override expires"

          reverted_at_ms:
            type: "INTEGER"
            description: "When override was manually reverted"

          cognitive_trace_id:
            type: "TEXT"
            description: "Distributed tracing ID"

        indexes:
          - "CREATE INDEX idx_overrides_expires ON overrides(expires_at_ms)"
          - "CREATE INDEX idx_overrides_target_rule ON overrides(target_rule)"

  performance:
    override_request_latency_ms:
      p50: 10
      p95: 30
      p99: 50
      target: "<30ms to apply override"

    authorization_check_latency_ms:
      p50: 50
      p95: 100
      p99: 200
      target: "<100ms for biometric verification"

  observability:
    metrics:
      - name: "policy_overrides_applied_total"
        type: "counter"
        labels: ["override_type"]
        description: "Total overrides applied"

      - name: "policy_overrides_denied_total"
        type: "counter"
        labels: ["override_type", "denial_reason"]
        description: "Override requests denied"

      - name: "policy_overrides_active"
        type: "gauge"
        description: "Currently active overrides"

      - name: "policy_override_duration_seconds"
        type: "histogram"
        labels: ["override_type"]
        buckets: [60, 300, 900, 3600, 86400]
        description: "Override duration"

      - name: "authorization_check_latency_ms"
        type: "histogram"
        labels: ["method"]
        buckets: [10, 50, 100, 200, 500]
        description: "Authorization check latency"

  integration:
    input:
      from_modules:
        - name: "Social Norms"
          provides: "List of overrideable norms"

        - name: "Dynamic Privacy Adjuster"
          provides: "Current privacy band state"

        - name: "Proactive Confirmation"
          provides: "Pending confirmations to bypass"

    output:
      to_modules:
        - name: "Social Norms"
          sends: "Override directives"

        - name: "Dynamic Privacy Adjuster"
          sends: "Privacy band override commands"

        - name: "Proactive Confirmation"
          sends: "Confirmation bypass commands"

        - name: "Norm Modeler"
          sends: "Override events for learning"

  security:
    authorization:
      admin_roles:
        - "parent"
        - "system_admin"

      authentication_methods:
        voice_biometrics:
          confidence_threshold: 0.95
          fallback: "PIN code"

        pin_code:
          length: 6
          rate_limit: "3 attempts per 10 minutes"

        mobile_app:
          requires_device_authentication: true
          session_timeout_seconds: 300

    audit_trail:
      log_all_overrides: true

      retention_days: 90

      tamper_protection: true

      fields:
        - "override_id"
        - "timestamp"
        - "override_type"
        - "target_rule"
        - "admin_id"
        - "authorization_method"
        - "reason"
        - "duration"
        - "risk_level"

  privacy:
    data_handling:
      override_records:
        storage: "local"
        encryption: "AES-256"
        retention: "90 days"

      admin_ids:
        pseudonymization: true

      audit_logs:
        pii_redaction: true

  examples:
    emergency_override:
      scenario: "Fire alarm detected"
      trigger:
        event: "fire_alarm_signal"
        confidence: 1.0

      override:
        type: "EMERGENCY_OVERRIDE"
        target_rules: ["all_norms", "privacy_bands", "confirmations"]
        duration: "Until 'emergency ended' command"

      actions_enabled:
        - "Unlock all doors"
        - "Activate evacuation guidance"
        - "Call emergency services"
        - "Alert all family members"

      audit:
        logged: true
        notification: "Emergency override activated"

    admin_override_quiet_hours:
      scenario: "Parent allows late-night movie"

      command: "FamilyOS, ignore quiet hours for next 3 hours"

      authorization:
        admin_id: "parent_john"
        method: "voice_biometrics"
        confidence: 0.98

      override:
        type: "ADMIN_OVERRIDE"
        target_rule: "quiet_hours"
        duration: "10800 seconds"
        reason: "Special occasion"

      confirmation:
        prompt: "Allow movie until 01:00 AM?"
        response: "Yes"

      result:
        action: "Override applied"
        notification: "Quiet hours disabled until 01:00 AM"

    user_override_cost:
      scenario: "User repeatedly confirms $105 purchases"

      pattern_detected:
        overrides: 5
        time_window_days: 7

      suggestion:
        type: "TEMPORARY_EXCEPTION"
        prompt: "You've confirmed 5 purchases around $100. Increase threshold to $120?"
        options:
          - "Yes, for 1 month"
          - "Yes, permanently"
          - "No, keep asking"

      user_response: "Yes, for 1 month"

      exception_created:
        rule: "high_cost_threshold"
        new_threshold: 120
        duration: "30 days"
        expires_at: "2025-11-22T00:00:00Z"

  related_contracts:
    - "social_norms.yml"
    - "dynamic_privacy_adjuster.yml"
    - "proactive_confirmation.yml"
    - "meta_policy_event.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
