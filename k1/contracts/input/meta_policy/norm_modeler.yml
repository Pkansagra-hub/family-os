norm_modeler:
  name: "Norm Modeler Contract"
  purpose: "Learn and update social norms from family behavior patterns"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2 (Module #56)"
  module: "k1/l1_input/meta_policy/norm_modeler.py"
  capability: "Social Norm Modeling"

  description: |
    Norm Modeler observes family behavior patterns and adapts social norms over time.
    Uses explicit feedback (corrections, approvals), implicit feedback (overrides, adjustments),
    and behavioral patterns (usage frequency, timing) to refine norms.

    Key features:
    - Multi-signal learning (explicit, implicit, behavioral)
    - Exponential moving average updates
    - Threshold adjustment
    - Schedule optimization
    - Exception creation from patterns

  learning_signals:
    explicit_feedback:
      description: "Direct user corrections or approvals"
      weight: 1.0

      signal_types:
        correction:
          trigger: "User corrects norm violation"
          example: "User: 'Actually, it's fine to play music after 10pm on weekends'"
          learning_action: "Add exception: weekend_quiet_hours.start_time = 23:00"

        approval:
          trigger: "User approves norm enforcement"
          example: "User: 'Good call blocking that call during quiet hours'"
          learning_action: "Increase norm weight by learning_rate"

        disable:
          trigger: "User disables norm temporarily"
          example: "User: 'Disable quiet hours for tonight'"
          learning_action: "Log temporary override, check for pattern"

        enable:
          trigger: "User enables previously disabled norm"
          example: "User: 'Re-enable quiet hours'"
          learning_action: "Restore norm, increase weight"

    implicit_feedback:
      description: "User behavior without explicit feedback"
      weight: 0.5

      signal_types:
        repeated_override:
          trigger: "User overrides same norm multiple times"
          threshold: 5
          time_window_days: 7
          learning_action: "Adjust norm threshold or create exception"
          example: "User overrides high_cost_threshold 5 times in 7 days → increase threshold"

        parameter_adjustment:
          trigger: "User manually adjusts norm parameters"
          example: "User changes quiet_hours.start_time from 22:00 to 23:00"
          learning_action: "Update norm with new parameters"

        exception_creation:
          trigger: "User creates explicit exception"
          example: "User adds emergency_contact to no_phone_calls.exceptions"
          learning_action: "Store exception, apply to similar norms"

        norm_ignored:
          trigger: "Norm triggers but user takes no action"
          threshold: 10
          time_window_days: 30
          learning_action: "Reduce norm weight or disable"

    behavioral_patterns:
      description: "Observed usage patterns"
      weight: 0.2

      pattern_types:
        consistent_violation:
          trigger: "Family consistently violates norm at specific times"
          threshold: 10
          time_window_days: 14
          learning_action: "Adjust norm schedule or threshold"
          example: "Family plays music after 22:00 on Fridays → adjust quiet_hours for Fridays"

        never_triggered:
          trigger: "Norm never triggered in observation period"
          threshold_days: 30
          learning_action: "Mark norm as inactive, propose disabling"
          example: "daily_spend_limit never triggered in 30 days → propose increasing limit"

        high_false_positive:
          trigger: "Norm triggers but user proceeds anyway"
          false_positive_rate: 0.7
          threshold: 20
          learning_action: "Increase norm threshold or disable"
          example: "high_cost_threshold triggers 20 times, user proceeds 14 times → increase threshold"

  learning_algorithm:
    method: "exponential_moving_average"

    formula: "new_value = (1 - learning_rate) * old_value + learning_rate * feedback_signal"

    parameters:
      learning_rate:
        default: 0.1
        range: [0.01, 0.5]
        description: "How quickly norms adapt to new feedback"

      update_frequency: "weekly"

      min_observations:
        default: 10
        description: "Minimum observations before updating norm"

      max_weight:
        default: 2.0
        description: "Maximum norm weight multiplier"

      min_weight:
        default: 0.1
        description: "Minimum norm weight (below = disable)"

    convergence_criteria:
      stable_window_days: 14
      max_variance: 0.05
      description: "Norm considered stable if variance < 0.05 over 14 days"

  norm_adjustments:
    threshold_adjustment:
      description: "Adjust numeric thresholds based on usage"

      triggers:
        frequent_override:
          condition: "Override rate > 50% over 14 days"
          action: "Increase threshold by 25%"
          example: "high_cost_threshold: $100 → $125"

        never_triggered:
          condition: "Trigger rate = 0% over 30 days"
          action: "Propose increasing threshold"
          example: "daily_spend_limit: $500 → $750"

        always_blocks:
          condition: "Trigger rate > 80%, block rate = 100%"
          action: "Keep threshold (norm effective)"

      adjustment_formula: "new_threshold = old_threshold * (1 + adjustment_rate)"

      adjustment_rate:
        default: 0.25
        range: [0.1, 0.5]

    schedule_adjustment:
      description: "Adjust time-based schedules"

      triggers:
        bedtime_pattern:
          observation: "Family consistently awake past quiet_hours.start_time"
          action: "Shift start_time later by 1 hour"
          min_observations: 10
          example: "quiet_hours.start_time: 22:00 → 23:00"

        wake_pattern:
          observation: "Family consistently active before quiet_hours.end_time"
          action: "Shift end_time earlier by 30 minutes"
          min_observations: 10
          example: "quiet_hours.end_time: 07:00 → 06:30"

        weekend_difference:
          observation: "Different patterns on weekends vs weekdays"
          action: "Create separate weekend schedule"
          min_observations: 8
          example: "Create weekend_quiet_hours with different times"

    exception_creation:
      description: "Create norm exceptions from repeated overrides"

      triggers:
        contact_exception:
          pattern: "User overrides no_phone_calls for same contact 5 times"
          action: "Add contact to exceptions list"
          example: "no_phone_calls.exceptions += ['contact_uuid']"

        time_exception:
          pattern: "User overrides time_based norm at same time 5 times"
          action: "Create time-window exception"
          example: "quiet_hours.exceptions += [{time: '22:30-23:00', days: ['friday']}]"

        context_exception:
          pattern: "User overrides privacy norm in same context 5 times"
          action: "Create context exception"
          example: "visitors_present.exceptions += ['trusted_visitor_uuid']"

    norm_creation:
      description: "Create new norms from observed patterns"

      triggers:
        consistent_behavior:
          pattern: "Family consistently avoids certain actions at specific times"
          threshold: 20
          action: "Propose new time_based norm"
          example: "No TV during dinner (observed 20 times) → Create meal_time_no_tv norm"

        safety_incident:
          pattern: "Safety incident occurs"
          action: "Create safety_based norm immediately"
          example: "Child injury → Create child_safety norm for specific context"

  update_workflow:
    step_1:
      name: "Collect Observations"
      action: "Gather explicit, implicit, and behavioral signals"
      frequency: "continuous"
      storage: "observation_buffer (SQLite)"

    step_2:
      name: "Weekly Aggregation"
      action: "Aggregate observations from past week"
      frequency: "weekly (Sunday 00:00)"
      aggregations:
        - "Count overrides per norm"
        - "Calculate false positive rate"
        - "Identify behavioral patterns"

    step_3:
      name: "Compute Updates"
      action: "Calculate norm updates using EMA formula"
      conditions:
        - "min_observations >= 10"
        - "variance within convergence_criteria"
      outputs:
        - "threshold_adjustments"
        - "schedule_adjustments"
        - "new_exceptions"

    step_4:
      name: "Apply Updates"
      action: "Update norm definitions in database"
      safety_checks:
        - "Validate updated norm still makes sense"
        - "Check for conflicts with other norms"
        - "Ensure safety_based norms not weakened"

    step_5:
      name: "Notify Users"
      action: "Notify users of significant norm changes"
      notification_threshold: "threshold change > 30% or new exception"
      notification_message: "Social norm updated: [norm_name] - [change_description]"

  performance:
    observation_latency_ms:
      p50: 1
      p95: 2
      p99: 5
      target: "<2ms for observation logging"

    weekly_update_latency_ms:
      p50: 500
      p95: 1000
      p99: 2000
      target: "<1s for weekly aggregation"

    database_size_kb:
      observations_per_week: 5
      observations_retention_days: 90
      total_size_kb: 50

  observability:
    metrics:
      - name: "norm_modeler_observations_total"
        type: "counter"
        labels: ["signal_type", "norm_name"]
        description: "Total observations collected"

      - name: "norm_modeler_updates_total"
        type: "counter"
        labels: ["norm_name", "update_type"]
        description: "Total norm updates applied"

      - name: "norm_modeler_learning_rate"
        type: "gauge"
        labels: ["norm_name"]
        description: "Current learning rate per norm"

      - name: "norm_modeler_norm_weight"
        type: "gauge"
        labels: ["norm_name"]
        description: "Current norm weight"

    logging:
      events:
        - event: "observation_collected"
          level: "debug"
          fields:
            - "signal_type"
            - "norm_name"
            - "feedback_value"

        - event: "norm_updated"
          level: "info"
          fields:
            - "norm_name"
            - "update_type"
            - "old_value"
            - "new_value"

        - event: "exception_created"
          level: "info"
          fields:
            - "norm_name"
            - "exception_type"
            - "exception_value"

  storage:
    database: "SQLite"

    schema:
      observations:
        columns:
          observation_id: "TEXT PRIMARY KEY"
          norm_id: "TEXT FOREIGN KEY"
          signal_type: "TEXT (explicit, implicit, behavioral)"
          feedback_value: "REAL"
          context: "JSON"
          timestamp_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_observations_norm ON observations(norm_id, timestamp_ms)"
          - "CREATE INDEX idx_observations_timestamp ON observations(timestamp_ms)"

      norm_history:
        columns:
          history_id: "TEXT PRIMARY KEY"
          norm_id: "TEXT FOREIGN KEY"
          old_value: "JSON"
          new_value: "JSON"
          update_reason: "TEXT"
          timestamp_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_history_norm ON norm_history(norm_id, timestamp_ms)"

      norm_weights:
        columns:
          norm_id: "TEXT PRIMARY KEY"
          weight: "REAL"
          last_updated_ms: "INTEGER"

        indexes:
          - "CREATE INDEX idx_weights_updated ON norm_weights(last_updated_ms)"

  integration:
    input_sources:
      - name: "Social Norms"
        source: "k1/l1_input/meta_policy/social_norms.py"
        event: "NORM_VIOLATION"

      - name: "User Feedback"
        source: "k1/l4_runtime/learning/feedback_collector.py"
        event: "USER_FEEDBACK"

    output_consumers:
      - name: "Social Norms"
        destination: "k1/l1_input/meta_policy/social_norms.py"
        event: "NORM_UPDATED"

      - name: "Meta Policy Event Stream"
        destination: "SSE /api/v1/meta-policy/stream"
        event: "NORM_UPDATED"

  related_contracts:
    - "social_norms.yml"
    - "time_based_rules.yml"
    - "context_specific_behaviors.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
