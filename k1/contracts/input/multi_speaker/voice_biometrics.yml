voice_biometrics:
  name: "Voice Biometrics"
  purpose: "Voice biometric feature extraction and analysis for speaker identification"
  version: "1.0"
  adr_source: "ADR-0004 Amendment #2"
  module: "k1/l1_input/streams/operators/speaker_diarization.py"
  capability: "#11 Multi-Party Conversations"

  description: |
    Voice biometrics extracts unique vocal characteristics from audio to create
    speaker embeddings (d-vectors) for identification and verification.

    Core features:
    - 192-dimensional speaker embeddings (d-vectors)
    - Model: pyannote/wespeaker-voxceleb-resnet34-LM
    - Extraction latency: <50ms
    - Cosine similarity matching
    - Robust to noise (SNR >10dB)

    Use cases:
    - Speaker identification ("Who is speaking?")
    - Speaker verification ("Is this person X?")
    - Speaker diarization ("Who said what?")

  schema:
    type: "object"
    required: ["embedding", "audio_features", "quality_metrics", "timestamp_ms"]
    properties:
      embedding:
        type: "array"
        items:
          type: "number"
          format: "float32"
        minItems: 192
        maxItems: 192
        description: "Speaker embedding vector (192-dim d-vector)"

      audio_features:
        type: "object"
        description: "Acoustic features extracted from audio"
        properties:
          duration_seconds:
            type: "number"
            description: "Audio segment duration"
            minimum: 0.5
            maximum: 10.0

          sample_rate_hz:
            type: "integer"
            description: "Audio sample rate"
            examples: [16000, 48000]

          num_frames:
            type: "integer"
            description: "Number of audio frames"

          pitch_hz:
            type: "number"
            description: "Mean fundamental frequency (Hz)"
            examples: [85, 180, 255]

          formants:
            type: "array"
            items:
              type: "number"
            minItems: 4
            maxItems: 4
            description: "First 4 formant frequencies (Hz)"

          spectral_centroid_hz:
            type: "number"
            description: "Spectral centroid (brightness indicator)"

          zero_crossing_rate:
            type: "number"
            description: "Zero-crossing rate (voicing indicator)"

      quality_metrics:
        type: "object"
        description: "Audio quality metrics"
        properties:
          snr_db:
            type: "number"
            description: "Signal-to-noise ratio (dB)"
            minimum: -10
            maximum: 60

          clarity_score:
            type: "number"
            minimum: 0.0
            maximum: 1.0
            description: "Speech clarity score"

          speech_probability:
            type: "number"
            minimum: 0.0
            maximum: 1.0
            description: "Probability that audio contains speech"

          quality_flag:
            type: "string"
            enum: ["HIGH", "MEDIUM", "LOW", "UNACCEPTABLE"]
            description: "Overall quality assessment"

      timestamp_ms:
        type: "integer"
        format: "int64"
        description: "Embedding extraction timestamp"

  embedding_extraction:
    description: "Extract speaker embedding from audio segment"

    model:
      name: "pyannote/wespeaker-voxceleb-resnet34-LM"
      architecture: "ResNet-34"
      training_data: "VoxCeleb1 + VoxCeleb2 (7k+ speakers, 2M+ utterances)"
      embedding_dimension: 192
      input_format: "16kHz PCM audio"

    preprocessing:
      step_1:
        name: "Voice Activity Detection"
        action: "Detect speech segments in audio"
        model: "Silero VAD"
        output: "Speech timestamps"

      step_2:
        name: "Audio Segmentation"
        action: "Extract 3s speech segments"
        segment_duration: 3.0
        overlap: 0.5

      step_3:
        name: "Audio Normalization"
        action: "Normalize audio amplitude"
        target_rms: -20.0
        unit: "dBFS"

      step_4:
        name: "Feature Extraction"
        action: "Extract Mel-spectrogram"
        n_mels: 80
        n_fft: 512
        hop_length: 160

    embedding_extraction:
      step_1:
        name: "Model Forward Pass"
        action: "Pass Mel-spectrogram through ResNet-34"
        latency_ms: 45

      step_2:
        name: "Embedding Pooling"
        action: "Apply temporal pooling (mean + std)"
        output_dimension: 192

      step_3:
        name: "L2 Normalization"
        action: "Normalize embedding to unit sphere"
        formula: "embedding_norm = embedding / ||embedding||_2"
        latency_ms: 1

    total_latency_ms: 50

  similarity_computation:
    description: "Compute similarity between two speaker embeddings"

    distance_metric: "cosine_similarity"

    formula: |
      similarity = dot(embedding1, embedding2) / (||embedding1||_2 * ||embedding2||_2)

      For L2-normalized embeddings (||embedding|| = 1):
      similarity = dot(embedding1, embedding2)

    similarity_range: [-1.0, 1.0]

    interpretation:
      high_similarity:
        range: [0.75, 1.0]
        interpretation: "Same speaker"

      medium_similarity:
        range: [0.5, 0.75]
        interpretation: "Uncertain"

      low_similarity:
        range: [-1.0, 0.5]
        interpretation: "Different speakers"

    threshold:
      identification: 0.75
      verification: 0.8
      note: "Higher threshold for verification (lower false acceptance)"

    latency_ms: 10

  speaker_verification:
    description: "Verify if audio matches claimed speaker identity"

    workflow:
      step_1:
        name: "Extract Query Embedding"
        input: "Audio segment (3s)"
        output: "query_embedding (192-dim)"
        latency_ms: 50

      step_2:
        name: "Retrieve Reference Embedding"
        input: "speaker_id"
        output: "reference_embedding (192-dim)"
        latency_ms: 5

      step_3:
        name: "Compute Similarity"
        formula: "similarity = dot(query_embedding, reference_embedding)"
        latency_ms: 10

      step_4:
        name: "Threshold Decision"
        threshold: 0.8
        decision: "ACCEPT if similarity ≥ 0.8, else REJECT"
        latency_ms: 1

    total_latency_ms: 66

    performance:
      true_acceptance_rate: 0.95
      false_acceptance_rate: 0.01
      false_rejection_rate: 0.05

  speaker_identification:
    description: "Identify speaker from enrolled speaker database"

    workflow:
      step_1:
        name: "Extract Query Embedding"
        input: "Audio segment (3s)"
        output: "query_embedding (192-dim)"
        latency_ms: 50

      step_2:
        name: "Retrieve All Reference Embeddings"
        input: "speaker_database"
        output: "Array of (speaker_id, reference_embedding)"
        latency_ms: 5

      step_3:
        name: "Compute Similarities"
        formula: "similarities = [dot(query_embedding, ref_emb) for ref_emb in reference_embeddings]"
        latency_ms: 10
        note: "Vectorized computation for efficiency"

      step_4:
        name: "Select Best Match"
        action: "best_match = argmax(similarities)"
        threshold: 0.75
        decision: "Return speaker_id if similarity ≥ 0.75, else UNKNOWN"
        latency_ms: 5

    total_latency_ms: 70

    performance:
      identification_accuracy: 0.95
      identification_latency_ms: 70

  acoustic_features:
    fundamental_frequency:
      description: "Pitch (F0) - primary vocal cord vibration frequency"
      typical_ranges:
        adult_male: [85, 180]
        adult_female: [165, 255]
        child: [250, 400]
      unit: "Hz"
      extraction_method: "YIN algorithm"

    formants:
      description: "Resonant frequencies of vocal tract"

      formant_frequencies:
        F1:
          description: "First formant (tongue height)"
          typical_range: [200, 1000]
          unit: "Hz"

        F2:
          description: "Second formant (tongue position)"
          typical_range: [600, 2500]
          unit: "Hz"

        F3:
          description: "Third formant (lip rounding)"
          typical_range: [1400, 3500]
          unit: "Hz"

        F4:
          description: "Fourth formant"
          typical_range: [2500, 4500]
          unit: "Hz"

      extraction_method: "Linear Predictive Coding (LPC)"

    spectral_centroid:
      description: "Center of mass of spectrum (brightness)"
      typical_range: [1000, 4000]
      unit: "Hz"
      interpretation: "Higher values = brighter, sharper voice"

    zero_crossing_rate:
      description: "Rate of sign changes in signal"
      typical_range: [0.01, 0.5]
      unit: "crossings per sample"
      interpretation: "Higher values = more high-frequency content"

    mel_frequency_cepstral_coefficients:
      description: "MFCCs capture spectral envelope"
      num_coefficients: 13
      typical_usage: "Feature input to embedding model"

  quality_assessment:
    snr_thresholds:
      excellent: ">30dB"
      good: "20-30dB"
      fair: "10-20dB"
      poor: "0-10dB"
      unacceptable: "<0dB"

    clarity_score:
      computation: "Spectral flatness + harmonic-to-noise ratio"
      thresholds:
        high: ">0.8"
        medium: "0.6-0.8"
        low: "0.4-0.6"
        unacceptable: "<0.4"

    speech_probability:
      computation: "VAD confidence score"
      threshold: 0.7
      note: "Reject if speech_probability <0.7"

  robustness:
    noise_robustness:
      snr_requirement: ">10dB"
      degradation: "Accuracy drops from 0.95 to 0.85 at SNR=10dB"
      mitigation: "Noise reduction preprocessing (Wiener filter)"

    channel_robustness:
      description: "Robust to different microphones and recording conditions"
      training_data: "VoxCeleb includes diverse channels (phone, studio, outdoor)"

    language_robustness:
      description: "Language-independent speaker embeddings"
      training_data: "Multi-lingual VoxCeleb dataset"

  performance:
    embedding_extraction_latency_ms:
      p50: 45
      p95: 50
      p99: 60

    similarity_computation_latency_ms: 10

    verification_latency_ms: 66
    identification_latency_ms: 70

    memory_per_embedding_kb: 0.75

  observability:
    metrics:
      - name: "voice_embeddings_extracted_total"
        type: "counter"
        labels: ["quality_flag"]
        description: "Total voice embeddings extracted"

      - name: "voice_embedding_extraction_latency_ms"
        type: "histogram"
        buckets: [30, 50, 70, 100, 150]
        description: "Embedding extraction latency"

      - name: "voice_similarity_scores"
        type: "histogram"
        buckets: [0.0, 0.25, 0.5, 0.75, 0.9, 1.0]
        description: "Distribution of similarity scores"

      - name: "voice_audio_quality_snr_db"
        type: "gauge"
        description: "Current audio SNR"

  example_embeddings:
    dad_voice:
      embedding: [0.12, -0.34, 0.56, 0.23, "..."] # 192-dim
      audio_features:
        duration_seconds: 3.0
        sample_rate_hz: 16000
        num_frames: 48000
        pitch_hz: 120
        formants: [650, 1080, 2450, 3300]
        spectral_centroid_hz: 2100
        zero_crossing_rate: 0.08
      quality_metrics:
        snr_db: 25.5
        clarity_score: 0.87
        speech_probability: 0.95
        quality_flag: "HIGH"
      timestamp_ms: 1698364800000

    mom_voice:
      embedding: [0.08, -0.42, 0.33, 0.19, "..."] # 192-dim
      audio_features:
        duration_seconds: 3.0
        sample_rate_hz: 16000
        pitch_hz: 210
        formants: [730, 1220, 2650, 3500]
        spectral_centroid_hz: 2600
        zero_crossing_rate: 0.12
      quality_metrics:
        snr_db: 28.2
        clarity_score: 0.91
        speech_probability: 0.97
        quality_flag: "HIGH"
      timestamp_ms: 1698364805000

  related_contracts:
    - "speaker_identification.yml"
    - "speaker_enrollment.yml"
    - "diarization_event.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition"
      author: "Contract Development Team"
