transition_manager_contract:
  name: "Transition Manager"
  purpose: "Detect, track, and manage modality transitions with context synchronization"
  version: "1.0"
  adr_source: "ADR-0004f"
  module: "k1/l1_input/streams/stream_switch/"
  capability: "#1 Cross-Modal Continuity"

  description: |
    The Transition Manager is responsible for:
    1. Detecting modality transitions in real-time (<5ms P95)
    2. Triggering context preservation workflows
    3. Synchronizing SessionState across transitions
    4. Maintaining transition history for analytics
    5. Optimizing transition patterns for UX

  architecture:
    pattern: "Observer pattern with state machine"
    state_machine:
      states: ["IDLE", "ACTIVE_VOICE", "ACTIVE_TEXT", "ACTIVE_IMAGE", "ACTIVE_TOUCH", "ACTIVE_LOCATION", "TRANSITIONING"]
      initial_state: "IDLE"
      transitions:
        - from: "IDLE"
          to: "ACTIVE_*"
          trigger: "First input received"

        - from: "ACTIVE_*"
          to: "ACTIVE_*"
          trigger: "Modality change detected"
          via: "TRANSITIONING"

        - from: "ACTIVE_*"
          to: "IDLE"
          trigger: "Session timeout (30s inactivity)"

  api_contract:
    detect_transition:
      description: "Detect and process a modality transition"
      signature: "async fn detect_transition(new_input: UnifiedInput, previous_input: Option<UnifiedInput>) -> Option<ModalityTransition>"
      parameters:
        new_input:
          type: "UnifiedInput"
          description: "Current input being processed"
        previous_input:
          type: "Option<UnifiedInput>"
          description: "Previous input (if available)"
      returns:
        type: "Option<ModalityTransition>"
        description: "Transition event if detected, None otherwise"
      performance:
        latency_p95_ms: 5
      algorithm: |
        1. Check if previous_input exists
        2. Compare modalities (new_input.modality != previous_input.modality)
        3. Calculate gap duration (new_input.timestamp_ms - previous_input.timestamp_ms)
        4. Classify transition type (EXPLICIT, IMPLICIT, TIMEOUT)
        5. Create ModalityTransition event
        6. Emit metrics and traces

    synchronize_context:
      description: "Synchronize context across modality transition"
      signature: "async fn synchronize_context(transition: ModalityTransition) -> Result<(), TransitionError>"
      parameters:
        transition:
          type: "ModalityTransition"
          description: "Transition event to process"
      returns:
        success: "void"
        error:
          type: "TransitionError"
          codes:
            - CONTEXT_SYNC_FAILED: "Failed to sync context"
            - SESSION_STATE_UNAVAILABLE: "SessionState unavailable"
      performance:
        latency_p95_ms: 10
      side_effects:
        - "Updates SessionState beliefs section"
        - "Copies relevant entities to new modality context"
        - "Preserves last N inputs in working memory"

    get_transition_history:
      description: "Retrieve transition history for a session"
      signature: "fn get_transition_history(session_id: Uuid, limit: usize) -> Vec<ModalityTransition>"
      parameters:
        session_id:
          type: "Uuid"
          description: "Session identifier"
        limit:
          type: "usize"
          default: 10
          max: 100
      returns:
        type: "Vec<ModalityTransition>"
        description: "Recent transitions (newest first)"
      performance:
        latency_p95_ms: 2

    predict_next_transition:
      description: "Predict likely next transition for pre-warming"
      signature: "fn predict_next_transition(session_id: Uuid, current_modality: Modality) -> Option<Modality>"
      parameters:
        session_id:
          type: "Uuid"
        current_modality:
          type: "Modality"
      returns:
        type: "Option<Modality>"
        description: "Predicted next modality (if confidence > 0.7)"
      note: "ML-based prediction for resource pre-warming"

  detection_logic:
    detection_algorithm:
      name: "Gap-based with pattern recognition"
      steps:
        - step: 1
          name: "Modality comparison"
          condition: "current.modality != previous.modality"
          action: "Transition detected"

        - step: 2
          name: "Gap duration calculation"
          formula: "gap_ms = current.timestamp_ms - previous.timestamp_ms"

        - step: 3
          name: "Transition type classification"
          rules:
            - condition: "gap_ms < 100"
              type: "IMPLICIT"
              description: "Rapid switch, likely user intent"

            - condition: "100 <= gap_ms < 5000"
              type: "EXPLICIT"
              description: "Deliberate modality change"

            - condition: "gap_ms >= 30000"
              type: "TIMEOUT"
              description: "Long gap, context may be stale"

        - step: 4
          name: "Context preservation decision"
          rules:
            - condition: "gap_ms < 5000"
              preserve: true
              confidence: 1.0

            - condition: "5000 <= gap_ms < 30000"
              preserve: true
              confidence: "exponential_decay(gap_ms, half_life=10000)"

            - condition: "gap_ms >= 30000"
              preserve: false
              confidence: 0.0

    common_patterns:
      voice_text_oscillation:
        description: "User switches between voice and text frequently"
        pattern: "VOICE → TEXT → VOICE → TEXT"
        frequency: "High (30% of sessions)"
        optimization: "Keep both modalities warm"

      image_elaboration:
        description: "User shares image, then elaborates with voice/text"
        pattern: "IMAGE → VOICE/TEXT"
        frequency: "Medium (15% of sessions)"
        optimization: "Pre-load vision model, keep voice/text ready"

      location_context:
        description: "Location input precedes voice/text query"
        pattern: "LOCATION → VOICE/TEXT"
        frequency: "Low (5% of sessions)"
        optimization: "Inject location into context"

  context_synchronization:
    strategy: "Copy-on-transition with decay"

    sync_workflow:
      - step: 1
        name: "Retrieve previous context"
        source: "SessionState beliefs section"
        fields: ["active_entities", "current_intent", "working_memory"]

      - step: 2
        name: "Apply decay function"
        formula: "relevance = base_relevance * exp(-gap_ms / half_life)"
        half_life_ms: 10000
        note: "Context relevance decays over time"

      - step: 3
        name: "Copy relevant entities"
        rules:
          - "Copy entities with relevance > 0.3"
          - "Always copy top 3 entities by relevance"
          - "Link new input to previous input via context_refs"

      - step: 4
        name: "Update SessionState"
        fields:
          - "beliefs.active_entities = filtered_entities"
          - "beliefs.current_modality = new_modality"
          - "beliefs.last_transition = transition_event"

      - step: 5
        name: "Emit transition event"
        destination: "Event Bus (SSE)"
        event_type: "ModalityTransitionEvent"

    entity_linking:
      description: "Link entities across modality transitions"
      rules:
        - name: "Pronoun resolution"
          pattern: "VOICE 'that' → last IMAGE/TEXT entity"
          example: "User: 'Show me that' (voice) → refers to last image"

        - name: "Demonstrative linking"
          pattern: "TEXT 'this' → last VOICE/IMAGE entity"
          example: "User: 'Tell me about this' (text) → refers to last voice topic"

        - name: "Spatial reference"
          pattern: "LOCATION + VOICE 'here' → spatial entity"
          example: "User: 'What's happening here?' (voice + location)"

  performance_optimization:
    pre_warming:
      description: "Pre-warm resources for likely next transition"
      strategy: "ML-based prediction"
      triggers:
        - "High-frequency transition patterns detected"
        - "User pattern learned (e.g., always uses voice after text)"
      actions:
        - "Pre-allocate buffers for predicted modality"
        - "Warm up processors (VAD, ASR, Vision)"
        - "Pre-fetch context from K0"

    caching:
      description: "Cache transition contexts for fast sync"
      cache_size: 100
      eviction_policy: "LRU"
      hit_rate_target: 0.75

  performance_budgets:
    detection_latency_ms:
      p50: 2
      p95: 5
      p99: 8
      max: 10

    sync_latency_ms:
      p50: 5
      p95: 10
      p99: 15
      max: 20

    total_transition_overhead_ms:
      target: 15
      formula: "detection + sync = 5 + 10 = 15ms"

  observability:
    metrics:
      - name: "transition_manager_detections_total"
        type: "counter"
        labels: ["from_modality", "to_modality", "transition_type"]
        description: "Total transitions detected"

      - name: "transition_manager_detection_latency_ms"
        type: "histogram"
        labels: ["from_modality", "to_modality"]
        buckets: [1, 2, 5, 10, 20, 50]
        description: "Detection latency P50/P95/P99"

      - name: "transition_manager_sync_latency_ms"
        type: "histogram"
        labels: ["transition_type"]
        buckets: [2, 5, 10, 20, 50]
        description: "Context synchronization latency"

      - name: "transition_manager_context_preservation_rate"
        type: "gauge"
        labels: ["from_modality", "to_modality"]
        description: "% of transitions with successful context preservation"

      - name: "transition_manager_prediction_accuracy"
        type: "gauge"
        labels: []
        description: "Accuracy of next transition predictions"

    tracing:
      span_name: "transition_manager.detect_and_sync"
      attributes:
        - "from_modality"
        - "to_modality"
        - "transition_type"
        - "gap_duration_ms"
        - "context_preserved"
        - "entities_copied"

    logging:
      level: "INFO"
      events:
        - event: "transition_detected"
          fields: ["from_modality", "to_modality", "gap_ms", "type"]

        - event: "context_synchronized"
          fields: ["transition_id", "entities_copied", "sync_latency_ms"]

        - event: "context_sync_failed"
          level: "ERROR"
          fields: ["transition_id", "error"]

  related_contracts:
    - "unified_input.yml"
    - "modality_transition.yml"
    - "multi_modal_bus.yml"
    - "context_preserver.yml"

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition from ADR-0004f"
      author: "Contract Development Team"
