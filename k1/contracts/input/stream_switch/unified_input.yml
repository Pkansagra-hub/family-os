unified_input_schema:
  name: "UnifiedInput"
  purpose: "Multi-modal input representation for cross-modal continuity"
  version: "1.0"
  adr_source: "ADR-0004f"
  module: "k1/l1_input/streams/stream_switch/"
  capability: "#1 Cross-Modal Continuity"

  schema:
    input_id:
      type: "string"
      format: "uuid"
      required: true
      description: "Unique input identifier"
      example: "inp_7f3d9e4c-5a1b-4c8e-9f2a-1b3c4d5e6f7g"

    session_id:
      type: "string"
      format: "uuid"
      required: true
      description: "Session identifier for context grouping"
      example: "sess_abc123"

    timestamp_ms:
      type: "integer"
      format: "int64"
      required: true
      description: "Unix timestamp in milliseconds"
      example: 1729641600000

    modality:
      type: "enum"
      values: ["VOICE", "TEXT", "IMAGE", "TOUCH", "LOCATION"]
      required: true
      description: "Input modality type"
      example: "VOICE"

    content:
      type: "any"
      required: true
      description: "Modality-specific payload (string for text, bytes for audio/image)"
      note: "Type determined by modality field"

    context_refs:
      type: "array"
      items: "string"
      required: false
      description: "References to previous inputs for cross-modal linking"
      example: ["inp_previous_123", "inp_previous_456"]
      use_case: "Link 'show me that' (voice) to previously displayed image"

    cognitive_trace_id:
      type: "string"
      format: "uuid"
      required: true
      description: "Tracing identifier for observability"
      example: "trace_xyz789"

    metadata:
      type: "object"
      required: false
      description: "Additional modality-specific metadata"
      fields:
        - name: "device_id"
          type: "string"
          description: "Source device identifier"
        - name: "user_id"
          type: "string"
          description: "User identifier"
        - name: "confidence"
          type: "float"
          range: [0.0, 1.0]
          description: "Input quality/confidence score"

  modalities:
    VOICE:
      content_type: "AudioPayload"
      description: "Voice input from microphone"
      schema:
        audio_data:
          type: "bytes"
          encoding: "base64"
        sample_rate_hz:
          type: "integer"
          default: 16000
          allowed: [8000, 16000, 22050, 44100, 48000]
        encoding:
          type: "string"
          default: "PCM_16LE"
          allowed: ["PCM_16LE", "PCM_32LE", "OPUS", "AAC"]
        channels:
          type: "integer"
          default: 1
          allowed: [1, 2]
        duration_ms:
          type: "integer"
          description: "Audio duration in milliseconds"
        vad_segments:
          type: "array"
          items: "object"
          description: "Voice activity detection segments"
          fields:
            - start_ms: "integer"
            - end_ms: "integer"
            - confidence: "float"

    TEXT:
      content_type: "string"
      description: "Text input from keyboard or transcription"
      schema:
        text:
          type: "string"
          max_length: 10000
          encoding: "UTF-8"
        language:
          type: "string"
          format: "ISO-639-1"
          example: "en"
        input_method:
          type: "enum"
          values: ["keyboard", "voice_transcription", "clipboard", "other"]

    IMAGE:
      content_type: "ImagePayload"
      description: "Image input from camera or file"
      schema:
        image_data:
          type: "bytes"
          encoding: "base64"
        format:
          type: "enum"
          values: ["JPEG", "PNG", "WEBP", "HEIC"]
        width:
          type: "integer"
          description: "Image width in pixels"
        height:
          type: "integer"
          description: "Image height in pixels"
        max_size_kb:
          type: "integer"
          default: 5000
        source:
          type: "enum"
          values: ["camera", "file_upload", "screen_capture", "clipboard"]

    TOUCH:
      content_type: "TouchPayload"
      description: "Touch/gesture input from touchscreen"
      schema:
        coordinates:
          type: "object"
          fields:
            - x: "float"
            - y: "float"
        gesture:
          type: "enum"
          values: ["tap", "double_tap", "swipe", "long_press", "pinch", "rotate"]
        gesture_direction:
          type: "enum"
          values: ["up", "down", "left", "right", "in", "out"]
          optional: true
        pressure:
          type: "float"
          range: [0.0, 1.0]
          optional: true

    LOCATION:
      content_type: "LocationPayload"
      description: "Location input from GPS/WiFi/cell tower"
      schema:
        latitude:
          type: "float64"
          range: [-90.0, 90.0]
        longitude:
          type: "float64"
          range: [-180.0, 180.0]
        accuracy_meters:
          type: "float32"
          description: "Horizontal accuracy in meters"
        altitude_meters:
          type: "float32"
          optional: true
        bearing_degrees:
          type: "float32"
          range: [0.0, 360.0]
          optional: true
        speed_mps:
          type: "float32"
          optional: true
          description: "Speed in meters per second"

  performance:
    acceptance_latency_ms: 1
    description: "P95 latency for accepting input into stream switch"
    ring_buffer_size: 1000
    zero_copy: true
    memory_budget_kb: 512
    note: "Zero-copy for VOICE/IMAGE payloads to minimize latency"

  observability:
    metrics:
      - name: "stream_switch_inputs_total"
        type: "counter"
        labels: ["modality", "device_id"]
        description: "Total inputs received by modality"

      - name: "stream_switch_acceptance_latency_ms"
        type: "histogram"
        labels: ["modality"]
        buckets: [0.5, 1, 2, 5, 10, 50]
        description: "Input acceptance latency P50/P95/P99"

      - name: "stream_switch_input_size_bytes"
        type: "histogram"
        labels: ["modality"]
        buckets: [100, 1000, 10000, 100000, 1000000]
        description: "Input payload size distribution"

      - name: "stream_switch_context_refs_count"
        type: "histogram"
        labels: ["modality"]
        buckets: [0, 1, 2, 5, 10]
        description: "Number of context references per input"

    tracing:
      span_name: "stream_switch.accept_input"
      attributes:
        - "modality"
        - "session_id"
        - "input_id"
        - "has_context_refs"
        - "payload_size_bytes"

    logging:
      level: "INFO"
      fields:
        - "input_id"
        - "session_id"
        - "modality"
        - "timestamp_ms"
        - "context_refs_count"
        - "cognitive_trace_id"

  validation_rules:
    - rule: "timestamp_ms > 0"
      error_code: "INVALID_TIMESTAMP"
      message: "Timestamp must be positive Unix timestamp"

    - rule: "modality in [VOICE, TEXT, IMAGE, TOUCH, LOCATION]"
      error_code: "INVALID_MODALITY"
      message: "Modality must be one of supported types"

    - rule: "input_id matches UUID format"
      error_code: "INVALID_INPUT_ID"
      message: "Input ID must be valid UUID"

    - rule: "session_id matches UUID format"
      error_code: "INVALID_SESSION_ID"
      message: "Session ID must be valid UUID"

    - rule: "VOICE: sample_rate_hz in [8000, 16000, 22050, 44100, 48000]"
      error_code: "INVALID_SAMPLE_RATE"
      message: "Voice sample rate must be standard audio rate"

    - rule: "IMAGE: size <= 5MB"
      error_code: "IMAGE_TOO_LARGE"
      message: "Image size must not exceed 5MB"

    - rule: "TEXT: length <= 10000 characters"
      error_code: "TEXT_TOO_LONG"
      message: "Text input must not exceed 10,000 characters"

  related_contracts:
    - "modality_transition.yml"
    - "multi_modal_bus.yml"
    - "context_preserver.yml"
    - "transition_manager.yml"

  usage_examples:
    voice_input: |
      {
        "input_id": "inp_voice_001",
        "session_id": "sess_abc123",
        "timestamp_ms": 1729641600000,
        "modality": "VOICE",
        "content": {
          "audio_data": "base64_encoded_audio...",
          "sample_rate_hz": 16000,
          "encoding": "PCM_16LE",
          "channels": 1,
          "duration_ms": 3500
        },
        "context_refs": [],
        "cognitive_trace_id": "trace_xyz789"
      }

    text_followup: |
      {
        "input_id": "inp_text_002",
        "session_id": "sess_abc123",
        "timestamp_ms": 1729641603500,
        "modality": "TEXT",
        "content": {
          "text": "Show me that recipe again",
          "language": "en",
          "input_method": "keyboard"
        },
        "context_refs": ["inp_voice_001"],
        "cognitive_trace_id": "trace_xyz789"
      }

    image_reference: |
      {
        "input_id": "inp_image_003",
        "session_id": "sess_abc123",
        "timestamp_ms": 1729641610000,
        "modality": "IMAGE",
        "content": {
          "image_data": "base64_encoded_image...",
          "format": "JPEG",
          "width": 1920,
          "height": 1080,
          "source": "camera"
        },
        "context_refs": ["inp_text_002"],
        "cognitive_trace_id": "trace_xyz789",
        "metadata": {
          "device_id": "device_dad_phone",
          "user_id": "user_dad",
          "confidence": 0.95
        }
      }

  changelog:
    - version: "1.0"
      date: "2025-10-22"
      changes: "Initial contract definition from ADR-0004f"
      author: "Contract Development Team"
