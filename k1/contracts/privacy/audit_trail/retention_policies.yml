legal_hold_procedures:
  description: "Legal hold procedures for retention policy suspension"
  triggers: |
    - Court order or legal subpoena
    - Regulatory investigation
    - Internal compliance review

  implementation: |
    - Mark user/space with legal hold flag
    - Suspend automated cleanup for affected data
    - Log legal hold establishment
    - Manual review required for hold release

compliance_auditing:
  retention_audit_checks: |
    - Verify HIPAA 6-year retention compliance
    - Verify GDPR 90-day operational retention
    - Check for unauthorized early deletion
    - Validate legal hold enforcement

  audit_report_generation: |
    - Monthly retention compliance report
    - Annual regulatory audit preparation
    - Automated violation alerts
    - Manual audit trail review

testing_scenarios:
  unit_tests:
    - test_retention_policy_calculation
    - test_cleanup_cycle_execution
    - test_compliance_verification
    - test_legal_hold_enforcement

  integration_tests:
    - test_full_cleanup_workflow
    - test_retention_policy_api
    - test_hipaa_retention_verification
    - test_gdpr_cleanup_compliance

  compliance_tests:
    - test_hipaa_6_year_retention
    - test_gdpr_90_day_operational_retention
    - test_legal_hold_prevents_cleanup
    - test_cleanup_audit_trail_integrity
