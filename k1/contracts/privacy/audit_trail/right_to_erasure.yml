# Right to Erasure Contract
# Source ADR: 0035d-audit-trail-gdpr-compliance.md
# Epic 2.9, Issue 2.9.4
# Purpose: GDPR Article 17 implementation - user can delete all their PII data

contract:
  name: right_to_erasure
  version: "1.0.0"
  source_adr: "0035d-audit-trail-gdpr-compliance.md"
  epic: "2.9"
  issue: "2.9.4"

gdpr_article_17:
  title: "Right to erasure ('right to be forgotten')"
  summary: "Data subject has right to obtain erasure of personal data without undue delay"
  response_time: "30 days from request"
  cost: "Free"
  exceptions: ["Legal obligation", "Public interest", "Legal claims", "Research purposes"]

erasure_request_workflow:
  step_1_request:
    description: "User submits erasure request"
    methods: ["Web portal", "API endpoint", "Email request"]
    validation: ["User authentication", "Rate limiting (1/month)", "No duplicate pending"]

  step_2_processing:
    description: "Process request with 30-day grace period"
    operations:
      - "Query audit_log for user's vault keys"
      - "Soft delete PII from vault (30-day grace period)"
      - "Delete audit log entries"
      - "Update request status"
    performance_budget: "<5 seconds"

  step_3_notification:
    description: "Notify user of completion"
    email_template: |
      Subject: GDPR Right to Erasure - Request Fulfilled

      Your request for erasure of personal data has been processed.

      The following data has been deleted:
      - {pii_deleted} PII records from vault
      - {audit_deleted} audit log entries

      All your personal data has been permanently erased from our systems.

      Request ID: {request_id}
      Processed: {fulfilled_at}
    retention: "Email confirmation retained for 7 years"

soft_delete_grace_period:
  duration: "30 days"
  purpose: "Allow user to change mind, comply with legal holds"
  operations:
    - "PII marked as deleted_at = timestamp"
    - "PII still recoverable during grace period"
    - "User notified of grace period"
    - "Automatic hard delete after 30 days"

  recovery_process:
    description: "User can cancel erasure during grace period"
    steps:
      - "Contact support with request ID"
      - "Verify user identity"
      - "Clear deleted_at timestamp"
      - "Restore access to PII"

hard_delete_process:
  trigger: "30 days after soft delete OR immediate hard delete request"
  operations:
    - "Permanent deletion from vault"
    - "Permanent deletion from audit log"
    - "Cryptographic erasure (overwrite with random data)"
    - "Update compliance metrics"

  cryptographic_erasure:
    description: "Secure deletion to prevent forensic recovery"
    method: "Multiple pass overwrite with random data"
    passes: 3
    standards: "NIST SP 800-88 Guidelines for Media Sanitization"

rust_implementation:
  erasure_request_handler: |
    use crate::privacy::gdpr_compliance::GDPRCompliance;
    use crate::privacy::audit_logger::AuditLogger;
    use crate::privacy::pii_vault::PIIVault;
    use std::sync::Arc;
    use std::time::{SystemTime, UNIX_EPOCH, Duration};

    pub struct RightToErasureHandler {
        gdpr: Arc<GDPRCompliance>,
        audit_logger: Arc<AuditLogger>,
        pii_vault: Arc<PIIVault>,
    }

    impl RightToErasureHandler {
        /// Process GDPR right to erasure request
        pub async fn process_erasure_request(
            &self,
            user_id: &str,
            space_id: &str,
            trace_id: &str,
            immediate_hard_delete: bool,
        ) -> Result<ErasureResponse, Box<dyn std::error::Error>> {
            let start = std::time::Instant::now();

            println!(
                "[RightToErasure] Processing erasure request for user {} (hard_delete: {}, trace: {})",
                user_id,
                immediate_hard_delete,
                trace_id
            );

            // Step 1: Query audit log for all vault keys
            let audit_entries = self.audit_logger.query_user_audit_log(user_id, space_id).await?;

            let mut vault_keys_to_delete = Vec::new();
            for entry in &audit_entries {
                if let Some(vault_key) = &entry.vault_key {
                    vault_keys_to_delete.push(vault_key.clone());
                }
            }

            let vault_keys_count = vault_keys_to_delete.len();

            // Step 2: Delete PII from vault
            let mut pii_deleted = 0;
            let mut vault_errors = Vec::new();

            if immediate_hard_delete {
                // Immediate hard delete
                for vault_key in &vault_keys_to_delete {
                    match self.pii_vault.hard_delete(vault_key, user_id, space_id, trace_id).await {
                        Ok(_) => {
                            pii_deleted += 1;
                        }
                        Err(e) => {
                            eprintln!(
                                "[RightToErasure] Failed to hard delete PII for key {}: {}",
                                vault_key, e
                            );
                            vault_errors.push(format!("{}: {}", vault_key, e));
                        }
                    }
                }
            } else {
                // Soft delete with grace period
                let grace_period_end = SystemTime::now()
                    .duration_since(UNIX_EPOCH)?
                    .as_millis() as i64 + (30 * 24 * 60 * 60 * 1000); // 30 days

                for vault_key in &vault_keys_to_delete {
                    match self.pii_vault.soft_delete(vault_key, user_id, space_id, trace_id, grace_period_end).await {
                        Ok(_) => {
                            pii_deleted += 1;
                        }
                        Err(e) => {
                            eprintln!(
                                "[RightToErasure] Failed to soft delete PII for key {}: {}",
                                vault_key, e
                            );
                            vault_errors.push(format!("{}: {}", vault_key, e));
                        }
                    }
                }
            }

            // Step 3: Delete audit log entries
            let audit_deleted = self.audit_logger.delete_user_audit_log(user_id, space_id).await?;

            // Step 4: Generate response
            let response = ErasureResponse {
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                fulfilled_at: SystemTime::now()
                    .duration_since(UNIX_EPOCH)?
                    .as_millis() as i64,
                pii_deleted,
                audit_deleted,
                vault_keys_deleted: vault_keys_to_delete,
                immediate_hard_delete,
                grace_period_days: if immediate_hard_delete { 0 } else { 30 },
                errors: vault_errors,
            };

            let process_ms = start.elapsed().as_millis();

            println!(
                "[RightToErasure] Fulfilled erasure request for user {}: {} PII deleted, {} audit entries deleted (hard_delete: {}, {}ms) (trace: {})",
                user_id,
                response.pii_deleted,
                response.audit_deleted,
                immediate_hard_delete,
                process_ms,
                trace_id
            );

            // Validate performance budget (<5s)
            if process_ms > 5000 {
                eprintln!(
                    "[RightToErasure] WARNING: Erasure request exceeded 5s budget ({}ms)",
                    process_ms
                );
            }

            // Emit metrics
            metrics::histogram!("gdpr_erasure_request_duration_ms").record(process_ms as f64);
            metrics::counter!("gdpr_erasure_requests_total").increment(1);
            metrics::histogram!("gdpr_erasure_pii_deleted_per_request").record(pii_deleted as f64);
            metrics::histogram!("gdpr_erasure_audit_deleted_per_request").record(audit_deleted as f64);

            Ok(response)
        }

        /// Cancel erasure during grace period
        pub async fn cancel_erasure(
            &self,
            user_id: &str,
            space_id: &str,
            trace_id: &str,
        ) -> Result<CancelErasureResponse, Box<dyn std::error::Error>> {
            println!(
                "[RightToErasure] Canceling erasure for user {} (trace: {})",
                user_id,
                trace_id
            );

            // Query soft-deleted PII
            let soft_deleted_keys = self.pii_vault.query_soft_deleted(user_id, space_id).await?;

            // Restore each key
            let mut restored_count = 0;
            for vault_key in &soft_deleted_keys {
                match self.pii_vault.restore_soft_delete(vault_key, user_id, space_id, trace_id).await {
                    Ok(_) => {
                        restored_count += 1;
                    }
                    Err(e) => {
                        eprintln!(
                            "[RightToErasure] Failed to restore PII for key {}: {}",
                            vault_key, e
                        );
                    }
                }
            }

            let response = CancelErasureResponse {
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                restored_at: SystemTime::now()
                    .duration_since(UNIX_EPOCH)?
                    .as_millis() as i64,
                pii_restored: restored_count,
                vault_keys_restored: soft_deleted_keys,
            };

            println!(
                "[RightToErasure] Restored {} PII records for user {} (trace: {})",
                response.pii_restored,
                user_id,
                trace_id
            );

            Ok(response)
        }

        /// Process expired grace periods (hard delete)
        pub async fn process_expired_grace_periods(&self) -> Result<ExpiredGracePeriodResponse, Box<dyn std::error::Error>> {
            let cutoff_timestamp = SystemTime::now()
                .duration_since(UNIX_EPOCH)?
                .as_millis() as i64;

            println!(
                "[RightToErasure] Processing expired grace periods (cutoff: {})",
                cutoff_timestamp
            );

            // Find expired soft deletes
            let expired_keys = self.pii_vault.query_expired_soft_deletes(cutoff_timestamp).await?;

            // Hard delete each expired key
            let mut hard_deleted = 0;
            for vault_key in &expired_keys {
                match self.pii_vault.hard_delete_expired(vault_key).await {
                    Ok(_) => {
                        hard_deleted += 1;
                    }
                    Err(e) => {
                        eprintln!(
                            "[RightToErasure] Failed to hard delete expired PII for key {}: {}",
                            vault_key, e
                        );
                    }
                }
            }

            let response = ExpiredGracePeriodResponse {
                processed_at: cutoff_timestamp,
                pii_hard_deleted: hard_deleted,
                vault_keys_deleted: expired_keys,
            };

            println!(
                "[RightToErasure] Hard deleted {} expired PII records",
                response.pii_hard_deleted
            );

            // Emit metrics
            metrics::counter!("gdpr_erasure_expired_grace_periods_total").increment(hard_deleted as u64);

            Ok(response)
        }
    }

data_structures:
  erasure_response: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct ErasureResponse {
        pub user_id: String,
        pub space_id: String,
        pub fulfilled_at: i64,
        pub pii_deleted: usize,
        pub audit_deleted: usize,
        pub vault_keys_deleted: Vec<String>,
        pub immediate_hard_delete: bool,
        pub grace_period_days: u32,
        pub errors: Vec<String>,
    }

  cancel_erasure_response: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct CancelErasureResponse {
        pub user_id: String,
        pub space_id: String,
        pub restored_at: i64,
        pub pii_restored: usize,
        pub vault_keys_restored: Vec<String>,
    }

  expired_grace_period_response: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct ExpiredGracePeriodResponse {
        pub processed_at: i64,
        pub pii_hard_deleted: usize,
        pub vault_keys_deleted: Vec<String>,
    }

erasure_request_api:
  endpoint: "POST /api/v1/privacy/gdpr/erasure"
  authentication: "JWT token required"
  request_body: |
    {
      "user_id": "user_12345",
      "space_id": "space_001",
      "trace_id": "trace_abc123",
      "immediate_hard_delete": false
    }

  response: |
    {
      "request_id": "gdpr_req_456",
      "status": "accepted",
      "estimated_completion": "2024-11-01T10:00:00Z",
      "grace_period_days": 30,
      "message": "Your erasure request has been accepted. Data will be deleted after 30-day grace period."
    }

cancel_erasure_api:
  endpoint: "POST /api/v1/privacy/gdpr/erasure/cancel"
  request_body: |
    {
      "user_id": "user_12345",
      "space_id": "space_001",
      "trace_id": "trace_def456"
    }

  response: |
    {
      "status": "fulfilled",
      "pii_restored": 12,
      "message": "Erasure has been cancelled. Your data has been restored."
    }

erasure_status_api:
  endpoint: "GET /api/v1/privacy/gdpr/requests/{request_id}"
  response: |
    {
      "request_id": "gdpr_req_456",
      "request_type": "erasure",
      "status": "fulfilled",
      "requested_at": "2024-10-31T09:00:00Z",
      "fulfilled_at": "2024-10-31T09:02:15Z",
      "pii_deleted": 12,
      "audit_deleted": 47,
      "grace_period_days": 30
    }

rate_limiting:
  erasure_requests: "1 request per user per month"
  immediate_hard_delete: "Requires additional verification (phone call)"
  concurrent_requests: "Max 5 pending erasure requests system-wide"

exceptions_to_erasure:
  legal_obligation: |
    - Tax records (retained 7 years)
    - Legal claims (retained until resolved)
    - Regulatory reporting (varies by regulation)

  public_interest: |
    - Scientific research (anonymized)
    - Historical archives
    - Statistical purposes

  legitimate_interests: |
    - Fraud prevention (limited retention)
    - Security monitoring (audit logs)

error_handling:
  partial_erasure_failure: |
    - Continue processing other PII
    - Log errors with trace_id
    - Include error details in response
    - Partial success still fulfills request

  audit_log_deletion_failure: |
    - Alert security team
    - Do not delete PII from vault
    - Return error to user

  grace_period_violation: |
    - Verify grace period not expired
    - Reject cancellation if hard delete started

compliance_validation:
  gdpr_article_17_checklist:
    - "✅ Right to erasure without undue delay"
    - "✅ Exceptions properly documented"
    - "✅ 30-day response time SLA"
    - "✅ Grace period for user reconsideration"
    - "✅ Cryptographic erasure for hard deletes"

  response_time_validation: |
    - SLA: 30 days maximum
    - Monitoring: Track fulfillment time
    - Alerting: Breach notifications

  data_destruction_validation: |
    - Verify PII unrecoverable after hard delete
    - Cross-reference vault and audit log
    - Check for data remnants

testing_scenarios:
  unit_tests:
    - test_erasure_request_processing
    - test_soft_delete_with_grace_period
    - test_immediate_hard_delete
    - test_cancel_erasure_during_grace_period
    - test_expired_grace_period_hard_delete

  integration_tests:
    - test_full_erasure_request_workflow
    - test_grace_period_expiration
    - test_partial_erasure_failure_handling
    - test_concurrent_erasure_requests

  performance_tests:
    - test_erasure_request_under_5s
    - test_grace_period_batch_processing
    - test_large_user_dataset_erasure_1000_entries

background_jobs:
  grace_period_monitor: |
    - Runs every 6 hours
    - Finds expired soft deletes
    - Performs cryptographic hard delete
    - Updates compliance metrics

  retention_cleanup: |
    - Runs daily
    - Hard deletes expired PII
    - Cleans up old audit logs (7 years)
    - Generates compliance reports
