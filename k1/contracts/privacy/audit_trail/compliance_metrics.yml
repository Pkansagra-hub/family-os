# Compliance Metrics Contract
# Source ADR: 0035d-audit-trail-gdpr-compliance.md
# Epic 2.9, Issue 2.9.4
# Purpose: Aggregate compliance metrics for GDPR/HIPAA reporting and monitoring

contract:
  name: compliance_metrics
  version: "1.0.0"
  source_adr: "0035d-audit-trail-gdpr-compliance.md"
  epic: "2.9"
  issue: "2.9.4"

compliance_metrics_overview:
  purpose: "Aggregate and report compliance metrics for GDPR/HIPAA"
  integration: "K0 SQLite compliance_metrics table with real-time aggregation"
  retention: "7 years for HIPAA, 90 days for GDPR operational metrics"

gdpr_compliance_metrics:
  article_15_access: |
    - Total access requests received
    - Average response time (<30 days SLA)
    - Fulfillment rate (target: 100%)
    - Rejection rate with reasons

  article_17_erasure: |
    - Total erasure requests received
    - Average response time (<30 days SLA)
    - Fulfillment rate (target: 100%)
    - Grace period cancellations
    - Hard deletion rate

  article_20_portability: |
    - Total portability requests received
    - Average response time (<30 days SLA)
    - Export format preferences (JSON/XML/CSV)
    - Direct transfer success rate
    - Data volume exported

hipaa_compliance_metrics:
  phi_access_logging: |
    - Total PHI access operations
    - PHI access by identifier type
    - Privileged access incidents
    - Emergency access incidents

  accounting_of_disclosures: |
    - Total disclosure accounting requests
    - Average response time (<10 seconds)
    - Data completeness rate
    - User satisfaction rate

  audit_trail_integrity: |
    - Audit log write success rate (target: 99.999%)
    - Tamper detection events (target: 0)
    - Log retention compliance
    - Backup integrity checks

compliance_metrics_collector:
  purpose: "Real-time compliance metrics collection and aggregation"
  integration: "Extends base metrics collector with privacy-specific counters"

  rust_implementation: |
    use crate::privacy::audit_logger::AuditLogger;
    use std::collections::HashMap;
    use std::sync::Arc;
    use tokio::sync::RwLock;

    /// Compliance metrics collector
    pub struct ComplianceMetricsCollector {
        audit_logger: Arc<AuditLogger>,
        gdpr_metrics: Arc<RwLock<GDPRMetrics>>,
        hipaa_metrics: Arc<RwLock<HIPAAMetrics>>,
    }

    impl ComplianceMetricsCollector {
        /// Initialize compliance metrics collector
        pub fn new(audit_logger: Arc<AuditLogger>) -> Self {
            Self {
                audit_logger,
                gdpr_metrics: Arc::new(RwLock::new(GDPRMetrics::default())),
                hipaa_metrics: Arc::new(RwLock::new(HIPAAMetrics::default())),
            }
        }

        /// Record GDPR access request
        pub async fn record_gdpr_access_request(&self) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.access_requests_total += 1;

            // Emit Prometheus metric
            metrics::counter!("gdpr_access_requests_total").increment(1);

            println!("[ComplianceMetrics] Recorded GDPR access request (total: {})",
                    metrics.access_requests_total);
        }

        /// Record GDPR access fulfillment
        pub async fn record_gdpr_access_fulfilled(&self, response_time_ms: u64) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.access_fulfilled_total += 1;
            metrics.access_response_times_ms.push(response_time_ms);

            // Update average response time
            let total_time: u64 = metrics.access_response_times_ms.iter().sum();
            metrics.access_avg_response_time_ms = total_time / metrics.access_response_times_ms.len() as u64;

            // Emit metrics
            metrics::counter!("gdpr_access_fulfilled_total").increment(1);
            metrics::histogram!("gdpr_access_response_time_ms").record(response_time_ms as f64);

            println!("[ComplianceMetrics] Recorded GDPR access fulfilled ({}ms, avg: {}ms)",
                    response_time_ms, metrics.access_avg_response_time_ms);
        }

        /// Record GDPR erasure request
        pub async fn record_gdpr_erasure_request(&self) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.erasure_requests_total += 1;

            metrics::counter!("gdpr_erasure_requests_total").increment(1);

            println!("[ComplianceMetrics] Recorded GDPR erasure request (total: {})",
                    metrics.erasure_requests_total);
        }

        /// Record GDPR erasure fulfilled
        pub async fn record_gdpr_erasure_fulfilled(&self, response_time_ms: u64, grace_period_used: bool) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.erasure_fulfilled_total += 1;
            if grace_period_used {
                metrics.erasure_grace_period_cancellations += 1;
            }
            metrics.erasure_response_times_ms.push(response_time_ms);

            // Update average response time
            let total_time: u64 = metrics.erasure_response_times_ms.iter().sum();
            metrics.erasure_avg_response_time_ms = total_time / metrics.erasure_response_times_ms.len() as u64;

            metrics::counter!("gdpr_erasure_fulfilled_total").increment(1);
            metrics::histogram!("gdpr_erasure_response_time_ms").record(response_time_ms as f64);

            println!("[ComplianceMetrics] Recorded GDPR erasure fulfilled ({}ms, grace: {})",
                    response_time_ms, grace_period_used);
        }

        /// Record GDPR portability request
        pub async fn record_gdpr_portability_request(&self, format: &str) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.portability_requests_total += 1;
            *metrics.portability_formats.entry(format.to_string()).or_insert(0) += 1;

            metrics::counter!("gdpr_portability_requests_total").increment(1);

            println!("[ComplianceMetrics] Recorded GDPR portability request (format: {}, total: {})",
                    format, metrics.portability_requests_total);
        }

        /// Record GDPR portability fulfilled
        pub async fn record_gdpr_portability_fulfilled(&self, response_time_ms: u64, data_size_bytes: u64) {
            let mut metrics = self.gdpr_metrics.write().await;
            metrics.portability_fulfilled_total += 1;
            metrics.portability_data_exported_bytes += data_size_bytes;
            metrics.portability_response_times_ms.push(response_time_ms);

            // Update average response time
            let total_time: u64 = metrics.portability_response_times_ms.iter().sum();
            metrics.portability_avg_response_time_ms = total_time / metrics.portability_response_times_ms.len() as u64;

            metrics::counter!("gdpr_portability_fulfilled_total").increment(1);
            metrics::histogram!("gdpr_portability_response_time_ms").record(response_time_ms as f64);
            metrics::counter!("gdpr_portability_data_exported_bytes").increment(data_size_bytes);

            println!("[ComplianceMetrics] Recorded GDPR portability fulfilled ({}ms, {} bytes)",
                    response_time_ms, data_size_bytes);
        }

        /// Record HIPAA PHI access
        pub async fn record_hipaa_phi_access(&self, phi_type: &str) {
            let mut metrics = self.hipaa_metrics.write().await;
            metrics.phi_accesses_total += 1;
            *metrics.phi_accesses_by_type.entry(phi_type.to_string()).or_insert(0) += 1;

            metrics::counter!("hipaa_phi_accesses_total", "phi_type" => phi_type.to_string()).increment(1);

            println!("[ComplianceMetrics] Recorded HIPAA PHI access (type: {}, total: {})",
                    phi_type, metrics.phi_accesses_total);
        }

        /// Record HIPAA privileged access
        pub async fn record_hipaa_privileged_access(&self) {
            let mut metrics = self.hipaa_metrics.write().await;
            metrics.privileged_accesses_total += 1;

            metrics::counter!("hipaa_privileged_accesses_total").increment(1);

            println!("[ComplianceMetrics] Recorded HIPAA privileged access (total: {})",
                    metrics.privileged_accesses_total);
        }

        /// Record HIPAA emergency access
        pub async fn record_hipaa_emergency_access(&self) {
            let mut metrics = self.hipaa_metrics.write().await;
            metrics.emergency_accesses_total += 1;

            metrics::counter!("hipaa_emergency_accesses_total").increment(1);

            println!("[ComplianceMetrics] Recorded HIPAA emergency access (total: {})",
                    metrics.emergency_accesses_total);
        }

        /// Generate compliance report
        pub async fn generate_compliance_report(&self) -> ComplianceReport {
            let gdpr = self.gdpr_metrics.read().await.clone();
            let hipaa = self.hipaa_metrics.read().await.clone();

            ComplianceReport {
                gdpr_metrics: gdpr,
                hipaa_metrics: hipaa,
                generated_at: std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)
                    .unwrap()
                    .as_secs() as i64,
            }
        }

        /// Get current GDPR metrics snapshot
        pub async fn get_gdpr_metrics(&self) -> GDPRMetrics {
            self.gdpr_metrics.read().await.clone()
        }

        /// Get current HIPAA metrics snapshot
        pub async fn get_hipaa_metrics(&self) -> HIPAAmetrics {
            self.hipaa_metrics.read().await.clone()
        }
    }

    #[derive(Debug, Clone, Default, serde::Serialize)]
    pub struct GDPRMetrics {
        // Access metrics
        pub access_requests_total: u64,
        pub access_fulfilled_total: u64,
        pub access_avg_response_time_ms: u64,
        pub access_response_times_ms: Vec<u64>,

        // Erasure metrics
        pub erasure_requests_total: u64,
        pub erasure_fulfilled_total: u64,
        pub erasure_grace_period_cancellations: u64,
        pub erasure_avg_response_time_ms: u64,
        pub erasure_response_times_ms: Vec<u64>,

        // Portability metrics
        pub portability_requests_total: u64,
        pub portability_fulfilled_total: u64,
        pub portability_avg_response_time_ms: u64,
        pub portability_response_times_ms: Vec<u64>,
        pub portability_data_exported_bytes: u64,
        pub portability_formats: HashMap<String, u64>,
    }

    #[derive(Debug, Clone, Default, serde::Serialize)]
    pub struct HIPAAmetrics {
        // PHI access metrics
        pub phi_accesses_total: u64,
        pub phi_accesses_by_type: HashMap<String, u64>,

        // Privileged access metrics
        pub privileged_accesses_total: u64,

        // Emergency access metrics
        pub emergency_accesses_total: u64,

        // Accounting of disclosures
        pub disclosure_requests_total: u64,
        pub disclosure_avg_response_time_ms: u64,
        pub disclosure_response_times_ms: Vec<u64>,
    }

    #[derive(Debug, Clone, serde::Serialize)]
    pub struct ComplianceReport {
        pub gdpr_metrics: GDPRMetrics,
        pub hipaa_metrics: HIPAAmetrics,
        pub generated_at: i64,
    }

compliance_report_api:
  endpoint: "GET /api/v1/privacy/compliance/report"
  authentication: "JWT token required (admin only)"
  parameters:
    start_date: "Start date for metrics (optional)"
    end_date: "End date for metrics (optional)"
    format: "Report format (json/pdf) - default: json"

  response: |
    {
      "gdpr_metrics": {
        "access_requests_total": 150,
        "access_fulfilled_total": 148,
        "access_avg_response_time_ms": 345000,
        "erasure_requests_total": 25,
        "erasure_fulfilled_total": 24,
        "erasure_grace_period_cancellations": 2,
        "erasure_avg_response_time_ms": 180000,
        "portability_requests_total": 45,
        "portability_fulfilled_total": 44,
        "portability_avg_response_time_ms": 420000,
        "portability_data_exported_bytes": 12500000,
        "portability_formats": {
          "json": 30,
          "xml": 10,
          "csv": 4
        }
      },
      "hipaa_metrics": {
        "phi_accesses_total": 1250,
        "phi_accesses_by_type": {
          "ssn": 150,
          "email": 300,
          "phone": 200,
          "name": 600
        },
        "privileged_accesses_total": 12,
        "emergency_accesses_total": 3,
        "disclosure_requests_total": 89,
        "disclosure_avg_response_time_ms": 2500
      },
      "generated_at": 1698765432000
    }

compliance_dashboard:
  real_time_metrics: |
    - GDPR request queue status
    - HIPAA PHI access rates
    - SLA compliance percentages
    - Error rates and alerts

  historical_trends: |
    - Monthly compliance metrics
    - SLA performance over time
    - PHI access patterns
    - Incident response times

  alerting_rules: |
    - SLA breach alerts (>30 days response)
    - High privileged access rates
    - Audit log integrity failures
    - Emergency access spikes

testing_scenarios:
  unit_tests:
    - test_gdpr_metrics_recording
    - test_hipaa_metrics_recording
    - test_compliance_report_generation
    - test_metrics_aggregation_accuracy

  integration_tests:
    - test_full_gdpr_workflow_metrics
    - test_hipaa_phi_access_metrics
    - test_compliance_report_api
    - test_metrics_persistence

  compliance_tests:
    - test_sla_compliance_calculation
    - test_data_retention_compliance
    - test_audit_trail_integrity_metrics
