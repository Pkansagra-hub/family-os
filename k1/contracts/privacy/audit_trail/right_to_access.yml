# Right to Access Contract
# Source ADR: 0035d-audit-trail-gdpr-compliance.md
# Epic 2.9, Issue 2.9.4
# Purpose: GDPR Article 15 implementation - user can export all their PII data

contract:
  name: right_to_access
  version: "1.0.0"
  source_adr: "0035d-audit-trail-gdpr-compliance.md"
  epic: "2.9"
  issue: "2.9.4"

gdpr_article_15:
  title: "Right of access by the data subject"
  summary: "Data subject has right to obtain confirmation whether personal data is processed and access to their personal data"
  response_time: "30 days from request"
  cost: "Free"
  frequency: "No restrictions"

access_request_workflow:
  step_1_request:
    description: "User submits access request"
    methods: ["Web portal", "API endpoint", "Email request"]
    validation: ["User authentication", "Rate limiting (1/day)", "No duplicate pending"]

  step_2_processing:
    description: "Process request asynchronously"
    operations:
      - "Query audit_log for user's PII operations"
      - "Retrieve PII values from vault"
      - "Generate comprehensive data export"
      - "Update request status"
    performance_budget: "<10 seconds"

  step_3_response:
    description: "Deliver data export to user"
    formats: ["JSON", "PDF", "HTML"]
    delivery: ["Download link", "Email attachment", "Secure portal"]
    retention: "Export available for 30 days"

access_data_export:
  comprehensive_export:
    description: "Complete export of all personal data"
    sections:
      - "personal_information"
      - "processing_purposes"
      - "data_recipients"
      - "retention_periods"
      - "data_sources"
      - "automated_decisions"

  pii_export:
    description: "All detected and stored PII"
    sources: ["audit_log table", "pii_vault table"]
    format: "Structured JSON with metadata"

  audit_trail_export:
    description: "Complete history of PII operations"
    includes: ["detection timestamps", "processing purposes", "data recipients"]
    excludes: ["other users' data", "system internals"]

rust_implementation:
  access_request_handler: |
    use crate::privacy::gdpr_compliance::GDPRCompliance;
    use crate::privacy::audit_logger::AuditLogger;
    use crate::privacy::pii_vault::PIIVault;
    use std::sync::Arc;

    pub struct RightToAccessHandler {
        gdpr: Arc<GDPRCompliance>,
        audit_logger: Arc<AuditLogger>,
        pii_vault: Arc<PIIVault>,
    }

    impl RightToAccessHandler {
        /// Process GDPR right to access request
        pub async fn process_access_request(
            &self,
            user_id: &str,
            space_id: &str,
            trace_id: &str,
        ) -> Result<AccessResponse, Box<dyn std::error::Error>> {
            let start = std::time::Instant::now();

            println!(
                "[RightToAccess] Processing access request for user {} (trace: {})",
                user_id,
                trace_id
            );

            // Step 1: Query audit log for all PII operations
            let audit_entries = self.audit_logger.query_user_audit_log(user_id, space_id).await?;

            // Step 2: Retrieve PII values from vault
            let mut pii_values = Vec::new();
            let mut vault_keys_found = 0;

            for entry in &audit_entries {
                if let Some(vault_key) = &entry.vault_key {
                    match self.pii_vault.retrieve(vault_key, user_id, space_id, trace_id).await {
                        Ok(plaintext) => {
                            pii_values.push(PIIExport {
                                pii_type: entry.pii_type.clone(),
                                value: plaintext,
                                vault_key: vault_key.clone(),
                                detected_at: entry.timestamp,
                                detection_method: entry.detection_method.clone(),
                                confidence: entry.confidence,
                                redacted_placeholder: entry.redacted_placeholder.clone(),
                            });
                            vault_keys_found += 1;
                        }
                        Err(e) => {
                            eprintln!(
                                "[RightToAccess] Failed to retrieve PII for key {}: {}",
                                vault_key, e
                            );
                        }
                    }
                }
            }

            // Step 3: Generate comprehensive export
            let export_data = ComprehensiveDataExport {
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                requested_at: std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)?
                    .as_millis() as i64,
                pii_values,
                audit_summary: AuditSummary {
                    total_operations: audit_entries.len(),
                    vault_operations: vault_keys_found,
                    detection_methods: self.summarize_detection_methods(&audit_entries),
                    pii_types: self.summarize_pii_types(&audit_entries),
                    date_range: self.calculate_date_range(&audit_entries),
                },
                processing_purposes: vec![
                    "PII detection and redaction".to_string(),
                    "Privacy compliance".to_string(),
                    "Data subject rights fulfillment".to_string(),
                ],
                data_recipients: vec![
                    "PII vault (encrypted storage)".to_string(),
                    "Audit log (compliance records)".to_string(),
                ],
                retention_periods: vec![
                    "PII vault: 90 days".to_string(),
                    "Audit log: 7 years".to_string(),
                ],
                data_sources: vec![
                    "User messages".to_string(),
                    "File uploads".to_string(),
                    "API inputs".to_string(),
                ],
            };

            // Step 4: Serialize to JSON
            let json_export = serde_json::to_string_pretty(&export_data)?;

            // Step 5: Update GDPR request status
            let response = AccessResponse {
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                fulfilled_at: std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)?
                    .as_millis() as i64,
                pii_values_count: pii_values.len(),
                audit_entries_count: audit_entries.len(),
                export_size_bytes: json_export.len(),
                download_url: self.generate_download_url(&json_export, user_id).await?,
            };

            let process_ms = start.elapsed().as_millis();

            println!(
                "[RightToAccess] Fulfilled access request for user {}: {} PII values, {} audit entries ({}ms) (trace: {})",
                user_id,
                response.pii_values_count,
                response.audit_entries_count,
                process_ms,
                trace_id
            );

            // Validate performance budget (<10s)
            if process_ms > 10000 {
                eprintln!(
                    "[RightToAccess] WARNING: Access request exceeded 10s budget ({}ms)",
                    process_ms
                );
            }

            // Emit metrics
            metrics::histogram!("gdpr_access_request_duration_ms").record(process_ms as f64);
            metrics::counter!("gdpr_access_requests_total").increment(1);
            metrics::histogram!("gdpr_access_pii_values_per_request").record(pii_values.len() as f64);

            Ok(response)
        }

        fn summarize_detection_methods(&self, entries: &[AuditLogEntry]) -> std::collections::HashMap<String, usize> {
            let mut methods = std::collections::HashMap::new();
            for entry in entries {
                if let Some(method) = &entry.detection_method {
                    *methods.entry(method.clone()).or_insert(0) += 1;
                }
            }
            methods
        }

        fn summarize_pii_types(&self, entries: &[AuditLogEntry]) -> std::collections::HashMap<String, usize> {
            let mut types = std::collections::HashMap::new();
            for entry in entries {
                *types.entry(entry.pii_type.clone()).or_insert(0) += 1;
            }
            types
        }

        fn calculate_date_range(&self, entries: &[AuditLogEntry]) -> Option<(i64, i64)> {
            if entries.is_empty() {
                return None;
            }

            let mut min_ts = i64::MAX;
            let mut max_ts = i64::MIN;

            for entry in entries {
                min_ts = min_ts.min(entry.timestamp);
                max_ts = max_ts.max(entry.timestamp);
            }

            Some((min_ts, max_ts))
        }

        async fn generate_download_url(&self, json_data: &str, user_id: &str) -> Result<String, Box<dyn std::error::Error>> {
            // Generate secure download URL (implementation depends on storage system)
            // For now, return placeholder
            Ok(format!("https://privacy.example.com/download/{}/access-export.json", user_id))
        }
    }

data_structures:
  pii_export: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct PIIExport {
        pub pii_type: String,
        pub value: String,
        pub vault_key: String,
        pub detected_at: i64,
        pub detection_method: Option<String>,
        pub confidence: Option<f64>,
        pub redacted_placeholder: Option<String>,
    }

  comprehensive_data_export: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct ComprehensiveDataExport {
        pub user_id: String,
        pub space_id: String,
        pub requested_at: i64,
        pub pii_values: Vec<PIIExport>,
        pub audit_summary: AuditSummary,
        pub processing_purposes: Vec<String>,
        pub data_recipients: Vec<String>,
        pub retention_periods: Vec<String>,
        pub data_sources: Vec<String>,
    }

  audit_summary: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct AuditSummary {
        pub total_operations: usize,
        pub vault_operations: usize,
        pub detection_methods: std::collections::HashMap<String, usize>,
        pub pii_types: std::collections::HashMap<String, usize>,
        pub date_range: Option<(i64, i64)>,
    }

  access_response: |
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct AccessResponse {
        pub user_id: String,
        pub space_id: String,
        pub fulfilled_at: i64,
        pub pii_values_count: usize,
        pub audit_entries_count: usize,
        pub export_size_bytes: usize,
        pub download_url: String,
    }

