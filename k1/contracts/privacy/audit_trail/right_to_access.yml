  sections:
    - "Executive Summary"
    - "Personal Information Inventory"
    - "Processing Activities"
    - "Data Recipients"
    - "Retention Information"
    - "Your Rights"
  styling: "Professional layout with tables and clear formatting"

html_export_format:
  description: "Web-viewable HTML report"
  features:
    - "Interactive tables"
    - "Collapsible sections"
    - "Search functionality"
    - "Print-friendly styling"

access_request_api:
  endpoint: "POST /api/v1/privacy/gdpr/access"
  authentication: "JWT token required"
  request_body: |
    {
      "user_id": "user_12345",
      "space_id": "space_001",
      "trace_id": "trace_abc123"
    }

  response: |
    {
      "request_id": "gdpr_req_123",
      "status": "accepted",
      "estimated_completion": "2024-11-01T10:00:00Z",
      "message": "Your access request has been accepted and is being processed."
    }

access_status_api:
  endpoint: "GET /api/v1/privacy/gdpr/requests/{request_id}"
  response: |
    {
      "request_id": "gdpr_req_123",
      "request_type": "access",
      "status": "fulfilled",
      "requested_at": "2024-10-31T09:00:00Z",
      "fulfilled_at": "2024-10-31T09:05:23Z",
      "download_url": "https://privacy.example.com/download/user_12345/access-export.json",
      "expires_at": "2024-11-30T09:05:23Z"
    }

rate_limiting:
  access_requests: "1 request per user per day"
  concurrent_requests: "Max 10 pending requests system-wide"
  export_size_limit: "Max 100MB per export"

error_handling:
  vault_retrieval_failure: |
    - Log error with trace_id
    - Continue processing other PII
    - Include error count in response
    - Partial success still fulfills request

  audit_log_corruption: |
    - Alert security team
    - Return error to user
    - Do not provide partial export

  export_generation_failure: |
    - Retry up to 3 times
    - Alert on failure
    - Update request status to "failed"

compliance_validation:
  gdpr_article_15_checklist:
    - "✅ Confirmation of processing"
    - "✅ Copy of personal data"
    - "✅ Processing purposes"
    - "✅ Categories of personal data"
    - "✅ Recipients of data"
    - "✅ Retention periods"
    - "✅ Data sources"
    - "✅ Existence of automated decisions"

  response_time_validation: |
    - SLA: 30 days maximum
    - Monitoring: Track fulfillment time
    - Alerting: Breach notifications

  data_accuracy_validation: |
    - Cross-reference audit_log and vault
    - Validate PII values can be decrypted
    - Check for data corruption

testing_scenarios:
  unit_tests:
    - test_access_request_processing
    - test_pii_retrieval_from_vault
    - test_comprehensive_export_generation
    - test_audit_summary_calculation
    - test_download_url_generation

  integration_tests:
    - test_full_access_request_workflow
    - test_large_dataset_export
    - test_concurrent_access_requests
    - test_vault_retrieval_failure_handling

  performance_tests:
    - test_access_request_under_10s
    - test_export_generation_under_5s
    - test_large_user_dataset_1000_entries
