# Right to Portability Contract
# Source ADR: 0035d-audit-trail-gdpr-compliance.md
# Epic 2.9, Issue 2.9.4
# Purpose: GDPR Article 20 implementation - user can receive PII in machine-readable format

contract:
  name: right_to_portability
  version: "1.0.0"
  source_adr: "0035d-audit-trail-gdpr-compliance.md"
  epic: "2.9"
  issue: "2.9.4"

gdpr_article_20:
  title: "Right to data portability"
  summary: "Data subject has right to receive personal data in structured, commonly used, machine-readable format"
  response_time: "30 days from request"
  cost: "Free"
  scope: "Data provided by data subject OR observed data (with consent)"

portability_request_workflow:
  step_1_request:
    description: "User requests data portability"
    methods: ["Web portal", "API endpoint", "Email request"]
    validation: ["User authentication", "Rate limiting (1/month)", "Data scope verification"]

  step_2_processing:
    description: "Generate machine-readable export"
    operations:
      - "Query audit_log for user's PII operations"
      - "Retrieve PII values from vault"
      - "Generate structured export in requested format"
      - "Provide direct transfer option to another controller"
    performance_budget: "<10 seconds"

  step_3_delivery:
    description: "Deliver data in machine-readable format"
    formats: ["JSON", "XML", "CSV"]
    delivery: ["Download link", "Direct transfer to another controller"]
    retention: "Export available for 30 days"

portability_formats:
  json_format:
    description: "Structured JSON with full metadata"
    schema: |
      {
        "portability_export": {
          "version": "1.0",
          "user_id": "string",
          "space_id": "string",
          "export_timestamp": "number",
          "data_controller": "string",
          "pii_entities": [
            {
              "pii_type": "string",
              "value": "string",
              "detected_at": "number",
              "detection_method": "string",
              "confidence": "number",
              "processing_purpose": "string",
              "retention_period_days": "number",
              "data_source": "string"
            }
          ],
          "metadata": {
            "total_entities": "number",
            "date_range": ["number", "number"],
            "detection_methods": "object",
            "pii_types": "object"
          }
        }
      }

    example: |
      {
        "portability_export": {
          "version": "1.0",
          "user_id": "user_12345",
          "space_id": "space_001",
          "export_timestamp": 1698765432000,
          "data_controller": "K1 Intelligence Module",
          "pii_entities": [
            {
              "pii_type": "email",
              "value": "john.doe@example.com",
              "detected_at": 1698765432000,
              "detection_method": "regex",
              "confidence": 1.0,
              "processing_purpose": "user_communication",
              "retention_period_days": 90,
              "data_source": "user_message"
            }
          ],
          "metadata": {
            "total_entities": 12,
            "date_range": [1698000000000, 1698765432000],
            "detection_methods": {"regex": 10, "bert_ner": 2},
            "pii_types": {"email": 5, "phone": 4, "name": 3}
          }
        }
      }

  xml_format:
    description: "XML format for enterprise systems"
    schema: |
      <?xml version="1.0" encoding="UTF-8"?>
      <portability_export version="1.0">
        <user_id>user_12345</user_id>
        <space_id>space_001</space_id>
        <export_timestamp>1698765432000</export_timestamp>
        <data_controller>K1 Intelligence Module</data_controller>
        <pii_entities>
          <pii_entity>
            <pii_type>email</pii_type>
            <value>john.doe@example.com</value>
            <detected_at>1698765432000</detected_at>
            <detection_method>regex</detection_method>
            <confidence>1.0</confidence>
            <processing_purpose>user_communication</processing_purpose>
            <retention_period_days>90</retention_period_days>
            <data_source>user_message</data_source>
          </pii_entity>
        </pii_entities>
        <metadata>
          <total_entities>12</total_entities>
          <date_range>
            <start>1698000000000</start>
            <end>1698765432000</end>
          </date_range>
        </metadata>
      </portability_export>

  csv_format:
    description: "CSV format for spreadsheet analysis"
    schema: |
      pii_type,value,detected_at,detection_method,confidence,processing_purpose,retention_period_days,data_source
      email,john.doe@example.com,1698765432000,regex,1.0,user_communication,90,user_message
      phone,+1-555-123-4567,1698765431000,regex,1.0,user_communication,90,user_message

    features:
      - "Header row with field names"
      - "ISO 8601 timestamps"
      - "Quoted values with commas"
      - "UTF-8 encoding"

direct_transfer_option:
  description: "Direct transfer to another data controller"
  workflow:
    - "User provides target controller endpoint"
    - "Generate signed export package"
    - "Transmit directly via secure channel"
    - "Receive delivery confirmation"

  security:
    - "End-to-end encryption"
    - "Digital signatures for integrity"
    - "TLS 1.3 for transport"
    - "API key authentication"

rust_implementation:
  portability_request_handler: |
    use crate::privacy::gdpr_compliance::GDPRCompliance;
    use crate::privacy::audit_logger::AuditLogger;
    use crate::privacy::pii_vault::PIIVault;
    use std::sync::Arc;
    use serde::{Serialize, Deserialize};

    pub struct RightToPortabilityHandler {
        gdpr: Arc<GDPRCompliance>,
        audit_logger: Arc<AuditLogger>,
        pii_vault: Arc<PIIVault>,
    }

    #[derive(Debug, Clone, Serialize, Deserialize)]
    pub enum PortabilityFormat {
        Json,
        Xml,
        Csv,
    }

    impl RightToPortabilityHandler {
        /// Process GDPR right to portability request
        pub async fn process_portability_request(
            &self,
            user_id: &str,
            space_id: &str,
            trace_id: &str,
            format: PortabilityFormat,
            direct_transfer_endpoint: Option<String>,
        ) -> Result<PortabilityResponse, Box<dyn std::error::Error>> {
            let start = std::time::Instant::now();

            println!(
                "[RightToPortability] Processing portability request for user {} (format: {:?}, direct_transfer: {}, trace: {})",
                user_id,
                format,
                direct_transfer_endpoint.is_some(),
                trace_id
            );

            // Step 1: Query audit log for user's PII operations
            let audit_entries = self.audit_logger.query_user_audit_log(user_id, space_id).await?;

            // Step 2: Retrieve PII values from vault
            let mut pii_entities = Vec::new();
            for entry in &audit_entries {
                if let Some(vault_key) = &entry.vault_key {
                    match self.pii_vault.retrieve(vault_key, user_id, space_id, trace_id).await {
                        Ok(plaintext) => {
                            pii_entities.push(PortabilityPIIEntity {
                                pii_type: entry.pii_type.clone(),
                                value: plaintext,
                                detected_at: entry.timestamp,
                                detection_method: entry.detection_method.clone(),
                                confidence: entry.confidence,
                                processing_purpose: self.map_pii_type_to_purpose(&entry.pii_type),
                                retention_period_days: 90, // PII vault retention
                                data_source: "user_message".to_string(), // Could be enhanced
                            });
                        }
                        Err(e) => {
                            eprintln!(
                                "[RightToPortability] Failed to retrieve PII for key {}: {}",
                                vault_key, e
                            );
                        }
                    }
                }
            }

            // Step 3: Generate metadata
            let metadata = self.generate_metadata(&pii_entities, &audit_entries);

            // Step 4: Create export package
            let export_package = PortabilityExport {
                version: "1.0".to_string(),
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                export_timestamp: std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)?
                    .as_millis() as i64,
                data_controller: "K1 Intelligence Module".to_string(),
                pii_entities,
                metadata,
            };

            // Step 5: Generate requested format
            let (export_data, content_type) = match format {
                PortabilityFormat::Json => {
                    (serde_json::to_string_pretty(&export_package)?, "application/json")
                }
                PortabilityFormat::Xml => {
                    (self.generate_xml_export(&export_package)?, "application/xml")
                }
                PortabilityFormat::Csv => {
                    (self.generate_csv_export(&export_package)?, "text/csv")
                }
            };

            // Step 6: Handle delivery
            let delivery_info = if let Some(endpoint) = direct_transfer_endpoint {
                // Direct transfer to another controller
                self.perform_direct_transfer(&export_data, &endpoint, trace_id).await?
            } else {
                // Generate download URL
                self.generate_download_url(&export_data, user_id, &content_type).await?
            };

            // Step 7: Generate response
            let response = PortabilityResponse {
                user_id: user_id.to_string(),
                space_id: space_id.to_string(),
                fulfilled_at: std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)?
                    .as_millis() as i64,
                format: format,
                pii_entities_count: export_package.pii_entities.len(),
                export_size_bytes: export_data.len(),
                delivery_info,
            };

            let process_ms = start.elapsed().as_millis();

            println!(
                "[RightToPortability] Fulfilled portability request for user {}: {} PII entities, {} bytes (format: {:?}, {}ms) (trace: {})",
                user_id,
                response.pii_entities_count,
                response.export_size_bytes,
                format,
                process_ms,
                trace_id
            );

            // Validate performance budget (<10s)
            if process_ms > 10000 {
                eprintln!(
                    "[RightToPortability] WARNING: Portability request exceeded 10s budget ({}ms)",
                    process_ms
                );
            }

            // Emit metrics
            metrics::histogram!("gdpr_portability_request_duration_ms").record(process_ms as f64);
            metrics::counter!("gdpr_portability_requests_total").increment(1);
            metrics::histogram!("gdpr_portability_entities_per_request").record(export_package.pii_entities.len() as f64);

            Ok(response)
        }

        fn map_pii_type_to_purpose(&self, pii_type: &str) -> String {
            match pii_type {
                "email" | "phone" => "user_communication".to_string(),
                "ssn" | "name" | "address" => "user_identification".to_string(),
                "credit_card" | "bank_account" => "payment_processing".to_string(),
                _ => "data_processing".to_string(),
            }
        }

        fn generate_metadata(
            &self,
            pii_entities: &[PortabilityPIIEntity],
            audit_entries: &[AuditLogEntry],
        ) -> PortabilityMetadata {
            let total_entities = pii_entities.len();

            let date_range = if audit_entries.is_empty() {
                None
            } else {
                let mut min_ts = i64::MAX;
                let mut max_ts = i64::MIN;
                for entry in audit_entries {
                    min_ts = min_ts.min(entry.timestamp);
                    max_ts = max_ts.max(entry.timestamp);
                }
                Some((min_ts, max_ts))
            };

            let mut detection_methods = std::collections::HashMap::new();
            let mut pii_types = std::collections::HashMap::new();

            for entry in audit_entries {
                if let Some(method) = &entry.detection_method {
                    *detection_methods.entry(method.clone()).or_insert(0) += 1;
                }
                *pii_types.entry(entry.pii_type.clone()).or_insert(0) += 1;
            }

            PortabilityMetadata {
                total_entities,
                date_range,
                detection_methods,
                pii_types,
            }
        }

generate_xml_export: |
  fn generate_xml_export(&self, export_package: &PortabilityExport) -> Result<String, Box<dyn std::error::Error>> {
      // Simple XML generation (could use a proper XML library)
      let mut xml = format!(
          r#"<portability_export version="{}">
            <user_id>{}</user_id>
            <space_id>{}</space_id>
            <export_timestamp>{}</export_timestamp>
            <data_controller>{}</data_controller>
            <pii_entities>"#,
          export_package.version,
          export_package.user_id,
          export_package.space_id,
          export_package.export_timestamp,
          export_package.data_controller
      );

      for entity in &export_package.pii_entities {
          xml.push_str(&format!(
              r#"
      <pii_entity>
        <pii_type>{}</pii_type>
        <value>{}</value>
        <detected_at>{}</detected_at>
        <detection_method>{}</detection_method>
        <confidence>{}</confidence>
        <processing_purpose>{}</processing_purpose>
        <retention_period_days>{}</retention_period_days>
        <data_source>{}</data_source>
      </pii_entity>"#,
              entity.pii_type,
              self.escape_xml(&entity.value),
              entity.detected_at,
              entity.detection_method.as_deref().unwrap_or("unknown"),
              entity.confidence.unwrap_or(0.0),
              entity.processing_purpose,
              entity.retention_period_days,
              entity.data_source
          ));
      }

      xml.push_str(
          r#"
    </pii_entities>
    <metadata>
      <total_entities>"#
      );
      xml.push_str(&export_package.metadata.total_entities.to_string());
      xml.push_str("</total_entities>");

      if let Some((start, end)) = export_package.metadata.date_range {
          xml.push_str(&format!(
              "<date_range><start>{}</start><end>{}</end></date_range>",
              start, end
          ));
      }

      xml.push_str(
          r#"
    </metadata>
  </portability_export>"#
      );

      Ok(xml)
  }

generate_csv_export: |
  fn generate_csv_export(&self, export_package: &PortabilityExport) -> Result<String, Box<dyn std::error::Error>> {
      let mut csv = String::from("pii_type,value,detected_at,detection_method,confidence,processing_purpose,retention_period_days,data_source\n");

      for entity in &export_package.pii_entities {
          csv.push_str(&format!(
              "{},{},{},{},{},{},{},{}\n",
              self.escape_csv(&entity.pii_type),
              self.escape_csv(&entity.value),
              entity.detected_at,
              entity.detection_method.as_deref().unwrap_or("unknown"),
              entity.confidence.unwrap_or(0.0),
              self.escape_csv(&entity.processing_purpose),
              entity.retention_period_days,
              self.escape_csv(&entity.data_source)
          ));
      }

      Ok(csv)
  }

escape_xml: |
  fn escape_xml(&self, s: &str) -> String {
      s.replace("&", "&amp;")
       .replace("<", "&lt;")
       .replace(">", "&gt;")
       .replace("\"", "&quot;")
       .replace("'", "&apos;")
  }

escape_csv: |
  fn escape_csv(&self, s: &str) -> String {
      if s.contains(",") || s.contains("\"") || s.contains("\n") {
          format!("\"{}\"", s.replace("\"", "\"\""))
      } else {
          s.to_string()
      }
  }

perform_direct_transfer: |
  async fn perform_direct_transfer(
      &self,
      export_data: &str,
      endpoint: &str,
      trace_id: &str,
  ) -> Result<DeliveryInfo, Box<dyn std::error::Error>> {
      // Implement direct transfer to another controller
      // This would involve HTTP POST with authentication
      println!(
          "[RightToPortability] Direct transfer to {} (trace: {})",
          endpoint,
          trace_id
      );

      // Placeholder implementation
      Ok(DeliveryInfo::DirectTransfer {
          endpoint: endpoint.to_string(),
          status: "delivered".to_string(),
          confirmation_id: format!("transfer_{}", trace_id),
      })
  }

generate_download_url: |
  async fn generate_download_url(
      &self,
      export_data: &str,
      user_id: &str,
      content_type: &str,
  ) -> Result<DeliveryInfo, Box<dyn std::error::Error>> {
      // Generate secure download URL
      let download_url = format!(
          "https://privacy.example.com/download/{}/portability-export.{}",
          user_id,
          self.get_file_extension(content_type)
      );

      Ok(DeliveryInfo::DownloadUrl {
          url: download_url,
          expires_at: std::time::SystemTime::now()
              .duration_since(std::time::UNIX_EPOCH)?
              .as_millis() as i64 + (30 * 24 * 60 * 60 * 1000), // 30 days
      })
  }

get_file_extension: |
  fn get_file_extension(&self, content_type: &str) -> &str {
      match content_type {
          "application/json" => "json",
          "application/xml" => "xml",
          "text/csv" => "csv",
          _ => "dat",
      }
  }

data_structures:
  portability_pii_entity: |
    #[derive(Debug, Clone, Serialize, Deserialize)]
    pub struct PortabilityPIIEntity {
        pub pii_type: String,
        pub value: String,
        pub detected_at: i64,
        pub detection_method: Option<String>,
        pub confidence: Option<f64>,
        pub processing_purpose: String,
        pub retention_period_days: u32,
        pub data_source: String,
    }

  portability_export: |
    #[derive(Debug, Clone, Serialize, Deserialize)]
    pub struct PortabilityExport {
        pub version: String,
        pub user_id: String,
        pub space_id: String,
        pub export_timestamp: i64,
        pub data_controller: String,
        pub pii_entities: Vec<PortabilityPIIEntity>,
        pub metadata: PortabilityMetadata,
    }

  portability_metadata: |
    #[derive(Debug, Clone, Serialize, Deserialize)]
    pub struct PortabilityMetadata {
        pub total_entities: usize,
        pub date_range: Option<(i64, i64)>,
        pub detection_methods: std::collections::HashMap<String, usize>,
        pub pii_types: std::collections::HashMap<String, usize>,
    }

  portability_response: |
    #[derive(Debug, Clone, Serialize, Deserialize)]
    pub struct PortabilityResponse {
        pub user_id: String,
        pub space_id: String,
        pub fulfilled_at: i64,
        pub format: PortabilityFormat,
        pub pii_entities_count: usize,
        pub export_size_bytes: usize,
        pub delivery_info: DeliveryInfo,
    }

  delivery_info: |
    #[derive(Debug, Clone, Serialize, Deserialize)]
    #[serde(tag = "type")]
    pub enum DeliveryInfo {
        DownloadUrl { url: String, expires_at: i64 },
        DirectTransfer { endpoint: String, status: String, confirmation_id: String },
    }

