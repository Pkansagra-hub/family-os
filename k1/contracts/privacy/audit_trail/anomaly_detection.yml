# Anomaly Detection Contract
# Source ADR: 0035d-audit-trail-gdpr-compliance.md
# Epic 2.9, Issue 2.9.4
# Purpose: Detect unusual PII access patterns and potential privacy violations

contract:
  name: anomaly_detection
  version: "1.0.0"
  source_adr: "0035d-audit-trail-gdpr-compliance.md"
  epic: "2.9"
  issue: "2.9.4"

anomaly_detection_overview:
  purpose: "Detect unusual PII access patterns and potential privacy violations"
  integration: "Real-time analysis of audit logs with configurable thresholds"
  alerting: "Automated alerts for suspicious activity with escalation procedures"

anomaly_types:
  access_frequency_anomalies: |
    - Excessive PII access within time window
    - Unusual access patterns (time of day, location)
    - Bulk access operations

  access_scope_anomalies: |
    - Cross-user PII access
    - Access to multiple PII types simultaneously
    - Access outside normal user behavior

  gdpr_request_anomalies: |
    - Multiple GDPR requests from same user
    - Unusual request patterns (erasure + portability)
    - Automated request generation

  privileged_access_anomalies: |
    - Excessive privileged operations
    - Privileged access outside business hours
    - Unusual admin access patterns

anomaly_detector:
  purpose: "Real-time anomaly detection engine for PII operations"
  integration: "Processes audit log entries and maintains detection state"

  rust_implementation: |
    use crate::privacy::audit_logger::{AuditLogger, AuditLogEntry};
    use std::collections::{HashMap, VecDeque};
    use std::sync::Arc;
    use tokio::sync::RwLock;

    /// Anomaly detection thresholds
    #[derive(Debug, Clone)]
    pub struct AnomalyThresholds {
        pub max_accesses_per_hour: u32,
        pub max_accesses_per_day: u32,
        pub max_pii_types_per_request: u32,
        pub max_gdpr_requests_per_day: u32,
        pub privileged_access_alert_threshold: u32,
        pub bulk_operation_threshold: u32,
    }

    impl Default for AnomalyThresholds {
        fn default() -> Self {
            Self {
                max_accesses_per_hour: 100,
                max_accesses_per_day: 500,
                max_pii_types_per_request: 5,
                max_gdpr_requests_per_day: 3,
                privileged_access_alert_threshold: 10,
                bulk_operation_threshold: 50,
            }
        }
    }

    /// Detected anomaly
    #[derive(Debug, Clone, serde::Serialize)]
    pub struct Anomaly {
        pub anomaly_type: String,
        pub severity: AnomalySeverity,
        pub user_id: String,
        pub space_id: String,
        pub description: String,
        pub evidence: Vec<String>,
        pub detected_at: i64,
        pub trace_id: String,
    }

    #[derive(Debug, Clone, serde::Serialize)]
    pub enum AnomalySeverity {
        Low,
        Medium,
        High,
        Critical,
    }

    /// Anomaly detection engine
    pub struct AnomalyDetector {
        audit_logger: Arc<AuditLogger>,
        thresholds: Arc<RwLock<AnomalyThresholds>>,
        user_activity: Arc<RwLock<HashMap<String, UserActivity>>>,
        recent_anomalies: Arc<RwLock<VecDeque<Anomaly>>>,
    }

    #[derive(Debug, Clone, Default)]
    struct UserActivity {
        accesses_last_hour: u32,
        accesses_last_day: u32,
        last_access_time: i64,
        pii_types_accessed: Vec<String>,
        gdpr_requests_today: u32,
        privileged_operations: u32,
    }

    impl AnomalyDetector {
        /// Initialize anomaly detector
        pub fn new(audit_logger: Arc<AuditLogger>) -> Self {
            Self {
                audit_logger,
                thresholds: Arc::new(RwLock::new(AnomalyThresholds::default())),
                user_activity: Arc::new(RwLock::new(HashMap::new())),
                recent_anomalies: Arc::new(RwLock::new(VecDeque::with_capacity(1000))),
            }
        }

        /// Analyze audit log entry for anomalies
        pub async fn analyze_audit_entry(
            &self,
            entry: &AuditLogEntry,
        ) -> Result<Vec<Anomaly>, Box<dyn std::error::Error>> {
            let mut anomalies = Vec::new();

            // Update user activity
            self.update_user_activity(entry).await;

            // Check for access frequency anomalies
            if let Some(anomaly) = self.check_access_frequency_anomaly(entry).await? {
                anomalies.push(anomaly);
            }

            // Check for access scope anomalies
            if let Some(anomaly) = self.check_access_scope_anomaly(entry).await? {
                anomalies.push(anomaly);
            }

            // Check for GDPR request anomalies
            if let Some(anomaly) = self.check_gdpr_request_anomaly(entry).await? {
                anomalies.push(anomaly);
            }

            // Check for privileged access anomalies
            if let Some(anomaly) = self.check_privileged_access_anomaly(entry).await? {
                anomalies.push(anomaly);
            }

            // Store detected anomalies
            for anomaly in &anomalies {
                self.store_anomaly(anomaly.clone()).await?;

                // Emit alert for high/critical anomalies
                if matches!(anomaly.severity, AnomalySeverity::High | AnomalySeverity::Critical) {
                    self.emit_anomaly_alert(anomaly).await?;
                }
            }

            Ok(anomalies)
        }

        /// Update user activity tracking
        async fn update_user_activity(&self, entry: &AuditLogEntry) {
            let mut user_activity = self.user_activity.write().await;
            let activity = user_activity.entry(entry.user_id.clone())
                .or_insert_with(UserActivity::default);

            let now = std::time::SystemTime::now()
                .duration_since(std::time::UNIX_EPOCH)
                .unwrap()
                .as_secs() as i64;

            // Reset counters if day changed
            if now - activity.last_access_time > 86400 {
                activity.accesses_last_day = 0;
                activity.gdpr_requests_today = 0;
            }

            // Reset hourly counter if hour changed
            if now - activity.last_access_time > 3600 {
                activity.accesses_last_hour = 0;
            }

            activity.accesses_last_hour += 1;
            activity.accesses_last_day += 1;
            activity.last_access_time = now;

            // Track PII types accessed
            if !activity.pii_types_accessed.contains(&entry.pii_type) {
                activity.pii_types_accessed.push(entry.pii_type.clone());
            }

            // Track GDPR requests
            if entry.operation.starts_with("gdpr_") {
                activity.gdpr_requests_today += 1;
            }

            // Track privileged operations
            if entry.operation.contains("privileged") {
                activity.privileged_operations += 1;
            }
        }

        /// Check for access frequency anomalies
        async fn check_access_frequency_anomaly(
            &self,
            entry: &AuditLogEntry,
        ) -> Result<Option<Anomaly>, Box<dyn std::error::Error>> {
            let thresholds = self.thresholds.read().await;
            let user_activity = self.user_activity.read().await;

            if let Some(activity) = user_activity.get(&entry.user_id) {
                let mut evidence = Vec::new();
                let mut severity = AnomalySeverity::Low;

                // Check hourly access rate
                if activity.accesses_last_hour > thresholds.max_accesses_per_hour {
                    evidence.push(format!("Hourly access rate: {} (threshold: {})",
                                        activity.accesses_last_hour, thresholds.max_accesses_per_hour));
                    severity = AnomalySeverity::Medium;
                }

                // Check daily access rate
                if activity.accesses_last_day > thresholds.max_accesses_per_day {
                    evidence.push(format!("Daily access rate: {} (threshold: {})",
                                        activity.accesses_last_day, thresholds.max_accesses_per_day));
                    severity = AnomalySeverity::High;
                }

                if !evidence.is_empty() {
                    return Ok(Some(Anomaly {
                        anomaly_type: "access_frequency".to_string(),
                        severity,
                        user_id: entry.user_id.clone(),
                        space_id: entry.space_id.clone(),
                        description: "Unusual PII access frequency detected".to_string(),
                        evidence,
                        detected_at: std::time::SystemTime::now()
                            .duration_since(std::time::UNIX_EPOCH)
                            .unwrap()
                            .as_secs() as i64,
                        trace_id: entry.trace_id.clone(),
                    }));
                }
            }

            Ok(None)
        }

        /// Check for access scope anomalies
        async fn check_access_scope_anomaly(
            &self,
            entry: &AuditLogEntry,
        ) -> Result<Option<Anomaly>, Box<dyn std::error::Error>> {
            let thresholds = self.thresholds.read().await;
            let user_activity = self.user_activity.read().await;

            if let Some(activity) = user_activity.get(&entry.user_id) {
                let mut evidence = Vec::new();
                let mut severity = AnomalySeverity::Low;

                // Check PII types accessed in session
                if activity.pii_types_accessed.len() as u32 > thresholds.max_pii_types_per_request {
                    evidence.push(format!("PII types accessed: {} (threshold: {})",
                                        activity.pii_types_accessed.len(), thresholds.max_pii_types_per_request));
                    severity = AnomalySeverity::Medium;
                }

                // Check for bulk operations
                if entry.operation.contains("bulk") &&
                   activity.accesses_last_hour > thresholds.bulk_operation_threshold {
                    evidence.push(format!("Bulk operation detected with high access rate: {}",
                                        activity.accesses_last_hour));
                    severity = AnomalySeverity::High;
                }

                if !evidence.is_empty() {
                    return Ok(Some(Anomaly {
                        anomaly_type: "access_scope".to_string(),
                        severity,
                        user_id: entry.user_id.clone(),
                        space_id: entry.space_id.clone(),
                        description: "Unusual PII access scope detected".to_string(),
                        evidence,
                        detected_at: std::time::SystemTime::now()
                            .duration_since(std::time::UNIX_EPOCH)
                            .unwrap()
                            .as_secs() as i64,
                        trace_id: entry.trace_id.clone(),
                    }));
                }
            }

            Ok(None)
        }

        /// Check for GDPR request anomalies
        async fn check_gdpr_request_anomaly(
            &self,
            entry: &AuditLogEntry,
        ) -> Result<Option<Anomaly>, Box<dyn std::error::Error>> {
            let thresholds = self.thresholds.read().await;
            let user_activity = self.user_activity.read().await;

            if let Some(activity) = user_activity.get(&entry.user_id) {
                if entry.operation.starts_with("gdpr_") {
                    let mut evidence = Vec::new();
                    let mut severity = AnomalySeverity::Low;

                    // Check GDPR request frequency
                    if activity.gdpr_requests_today > thresholds.max_gdpr_requests_per_day {
                        evidence.push(format!("GDPR requests today: {} (threshold: {})",
                                            activity.gdpr_requests_today, thresholds.max_gdpr_requests_per_day));
                        severity = AnomalySeverity::High;
                    }

                    if !evidence.is_empty() {
                        return Ok(Some(Anomaly {
                            anomaly_type: "gdpr_request".to_string(),
                            severity,
                            user_id: entry.user_id.clone(),
                            space_id: entry.space_id.clone(),
                            description: "Unusual GDPR request pattern detected".to_string(),
                            evidence,
                            detected_at: std::time::SystemTime::now()
                                .duration_since(std::time::UNIX_EPOCH)
                                .unwrap()
                                .as_secs() as i64,
                            trace_id: entry.trace_id.clone(),
                        }));
                    }
                }
            }

            Ok(None)
        }

        /// Check for privileged access anomalies
        async fn check_privileged_access_anomaly(
            &self,
            entry: &AuditLogEntry,
        ) -> Result<Option<Anomaly>, Box<dyn std::error::Error>> {
            let thresholds = self.thresholds.read().await;
            let user_activity = self.user_activity.read().await;

            if let Some(activity) = user_activity.get(&entry.user_id) {
                if entry.operation.contains("privileged") {
                    let mut evidence = Vec::new();
                    let mut severity = AnomalySeverity::Low;

                    // Check privileged operation frequency
                    if activity.privileged_operations > thresholds.privileged_access_alert_threshold {
                        evidence.push(format!("Privileged operations: {} (threshold: {})",
                                            activity.privileged_operations, thresholds.privileged_access_alert_threshold));
                        severity = AnomalySeverity::Critical;
                    }

                    if !evidence.is_empty() {
                        return Ok(Some(Anomaly {
                            anomaly_type: "privileged_access".to_string(),
                            severity,
                            user_id: entry.user_id.clone(),
                            space_id: entry.space_id.clone(),
                            description: "Unusual privileged access pattern detected".to_string(),
                            evidence,
                            detected_at: std::time::SystemTime::now()
                                .duration_since(std::time::UNIX_EPOCH)
                                .unwrap()
                                .as_secs() as i64,
                            trace_id: entry.trace_id.clone(),
                        }));
                    }
                }
            }

            Ok(None)
        }

        /// Store detected anomaly
        async fn store_anomaly(&self, anomaly: Anomaly) -> Result<(), Box<dyn std::error::Error>> {
            let mut recent_anomalies = self.recent_anomalies.write().await;

            // Maintain max capacity
            if recent_anomalies.len() >= 1000 {
                recent_anomalies.pop_front();
            }

            recent_anomalies.push_back(anomaly);
            Ok(())
        }

        /// Emit anomaly alert
        async fn emit_anomaly_alert(&self, anomaly: &Anomaly) -> Result<(), Box<dyn std::error::Error>> {
            // Log alert
            println!("[AnomalyDetector] ALERT: {} - {} (user: {}, severity: {:?})",
                    anomaly.anomaly_type, anomaly.description, anomaly.user_id, anomaly.severity);

            // Emit metrics
            metrics::counter!("privacy_anomalies_detected_total",
                            "type" => anomaly.anomaly_type.clone(),
                            "severity" => format!("{:?}", anomaly.severity)).increment(1);

            // TODO: Send alert to monitoring system
            // TODO: Escalate critical anomalies

            Ok(())
        }

        /// Get recent anomalies
        pub async fn get_recent_anomalies(&self, limit: usize) -> Vec<Anomaly> {
            let recent_anomalies = self.recent_anomalies.read().await;
            recent_anomalies.iter().rev().take(limit).cloned().collect()
        }

        /// Update anomaly thresholds
        pub async fn update_thresholds(&self, new_thresholds: AnomalyThresholds) {
            let mut thresholds = self.thresholds.write().await;
            *thresholds = new_thresholds;

            println!("[AnomalyDetector] Updated anomaly thresholds");
        }
    }

anomaly_alerting_api:
  endpoint: "GET /api/v1/privacy/anomalies/recent"
  authentication: "JWT token required (admin only)"
  parameters:
    limit: "Maximum number of anomalies to return (default: 50)"
    severity: "Filter by severity (low/medium/high/critical)"

  response: |
    {
      "anomalies": [
        {
          "anomaly_type": "access_frequency",
          "severity": "High",
          "user_id": "user_12345",
          "space_id": "space_001",
          "description": "Unusual PII access frequency detected",
          "evidence": [
            "Daily access rate: 600 (threshold: 500)"
          ],
          "detected_at": 1698765432000,
          "trace_id": "trace_abc123"
        }
      ],
      "total_count": 1
    }

anomaly_thresholds_api:
  endpoint: "PUT /api/v1/privacy/anomalies/thresholds"
  authentication: "JWT token required (admin only)"
  body: |
    {
      "max_accesses_per_hour": 100,
      "max_accesses_per_day": 500,
      "max_pii_types_per_request": 5,
      "max_gdpr_requests_per_day": 3,
      "privileged_access_alert_threshold": 10,
      "bulk_operation_threshold": 50
    }

anomaly_escalation_procedures:
  low_severity: |
    - Log to audit trail
    - Include in daily security report
    - No immediate action required

  medium_severity: |
    - Log to audit trail
    - Send email alert to security team
    - Review within 24 hours

  high_severity: |
    - Log to audit trail
    - Send immediate alert to security team
    - Escalate to incident response
    - Review within 4 hours

  critical_severity: |
    - Log to audit trail
    - Send immediate alert to all administrators
    - Initiate incident response protocol
    - Suspend suspicious accounts if necessary
    - Review within 1 hour

testing_scenarios:
  unit_tests:
    - test_access_frequency_anomaly_detection
    - test_access_scope_anomaly_detection
    - test_gdpr_request_anomaly_detection
    - test_privileged_access_anomaly_detection
    - test_anomaly_storage_and_retrieval

  integration_tests:
    - test_full_anomaly_detection_workflow
    - test_anomaly_alerting_api
    - test_threshold_updates
    - test_anomaly_escalation

  compliance_tests:
    - test_false_positive_rate_under_5_percent
    - test_critical_anomaly_detection_100_percent
    - test_anomaly_retention_90_days
