# BERT-base Model Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: Define BERT-base model architecture for NER-based PII detection

contract:
  name: bert_base_model
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

model_architecture:
  base_model:
    name: "BERT-base"
    variant: "bert-base-cased"
    parameters: "110M"
    layers: 12
    hidden_size: 768
    attention_heads: 12
    intermediate_size: 3072
    max_sequence_length: 512
    vocabulary_size: 28996

  pretrained_weights:
    source: "Hugging Face Transformers"
    checkpoint: "bert-base-cased"
    language: "English"
    training_data: "BooksCorpus (800M words) + English Wikipedia (2,500M words)"

fine_tuning:
  task: "Named Entity Recognition (NER)"
  dataset:
    name: "CoNLL-2003"
    size: "301,418 tokens"
    splits:
      train: "203,621 tokens (14,987 sentences)"
      validation: "51,362 tokens (3,466 sentences)"
      test: "46,435 tokens (3,684 sentences)"
    entity_types:
      - "PERSON"
      - "LOCATION"
      - "ORGANIZATION"
      - "MISCELLANEOUS"

  tagging_scheme:
    format: "BIO (Begin-Inside-Outside)"
    labels:
      - "O"           # Outside any entity
      - "B-PERSON"    # Begin person name
      - "I-PERSON"    # Inside person name
      - "B-LOCATION"  # Begin location/address
      - "I-LOCATION"  # Inside location/address
      - "B-ORG"       # Begin organization
      - "I-ORG"       # Inside organization
      - "B-MISC"      # Begin miscellaneous PII
      - "I-MISC"      # Inside miscellaneous PII
    total_labels: 9

  training_parameters:
    num_epochs: 3
    batch_size: 16
    learning_rate: 0.00005  # 5e-5
    warmup_steps: 500
    weight_decay: 0.01
    optimizer: "AdamW"
    scheduler: "linear warmup with linear decay"
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0

  training_duration:
    total_steps: "~38,000 steps"
    time_per_epoch: "~2 hours (on V100 GPU)"
    total_training_time: "~6 hours"

accuracy_targets:
  f1_score:
    target: ">92%"
    baseline: "92.8%"
    description: "Harmonic mean of precision and recall on CoNLL-2003 test set"

  precision:
    target: "99%"
    description: "Percentage of predicted entities that are correct"
    acceptable_range: "98-99.5%"

  recall:
    target: "95%"
    description: "Percentage of actual entities detected"
    acceptable_range: "93-97%"

  per_entity_performance:
    person:
      f1: "96.1%"
      precision: "97.2%"
      recall: "95.0%"
      examples:
        - "John Doe"
        - "Jane Smith"
        - "Dr. Emily Johnson"

    location:
      f1: "92.8%"
      precision: "94.5%"
      recall: "91.2%"
      examples:
        - "123 Main Street"
        - "New York"
        - "Apartment 7B, Oak Lane"

    organization:
      f1: "90.5%"
      precision: "92.1%"
      recall: "88.9%"
      examples:
        - "Acme Corporation"
        - "Google"
        - "University of Washington"

    miscellaneous:
      f1: "85.2%"
      precision: "87.5%"
      recall: "83.0%"
      description: "Catch-all for other PII types"

model_export:
  format: "ONNX (Open Neural Network Exchange)"
  opset_version: 14
  input_names:
    - "input_ids"      # Token IDs (int64, shape: [batch_size, sequence_length])
    - "attention_mask" # Attention mask (int64, shape: [batch_size, sequence_length])
  output_names:
    - "logits"         # Class logits (float32, shape: [batch_size, sequence_length, num_labels])
  dynamic_axes:
    input_ids:
      0: "batch_size"
      1: "sequence_length"
    attention_mask:
      0: "batch_size"
      1: "sequence_length"
    logits:
      0: "batch_size"
      1: "sequence_length"

  export_command: |
    torch.onnx.export(
        model,
        (dummy_input["input_ids"], dummy_input["attention_mask"]),
        "bert-ner-model.onnx",
        input_names=["input_ids", "attention_mask"],
        output_names=["logits"],
        dynamic_axes=dynamic_axes,
        opset_version=14,
    )

tokenization:
  tokenizer: "BertTokenizerFast"
  vocabulary: "bert-base-cased-vocab.txt"
  special_tokens:
    - "[CLS]"  # Classification token (start of sequence)
    - "[SEP]"  # Separator token (end of sequence)
    - "[PAD]"  # Padding token
    - "[UNK]"  # Unknown token
    - "[MASK]" # Mask token (not used in inference)

  tokenization_strategy:
    algorithm: "WordPiece"
    do_lower_case: false  # Preserve case (bert-base-cased)
    max_length: 512
    padding: "max_length"
    truncation: true
    return_attention_mask: true

  example:
    input_text: "Contact John Doe at 123 Main Street"
    tokens: ["Contact", "John", "Do", "##e", "at", "123", "Main", "Street"]
    input_ids: [5633, 2198, 2091, 2063, 1120, 11289, 3950, 2520]
    attention_mask: [1, 1, 1, 1, 1, 1, 1, 1]

inference_pipeline:
  steps:
    - step: "Tokenization"
      description: "Convert text to token IDs"
      latency: "<0.5ms"

    - step: "BERT Encoding"
      description: "Forward pass through BERT layers"
      latency: "<4.0ms (FP32), <1.0ms (INT8)"

    - step: "Classification Head"
      description: "Linear layer to predict NER labels"
      latency: "<0.2ms"

    - step: "Post-processing"
      description: "Decode BIO tags, merge adjacent tokens"
      latency: "<0.3ms"

  total_latency:
    fp32: "<5ms"
    int8: "<2ms"

model_files:
  bert_model:
    filename: "bert-ner-model.onnx"
    size: "438MB (FP32)"
    format: "ONNX"

  quantized_model:
    filename: "bert-ner-model-int8.onnx"
    size: "110MB (INT8, 4× smaller)"
    format: "ONNX with INT8 quantization"

  tokenizer:
    filename: "tokenizer.json"
    size: "466KB"
    format: "Hugging Face Tokenizers JSON"

  vocabulary:
    filename: "bert-base-cased-vocab.txt"
    size: "213KB"
    format: "Plain text (one token per line)"

  config:
    filename: "config.json"
    size: "570 bytes"
    format: "JSON"
    content:
      model_type: "bert"
      num_labels: 9
      hidden_size: 768
      num_attention_heads: 12
      num_hidden_layers: 12

deployment:
  runtime: "ONNX Runtime"
  hardware:
    cpu:
      supported: true
      optimization: "AVX2, AVX512 instruction sets"
      performance: "5ms inference (FP32), 1.25ms (INT8)"

    gpu:
      supported: true
      providers: "CUDA (NVIDIA), ROCm (AMD), OpenCL"
      performance: "<1ms inference (FP32), <0.3ms (INT8)"
      optional: true  # CPU sufficient for production

  memory_requirements:
    model_fp32: "438MB"
    model_int8: "110MB"
    runtime_overhead: "50MB"
    tokenizer: "5MB"
    total_footprint: "<200MB (INT8 model + runtime)"

  startup_time:
    model_loading: "<500ms"
    tokenizer_loading: "<50ms"
    total: "<550ms (one-time cost at K1 startup)"

research_foundations:
  bert_paper:
    title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
    authors: "Devlin, Chang, Lee, Toutanova"
    year: 2018
    venue: "NAACL 2019"
    key_innovation: "Bidirectional context (vs unidirectional GPT)"

  conll2003_paper:
    title: "Introduction to the CoNLL-2003 Shared Task: Language-Independent Named Entity Recognition"
    authors: "Tjong Kim Sang, De Meulder"
    year: 2003
    venue: "CoNLL 2003"
    key_innovation: "BIO tagging scheme, standardized NER benchmark"

  onnx_paper:
    title: "ONNX: Open Neural Network Exchange"
    authors: "Microsoft, Facebook, AWS"
    year: 2018
    key_innovation: "Portable neural network format, cross-framework interoperability"

testing:
  unit_tests:
    - test_bert_model_loads_successfully
    - test_tokenization_produces_correct_ids
    - test_inference_returns_logits_correct_shape
    - test_f1_score_above_92_percent_on_test_set
    - test_person_entity_detection
    - test_location_entity_detection
    - test_organization_entity_detection

  integration_tests:
    - test_end_to_end_ner_pipeline
    - test_bert_model_integrates_with_onnx_runtime
    - test_inference_latency_under_5ms
    - test_model_memory_footprint_under_200mb

  performance_tests:
    - test_inference_100_requests_avg_latency
    - test_p95_latency_under_10ms
    - test_p99_latency_under_20ms
    - test_throughput_200_requests_per_second

observability:
  metrics:
    - name: "bert_ner_model_load_time_ms"
      type: "histogram"
      description: "Time to load BERT model at startup"

    - name: "bert_ner_inference_count_total"
      type: "counter"
      labels: ["status"]  # success, error

    - name: "bert_ner_f1_score"
      type: "gauge"
      description: "Model F1-score on test set"

    - name: "bert_ner_entity_detections_total"
      type: "counter"
      labels: ["entity_type"]  # PERSON, LOCATION, ORG, MISC

documentation:
  model_card:
    path: "docs/models/bert-ner-model-card.md"
    sections:
      - "Model details (architecture, training data)"
      - "Intended use (PII detection in English text)"
      - "Training procedure (3 epochs, AdamW, CoNLL-2003)"
      - "Evaluation results (92.8% F1-score)"
      - "Limitations (English only, CoNLL-2003 entity types)"
      - "Ethical considerations (privacy protection)"

  deployment_guide:
    path: "docs/deployment/bert-ner-deployment.md"
    sections:
      - "Model download and placement"
      - "ONNX Runtime installation"
      - "Configuration (confidence threshold, entity types)"
      - "Performance tuning (quantization, batch size)"
      - "Monitoring (metrics, alerts)"
