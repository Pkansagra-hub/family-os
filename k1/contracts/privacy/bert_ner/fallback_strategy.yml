# Fallback Strategy Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: Graceful degradation when BERT-NER unavailable (model load failure, timeout, resource constraints)

contract:
  name: fallback_strategy
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

graceful_degradation:
  principle: "Always provide PII detection, even if degraded"
  fallback_chain:
    1_full_hybrid: "Regex (85%) + BERT-NER (10%) = 95% recall"
    2_regex_only: "Regex-only = 85% recall (fallback when NER unavailable)"
    3_allowlist: "Known safe patterns = 0% recall (last resort)"

fallback_triggers:
  model_load_failure:
    condition: "ONNX Runtime fails to load bert-ner-model.onnx"
    causes:
      - "Model file missing or corrupted"
      - "Incompatible ONNX Runtime version"
      - "Insufficient memory (<200MB available)"
      - "Platform incompatibility (unsupported CPU architecture)"
    action: "Switch to regex-only mode permanently for session"
    metric: "pii_ner_fallback_total{reason='model_load_failure'}"

  inference_timeout:
    condition: "Inference exceeds 10ms"
    causes:
      - "CPU throttling"
      - "High system load"
      - "Large input text (>512 tokens)"
    action: "Skip NER for this request, use regex-only"
    metric: "pii_ner_fallback_total{reason='inference_timeout'}"

  inference_error:
    condition: "ONNX Runtime returns error during inference"
    causes:
      - "Invalid input tensor shape"
      - "NaN or Inf in logits"
      - "Runtime crash"
    action: "Skip NER for this request, use regex-only"
    metric: "pii_ner_fallback_total{reason='inference_error'}"

  resource_exhaustion:
    condition: "System memory <100MB or CPU >90%"
    causes:
      - "Memory pressure"
      - "High CPU load"
    action: "Skip NER temporarily, use regex-only"
    metric: "pii_ner_fallback_total{reason='resource_exhaustion'}"

fallback_implementation:
  state_tracking:
    enum: "NerState"
    values:
      - "AVAILABLE"    # NER working, use hybrid detection
      - "UNAVAILABLE"  # NER failed permanently, use regex-only
      - "THROTTLED"    # NER temporarily disabled, retry after cooldown

  state_transitions:
    initial_state: "AVAILABLE"

    available_to_unavailable:
      trigger: "model_load_failure"
      permanent: true

    available_to_throttled:
      trigger: "inference_timeout OR inference_error OR resource_exhaustion"
      temporary: true
      cooldown: "60 seconds"

    throttled_to_available:
      trigger: "cooldown_expired AND retry_successful"

    throttled_to_unavailable:
      trigger: "consecutive_failures >= 3"
      permanent: true

  rust_implementation:
    code: |
      use std::sync::Arc;
      use std::time::{Duration, Instant};
      use tokio::sync::RwLock;

      #[derive(Clone, Copy, PartialEq)]
      enum NerState {
          Available,
          Unavailable,
          Throttled { until: Instant },
      }

      pub struct FallbackController {
          state: Arc<RwLock<NerState>>,
          consecutive_failures: Arc<RwLock<u32>>,
          max_consecutive_failures: u32,
          throttle_duration: Duration,
      }

      impl FallbackController {
          pub fn new() -> Self {
              Self {
                  state: Arc::new(RwLock::new(NerState::Available)),
                  consecutive_failures: Arc::new(RwLock::new(0)),
                  max_consecutive_failures: 3,
                  throttle_duration: Duration::from_secs(60),
              }
          }

          pub async fn should_use_ner(&self) -> bool {
              let state = self.state.read().await;
              match *state {
                  NerState::Available => true,
                  NerState::Unavailable => false,
                  NerState::Throttled { until } => {
                      if Instant::now() >= until {
                          // Cooldown expired, attempt retry
                          drop(state);
                          self.attempt_retry().await
                      } else {
                          false
                      }
                  }
              }
          }

          pub async fn record_success(&self) {
              let mut failures = self.consecutive_failures.write().await;
              *failures = 0;

              let mut state = self.state.write().await;
              *state = NerState::Available;
          }

          pub async fn record_failure(&self, reason: &str) {
              let mut failures = self.consecutive_failures.write().await;
              *failures += 1;

              let mut state = self.state.write().await;

              if reason == "model_load_failure" {
                  *state = NerState::Unavailable;
                  metrics::counter!("pii_ner_fallback_total", "reason" => "model_load_failure").increment(1);
              } else if *failures >= self.max_consecutive_failures {
                  *state = NerState::Unavailable;
                  metrics::counter!("pii_ner_fallback_total", "reason" => "consecutive_failures").increment(1);
              } else {
                  let until = Instant::now() + self.throttle_duration;
                  *state = NerState::Throttled { until };
                  metrics::counter!("pii_ner_fallback_total", "reason" => reason).increment(1);
              }
          }

          async fn attempt_retry(&self) -> bool {
              // Try to use NER, if successful, update state
              // Return true if retry successful
              true  // Placeholder
          }
      }

detection_flow_with_fallback:
  pseudo_code: |
    async fn detect_pii(text: &str, controller: &FallbackController) -> Vec<PiiDetection> {
        let mut detections = Vec::new();

        // Always run regex detection (baseline)
        let regex_detections = detect_pii_regex(text);
        detections.extend(regex_detections);

        // Conditionally run NER detection
        if controller.should_use_ner().await {
            match run_ner_inference(text).await {
                Ok(ner_detections) => {
                    controller.record_success().await;

                    // Deduplicate (prefer regex for overlaps)
                    detections = deduplicate(detections, ner_detections);
                }
                Err(e) => {
                    controller.record_failure(&e.to_string()).await;
                    // Use regex-only results
                }
            }
        }

        detections
    }

performance_impact:
  full_hybrid_mode:
    latency: "<7ms (5ms NER + 1ms regex + 1ms dedup)"
    recall: "95%"

  regex_only_mode:
    latency: "<1ms"
    recall: "85%"
    recall_delta: "-10% (unstructured PII missed)"

  allowlist_mode:
    latency: "<0.1ms"
    recall: "0%"
    use_case: "Last resort, not recommended"

user_experience:
  transparent_fallback:
    description: "Users don't notice fallback, detection continues"
    trade_off: "10% lower recall (unstructured PII missed)"

  notification:
    emit_metric: "pii_ner_fallback_total"
    log_warning: "NER unavailable, using regex-only (85% recall)"
    dashboard_alert: "NER fallback rate > 5% → investigate"

observability:
  metrics:
    - name: "pii_ner_fallback_total"
      type: "counter"
      labels: ["reason"]  # model_load_failure, inference_timeout, inference_error, resource_exhaustion, consecutive_failures
      description: "NER fallback events by reason"

    - name: "pii_ner_state"
      type: "gauge"
      values: [0, 1, 2]  # 0=UNAVAILABLE, 1=AVAILABLE, 2=THROTTLED
      description: "Current NER state"

    - name: "pii_ner_consecutive_failures"
      type: "gauge"
      description: "Consecutive NER failures"

    - name: "pii_detection_recall_effective"
      type: "gauge"
      values: [0.85, 0.95]
      description: "Effective recall based on NER state"

  logs:
    - level: "WARN"
      message: "NER model load failed, falling back to regex-only"
      fields: ["error", "reason"]

    - level: "WARN"
      message: "NER inference timeout, skipping for this request"
      fields: ["latency_ms", "text_length"]

    - level: "INFO"
      message: "NER throttle cooldown expired, retrying"
      fields: ["consecutive_failures"]

    - level: "ERROR"
      message: "NER permanently disabled after 3 consecutive failures"
      fields: ["final_error"]

fallback_testing:
  simulate_failures:
    model_load_failure:
      method: "Delete or rename bert-ner-model.onnx"
      expected: "State transitions to UNAVAILABLE, regex-only used"

    inference_timeout:
      method: "Inject 15ms delay in inference"
      expected: "State transitions to THROTTLED, regex-only used temporarily"

    inference_error:
      method: "Pass invalid input tensor shape"
      expected: "State transitions to THROTTLED, regex-only used temporarily"

    resource_exhaustion:
      method: "Allocate memory to leave <100MB available"
      expected: "State transitions to THROTTLED, regex-only used temporarily"

    consecutive_failures:
      method: "Trigger 3 inference errors"
      expected: "State transitions to UNAVAILABLE after 3rd failure"

recovery_strategies:
  automatic_recovery:
    throttled_state:
      cooldown: "60 seconds"
      retry_logic: "Attempt NER inference after cooldown"
      success_criteria: "Inference completes <10ms with valid output"

  manual_recovery:
    unavailable_state:
      triggers: ["model_load_failure", "consecutive_failures >= 3"]
      recovery_actions:
        - "Restart application to reload model"
        - "Verify model file integrity"
        - "Check system resources (memory, CPU)"
        - "Review ONNX Runtime logs"

fallback_configuration:
  max_consecutive_failures:
    default: 3
    description: "Failures before permanent fallback"
    range: [1, 10]

  throttle_duration_secs:
    default: 60
    description: "Cooldown period before retry"
    range: [10, 300]

  inference_timeout_ms:
    default: 10
    description: "Max inference time before timeout"
    range: [5, 50]

  memory_threshold_mb:
    default: 100
    description: "Min free memory to run NER"
    range: [50, 500]

example_scenarios:
  scenario_1_model_missing:
    description: "ONNX model file not found at startup"
    initial_state: "AVAILABLE"
    event: "Model load failure"
    final_state: "UNAVAILABLE"
    behavior: "Regex-only for entire session"
    recall: "85%"

  scenario_2_intermittent_timeout:
    description: "Occasional inference timeouts due to CPU load"
    initial_state: "AVAILABLE"
    events:
      - "Timeout (1/3) → THROTTLED"
      - "Cooldown 60s"
      - "Retry success → AVAILABLE"
    final_state: "AVAILABLE"
    behavior: "Temporary regex-only, auto-recovery"

  scenario_3_persistent_errors:
    description: "3 consecutive inference errors"
    initial_state: "AVAILABLE"
    events:
      - "Error 1/3 → THROTTLED"
      - "Cooldown, retry fails → Error 2/3 → THROTTLED"
      - "Cooldown, retry fails → Error 3/3 → UNAVAILABLE"
    final_state: "UNAVAILABLE"
    behavior: "Permanent regex-only"
    recall: "85%"

compliance_considerations:
  recall_reduction:
    from: "95% (hybrid)"
    to: "85% (regex-only)"
    impact: "10% of unstructured PII missed (names, addresses without suffixes)"

  gdpr_dsar:
    requirement: "Right to access/erasure depends on 95% recall"
    fallback_impact: "Higher risk of PII retention (10% missed)"
    mitigation: "Alert on fallback, manual review if DSAR requested"

  hipaa_audit:
    requirement: "Audit trail of PII detection"
    fallback_impact: "Audit logs show reduced recall"
    mitigation: "Log fallback events, emit metrics for compliance reporting"

documentation:
  fallback_strategy_guide:
    path: "docs/privacy/fallback-strategy.md"
    sections:
      - "Fallback triggers"
      - "State transitions"
      - "Performance impact"
      - "Recovery strategies"
      - "Compliance considerations"

  operational_runbook:
    path: "docs/operations/ner-fallback-runbook.md"
    sections:
      - "Detecting fallback (metrics, logs)"
      - "Diagnosing root cause"
      - "Recovery procedures"
      - "Escalation paths"

testing:
  unit_tests:
    - test_fallback_state_transitions
    - test_model_load_failure_fallback
    - test_inference_timeout_fallback
    - test_consecutive_failures_fallback
    - test_throttle_cooldown_retry
    - test_automatic_recovery

  integration_tests:
    - test_end_to_end_detection_with_fallback
    - test_fallback_metrics_emission

  chaos_tests:
    - test_random_inference_failures
    - test_resource_exhaustion_scenarios
    - test_intermittent_timeouts
