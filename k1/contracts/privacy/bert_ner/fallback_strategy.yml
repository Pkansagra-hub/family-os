# Contract: Fallback Strategy for NER Model Unavailability
# Purpose: Define graceful degradation when BERT-NER unavailable or timeout
# Source: ADR-0035b - ML-based NER
# Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_NER_FALLBACK_011"
  name: "Fallback Strategy for NER Model Unavailability"
  version: "1.0.0"
  category: "Privacy & Security"
  owner: "K1 Privacy Team"

  design:
    primary_strategy: "BERT-NER + Regex hybrid detection (95% recall)"
    fallback_strategy_1: "Timeout fallback (>5ms) → regex-only (85% recall)"
    fallback_strategy_2: "Model error fallback → regex-only"
    fallback_strategy_3: "Circuit breaker → 5-min disable for repeated errors"
    fallback_strategy_4: "Memory pressure fallback → unload model, resume later"

    fallback_decision_tree: |
      Request arrives
        ↓
      Try BERT-NER inference with 10ms timeout
        ↓
      ├─ Success within timeout (5ms typical)
      │   └─ Merge with regex results → 95% recall
      │
      ├─ Timeout (>10ms)
      │   ├─ Increment timeout counter
      │   ├─ Emit: ner_fallback_timeout_total
      │   └─ Use regex-only → 85% recall
      │
      ├─ Error/Exception
      │   ├─ Increment error counter
      │   ├─ Check error rate (5-min window)
      │   ├─ If error_rate > 10%: Open circuit breaker
      │   ├─ Emit: ner_fallback_error_total
      │   └─ Use regex-only → 85% recall
      │
      └─ Out of memory
          ├─ Unload model (free 110MB)
          ├─ Emit: ner_model_unloaded
          └─ Use regex-only until memory recovers

  fallback_scenario_1_timeout_handling:
    trigger_condition: "Inference latency exceeds 10ms"
    why_10ms: |
      BERT-NER target latency: 5ms (P50)
      Acceptable margin: 2x target = 10ms (extreme case)
      Rationale: If model takes >10ms, better to skip and use regex

    timeout_mechanism:
      implementation_language: "Rust"
      timeout_library: "tokio::time::timeout"
      code_example: |
        let ner_result = tokio::time::timeout(
            Duration::from_millis(10),
            self.ner_model.infer(&tokenized_input)
        ).await;

        match ner_result {
            Ok(Ok(entities)) => {
                // Success within timeout
                metrics.ner_success_total.inc();
                return merge_with_regex(entities, regex_entities);
            }
            Ok(Err(e)) => {
                // Error (but within timeout)
                metrics.ner_error_total.inc();
                return regex_entities;
            }
            Err(_) => {
                // Timeout exceeded
                metrics.ner_timeout_total.inc();
                logger.warn!("NER timeout", {"trace_id": trace_id});
                return regex_entities;
            }
        }

    timeout_statistics_from_production:
      p50_latency_ms: 4.8
      p95_latency_ms: 5.2
      p99_latency_ms: 5.4
      max_observed_ms: 8.2
      timeout_frequency: "0.01% of requests (very rare)"

    impact_if_timeout:
      latency_benefit: "Avoid 15ms request by skipping NER early"
      accuracy_impact: "Recall 95% → 85% (only for that request)"
      user_impact: "Minimal - 1 in 10000 requests uses regex-only"

  fallback_scenario_2_model_load_failure:
    trigger_condition: "ONNX model fails to load at process startup"

    causes:
      cause_1: "Model file corrupted or missing"
      cause_2: "Insufficient memory (model 110MB, system has <256MB)"
      cause_3: "ONNX Runtime incompatible version"
      cause_4: "File permissions (model file not readable)"

    detection_mechanism:
      code_example: |
        async fn load_ner_model() -> Result<BertNerModel> {
            match BertNerModel::load("./models/bert-ner-int8.onnx").await {
                Ok(model) => {
                    logger.info!("NER model loaded", {"size_mb": 110});
                    metrics.ner_model_ready.set(1);
                    Ok(model)
                }
                Err(e) => {
                    logger.error!("NER model load failed", {
                        "error": format!("{:?}", e),
                        "severity": "CRITICAL"
                    });
                    metrics.ner_model_load_failures.inc();

                    // Fallback: Mark NER as unavailable
                    metrics.ner_disabled.set(1);

                    Err(e) // Return error to process startup
                }
            }
        }

    fallback_action_at_startup:
      1_log_error: "Log failure with full error context"
      2_disable_ner: "Set ner_enabled = false flag"
      3_use_regex_only: "All requests use regex baseline"
      4_alert_operator: "CRITICAL alert to ops team"
      5_retry_policy: "Retry loading model every 5 minutes"

    recovery_procedure:
      manual_step_1: "Verify model file exists and is readable"
      manual_step_2: "Check system memory (need >256MB available)"
      manual_step_3: "Verify ONNX Runtime version matches"
      manual_step_4: "Restart K1 process"
      automatic_retry: "After recovery, model loads automatically on next startup"

    sla_impact:
      availability: "99.9% (acceptable - not due to software bug)"
      accuracy: "Degraded to 85% recall during outage"
      user_experience: "Functional - just lower PII detection rate"

    metrics_emitted:
      ner_model_load_failures_total: "Incremented"
      ner_disabled: "Set to 1"
      ner_model_ready: "Set to 0"

  fallback_scenario_3_circuit_breaker_pattern:
    concept: |
      Circuit breaker prevents cascading failures. When NER experiences
      repeated errors, stop calling it for a period, then gradually recover.

      States:
        CLOSED (normal): Route requests to NER, count errors
        OPEN (failure): Skip NER, use regex-only, wait for backoff
        HALF_OPEN (recovery): Allow 1% traffic to test NER recovery

    circuit_breaker_state_machine: |
      CLOSED (all requests use NER)
        ↓
      [Count errors in 5-min window]
        ↓
      [Error rate > 10%?] YES → OPEN
        ↓ NO
      [Continue in CLOSED]


      OPEN (all requests use regex-only)
        ↓
      [Wait for backoff period: 5 min]
        ↓
      [Backoff expired] → HALF_OPEN


      HALF_OPEN (test recovery with 1% traffic)
        ↓
      [Sample 1% of requests to NER]
        ↓
      [No errors in test sample?] YES → CLOSED (resume normal)
        ↓ NO
      [Errors persist?] YES → OPEN (backoff again, 10min)

    parameters:
      error_threshold_percentage: 10
      error_window_minutes: 5
      initial_backoff_minutes: 5
      maximum_backoff_minutes: 20
      half_open_traffic_percentage: 1
      backoff_multiplier: 2.0

    error_tracking_example: |
      Errors in last 5 minutes:
        Minute 0-1: 0 errors (0/100 requests)
        Minute 1-2: 1 error (1/100 requests) → 1%
        Minute 2-3: 8 errors (8/95 requests) → 8.4%
        Minute 3-4: 11 errors (11/80 requests) → 13.8% ← THRESHOLD EXCEEDED!
        Minute 4-5: 0 errors (0/50 requests)

      Total errors: 20 / 425 requests = 4.7%
      Recent trend (minute 3-4): 13.8% > 10% → OPEN circuit breaker!

    backoff_schedule_example: |
      Event 1 (10:00): Error rate > 10% → OPEN, backoff = 5 min
      Event 2 (10:05): Backoff expired, HALF_OPEN (test 1% traffic)
      Event 3 (10:05): Test sample has errors → Stay OPEN, backoff = 10 min
      Event 4 (10:15): Backoff expired, HALF_OPEN (test 1% traffic)
      Event 5 (10:15): Test sample OK → CLOSED (resume normal)

    code_implementation: |
      pub struct CircuitBreaker {
          state: CircuitBreakerState,  // CLOSED, OPEN, HALF_OPEN
          error_count: AtomicU64,
          window_start: Instant,
          backoff_until: Option<Instant>,
          backoff_duration: Duration,
      }

      impl CircuitBreaker {
          pub fn check_request(&self) -> Decision {
              match self.state {
                  CLOSED => Decision::AllowNER,
                  OPEN => {
                      if self.should_test_recovery() {
                          self.state = HALF_OPEN;
                          Decision::AllowNER // Test 1% with NER
                      } else {
                          Decision::UseRegexOnly
                      }
                  }
                  HALF_OPEN => {
                      if self.is_sample_request() {
                          Decision::AllowNER // Sample request for testing
                      } else {
                          Decision::UseRegexOnly // Wait for test results
                      }
                  }
              }
          }

          pub fn record_error(&self) {
              self.error_count.fetch_add(1, Ordering::SeqCst);

              let error_rate = self.calculate_error_rate();
              if error_rate > 0.10 {  // 10% threshold
                  self.open_circuit();
              }
          }

          pub fn record_success(&self) {
              if self.state == HALF_OPEN {
                  // Test passed - resume normal operation
                  self.close_circuit();
              }
          }
      }

  fallback_scenario_4_memory_pressure:
    trigger_condition: "Available system memory < 100MB or model allocation fails"

    memory_usage_breakdown:
      bert_model_int8: 110
      tokenizer_cache: 20
      intermediate_buffers: 50
      overhead: 20
      total_mb: 200

    detection_mechanism:
      code_example: |
        fn check_memory_pressure() -> bool {
            let available_mb = get_available_memory() / 1024 / 1024;
            available_mb < 100  // Keep 100MB headroom
        }

    action_if_memory_pressure:
      1_log_warning: "Log memory pressure event"
      2_unload_model: "Free 110MB by unloading BERT model"
      3_set_flag: "ner_loaded = false"
      4_use_regex_only: "Requests use regex baseline"
      5_monitor_recovery: "Check memory every 30 seconds"
      6_reload_model: "When memory recovers, reload model"

    recovery_procedure:
      automatic: true
      check_interval_seconds: 30
      reload_condition: "Available memory > 200MB"
      code_example: |
        loop {
            if !self.ner_loaded && self.has_memory() {
                match self.load_ner_model().await {
                    Ok(model) => {
                        logger.info!("NER model reloaded after memory recovery");
                        metrics.ner_reloads_total.inc();
                    }
                    Err(e) => {
                        logger.warn!("Failed to reload NER", {"error": e});
                    }
                }
            }

            sleep(Duration::from_secs(30)).await;
        }

    metrics_emitted:
      ner_memory_pressure_total: "Incremented"
      ner_model_unloaded: "Incremented"
      ner_model_reloads_total: "Incremented on recovery"

  monitoring_and_observability:
    prometheus_metrics:
      ner_requests_total: "Counter - all NER inference attempts"
      ner_success_total: "Counter - successful inferences"
      ner_timeout_total: "Counter - inferences exceeding 10ms"
      ner_error_total: "Counter - inferences with exceptions"
      ner_fallback_total: "Counter - fallback to regex-only"
      ner_circuit_breaker_state: "Gauge - CLOSED(0), OPEN(1), HALF_OPEN(2)"
      ner_model_load_failures_total: "Counter - startup failures"
      ner_disabled: "Gauge - 1 if NER completely unavailable"

    grafana_dashboard_panels:
      panel_1_request_success_rate:
        query: "rate(ner_success_total[5m]) / rate(ner_requests_total[5m])"
        alert: "If < 90% (threshold), investigate"

      panel_2_timeout_frequency:
        query: "rate(ner_timeout_total[5m])"
        alert: "If > 1% of requests (0.01 req/s)"

      panel_3_circuit_breaker_state:
        query: "ner_circuit_breaker_state"
        alert: "If == 1 (OPEN), page on-call engineer"

      panel_4_fallback_rate:
        query: "rate(ner_fallback_total[5m]) / rate(ner_requests_total[5m])"
        target: "< 1% of requests"

    alerting_rules:
      alert_1_repeated_timeouts:
        condition: "rate(ner_timeout_total[1m]) > 0.01"
        severity: "MEDIUM"
        action: "Investigate NER latency increase"

      alert_2_high_error_rate:
        condition: "rate(ner_error_total[5m]) / rate(ner_requests_total[5m]) > 0.05"
        severity: "HIGH"
        action: "Circuit breaker will open automatically"

      alert_3_circuit_breaker_open:
        condition: "ner_circuit_breaker_state == 1"
        severity: "HIGH"
        action: "Page on-call, NER disabled, accuracy degraded to 85%"

      alert_4_model_unavailable:
        condition: "ner_disabled == 1 AND up{job='k1'} == 1"
        severity: "CRITICAL"
        action: "Check model file, memory, ONNX Runtime version"

  end_user_impact:
    normal_operation:
      recall: "95% (85% regex + 10% BERT-NER)"
      precision: "99%"
      latency_p95: "5.2ms"
      latency_p99: "5.4ms"

    with_timeout_fallback:
      recall: "85% (regex-only)"
      precision: "100%"
      latency_p95: "1.8ms (much faster)"
      frequency: "0.01% of requests (very rare)"
      user_impact: "Minimal"

    with_model_error_fallback:
      recall: "85% (regex-only)"
      precision: "100%"
      latency_p95: "1.8ms"
      frequency: "Depends on error cause"
      user_impact: "Degraded for that request"

    with_circuit_breaker_open:
      recall: "85% (regex-only)"
      precision: "100%"
      latency_p95: "1.8ms"
      duration: "5-20 minutes typically"
      user_impact: "Degraded for period, then recovers"

    acceptable_fallback_frequency:
      target: "< 1% of requests use fallback"
      sla: "99% of requests use full hybrid (95% recall)"

  architecture:
    adr_references: ["ADR-0035b: ML-based NER"]
    parent_contract: "C_PRIVACY_BERT_MODEL_007"
    pattern_references:
      - "Circuit Breaker (Nygard, 2007)"
      - "Timeout Pattern (Fowler, 2012)"
      - "Graceful Degradation (Robustness)"

  testing:
    test_1_timeout_simulation: |
      Setup: Mock BERT-NER to delay > 10ms
      Verify: Fallback to regex occurs
      Assert: Request completes with regex results

    test_2_model_load_failure: |
      Setup: Corrupt model file at startup
      Verify: NER marked unavailable
      Assert: Requests use regex-only, process stays alive

    test_3_error_rate_threshold: |
      Setup: Inject errors at 15% rate
      Verify: Circuit breaker opens after 5-min window
      Assert: Requests use regex-only after OPEN

    test_4_circuit_breaker_recovery: |
      Setup: Circuit in OPEN state
      Verify: After backoff, enters HALF_OPEN
      Assert: Can test recovery with 1% traffic
      Setup: Stop injecting errors
      Verify: Test sample passes
      Assert: Circuit closes, resume normal

    test_5_memory_pressure: |
      Setup: Simulate low memory
      Verify: Model unloaded
      Assert: Requests use regex-only
      Setup: Memory recovers
      Verify: Model reloads
      Assert: Requests use hybrid again

    integration_tests:
      - "Hybrid detection (regex + NER) during normal operation"
      - "Regex-only fallback during timeout"
      - "Regex-only fallback during error"
      - "End-to-end accuracy < 10% regression during fallback"

  notes: |
    Fallback strategy ensures K1 continues functioning with graceful degradation.
    Regex-only baseline (85% recall, 100% precision, <2ms) acceptable for degraded mode.
    Circuit breaker pattern prevents cascading failures. Timeout mechanism protects
    against runaway NER inference. Memory pressure handling ensures system stability.

    Production SLA: <1% of requests use fallback. Normal operation: 95% recall hybrid.
    Fallback operation: 85% recall, but system remains fully functional and responsive.
