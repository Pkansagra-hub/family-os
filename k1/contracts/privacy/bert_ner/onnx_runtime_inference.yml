# ONNX Runtime Inference Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: Define ONNX Runtime integration for BERT-NER inference with quantization support

contract:
  name: onnx_runtime_inference
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

onnx_runtime:
  version: ">=1.16.0"
  installation:
    rust_crate: "onnxruntime = \"1.16\""
    features: ["default"]  # CPU support, optional: ["cuda", "tensorrt"] for GPU

  providers:
    cpu:
      name: "CPUExecutionProvider"
      enabled: true
      default: true
      optimization_level: "GraphOptimizationLevel::Level3"
      description: "CPU inference with AVX2/AVX512 acceleration"

    cuda:
      name: "CUDAExecutionProvider"
      enabled: false  # Optional for GPU acceleration
      default: false
      requirements: "CUDA 11.x or 12.x, cuDNN 8.x"
      description: "NVIDIA GPU inference"

    tensorrt:
      name: "TensorRTExecutionProvider"
      enabled: false  # Optional for maximum GPU performance
      default: false
      requirements: "TensorRT 8.x"
      description: "NVIDIA TensorRT optimized inference"

inference_session:
  initialization:
    environment:
      class: "Environment"
      logging_level: "Warning"
      thread_pool_size: 4

    session_options:
      optimization_level: "GraphOptimizationLevel::Level3"
      enable_profiling: false
      enable_cpu_mem_arena: true
      enable_mem_pattern: true
      execution_mode: "ExecutionMode::Sequential"
      inter_op_num_threads: 4
      intra_op_num_threads: 4

    model_loading:
      method: "from_file"
      path: "models/bert-ner-model-int8.onnx"
      latency: "<500ms"
      memory: "~110MB (INT8 model)"

  configuration:
    graph_optimization:
      level: "Level3"
      transformations:
        - "Constant folding"
        - "Redundant node elimination"
        - "Common subexpression elimination"
        - "Layout transformation"
        - "Operator fusion"

    memory_optimization:
      enable_memory_pattern: true
      enable_cpu_mem_arena: true
      description: "Reuse memory allocations across inference calls"

    execution_mode:
      mode: "Sequential"
      description: "Execute operators sequentially (vs parallel for multi-model)"

input_preparation:
  tokenization:
    library: "tokenizers (Hugging Face)"
    rust_crate: "tokenizers = \"0.19\""
    tokenizer_file: "models/tokenizer.json"

  input_tensors:
    input_ids:
      name: "input_ids"
      dtype: "int64"
      shape: "[batch_size, sequence_length]"
      description: "Token IDs from BERT vocabulary"
      example_shape: "[1, 128]"

    attention_mask:
      name: "attention_mask"
      dtype: "int64"
      shape: "[batch_size, sequence_length]"
      description: "Mask indicating real tokens (1) vs padding (0)"
      example_shape: "[1, 128]"

  tensor_creation:
    library: "ndarray"
    rust_crate: "ndarray = \"0.15\""
    method: "Array2::from_shape_vec"
    conversion: "OrtOwnedTensor::from(array)"

inference_execution:
  run_inference:
    method: "session.run(inputs)"
    inputs: "Vec<OrtOwnedTensor>"
    outputs: "Vec<OrtOwnedTensor>"
    latency:
      fp32_model: "~5ms"
      int8_model: "~1.25ms (4× faster)"

  output_extraction:
    output_tensor:
      name: "logits"
      dtype: "float32"
      shape: "[batch_size, sequence_length, num_labels]"
      description: "Raw logits for each token and label"

    extraction_method:
      code: "outputs[0].try_extract::<f32, _>()"
      returns: "OrtOwnedTensor<f32, IxDyn>"
      view: "tensor.view()"

post_processing:
  label_prediction:
    method: "Argmax over num_labels dimension"
    description: "For each token, select label with highest logit"
    algorithm: |
      for token_logits in logits_view.axis_iter(Axis(1)):
          (label_id, confidence) = token_logits
              .iter()
              .enumerate()
              .max_by(|(_, a), (_, b)| a.partial_cmp(b).unwrap())

  confidence_filtering:
    threshold: 0.8
    description: "Skip predictions below confidence threshold"
    rationale: "Reduce false positives while maintaining high recall"

  bio_tag_decoding:
    labels:
      - "O"           # Outside entity
      - "B-PERSON"    # Begin person
      - "I-PERSON"    # Inside person
      - "B-LOCATION"  # Begin location
      - "I-LOCATION"  # Inside location
      - "B-ORG"       # Begin organization
      - "I-ORG"       # Inside organization
      - "B-MISC"      # Begin miscellaneous
      - "I-MISC"      # Inside miscellaneous

    decoding_logic:
      b_tag: "Start new entity, store previous if exists"
      i_tag: "Continue current entity, extend span"
      o_tag: "Outside entity, store previous if exists"

  entity_merging:
    description: "Merge adjacent B-* and I-* tokens into single entity"
    example:
      tokens: ["John", "Do", "##e"]
      labels: ["B-PERSON", "I-PERSON", "I-PERSON"]
      merged_entity: "John Doe (PERSON)"

  token_span_alignment:
    method: "Use tokenizer offsets to map tokens to original text"
    example:
      original_text: "Contact John Doe"
      token_offsets: [(0, 7), (8, 12), (13, 15), (15, 16)]
      entity_span: (8, 16)  # "John Doe"

int8_quantization:
  purpose: "4× speedup and 4× model size reduction"

  quantization_method:
    tool: "ONNX Runtime quantization tool"
    command: |
      from onnxruntime.quantization import quantize_dynamic, QuantType

      quantize_dynamic(
          model_input="bert-ner-model.onnx",
          model_output="bert-ner-model-int8.onnx",
          weight_type=QuantType.QInt8,
          per_channel=True,
          reduce_range=False,
      )

  quantization_details:
    weight_type: "QInt8 (8-bit signed integer)"
    per_channel: true
    description: "Quantize weights per channel for better accuracy"

  accuracy_impact:
    f1_score_drop: "<1%"
    fp32_baseline: "92.8%"
    int8_quantized: "92.1%"
    acceptable: true

  performance_improvement:
    inference_speedup: "4×"
    fp32_latency: "5ms"
    int8_latency: "1.25ms"
    model_size_reduction: "4×"
    fp32_size: "438MB"
    int8_size: "110MB"

performance_targets:
  latency:
    tokenization: "<0.5ms"
    inference_int8: "<1.25ms"
    post_processing: "<0.3ms"
    total_pipeline: "<2ms (INT8), <5ms (FP32)"

  throughput:
    single_request: "~500 requests/second (INT8 on CPU)"
    batch_processing: "~2000 requests/second (batch_size=8)"

  memory:
    model_fp32: "438MB"
    model_int8: "110MB"
    runtime_overhead: "50MB"
    tokenizer: "5MB"
    total_int8: "<200MB"

error_handling:
  model_load_failure:
    error: "Failed to load BERT-NER model"
    action: "Log error, fall back to regex-only detection"
    metric: "ner_model_load_failures_total"

  inference_failure:
    error: "ONNX Runtime inference failed"
    action: "Log error, return empty results, use regex-only"
    metric: "ner_inference_failures_total"

  timeout:
    threshold: "10ms"
    action: "Cancel inference, fall back to regex-only"
    metric: "ner_inference_timeouts_total"

  out_of_memory:
    error: "Insufficient memory for model"
    action: "Log error, disable NER, use regex-only"
    metric: "ner_oom_errors_total"

implementation_example:
  rust_code: |
    use onnxruntime::{environment::Environment, session::Session};
    use tokenizers::Tokenizer;
    use std::sync::Arc;
    use std::time::Instant;

    pub struct BertNER {
        session: Arc<Session<'static>>,
        tokenizer: Tokenizer,
        labels: Vec<String>,
        confidence_threshold: f32,
    }

    impl BertNER {
        pub fn load(model_path: &str, tokenizer_path: &str)
            -> Result<Self, Box<dyn std::error::Error>>
        {
            // Initialize ONNX Runtime environment
            let environment = Arc::new(
                Environment::builder()
                    .with_name("bert-ner")
                    .build()?
            );

            // Load ONNX model
            let session = Session::builder()?
                .with_optimization_level(
                    GraphOptimizationLevel::Level3
                )?
                .with_model_from_file(model_path)?;

            // Load tokenizer
            let tokenizer = Tokenizer::from_file(tokenizer_path)?;

            // BIO labels
            let labels = vec![
                "O", "B-PERSON", "I-PERSON",
                "B-LOCATION", "I-LOCATION",
                "B-ORG", "I-ORG",
                "B-MISC", "I-MISC",
            ].into_iter().map(String::from).collect();

            Ok(Self {
                session: Arc::new(session),
                tokenizer,
                labels,
                confidence_threshold: 0.8,
            })
        }

        pub fn detect(&self, text: &str, trace_id: &str)
            -> Result<Vec<PIIDetection>, Box<dyn std::error::Error>>
        {
            let start = Instant::now();

            // Tokenize
            let encoding = self.tokenizer.encode(text, false)?;
            let input_ids: Vec<i64> = encoding
                .get_ids()
                .iter()
                .map(|&id| id as i64)
                .collect();
            let attention_mask: Vec<i64> = encoding
                .get_attention_mask()
                .iter()
                .map(|&m| m as i64)
                .collect();

            // Prepare tensors
            let input_ids_tensor = ndarray::Array2::from_shape_vec(
                (1, input_ids.len()),
                input_ids.clone(),
            )?;
            let attention_mask_tensor = ndarray::Array2::from_shape_vec(
                (1, attention_mask.len()),
                attention_mask.clone(),
            )?;

            // Run inference
            let outputs = self.session.run(vec![
                input_ids_tensor.into(),
                attention_mask_tensor.into(),
            ])?;

            // Extract logits and decode
            let logits: OrtOwnedTensor<f32, _> = outputs[0].try_extract()?;
            let detections = self.decode_entities(
                &logits.view(),
                &encoding,
                text,
            );

            let latency_ms = start.elapsed().as_micros() as f64 / 1000.0;

            println!(
                "[BertNER] {} entities in {:.2}ms (trace: {})",
                detections.len(), latency_ms, trace_id
            );

            Ok(detections)
        }
    }

cross_platform_support:
  operating_systems:
    linux:
      supported: true
      optimization: "AVX2, AVX512"

    macos:
      supported: true
      optimization: "Apple Silicon (Metal), Intel (AVX2)"

    windows:
      supported: true
      optimization: "AVX2, AVX512"

  architectures:
    x86_64:
      supported: true
      optimizations: ["AVX2", "AVX512", "FMA"]

    aarch64:
      supported: true
      optimizations: ["NEON", "Apple Neural Engine"]

observability:
  metrics:
    - name: "onnx_runtime_init_time_ms"
      type: "histogram"
      description: "Time to initialize ONNX Runtime environment"

    - name: "onnx_model_load_time_ms"
      type: "histogram"
      description: "Time to load ONNX model"

    - name: "onnx_inference_latency_ms"
      type: "histogram"
      labels: ["model_type"]  # fp32, int8

    - name: "onnx_inference_count_total"
      type: "counter"
      labels: ["status", "model_type"]  # success/error, fp32/int8

    - name: "onnx_post_processing_latency_ms"
      type: "histogram"
      description: "Time for BIO tag decoding and entity merging"

    - name: "onnx_memory_usage_bytes"
      type: "gauge"
      labels: ["component"]  # model, runtime, tokenizer

testing:
  unit_tests:
    - test_onnx_runtime_initializes_successfully
    - test_model_loads_from_file
    - test_tokenizer_produces_correct_tensors
    - test_inference_returns_logits_correct_shape
    - test_int8_quantization_4x_speedup
    - test_confidence_threshold_filtering
    - test_bio_tag_decoding
    - test_entity_merging

  integration_tests:
    - test_end_to_end_inference_pipeline
    - test_cross_platform_compatibility
    - test_inference_latency_under_5ms
    - test_int8_inference_latency_under_2ms

  performance_tests:
    - test_throughput_500_requests_per_second
    - test_p95_latency_under_3ms
    - test_p99_latency_under_10ms
    - test_memory_footprint_under_200mb

dependencies:
  rust_crates:
    - "onnxruntime = \"1.16\""
    - "tokenizers = \"0.19\""
    - "ndarray = \"0.15\""

  system_libraries:
    - "libonnxruntime.so (Linux)"
    - "libonnxruntime.dylib (macOS)"
    - "onnxruntime.dll (Windows)"

  optional:
    - "CUDA Runtime (for GPU acceleration)"
    - "TensorRT (for NVIDIA GPU optimization)"

documentation:
  user_guide:
    path: "docs/inference/onnx-runtime-guide.md"
    sections:
      - "Installing ONNX Runtime"
      - "Loading BERT-NER model"
      - "Running inference"
      - "INT8 quantization benefits"
      - "Performance tuning"

  api_reference:
    path: "docs/api/bert-ner-api.md"
    sections:
      - "BertNER::load()"
      - "BertNER::detect()"
      - "PIIDetection struct"
      - "Error handling"
