# Post-Processing Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: BIO tag decoding, entity merging, confidence filtering, deduplication

contract:
  name: post_processing
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

post_processing_pipeline:
  stages:
    1_logits_to_labels:
      input: "Logits tensor (batch_size, sequence_length, num_labels)"
      operation: "Argmax along num_labels dimension"
      output: "Label IDs (batch_size, sequence_length)"
      latency: "<0.05ms"

    2_labels_to_bio_tags:
      input: "Label IDs (0-8)"
      operation: "Map label ID to BIO tag string"
      output: "BIO tags (O, B-PERSON, I-PERSON, ...)"
      latency: "<0.01ms"

    3_bio_tag_decoding:
      input: "BIO tags + tokenized text"
      operation: "Merge B-* and I-* tokens into entities"
      output: "Raw entities with spans"
      latency: "<0.2ms"

    4_confidence_filtering:
      input: "Raw entities + logits"
      operation: "Filter entities below threshold (0.8)"
      output: "High-confidence entities"
      latency: "<0.05ms"

    5_token_span_alignment:
      input: "Token-level entities + original text"
      operation: "Map subword tokens to character spans"
      output: "Character-level entities"
      latency: "<0.1ms"

    6_entity_deduplication:
      input: "NER entities + regex entities"
      operation: "Remove overlapping spans, prefer regex"
      output: "Final deduplicated entities"
      latency: "<0.1ms"

  total_latency: "<0.5ms"

logits_to_labels:
  algorithm: "Argmax"

  implementation:
    language: "Rust"
    code: |
      // Input: logits (batch_size=1, seq_len, num_labels=9)
      // Output: label_ids (seq_len)

      fn logits_to_labels(logits: &Array3<f32>) -> Vec<usize> {
          let seq_len = logits.dim().1;
          let mut label_ids = Vec::with_capacity(seq_len);

          for token_idx in 0..seq_len {
              let token_logits = logits.slice(s![0, token_idx, ..]);
              let max_label = token_logits
                  .iter()
                  .enumerate()
                  .max_by(|(_, a), (_, b)| a.partial_cmp(b).unwrap())
                  .map(|(idx, _)| idx)
                  .unwrap();

              label_ids.push(max_label);
          }

          label_ids
      }

  label_mapping:
    0: "O"
    1: "B-PERSON"
    2: "I-PERSON"
    3: "B-LOCATION"
    4: "I-LOCATION"
    5: "B-ORG"
    6: "I-ORG"
    7: "B-MISC"
    8: "I-MISC"

  performance:
    latency: "<0.05ms"
    memory: "O(sequence_length)"

bio_tag_decoding:
  algorithm: "FSM-based entity extraction"

  state_machine:
    states:
      - "OUTSIDE"  # O tag, not in entity
      - "INSIDE"   # I-* tag, continuing entity
      - "BEGIN"    # B-* tag, starting new entity

    transitions:
      O_to_O: "Continue outside entity"
      O_to_B: "Start new entity"
      B_to_I: "Continue entity (same type)"
      B_to_B: "End current entity, start new entity"
      I_to_I: "Continue entity (same type)"
      I_to_B: "End current entity, start new entity"
      I_to_O: "End current entity"

  implementation:
    language: "Rust"
    code: |
      struct RawEntity {
          entity_type: String,  // PERSON, LOCATION, ORG, MISC
          token_indices: Vec<usize>,
          start_token: usize,
          end_token: usize,
      }

      fn decode_bio_tags(
          tags: &[String],
          tokens: &[String],
      ) -> Vec<RawEntity> {
          let mut entities = Vec::new();
          let mut current_entity: Option<RawEntity> = None;

          for (idx, tag) in tags.iter().enumerate() {
              match tag.as_str() {
                  "O" => {
                      // End current entity if any
                      if let Some(entity) = current_entity.take() {
                          entities.push(entity);
                      }
                  }
                  tag if tag.starts_with("B-") => {
                      // End current entity, start new entity
                      if let Some(entity) = current_entity.take() {
                          entities.push(entity);
                      }

                      let entity_type = tag[2..].to_string();
                      current_entity = Some(RawEntity {
                          entity_type,
                          token_indices: vec![idx],
                          start_token: idx,
                          end_token: idx + 1,
                      });
                  }
                  tag if tag.starts_with("I-") => {
                      // Continue entity (only if same type)
                      let entity_type = &tag[2..];

                      if let Some(ref mut entity) = current_entity {
                          if entity.entity_type == entity_type {
                              entity.token_indices.push(idx);
                              entity.end_token = idx + 1;
                          } else {
                              // Type mismatch, end current, start new
                              entities.push(current_entity.take().unwrap());
                              current_entity = Some(RawEntity {
                                  entity_type: entity_type.to_string(),
                                  token_indices: vec![idx],
                                  start_token: idx,
                                  end_token: idx + 1,
                              });
                          }
                      } else {
                          // I-* without B-*, treat as B-*
                          current_entity = Some(RawEntity {
                              entity_type: entity_type.to_string(),
                              token_indices: vec![idx],
                              start_token: idx,
                              end_token: idx + 1,
                          });
                      }
                  }
                  _ => {}
              }
          }

          // Push final entity if any
          if let Some(entity) = current_entity {
              entities.push(entity);
          }

          entities
      }

  edge_cases:
    i_without_b:
      scenario: "I-PERSON without preceding B-PERSON"
      handling: "Treat I-PERSON as B-PERSON (start new entity)"

    type_mismatch:
      scenario: "B-PERSON followed by I-LOCATION"
      handling: "End PERSON entity, start new LOCATION entity"

    consecutive_b_tags:
      scenario: "B-PERSON followed by B-PERSON"
      handling: "End first entity, start second entity"

  performance:
    latency: "<0.2ms"
    memory: "O(num_entities)"

confidence_filtering:
  threshold: 0.8
  description: "Filter entities with average token confidence below threshold"

  algorithm: "Average confidence across entity tokens"

  implementation:
    language: "Rust"
    code: |
      fn filter_by_confidence(
          entities: Vec<RawEntity>,
          logits: &Array3<f32>,
          threshold: f32,
      ) -> Vec<RawEntity> {
          entities
              .into_iter()
              .filter(|entity| {
                  let avg_confidence = compute_entity_confidence(entity, logits);
                  avg_confidence >= threshold
              })
              .collect()
      }

      fn compute_entity_confidence(
          entity: &RawEntity,
          logits: &Array3<f32>,
      ) -> f32 {
          let mut total_confidence = 0.0;

          for &token_idx in &entity.token_indices {
              let token_logits = logits.slice(s![0, token_idx, ..]);
              let max_logit = token_logits.iter().cloned().fold(f32::NEG_INFINITY, f32::max);

              // Softmax for confidence score
              let exp_sum: f32 = token_logits.iter().map(|&x| (x - max_logit).exp()).sum();
              let max_confidence = (max_logit - max_logit).exp() / exp_sum;

              total_confidence += max_confidence;
          }

          total_confidence / entity.token_indices.len() as f32
      }

  confidence_distribution:
    high: ">0.95 (70% of entities pass)"
    medium: "0.80-0.95 (25% of entities pass)"
    low: "<0.80 (5% of entities filtered out)"

  metrics:
    - name: "pii_ner_filtered_low_confidence_total"
      type: "counter"
      labels: ["entity_type"]
      description: "Entities filtered due to low confidence"

  performance:
    latency: "<0.05ms per entity"
    memory: "O(num_entities)"

token_span_alignment:
  purpose: "Map subword tokens to character offsets in original text"

  challenge: "Tokenization splits words into subwords (e.g., 'John' → ['Jo', '##hn'])"

  algorithm: "Track character offsets during tokenization"

  implementation:
    language: "Rust"
    code: |
      use tokenizers::Encoding;

      struct CharLevelEntity {
          entity_type: String,
          value: String,
          start_pos: usize,  // Character offset
          end_pos: usize,    // Character offset
          confidence: f32,
      }

      fn align_to_char_spans(
          entities: Vec<RawEntity>,
          encoding: &Encoding,
          original_text: &str,
          confidences: Vec<f32>,
      ) -> Vec<CharLevelEntity> {
          entities
              .into_iter()
              .zip(confidences)
              .map(|(entity, confidence)| {
                  // Get character offsets for start and end tokens
                  let start_offset = encoding.token_to_chars(entity.start_token)
                      .map(|range| range.start)
                      .unwrap_or(0);

                  let end_offset = encoding.token_to_chars(entity.end_token - 1)
                      .map(|range| range.end)
                      .unwrap_or(original_text.len());

                  let value = original_text[start_offset..end_offset].to_string();

                  CharLevelEntity {
                      entity_type: entity.entity_type,
                      value,
                      start_pos: start_offset,
                      end_pos: end_offset,
                      confidence,
                  }
              })
              .collect()
      }

  tokenization_offsets:
    feature: "tokenizers crate provides token_to_chars() method"
    example:
      text: "Contact John Doe"
      tokens: ["Contact", "John", "Do", "##e"]
      token_offsets:
        - "Contact: (0, 7)"
        - "John: (8, 12)"
        - "Do: (13, 15)"
        - "##e: (15, 16)"
      entity_span:
        tokens: ["John", "Do", "##e"]
        char_span: (8, 16)
        value: "John Doe"

  edge_cases:
    whitespace_handling:
      scenario: "Multiple spaces between tokens"
      handling: "token_to_chars() returns correct offsets"

    special_characters:
      scenario: "Punctuation adjacent to entity"
      handling: "Exclude punctuation from entity span"
      example:
        text: "Call John."
        entity: "John (not John.)"

  performance:
    latency: "<0.1ms"
    memory: "O(num_entities)"

entity_deduplication:
  purpose: "Remove overlapping spans from NER and regex detection"

  strategy: "Prefer regex over NER for overlapping spans"
  rationale: "Regex has 100% precision for structured PII"

  algorithm: "Interval tree for overlap detection"

  implementation:
    language: "Rust"
    code: |
      fn deduplicate_entities(
          ner_entities: Vec<PiiDetection>,
          regex_entities: Vec<PiiDetection>,
      ) -> Vec<PiiDetection> {
          let mut all_entities = regex_entities.clone();

          // Add NER entities that don't overlap with regex
          for ner_entity in ner_entities {
              let overlaps = regex_entities.iter().any(|regex_entity| {
                  spans_overlap(
                      (ner_entity.start_pos, ner_entity.end_pos),
                      (regex_entity.start_pos, regex_entity.end_pos),
                  )
              });

              if !overlaps {
                  all_entities.push(ner_entity);
              }
          }

          // Sort by start position
          all_entities.sort_by_key(|e| e.start_pos);
          all_entities
      }

      fn spans_overlap(span1: (usize, usize), span2: (usize, usize)) -> bool {
          let (start1, end1) = span1;
          let (start2, end2) = span2;

          // Overlaps if start1 < end2 AND start2 < end1
          start1 < end2 && start2 < end1
      }

  overlap_scenarios:
    exact_match:
      example:
        regex: "john@example.com - EMAIL"
        ner: "john@example.com - MISC"
        result: "Use regex (EMAIL)"

    partial_overlap:
      example:
        regex: "123 Main Street - ADDRESS pattern with street suffix"
        ner: "123 Main - LOCATION without suffix"
        result: "Use regex (more complete)"

    no_overlap:
      example:
        regex: "john@example.com - EMAIL"
        ner: "John Doe - PERSON"
        result: "Keep both"

  metrics:
    - name: "pii_deduplication_overlaps_total"
      type: "counter"
      labels: ["ner_type", "regex_type"]
      description: "NER entities removed due to regex overlap"

  performance:
    latency: "<0.1ms"
    complexity: "O(n * m) where n=NER entities, m=regex entities"
    optimization: "Use interval tree for O(n log m) if >100 entities"

final_output_format:
  struct: "PiiDetection"
  fields:
    pii_type:
      type: "String"
      values: ["name", "email", "phone", "ssn", "credit_card", "address", "organization"]

    value:
      type: "String"
      description: "Original PII text"

    placeholder:
      type: "String"
      values: ["[NAME]", "[EMAIL]", "[PHONE]", "[SSN]", "[CREDIT_CARD]", "[ADDRESS]", "[ORGANIZATION]"]

    start_pos:
      type: "usize"
      description: "Character offset (0-indexed)"

    end_pos:
      type: "usize"
      description: "Character offset (exclusive)"

    confidence:
      type: "f32"
      range: "[0.0, 1.0]"
      description: "Detection confidence (1.0 for regex)"

    detection_method:
      type: "String"
      values: ["bert_ner", "regex"]

  example:
    - pii_type: "email"
      value: "john@example.com"
      placeholder: "[EMAIL]"
      start_pos: 15
      end_pos: 31
      confidence: 1.0
      detection_method: "regex"

    - pii_type: "name"
      value: "John Doe"
      placeholder: "[NAME]"
      start_pos: 8
      end_pos: 16
      confidence: 0.95
      detection_method: "bert_ner"

error_handling:
  invalid_token_index:
    scenario: "token_to_chars() returns None"
    handling: "Skip entity, log warning, emit metric"
    metric: "pii_ner_alignment_errors_total"

  confidence_computation_error:
    scenario: "Logits contain NaN or Inf"
    handling: "Set confidence to 0.0, filter entity"
    metric: "pii_ner_confidence_errors_total"

  deduplication_error:
    scenario: "Overlap detection fails"
    handling: "Keep both entities, log warning"
    metric: "pii_deduplication_errors_total"

performance_budget:
  total_post_processing: "<0.5ms"
  breakdown:
    logits_to_labels: "<0.05ms"
    bio_tag_decoding: "<0.2ms"
    confidence_filtering: "<0.05ms"
    token_span_alignment: "<0.1ms"
    entity_deduplication: "<0.1ms"

  scalability:
    small_input: "<100 tokens → <0.3ms"
    medium_input: "100-300 tokens → <0.5ms"
    large_input: "300-512 tokens → <0.8ms"

observability:
  metrics:
    - name: "pii_ner_post_processing_duration_ms"
      type: "histogram"
      labels: ["stage"]  # logits_to_labels, bio_tag_decoding, etc.
      buckets: [0.01, 0.05, 0.1, 0.2, 0.5, 1.0]

    - name: "pii_ner_entities_decoded_total"
      type: "counter"
      labels: ["entity_type"]

    - name: "pii_ner_entities_filtered_total"
      type: "counter"
      labels: ["entity_type", "reason"]  # low_confidence, alignment_error

    - name: "pii_deduplication_overlaps_total"
      type: "counter"
      labels: ["ner_type", "regex_type"]

  tracing:
    spans:
      - "post_processing.logits_to_labels"
      - "post_processing.bio_tag_decoding"
      - "post_processing.confidence_filtering"
      - "post_processing.token_span_alignment"
      - "post_processing.entity_deduplication"

testing:
  unit_tests:
    - test_logits_to_labels_argmax
    - test_bio_tag_decoding_fsm
    - test_bio_tag_edge_cases_i_without_b
    - test_bio_tag_edge_cases_type_mismatch
    - test_confidence_filtering_threshold
    - test_token_span_alignment_subwords
    - test_entity_deduplication_overlap
    - test_entity_deduplication_no_overlap

  integration_tests:
    - test_end_to_end_post_processing
    - test_hybrid_ner_regex_deduplication

  performance_tests:
    - test_post_processing_latency_small_input
    - test_post_processing_latency_medium_input
    - test_post_processing_latency_large_input

  edge_case_tests:
    - test_empty_input
    - test_no_entities_detected
    - test_all_entities_filtered
    - test_overlapping_entities_same_type
    - test_adjacent_entities

documentation:
  post_processing_guide:
    path: "docs/privacy/post-processing.md"
    sections:
      - "BIO tag decoding algorithm"
      - "Confidence filtering"
      - "Token span alignment"
      - "Entity deduplication"
      - "Performance characteristics"
