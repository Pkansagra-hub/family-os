# PII Entity Types Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: Define PII entity types detected by BERT-NER (PERSON, LOCATION, ORGANIZATION, MISC)

contract:
  name: pii_entity_types
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

entity_types:
  person:
    bio_tags: ["B-PERSON", "I-PERSON"]
    pii_type: "name"
    placeholder: "[NAME]"
    description: "Person names (first, last, full names, titles)"

    detection_patterns:
      - "Full names: John Doe, Jane Smith"
      - "Names with titles: Dr. Emily Johnson, Mr. Robert Brown"
      - "Names with suffixes: William Jones Jr., Sarah Davis III"
      - "Single names: John, Smith (context-dependent)"
      - "Hyphenated names: Mary-Anne Wilson"
      - "Names with middle initials: John Q. Public"

    examples:
      valid:
        - text: "Contact John Doe"
          entity: "John Doe"
          span: (8, 16)

        - text: "Dr. Emily Johnson will attend"
          entity: "Dr. Emily Johnson"
          span: (0, 18)

        - text: "Call Sarah Davis III"
          entity: "Sarah Davis III"
          span: (5, 20)

      edge_cases:
        - text: "The smith will repair it"
          entity: null
          note: "Common noun, not person name"

        - text: "John works at Microsoft"
          entities: ["John", "Microsoft"]
          types: ["PERSON", "ORG"]

    accuracy:
      precision: "97.2%"
      recall: "95.0%"
      f1_score: "96.1%"

    confidence_distribution:
      high: ">0.95 (85% of detections)"
      medium: "0.80-0.95 (12% of detections)"
      low: "<0.80 (3% of detections, filtered out)"

  location:
    bio_tags: ["B-LOCATION", "I-LOCATION"]
    pii_type: "address"
    placeholder: "[ADDRESS]"
    description: "Addresses, streets, cities, countries, landmarks"

    detection_patterns:
      - "Street addresses: 123 Main Street, 456 Oak Avenue"
      - "Apartments/Units: Apartment 7B, Unit 302"
      - "Cities: New York, San Francisco, Seattle"
      - "States: California, Washington, Texas"
      - "Countries: United States, Canada, Germany"
      - "Zip codes: 98101, 94102-1234 (often missed by BERT, caught by regex)"
      - "Landmarks: Golden Gate Bridge, Space Needle"

    examples:
      valid:
        - text: "Meet at 123 Main Street"
          entity: "123 Main Street"
          span: (8, 24)

        - text: "Lives in Apartment 7B, Oak Lane"
          entity: "Apartment 7B, Oak Lane"
          span: (9, 32)

        - text: "Visit New York next week"
          entity: "New York"
          span: (6, 14)

        - text: "123 Oak"
          entity: "123 Oak"
          note: "Partial address without street suffix"

      edge_cases:
        - text: "The washington post reported"
          entity: null
          note: "Organization name, not location"

        - text: "123 Main Street, Seattle, WA 98101"
          entities: ["123 Main Street", "Seattle", "WA"]
          note: "Multiple location entities, zip code caught by regex"

    accuracy:
      precision: "94.5%"
      recall: "91.2%"
      f1_score: "92.8%"

    confidence_distribution:
      high: ">0.95 (75% of detections)"
      medium: "0.80-0.95 (20% of detections)"
      low: "<0.80 (5% of detections, filtered out)"

  organization:
    bio_tags: ["B-ORG", "I-ORG"]
    pii_type: "organization"
    placeholder: "[ORGANIZATION]"
    description: "Company names, institutions, agencies, groups"

    detection_patterns:
      - "Companies: Acme Corporation, Google, Microsoft"
      - "Companies without suffix: Acme, Apple (context-dependent)"
      - "Institutions: University of Washington, Stanford University"
      - "Government agencies: FBI, CIA, Department of Justice"
      - "Non-profits: Red Cross, Greenpeace"
      - "Acronyms: IBM, NASA, WHO"

    examples:
      valid:
        - text: "I work at Acme Corporation"
          entity: "Acme Corporation"
          span: (10, 26)

        - text: "Contact Google for support"
          entity: "Google"
          span: (8, 14)

        - text: "Study at University of Washington"
          entity: "University of Washington"
          span: (9, 33)

        - text: "Call the FBI"
          entity: "FBI"
          span: (9, 12)

      edge_cases:
        - text: "I ate an apple"
          entity: null
          note: "Common noun, not Apple Inc."

        - text: "Amazon rainforest vs Amazon.com"
          entities: ["Amazon"]
          note: "Ambiguous, context-dependent"

        - text: "Microsoft Azure is a cloud platform"
          entities: ["Microsoft Azure"]
          note: "Company + product name"

    accuracy:
      precision: "92.1%"
      recall: "88.9%"
      f1_score: "90.5%"
      note: "Lower recall due to context-dependent detection"

    confidence_distribution:
      high: ">0.95 (65% of detections)"
      medium: "0.80-0.95 (28% of detections)"
      low: "<0.80 (7% of detections, filtered out)"

  miscellaneous:
    bio_tags: ["B-MISC", "I-MISC"]
    pii_type: "miscellaneous"
    placeholder: "[MISC]"
    description: "Other PII not fitting PERSON/LOCATION/ORG categories"

    detection_patterns:
      - "Events: Super Bowl, Olympics, World War II"
      - "Products: iPhone, Tesla Model 3"
      - "Languages: English, Spanish, French"
      - "Nationalities: American, Canadian, German"
      - "Dates: May 5th, 2025 (context-dependent)"
      - "Other identifiers: License plate, VIN (rare)"

    examples:
      valid:
        - text: "Watch the Super Bowl"
          entity: "Super Bowl"
          span: (10, 20)

        - text: "Drive a Tesla Model 3"
          entity: "Tesla Model 3"
          span: (8, 21)

        - text: "Speak English and Spanish"
          entities: ["English", "Spanish"]
          span: [(6, 13), (18, 25)]

      edge_cases:
        - text: "The english breakfast"
          entity: null
          note: "Adjective, not nationality/language"

    accuracy:
      precision: "87.5%"
      recall: "83.0%"
      f1_score: "85.2%"
      note: "Lowest accuracy due to diverse, ambiguous entity types"

    confidence_distribution:
      high: ">0.95 (50% of detections)"
      medium: "0.80-0.95 (35% of detections)"
      low: "<0.80 (15% of detections, filtered out)"

    usage_note: "MISC entities are typically NOT redacted (not traditional PII)"

pii_detection_struct:
  fields:
    pii_type:
      type: "String"
      values: ["name", "address", "organization", "miscellaneous"]
      description: "Type of PII detected"

    value:
      type: "String"
      description: "Original PII text from input"
      example: "John Doe"

    placeholder:
      type: "String"
      values: ["[NAME]", "[ADDRESS]", "[ORGANIZATION]", "[MISC]"]
      description: "Replacement placeholder for redaction"

    start_pos:
      type: "usize"
      description: "Character offset where entity starts"
      example: 8

    end_pos:
      type: "usize"
      description: "Character offset where entity ends (exclusive)"
      example: 16

    confidence:
      type: "f32"
      range: "[0.0, 1.0]"
      description: "Model confidence score"
      example: 0.95

    detection_method:
      type: "String"
      values: ["bert_ner", "regex"]
      description: "Detection method (for analytics)"

  example:
    pii_type: "name"
    value: "John Doe"
    placeholder: "[NAME]"
    start_pos: 8
    end_pos: 16
    confidence: 0.95
    detection_method: "bert_ner"

entity_mapping:
  bio_to_pii_type:
    B-PERSON: "name"
    I-PERSON: "name"
    B-LOCATION: "address"
    I-LOCATION: "address"
    B-ORG: "organization"
    I-ORG: "organization"
    B-MISC: "miscellaneous"
    I-MISC: "miscellaneous"
    O: null  # Outside entity

  pii_type_to_placeholder:
    name: "[NAME]"
    address: "[ADDRESS]"
    organization: "[ORGANIZATION]"
    miscellaneous: "[MISC]"

confidence_thresholds:
  default: 0.8
  description: "Minimum confidence to accept detection"

  per_entity_type:
    person:
      threshold: 0.8
      rationale: "High precision, accept medium confidence"

    location:
      threshold: 0.85
      rationale: "Context-dependent, require higher confidence"

    organization:
      threshold: 0.85
      rationale: "Ambiguous (common nouns), require higher confidence"

    miscellaneous:
      threshold: 0.9
      rationale: "Diverse types, require high confidence"

redaction_policy:
  always_redact:
    - "name"
    - "address"

  conditionally_redact:
    - entity_type: "organization"
      condition: "Redact if in healthcare/finance domain"
      example: "Hospital name, bank name"

  never_redact:
    - entity_type: "miscellaneous"
      condition: "Not traditional PII (events, products, languages)"
      example: "Super Bowl, iPhone, English"

entity_validation:
  context_checks:
    person:
      - "Verify name is not common noun (the smith → not person)"
      - "Check for title prefix (Dr., Mr., Ms.)"
      - "Verify capitalization (john doe → unlikely person)"

    location:
      - "Check for street suffix (Street, Avenue, Road)"
      - "Verify city/state format"
      - "Check for zip code nearby (regex catches)"

    organization:
      - "Check for company suffix (Corp, Inc, LLC)"
      - "Verify acronym is uppercase (IBM, NASA)"
      - "Check context (work at X, contact X)"

performance_characteristics:
  entity_distribution:
    person: "40% of NER detections"
    location: "35% of NER detections"
    organization: "20% of NER detections"
    miscellaneous: "5% of NER detections"

  detection_latency:
    per_entity: "<0.1ms"
    total_pipeline: "<5ms (includes inference + post-processing)"

hybrid_detection_integration:
  prefer_regex:
    - "Structured PII (SSN, credit card, phone, email)"
    - "Reason: 100% precision, faster (<1ms)"

  prefer_ner:
    - "Unstructured PII (names, addresses without street suffix)"
    - "Reason: Contextual understanding, 95% recall"

  deduplication:
    strategy: "If regex and NER detect overlapping spans, prefer regex"
    example:
      text: "Email john@example.com to John Doe"
      regex: "john@example.com (EMAIL)"
      ner: "John Doe (PERSON)"
      final: ["john@example.com (EMAIL)", "John Doe (PERSON)"]

observability:
  metrics:
    - name: "pii_ner_detections_total"
      type: "counter"
      labels: ["entity_type"]  # name, address, organization, miscellaneous

    - name: "pii_ner_confidence_distribution"
      type: "histogram"
      labels: ["entity_type"]
      buckets: [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 1.0]

    - name: "pii_ner_filtered_low_confidence_total"
      type: "counter"
      labels: ["entity_type"]
      description: "Detections below confidence threshold"

testing:
  unit_tests:
    - test_person_entity_detection
    - test_location_entity_detection
    - test_organization_entity_detection
    - test_miscellaneous_entity_detection
    - test_confidence_threshold_filtering
    - test_bio_to_pii_type_mapping
    - test_pii_type_to_placeholder_mapping

  integration_tests:
    - test_hybrid_detection_deduplication
    - test_entity_validation_context_checks
    - test_redaction_policy_enforcement

  edge_case_tests:
    - test_ambiguous_entities_common_nouns
    - test_multi_word_entities
    - test_overlapping_entities
    - test_entity_at_text_boundaries

documentation:
  entity_guide:
    path: "docs/privacy/entity-types.md"
    sections:
      - "PERSON entities (names, titles)"
      - "LOCATION entities (addresses, cities, countries)"
      - "ORGANIZATION entities (companies, institutions)"
      - "MISCELLANEOUS entities (events, products, languages)"
      - "Confidence thresholds"
      - "Redaction policy"
