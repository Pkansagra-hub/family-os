# Cross-Platform Model Contract
# Source ADR: 0035b-ml-based-ner.md
# Epic 2.9, Issue 2.9.2
# Purpose: Platform compatibility (Linux, macOS, Windows, x86_64, aarch64) for BERT-NER

contract:
  name: cross_platform_model
  version: "1.0.0"
  source_adr: "0035b-ml-based-ner.md"
  epic: "2.9"
  issue: "2.9.2"

supported_platforms:
  linux:
    architectures:
      x86_64:
        os_requirements: "Linux kernel 3.10+ (GLIBC 2.17+)"
        cpu_features:
          required: ["SSE2"]
          recommended: ["AVX2", "AVX512"]
        onnx_provider: "CPUExecutionProvider"
        performance: "<1.25ms (INT8, AVX512), <2.5ms (INT8, AVX2), <5ms (FP32)"

      aarch64:
        os_requirements: "Linux kernel 4.1+ (ARM64)"
        cpu_features:
          required: ["NEON"]
          recommended: []
        onnx_provider: "CPUExecutionProvider"
        performance: "<2.5ms (INT8, NEON), <6ms (FP32)"
        note: "ARM servers, Raspberry Pi 4+, AWS Graviton"

  macos:
    architectures:
      x86_64:
        os_requirements: "macOS 10.13+ (High Sierra)"
        cpu_features:
          required: ["SSE2"]
          recommended: ["AVX2"]
        onnx_provider: "CPUExecutionProvider"
        performance: "<1.5ms (INT8, AVX2), <5ms (FP32)"

      aarch64:
        os_requirements: "macOS 11.0+ (Big Sur, Apple Silicon)"
        cpu_features:
          required: ["NEON"]
          recommended: ["Apple Neural Engine"]
        onnx_provider: "CPUExecutionProvider OR CoreMLExecutionProvider"
        performance: "<1ms (INT8, ANE), <1.8ms (INT8, NEON), <4ms (FP32)"
        note: "M1/M2/M3 chips, use CoreML for ANE acceleration"

  windows:
    architectures:
      x86_64:
        os_requirements: "Windows 10+ (build 1809+)"
        cpu_features:
          required: ["SSE2"]
          recommended: ["AVX2", "AVX512"]
        onnx_provider: "CPUExecutionProvider"
        performance: "<1.25ms (INT8, AVX512), <2.5ms (INT8, AVX2), <5ms (FP32)"

onnx_runtime_providers:
  cpu_execution_provider:
    description: "Default cross-platform provider"
    platforms: ["Linux x86_64", "Linux aarch64", "macOS x86_64", "macOS aarch64", "Windows x86_64"]
    performance: "Baseline, portable"

  coreml_execution_provider:
    description: "Apple Neural Engine acceleration (macOS only)"
    platforms: ["macOS aarch64 (M1/M2/M3)"]
    performance: "2× faster than CPU on Apple Silicon"
    requirements:
      - "macOS 11.0+ (Big Sur)"
      - "onnxruntime-coreml feature enabled"
    trade_offs:
      - "Additional 20MB CoreML runtime"
      - "50ms model conversion overhead (one-time)"

model_files:
  fp32_model:
    filename: "bert-ner-model.onnx"
    size: "438MB"
    performance: "<5ms inference (CPU)"
    platforms: "All"

  int8_model:
    filename: "bert-ner-model-int8.onnx"
    size: "110MB"
    performance: "<1.25ms inference (AVX512), <2.5ms (AVX2/NEON)"
    platforms: "All"
    recommended: true

  model_selection:
    default: "int8_model"
    rationale: "4× faster, 4× smaller, <1% accuracy loss"

cpu_feature_detection:
  x86_64_features:
    sse2:
      description: "Streaming SIMD Extensions 2"
      required: true
      availability: "All x86_64 CPUs (2003+)"

    avx2:
      description: "Advanced Vector Extensions 2"
      required: false
      availability: "Intel Haswell+ (2013), AMD Excavator+ (2015)"
      performance_benefit: "2× faster than SSE2"

    avx512:
      description: "Advanced Vector Extensions 512"
      required: false
      availability: "Intel Skylake-X+ (2017), AMD Zen 4+ (2022)"
      performance_benefit: "4× faster than SSE2, 2× faster than AVX2"

  aarch64_features:
    neon:
      description: "ARM NEON SIMD"
      required: true
      availability: "All ARM64 CPUs (ARMv8)"

    apple_neural_engine:
      description: "Apple ANE accelerator"
      required: false
      availability: "Apple M1/M2/M3 chips"
      performance_benefit: "2× faster than NEON"

rust_cpu_detection:
  crate: "raw-cpuid (x86_64), aarch64-cpu-features (aarch64)"
  code: |
    #[cfg(target_arch = "x86_64")]
    fn detect_cpu_features() -> CpuFeatures {
        use raw_cpuid::CpuId;
        let cpuid = CpuId::new();

        CpuFeatures {
            sse2: cpuid.get_feature_info().map_or(false, |f| f.has_sse2()),
            avx2: cpuid.get_extended_feature_info().map_or(false, |f| f.has_avx2()),
            avx512f: cpuid.get_extended_feature_info().map_or(false, |f| f.has_avx512f()),
        }
    }

    #[cfg(target_arch = "aarch64")]
    fn detect_cpu_features() -> CpuFeatures {
        CpuFeatures {
            neon: true,  // Always available on ARM64
            apple_ane: cfg!(target_os = "macos") && is_apple_silicon(),
        }
    }

    fn is_apple_silicon() -> bool {
        #[cfg(target_os = "macos")]
        {
            use std::process::Command;
            let output = Command::new("sysctl")
                .arg("-n")
                .arg("machdep.cpu.brand_string")
                .output()
                .ok()?;

            let brand = String::from_utf8_lossy(&output.stdout);
            brand.contains("Apple")
        }
        #[cfg(not(target_os = "macos"))]
        false
    }

memory_footprint:
  model_loading:
    fp32: "438MB"
    int8: "110MB"

  runtime_overhead:
    onnx_runtime: "50MB"
    tokenizer: "5MB"

  total:
    fp32: "~500MB"
    int8: "~165MB"

  per_request:
    input_tensors: "<1MB (512 tokens max)"
    output_tensors: "<0.5MB (logits)"

  optimization:
    strategy: "Use INT8 model to stay <200MB total footprint"

startup_time:
  model_loading:
    fp32: "~800ms"
    int8: "~400ms"

  one_time_cost:
    description: "Load model once at application startup"
    amortization: "Startup cost amortized over thousands of requests"

  lazy_loading:
    strategy: "Load model on first PII detection request"
    trade_off: "First request: 400ms latency, subsequent: <2ms"

platform_specific_optimizations:
  linux_x86_64:
    - "Enable AVX512 if available"
    - "Use Intel MKL-DNN for BLAS operations"
    - "Tune thread pool size to CPU count"

  linux_aarch64:
    - "Enable NEON intrinsics"
    - "Use OpenBLAS for BLAS operations"
    - "Test on AWS Graviton instances"

  macos_x86_64:
    - "Enable AVX2 if available"
    - "Use Accelerate framework for BLAS"

  macos_aarch64:
    - "Prefer CoreMLExecutionProvider for ANE"
    - "Use Accelerate framework for BLAS"
    - "Test on M1/M2/M3 devices"

  windows_x86_64:
    - "Enable AVX512/AVX2 if available"
    - "Use Intel MKL for BLAS operations"
    - "Test on Windows 10/11"

onnx_runtime_configuration:
  session_options:
    graph_optimization_level: "Level3"
    description: "Maximum optimizations for target platform"

  execution_providers:
    default_order:
      - "CPUExecutionProvider"

    macos_aarch64_order:
      - "CoreMLExecutionProvider"  # Try ANE first
      - "CPUExecutionProvider"     # Fallback to CPU

  thread_pool:
    intra_op_threads: 4
    inter_op_threads: 1
    description: "Tune for 4-core CPUs (common baseline)"

testing_matrix:
  platforms:
    - os: "Ubuntu 22.04"
      arch: "x86_64"
      cpu: "Intel Xeon (AVX512)"
      expected_latency: "<1.25ms (INT8)"

    - os: "Ubuntu 22.04"
      arch: "x86_64"
      cpu: "AMD Ryzen (AVX2)"
      expected_latency: "<2.5ms (INT8)"

    - os: "Ubuntu 22.04"
      arch: "aarch64"
      cpu: "AWS Graviton3"
      expected_latency: "<2.5ms (INT8)"

    - os: "macOS 13 Ventura"
      arch: "x86_64"
      cpu: "Intel Core i7 (AVX2)"
      expected_latency: "<1.5ms (INT8)"

    - os: "macOS 14 Sonoma"
      arch: "aarch64"
      cpu: "Apple M2"
      expected_latency: "<1ms (INT8, CoreML)"

    - os: "Windows 11"
      arch: "x86_64"
      cpu: "Intel Core i9 (AVX512)"
      expected_latency: "<1.25ms (INT8)"

ci_cd_testing:
  github_actions:
    linux_x86_64:
      runs_on: "ubuntu-latest"
      test_command: "cargo test --release --target x86_64-unknown-linux-gnu"

    linux_aarch64:
      runs_on: "ubuntu-latest"
      cross_compile: true
      test_command: "cross test --release --target aarch64-unknown-linux-gnu"

    macos_x86_64:
      runs_on: "macos-13"
      test_command: "cargo test --release --target x86_64-apple-darwin"

    macos_aarch64:
      runs_on: "macos-14"  # M1 runners
      test_command: "cargo test --release --target aarch64-apple-darwin"

    windows_x86_64:
      runs_on: "windows-latest"
      test_command: "cargo test --release --target x86_64-pc-windows-msvc"

deployment_artifacts:
  docker_images:
    linux_x86_64:
      base_image: "rust:1.75-slim"
      size: "~200MB (multi-stage build)"

    linux_aarch64:
      base_image: "rust:1.75-slim"
      size: "~200MB (multi-stage build)"
      note: "Build with --platform linux/arm64"

  native_binaries:
    linux_x86_64:
      format: "ELF 64-bit LSB"
      dependencies: ["libc.so.6", "libm.so.6"]

    macos_aarch64:
      format: "Mach-O 64-bit arm64"
      dependencies: []
      code_signing: "Required for distribution"

    windows_x86_64:
      format: "PE32+ executable"
      dependencies: ["msvcrt.dll"]

fallback_for_unsupported_platforms:
  unsupported:
    - "Windows ARM64 (not yet supported by ONNX Runtime)"
    - "32-bit architectures (x86, ARM32)"

  fallback_strategy:
    action: "Disable BERT-NER, use regex-only"
    detection: "Platform detection at startup"
    metric: "pii_ner_unsupported_platform_total"

performance_benchmarks:
  baseline:
    platform: "Linux x86_64 (Intel Xeon, AVX512)"
    model: "INT8"
    latency: "1.25ms P50, 1.8ms P95, 2.5ms P99"

  relative_performance:
    linux_x86_64_avx2:
      vs_baseline: "2× slower"
      latency: "2.5ms P50"

    linux_aarch64_neon:
      vs_baseline: "2× slower"
      latency: "2.5ms P50"

    macos_aarch64_ane:
      vs_baseline: "1.25× faster"
      latency: "1ms P50"
      note: "Apple Neural Engine acceleration"

    macos_aarch64_neon:
      vs_baseline: "1.5× slower"
      latency: "1.8ms P50"
      note: "Without CoreML provider"

observability:
  metrics:
    - name: "pii_ner_platform_info"
      type: "gauge"
      labels: ["os", "arch", "cpu_features"]
      description: "Platform information"

    - name: "pii_ner_model_load_duration_ms"
      type: "histogram"
      labels: ["os", "arch", "model_type"]
      buckets: [100, 200, 400, 800, 1600]

    - name: "pii_ner_inference_duration_ms"
      type: "histogram"
      labels: ["os", "arch", "cpu_features"]
      buckets: [0.5, 1, 1.25, 2.5, 5, 10]

    - name: "pii_ner_memory_usage_mb"
      type: "gauge"
      labels: ["os", "arch", "model_type"]

  logs:
    - level: "INFO"
      message: "Platform detected"
      fields: ["os", "arch", "cpu_features"]

    - level: "INFO"
      message: "ONNX Runtime initialized"
      fields: ["version", "providers", "graph_optimization_level"]

    - level: "WARN"
      message: "Platform not optimal for BERT-NER"
      fields: ["os", "arch", "recommendation"]

documentation:
  platform_support_matrix:
    path: "docs/privacy/platform-support.md"
    sections:
      - "Supported platforms"
      - "CPU feature requirements"
      - "Performance benchmarks"
      - "Deployment guides"

  performance_tuning_guide:
    path: "docs/privacy/performance-tuning.md"
    sections:
      - "CPU feature detection"
      - "ONNX Runtime configuration"
      - "Platform-specific optimizations"

  deployment_guide:
    path: "docs/deployment/bert-ner-deployment.md"
    sections:
      - "Docker images"
      - "Native binaries"
      - "CI/CD pipelines"

testing:
  unit_tests:
    - test_cpu_feature_detection_x86_64
    - test_cpu_feature_detection_aarch64
    - test_model_selection_by_platform
    - test_onnx_provider_selection

  integration_tests:
    - test_end_to_end_inference_linux_x86_64
    - test_end_to_end_inference_macos_aarch64
    - test_end_to_end_inference_windows_x86_64

  performance_tests:
    - test_inference_latency_all_platforms
    - test_memory_footprint_all_platforms
    - test_startup_time_all_platforms
