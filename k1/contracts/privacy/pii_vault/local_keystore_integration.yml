# Local Keystore Integration Contract
# Source ADR: 0035c-encrypted-vault-key-management.md
# Epic 2.9, Issue 2.9.3
# Purpose: OS Keychain integration for local-first key management (Windows/macOS/Linux)

contract:
  name: local_keystore_integration
  version: "1.0.0"
  source_adr: "0035c-encrypted-vault-key-management.md"
  epic: "2.9"
  issue: "2.9.3"

local_first_architecture:
  principle: "100% offline capability, zero cloud dependency"
  benefits:
    - "No internet required for PII vault operations"
    - "Zero cloud KMS costs"
    - "35× faster key fetch (<1ms vs 35ms cloud KMS)"
    - "Hardware-backed security (TPM, Secure Enclave)"
    - "User privacy (keys never leave device)"

keystore_backends:
  priority_order:
    1_os_keychain:
      description: "Primary backend - OS native credential storage"
      platforms: ["Windows Credential Manager", "macOS Keychain", "Linux Secret Service"]
      performance: "<1ms key fetch"
      security: "Hardware-backed (TPM, Secure Enclave)"

    2_encrypted_file:
      description: "Secondary backend - Password-protected SQLite"
      implementation: "SQLCipher with Argon2 KDF"
      performance: "<5ms key fetch"
      use_case: "Fallback when OS keychain unavailable"

    3_local_hsm:
      description: "Tertiary backend - Local hardware security module"
      devices: ["YubiHSM", "Nitrokey"]
      interface: "PKCS#11"
      use_case: "Enterprise deployments requiring FIPS 140-2"

    4_cloud_kms:
      description: "Optional backend - Cloud key management service"
      providers: ["AWS KMS", "Azure Key Vault", "Google Cloud KMS"]
      performance: "<35ms key fetch (network overhead)"
      use_case: "Enterprise cloud deployments only"

os_keychain_windows:
  backend: "Windows Credential Manager"
  api: "Data Protection API (DPAPI)"
  introduced: "Windows 2000 (1999)"

  hardware_backing:
    tpm_support: "Windows Vista+ (2007)"
    tpm_version: "TPM 2.0 (Windows 11 requirement)"
    availability: "95%+ modern PCs"
    security_level: "FIPS 140-2 Level 2"

  features:
    user_scope: "Credentials per Windows user account"
    machine_scope: "Machine-wide credentials (optional)"
    biometric_unlock: "Windows Hello (fingerprint, face, PIN)"

  rust_implementation:
    crate: "windows-credentials (custom wrapper)"
    api_calls:
      - "CredWriteW - Store credential"
      - "CredReadW - Retrieve credential"
      - "CredDeleteW - Delete credential"
      - "CryptProtectData - DPAPI encryption"
      - "CryptUnprotectData - DPAPI decryption"

  example_usage: |
    use windows::Win32::Security::Credentials::*;

    pub struct WindowsCredentialManager {
        target_name: String,
    }

    impl WindowsCredentialManager {
        pub fn new(app_name: String) -> Self {
            Self {
                target_name: format!("{}:pii_vault_key", app_name),
            }
        }

        pub fn store_key(&self, key_id: &str, key_bytes: &[u8]) -> Result<(), String> {
            // Convert to Windows-compatible format
            let target = format!("{}:{}", self.target_name, key_id);

            // Create credential
            let credential = CREDENTIALW {
                Type: CRED_TYPE_GENERIC,
                TargetName: to_wide_string(&target),
                CredentialBlobSize: key_bytes.len() as u32,
                CredentialBlob: key_bytes.as_ptr() as *mut u8,
                Persist: CRED_PERSIST_LOCAL_MACHINE,
                // ... other fields
            };

            // Store credential
            unsafe {
                CredWriteW(&credential, 0)
                    .map_err(|e| format!("Failed to store credential: {}", e))?;
            }

            Ok(())
        }

        pub fn retrieve_key(&self, key_id: &str) -> Result<Vec<u8>, String> {
            let target = format!("{}:{}", self.target_name, key_id);

            // Read credential
            let mut credential_ptr: *mut CREDENTIALW = std::ptr::null_mut();
            unsafe {
                CredReadW(
                    to_wide_string(&target).as_ptr(),
                    CRED_TYPE_GENERIC,
                    0,
                    &mut credential_ptr,
                )
                .map_err(|e| format!("Failed to read credential: {}", e))?;

                // Extract key bytes
                let credential = &*credential_ptr;
                let key_bytes = std::slice::from_raw_parts(
                    credential.CredentialBlob,
                    credential.CredentialBlobSize as usize,
                ).to_vec();

                // Free credential
                CredFree(credential_ptr as *const _);

                Ok(key_bytes)
            }
        }
    }

  performance:
    key_fetch: "<0.7ms (P50), <1.2ms (P95)"
    key_store: "<1.5ms"
    tpm_overhead: "+0.2ms (hardware-backed encryption)"

os_keychain_macos:
  backend: "macOS Keychain"
  api: "Keychain Services API"
  introduced: "Mac OS X 10.0 (2001)"

  hardware_backing:
    secure_enclave: "T2 chip (2017+), M1/M2/M3 chips (2020+)"
    availability: "100% modern Macs (2017+)"
    security_level: "CC EAL4+"

  features:
    user_keychain: "Login keychain (per user)"
    system_keychain: "System keychain (machine-wide)"
    biometric_unlock: "Touch ID, Face ID"

  rust_implementation:
    crate: "security-framework"
    api_calls:
      - "SecItemAdd - Add keychain item"
      - "SecItemCopyMatching - Retrieve keychain item"
      - "SecItemDelete - Delete keychain item"
      - "kSecAttrAccessibleWhenUnlocked - Access control"

  example_usage: |
    use security_framework::item::*;
    use security_framework::passwords::*;

    pub struct MacOSKeychainManager {
        service_name: String,
    }

    impl MacOSKeychainManager {
        pub fn new(app_name: String) -> Self {
            Self {
                service_name: format!("{}.pii_vault_key", app_name),
            }
        }

        pub fn store_key(&self, key_id: &str, key_bytes: &[u8]) -> Result<(), String> {
            // Store in keychain
            set_generic_password(
                &self.service_name,
                key_id,
                key_bytes,
            )
            .map_err(|e| format!("Failed to store in keychain: {}", e))?;

            Ok(())
        }

        pub fn retrieve_key(&self, key_id: &str) -> Result<Vec<u8>, String> {
            // Retrieve from keychain
            let key_bytes = get_generic_password(&self.service_name, key_id)
                .map_err(|e| format!("Failed to retrieve from keychain: {}", e))?;

            Ok(key_bytes.to_vec())
        }

        pub fn delete_key(&self, key_id: &str) -> Result<(), String> {
            // Delete from keychain
            delete_generic_password(&self.service_name, key_id)
                .map_err(|e| format!("Failed to delete from keychain: {}", e))?;

            Ok(())
        }
    }

  performance:
    key_fetch: "<0.5ms (P50), <0.9ms (P95)"
    key_store: "<1.2ms"
    secure_enclave_overhead: "+0.1ms (hardware-backed encryption)"

os_keychain_linux:
  backend: "Linux Secret Service"
  api: "D-Bus Secret Service API (libsecret)"
  standard: "freedesktop.org Secret Service specification (2008)"

  implementations:
    gnome_keyring: "GNOME Keyring (Ubuntu, Fedora)"
    kwallet: "KWallet (KDE)"
    pass: "pass (command-line password manager)"

  features:
    user_scope: "Per-user secrets"
    session_unlock: "Unlocked on login"
    encryption: "AES-256 encryption at rest"

  rust_implementation:
    crate: "secret-service"
    api_calls:
      - "SecretService::connect - Connect to D-Bus"
      - "Collection::default - Get default keyring"
      - "Collection::create_item - Store secret"
      - "Collection::search_items - Retrieve secret"

  example_usage: |
    use secret_service::{SecretService, EncryptionType};
    use std::collections::HashMap;

    pub struct LinuxSecretServiceManager {
        service_name: String,
    }

    impl LinuxSecretServiceManager {
        pub fn new(app_name: String) -> Self {
            Self {
                service_name: format!("{}.pii_vault_key", app_name),
            }
        }

        pub async fn store_key(&self, key_id: &str, key_bytes: &[u8]) -> Result<(), String> {
            // Connect to Secret Service
            let ss = SecretService::connect(EncryptionType::Dh)
                .map_err(|e| format!("Failed to connect to Secret Service: {}", e))?;

            // Get default collection (login keyring)
            let collection = ss.get_default_collection()
                .map_err(|e| format!("Failed to get default collection: {}", e))?;

            // Store secret
            let mut attributes = HashMap::new();
            attributes.insert("service", &self.service_name);
            attributes.insert("key_id", key_id);

            collection.create_item(
                &format!("{} - {}", self.service_name, key_id),
                attributes,
                key_bytes,
                false, // replace=false
                "text/plain",
            )
            .map_err(|e| format!("Failed to create item: {}", e))?;

            Ok(())
        }

        pub async fn retrieve_key(&self, key_id: &str) -> Result<Vec<u8>, String> {
            let ss = SecretService::connect(EncryptionType::Dh)?;
            let collection = ss.get_default_collection()?;

            // Search for secret
            let mut attributes = HashMap::new();
            attributes.insert("service", &self.service_name);
            attributes.insert("key_id", key_id);

            let items = collection.search_items(attributes)
                .map_err(|e| format!("Failed to search items: {}", e))?;

            if items.is_empty() {
                return Err(format!("Key not found: {}", key_id));
            }

            // Get secret
            let item = &items[0];
            let secret = item.get_secret()
                .map_err(|e| format!("Failed to get secret: {}", e))?;

            Ok(secret.to_vec())
        }
    }

  performance:
    key_fetch: "<1.0ms (P50), <1.8ms (P95)"
    key_store: "<2.0ms"
    dbus_overhead: "+0.3ms (inter-process communication)"

pii_keystore_manager:
  purpose: "Unified interface for keystore backends"

  implementation: |
    use std::sync::Arc;

    pub struct PIIKeystoreManager {
        keystore_client: Arc<dyn KeystoreClient>,
        current_key_id: String,
    }

    impl PIIKeystoreManager {
        pub async fn new_os_keychain() -> Result<Self, Box<dyn std::error::Error>> {
            // Detect platform and initialize appropriate keychain
            let keystore_client = OSKeychainClient::new("FamilyOS-K1-PII".to_string())?;

            // Generate initial PII vault encryption key
            let key_metadata = keystore_client.generate_key("pii_vault", "system").await?;

            Ok(Self {
                keystore_client: Arc::new(keystore_client),
                current_key_id: key_metadata.key_id,
            })
        }

        pub async fn get_encryption_key(&self) -> Result<Vec<u8>, Box<dyn std::error::Error>> {
            let start = std::time::Instant::now();

            // Fetch key from OS keychain
            let encryption_key = self.keystore_client.get_key(&self.current_key_id).await?;

            let fetch_ms = start.elapsed().as_micros() as f64 / 1000.0;

            // Validate performance budget (<1ms for OS keychain)
            if fetch_ms > 1.0 {
                eprintln!(
                    "[PIIKeystoreManager] WARNING: Key fetch exceeded 1ms budget ({:.2}ms)",
                    fetch_ms
                );
            }

            Ok(encryption_key.key_bytes.to_vec())
        }

        pub async fn rotate_key(&mut self) -> Result<(), Box<dyn std::error::Error>> {
            // Rotate key in keystore (every 90 days)
            let new_key_metadata = self.keystore_client.rotate_key(&self.current_key_id).await?;

            // Update current key ID
            self.current_key_id = new_key_metadata.key_id.clone();

            Ok(())
        }

        pub fn get_key_id(&self) -> &str {
            &self.current_key_id
        }

        pub fn get_backend_type(&self) -> &str {
            "OS_KEYCHAIN" // Default
        }
    }

