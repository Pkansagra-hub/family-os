# AES-256-GCM Encryption Contract
# Source ADR: 0035c-encrypted-vault-key-management.md
# Epic 2.9, Issue 2.9.3
# Purpose: AES-256-GCM authenticated encryption for PII vault (confidentiality + integrity)

contract:
  name: aes_256_gcm_encryption
  version: "1.0.0"
  source_adr: "0035c-encrypted-vault-key-management.md"
  epic: "2.9"
  issue: "2.9.3"

encryption_algorithm:
  name: "AES-256-GCM"
  description: "Advanced Encryption Standard with Galois/Counter Mode"
  standard: "NIST SP 800-38D (2007)"

  properties:
    authenticated_encryption: true
    description: "Provides both confidentiality and integrity protection"

  key_size: 256
  key_bytes: 32
  key_description: "256-bit key (quantum-resistant against Grover's algorithm)"

  nonce_size: 96
  nonce_bytes: 12
  nonce_description: "96-bit nonce (unique per encryption, never reuse)"

  auth_tag_size: 128
  auth_tag_bytes: 16
  auth_tag_description: "128-bit authentication tag (integrity protection)"

research_foundations:
  nist_sp_800_38d:
    title: "Recommendation for Block Cipher Modes of Operation: Galois/Counter Mode (GCM) and GMAC"
    authors: ["Morris Dworkin"]
    year: 2007
    organization: "NIST"
    url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38d.pdf"

  mcgrew_viega_2004:
    title: "The Galois/Counter Mode of Operation (GCM)"
    authors: ["David A. McGrew", "John Viega"]
    year: 2004
    conference: "INDOCRYPT"

  production_usage:
    tls_1_3: "TLS_AES_256_GCM_SHA384 (IETF RFC 8446)"
    ipsec: "AES-GCM for IPsec ESP (IETF RFC 4106)"
    ssh: "aes256-gcm@openssh.com (OpenSSH)"

  quantum_resistance:
    grovers_algorithm: "256-bit key requires 2^128 queries (secure against quantum attacks)"
    post_quantum: "AES-256 remains secure in post-quantum era"

encryption_implementation:
  rust_crate: "aes-gcm"
  version: "0.10+"

  dependencies:
    - "aes-gcm = '0.10'"
    - "rand = '0.8'"

  code_example: |
    use aes_gcm::{
        aead::{Aead, KeyInit},
        Aes256Gcm, Nonce,
    };
    use rand::Rng;

    pub struct PIIEncryption {
        cipher: Aes256Gcm,
        keystore_key_id: String,
    }

    impl PIIEncryption {
        pub fn new(encryption_key: &[u8], keystore_key_id: String) -> Result<Self, String> {
            // Validate key size (256 bits = 32 bytes)
            if encryption_key.len() != 32 {
                return Err("Encryption key must be 32 bytes (256 bits)".to_string());
            }

            // Initialize AES-256-GCM cipher
            let cipher = Aes256Gcm::new_from_slice(encryption_key)
                .map_err(|e| format!("Failed to initialize cipher: {}", e))?;

            Ok(Self {
                cipher,
                keystore_key_id,
            })
        }

        pub fn encrypt(&self, plaintext: &str) -> Result<EncryptedPII, String> {
            let start = std::time::Instant::now();

            // Generate random nonce (96 bits = 12 bytes)
            let mut rng = rand::thread_rng();
            let nonce_bytes: [u8; 12] = rng.gen();
            let nonce = Nonce::from_slice(&nonce_bytes);

            // Encrypt plaintext
            let ciphertext = self.cipher.encrypt(nonce, plaintext.as_bytes())
                .map_err(|e| format!("Encryption failed: {}", e))?;

            // Split ciphertext and auth tag
            // AES-GCM appends 16-byte auth tag to ciphertext
            let ciphertext_len = ciphertext.len() - 16;
            let encrypted_value = ciphertext[..ciphertext_len].to_vec();
            let auth_tag = ciphertext[ciphertext_len..].to_vec();

            let encrypt_ms = start.elapsed().as_micros() as f64 / 1000.0;

            // Validate performance budget (<2ms)
            if encrypt_ms > 2.0 {
                eprintln!(
                    "[PIIEncryption] WARNING: Encryption exceeded 2ms budget ({:.2}ms)",
                    encrypt_ms
                );
            }

            Ok(EncryptedPII {
                encrypted_value,
                nonce: nonce_bytes.to_vec(),
                auth_tag,
                encryption_key_id: self.keystore_key_id.clone(),
            })
        }

        pub fn decrypt(&self, encrypted: &EncryptedPII) -> Result<String, String> {
            let start = std::time::Instant::now();

            // Reconstruct ciphertext with auth tag
            let mut ciphertext = encrypted.encrypted_value.clone();
            ciphertext.extend_from_slice(&encrypted.auth_tag);

            // Reconstruct nonce
            let nonce = Nonce::from_slice(&encrypted.nonce);

            // Decrypt ciphertext
            let plaintext_bytes = self.cipher.decrypt(nonce, ciphertext.as_ref())
                .map_err(|e| format!("Decryption failed (auth tag mismatch?): {}", e))?;

            let plaintext = String::from_utf8(plaintext_bytes)
                .map_err(|e| format!("Invalid UTF-8 in plaintext: {}", e))?;

            let decrypt_ms = start.elapsed().as_micros() as f64 / 1000.0;

            // Validate performance budget (<1ms)
            if decrypt_ms > 1.0 {
                eprintln!(
                    "[PIIEncryption] WARNING: Decryption exceeded 1ms budget ({:.2}ms)",
                    decrypt_ms
                );
            }

            Ok(plaintext)
        }
    }

    #[derive(Debug, Clone)]
    pub struct EncryptedPII {
        pub encrypted_value: Vec<u8>,
        pub nonce: Vec<u8>,
        pub auth_tag: Vec<u8>,
        pub encryption_key_id: String,
    }

encryption_process:
  input: "Plaintext PII value (e.g., SSN '123-45-6789')"

  steps:
    1_generate_nonce:
      operation: "Generate random 96-bit nonce"
      implementation: "rand::thread_rng().gen::<[u8; 12]>()"
      uniqueness: "Nonce must be unique for each encryption (never reuse)"

    2_encrypt:
      operation: "AES-256-GCM encryption"
      input: "Plaintext bytes + nonce + encryption key"
      output: "Ciphertext + authentication tag (16 bytes appended)"

    3_split_output:
      operation: "Split ciphertext and auth tag"
      ciphertext: "First (len - 16) bytes"
      auth_tag: "Last 16 bytes"

    4_return_result:
      operation: "Return EncryptedPII struct"
      fields: ["encrypted_value", "nonce", "auth_tag", "encryption_key_id"]

  output: "EncryptedPII struct with 3 components"

decryption_process:
  input: "EncryptedPII struct (ciphertext, nonce, auth tag)"

  steps:
    1_reconstruct_ciphertext:
      operation: "Append auth tag to ciphertext"
      implementation: "ciphertext.extend_from_slice(&auth_tag)"

    2_decrypt:
      operation: "AES-256-GCM decryption"
      input: "Ciphertext + auth tag + nonce + encryption key"
      output: "Plaintext bytes"
      validation: "Auth tag verified (integrity protection)"

    3_validate_utf8:
      operation: "Convert bytes to UTF-8 string"
      error: "Return error if invalid UTF-8"

    4_return_result:
      operation: "Return plaintext string"

  output: "Plaintext PII value"

security_properties:
  confidentiality:
    description: "Plaintext cannot be recovered without encryption key"
    attacker_model: "Ciphertext-only attack"
    security_level: "256-bit key → 2^256 possible keys"

  integrity:
    description: "Any modification to ciphertext detected by auth tag"
    attacker_model: "Chosen-ciphertext attack"
    protection: "Authentication tag validates ciphertext integrity"

  authenticity:
    description: "Ciphertext can only be produced by holder of encryption key"
    attacker_model: "Forgery attack"
    protection: "GMAC authentication"

nonce_management:
  uniqueness_requirement:
    critical: "Nonce must be unique for each encryption with same key"
    consequence_of_reuse: "Catastrophic failure - plaintext recovery possible"

  generation_strategy:
    method: "Random generation (cryptographically secure RNG)"
    implementation: "rand::thread_rng() (ChaCha20Rng)"
    collision_probability: "2^-96 (negligible for 2^48 encryptions)"

  storage:
    location: "Stored alongside ciphertext in pii_vault table"
    size: "12 bytes per encrypted value"

authentication_tag:
  purpose: "Integrity protection + authenticity"
  size: 16
  description: "128-bit GMAC tag"

  validation:
    on_decryption: "Auth tag verified before returning plaintext"
    mismatch_behavior: "Decryption fails, returns error"
    tamper_detection: "Any modification to ciphertext detected"

performance_budget:
  encryption:
    target: "<2ms per PII value"
    typical: "1.8ms"
    breakdown:
      nonce_generation: "0.05ms"
      aes_gcm_encrypt: "1.7ms"
      split_output: "0.05ms"

  decryption:
    target: "<1ms per PII value"
    typical: "0.9ms"
    breakdown:
      reconstruct_ciphertext: "0.05ms"
      aes_gcm_decrypt: "0.8ms"
      utf8_validation: "0.05ms"

storage_overhead:
  plaintext_size: "Variable (e.g., SSN 11 bytes)"

  encrypted_size:
    ciphertext: "Same as plaintext (AES-GCM is stream cipher)"
    nonce: "12 bytes"
    auth_tag: "16 bytes"
    total_overhead: "28 bytes per encryption"

  example:
    ssn_plaintext: "123-45-6789 (11 bytes)"
    ssn_encrypted: "11 bytes (ciphertext) + 12 bytes (nonce) + 16 bytes (auth tag) = 39 bytes"
    overhead_percentage: "255% (39 / 11)"

error_handling:
  encryption_errors:
    invalid_key_size:
      condition: "Encryption key not 32 bytes"
      error: "Encryption key must be 32 bytes (256 bits)"

    encryption_failed:
      condition: "AES-GCM encryption fails"
      error: "Encryption failed: <rust_error>"

  decryption_errors:
    auth_tag_mismatch:
      condition: "Authentication tag verification fails"
      error: "Decryption failed (auth tag mismatch?)"
      implication: "Ciphertext tampered or corrupted"

    invalid_utf8:
      condition: "Decrypted bytes not valid UTF-8"
      error: "Invalid UTF-8 in plaintext"
      implication: "Wrong key used or data corrupted"

observability:
  metrics:
    - name: "pii_encryption_latency_ms"
      type: "histogram"
      buckets: [0.5, 1.0, 1.8, 2.0, 3.0, 5.0]
      description: "Encryption latency in milliseconds"

    - name: "pii_decryption_latency_ms"
      type: "histogram"
      buckets: [0.3, 0.5, 0.9, 1.0, 2.0, 3.0]
      description: "Decryption latency in milliseconds"

    - name: "pii_encryption_errors_total"
      type: "counter"
      labels: ["error_type"]
      description: "Encryption errors by type"

    - name: "pii_decryption_errors_total"
      type: "counter"
      labels: ["error_type"]
      description: "Decryption errors by type (auth_tag_mismatch, invalid_utf8)"

compliance:
  gdpr:
    article_32: "Security of processing - encryption required"
    compliance: "AES-256-GCM meets encryption requirement"

  hipaa:
    section: "164.312(a)(2)(iv) - Encryption and decryption"
    requirement: "AES-256 encryption"
    compliance: "AES-256-GCM exceeds requirement (adds integrity)"

  nist:
    standard: "FIPS 197 (AES) + NIST SP 800-38D (GCM)"
    compliance: "Fully compliant"

testing:
  unit_tests:
    - test_encrypt_decrypt_roundtrip
    - test_encryption_different_nonces
    - test_decryption_auth_tag_mismatch
    - test_invalid_key_size_error
    - test_encryption_performance_budget
    - test_decryption_performance_budget

  integration_tests:
    - test_encrypt_store_retrieve_decrypt
    - test_key_rotation_decrypt_with_old_key

  edge_case_tests:
    - test_empty_plaintext
    - test_large_plaintext_512_bytes
    - test_non_utf8_plaintext
    - test_tampered_ciphertext
    - test_tampered_nonce
    - test_tampered_auth_tag

documentation:
  encryption_guide:
    path: "docs/privacy/aes-256-gcm-encryption.md"
    sections:
      - "AES-256-GCM overview"
      - "Encryption process"
      - "Decryption process"
      - "Nonce management"
      - "Authentication tag"
      - "Security properties"
      - "Performance characteristics"
