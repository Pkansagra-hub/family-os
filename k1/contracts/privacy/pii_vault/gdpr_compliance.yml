# GDPR Compliance Contract
# Source ADR: 0035c-encrypted-vault-key-management.md
# Epic 2.9, Issue 2.9.3
# Purpose: GDPR right to access, right to erasure, encryption at rest, breach notification

contract:
  name: gdpr_compliance
  version: "1.0.0"
  source_adr: "0035c-encrypted-vault-key-management.md"
  epic: "2.9"
  issue: "2.9.3"

gdpr_overview:
  regulation: "General Data Protection Regulation (EU) 2016/679"
  effective_date: "May 25, 2018"
  scope: "EU citizens' personal data, worldwide enforcement"
  penalties: "Up to €20M or 4% of annual revenue (whichever is greater)"

gdpr_articles:
  article_15_right_to_access:
    title: "Right of access by the data subject"
    requirement: "User can retrieve all their personal data"
    implementation: "List all PII in vault for user"
    query: "SELECT vault_key, pii_type, created_at FROM pii_vault WHERE user_id = ? AND deleted_at IS NULL"

  article_17_right_to_erasure:
    title: "Right to erasure ('right to be forgotten')"
    requirement: "User can request deletion of personal data"
    implementation: "Soft delete (30-day grace period) → hard delete"
    soft_delete: "UPDATE pii_vault SET deleted_at = ? WHERE user_id = ?"
    hard_delete: "DELETE FROM pii_vault WHERE deleted_at < ?"

  article_32_security_of_processing:
    title: "Security of processing"
    requirement: "Encryption of personal data at rest"
    implementation: "AES-256-GCM encryption for all PII"
    compliance: "All PII encrypted before storage"

  article_33_breach_notification:
    title: "Notification of a personal data breach to the supervisory authority"
    requirement: "Report breaches within 72 hours"
    safe_harbor: "Encrypted data not subject to breach notification"
    implementation: "PII encrypted, keys in OS keychain (separate from data)"

right_to_access:
  description: "User can retrieve all their PII"

  implementation: |
    pub async fn gdpr_access_request(
        &self,
        user_id: &str,
        space_id: &str,
    ) -> Result<Vec<PiiAccessRecord>, Box<dyn std::error::Error>> {
        // Query all PII for user (excluding deleted)
        let mut stmt = self.db.prepare(
            "SELECT vault_key, pii_type, created_at, accessed_at
             FROM pii_vault
             WHERE user_id = ? AND space_id = ? AND deleted_at IS NULL
             ORDER BY created_at DESC"
        )?;

        let rows = stmt.query_map(params![user_id, space_id], |row| {
            Ok(PiiAccessRecord {
                vault_key: row.get(0)?,
                pii_type: row.get(1)?,
                created_at: row.get(2)?,
                accessed_at: row.get(3)?,
            })
        })?;

        let mut records = Vec::new();
        for row in rows {
            records.push(row?);
        }

        Ok(records)
    }

  output_format:
    vault_key: "Unique vault key"
    pii_type: "Type of PII (ssn, email, phone, etc.)"
    created_at: "Timestamp when PII was stored"
    accessed_at: "Last access timestamp"

  example_response: |
    [
      {
        "vault_key": "ssn_user001_abc123_1698765432000",
        "pii_type": "ssn",
        "created_at": 1698765432000,
        "accessed_at": 1698778899000
      },
      {
        "vault_key": "email_user001_def456_1698765433000",
        "pii_type": "email",
        "created_at": 1698765433000,
        "accessed_at": null
      }
    ]

right_to_erasure:
  description: "User can request deletion of all their PII"

  soft_delete:
    implementation: |
      pub async fn gdpr_erasure_request(
          &self,
          user_id: &str,
          space_id: &str,
          trace_id: &str,
      ) -> Result<usize, Box<dyn std::error::Error>> {
          // Soft delete all PII for user
          let deleted_at = SystemTime::now().duration_since(UNIX_EPOCH)?.as_millis() as i64;

          let rows_affected = self.db.execute(
              "UPDATE pii_vault SET deleted_at = ?1
               WHERE user_id = ?2 AND space_id = ?3 AND deleted_at IS NULL",
              params![deleted_at, user_id, space_id],
          )?;

          // Log audit trail
          for i in 0..rows_affected {
              self.log_audit(
                  "delete_gdpr",
                  &format!("bulk_delete_{}", i),
                  user_id,
                  space_id,
                  trace_id,
                  true,
                  None,
              )?;
          }

          println!("[PIIVault] GDPR erasure: Soft deleted {} PII entries for user {}", rows_affected, user_id);

          Ok(rows_affected)
      }

    grace_period: "30 days (allow user to undo accidental deletion)"

  hard_delete:
    trigger: "Automated cron job (daily)"
    query: "DELETE FROM pii_vault WHERE deleted_at IS NOT NULL AND deleted_at < ?"
    cutoff: "30 days ago"
    permanence: "Data unrecoverable after hard delete"

encryption_at_rest:
  requirement: "GDPR Article 32 - Security of processing"
  implementation: "AES-256-GCM encryption for all PII"

  compliance_checklist:
    - "✅ All PII encrypted before storage"
    - "✅ Encryption key stored separately (OS keychain)"
    - "✅ 256-bit key size (quantum-resistant)"
    - "✅ Authenticated encryption (integrity protection)"
    - "✅ Unique nonce per encryption"
    - "✅ Hardware-backed key storage (TPM, Secure Enclave)"

breach_notification:
  safe_harbor: "Encrypted data not subject to breach notification"

  scenario_k0_database_breach:
    attacker_access: "K0 database compromised (SQL injection, insider threat)"
    attacker_finds:
      pii_vault_table: "Encrypted ciphertext (0xABCD1234...)"
      vault_audit_log: "Operation logs (no PII exposed)"
    attacker_cannot_access:
      encryption_keys: "Stored in OS keychain (not in database)"
      plaintext_pii: "Cannot decrypt without encryption key"

    impact: "Zero PII values leaked ✅"
    gdpr_compliance: "Article 34 - Communication of breach to data subject NOT required"
    rationale: "Data encrypted and key secure, breach does not pose risk to individuals"

data_subject_rights:
  right_to_access:
    article: "Article 15"
    implementation: "gdpr_access_request(user_id, space_id)"
    response_time: "<1 month"

  right_to_erasure:
    article: "Article 17"
    implementation: "gdpr_erasure_request(user_id, space_id)"
    response_time: "Immediate (soft delete), 30 days (hard delete)"

  right_to_data_portability:
    article: "Article 20"
    implementation: "Export PII in machine-readable format (JSON)"
    format: '{"vault_key": "...", "pii_type": "...", "created_at": ...}'

  right_to_rectification:
    article: "Article 16"
    implementation: "Delete old PII, store corrected PII with new vault_key"

  right_to_restriction:
    article: "Article 18"
    implementation: "Soft delete (deleted_at set, data not accessible but preserved)"

data_protection_by_design:
  principle: "GDPR Article 25 - Data protection by design and by default"

  implementations:
    minimal_data_collection:
      description: "Only store PII necessary for functionality"
      practice: "Vault only stores detected PII, not entire messages"

    encryption_default:
      description: "Encryption enabled by default (not opt-in)"
      practice: "All PII encrypted before storage"

    access_controls:
      description: "User can only access own PII"
      practice: "Authorization checks on retrieve/delete"

    data_minimization:
      description: "Delete PII after retention period"
      practice: "90-day retention policy, automatic cleanup"

compliance_checklist:
  gdpr_requirements:
    - "✅ Right to access (Article 15) - gdpr_access_request"
    - "✅ Right to erasure (Article 17) - gdpr_erasure_request"
    - "✅ Encryption at rest (Article 32) - AES-256-GCM"
    - "✅ Breach safe harbor (Article 34) - Encrypted data"
    - "✅ Data protection by design (Article 25) - Encryption default"
    - "✅ Audit trail (Article 30) - vault_audit_log"
    - "✅ Data portability (Article 20) - JSON export"
    - "✅ Retention limits (Article 5.1e) - 90-day retention"

observability:
  metrics:
    - name: "pii_vault_gdpr_access_requests_total"
      type: "counter"
      description: "GDPR data subject access requests"

    - name: "pii_vault_gdpr_erasure_requests_total"
      type: "counter"
      description: "GDPR right to erasure requests"

    - name: "pii_vault_gdpr_erasure_count"
      type: "histogram"
      labels: ["user_id"]
      description: "Number of PII entries deleted per erasure request"

testing:
  unit_tests:
    - test_gdpr_access_request
    - test_gdpr_erasure_request_soft_delete
    - test_hard_delete_after_grace_period
    - test_encryption_at_rest

  integration_tests:
    - test_full_gdpr_access_erasure_lifecycle
    - test_breach_scenario_no_plaintext_leak

  compliance_tests:
    - test_gdpr_article_15_compliance
    - test_gdpr_article_17_compliance
    - test_gdpr_article_32_compliance

documentation:
  gdpr_compliance_guide:
    path: "docs/privacy/gdpr-compliance.md"
    sections:
      - "GDPR overview"
      - "Right to access implementation"
      - "Right to erasure implementation"
      - "Encryption at rest"
      - "Breach notification safe harbor"
      - "Compliance checklist"
