# Contract: GDPR Requests Schema Definition
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_GDPR_REQUESTS_SCHEMA_023"
  name: "GDPR Requests Schema Definition"
  version: "1.0.0"

  table_definition: |
    CREATE TABLE gdpr_requests (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      request_type TEXT NOT NULL,
      user_id TEXT NOT NULL,
      space_id TEXT NOT NULL,
      trace_id TEXT NOT NULL,
      requested_at INTEGER NOT NULL,
      fulfilled_at INTEGER,
      status TEXT NOT NULL,
      response_data TEXT,
      metadata TEXT,
      INDEX idx_user_id (user_id),
      INDEX idx_requested_at (requested_at),
      INDEX idx_status (status)
    );

  columns:
    request_type: "access|erasure|portability"
    user_id: "User making request"
    status: "pending|fulfilled|rejected|error"
    requested_at: "Unix timestamp (request received)"
    fulfilled_at: "Unix timestamp (request completed)"
    response_data: "JSON export (for access requests)"

  response_types:
    access_request: "User PII export (JSON format)"
    erasure_request: "Deletion confirmation"
    portability_request: "Machine-readable data export"

  compliance:
    gdpr_article_15: "Right to access (30-day response required)"
    gdpr_article_17: "Right to erasure (30-day response required)"
    gdpr_article_20: "Data portability (30-day response required)"

  architecture:
    adr_references: ["ADR-0035d: Audit Trail & GDPR Compliance"]
