# Contract: Retention Policies for PII & Audit Logs
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_RETENTION_POLICIES_030"
  name: "Retention Policies for PII & Audit Logs"
  version: "1.0.0"

  retention_schedules:
    pii_vault:
      retention_days_default: 90
      retention_days_hipaa: 2555  # 7 years
      grace_period_after_deletion_days: 30
      hard_delete_trigger: "deleted_at < NOW() - 30 days"
      rationale: "HIPAA 7-year requirement, GDPR erasure grace period"

    audit_log:
      retention_days_gdpr: 90
      retention_days_hipaa: 2555  # 7 years
      retention_days_sox: 2555
      compliance_standard: "Most stringent (HIPAA 7 years)"
      hard_delete_trigger: "timestamp < NOW() - 2555 days"
      tamper_protection: "Append-only (no early deletion)"

    gdpr_requests:
      retention_days: 2555
      rationale: "Proof of compliance for regulators"

    sessionstate_pii:
      retention: "Redacted placeholders only (no retention needed)"
      cleanup: "Automatic after turn completion"

  automation:
    daily_cleanup_job:
      timing: "2am UTC (off-peak)"
      task_1: "DELETE from pii_vault WHERE deleted_at < NOW() - 30"
      task_2: "DELETE from audit_log WHERE timestamp < NOW() - 2555"
      monitoring: "Log cleanup stats, alert on failure"

    weekly_retention_audit:
      task_1: "Query total storage used by pii_vault"
      task_2: "Query total storage used by audit_log"
      threshold_alert: "If > 90% of quota, alert ops"

    manual_deletion_workflow:
      trigger: "Legal hold (litigation)"
      process: "Bypass retention policy, delete immediately"
      approval: "Requires legal team + compliance approval"
      audit_logging: "Log deletion request and approval"

  compliance_requirements:
    gdpr_right_to_erasure: "Delete after grace period (30 days)"
    hipaa_minimum: "7-year retention"
    sox_requirement: "7-year audit trail"
    data_minimization: "Delete PII not needed > 90 days"

  cost_optimization:
    hot_storage: "0-90 days (K0 database)"
    warm_storage: "90-180 days (S3 Glacier)"
    cold_storage: "180+ days (S3 Deep Archive)"
    auto_tiering: "Based on age, cost-optimized"

  architecture:
    adr_references: ["ADR-0035d: GDPR Compliance", "ADR-0035c: Encrypted Vault"]
    integration: "K0 storage lifecycle policies"
