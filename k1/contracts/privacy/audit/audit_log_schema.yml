# Contract: Audit Log Schema Definition
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_AUDIT_LOG_SCHEMA_022"
  name: "Audit Log Schema Definition"
  version: "1.0.0"

  table_definition: |
    CREATE TABLE audit_log (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      operation TEXT NOT NULL,
      pii_type TEXT NOT NULL,
      user_id TEXT NOT NULL,
      space_id TEXT NOT NULL,
      trace_id TEXT NOT NULL,
      timestamp INTEGER NOT NULL,
      vault_key TEXT,
      original_value_hash TEXT,
      redacted_placeholder TEXT,
      detection_method TEXT,
      confidence REAL,
      metadata TEXT,
      INDEX idx_user_space (user_id, space_id),
      INDEX idx_timestamp (timestamp),
      INDEX idx_operation (operation),
      INDEX idx_pii_type (pii_type)
    );

  columns:
    operation: "detect|redact|vault_store|vault_retrieve|vault_delete"
    pii_type: "ssn|email|phone|name|address|etc"
    user_id: "User owning data"
    space_id: "Space identifier"
    trace_id: "Cognitive trace ID"
    timestamp: "Unix timestamp (ms)"
    vault_key: "Reference to pii_vault"
    original_value_hash: "SHA-256 hash (PII anonymized)"
    redacted_placeholder: "[SSN]|[EMAIL]|etc"
    detection_method: "regex|bert_ner"
    confidence: "0.0-1.0 confidence score"

  retention_policy:
    retention_days_gdpr: 90
    retention_days_hipaa: 2555  # 7 years
    auto_cleanup: "Daily job deletes expired records"

  architecture:
    adr_references: ["ADR-0035d: Audit Trail & GDPR Compliance"]
