# Contract: Compliance Metrics & Reporting
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_COMPLIANCE_METRICS_028"
  name: "Compliance Metrics & Reporting"
  version: "1.0.0"

  key_metrics:
    redactions_total:
      definition: "Total PII redacted (regex + NER)"
      target_sla: "> 85% of PII in conversations"
      measurement: "Counter incrementing on each detection"

    vault_operations_total:
      definition: "Total store/retrieve/delete operations"
      target_sla: "All PII encrypted at rest"
      measurement: "Counter for each operation type"

    gdpr_requests_fulfilled:
      definition: "GDPR requests (access, erasure, portability)"
      target_sla: "100% fulfilled within 30 days"
      measurement: "Counter for fulfilled requests"

    gdpr_request_latency_days:
      definition: "Days to fulfill GDPR request"
      target_sla: "< 30 days (GDPR requirement)"
      measurement: "Histogram (fulfilled_at - requested_at)"

    compliance_rate_pct:
      definition: "% of requests fulfilled within SLA"
      target_sla: ">= 98%"
      measurement: "fulfilled_count / total_count * 100"

    phi_access_latency_ms:
      definition: "HIPAA PHI access latency"
      target_sla: "< 100ms (audit controls)"
      measurement: "Histogram per access"

  dashboard_metrics:
    daily_report:
      - "PII redacted (regex, NER, total)"
      - "Vault operations (store, retrieve, delete)"
      - "GDPR requests (pending, fulfilled, failed)"
    weekly_report:
      - "Compliance rate (% SLA met)"
      - "Average GDPR response time"
      - "HIPAA access incidents"
    monthly_report:
      - "Redaction trends"
      - "GDPR request breakdown by type"
      - "Anomaly detection results"

  alerts:
    gdpr_sla_breach: "Request unfulfilled > 30 days"
    compliance_rate_drop: "Compliance rate < 98%"
    vault_operation_failure: "Store/retrieve/delete fails"
    unusual_access_pattern: "User accesses 1000+ PII"

  compliance_reporting:
    gdpr_report: "Quarterly"
    hipaa_report: "Annually"
    sox_report: "Annually"
    data_processing_agreement: "Maintained with K0 provider"

  architecture:
    adr_references: ["ADR-0035d: GDPR Compliance"]
