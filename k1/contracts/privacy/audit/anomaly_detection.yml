# Contract: Anomaly Detection for PII Access
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_ANOMALY_DETECTION_029"
  name: "Anomaly Detection for PII Access"
  version: "1.0.0"

  anomaly_detection_rules:
    unusual_access_volume:
      rule: "User accesses > 100 PII values in 1 hour"
      action: "Alert security team"
      severity: "HIGH"
      threshold_count: 100
      threshold_window_minutes: 60

    privilege_escalation:
      rule: "Non-admin user accesses admin PII"
      action: "Alert security team, disable access"
      severity: "CRITICAL"

    bulk_deletion:
      rule: "User deletes > 1000 PII values in 1 hour"
      action: "Alert security team, require approval"
      severity: "HIGH"
      threshold_count: 1000

    geographic_anomaly:
      rule: "PII access from unusual geography"
      action: "Require MFA, alert user"
      severity: "MEDIUM"

    access_time_anomaly:
      rule: "PII access outside business hours (2am-5am)"
      action: "Log and monitor, alert if repeated"
      severity: "LOW"

    bot_detection:
      rule: "Rapid sequential API calls (>1K/sec)"
      action: "Rate-limit, alert"
      severity: "HIGH"

  detection_mechanism:
    input_data: "audit_log table (all operations)"
    analysis_frequency: "Real-time (streaming)"
    baseline_period_days: 30
    statistical_method: "Z-score anomaly detection"
    alert_destination: "SecurityMonitoring system"

  response_workflow:
    alert_generated: "Sent to security@k1.ai"
    investigation: "Security team reviews audit_log"
    action_taken:
      - "Disable user access (if privilege escalation)"
      - "Require MFA re-authentication"
      - "Block IP address (if geographic anomaly)"
    escalation: "Critical issues → incident response team"

  machine_learning:
    model_type: "Isolation Forest (unsupervised)"
    features: ["access_count", "pii_types", "time_of_day", "user_role", "ip_geolocation"]
    training_data: "30 days of audit_log"
    retraining: "Weekly"
    false_positive_rate_target: "< 1%"

  compliance_impact:
    gdpr_article_32: "Technical measures for security"
    hipaa_164_308: "Access controls and monitoring"
    sox_requirement: "Internal control over data access"

  architecture:
    adr_references: ["ADR-0035d: GDPR Compliance"]
    integration: "Real-time analytics engine"
