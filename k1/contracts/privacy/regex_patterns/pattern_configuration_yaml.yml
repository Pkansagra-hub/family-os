# Pattern Configuration YAML Contract
# Source ADR: 0035a-regex-pattern-library.md
# Epic 2.9, Issue 2.9.1
# Purpose: Define YAML configuration format for PII patterns with hot-reload support

contract:
  name: pattern_configuration_yaml
  version: "1.0.0"
  source_adr: "0035a-regex-pattern-library.md"
  epic: "2.9"
  issue: "2.9.1"

configuration_format:
  file_path: "k1/config/pii_patterns.yml"
  format: "YAML"
  schema_version: "1.0.0"
  hot_reload: true
  reload_signal: "SIGHUP or file watcher"
  reload_latency: "<100ms"

yaml_schema:
  root:
    patterns:
      type: "object"
      description: "Map of pattern_id to pattern configuration"
      required: true
    metadata:
      type: "object"
      description: "Configuration metadata (version, updated_at, author)"
      required: false

  pattern_object:
    name:
      type: "string"
      description: "Human-readable pattern name"
      required: true
    regex:
      type: "string"
      description: "Perl-compatible regex pattern"
      required: true
    placeholder:
      type: "string"
      description: "Replacement placeholder (e.g., [SSN], [EMAIL])"
      required: true
    pii_type:
      type: "string"
      description: "PII type identifier (SSN, EMAIL, CREDIT_CARD, etc.)"
      required: true
    confidence:
      type: "float"
      description: "Detection confidence score (0.0-1.0)"
      required: true
      range: [0.0, 1.0]
    requires_validation:
      type: "boolean"
      description: "Whether to apply validator after regex match"
      required: true
    validator:
      type: "string"
      description: "Validator function name (if requires_validation=true)"
      required: false
    enabled:
      type: "boolean"
      description: "Enable/disable pattern without removing it"
      required: false
      default: true
    priority:
      type: "integer"
      description: "Pattern matching priority (higher = earlier)"
      required: false
      default: 50

example_configuration:
  patterns:
    ssn:
      name: "Social Security Number"
      regex: '\b\d{3}-\d{2}-\d{4}\b'
      placeholder: "[SSN]"
      pii_type: "SSN"
      confidence: 0.95
      requires_validation: true
      validator: "ssn_validator"
      enabled: true
      priority: 100

    email:
      name: "Email Address"
      regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
      placeholder: "[EMAIL]"
      pii_type: "EMAIL"
      confidence: 0.98
      requires_validation: true
      validator: "email_validator"
      enabled: true
      priority: 90

    custom_pattern:
      name: "Custom Internal ID"
      regex: '\bINT-\d{8}\b'
      placeholder: "[INTERNAL_ID]"
      pii_type: "INTERNAL_ID"
      confidence: 1.0
      requires_validation: false
      enabled: true
      priority: 50

  metadata:
    version: "1.0.0"
    updated_at: "2025-10-21T10:00:00Z"
    author: "privacy_team"
    description: "PII detection patterns for FamilyOS K1"

hot_reload_mechanism:
  trigger:
    - "File modification detected (inotify/fswatch)"
    - "SIGHUP signal received"
    - "Manual reload API call (POST /admin/pii-patterns/reload)"

  reload_process:
    - step: "Detect configuration change"
      latency: "<10ms"
    - step: "Parse YAML file"
      latency: "<20ms"
      error_handling: "Log error, keep old config"
    - step: "Validate schema"
      latency: "<10ms"
      error_handling: "Log error, keep old config"
    - step: "Precompile regex patterns"
      latency: "<50ms"
      error_handling: "Log error, keep old config"
    - step: "Atomic swap configuration"
      latency: "<10ms"
      description: "Replace old config with new config atomically"
    - step: "Emit reload success event"
      latency: "<10ms"

  total_reload_latency: "<100ms"

  rollback_strategy:
    on_error: "Keep previous valid configuration"
    log_level: "ERROR"
    metric: "pii_config_reload_failures_total"

configuration_validation:
  schema_validation:
    - "All required fields present"
    - "Confidence in range [0.0, 1.0]"
    - "Priority >= 0"
    - "Validator exists if requires_validation=true"

  regex_compilation:
    - "Regex compiles without errors"
    - "Regex does not cause catastrophic backtracking (test on long strings)"
    - "Regex performance <10ms on 10KB text"

  placeholder_validation:
    - "Placeholder format: [UPPERCASE_WITH_UNDERSCORES]"
    - "Placeholder unique per pii_type"

implementation:
  config_loader:
    class: "PIIPatternConfigLoader"
    methods:
      - "load_from_file(path: str) -> PIIPatternRegistry"
      - "reload() -> Result<PIIPatternRegistry, ConfigError>"
      - "validate_config(config: Dict) -> Result<(), ConfigError>"

  file_watcher:
    library: "notify (Rust) or watchdog (Python)"
    events: ["CREATE", "MODIFY"]
    debounce: "500ms"

  atomic_swap:
    mechanism: "Arc<RwLock<PIIPatternRegistry>>"
    description: "Reader-writer lock for atomic config updates"

performance_targets:
  config_load_latency: "<50ms"
  hot_reload_latency: "<100ms"
  config_validation_latency: "<30ms"
  zero_downtime: "Atomic swap ensures zero detection downtime during reload"

observability:
  metrics:
    - name: "pii_config_reloads_total"
      type: "counter"
      labels: ["status"]  # success, validation_error, compilation_error
    - name: "pii_config_reload_latency_ms"
      type: "histogram"
    - name: "pii_active_patterns_count"
      type: "gauge"
    - name: "pii_config_validation_failures_total"
      type: "counter"
      labels: ["reason"]

testing:
  unit_tests:
    - test_yaml_schema_validation
    - test_pattern_precompilation
    - test_hot_reload_atomic_swap
    - test_invalid_config_rollback

  integration_tests:
    - test_hot_reload_end_to_end
    - test_hot_reload_zero_downtime
    - test_hot_reload_under_100ms
