  # Deployment & Operations
  deployment:
    config_location: "k1/config/pii_patterns.yml"
    backup_location: "k1/config/pii_patterns.yml.backup"
    version_control: "Git (tracked in repository)"

    change_process:
      step_1: "Edit k1/config/pii_patterns.yml locally"
      step_2: "Run validation script: './scripts/validate_patterns.sh'"
      step_3: "Commit: 'git commit -m \"Update: Add UK NI number pattern\"'"
      step_4: "Push: 'git push origin feature/uk-patterns'"
      step_5: "Create Pull Request for peer review"
      step_6: "After approval, merge to main"
      step_7: "Git webhook notifies ConfigManager"
      step_8: "ConfigManager pulls changes, validates, reloads patterns"
      step_9: "File watcher detects change, completes hot-reload (50ms)"
      step_10: "All K1 instances updated within 5 seconds"
      step_11: "Metrics updated in real-time (Prometheus)"

    validation_script: |
      #!/bin/bash
      # scripts/validate_patterns.sh

      CONFIG_FILE="k1/config/pii_patterns.yml"

      # Check YAML syntax
      python3 -c "import yaml; yaml.safe_load(open('$CONFIG_FILE'))" || exit 1

      # Validate all regex patterns
      python3 <<EOF
      import yaml
      import re
      with open('$CONFIG_FILE') as f:
          config = yaml.safe_load(f)
      for pattern in config['patterns']:
          try:
              re.compile(pattern['regex'])
          except:
              print(f"Invalid regex: {pattern['name']}")
              exit(1)
      print("✓ All patterns valid")
      EOF

    rollback_procedure:
      step_1: "If patterns cause issues: 'git log --oneline k1/config/pii_patterns.yml'"
      step_2: "Identify last good commit: 'git show <commit-hash>:k1/config/pii_patterns.yml'"
      step_3: "Revert: 'git revert <bad-commit-hash>'"
      step_4: "Push: 'git push origin main'"
      step_5: "Git webhook triggers ConfigManager"
      step_6: "Patterns automatically revert (hot-reload)"
      step_7: "No K1 restart required"
      latency: "50ms for patterns to revert"

    monitoring:
      metrics_collected:
        - "pii_pattern_reload_total (count of reloads)"
        - "pii_pattern_reload_latency_ms (histogram)"
        - "active_patterns (gauge, current count)"
        - "pattern_validation_errors (count of errors)"

      alerts:
        - "pattern_reload_failed: Alert if reload validation fails"
        - "reload_latency_high: Alert if latency > 100ms"
        - "pattern_detection_degradation: Alert if latency increases >50%"

      dashboards:
        - "Pattern reload status (success/failure rate)"
        - "Reload latency trends"
        - "Active patterns by type"
        - "Validation error rate"

    production_checklist:
      - "✓ All patterns validated in staging environment"
      - "✓ Regex patterns tested against 1000+ samples"
      - "✓ Validators tested and passing"
      - "✓ Performance SLAs verified (<5ms detection)"
      - "✓ Peer review completed"
      - "✓ GDPR/HIPAA compliance verified"
      - "✓ Metrics and alerting configured"
      - "✓ Rollback procedure tested"
      - "✓ Git history clean and annotated"
      - "✓ Ready for production deployment"

  # Notes
  notes: |
    - YAML provides human-readable configuration (no code recompilation needed)
    - Hot-reload enables runtime pattern updates (A/B testing, A/C/D testing)
    - Atomic swap ensures zero downtime during reload
    - Rollback mechanism protects against invalid configurations
    - Git integration enables version control and audit trail
    - ConfigManager integration enables cluster-wide pattern synchronization
