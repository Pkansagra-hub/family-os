# Pattern Validation Logic Contract
# Source ADR: 0035a-regex-pattern-library.md
# Epic 2.9, Issue 2.9.1
# Purpose: Define validation algorithms for structured PII (Luhn, SSN format, RFC 5322, E.164)

contract:
  name: pattern_validation_logic
  version: "1.0.0"
  source_adr: "0035a-regex-pattern-library.md"
  epic: "2.9"
  issue: "2.9.1"

validators:
  luhn_validator:
    name: "Luhn Algorithm for Credit Cards"
    description: "Validates credit card numbers using Luhn checksum algorithm (ISO/IEC 7812-1)"
    applies_to: ["CREDIT_CARD"]
    algorithm:
      - "Reverse the credit card number digits"
      - "Starting from the second digit, double every other digit"
      - "If doubled digit > 9, subtract 9"
      - "Sum all digits"
      - "If sum % 10 == 0, valid"
    performance: "<0.1ms"
    accuracy: "100% precision (no false positives)"
    examples:
      valid:
        - "4532123456789010"  # Visa
        - "5425233430109903"  # MasterCard
        - "378282246310005"   # Amex
      invalid:
        - "4532123456789011"  # Checksum fail
        - "1234567890123456"  # Checksum fail

  ssn_validator:
    name: "SSN Format Validator"
    description: "Validates US Social Security Number format rules"
    applies_to: ["SSN"]
    rules:
      - rule: "First 3 digits (area number) cannot be 000, 666, or 900-999"
        pattern: "^(?!000|666|9\\d{2})\\d{3}-\\d{2}-\\d{4}$"
      - rule: "Middle 2 digits (group number) cannot be 00"
        pattern: "^\\d{3}-(?!00)\\d{2}-\\d{4}$"
      - rule: "Last 4 digits (serial number) cannot be 0000"
        pattern: "^\\d{3}-\\d{2}-(?!0000)\\d{4}$"
    performance: "<0.1ms"
    accuracy: "100% precision (blocks invalid SSN formats)"
    examples:
      valid:
        - "123-45-6789"
        - "987-65-4321"
        - "456-78-9012"
      invalid:
        - "000-45-6789"  # Area 000
        - "666-45-6789"  # Area 666
        - "900-45-6789"  # Area 900-999
        - "123-00-6789"  # Group 00
        - "123-45-0000"  # Serial 0000

  email_validator:
    name: "RFC 5322 Email Validator"
    description: "Validates email addresses per RFC 5322 specification"
    applies_to: ["EMAIL"]
    rules:
      - "Local part (before @): alphanumeric, dots, hyphens, underscores, plus"
      - "Domain part (after @): alphanumeric, dots, hyphens"
      - "TLD (top-level domain): 2+ letters"
      - "No consecutive dots, no leading/trailing dots"
    regex: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}$'
    performance: "<0.1ms"
    accuracy: "98% precision (blocks most invalid emails)"
    examples:
      valid:
        - "user@example.com"
        - "john.doe+tag@company.co.uk"
        - "admin_123@test-domain.org"
      invalid:
        - "user@example"       # No TLD
        - "@example.com"       # No local part
        - "user..name@test.com" # Consecutive dots

  phone_validator:
    name: "E.164 International Phone Validator"
    description: "Validates phone numbers per E.164 international format"
    applies_to: ["PHONE"]
    rules:
      - "Optional country code prefix (+1 for US)"
      - "10 digits for US numbers (area code + subscriber)"
      - "Area code cannot start with 0 or 1"
      - "Subscriber number cannot be all same digit"
    performance: "<0.1ms"
    accuracy: "95% precision (blocks most invalid phones)"
    examples:
      valid:
        - "+1-555-123-4567"
        - "(555) 123-4567"
        - "555-123-4567"
      invalid:
        - "+1-155-123-4567"  # Area code starts with 1
        - "+1-055-123-4567"  # Area code starts with 0
        - "555-111-1111"     # All same digit (suspicious)

  iban_validator:
    name: "IBAN Checksum Validator"
    description: "Validates IBAN (International Bank Account Number) using mod-97 checksum"
    applies_to: ["IBAN"]
    algorithm:
      - "Move first 4 characters to end"
      - "Replace letters with numbers (A=10, B=11, ..., Z=35)"
      - "Compute mod 97 of the resulting number"
      - "If result == 1, valid"
    performance: "<0.2ms"
    accuracy: "100% precision (checksum verification)"
    examples:
      valid:
        - "GB82WEST12345698765432"
        - "DE89370400440532013000"
      invalid:
        - "GB83WEST12345698765432"  # Checksum fail
        - "XX12345678901234567890"  # Invalid country code

implementation:
  validation_pipeline:
    - step: "regex_match"
      description: "Pattern matches via regex"
      latency: "<1ms"
    - step: "validation_check"
      description: "Apply validator if requires_validation=true"
      latency: "<0.2ms"
    - step: "confidence_adjustment"
      description: "Increase confidence if validation passes"
      confidence_boost: "+0.05"

  validation_strategy:
    on_regex_match:
      if_requires_validation: "Run validator algorithm"
      if_validation_passes: "Return PII detection with boosted confidence"
      if_validation_fails: "Discard match (false positive)"
    on_regex_no_match:
      action: "Return no detection"

performance_targets:
  validation_latency_per_pii: "<0.2ms"
  validation_overhead: "<10% of total detection time"
  false_positive_reduction: "100% (validation eliminates all false positives)"

observability:
  metrics:
    - name: "pii_validation_checks_total"
      type: "counter"
      labels: ["validator", "result"]
    - name: "pii_validation_latency_ms"
      type: "histogram"
      labels: ["validator"]
    - name: "pii_false_positives_blocked_total"
      type: "counter"
      labels: ["pii_type"]

testing:
  unit_tests:
    - test_luhn_algorithm_valid_cards
    - test_luhn_algorithm_invalid_cards
    - test_ssn_validator_blocks_invalid_formats
    - test_email_validator_rfc5322_compliance
    - test_phone_validator_e164_compliance
    - test_iban_validator_checksum

  integration_tests:
    - test_validation_pipeline_end_to_end
    - test_validation_reduces_false_positives_to_zero
    - test_validation_latency_under_0_2ms
