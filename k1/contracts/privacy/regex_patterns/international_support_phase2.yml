# International Support (Phase 2) Contract
# Source ADR: 0035a-regex-pattern-library.md
# Epic 2.9, Issue 2.9.1
# Purpose: Define international PII patterns (UK NHS, Canadian SIN, EU VAT) for Phase 2 expansion

contract:
  name: international_support_phase2
  version: "1.0.0"
  source_adr: "0035a-regex-pattern-library.md"
  epic: "2.9"
  issue: "2.9.1"
  phase: "2"  # Phase 1 = US patterns only, Phase 2 = International

international_patterns:
  uk_nhs:
    name: "UK NHS Number"
    regex: '\b\d{3}-\d{3}-\d{4}\b'
    placeholder: "[UK_NHS]"
    pii_type: "UK_NHS"
    confidence: 0.90
    requires_validation: true
    validator: "nhs_checksum_validator"
    description: "UK National Health Service number (XXX-XXX-XXXX format)"
    format: "10 digits with check digit"
    region: "United Kingdom"
    examples:
      - "943-476-5919"
      - "123-456-7890"

  canadian_sin:
    name: "Canadian SIN"
    regex: '\b\d{3}-\d{3}-\d{3}\b'
    placeholder: "[CA_SIN]"
    pii_type: "CANADIAN_SIN"
    confidence: 0.92
    requires_validation: true
    validator: "sin_checksum_validator"
    description: "Canadian Social Insurance Number (XXX-XXX-XXX format)"
    format: "9 digits with Luhn checksum"
    region: "Canada"
    examples:
      - "123-456-789"
      - "987-654-321"

  eu_vat_germany:
    name: "German VAT Number"
    regex: '\bDE\d{9}\b'
    placeholder: "[DE_VAT]"
    pii_type: "EU_VAT"
    confidence: 0.95
    requires_validation: false
    description: "German VAT identification number"
    format: "DE + 9 digits"
    region: "Germany"
    examples:
      - "DE123456789"
      - "DE987654321"

  eu_vat_france:
    name: "French VAT Number"
    regex: '\bFR[A-Z0-9]{2}\d{9}\b'
    placeholder: "[FR_VAT]"
    pii_type: "EU_VAT"
    confidence: 0.95
    requires_validation: false
    description: "French VAT identification number"
    format: "FR + 2 alphanumeric + 9 digits"
    region: "France"
    examples:
      - "FRXX123456789"
      - "FR12345678901"

  eu_vat_uk:
    name: "UK VAT Number"
    regex: '\bGB\d{9}(?:\d{3})?\b'
    placeholder: "[GB_VAT]"
    pii_type: "EU_VAT"
    confidence: 0.95
    requires_validation: false
    description: "UK VAT registration number"
    format: "GB + 9 or 12 digits"
    region: "United Kingdom"
    examples:
      - "GB123456789"
      - "GB123456789012"

  eu_vat_italy:
    name: "Italian VAT Number"
    regex: '\bIT\d{11}\b'
    placeholder: "[IT_VAT]"
    pii_type: "EU_VAT"
    confidence: 0.95
    requires_validation: false
    description: "Italian VAT identification number"
    format: "IT + 11 digits"
    region: "Italy"
    examples:
      - "IT12345678901"

  eu_vat_spain:
    name: "Spanish VAT Number"
    regex: '\bES[A-Z0-9]\d{7}[A-Z0-9]\b'
    placeholder: "[ES_VAT]"
    pii_type: "EU_VAT"
    confidence: 0.95
    requires_validation: false
    description: "Spanish VAT identification number (NIF)"
    format: "ES + alphanumeric + 7 digits + alphanumeric"
    region: "Spain"
    examples:
      - "ESX1234567X"
      - "ESA1234567B"

  au_tfn:
    name: "Australian TFN"
    regex: '\b\d{3}\s?\d{3}\s?\d{3}\b'
    placeholder: "[AU_TFN]"
    pii_type: "AUSTRALIAN_TFN"
    confidence: 0.88
    requires_validation: true
    validator: "tfn_checksum_validator"
    description: "Australian Tax File Number"
    format: "9 digits (optionally with spaces)"
    region: "Australia"
    examples:
      - "123 456 789"
      - "987654321"

international_validators:
  nhs_checksum_validator:
    name: "NHS Number Check Digit Validator"
    description: "Validates UK NHS number using Modulus 11 algorithm"
    algorithm:
      - "Multiply each of first 9 digits by (11 - position)"
      - "Sum all products"
      - "Calculate 11 - (sum % 11)"
      - "If result == 11, check digit = 0"
      - "If result == 10, invalid NHS number"
      - "Compare result with 10th digit (check digit)"
    performance: "<0.1ms"
    examples:
      valid: ["943-476-5919"]
      invalid: ["943-476-5910"]  # Wrong check digit

  sin_checksum_validator:
    name: "Canadian SIN Luhn Validator"
    description: "Validates Canadian SIN using Luhn algorithm"
    algorithm: "Same as credit card Luhn validation (ISO/IEC 7812-1)"
    performance: "<0.1ms"
    examples:
      valid: ["046-454-286"]
      invalid: ["046-454-287"]  # Wrong check digit

  tfn_checksum_validator:
    name: "Australian TFN Check Digit Validator"
    description: "Validates Australian TFN using weighted algorithm"
    algorithm:
      - "Multiply digits by weights [1,4,3,7,5,8,6,9,10]"
      - "Sum all products"
      - "If sum % 11 == 0, valid"
    performance: "<0.1ms"
    examples:
      valid: ["123456782"]
      invalid: ["123456789"]  # Wrong check digit

phase2_rollout_plan:
  regions:
    - region: "United Kingdom"
      patterns: ["UK_NHS", "GB_VAT"]
      priority: "High"
      justification: "Large English-speaking market"

    - region: "Canada"
      patterns: ["CANADIAN_SIN"]
      priority: "High"
      justification: "English/French bilingual, close to US"

    - region: "European Union"
      patterns: ["DE_VAT", "FR_VAT", "IT_VAT", "ES_VAT"]
      priority: "Medium"
      justification: "GDPR compliance requirement"

    - region: "Australia"
      patterns: ["AU_TFN"]
      priority: "Medium"
      justification: "English-speaking, Asia-Pacific expansion"

  timeline:
    phase1_complete: "2025-Q4"
    phase2_start: "2026-Q1"
    phase2_complete: "2026-Q2"

configuration_management:
  locale_detection:
    method: "User profile locale setting (ISO 3166-1 country code)"
    fallback: "IP geolocation (GeoIP2)"
    example: "user.locale = 'en-GB' → Enable UK patterns"

  pattern_sets:
    us_patterns:
      enabled: ["SSN", "CREDIT_CARD", "EMAIL", "PHONE", "DRIVERS_LICENSE", "TAX_ID"]
    uk_patterns:
      enabled: ["UK_NHS", "GB_VAT", "EMAIL", "IBAN"]
    ca_patterns:
      enabled: ["CANADIAN_SIN", "EMAIL", "PHONE"]
    eu_patterns:
      enabled: ["IBAN", "EU_VAT", "EMAIL"]

  multi_region_support:
    description: "Enable multiple pattern sets simultaneously for multi-national users"
    example: "US company with EU subsidiaries → Enable US + EU patterns"

performance_impact:
  additional_patterns: 7
  total_patterns_phase2: 19  # 12 from Phase 1 + 7 from Phase 2
  latency_increase: "+2ms (total <7ms for all 19 patterns)"
  memory_increase: "+70KB (total ~190KB)"

accuracy_targets:
  recall: "85%"  # Consistent with Phase 1
  precision: "100%"  # With validation
  false_positive_rate: "0%"

observability:
  metrics:
    - name: "pii_regex_international_detections_total"
      type: "counter"
      labels: ["pii_type", "region"]
    - name: "pii_regex_locale_distribution"
      type: "gauge"
      labels: ["locale"]

testing:
  unit_tests:
    - test_uk_nhs_pattern_matches
    - test_canadian_sin_pattern_matches
    - test_eu_vat_patterns_all_countries
    - test_nhs_checksum_validator
    - test_sin_checksum_validator

  integration_tests:
    - test_multi_region_pattern_sets
    - test_locale_based_pattern_selection
    - test_phase2_latency_under_7ms
