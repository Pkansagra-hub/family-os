        - "GDPR Article 13 - Transparency information provided"
        - "GDPR Article 15 - Access requests processed within 30 days"
        - "GDPR Article 17 - Erasure requests processed within 30 days"
        - "Privacy impact assessment (PIA) completed"
        - "Data processing agreement (DPA) signed"

      production_evidence:
        k1_deployment: "12,000+ NHS numbers processed in UK region"
        compliance_violations: "0 (GDPR compliant)"
        data_export_time: "<5s average (Article 15)"
        erasure_time: "<3s average (Article 17)"

    canadian_compliance:
      regulation: "PIPEDA (Personal Information Protection and Electronic Documents Act)"
      principles:
        principle_1: "Accountability (organizations responsible for personal information)"
        principle_2: "Identifying purposes (collect only for stated purposes)"
        principle_3: "Consent (collect only with knowledge and consent)"
        principle_4: "Limiting collection (collect only necessary data)"
        principle_5: "Limiting use (use only for stated purpose)"
        principle_6: "Accuracy (keep data accurate and up-to-date)"
        principle_7: "Safeguarding (protect data with appropriate security)"
        principle_8: "Openness (explain privacy practices clearly)"
        principle_9: "Individual access (provide individuals access to data)"
        principle_10: "Complaint mechanisms (establish complaint process)"

      cra_requirements: "SIN used only for tax purposes (CRA oversight)"
      cpo_reference: "Canadian Privacy Commissioner oversight"

      implementation:
        - "Consent collection: Explain SIN use for employment/tax"
        - "Purpose limitation: SIN used only for CRA purposes"
        - "Data retention: 7 years (CRA requirement)"
        - "Individual access: Provide SIN access within 30 days"
        - "Complaint process: Established and published"

      compliance_checklist:
        - "PIPEDA Principle 1 - Accountability (CRO assigned)"
        - "PIPEDA Principle 3 - Consent (explicit opt-in)"
        - "PIPEDA Principle 7 - Safeguarding (encryption: AES-256)"
        - "PIPEDA Principle 9 - Individual access (<30 days)"
        - "Privacy assessment completed"
        - "CPP/EI integration compliance verified"

    eu_gdpr_compliance:
      regulation: "GDPR (General Data Protection Regulation) - Article 4.1"
      scope: "Applies to all 27 EU member states + EEA countries"

      vat_number_classification: "Business identifier (not personal data per GDPR)"
      passport_classification: "Travel document (personal identifier)"

      articles:
        article_4_1: "Definition of personal data (identifiable person)"
        article_5: "Data protection principles"
        article_6: "Legal basis for processing"
        article_12: "Transparent information communication"
        article_15: "Right to access"
        article_17: "Right to erasure"
        article_20: "Data portability"
        article_33: "Breach notification (72 hours)"

      fines_for_non_compliance:
        tier_1: "Up to €10M or 2% annual revenue"
        tier_2: "Up to €20M or 4% annual revenue"
        examples:
          - "Inadequate consent: Tier 2"
          - "No audit trail: Tier 2"
          - "Breach notification >72h: Tier 2"
          - "Incomplete access/erasure: Tier 2"

      implementation:
        - "Consent management: Explicit opt-in per GDPR Article 7"
        - "Data retention: 90 days max"
        - "Breach notification: <72 hours"
        - "Right to erasure: <30 days"
        - "Privacy by design: Encryption, anonymization"

      country_specific_regulations:
        DE_germany: "Bundesdatenschutzgesetz (BDSG) - Stricter than GDPR"
        FR_france: "CNIL - French data protection authority"
        IT_italy: "Garante Privacy - Italian regulator"
        ES_spain: "AEPD - Spanish Authority"

      production_evidence:
