        patterns: ["sin", "email", "phone", "health_insurance", "passport", "driver_license"]
        confidence_threshold: 0.75
        audit_retention_days: 2555  # 7 years (CRA requirement)
        pipeda_compliance: enabled
        cra_integration: enabled

      european_union_eu:
        enabled: true
        patterns: ["vat_number", "passport", "email", "phone", "driver_license", "iban", "health_insurance"]
        confidence_threshold: 0.85
        audit_retention_days: 90
        gdpr_compliance: enabled
        country_specific_configs:
          DE: {authority: "BfDI", language: "German", vat_format: "DE[0-9]{9}"}
          FR: {authority: "CNIL", language: "French", vat_format: "FR[0-9A-Z]{2}[0-9]{9}"}
          IT: {authority: "Garante Privacy", language: "Italian", vat_format: "IT[0-9]{11}"}
          ES: {authority: "AEPD", language: "Spanish", vat_format: "ES[0-9A-Z]{9}"}
          NL: {authority: "AP", language: "Dutch", vat_format: "NL[0-9]{12}B[0-9]{2}"}
          BE: {authority: "APD", language: "Dutch/French", vat_format: "BE[0-9]{10}"}
          AT: {authority: "DSB", language: "German", vat_format: "AT[0-9]{8}"}
          PL: {authority: "UODO", language: "Polish", vat_format: "PL[0-9]{10}"}

    user_region_detection_hierarchy:
      priority_1: "User profile region setting (most authoritative)"
      priority_2: "User geolocation from IP address"
      priority_3: "User language preference"
      priority_4: "User timezone"
      priority_5: "Default fallback to US + UK + EU"

      implementation_logic: |
        1. Check user.region (explicitly set in profile)
        2. If null, use IP geolocation (MaxMind GeoIP2)
        3. If null, use user.language (map to region)
        4. If null, use user.timezone (map to region)
        5. Default to "GLOBAL" (all patterns enabled)

        GLOBAL region enables: email, phone, passport (no region-specific patterns)

  # Testing Strategy (WARD Framework)
  comprehensive_testing:
    test_organization:
      unit_tests:
        nhs_pattern_tests: 60
        nino_pattern_tests: 50
        sin_pattern_tests: 45
        vat_pattern_tests: 150
        passport_pattern_tests: 40
        total_unit_tests: 345

      integration_tests:
        regional_pattern_matching: 60
        multi_region_coordination: 30
        feature_flag_behavior: 20
        config_reload: 15
        total_integration_tests: 125

      compliance_tests:
        gdpr_article_15_access: 25
        gdpr_article_17_erasure: 25
        gdpr_article_20_portability: 20
        pipeda_principle_9: 15
        uk_dpa_compliance: 15
        total_compliance_tests: 100

      security_tests:
        injection_protection: 10
        regex_redos_prevention: 20
        encryption_validation: 15
        audit_trail_integrity: 10
        total_security_tests: 55

      total_test_vectors: 625
      test_coverage_target: "95%"

    test_examples:
      nhs_number_tests: |
        @test("NHS pattern matches valid NHS numbers")
        def _():
            pattern = get_pattern("nhs_number")
            assert pattern.matches("4025697018")
            assert pattern.matches("4897843216")

        @test("NHS checksum validates correctly")
        def _():
            assert validate_nhs("4025697018") == True
            assert validate_nhs("4025697019") == False  # Wrong checksum

        @test("NHS pattern rejects all zeros")
        def _():
            assert pattern.matches("0000000000") == False

      sin_luhn_tests: |
        @test("SIN Luhn algorithm validates")
        def _():
            assert validate_sin("123 456 789") == True  # Valid SIN
            assert validate_sin("000 000 000") == False  # All zeros
            assert validate_sin("123 456 780") == False  # Wrong checksum

      multi_region_tests: |
        @test("Correct patterns enabled per region")
        def _():
            gb_patterns = get_patterns_for_region("GB")
            assert "nhs_number" in gb_patterns
            assert "nino" in gb_patterns
            assert "ssn" not in gb_patterns

            ca_patterns = get_patterns_for_region("CA")
            assert "sin" in ca_patterns
            assert "nhs_number" not in ca_patterns

      compliance_tests: |
        @test("GDPR Article 15 returns all PII for user")
        async def _():
            result = await gdpr_article_15_request(user_id="user_123")
            assert "nhs_numbers" in result
            assert "nino" in result
            assert all(v == "[REDACTED]" for v in result.values())

        @test("GDPR Article 17 deletes all PII for user")
        async def _():
            await gdpr_article_17_request(user_id="user_123")
            result = await get_user_pii(user_id="user_123")
            assert len(result.detections) == 0

