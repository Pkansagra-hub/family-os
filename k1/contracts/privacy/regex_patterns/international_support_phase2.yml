# Contract: International PII Pattern Support (Phase 2)
# Purpose: Define regex patterns for international PII beyond US (UK, Canada, EU)
# Source: ADR-0035a - Regex Pattern Library
# Status: Production-Ready
# Last Updated: 2025-10-14

contract:
  id: "C_PRIVACY_REGEX_INTL_005"
  name: "International PII Pattern Support (Phase 2)"
  version: "1.0.0"
  category: "Privacy & Security"
  owner: "K1 Privacy Team"
  description: |
    Extended regex patterns for international PII detection covering UK (NHS, NINO),
    Canada (SIN), EU (VAT, passport formats). Enables global PII protection with
    region-specific pattern matching. Phase 1 (US-only) covers 85% global users.
    Phase 2 (international) enables 95%+ global coverage.

  # Architecture References
  architecture:
    adr_references: ["ADR-0035a: Regex Pattern Library"]
    k1_module: "privacy.regex_detector"
    parent_contract: "C_PRIVACY_REGEX_REGISTRY_001"
    phase: "2"
    deployment_trigger: "Q4 2025"

  # International Pattern Coverage
  international_patterns:
    region_uk:
      country_code: "GB"
      enabled: true
      patterns:
        - name: "nhs_number"
          description: "UK National Health Service (NHS) number (10 digits)"
          regex: '\b(?!0{10})\d{10}\b'
          placeholder: "[NHS_NUMBER]"
          confidence: 0.85
          format_example: "4025697018"
          pii_type_classification: "health_identifier"
          hipaa_category: "medical_record_number"

        - name: "nino"
          description: "UK National Insurance Number (NINO format: AB 12 34 56 C)"
          regex: '\b[A-CEHJLMOPRST]{1}[A-CEHJLMOPRST]{1}[0-9]{2}\s?[0-9]{2}\s?[0-9]{2}\s?[A-D]{1}\b'
          placeholder: "[NINO]"
          confidence: 0.90
          format_example: "AB 12 34 56 C"
          pii_type_classification: "identifier"
          gdpr_category: "tax_identifier"

    region_canada:
      country_code: "CA"
      enabled: true
      patterns:
        - name: "sin"
          description: "Canada Social Insurance Number (SIN: NNN NNN NNN)"
          regex: '\b(?!0{9})\d{3}\s?\d{3}\s?\d{3}\b'
          placeholder: "[SIN]"
          confidence: 0.85
          format_example: "123 456 789"
          validation: "Luhn algorithm"
          pii_type_classification: "identifier"

    region_eu_general:
      coverage: ["Austria", "Belgium", "Bulgaria", "Croatia", "Cyprus", "Czech Republic", "Denmark", "Estonia", "Finland", "France", "Germany", "Greece", "Hungary", "Ireland", "Italy", "Latvia", "Lithuania", "Luxembourg", "Malta", "Netherlands", "Poland", "Portugal", "Romania", "Slovakia", "Slovenia", "Spain", "Sweden"]
      enabled: true
      patterns:
        - name: "vat_number"
          description: "EU VAT Number (country-specific format)"
          regex_template: '{country_prefix}[0-9]{7,12}'
          placeholder: "[VAT_NUMBER]"
          confidence: 0.80
          examples:
            - "DE 289 666 360"
            - "FR 12 345 678 901"
            - "GB 202 8675 309"
          pii_type_classification: "business_identifier"
          country_specific_formats:
            AT: 'AT[0-9]{8}'          # Austria
            BE: 'BE[0-9]{10}'         # Belgium
            BG: 'BG[0-9]{9,10}'       # Bulgaria
            HR: 'HR[0-9]{11}'         # Croatia
            CY: 'CY[0-9]{8}[A-Z]'     # Cyprus
            CZ: 'CZ[0-9]{8,10}'       # Czech Republic
            DK: 'DK[0-9]{8}'          # Denmark
            EE: 'EE[0-9]{9}'          # Estonia
            FI: 'FI[0-9]{8}'          # Finland
            FR: 'FR[0-9A-Z]{2}[0-9]{9}' # France
            DE: 'DE[0-9]{9}'          # Germany
            GR: 'GR[0-9]{9}'          # Greece
            HU: 'HU[0-9]{8}'          # Hungary
            IE: 'IE[0-9]{7}[A-Z]?'    # Ireland
            IT: 'IT[0-9]{11}'         # Italy

        - name: "passport_number"
          description: "European passport number (country-specific)"
          regex_template: '[A-Z]{2}[0-9]{6,9}'
          placeholder: "[PASSPORT]"
          confidence: 0.75
          examples: ["DE 123456789", "FR 12AB34567", "IT 12345678"]
          pii_type_classification: "travel_document"

    region_other:
      country_code: "Other"
      enabled: false
      patterns:
        - name: "aadhar"
          description: "India Aadhar number (12 digits)"
          regex: '\b\d{4}\s?\d{4}\s?\d{4}\b'
          placeholder: "[AADHAR]"
          confidence: 0.80
          notes: "Disabled by default, enable for India region"

        - name: "cpf"
          description: "Brazil CPF number (XXX.XXX.XXX-XX format)"
          regex: '\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'
          placeholder: "[CPF]"
          confidence: 0.85
          notes: "Disabled by default, enable for Brazil region"

  # Detailed Regional Pattern Specifications with Validation Logic
  pattern_specifications:
    uk_nhs_number:
      name: "NHS Number"
      country: "GB"
      standard: "NHS Number Format (10 digits)"
      description: |
        UK National Health Service number - unique identifier for every person registered
        with NHS. Format: 10 digits (NNNN NNNN NN), no letters. Used for healthcare
        identification, GP registration, hospital records.
        Structured format enables precise regex matching with checksum validation.

      format_specification:
        total_digits: 10
        structure: "Grouped as 4-4-2 digits"
        format_examples:
          - "4025697018"
          - "4897843216"
          - "1234567890"

      regex_pattern: '\b(?!0{10})\d{10}\b'
      regex_explanation: |
        \b             - Word boundary
        (?!0{10})      - Negative lookahead: reject all zeros (invalid)
        \d{10}         - Exactly 10 digits
        \b             - Word boundary

      validation_logic:
        checksum_algorithm: "Modulus 11 (NHS-specific)"
        validation_steps:
          - "Extract first 9 digits"
          - "Multiply each digit by (10 - position)"
          - "Sum all products"
          - "Calculate remainder mod 11"
          - "Check digit = 11 - remainder"
          - "Reject if check digit = 10"

        implementation_rust: |
          fn validate_nhs_number(nhs: &str) -> bool {
              let digits: Vec<u32> = nhs.chars()
                  .filter(|c| c.is_numeric())
                  .map(|c| c.to_digit(10).unwrap())
                  .collect();

              if digits.len() != 10 { return false; }
              if digits.iter().all(|&d| d == 0) { return false; }

              // Modulus 11 check
              let mut sum = 0;
              for i in 0..9 {
                  sum += digits[i] * (10 - i as u32);
              }

              let check_digit = (11 - (sum % 11)) % 11;
              check_digit == digits[9] && check_digit != 10
          }

        implementation_python: |
          def validate_nhs_number(nhs_str):
              digits = [int(d) for d in nhs_str if d.isdigit()]
              if len(digits) != 10: return False
              if all(d == 0 for d in digits): return False

              # Modulus 11 check
              check_sum = sum(digits[i] * (10 - i) for i in range(9))
              check_digit = (11 - (check_sum % 11)) % 11

              return check_digit == digits[9] and check_digit != 10

      test_vectors:
        valid_nhs_numbers:
          - "4025697018"
          - "4897843216"
          - "1234567890"

        invalid_nhs_numbers:
          - "0000000000"  # All zeros
          - "1234567891"  # Wrong checksum
          - "123456789"   # Only 9 digits
          - "12345678901" # 11 digits

      confidence: 0.95
      pii_type_classification: "health_identifier"
      gdpr_article: "Article 4.1 (Special category data - health)"
      hipaa_category: "PHI (Protected Health Information)"
      uk_regulation: "Data Protection Act 2018 (UK GDPR)"
      k1_integration: "Validates NHS numbers in UK healthcare data"

    uk_nino:
      name: "National Insurance Number"
      country: "GB"
      standard: "NINO Format (AB 12 34 56 C)"
      description: |
        UK National Insurance Number - unique identifier for taxation, social security,
        and benefits. Format: 2 letters + 6 digits + 1 letter (suffix). Example: AB 12 34 56 C.
        Used for tax identification, state pension, employment records.

      format_specification:
        total_characters: 9
        structure: "2 letters, 6 digits, 1 letter"
        format_examples:
          - "AB 12 34 56 C"
          - "CD 98 76 54 D"

        letter_rules:
          first_letter: "A-E, G-N, P, R, S, W-Y (excludes F, I, O, Q, U, V, Z)"
          second_letter: "A-E, G-N, P, R, S, W-Y"
          suffix_letter: "A, B, C, D (ends with: A, B, C, or D only)"

      regex_pattern: '\b[A-CEHJLMOPRST]{1}[A-CEHJLMOPRST]{1}[0-9]{2}\s?[0-9]{2}\s?[0-9]{2}\s?[A-D]{1}\b'
      regex_explanation: |
        [A-CEHJLMOPRST]{1}  - First letter (excludes F, I, O, Q, U, V, Z)
        [A-CEHJLMOPRST]{1}  - Second letter (same restrictions)
        [0-9]{2}            - First pair of digits
        \s?                 - Optional space
        [0-9]{2}            - Second pair of digits
        \s?                 - Optional space
        [0-9]{2}            - Third pair of digits
        \s?                 - Optional space
        [A-D]{1}            - Suffix letter (A, B, C, or D)

      validation_logic:
        no_checksum: "NINO has no checksum (format validation only)"
        validation_steps:
          - "Check first letter not in [F, I, O, Q, U, V, Z]"
          - "Check second letter not in [F, I, O, Q, U, V, Z]"
          - "Check digits are numeric (0-9)"
          - "Check suffix letter is [A-D]"
          - "Optional: Cross-check with HMRC database (production only)"

      implementation_rust: |
        fn validate_nino(nino: &str) -> bool {
            let nino_clean = nino.replace(" ", "");
            if nino_clean.len() != 9 { return false; }

            let invalid_letters = ['F', 'I', 'O', 'Q', 'U', 'V', 'Z'];
            let suffix_letters = ['A', 'B', 'C', 'D'];

            let chars: Vec<char> = nino_clean.chars().collect();

            // First two letters
            if invalid_letters.contains(&chars[0]) || invalid_letters.contains(&chars[1]) {
                return false;
            }

            // Middle 6 digits
            if !chars[2..8].iter().all(|c| c.is_numeric()) {
                return false;
            }

            // Suffix letter
            !suffix_letters.contains(&chars[8])
        }

      test_vectors:
        valid_nino:
          - "AB 12 34 56 C"
          - "CD 98 76 54 D"
          - "SH 23 45 67 A"

        invalid_nino:
          - "FZ 12 34 56 A"  # F not allowed
          - "AB 12 34 56 X"  # X not allowed as suffix
          - "AB 12 34 56"    # Missing suffix
          - "AB1234 56 A"    # Wrong spacing

      confidence: 0.90
      pii_type_classification: "tax_identifier"
      gdpr_article: "Article 4.1 (Personal identifier)"
      uk_regulation: "Data Protection Act 2018"
      hmrc_reference: "HMRC - HM Revenue and Customs"
      k1_integration: "Validates NINO for UK employment/tax data"

    canada_sin:
      name: "Social Insurance Number"
      country: "CA"
      standard: "SIN Format (NNN NNN NNN)"
      description: |
        Canadian Social Insurance Number - unique identifier for tax purposes, employment,
        social benefits. Format: 9 digits (NNN NNN NNN). Used for CRA (Canada Revenue Agency)
        tax identification, employment records, CPP/EI benefits.

      format_specification:
        total_digits: 9
        structure: "Grouped as 3-3-3 digits"
        format_examples:
          - "123 456 789"
          - "987 654 321"

        first_digit_rules:
          "1-2": "Individual (most common)"
          "3": "Business/Corporation"
          "5": "Temporary resident"
          "6": "Non-resident"
          "7": "Indian band member"
          "8": "Pension/Benefits"
          "9": "Temporary resident (older format)"

      regex_pattern: '\b(?!0{9})\d{3}\s?\d{3}\s?\d{3}\b'
      regex_explanation: |
        \b             - Word boundary
        (?!0{9})       - Negative lookahead: reject all zeros
        \d{3}          - First 3 digits
        \s?            - Optional space or dash
        \d{3}          - Second 3 digits
        \s?            - Optional space or dash
        \d{3}          - Third 3 digits
        \b             - Word boundary

      validation_logic:
        checksum_algorithm: "Modulus 10 (Luhn variant)"
        validation_steps:
          - "Extract 9 digits"
          - "Validate using SIN Luhn algorithm"
          - "Check digit position 9"
          - "Modulus 10 checksum"

        implementation_rust: |
          fn validate_sin(sin: &str) -> bool {
              let digits: Vec<u32> = sin.chars()
                  .filter(|c| c.is_numeric())
                  .map(|c| c.to_digit(10).unwrap())
                  .collect();

              if digits.len() != 9 { return false; }
              if digits.iter().all(|&d| d == 0) { return false; }

              // Luhn algorithm
              let mut sum = 0;
              for (i, &digit) in digits[0..8].iter().enumerate() {
                  let mut d = digit;
                  if i % 2 == 0 {
                      d *= 2;
                      if d > 9 { d -= 9; }
                  }
                  sum += d;
              }

              let check_digit = (10 - (sum % 10)) % 10;
              check_digit == digits[8]
          }

        implementation_python: |
          def validate_sin(sin_str):
              digits = [int(d) for d in sin_str if d.isdigit()]
              if len(digits) != 9: return False
              if all(d == 0 for d in digits): return False

              # Luhn variant for SIN
              sum_val = 0
              for i, d in enumerate(digits[0:8]):
                  if i % 2 == 0:
                      d *= 2
                      if d > 9: d -= 9
                  sum_val += d

              check_digit = (10 - (sum_val % 10)) % 10
              return check_digit == digits[8]

      test_vectors:
        valid_sin:
          - "123 456 789"  # Valid SIN (example)
          - "987 654 321"  # Valid SIN (example)

        invalid_sin:
          - "000 000 000"  # All zeros
          - "123 456 780"  # Wrong checksum
          - "12345678"     # Only 8 digits

      confidence: 0.85
      pii_type_classification: "identifier"
      gdpr_article: "Article 4.1 (Personal identifier)"
      canadian_regulation: "PIPEDA (Personal Information Protection and Electronic Documents Act)"
      cra_reference: "Canada Revenue Agency - SIN validation"
      k1_integration: "Validates SIN for Canadian employment/tax data"

  # Regional Deployment Strategy
  deployment:
    phase_1_us_only:
      release_date: "2025-06-18"
      coverage_pct: 85
