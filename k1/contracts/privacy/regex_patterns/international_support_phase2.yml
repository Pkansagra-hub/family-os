        article_5: "Data protection principles (lawfulness, fairness, transparency)"
        article_13: "Information to be provided to data subject"
        article_15: "Right of access by data subject"
        article_17: "Right to erasure (right to be forgotten)"
        article_4_11: "Explicit consent for special category data (health)"

      special_category_data: "NHS number is health data (Article 9)"
      legal_basis: "Explicit consent required for processing health data"

      implementation:
        - "Consent collection: Explicit opt-in before NHS number detection"
        - "Data retention: 90 days max (GDPR standard)"
        - "Data portability: Export NHS data in JSON format"
        - "Erasure: Delete NHS data within 30 days of request"
        - "Privacy by design: Minimize NHS number collection"

      compliance_checklist:
