# Regex Pattern Registry Contract
# Source ADR: 0035a-regex-pattern-library.md
# Epic 2.9, Issue 2.9.1
# Purpose: Define 12 precompiled regex patterns for structured PII detection

contract:
  name: regex_pattern_registry
  version: "1.0.0"
  source_adr: "0035a-regex-pattern-library.md"
  epic: "2.9"
  issue: "2.9.1"

patterns:
  ssn:
    name: "Social Security Number"
    regex: '\b\d{3}-\d{2}-\d{4}\b'
    placeholder: "[SSN]"
    pii_type: "SSN"
    confidence: 0.95
    requires_validation: true
    validator: "ssn_validator"
    description: "US Social Security Number (XXX-XX-XXXX format)"
    examples:
      - "123-45-6789"
      - "987-65-4321"

  email:
    name: "Email Address"
    regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    placeholder: "[EMAIL]"
    pii_type: "EMAIL"
    confidence: 0.98
    requires_validation: true
    validator: "email_validator"
    description: "Email address (RFC 5322 compliant)"
    examples:
      - "user@example.com"
      - "john.doe+tag@company.co.uk"

  phone_us:
    name: "US Phone Number"
    regex: '\b(\+1[-.\s]?)?(\(?\d{3}\)?[-.\s]?)?\d{3}[-.\s]?\d{4}\b'
    placeholder: "[PHONE]"
    pii_type: "PHONE"
    confidence: 0.92
    requires_validation: true
    validator: "phone_validator"
    description: "US phone number (various formats)"
    examples:
      - "+1-555-123-4567"
      - "(555) 123-4567"
      - "555-123-4567"

  credit_card:
    name: "Credit Card Number"
    regex: '\b(?:\d{4}[-\s]?){3}\d{4}\b'
    placeholder: "[CREDIT_CARD]"
    pii_type: "CREDIT_CARD"
    confidence: 0.90
    requires_validation: true
    validator: "luhn_validator"
    description: "Credit card number (Visa, MasterCard, Amex, Discover)"
    examples:
      - "4532-1234-5678-9010"
      - "5425 2334 3010 9903"
      - "378282246310005"

  street_address:
    name: "Street Address"
    regex: '\b\d+\s+[A-Za-z0-9\s,]+\s+(Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Circle|Cir)\b'
    placeholder: "[ADDRESS]"
    pii_type: "ADDRESS"
    confidence: 0.85
    requires_validation: false
    description: "US street address with number and street type"
    examples:
      - "123 Main Street"
      - "456 Oak Avenue"
      - "789 Elm Rd"

  ipv4_address:
    name: "IPv4 Address"
    regex: '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'
    placeholder: "[IP_ADDRESS]"
    pii_type: "IP_ADDRESS"
    confidence: 0.99
    requires_validation: false
    description: "IPv4 address"
    examples:
      - "192.168.1.1"
      - "10.0.0.1"
      - "172.16.254.1"

  drivers_license:
    name: "US Driver's License"
    regex: '\b[A-Z]{1,2}\d{5,8}\b'
    placeholder: "[DRIVERS_LICENSE]"
    pii_type: "DRIVERS_LICENSE"
    confidence: 0.75
    requires_validation: false
    description: "US driver's license (varies by state, common patterns)"
    examples:
      - "CA12345678"
      - "NY1234567"
      - "TX12345678"

  passport:
    name: "US Passport Number"
    regex: '\b[A-Z]{1,2}\d{6,9}\b'
    placeholder: "[PASSPORT]"
    pii_type: "PASSPORT"
    confidence: 0.80
    requires_validation: false
    description: "US passport number"
    examples:
      - "A12345678"
      - "AB1234567"

  iban:
    name: "IBAN (International Bank Account Number)"
    regex: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
    placeholder: "[IBAN]"
    pii_type: "IBAN"
    confidence: 0.95
    requires_validation: true
    validator: "iban_validator"
    description: "International Bank Account Number (European standard)"
    examples:
      - "GB82WEST12345698765432"
      - "DE89370400440532013000"

  mac_address:
    name: "MAC Address"
    regex: '\b([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})\b'
    placeholder: "[MAC_ADDRESS]"
    pii_type: "MAC_ADDRESS"
    confidence: 0.98
    requires_validation: false
    description: "Network MAC address"
    examples:
      - "00:1A:2B:3C:4D:5E"
      - "00-1A-2B-3C-4D-5E"

  health_insurance:
    name: "Health Insurance Number"
    regex: '\b[A-Z]{3}\d{9}\b'
    placeholder: "[HEALTH_INSURANCE]"
    pii_type: "HEALTH_INSURANCE"
    confidence: 0.85
    requires_validation: false
    description: "US health insurance number (common format)"
    examples:
      - "ABC123456789"

  tax_id:
    name: "US Tax ID (EIN)"
    regex: '\b\d{2}-\d{7}\b'
    placeholder: "[TAX_ID]"
    pii_type: "TAX_ID"
    confidence: 0.92
    requires_validation: false
    description: "US Employer Identification Number (EIN)"
    examples:
      - "12-3456789"
      - "98-7654321"

implementation:
  language: "Rust"
  precompilation: "lazy_static or once_cell"
  initialization: "startup"
  hot_reload: true

performance_targets:
  latency_per_pattern: "<1ms"
  total_detection_overhead: "<5ms"
  precompilation_time: "<50ms"

accuracy_targets:
  recall: "85%"  # 10,200/12,000 structured PII detections
  precision: "100%"  # 0 false positives with validation
  false_positive_rate: "0%"

observability:
  metrics:
    - name: "pii_regex_detections_total"
      type: "counter"
      labels: ["pii_type", "validated"]
    - name: "pii_regex_latency_ms"
      type: "histogram"
      labels: ["pii_type"]
    - name: "pii_regex_validation_failures_total"
      type: "counter"
      labels: ["pii_type", "reason"]

testing:
  unit_tests:
    - test_ssn_pattern_matches
    - test_email_pattern_matches
    - test_credit_card_pattern_matches
    - test_phone_pattern_matches
    - test_address_pattern_matches
    - test_all_patterns_no_false_positives

  integration_tests:
    - test_batch_processing_single_pass
    - test_hot_reload_pattern_update
    - test_precompilation_at_startup
