  # Notes - EXPANDED IMPLEMENTATION GUIDANCE
  notes: |
    ================================================================================================
    IMPLEMENTATION NOTES & BEST PRACTICES
    ================================================================================================

    PRECOMPILATION STRATEGY:
    - Compile all 12 regex patterns at startup (not runtime)
    - Use lazy_static (Rust) or once_cell for thread-safe, zero-cost initialization
    - Pattern lookup via HashMap: O(1) average time complexity
    - Store in static memory: Shared across all requests (no per-request recompilation)
    - Memory cost: ~8KB for 12 precompiled patterns (negligible)

    VALIDATION FUNCTIONS:
    - Each pattern has optional validator function for post-match validation
    - Validators reduce false positives to 0% (100% precision with validation)
    - Luhn algorithm for credit cards: Essential (catches typos, wrong card numbers)
    - SSN validation: Range checks (001-899 area code, 01-99 group, 0001-9999 serial)
    - Email validation: RFC 5322 compliance check
    - IBAN validation: Mod97 checksum algorithm (ISO 13616)
    - Tax ID validation: Format check (02-7 digits, area 01-92, serial 1-9999999)

    CONFIDENCE SCORING:
    - Base confidence per pattern (0.70-0.95 range)
    - Adjusted after validation (increase if validation passes)
    - Configurable threshold (default: 0.70, can be tuned per deployment)
    - Higher threshold = Lower false positives, Higher false negatives
    - Trade-off: Precision vs Recall based on operational requirements

    YAML CONFIGURATION:
    - Pattern registry stored in YAML (pii_patterns.yml)
    - Hot-reload support: Update patterns without code changes
    - Version control: Track pattern changes in Git
    - Rollback: Previous versions available in Git history
    - Validation: Schema validation on load (fail fast if invalid)

    PERFORMANCE OPTIMIZATION:
    - Early exit: Stop searching once high-confidence match found
    - Batch processing: Scan text once for all patterns (not 12 separate scans)
    - Regex optimization: Use non-capturing groups, limit backtracking
    - SIMD acceleration: For simple byte-matching patterns (platform-specific)
    - Parallel processing: Multi-threaded pattern matching for large documents
    - Cache results: LRU cache for common text patterns

    INTERNATIONAL SUPPORT:
    - Phase 1 (Current): US-centric patterns (SSN, US address, US phone)
    - Phase 2 (Upcoming): International patterns (UK NHS, Canada SIN, EU VAT)
    - Country codes: Extend IBAN, PASSPORT, DRIVER_LICENSE with country variants
    - Unicode support: Handle non-ASCII characters (Phase 2)
    - Localization: Translate placeholder text per locale

    TESTING STRATEGY:
    - Unit tests: 240+ test vectors (20 per pattern)
    - Integration tests: Full pipeline with BERT-NER fallback
    - Performance tests: Latency benchmarks, throughput targets
    - Security tests: ReDoS resistance, information disclosure
    - Canary deployment: 5% traffic for 24 hours before full rollout

    MONITORING & OBSERVABILITY:
    - Prometheus metrics: Detection counts, latency, cache hit rate, false positives
    - OpenTelemetry traces: Span per pattern, latency breakdown
    - Structured logging: JSON logs with trace_id, pattern_name, confidence
    - Alerts: Latency >2ms, false positive rate >1%, memory >500MB
    - Dashboards: Pattern distribution, detection trends, SLA compliance

    COMPLIANCE INTEGRATION:
    - GDPR: Regex is data minimization control (no plaintext PII stored)
    - HIPAA: PHI detection required for compliance audit
    - PCI DSS: Credit card detection mandatory (prevents plaintext storage)
    - SOX: Audit trail of all detections (compliance reporting)
    - CCPA: User right to access implemented (audit log accessible)

    COMMON PITFALLS (AVOID):
    1. Not precompiling regex patterns (causes runtime overhead)
    2. Insufficient validation (leads to false positives)
    3. Too-broad patterns (matches non-PII text like version numbers)
    4. Ignoring performance budget (latency creep over time)
    5. Skipping edge cases in testing (bugs in production)
    6. Not monitoring false positive rate (compliance drift)
    7. Hardcoding patterns (can't update without code changes)
    8. Ignoring international formats (only works in US)
    9. Not handling timeouts (ReDoS attacks cause service slowdown)
    10. Insufficient logging (hard to debug in production)

    RECOMMENDED DEPLOYMENT SIZE:
    - Minimum: 1 instance (single-core, 256MB memory)
    - Typical: 4 instances (quad-core, 1GB memory each)
    - High-volume: 16+ instances (parallel processing)
    - Throughput: 1000+ detections/second per instance
    - Total: Can process 12,000+ PII detections/day at scale

    NEXT STEPS:
    1. Implement pattern registry (YAML parsing, precompilation)
    2. Add validation functions (Luhn, format checks)
    3. Integrate with SessionState (redaction storage)
    4. Add to K0 audit trail (compliance logging)
    5. Test with BERT-NER fallback (hybrid detection)
    6. Performance benchmark against SLAs
    7. Deploy canary (5% traffic, 24 hours monitoring)
    8. Full production rollout
    9. Monitor metrics, adjust thresholds as needed
    10. Plan Phase 2 international support
