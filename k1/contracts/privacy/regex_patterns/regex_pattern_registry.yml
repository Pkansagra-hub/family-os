    # Integration tests
    integration_tests:
      test_full_detection_pipeline:
        description: "Test full detection pipeline with all 12 patterns"
        test_input: "Large real-world text with mixed PII types"
        assertions:
          - "SSN detected correctly"
          - "Email detected without false positives"
          - "Phone number in correct format detected"
          - "Credit card with Luhn validation"
          - "Multiple PII types in single message"

      test_deduplication:
        description: "Test deduplication of overlapping matches"
        scenario: "Two patterns match same text (e.g., phone number in address)"
        expected_behavior: "Keep highest confidence match, discard duplicate"

      test_performance_under_load:
        description: "Test performance with high PII volume"
        load_scenario: "1000+ PII values per request"
        throughput_target: "1000 detections/second"
        latency_target: "<2ms per detection"

      test_integration_with_redactor:
        description: "Test integration with redaction module"
        flow: "Pattern detection → Validation → Placeholder replacement → Logging"
        assertions:
          - "Plaintext PII removed from output"
          - "Placeholder inserted correctly"
          - "Original PII stored in vault"
          - "Audit log entry created"

      test_integration_with_bert_ner:
        description: "Test fallback to BERT-NER for missed PII"
        scenario: "Unstructured names/addresses"
        expected: "Regex misses 15%, BERT-NER detects (combined 95%)"

    # Performance tests
    performance_tests:
      latency_benchmark:
        benchmark_name: "Regex Pattern Detection Latency"
        test_input: "10KB typical request"
        pii_count: "5 PII values per request"
        target_latency_ms: 2.0
        measurement: "P95 latency across 1000 requests"

      throughput_test:
        benchmark_name: "Detection Throughput"
        test_input: "100KB document"
        pii_count: "50 PII values"
        target_throughput: "1000 detections/second"
        measurement: "Detections per second"

      memory_profile:
        benchmark_name: "Memory Usage"
        baseline_memory_mb: 0.01
        peak_memory_mb: 0.1
        leak_detection: true

      cache_efficiency:
        benchmark_name: "LRU Cache Hit Rate"
        cache_size_entries: 1000
        target_hit_rate_percent: 75
        measurement: "Hit rate across realistic workload"

    # Security tests
    security_tests:
      test_redos_resistance:
        description: "Test resistance to ReDoS (Regular Expression Denial of Service)"
        attack_vector: "Malicious input with catastrophic backtracking"
        mitigation: "Timeout <100ms per pattern"
        assertions:
