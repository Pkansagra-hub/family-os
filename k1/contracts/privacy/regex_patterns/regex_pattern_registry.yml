    # Operational metrics
    operational_metrics:
      false_positive_rate_per_1m_chars: 0.2  # 0.2 false positives per 1M characters
      false_negative_rate_per_1m_chars: 150000  # 150K missed per 1M (from unstructured)"
      pattern_match_time_p95_ms: 1.0
      pattern_match_time_p99_ms: 2.0
