  # Error Handling & Resilience - EXPANDED
  error_handling:
    invalid_regex_pattern:
      action: "Log ERROR, skip pattern, emit Prometheus metric"
      recovery: "Continue with remaining patterns"
      alerting: "Trigger PagerDuty alert if >10% pattern errors"
      fallback: "Use cached version from previous startup"

    validation_failure:
      action: "Skip detection, log reason, record in metrics"
      examples:
        - "SSN: 000-12-3456 matches regex but fails range check (skip)"
        - "Email: missing_at@domain matches regex but fails RFC5322 (skip)"
        - "Phone: random string matches but fails E.164 (skip)"
      recovery: "BERT-NER will attempt detection on remaining unstructured"

    performance_degradation:
      action: "Log WARNING if overhead >1ms per pattern"
      threshold: "2ms total across all patterns"
      recovery: "Fallback to subset of high-confidence patterns"
      alert: "Trigger monitoring alert for investigation"

    regex_timeout:
      timeout_ms: 100
      action: "Abort pattern match, log timeout, continue next pattern"
      recovery: "Disable problematic pattern for request"
      fallback: "BERT-NER completes detection"
      catastrophic_backtracking: "Use pattern timeout to prevent ReDoS attacks"

    memory_exhaustion:
      action: "Clear LRU cache, log warning"
      recovery: "Continue pattern matching without caching"
      alert: "Page on-call if memory >500MB"

    false_positive_escalation:
      threshold: ">1% false positive rate"
      action: "Increase confidence threshold temporarily"
      recovery: "Revert threshold after root cause fix"
      example: "If address detection is 5% false positive, raise from 0.75→0.85 confidence"

    cascading_failure:
      scenario: "Pattern library corrupted on hot-reload"
      action: "Revert to last known-good version"
      recovery: "Emit alert, manual intervention required"
      prevention: "Version control + smoke tests on reload"

  # Testing Requirements - EXPANDED STRATEGY
  testing:
    # Unit tests
    unit_tests:
      test_each_pattern:
        description: "Test each pattern with valid/invalid examples"
        coverage: 100
        examples_per_pattern: 20
        total_test_vectors: 240  # 12 patterns × 20 examples
        assertions_per_test: 3  # Match, confidence, placeholder

      test_regex_compilation:
        description: "Test regex compilation and caching"
        coverage: 100
        test_cases:
          - "Compile all 12 patterns at startup"
          - "Verify compiled regex cached (not recompiled)"
          - "Verify pattern lookup time <100ns"

      test_validation_functions:
        description: "Test validation functions (Luhn, format checks)"
