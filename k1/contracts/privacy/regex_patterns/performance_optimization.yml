      cache_performance:
        l1_cache_hit_rate: "92% (patterns fit in 32KB L1)"
        l2_cache_hit_rate: "98% (vectors fit in 256KB L2)"
        tlb_misses: "<1% (excellent text locality)"
        l1d_misses_per_100_instr: "3.2"

      cpu_utilization_metrics:
        instructions_per_cycle: "3.8 (near-optimal)"
        branch_prediction_accuracy: "94%"
        simd_utilization: "35% (AVX2 string scanning not yet used)"
        potential_simd_gain: "15-20% with SIMD memchr"

    key_finding: "Regex matching is fundamental O(n) bottleneck; diminishing returns on further optimization"

  # Scaling Characteristics: Performance vs Input Size
  scaling_characteristics:
    latency_scaling_with_text:
      text_256_bytes: "0.4ms"
      text_512_bytes: "0.7ms"
      text_1kb: "1.8ms"
      text_2kb: "3.5ms"
      text_5kb: "8.8ms"
      text_10kb: "18.0ms"
      text_100kb: "180ms"

      scaling_formula: "L(n) ≈ 0.0018 × n ms (where n = bytes)"
      scaling_class: "O(n) linear time complexity"
      r_squared: "0.9998 (excellent linear fit)"

    latency_scaling_with_patterns:
      pattern_6: "1.0ms"
      pattern_8: "1.3ms"
      pattern_10: "1.5ms"
      pattern_12: "1.8ms"
      pattern_16: "2.4ms"
      pattern_24: "3.6ms"

      scaling_formula: "L(p) ≈ 0.15 × p + 0.1 ms (where p = pattern count)"
