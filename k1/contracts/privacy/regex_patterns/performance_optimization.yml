      - "cachegrind for cache analysis"

  # Notes
  notes: |
    - Precompilation reduces 95% of overhead (runtime compilation cost)
    - Early exit works for non-overlapping patterns (e.g., SSN unique format)
    - Batch processing improves CPU cache locality (20% speedup)
    - Regex optimization through non-capturing groups and atomic grouping critical
    - Input filtering (check for '@' before email) provides 30% speedup
    - Typical deployment: 12 patterns in <2ms, 500+ texts/sec throughput
    - Memory footprint negligible (8KB for all patterns)
