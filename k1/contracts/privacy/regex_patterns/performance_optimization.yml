    throughput_text_length_1k: "833 texts/sec"
    throughput_text_length_10k: "83 texts/sec"
    throughput_text_length_100k: "8 texts/sec"

  # Bottleneck Analysis
  bottlenecks:
    primary_bottleneck: "Regex engine (50-70% of latency)"
    secondary_bottleneck: "Validation functions (15-30%)"
    tertiary_bottleneck: "Deduplication (5-10%)"
    io_blocking: "None (pure CPU)"

  # Memory Analysis: Stack vs Heap, Allocations per Detection
  memory_analysis:
    startup_memory_cost:
      precompiled_patterns: "12 × 2KB = 24 KB (Regex objects in lazy_static)"
      pattern_cache: "8 KB (DFA cache for common patterns)"
      validator_functions: "16 KB (function pointers, metadata)"
      total_static: "48 KB"
      impact: "Negligible for process (48KB << 1GB typical process)"

    per_detection_memory:
      stack_allocation: "256 bytes (Detection struct on stack)"
      capture_groups: "64 bytes × 3 (3 capture groups per regex)"
      temporary_strings: "128 bytes (temporary string buffer)"
      total_per_detection: "512 bytes"

      example_calculations:
        "10_detections": "10 × 512 = 5.12 KB"
        "typical_doc_15_25": "8-13 KB temporary"
        "heavy_pii_100": "51 KB temporary"

    memory_optimization_techniques:
      pre_allocate_vectors: "Allocate detection Vec with capacity (avoid reallocations)"
      string_interning: "Reuse pattern names (26 bytes saved per detection)"
      zero_copy_slices: "Use &str instead of owned String (128 bytes saved per detection)"

      example_optimization: |
        // Stack-friendly: Use slices and pre-allocation
        let mut detections = Vec::with_capacity(20);
        for pattern in PATTERNS.iter() {
            if let Some(cap) = pattern.regex.captures(text) {
                detections.push(Detection {
                    pattern_type: &pattern.name,  // Reference, not clone
                    value: &text[cap.get(0).unwrap().range()],  // Slice, not String
                });
            }
        }

    memory_impact_analysis:
      optimization_impact: "256 bytes per detection with slicing"
      typical_doc_savings: "5-10% memory reduction"
      large_doc_savings: "25-40% memory reduction (100+ detections)"

