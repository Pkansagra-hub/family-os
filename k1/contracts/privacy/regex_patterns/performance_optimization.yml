# Performance Optimization Contract
# Source ADR: 0035a-regex-pattern-library.md
# Epic 2.9, Issue 2.9.1
# Purpose: Define performance optimizations for regex pattern matching (precompilation, early exit, batch processing)

contract:
  name: performance_optimization
  version: "1.0.0"
  source_adr: "0035a-regex-pattern-library.md"
  epic: "2.9"
  issue: "2.9.1"

optimization_strategies:
  precompilation:
    technique: "Precompile all regex patterns at startup"
    implementation: "lazy_static or once_cell in Rust"
    benefit: "Avoid runtime compilation overhead (10-50ms per pattern)"
    latency_savings: "50-500ms per detection (12 patterns × 10-50ms)"
    memory_cost: "~10KB per compiled pattern (120KB total for 12 patterns)"

    code_pattern: |
      use once_cell::sync::Lazy;
      use regex::Regex;

      static SSN_PATTERN: Lazy<Regex> = Lazy::new(|| {
          Regex::new(r"\b\d{3}-\d{2}-\d{4}\b").unwrap()
      });

      static EMAIL_PATTERN: Lazy<Regex> = Lazy::new(|| {
          Regex::new(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b").unwrap()
      });

  early_exit:
    technique: "Exit on first match per PII type"
    description: "Stop searching for SSN after finding first SSN match in text"
    benefit: "Reduce redundant regex evaluations"
    latency_savings: "Up to 50% for texts with multiple instances of same PII type"

    algorithm:
      - "For each PII type (SSN, EMAIL, etc.)"
      - "Search text with corresponding regex pattern"
      - "On first match: Record detection, skip remaining text for this type"
      - "Continue with next PII type"

    caveat: "If multiple PIIs of same type need detection, disable early exit"

  batch_processing:
    technique: "Single-pass processing for all patterns"
    description: "Apply all 12 regex patterns in one iteration over text"
    benefit: "Avoid multiple string traversals (12× reduction)"
    latency_savings: "5-10ms per detection (vs 12 separate passes)"

    algorithm:
      - "Initialize empty results list"
      - "For each character position in text:"
      - "  For each pattern in priority order:"
      - "    If pattern matches at current position:"
      - "      Record match, advance position"
      - "      Break (early exit for this position)"
      - "Return all detected PIIs"

  compiled_pattern_caching:
    technique: "Cache compiled patterns in Arc<RwLock<PatternRegistry>>"
    description: "Share compiled patterns across threads"
    benefit: "Zero pattern recompilation overhead per thread"
    memory_cost: "~120KB shared across all threads"
    thread_safety: "Read-only access to compiled patterns (Arc)"

  regex_engine_optimization:
    technique: "Use regex crate with optimized DFA engine"
    library: "regex = '1.10'"
    features:
      - "DFA-based matching (faster than backtracking for simple patterns)"
      - "SIMD acceleration (AVX2 on x86_64)"
      - "Unicode support with minimal overhead"
    performance: "10-100× faster than backtracking engines (PCRE)"

  text_chunking:
    technique: "Process large texts in chunks"
    chunk_size: "10KB per chunk"
    benefit: "Prevent stack overflow on very large texts (>1MB)"
    latency: "<1ms per 10KB chunk"
    parallelization: "Process chunks in parallel with rayon (future optimization)"

performance_targets:
  latency_per_pattern: "<1ms"
  total_detection_overhead: "<5ms for all 12 patterns"
  precompilation_time: "<50ms at startup"
  memory_footprint: "<200KB for all patterns"
  throughput: ">1000 detections/second per core"

implementation_details:
  pattern_registry:
    class: "PIIPatternRegistry"
    storage: "Arc<RwLock<HashMap<String, CompiledPattern>>>"
    initialization: "Lazy initialization at first use"

  compiled_pattern:
    struct: |
      struct CompiledPattern {
          pattern_id: String,
          regex: Regex,
          placeholder: String,
          pii_type: String,
          confidence: f64,
          requires_validation: bool,
          validator: Option<ValidatorFn>,
          priority: u32,
      }

  detection_pipeline:
    - step: "Load precompiled patterns from registry"
      latency: "<0.1ms"
    - step: "Sort patterns by priority (descending)"
      latency: "<0.1ms"
    - step: "Iterate over text once (single pass)"
      latency: "<5ms for 10KB text"
    - step: "For each position, try patterns in priority order"
      latency: "<1ms per pattern"
    - step: "On match, record detection and optionally validate"
      latency: "<0.2ms validation"
    - step: "Return all detections"
      latency: "<0.1ms"

benchmark_targets:
  small_text:
    size: "1KB"
    target_latency: "<2ms"
    patterns_matched: "12 patterns"

  medium_text:
    size: "10KB"
    target_latency: "<5ms"
    patterns_matched: "12 patterns"

  large_text:
    size: "100KB"
    target_latency: "<50ms"
    patterns_matched: "12 patterns"

optimization_tradeoffs:
  precompilation:
    pros: "50-500ms latency savings per detection"
    cons: "120KB memory overhead, 50ms startup cost"
    decision: "Use (startup cost amortized over thousands of detections)"

  early_exit:
    pros: "Up to 50% latency reduction for multi-instance texts"
    cons: "May miss multiple PIIs of same type (if needed)"
    decision: "Use (most use cases need one detection per type)"

  batch_processing:
    pros: "5-10ms latency savings vs 12 separate passes"
    cons: "More complex code (single-pass iteration)"
    decision: "Use (significant performance gain)"

observability:
  metrics:
    - name: "pii_regex_compilation_time_ms"
      type: "histogram"
      description: "Time to compile all patterns at startup"
    - name: "pii_regex_detection_latency_ms"
      type: "histogram"
      labels: ["text_size_kb"]
    - name: "pii_regex_patterns_evaluated_total"
      type: "counter"
      labels: ["pattern_id"]
    - name: "pii_regex_early_exits_total"
      type: "counter"
      labels: ["pii_type"]

testing:
  unit_tests:
    - test_precompilation_at_startup
    - test_early_exit_on_first_match
    - test_batch_processing_single_pass
    - test_pattern_caching_across_threads

  performance_tests:
    - test_detection_under_5ms_10kb_text
    - test_precompilation_under_50ms
    - test_throughput_1000_per_second
    - test_memory_footprint_under_200kb

  regression_tests:
    - test_no_performance_degradation_vs_baseline
    - test_latency_P95_under_10ms
    - test_latency_P99_under_20ms
