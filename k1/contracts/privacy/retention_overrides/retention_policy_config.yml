classes:
  - name: RetentionPolicyConfig
    description: Band-specific retention policies for SessionState data with warm/cold storage lifecycle
    research: ADR-0039 (retention overrides), privacy band lifecycle, GDPR compliance
    performance_budget: <1ms policy lookups, <10ms configuration updates, <100KB memory footprint
    reliability_properties:
      - band_specific_policies: Different retention periods for GREEN/AMBER/RED/BLACK bands
      - warm_cold_lifecycle: Automatic transition from warm to cold storage
      - gdpr_compliance: Data minimization with appropriate retention periods
      - configurable_policies: Runtime policy updates without restart
    methods:
      - name: get_retention_policy
        description: Get retention policy for a specific privacy band
        parameters:
          - name: band
            type: PrivacyBand
            description: Privacy band (GREEN, AMBER, RED, BLACK)
        returns:
          type: Result<RetentionPolicy, PolicyError>
          description: Retention policy for the band or error if invalid
        implementation:
          rust: |
            use std::collections::HashMap;
            use std::sync::Arc;
            use tokio::sync::RwLock;

            #[derive(Debug, Clone, PartialEq)]
            pub enum PrivacyBand {
                Green,
                Amber,
                Red,
                Black,
            }

            #[derive(Debug, Clone)]
            pub struct RetentionPolicy {
                pub warm_storage_days: u32,
                pub cold_storage_days: u32,
                pub total_retention_days: u32,
                pub hard_delete_grace_period_days: u32,
            }

            impl RetentionPolicy {
                pub fn new(warm_days: u32, cold_days: u32, grace_period_days: u32) -> Self {
                    Self {
                        warm_storage_days: warm_days,
                        cold_storage_days: cold_days,
                        total_retention_days: warm_days + cold_days,
                        hard_delete_grace_period_days: grace_period_days,
                    }
                }

                pub fn should_move_to_cold(&self, age_days: u32) -> bool {
                    age_days >= self.warm_storage_days
                }

                pub fn should_hard_delete(&self, age_days: u32) -> bool {
                    age_days >= self.total_retention_days + self.hard_delete_grace_period_days
                }

                pub fn is_in_grace_period(&self, age_days: u32) -> bool {
                    let hard_delete_threshold = self.total_retention_days + self.hard_delete_grace_period_days;
                    age_days >= self.total_retention_days && age_days < hard_delete_threshold
                }
            }

            pub struct RetentionPolicyConfig {
                policies: Arc<RwLock<HashMap<PrivacyBand, RetentionPolicy>>>,
            }

            impl RetentionPolicyConfig {
                pub fn new() -> Self {
                    let mut policies = HashMap::new();

                    // Default policies per ADR-0039
                    policies.insert(PrivacyBand::Green, RetentionPolicy::new(30, 365, 7));  // 30d warm, 365d cold, 7d grace
                    policies.insert(PrivacyBand::Amber, RetentionPolicy::new(30, 365, 7));  // Same as GREEN
                    policies.insert(PrivacyBand::Red, RetentionPolicy::new(7, 90, 7));     // 7d warm, 90d cold, 7d grace
                    policies.insert(PrivacyBand::Black, RetentionPolicy::new(7, 90, 7));   // Same as RED

                    Self {
                        policies: Arc::new(RwLock::new(policies)),
                    }
                }

                pub async fn get_retention_policy(&self, band: PrivacyBand) -> Result<RetentionPolicy, PolicyError> {
                    let policies = self.policies.read().await;
                    policies.get(&band)
                        .cloned()
                        .ok_or(PolicyError::UnknownBand(band))
                }

                pub async fn update_policy(&self, band: PrivacyBand, policy: RetentionPolicy) -> Result<(), PolicyError> {
                    // Validate policy
                    if policy.warm_storage_days == 0 || policy.total_retention_days == 0 {
                        return Err(PolicyError::InvalidPolicy("Retention periods must be > 0".to_string()));
                    }

                    if policy.warm_storage_days >= policy.total_retention_days {
                        return Err(PolicyError::InvalidPolicy("Warm storage period must be less than total retention".to_string()));
                    }

                    let mut policies = self.policies.write().await;
                    policies.insert(band, policy);

                    tracing::info!(
                        band = ?band,
                        warm_days = policy.warm_storage_days,
                        cold_days = policy.cold_storage_days,
                        "Updated retention policy"
                    );

                    Ok(())
                }

                pub async fn get_all_policies(&self) -> HashMap<PrivacyBand, RetentionPolicy> {
                    self.policies.read().await.clone()
                }

                pub async fn validate_policy_compliance(&self, band: PrivacyBand, age_days: u32) -> PolicyCompliance {
                    let policy = match self.get_retention_policy(band).await {
                        Ok(p) => p,
                        Err(_) => return PolicyCompliance::InvalidPolicy,
                    };

                    if age_days < policy.warm_storage_days {
                        PolicyCompliance::InWarmStorage
                    } else if age_days < policy.total_retention_days {
                        PolicyCompliance::InColdStorage
                    } else if age_days < policy.total_retention_days + policy.hard_delete_grace_period_days {
                        PolicyCompliance::InGracePeriod
                    } else {
                        PolicyCompliance::ShouldBeDeleted
                    }
                }
            }

            impl Default for RetentionPolicyConfig {
                fn default() -> Self {
                    Self::new()
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Dict, Optional, Any
            import asyncio
            import threading
            import logging
            from enum import Enum

            class PrivacyBand(Enum):
                GREEN = "green"
                AMBER = "amber"
                RED = "red"
                BLACK = "black"

            class PolicyCompliance(Enum):
                IN_WARM_STORAGE = "in_warm_storage"
                IN_COLD_STORAGE = "in_cold_storage"
                IN_GRACE_PERIOD = "in_grace_period"
                SHOULD_BE_DELETED = "should_be_deleted"
                INVALID_POLICY = "invalid_policy"

            @dataclass
            class RetentionPolicy:
                warm_storage_days: int
                cold_storage_days: int
                hard_delete_grace_period_days: int = 7

                @property
                def total_retention_days(self) -> int:
                    return self.warm_storage_days + self.cold_storage_days

                def should_move_to_cold(self, age_days: int) -> bool:
                    return age_days >= self.warm_storage_days

                def should_hard_delete(self, age_days: int) -> bool:
                    return age_days >= self.total_retention_days + self.hard_delete_grace_period_days

                def is_in_grace_period(self, age_days: int) -> bool:
                    total = self.total_retention_days
                    return total <= age_days < total + self.hard_delete_grace_period_days

            class RetentionPolicyConfig:
                """
                Configuration for privacy band-specific retention policies.

                Manages retention policies for SessionState data based on privacy bands,
                with automatic warm-to-cold storage transitions and GDPR compliance.
                """

                def __init__(self):
                    self.logger = logging.getLogger(__name__)
                    self._policies: Dict[PrivacyBand, RetentionPolicy] = {}
                    self._lock = threading.RLock()

                    # Initialize default policies per ADR-0039
                    self._initialize_default_policies()

                def _initialize_default_policies(self) -> None:
                    """Initialize default retention policies"""
                    # GREEN and AMBER: 30 days warm, 365 days cold = 395 days total
                    green_amber_policy = RetentionPolicy(
                        warm_storage_days=30,
                        cold_storage_days=365,
                        hard_delete_grace_period_days=7
                    )
                    self._policies[PrivacyBand.GREEN] = green_amber_policy
                    self._policies[PrivacyBand.AMBER] = green_amber_policy

                    # RED and BLACK: 7 days warm, 90 days cold = 97 days total
                    red_black_policy = RetentionPolicy(
                        warm_storage_days=7,
                        cold_storage_days=90,
                        hard_delete_grace_period_days=7
                    )
                    self._policies[PrivacyBand.RED] = red_black_policy
                    self._policies[PrivacyBand.BLACK] = red_black_policy

                async def get_retention_policy(self, band: PrivacyBand) -> RetentionPolicy:
                    """Get retention policy for a privacy band"""
                    with self._lock:
                        if band not in self._policies:
                            raise PolicyError(f"Unknown privacy band: {band}")
                        return self._policies[band]

                async def update_policy(self, band: PrivacyBand, policy: RetentionPolicy) -> None:
                    """Update retention policy for a band"""
                    # Validate policy
                    if policy.warm_storage_days <= 0 or policy.total_retention_days <= 0:
                        raise PolicyError("Retention periods must be positive")

                    if policy.warm_storage_days >= policy.total_retention_days:
                        raise PolicyError("Warm storage period must be less than total retention")

                    with self._lock:
                        old_policy = self._policies.get(band)
                        self._policies[band] = policy

                    self.logger.info(
                        f"Updated retention policy for {band.value}: "
                        f"warm={policy.warm_storage_days}d, "
                        f"cold={policy.cold_storage_days}d, "
                        f"total={policy.total_retention_days}d",
                        extra={
                            'band': band.value,
                            'old_warm': old_policy.warm_storage_days if old_policy else None,
                            'new_warm': policy.warm_storage_days,
                            'new_cold': policy.cold_storage_days,
                            'new_total': policy.total_retention_days
                        }
                    )

                async def get_all_policies(self) -> Dict[PrivacyBand, RetentionPolicy]:
                    """Get all retention policies"""
                    with self._lock:
                        return self._policies.copy()

                async def validate_policy_compliance(self, band: PrivacyBand, age_days: int) -> PolicyCompliance:
                    """Validate compliance status for data of given age"""
                    try:
                        policy = await self.get_retention_policy(band)
                    except PolicyError:
                        return PolicyCompliance.INVALID_POLICY

                    if age_days < policy.warm_storage_days:
                        return PolicyCompliance.IN_WARM_STORAGE
                    elif age_days < policy.total_retention_days:
                        return PolicyCompliance.IN_COLD_STORAGE
                    elif policy.is_in_grace_period(age_days):
                        return PolicyCompliance.IN_GRACE_PERIOD
                    else:
                        return PolicyCompliance.SHOULD_BE_DELETED

                def get_policy_summary(self) -> Dict[str, Any]:
                    """Get summary of all policies"""
                    summary = {}
                    for band, policy in self._policies.items():
                        summary[band.value] = {
                            'warm_storage_days': policy.warm_storage_days,
                            'cold_storage_days': policy.cold_storage_days,
                            'total_retention_days': policy.total_retention_days,
                            'grace_period_days': policy.hard_delete_grace_period_days
                        }
                    return summary

retention_policy_defaults:
  - band: GREEN
    warm_storage_days: 30
    cold_storage_days: 365
    total_retention_days: 395
    description: Standard retention for non-sensitive data
  - band: AMBER
    warm_storage_days: 30
    cold_storage_days: 365
    total_retention_days: 395
    description: Same as GREEN for moderate sensitivity
  - band: RED
    warm_storage_days: 7
    cold_storage_days: 90
    total_retention_days: 97
    description: Short retention for sensitive data (75% faster deletion)
  - band: BLACK
    warm_storage_days: 7
    cold_storage_days: 90
    total_retention_days: 97
    description: Same as RED for highest sensitivity

policy_validation_rules:
  - rule: positive_periods
    description: All retention periods must be positive integers
    validation: warm_storage_days > 0 AND cold_storage_days > 0
  - rule: warm_less_than_total
    description: Warm storage period must be less than total retention
    validation: warm_storage_days < total_retention_days
  - rule: reasonable_grace_period
    description: Grace period should be reasonable (1-30 days)
    validation: 1 <= grace_period_days <= 30
  - rule: band_exists
    description: Only valid privacy bands can have policies
    validation: band IN [GREEN, AMBER, RED, BLACK]

gdpr_compliance_mapping:
  - article: 5(1)(c)
    description: Data minimization - RED band satisfies "limited to necessary"
    implementation: 7-day warm storage meets necessity requirement
  - article: 5(1)(e)
    description: Storage limitation - automated lifecycle management
    implementation: Automatic deletion after retention periods
  - article: 17
    description: Right to erasure - user-triggered immediate deletion
    implementation: User control API overrides automated policies
