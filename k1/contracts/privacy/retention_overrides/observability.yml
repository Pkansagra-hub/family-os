classes:
  - name: DeletionObservability
    description: Comprehensive observability for retention and deletion operations
    research: Observability-driven development, GDPR audit requirements, performance monitoring
    performance_budget: <1ms metric recording, <5ms histogram updates, <10ms log serialization
    reliability_properties:
      - comprehensive_monitoring: Full visibility into retention and deletion operations
      - performance_tracking: Latency and throughput monitoring for all operations
      - compliance_auditing: Complete audit trail for regulatory requirements
      - alerting_capabilities: Proactive monitoring and alerting for issues
      - data_integrity: Verification of deletion and retention operations
    methods:
      - name: record_deletion
        description: Record metrics and logs for deletion operations
        parameters:
          - name: reason
            type: DeletionReason
            description: Reason for deletion
          - name: duration
            type: Duration
            description: Time taken for deletion operation
          - name: key_destroyed
            type: bool
            description: Whether encryption key was successfully destroyed
          - name: data_deleted
            type: bool
            description: Whether data was successfully deleted
        returns:
          type: ()
          description: Records metrics and logs the operation
        implementation:
          rust: |
            use prometheus::{CounterVec, HistogramVec, GaugeVec};
            use std::time::Duration;

            pub struct DeletionObservability {
                deletion_total: CounterVec,
                deletion_duration: HistogramVec,
                deletion_success: CounterVec,
                active_deletions: GaugeVec,
                key_destruction_failures: CounterVec,
                data_deletion_failures: CounterVec,
            }

            impl DeletionObservability {
                pub fn new(registry: &prometheus::Registry) -> Self {
                    let deletion_total = CounterVec::new(
                        prometheus::Opts::new(
                            "retention_policy_applied_total",
                            "Total number of retention policies applied"
                        ),
                        &["privacy_band", "reason"]
                    ).unwrap();

                    let deletion_duration = HistogramVec::new(
                        prometheus::HistogramOpts::new(
                            "deletion_latency_ms",
                            "Deletion operation latency in milliseconds"
                        ).buckets(vec![10.0, 50.0, 100.0, 250.0, 500.0, 1000.0, 2000.0]),
                        &["reason", "success"]
                    ).unwrap();

                    let deletion_success = CounterVec::new(
                        prometheus::Opts::new(
                            "sessions_hard_deleted_total",
                            "Total number of sessions hard deleted"
                        ),
                        &["privacy_band", "reason", "key_destroyed", "data_deleted"]
                    ).unwrap();

                    let active_deletions = GaugeVec::new(
                        prometheus::Opts::new(
                            "active_deletion_operations",
                            "Number of currently active deletion operations"
                        ),
                        &["privacy_band"]
                    ).unwrap();

                    let key_destruction_failures = CounterVec::new(
                        prometheus::Opts::new(
                            "key_destruction_failures_total",
                            "Total number of encryption key destruction failures"
                        ),
                        &["privacy_band", "reason"]
                    ).unwrap();

                    let data_deletion_failures = CounterVec::new(
                        prometheus::Opts::new(
                            "data_deletion_failures_total",
                            "Total number of data deletion failures"
                        ),
                        &["privacy_band", "reason"]
                    ).unwrap();

                    // Register metrics
                    registry.register(Box::new(deletion_total.clone())).unwrap();
                    registry.register(Box::new(deletion_duration.clone())).unwrap();
                    registry.register(Box::new(deletion_success.clone())).unwrap();
                    registry.register(Box::new(active_deletions.clone())).unwrap();
                    registry.register(Box::new(key_destruction_failures.clone())).unwrap();
                    registry.register(Box::new(data_deletion_failures.clone())).unwrap();

                    Self {
                        deletion_total,
                        deletion_duration,
                        deletion_success,
                        active_deletions,
                        key_destruction_failures,
                        data_deletion_failures,
                    }
                }

                pub fn record_deletion(
                    &self,
                    reason: &DeletionReason,
                    duration: Duration,
                    key_destroyed: bool,
                    data_deleted: bool,
                ) {
                    let reason_str = format!("{:?}", reason).to_lowercase();
                    let success = key_destroyed && data_deleted;

                    // Record counters
                    self.deletion_total.with_label_values(&["unknown", &reason_str]).inc();
                    self.deletion_success.with_label_values(&[
                        "unknown",
                        &reason_str,
                        &key_destroyed.to_string(),
                        &data_deleted.to_string()
                    ]).inc();

                    // Record duration
                    self.deletion_duration
                        .with_label_values(&[&reason_str, &success.to_string()])
                        .observe(duration.as_millis() as f64);

                    // Record failures
                    if !key_destroyed {
                        self.key_destruction_failures
                            .with_label_values(&["unknown", &reason_str])
                            .inc();
                    }
                    if !data_deleted {
                        self.data_deletion_failures
                            .with_label_values(&["unknown", &reason_str])
                            .inc();
                    }

                    // Update active operations (decrement)
                    self.active_deletions.with_label_values(&["unknown"]).dec();
                }

                pub fn start_deletion_operation(&self, privacy_band: &str) {
                    self.active_deletions.with_label_values(&[privacy_band]).inc();
                }

                pub fn record_retention_policy_applied(&self, privacy_band: &str, policy_type: &str) {
                    self.deletion_total
                        .with_label_values(&[privacy_band, policy_type])
                        .inc();
                }

                pub fn record_gdpr_deletion_request(&self, privacy_band: &str, article: &str) {
                    // GDPR-specific metrics
                    self.deletion_total
                        .with_label_values(&[privacy_band, &format!("gdpr_article_{}", article)])
                        .inc();
                }
            }
          python: |
            from prometheus_client import Counter, Histogram, Gauge
            from typing import Dict, Any
            import time
            import logging

            class DeletionObservability:
                """
                Comprehensive observability for retention and deletion operations.

                Provides metrics, logging, and monitoring for all retention-related operations
                to ensure compliance, performance, and reliability.
                """

                def __init__(self):
                    self.logger = logging.getLogger(__name__)

                    # Prometheus metrics
                    self.retention_policy_applied_total = Counter(
                        'retention_policy_applied_total',
                        'Total number of retention policies applied',
                        ['privacy_band', 'reason']
                    )

                    self.deletion_latency_ms = Histogram(
                        'deletion_latency_ms',
                        'Deletion operation latency in milliseconds',
                        ['reason', 'success'],
                        buckets=[10, 50, 100, 250, 500, 1000, 2000]
                    )

                    self.sessions_hard_deleted_total = Counter(
                        'sessions_hard_deleted_total',
                        'Total number of sessions hard deleted',
                        ['privacy_band', 'reason', 'key_destroyed', 'data_deleted']
                    )

                    self.active_deletion_operations = Gauge(
                        'active_deletion_operations',
                        'Number of currently active deletion operations',
                        ['privacy_band']
                    )

                    self.key_destruction_failures_total = Counter(
                        'key_destruction_failures_total',
                        'Total number of encryption key destruction failures',
                        ['privacy_band', 'reason']
                    )

                    self.data_deletion_failures_total = Counter(
                        'data_deletion_failures_total',
                        'Total number of data deletion failures',
                        ['privacy_band', 'reason']
                    )

                    self.gdpr_deletion_requests_total = Counter(
                        'gdpr_deletion_requests_total',
                        'Total number of GDPR deletion requests',
                        ['privacy_band', 'gdpr_article']
                    )

                def record_deletion(
                    self,
                    reason: str,
                    duration: float,
                    key_destroyed: bool,
                    data_deleted: bool,
                    privacy_band: str = "unknown"
                ) -> None:
                    """Record metrics for a deletion operation"""

                    success = key_destroyed and data_deleted

                    # Record counters
                    self.retention_policy_applied_total.labels(
                        privacy_band=privacy_band,
                        reason=reason
                    ).inc()

                    self.sessions_hard_deleted_total.labels(
                        privacy_band=privacy_band,
                        reason=reason,
                        key_destroyed=str(key_destroyed).lower(),
                        data_deleted=str(data_deleted).lower()
                    ).inc()

                    # Record duration
                    self.deletion_latency_ms.labels(
                        reason=reason,
                        success=str(success).lower()
                    ).observe(duration)

                    # Record failures
                    if not key_destroyed:
                        self.key_destruction_failures_total.labels(
                            privacy_band=privacy_band,
                            reason=reason
                        ).inc()

                    if not data_deleted:
                        self.data_deletion_failures_total.labels(
                            privacy_band=privacy_band,
                            reason=reason
                        ).inc()

                    # Update active operations
                    self.active_deletions_complete(privacy_band)

                    # Log structured event
                    self.logger.info(
                        "Deletion operation completed",
                        extra={
                            'privacy_band': privacy_band,
                            'reason': reason,
                            'duration_ms': duration,
                            'key_destroyed': key_destroyed,
                            'data_deleted': data_deleted,
                            'success': success
                        }
                    )

                def start_deletion_operation(self, privacy_band: str) -> None:
                    """Mark the start of a deletion operation"""
                    self.active_deletion_operations.labels(privacy_band=privacy_band).inc()

                def active_deletions_complete(self, privacy_band: str) -> None:
                    """Mark completion of a deletion operation"""
                    self.active_deletion_operations.labels(privacy_band=privacy_band).dec()

                def record_gdpr_deletion_request(
                    self,
                    privacy_band: str,
                    gdpr_article: str
                ) -> None:
                    """Record GDPR-specific deletion requests"""
                    self.gdpr_deletion_requests_total.labels(
                        privacy_band=privacy_band,
                        gdpr_article=gdpr_article
                    ).inc()

                    self.logger.info(
                        "GDPR deletion request recorded",
                        extra={
                            'privacy_band': privacy_band,
                            'gdpr_article': gdpr_article
                        }
                    )

prometheus_metrics:
  - name: retention_policy_applied_total
    type: Counter
    description: Total number of retention policies applied
    labels: [privacy_band, reason]
    example: retention_policy_applied_total{privacy_band="GREEN", reason="lifecycle_expired"} 150

  - name: sessions_hard_deleted_total
    type: Counter
    description: Total number of sessions hard deleted
    labels: [privacy_band, reason, key_destroyed, data_deleted]
    example: sessions_hard_deleted_total{privacy_band="RED", reason="user_request", key_destroyed="true", data_deleted="true"} 25

  - name: deletion_latency_ms
    type: Histogram
    description: Deletion operation latency in milliseconds
    labels: [reason, success]
    buckets: [10, 50, 100, 250, 500, 1000, 2000]
    example: deletion_latency_ms_bucket{reason="user_request", success="true", le="100"} 95

  - name: active_deletion_operations
    type: Gauge
    description: Number of currently active deletion operations
    labels: [privacy_band]
    example: active_deletion_operations{privacy_band="AMBER"} 3

  - name: gdpr_deletion_requests_total
    type: Counter
    description: Total number of GDPR deletion requests
    labels: [privacy_band, gdpr_article]
    example: gdpr_deletion_requests_total{privacy_band="BLACK", gdpr_article="17"} 12

structured_logging:
  - event: deletion_started
    level: INFO
    fields: [session_id, privacy_band, reason, trace_id]
    message: "Hard deletion started for session {session_id}"

  - event: deletion_completed
    level: INFO
    fields: [session_id, privacy_band, reason, duration_ms, key_destroyed, data_deleted, success, trace_id]
    message: "Hard deletion completed for session {session_id} in {duration_ms}ms"

  - event: deletion_failed
    level: ERROR
    fields: [session_id, privacy_band, reason, error, trace_id]
    message: "Hard deletion failed for session {session_id}: {error}"

  - event: key_destruction_failed
    level: WARNING
    fields: [session_id, privacy_band, key_id, error, trace_id]
    message: "Encryption key destruction failed for session {session_id}"

  - event: compliance_check_failed
    level: WARNING
    fields: [session_id, privacy_band, blocking_reasons, trace_id]
    message: "Compliance check failed for session {session_id}"

  - event: retention_policy_applied
    level: DEBUG
    fields: [session_id, privacy_band, policy_type, retention_days, trace_id]
    message: "Retention policy applied to session {session_id}"

alerting_rules:
  - name: HighDeletionLatency
    condition: rate(deletion_latency_ms{quantile="0.95"}[5m]) > 1000
    severity: warning
    description: "95th percentile deletion latency > 1000ms"
    runbook: "Check database performance, encryption key service, and K0 storage"

  - name: DeletionFailures
    condition: rate(data_deletion_failures_total[5m]) > 0
    severity: error
    description: "Data deletion operations are failing"
    runbook: "Check K0 storage connectivity, permissions, and database health"

  - name: KeyDestructionFailures
    condition: rate(key_destruction_failures_total[5m]) > 0
    severity: warning
    description: "Encryption key destruction is failing"
    runbook: "Check encryption service health, key permissions, and keystore connectivity"

  - name: ExcessiveActiveDeletions
    condition: active_deletion_operations > 10
    severity: warning
    description: "Too many concurrent deletion operations"
    runbook: "Check for deletion backlog, consider scaling deletion workers"

  - name: GDPRComplianceViolation
    condition: rate(gdpr_deletion_requests_total[1h]) == 0 AND rate(sessions_hard_deleted_total{reason="user_request"}[1h]) > 0
    severity: error
    description: "Deletions occurring without GDPR request tracking"
    runbook: "Verify GDPR compliance monitoring is functioning correctly"

dashboard_panels:
  - title: "Deletion Operations Overview"
    metrics:
      - retention_policy_applied_total
      - sessions_hard_deleted_total
      - active_deletion_operations
    layout: time_series

  - title: "Deletion Performance"
    metrics:
      - deletion_latency_ms{quantile="0.5"}
      - deletion_latency_ms{quantile="0.95"}
      - deletion_latency_ms{quantile="0.99"}
    layout: time_series

  - title: "Deletion Success Rate"
    metrics:
      - "rate(sessions_hard_deleted_total{data_deleted='true'}[5m]) / rate(sessions_hard_deleted_total[5m])"
    layout: gauge

  - title: "GDPR Compliance"
    metrics:
      - gdpr_deletion_requests_total
      - "rate(sessions_hard_deleted_total{reason='user_request'}[1h])"
    layout: table

audit_trail_monitoring:
  - check: audit_log_completeness
    description: Verify all deletion operations have corresponding audit logs
    query: "count(deletion_audit_logs) / count(deletion_operations)"
    threshold: 1.0
    alert: "Missing audit logs detected"

  - check: retention_compliance
    description: Verify deleted sessions are not retained beyond policy
    query: "count(sessions_beyond_retention_deadline)"
    threshold: 0
    alert: "Sessions retained beyond retention deadline"

  - check: gdpr_right_to_erasure
    description: Verify user deletion requests are processed within 30 days
    query: "histogram_quantile(0.95, rate(deletion_request_to_completion_duration[30d]))"
    threshold: 2592000000  # 30 days in milliseconds
    alert: "GDPR right to erasure SLA violation"
