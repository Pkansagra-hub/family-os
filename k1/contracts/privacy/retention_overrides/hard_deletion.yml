classes:
  - name: HardDeletionProcess
    description: Secure hard deletion of SessionState data with encryption key destruction and audit compliance
    research: ADR-0039 (retention overrides), secure deletion, GDPR right to erasure
    performance_budget: <2s per session deletion, <100ms encryption key destruction, <500ms total audit logging
    reliability_properties:
      - cryptographic_key_destruction: Encryption keys destroyed before data deletion
      - audit_trail_preservation: Audit logs retained even after data deletion
      - secure_deletion: Data unrecoverable after hard deletion
      - compliance_verification: GDPR/HIPAA compliance checks before deletion
    methods:
      - name: hard_delete_session
        description: Perform complete hard deletion of a session with all associated data
        parameters:
          - name: session_id
            type: String
            description: Session ID to delete
          - name: deletion_reason
            type: DeletionReason
            description: Reason for deletion (lifecycle, user_request, legal)
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<DeletionResult, DeletionError>
          description: Result of deletion operation or error
        implementation:
          rust: |
            use std::sync::Arc;

            pub struct HardDeletionProcess {
                session_store: Arc<dyn SessionStore>,
                encryption_manager: Arc<dyn EncryptionManager>,
                audit_logger: Arc<dyn AuditLogger>,
                compliance_checker: Arc<dyn ComplianceChecker>,
                metrics: Arc<DeletionObservability>,
            }

            impl HardDeletionProcess {
                pub fn new(
                    session_store: Arc<dyn SessionStore>,
                    encryption_manager: Arc<dyn EncryptionManager>,
                    audit_logger: Arc<dyn AuditLogger>,
                    compliance_checker: Arc<dyn ComplianceChecker>,
                    metrics: Arc<DeletionObservability>,
                ) -> Self {
                    Self {
                        session_store,
                        encryption_manager,
                        audit_logger,
                        compliance_checker,
                        metrics,
                    }
                }

                pub async fn hard_delete_session(
                    &self,
                    session_id: &str,
                    deletion_reason: DeletionReason,
                    trace_id: &str,
                ) -> Result<DeletionResult, DeletionError> {
                    let start_time = std::time::Instant::now();

                    // Pre-deletion compliance check
                    self.compliance_checker.verify_deletion_allowed(session_id, &deletion_reason).await?;

                    // Get session metadata before deletion
                    let session_metadata = self.session_store.get_session_metadata(session_id).await?
                        .ok_or(DeletionError::SessionNotFound)?;

                    // Step 1: Destroy encryption keys (ADR-0036 compliance)
                    let key_destruction_result = if let Some(key_id) = &session_metadata.encryption_key_id {
                        self.encryption_manager.destroy_key(key_id).await
                    } else {
                        Ok(())
                    };

                    // Log key destruction result
                    match key_destruction_result {
                        Ok(()) => {
                            self.audit_logger.log_key_destruction(session_id, trace_id).await?;
                        }
                        Err(e) => {
                            // Log error but continue - key might already be destroyed
                            tracing::warn!(
                                session_id = %session_id,
                                error = %e,
                                "Failed to destroy encryption key, continuing with deletion"
                            );
                            self.audit_logger.log_key_destruction_error(session_id, &e, trace_id).await?;
                        }
                    }

                    // Step 2: Hard delete session data from K0
                    let data_deletion_result = self.session_store.hard_delete_session(session_id).await;

                    // Step 3: Clean up related data (but preserve audit logs)
                    let cleanup_result = self.cleanup_related_data(session_id, trace_id).await;

                    // Step 4: Log comprehensive deletion audit
                    let deletion_audit = DeletionAudit {
                        session_id: session_id.to_string(),
                        deletion_reason,
                        timestamp: std::time::SystemTime::now(),
                        trace_id: trace_id.to_string(),
                        key_destroyed: key_destruction_result.is_ok(),
                        data_deleted: data_deletion_result.is_ok(),
                        related_data_cleaned: cleanup_result.is_ok(),
                        privacy_band: session_metadata.privacy_band,
                        session_age_days: session_metadata.age_days(),
                    };

                    self.audit_logger.log_session_deletion(&deletion_audit).await?;

                    let duration = start_time.elapsed();

                    // Record metrics
                    self.metrics.record_deletion(
                        deletion_reason,
                        duration,
                        key_destruction_result.is_ok(),
                        data_deletion_result.is_ok()
                    );

                    // Return result based on operations
                    match (key_destruction_result, data_deletion_result, cleanup_result) {
                        (Ok(_), Ok(_), Ok(_)) => {
                            tracing::info!(
                                session_id = %session_id,
                                reason = ?deletion_reason,
                                duration_ms = duration.as_millis(),
                                trace_id = %trace_id,
                                "Session hard deleted successfully"
                            );

                            Ok(DeletionResult {
                                session_id: session_id.to_string(),
                                success: true,
                                duration,
                                key_destroyed: true,
                                data_deleted: true,
                                related_data_cleaned: true,
                            })
                        }
                        _ => {
                            // Partial failure - log but still report success if data was deleted
                            let partial_success = data_deletion_result.is_ok();

                            tracing::warn!(
                                session_id = %session_id,
                                reason = ?deletion_reason,
                                key_destroyed = key_destruction_result.is_ok(),
                                data_deleted = data_deletion_result.is_ok(),
                                cleanup_success = cleanup_result.is_ok(),
                                duration_ms = duration.as_millis(),
                                trace_id = %trace_id,
                                "Session deletion completed with partial failures"
                            );

                            Ok(DeletionResult {
                                session_id: session_id.to_string(),
                                success: partial_success,
                                duration,
                                key_destroyed: key_destruction_result.is_ok(),
                                data_deleted: data_deletion_result.is_ok(),
                                related_data_cleaned: cleanup_result.is_ok(),
                            })
                        }
                    }
                }

                async fn cleanup_related_data(&self, session_id: &str, trace_id: &str) -> Result<(), DeletionError> {
                    // Clean up turn references
                    self.session_store.remove_turn_references(session_id).await?;

                    // Clean up agent references
                    self.session_store.remove_agent_references(session_id).await?;

                    // Clean up from search indexes (but preserve audit logs)
                    self.session_store.remove_from_search_indexes(session_id).await?;

                    // Note: Audit logs are NOT deleted - they are retained for compliance

                    tracing::debug!(
                        session_id = %session_id,
                        trace_id = %trace_id,
                        "Related data cleanup completed"
                    );

                    Ok(())
                }

                pub async fn verify_deletion_compliance(
                    &self,
                    session_id: &str,
                    deletion_reason: &DeletionReason,
                ) -> Result<ComplianceCheckResult, DeletionError> {
                    self.compliance_checker.verify_deletion_allowed(session_id, deletion_reason).await
                }

                pub async fn get_deletion_status(&self, session_id: &str) -> Result<DeletionStatus, DeletionError> {
                    // Check if session still exists
                    let exists = self.session_store.session_exists(session_id).await?;

                    if exists {
                        return Ok(DeletionStatus::NotDeleted);
                    }

                    // Check audit logs for deletion record
                    let deletion_record = self.audit_logger.get_deletion_record(session_id).await?;

                    match deletion_record {
                        Some(record) => Ok(DeletionStatus::Deleted(record)),
                        None => Ok(DeletionStatus::Unknown), // Deleted but no audit record (shouldn't happen)
                    }
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import Optional, Any, Dict
            import asyncio
            import time
            import logging

            class HardDeletionProcess:
                """
                Secure hard deletion process for SessionState data.

                Ensures complete data destruction with encryption key cleanup,
                audit trail preservation, and compliance verification.
                """

                def __init__(self, session_store: Any, encryption_manager: Any, audit_logger: Any, compliance_checker: Any, metrics: Any):
                    self.logger = logging.getLogger(__name__)
                    self.session_store = session_store
                    self.encryption_manager = encryption_manager
                    self.audit_logger = audit_logger
                    self.compliance_checker = compliance_checker
                    self.metrics = metrics

                async def hard_delete_session(
                    self,
                    session_id: str,
                    deletion_reason: str,
                    trace_id: str
                ) -> 'DeletionResult':
                    """Perform complete hard deletion of a session"""
                    start_time = time.time()

                    try:
                        # Pre-deletion compliance check
                        await self.compliance_checker.verify_deletion_allowed(session_id, deletion_reason)

                        # Get session metadata before deletion
                        session_metadata = await self.session_store.get_session_metadata(session_id)
                        if not session_metadata:
                            raise DeletionError(f"Session not found: {session_id}")

                        # Step 1: Destroy encryption keys (ADR-0036 compliance)
                        key_destroyed = False
                        encryption_key_id = session_metadata.get('encryption_key_id')

                        if encryption_key_id:
                            try:
                                await self.encryption_manager.destroy_key(encryption_key_id)
                                key_destroyed = True
                                await self.audit_logger.log_key_destruction(session_id, trace_id)
                            except Exception as e:
                                # Log error but continue
                                self.logger.warning(
                                    f"Failed to destroy encryption key for {session_id}: {e}",
                                    extra={'session_id': session_id, 'error': str(e)}
                                )
                                await self.audit_logger.log_key_destruction_error(session_id, str(e), trace_id)
                        else:
                            key_destroyed = True  # No key to destroy

                        # Step 2: Hard delete session data from K0
                        data_deleted = False
                        try:
                            await self.session_store.hard_delete_session(session_id)
                            data_deleted = True
                        except Exception as e:
                            self.logger.error(f"Failed to delete session data for {session_id}: {e}")
                            raise DeletionError(f"Data deletion failed: {e}")

                        # Step 3: Clean up related data
                        related_data_cleaned = False
                        try:
                            await self._cleanup_related_data(session_id, trace_id)
                            related_data_cleaned = True
                        except Exception as e:
                            self.logger.warning(f"Related data cleanup failed for {session_id}: {e}")

                        # Step 4: Log comprehensive deletion audit
                        deletion_audit = {
                            'session_id': session_id,
                            'deletion_reason': deletion_reason,
                            'timestamp': time.time(),
                            'trace_id': trace_id,
                            'key_destroyed': key_destroyed,
                            'data_deleted': data_deleted,
                            'related_data_cleaned': related_data_cleaned,
                            'privacy_band': session_metadata.get('privacy_band'),
                            'session_age_days': self._calculate_age_days(session_metadata.get('created_at', 0))
                        }

                        await self.audit_logger.log_session_deletion(deletion_audit)

                        duration = time.time() - start_time

                        # Record metrics
                        self.metrics.record_deletion(
                            deletion_reason,
                            duration,
                            key_destroyed,
                            data_deleted
                        )

                        success = data_deleted  # Consider successful if data was deleted

                        self.logger.info(
                            f"Session hard deleted: {session_id} (success={success})",
                            extra={
                                'session_id': session_id,
                                'deletion_reason': deletion_reason,
                                'duration': duration,
                                'key_destroyed': key_destroyed,
                                'data_deleted': data_deleted,
                                'related_data_cleaned': related_data_cleaned,
                                'trace_id': trace_id
                            }
                        )

                        return DeletionResult(
                            session_id=session_id,
                            success=success,
                            duration=duration,
                            key_destroyed=key_destroyed,
                            data_deleted=data_deleted,
                            related_data_cleaned=related_data_cleaned
                        )

                    except Exception as e:
                        duration = time.time() - start_time
                        self.logger.error(f"Hard deletion failed for {session_id}: {e}", exc_info=True)
                        raise DeletionError(f"Hard deletion failed: {e}")

                async def _cleanup_related_data(self, session_id: str, trace_id: str) -> None:
                    """Clean up related data while preserving audit logs"""
                    # Remove turn references
                    await self.session_store.remove_turn_references(session_id)

                    # Remove agent references
                    await self.session_store.remove_agent_references(session_id)

                    # Remove from search indexes
                    await self.session_store.remove_from_search_indexes(session_id)

                    # Note: Audit logs are explicitly NOT deleted

                    self.logger.debug(f"Related data cleanup completed for {session_id}")

                async def verify_deletion_compliance(self, session_id: str, deletion_reason: str) -> Dict[str, Any]:
                    """Verify deletion is compliant with regulations"""
                    return await self.compliance_checker.verify_deletion_allowed(session_id, deletion_reason)

                async def get_deletion_status(self, session_id: str) -> Dict[str, Any]:
                    """Get deletion status for a session"""
                    # Check if session still exists
                    exists = await self.session_store.session_exists(session_id)

                    if exists:
                        return {'status': 'not_deleted'}

                    # Check audit logs for deletion record
                    deletion_record = await self.audit_logger.get_deletion_record(session_id)

                    if deletion_record:
                        return {
                            'status': 'deleted',
                            'deletion_record': deletion_record
                        }
                    else:
                        return {'status': 'unknown'}  # Deleted but no audit record

                def _calculate_age_days(self, created_at: float) -> int:
                    """Calculate session age in days"""
                    if created_at <= 0:
                        return 0
                    age_seconds = time.time() - created_at
                    return int(age_seconds / (24 * 3600))

deletion_sequence:
  - step: compliance_check
    description: Verify deletion is allowed (no legal holds, within retention policy)
    required: true
    failure_action: abort_deletion
  - step: key_destruction
    description: Destroy encryption keys (ADR-0036 compliance)
    required: false
    failure_action: log_warning_continue
  - step: data_deletion
    description: Hard delete SessionState from K0
    required: true
    failure_action: abort_deletion
  - step: related_cleanup
    description: Clean up references and indexes
    required: false
    failure_action: log_warning_continue
  - step: audit_logging
    description: Log comprehensive deletion audit
    required: true
    failure_action: log_error_continue

data_destruction_methods:
  - method: cryptographic_key_destruction
    description: Destroy AES-256-GCM keys from keystore (OS Keychain/Hardware)
    compliance: ADR-0036 E2EE requirements
    irrecoverable: true
  - method: database_hard_delete
    description: Remove records from K0 without soft delete flag
    compliance: GDPR right to erasure
    irrecoverable: true
  - method: reference_cleanup
    description: Remove foreign key references and search indexes
    compliance: Data consistency maintenance
    irrecoverable: false

audit_trail_preservation:
  - preserved: session_deletion_audit
    description: Complete audit of deletion process and reasoning
    retention: 7 years (HIPAA compliance)
  - preserved: key_destruction_logs
    description: Logs of encryption key destruction
    retention: 7 years (HIPAA compliance)
  - preserved: compliance_verification_logs
    description: Records of pre-deletion compliance checks
    retention: 7 years (HIPAA compliance)
  - not_deleted: turn_audits
    description: Audit logs of individual turns (separate retention)
  - not_deleted: agent_audits
    description: Audit logs of agent operations (separate retention)

error_handling:
  - error: key_destruction_failure
    action: log warning, continue with data deletion
    reason: Key may already be destroyed or inaccessible
  - error: data_deletion_failure
    action: abort entire deletion process
    reason: Core data must be deleted for compliance
  - error: audit_logging_failure
    action: log error, but complete deletion
    reason: Deletion should succeed even if audit fails
  - error: compliance_check_failure
    action: abort deletion with detailed error
    reason: Cannot delete if compliance not verified
