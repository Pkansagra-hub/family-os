classes:
  - name: LifecycleManager
    description: Automated lifecycle management for SessionState data with warm/cold storage transitions and hard deletion
    research: ADR-0039 (retention overrides), data lifecycle management, automated cleanup
    performance_budget: <5s daily lifecycle checks, <10ms per session evaluation, <1GB memory for session tracking
    reliability_properties:
      - automated_transitions: Daily cron job automatically moves data between storage tiers
      - hard_deletion_safety: Grace periods and compliance checks before hard deletion
      - audit_trail_maintenance: All lifecycle operations logged for compliance
      - failure_resilience: Continues processing even if individual operations fail
    methods:
      - name: run_daily_lifecycle_check
        description: Execute daily lifecycle management for all sessions
        parameters:
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<LifecycleReport, LifecycleError>
          description: Report of lifecycle operations performed
        implementation:
          rust: |
            use std::sync::Arc;
            use tokio::sync::RwLock;
            use chrono::{DateTime, Utc};

            pub struct LifecycleManager {
                policy_config: Arc<RetentionPolicyConfig>,
                session_store: Arc<dyn SessionStore>,
                encryption_manager: Arc<dyn EncryptionManager>,
                metrics: Arc<LifecycleObservability>,
                batch_size: usize,
            }

            impl LifecycleManager {
                pub fn new(
                    policy_config: Arc<RetentionPolicyConfig>,
                    session_store: Arc<dyn SessionStore>,
                    encryption_manager: Arc<dyn EncryptionManager>,
                    metrics: Arc<LifecycleObservability>,
                    batch_size: usize,
                ) -> Self {
                    Self {
                        policy_config,
                        session_store,
                        encryption_manager,
                        metrics,
                        batch_size,
                    }
                }

                pub async fn run_daily_lifecycle_check(&self, trace_id: String) -> Result<LifecycleReport, LifecycleError> {
                    let start_time = std::time::Instant::now();
                    let mut report = LifecycleReport::new();

                    tracing::info!(
                        trace_id = %trace_id,
                        "Starting daily lifecycle check"
                    );

                    // Get all sessions that need evaluation
                    let sessions_to_check = self.session_store.get_sessions_requiring_lifecycle_check().await?;

                    // Process in batches to avoid memory issues
                    for batch in sessions_to_check.chunks(self.batch_size) {
                        let batch_result = self.process_batch(batch, &trace_id).await?;
                        report.merge(batch_result);
                    }

                    let duration = start_time.elapsed();

                    // Record metrics
                    self.metrics.record_lifecycle_check(
                        report.sessions_evaluated,
                        report.transitions_to_cold,
                        report.hard_deletions,
                        duration
                    );

                    tracing::info!(
                        trace_id = %trace_id,
                        sessions_evaluated = report.sessions_evaluated,
                        transitions_to_cold = report.transitions_to_cold,
                        hard_deletions = report.hard_deletions,
                        duration_ms = duration.as_millis(),
                        "Daily lifecycle check completed"
                    );

                    Ok(report)
                }

                async fn process_batch(&self, batch: &[SessionMetadata], trace_id: &str) -> Result<LifecycleReport, LifecycleError> {
                    let mut report = LifecycleReport::new();

                    for session in batch {
                        report.sessions_evaluated += 1;

                        let result = self.process_session_lifecycle(session, trace_id).await;
                        match result {
                            Ok(operation) => {
                                match operation {
                                    LifecycleOperation::MovedToCold => report.transitions_to_cold += 1,
                                    LifecycleOperation::HardDeleted => report.hard_deletions += 1,
                                    LifecycleOperation::NoAction => {} // No change needed
                                }
                            }
                            Err(e) => {
                                tracing::error!(
                                    session_id = %session.session_id,
                                    error = %e,
                                    "Failed to process session lifecycle"
                                );
                                report.errors.push(e.to_string());
                            }
                        }
                    }

                    Ok(report)
                }

                async fn process_session_lifecycle(
                    &self,
                    session: &SessionMetadata,
                    trace_id: &str
                ) -> Result<LifecycleOperation, LifecycleError> {
                    // Calculate session age in days
                    let now = Utc::now();
                    let created_at = DateTime::from_timestamp(session.created_at, 0)
                        .ok_or(LifecycleError::InvalidTimestamp)?;
                    let age_days = (now - created_at).num_days() as u32;

                    // Get retention policy for this session's privacy band
                    let policy = self.policy_config.get_retention_policy(session.privacy_band).await?;

                    // Determine appropriate action
                    if policy.should_move_to_cold(age_days) && !session.in_cold_storage {
                        // Move to cold storage
                        self.move_session_to_cold_storage(session, trace_id).await?;
                        Ok(LifecycleOperation::MovedToCold)
                    } else if policy.should_hard_delete(age_days) {
                        // Hard delete session
                        self.hard_delete_session(session, trace_id).await?;
                        Ok(LifecycleOperation::HardDeleted)
                    } else {
                        // No action needed
                        Ok(LifecycleOperation::NoAction)
                    }
                }

                async fn move_session_to_cold_storage(
                    &self,
                    session: &SessionMetadata,
                    trace_id: &str
                ) -> Result<(), LifecycleError> {
                    // Move session data from warm to cold storage
                    self.session_store.move_to_cold_storage(&session.session_id).await?;

                    // Log the transition
                    tracing::info!(
                        session_id = %session.session_id,
                        privacy_band = ?session.privacy_band,
                        trace_id = %trace_id,
                        "Session moved to cold storage"
                    );

                    Ok(())
                }

                async fn hard_delete_session(
                    &self,
                    session: &SessionMetadata,
                    trace_id: &str
                ) -> Result<(), LifecycleError> {
                    // Check if in grace period - if so, verify no legal holds
                    let policy = self.policy_config.get_retention_policy(session.privacy_band).await?;
                    let now = Utc::now();
                    let created_at = DateTime::from_timestamp(session.created_at, 0)
                        .ok_or(LifecycleError::InvalidTimestamp)?;
                    let age_days = (now - created_at).num_days() as u32;

                    if policy.is_in_grace_period(age_days) {
                        // Verify no legal holds during grace period
                        if self.session_store.has_legal_hold(&session.session_id).await? {
                            return Err(LifecycleError::LegalHoldActive);
                        }
                    }

                    // Destroy encryption keys first (ADR-0036 compliance)
                    if let Some(key_id) = &session.encryption_key_id {
                        self.encryption_manager.destroy_key(key_id).await?;
                    }

                    // Hard delete session data
                    self.session_store.hard_delete_session(&session.session_id).await?;

                    // Log the deletion
                    tracing::info!(
                        session_id = %session.session_id,
                        privacy_band = ?session.privacy_band,
                        had_encryption_key = session.encryption_key_id.is_some(),
                        trace_id = %trace_id,
                        "Session hard deleted"
                    );

                    Ok(())
                }

                pub async fn get_lifecycle_status(&self, session_id: &str) -> Result<LifecycleStatus, LifecycleError> {
                    let session = self.session_store.get_session_metadata(session_id).await?
                        .ok_or(LifecycleError::SessionNotFound)?;

                    let now = Utc::now();
                    let created_at = DateTime::from_timestamp(session.created_at, 0)
                        .ok_or(LifecycleError::InvalidTimestamp)?;
                    let age_days = (now - created_at).num_days() as u32;

                    let policy = self.policy_config.get_retention_policy(session.privacy_band).await?;
                    let compliance = self.policy_config.validate_policy_compliance(session.privacy_band, age_days).await;

                    Ok(LifecycleStatus {
                        session_id: session.session_id,
                        privacy_band: session.privacy_band,
                        age_days,
                        in_cold_storage: session.in_cold_storage,
                        compliance_status: compliance,
                        days_until_next_action: self.calculate_days_until_next_action(&policy, age_days),
                    })
                }

                fn calculate_days_until_next_action(&self, policy: &RetentionPolicy, age_days: u32) -> Option<u32> {
                    if age_days < policy.warm_storage_days {
                        Some(policy.warm_storage_days - age_days)
                    } else if age_days < policy.total_retention_days {
                        Some(policy.total_retention_days - age_days)
                    } else if age_days < policy.total_retention_days + policy.hard_delete_grace_period_days {
                        Some((policy.total_retention_days + policy.hard_delete_grace_period_days) - age_days)
                    } else {
                        None // Should already be deleted
                    }
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import List, Optional, Any, Dict
            import asyncio
            import time
            import logging

            class LifecycleManager:
                """
                Automated lifecycle manager for SessionState data.

                Handles daily lifecycle checks, warm-to-cold storage transitions,
                and hard deletion with compliance verification.
                """

                def __init__(self, policy_config: Any, session_store: Any, encryption_manager: Any, metrics: Any, batch_size: int = 100):
                    self.logger = logging.getLogger(__name__)
                    self.policy_config = policy_config
                    self.session_store = session_store
                    self.encryption_manager = encryption_manager
                    self.metrics = metrics
                    self.batch_size = batch_size

                async def run_daily_lifecycle_check(self, trace_id: str) -> 'LifecycleReport':
                    """Execute daily lifecycle management for all sessions"""
                    start_time = time.time()
                    report = LifecycleReport()

                    self.logger.info(
                        f"Starting daily lifecycle check",
                        extra={'trace_id': trace_id}
                    )

                    try:
                        # Get all sessions requiring lifecycle evaluation
                        sessions_to_check = await self.session_store.get_sessions_requiring_lifecycle_check()

                        # Process in batches
                        for i in range(0, len(sessions_to_check), self.batch_size):
                            batch = sessions_to_check[i:i + self.batch_size]
                            batch_result = await self._process_batch(batch, trace_id)
                            report.merge(batch_result)

                        duration = time.time() - start_time

                        # Record metrics
                        self.metrics.record_lifecycle_check(
                            report.sessions_evaluated,
                            report.transitions_to_cold,
                            report.hard_deletions,
                            duration
                        )

                        self.logger.info(
                            f"Daily lifecycle check completed: {report.sessions_evaluated} sessions evaluated, "
                            f"{report.transitions_to_cold} moved to cold, {report.hard_deletions} hard deleted",
                            extra={
                                'trace_id': trace_id,
                                'sessions_evaluated': report.sessions_evaluated,
                                'transitions_to_cold': report.transitions_to_cold,
                                'hard_deletions': report.hard_deletions,
                                'duration': duration
                            }
                        )

                        return report

                    except Exception as e:
                        self.logger.error(f"Daily lifecycle check failed: {e}", exc_info=True)
                        raise LifecycleError(f"Lifecycle check failed: {e}")

                async def _process_batch(self, batch: List[Dict], trace_id: str) -> 'LifecycleReport':
                    """Process a batch of sessions for lifecycle management"""
                    report = LifecycleReport()

                    for session in batch:
                        report.sessions_evaluated += 1

                        try:
                            operation = await self._process_session_lifecycle(session, trace_id)
                            if operation == LifecycleOperation.MOVED_TO_COLD:
                                report.transitions_to_cold += 1
                            elif operation == LifecycleOperation.HARD_DELETED:
                                report.hard_deletions += 1
                        except Exception as e:
                            self.logger.error(
                                f"Failed to process session {session.get('session_id')}: {e}",
                                extra={'session_id': session.get('session_id'), 'error': str(e)}
                            )
                            report.errors.append(str(e))

                    return report

                async def _process_session_lifecycle(self, session: Dict, trace_id: str) -> 'LifecycleOperation':
                    """Process lifecycle for a single session"""
                    session_id = session['session_id']
                    privacy_band = session['privacy_band']
                    created_at = session['created_at']
                    in_cold_storage = session.get('in_cold_storage', False)

                    # Calculate age in days
                    current_time = time.time()
                    age_seconds = current_time - created_at
                    age_days = int(age_seconds / (24 * 3600))

                    # Get retention policy
                    policy = await self.policy_config.get_retention_policy(privacy_band)

                    # Determine action
                    if policy.should_move_to_cold(age_days) and not in_cold_storage:
                        await self._move_session_to_cold_storage(session, trace_id)
                        return LifecycleOperation.MOVED_TO_COLD
                    elif policy.should_hard_delete(age_days):
                        await self._hard_delete_session(session, trace_id)
                        return LifecycleOperation.HARD_DELETED
                    else:
                        return LifecycleOperation.NO_ACTION

                async def _move_session_to_cold_storage(self, session: Dict, trace_id: str) -> None:
                    """Move session from warm to cold storage"""
                    session_id = session['session_id']

                    await self.session_store.move_to_cold_storage(session_id)

                    self.logger.info(
                        f"Session moved to cold storage: {session_id}",
                        extra={
                            'session_id': session_id,
                            'privacy_band': session['privacy_band'],
                            'trace_id': trace_id
                        }
                    )

                async def _hard_delete_session(self, session: Dict, trace_id: str) -> None:
                    """Perform hard deletion of session"""
                    session_id = session['session_id']
                    privacy_band = session['privacy_band']
                    created_at = session['created_at']
                    encryption_key_id = session.get('encryption_key_id')

                    # Calculate age for grace period check
                    current_time = time.time()
                    age_seconds = current_time - created_at
                    age_days = int(age_seconds / (24 * 3600))

                    policy = await self.policy_config.get_retention_policy(privacy_band)

                    # Check grace period and legal holds
                    if policy.is_in_grace_period(age_days):
                        if await self.session_store.has_legal_hold(session_id):
                            raise LifecycleError("Cannot delete session with active legal hold")

                    # Destroy encryption keys first
                    if encryption_key_id:
                        await self.encryption_manager.destroy_key(encryption_key_id)

                    # Hard delete session data
                    await self.session_store.hard_delete_session(session_id)

                    self.logger.info(
                        f"Session hard deleted: {session_id}",
                        extra={
                            'session_id': session_id,
                            'privacy_band': privacy_band,
                            'had_encryption_key': encryption_key_id is not None,
                            'trace_id': trace_id
                        }
                    )

                async def get_lifecycle_status(self, session_id: str) -> Dict[str, Any]:
                    """Get lifecycle status for a session"""
                    session = await self.session_store.get_session_metadata(session_id)
                    if not session:
                        raise LifecycleError(f"Session not found: {session_id}")

                    current_time = time.time()
                    created_at = session['created_at']
                    age_seconds = current_time - created_at
                    age_days = int(age_seconds / (24 * 3600))

                    privacy_band = session['privacy_band']
                    policy = await self.policy_config.get_retention_policy(privacy_band)
                    compliance = await self.policy_config.validate_policy_compliance(privacy_band, age_days)

                    days_until_next_action = self._calculate_days_until_next_action(policy, age_days)

                    return {
                        'session_id': session_id,
                        'privacy_band': privacy_band,
                        'age_days': age_days,
                        'in_cold_storage': session.get('in_cold_storage', False),
                        'compliance_status': compliance.value,
                        'days_until_next_action': days_until_next_action
                    }

                def _calculate_days_until_next_action(self, policy: Any, age_days: int) -> Optional[int]:
                    """Calculate days until next lifecycle action"""
                    if age_days < policy.warm_storage_days:
                        return policy.warm_storage_days - age_days
                    elif age_days < policy.total_retention_days:
                        return policy.total_retention_days - age_days
                    elif age_days < policy.total_retention_days + policy.hard_delete_grace_period_days:
                        return (policy.total_retention_days + policy.hard_delete_grace_period_days) - age_days
                    else:
                        return None  # Should already be deleted

daily_cron_schedule:
  - schedule: "0 2 * * *"  # Daily at 2 AM
    description: Run lifecycle checks during low-traffic hours
    timeout: 3600s  # 1 hour maximum runtime
    retry_policy: 3 attempts with exponential backoff

batch_processing:
  - batch_size: 100
    description: Process sessions in batches to control memory usage
  - parallel_batches: 4
    description: Process multiple batches concurrently for performance
  - error_handling: continue processing other batches if one fails

lifecycle_operations:
  - operation: move_to_cold
    trigger: age >= warm_storage_days AND not in_cold_storage
    actions:
      - Update storage location in metadata
      - Move data to cold storage backend
      - Update session metadata
  - operation: hard_delete
    trigger: age >= total_retention_days + grace_period_days
    actions:
      - Verify no legal holds (during grace period)
      - Destroy encryption keys (ADR-0036)
      - Hard delete from K0 (not soft delete)
      - Remove from all indexes

error_handling:
  - error_type: storage_unavailable
    action: retry with exponential backoff
    max_retries: 3
  - error_type: encryption_key_not_found
    action: log warning and continue (key may already be destroyed)
  - error_type: legal_hold_active
    action: skip deletion and log for manual review
  - error_type: session_not_found
    action: log info and continue (may have been deleted by user)
