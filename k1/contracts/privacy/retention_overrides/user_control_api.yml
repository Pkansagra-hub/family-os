classes:
  - name: UserControlAPI
    description: REST API endpoints for user sovereignty over data retention and deletion
    research: GDPR Article 17 (right to erasure), user sovereignty, privacy by design
    performance_budget: <100ms API response time, <50ms database queries, <10ms auth checks
    reliability_properties:
      - user_sovereignty: Users have complete control over their data
      - immediate_deletion: Immediate deletion capability for urgent requests
      - extended_retention: Ability to request longer retention periods
      - audit_transparency: Full audit trail of user actions
      - rate_limiting: Protection against abuse while allowing legitimate requests
    methods:
      - name: delete_session_immediately
        description: Immediately delete a session and all associated data
        parameters:
          - name: session_id
            type: String
            description: Session ID to delete
          - name: user_id
            type: String
            description: User ID making the request (for authorization)
          - name: reason
            type: String
            description: User-provided reason for deletion
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<DeletionResponse, APIError>
          description: API response with deletion status or error
        implementation:
          rust: |
            use axum::{extract::Path, Json};
            use serde::{Deserialize, Serialize};

            #[derive(Deserialize)]
            pub struct DeleteSessionRequest {
                pub reason: String,
            }

            #[derive(Serialize)]
            pub struct DeletionResponse {
                pub session_id: String,
                pub status: String,
                pub estimated_completion_time: Option<String>,
                pub audit_reference: String,
            }

            pub async fn delete_session_immediately(
                Path(session_id): Path<String>,
                Json(request): Json<DeleteSessionRequest>,
                user_id: String,
                trace_id: String,
            ) -> Result<Json<DeletionResponse>, APIError> {
                // Verify user owns the session
                let session_metadata = get_session_metadata(&session_id).await?;
                if session_metadata.user_id != user_id {
                    return Err(APIError::Forbidden("User does not own this session".to_string()));
                }

                // Check rate limits
                check_user_deletion_rate_limit(&user_id).await?;

                // Initiate immediate deletion
                let deletion_result = initiate_hard_deletion(
                    &session_id,
                    DeletionReason::UserRequest,
                    &trace_id,
                ).await?;

                // Return response
                Ok(Json(DeletionResponse {
                    session_id: session_id.clone(),
                    status: if deletion_result.success { "deleted" } else { "deletion_failed" }.to_string(),
                    estimated_completion_time: None, // Immediate deletion
                    audit_reference: deletion_result.audit_reference,
                }))
            }
          python: |
            from fastapi import APIRouter, HTTPException, Depends
            from pydantic import BaseModel
            from typing import Optional
            import time

            router = APIRouter()

            class DeleteSessionRequest(BaseModel):
                reason: str

            class DeletionResponse(BaseModel):
                session_id: str
                status: str
                estimated_completion_time: Optional[str] = None
                audit_reference: str

            @router.post("/v1/sessions/{session_id}/delete")
            async def delete_session_immediately(
                session_id: str,
                request: DeleteSessionRequest,
                user_id: str = Depends(get_current_user),
                trace_id: str = Depends(get_trace_id)
            ) -> DeletionResponse:
                """Immediately delete a session and all associated data"""

                # Verify user owns the session
                session_metadata = await get_session_metadata(session_id)
                if not session_metadata or session_metadata['user_id'] != user_id:
                    raise HTTPException(status_code=403, detail="User does not own this session")

                # Check rate limits
                await check_user_deletion_rate_limit(user_id)

                # Initiate immediate deletion
                deletion_result = await initiate_hard_deletion(
                    session_id,
                    "user_request",
                    trace_id
                )

                # Return response
                return DeletionResponse(
                    session_id=session_id,
                    status="deleted" if deletion_result['success'] else "deletion_failed",
                    estimated_completion_time=None,  # Immediate deletion
                    audit_reference=deletion_result['audit_reference']
                )

      - name: request_extended_retention
        description: Request extended retention period for a session
        parameters:
          - name: session_id
            type: String
            description: Session ID to extend retention for
          - name: user_id
            type: String
            description: User ID making the request
          - name: requested_days
            type: i32
            description: Number of additional days to retain (max 365)
          - name: justification
            type: String
            description: User-provided justification for extension
          - name: trace_id
            type: String
            description: Trace ID for observability
        returns:
          type: Result<RetentionResponse, APIError>
          description: API response with retention extension status
        implementation:
          rust: |
            #[derive(Deserialize)]
            pub struct ExtendRetentionRequest {
                pub requested_days: i32,
                pub justification: String,
            }

            #[derive(Serialize)]
            pub struct RetentionResponse {
                pub session_id: String,
                pub status: String,
                pub new_retention_deadline: String,
                pub audit_reference: String,
            }

            pub async fn request_extended_retention(
                Path(session_id): Path<String>,
                Json(request): Json<ExtendRetentionRequest>,
                user_id: String,
                trace_id: String,
            ) -> Result<Json<RetentionResponse>, APIError> {
                // Validate request
                if request.requested_days < 1 || request.requested_days > 365 {
                    return Err(APIError::BadRequest("Requested days must be between 1 and 365".to_string()));
                }

                // Verify user owns the session
                let session_metadata = get_session_metadata(&session_id).await?;
                if session_metadata.user_id != user_id {
                    return Err(APIError::Forbidden("User does not own this session".to_string()));
                }

                // Check if extension is allowed for privacy band
                let max_extension = match session_metadata.privacy_band {
                    PrivacyBand::Green | PrivacyBand::Amber => 365,
                    PrivacyBand::Red | PrivacyBand::Black => 90,
                };

                if request.requested_days > max_extension {
                    return Err(APIError::BadRequest(format!(
                        "Maximum extension for {} band is {} days",
                        session_metadata.privacy_band, max_extension
                    )));
                }

                // Apply retention extension
                let new_deadline = apply_retention_extension(
                    &session_id,
                    request.requested_days,
                    &request.justification,
                    &trace_id,
                ).await?;

                // Return response
                Ok(Json(RetentionResponse {
                    session_id: session_id.clone(),
                    status: "extended".to_string(),
                    new_retention_deadline: new_deadline.to_rfc3339(),
                    audit_reference: generate_audit_reference(),
                }))
            }
          python: |
            class ExtendRetentionRequest(BaseModel):
                requested_days: int
                justification: str

            class RetentionResponse(BaseModel):
                session_id: str
                status: str
                new_retention_deadline: str
                audit_reference: str

            @router.post("/v1/sessions/{session_id}/retention")
            async def request_extended_retention(
                session_id: str,
                request: ExtendRetentionRequest,
                user_id: str = Depends(get_current_user),
                trace_id: str = Depends(get_trace_id)
            ) -> RetentionResponse:
                """Request extended retention period for a session"""

                # Validate request
                if request.requested_days < 1 or request.requested_days > 365:
                    raise HTTPException(status_code=400, detail="Requested days must be between 1 and 365")

                # Verify user owns the session
                session_metadata = await get_session_metadata(session_id)
                if not session_metadata or session_metadata['user_id'] != user_id:
                    raise HTTPException(status_code=403, detail="User does not own this session")

                # Check if extension is allowed for privacy band
                privacy_band = session_metadata['privacy_band']
                max_extension = 365 if privacy_band in ['GREEN', 'AMBER'] else 90

                if request.requested_days > max_extension:
                    raise HTTPException(
                        status_code=400,
                        detail=f"Maximum extension for {privacy_band} band is {max_extension} days"
                    )

                # Apply retention extension
                new_deadline = await apply_retention_extension(
                    session_id,
                    request.requested_days,
                    request.justification,
                    trace_id
                )

                # Return response
                return RetentionResponse(
                    session_id=session_id,
                    status="extended",
                    new_retention_deadline=new_deadline.isoformat(),
                    audit_reference=generate_audit_reference()
                )

      - name: get_retention_status
        description: Get current retention status and policies for a session
        parameters:
          - name: session_id
            type: String
            description: Session ID to get status for
          - name: user_id
            type: String
            description: User ID making the request
        returns:
          type: Result<RetentionStatus, APIError>
          description: Current retention status and policies
        implementation:
          rust: |
            #[derive(Serialize)]
            pub struct RetentionStatus {
                pub session_id: String,
                pub privacy_band: String,
                pub current_retention_policy: RetentionPolicy,
                pub retention_deadline: String,
                pub days_remaining: i32,
                pub can_extend: bool,
                pub max_extension_days: i32,
                pub last_user_action: Option<UserRetentionAction>,
            }

            pub async fn get_retention_status(
                Path(session_id): Path<String>,
                user_id: String,
            ) -> Result<Json<RetentionStatus>, APIError> {
                // Verify user owns the session
                let session_metadata = get_session_metadata(&session_id).await?;
                if session_metadata.user_id != user_id {
                    return Err(APIError::Forbidden("User does not own this session".to_string()));
                }

                // Get current retention policy
                let retention_policy = get_current_retention_policy(&session_id).await?;
                let deadline = calculate_retention_deadline(&session_metadata, &retention_policy);
                let days_remaining = calculate_days_remaining(deadline);

                // Determine extension capabilities
                let (can_extend, max_extension_days) = match session_metadata.privacy_band {
                    PrivacyBand::Green | PrivacyBand::Amber => (true, 365),
                    PrivacyBand::Red | PrivacyBand::Black => (true, 90),
                };

                // Get last user action
                let last_action = get_last_user_retention_action(&session_id).await?;

                Ok(Json(RetentionStatus {
                    session_id: session_id.clone(),
                    privacy_band: session_metadata.privacy_band.to_string(),
                    current_retention_policy: retention_policy,
                    retention_deadline: deadline.to_rfc3339(),
                    days_remaining,
                    can_extend,
                    max_extension_days,
                    last_user_action: last_action,
                }))
            }
          python: |
            class RetentionStatus(BaseModel):
                session_id: str
                privacy_band: str
                current_retention_policy: dict
                retention_deadline: str
                days_remaining: int
                can_extend: bool
                max_extension_days: int
                last_user_action: Optional[dict] = None

            @router.get("/v1/sessions/{session_id}/retention")
            async def get_retention_status(
                session_id: str,
                user_id: str = Depends(get_current_user)
            ) -> RetentionStatus:
                """Get current retention status and policies for a session"""

                # Verify user owns the session
                session_metadata = await get_session_metadata(session_id)
                if not session_metadata or session_metadata['user_id'] != user_id:
                    raise HTTPException(status_code=403, detail="User does not own this session")

                # Get current retention policy
                retention_policy = await get_current_retention_policy(session_id)
                deadline = calculate_retention_deadline(session_metadata, retention_policy)
                days_remaining = calculate_days_remaining(deadline)

                # Determine extension capabilities
                privacy_band = session_metadata['privacy_band']
                can_extend = True
                max_extension_days = 365 if privacy_band in ['GREEN', 'AMBER'] else 90

                # Get last user action
                last_action = await get_last_user_retention_action(session_id)

                return RetentionStatus(
                    session_id=session_id,
                    privacy_band=privacy_band,
                    current_retention_policy=retention_policy,
                    retention_deadline=deadline.isoformat(),
                    days_remaining=days_remaining,
                    can_extend=can_extend,
                    max_extension_days=max_extension_days,
                    last_user_action=last_action
                )

api_endpoints:
  - path: POST /v1/sessions/{session_id}/delete
    description: Immediately delete a session and all associated data
    authentication: Bearer token
    authorization: Session owner only
    rate_limit: 10 deletions per hour per user
    request_body:
      reason: User-provided reason for deletion (required)
    response_200:
      session_id: Session ID
      status: deleted or deletion_failed
      audit_reference: Reference for audit trail
    response_403: User does not own session
    response_429: Rate limit exceeded

  - path: POST /v1/sessions/{session_id}/retention
    description: Request extended retention period
    authentication: Bearer token
    authorization: Session owner only
    rate_limit: 5 extensions per day per user
    request_body:
      requested_days: Days to extend (1-365, band-dependent max)
      justification: Reason for extension (required)
    response_200:
      session_id: Session ID
      status: "extended"
      new_retention_deadline: New deadline timestamp
      audit_reference: Reference for audit trail
    response_400: Invalid extension period
    response_403: User does not own session

  - path: GET /v1/sessions/{session_id}/retention
    description: Get current retention status and policies
    authentication: Bearer token
    authorization: Session owner only
    rate_limit: 100 requests per hour per user
    response_200:
      session_id: Session ID
      privacy_band: Session privacy band
      current_retention_policy: Current policy details
      retention_deadline: Current deadline
      days_remaining: Days until deletion
      can_extend: Whether extension is allowed
      max_extension_days: Maximum extension period
      last_user_action: Last user retention action
    response_403: User does not own session

rate_limiting:
  - endpoint: delete_session
    limit: 10 per hour per user
    burst: 2
    reason: Prevent abuse while allowing legitimate urgent deletions
  - endpoint: extend_retention
    limit: 5 per day per user
    burst: 1
    reason: Prevent excessive retention extensions
  - endpoint: get_retention_status
    limit: 100 per hour per user
    burst: 10
    reason: Allow frequent status checks without abuse

audit_requirements:
  - action: session_deletion
    logged_fields: [user_id, session_id, reason, timestamp, privacy_band, trace_id]
    retention: 7 years (HIPAA compliance)
  - action: retention_extension
    logged_fields: [user_id, session_id, requested_days, justification, new_deadline, trace_id]
    retention: 7 years (HIPAA compliance)
  - action: retention_status_query
    logged_fields: [user_id, session_id, timestamp, trace_id]
    retention: 90 days (operational audit)

error_responses:
  - code: 400
    message: Bad Request
    cases: [invalid_extension_days, missing_required_fields]
  - code: 403
    message: Forbidden
    cases: [not_session_owner, insufficient_permissions]
  - code: 404
    message: Not Found
    cases: [session_not_found]
  - code: 429
    message: Too Many Requests
    cases: [rate_limit_exceeded]
  - code: 500
    message: Internal Server Error
    cases: [deletion_failed, database_error]
