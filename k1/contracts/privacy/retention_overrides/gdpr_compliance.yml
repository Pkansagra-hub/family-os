classes:
  - name: GDPRComplianceManager
    description: GDPR compliance verification and enforcement for data retention and deletion
    research: GDPR Articles 5, 17, 25; privacy by design, data minimization, right to erasure
    performance_budget: <50ms compliance checks, <10ms policy lookups, <100ms audit logging
    reliability_properties:
      - gdpr_compliance: Full compliance with GDPR retention and deletion requirements
      - privacy_by_design: Privacy considerations built into all retention decisions
      - data_minimization: Minimal data retention with automatic lifecycle management
      - right_to_erasure: Immediate deletion capability for user requests
      - audit_transparency: Complete audit trail of all retention and deletion actions
    methods:
      - name: verify_deletion_allowed
        description: Verify that deletion is allowed under GDPR and other regulations
        parameters:
          - name: session_id
            type: String
            description: Session ID to verify
          - name: deletion_reason
            type: DeletionReason
            description: Reason for deletion request
        returns:
          type: Result<ComplianceCheckResult, ComplianceError>
          description: Compliance verification result
        implementation:
          rust: |
            use std::collections::HashMap;

            #[derive(Debug, Clone)]
            pub enum DeletionReason {
                LifecycleExpired,
                UserRequest,
                LegalHoldExpired,
                DataBreach,
                RegulatoryRequirement,
            }

            #[derive(Debug)]
            pub struct ComplianceCheckResult {
                pub allowed: bool,
                pub blocking_reasons: Vec<String>,
                pub gdpr_article: Option<String>,
                pub recommended_actions: Vec<String>,
            }

            pub struct GDPRComplianceManager {
                legal_hold_service: Arc<dyn LegalHoldService>,
                regulatory_compliance_service: Arc<dyn RegulatoryComplianceService>,
                audit_logger: Arc<dyn AuditLogger>,
            }

            impl GDPRComplianceManager {
                pub async fn verify_deletion_allowed(
                    &self,
                    session_id: &str,
                    deletion_reason: &DeletionReason,
                ) -> Result<ComplianceCheckResult, ComplianceError> {
                    let mut blocking_reasons = Vec::new();
                    let mut recommended_actions = Vec::new();

                    // Check for active legal holds (GDPR Article 18)
                    let legal_hold = self.legal_hold_service.check_legal_hold(session_id).await?;
                    if legal_hold.is_active {
                        blocking_reasons.push(format!(
                            "Active legal hold: {} (expires: {})",
                            legal_hold.reason,
                            legal_hold.expiry_date.map(|d| d.to_string()).unwrap_or_else(|| "indefinite".to_string())
                        ));
                    }

                    // Check regulatory retention requirements
                    let regulatory_requirements = self.regulatory_compliance_service
                        .get_retention_requirements(session_id).await?;

                    match deletion_reason {
                        DeletionReason::UserRequest => {
                            // GDPR Article 17: Right to erasure
                            // Must honor user requests unless legal grounds for refusal
                            if !blocking_reasons.is_empty() {
                                // Legal grounds for refusal (Article 17(3))
                                recommended_actions.push(
                                    "Document legal grounds for deletion refusal".to_string()
                                );
                            }
                        }
                        DeletionReason::LifecycleExpired => {
                            // Check if retention period meets GDPR Article 5(1)(e)
                            if let Some(min_retention) = regulatory_requirements.minimum_retention_days {
                                let current_age = self.get_session_age_days(session_id).await?;
                                if current_age < min_retention {
                                    blocking_reasons.push(format!(
                                        "Minimum retention period not met: {} days required, {} days current",
                                        min_retention, current_age
                                    ));
                                }
                            }
                        }
                        DeletionReason::LegalHoldExpired => {
                            // Legal hold expired, deletion allowed
                            recommended_actions.push(
                                "Document legal hold expiry in audit trail".to_string()
                            );
                        }
                        DeletionReason::DataBreach | DeletionReason::RegulatoryRequirement => {
                            // Immediate deletion required for compliance
                            if !blocking_reasons.is_empty() {
                                return Err(ComplianceError::ConflictingRequirements(
                                    "Cannot delete due to active legal hold during breach/regulatory action".to_string()
                                ));
                            }
                        }
                    }

                    // Log compliance check
                    self.audit_logger.log_compliance_check(
                        session_id,
                        deletion_reason,
                        &blocking_reasons,
                        &recommended_actions,
                    ).await?;

                    let allowed = blocking_reasons.is_empty();
                    let gdpr_article = match deletion_reason {
                        DeletionReason::UserRequest => Some("17".to_string()), // Right to erasure
                        DeletionReason::LifecycleExpired => Some("5(1)(e)".to_string()), // Storage limitation
                        _ => Some("6(1)".to_string()), // Lawful processing
                    };

                    Ok(ComplianceCheckResult {
                        allowed,
                        blocking_reasons,
                        gdpr_article,
                        recommended_actions,
                    })
                }

                async fn get_session_age_days(&self, session_id: &str) -> Result<i32, ComplianceError> {
                    // Implementation would query session metadata
                    Ok(30) // Placeholder
                }
            }
          python: |
            from dataclasses import dataclass
            from typing import List, Optional, Dict, Any
            from enum import Enum
            import logging

            class DeletionReason(Enum):
                LIFECYCLE_EXPIRED = "lifecycle_expired"
                USER_REQUEST = "user_request"
                LEGAL_HOLD_EXPIRED = "legal_hold_expired"
                DATA_BREACH = "data_breach"
                REGULATORY_REQUIREMENT = "regulatory_requirement"

            @dataclass
            class ComplianceCheckResult:
                allowed: bool
                blocking_reasons: List[str]
                gdpr_article: Optional[str]
                recommended_actions: List[str]

            class GDPRComplianceManager:
                """
                GDPR compliance verification for data retention and deletion.

                Ensures all retention and deletion actions comply with GDPR requirements,
                particularly Articles 5 (principles), 17 (right to erasure), and 25 (privacy by design).
                """

                def __init__(self, legal_hold_service, regulatory_compliance_service, audit_logger):
                    self.logger = logging.getLogger(__name__)
                    self.legal_hold_service = legal_hold_service
                    self.regulatory_compliance_service = regulatory_compliance_service
                    self.audit_logger = audit_logger

                async def verify_deletion_allowed(
                    self,
                    session_id: str,
                    deletion_reason: str
                ) -> ComplianceCheckResult:
                    """Verify deletion is allowed under GDPR and other regulations"""

                    blocking_reasons = []
                    recommended_actions = []

                    # Check for active legal holds (GDPR Article 18)
                    legal_hold = await self.legal_hold_service.check_legal_hold(session_id)
                    if legal_hold.get('is_active', False):
                        blocking_reasons.append(
                            f"Active legal hold: {legal_hold.get('reason', 'Unknown')} "
                            f"(expires: {legal_hold.get('expiry_date', 'indefinite')})"
                        )

                    # Check regulatory retention requirements
                    regulatory_requirements = await self.regulatory_compliance_service.get_retention_requirements(session_id)

                    if deletion_reason == DeletionReason.USER_REQUEST.value:
                        # GDPR Article 17: Right to erasure
                        if blocking_reasons:
                            # Legal grounds for refusal (Article 17(3))
                            recommended_actions.append("Document legal grounds for deletion refusal")
                        gdpr_article = "17"
                    elif deletion_reason == DeletionReason.LIFECYCLE_EXPIRED.value:
                        # Check if retention period meets GDPR Article 5(1)(e)
                        min_retention = regulatory_requirements.get('minimum_retention_days')
                        if min_retention:
                            current_age = await self._get_session_age_days(session_id)
                            if current_age < min_retention:
                                blocking_reasons.append(
                                    f"Minimum retention period not met: {min_retention} days required, "
                                    f"{current_age} days current"
                                )
                        gdpr_article = "5(1)(e)"
                    elif deletion_reason == DeletionReason.LEGAL_HOLD_EXPIRED.value:
                        # Legal hold expired, deletion allowed
                        recommended_actions.append("Document legal hold expiry in audit trail")
                        gdpr_article = "18"
                    else:
                        # Data breach or regulatory requirement
                        if blocking_reasons:
                            raise ComplianceError(
                                "Cannot delete due to active legal hold during breach/regulatory action"
                            )
                        gdpr_article = "6(1)"

                    # Log compliance check
                    await self.audit_logger.log_compliance_check(
                        session_id,
                        deletion_reason,
                        blocking_reasons,
                        recommended_actions
                    )

                    allowed = len(blocking_reasons) == 0

                    return ComplianceCheckResult(
                        allowed=allowed,
                        blocking_reasons=blocking_reasons,
                        gdpr_article=gdpr_article,
                        recommended_actions=recommended_actions
                    )

                async def _get_session_age_days(self, session_id: str) -> int:
                    """Get session age in days"""
                    # Implementation would query session metadata
                    return 30  # Placeholder

gdpr_article_mapping:
  - article: "5(1)(c)"
    title: "Data minimization"
    description: "Personal data shall be adequate, relevant and limited to what is necessary"
    retention_implication: "Minimize retention periods to only what is necessary for the purposes"
    implementation: "Band-specific retention policies with automatic lifecycle management"
  - article: "5(1)(e)"
    title: "Storage limitation"
    description: "Personal data shall be kept in a form which permits identification for no longer than necessary"
    retention_implication: "Automatic deletion after retention period expires"
    implementation: "LifecycleManager with cron jobs for automated deletion"
  - article: "17"
    title: "Right to erasure ('right to be forgotten')"
    description: "The data subject shall have the right to obtain erasure of personal data"
    retention_implication: "Immediate deletion capability for user requests"
    implementation: "UserControlAPI POST /v1/sessions/{id}/delete endpoint"
  - article: "18"
    title: "Restriction of processing"
    description: "Restriction of processing in case of legal claims"
    retention_implication: "Legal holds prevent deletion during investigations"
    implementation: "Legal hold checks in compliance verification"
  - article: "25"
    title: "Data protection by design and by default"
    retention_implication: "Privacy considerations built into system design"
    implementation: "Privacy band retention overrides with user sovereignty"

compliance_verification_steps:
  - step: legal_hold_check
    description: Verify no active legal holds prevent deletion
    gdpr_reference: Article 18
    failure_action: block_deletion
  - step: retention_period_check
    description: Verify minimum retention periods are satisfied
    gdpr_reference: Article 5(1)(e)
    failure_action: block_deletion
  - step: user_rights_check
    description: Verify user deletion requests are honored
    gdpr_reference: Article 17
    failure_action: document_refusal
  - step: regulatory_check
    description: Verify compliance with other regulations (HIPAA, etc.)
    gdpr_reference: Article 6(1)
    failure_action: block_deletion

audit_trail_requirements:
  - event: compliance_check
    retention: 7 years
    fields: [session_id, deletion_reason, blocking_reasons, gdpr_article, timestamp]
  - event: deletion_refusal
    retention: 7 years
    fields: [session_id, user_id, refusal_reason, legal_grounds, gdpr_article]
  - event: legal_hold_applied
    retention: 7 years
    fields: [session_id, hold_reason, expiry_date, requesting_authority]
  - event: retention_extension
    retention: 7 years
    fields: [session_id, user_id, extension_days, justification, new_deadline]

data_protection_impact_assessment:
  - risk: unauthorized_deletion
    mitigation: Multi-step compliance verification, audit trails, legal hold checks
    likelihood: Low
    impact: High
  - risk: excessive_retention
    mitigation: Automatic lifecycle management, band-specific policies, user control
    likelihood: Low
    impact: Medium
  - risk: compliance_violation
    mitigation: GDPR compliance checks, regulatory monitoring, audit transparency
    likelihood: Low
    impact: High
  - risk: data_unavailability
    mitigation: Gradual deletion process, user notifications, backup verification
    likelihood: Medium
    impact: Medium

privacy_impact_assessment:
  - processing: automated_deletion
    necessity: Essential for GDPR Article 5 compliance
    proportionality: Limited to necessary data only
    risk_mitigation: User control, audit trails, compliance verification
  - processing: retention_extension
    necessity: User sovereignty and legal compliance
    proportionality: Bounded extensions with justification requirements
    risk_mitigation: Rate limiting, audit logging, compliance checks
  - processing: compliance_auditing
    necessity: Regulatory compliance and accountability
    proportionality: Minimal necessary audit data
    risk_mitigation: Encryption, access controls, retention limits
