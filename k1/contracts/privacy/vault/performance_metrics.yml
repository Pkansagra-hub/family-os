# Contract: Vault Performance Metrics, SLAs & Monitoring
# Purpose: Define performance budgets, monitoring dashboards, alerting rules, SLA enforcement, and capacity planning for vault operations
# Source: ADR-0035c | Status: Production-Ready | Last Updated: 2025-10-16

contract:
  id: "C_PRIVACY_VAULT_PERF_019"
  name: "Vault Performance Metrics, SLAs & Monitoring"
  version: "1.0.0"
  category: "Observability & Operations"
  owner: "K1 Platform Engineering Team"

  strategic_context:
    purpose: "Vault operations are latency-sensitive (encryption, decryption, KMS calls). Define hard performance budgets, real-time monitoring, alerting for violations, and capacity planning to ensure sub-millisecond operations."
    sla_definition: "Service Level Agreement (SLA) = commitment to customers on performance. If violated, customer entitled to credits/compensation."
    performance_vs_compliance: "Performance budgets enable GDPR/HIPAA compliance. If vault operations exceed budgets, user experience degrades, leading to support escalation."

  performance_budgets_hard_requirements:
    budget_1_pii_store_operation:
      operation: "Encrypt PII → Store in K0 vault"
      p50_latency_ms: 0.8
      p95_latency_ms: 1.5
      p99_latency_ms: 2.0
      budget_ms: 2.0
      sla_target: "95th percentile < 1.5 ms"
      rationale: "Users expect instant storage (< 2ms). If exceeds 2ms, SessionState accumulates lag."
      monitoring: "Prometheus histogram vault_store_latency_ms"

    budget_2_pii_retrieve_operation:
      operation: "Retrieve from K0 vault → Decrypt PII"
      p50_latency_ms: 0.7
      p95_latency_ms: 1.2
      p99_latency_ms: 1.8
      budget_ms: 1.0
      sla_target: "95th percentile < 1.2 ms"
      rationale: "Retrieval must be faster than store (data already at rest). Fast retrieval enables responsive UI."
      monitoring: "Prometheus histogram vault_retrieve_latency_ms"

    budget_3_kms_data_key_generation:
      operation: "AWS KMS GenerateDataKey (per PII value)"
      p50_latency_ms: 40.0
      p95_latency_ms: 60.0
      p99_latency_ms: 80.0
      budget_ms: 100.0
      sla_target: "95th percentile < 60 ms"
      rationale: "KMS calls cross AWS network boundary (slowest component). Budget 100ms for cross-region retry."
      monitoring: "Prometheus histogram kms_generate_key_latency_ms"

    budget_4_kms_decrypt_operation:
      operation: "AWS KMS Decrypt (per PII value)"
      p50_latency_ms: 35.0
      p95_latency_ms: 55.0
      p99_latency_ms: 75.0
      budget_ms: 100.0
      sla_target: "95th percentile < 55 ms"
      rationale: "Decrypt slightly faster than GenerateDataKey (no key creation). Retry budget included."
      monitoring: "Prometheus histogram kms_decrypt_latency_ms"

    budget_5_vault_write_k0_database:
      operation: "INSERT into pii_vault table (K0 PostgreSQL)"
      p50_latency_ms: 1.0
      p95_latency_ms: 3.0
      p99_latency_ms: 5.0
      budget_ms: 5.0
      sla_target: "95th percentile < 3 ms"
      rationale: "Database write includes query compilation, index update, replication. SSDs typically <3ms."
      monitoring: "Prometheus histogram db_insert_pii_vault_latency_ms"

    budget_6_vault_read_k0_database:
      operation: "SELECT from pii_vault table (K0 PostgreSQL)"
      p50_latency_ms: 0.5
      p95_latency_ms: 1.5
      p99_latency_ms: 3.0
      budget_ms: 5.0
      sla_target: "95th percentile < 1.5 ms"
      rationale: "Index-based read faster than write (no index update). Cache hits reduce latency."
      monitoring: "Prometheus histogram db_select_pii_vault_latency_ms"

    budget_7_audit_log_write:
      operation: "INSERT into vault_audit_log table (async, non-blocking)"
      p50_latency_ms: 0.2
      p95_latency_ms: 0.8
      p99_latency_ms: 1.2
      budget_ms: 1.0
      sla_target: "95th percentile < 0.8 ms"
      rationale: "Async operation (doesn't block user). Fast append-only insert."
      monitoring: "Prometheus histogram audit_log_write_latency_ms"

    budget_8_gdpr_export_operation:
      operation: "Fetch all user PII → Decrypt → Export as JSON/CSV (100 records)"
      p50_latency_ms: 4000.0
      p95_latency_ms: 7000.0
      p99_latency_ms: 10000.0
      budget_ms: 10000.0
      sla_target: "95th percentile < 7 seconds"
      rationale: "Bulk operation (100 PII values). Each value: 1ms decrypt + 0.5ms format. Total ~150ms + KMS overhead."
      monitoring: "Prometheus histogram gdpr_export_latency_ms"

    budget_9_hard_delete_batch:
      operation: "Hard delete 1000 expired grace periods (batch job)"
      p50_latency_ms: 2500.0
      p95_latency_ms: 4000.0
      p99_latency_ms: 5000.0
      budget_ms: 5000.0
      sla_target: "95th percentile < 4 seconds"
      rationale: "Bulk delete with secure erase (overwrite plaintext 3 passes). ~5ms per record."
      monitoring: "Prometheus histogram hard_delete_batch_latency_ms"

    budget_10_sessionstate_redaction:
      operation: "Redact PII → Replace with placeholder (single value)"
      p50_latency_ms: 0.01
      p95_latency_ms: 0.05
      p99_latency_ms: 0.1
      budget_ms: 0.5
      sla_target: "95th percentile < 0.05 ms"
      rationale: "String replacement operation (in-memory, no I/O). Very fast baseline."
      monitoring: "Prometheus histogram redaction_latency_ms"

  sla_targets:
    sla_1_vault_operations_availability:
      metric: "Percentage of successful vault operations (store, retrieve, delete)"
      target: "99.95% uptime"
      definition: "Operations succeed without errors or timeouts"
      measurement: "Count successful ops / total ops"
      exceptions: "Planned maintenance windows, KMS outages, database failures"
      violation_impact: "Customer credit (per SLA contract terms, e.g., 10% of monthly bill)"

    sla_2_response_time_p95:
      metric: "95th percentile response time for vault operations"
      target: "< 3 milliseconds (aggregate)"
      definition: "Typical user experience - 95 out of 100 operations faster than this"
      measurement: "Prometheus percentile calculation"
      exceptions: "KMS network latency, database slow query, network congestion"
      violation_impact: "Customer communication + incident escalation"

    sla_3_encryption_coverage:
      metric: "Percentage of PII protected with encryption"
      target: "100%"
      definition: "All PII in vault has valid encryption key and ciphertext"
      measurement: "SELECT COUNT(*) FROM pii_vault WHERE encrypted_value IS NULL"
      exceptions: "Data corruption (triggers incident response)"
      violation_impact: "Security incident declaration, mandatory notification"

    sla_4_audit_trail_integrity:
      metric: "Percentage of audit log entries written successfully"
      target: "100%"
      definition: "All vault operations have corresponding audit log entries"
      measurement: "SELECT COUNT(DISTINCT operation_id) FROM vault_audit_log"
      exceptions: "Audit log disk full (should auto-rotate)"
      violation_impact: "Compliance violation (GDPR audit failure)"

    sla_5_gdpr_data_subject_requests:
      metric: "Percentage of GDPR requests completed within 30 days"
      target: "100%"
      definition: "All data subject requests (access, erasure) completed on time"
      measurement: "COUNT(requests_completed_within_30_days) / total_requests"
      exceptions: "None (legal deadline)"
      violation_impact: "Regulatory fine (up to 4% of global annual revenue)"

  monitoring_dashboard:
    dashboard_1_vault_latency:
      name: "Vault Latency Dashboard"
      panels:
        - "vault_store_latency_ms (p50, p95, p99 - time series)"
        - "vault_retrieve_latency_ms (p50, p95, p99 - time series)"
        - "kms_generate_key_latency_ms (p50, p95, p99 - time series)"
        - "kms_decrypt_latency_ms (p50, p95, p99 - time series)"
        - "db_insert_pii_vault_latency_ms (p50, p95, p99 - time series)"
        - "Latency heatmap (distribution of latencies)"
        - "SLA violation indicator (red if budget exceeded)"
      refresh_interval: "30 seconds"
      retention: "7 days (Prometheus default)"

    dashboard_2_vault_throughput:
      name: "Vault Throughput Dashboard"
      panels:
        - "vault_store_operations_total (rate per second)"
        - "vault_retrieve_operations_total (rate per second)"
        - "vault_delete_operations_total (rate per second)"
        - "kms_api_calls_total (rate per second)"
        - "db_queries_total (rate per second)"
        - "Throughput spike detection (anomalies)"
      refresh_interval: "30 seconds"
      retention: "7 days"

    dashboard_3_vault_errors:
      name: "Vault Error Dashboard"
      panels:
        - "vault_operation_errors_total (by error_type)"
        - "kms_request_failures_total (auth, throttle, timeout)"
        - "db_query_errors_total (connection, query, constraint)"
        - "audit_log_write_failures_total (disk full, timeout)"
        - "Error rate (% of operations failed)"
      refresh_interval: "30 seconds"
      retention: "7 days"

    dashboard_4_compliance_metrics:
      name: "Compliance & Audit Dashboard"
      panels:
        - "pii_records_encrypted_total (should = 100%)"
        - "audit_log_entries_written_total (should match operations)"
        - "soft_delete_records_total (grace period tracking)"
        - "hard_delete_records_total (confirmation of erasure)"
        - "gdpr_export_requests_total (per month)"
        - "gdpr_export_average_latency_ms"
        - "compliance_violations (should be 0)"
      refresh_interval: "1 minute"
      retention: "90 days (GDPR retention)"

    dashboard_5_capacity_planning:
      name: "Capacity Planning Dashboard"
      panels:
        - "pii_vault_table_size_mb (growth rate, projected full date)"
        - "vault_audit_log_table_size_mb (growth rate, retention expiry)"
        - "kms_key_count (limit: 100 keys per customer)"
        - "database_connection_pool_usage (% utilized)"
        - "disk_space_utilization (% full, auto-alert at 80%)"
        - "Capacity forecast (30/60/90 day projections)"
      refresh_interval: "5 minutes"
      retention: "365 days (1 year historical)"

  alerting_rules:
    alert_1_latency_sla_violation:
      metric: "vault_store_latency_ms p95 > 1.5"
      threshold: "1.5 milliseconds"
      duration: "5 minutes (allow transient spikes)"
      severity: "WARNING"
      action: |
        1. Page on-call engineer (Slack + PagerDuty)
        2. Start incident (Google Doc)
        3. Check KMS latency (possible AWS issue)
        4. Check database slow query log
        5. Consider rollback if recent deployment
      escalation: "If violation persists > 30 minutes, escalate to team lead"

    alert_2_error_rate_elevated:
      metric: "vault_operation_errors_total / vault_operation_requests_total > 0.5%"
      threshold: "> 0.5% error rate"
      duration: "2 minutes"
      severity: "CRITICAL"
      action: |
        1. Page on-call engineer + team lead
        2. Start incident (declare P1)
        3. Check KMS service status (AWS Status Page)
        4. Check database connectivity
        5. Check network connectivity (firewall rules)
        6. Consider failover to secondary region (if available)
      escalation: "Auto-escalate to VP Engineering if P1"

    alert_3_audit_log_write_failures:
      metric: "audit_log_write_failures_total > 0"
      threshold: "Any failure"
      duration: "Immediate (no delay)"
      severity: "CRITICAL"
      action: |
        1. Page security team + on-call engineer
        2. Declare security incident
        3. Check disk space (audit_log may fill disk)
        4. Check audit log table constraints
        5. Verify all operations still have corresponding audit entries
      escalation: "Escalate to legal + compliance team (audit trail corruption)"

    alert_4_encryption_coverage_degradation:
      metric: "COUNT(pii_vault WHERE encrypted_value IS NULL) > 0"
      threshold: "Any unencrypted PII record"
      duration: "Immediate"
      severity: "CRITICAL"
      action: |
        1. Page security team + on-call engineer
        2. Declare data protection incident
        3. Identify which records are unencrypted
        4. Determine root cause (encryption failure? data import?)
        5. Re-encrypt or delete unencrypted records
      escalation: "Escalate to CISO + legal team (potential GDPR violation)"

    alert_5_kms_request_throttling:
      metric: "kms_request_throttle_errors_total > 10"
      threshold: "> 10 throttle errors in 5 minutes"
      duration: "5 minutes"
      severity: "WARNING"
      action: |
        1. Page on-call engineer
        2. Check KMS request rate (may need higher quota)
        3. Review AWS KMS quota (default: 1000 requests/sec)
        4. Consider batch optimization (combine multiple small requests)
        5. Request AWS KMS quota increase if needed
      escalation: "If throttling persists, escalate to AWS support"

    alert_6_soft_delete_grace_period_expiry:
      metric: "soft_delete_records_grace_period_expires_soon (< 24 hours)"
      threshold: "Count of records expiring < 24 hours"
      duration: "1 hour (daily check)"
      severity: "INFO"
      action: |
        1. Log to operational dashboard (not critical)
        2. Verify hard delete batch job scheduled
        3. Verify batch job will complete before grace expiry
        4. Monitor batch job execution
      escalation: "None (informational alert)"

    alert_7_database_connection_pool_saturation:
      metric: "db_connection_pool_usage > 80%"
      threshold: "> 80% of connection pool exhausted"
      duration: "5 minutes"
      severity: "WARNING"
      action: |
        1. Page on-call engineer
        2. Check long-running queries (may be blocking connections)
        3. Kill slow queries if needed
        4. Increase connection pool size (if tunable)
        5. Check for connection leaks (not being returned)
      escalation: "If pool exhausted (100%), escalate to DBA"

    alert_8_disk_space_exhaustion:
      metric: "disk_space_utilization > 80%"
      threshold: "> 80% of disk utilized"
      duration: "1 hour (daily check)"
      severity: "WARNING"
      action: |
        1. Page database operations team
        2. Check table sizes (pii_vault, vault_audit_log may be large)
        3. Archive old audit logs (> 90 days per GDPR)
        4. Delete or compress old backups
        5. Add additional disk capacity if needed
      escalation: "If disk > 95%, page on-call DBA"

  performance_optimization_techniques:
    technique_1_batch_operations:
      description: "Batch multiple PII operations to reduce overhead"
      implementation: |
        Instead of:
          FOR each user_pii in user_pii_list:
            store(user_pii)  // 1ms * 100 = 100ms

        Do:
          batch_store(user_pii_list)  // 1ms * N + 5ms overhead = 15ms (for 100)
      latency_reduction: "100ms → 15ms (6.7× faster)"
      tradeoff: "Complexity: need batch API, memory for batch buffer"

    technique_2_connection_pooling:
      description: "Reuse database connections instead of creating new ones per request"
      implementation: |
        K0 database connection pool:
        - Min connections: 10 (maintain baseline)
        - Max connections: 100 (burst capacity)
        - Timeout: 300 seconds (reuse after 5 min idle)
      latency_reduction: "Eliminates connection setup time (~10ms)"
      tradeoff: "Memory: 10-100 connections in memory (low overhead)"

    technique_3_prepared_statements:
      description: "Pre-compile SQL queries to avoid parsing overhead"
      implementation: |
        Prepared queries:
        - INSERT INTO pii_vault (vault_key, pii_type, encrypted_value, ...) VALUES (?, ?, ?, ...)
        - SELECT encrypted_value FROM pii_vault WHERE vault_key = ?
        - DELETE FROM pii_vault WHERE is_deleted = TRUE AND deleted_at < ?
      latency_reduction: "Avoids 0.1ms parsing per query"
      tradeoff: "Minimal (standard best practice)"

    technique_4_index_optimization:
      description: "Optimize database indexes for common query patterns"
      indexes:
        - "idx_pii_vault_user_id: Fast lookup by user"
        - "idx_pii_vault_vault_key: Fast lookup by vault_key"
        - "idx_pii_vault_deleted_at: Fast lookup for hard delete batch"
        - "idx_audit_log_user_id_timestamp: Fast audit trail query"
      latency_reduction: "Without indexes: 10-100ms. With indexes: <1ms"
      tradeoff: "Disk space: ~50MB for indexes"

    technique_5_read_caching:
      description: "Cache recently retrieved PII in K1 memory (volatile, short-lived)"
      implementation: |
        K1 cache (LRU eviction):
        - TTL: 60 seconds (cache expires)
        - Size: 100MB max (1000 PII values × 100KB avg)
        - Hit rate target: 40% (reduce database hits)
      latency_reduction: "Database hit: 1ms. Cache hit: 0.01ms (100× faster)"
      tradeoff: "Memory: 100MB. Privacy: cached plaintext (risk if process dumped)"

    technique_6_kms_batching:
      description: "Batch KMS GenerateDataKey requests (requires custom batching logic)"
      implementation: |
        K1 KMS batch service:
        - Accumulate KMS requests for 5ms
        - Batch up to 20 requests
        - Single KMS call (limit 50 keys per batch)
        - Distribute keys back to individual requests
      latency_reduction: "Per-key overhead: 50ms → 5ms (10× faster, amortized)"
      tradeoff: "Complexity: batch logic, error handling, timeout logic"

    technique_7_async_audit_logging:
      description: "Write audit logs asynchronously (don't block operation completion)"
      implementation: |
        Async audit log write:
        - Store operation completes → return to user (1ms)
        - Queue audit log to message broker (async, <0.1ms)
        - Batch process audit logs every 100ms or 1000 entries
        - Write to database in batch (reduces insert overhead)
      latency_reduction: "Removes 0.2ms audit log write from critical path"
      tradeoff: "Complexity: message queue, batch processing. Risk: audit loss if crash"

  capacity_planning:
    pii_vault_table_growth:
      baseline_records: "10 million PII values"
      average_record_size: "500 bytes (vault_key + encrypted_value + metadata)"
      baseline_table_size_mb: "5000 MB (5 GB)"
      annual_growth_rate: "50% (optimistic)"
      projected_size_3_years: "16,875 MB (17 GB)"
      retention_policy: "Soft delete after 30 days, hard delete after 60 days total (bounded growth)"
      recommendation: "Current database can support 3 years. Plan upgrade in year 2."

    vault_audit_log_growth:
      baseline_records: "50 million audit entries"
      average_record_size: "300 bytes (operation_id + user_id + timestamp + metadata)"
      baseline_table_size_mb: "15000 MB (15 GB)"
      retention_requirement: "90 days (GDPR) + 7 years for HIPAA (dual retention)"
      annual_storage_needs: "~100 GB"
      archival_strategy: "Compress after 90 days, move to S3 (long-term retention)"
      recommendation: "Archive monthly to S3, keep 90 days in hot storage."

    kms_key_count_forecast:
      baseline_customers: "100"
      keys_per_customer: "1 (shared within customer)"
      annual_new_customers: "50"
      total_keys_3_years: "250"
      aws_kms_key_limit: "10,000"
      recommendation: "No constraint. Plan key management strategy for 1000+ keys."

    database_compute_requirements:
      current_qps: "1000 queries/second"
      p95_latency_budget: "3 milliseconds"
      current_instance_type: "PostgreSQL R5.2xlarge (8 vCPU, 64 GB RAM)"
      projected_qps_3_years: "3000 qps (3× growth)"
      projected_instance_needed: "PostgreSQL R6.4xlarge (16 vCPU, 128 GB RAM)"
      upgrade_timeline: "Year 2 (mid-2027)"

  sla_compliance_measurement:
    measurement_method: "Prometheus time series + Grafana dashboards + automated alerting"
    data_collection: "Real-time metrics from K1 privacy service"
    reporting: "Monthly SLA report to customers (automated generation)"
    audit_trail: "All SLA violations logged and reviewed quarterly"
    continuous_improvement: "Post-mortems for any SLA violations"

  architecture:
    adr_references: ["ADR-0035c: Encrypted Vault & Performance Budgets"]
    metrics_infrastructure:
      prometheus: "Time series database (metrics storage)"
      grafana: "Visualization (dashboards, alerting)"
      alertmanager: "Alert routing (Slack, PagerDuty, email)"
      opentelemetry: "Distributed tracing (if needed for deep investigation)"

    parent_contracts:
      - "C_PRIVACY_VAULT_OPS_017: Vault operations"
      - "C_PRIVACY_VAULT_AUDIT_021: Audit trail"
      - "C_PRIVACY_BREACH_PROTECTION_020: Breach detection"

  notes: |
    PERFORMANCE MONITORING STRATEGY:

    Three-tier approach:

    1. BUDGETS (Hard Requirements):
    - Store < 2ms (p95)
    - Retrieve < 1ms (p95)
    - KMS < 100ms (p95)
    - If violated: Page on-call engineer, start incident

    2. SLAs (Customer Commitments):
    - 99.95% availability
    - < 3ms p95 latency (aggregate)
    - 100% encryption coverage
    - 100% audit trail integrity
    - If violated: Customer credit, incident escalation

    3. DASHBOARDS & ALERTS (Operational Visibility):
    - Real-time latency graphs
    - Throughput monitoring
    - Error rate tracking
    - Capacity planning
    - Auto-escalation on thresholds

    Key Principles:
    - Monitor at operation level (store, retrieve, delete separately)
    - Alert on budget violations early (before SLA violation)
    - Use percentiles (p95, p99) not averages (averages hide tail latency)
    - Include KMS overhead (cross-region network latency)
    - Plan capacity 6-12 months ahead (growth forecasting)
