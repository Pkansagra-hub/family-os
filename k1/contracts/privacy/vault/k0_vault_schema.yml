# Contract: K0 Vault Schema Definition
# Purpose: Comprehensive SQL schema for encrypted PII vault with performance optimization and GDPR compliance
# Source: ADR-0035c | Status: Production-Ready | Last Updated: 2025-10-16

contract:
  id: "C_PRIVACY_K0_VAULT_SCHEMA_016"
  name: "K0 Vault Schema Definition"
  version: "1.0.0"
  category: "Privacy & Security"
  owner: "K1 Privacy Team"

  strategic_context:
    purpose: "Define normalized SQL schema for storing encrypted PII values with audit trail and compliance support"
    design_goals:
      - "ACID compliance (transactions for data integrity)"
      - "Query performance (indexes for fast retrieval)"
      - "Compliance tracking (audit logging, soft delete for GDPR)"
      - "Key rotation support (track encryption key version)"
      - "Data lifecycle (automatic deletion after retention)"

  primary_table_pii_vault:
    table_name: "pii_vault"
    purpose: "Store encrypted PII values with metadata"

    create_table_statement: |
      CREATE TABLE pii_vault (
          vault_key TEXT PRIMARY KEY,
          encrypted_value BLOB NOT NULL,
          nonce BLOB NOT NULL,
          auth_tag BLOB NOT NULL,
          pii_type TEXT NOT NULL,
          user_id TEXT NOT NULL,
          space_id TEXT NOT NULL,
          trace_id TEXT NOT NULL,
          created_at INTEGER NOT NULL,
          accessed_at INTEGER,
          deleted_at INTEGER,
          encryption_key_id TEXT NOT NULL,
          metadata TEXT,

          CONSTRAINT vault_key_format CHECK (LENGTH(vault_key) > 0),
          CONSTRAINT pii_type_valid CHECK (pii_type IN ('ssn', 'email', 'phone', 'name', 'address', 'date_of_birth', 'credit_card', 'bank_account', 'passport', 'license', 'misc')),
          CONSTRAINT user_id_not_empty CHECK (LENGTH(user_id) > 0),
          CONSTRAINT space_id_not_empty CHECK (LENGTH(space_id) > 0),

          INDEX idx_user_space (user_id, space_id) WITH (fillfactor = 90),
          INDEX idx_pii_type (pii_type) WITH (fillfactor = 90),
          INDEX idx_deleted_at (deleted_at) WHERE deleted_at IS NULL WITH (fillfactor = 90),
          INDEX idx_created_at (created_at) WITH (fillfactor = 90),
          INDEX idx_accessed_at (accessed_at) WHERE accessed_at IS NOT NULL
      );

    column_definitions:
      vault_key:
        type: "TEXT PRIMARY KEY"
        size_bytes: 64
        format: "ssn_user001_abc123def456_1234567890"
        composition:
          - "PII type prefix (ssn|email|phone|etc, 10 bytes)"
          - "User ID (user001, 20 bytes)"
          - "UUID v4 (abc123def456, 36 bytes)"
          - "Timestamp (1234567890, 10 bytes)"
        purpose: "Unique identifier for vault entry"
        uniqueness: "Guaranteed (UUID + timestamp + user_id + type)"
        retrieval: "Direct access (primary key lookup)"
        performance: "O(log n) or O(1) depending on DB"

      encrypted_value:
        type: "BLOB NOT NULL"
        size_bytes_min: 20
        size_bytes_max: 500
        size_bytes_typical: 50
        format: "Base64-encoded AES-256-GCM ciphertext"
        compression: "Not recommended (increases vulnerability window)"
        purpose: "Encrypted PII value (confidentiality)"
        indexing: "Not indexed (too large)"

      nonce:
        type: "BLOB NOT NULL"
        size_bytes: 12
        format: "96-bit cryptographically random value"
        encoding: "Base64 in database"
        purpose: "Unique per encryption (prevents replay attacks)"
        constraint: "Never reuse (nonce, key) pair"
        note: "Critical for GCM security"

      auth_tag:
        type: "BLOB NOT NULL"
        size_bytes: 16
        format: "128-bit GHASH authentication tag"
        encoding: "Base64 in database"
        purpose: "Validates ciphertext integrity (authenticity)"
        validation: "Must match computed tag during decryption"
        safety: "Reject ciphertext if tag doesn't match"

      pii_type:
        type: "TEXT NOT NULL"
        allowed_values:
          - "ssn: Social Security Number (11 chars: 123-45-6789)"
          - "email: Email address (typical 30 chars: john.smith@example.com)"
          - "phone: Phone number (12 chars: +1-234-567-8900)"
          - "name: Full name (50 chars: John Michael Smith Jr.)"
          - "address: Mailing address (200 chars: 123 Main St, Springfield, IL 62701)"
          - "date_of_birth: DOB (10 chars: 1985-03-15)"
          - "credit_card: Card number (19 chars: 4532-1234-5678-9010)"
          - "bank_account: Account number (20 chars: 123456789012345678)"
          - "passport: Passport number (15 chars: A12345678)"
          - "license: Driver license (15 chars: AB123456)"
          - "misc: Other PII (uncategorized)"
        index: "Yes (frequent queries)"
        performance_usage: "Filter by entity type for compliance reports"

      user_id:
        type: "TEXT NOT NULL"
        size_bytes: 36
        format: "UUID of user who owns PII"
        purpose: "Access control (user can only retrieve own PII)"
        index: "Yes (combined with space_id)"
        constraint: "NOT NULL, non-empty"
        privacy_note: "PII belongs to this user (GDPR data subject)"

      space_id:
        type: "TEXT NOT NULL"
        size_bytes: 36
        format: "UUID of space where PII detected"
        purpose: "Isolation (PII isolated per space for multi-tenancy)"
        index: "Yes (combined with user_id)"
        constraint: "NOT NULL, non-empty"

      trace_id:
        type: "TEXT NOT NULL"
        size_bytes: 36
        format: "UUID of cognitive trace"
        purpose: "Debugging and audit trail (link vault operation to original request)"
        performance_usage: "Query logs for specific trace"
        index: "No (rarely queried directly)"

      created_at:
        type: "INTEGER NOT NULL"
        unit: "Unix timestamp (milliseconds)"
        range: "0 to 2^63-1"
        example: "1697486565000 (Oct 16, 2025 14:22:45 UTC)"
        purpose: "When PII was first vaulted"
        index: "Yes (retention policy relies on this)"
        retention_query: "SELECT * FROM pii_vault WHERE created_at < (NOW() - 90 days)"

      accessed_at:
        type: "INTEGER"
        unit: "Unix timestamp (milliseconds)"
        default: "NULL"
        update_on: "Every retrieval of PII from vault"
        purpose: "Audit trail (when was PII last accessed)"
        privacy_usage: "Detect unauthorized access patterns"
        index: "Yes (sparse index on non-NULL values)"

      deleted_at:
        type: "INTEGER"
        unit: "Unix timestamp (milliseconds)"
        default: "NULL"
        value: "Timestamp when user requested deletion"
        purpose: "Soft delete (GDPR right to erasure)"
        lifecycle:
          step_1_user_request: "User requests PII deletion"
          step_2_soft_delete: "Set deleted_at = NOW(), don't actually delete"
          step_3_grace_period: "Keep in database for 30 days (audit trail, accidental deletion recovery)"
          step_4_hard_delete: "After 30 days, run hard delete job to permanently remove"
        query_soft_delete: "SELECT * FROM pii_vault WHERE deleted_at IS NULL (excludes soft-deleted)"
        query_grace_period: "SELECT * FROM pii_vault WHERE deleted_at IS NOT NULL AND deleted_at > (NOW() - 30 days)"
        query_hard_delete: "DELETE FROM pii_vault WHERE deleted_at IS NOT NULL AND deleted_at < (NOW() - 30 days)"
        index: "Yes (sparse index on non-NULL for efficiency)"

      encryption_key_id:
        type: "TEXT NOT NULL"
        format: "AWS KMS key ARN (arn:aws:kms:us-east-1:ACCOUNT:key/KEY_ID)"
        size_bytes: 120
        purpose: "Track which KMS master key encrypted this PII"
        usage: "Support key rotation (different old/new ciphertexts use different keys)"
        constraint: "Must reference valid KMS key"
        auditing: "Key compromise analysis (find all PII encrypted with compromised key)"

      metadata:
        type: "TEXT (JSON)"
        format: |
          {
            "confidence_score": 0.99,
            "detection_method": "ml_ner",
            "entity_type": "PII",
            "source_document": "contract_001.pdf",
            "custom_tags": ["confidential", "pii"]
          }
        purpose: "Optional metadata for compliance and debugging"
        optional: "Yes (can be NULL)"
        index: "No (JSON queries slow on large tables)"

  secondary_table_vault_audit_log:
    table_name: "vault_audit_log"
    purpose: "Complete audit trail of all vault operations for HIPAA/GDPR compliance"

    create_table_statement: |
      CREATE TABLE vault_audit_log (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          operation TEXT NOT NULL,
          vault_key TEXT NOT NULL,
          user_id TEXT NOT NULL,
          space_id TEXT NOT NULL,
          trace_id TEXT NOT NULL,
          timestamp INTEGER NOT NULL,
          success BOOLEAN NOT NULL,
          error_message TEXT,
          ip_address TEXT,
          session_id TEXT,

          CONSTRAINT operation_valid CHECK (operation IN ('store', 'retrieve', 'delete', 'hard_delete')),
          CONSTRAINT success_boolean CHECK (success IN (0, 1)),

          INDEX idx_user_id (user_id),
          INDEX idx_timestamp (timestamp),
          INDEX idx_operation (operation),
          INDEX idx_vault_key (vault_key),
          INDEX idx_trace_id (trace_id)
      );

    column_definitions:
      id:
        type: "INTEGER PRIMARY KEY AUTOINCREMENT"
        purpose: "Unique log entry identifier"
        range: "1 to 2^63-1"

      operation:
        type: "TEXT NOT NULL"
        allowed_values:
          - "store: PII encrypted and stored in vault"
          - "retrieve: PII retrieved and decrypted from vault"
          - "delete: PII marked as deleted (soft delete)"
          - "hard_delete: PII permanently removed (hard delete)"
        purpose: "Track what happened"

      vault_key:
        type: "TEXT NOT NULL"
        foreign_key_reference: "pii_vault(vault_key)"
        purpose: "Link to vault entry"

      user_id:
        type: "TEXT NOT NULL"
        purpose: "Who performed the operation (audit trail)"

      space_id:
        type: "TEXT NOT NULL"
        purpose: "Which space was affected"

      trace_id:
        type: "TEXT NOT NULL"
        purpose: "Link operation to original request (request tracing)"

      timestamp:
        type: "INTEGER NOT NULL"
        unit: "Unix timestamp (milliseconds)"
        purpose: "When operation occurred (timeline)"
        index: "Yes (temporal queries)"

      success:
        type: "BOOLEAN NOT NULL"
        values: [true, false]
        purpose: "Did operation succeed"
        false_reason: "Authorization failed, network error, key not available, etc"

      error_message:
        type: "TEXT"
        nullable: "Yes (NULL if success=true)"
        example: "User user002 does not own PII vault_key_abc123"
        purpose: "Why operation failed (debugging)"

      ip_address:
        type: "TEXT"
        example: "203.0.113.45"
        nullable: "Yes (optional)"
        purpose: "Source IP (anomaly detection)"

      session_id:
        type: "TEXT"
        nullable: "Yes (optional)"
        purpose: "Link operations from same user session"

  indexing_strategy:
    index_user_space_composite:
      columns: "[user_id, space_id]"
      table: "pii_vault"
      type: "Composite B-tree"
      fill_factor: 90
      purpose: "Fast lookup of user's PII in specific space"
      query_example: "SELECT * FROM pii_vault WHERE user_id = 'user001' AND space_id = 'space001'"
      expected_rows: "~1000 per user per space"
      performance: "< 1ms"

    index_pii_type:
      columns: "[pii_type]"
      table: "pii_vault"
      type: "B-tree"
      fill_factor: 90
      purpose: "Find all entries of specific PII type (SSN, email, etc)"
      query_example: "SELECT * FROM pii_vault WHERE pii_type = 'ssn'"
      use_case: "Compliance reports, mass deletion (if specific PII type compromised)"
      expected_rows: "~2000 per type"
      performance: "< 5ms"

    index_deleted_at_sparse:
      columns: "[deleted_at]"
      table: "pii_vault"
      type: "Sparse B-tree (only non-NULL values indexed)"
      purpose: "Efficient hard delete maintenance (find expired soft deletes)"
      query_example: "DELETE FROM pii_vault WHERE deleted_at < (NOW() - 30 days)"
      maintenance_frequency: "Daily cron job"
      expected_rows: "~10 per day (0.1% deletion rate)"
      performance: "< 1ms"

    index_created_at:
      columns: "[created_at]"
      table: "pii_vault"
      type: "B-tree"
      purpose: "Retention policy queries"
      query_example: "SELECT COUNT(*) FROM pii_vault WHERE created_at > (NOW() - 90 days)"
      maintenance_frequency: "Daily metrics calculation"
      expected_rows: "All entries (full table scan required)"
      performance: "~100ms for 10K entries"

  constraints_and_validation:
    primary_key_constraint:
      column: "vault_key"
      type: "TEXT"
      enforcement: "Database level"
      benefit: "Prevents duplicate PII storage"

    not_null_constraints:
      - "encrypted_value: Encrypted data required"
      - "nonce: AES-256-GCM nonce required"
      - "auth_tag: Authentication tag required"
      - "pii_type: PII type must be specified"
      - "user_id: User must own PII"
      - "space_id: Space must be specified"
      - "trace_id: Trace ID for auditing"
      - "created_at: Creation timestamp required"
      - "encryption_key_id: KMS key ID required"

    check_constraints:
      pii_type_valid:
        constraint: "pii_type IN ('ssn', 'email', 'phone', 'name', ...)"
        enforcement: "Reject invalid PII types"
      operation_valid:
        constraint: "operation IN ('store', 'retrieve', 'delete', 'hard_delete')"
        table: "vault_audit_log"

    timestamp_constraints:
      created_at: "Must be <= NOW()"
      accessed_at: "Must be >= created_at (if set)"
      deleted_at: "Must be >= created_at (if set)"

  data_lifecycle_and_retention:
    retention_policy:
      default_retention_days: 90
      policy_rationale: "Balance GDPR compliance (user can delete anytime) with operational needs"

    creation_flow:
      step_1: "Detect PII (regex or ML)"
      step_2: "Encrypt with AES-256-GCM"
      step_3: "INSERT into pii_vault (deleted_at = NULL)"
      step_4: "Log to vault_audit_log (operation = 'store')"

    access_flow:
      step_1: "User requests PII retrieval"
      step_2: "Query: SELECT * FROM pii_vault WHERE vault_key = ? AND deleted_at IS NULL"
      step_3: "Decrypt with AWS KMS"
      step_4: "UPDATE pii_vault SET accessed_at = NOW()"
      step_5: "Log to vault_audit_log (operation = 'retrieve')"

    soft_delete_flow_gdpr_right_to_erasure:
      step_1: "User requests deletion (right to erasure)"
      step_2: "UPDATE pii_vault SET deleted_at = NOW() WHERE vault_key = ?"
      step_3: "Log to vault_audit_log (operation = 'delete')"
      step_4: "PII hidden from queries (deleted_at IS NULL filter)"
      step_5: "Grace period: 30 days (user can recover accidentally deleted PII)"

    hard_delete_flow:
      step_1: "Daily maintenance job: Find expired soft deletes"
      step_2: "Query: SELECT * FROM pii_vault WHERE deleted_at < (NOW() - 30 days)"
      step_3: "DELETE rows (permanent removal)"
      step_4: "Log to vault_audit_log (operation = 'hard_delete')"
      step_5: "PII completely removed from database"

    auto_retention_expiration:
      step_1: "Daily job: Find old PII (created_at > 90 days ago)"
      step_2: "Optional: Auto soft-delete old PII (retention policy)"
      step_3: "Query: UPDATE pii_vault SET deleted_at = NOW() WHERE created_at < (NOW() - 90 days)"
      step_4: "Note: This is optional (K1 may choose to keep indefinitely)"

  storage_capacity_analysis:
    size_per_entry:
      vault_key_text: 64
      encrypted_value_avg: 50
      nonce_blob: 16
      auth_tag_blob: 16
      pii_type_text: 20
      user_id_text: 36
      space_id_text: 36
      trace_id_text: 36
      created_at_int: 8
      accessed_at_int: 8
      deleted_at_int: 8
      encryption_key_id_text: 120
      metadata_json: 100
      database_overhead: 50
      index_overhead: 60
      total_bytes_per_entry: 628

    vault_capacity:
      estimated_pii_values_per_user: 100
      estimated_users: 1000
      total_pii_values: 100000
      total_storage_gb: "100K × 628 bytes / 1GB = 0.06 GB (60 MB)"
      conclusion: "Very compact (6 PII entries per KB)"

    audit_log_capacity:
      operations_per_pii_value: 3
      total_audit_log_entries: 300000
      bytes_per_audit_entry: 400
      total_audit_log_gb: "300K × 400 bytes / 1GB = 0.12 GB (120 MB)"
      conclusion: "Audit log ~2× size of vault table"

  performance_characteristics:
    operation_store:
      description: "Encrypt and store PII in vault"
      steps:
        - "INSERT into pii_vault: 2ms"
        - "INSERT into vault_audit_log: 0.5ms"
      total_latency_ms: 2.5
      budget_ms: 5
      margin_percent: 50

    operation_retrieve:
      description: "Retrieve and decrypt PII from vault"
      steps:
        - "SELECT from pii_vault by vault_key (primary key): 0.5ms"
        - "AWS KMS Decrypt: 50ms (network + HSM)"
        - "AES-256-GCM Decrypt: 0.9ms"
        - "UPDATE accessed_at: 1.5ms"
        - "INSERT into vault_audit_log: 0.5ms"
      total_latency_ms: 53.4
      budget_ms: 200
      margin_percent: 73.3

    query_by_user_space:
      query: "SELECT * FROM pii_vault WHERE user_id = ? AND space_id = ? AND deleted_at IS NULL"
      index_used: "idx_user_space"
      expected_rows: 1000
      latency_ms: 5

    query_count_by_pii_type:
      query: "SELECT COUNT(*) FROM pii_vault WHERE pii_type = ? AND deleted_at IS NULL"
      index_used: "idx_pii_type"
      latency_ms: 10

    query_hard_delete_maintenance:
      query: "DELETE FROM pii_vault WHERE deleted_at IS NOT NULL AND deleted_at < (NOW() - 30 days)"
      frequency: "Daily maintenance job"
      expected_deleted_rows: 10
      latency_ms: 5

  compliance_and_features:
    gdpr_compliance:
      right_to_erasure: "Soft delete (deleted_at = NOW()), hard delete after 30 days"
      right_to_access: "User can retrieve own PII from vault (with authorization)"
      data_residency: "Can be deployed in EU (eu-west-1 region)"
      audit_trail: "vault_audit_log tracks all access"

    hipaa_compliance:
      audit_logging: "vault_audit_log logs all PHI access (medical PII)"
      access_control: "User can only access own PII (user_id check)"
      encryption_at_rest: "AES-256-GCM encryption"
      retention: "Custom retention policy supported"

    soc_2_compliance:
      change_management: "Indexed by created_at for audit trail"
      access_logging: "vault_audit_log comprehensive"
      retention_policy: "Configurable via deleted_at maintenance"

  migration_and_evolution:
    schema_version: "1.0.0"
    migration_strategy: "Backward compatible (add new columns as nullable)"
    future_versions:
      v1_1: "Add full_text_search index on metadata (JSON)"
      v1_2: "Partition by created_at (large dataset optimization)"
      v1_3: "Archive audit_log to cold storage (retention optimization)"

  architecture:
    adr_references: ["ADR-0035c: Encrypted Vault & Key Management"]
    parent_contracts:
      - "C_PRIVACY_AES256GCM_ENCRYPTION_014"
      - "C_PRIVACY_AWS_KMS_KEY_MGMT_015"
    downstream_usage:
      - "Vault operations (store/retrieve/delete)"
      - "Audit compliance reports"
      - "Data retention automation"
    database_system: "SQLite, PostgreSQL, or MySQL (ACID-compliant)"

  notes: |
    Schema design emphasizes:
    1. Encryption: All PII encrypted (ciphertext, nonce, auth_tag)
    2. Auditability: Complete audit trail (vault_audit_log table)
    3. GDPR compliance: Soft delete (deleted_at) enables right to erasure
    4. Performance: Composite indexes on frequent queries (user_space)
    5. Maintainability: Automated hard delete job cleans up soft-deleted entries

    Index strategy balances query performance with storage overhead.
    Soft delete + grace period enables accidental deletion recovery.
    All timestamps in milliseconds (not seconds) for precise auditing.

    Design principle: Never delete immediately (audit trail must survive).
    Use soft delete (deleted_at) with 30-day grace period before hard delete.
