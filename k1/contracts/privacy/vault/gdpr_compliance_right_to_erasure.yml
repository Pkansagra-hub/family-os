# Contract: GDPR Compliance - Right to Erasure (Article 17)
# Purpose: Implement GDPR Article 17 right to erasure with soft delete (30-day grace), hard delete, recovery procedures, and user notifications
# Source: ADR-0035d | Status: Production-Ready | Last Updated: 2025-10-16

contract:
  id: "C_PRIVACY_GDPR_ERASURE_018"
  name: "GDPR Compliance - Right to Erasure (Article 17)"
  version: "1.0.0"
  category: "Privacy & Compliance"
  owner: "K1 Legal & Privacy Team"

  statutory_requirement: "GDPR Article 17 - Right to Erasure"
  statutory_deadline: "30 days from request"
  enforcement: "GDPR Article 17 | GDPR Article 3 (territorial scope) | CCPA Section 1102"

  right_to_erasure_definition: |
    "The data subject shall have the right to obtain from the controller the erasure
    of personal data concerning him or her without undue delay and the controller shall
    have the obligation to erase personal data without undue delay where:

    (a) the personal data are no longer necessary in relation to the purposes for which
        they were collected or otherwise processed;
    (b) the data subject withdraws consent on which the processing is based;
    (c) the data subject objects to processing and there are no overriding legitimate
        interests for the processing;
    (d) the personal data have been unlawfully processed;
    (e) the personal data have to be erased for compliance with a legal obligation."

  controller_obligations:
    - "Erase all personal data within 30 days (hard requirement)"
    - "Communicate erasure confirmation to data subjects"
    - "Communicate to data processors (third parties) if applicable"
    - "Document erasure action in audit trail (GDPR compliance)"
    - "Retain erasure proof for 6+ years (regulatory audit requirement)"

  exceptions_to_erasure:
    exception_1_freedom_of_expression:
      article: "GDPR Article 17(3)(a)"
      condition: "Data necessary for exercise of freedom of expression and information"
      action: "Refuse erasure, document reason in audit trail"

    exception_2_legal_obligation:
      article: "GDPR Article 17(3)(b)"
      condition: "Data retention required by law (e.g., accounting records 7 years)"
      action: "Retain data, separate from other processing, mark as 'restricted'"

    exception_3_public_interest:
      article: "GDPR Article 17(3)(c)"
      condition: "Data archived for public interest (e.g., historical research)"
      action: "Retain data, separate from active processing, limit access"

    exception_4_legal_claims:
      article: "GDPR Article 17(3)(e)"
      condition: "Data retention necessary for establishment/exercise of legal claims"
      action: "Retain during litigation, erase after claim resolved"

  erasure_workflow:
    phase_1_request_receipt:
      timeline: "Immediate (< 1 minute)"
      description: "Data subject submits erasure request via K1 API or web portal"

      request_format: |
        POST /api/v1/users/{user_id}/erasure-request
        {
          "reason": "GDPR Article 17 - Right to Erasure",
          "user_provided_reason": "I no longer want to use the service",
          "request_id": "erase_user123_1697486565000",
          "timestamp": 1697486565000,
          "verified_identity": true
        }

      validation: |
        1. User authentication verified (MFA if required)
        2. Request captured with timestamp
        3. Request ID generated (for tracking)
        4. Confirmation email sent to user

      audit_log_entry: |
        Operation: ERASURE_REQUEST_RECEIVED
        User: user123
        Timestamp: 1697486565000
        Request ID: erase_user123_1697486565000
        Status: PENDING_VERIFICATION

    phase_2_identity_verification:
      timeline: "1-3 minutes"
      description: "Verify user identity and authorization for erasure"

      verification_steps: |
        1. Check if user is authenticated (Session valid)
        2. Match request_id with user_id
        3. Verify no legal holds on account
        4. Check for active litigation

      verification_result_accept: |
        - Identity verified
        - No legal/compliance exceptions
        - Proceed to Phase 3 (soft delete)

      verification_result_reject: |
        - Identity not verified → Request denial + user notification
        - Legal hold found → Send notification of hold duration
        - Active litigation → Notify user of legal claim deadline

      audit_log_entry: |
        Operation: ERASURE_IDENTITY_VERIFIED
        User: user123
        Request ID: erase_user123_1697486565000
        Verification Result: APPROVED/REJECTED
        Exception: [NONE | LEGAL_HOLD | LITIGATION | NOT_AUTHENTICATED]

    phase_3_soft_delete_grace_period:
      timeline: "3 minutes - 30 days"
      description: "Mark data as deleted but retain for 30-day recovery grace period"

      soft_delete_operation: |
        1. Query K0 vault for all user data (SELECT * FROM pii_vault WHERE user_id = 'user123')
        2. For each PII record:
           - SET is_deleted = TRUE
           - SET deleted_at = [current_timestamp]
           - SET deletion_grace_period_expires = [current_timestamp + 30 days]
           - Keep encrypted_value (don't decrypt or destroy)
        3. Log soft delete in vault_audit_log table
        4. DO NOT delete from database yet (grace period active)

      soft_delete_sql: |
        UPDATE pii_vault
        SET
          is_deleted = TRUE,
          deleted_at = ?,
          deletion_grace_period_expires = ? + INTERVAL 30 DAY,
          deletion_grace_period_active = TRUE
        WHERE
          user_id = ?
          AND is_deleted = FALSE
        RETURNING vault_key, pii_type, encrypted_value

      recovery_during_grace_period: |
        If user reactivates account within 30 days:
        1. Query vault for is_deleted = TRUE records
        2. FOR EACH record:
           - SET is_deleted = FALSE
           - SET deleted_at = NULL
           - SET deletion_grace_period_expires = NULL
           - Decrypt to verify data integrity
        3. Log recovery action in audit_trail
        4. Send confirmation to user

      audit_log_entry: |
        Operation: SOFT_DELETE_INITIATED
        User: user123
        Request ID: erase_user123_1697486565000
        Soft Delete ID: softdel_user123_123abc
        Records Marked: 47
        Grace Period Expires: 1699910565000  // 30 days later
        Can Still Be Recovered: YES (until grace expires)

    phase_4_user_notification_soft_delete:
      timeline: "3-5 minutes after soft delete"
      description: "Notify user of erasure request acceptance and grace period"

      notification_email: |
        Subject: Your Data Erasure Request Confirmation - 30-Day Grace Period

        Dear [User Name],

        Thank you for requesting erasure of your personal data under GDPR Article 17
        (Right to Erasure). We have confirmed your identity and initiated the erasure process.

        WHAT HAPPENS NOW:
        ✓ Your personal data has been marked for deletion
        ✓ Your data is encrypted and inaccessible
        ✓ 30-day grace period in effect (can recover if you change your mind)
        ✓ Final deletion occurs on: [date]

        YOUR OPTIONS DURING GRACE PERIOD:
        If you change your mind within 30 days:
        1. Log in to your account
        2. Click "Undo Erasure Request"
        3. Your data will be recovered and fully accessible

        WHAT IS BEING DELETED:
        - Contact information (email, phone)
        - Personal identifiers (SSN, date of birth)
        - Profile data (name, address)
        - Activity logs (last 90 days)

        NOT DELETED (Legal Requirement):
        - Transaction history (required by law for 7 years)
        - Tax and accounting records (required for 7 years)

        Questions? Contact us at privacy@company.com

        Best regards,
        K1 Privacy Team

      notification_channels: ["Email", "In-app notification", "SMS (optional)"]

    phase_5_hard_delete_after_grace_period:
      timeline: "30 days after soft delete"
      description: "Permanently delete all soft-deleted PII after 30-day grace expires"

      hard_delete_trigger: "Automated batch job runs daily, checks grace period expiry"

      hard_delete_operation: |
        DAILY BATCH JOB: Delete-Expired-Grace-Periods

        1. Query vault_audit_log for soft deletes where
           deletion_grace_period_expires <= NOW()
           AND hard_delete_initiated = FALSE

        2. FOR EACH expired soft delete:
           A. Query K0: SELECT * FROM pii_vault
              WHERE user_id = ?
              AND is_deleted = TRUE
              AND deleted_at <= (NOW - 30 days)

           B. FOR EACH record:
              - DECRYPT ciphertext (verify key still accessible)
              - SECURELY ERASE plaintext from memory (use secure_erase function)
              - DELETE FROM pii_vault WHERE vault_key = ?
              - Log deletion: hard_delete_id, vault_key, encryption_key_id

           C. Update audit_log:
              - SET hard_delete_initiated = TRUE
              - SET hard_delete_completed_at = NOW()
              - SET records_permanently_deleted = [count]

      secure_erase_implementation: |
        def secure_erase(plaintext_pii: str):
          """Securely erase plaintext PII from memory"""
          # Overwrite memory with random data (3 passes)
          random_data = os.urandom(len(plaintext_pii))
          plaintext_pii[:] = random_data
          del plaintext_pii
          # Force garbage collection
          gc.collect()

      hard_delete_sql: |
        DELETE FROM pii_vault
        WHERE
          user_id = ?
          AND is_deleted = TRUE
          AND deleted_at <= DATE_SUB(NOW(), INTERVAL 30 DAY)
        RETURNING vault_key, pii_type, encryption_key_id

      audit_log_entry: |
        Operation: HARD_DELETE_COMPLETED
        User: user123
        Soft Delete ID: softdel_user123_123abc
        Hard Delete ID: harddel_user123_123def
        Records Permanently Deleted: 47
        Deleted At: 1700515365000  // Timestamp of deletion
        Cannot Be Recovered: TRUE
        Encrypted Keys Destroyed: 47

    phase_6_final_notification_hard_delete:
      timeline: "Immediately after hard delete (auto-sent within 1 hour)"
      description: "Final notification that erasure is complete and data cannot be recovered"

      notification_email: |
        Subject: Your Data Has Been Permanently Deleted

        Dear [User Name],

        This confirms that your personal data has been permanently deleted as of [date/time].

        WHAT WAS DELETED:
        - 47 personal data records
        - 47 encrypted vault entries
        - All associated activity logs

        PERMANENT DELETION:
        Your data cannot be recovered. It has been:
        ✓ Removed from our database
        ✓ Encrypted keys destroyed
        ✓ No backups retain this data

        RETAINED DATA (Legal Requirement):
        As required by law, we retain:
        - Tax/accounting records (7 years)
        - Payment history (7 years, for dispute resolution)

        WHAT HAPPENS NEXT:
        - Your account remains closed
        - You can request new account (fresh start)
        - We've deleted your account from marketing lists

        Questions? Contact privacy@company.com

        Best regards,
        K1 Privacy Team

      audit_log_entry: |
        Operation: HARD_DELETE_NOTIFICATION_SENT
        User: user123
        Hard Delete ID: harddel_user123_123def
        Notification Status: SENT
        Notification Timestamp: 1700515365000

  exception_handling:
    exception_1_legal_hold:
      scenario: "User requests erasure, but legal hold is active (litigation)"
      action: |
        1. Verify legal hold status
        2. Send user notification: "Erasure delayed due to legal hold"
        3. Send legal team notification: "Erasure request received, holding until [date]"
        4. Schedule automated erasure for [legal hold expiry date + 1 day]

      audit_trail: |
        Operation: ERASURE_REQUEST_LEGAL_HOLD
        User: user123
        Legal Hold Expires: [date]
        Scheduled Erasure: [date + 1 day]

    exception_2_active_transaction:
      scenario: "User requests erasure, but has active or pending transaction"
      action: |
        1. Check for active transactions (payment processing)
        2. If transaction active: Deny erasure, send notification
        3. If transaction pending: Queue for erasure after transaction settles
        4. Timeout: Auto-process erasure after 24 hours (transaction assumed failed)

    exception_3_backup_data:
      scenario: "User data exists in backup system"
      action: |
        1. Identify all backup copies (K0 primary, K0 replicas, S3 backups)
        2. Mark for deletion in all backup systems
        3. Schedule hard delete after backup retention window (typically 30 days)
        4. Verify deletion in all locations before completing erasure request

    exception_4_third_party_processors:
      scenario: "User data shared with third parties (data processors)"
      action: |
        1. Query data_processor_log for all third parties with user data
        2. Generate erasure notification for each processor
        3. Send API call to processor: DELETE /users/{user_id}
        4. Track processor responses (timeout = 24 hours)
        5. Escalate if processor doesn't confirm deletion

  performance_budgets:
    request_receipt: "< 1 second"
    identity_verification: "< 3 seconds"
    soft_delete: "< 5 seconds"
    soft_delete_notification: "< 2 minutes (email delivery)"
    hard_delete_batch_job: "< 5 seconds per 1000 records"
    hard_delete_notification: "< 5 minutes after batch"

  compliance_validation:
    gdpr_article_17_checklist: |
      ✓ Erasure request received and timestamped
      ✓ User identity verified
      ✓ Erasure exceptions checked (legal hold, litigation, retention)
      ✓ All user PII identified (K0 vault query)
      ✓ Soft delete executed (30-day grace period)
      ✓ User notified within 30 days
      ✓ Hard delete executed after grace period
      ✓ User notified of permanent deletion
      ✓ Audit trail documented (for regulatory inspection)
      ✓ Third parties notified (if applicable)
      ✓ Backup systems cleared (if applicable)

    metrics_for_compliance: |
      - Erasure request response time: [average, P95, P99]
      - Soft delete completion time: [average, P95, P99]
      - Grace period recovery rate: [%]
      - Hard delete completion time: [average, P95, P99]
      - User notification delivery rate: [%]
      - Exception handling rate: [%]
      - Compliance violation rate: [0.00%]

  audit_trail_queries:
    query_1_erasure_requests_by_user:
      sql: |
        SELECT * FROM vault_audit_log
        WHERE operation IN ('ERASURE_REQUEST_RECEIVED', 'ERASURE_IDENTITY_VERIFIED',
                           'SOFT_DELETE_INITIATED', 'HARD_DELETE_COMPLETED')
        AND user_id = ?
        ORDER BY timestamp DESC
      query_purpose: "Verify user's erasure history for GDPR data subject request"

    query_2_pending_deletions:
      sql: |
        SELECT user_id, deleted_at, deletion_grace_period_expires, COUNT(*) as record_count
        FROM pii_vault
        WHERE is_deleted = TRUE
        AND hard_delete_initiated = FALSE
        AND deletion_grace_period_expires > NOW()
        GROUP BY user_id
        ORDER BY deletion_grace_period_expires ASC
      query_purpose: "Monitor pending hard deletes for audit purposes"

    query_3_hard_delete_history:
      sql: |
        SELECT * FROM vault_audit_log
        WHERE operation = 'HARD_DELETE_COMPLETED'
        AND hard_delete_completed_at >= DATE_SUB(NOW(), INTERVAL 90 DAY)
        ORDER BY hard_delete_completed_at DESC
      query_purpose: "Track all permanent deletions for compliance audit (GDPR Article 32 documentation)"

  testing_strategy:
    test_1_happy_path:
      steps: |
        1. User requests erasure
        2. Identity verified
        3. Soft delete executed
        4. User notified (soft delete)
        5. Wait 30 days
        6. Hard delete batch job runs
        7. User notified (final deletion)
      expected_result: "All user data permanently deleted"

    test_2_grace_period_recovery:
      steps: |
        1. User requests erasure
        2. Soft delete executed
        3. User recovers within grace period (undo request)
        4. Data marked undeleted
        5. User can access data normally
      expected_result: "Data fully recovered, timestamps updated"

    test_3_legal_hold_exception:
      steps: |
        1. User requests erasure
        2. Legal hold active (detected during verification)
        3. Erasure denied, user notified
        4. Scheduled erasure for hold expiry
        5. Automatic hard delete after hold expires
      expected_result: "Erasure deferred until legal hold expires"

    test_4_third_party_notification:
      steps: |
        1. User data shared with processor A, B, C
        2. User requests erasure
        3. Soft delete in primary system
        4. Erasure notifications sent to processors A, B, C
        5. Processors confirm deletion
        6. Hard delete executed
      expected_result: "All processors notified and data deleted"

  compliance_mapping:
    gdpr_articles:
      article_17: "Right to Erasure (core implementation)"
      article_12: "Transparent information (notification)"
      article_13: "Information to be provided (what data deleted)"
      article_14: "Information if data not collected directly (notification)"
      article_15: "Right of access (show user what was deleted)"
      article_32: "Security (documentation, audit trail, encryption)"

    gdpr_recitals:
      recital_65: "Right to erasure (strikethrough approach)"
      recital_75: "Transparent processing"

  integration_dependencies:
    k0_database: "pii_vault table, soft/hard delete support"
    aws_kms: "Key management for encrypted data"
    notification_service: "Email delivery"
    audit_system: "vault_audit_log table"
    legal_hold_system: "Check for active legal holds"
    data_processor_registry: "Notify third-party processors"
    backup_system: "Coordinate backup deletion"

  architecture:
    adr_references: ["ADR-0035d: GDPR Compliance & Audit Trail"]
    parent_contracts:
      - "C_PRIVACY_VAULT_OPS_017: Vault operations (delete functionality)"
      - "C_PRIVACY_VAULT_AUDIT_021: Audit trail"
      - "C_PRIVACY_BREACH_PROTECTION_020: Security during deletion"
    related_contracts:
      - "C_PRIVACY_GDPR_ACCESS_REQUEST: Right to access (Article 15)"
      - "C_PRIVACY_BREACH_NOTIFICATION: Notification requirements"

  notes: |
    GDPR Article 17 implementation with 30-day grace period:

    TWO-PHASE DELETION APPROACH:

    Phase 1: Soft Delete (0-30 days)
    - Data marked as deleted but retained in database
    - Encrypted values not destroyed (kept for recovery)
    - User notified of grace period
    - User can undo if changes mind
    - Audit trail documents soft delete

    Phase 2: Hard Delete (30+ days)
    - Automated batch job processes expired grace periods
    - Plaintext PII securely erased from memory
    - Vault records permanently deleted from database
    - Encryption keys destroyed
    - User notified of final deletion
    - Cannot be reversed

    EXCEPTIONS TO ERASURE:
    - Legal hold (litigation) - defer until hold expires
    - Retention requirement (tax records, 7 years) - separate and restrict
    - Freedom of expression (public interest) - retain but restrict
    - Legal claims (potential lawsuits) - retain until claim resolved

    COMPLIANCE REQUIREMENT:
    - 30-day response deadline per GDPR Article 17
    - Notification to user within deadline
    - Notification to processors (if applicable)
    - Documentation for regulatory audit
    - Erasure proof retained for 6+ years
