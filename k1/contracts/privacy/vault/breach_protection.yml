# Contract: Vault Breach Protection (3-Layer Defense)
# Purpose: Comprehensive 3-layer defense strategy for PII vault with threat scenarios, mitigations, recovery procedures, and incident response
# Source: ADR-0035c | Status: Production-Ready | Last Updated: 2025-10-16

contract:
  id: "C_PRIVACY_BREACH_PROTECTION_020"
  name: "Vault Breach Protection (3-Layer Defense)"
  version: "1.0.0"
  category: "Privacy & Security"
  owner: "K1 Privacy Team"

  strategic_context:
    purpose: "Implement defense-in-depth with 3 independent security layers to protect PII: (1) SessionState redaction (application layer), (2) K0 vault encryption (database layer), (3) AWS KMS key protection (HSM layer). If one layer is compromised, others remain secure."
    design_principle:
      - "No single point of failure for PII protection"
      - "If Layer 1 breached: Attacker sees redacted placeholders only"
      - "If Layer 2 breached: Attacker sees encrypted values (key in HSM)"
      - "If Layer 3 breached: Assume full compromise, initiate key rotation and incident response"
    threat_model: "Assume any component can be compromised; design for defense in depth"

  defense_architecture:
    layer_1_sessionstate_redaction:
      name: "Application Layer - SessionState Redaction"
      location: "K1 SessionState (in-memory, ephemeral)"
      content: "Redacted placeholders only ([SSN], [EMAIL], [CREDIT_CARD], etc.)"
      encryption: "Optional in-memory encryption (not required, redaction sufficient)"
      lifetime: "Session duration (typically 1-24 hours)"
      breach_impact: "LOW - No PII exposed (only placeholders)"

      storage_format: |
        Before redaction:
        - User message: "My SSN is 123-45-6789"

        After redaction:
        - SessionState: "My SSN is [SSN]"
        - Vault reference: vault_key = "ssn_user123_abc123_1697486565000"

      protection_mechanism: |
        If K1 process memory dumped (attacker has root access):
        - Attacker sees: "My SSN is [SSN]" (no plaintext)
        - Attacker cannot recover original SSN (only placeholder)
        - Vault lookup requires database access + KMS access

      recovery_from_breach: "No action required (no PII leaked)"

    layer_2_k0_vault_encryption:
      name: "Database Layer - AES-256-GCM Encryption"
      location: "K0 database table (pii_vault)"
      content: "Encrypted PII (AES-256-GCM ciphertext + nonce + auth_tag)"
      encryption_algorithm: "AES-256-GCM (NIST SP 800-38D)"
      key_location: "AWS KMS (never stored in database)"
      retention: "Until user deletes (soft delete, then hard delete after 30 days)"
      breach_impact: "MEDIUM - Ciphertext leaked but key protected in HSM"

      encryption_details: |
        Storage in K0:
        - vault_key: "ssn_user123_abc123_1697486565000" (plaintext identifier)
        - encrypted_value: 0xABCD1234... (128-bit AES ciphertext, variable length)
        - nonce: 0x12345678901234567890abcd (96-bit, unique per encryption)
        - auth_tag: 0x9999888877776666555544443333 (128-bit authentication tag)
        - encryption_key_id: "arn:aws:kms:..." (pointer to KMS key)

      protection_mechanism: |
        If K0 database compromised (SQL injection, data dump):
        - Attacker sees: Encrypted ciphertext (0xABCD1234...)
        - Attacker cannot decrypt without KMS key
        - KMS key access controlled by AWS IAM policy
        - Authentication tag prevents tampering detection

      key_location: "AWS KMS HSM (cryptographic hardware)"

    layer_3_kms_master_key:
      name: "HSM Layer - AWS KMS Master Key"
      location: "AWS KMS Hardware Security Module (FIPS 140-2 Level 2)"
      protection: "HSM-enforced, never exported"
      access_control: "IAM-only (no human access via console)"
      key_operations_audit: "CloudTrail logs all key operations"
      lifetime: "Indefinite (automated key rotation every 365 days)"
      breach_impact: "CRITICAL - All PII compromised if key leaked"

      kms_architecture: |
        Master Key Management:
        - CMK (Customer Master Key) in AWS KMS
        - Never exported or shared (stays in HSM always)
        - KEK (Key Encryption Key) encrypts data keys
        - DEK (Data Encryption Key) generated per operation

        Key Hierarchy:
        - AWS-managed KMS key (AWS controls)
        - Customer-managed KMS key (K1 controls) ← K1 uses this
        - Data encryption key (DEK, ephemeral)
        - Plaintext key (in memory <100ms, then discarded)

        Key Rotation Policy:
        - Automatic: Every 365 days (AWS automated)
        - Manual: On-demand immediate rotation
        - Old keys retained: For decryption of old ciphertexts

        Access Control:
        - IAM Policy: Only K1 privacy service can call KMS.GenerateDataKey
        - MFA Requirement: Optional but recommended for prod
        - VPC Endpoint: Private KMS endpoint (no internet)

      cloudtrail_logging: |
        CloudTrail logs:
        - All KMS.GenerateDataKey calls (who, when)
        - All KMS.Decrypt calls (who, when)
        - All key rotations (automatic or manual)
        - All key deletions (with 30-day grace period)

      protection_mechanism: |
        If AWS account compromised (attacker has AWS console access):
        - Attacker can view KMS key ARN
        - Attacker CANNOT export key (policy prevents)
        - Attacker CANNOT decrypt data (HSM enforces key isolation)
        - CloudTrail logs unauthorized attempts
        - Emergency: Schedule immediate key deletion (7-day grace)

  threat_scenarios_and_mitigations:
    scenario_1_k0_sql_injection:
      threat: "SQL injection attack dumps K0 database including pii_vault table"
      attacker_gains: |
        - Table: pii_vault (encrypted values, nonces, auth tags, key IDs)
        - Attacker sees: Ciphertext 0xABCD1234..., nonce 0x1234..., key_id arn:aws:kms:...
      attacker_cannot_do: "Decrypt without KMS key (Layer 3 protection)"

      detection: |
        - Anomalous query patterns (SELECT * FROM pii_vault)
        - Database firewall alerts (large data export)
        - CloudTrail shows no unauthorized KMS calls (key safe)

      mitigation_short_term: |
        1. Revoke compromised database credentials
        2. Patch SQL injection vulnerability
        3. Verify CloudTrail logs (no unauthorized KMS access)
        4. No key rotation needed (key not compromised)

      mitigation_long_term: |
        1. WAF (Web Application Firewall) for SQL injection prevention
        2. Parameterized queries (prepared statements)
        3. Database Activity Monitoring (DAM)
        4. Regular penetration testing

      compliance_impact: "No GDPR notification required (encrypted data safe harbor)"
      recovery_time: "1-2 hours (patch + verify)"

    scenario_2_insider_threat_database_admin:
      threat: "Malicious DBA exports K0 database for personal gain"
      attacker_gains: "Full access to pii_vault table (encrypted data)"

      attacker_cannot_do: |
        - Decrypt PII (needs KMS key)
        - Bypass audit trail (CloudTrail logs access)
        - Undetected access (unusual query patterns trigger alerts)

      detection: |
        - Anomalous DBA activity (large export, off-hours)
        - CloudTrail shows DBA attempting KMS access
        - Audit alerts: "DBA_UNAUTHORIZED_KMS_CALL"

      mitigation_short_term: |
        1. Revoke DBA credentials immediately
        2. Investigate CloudTrail logs (what was accessed)
        3. Audit all queries executed by DBA
        4. File incident report (security team)

      mitigation_long_term: |
        1. Principle of least privilege (DBA has SELECT, not DECRYPT)
        2. Separate DBA role from encryption key access
        3. MFA required for administrative access
        4. Workstation monitoring (DBA device access logged)
        5. Behavioral analysis (detect unusual activity patterns)

      compliance_impact: "Potential GDPR notification (human error/deliberate)"
      recovery_time: "4-8 hours (investigation + remediation)"

    scenario_3_k1_process_memory_dump:
      threat: "Attacker gains root access to K1 server, dumps memory"
      attacker_gains: |
        - K1 process memory (SessionState + runtime data)
        - Sees: Redacted placeholders ("[SSN]", "[EMAIL]")
        - Cannot see: Plaintext PII (only vault_keys)

      attacker_cannot_do: |
        - Decrypt vault_keys (they're just identifiers, not encrypted)
        - Access KMS key (in separate AWS account)
        - Rehydrate PII without database access

      detection: |
        - Host Intrusion Detection System (HIDS) detects root access
        - K1 process monitoring shows unexpected memory dump
        - CloudTrail: No unusual KMS access patterns

      mitigation_short_term: |
        1. Terminate compromised K1 process
        2. Isolate host from network
        3. Forensic analysis (memory dump investigation)
        4. Rotate all credentials

      mitigation_long_term: |
        1. Mandatory memory encryption (if operating system supports)
        2. Secure enclave technology (Intel SGX, ARM TrustZone)
        3. Regular security patches (kernel, libraries)
        4. Host-based firewall (restrict unnecessary access)
        5. Endpoint Detection and Response (EDR) solution

      compliance_impact: "Low - No plaintext PII exposed (only placeholders)"
      recovery_time: "2-4 hours (restart K1 process)"

    scenario_4_aws_account_compromise:
      threat: "Attacker gains AWS console access to customer's AWS account"
      attacker_gains: |
        - Can see KMS key ARN
        - Can call AWS APIs (KMS.Decrypt)
        - Can view CloudTrail logs

      attacker_cannot_do: |
        - Export KMS key (policy prevents export)
        - Decrypt data outside AWS (key stays in HSM)
        - Hide actions (CloudTrail logs all operations)

      detection: |
        - CloudTrail shows unauthorized KMS calls (decrypt)
        - Unusual caller IP address (not from K1 VPC)
        - Alerts: "UNAUTHORIZED_KMS_DECRYPT_FROM_NEW_IP"

      mitigation_short_term: |
        1. Revoke AWS access keys immediately
        2. Schedule KMS key rotation (can happen immediately)
        3. Review all KMS operations in CloudTrail (past 24 hours)
        4. Force MFA re-authentication

      mitigation_long_term: |
        1. Enable AWS MFA requirement for all API calls
        2. Use VPC endpoints (private KMS access)
        3. Implement AWS IAM policies (least privilege)
        4. AWS CloudTrail alerting (send logs to external SIEM)
        5. AWS GuardDuty (threat detection)

      compliance_impact: "CRITICAL - All PII compromised if key was decrypted"
      recovery_procedure: |
        1. Schedule immediate KMS key rotation
        2. Rotate all AWS credentials (force new MFA)
        3. Notify customers (72-hour GDPR notification requirement)
        4. Initiate forensic investigation
        5. File incident report with authorities

      recovery_time: "24+ hours (investigation + notification + rotation)"

    scenario_5_network_eavesdropping:
      threat: "Attacker intercepts K1↔KMS communication (network sniffing)"
      attacker_gains: "Encrypted network traffic"

      attacker_cannot_do: |
        - Decrypt network traffic (TLS encryption)
        - Man-in-the-middle (TLS certificate validation)
        - Access KMS key (stays in HSM)

      detection: |
        - TLS certificate pinning validates connection
        - Network anomalies detected by DPI (Deep Packet Inspection)

      mitigation_short_term: |
        1. Rotate TLS certificates
        2. Review network logs (validate all KMS connections from K1 IP)

      mitigation_long_term: |
        1. AWS VPC endpoint for KMS (private, no internet)
        2. TLS 1.3 minimum (stronger encryption)
        3. Certificate pinning (detect certificate substitution)
        4. Network segmentation (restrict KMS access to specific IPs)

      compliance_impact: "Low - TLS encryption protects data in transit"
      recovery_time: "1 hour (certificate rotation)"

  incident_response_playbook:
    incident_classification:
      level_1_low: "Suspicious activity logged, no confirmed breach (unauthorized access attempt)"
      level_2_medium: "Confirmed unauthorized access (attacker accessed vault data, but encrypted)"
      level_3_high: "Confirmed unauthorized decryption (attacker decrypted PII data)"
      level_4_critical: "Confirmed mass data exfiltration (PII leaked to external party)"

    response_phases:
      phase_1_detect_and_alert:
        timeline: "0-5 minutes"
        actions: |
          1. Automated alert triggered (audit log anomaly)
          2. Security team notified (Slack, PagerDuty)
          3. Incident commander assigned
          4. War room established (Zoom meeting)
        tools:
          - "Audit alert system"
          - "CloudTrail event monitoring"
          - "Anomaly detection ML model"

      phase_2_triage_and_assess:
        timeline: "5-30 minutes"
        actions: |
          1. Assess severity (Level 1-4 classification)
          2. Determine scope (how many PII records affected?)
          3. Identify attacker (internal or external?)
          4. Check CloudTrail (what operations were performed?)
          5. Review audit logs (detailed sequence of events)
        key_questions: |
          - Was KMS key compromised?
          - How many PII records were accessed?
          - Were PII records decrypted or just viewed?
          - Is the attacker still active?

      phase_3_containment:
        timeline: "30 minutes - 2 hours"
        actions_low_to_medium: |
          1. Revoke compromised credentials
          2. Rotate affected API keys
          3. Force re-authentication for affected users
          4. Review recent access patterns
        actions_high_to_critical: |
          1. Schedule immediate KMS key rotation
          2. Terminate all affected sessions
          3. Block attacker IP address (firewall)
          4. Isolate affected systems from network
          5. Engage AWS support (if AWS account compromised)
        tools:
          - "AWS IAM (credential revocation)"
          - "AWS KMS (key rotation)"
          - "Network firewall (IP blocking)"

      phase_4_eradication:
        timeline: "2-12 hours"
        actions: |
          1. Patch vulnerabilities (if exploitable)
          2. Rotate credentials (all related systems)
          3. Review and update IAM policies
          4. Enable additional monitoring (MFA, TLS cert pinning)
          5. Update security group rules
        tools:
          - "AWS Systems Manager (patch management)"
          - "AWS IAM (policy update)"
          - "Git (commit security patches)"

      phase_5_recovery:
        timeline: "12-48 hours"
        actions: |
          1. Verify all systems operational
          2. Confirm audit logs normal (no residual incidents)
          3. Review CloudTrail for evidence of lateral movement
          4. Restore any corrupted data (from backups)
          5. Document all changes made
        verification:
          - "All services responding normally"
          - "No unusual access patterns in CloudTrail"
          - "All credentials rotated"
          - "All patches applied"

      phase_6_notification_and_disclosure:
        timeline: "Immediately if Level 3/4"
        gdpr_requirement: "72-hour notification requirement (Art. 33)"
        actions: |
          1. Consult with legal team (required for compliance)
          2. Draft notification email (transparency + action items)
          3. Notify affected users (GDPR requirement)
          4. Notify supervisory authority (if required)
          5. Notify insurance company (cyber insurance)
          6. Public statement (if required by regulations)
        template_example: |
          Subject: Security Notice - Vault Breach [Date]

          Dear Customer,

          We are writing to inform you of a potential security incident affecting
          your PII stored in our encrypted vault. On [Date], we detected unauthorized
          access to our [system_name]. We want to assure you that:

          ✓ Your data was encrypted (AES-256-GCM)
          ✓ Encryption keys were NOT compromised
          ✓ PII data remains protected

          What we did:
          - Immediately revoked attacker credentials
          - Rotated encryption keys for added security
          - Enhanced monitoring to prevent recurrence

          What you can do:
          - Monitor your accounts for unusual activity
          - Change passwords if using weak passwords
          - Enable MFA on all accounts

          Questions? Contact us at [security_contact]

      phase_7_post_incident_review:
        timeline: "1-2 weeks after incident"
        actions: |
          1. Blameless post-mortem meeting
          2. Root cause analysis (5 whys)
          3. Identify process improvements
          4. Document lessons learned
          5. Update incident playbooks
          6. Track remediation items (Jira tickets)
        deliverables:
          - "Post-mortem document"
          - "Timeline of events"
          - "Root cause analysis"
          - "Action items (with owners + deadlines)"
          - "Lessons learned"

  key_rotation_during_breach:
    immediate_action_if_key_compromised:
      action_1_emergency_key_rotation:
        what_to_do: "Schedule immediate KMS key rotation (don't wait for annual cycle)"
        how_to_do: "AWS KMS console → Select key → Schedule key rotation (can be immediate)"
        effect: "New key generated, old key retained for decryption of old ciphertexts"
        timeline: "< 5 minutes"

      action_2_re_encrypt_all_pii:
        what_to_do: "Re-encrypt all PII with new key (optional but recommended)"
        how_to_do: |
          1. Query all PII from vault (SELECT * FROM pii_vault)
          2. Decrypt with old key (KMS.Decrypt)
          3. Encrypt with new key (KMS.GenerateDataKey)
          4. UPDATE vault with new ciphertexts
        timeline: "30-60 minutes (for 12,000 entries)"
        benefit: "Old key no longer needed (can be revoked)"

      action_3_audit_and_verify:
        what_to_do: "Verify all PII still decryptable with new key"
        how_to_do: |
          1. Query pii_vault for each encryption_key_id
          2. Attempt decrypt with new key
          3. Verify success rate = 100%
        timeline: "< 10 minutes"

  monitoring_and_detection:
    security_monitoring:
      kms_unauthorized_calls: "Alert if non-K1 system calls KMS API"
      unusual_access_patterns: "Alert if accessing 100+ PII in 1 hour"
      failed_decryption_attempts: "Alert if decryption fails (auth tag mismatch)"
      key_rotation_failures: "Alert if key rotation doesn't complete"

    cloudtrail_event_monitoring:
      events_to_monitor: |
        - KMS.GenerateDataKey (normal, expected)
        - KMS.Decrypt (normal, expected)
        - KMS.ScheduleKeyDeletion (alert, key being deleted)
        - KMS.DisableKey (alert, key disabled)
        - KMS.CreateGrant (alert, new access granted)

    automated_incident_response:
      anomaly_detected: "Trigger incident classification (Level 1-4)"
      level_3_or_4: "Auto-page on-call security engineer"
      security_incident_triggered: "Log as SECURITY_INCIDENT, add to incident queue"

  compliance_and_legal:
    gdpr_notification_requirement:
      requirement: "72-hour notification if personal data breach occurs"
      exception: "Encrypted data NOT subject to notification (safe harbor) if key not compromised"
      implementation: "Verify KMS key secure before determining notification requirement"

    hipaa_breach_notification:
      requirement: "Notify affected individuals if PHI exposed"
      exception: "Encrypted PHI NOT subject to notification if key secure"

    cyber_insurance:
      coverage: "Incident response, forensics, notification costs"
      requirement: "Insurer notified within 24 hours of confirmed breach"
      claim_process: "Documentation: incident report, CloudTrail logs, remediation evidence"

  testing_strategy:
    tabletop_exercises:
      - "Simulate SQL injection breach (identify detection gaps)"
      - "Simulate insider threat (verify audit trail)"
      - "Simulate AWS account compromise (test KMS recovery)"

    technical_tests:
      - "Verify Layer 1 redaction (SessionState has no plaintext PII)"
      - "Verify Layer 2 encryption (K0 vault encrypted)"
      - "Verify Layer 3 key protection (KMS key accessible only via IAM)"
      - "Test key rotation (new key generated, old key retained)"

    compliance_tests:
      - "Verify GDPR 72-hour notification can be executed"
      - "Verify HIPAA breach assessment procedure"

  architecture:
    adr_references: ["ADR-0035c: Encrypted Vault & Key Management"]
    parent_contracts:
      - "C_PRIVACY_VAULT_OPS_017: Vault operations"
      - "C_PRIVACY_AES256GCM_ENCRYPTION_014: Encryption"
      - "C_PRIVACY_AWS_KMS_KEY_MGMT_015: Key management"
      - "C_PRIVACY_VAULT_AUDIT_021: Audit trail (detects breaches)"
    dependencies:
      - "AWS KMS (key management and rotation)"
      - "CloudTrail (audit logging)"
      - "K0 database (vault storage)"
      - "AWS IAM (access control)"

  notes: |
    3-layer defense strategy for PII breach protection:

    Layer 1 (SessionState): Redacted placeholders ("[SSN]", "[EMAIL]")
    - If compromised: Attacker sees only placeholders (no PII)
    - Recovery: Restart K1 process

    Layer 2 (K0 Vault): AES-256-GCM encrypted PII
    - If compromised: Ciphertext exposed but key protected (Layer 3)
    - Recovery: Patch database vulnerability, rotate credentials

    Layer 3 (AWS KMS): Master key in HSM
    - If compromised: CRITICAL - All PII could be decrypted
    - Recovery: Emergency key rotation, notify affected users (72-hour GDPR)

    Key principles:
    - No single point of failure (all 3 layers must be compromised for full breach)
    - Audit trail enables rapid incident detection and response
    - CloudTrail provides evidence of who accessed what and when
    - Encryption provides safe harbor for GDPR notification exemption

    Incident response: Detect → Triage → Contain → Eradicate → Recover → Notify → Review
