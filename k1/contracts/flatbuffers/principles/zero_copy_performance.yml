      speedup_serialize: "48x faster (30ms / 0.62ms)"

      flatbuffers_deserialize: "0.032ms P50, 0.038ms P95"
      json_deserialize: "6.5ms P50, 12.5ms P95"
      speedup_deserialize: "203x faster (6.5ms / 0.032ms)"

      flatbuffers_size: "64 KB"
      json_size: "192 KB (3x larger)"
      size_ratio: "3x smaller"

    agent_message_1kb:
      flatbuffers_serialize: "0.06ms P50"
      json_serialize: "0.5ms P50"
      speedup_serialize: "8.3x faster"

      flatbuffers_deserialize: "0.005ms P50"
      json_deserialize: "0.4ms P50"
      speedup_deserialize: "80x faster"

      flatbuffers_size: "1 KB"
      json_size: "1.1 KB (1.1x larger)"
      size_ratio: "1.1x smaller"

  flatbuffers_vs_protobuf:
    sessionstate_64kb:
      flatbuffers_serialize: "0.62ms P50"
