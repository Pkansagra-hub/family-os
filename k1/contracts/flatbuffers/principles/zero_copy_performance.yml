# FlatBuffers Zero-Copy Performance
# Part of: Epic 3.1, Issue 3.1.1 - FlatBuffers Design Principles
# Source ADR: ADR-0011c (Serialization Performance & Zero-Copy)
# Purpose: Meet <1ms serialization budget with zero-copy deserialization

version: "1.0"
type: "flatbuffers_performance"
status: "approved"

metadata:
  component: "FlatBuffers Performance"
  layer: "Cross-Layer (Serialization)"
  performance_target: "<1ms P95 serialization, <0.1ms deserialization"
  research:
    - "FlatBuffers (Google 2014) - Zero-copy deserialization"
    - "Cap'n Proto (Sandstorm 2013) - Zero-copy alternative"
    - "ADR-0011c - Serialization performance & zero-copy"

# Zero-Copy Deserialization
zero_copy_deserialization:
  description: "Read FlatBuffers data without parsing (0ms deserialization)"

  architecture:
    principle: "Data is read-only in-place from original buffer (no deserialization)"
    rationale: "Eliminate deserialization overhead (0ms vs JSON 12.5ms = 208x faster)"
    mechanism: "Fields accessed via vtable offsets (4 pointer dereferences)"

  memory_layout:
    description: "Binary buffer structure for zero-copy access"

    buffer_structure:
      header:
        file_identifier: "4 bytes - Schema version validation (e.g., 'AGST')"
        buffer_size: "4 bytes - Total buffer size in bytes"
        root_offset: "4 bytes - Offset to root table from buffer start"

      vtable:
        description: "Virtual table for field offset lookup"
        vtable_size: "2 bytes - Size of vtable in bytes"
        table_size: "2 bytes - Size of table object in bytes"
        field_offsets: "2 bytes per field - Offset from table start to field (0 = absent)"

      field_data:
        description: "Actual field values (scalars, vectors, nested tables)"
        scalars: "Inline values (1-8 bytes depending on type)"
        strings: "Offset to string data (4 bytes) + length (4 bytes) + UTF-8 bytes"
        vectors: "Offset to vector data (4 bytes) + length (4 bytes) + elements"
        tables: "Offset to nested table (4 bytes)"

    example_layout: |
      AgentState buffer (256 bytes):

      Offset | Size | Field
      -------|------|------
      0x00   | 4    | File identifier: "AGST"
      0x04   | 4    | Buffer size: 256
      0x08   | 4    | Root offset: 0x0C

      0x0C   | 2    | Vtable size: 12
      0x0E   | 2    | Table size: 64
      0x10   | 2    | agent_id offset: 24
      0x12   | 2    | state offset: 52
      0x14   | 2    | memory_mb offset: 56

      0x18   | 4    | agent_id string offset: 0x30
      0x34   | 1    | state value: 2 (ACTIVE)
      0x38   | 4    | memory_mb value: 512

      0x30   | 4    | String length: 26
      0x34   | 26   | String data: "01HXYZ..."

  field_access_mechanism:
    description: "How fields are accessed without deserialization"

    steps:
      - step: 1
        operation: "Read root offset from buffer[8:12]"
        latency: "1 pointer dereference (~5-10 CPU cycles)"

      - step: 2
        operation: "Read vtable offset from root table"
        latency: "1 pointer dereference"

      - step: 3
        operation: "Read field offset from vtable[field_index]"
        latency: "1 pointer dereference"

      - step: 4
        operation: "Read field value from table[field_offset]"
        latency: "1 pointer dereference"

    total_latency: "4 pointer dereferences = ~20-30 CPU cycles = 0.01-0.02ms @ 2GHz"

  comparison_vs_json:
    json_deserialization:
      steps:
        - "Parse JSON string (lexing + parsing)"
        - "Allocate Python dict/list objects"
        - "Convert string values to Python types"
        - "Build nested object hierarchy"
      latency: "12.5ms for SessionState (64KB)"
      memory: "3x buffer size (original + parsed + intermediate)"

    flatbuffers_zero_copy:
      steps:
        - "Validate file identifier (1 comparison)"
        - "Read root offset (1 dereference)"
        - "Return buffer pointer (no allocation)"
      latency: "0.06ms for SessionState (64KB)"
      memory: "1x buffer size (no copies)"
      speedup: "208x faster (12.5ms / 0.06ms)"

# Memory Optimization Patterns
memory_optimization:
  description: "Techniques to minimize memory overhead while maintaining <1ms performance"

  vtable_compression:
    description: "Share vtables across instances with identical schema"
    mechanism: "Multiple tables with same field layout share single vtable"

    savings_calculation:
      vtable_size: "10-20 bytes (typical)"
      instances_per_buffer: "10-100 (typical)"
      without_sharing: "10-20 bytes × 100 instances = 1,000-2,000 bytes"
      with_sharing: "10-20 bytes (single vtable)"
      savings: "980-1,980 bytes (98-99%)"

    production_impact:
      scenario: "100 AgentState instances in single buffer"
      vtable_size: "16 bytes"
      memory_saved: "1,584 bytes (99 × 16 bytes)"
      percentage: "6.2% of total buffer size"

  string_deduplication:
    description: "Reuse string instances within single buffer"
    mechanism: "Multiple fields referencing same string share single copy"

    example:
      scenario: "100 ToolCall instances, all calling 'search_web'"
      without_dedup:
        string_count: 100
        string_length: 15
        total_bytes: "100 × (4 + 15) = 1,900 bytes"

      with_dedup:
        string_count: 1
        string_offsets: 100
        total_bytes: "(4 + 15) + (100 × 4) = 419 bytes"
        savings: "1,481 bytes (78%)"

    production_impact:
      common_strings: ["search_web", "get_weather", "send_email", "ACTIVE", "COMPLETED"]
      average_savings: "60-70% for repeated strings"

  padding_optimization:
    description: "Minimize alignment padding by ordering fields"
    rule: "Order fields from largest to smallest"

    bad_example:
      layout: |
        table BadExample {
          flag: bool;        // 1 byte
          padding1: [7];     // 7 bytes padding (align to 8-byte boundary)
          large_value: int64; // 8 bytes
          padding2: [4];     // 4 bytes padding (align to 4-byte boundary)
          medium_value: int32; // 4 bytes
          padding3: [3];     // 3 bytes padding
          small_value: int8;  // 1 byte
        }
      total_size: "24 bytes (14 bytes padding = 58% waste)"

    good_example:
      layout: |
        table GoodExample {
          large_value: int64;  // 8 bytes (aligned)
          medium_value: int32; // 4 bytes (aligned)
          small_value: int8;   // 1 byte
          flag: bool;          // 1 byte
          padding: [2];        // 2 bytes padding (only at end)
        }
      total_size: "16 bytes (2 bytes padding = 12.5% waste)"
      savings: "8 bytes (33% reduction)"

  force_alignment:
    description: "Align structs to SIMD boundaries (16 bytes) for vectorization"
    use_case: "Audio/video processing, heavy numerical computation"

    without_alignment:
      example: |
        struct AudioSample {
          left: float32;       // 4 bytes
          right: float32;      // 4 bytes
          timestamp_us: int64; // 8 bytes
        }
      total_size: "16 bytes (natural alignment)"
      simd_speedup: "1x (no guarantee of 16-byte alignment)"

    with_alignment:
      example: |
        struct AudioSample (force_align: 16) {
          left: float32;       // 4 bytes
          right: float32;      // 4 bytes
          timestamp_us: int64; // 8 bytes
        }
      total_size: "16 bytes (guaranteed 16-byte alignment)"
      simd_speedup: "3x (SSE4/AVX can vectorize 4 samples at once)"

    production_impact:
      scenario: "Audio processing pipeline (48kHz, 10ms chunks)"
      samples_per_chunk: 480
      without_simd: "12.5ms processing time"
      with_simd: "4.1ms processing time"
      speedup: "3x (enabled by force_align: 16)"

# Buffer Pooling
buffer_pooling:
  description: "Reuse pre-allocated buffers to reduce allocations and GC pressure"

  architecture:
    approach: "Thread-local buffer pools with size classes"
    rationale: "Avoid repeated allocations for hot-path serialization (<1ms budget)"

  size_classes:
    - size: "256 bytes"
      use_case: "Small messages (AgentState, ToolCall)"
      pool_size: 64
      max_total: "16 KB"

    - size: "1 KB"
      use_case: "Medium messages (TaskAnnouncement, InferenceRequest)"
      pool_size: 32
      max_total: "32 KB"

    - size: "4 KB"
      use_case: "Large messages (K0 Event, PlanSketch)"
      pool_size: 16
      max_total: "64 KB"

    - size: "16 KB"
      use_case: "Very large messages (Scoreboard, Beliefs)"
      pool_size: 8
      max_total: "128 KB"

    - size: "64 KB"
      use_case: "SessionState (full 6-section memory)"
      pool_size: 4
      max_total: "256 KB"

  eviction_policy:
    max_pool_size: "64 KB per size class"
    max_total_memory: "256 KB across all pools (per thread)"
    eviction_rule: "LRU (least recently used) when pool exceeds max_pool_size"

  implementation_example: |
    import threading
    from typing import Optional

    class BufferPool:
      """Thread-local buffer pool for FlatBuffers serialization"""

      _local = threading.local()

      SIZE_CLASSES = [256, 1024, 4096, 16384, 65536]
      MAX_POOL_SIZE = {
        256: 64,
        1024: 32,
        4096: 16,
        16384: 8,
        65536: 4
      }

      @classmethod
      def get_buffer(cls, min_size: int) -> bytearray:
        """Get buffer from pool (or allocate new)"""
        if not hasattr(cls._local, 'pools'):
          cls._local.pools = {size: [] for size in cls.SIZE_CLASSES}

        # Find smallest size class >= min_size
        size_class = min(
          (s for s in cls.SIZE_CLASSES if s >= min_size),
          default=None
        )

        if size_class is None:
          # Allocate oversized buffer (not pooled)
          return bytearray(min_size)

        # Try to reuse from pool
        pool = cls._local.pools[size_class]
        if pool:
          return pool.pop()
        else:
          # Allocate new buffer
          return bytearray(size_class)

      @classmethod
      def return_buffer(cls, buffer: bytearray):
        """Return buffer to pool for reuse"""
        if not hasattr(cls._local, 'pools'):
          return

        size = len(buffer)
        if size in cls.SIZE_CLASSES:
          pool = cls._local.pools[size]
          max_size = cls.MAX_POOL_SIZE[size]

          if len(pool) < max_size:
            buffer[:] = b'\x00' * len(buffer)  # Zero out
            pool.append(buffer)

  performance_impact:
    allocations_without_pooling: "10,000 per second (1 per message)"
    allocations_with_pooling: "50 per second (pool misses only)"
    allocation_reduction: "200x fewer allocations"

    gc_pauses_without_pooling: "15ms P95 (10 pauses per second)"
    gc_pauses_with_pooling: "2ms P95 (1-2 pauses per second)"
    gc_pause_reduction: "7.5x fewer GC pauses"

    serialization_speedup: "1.4x (0.9ms → 0.65ms P95)"

