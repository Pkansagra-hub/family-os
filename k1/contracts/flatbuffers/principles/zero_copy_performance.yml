# Prometheus Metrics
metrics:
  - name: "flatbuffers_serialization_duration_ms"
    type: "histogram"
    description: "FlatBuffers serialization latency"
    labels: ["schema_name"]
    buckets: [0.1, 0.5, 1, 2, 5, 10]
    target: "<1ms P95"

  - name: "flatbuffers_deserialization_duration_ms"
    type: "histogram"
    description: "FlatBuffers deserialization latency (zero-copy)"
    labels: ["schema_name"]
    buckets: [0.01, 0.05, 0.1, 0.5, 1]
    target: "<0.1ms P95"

  - name: "flatbuffers_buffer_pool_hit_rate"
    type: "gauge"
    description: "Buffer pool hit rate (0.0-1.0)"
    target: ">0.8 (80%)"

  - name: "flatbuffers_buffer_pool_memory_bytes"
    type: "gauge"
    description: "Memory used by buffer pools"
    labels: ["size_class"]
    target: "<256 KB per thread"

  - name: "flatbuffers_gc_pause_duration_ms"
    type: "histogram"
    description: "Python GC pause duration"
    buckets: [1, 2, 5, 10, 20, 50]
    target: "<2ms P95 (with pooling)"
