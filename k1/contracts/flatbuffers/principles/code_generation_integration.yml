# FlatBuffers Code Generation Integration
# Part of: Epic 3.1, Issue 3.1.1 - FlatBuffers Design Principles
# Source ADR: ADR-0011b (FlatBuffers Code Generation Integration)
# Purpose: Define build-time code generation for 76 K1 FlatBuffers schemas

version: "1.0"
type: "flatbuffers_codegen"
status: "approved"

metadata:
  component: "FlatBuffers Code Generation"
  layer: "Build Infrastructure"
  total_schemas: 76
  generated_languages: ["Python", "C++", "Rust"]
  research:
    - "FlatBuffers v23.5.26 (2023) - Stable release"
    - "CMake 3.20+ - Build system integration"
    - "ADR-0011b - Code generation integration"

# flatc Compiler
flatc_compiler:
  description: "Official FlatBuffers compiler for schema validation and code generation"

  version:
    required: "v23.5.26"
    rationale: "Stable release with all K1-required features"
    release_date: "2023-05-26"
    features:
      - "Schema validation with breaking change detection"
      - "Python/C++/Rust code generation"
      - "File identifier validation"
      - "Reflection support (--reflect-names, --reflect-types)"

  installation:
    apt_debian_ubuntu:
      command: "sudo apt-get install flatbuffers-compiler"
      version_check: "flatc --version"
      expected_output: "flatc version 23.5.26"

    homebrew_macos:
      command: "brew install flatbuffers"
      version_check: "flatc --version"

    chocolatey_windows:
      command: "choco install flatbuffers"
      version_check: "flatc.exe --version"

    prebuilt_binary:
      url: "https://github.com/google/flatbuffers/releases/tag/v23.5.26"
      platforms: ["Linux x64", "macOS ARM64/x64", "Windows x64"]
      install_steps:
        - "Download flatc binary for platform"
        - "Extract to /usr/local/bin (Linux/macOS) or C:\\tools (Windows)"
        - "Verify: flatc --version"

    build_from_source:
      repo: "https://github.com/google/flatbuffers.git"
      tag: "v23.5.26"
      steps: |
        git clone https://github.com/google/flatbuffers.git
        cd flatbuffers
        git checkout v23.5.26
        cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
        make -j8
        sudo make install

# Compiler Flags
compiler_flags:
  description: "flatc flags for K1 schema compilation"

  language_bindings:
    python:
      flag: "--python"
      output_dir: "k1/schemas/generated/python/"
      rationale: "K1 runtime is Python-based"

    cpp:
      flag: "--cpp"
      output_dir: "k1/schemas/generated/cpp/"
      rationale: "K0 kernel integration (C++ FFI)"

    rust:
      flag: "--rust"
      output_dir: "k1/schemas/generated/rust/"
      rationale: "MCP servers written in Rust"

  object_api:
    flag: "--gen-object-api"
    purpose: "Generate mutable object-oriented API"
    rationale: "Enable editing FlatBuffers objects (not just read-only)"
    example: |
      # Without --gen-object-api (read-only)
      agent = AgentState.GetRootAs(buffer)
      print(agent.AgentId())  # Read-only access

      # With --gen-object-api (mutable)
      agent_obj = AgentStateT()
      agent_obj.agent_id = "01HXYZ..."
      agent_obj.state = AgentLifecycleState.ACTIVE
      builder = flatbuffers.Builder()
      agent_obj.Pack(builder)

  mutable_buffers:
    flag: "--gen-mutable"
    purpose: "Generate mutable buffer API (modify in-place)"
    rationale: "Avoid full copy for small field updates"
    use_case: "Update AgentState.memory_mb without full deserialization"

  scoped_enums:
    flag: "--scoped-enums"
    purpose: "Generate C++ scoped enums (enum class)"
    rationale: "Prevent enum value collisions (ACTIVE vs IDLE in multiple enums)"

  reflection:
    flags: ["--reflect-names", "--reflect-types"]
    purpose: "Generate reflection metadata for runtime introspection"
    rationale: "Enable dynamic schema inspection for debugging"
    output: "Generated reflection.fbs with schema metadata"

  validation:
    flag: "--conform"
    purpose: "Validate schema against conformance tests"
    rationale: "Ensure schema correctness before code generation"

# Language Bindings
language_bindings:
  description: "Language-specific code generation for K1 runtime and K0 kernel"

  python:
    target_runtime: "K1 Intelligence Module (Python 3.11+)"
    generated_structure: |
      k1/schemas/generated/python/
      ├── agent_fabric/
      │   ├── AgentState.py
      │   ├── AgentLifecycleState.py
      │   ├── AgentCapability.py
      │   └── ...
      ├── orchestrator/
      │   ├── TaskAnnouncement.py
      │   ├── TaskProposal.py
      │   └── ...
      ├── session_state/
      │   ├── SessionState.py
      │   ├── Beliefs.py
      │   ├── Scoreboard.py
      │   └── ...
      └── __init__.py

    usage_example: |
      from k1.schemas.generated.python.agent_fabric import AgentState
      from k1.schemas.generated.python.agent_fabric import AgentLifecycleState
      import flatbuffers

      # Serialize
      builder = flatbuffers.Builder(256)
      agent_id = builder.CreateString("01HXYZ...")
      AgentState.Start(builder)
      AgentState.AddAgentId(builder, agent_id)
      AgentState.AddState(builder, AgentLifecycleState.AgentLifecycleState.ACTIVE)
      AgentState.AddMemoryMb(builder, 512)
      agent = AgentState.End(builder)
      builder.Finish(agent)
      buffer = bytes(builder.Output())

      # Deserialize (zero-copy)
      agent_state = AgentState.AgentState.GetRootAs(buffer)
      print(agent_state.AgentId())  # "01HXYZ..."
      print(agent_state.State())    # 2 (ACTIVE)
      print(agent_state.MemoryMb()) # 512

  cpp:
    target_runtime: "K0 Kernel (C++ FFI bridge)"
    generated_structure: |
      k1/schemas/generated/cpp/
      ├── agent_fabric/
      │   ├── agent_state_generated.h
      │   ├── agent_lifecycle_state_generated.h
      │   └── ...
      ├── orchestrator/
      │   ├── task_announcement_generated.h
      │   └── ...
      └── CMakeLists.txt

    usage_example: |
      #include "agent_fabric/agent_state_generated.h"
      #include <flatbuffers/flatbuffers.h>

      // Serialize
      flatbuffers::FlatBufferBuilder builder(256);
      auto agent_id = builder.CreateString("01HXYZ...");
      auto agent = k1::agent_fabric::CreateAgentState(
        builder,
        agent_id,
        k1::agent_fabric::AgentLifecycleState_ACTIVE,
        512  // memory_mb
      );
      builder.Finish(agent);
      const uint8_t* buffer = builder.GetBufferPointer();
      size_t size = builder.GetSize();

      // Deserialize (zero-copy)
      auto agent_state = k1::agent_fabric::GetAgentState(buffer);
      std::string id = agent_state->agent_id()->str();
      auto state = agent_state->state();
      uint32_t memory = agent_state->memory_mb();

  rust:
    target_runtime: "MCP Servers (Rust-based)"
    generated_structure: |
      k1/schemas/generated/rust/
      ├── agent_fabric/
      │   ├── agent_state_generated.rs
      │   ├── agent_lifecycle_state_generated.rs
      │   └── mod.rs
      ├── orchestrator/
      │   ├── task_announcement_generated.rs
      │   └── mod.rs
      └── lib.rs

    usage_example: |
      use flatbuffers::FlatBufferBuilder;
      use k1_schemas::agent_fabric::{AgentState, AgentStateArgs, AgentLifecycleState};

      // Serialize
      let mut builder = FlatBufferBuilder::new();
      let agent_id = builder.create_string("01HXYZ...");
      let agent = AgentState::create(&mut builder, &AgentStateArgs {
        agent_id: Some(agent_id),
        state: AgentLifecycleState::ACTIVE,
        memory_mb: 512,
        ..Default::default()
      });
      builder.finish(agent, None);
      let buffer = builder.finished_data();

      // Deserialize (zero-copy)
      let agent_state = flatbuffers::root::<AgentState>(buffer)?;
      let id = agent_state.agent_id().unwrap();
      let state = agent_state.state();
      let memory = agent_state.memory_mb();

# Build System Integration
build_integration:
  description: "Integrate flatc into CMake, Bazel, and Python build systems"

  cmake:
    target_project: "K0 Kernel (C++ codebase)"
    integration_file: "k1/schemas/CMakeLists.txt"
    example: |
      cmake_minimum_required(VERSION 3.20)
      project(K1Schemas)

      # Find FlatBuffers package
      find_package(Flatbuffers 23.5.26 REQUIRED)

      # Schema source files
      set(SCHEMA_FILES
        agent_fabric/agent_state.fbs
        orchestrator/task_announcement.fbs
        session_state/session_state.fbs
        # ... (76 total schemas)
      )

      # Generate C++ bindings
      add_custom_target(
        generate_schemas
        COMMAND flatc --cpp --gen-mutable --scoped-enums
                -o ${CMAKE_CURRENT_SOURCE_DIR}/generated/cpp
                ${SCHEMA_FILES}
        WORKING_DIRECTORY ${CMAKE_CURRENT_SOURCE_DIR}
        COMMENT "Generating FlatBuffers C++ bindings for K1 schemas"
        VERBATIM
      )

      # Generated library
      add_library(k1_schemas INTERFACE)
      target_include_directories(k1_schemas INTERFACE
        ${CMAKE_CURRENT_SOURCE_DIR}/generated/cpp
      )
      add_dependencies(k1_schemas generate_schemas)

  bazel:
    target_project: "Alternative build system (optional)"
    integration_file: "k1/schemas/BUILD.bazel"
    example: |
      load("@com_github_google_flatbuffers//build_defs:build_defs.bzl", "flatbuffer_library")

      flatbuffer_library(
        name = "agent_state_fbs",
        srcs = ["agent_fabric/agent_state.fbs"],
        language_targets = [
          "python",
          "cc",
          "rust",
        ],
      )

      flatbuffer_library(
        name = "all_k1_schemas",
        srcs = glob(["**/*.fbs"]),
        language_targets = ["python", "cc", "rust"],
      )

  python_setuptools:
    target_project: "K1 Runtime (Python package)"
    integration_file: "setup.py"
    example: |
      from setuptools import setup, Command
      from setuptools.command.build_py import build_py
      import subprocess
      import os

      class BuildSchemas(Command):
        """Custom command to build FlatBuffers schemas"""
        description = "Generate Python bindings for FlatBuffers schemas"
        user_options = []

        def initialize_options(self):
          pass

        def finalize_options(self):
          pass

        def run(self):
          schema_dir = "k1/schemas"
          output_dir = "k1/schemas/generated/python"

          # Find all .fbs files
          for root, dirs, files in os.walk(schema_dir):
            for file in files:
              if file.endswith(".fbs"):
                schema_path = os.path.join(root, file)

                # Generate Python bindings
                subprocess.run([
                  "flatc", "--python", "--gen-object-api",
                  "-o", output_dir,
                  schema_path
                ], check=True)

      class BuildPyWithSchemas(build_py):
        """Build Python package after generating schemas"""
        def run(self):
          self.run_command('build_schemas')
          super().run()

      setup(
        name="k1-intelligence",
        version="1.0.0",
        cmdclass={
          'build_schemas': BuildSchemas,
          'build_py': BuildPyWithSchemas,
        },
      )

# CI/CD Integration
ci_cd:
  description: "Automated schema validation and code generation in GitHub Actions"

  github_actions_workflow:
    file: ".github/workflows/schemas.yml"
    triggers:
      - "Push to main/develop"
      - "Pull requests modifying *.fbs files"
      - "Manual workflow dispatch"

    workflow: |
      name: FlatBuffers Schema Validation

      on:
        push:
          branches: [main, develop]
          paths:
            - 'k1/schemas/**/*.fbs'
        pull_request:
          paths:
            - 'k1/schemas/**/*.fbs'
        workflow_dispatch:

      jobs:
        validate-schemas:
          runs-on: ubuntu-latest
          steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install flatc v23.5.26
              run: |
                wget https://github.com/google/flatbuffers/releases/download/v23.5.26/Linux.flatc.binary.clang++-12.zip
                unzip Linux.flatc.binary.clang++-12.zip
                sudo mv flatc /usr/local/bin/
                flatc --version

            - name: Validate schema syntax
              run: |
                find k1/schemas -name "*.fbs" | while read schema; do
                  echo "Validating $schema"
                  flatc --conform $schema || exit 1
                done

            - name: Check for breaking changes
              run: |
                python scripts/check_schema_breaking_changes.py \
                  --old-ref origin/main \
                  --new-ref HEAD

            - name: Generate Python bindings
              run: |
                mkdir -p k1/schemas/generated/python
                find k1/schemas -name "*.fbs" | while read schema; do
                  flatc --python --gen-object-api \
                    -o k1/schemas/generated/python \
                    $schema
                done

            - name: Generate C++ bindings
              run: |
                mkdir -p k1/schemas/generated/cpp
                find k1/schemas -name "*.fbs" | while read schema; do
                  flatc --cpp --gen-mutable --scoped-enums \
                    -o k1/schemas/generated/cpp \
                    $schema
                done

            - name: Type check generated Python code
              run: |
                pip install mypy
                mypy --strict k1/schemas/generated/python/

            - name: Upload generated bindings
              uses: actions/upload-artifact@v3
              with:
                name: flatbuffers-bindings
                path: k1/schemas/generated/

  pre_commit_hooks:
    description: "Validate schemas before commits"
    file: ".pre-commit-config.yaml"
    config: |
      repos:
        - repo: local
          hooks:
            - id: validate-flatbuffers
              name: Validate FlatBuffers schemas
              entry: scripts/validate_schemas.sh
              language: system
              files: '\.fbs$'

            - id: check-breaking-changes
              name: Check for breaking schema changes
              entry: python scripts/check_schema_breaking_changes.py
              language: python
              files: '\.fbs$'

            - id: generate-bindings
              name: Generate FlatBuffers bindings
              entry: scripts/generate_bindings.sh
              language: system
              files: '\.fbs$'
              pass_filenames: false

# Breaking Change Detection
breaking_change_detection:
  description: "Automated detection of schema breaking changes"

  script_location: "scripts/check_schema_breaking_changes.py"

  breaking_changes_detected:
    - "Removed table"
    - "Removed field from table"
    - "Renamed field"
    - "Changed field type"
    - "Removed enum value"
    - "Changed enum value"

  implementation: |
    #!/usr/bin/env python3
    """
    Detect breaking changes in FlatBuffers schemas between git refs.

    Usage:
      python check_schema_breaking_changes.py --old-ref origin/main --new-ref HEAD
    """
    import argparse
    import subprocess
    import re
    from typing import List, Dict, Set

    def parse_schema(content: str) -> Dict:
      """Parse FlatBuffers schema into structured data"""
      tables = {}
      enums = {}

      # Parse tables
      table_pattern = r'table (\w+) \{([^}]+)\}'
      for match in re.finditer(table_pattern, content):
        table_name = match.group(1)
        fields_content = match.group(2)

        # Parse fields
        field_pattern = r'(\w+):\s*([\w\[\]]+)'
        fields = {}
        for field_match in re.finditer(field_pattern, fields_content):
          field_name = field_match.group(1)
          field_type = field_match.group(2)
          fields[field_name] = field_type

        tables[table_name] = fields

      # Parse enums
      enum_pattern = r'enum (\w+) : \w+ \{([^}]+)\}'
      for match in re.finditer(enum_pattern, content):
        enum_name = match.group(1)
        values_content = match.group(2)

        # Parse enum values
        value_pattern = r'(\w+)\s*=\s*(\d+)'
        values = {}
        for value_match in re.finditer(value_pattern, values_content):
          value_name = value_match.group(1)
          value_num = int(value_match.group(2))
          values[value_name] = value_num

        enums[enum_name] = values

      return {"tables": tables, "enums": enums}

    def detect_breaking_changes(old_schema: Dict, new_schema: Dict) -> List[str]:
      """Detect breaking changes between schemas"""
      breaking_changes = []

      # Check for removed tables
      old_tables = set(old_schema["tables"].keys())
      new_tables = set(new_schema["tables"].keys())
      removed_tables = old_tables - new_tables
      for table in removed_tables:
        breaking_changes.append(f"BREAKING: Removed table '{table}'")

      # Check for removed/renamed fields
      for table_name in old_tables & new_tables:
        old_fields = set(old_schema["tables"][table_name].keys())
        new_fields = set(new_schema["tables"][table_name].keys())
        removed_fields = old_fields - new_fields
        for field in removed_fields:
          breaking_changes.append(
            f"BREAKING: Removed field '{table_name}.{field}'"
          )

        # Check for changed field types
        common_fields = old_fields & new_fields
        for field in common_fields:
          old_type = old_schema["tables"][table_name][field]
          new_type = new_schema["tables"][table_name][field]
          if old_type != new_type:
            breaking_changes.append(
              f"BREAKING: Changed type of '{table_name}.{field}' "
              f"from '{old_type}' to '{new_type}'"
            )

      return breaking_changes

    # ... (main() implementation)

# Type Safety Integration
type_safety:
  description: "Compile-time type checking for generated code"

  python_mypy:
    config_file: "pyproject.toml"
    strict_mode: true
    config: |
      [tool.mypy]
      python_version = "3.11"
      strict = true
      warn_return_any = true
      warn_unused_configs = true
      disallow_untyped_defs = true
      disallow_any_generics = true

      [[tool.mypy.overrides]]
      module = "k1.schemas.generated.python.*"
      ignore_errors = false  # Enforce type checking on generated code

  cpp_clang_tidy:
    config_file: ".clang-tidy"
    checks: "readability-*, modernize-*, performance-*, bugprone-*"
    config: |
      Checks: 'readability-*,modernize-*,performance-*,bugprone-*'
      WarningsAsErrors: '*'
      HeaderFilterRegex: 'k1/schemas/generated/cpp/.*'

  rust_clippy:
    config_file: "Cargo.toml"
    config: |
      [lints.clippy]
      all = "warn"
      pedantic = "warn"
      nursery = "warn"

