# FlatBuffers vs JSON Decision Matrix
# Part of: Epic 3.1, Issue 3.1.1 - FlatBuffers Design Principles
# Source ADR: ADR-0011 (FlatBuffers Serialization Decision)
# Purpose: Document why FlatBuffers was selected over JSON, Protobuf, MessagePack, Avro

version: "1.0"
type: "flatbuffers_decision"
status: "approved"

metadata:
  component: "FlatBuffers Decision Rationale"
  layer: "Cross-Layer (Serialization)"
  decision_date: "2024-01-10"
  research:
    - "FlatBuffers (Google 2014) - Zero-copy serialization"
    - "Protocol Buffers (Google 2008) - Industry standard"
    - "JSON (ECMA-404 2013) - Ubiquitous text format"
    - "ADR-0011 - FlatBuffers serialization decision"

# Decision Context
decision_context:
  description: "Why K1 needs high-performance serialization"

  requirements:
    performance:
      serialization_budget: "<1ms P95 for hot-path operations"
      deserialization_budget: "<0.1ms P95 (zero-copy preferred)"
      rationale: "K1 TTFT budget is 150ms; serialization overhead must be <10ms for 10 hot-path operations"

    message_sizes:
      small_messages: "1-2 KB (AgentState, ToolCall, agent messages)"
      medium_messages: "4-8 KB (TaskAnnouncement, K0 Event, PlanSketch)"
      large_messages: "16-64 KB (SessionState with 6 sections)"
      rationale: "SessionState is largest K1 schema (~18KB typical, 64KB soft limit)"

    throughput:
      messages_per_second: "1,000-10,000 (per K1 instance)"
      concurrent_sessions: "50-100 (per K1 instance)"
      rationale: "High-throughput agentic orchestration requires low serialization overhead"

    type_safety:
      requirement: "Compile-time schema validation (prevent runtime errors)"
      rationale: "76 schemas × 3 languages (Python/C++/Rust) = high error risk without type safety"

    compatibility:
      requirement: "Forward/backward compatible schema evolution (zero downtime)"
      rationale: "K1↔K0 integration requires versioned schemas with graceful degradation"

    cross_platform:
      languages: ["Python (K1 runtime)", "C++ (K0 kernel)", "Rust (MCP servers)"]
      rationale: "Multi-language ecosystem requires cross-platform serialization"

# Decision Matrix
decision_matrix:
  description: "Evaluation of 5 serialization formats (0-10 scale)"

  flatbuffers:
    total_score: "9/10"

    criteria:
      zero_copy: "10/10 - Zero-copy deserialization (0ms overhead)"
      performance: "10/10 - <1ms serialization, 150x faster deserialize than JSON"
      type_safety: "9/10 - Compile-time schema validation, generated code"
      schema_evolution: "9/10 - Forward/backward compatible with deprecation"
      cross_platform: "9/10 - Python/C++/Rust/Java/Go/C# bindings"
      memory_efficiency: "9/10 - 3x smaller than JSON (64KB vs 192KB)"
      ecosystem: "7/10 - Smaller than Protobuf but Google-backed"
      ease_of_use: "7/10 - Requires flatc compiler, code generation"

    strengths:
      - "Zero-copy deserialization (0ms vs JSON 12.5ms)"
      - "<1ms serialization meets K1 budget"
      - "Type safety prevents runtime errors"
      - "Forward/backward compatible"
      - "3x smaller than JSON"
      - "Proven at Google, Dropbox, Meta"

    weaknesses:
      - "Smaller ecosystem than Protobuf"
      - "Requires code generation (not self-describing)"

  json:
    total_score: "3/10"

    criteria:
      zero_copy: "0/10 - Full deserialization required (12.5ms for 64KB)"
      performance: "2/10 - 150x slower deserialize, 48x slower serialize"
      type_safety: "0/10 - No schema, runtime errors"
      schema_evolution: "3/10 - No versioning, manual handling"
      cross_platform: "10/10 - Ubiquitous support"
      memory_efficiency: "3/10 - 3x larger than FlatBuffers"
      ecosystem: "10/10 - Largest ecosystem"
      ease_of_use: "10/10 - No code generation, human-readable"

    strengths:
      - "Ubiquitous support (every language/platform)"
      - "Human-readable (debugging)"
      - "No code generation required"
      - "Largest ecosystem"

    weaknesses:
      - "8ms serialization overhead (53% of TTFT budget for 10 ops)"
      - "12.5ms deserialization (150x slower than FlatBuffers)"
      - "3x larger than FlatBuffers (192KB vs 64KB)"
      - "No type safety (runtime errors)"
      - "No schema evolution"

  protobuf:
    total_score: "6/10"

    criteria:
      zero_copy: "0/10 - Full deserialization required (1.1ms for 64KB)"
      performance: "5/10 - 34x slower deserialize, 4.7x slower serialize"
      type_safety: "10/10 - Compile-time schema validation, generated code"
      schema_evolution: "10/10 - Industry-standard versioning"
      cross_platform: "10/10 - Python/C++/Rust/Java/Go/C# bindings"
      memory_efficiency: "9/10 - Slightly smaller than FlatBuffers (53KB vs 64KB)"
      ecosystem: "10/10 - Industry standard (Google, many companies)"
      ease_of_use: "7/10 - Requires protoc compiler, code generation"

    strengths:
      - "Industry standard (proven at Google, Meta, etc.)"
      - "Type safety with compile-time validation"
      - "Excellent schema evolution"
      - "Large ecosystem"
      - "Slightly smaller than FlatBuffers"

    weaknesses:
      - "3-5ms deserialization overhead (no zero-copy)"
      - "Requires full deserialization (memory allocations)"
      - "34x slower deserialize than FlatBuffers"

  messagepack:
    total_score: "4/10"

    criteria:
      zero_copy: "0/10 - Full deserialization required"
      performance: "6/10 - Faster than JSON, slower than FlatBuffers"
      type_safety: "0/10 - No schema, runtime errors"
      schema_evolution: "0/10 - No versioning"
      cross_platform: "8/10 - Python/C++/Rust/Java bindings"
      memory_efficiency: "8/10 - Compact binary format"
      ecosystem: "6/10 - Medium ecosystem"
      ease_of_use: "9/10 - No code generation, simple API"

    strengths:
      - "Compact binary format"
      - "Faster than JSON"
      - "No code generation"
      - "Simple API"

    weaknesses:
      - "No schema evolution"
      - "No type safety"
      - "Not zero-copy"

  avro:
    total_score: "5/10"

    criteria:
      zero_copy: "0/10 - Full deserialization required"
      performance: "4/10 - 2-3ms overhead"
      type_safety: "8/10 - Schema validation (runtime)"
      schema_evolution: "10/10 - Excellent schema evolution"
      cross_platform: "8/10 - Python/Java/C++ bindings"
      memory_efficiency: "7/10 - Compact binary format"
      ecosystem: "7/10 - Popular in Hadoop/Kafka ecosystem"
      ease_of_use: "5/10 - Requires schema registry"

    strengths:
      - "Excellent schema evolution"
      - "Compact binary format"
      - "Popular in Hadoop/Kafka ecosystem"

    weaknesses:
      - "No zero-copy"
      - "2-3ms deserialization overhead"
      - "Schema registry adds operational complexity"

# Alternatives Rejected
alternatives_rejected:
  description: "Why each alternative was rejected"

  json:
    rejection_reason: "Performance overhead exceeds K1 budget"

    performance_impact:
      hot_path_operations: 10
      serialization_per_op: "0.8ms (JSON) vs 0.09ms (FlatBuffers)"
      total_hot_path_latency: "8ms (JSON) vs 0.9ms (FlatBuffers)"
      percentage_of_ttft_budget: "5.3% (JSON) vs 0.6% (FlatBuffers)"
      conclusion: "JSON adds 7.1ms to hot path (exceeds <10ms budget)"

    size_impact:
      sessionstate_size: "192 KB (JSON) vs 64 KB (FlatBuffers)"
      size_ratio: "3x larger"
      network_overhead: "128 KB extra per SessionState transfer"
      conclusion: "JSON 3x larger (wastes bandwidth)"

    type_safety_impact:
      schema_count: 76
      languages: 3
      runtime_errors_in_dev: "24 (before adding type checking)"
      conclusion: "JSON lacks type safety (runtime errors in production)"

  protobuf:
    rejection_reason: "No zero-copy deserialization (3-5ms overhead per operation)"

    performance_impact:
      hot_path_operations: 10
      deserialization_per_op: "1.1ms (Protobuf) vs 0.05ms (FlatBuffers)"
      total_hot_path_latency: "11ms (Protobuf) vs 0.5ms (FlatBuffers)"
      percentage_of_ttft_budget: "7.3% (Protobuf) vs 0.3% (FlatBuffers)"
      conclusion: "Protobuf adds 10.5ms to hot path (exceeds <10ms budget)"

    memory_impact:
      deserialization_memory: "2x buffer size (original + deserialized)"
      gc_pauses: "5ms P95 (vs 2ms with FlatBuffers buffer pooling)"
      conclusion: "Protobuf requires full deserialization (memory allocations + GC pressure)"

    zero_copy_benefit:
      flatbuffers_deserialize: "0.05ms (zero-copy)"
      protobuf_deserialize: "1.1ms (full parse)"
      speedup: "22x faster"
      conclusion: "Zero-copy is critical for <1ms budget"

  messagepack:
    rejection_reason: "No schema evolution or type safety"

    schema_evolution_impact:
      total_schemas: 76
      schema_changes_per_year: "~20 (estimated)"
      breaking_changes_without_versioning: "High risk (no schema evolution)"
      conclusion: "MessagePack lacks schema evolution (high risk for K1↔K0 integration)"

    type_safety_impact:
      compile_time_errors: "0 (no schema)"
      runtime_errors: "High risk (no type checking)"
      conclusion: "MessagePack lacks type safety (runtime errors)"

  avro:
    rejection_reason: "No zero-copy + schema registry operational complexity"

    performance_impact:
      deserialization: "2-3ms (no zero-copy)"
      hot_path_latency: "20-30ms for 10 operations"
      conclusion: "Avro 2-3ms overhead exceeds <1ms budget"

    operational_impact:
      schema_registry: "Required for schema evolution"
      operational_complexity: "High (additional service to manage)"
      conclusion: "Avro schema registry adds operational overhead"

# Performance Comparison
performance_comparison:
  description: "Detailed performance comparison (production benchmarks)"

  sessionstate_64kb:
    description: "Full SessionState with 6 sections (largest K1 schema)"

    serialization:
      flatbuffers: "0.62ms P50, 0.88ms P95"
      json: "30ms P50, 42ms P95"
      protobuf: "2.9ms P50, 4.1ms P95"
      messagepack: "8.5ms P50, 12ms P95"
      avro: "3.2ms P50, 4.8ms P95"

      speedup_vs_json: "48x faster (30ms / 0.62ms)"
      speedup_vs_protobuf: "4.7x faster (2.9ms / 0.62ms)"

    deserialization:
      flatbuffers: "0.032ms P50, 0.038ms P95 (zero-copy)"
      json: "6.5ms P50, 12.5ms P95"
      protobuf: "1.1ms P50, 1.8ms P95"
      messagepack: "4.2ms P50, 6.8ms P95"
      avro: "1.5ms P50, 2.3ms P95"

      speedup_vs_json: "203x faster (6.5ms / 0.032ms)"
      speedup_vs_protobuf: "34x faster (1.1ms / 0.032ms)"

    buffer_size:
      flatbuffers: "64 KB"
      json: "192 KB (3x larger)"
      protobuf: "53 KB (1.2x smaller)"
      messagepack: "68 KB (1.06x larger)"
      avro: "58 KB (1.1x smaller)"

  agent_message_1kb:
    description: "Agent-to-agent message (small message)"

    serialization:
      flatbuffers: "0.06ms P50"
      json: "0.5ms P50"
      protobuf: "0.22ms P50"
      messagepack: "0.15ms P50"

      speedup_vs_json: "8.3x faster"

    deserialization:
      flatbuffers: "0.005ms P50 (zero-copy)"
      json: "0.4ms P50"
      protobuf: "0.08ms P50"
      messagepack: "0.12ms P50"

      speedup_vs_json: "80x faster"

  throughput_comparison:
    scenario: "Serialize 1,000 AgentState messages (1KB each)"

    flatbuffers:
      time: "80ms"
      throughput: "12,500 messages/second"
      cpu_usage: "18%"

    json:
      time: "900ms"
      throughput: "1,111 messages/second"
      cpu_usage: "42%"

    protobuf:
      time: "280ms"
      throughput: "3,571 messages/second"
      cpu_usage: "28%"

    speedup_vs_json: "11x higher throughput (12,500 / 1,111)"
    speedup_vs_protobuf: "3.5x higher throughput (12,500 / 3,571)"

# Hot Path Impact Analysis
hot_path_impact:
  description: "Impact on K1 hot path (10 serialization operations per turn)"

  operations_per_turn:
    - operation: "SessionState serialize (×2)"
      flatbuffers: "1.76ms (2 × 0.88ms P95)"
      json: "84ms (2 × 42ms P95)"
      protobuf: "8.2ms (2 × 4.1ms P95)"

    - operation: "AgentState serialize (×3)"
      flatbuffers: "0.45ms (3 × 0.15ms P95)"
      json: "1.5ms (3 × 0.5ms P95)"
      protobuf: "0.66ms (3 × 0.22ms P95)"

    - operation: "ToolCall serialize (×5)"
      flatbuffers: "0.4ms (5 × 0.08ms P95)"
      json: "2.5ms (5 × 0.5ms P95)"
      protobuf: "1.1ms (5 × 0.22ms P95)"

  total_hot_path_latency:
    flatbuffers: "2.61ms (within <10ms budget)"
    json: "88ms (exceeds budget by 78ms)"
    protobuf: "9.96ms (within budget, but barely)"

    conclusion: "FlatBuffers enables <10ms hot path; JSON exceeds by 78ms; Protobuf barely within budget"

  ttft_impact:
    ttft_budget: "150ms"

    flatbuffers_overhead: "2.61ms (1.7% of budget)"
    json_overhead: "88ms (58.7% of budget)"
    protobuf_overhead: "9.96ms (6.6% of budget)"

    conclusion: "FlatBuffers minimal TTFT impact (1.7%); JSON consumes 58.7% of budget"

