    value: 203
    target: ">100x"

  - name: "flatbuffers_hot_path_latency_ms"
    type: "histogram"
    description: "Total serialization latency for 10 hot-path operations"
    buckets: [1, 2, 5, 10, 20, 50]
    target: "<10ms"

  - name: "flatbuffers_ttft_impact_percentage"
    type: "gauge"
    description: "Serialization overhead as % of TTFT budget"
    value: 1.8
    target: "<5%"
