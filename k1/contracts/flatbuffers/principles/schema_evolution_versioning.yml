# FlatBuffers Schema Evolution & Versioning
# Part of: Epic 3.1, Issue 3.1.1 - FlatBuffers Design Principles
# Source ADR: ADR-0011d (Schema Evolution & Versioning)
# Purpose: Enable forward/backward compatible schema evolution with zero downtime

version: "1.0"
type: "flatbuffers_versioning"
status: "approved"

metadata:
  component: "FlatBuffers Schema Evolution"
  layer: "Cross-Layer (Serialization)"
  total_schemas: 76
  versioned_schemas: 12
  research:
    - "FlatBuffers Schema Evolution (Google 2014)"
    - "Protocol Buffers Compatibility (Google 2008)"
    - "ADR-0011d - Schema evolution & versioning"

# File Identifier Validation
file_identifier_validation:
  description: "4-character codes for schema identification and version validation"

  purpose:
    - "Prevent protocol mismatches (reject wrong schema)"
    - "Enable schema versioning (AGST v1.0, v1.1, v1.2)"
    - "Fast validation (4-byte comparison)"

  format:
    length: "4 uppercase ASCII characters (letters or digits)"
    examples:
      - "AGST - AGent STate"
      - "TASK - TASK announcement"
      - "SEST - SEssion STate"
      - "INRQ - INference ReQuest"
      - "PLND - PLaN Node"

  validation_logic: |
    def validate_buffer(buffer: bytes) -> bool:
      """Validate FlatBuffers file identifier"""
      if len(buffer) < 8:
        raise ValueError("Buffer too small (< 8 bytes)")

      # Read file identifier (first 4 bytes)
      file_id = buffer[0:4].decode('ascii')

      # Expected file identifier
      expected_id = "AGST"  # For AgentState schema

      if file_id != expected_id:
        raise ValueError(
          f"File identifier mismatch: expected '{expected_id}', got '{file_id}'"
        )

      return True

  production_benefits:
    error_prevention: "18 protocol mismatches caught in development (vs runtime crashes)"
    validation_latency: "0.001ms (4-byte comparison)"

# Schema Version Registry
schema_version_registry:
  description: "Central registry mapping file identifiers to schema versions"

  registry_file: "docs/SCHEMA_VERSIONS.md"

  registry_structure: |
    # FlatBuffers Schema Version Registry

    ## AgentState (AGST)
    - v1.0 (2024-01-15): Initial schema (agent_id, state, memory_mb)
    - v1.1 (2024-02-20): Added capabilities vector
    - v1.2 (2024-03-10): Deprecated memory_mb, added memory_bytes

    ## TaskAnnouncement (TASK)
    - v1.0 (2024-01-18): Initial schema

    ## SessionState (SEST)
    - v1.0 (2024-01-20): Initial 6-section schema
    - v1.1 (2024-02-15): Added multimodal section

    ## InferenceRequest (INRQ)
    - v1.0 (2024-01-25): Initial schema
    - v1.1 (2024-03-05): Added streaming support

  version_lookup:
    by_file_id: "Map file ID → list of versions"
    by_date: "Map release date → list of schema changes"
    by_breaking_changes: "Map version → list of breaking changes (should be empty)"

# Root Type Declaration
root_type_declaration:
  description: "Specify entry point table for every schema"

  requirement: "REQUIRED for every .fbs file"

  syntax: "root_type {TableName};"

  purpose:
    - "Define entry point for schema"
    - "Generate GetRootAs{TableName}() helper function"
    - "Enable buffer validation"

  example: |
    namespace k1.agent_fabric;

    table AgentState {
      agent_id: string;
      state: AgentLifecycleState;
      memory_mb: uint32;
    }

    file_identifier "AGST";
    root_type AgentState;  // Required

  generated_code: |
    # Python
    agent_state = AgentState.GetRootAs(buffer)  # Auto-generated helper

    # C++
    auto agent_state = k1::agent_fabric::GetAgentState(buffer);

    # Rust
    let agent_state = flatbuffers::root::<AgentState>(buffer)?;

# Backward Compatibility Rules
backward_compatibility:
  description: "Rules for maintaining compatibility with old readers (old code reading new data)"

  allowed_changes:
    - change: "Add optional field with default value"
      rationale: "Old readers ignore new fields (stored in vtable, never accessed)"
      example: |
        // v1.0
        table AgentState {
          agent_id: string;
          state: AgentLifecycleState;
        }

        // v1.1 (backward compatible: old readers ignore capabilities)
        table AgentState {
          agent_id: string;
          state: AgentLifecycleState;
          capabilities: [AgentCapability];  // ✅ Added optional field
        }

    - change: "Add enum value at end"
      rationale: "Old readers see unknown enum value, use fallback logic"
      example: |
        // v1.0
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          ACTIVE = 1,
          TERMINATED = 2
        }

        // v1.1 (backward compatible: old readers see value 3, use fallback)
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          ACTIVE = 1,
          TERMINATED = 2,
          DRAINING = 3  // ✅ Added at end
        }

    - change: "Add new table (not referenced by existing tables)"
      rationale: "Old readers never access new table"
      example: |
        // v1.1 (backward compatible: AgentCapability not referenced by v1.0 readers)
        table AgentCapability {
          cap_id: string;
          resource_type: string;
        }

    - change: "Add union variant"
      rationale: "Old readers ignore unknown union variants"
      example: |
        // v1.0
        union PlanNodeType {
          LLMInference,
          ToolCall
        }

        // v1.1 (backward compatible: old readers ignore MemoryRead)
        union PlanNodeType {
          LLMInference,
          ToolCall,
          MemoryRead  // ✅ Added variant
        }

    - change: "Mark field as deprecated"
      rationale: "Field still exists, old readers can access it"
      example: |
        // v1.2 (backward compatible: memory_mb still present)
        table AgentState {
          agent_id: string;
          memory_mb: uint32 (deprecated);  // ✅ Marked deprecated
          memory_bytes: uint64;            // Added replacement
        }

  forbidden_changes:
    - change: "Remove field"
      rationale: "Old readers expect field to exist (vtable lookup fails)"
      example: |
        // v1.0
        table AgentState {
          agent_id: string;
          old_field: string;  // Old readers expect this
        }

        // v1.1 (BREAKING: old readers crash when accessing old_field)
        table AgentState {
          agent_id: string;
          // ❌ old_field removed (BREAKING CHANGE)
        }

    - change: "Rename field"
      rationale: "Old readers look for old field name (not found)"
      example: |
        // v1.0
        table AgentState {
          agent_id: string;
        }

        // v1.1 (BREAKING: old readers look for agent_id, find agent_identifier)
        table AgentState {
          agent_identifier: string;  // ❌ Renamed (BREAKING CHANGE)
        }

    - change: "Change field type"
      rationale: "Old readers interpret bytes as wrong type (data corruption)"
      example: |
        // v1.0
        table AgentState {
          memory_mb: uint32;
        }

        // v1.1 (BREAKING: old readers interpret uint64 as uint32)
        table AgentState {
          memory_mb: uint64;  // ❌ Changed type (BREAKING CHANGE)
        }

    - change: "Remove enum value"
      rationale: "Old writers may still send removed value (validation fails)"
      example: |
        // v1.0
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          DEPRECATED_STATE = 1,
          ACTIVE = 2
        }

        // v1.1 (BREAKING: old writers send DEPRECATED_STATE, validation fails)
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          // ❌ DEPRECATED_STATE removed (BREAKING CHANGE)
          ACTIVE = 2
        }

    - change: "Change enum value number"
      rationale: "Old readers interpret wrong value (semantic mismatch)"
      example: |
        // v1.0
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          ACTIVE = 1
        }

        // v1.1 (BREAKING: old readers interpret 1 as ACTIVE, new schema is DRAINING)
        enum AgentLifecycleState : uint8 {
          PENDING = 0,
          DRAINING = 1,  // ❌ Changed ACTIVE → DRAINING (BREAKING CHANGE)
          ACTIVE = 2
        }

# Forward Compatibility Rules
forward_compatibility:
  description: "Rules for maintaining compatibility with new writers (new code reading old data)"

  old_code_reading_new_data:
    unknown_fields:
      behavior: "Old readers ignore unknown fields (stored in vtable, never accessed)"
      mechanism: "Vtable contains offsets for all fields; old code only looks up known fields"
      example: |
        # v1.0 reader, v1.1 data (with capabilities field)
        agent_state = AgentState.GetRootAs(buffer)
        print(agent_state.AgentId())  # ✅ Works (field exists in v1.0)
        print(agent_state.State())    # ✅ Works (field exists in v1.0)
        # capabilities field exists in buffer but v1.0 reader never accesses it

    missing_fields:
      behavior: "New readers use default values for missing fields"
      mechanism: "Vtable offset is 0 (absent), reader returns default value"
      example: |
        # v1.1 reader, v1.0 data (no capabilities field)
        agent_state = AgentState.GetRootAs(buffer)
        print(agent_state.AgentId())      # ✅ Works (field exists in v1.0)
        print(agent_state.Capabilities()) # ✅ Returns empty vector (default)

    unknown_enum_values:
      behavior: "Old readers see unknown enum value, use fallback logic"
      mechanism: "Enum stored as integer; old code doesn't recognize new values"
      example: |
        # v1.0 reader, v1.1 data (DRAINING state = 3)
        agent_state = AgentState.GetRootAs(buffer)
        state = agent_state.State()  # Returns 3 (DRAINING)

        # Old code doesn't have DRAINING in enum (max value = 2)
        if state == AgentLifecycleState.PENDING:
          # ...
        elif state == AgentLifecycleState.ACTIVE:
          # ...
        else:
          # ✅ Fallback: Unknown state (value 3)
          logger.warning(f"Unknown AgentLifecycleState: {state}")

# Deprecation Policy
deprecation_policy:
  description: "3-release grace period for field deprecation"

  timeline:
    release_n:
      action: "Add new field, mark old field as (deprecated)"
      code_changes:
        - "Update writers to populate both old and new fields"
        - "Update readers to prefer new field, fall back to old"
      schema_change: |
        // Release N: Deprecate memory_mb, add memory_bytes
        table AgentState {
          agent_id: string;
          memory_mb: uint32 (deprecated);  // ✅ Marked deprecated
          memory_bytes: uint64;            // ✅ Added replacement
        }

    release_n_plus_1:
      action: "Emit warnings when old field is accessed (optional)"
      code_changes:
        - "Add deprecation warnings in readers"
        - "Continue populating both fields in writers"
      example: |
        # Python reader (Release N+1)
        memory_mb = agent_state.MemoryMb()
        if memory_mb != 0:
          warnings.warn(
            "AgentState.memory_mb is deprecated, use memory_bytes",
            DeprecationWarning,
            stacklevel=2
          )

    release_n_plus_2:
      action: "Remove old field from generated code (schema file remains)"
      code_changes:
        - "Stop populating old field in writers"
        - "Remove old field accessors from generated code"
      rationale: "Old field still in schema for backward compatibility, but not accessible"

    release_n_plus_3:
      action: "Remove old field from schema file (after 3 releases)"
      code_changes:
        - "Delete old field from .fbs schema file"
        - "Regenerate all bindings"
      schema_change: |
        // Release N+3: Remove deprecated field
        table AgentState {
          agent_id: string;
          memory_bytes: uint64;  // Only new field remains
        }

  example_migration:
    scenario: "AgentState.memory_mb (uint32) → memory_bytes (uint64)"

    release_1_0:
      schema: |
        table AgentState {
          agent_id: string;
          memory_mb: uint32;
        }

    release_1_1:
      schema: |
        table AgentState {
          agent_id: string;
          memory_mb: uint32 (deprecated);  // Marked deprecated
          memory_bytes: uint64;            // Added replacement
        }
      writer_code: |
        # Populate both fields (for backward compatibility)
        AgentState.AddMemoryMb(builder, memory_bytes // 1_000_000)  # Convert to MB
        AgentState.AddMemoryBytes(builder, memory_bytes)
      reader_code: |
        # Prefer new field, fall back to old
        memory_bytes = agent_state.MemoryBytes()
        if memory_bytes == 0:
          memory_bytes = agent_state.MemoryMb() * 1_000_000  # Convert from MB

    release_1_2:
      schema: "Same as 1.1 (grace period)"
      code: "Emit deprecation warnings when memory_mb accessed"

    release_1_3:
      schema: "Same as 1.1 (schema file unchanged)"
      code: "Remove MemoryMb() accessor from generated code"

    release_1_4:
      schema: |
        table AgentState {
          agent_id: string;
          memory_bytes: uint64;  // Only new field remains
        }
      code: "Old field fully removed from schema and code"

# Migration Tooling
migration_tooling:
  description: "Tools for detecting changes and migrating old buffers"

  schema_diff_tool:
    script: "scripts/schema_diff.py"
    purpose: "Detect changes between schema versions, identify breaking changes"

    usage: |
      python scripts/schema_diff.py \
        --old k1/schemas/agent_fabric/agent_state.fbs@v1.0 \
        --new k1/schemas/agent_fabric/agent_state.fbs@v1.1

    output_example: |
      Schema Diff: agent_state.fbs (v1.0 → v1.1)

      ✅ COMPATIBLE CHANGES:
        - Added field: capabilities (vector<AgentCapability>)
        - Added table: AgentCapability

      ❌ BREAKING CHANGES:
        (none)

      ⚠️  DEPRECATIONS:
        (none)

  buffer_migration_tool:
    script: "scripts/migrate_buffer.py"
    purpose: "Migrate old buffers to new schema version"

    usage: |
      python scripts/migrate_buffer.py \
        --schema k1/schemas/agent_fabric/agent_state.fbs \
        --from-version 1.0 \
        --to-version 1.1 \
        --input old_buffer.bin \
        --output new_buffer.bin

    implementation: |
      #!/usr/bin/env python3
      """
      Migrate FlatBuffers buffer from old schema version to new version.

      Usage:
        python migrate_buffer.py --schema agent_state.fbs \
                                 --from-version 1.0 \
                                 --to-version 1.1 \
                                 --input old.bin \
                                 --output new.bin
      """
      import flatbuffers
      from k1.schemas.generated.python.agent_fabric import AgentState
      from k1.schemas.generated.python.agent_fabric import AgentStateT

      def migrate_agent_state_v1_0_to_v1_1(buffer: bytes) -> bytes:
        """Migrate AgentState from v1.0 to v1.1 (added capabilities)"""

        # Deserialize old buffer (v1.0)
        old_agent = AgentState.GetRootAs(buffer)

        # Create mutable object (using object API)
        agent_obj = AgentStateT()
        agent_obj.agent_id = old_agent.AgentId()
        agent_obj.state = old_agent.State()
        agent_obj.memory_mb = old_agent.MemoryMb()
        agent_obj.capabilities = []  # New field (empty vector)

        # Serialize to new buffer (v1.1)
        builder = flatbuffers.Builder(256)
        new_agent = agent_obj.Pack(builder)
        builder.Finish(new_agent)

        return bytes(builder.Output())

# Version Negotiation
version_negotiation:
  description: "Protocol for K1↔K0 schema version negotiation"

  k1_to_k0_handshake:
    description: "K1 and K0 negotiate supported schema versions on connection"

    protocol:
      step_1_k1_sends_init:
        message_type: "InitMessage"
        schema: |
          table InitMessage {
            k1_version: string;
            supported_schemas: [SchemaVersion];
          }

          table SchemaVersion {
            file_id: string;        // "AGST", "TASK", etc.
            min_version: string;    // "1.0"
            max_version: string;    // "1.2"
          }
        example: |
          {
            "k1_version": "1.5.0",
            "supported_schemas": [
              {"file_id": "AGST", "min_version": "1.0", "max_version": "1.2"},
              {"file_id": "TASK", "min_version": "1.0", "max_version": "1.0"},
              {"file_id": "SEST", "min_version": "1.0", "max_version": "1.1"}
            ]
          }

      step_2_k0_sends_ack:
        message_type: "AckMessage"
        schema: |
          table AckMessage {
            k0_version: string;
            selected_versions: [SchemaVersion];
          }
        example: |
          {
            "k0_version": "2.1.0",
            "selected_versions": [
              {"file_id": "AGST", "version": "1.2"},  // Use latest supported
              {"file_id": "TASK", "version": "1.0"},
              {"file_id": "SEST", "version": "1.0"}   // K0 doesn't support 1.1 yet
            ]
          }

      step_3_k1_uses_selected:
        action: "K1 uses selected versions for all K1↔K0 messages"
        example: |
          # K1 sends AgentState using v1.2 schema
          # K1 sends SessionState using v1.0 schema (K0 doesn't support v1.1)

  http_header_versioning:
    description: "HTTP header for schema version in REST APIs"

    header_name: "X-Schema-Version"
    format: "{file_id}:{version}"

    example_request: |
      POST /k1/sessions HTTP/1.1
      Host: k1-api.example.com
      Content-Type: application/octet-stream
      X-Schema-Version: SEST:1.2

      <FlatBuffers SessionState buffer>

    example_response: |
      HTTP/1.1 200 OK
      Content-Type: application/octet-stream
      X-Schema-Version: SEST:1.2

      <FlatBuffers SessionState buffer>

    version_mismatch_error: |
      HTTP/1.1 400 Bad Request
      Content-Type: application/json

      {
        "error": "schema_version_not_supported",
        "message": "SessionState v1.3 not supported (max supported: v1.2)",
        "supported_versions": ["1.0", "1.1", "1.2"]
      }

# Production Evidence
