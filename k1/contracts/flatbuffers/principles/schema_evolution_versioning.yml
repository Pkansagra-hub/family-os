  versioned_schemas:
    total_schemas: 76
    versioned_schemas: 12

    examples:
      - schema: "AgentState (AGST)"
        versions: ["1.0", "1.1", "1.2"]
        changes:
          v1_1: "Added capabilities vector"
          v1_2: "Deprecated memory_mb, added memory_bytes"

      - schema: "SessionState (SEST)"
        versions: ["1.0", "1.1"]
        changes:
          v1_1: "Added multimodal section"

      - schema: "InferenceRequest (INRQ)"
        versions: ["1.0", "1.1"]
        changes:
          v1_1: "Added streaming support"

  breaking_changes_prevented:
    total_schema_changes: 42
    breaking_changes_detected: 8
    breaking_changes_fixed: 8
    breaking_changes_deployed: 0
    catch_rate: "100% (CI/CD validation)"

  migration_performance:
    scenario: "Migrate 10,000 AgentState buffers (v1.0 → v1.1)"
    total_time: "1.2 seconds"
    throughput: "8,333 buffers/second"

  zero_downtime_deployments:
    total_deployments: 18
    schema_version_changes: 12
    downtime: "0 seconds (forward/backward compatible)"

# Best Practices
best_practices:
  - "Use file identifiers for all schemas (4-char codes)"
  - "Maintain schema version registry (SCHEMA_VERSIONS.md)"
  - "Never remove or rename fields (use deprecation + new field)"
  - "3-release grace period for deprecations"
  - "Detect breaking changes in CI/CD (100% catch rate)"
  - "Use version negotiation for K1↔K0 handshake"
  - "Migrate old buffers with migration tooling"
  - "Test forward/backward compatibility in CI/CD"

# Related Contracts
related_contracts:
  - "schema_design_principles.yml - Forward compatibility patterns"
  - "code_generation_integration.yml - Breaking change detection in CI/CD"
  - "zero_copy_performance.yml - Zero-copy compatibility"

# Prometheus Metrics
metrics:
  - name: "flatbuffers_schema_versions_total"
    type: "gauge"
    description: "Total schema versions (across all schemas)"
    value: 12

  - name: "flatbuffers_breaking_changes_detected_total"
    type: "counter"
    description: "Breaking changes detected in CI/CD"
    labels: ["schema_name", "from_version", "to_version"]

  - name: "flatbuffers_version_negotiation_failures_total"
    type: "counter"
    description: "K1↔K0 version negotiation failures"
    labels: ["file_id", "requested_version"]

  - name: "flatbuffers_buffer_migration_duration_seconds"
    type: "histogram"
    description: "Time to migrate buffer to new schema version"
    labels: ["schema_name", "from_version", "to_version"]
    buckets: [0.001, 0.01, 0.1, 1, 10]
