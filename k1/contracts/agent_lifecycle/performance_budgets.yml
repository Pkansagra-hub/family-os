# Performance Budgets Contract
# Source ADR: ADR-0005 (Agent Lifecycle FSM with 6 States)
# Defines P95 performance targets for all lifecycle operations

metadata:
  contract_id: "performance-budgets-v1.0"
  source_adr: "0005-agent-lifecycle-fsm.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Performance Budget Overview
performance_overview:
  source: "whiteboard.md L2698, ADR-0005"
  measurement: "P95 percentiles (95th percentile)"
  device_targets:
    laptop: "Primary target device"
    phone: "Secondary target device (higher tolerance)"
  validation: "WARD integration tests with performance assertions"

# Core Lifecycle Performance Targets
lifecycle_targets:

  # Cold Start (PENDING → ACTIVE)
  cold_start:
    description: "Complete agent hire and warmup"
    laptop_p95_ms: 250
    phone_p95_ms: 500
    breakdown:
      pending_to_warming: 10
      ai_agent_warming: 240
      pure_actor_warming: 40
    current_status: "AI agents: 240ms ✅, Pure actors: 25ms ✅"

  # Warm Reactivation (IDLE → ACTIVE)
  reactivation:
    description: "Fast reactivation from idle pool"
    p95_ms: 50
    current_status: "70ms (needs optimization)"
    bottleneck: "K0 prompt cache re-hydration (30-40ms)"

  # Graceful Shutdown (DRAINING → TERMINATED)
  draining:
    description: "Complete draining and termination"
    p95_ms: 10000  # Max budget
    typical_ms: "1000-5000"
    current_status: "IN PROGRESS (timeout tuning)"

  # State Transition Overhead
  state_transition:
    description: "FSM transition latency (excluding state actions)"
    p95_ms: 5
    current_status: "✅ <5ms achieved"

# Per-State Performance Budgets
state_budgets:

  # PENDING State
  PENDING:
    duration_budget_ms: 5000  # Timeout
    typical_duration_ms: 10
    actions_budget:
      roster_registration: 5
      lease_creation: 3
      agent_instantiation: 2

  # WARMING State
  WARMING:
    duration_budget_ms: 5000  # Timeout
    ai_agents_budget_ms: 250
    pure_actors_budget_ms: 50

    ai_agent_breakdown:
      model_weights: 150
      persona_prompts: 10
      kv_cache: 20
      tools: 15
      llm_warmup: 40
      registration: 5

    pure_actor_breakdown:
      config_load: 20
      mailbox_init: 5
      registration: 5

  # ACTIVE State
  ACTIVE:
    mailbox_poll_latency_p95_ms: 0.5
    task_bid_response_p95_ms: 50
    idle_detection_window_ms: 200

    ai_agent_performance:
      task_execution_p95_ms: "50-500 (LLM inference)"
      tool_call_e2e_p95_ms: 3000
      model_inference_ttft_p95_ms: 150

    pure_actor_performance:
      task_execution_p95_ms: "<5 (deterministic)"
      no_tools: true
      no_model: true

  # IDLE State
  IDLE:
    memory_footprint_percent: "60-80 of ACTIVE"
    ttl_default_ms: 300000  # 5 minutes
    reactivation_p95_ms: 50
    health_check_interval_ms: 1000

  # DRAINING State
  DRAINING:
    max_duration_ms: 10000
    pressure_draining_ms: 2000
    breakdown:
      reject_tasks: 5
      finish_current_task: "varies (up to 5000)"
      flush_state: 1000
      flush_receipts: 500
      revoke_capabilities: 10
      notify_supervisor: 5

  # TERMINATED State
  TERMINATED:
    cleanup_budget_ms: 50
    actions:
      unload_model: 20
      release_kv_cache: 10
      close_mailbox: 5
      remove_from_roster: 5
      revoke_lease: 5
      log_termination: 5

# Memory Budgets
memory_budgets:

  # Per-Agent Memory Limits
  per_agent_limits:
    ai_agents_mb: 150  # Model weights + KV cache
    pure_actors_mb: 10  # Config + mailbox
    total_k1_budget_mb: 500

  # State-Specific Footprint
  state_footprint:
    PENDING: "<1MB"
    WARMING: "50-150MB (loading)"
    ACTIVE: "150MB (AI), 10MB (pure)"
    IDLE: "90-120MB (AI), 6-8MB (pure)"
    DRAINING: "same as ACTIVE/IDLE"
    TERMINATED: "0MB"

  # Memory Pressure Thresholds
  pressure_thresholds:
    warning: 0.7  # 70% heap
    critical: 0.8  # 80% heap → drain IDLE agents
    emergency: 0.9  # 90% heap → force termination

# Thermal Placement Budgets
thermal_budgets:

  # Device Priority (NPU > GPU > CPU > Remote)
  placement_priority: ["NPU", "GPU", "CPU", "Remote API"]

  # Thermal Limits
  thermal_limits:
    npu_max_celsius: 80
    gpu_max_celsius: 85
    cpu_max_celsius: 90

  # Thermal Pressure Triggers
  thermal_triggers:
    warning: "T_hot - 5°C"
    critical: "T_hot"      # Drain high-contribution agents
    emergency: "T_hot + 5°C"  # Force termination

# Supervisor Performance
supervisor_performance:

  # Health Checks
  health_checks:
    interval_ms: 1000
    ping_timeout_ms: 500
    event_loop_heartbeat_ms: 200
    crash_detection_ms: 1200  # Max detection time

  # State Transitions
  transition_coordination:
    monotonic_clock_overhead_ms: 1
    deadline_setting_ms: 1
    intent_processing_ms: 2

  # Resource Management
  resource_checks:
    memory_pressure_check_ms: 5
    thermal_pressure_check_ms: 10
    eviction_decision_ms: 5

# Observability Performance
observability_performance:

  # Metrics Emission
  metrics_overhead:
    state_transition_ms: 2
    histogram_observation_ms: 1
    counter_increment_ms: 1

  # Tracing
  tracing_overhead:
    span_creation_ms: 1
    attribute_setting_ms: 1
    span_closing_ms: 1

  # Logging
  logging_overhead:
    structured_log_ms: 2
    error_log_ms: 5

# End-to-End Session Performance
session_performance:

  # Multi-Turn Conversation
  conversation_targets:
    first_turn_ttft_p95_ms: 250  # Cold start
    subsequent_turns_p95_ms: 50  # Reactivation
    conversation_retention_hours: 1

  # Session Lifecycle
  session_budgets:
    session_startup_ms: 500  # Agent hire + warmup
    session_teardown_ms: 2000  # Drain all agents
    max_agents_per_session: 3

# Performance Validation
validation_requirements:

  # Test Environments
  test_environments:
    - "Laptop (primary): Intel i7, 16GB RAM, NVIDIA RTX 4060"
    - "Phone (secondary): Snapdragon 8 Gen 3, 12GB RAM"
    - "CI/CD: GitHub Actions runners"

  # Benchmark Suite
  benchmark_suite:
    - "agent_warmup_bench.py: P95 warmup latency"
    - "agent_reactivation_bench.py: P95 reactivation latency"
    - "agent_draining_bench.py: P95 draining latency"
    - "memory_pressure_bench.py: Memory utilization under load"
    - "thermal_placement_bench.py: Device placement decisions"

  # Performance Assertions
  ward_assertions:
    - "assert warmup_duration < 250ms, f'Warmup took {duration}ms'"
    - "assert reactivation_duration < 50ms, f'Reactivation took {duration}ms'"
    - "assert draining_duration < 10000ms, f'Draining took {duration}ms'"

# CI-Gated KPIs
kpis:

  # Critical Performance Gates
  critical_gates:
    warming_p95_ms:
      threshold: 250
      fail_if: "warming_p95_ms > 250"
      device_scope: "laptop"
      ci_blocking: true
      rationale: "Cold start performance critical for user experience"

    reactivation_p95_ms:
      threshold: 50
      fail_if: "reactivation_p95_ms > 50"
      device_scope: "laptop"
      ci_blocking: true
      rationale: "Multi-turn conversation responsiveness"

    draining_p95_ms:
      threshold: 10000
      fail_if: "draining_p95_ms > 10000"
      device_scope: "laptop"
      ci_blocking: false  # Warning only
      rationale: "Graceful shutdown (higher tolerance)"

  # Memory Gates
  memory_gates:
    k1_memory_total_mb:
      threshold: 500
      fail_if: "k1_memory_total_mb > 500"
      ci_blocking: true
      rationale: "Total memory budget for K1 system"

    agent_memory_mb:
      threshold: 150  # AI agents
      fail_if: "agent_memory_mb > 150"
      ci_blocking: true
      rationale: "Per-agent memory limits"

  # Thermal Gates
  thermal_gates:
    device_temperature_celsius:
      threshold: 85  # GPU max
      fail_if: "device_temperature_celsius > 85"
      ci_blocking: false  # Warning only
      rationale: "Thermal safety limits"

  # CI Integration
  ci_integration:
    test_command: "python -m ward test --path tests/performance/"
    benchmark_command: "python benchmarks/run_performance_suite.py"
    gate_check_command: "python scripts/check_performance_gates.py"
    failure_action: "Block merge, notify architecture team"
    success_action: "Update performance dashboard"

  # Gate Override Process
  gate_override:
    authorized_roles: ["Tech Lead", "Principal Engineer"]
    justification_required: true
    temporary_duration: "Max 24 hours"
    audit_logging: true
    rationale: "Emergency performance regression handling"

# Current Performance Status
current_status:

  # Achieved Targets
  achieved:
    - "AI agent warmup: 240ms (target 250ms)"
    - "Pure actor warmup: 25ms (target 50ms)"
    - "State transition overhead: <5ms"
    - "Mailbox poll latency: <0.5ms"

  # In Progress
  in_progress:
    - "Reactivation latency: 70ms (target 50ms) - K0 optimization needed"
    - "Draining timeout tuning: Large state compression pending"
    - "Memory pressure eviction: Fair policy implementation"

  # Future Optimizations
  future_optimizations:
    - "Cross-session agent pooling: Reduce warmup to 10ms"
    - "KV cache residency: Eliminate reactivation cache restore"
    - "Delta compression: Speed up large state draining"

# Performance Monitoring
monitoring:

  # Key Metrics
  key_metrics:
    - "agent_warmup_duration_ms{agent_type, device_type}"
    - "agent_reactivation_duration_ms{agent_id}"
    - "agent_draining_duration_ms{agent_id}"
    - "k1_memory_usage_mb"
    - "device_temperature_celsius{device_type}"

  # Alerts
  alerts:
    - "WarmupSlow: p95 > 250ms for 5 min"
    - "ReactivationSlow: p95 > 50ms for 5 min"
    - "DrainingSlow: p95 > 10000ms for 5 min"
    - "MemoryPressure: usage > 80% for 1 min"
    - "ThermalOvershoot: temperature > T_hot for 1 min"

# Research Backing
research_backing:
  - "TTFT Targets: Industry LLM serving (vLLM, TensorRT)"
  - "Memory Budgets: Mobile AI constraints (Apple Neural Engine, Snapdragon)"
  - "Thermal Management: Device thermal design power (TDP) limits"
