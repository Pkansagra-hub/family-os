# Warming State Contract
# Source ADR: ADR-0005 (Agent Lifecycle FSM with 6 States)
# Defines WARMING state actions, performance budgets, and failure handling

metadata:
  contract_id: "warming-state-v1.0"
  source_adr: "0005-agent-lifecycle-fsm.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# WARMING State Overview
warming_overview:
  description: "Agent loading AI models, initializing KV cache, registering tools, and loading persona prompts"
  entry_trigger: "Supervisor invokes agent initialization"
  exit_trigger: "All resources initialized and ready"
  timeout_ms: 5000
  failure_action: "TERMINATED"

# AI Agent WARMING Sequence (4 AI Agents)
ai_agent_warming:
  description: "Complex warmup for LLM-based agents (Concierge, Planner, Researcher, Safety Watch)"
  total_budget_ms: 250  # <250ms on laptop, <500ms on phone
  parallel_execution: true  # Steps can run concurrently where possible

  steps:

    # Step 1: Load LLM/SLM Model Weights
    load_model_weights:
      description: "Load model to NPU/GPU/CPU memory with thermal placement"
      target_ms: 150-200
      placement_priority: ["NPU", "GPU", "CPU", "Remote API"]
      models_by_agent:
        planner: "gpt-4 or claude-3-sonnet or llama-3-8b"
        concierge: "gpt-4 or claude-3-sonnet or phi-3"
        researcher: "gpt-4 or claude-3-sonnet or qwen-2.5"
        safety_watch: "gpt-4 or claude-3-sonnet or llama-3-8b"
      thermal_aware: true
      coordinator: "Model Hub placement_planner"
      failure_modes:
        - "model_file_not_found"
        - "insufficient_memory"
        - "thermal_throttling"

    # Step 2: Load Agent Persona Prompts
    load_persona_prompts:
      description: "Load prompt templates from model_hub/prompt_library/agent_prompts/"
      target_ms: 5-10
      prompt_files:
        planner:
          - "plan_generation.jinja2"
          - "task_evaluation.jinja2"
        concierge:
          - "system_prompt.jinja2"
          - "clarification.jinja2"
        researcher:
          - "research_strategy.jinja2"
          - "synthesis.jinja2"
        safety_watch:
          - "content_filtering.jinja2"
          - "safety_evaluation.jinja2"
      source: "model_hub/prompt_library/"
      failure_modes:
        - "template_file_missing"
        - "jinja2_syntax_error"

    # Step 3: Initialize KV Cache
    initialize_kv_cache:
      description: "Allocate KV cache buffers for context with 75% hit rate target"
      target_ms: 20-30
      coordinator: "Model Hub kv_cache_broker"
      allocation_strategy: "pre-allocate for multi-turn conversations"
      hit_rate_target: 0.75
      failure_modes:
        - "insufficient_memory"
        - "cache_allocation_failed"

    # Step 4: Register Tools
    register_tools:
      description: "Load tool schemas from tools/registry (JSON specs)"
      target_ms: 10-20
      tool_types: ["MCP", "WASM", "Process"]
      sandbox_setup: true
      registry_source: "tools/registry/"
      failure_modes:
        - "tool_schema_invalid"
        - "sandbox_creation_failed"

    # Step 5: Warm LLM Inference
    warm_llm_inference:
      description: "Run 1-2 warmup LLM calls to JIT-compile kernels"
      target_ms: 30-50
      warmup_queries: 1-2
      purpose: "JIT compilation and kernel optimization"
      ensures_ttft: true  # First real call hits <150ms target
      failure_modes:
        - "llm_inference_failed"
        - "timeout_exceeded"

    # Step 6: Supervisor Registration
    supervisor_registration:
      description: "Report readiness to supervisor via mailbox message"
      target_ms: 5
      message_type: "WARMUP_COMPLETE"
      includes_metadata:
        - "agent_id"
        - "agent_type"
        - "warmup_duration_ms"
        - "resource_footprint_mb"

  # Performance Budget Breakdown
  performance_budget:
    ai_agents:
      warm_start_p95_ms: 250   # weights resident (pre-placement/IDLE pool)
      cold_start_note: "Cold load may exceed budgets; prefer pre-warm or keep IDLE."
    pure_actors:
      warm_start_p95_ms: 50
    breakdown:
      model_weights: 150
      persona_prompts: 10
      kv_cache: 20
      tools: 15
      llm_warmup: 40
      registration: 5
    device_variants:
      laptop: 250
      phone: 500
    optimization_targets:
      - "Parallel model load + prompt load"
      - "Pre-allocated KV cache pools"
      - "Lazy tool registration (on first use)"

# Pure Actor WARMING Sequence (54 Pure Actors)
pure_actor_warming:
  description: "Simple warmup for deterministic actors (Orchestrator, Router, Protocol Monitor, etc.)"
  total_budget_ms: 50
  parallel_execution: false  # Sequential is fine for <50ms

  steps:

    # Step 1: Load Configuration
    load_configuration:
      description: "Load YAML configuration from k1/config/"
      target_ms: 10-20
      config_files:
        orchestrator: "orchestrator.yml"
        router: "router.yml"
        protocol_monitor: "protocol_monitor.yml"
        supervisor: "supervisor.yml"
        # ... etc for all 54 actors
      validation: "Pydantic schemas"
      failure_modes:
        - "config_file_missing"
        - "yaml_parse_error"
        - "schema_validation_failed"

    # Step 2: Initialize Mailbox
    initialize_mailbox:
      description: "Create MPSC queue for Actor message-passing"
      target_ms: 5
      queue_type: "MPSC (Multi-Producer Single-Consumer)"
      buffer_size: "configurable (default 1000)"
      failure_modes:
        - "queue_creation_failed"

    # Step 3: Register with Supervisor
    supervisor_registration:
      description: "Report readiness to supervisor"
      target_ms: 5
      message_type: "WARMUP_COMPLETE"
      includes_metadata:
        - "agent_id"
        - "agent_type"
        - "config_loaded: true"

  # Performance Budget Breakdown
  performance_budget:
    total_target_ms: 50
    breakdown:
      config_load: 20
      mailbox_init: 5
      registration: 5
    no_model_hub: true
    optimization_targets:
      - "Cached config parsing"
      - "Pre-allocated mailbox pools"

# Failure Handling
failure_handling:

  # Timeout Exceeded
  timeout_exceeded:
    condition: "warmup_duration > 5000ms"
    action: "TERMINATED"
    logging:
      level: "ERROR"
      message: "Agent {agent_id} warmup timeout after {duration_ms}ms"
      includes:
        - "agent_type"
        - "last_completed_step"
        - "error_details"

  # Resource Unavailable
  resource_unavailable:
    conditions:
      - "insufficient_memory"
      - "model_file_missing"
      - "thermal_throttling"
      - "tool_schema_invalid"
    action: "TERMINATED"
    retry_policy: "Supervisor may retry with backoff"
    logging:
      level: "WARNING"
      message: "Agent {agent_id} warmup failed: {reason}"
      includes:
        - "agent_type"
        - "resource_details"

  # Crash During Warmup
  crash_during_warmup:
    conditions:
      - "unhandled_exception"
      - "segmentation_fault"
      - "out_of_memory"
    action: "TERMINATED"
    supervisor_action: "Log failure, potentially blacklist"
    logging:
      level: "ERROR"
      message: "Agent {agent_id} crashed during warmup"
      includes:
        - "agent_type"
        - "exception_type"
        - "stack_trace"

# Observability
observability:

  # Metrics
  metrics:
    agent_warmup_duration_ms:
      type: "histogram"
      labels: ["agent_type", "device_type"]
      buckets: [50, 100, 150, 200, 250, 300, 400, 500]
      description: "Agent warmup latency"

    agent_warmup_steps_duration_ms:
      type: "histogram"
      labels: ["agent_type", "step_name"]
      description: "Duration of individual warmup steps"

    agent_warmup_failures_total:
      type: "counter"
      labels: ["agent_type", "failure_reason"]
      description: "Total warmup failures"

  # Events
  events:
    agent_warmup_started:
      fields: ["agent_id", "agent_type", "timestamp"]
    agent_warmup_step_completed:
      fields: ["agent_id", "step_name", "duration_ms"]
    agent_warmup_completed:
      fields: ["agent_id", "agent_type", "total_duration_ms", "device_type"]
    agent_warmup_failed:
      fields: ["agent_id", "agent_type", "failure_reason", "duration_ms"]

  # Tracing
  tracing:
    span_name: "agent_warmup"
    attributes:
      - "agent_id"
      - "agent_type"
      - "device_type"
      - "total_duration_ms"
    child_spans:
      - "load_model_weights"
      - "load_persona_prompts"
      - "initialize_kv_cache"
      - "register_tools"
      - "warm_llm_inference"

# Implementation Status
implementation_status:
  ai_agent_warming: "COMPLETED"
  pure_actor_warming: "COMPLETED"
  performance_optimization: "IN PROGRESS"
  error_handling: "COMPLETED"
  observability: "COMPLETED"

# Research Backing
research_backing:
  - "Kubernetes Init Containers (separate warmup phase before pod ready)"
  - "JVM Warmup (JIT compilation and class loading before serving)"
  - "TensorFlow Graph Compilation (ahead-of-time compilation for inference optimization)"
