# Agent Registry Schema Contract
# Source ADR: ADR-0005e (Agent Personality & Capability System)
# Defines YAML schema for agent specifications and registry management

metadata:
  contract_id: "agent-registry-schema-v1.0"
  source_adr: "0005e-agent-personality-capabilities.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Agent Registry Schema Overview
agent_registry_schema_overview:
  description: "YAML schema for agent specifications, registry management, and personality configuration"
  purpose: "Standardized agent definitions, automated validation, and registry management"
  effectiveness: "100% schema compliance, <10ms agent loading, zero configuration errors"
  scope: "All 58 agents (4 AI + 54 pure actors) with complete personality specifications"

# Registry Schema System
registry_schema_system:

  # Schema Architecture
  schema_architecture:
    format: "YAML 1.2 with JSON Schema validation"
    structure: "Hierarchical (registry → agent → personality → capabilities)"
    validation: "Compile-time schema validation with detailed error messages"
    extensibility: "Versioned schema with backward compatibility"
    rationale: "Standards-compliant, validated configuration management"

  # Schema Components
  schema_components:
    agent_registry: "Top-level registry containing all agents"
    agent_specification: "Individual agent configuration"
    personality_config: "Personality traits and capabilities"
    capability_matrix: "Security capability assignments"
    validation_rules: "Schema constraints and business rules"
    rationale: "Modular, maintainable schema design"

# Agent Registry Structure
agent_registry_structure:

  # Root Registry Schema
  root_registry:
    type: "object"
    required: ["version", "agents", "metadata"]
    properties:
      version:
        type: "string"
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: "Semantic version of registry schema"
      metadata:
        type: "object"
        properties:
          last_updated: { type: "string", format: "date-time" }
          author: { type: "string" }
          description: { type: "string" }
      agents:
        type: "object"
        properties:
          ai_agents: { $ref: "#/definitions/AIAgents" }
          pure_actors: { $ref: "#/definitions/PureActors" }

  # AI Agents Section
  ai_agents_section:
    type: "object"
    patternProperties:
      "^[a-z_]+$": { $ref: "#/definitions/AIAgentSpec" }
    additionalProperties: false
    minProperties: 4  # Concierge, Planner, Researcher, Safety Watch
    maxProperties: 10  # Allow expansion

  # Pure Actors Section
  pure_actors_section:
    type: "object"
    patternProperties:
      "^[a-z_]+$": { $ref: "#/definitions/PureActorSpec" }
    additionalProperties: false
    minProperties: 50  # 54 required, allow some flexibility

# AI Agent Specification Schema
ai_agent_specification:

  # AI Agent Schema
  ai_agent_schema:
    type: "object"
    required: ["type", "layer", "role", "personality", "capabilities", "llm_config"]
    properties:
      type:
        type: "string"
        enum: ["AI_AGENT"]
        description: "Agent type classification"
      layer:
        type: "integer"
        enum: [2, 3]
        description: "K1 architecture layer (2=Orchestration, 3=Execution)"
      role:
        type: "string"
        minLength: 10
        maxLength: 200
        description: "Detailed role description"
      personality:
        type: "object"
        required: ["formality", "verbosity", "empathy"]
        properties:
          formality: { type: "number", minimum: 0.0, maximum: 1.0 }
          verbosity: { type: "number", minimum: 0.0, maximum: 1.0 }
          empathy: { type: "number", minimum: 0.0, maximum: 1.0 }
      capabilities:
        type: "array"
        items: { $ref: "#/definitions/Capability" }
        minItems: 1
        maxItems: 5
      llm_config:
        type: "object"
        required: ["model", "budget_ms", "max_tokens", "temperature"]
        properties:
          model: { type: "string", enum: ["phi-3-mini", "phi-3-medium"] }
          budget_ms: { type: "integer", minimum: 50, maximum: 5000 }
          max_tokens: { type: "integer", minimum: 50, maximum: 2000 }
          temperature: { type: "number", minimum: 0.0, maximum: 1.0 }

  # AI Agent Example
  ai_agent_example: |
    concierge:
      type: "AI_AGENT"
      layer: 3
      role: "Intent classification, greeting, routing"
      personality:
        formality: 0.7
        verbosity: 0.3
        empathy: 0.8
      capabilities: ["MODEL_CALL"]
      llm_config:
        model: "phi-3-mini"
        budget_ms: 50
        max_tokens: 100
        temperature: 0.0

# Pure Actor Specification Schema
pure_actor_specification:

  # Pure Actor Schema
  pure_actor_schema:
    type: "object"
    required: ["type", "layer", "role", "personality", "capabilities"]
    properties:
      type:
        type: "string"
        enum: ["PURE_ACTOR"]
        description: "Agent type classification"
      layer:
        type: "integer"
        enum: [1, 2, 3, 4, 5]
        description: "K1 architecture layer"
      role:
        type: "string"
        minLength: 10
        maxLength: 200
        description: "Detailed role description"
      personality:
        type: "object"
        required: ["formality", "verbosity", "empathy"]
        properties:
          formality: { type: "number", minimum: 0.0, maximum: 1.0 }
          verbosity: { type: "number", minimum: 0.0, maximum: 1.0 }
          empathy: { type: "number", minimum: 0.0, maximum: 1.0 }
      capabilities:
        type: "array"
        items: { $ref: "#/definitions/Capability" }
        minItems: 0  # Some actors have no capabilities
        maxItems: 5

  # Pure Actor Example
  pure_actor_example: |
    orchestrator:
      type: "PURE_ACTOR"
      layer: 2
      role: "3-phase task coordination (Negotiation → Selection → Execution)"
      personality:
        formality: 0.8
        verbosity: 0.4
        empathy: 0.3
      capabilities: ["MEMORY_READ", "MEMORY_WRITE"]

# Capability Definition Schema
capability_definition:

  # Capability Enum
  capability_enum:
    type: "string"
    enum:
      - "TOOL_CALL"
      - "MEMORY_READ"
      - "MEMORY_WRITE"
      - "MODEL_CALL"
      - "NETWORK_ACCESS"
    description: "Fine-grained access control capabilities"

  # Capability Validation Rules
  capability_validation:
    ai_agent_rules:
      - "MODEL_CALL required for all AI agents"
      - "TOOL_CALL only for Planner (with restrictions)"
      - "NETWORK_ACCESS only for Researcher"
      - "No MEMORY_WRITE for AI agents"
    pure_actor_rules:
      - "No MODEL_CALL for pure actors"
      - "TOOL_CALL only for Tool Runner"
      - "NETWORK_ACCESS restricted to specific actors"
      - "Capability assignments follow least privilege"

# Registry Management
registry_management:

  # Loading & Validation
  loading_validation:
    load_process: "YAML parsing → Schema validation → Capability matrix check"
    error_handling: "Detailed error messages with file path and line numbers"
    performance: "<10ms for full registry load"
    caching: "Compiled registry cached in memory"
    rationale: "Fast, reliable configuration loading"

  # Version Management
  version_management:
    semantic_versioning: "MAJOR.MINOR.PATCH"
    backward_compatibility: "PATCH and MINOR changes backward compatible"
    migration_support: "Automatic migration for breaking changes"
    validation: "Version compatibility checked at load time"
    rationale: "Safe configuration evolution"

  # Registry Operations
  registry_operations:
    lookup_agent: "O(1) hash table lookup by agent name"
    list_agents: "Filter by type, layer, capabilities"
    validate_agent: "Schema validation for individual agent"
    update_agent: "Hot-reload capability for development"
    rationale: "Efficient registry operations"

# Schema Validation Rules
schema_validation_rules:

  # Business Logic Validation
  business_logic_validation:
    capability_matrix_compliance:
      description: "All agent capabilities must comply with security matrix"
      validation: "Cross-reference against capability_assignment.yml"
      error_message: "Capability assignment violates security policy"

    personality_consistency:
      description: "Personality traits must be consistent with agent role"
      validation: "Trait ranges validated against role expectations"
      error_message: "Personality traits inconsistent with agent role"

    llm_budget_safety:
      description: "LLM budgets must be within safe limits"
      validation: "Budget checked against model capabilities"
      error_message: "LLM budget exceeds safe limits for model"

  # Schema Integrity Rules
  schema_integrity_rules:
    required_fields: "All required fields must be present"
    type_safety: "All fields must match declared types"
    enum_validation: "Enum fields must contain valid values"
    reference_integrity: "All references must resolve to valid objects"

# Registry Observability
registry_observability:

  # Registry Metrics
  registry_metrics:
    - "registry_load_duration_ms"
    - "registry_validation_errors_total"
    - "agent_lookup_total{agent_type, result}"
    - "capability_check_total{agent_name, capability, result}"

  # Configuration Events
  configuration_events:
    - "Registry loaded successfully"
    - "Schema validation error"
    - "Agent configuration updated"
    - "Capability assignment changed"

  # Health Checks
  health_checks:
    - "Registry schema valid"
    - "All agents loadable"
    - "Capability matrix consistent"
    - "No orphaned references"

# Example Complete Registry
example_registry: |
  version: "1.0.0"
  metadata:
    last_updated: "2025-10-15T10:00:00Z"
    author: "K1 Architecture Team"
    description: "Complete agent registry for K1 Intelligence Module"

  agents:
    ai_agents:
      concierge:
        type: "AI_AGENT"
        layer: 3
        role: "Intent classification, greeting, routing"
        personality:
          formality: 0.7
          verbosity: 0.3
          empathy: 0.8
        capabilities: ["MODEL_CALL"]
        llm_config:
          model: "phi-3-mini"
          budget_ms: 50
          max_tokens: 100
          temperature: 0.0

      planner:
        type: "AI_AGENT"
        layer: 2
        role: "Task planning, 4-stage pipeline"
        personality:
          formality: 0.8
          verbosity: 0.9
          empathy: 0.6
        capabilities: ["MODEL_CALL", "MEMORY_READ", "TOOL_CALL"]
        llm_config:
          model: "phi-3-medium"
          budget_ms: 5000
          max_tokens: 1000
          temperature: 0.3

    pure_actors:
      orchestrator:
        type: "PURE_ACTOR"
        layer: 2
        role: "3-phase task coordination"
        personality:
          formality: 0.8
          verbosity: 0.4
          empathy: 0.3
        capabilities: ["MEMORY_READ", "MEMORY_WRITE"]

      tool_runner:
        type: "PURE_ACTOR"
        layer: 3
        role: "Execute external tools"
        personality:
          formality: 0.6
          verbosity: 0.5
          empathy: 0.5
        capabilities: ["TOOL_CALL", "NETWORK_ACCESS", "MEMORY_WRITE"]

# Migration & Compatibility
migration_compatibility:

  # Schema Evolution
  schema_evolution:
    additive_changes: "New optional fields backward compatible"
    breaking_changes: "Require version bump and migration"
    deprecation_policy: "Fields deprecated with warnings before removal"
    migration_tools: "Automated migration scripts provided"
    rationale: "Safe schema evolution without breaking changes"

  # Backward Compatibility
  backward_compatibility:
    version_support: "Support last 3 major versions"
    migration_path: "Clear upgrade path documented"
    fallback_config: "Safe fallback for incompatible configs"
    validation: "Compatibility tested in CI/CD"
    rationale: "Smooth upgrades with minimal downtime"

# Testing & Validation
testing_validation:

  # Schema Tests
  schema_tests:
    - "JSON Schema validation passes for all examples"
    - "Invalid configurations properly rejected with clear errors"
    - "Schema evolution maintains backward compatibility"
    - "Performance benchmarks meet <10ms load requirement"

  # Registry Tests
  registry_tests:
    - "All 58 agents load successfully"
    - "Capability matrix validation passes"
    - "Agent lookup operations work correctly"
    - "Registry operations meet performance budgets"

  # Integration Tests
  integration_tests:
    - "Agent initialization uses registry data correctly"
    - "Capability enforcement works with registry assignments"
    - "Personality traits applied from registry"
    - "LLM configurations loaded from registry"

# Configuration
configuration:

  # Default Settings
  defaults:
    schema_version: "1.0.0"
    enable_schema_validation: true
    enable_business_logic_validation: true
    registry_cache_enabled: true
    migration_auto_apply: false

  # Tunable Parameters
  tunable_parameters:
    - enable_business_logic_validation: "Disable for development speed"
    - registry_cache_enabled: "Disable for dynamic configuration"
    - migration_auto_apply: "Enable for automatic schema migration"

# Implementation Status
implementation_status:
  schema_definition: "COMPLETED"
  ai_agent_schemas: "COMPLETED"
  pure_actor_schemas: "COMPLETED"
  validation_rules: "COMPLETED"
  registry_management: "COMPLETED"
  observability: "COMPLETED"
  migration_support: "COMPLETED"
  testing_validation: "IN PROGRESS"
  overall_completion: "90%"

# Research Backing
research_backing:
  - "JSON Schema (Wright & Andrews 2020) - Standard configuration validation"
  - "Semantic Versioning (Preston-Werner 2013) - Version management"
  - "Configuration Management (Humphrey 1989) - Software configuration practices"
  - "Schema Evolution (Rahm & Bernstein 2006) - Database schema evolution patterns"
