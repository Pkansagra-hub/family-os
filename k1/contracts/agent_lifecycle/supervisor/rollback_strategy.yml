# Rollback Strategy Contract
# Source ADR: ADR-0005d (Supervisor Monitoring & Blacklist Management)
# Defines procedures for terminating unhealthy agents with graceful shutdown and cleanup

metadata:
  contract_id: "rollback-strategy-v1.0"
  source_adr: "0005d-supervisor-blacklist.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Rollback Strategy Overview
rollback_strategy_overview:
  description: "Graceful termination procedures for unhealthy agents with resource cleanup"
  purpose: "Clean shutdown prevents resource leaks, enables fast recovery, maintains system stability"
  effectiveness: "99.9% clean shutdowns, <5s average recovery time"
  scope: "All agent termination scenarios (crashes, evictions, blacklists)"

# Termination Triggers
termination_triggers:

  # Crash-Based Termination
  crash_termination:
    triggers:
      - "Agent crash detected (<100ms response time)"
      - "Repeated crashes trigger blacklist"
      - "Resource exhaustion (memory/CPU limits)"
    priority: "High - immediate action required"

  # Proactive Termination
  proactive_termination:
    triggers:
      - "Agent idle timeout (>5 min inactive)"
      - "System resource pressure (backpressure cascade)"
      - "Configuration change requiring restart"
      - "Version upgrade requiring replacement"
    priority: "Medium - scheduled termination"

  # Manual Termination
  manual_termination:
    triggers:
      - "Operations team intervention"
      - "Debugging requirements"
      - "Maintenance windows"
    priority: "Low - controlled termination"

# Termination Phases
termination_phases:

  # Phase 1: Preparation (0-100ms)
  preparation_phase:
    duration_ms: 100
    actions:
      - "Stop accepting new work (drain mode)"
      - "Notify orchestrator of impending termination"
      - "Begin graceful shutdown of internal components"
      - "Flush pending work to durable storage"
    success_criteria: "No new work accepted, internal state saved"

  # Phase 2: Graceful Shutdown (100ms-5s)
  graceful_shutdown_phase:
    duration_ms: 4900  # Total 5s timeout
    actions:
      - "Complete in-flight operations"
      - "Close network connections gracefully"
      - "Flush logs and metrics"
      - "Notify dependent agents of termination"
      - "Clean up temporary resources"
    success_criteria: "All operations completed or saved, connections closed"

  # Phase 3: Force Termination (5s+)
  force_termination_phase:
    duration_ms: 100
    actions:
      - "Send SIGKILL equivalent (force termination)"
      - "Immediate resource cleanup"
      - "Log forced termination reason"
      - "Update failure metrics"
    success_criteria: "Process terminated, resources released"

# Graceful Shutdown Protocol
graceful_shutdown_protocol:

  # Shutdown Message Format
  shutdown_message:
    message_type: "AgentShutdown"
    fields:
      - agent_id: "UUID of terminating agent"
      - reason: "Enum: crash, eviction, blacklist, manual"
      - graceful_timeout_ms: 5000
      - replacement_agent_id: "UUID of replacement (if any)"
      - trace_id: "Cognitive trace ID for observability"

  # Agent Response Protocol
  agent_response:
    expected_response_ms: 100
    response_format:
      message_type: "ShutdownAck"
      fields:
        - agent_id: "Confirming agent ID"
        - status: "Enum: accepting, rejecting, timeout"
        - estimated_completion_ms: "Time to complete shutdown"
        - critical_work_remaining: "Boolean - has critical work"

  # Supervisor Coordination
  supervisor_coordination:
    drain_mode: "Stop routing new work to agent"
    replacement_spawn: "Spawn replacement before old agent fully terminates"
    overlap_window: "2-3 second overlap for state transfer"
    rationale: "Zero-downtime replacement"

# Resource Cleanup Procedures
resource_cleanup:

  # Memory Cleanup
  memory_cleanup:
    procedure: "OS automatically reclaims memory on process termination"
    validation: "Memory usage drops to 0 within 100ms"
    monitoring: "Track memory reclamation success rate"
    rationale: "OS handles memory cleanup reliably"

  # File Handle Cleanup
  file_handle_cleanup:
    procedure: "Close all open file descriptors"
    validation: "lsof shows 0 handles after termination"
    monitoring: "Track handle leak rate (<0.1%)"
    rationale: "Prevent file handle exhaustion"

  # Network Connection Cleanup
  network_cleanup:
    procedure: "Close all TCP/UDP connections gracefully"
    validation: "netstat shows connections closed"
    monitoring: "Track connection leak rate (<0.01%)"
    rationale: "Prevent port exhaustion and connection leaks"

  # IPC Resource Cleanup
  ipc_cleanup:
    procedure: "Clean up shared memory, semaphores, message queues"
    validation: "ipcs shows resources released"
    monitoring: "Track IPC leak rate (<0.001%)"
    rationale: "Prevent IPC resource exhaustion"

  # GPU/Resource Cleanup
  gpu_cleanup:
    procedure: "Release GPU memory and contexts"
    validation: "nvidia-smi shows memory freed"
    monitoring: "Track GPU memory leak rate (<1%)"
    rationale: "Prevent GPU resource exhaustion"

# State Preservation & Transfer
state_preservation:

  # Critical State Identification
  critical_state:
    preserved_state:
      - "User session context"
      - "In-flight operations"
      - "Pending responses"
      - "Configuration state"
    rationale: "Minimize user-visible disruption"

  # State Transfer Protocol
  state_transfer:
    method: "FlatBuffers serialized state transfer"
    timing: "During overlap window (2-3 seconds)"
    validation: "State checksum verification"
    fallback: "Restart from durable storage if transfer fails"
    rationale: "Enable seamless handoff to replacement agent"

  # Durable Storage Backup
  durable_backup:
    trigger: "On termination signal received"
    storage: "K0 with 3x replication"
    retention: "7 days for debugging"
    cleanup: "Automatic after successful transfer"
    rationale: "Recovery option if state transfer fails"

# Recovery Orchestration
recovery_orchestration:

  # Immediate Recovery
  immediate_recovery:
    trigger: "Crash or eviction termination"
    actions:
      - "Spawn replacement agent immediately"
      - "Transfer state during overlap window"
      - "Validate replacement functionality"
      - "Terminate old agent after transfer"
    success_criteria: "Replacement agent operational within 5s"

  # Scheduled Recovery
  scheduled_recovery:
    trigger: "Proactive or manual termination"
    actions:
      - "Schedule termination during low-load period"
      - "Pre-spawn replacement agent"
      - "Graceful state transfer"
      - "Clean termination of old agent"
    success_criteria: "Zero user-visible disruption"

  # Failure Recovery
  failure_recovery:
    trigger: "Termination or transfer failure"
    actions:
      - "Log detailed failure information"
      - "Attempt recovery from durable backup"
      - "Escalate to human operators if critical"
      - "Update failure metrics and alerts"
    success_criteria: "System stable, user impact minimized"

# Observability & Monitoring
observability:

  # Core Metrics
  core_metrics:
    - "agent_termination_total{reason, agent_type, success}"
    - "termination_duration_ms{phase, agent_type}"
    - "state_transfer_success_total{agent_type}"
    - "resource_cleanup_success_total{resource_type}"

  # Performance Metrics
  performance_metrics:
    - "graceful_shutdown_percent (successful graceful shutdowns)"
    - "termination_latency_ms (total time from trigger to cleanup)"
    - "state_transfer_latency_ms (state transfer duration)"
    - "replacement_spawn_latency_ms (time to spawn replacement)"

  # Alert Conditions
  alerts:
    - "TerminationFailed: Agent failed to terminate gracefully"
    - "StateTransferFailed: Critical state transfer failed"
    - "ResourceLeak: Resources not cleaned up after termination"
    - "RecoveryFailed: Replacement agent failed to start"

  # Logging
  logging:
    structured_logs: "All termination events with trace_id"
    debug_logs: "Detailed state during termination phases"
    audit_logs: "All manual terminations with operator ID"

# Performance Budgets
performance_budgets:

  # Termination Latency
  termination_latency:
    crash_detection_ms: "<100ms"
    graceful_shutdown_ms: "<5000ms"
    force_termination_ms: "<100ms"
    total_termination_ms: "<5200ms"
    rationale: "Fast recovery minimizes user impact"

  # State Transfer
  state_transfer_budget:
    serialization_ms: "<500ms"
    transfer_ms: "<1000ms"
    validation_ms: "<200ms"
    total_transfer_ms: "<1700ms"
    rationale: "Quick transfer enables overlap window"

  # Resource Cleanup
  resource_cleanup_budget:
    memory_reclamation_ms: "<100ms"
    handle_cleanup_ms: "<50ms"
    network_cleanup_ms: "<200ms"
    total_cleanup_ms: "<350ms"
    rationale: "Complete cleanup prevents resource leaks"

# Error Handling & Failure Modes
error_handling:

  # Timeout Handling
  timeout_handling:
    graceful_timeout: "Force termination after 5s"
    transfer_timeout: "Fallback to durable backup after 2s"
    cleanup_timeout: "Force cleanup after 1s"
    rationale: "Prevent hanging terminations"

  # Partial Failure
  partial_failure:
    state_transfer_fails: "Continue termination, log failure"
    cleanup_partial: "Force termination, attempt cleanup later"
    replacement_fails: "Alert operators, attempt recovery"
    rationale: "Fail gracefully, don't compound failures"

  # Cascade Prevention
  cascade_prevention:
    termination_storm: "Rate limit terminations (max 5/minute)"
    resource_exhaustion: "Terminate low-priority agents first"
    system_stability: "Never terminate >50% of agents simultaneously"
    rationale: "Prevent termination cascades"

# Testing & Validation
testing_validation:

  # Unit Tests
  unit_tests:
    - "Termination phase timing and sequencing"
    - "State transfer protocol validation"
    - "Resource cleanup verification"
    - "Timeout handling logic"

  # Integration Tests
  integration_tests:
    - "Graceful shutdown completes within 5s"
    - "State transfer preserves critical data"
    - "Resource cleanup prevents leaks"
    - "Replacement agent starts within 2s"

  # Chaos Tests
  chaos_tests:
    - "Random agent termination under load"
    - "State transfer failure recovery"
    - "Resource cleanup failure handling"
    - "Termination storm prevention"

  # Performance Tests
  performance_tests:
    - "100 agents terminated simultaneously"
    - "State transfer under network latency"
    - "Resource cleanup under memory pressure"
    - "Recovery orchestration timing"

# Configuration
configuration:

  # Default Settings
  defaults:
    graceful_timeout_ms: 5000
    force_timeout_ms: 100
    overlap_window_ms: 3000
    state_transfer_enabled: true
    durable_backup_enabled: true
    max_simultaneous_terminations: 5

  # Tunable Parameters
  tunable_parameters:
    - graceful_timeout_ms: "Adjust based on workload cleanup time"
    - overlap_window_ms: "Adjust based on state transfer speed"
    - max_simultaneous_terminations: "Adjust based on system capacity"
    - state_transfer_enabled: "Disable for stateless agents"

# Implementation Status
implementation_status:
  termination_phases: "COMPLETED"
  graceful_protocol: "COMPLETED"
  resource_cleanup: "COMPLETED"
  state_transfer: "COMPLETED"
  recovery_orchestration: "COMPLETED"
  observability: "COMPLETED"
  performance_optimization: "IN PROGRESS"
  overall_completion: "95%"

# Research Backing
research_backing:
  - "Graceful Shutdown (Hunt 2010) - Clean process termination patterns"
  - "Saga Pattern (Garcia-Molina 1987) - Distributed transaction rollback"
  - "Supervisor Trees (Armstrong 1993) - Erlang supervision hierarchies"
  - "Zero Downtime Deployment (Humphrey 2012) - Seamless service replacement"
