# State Transitions Contract
# Source ADR: ADR-0005 (Agent Lifecycle FSM with 6 States)
# Defines valid transitions, guards, and timing constraints

metadata:
  contract_id: "state-transitions-v1.0"
  source_adr: "0005-agent-lifecycle-fsm.md"
  version: "1.0.0"
  last_updated: "2025-10-15"
  authors: ["K1 Architecture Team"]

# Valid Transitions Matrix
valid_transitions:
  PENDING:
    - WARMING
    - TERMINATED  # Emergency termination
  WARMING:
    - ACTIVE
    - TERMINATED  # Emergency termination
  ACTIVE:
    - IDLE
    - DRAINING
    - TERMINATED  # Emergency termination
  IDLE:
    - ACTIVE
    - DRAINING
    - TERMINATED  # Emergency termination
  DRAINING:
    - TERMINATED  # Only valid transition from DRAINING
  TERMINATED: []  # Final state, no transitions

# Authority Model (Supervisor Single Writer)
authority:
  single_writer: "Supervisor only performs state transitions including emergency TERMINATED."
  agent_intents: [ready, idle_candidate, drain_ready, intent_to_die]
  clocks: monotonic
  rationale: "Prevents race conditions and double-fire timer bugs"

# Explicit Event Names & Guards
events:

  # Initialization Events
  AGENT_INIT_REQUEST: "Supervisor requests agent initialization"
  AGENT_LEASE_GRANTED: "Capability lease issued by supervisor"
  AGENT_CONSTRUCTOR_SUCCESS: "Agent instance created successfully"

  # Warmup Events
  WARMUP_START: "Supervisor initiates warmup sequence"
  MODEL_LOAD_SUCCESS: "AI agent model weights loaded"
  CONFIG_LOAD_SUCCESS: "Agent configuration loaded"
  MAILBOX_INIT_SUCCESS: "Agent mailbox initialized"
  WARMUP_COMPLETE: "All warmup requirements satisfied"

  # Activation Events
  AGENT_READY_SIGNAL: "Agent signals readiness to supervisor"
  SUPERVISOR_ACTIVATE: "Supervisor transitions to ACTIVE"
  PROCESSING_LOOP_START: "Agent begins task processing"

  # Quiescence Events
  MAILBOX_QUIESCENT: "Mailbox empty for >200ms window"
  IDLE_TIMEOUT_ELAPSED: "60 second idle timeout reached"
  SUPERVISOR_IDLE: "Supervisor transitions to IDLE"

  # Reactivation Events
  TASK_ASSIGNMENT: "New task assigned to idle agent"
  REACTIVATION_REQUEST: "Supervisor requests reactivation"
  CACHE_RESTORE_SUCCESS: "Agent caches restored"
  SUPERVISOR_REACTIVATE: "Supervisor transitions to ACTIVE"

  # Draining Events
  DRAIN_REQUEST: "Supervisor initiates draining"
  FIRE_MESSAGE_RECEIVED: "Orchestrator sends FIRE message"
  TTL_EXPIRED: "Idle TTL or active timeout expired"
  MEMORY_PRESSURE_DETECTED: "Heap usage >80%"
  THERMAL_OVERSHOOT: "Device temperature >= T_hot"
  TASK_REJECTION_START: "Agent stops accepting new tasks"
  CURRENT_TASK_COMPLETE: "In-flight task finishes"
  STATE_FLUSH_SUCCESS: "Agent state persisted"
  CAPABILITIES_REVOKED: "Agent capabilities revoked"

  # Termination Events
  DRAIN_COMPLETE: "All draining requirements met"
  DRAIN_TIMEOUT: "Draining deadline exceeded"
  EMERGENCY_KILL: "Supervisor force termination"
  CLEANUP_SUCCESS: "Agent resources released"
  ROSTER_REMOVAL: "Agent removed from supervisor roster"

# Event Guards (Preconditions for Events)
event_guards:

  # Warmup Guards
  WARMUP_START_guard:
    conditions:
      - "agent.state == PENDING"
      - "agent.lease.valid() == true"
      - "supervisor.resources_available() == true"

  MODEL_LOAD_SUCCESS_guard:
    conditions:
      - "agent.type == AI_AGENT"
      - "model_weights_path.exists() == true"
      - "gpu_memory_available() >= model_size_mb"

  WARMUP_COMPLETE_guard:
    ai_agent_conditions:
      - "model_loaded == true"
      - "kv_cache_initialized == true"
      - "tools_registered == true"
      - "prompts_loaded == true"
    pure_actor_conditions:
      - "config_loaded == true"
      - "mailbox_initialized == true"

  # Quiescence Guards
  MAILBOX_QUIESCENT_guard:
    conditions:
      - "agent.state == ACTIVE"
      - "mailbox.is_empty() == true"
      - "time_since_last_message >= 200ms"

  IDLE_TIMEOUT_ELAPSED_guard:
    conditions:
      - "agent.state == ACTIVE"
      - "idle_timer.elapsed() == true"
      - "no_in_progress_tasks == true"

  # Draining Guards
  DRAIN_REQUEST_guard:
    conditions:
      - "agent.state in [ACTIVE, IDLE]"
      - "drain_trigger_detected() == true"

  MEMORY_PRESSURE_DETECTED_guard:
    conditions:
      - "k1_heap_usage_percent > 80"
      - "agent.memory_contribution_mb > 10"

  THERMAL_OVERSHOOT_guard:
    conditions:
      - "device_temperature_celsius >= device_t_hot"
      - "agent.thermal_contribution > 0.1"

  # Termination Guards
  DRAIN_COMPLETE_guard:
    conditions:
      - "agent.state == DRAINING"
      - "current_task_completed == true"
      - "state_flushed == true"
      - "capabilities_revoked == true"

  DRAIN_TIMEOUT_guard:
    conditions:
      - "agent.state == DRAINING"
      - "drain_deadline.elapsed() == true"

# Emergency Transitions (any state can transition to TERMINATED)
emergency_transitions:
  description: "Any state can transition to TERMINATED on crash/timeout/kill"
  triggers:
    - "crash"
    - "timeout"
    - "kill_signal"
    - "supervisor_kill"
  allowed_from_states:
    - PENDING
    - WARMING
    - ACTIVE
    - IDLE
    - DRAINING

# Transition Guards (Preconditions)
transition_guards:

  # PENDING → WARMING
  PENDING_to_WARMING:
    conditions:
      - "agent.lease exists and not expired"
      - "agent.capabilities assigned"
      - "supervisor has available resources"
    failure_message: "Cannot warm without valid lease"

  # WARMING → ACTIVE
  WARMING_to_ACTIVE:
    ai_agent_conditions:
      - "model_loaded == true"
      - "kv_cache_initialized == true"
      - "tools_registered == true"
      - "prompts_loaded == true"
    pure_actor_conditions:
      - "config_loaded == true"
      - "mailbox_initialized == true"
    failure_message: "Cannot activate without required resources initialized"

  # ACTIVE → IDLE
  ACTIVE_to_IDLE:
    conditions:
      - "mailbox.is_quiescent(window_ms=200)"
      - "no in-progress tasks"
      - "idle_timeout_ms elapsed (default 60000)"
    failure_message: "Cannot idle until mailbox is quiescent"

  # IDLE → ACTIVE
  IDLE_to_ACTIVE:
    conditions:
      - "new task assigned to agent"
      - "agent has capacity for task"
    failure_message: "Cannot reactivate without task assignment"

  # ACTIVE/IDLE → DRAINING
  ACTIVE_to_DRAINING:
    triggers:
      - "FIRE message from orchestrator"
      - "idle TTL expired"
      - "memory pressure (>80% heap)"
      - "thermal overshoot (>= T_hot)"
      - "SIGTERM signal"
    conditions:
      - "drain_deadline_ms set (default 10000)"
    failure_message: "Cannot drain without valid trigger"

  IDLE_to_DRAINING:
    triggers:
      - "idle TTL expired (default 300000ms = 5 min)"
      - "memory pressure (>80% heap)"
      - "thermal overshoot (>= T_hot)"
      - "FIRE message from orchestrator"
    conditions:
      - "drain_deadline_ms set (default 2000 for pressure)"
    failure_message: "Cannot drain without valid trigger"

  # DRAINING → TERMINATED
  DRAINING_to_TERMINATED:
    conditions:
      - "current_task_completed == true OR timeout_exceeded == true"
      - "state_flushed == true OR forced_termination == true"
      - "capabilities_revoked == true"
    failure_message: "Cannot terminate without completing drain requirements"
    warning_conditions:
      - "state_flushed == false AND timeout_exceeded == true"

# Transition Handlers (Actions executed during transition)
transition_handlers:

  PENDING_to_WARMING:
    actions:
      - "invoke agent constructor"
      - "start warmup sequence"
      - "set warmup_deadline = monotonic_clock + 5000ms"
    async: true

  WARMING_to_ACTIVE:
    actions:
      - "clear warmup_deadline"
      - "start ACTIVE processing loop"
      - "set idle_timer = monotonic_clock + 60000ms"
      - "emit agent_warmup_completed{agent_id, duration_ms}"
    async: true

  ACTIVE_to_IDLE:
    actions:
      - "clear idle_timer"
      - "reduce memory footprint (release caches)"
      - "set idle_ttl_deadline = monotonic_clock + 300000ms"
      - "emit agent_idle_start{agent_id}"
    async: false

  IDLE_to_ACTIVE:
    actions:
      - "clear idle_ttl_deadline"
      - "restore full memory footprint if needed"
      - "reset idle_timer = monotonic_clock + 60000ms"
      - "emit agent_reactivation{agent_id, idle_duration_ms}"
    async: false

  ACTIVE_to_DRAINING:
    actions:
      - "set accepting_tasks = false"
      - "set drain_deadline = monotonic_clock + 10000ms"
      - "emit agent_draining_start{agent_id, reason}"
    async: true

  IDLE_to_DRAINING:
    actions:
      - "set accepting_tasks = false"
      - "set drain_deadline = monotonic_clock + drain_timeout_ms"
      - "emit agent_draining_start{agent_id, reason}"
    async: true

  DRAINING_to_TERMINATED:
    actions:
      - "clear drain_deadline"
      - "unload model weights"
      - "release KV cache"
      - "close mailbox"
      - "revoke capabilities"
      - "remove from roster"
      - "emit agent_terminated{agent_id, reason}"
    async: false

# Timing Constraints
timing_constraints:

  # State timeouts (automatic transitions)
  state_timeouts:
    PENDING:
      timeout_ms: 5000
      action: "TERMINATED"
      reason: "initialization_deadlock"

    WARMING:
      timeout_ms: 5000
      action: "TERMINATED"
      reason: "warmup_timeout"

    ACTIVE:
      idle_timeout_ms: 60000  # ACTIVE → IDLE
      action: "IDLE"
      reason: "idle_timeout"

    IDLE:
      ttl_timeout_ms: 300000  # IDLE → DRAINING (5 min default)
      action: "DRAINING"
      reason: "idle_ttl_expired"

    DRAINING:
      drain_timeout_ms: 10000  # DRAINING → TERMINATED (forced)
      action: "TERMINATED"
      reason: "draining_timeout"

  # Transition latency budgets
  transition_latencies:
    PENDING_to_WARMING:
      budget_ms: 10
      measurement: "roster registration only"

    WARMING_to_ACTIVE:
      ai_agents_budget_ms: 250
      pure_actors_budget_ms: 50
      measurement: "resource initialization"

    ACTIVE_to_IDLE:
      budget_ms: 5
      measurement: "state transition overhead"

    IDLE_to_ACTIVE:
      budget_ms: 50
      measurement: "reactivation latency"

    ACTIVE_to_DRAINING:
      budget_ms: 5
      measurement: "state transition overhead"

    IDLE_to_DRAINING:
      budget_ms: 5
      measurement: "state transition overhead"

    DRAINING_to_TERMINATED:
      budget_ms: 50
      measurement: "cleanup operations"

# Quiescence Detection
quiescence_detection:
  window_ms: 200
  condition: "mailbox.empty() AND time_since_last_arrival >= window_ms"
  rationale: "Prevents false IDLE transitions due to late-arriving messages"
  implementation: |
    def is_quiescent(self, window_ms=200):
        if not self.mailbox.is_empty():
            return False
        time_since_last_arrival = now() - self.last_message_at
        return time_since_last_arrival.total_seconds() * 1000 >= window_ms

# Memory Pressure Handling
memory_pressure:
  heap_threshold: 0.8  # >80% K1 heap
  eviction_policy: "largest RSS first"
  drain_deadline_ms: 2000
  force_termination_threshold: "deadline_exceeded AND pressure_escalated"

# Thermal Pressure Handling
thermal_pressure:
  temperature_threshold: "T_hot"
  eviction_policy: "thermal contribution (NPU > GPU > CPU)"
  drain_deadline_ms: 2000
  force_termination_threshold: "deadline_exceeded AND thermal_escalated"

# Implementation Notes
implementation_notes:
  - "All transitions initiated by Supervisor (single-writer pattern)"
  - "Deadlines stored as absolute monotonic timestamps"
  - "Emergency transitions bypass normal guards"
  - "Transition failures logged with trace_id and context"
  - "Invalid transitions raise IllegalStateTransitionError"
  - "Guards checked before transition execution"
