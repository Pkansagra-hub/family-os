# Resource Monitoring Contract
# Purpose: Define resource monitoring hooks for agent lifecycle management
# Research: Resource-aware scheduling (Ghodsi et al. 2011), Thermal management (Skadron et al. 2003)

contract:
  name: "resource_monitoring"
  version: "1.0.0"
  description: "Resource monitoring hooks for agent lifecycle with thermal placement signals"

# Resource Metrics to Emit
emit_metrics:

  # Memory Usage
  agent_rss_mb:
    type: Gauge
    description: "Agent resident set size in MB"
    labels: ["agent_id", "agent_type", "state"]
    collection_interval_ms: 1000
    thresholds:
      warning_mb: 100
      critical_mb: 200
      max_mb: 500

  # CPU Usage
  agent_cpu_pct:
    type: Gauge
    description: "Agent CPU usage percentage"
    labels: ["agent_id", "agent_type", "state"]
    collection_interval_ms: 1000
    thresholds:
      warning_pct: 70
      critical_pct: 90
      max_pct: 100

  # Thermal Metrics
  agent_thermal_celsius:
    type: Gauge
    description: "Agent thermal temperature in Celsius"
    labels: ["agent_id", "agent_type", "thermal_zone"]
    collection_interval_ms: 5000
    thresholds:
      warning_celsius: 75
      critical_celsius: 85
      max_celsius: 95

  # GPU Memory (if applicable)
  agent_gpu_memory_mb:
    type: Gauge
    description: "Agent GPU memory usage in MB"
    labels: ["agent_id", "agent_type", "gpu_id"]
    collection_interval_ms: 2000
    thresholds:
      warning_mb: 1024
      critical_mb: 2048
      max_mb: 4096

# Signals to Placement Engine
signals_to_placement:

  # Thermal Throttling Signal
  thermal_throttle:
    trigger: "agent_thermal_celsius > critical_celsius"
    action: "migrate_to_cooler_zone"
    cooldown_ms: 30000
    priority: "high"

  # Memory Pressure Signal
  memory_pressure:
    trigger: "agent_rss_mb > critical_mb"
    action: "drain_and_restart"
    cooldown_ms: 60000
    priority: "high"

  # CPU Saturation Signal
  cpu_saturation:
    trigger: "agent_cpu_pct > critical_pct"
    action: "load_balance"
    cooldown_ms: 10000
    priority: "medium"

  # GPU Memory Pressure
  gpu_memory_pressure:
    trigger: "agent_gpu_memory_mb > critical_mb"
    action: "release_gpu_resources"
    cooldown_ms: 15000
    priority: "medium"

# Monitoring Hooks
monitoring_hooks:

  # State Transition Hooks
  on_state_change:
    - emit_metric: "agent_rss_mb"
    - emit_metric: "agent_cpu_pct"
    - check_thresholds: true

  # Periodic Health Checks
  periodic_check:
    interval_ms: 30000
    actions:
      - emit_all_metrics
      - check_thermal_zones
      - validate_resource_limits

  # Resource Violation Hooks
  on_resource_violation:
    severity: "warning|critical"
    actions:
      - log_violation
      - emit_alert
      - trigger_placement_signal

# Implementation Requirements
implementation_requirements:

  # Performance Budget
  performance_budget:
    metric_collection_p95_ms: 5
    signal_processing_p95_ms: 10
    memory_overhead_mb: 2

  # Integration Points
  integrates_with:
    - "thermal_manager"
    - "placement_engine"
    - "supervisor"
    - "observability"

  # Error Handling
  error_handling:
    collection_failure: "log_warning_continue"
    signal_failure: "log_error_retry"
    threshold_violation: "emit_alert_continue"

# Research Backing
research_backing:
  - "Resource-aware scheduling (Ghodsi et al. 2011)"
  - "Thermal management for microprocessors (Skadron et al. 2003)"
  - "Feedback control for computing systems (Hellerstein et al. 2004)"
