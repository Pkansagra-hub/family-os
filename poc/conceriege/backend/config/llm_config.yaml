llm_clients:
  fast:
    model: "meta-llama/llama-4-maverick-17b-128e-instruct"
    temperature: 0.1
    max_tokens: 150
    timeout_ms: 100
    use_case: ["intent_classification", "emotion_detection"]
  creative:
    model: "meta-llama/llama-4-maverick-17b-128e-instruct"
    temperature: 0.8
    max_tokens: 50
    timeout_ms: 150
    use_case: ["empathy_generation", "proactive_prompts"]
  synthesis:
    model: "qwen/qwen3-32b"
    temperature: 0.7
    max_tokens: 100
    timeout_ms: 300
    use_case: ["result_synthesis"]
