# Default driver alias bindings. Update alongside qos/config changes.
# ADR-K022: Neo4j removed, all graph storage consolidated to PostgreSQL
aliases:
  st_epi: postgres
  st_sem: postgres
  st_ws: postgres
  st_fts: fts5
  st_vector: faiss
  st_emb: embedding_queue
  st_kg_dom: postgres  # PostgreSQL graph storage (ADR-K022: replaces neo4j_driver)
  st_kg_edges: postgres  # PostgreSQL graph edges (ADR-K022)
  st_blob: blob_localfs
  # Traffic generator test drivers (burn-in/load testing)
  traffic-gen: postgres
  # Event bus drivers (outbox → external systems)
  outbox_sse: sse_outbox_driver  # Publishes outbox events to SSE subscribers (telemetry, monitoring)
  internal_bus: internal_bus_driver  # Publishes outbox events to internal bus (inter-pipeline communication)
