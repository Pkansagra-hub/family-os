global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-single-node'
    environment: 'development'

# Load recording rules and alerts
rule_files:
  - '/etc/prometheus/rules/*.yaml'

# Scrape configurations
scrape_configs:
  - job_name: 'k0-kernel'
    static_configs:
      - targets: ['k0-kernel:8080']
        labels:
          service: 'k0-kernel'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

# Alert configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
