---
# Ansible tasks for chaos configuration deployment (Issue 9.1.4 Phase 4)

- name: Apply chaos settings to kernel.yaml
  ansible.builtin.template:
    src: chaos-config.yaml.j2
    dest: /etc/k0/kernel.yaml.d/chaos.yaml
    owner: k0
    group: k0
    mode: '0640'
  notify: reload k0 kernel

- name: Validate chaos configuration syntax
  ansible.builtin.command:
    cmd: k0ctl config validate --file /etc/k0/kernel.yaml.d/chaos.yaml
  register: chaos_validation
  failed_when: chaos_validation.rc != 0
  changed_when: false

- name: Log chaos deployment to audit trail
  ansible.builtin.lineinfile:
    path: /var/log/k0/chaos-deployments.log
    line: "{{ ansible_date_time.iso8601 }} - Chaos config deployed: enabled={{ chaos_enabled }}, fsync_fail_rate={{ chaos_wal_fsync_fail_rate }}"
    create: true
    owner: k0
    group: k0
    mode: '0640'
