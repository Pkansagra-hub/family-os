---
- name: Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  when: familyos_systemd_manage | bool

- name: Restart FamilyOS compose service
  ansible.builtin.systemd:
    name: "{{ familyos_systemd_unit_name }}"
    state: restarted
    enabled: true
  when: familyos_systemd_manage | bool
