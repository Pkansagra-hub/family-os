---
- name: "familyos.kernel | ensure bundle manifest exists"
  ansible.builtin.stat:
    path: "{{ familyos_bundle_manifest }}"
  register: familyos_kernel_manifest_stat

- name: "familyos.kernel | fail when bundle manifest missing"
  ansible.builtin.fail:
    msg: >-
      FamilyOS bundle manifest '{{ familyos_bundle_manifest }}' could not be located.
      Run the Pulumi smoke harness before executing the kernel role.
  when: not familyos_kernel_manifest_stat.stat.exists

- name: "familyos.kernel | load bundle manifest"
  ansible.builtin.slurp:
    src: "{{ familyos_bundle_manifest }}"
  register: familyos_kernel_manifest_raw

- name: "familyos.kernel | parse manifest JSON"
  ansible.builtin.set_fact:
    familyos_kernel_manifest: "{{ familyos_kernel_manifest_raw.content | b64decode | from_json }}"

- name: "familyos.kernel | collect component artifacts"
  ansible.builtin.set_fact:
    familyos_kernel_components: >-
      {{ familyos_kernel_manifest.get('components', [])
         | selectattr('component', 'ne', 'secrets')
         | selectattr('path', 'defined')
         | list }}

- name: "familyos.kernel | ensure compose directory"
  ansible.builtin.file:
    path: "{{ familyos_compose_root }}"
    state: directory
    mode: "{{ familyos_compose_dir_mode }}"

- name: "familyos.kernel | stage component artifacts"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ familyos_compose_root }}/{{ item.path | basename }}"
    mode: "{{ familyos_compose_file_mode }}"
  loop: "{{ familyos_kernel_components }}"

- name: "familyos.kernel | copy bundle manifest"
  ansible.builtin.copy:
    src: "{{ familyos_bundle_manifest }}"
    dest: "{{ familyos_compose_root }}/{{ familyos_bundle_manifest | basename }}"
    mode: "{{ familyos_compose_file_mode }}"

- name: "familyos.kernel | register compose files"
  ansible.builtin.set_fact:
    familyos_compose_files: "{{ familyos_kernel_components | map(attribute='path') | map('basename') | list }}"

- name: "familyos.kernel | optionally apply docker compose"
  ansible.builtin.command:
    cmd: >-
      {{ familyos_docker_compose_bin }} compose{% for file in familyos_compose_files %} -f {{ familyos_compose_root }}/{{ file }}{% endfor %}
      -p {{ familyos_compose_project }} up -d
    chdir: "{{ familyos_compose_root }}"
  register: familyos_compose_apply_result
  changed_when: >-
    'Recreating' in familyos_compose_apply_result.stdout
    or 'Creating' in familyos_compose_apply_result.stdout
    or 'Recreating' in familyos_compose_apply_result.stderr
    or 'Creating' in familyos_compose_apply_result.stderr
  when: familyos_compose_apply | bool

- name: "familyos.kernel | provision systemd unit"
  ansible.builtin.template:
    src: familyos-compose.service.j2
    dest: "{{ familyos_systemd_unit_path }}/{{ familyos_systemd_unit_name }}.service"
    mode: "0644"
  when: familyos_systemd_manage | bool
  notify:
    - Reload systemd configuration
    - Restart FamilyOS compose service
