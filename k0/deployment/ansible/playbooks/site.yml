---
# Primary playbook driving FamilyOS deployments via Ansible.
- name: Configure FamilyOS nodes
  hosts: all
  gather_facts: true
  vars:
    deployment_channel: production
    familyos_repo_root: "{{ lookup('env', 'FAMILYOS_REPO_ROOT') | default(playbook_dir ~ '/../../..', true) }}"
    familyos_telemetry_snapshot_directory: "{{ lookup('env', 'FAMILYOS_TELEMETRY_SNAPSHOT') | default('artifacts/security-telemetry', true) }}"
  roles:
    - secrets
    - kernel
    - telemetry
