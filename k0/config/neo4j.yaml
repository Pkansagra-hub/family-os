# Neo4j Knowledge Graph Configuration
# Related: ADR-0081 (K0 Knowledge Graph Architecture), ADR-0081a (Temporal Graph Schema Design)
# Driver: k0/drivers/neo4j_driver.py
# Alias: st_kg_dom → neo4j_driver (see k0/drivers/alias_map.yaml)

# Connection settings
connection:
  # Neo4j Bolt protocol URI (local or remote)
  uri: "neo4j://localhost:7687"

  # Authentication credentials
  auth:
    username: "neo4j"
    password: "${NEO4J_PASSWORD}"  # Environment variable for security

  # Connection pool settings
  max_connection_lifetime_seconds: 3600  # 1 hour
  max_connection_pool_size: 100
  connection_acquisition_timeout_seconds: 60

  # TLS/SSL settings (for production)
  encrypted: false  # Set to true for production with neo4j+s:// URI
  trust: "TRUST_SYSTEM_CA_SIGNED_CERTIFICATES"  # For encrypted connections

# Database settings
database:
  # Neo4j database name (default or specific database)
  name: "neo4j"  # Default database, or "familyos" for dedicated database

  # Transaction settings
  default_transaction_timeout_seconds: 30
  max_retry_time_seconds: 30
  initial_retry_delay_seconds: 1
  retry_delay_multiplier: 2.0
  retry_delay_jitter_factor: 0.2

# Query settings
query:
  # Performance tuning
  fetch_size: 1000  # Number of records to fetch per batch
  default_query_timeout_seconds: 10

  # Result limits
  max_results_default: 100
  max_results_absolute: 10000

  # Temporal query defaults
  temporal_snapshot_enabled: true  # Enable as_of timestamp queries

# Schema settings (from ADR-0081a)
schema:
  # Node labels (entity types)
  node_labels:
    - "Person"
    - "Location"
    - "Event"
    - "Organization"
    - "Thing"

  # Relationship types (see ADR-0081a for complete list)
  relationship_types:
    # Family
    - "PARENT_OF"
    - "CHILD_OF"
    - "SIBLING_OF"
    - "SPOUSE_OF"
    - "GRANDPARENT_OF"
    - "GRANDCHILD_OF"
    - "AUNT_OF"
    - "UNCLE_OF"
    - "COUSIN_OF"
    - "IN_LAW_OF"
    # Social
    - "FRIEND_OF"
    - "COLLEAGUE_OF"
    - "ACQUAINTANCE_OF"
    - "NEIGHBOR_OF"
    - "MENTOR_OF"
    - "MENTEE_OF"
    # Employment
    - "EMPLOYED_BY"
    - "MANAGES"
    - "REPORTS_TO"
    - "COLLEAGUE_AT"
    # Location
    - "LIVES_IN"
    - "WORKS_AT"
    - "VISITS"
    - "BORN_IN"
    - "STUDIED_AT"
    # Temporal
    - "MARRIED_TO"
    - "DIVORCED_FROM"
    - "DATED"
    - "TRANSITIONED_TO"
    # Affiliation
    - "MEMBER_OF"
    - "ATTENDS"
    - "AFFILIATED_WITH"
    - "GRADUATED_FROM"
    # Ownership
    - "OWNS"
    - "POSSESSES"
    - "RESPONSIBLE_FOR"
    # Event
    - "PARTICIPATED_IN"
    - "ATTENDED"
    - "ORGANIZED"
    - "HOSTED"

  # Temporal properties (from ADR-0081a)
  temporal_properties:
    - "valid_from"      # Unix timestamp (ms) - when relationship became valid
    - "valid_to"        # Unix timestamp (ms) - when relationship ended (null = ongoing)
    - "confidence"      # Float 0.0-1.0 - entity resolution confidence
    - "created_at"      # Unix timestamp (ms) - when record was created
    - "updated_at"      # Unix timestamp (ms) - when record was last updated

# Observability settings
observability:
  # Logging
  log_queries: true  # Log all Cypher queries (DEBUG level)
  log_slow_queries_threshold_ms: 100  # Log queries slower than threshold

  # Metrics (Prometheus)
  metrics_enabled: true
  metrics_prefix: "k0_neo4j"

  # Tracing
  trace_enabled: true
  cognitive_trace_id_property: "cognitive_trace_id"  # Property name for trace IDs

# Performance budgets (from ADR-0081)
performance:
  # Query latency targets (P95)
  entity_lookup_p95_ms: 10       # Entity lookup by ID
  entity_search_p95_ms: 50       # Entity search by pattern
  relationship_query_p95_ms: 30  # Relationship query (1 hop)
  relationship_query_3hop_p95_ms: 100  # Relationship query (3 hops)
  shortest_path_p95_ms: 100      # Shortest path (depth 6)
  temporal_query_p95_ms: 50      # Temporal query (1 year range)
  graph_traversal_p95_ms: 150    # Graph traversal (depth 6, 1000 nodes)

  # Write latency targets (P95)
  insert_entity_p95_ms: 20
  insert_relationship_p95_ms: 20
  update_entity_p95_ms: 20
  update_relationship_p95_ms: 20

# Privacy settings (integration with K0 P10)
privacy:
  # Privacy bands (from ADR-0081a)
  privacy_bands:
    - "GREEN"   # Non-sensitive, shareable
    - "AMBER"   # Personal, restricted sharing
    - "RED"     # Sensitive, PII redaction required

  # PII redaction for RED band entities
  redact_pii_enabled: true
  pii_properties:
    - "email"
    - "phone"
    - "address"
    - "social_security_number"
    - "credit_card"

  # Audit logging for sensitive operations
  audit_enabled: true
  audit_operations:
    - "CREATE"
    - "UPDATE"
    - "DELETE"
    - "QUERY"  # For RED band entities

# Docker Compose settings (for local development/testing)
docker:
  # Neo4j container settings
  image: "neo4j:5.20.0"
  container_name: "familyos-neo4j"
  ports:
    - "7474:7474"  # HTTP
    - "7687:7687"  # Bolt
  environment:
    NEO4J_AUTH: "neo4j/test-password"  # Override with secure password in production
    NEO4J_dbms_memory_heap_initial__size: "512M"
    NEO4J_dbms_memory_heap_max__size: "2G"
    NEO4J_dbms_memory_pagecache_size: "1G"
  volumes:
    - "./data/neo4j:/data"
    - "./logs/neo4j:/logs"
