# K0 Embedding Configuration (Production)
#
# Standardized on UltraBERT v2.1.0 (768-dim) per ADR-K003 v2.0.
# Legacy backends (sentence-transformers, openai, ollama) removed.
# Vectors stored as pgvector VECTOR(768) in st_vec table.
#
# Version: 2.0
# Updated: 2025-06-30

version: "2.0"

# Default backend
default_backend: "ultrabert"

# Backend-specific configuration
backends:
  ultrabert:
    # UltraBERT v2.1.0 -- primary embedding model for all K0 paths
    model: "ultrabert_v2.1.0"
    dimension: 768
    device: "cpu"  # or "cuda" for GPU
    batch_size: 32
    normalize_embeddings: true
    description: "UltraBERT v2.1.0 -- 768-dim, primary model for all K0 embedding paths"

  fake:
    # Deterministic hash-based embeddings (testing only)
    model: "fake-768"
    dimension: 768
    description: "Test-only fake embeddings (random 768-dim vectors)"

# Worker settings (legacy worker DISABLED -- P02 inline handles all embedding)
worker:
  enabled: false
  batch_size: 10
  poll_interval_sec: 1.0
  max_retries: 3
  retry_delay_sec: 5.0

# Performance budgets (P95 latency targets)
performance:
  target_latency_ms: 100  # Embedding computation should complete in <100ms
  batch_target_latency_ms: 500  # Batch of 10 embeddings <500ms

# Observability
observability:
  log_level: "INFO"
  metrics_enabled: true
  trace_enabled: true
  emit_embedding_vector: false  # Expensive - only for debugging
