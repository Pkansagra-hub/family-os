# K0 Embedding Configuration (Production)
#
# This file configures embedding backends for async embedding workers.
# Workers poll Outbox for embedding.enqueue entries and compute embeddings
# using the configured backend.

# Default backend (sentence-transformers, openai, ollama, fake)
default_backend: "sentence-transformers"

# Backend-specific configuration
backends:
  sentence-transformers:
    # HuggingFace sentence-transformers (local, no API key needed)
    model: "all-mpnet-base-v2"  # 768 dimensions, more accurate (default for local)
    # Alternative models:
    #   - "all-MiniLM-L6-v2" (384 dims, faster but less accurate)
    #   - "paraphrase-multilingual-MiniLM-L12-v2" (multilingual)
    device: "cpu"  # or "cuda" for GPU
    batch_size: 32  # Batch multiple texts for efficiency
    normalize_embeddings: true

  openai:
    # OpenAI API (requires OPENAI_API_KEY env var)
    model: "text-embedding-3-small"  # 1536 dims, $0.02/1M tokens
    # Alternative: "text-embedding-3-large" (3072 dims, $0.13/1M tokens)
    rate_limit_rpm: 3000  # Requests per minute (tier 1: 3000)
    rate_limit_tpm: 1000000  # Tokens per minute (tier 1: 1M)
    retry_max_attempts: 3
    retry_exponential_base: 2  # 2^attempt seconds
    timeout_sec: 30

  ollama:
    # Ollama local deployment (requires Ollama server running)
    url: "http://localhost:11434"
    model: "llama2"  # or "mistral", "codellama", etc.
    timeout_sec: 30

  fake:
    # Deterministic hash-based embeddings (testing only)
    model: "fake-minilm-l6"
    dimension: 384

# Worker settings
worker:
  batch_size: 10  # Process 10 Outbox entries per run_once()
  poll_interval_sec: 1.0  # Poll Outbox every 1 second
  max_retries: 3  # Max retry attempts for failed embeddings
  retry_delay_sec: 5.0  # Delay between retries

# Performance budgets (P95 latency targets)
performance:
  target_latency_ms: 100  # Embedding computation should complete in <100ms
  batch_target_latency_ms: 500  # Batch of 10 embeddings <500ms

# Observability
observability:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  metrics_enabled: true
  trace_enabled: true
  emit_embedding_vector: false  # Expensive - only for debugging
