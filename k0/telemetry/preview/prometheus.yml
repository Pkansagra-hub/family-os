# Prometheus scrape configuration for K0 kernel
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: 'k0-preview'
    environment: 'development'

# Load alert rules
rule_files:
  - '/etc/prometheus/rules/*.yaml'

# Scrape configurations
scrape_configs:
  - job_name: 'k0_kernel'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
          - 'k0-kernel:8080'
        labels:
          service: 'k0-kernel'
          instance: 'k0-kernel'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
