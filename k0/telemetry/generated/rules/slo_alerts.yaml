# Checksum: bce22cd324f3deb3
groups:
- interval: 30s
  name: k0_slo_alerts
  rules:
  - alert: SLOAPI_AVAILABILITYWarning
    annotations:
      description: 'api_availability exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/api_availability/
      summary: HTTP API availability (successful responses / total requests) warning
        threshold exceeded
    expr: (rate(k0_kernel_http_requests_total{status=~"2.."}[5m]) / rate(k0_kernel_http_requests_total[5m]))
      < 0.995
    for: 5m
    labels:
      severity: warning
      slo: api_availability
  - alert: SLOAPI_AVAILABILITYCritical
    annotations:
      description: 'api_availability exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/api_availability/
      summary: HTTP API availability (successful responses / total requests) critical
        threshold exceeded
    expr: (rate(k0_kernel_http_requests_total{status=~"2.."}[5m]) / rate(k0_kernel_http_requests_total[5m]))
      < 0.99
    for: 2m
    labels:
      severity: critical
      slo: api_availability
  - alert: SLOCOMMAND_SUBMIT_LATENCYWarning
    annotations:
      description: 'command_submit_latency exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/command_submit_latency/
      summary: 'Command submit P95 latency (target: 100ms) warning threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_command_submit_duration_seconds[5m])) >
      0.15
    for: 5m
    labels:
      severity: warning
      slo: command_submit_latency
  - alert: SLOCOMMAND_SUBMIT_LATENCYCritical
    annotations:
      description: 'command_submit_latency exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/command_submit_latency/
      summary: 'Command submit P95 latency (target: 100ms) critical threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_command_submit_duration_seconds[5m])) >
      0.25
    for: 2m
    labels:
      severity: critical
      slo: command_submit_latency
  - alert: SLOUOW_COMMIT_LATENCYWarning
    annotations:
      description: 'uow_commit_latency exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/uow_commit_latency/
      summary: 'UoW commit P95 latency (target: 50ms) warning threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_uow_commit_seconds[5m])) > 0.1
    for: 5m
    labels:
      severity: warning
      slo: uow_commit_latency
  - alert: SLOUOW_COMMIT_LATENCYCritical
    annotations:
      description: 'uow_commit_latency exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/uow_commit_latency/
      summary: 'UoW commit P95 latency (target: 50ms) critical threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_uow_commit_seconds[5m])) > 0.2
    for: 2m
    labels:
      severity: critical
      slo: uow_commit_latency
  - alert: SLOQUERY_EXECUTE_LATENCYWarning
    annotations:
      description: 'query_execute_latency exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/query_execute_latency/
      summary: 'Query execute P95 latency (target: 50ms) warning threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_query_execute_duration_seconds[5m])) >
      0.075
    for: 5m
    labels:
      severity: warning
      slo: query_execute_latency
  - alert: SLOQUERY_EXECUTE_LATENCYCritical
    annotations:
      description: 'query_execute_latency exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/query_execute_latency/
      summary: 'Query execute P95 latency (target: 50ms) critical threshold exceeded'
    expr: histogram_quantile(0.95, rate(k0_query_execute_duration_seconds[5m])) >
      0.15
    for: 2m
    labels:
      severity: critical
      slo: query_execute_latency
  - alert: SLOWAL_LAGWarning
    annotations:
      description: 'wal_lag exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/wal_lag/
      summary: WAL apply lag (replication staleness) warning threshold exceeded
    expr: histogram_quantile(0.95, rate(k0_wal_apply_lag_seconds[5m])) > 120.0
    for: 5m
    labels:
      severity: warning
      slo: wal_lag
  - alert: SLOWAL_LAGCritical
    annotations:
      description: 'wal_lag exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/wal_lag/
      summary: WAL apply lag (replication staleness) critical threshold exceeded
    expr: histogram_quantile(0.95, rate(k0_wal_apply_lag_seconds[5m])) > 300.0
    for: 2m
    labels:
      severity: critical
      slo: wal_lag
  - alert: SLOWAL_REPLICA_LAGWarning
    annotations:
      description: 'wal_replica_lag exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/wal_replica_lag/
      summary: Standby replica lag (topology replication) warning threshold exceeded
    expr: histogram_quantile(0.95, rate(k0_wal_replica_lag_seconds[5m])) > 20.0
    for: 5m
    labels:
      severity: warning
      slo: wal_replica_lag
  - alert: SLOWAL_REPLICA_LAGCritical
    annotations:
      description: 'wal_replica_lag exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/wal_replica_lag/
      summary: Standby replica lag (topology replication) critical threshold exceeded
    expr: histogram_quantile(0.95, rate(k0_wal_replica_lag_seconds[5m])) > 30.0
    for: 2m
    labels:
      severity: critical
      slo: wal_replica_lag
  - alert: SLOOUTBOX_BACKLOGWarning
    annotations:
      description: 'outbox_backlog exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/outbox_backlog/
      summary: Outbox pending message count (events to apply) warning threshold exceeded
    expr: k0_outbox_pending_total > 50000.0
    for: 5m
    labels:
      severity: warning
      slo: outbox_backlog
  - alert: SLOOUTBOX_BACKLOGCritical
    annotations:
      description: 'outbox_backlog exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/outbox_backlog/
      summary: Outbox pending message count (events to apply) critical threshold exceeded
    expr: k0_outbox_pending_total > 100000.0
    for: 2m
    labels:
      severity: critical
      slo: outbox_backlog
  - alert: SLOREPLAY_THROUGHPUTWarning
    annotations:
      description: 'replay_throughput exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/replay_throughput/
      summary: Outbox apply throughput (events applied per second) warning threshold
        exceeded
    expr: k0_outbox_apply_total > 500.0
    for: 5m
    labels:
      severity: warning
      slo: replay_throughput
  - alert: SLOREPLAY_THROUGHPUTCritical
    annotations:
      description: 'replay_throughput exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/replay_throughput/
      summary: Outbox apply throughput (events applied per second) critical threshold
        exceeded
    expr: k0_outbox_apply_total > 100.0
    for: 2m
    labels:
      severity: critical
      slo: replay_throughput
  - alert: SLOSCHEDULER_QUORUMWarning
    annotations:
      description: 'scheduler_quorum exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/scheduler_quorum/
      summary: Scheduler cluster members (quorum = 3+) warning threshold exceeded
    expr: k0_scheduler_members_total > 3.0
    for: 5m
    labels:
      severity: warning
      slo: scheduler_quorum
  - alert: SLOSCHEDULER_QUORUMCritical
    annotations:
      description: 'scheduler_quorum exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/scheduler_quorum/
      summary: Scheduler cluster members (quorum = 3+) critical threshold exceeded
    expr: k0_scheduler_members_total > 2.0
    for: 2m
    labels:
      severity: critical
      slo: scheduler_quorum
  - alert: SLOZONE_HEALTHWarning
    annotations:
      description: 'zone_health exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/zone_health/
      summary: Healthy zone ratio (1.0 = all zones operational) warning threshold
        exceeded
    expr: k0_zone_healthy_ratio > 0.5
    for: 5m
    labels:
      severity: warning
      slo: zone_health
  - alert: SLOZONE_HEALTHCritical
    annotations:
      description: 'zone_health exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/zone_health/
      summary: Healthy zone ratio (1.0 = all zones operational) critical threshold
        exceeded
    expr: k0_zone_healthy_ratio > 0.0
    for: 2m
    labels:
      severity: critical
      slo: zone_health
  - alert: SLOSSE_ACTIVE_SUBSCRIPTIONSWarning
    annotations:
      description: 'sse_active_subscriptions exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/sse_active_subscriptions/
      summary: Active SSE subscriptions (saturation at 80% of target) warning threshold
        exceeded
    expr: k0_sse_subscriptions_active > 800.0
    for: 5m
    labels:
      severity: warning
      slo: sse_active_subscriptions
  - alert: SLOSSE_ACTIVE_SUBSCRIPTIONSCritical
    annotations:
      description: 'sse_active_subscriptions exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/sse_active_subscriptions/
      summary: Active SSE subscriptions (saturation at 80% of target) critical threshold
        exceeded
    expr: k0_sse_subscriptions_active > 1000.0
    for: 2m
    labels:
      severity: critical
      slo: sse_active_subscriptions
  - alert: SLOSSE_SUBSCRIBE_RATEWarning
    annotations:
      description: 'sse_subscribe_rate exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/sse_subscribe_rate/
      summary: SSE subscribe rate (subscriptions per second) warning threshold exceeded
    expr: k0_sse_subscribe_total > 50.0
    for: 5m
    labels:
      severity: warning
      slo: sse_subscribe_rate
  - alert: SLOSSE_SUBSCRIBE_RATECritical
    annotations:
      description: 'sse_subscribe_rate exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/sse_subscribe_rate/
      summary: SSE subscribe rate (subscriptions per second) critical threshold exceeded
    expr: k0_sse_subscribe_total > 200.0
    for: 2m
    labels:
      severity: critical
      slo: sse_subscribe_rate
  - alert: SLOBUS_DISPATCH_LATENCYWarning
    annotations:
      description: 'bus_dispatch_latency exceeded warning threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/bus_dispatch_latency/
      summary: Bus dispatch P95 latency (inter-component messaging) warning threshold
        exceeded
    expr: histogram_quantile(0.95, rate(k0_bus_dispatch_latency_seconds[5m])) > 0.025
    for: 5m
    labels:
      severity: warning
      slo: bus_dispatch_latency
  - alert: SLOBUS_DISPATCH_LATENCYCritical
    annotations:
      description: 'bus_dispatch_latency exceeded critical threshold: {$value}'
      runbook_url: https://docs.example.com/runbooks/slos/bus_dispatch_latency/
      summary: Bus dispatch P95 latency (inter-component messaging) critical threshold
        exceeded
    expr: histogram_quantile(0.95, rate(k0_bus_dispatch_latency_seconds[5m])) > 0.05
    for: 2m
    labels:
      severity: critical
      slo: bus_dispatch_latency
