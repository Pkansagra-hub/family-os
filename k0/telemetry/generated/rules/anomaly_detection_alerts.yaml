# Anomaly Detection Alerts for K0 Kernel
# Uses Prometheus ML functions: predict_linear, deriv, stddev_over_time, quantile_over_time
# Detects: trends, spikes, volatility, outliers

groups:
  - name: anomaly_detection_alerts
    interval: 30s
    rules:
      # ========================================
      # TREND DETECTION (deriv)
      # ========================================

      - alert: K0CommandLatencyTrendIncreasing
        expr: |
          deriv(
            histogram_quantile(0.95,
              sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="command"}[5m])) by (le)
            )[1h:]
          ) > 0.001
        for: 30m
        labels:
          severity: warning
          component: command
          anomaly_type: trend
          team: kernel
        annotations:
          summary: "Command API latency trending up ({{ $value | humanize }}s/sec increase)"
          description: "P95 latency derivative {{ $value | humanize }} indicates performance degradation. Latency increasing at {{ $value | humanize }}s per second over 1h window. Check for memory leaks, connection pool exhaustion, or resource saturation."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#latency-trend"

      - alert: K0QueryLatencyTrendIncreasing
        expr: |
          deriv(
            histogram_quantile(0.95,
              sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="query"}[5m])) by (le)
            )[1h:]
          ) > 0.001
        for: 30m
        labels:
          severity: warning
          component: query
          anomaly_type: trend
          team: kernel
        annotations:
          summary: "Query API latency trending up ({{ $value | humanize }}s/sec increase)"
          description: "P95 latency derivative {{ $value | humanize }} indicates performance degradation. Latency increasing at {{ $value | humanize }}s per second over 1h window. Check for database query performance, index issues, or cache misses."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#latency-trend"

      # ========================================
      # SPIKE DETECTION (Z-Score)
      # ========================================

      - alert: K0TrafficSpikeAnomaly
        expr: |
          (
            sum(rate(k0_kernel_http_requests_total[5m]))
            -
            avg_over_time(sum(rate(k0_kernel_http_requests_total[5m]))[1h:])
          ) / stddev_over_time(sum(rate(k0_kernel_http_requests_total[5m]))[1h:]) > 3
        for: 5m
        labels:
          severity: warning
          component: kernel
          anomaly_type: spike
          team: kernel
        annotations:
          summary: "Unusual traffic spike detected (Z-score: {{ $value | printf \"%.2f\" }})"
          description: "Request rate is {{ $value | printf \"%.2f\" }} standard deviations above 1h baseline (99.7% confidence anomaly). Investigate for DDoS, retry storms, or viral traffic events."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#traffic-spike"

      - alert: K0ErrorRateSpikeAnomaly
        expr: |
          (
            sum(rate(k0_kernel_http_requests_total{status=~"5.."}[5m]))
            -
            avg_over_time(sum(rate(k0_kernel_http_requests_total{status=~"5.."}[5m]))[1h:])
          ) / stddev_over_time(sum(rate(k0_kernel_http_requests_total{status=~"5.."}[5m]))[1h:]) > 3
        for: 5m
        labels:
          severity: warning
          component: kernel
          anomaly_type: spike
          team: kernel
        annotations:
          summary: "Unusual error rate spike detected (Z-score: {{ $value | printf \"%.2f\" }})"
          description: "Error rate is {{ $value | printf \"%.2f\" }} standard deviations above 1h baseline. Investigate for deployment issues, dependency failures, or resource exhaustion."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#error-spike"

      # ========================================
      # VOLATILITY DETECTION (stddev)
      # ========================================

      - alert: K0CommandErrorRateVolatility
        expr: |
          stddev_over_time(
            sum(rate(k0_kernel_http_requests_total{operation="command",status=~"5.."}[1m]))[10m:]
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          component: command
          anomaly_type: volatility
          team: kernel
        annotations:
          summary: "Command API error rate highly volatile"
          description: "Error rate stddev {{ $value | humanize }} errors/sec indicates instability over 10m. High variance suggests flapping, intermittent failures, or circuit breaker oscillation."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#error-volatility"

      - alert: K0QueryErrorRateVolatility
        expr: |
          stddev_over_time(
            sum(rate(k0_kernel_http_requests_total{operation="query",status=~"5.."}[1m]))[10m:]
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          component: query
          anomaly_type: volatility
          team: kernel
        annotations:
          summary: "Query API error rate highly volatile"
          description: "Error rate stddev {{ $value | humanize }} errors/sec indicates instability over 10m. High variance suggests database connection issues or resource contention."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#error-volatility"

      - alert: K0LatencyVolatility
        expr: |
          stddev_over_time(
            histogram_quantile(0.95,
              sum(rate(k0_kernel_http_request_latency_seconds_bucket[1m])) by (le, operation)
            )[10m:]
          ) > 0.5
        for: 10m
        labels:
          severity: info
          component: kernel
          anomaly_type: volatility
          team: kernel
        annotations:
          summary: "API latency highly volatile (stddev: {{ $value | humanize }}s)"
          description: "P95 latency stddev {{ $value | humanize }}s indicates unpredictable performance. Investigate for resource contention, garbage collection pauses, or network issues."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#latency-volatility"

      # ========================================
      # OUTLIER DETECTION (quantile)
      # ========================================

      - alert: K0CommandLatencyOutlier
        expr: |
          histogram_quantile(0.99,
            sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="command"}[5m])) by (le)
          ) > quantile_over_time(0.999,
            histogram_quantile(0.99,
              sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="command"}[5m])) by (le)
            )[1h:]
          )
        for: 5m
        labels:
          severity: info
          component: command
          anomaly_type: outlier
          team: kernel
        annotations:
          summary: "Command API P99 latency outlier detected ({{ $value | humanize }}s)"
          description: "P99 latency {{ $value | humanize }}s exceeds hourly P99.9 baseline. Indicates extreme long-tail latency events. Check traces for slow queries or external API calls."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#latency-outlier"

      - alert: K0QueryLatencyOutlier
        expr: |
          histogram_quantile(0.99,
            sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="query"}[5m])) by (le)
          ) > quantile_over_time(0.999,
            histogram_quantile(0.99,
              sum(rate(k0_kernel_http_request_latency_seconds_bucket{operation="query"}[5m])) by (le)
            )[1h:]
          )
        for: 5m
        labels:
          severity: info
          component: query
          anomaly_type: outlier
          team: kernel
        annotations:
          summary: "Query API P99 latency outlier detected ({{ $value | humanize }}s)"
          description: "P99 latency {{ $value | humanize }}s exceeds hourly P99.9 baseline. Indicates extreme long-tail latency events. Check database query performance or cache misses."
          runbook_url: "https://github.com/Pkansagra-hub/memory_kernel/tree/main/docs/development/runbooks/anomaly-detection-response.md#latency-outlier"
