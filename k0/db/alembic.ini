# K0 Alembic Configuration
# Part of Milestone 1.1.2 - Alembic Migration Framework
#
# Usage:
#   cd k0/db
#   alembic upgrade head      # Apply all migrations
#   alembic downgrade -1      # Revert one migration
#   alembic current           # Show current revision
#   alembic history           # Show migration history
#   alembic revision -m "..."  # Create new migration

[alembic]
# Path to migration scripts directory
script_location = %(here)s/alembic

# Prepend sys.path with the k0 package root
prepend_sys_path = ../..

# Use OS path separator in version file paths
version_path_separator = os

# Exclude system tables from autogenerate
[alembic:exclude]
tables = spatial_ref_sys,alembic_version

# Post-write hooks for formatting generated migrations
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
