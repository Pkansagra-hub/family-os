version: "3.8"
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./generated/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    networks:
      - k0-local
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ChangeMe!
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./generated/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - k0-local
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./telemetry/alertmanager.yml:/etc/alertmanager/config.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    networks:
      - k0-local
  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    user: root
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - k0-local

volumes:
  tempo-data:

networks:
  k0-local:
    driver: bridge
