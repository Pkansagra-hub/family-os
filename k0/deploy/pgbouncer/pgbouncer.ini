;; K0 pgbouncer Configuration
;; Part of Milestone 1.1.2 - Connection Pooler Setup
;;
;; pgbouncer provides connection pooling between k0-kernel and PostgreSQL.
;; Using transaction pooling mode for optimal connection reuse.
;;
;; CRITICAL: asyncpg prepared statements are DISABLED (statement_cache_size=0)
;; in the application layer to avoid conflicts with transaction pooling.

[databases]
;; Map logical database name to physical PostgreSQL server
;; Format: dbname = host=<host> port=<port> dbname=<db>
k0_kernel = host=postgres port=5432 dbname=k0_kernel

[pgbouncer]
;; Network settings
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode: transaction mode for optimal connection reuse
;; IMPORTANT: Prepared statements don't work in transaction mode
;; Application must set statement_cache_size=0 in asyncpg
pool_mode = transaction

;; Connection limits
;; max_client_conn: Maximum connections from application
;; default_pool_size: Connections per database/user pair
;; min_pool_size: Minimum connections to keep open
;; reserve_pool_size: Extra connections for burst traffic
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5

;; Timeouts (seconds)
;; server_idle_timeout: Close idle server connections after this time
;; server_connect_timeout: Timeout for connecting to PostgreSQL
;; query_timeout: Maximum query execution time (0 = disabled)
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 0

;; Connection lifetime
;; server_lifetime: Close server connection after this many seconds
;; server_reset_query: Query to run when returning connection to pool
server_lifetime = 3600
server_reset_query = DISCARD ALL

;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Stats
stats_period = 60

;; Admin console (optional, for monitoring)
admin_users = pgbouncer_admin
