            (
              sum(increase(k0_kernel_http_requests_total{operation="command",status=~"5.."}[30m]))
              / clamp_min(sum(increase(k0_kernel_http_requests_total{operation="command"}[30m])), 1)
            )
            / 0.001
          ) > bool 6
        for: 10m
        labels:
          severity: warning
          component: command
          slo: availability
