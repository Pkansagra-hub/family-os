# Checksum: 7e0bbdcfeae87dd7
groups:
- interval: 15s
  name: k0-sli-latency-recording
  rules:
  - expr: histogram_quantile(0.50, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/command.submit"}[5m]))
      by (le))
    record: job:k0_command_latency_seconds:p50:5m
  - expr: histogram_quantile(0.95, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/command.submit"}[5m]))
      by (le))
    record: job:k0_command_latency_seconds:p95:5m
  - expr: histogram_quantile(0.99, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/command.submit"}[5m]))
      by (le))
    record: job:k0_command_latency_seconds:p99:5m
  - expr: histogram_quantile(0.50, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/query.recall"}[5m]))
      by (le))
    record: job:k0_query_latency_seconds:p50:5m
  - expr: histogram_quantile(0.95, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/query.recall"}[5m]))
      by (le))
    record: job:k0_query_latency_seconds:p95:5m
  - expr: histogram_quantile(0.99, sum(rate(k0_kernel_http_request_latency_seconds_bucket{route="/k0/query.recall"}[5m]))
      by (le))
    record: job:k0_query_latency_seconds:p99:5m
  - expr: histogram_quantile(0.95, sum by (route, le) (rate(k0_kernel_http_request_latency_seconds_bucket[5m])))
    record: job:k0_http_request_latency_seconds:p95:5m
- interval: 15s
  name: k0-sli-availability-recording
  rules:
  - expr: 1 - (sum(rate(k0_kernel_http_requests_total{status=~"5.."}[5m])) / sum(rate(k0_kernel_http_requests_total[5m]))) or vector(1)
    record: job:k0_api_availability:ratio5m
  - expr: 1 - (sum by (route) (rate(k0_kernel_http_requests_total{status=~"5.."}[5m]))
      / sum by (route) (rate(k0_kernel_http_requests_total[5m]))) or vector(1)
    record: job:k0_api_availability_by_route:ratio5m
  - expr: sum by (route) (rate(k0_kernel_http_requests_total{status=~"[23].."}[5m]))
      / sum by (route) (rate(k0_kernel_http_requests_total[5m]))
    record: job:k0_http_success_rate_by_route:ratio5m
- interval: 15s
  name: k0-sli-throughput-recording
  rules:
  - expr: sum by (route, method, status) (rate(k0_kernel_http_requests_total[5m]))
    record: job:k0_http_requests:rate5m
  - expr: sum(rate(k0_kernel_http_requests_total{route="/k0/command.submit"}[5m]))
    record: job:k0_command_submissions:rate5m
  - expr: sum(rate(k0_kernel_http_requests_total{route="/k0/query.recall"}[5m]))
    record: job:k0_query_executions:rate5m
  - expr: rate(k0_kernel_replay_processed_total[5m])
    record: job:k0_replay_throughput:rate5m
- interval: 60s
  name: k0-sli-error-budget-recording
  rules:
  - expr: 1 - ((1 - job:k0_api_availability:ratio5m) / (1 - 0.9990000000000001))
    record: job:k0_error_budget_remaining:ratio1h
  - expr: ((1 - job:k0_api_availability:ratio5m) / (1 - 0.9990000000000001))
    record: job:k0_error_budget_burn_rate:ratio1h
  - expr: clamp_max(job:k0_command_latency_seconds:p95:5m * 1000 / 100, 10)
    record: job:k0_command_latency_budget_compliance:ratio5m
- interval: 30s
  name: k0-sli-storage-recording
  rules:
  - expr: rate(k0_kernel_k0_uow_commit_total{outcome='success'}[5m])
    record: job:k0_wal_commits:rate5m
  - expr: rate(k0_kernel_k0_uow_wal_fsync_seconds_total{outcome='success'}[5m]) /
      rate(k0_kernel_k0_uow_wal_fsync_total{outcome='success'}[5m])
    record: job:k0_wal_fsync_duration_seconds:p95:5m
  - expr: sum(k0_kernel_outbox_pending_total) by (driver)
    record: job:k0_outbox_pending:ratio
