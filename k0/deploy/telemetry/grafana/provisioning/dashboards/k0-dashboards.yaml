apiVersion: 1
providers:
  # SLO Dashboards - Service Level Objectives and Performance Metrics
  - name: 'K0 SLO Dashboards'
    orgId: 1
    folder: 'K0 / SLOs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

  # Operations Dashboards - Real-time operational monitoring
  - name: 'K0 Operations'
    orgId: 1
    folder: 'K0 / Operations'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/operations

  # Service Health - Individual service deep-dives
  - name: 'K0 Services'
    orgId: 1
    folder: 'K0 / Services'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/services

  # Incidents - Troubleshooting and incident response
  - name: 'K0 Incidents'
    orgId: 1
    folder: 'K0 / Incidents'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/incidents
