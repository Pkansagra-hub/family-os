# Checksum: ceca41e76561f069
global:
  pagerduty_url: https://events.pagerduty.com/v2/enqueue
  resolve_timeout: 5m
  slack_api_url: https://slack.com/api/chat.postMessage
inhibit_rules:
- equal:
  - cluster
  source_matchers:
  - alertname="K0ClusterDown"
  target_matchers:
  - component="node"
- equal:
  - subsystem
  source_matchers:
  - alertname=~"K0ApiAvailability.*"
  - severity="critical"
  target_matchers:
  - alertname=~"K0.*Latency.*"
- equal:
  - subsystem
  source_matchers:
  - alertname="K0WalLagCritical"
  target_matchers:
  - alertname=~"K0OutboxBacklog.*"
- equal:
  - driver
  source_matchers:
  - alertname="K0DriverHandshakeFailureCritical"
  target_matchers:
  - component="drivers"
- equal:
  - cluster
  source_matchers:
  - alertname="K0MaintenanceMode"
  target_matchers:
  - severity="warning"
receivers:
- name: 'null'
- name: pagerduty-critical
  pagerduty_configs:
  - description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
    details:
      description: '{{ .CommonAnnotations.description }}'
      firing: '{{ .Alerts.Firing | len }}'
      resolved: '{{ .Alerts.Resolved | len }}'
      runbook_url: '{{ .CommonAnnotations.runbook_url }}'
    routing_key: PAGERDUTY_INTEGRATION_KEY_PLACEHOLDER
    send_resolved: true
    severity: critical
- name: pagerduty-sre
  pagerduty_configs:
  - description: '[SRE] {{ .GroupLabels.alertname }}'
    routing_key: PAGERDUTY_INTEGRATION_KEY_PLACEHOLDER
    send_resolved: true
    severity: error
- name: slack-sre
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: '#k0-alerts-sre'
    color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    footer: K0 Alertmanager | {{ .Status | toUpper }}
    send_resolved: true
    text: '*Severity:* {{ .CommonLabels.severity }}

      *SLO:* {{ .CommonLabels.slo }}

      *Description:* {{ .CommonAnnotations.description }}

      *Runbook:* {{ .CommonAnnotations.runbook_url }}'
    title: '🚨 K0 Alert: {{ .GroupLabels.alertname }}'
    title_link: '{{ .CommonAnnotations.runbook_url }}'
- name: slack-oncall
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: '#k0-oncall'
    color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
    footer: K0 SLO Monitor | {{ .Status | toUpper }} | Dashboard → http://localhost:3000/d/k0-slo-burn-rate
    send_resolved: true
    text: '*{{ if eq .CommonLabels.severity "critical" }}🔥 FAST BURN{{ else }}⚠️  SLOW BURN{{ end }}* detected on *{{ .CommonLabels.component | toUpper }}* API

      *SLO Type:* {{ .CommonLabels.slo | title }}

      *Error Budget Impact:* {{ .CommonAnnotations.summary }}

      *Action Required:* {{ if eq .CommonLabels.severity "critical" }}IMMEDIATE (< 15min){{ else }}Scheduled (< 4h){{ end }}

      *Description:* {{ .CommonAnnotations.description }}

      *Investigation Steps:*

      1. Open Dashboard: http://localhost:3000/d/k0-slo-burn-rate

      2. Check burn rate gauges and timeline

      3. Follow runbook: {{ .CommonAnnotations.runbook_url }}'
    title: '{{ if eq .CommonLabels.severity "critical" }}🔴 CRITICAL{{ else }}⚠️  WARNING{{ end }}: {{ .GroupLabels.alertname }}'
    title_link: http://localhost:3000/d/k0-slo-burn-rate
- name: slack-ops
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: '#k0-alerts-ops'
    color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
    footer: K0 Alertmanager | {{ .Status | toUpper }}
    send_resolved: true
    text: '{{ .CommonAnnotations.description }}'
    title: '⚠️  K0 Alert: {{ .GroupLabels.alertname }}'
    title_link: '{{ .CommonAnnotations.runbook_url }}'
- name: slack-platform
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: '#k0-platform'
    footer: K0 Alertmanager | {{ .Status | toUpper }}
    send_resolved: true
    text: '{{ .CommonAnnotations.description }}'
    title: '🔧 Platform Alert: {{ .GroupLabels.alertname }}'
    title_link: '{{ .CommonAnnotations.runbook_url }}'
- name: slack-storage
  slack_configs:
  - api_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: '#k0-storage'
    footer: K0 Alertmanager | {{ .Status | toUpper }}
    send_resolved: true
    text: '{{ .CommonAnnotations.description }}'
    title: '💾 Storage Alert: {{ .GroupLabels.alertname }}'
    title_link: '{{ .CommonAnnotations.runbook_url }}'
route:
  group_by:
  - alertname
  - cluster
  - component
  - subsystem
  group_interval: 5m
  group_wait: 30s
  receiver: 'null'
  repeat_interval: 12h
  routes:
  # SLO Burn Rate Alerts - Fast Burn (Critical)
  - continue: false
    group_by:
    - slo
    - component
    group_interval: 1m
    group_wait: 30s
    matchers:
    - alert_type="burn_rate"
    - severity="critical"
    receiver: pagerduty-critical
    repeat_interval: 1h
  # SLO Burn Rate Alerts - Slow Burn (Warning)
  - continue: false
    group_by:
    - slo
    - component
    group_interval: 2m
    group_wait: 30s
    matchers:
    - alert_type="burn_rate"
    - severity="warning"
    receiver: slack-oncall
    repeat_interval: 2h
  # General SLO Alerts (Critical)
  - continue: false
    group_by:
    - alertname
    - slo
    - subsystem
    group_interval: 2m
    group_wait: 10s
    matchers:
    - severity="critical"
    - slo=~".+"
    receiver: pagerduty-critical
    repeat_interval: 3h
  - continue: true
    group_by:
    - alertname
    - component
    - subsystem
    group_interval: 2m
    group_wait: 10s
    matchers:
    - severity="critical"
    receiver: pagerduty-critical
    repeat_interval: 6h
  - group_by:
    - alertname
    - slo
    - subsystem
    group_interval: 5m
    group_wait: 30s
    matchers:
    - severity="warning"
    - slo=~".+"
    receiver: slack-sre
    repeat_interval: 12h
  - group_by:
    - alertname
    - component
    group_interval: 10m
    group_wait: 1m
    matchers:
    - severity="warning"
    receiver: slack-ops
    repeat_interval: 24h
  - group_by:
    - alertname
    group_interval: 30m
    group_wait: 5m
    matchers:
    - severity=~"info|meta"
    receiver: slack-ops
    repeat_interval: 24h
  - group_by:
    - alertname
    - subsystem
    group_interval: 2m
    group_wait: 5s
    matchers:
    - contact="sre"
    - severity="critical"
    receiver: pagerduty-sre
    repeat_interval: 3h
  - group_by:
    - alertname
    - component
    group_interval: 10m
    group_wait: 1m
    matchers:
    - contact="platform"
    - severity="warning"
    receiver: slack-platform
    repeat_interval: 12h
  - group_by:
    - alertname
    - subsystem
    group_interval: 10m
    group_wait: 1m
    matchers:
    - contact="storage"
    - severity="warning"
    receiver: slack-storage
    repeat_interval: 12h
templates:
- /etc/alertmanager/templates/*.tmpl
