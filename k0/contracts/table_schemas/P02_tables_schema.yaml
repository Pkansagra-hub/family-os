## Validation & Acceptance Criteria

### Pre-Migration Checklist

- [ ] All three table schemas defined and reviewed
- [ ] All columns have documented semantics and sources
- [ ] All indexes specified with justification
- [ ] All foreign keys validated against existing tables
- [ ] All constraints (CHECK, UNIQUE, NOT NULL) documented
- [ ] Example data provided for each column type

### Post-Migration Checklist

- [ ] `st_hipp_events` table created with 70+ columns
- [ ] `st_embedding_queue` table created with retry logic
- [ ] `st_relationships` table restored and seeded (migration 0018 data)
- [ ] All indexes built successfully
- [ ] Foreign key constraints verified
- [ ] Row count: st_relationships ≥ 4 (from seed)
- [ ] Query performance: Range scans on (tenant_id, time) <100ms

### Acceptance Tests

```yaml
tests:
  - name: "Insert P02 event and verify columns"
    query: "INSERT INTO st_hipp_events (event_id, wal_pos, ...) VALUES (...)"
    expected: "Row inserted, all columns readable"

  - name: "Insert embedding job and verify retry logic"
    query: "INSERT INTO st_embedding_queue (...) VALUES (...)"
    expected: "Job created with status=PENDING, attempt_count=0"

  - name: "Verify st_relationships seed"
    query: "SELECT COUNT(*) FROM st_relationships WHERE household_id IS NOT NULL"
    expected: "Count >= 4"

  - name: "Query by (space_id, time) uses index"
    query: "EXPLAIN QUERY PLAN SELECT * FROM st_hipp_events WHERE space_id='personal:dad' AND event_time_utc > 1731000000"
    expected: "Uses idx_hipp_events_space_time"
```

