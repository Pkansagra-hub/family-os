### Index Contract

```yaml
indexes:
  - name: idx_hipp_events_tenant_time
    columns: [tenant_id, event_time_utc DESC]
    reason: "Retention queries, analytics range scans"

  - name: idx_hipp_events_space_time
    columns: [space_id, event_time_utc DESC]
    reason: "P03 consolidation per-space"

  - name: idx_hipp_events_simhash
    columns: [simhash_hex]
    reason: "P03 novelty detection via fingerprints"

  - name: idx_hipp_events_embedding_id
    columns: [embedding_id]
    reason: "Embedding job status tracking"

  - name: idx_hipp_events_band_time
    columns: [policy_band, event_time_utc DESC]
    reason: "Band-based retention policies"

  - name: idx_hipp_events_cluster_id
    columns: [episode_cluster_id]
    where: "episode_cluster_id IS NOT NULL"
    reason: "P03 cluster lookups (sparse index)"
```

### Constraint Contract

```yaml
constraints:
  - PRIMARY KEY: event_id
  - FOREIGN KEY: wal_pos REFERENCES st_wal(wal_pos)
  - FOREIGN KEY: retention_policy_id REFERENCES st_retention_policy(policy_id)
  - UNIQUE: embedding_id
  - CHECK: policy_decision IN ('ALLOW', 'DENY')
  - CHECK: policy_band IN ('GREEN', 'AMBER', 'RED')
  - CHECK: retention_bucket IN ('STANDARD', 'SENSITIVE', 'EPHEMERAL')
  - CHECK: visibility_scope IN ('OWNER_ONLY', 'SPACE_DEFAULT', 'HOUSEHOLD_ALL', 'CUSTOM_SUBSET', 'EXTERNAL_SHARE')
  - CHECK: actor_role IN ('SELF', 'AGENT', 'SYSTEM', 'DELEGATE')
  - CHECK: embedding_status IN ('PENDING','IN_PROGRESS','READY','FAILED')
  - CHECK: affect_band IN ('GREEN', 'AMBER', 'RED')
  - CHECK: social_intimacy IN ('LOW', 'MED', 'HIGH')
  - CHECK: salience_band IN ('HIGH', 'MED', 'LOW')
  - CHECK: novelty_score BETWEEN 0.0 AND 1.0 (when NOT NULL)
  - CHECK: cluster_confidence BETWEEN 0.0 AND 1.0 (when NOT NULL)
  - CHECK: sentiment_score BETWEEN 0.0 AND 1.0 (when NOT NULL)
```

