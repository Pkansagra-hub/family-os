## Table 1: `st_hipp_events`

### Contract Overview

| Aspect | Specification |
|--------|---------------|
| **Table Name** | `st_hipp_events` |
| **Purpose** | Hippocampus staging table for P02 enriched events |
| **Write Owner** | P02 (insert-only) |
| **Read Owners** | P03, P04, Retention Workers, Analytics |
| **Update Owner** | P03 (dedup/cluster columns only) |
| **Lifecycle** | Insert at write time, retain per policy, tombstone on expiry |
| **Estimated Size** | 2-3 KB per row, 90-day retention |
| **Query Patterns** | Point lookups, range scans by (space_id, time), fingerprint queries |
| **Partitioning** | Recommended: (tenant_id, event_time_utc) for large scale |

### Column Contract

#### Identity & Trace Group

```yaml
columns:
  - name: event_id
    type: TEXT
    constraints: PRIMARY KEY, NOT NULL
    semantics: "UUID, globally unique event identifier"
    source: "Generated by P02 (UUID v4)"
    example: "evt-a1b2c3d4-e5f6-4789-abcd-ef0123456789"

  - name: wal_pos
    type: INTEGER
    constraints: NOT NULL, FOREIGN KEY REFERENCES st_wal(wal_pos)
    semantics: "Position in write-ahead log (audit trail)"
    source: "From st_outbox entry, refers back to st_wal"
    example: 12345

  - name: cognitive_trace_id
    type: TEXT
    constraints: NOT NULL
    semantics: "End-to-end trace ID for observability"
    source: "From envelope"
    example: "11111111-2222-3333-4444-555555555555"

  - name: tenant_id
    type: TEXT
    constraints: NOT NULL, indexed
    semantics: "Tenant identifier (multi-tenancy key)"
    source: "From envelope"
    example: "family-smith"

  - name: space_id
    type: TEXT
    constraints: NOT NULL, indexed
    semantics: "Space identifier (e.g., 'personal:dad', 'shared:family')"
    source: "From envelope"
    example: "personal:dad"

  - name: effective_space_id
    type: TEXT
    constraints: nullable
    semantics: "Actual destination if redirected (optional)"
    source: "From policy_stamp.effective_space (if applicable)"
    example: null or "shared:family-archive"

  - name: topic
    type: TEXT
    constraints: NOT NULL
    semantics: "Event topic (schema reference)"
    source: "From envelope"
    example: "memory.episodic.formation"

  - name: uow_id
    type: TEXT
    constraints: nullable, indexed
    semantics: "UnitOfWork ID for transaction grouping"
    source: "P02 internal (batch processing identifier)"
    example: "uow-20251110-180001-00128"

  - name: schema_version
    type: TEXT
    constraints: NOT NULL, DEFAULT '1.0.0'
    semantics: "Schema version for forward compatibility"
    source: "Hardcoded in P02"
    example: "1.0.0"
```

#### Integrity & Audit Group

```yaml
columns:
  - name: envelope_sha256
    type: TEXT
    constraints: NOT NULL
    semantics: "SHA256 hash of original envelope (immutable audit trail)"
    source: "Computed by Command Port, stored in st_wal, read by P02"
    example: "4f2a6b7c0d9e1f2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2"

  - name: sig_alg
    type: TEXT
    constraints: NOT NULL
    semantics: "Signature algorithm identifier"
    source: "From envelope"
    example: "ECDSA_P256_SHA256"

  - name: sig_kid
    type: TEXT
    constraints: NOT NULL
    semantics: "Signature key ID (DID reference)"
    source: "From envelope"
    example: "did:device:dad-phone#2025-10-01"

  - name: idem_key
    type: TEXT
    constraints: NOT NULL
    semantics: "Idempotency key from hot path (deduplication at Command Port)"
    source: "From envelope"
    example: "idem:7c3e8f2a9b4d6e1f3c5a7b9d2e4f6a8c"

  - name: ingested_at
    type: INTEGER
    constraints: NOT NULL
    semantics: "Unix timestamp when envelope hit K0 ingress"
    source: "From envelope"
    example: 1731250810 (seconds since epoch)

  - name: clock_skew_ms
    type: INTEGER
    constraints: nullable
    semantics: "Clock skew between device and K0 (milliseconds)"
    source: "Computed by Command Port"
    example: 10000 (10 seconds)
```

#### Policy & Visibility Group

```yaml
columns:
  - name: policy_decision
    type: TEXT
    constraints: NOT NULL, CHECK policy_decision IN ('ALLOW', 'DENY')
    semantics: "Policy enforcement decision (only ALLOW reaches P02)"
    source: "From policy_stamp"
    example: "ALLOW"
    note: "DENY envelopes never reach st_wal, so always ALLOW in P02"

  - name: policy_band
    type: TEXT
    constraints: NOT NULL, CHECK policy_band IN ('GREEN', 'AMBER', 'RED')
    semantics: "Privacy/sensitivity band"
    source: "From policy_stamp"
    example: "AMBER"

  - name: policy_version
    type: TEXT
    constraints: NOT NULL
    semantics: "Policy version identifier"
    source: "From policy_stamp"
    example: "2025-11-01"

  - name: obligations_json
    type: TEXT
    constraints: nullable
    semantics: "JSON array of policy obligations"
    source: "From policy_stamp.obligations"
    example: '["mask.location.precision", "log.access"]'

  - name: visible_to_json
    type: TEXT
    constraints: nullable
    semantics: "JSON array of person IDs with visibility"
    source: "From policy_stamp.visible_to"
    example: '["person_dad"]'

  - name: visibility_scope
    type: TEXT
    constraints: nullable, CHECK visibility_scope IN ('OWNER_ONLY', 'SPACE_DEFAULT', 'HOUSEHOLD_ALL', 'CUSTOM_SUBSET', 'EXTERNAL_SHARE')
    semantics: "High-level pattern describing relationship between visible_to_json and space defaults (not ACL enforcement)"
    source: "Derived from policy and space resolution"
    note: "OWNER_ONLY=only owner, SPACE_DEFAULT=uses space rules, HOUSEHOLD_ALL=whole household, CUSTOM_SUBSET=arbitrary subset, EXTERNAL_SHARE=includes external principals"
    example: "CUSTOM_SUBSET"

  - name: owner_id
    type: TEXT
    constraints: NOT NULL
    semantics: "Primary owner of the space"
    source: "From SpaceResolver"
    example: "person_dad"

  - name: co_owners_json
    type: TEXT
    constraints: nullable
    semantics: "JSON array of co-owner IDs"
    source: "From SpaceResolver"
    example: '["person_mom"]'

  - name: retention_policy_id
    type: TEXT
    constraints: NOT NULL, FOREIGN KEY REFERENCES st_retention_policy(policy_id)
    semantics: "Reference to retention policy (band × topic × device_kind)"
    source: "Lookup at P02 write time"
    example: "ret_pol_20251101_AMBER_memory_phone"

  - name: retention_bucket
    type: TEXT
    constraints: NOT NULL, CHECK retention_bucket IN ('STANDARD', 'SENSITIVE', 'EPHEMERAL')
    semantics: "Retention classification"
    source: "From policy.retention_resolver"
    example: "STANDARD"
```

