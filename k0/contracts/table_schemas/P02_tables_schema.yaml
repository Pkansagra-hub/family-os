## Table 3: `st_relationships` — Family Graph Cache (RESTORED)

### Contract Overview

| Aspect | Specification |
|--------|---------------|
| **Table Name** | `st_relationships` |
| **Purpose** | Family graph cache (undeprecated from migration 0021) |
| **Write Owner** | Migration 0024 (seed), future sync worker |
| **Read Owner** | P02, Analytics |
| **Lifecycle** | Seed in migration, periodic refresh from Neo4j |
| **Query Patterns** | Lookup by (person_id, relationship_type), range scans by household |

### Column Contract

```yaml
columns:
  - name: id
    type: INTEGER
    constraints: PRIMARY KEY, AUTOINCREMENT
    semantics: "Internal row ID"
    example: 1

  - name: household_id
    type: TEXT
    constraints: NOT NULL, FOREIGN KEY REFERENCES households(household_id)
    semantics: "Household identifier"
    example: "hh-smith-2025"

  - name: person_id
    type: TEXT
    constraints: NOT NULL, FOREIGN KEY REFERENCES people(person_id)
    semantics: "Source person"
    example: "person_prince_001"

  - name: related_person_id
    type: TEXT
    constraints: NOT NULL, FOREIGN KEY REFERENCES people(person_id)
    semantics: "Related person"
    example: "person_jeel_001"

  - name: relationship_type
    type: TEXT
    constraints: NOT NULL, CHECK relationship_type IN ('SPOUSE_OF', 'PARENT_OF', 'CHILD_OF', 'CARETAKER_OF', 'SIBLING_OF')
    semantics: "Type of relationship"
    example: "SPOUSE_OF"

  - name: properties_json
    type: TEXT
    constraints: nullable
    semantics: "Additional properties (JSON)"
    example: '{"delegated_by": "person_prince_001"}'

  - name: source_version
    type: TEXT
    constraints: NOT NULL
    semantics: "Source/version identifier"
    example: "migration_0018"

  - name: hydrated_at
    type: TEXT
    constraints: NOT NULL
    semantics: "ISO timestamp when cached"
    example: "2025-11-15T12:00:00Z"

  - name: ttl_seconds
    type: INTEGER
    constraints: NOT NULL
    semantics: "Cache time-to-live (seconds)"
    example: 3600
```

### Index Contract

```yaml
indexes:
  - name: idx_relationships_household
    columns: [household_id]

  - name: idx_relationships_person
    columns: [person_id]

  - name: idx_relationships_type
    columns: [relationship_type]

  - name: idx_relationships_person_type
    columns: [person_id, relationship_type]
```

