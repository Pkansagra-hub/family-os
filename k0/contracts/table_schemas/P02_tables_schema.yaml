# P02 Tables Schema Contract

purpose: "Formal specification of the storage schema for P02 (Episodic Memory Formation). Defines three tables, their columns, indexes, constraints, and lifecycle."

scope: "Migration 0024 (P02 episodic write tables)"

status: "Ready for Implementation (Step 2.2)"

contract_metadata:
  - property: "Contract ID"
    value: "P02_SCHEMA_001"
  - property: "Migration ID"
    value: "0024"
  - property: "Pipeline"
    value: "P02 (Write / Hippocampus)"
  - property: "Phase"
    value: "Background Processing (non-hot-path)"
  - property: "Database"
    value: "SQLite (primary), PostgreSQL (production)"
  - property: "Backward Compatibility"
    value: "N/A (new tables)"
  - property: "Forward Compatibility"
    value: "Schema versioning via schema_version column"
  - property: "Deprecation Path"
    value: "Tables archived after 90 days post-supersession"

