#### Hippocampus: Pattern Separation & Novelty Group

```yaml
columns:
  - name: simhash_hex
    type: TEXT
    constraints: NOT NULL, indexed
    semantics: "64-bit SimHash fingerprint (hex format)"
    source: "From DGService.encode_fast() (locally computed)"
    example: "f7d3a8c2e41b5f9e"
    note: "P02 computes only; P03 uses for novelty queries"

  - name: minhash32
    type: TEXT
    constraints: NOT NULL
    semantics: "MinHash signatures JSON (32 permutations)"
    source: "From DGService.encode_fast() (locally computed)"
    example: '[12345, 67890, 23456, ...]'
    note: "JSON array of 32 hash values"

  - name: novelty_score
    type: REAL
    constraints: nullable, CHECK novelty_score BETWEEN 0.0 AND 1.0
    semantics: "Novelty score (1.0 = novel, 0.0 = duplicate)"
    source: "NULL in P02, populated by P03"
    example: null → 0.87 (after P03)

  - name: near_duplicates_json
    type: TEXT
    constraints: nullable
    semantics: "JSON array of near-duplicate event IDs"
    source: "NULL in P02, populated by P03"
    example: null → '["evt-xyz123", "evt-abc456"]'

  - name: is_near_duplicate
    type: BOOLEAN
    constraints: nullable
    semantics: "True if event is near-duplicate of another"
    source: "NULL in P02, populated by P03"
    example: null → false

  - name: episode_cluster_id
    type: TEXT
    constraints: nullable, indexed
    semantics: "Global episode cluster ID"
    source: "NULL in P02, populated by P03"
    example: null → "cluster-ep-20251101-001"

  - name: cluster_confidence
    type: REAL
    constraints: nullable, CHECK cluster_confidence BETWEEN 0.0 AND 1.0
    semantics: "Confidence in cluster assignment"
    source: "NULL in P02, populated by P03"
    example: null → 0.95

  - name: clustering_version
    type: TEXT
    constraints: nullable
    semantics: "Version of clustering algorithm used"
    source: "NULL in P02, populated by P03"
    example: null → "p03_clustering_v1.2"
```

