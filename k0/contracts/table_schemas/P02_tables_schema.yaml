## Table 2: `st_embedding_queue`

### Contract Overview

| Aspect | Specification |
|--------|---------------|
| **Table Name** | `st_embedding_queue` |
| **Purpose** | Job queue for P08 vector generation |
| **Write Owner** | P02 (initial insert) |
| **Read Owner** | P08 (polling), P03 (status checks) |
| **Update Owner** | P08 (status updates, retry tracking) |
| **Lifecycle** | Insert by P02, update by P08, archive after READY |
| **Query Patterns** | Polling by (status, next_attempt_ts), lookup by event_id |
| **Partitioning** | Recommended: (status, created_at) for cleanup |

### Column Contract

```yaml
columns:
  - name: job_id
    type: INTEGER
    constraints: PRIMARY KEY, AUTOINCREMENT
    semantics: "Job ID (internal, auto-generated)"
    example: 1001

  - name: wal_pos
    type: INTEGER
    constraints: NOT NULL, FOREIGN KEY REFERENCES st_wal(wal_pos)
    semantics: "Position in write-ahead log"
    example: 12345

  - name: event_id
    type: TEXT
    constraints: NOT NULL, FOREIGN KEY REFERENCES st_hipp_events(event_id)
    semantics: "Reference to st_hipp_events row"
    example: "evt-a1b2c3d4-e5f6-4789-abcd-ef0123456789"

  - name: embedding_id
    type: TEXT
    constraints: NOT NULL, UNIQUE
    semantics: "UUID for embedding (matches st_hipp_events.embedding_id)"
    example: "emb-b3d7e9f2-a1c6-42eb-8f4d-c7e2a9b5f1d8"

  - name: tenant_id
    type: TEXT
    constraints: NOT NULL
    semantics: "Tenant identifier"
    example: "family-smith"

  - name: space_id
    type: TEXT
    constraints: NOT NULL
    semantics: "Space identifier"
    example: "personal:dad"

  - name: vector_kind
    type: TEXT
    constraints: NOT NULL
    semantics: "Type of vector to generate"
    example: "memory.body.text"

  - name: model_id
    type: TEXT
    constraints: NOT NULL
    semantics: "Embedding model identifier"
    example: "embed-mini-001"

  - name: priority
    type: TEXT
    constraints: NOT NULL, DEFAULT 'NORMAL'
    semantics: "Job priority level"
    example: "NORMAL"

  - name: status
    type: TEXT
    constraints: NOT NULL, CHECK status IN ('PENDING', 'IN_PROGRESS', 'READY', 'FAILED_RETRYABLE', 'FAILED_PERMANENT')
    semantics: "Job execution status"
    example: "PENDING"

  - name: attempt_count
    type: INTEGER
    constraints: NOT NULL, DEFAULT 0
    semantics: "Number of execution attempts"
    example: 0

  - name: max_attempts
    type: INTEGER
    constraints: NOT NULL, DEFAULT 5
    semantics: "Maximum retry attempts"
    example: 5

  - name: next_attempt_ts
    type: INTEGER
    constraints: nullable
    semantics: "Unix timestamp of next retry (NULL if immediate)"
    example: 1731250870

  - name: last_error
    type: TEXT
    constraints: nullable
    semantics: "Error message from last failed attempt"
    example: "Connection timeout to vector store"

  - name: created_at
    type: INTEGER
    constraints: NOT NULL
    semantics: "Job creation timestamp"
    example: 1731250810

  - name: updated_at
    type: INTEGER
    constraints: NOT NULL
    semantics: "Last update timestamp"
    example: 1731250850
```

### Index Contract

```yaml
indexes:
  - name: idx_embedding_queue_status_time
    columns: [status, next_attempt_ts]
    reason: "P08 polling queries"

  - name: idx_embedding_queue_event_id
    columns: [event_id]
    reason: "Lookup by event"

  - name: idx_embedding_queue_embedding_id
    columns: [embedding_id]
    reason: "Lookup by embedding UUID"

  - name: idx_embedding_queue_status_created
    columns: [status, created_at]
    where: "status = 'READY'"
    reason: "Identify old completed jobs for archival"
```

