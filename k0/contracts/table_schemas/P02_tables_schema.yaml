  - name: local_time
    type: TEXT
    constraints: nullable
    semantics: "Event time in tenant timezone (HH:MM:SS)"
    source: "From temporal.profiler"
    example: "18:00:00"

  - name: day_of_week
    type: TEXT
    constraints: nullable
    semantics: "Day of week name"
    source: "From temporal.profiler"
    example: "sunday"

  - name: is_weekend
    type: BOOLEAN
    constraints: nullable
    semantics: "True if Saturday or Sunday"
    source: "Derived from day_of_week"
