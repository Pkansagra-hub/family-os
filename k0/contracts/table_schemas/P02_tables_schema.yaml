  - name: circadian_slot
    type: TEXT
    constraints: nullable
    semantics: "Circadian activity slot"
    source: "From temporal.profiler"
    example: "dinner"

  - name: is_backdated
    type: BOOLEAN
    constraints: nullable
    semantics: "True if event occurred >24h before write"
    source: "Calculated: write_lag_ms > 86400000"
