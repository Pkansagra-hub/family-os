classes:
  - name: PIIRedactor
    description: Redacts personally identifiable information for GDPR compliance
    research: GDPR Article 4(1) (definition of personal data), ADR-0035 (PII detection)
    performance_budget: <0.5ms per redaction operation
    privacy_properties:
      - gdpr_compliant: Removes personal data before audit logging
      - band_aware: Different redaction levels per privacy band
      - reversible: Encrypted vault stores original data (ADR-0036)
    methods:
      - name: redact
        description: Redact PII based on privacy band and content type
        parameters:
          - name: text
            type: string
            description: Text content to redact
          - name: privacy_band
            type: string
            description: GREEN | AMBER | RED (determines redaction level)
        returns:
          type: string
          description: Redacted text with PII replaced by markers
        implementation:
          rust: |
            use regex::Regex;

            pub struct PIIRedactor {
                email_regex: Regex,
                phone_regex: Regex,
                ssn_regex: Regex,
                credit_card_regex: Regex,
            }

            impl PIIRedactor {
                pub fn new() -> Self {
                    Self {
                        email_regex: Regex::new(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b").unwrap(),
                        phone_regex: Regex::new(r"\b\d{3}[-.]?\d{3}[-.]?\d{4}\b").unwrap(),
                        ssn_regex: Regex::new(r"\b\d{3}-\d{2}-\d{4}\b").unwrap(),
                        credit_card_regex: Regex::new(r"\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{4}\b").unwrap(),
                    }
                }

                pub fn redact(&self, text: &str, privacy_band: &str) -> String {
                    match privacy_band {
                        "GREEN" => {
                            // Minimal redaction (public data)
                            self.redact_ssn(text)
                        }
                        "AMBER" => {
                            // Moderate redaction (PII)
                            let text = self.redact_email(text);
                            let text = self.redact_phone(&text);
                            let text = self.redact_ssn(&text);
                            text
                        }
                        "RED" => {
                            // Aggressive redaction (PHI/financial)
                            let text = self.redact_email(text);
                            let text = self.redact_phone(&text);
                            let text = self.redact_ssn(&text);
                            let text = self.redact_credit_card(&text);
                            text
                        }
                        _ => text.to_string(),
                    }
                }

                fn redact_email(&self, text: &str) -> String {
                    self.email_regex.replace_all(text, "[REDACTED:EMAIL]").to_string()
                }

                fn redact_phone(&self, text: &str) -> String {
                    self.phone_regex.replace_all(text, "[REDACTED:PHONE]").to_string()
                }

                fn redact_ssn(&self, text: &str) -> String {
                    self.ssn_regex.replace_all(text, "[REDACTED:SSN]").to_string()
                }

                fn redact_credit_card(&self, text: &str) -> String {
                    self.credit_card_regex.replace_all(text, "[REDACTED:CC]").to_string()
                }
            }
          python: |
            import re

            class PIIRedactor:
                """PII redactor for GDPR compliance"""

                def __init__(self):
                    self.email_regex = re.compile(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b")
                    self.phone_regex = re.compile(r"\b\d{3}[-.]?\d{3}[-.]?\d{4}\b")
                    self.ssn_regex = re.compile(r"\b\d{3}-\d{2}-\d{4}\b")
                    self.credit_card_regex = re.compile(r"\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{4}\b")

                def redact(self, text: str, privacy_band: str) -> str:
                    """Redact PII based on privacy band"""
                    if privacy_band == "GREEN":
                        # Minimal redaction
                        return self._redact_ssn(text)
                    elif privacy_band == "AMBER":
                        # Moderate redaction
                        text = self._redact_email(text)
                        text = self._redact_phone(text)
                        text = self._redact_ssn(text)
                        return text
                    elif privacy_band == "RED":
                        # Aggressive redaction
                        text = self._redact_email(text)
                        text = self._redact_phone(text)
                        text = self._redact_ssn(text)
                        text = self._redact_credit_card(text)
                        return text
                    else:
                        return text

                def _redact_email(self, text: str) -> str:
                    return self.email_regex.sub("[REDACTED:EMAIL]", text)

                def _redact_phone(self, text: str) -> str:
                    return self.phone_regex.sub("[REDACTED:PHONE]", text)

                def _redact_ssn(self, text: str) -> str:
                    return self.ssn_regex.sub("[REDACTED:SSN]", text)

                def _redact_credit_card(self, text: str) -> str:
                    return self.credit_card_regex.sub("[REDACTED:CC]", text)
        performance_requirements:
          - latency: <0.5ms per redaction (P95)
          - throughput: 2000 redactions/second
          - memory: <1MB additional memory
        privacy_requirements:
          - no_false_positives: Only redact actual PII patterns
          - comprehensive_coverage: Cover all major PII types
          - band_appropriate: Different levels per privacy band

    redaction_rules:
      - type: email
        pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
        replacement: "[REDACTED:EMAIL]"
        bands: ["AMBER", "RED"]
        gdpr_impact: Direct personal data (Article 4(1))

      - type: phone
        pattern: "\\b\\d{3}[-.]?\\d{3}[-.]?\\d{4}\\b"
        replacement: "[REDACTED:PHONE]"
        bands: ["AMBER", "RED"]
        gdpr_impact: Personal data (contact information)

      - type: ssn
        pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
        replacement: "[REDACTED:SSN]"
        bands: ["GREEN", "AMBER", "RED"]
        gdpr_impact: Sensitive personal data

      - type: credit_card
        pattern: "\\b\\d{4}[- ]?\\d{4}[- ]?\\d{4}[- ]?\\d{4}\\b"
        replacement: "[REDACTED:CC]"
        bands: ["RED"]
        gdpr_impact: Financial data (special category)

dependencies:
  - name: regex
    version: "1.10"
    description: Regular expression engine for PII pattern matching
    language: rust
  - name: re
    version: "built-in"
    description: Regular expression engine for PII pattern matching
    language: python

testing_requirements:
  - unit_tests:
      - email_redaction: Redacts john@example.com → [REDACTED:EMAIL]
      - phone_redaction: Redacts 555-123-4567 → [REDACTED:PHONE]
      - ssn_redaction: Redacts 123-45-6789 → [REDACTED:SSN]
      - credit_card_redaction: Redacts 4111-1111-1111-1111 → [REDACTED:CC]
      - band_aware_redaction: Different redaction levels per band
      - performance_budget: <0.5ms per redaction
  - integration_tests:
      - end_to_end_redaction: Process user message with multiple PII types
      - false_positive_detection: Ensure no legitimate text is redacted
      - concurrent_redaction: Multiple threads redacting safely
  - privacy_tests:
      - gdpr_compliance: Verify redaction satisfies Article 4(1)
      - completeness: All PII types covered
      - accuracy: High precision (>99%) and recall (>95%)

observability:
  metrics:
    - name: pii_redactions_total
      type: counter
      labels: [pii_type, privacy_band]
      description: Total PII redactions by type and band
    - name: redaction_latency_ms
      type: histogram
      buckets: [0.1, 0.5, 1.0]
      description: PII redaction latency in milliseconds
    - name: redaction_errors_total
      type: counter
      description: Total redaction processing errors

compliance:
  - gdpr: Article 4(1) (definition of personal data), Article 5(1)(c) (data minimization)
  - hipaa: § 164.514(b) (de-identification of PHI)
  - ccpa: § 1798.140(o) (de-identified information)
