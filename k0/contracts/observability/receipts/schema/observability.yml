classes:
  - name: ReceiptObservability
    description: Observability and metrics for receipt generation system
    research: ADR-0038a (receipt generation), Prometheus monitoring, OpenTelemetry tracing
    performance_budget: <0.1ms per metric emission (P95)
    reliability_properties:
      - metric_accuracy: All metrics accurately reflect system state
      - tracing_completeness: All receipt operations fully traced
      - alerting_coverage: Critical errors trigger alerts within 1 second
    methods:
      - name: record_receipt_creation
        description: Record receipt creation metrics and traces
        parameters:
          - name: receipt_type
            type: string
            description: Type of receipt (TURN/TOOL/STATE/AGENT)
          - name: session_id
            type: string
            description: Session identifier
          - name: privacy_band
            type: string
            description: Privacy band (GREEN/AMBER/RED)
          - name: latency_ms
            type: float
            description: Receipt creation latency
          - name: trace_id
            type: string
            description: Cognitive trace ID
        returns:
          type: void
        implementation:
          rust: |
            use prometheus::{Counter, Histogram, Encoder, TextEncoder};
            use opentelemetry::trace::{Tracer, Span};
            use std::collections::HashMap;

            lazy_static! {
                static ref RECEIPT_CREATION_TOTAL: Counter = register_counter!(
                    "receipt_creation_total",
                    "Total receipts created",
                    &["receipt_type", "privacy_band"]
                ).unwrap();

                static ref RECEIPT_CREATION_LATENCY_MS: Histogram = register_histogram!(
                    "receipt_creation_latency_ms",
                    "Receipt creation latency in milliseconds",
                    &["receipt_type"],
                    vec![0.1, 0.5, 1.0, 2.0, 5.0]
                ).unwrap();

                static ref RECEIPT_GENERATION_ERRORS_TOTAL: Counter = register_counter!(
                    "receipt_generation_errors_total",
                    "Total receipt generation errors",
                    &["error_type", "receipt_type"]
                ).unwrap();
            }

            impl ReceiptObservability {
                pub fn record_receipt_creation(
                    &self,
                    receipt_type: &str,
                    session_id: &str,
                    privacy_band: &str,
                    latency_ms: f64,
                    trace_id: &str,
                ) {
                    // Prometheus metrics
                    RECEIPT_CREATION_TOTAL
                        .with_label_values(&[receipt_type, privacy_band])
                        .inc();

                    RECEIPT_CREATION_LATENCY_MS
                        .with_label_values(&[receipt_type])
                        .observe(latency_ms);

                    // OpenTelemetry tracing
                    let tracer = opentelemetry::global::tracer("receipt_generator");
                    let mut span = tracer
                        .span_builder(format!("receipt.create.{}", receipt_type.to_lowercase()))
                        .with_trace_id(trace_id.parse().unwrap_or_default())
                        .start(&tracer);

                    span.set_attribute("receipt.type", receipt_type.to_string());
                    span.set_attribute("session.id", session_id.to_string());
                    span.set_attribute("privacy.band", privacy_band.to_string());
                    span.set_attribute("latency.ms", latency_ms);

                    // Performance budget validation
                    if latency_ms > 1.0 {
                        span.set_attribute("budget.violation", true);
                        span.add_event("Performance budget exceeded", vec![
                            KeyValue::new("budget_ms", 1.0),
                            KeyValue::new("actual_ms", latency_ms),
                        ]);
                    }

                    span.end();
                }

                pub fn record_generation_error(
                    &self,
                    error_type: &str,
                    receipt_type: &str,
                    trace_id: &str,
                ) {
                    RECEIPT_GENERATION_ERRORS_TOTAL
                        .with_label_values(&[error_type, receipt_type])
                        .inc();

                    let tracer = opentelemetry::global::tracer("receipt_generator");
                    let mut span = tracer
                        .span_builder("receipt.generation.error")
                        .with_trace_id(trace_id.parse().unwrap_or_default())
                        .start(&tracer);

                    span.set_attribute("error.type", error_type.to_string());
                    span.set_attribute("receipt.type", receipt_type.to_string());
                    span.record_error(&format!("Receipt generation failed: {}", error_type));

                    span.end();
                }

                pub fn get_metrics(&self) -> String {
                    let encoder = TextEncoder::new();
                    let metric_families = prometheus::gather();
                    let mut buffer = Vec::new();
                    encoder.encode(&metric_families, &mut buffer).unwrap();
                    String::from_utf8(buffer).unwrap()
                }
            }
          python: |
            from prometheus_client import Counter, Histogram, generate_latest
            from opentelemetry import trace
            from opentelemetry.trace import Status, StatusCode
            import time

            class ReceiptObservability:
                """Observability for receipt generation system"""

                def __init__(self):
                    self.receipt_creation_total = Counter(
                        'receipt_creation_total',
                        'Total receipts created',
                        ['receipt_type', 'privacy_band']
                    )

                    self.receipt_creation_latency_ms = Histogram(
                        'receipt_creation_latency_ms',
                        'Receipt creation latency in milliseconds',
                        ['receipt_type'],
                        buckets=[0.1, 0.5, 1.0, 2.0, 5.0]
                    )

                    self.receipt_generation_errors_total = Counter(
                        'receipt_generation_errors_total',
                        'Total receipt generation errors',
                        ['error_type', 'receipt_type']
                    )

                    self.tracer = trace.get_tracer(__name__)

                def record_receipt_creation(
                    self,
                    receipt_type: str,
                    session_id: str,
                    privacy_band: str,
                    latency_ms: float,
                    trace_id: str,
                ):
                    """Record receipt creation metrics and traces"""
                    # Prometheus metrics
                    self.receipt_creation_total \
                        .labels(receipt_type=receipt_type, privacy_band=privacy_band) \
                        .inc()

                    self.receipt_creation_latency_ms \
                        .labels(receipt_type=receipt_type) \
                        .observe(latency_ms)

                    # OpenTelemetry tracing
                    with self.tracer.start_as_current_span(
                        f"receipt.create.{receipt_type.lower()}",
                        trace_id=trace_id,
                    ) as span:
                        span.set_attribute("receipt.type", receipt_type)
                        span.set_attribute("session.id", session_id)
                        span.set_attribute("privacy.band", privacy_band)
                        span.set_attribute("latency.ms", latency_ms)

                        # Performance budget validation
                        if latency_ms > 1.0:
                            span.set_attribute("budget.violation", True)
                            span.add_event(
                                "Performance budget exceeded",
                                {"budget_ms": 1.0, "actual_ms": latency_ms}
                            )

                def record_generation_error(
                    self,
                    error_type: str,
                    receipt_type: str,
                    trace_id: str,
                ):
                    """Record receipt generation errors"""
                    self.receipt_generation_errors_total \
                        .labels(error_type=error_type, receipt_type=receipt_type) \
                        .inc()

                    with self.tracer.start_as_current_span(
                        "receipt.generation.error",
                        trace_id=trace_id,
                    ) as span:
                        span.set_attribute("error.type", error_type)
                        span.set_attribute("receipt.type", receipt_type)
                        span.record_exception(Exception(f"Receipt generation failed: {error_type}"))
                        span.set_status(Status(StatusCode.ERROR))

                def get_metrics(self) -> str:
                    """Get Prometheus metrics in text format"""
                    return generate_latest().decode('utf-8')

    dependencies:
      - name: prometheus
        description: Metrics collection and exposition
      - name: opentelemetry
        description: Distributed tracing and observability
      - name: structlog
        description: Structured logging for audit events

testing_requirements:
  - unit_tests:
      - metric_accuracy: Metrics increment correctly for each receipt type
      - tracing_completeness: All operations properly traced
      - performance_budget: <0.1ms per metric emission
  - integration_tests:
      - prometheus_scraping: Metrics exposed correctly at /metrics endpoint
      - tracing_collection: Traces collected by Jaeger/Zipkin
      - alerting_integration: Critical errors trigger alerts
  - security_tests:
      - metric_leakage: No sensitive data in metric labels
      - trace_privacy: PII redacted in trace attributes

alerting_rules:
  - name: ReceiptCreationLatencyHigh
    condition: rate(receipt_creation_latency_ms{quantile="0.95"}[5m]) > 1.0
    severity: warning
    description: Receipt creation latency exceeds 1ms P95 budget
    runbook: Check receipt generator performance, consider scaling

  - name: ReceiptGenerationErrorsHigh
    condition: rate(receipt_generation_errors_total[5m]) > 0.01
    severity: error
    description: Receipt generation error rate > 1%
    runbook: Check receipt generator health, review error logs

  - name: ReceiptCreationRateLow
    condition: rate(receipt_creation_total[5m]) < 1
    severity: warning
    description: Receipt creation rate abnormally low
    runbook: Check if receipt generation is paused or failing

compliance:
  - gdpr: Article 30 (audit logging of processing activities)
  - hipaa: § 164.312(b) (audit controls and monitoring)
  - soc2: CC7.2 (system monitoring and alerting)
