classes:
  - name: ReceiptGenerator
    description: Generates audit receipts with PII redaction and hash chain computation
    research: ADR-0038a (receipt generation), ADR-0035 (PII redaction), SHA-256 hash chains
    performance_budget: <1ms per receipt generation (P95)
    reliability_properties:
      - atomic_generation: Receipt creation succeeds or fails completely
      - hash_chain_integrity: Each receipt links to previous via SHA-256
      - pii_compliance: All PII redacted before receipt creation
    methods:
      - name: generate_turn_receipt
        description: Generate TurnReceipt for user turn (message + response)
        parameters:
          - name: session_id
            type: string
            description: Session identifier
          - name: space_id
            type: string
            description: Space identifier
          - name: user_id
            type: string
            description: User identifier
          - name: turn_number
            type: int
            description: Turn number in session
          - name: user_message
            type: string
            description: User message (will be redacted)
          - name: agent_response
            type: string
            description: Agent response (will be redacted)
          - name: privacy_band
            type: string
            description: Privacy band (GREEN/AMBER/RED)
          - name: latency_ms
            type: int
            description: Turn latency in milliseconds
          - name: intent
            type: string
            description: Intent classification
          - name: trace_id
            type: string
            description: Cognitive trace ID
        returns:
          type: Receipt
          description: Generated receipt with FlatBuffers payload
        implementation:
          rust: |
            use uuid::Uuid;
            use chrono::Utc;
            use flatbuffers::FlatBufferBuilder;
            use crate::receipts::schemas::{TurnReceipt, TurnReceiptArgs};

            impl ReceiptGenerator {
                pub async fn generate_turn_receipt(
                    &self,
                    session_id: &str,
                    space_id: &str,
                    user_id: &str,
                    turn_number: i32,
                    user_message: &str,
                    agent_response: &str,
                    privacy_band: &str,
                    latency_ms: i32,
                    intent: &str,
                    trace_id: &str,
                ) -> Result<Receipt, ReceiptError> {
                    let start = std::time::Instant::now();

                    // 1. Redact PII based on privacy band
                    let redacted_user_message = self.redactor.redact(user_message, privacy_band);
                    let redacted_agent_response = self.redactor.redact(agent_response, privacy_band);

                    // 2. Get previous receipt hash
                    let previous_hash = self.get_previous_hash(session_id).await;

                    // 3. Generate receipt ID and timestamp
                    let receipt_id = Uuid::new_v4().to_string();
                    let timestamp = Utc::now().timestamp_millis();

                    // 4. Compute current hash
                    let current_hash = self.hash_computer.compute_receipt_hash(
                        &receipt_id,
                        timestamp,
                        &format!("{}|{}|{}", redacted_user_message, redacted_agent_response, intent),
                        &previous_hash,
                    );

                    // 5. Build FlatBuffers receipt
                    let mut builder = FlatBufferBuilder::new();
                    let receipt_fb = self.build_turn_receipt_fb(
                        &mut builder,
                        &receipt_id,
                        session_id,
                        space_id,
                        user_id,
                        turn_number,
                        &redacted_user_message,
                        &redacted_agent_response,
                        privacy_band,
                        latency_ms,
                        intent,
                        trace_id,
                        timestamp,
                        &previous_hash,
                        &current_hash,
                    );

                    builder.finish(receipt_fb, None);
                    let payload = builder.finished_data().to_vec();

                    // 6. Update hash cache
                    self.update_last_hash(session_id, current_hash.clone()).await;

                    let generation_ms = start.elapsed().as_millis();

                    // Emit metrics
                    RECEIPT_GENERATION_LATENCY_MS
                        .with_label_values(&["turn"])
                        .observe(generation_ms as f64);

                    // Validate performance budget
                    if generation_ms > 1 {
                        eprintln!(
                            "[ReceiptGenerator] WARNING: TurnReceipt generation exceeded 1ms budget ({}ms)",
                            generation_ms
                        );
                    }

                    Ok(Receipt {
                        receipt_id,
                        session_id: session_id.to_string(),
                        space_id: space_id.to_string(),
                        user_id: user_id.to_string(),
                        receipt_type: "TURN".to_string(),
                        privacy_band: privacy_band.to_string(),
                        payload,
                        timestamp,
                        previous_hash,
                        current_hash,
                    })
                }
            }
          python: |
            import uuid
            import time
            from typing import Optional

            class ReceiptGenerator:
                """Generates audit receipts with PII redaction and hash chains"""

                def __init__(self, redactor: PIIRedactor, hash_computer: HashChainComputer):
                    self.redactor = redactor
                    self.hash_computer = hash_computer
                    self.last_hash_cache = {}  # session_id -> last_hash

                async def generate_turn_receipt(
                    self,
                    session_id: str,
                    space_id: str,
                    user_id: str,
                    turn_number: int,
                    user_message: str,
                    agent_response: str,
                    privacy_band: str,
                    latency_ms: int,
                    intent: str,
                    trace_id: str,
                ) -> Receipt:
                    """Generate TurnReceipt with PII redaction and hash chain"""
                    start_time = time.time()

                    # 1. Redact PII
                    redacted_user_message = self.redactor.redact(user_message, privacy_band)
                    redacted_agent_response = self.redactor.redact(agent_response, privacy_band)

                    # 2. Get previous hash
                    previous_hash = self._get_previous_hash(session_id)

                    # 3. Generate receipt ID and timestamp
                    receipt_id = str(uuid.uuid4())
                    timestamp = int(time.time() * 1000)

                    # 4. Compute current hash
                    data = f"{redacted_user_message}|{redacted_agent_response}|{intent}"
                    current_hash = self.hash_computer.compute_receipt_hash(
                        receipt_id, timestamp, data, previous_hash
                    )

                    # 5. Build FlatBuffers receipt (placeholder - actual implementation would use flatbuffers)
                    payload = self._build_turn_receipt_fb(
                        receipt_id,
                        session_id,
                        space_id,
                        user_id,
                        turn_number,
                        redacted_user_message,
                        redacted_agent_response,
                        privacy_band,
                        latency_ms,
                        intent,
                        trace_id,
                        timestamp,
                        previous_hash,
                        current_hash,
                    )

                    # 6. Update hash cache
                    self.last_hash_cache[session_id] = current_hash

                    generation_ms = (time.time() - start_time) * 1000

                    # Validate performance budget
                    if generation_ms > 1.0:
                        print(f"WARNING: TurnReceipt generation exceeded 1ms budget ({generation_ms}ms)")

                    return Receipt(
                        receipt_id=receipt_id,
                        session_id=session_id,
                        space_id=space_id,
                        user_id=user_id,
                        receipt_type="TURN",
                        privacy_band=privacy_band,
                        payload=payload,
                        timestamp=timestamp,
                        previous_hash=previous_hash,
                        current_hash=current_hash,
                    )
        performance_requirements:
          - latency: <1ms per receipt generation (P95)
          - throughput: 1000 receipts/second
          - memory: <2MB per generator instance
        error_handling:
          - redaction_failure: Log error, continue with original text
          - hash_computation_failure: Return error, don't generate receipt
          - serialization_failure: Return error, receipt not created

      - name: generate_tool_receipt
        description: Generate ToolReceipt for tool execution
        parameters:
          - name: session_id
            type: string
          - name: space_id
            type: string
          - name: user_id
            type: string
          - name: turn_number
            type: int
          - name: tool_name
            type: string
          - name: tool_arguments
            type: string
          - name: tool_result
            type: string
          - name: success
            type: bool
          - name: error
            type: string
          - name: violation_type
            type: Optional[string]
          - name: privacy_band
            type: string
          - name: latency_ms
            type: int
          - name: trace_id
            type: string
        returns:
          type: Receipt
          description: Generated ToolReceipt
        implementation_notes: Similar to generate_turn_receipt but for tool execution data

      - name: generate_state_receipt
        description: Generate StateReceipt for SessionState changes
        parameters:
          - name: session_id
            type: string
          - name: space_id
            type: string
          - name: user_id
            type: string
          - name: section
            type: string
          - name: delta
            type: string
          - name: previous_state_hash
            type: string
          - name: new_state_hash
            type: string
          - name: trace_id
            type: string
        returns:
          type: Receipt
          description: Generated StateReceipt
        implementation_notes: For SessionState delta tracking

      - name: generate_agent_receipt
        description: Generate AgentReceipt for agent lifecycle events
        parameters:
          - name: session_id
            type: string
          - name: space_id
            type: string
          - name: user_id
            type: string
          - name: agent_id
            type: string
          - name: agent_type
            type: string
          - name: event
            type: string
          - name: from_state
            type: Optional[string]
          - name: to_state
            type: string
          - name: capabilities
            type: List[string]
          - name: trace_id
            type: string
        returns:
          type: Receipt
          description: Generated AgentReceipt
        implementation_notes: For agent hire/fire/transition events

    dependencies:
      - name: PIIRedactor
        description: For redacting PII before receipt creation
      - name: HashChainComputer
        description: For computing SHA-256 hash chains
      - name: FlatBuffers
        description: For efficient binary serialization

testing_requirements:
  - unit_tests:
      - receipt_generation: Creates valid receipts with all fields
      - pii_redaction_integration: PII redacted before serialization
      - hash_chain_continuity: Each receipt links to previous
      - performance_budget: <1ms per receipt generation
  - integration_tests:
      - end_to_end_generation: Generate receipt, serialize, deserialize
      - concurrent_generation: Multiple threads generating receipts safely
      - memory_usage: Monitor memory usage during high-throughput generation
  - security_tests:
      - pii_leakage: Verify no PII in generated receipts
      - hash_integrity: Verify hash chain cannot be forged

observability:
  metrics:
    - name: receipts_created_total
      type: counter
      labels: [receipt_type]
      description: Total receipts created by type
    - name: receipt_creation_latency_ms
      type: histogram
      labels: [receipt_type]
      buckets: [0.1, 0.5, 1.0, 2.0]
      description: Receipt creation latency in milliseconds
    - name: receipt_generation_errors_total
      type: counter
      labels: [error_type]
      description: Total receipt generation errors

compliance:
  - gdpr: Article 30 (record of processing with PII protection)
  - hipaa: § 164.312(b) (audit controls with PHI redaction)
  - soc2: CC7.2 (system monitoring with integrity guarantees)