classes:
  - name: WALConfiguration
    description: K0 WAL mode configuration for optimal receipt writing performance
    research: ADR-0038b (WAL integration), SQLite WAL mode, WAL tuning, crash recovery
    performance_budget: WAL overhead <1ms per write (P95)
    reliability_properties:
      - crash_recovery: WAL enables atomic crash recovery
      - concurrent_access: WAL allows concurrent readers during writes
      - durability_guarantees: Configurable sync modes for performance/durability balance
    methods:
      - name: configure_wal_mode
        description: Configure SQLite database for WAL mode with optimal settings
        parameters:
          - name: db_path
            type: string
            description: Path to SQLite database file
          - name: wal_config
            type: WALConfig
            description: WAL configuration parameters
        returns:
          type: Result<WALConnection, WALError>
          description: Configured database connection or error
        implementation:
          rust: |
            use rusqlite::{Connection, OpenFlags};
            use std::path::Path;
            use std::sync::Arc;

            pub struct WALConfiguration;

            #[derive(Debug, Clone)]
            pub struct WALConfig {
                pub journal_mode: WALJournalMode,
                pub synchronous: WALSynchronousMode,
                pub wal_autocheckpoint: i32,
                pub cache_size: i32,
                pub temp_store: WALTempStore,
                pub mmap_size: i64,
                pub wal_checkpoint_interval_ms: u64,
            }

            #[derive(Debug, Clone)]
            pub enum WALJournalMode {
                WAL,
                DELETE,
                TRUNCATE,
                PERSIST,
                MEMORY,
                OFF,
            }

            #[derive(Debug, Clone)]
            pub enum WALSynchronousMode {
                FULL,    // Full durability, slow
                NORMAL,  // Balance performance/durability
                FAST,    // Fast, less durable
                EXTRA,   // Extra durable
                OFF,     // No sync, fast but risky
            }

            #[derive(Debug, Clone)]
            pub enum WALTempStore {
                DEFAULT,
                FILE,
                MEMORY,
            }

            impl Default for WALConfig {
                fn default() -> Self {
                    Self {
                        journal_mode: WALJournalMode::WAL,
                        synchronous: WALSynchronousMode::NORMAL,
                        wal_autocheckpoint: 1000,  // Pages
                        cache_size: -64000,        // 64MB
                        temp_store: WALTempStore::MEMORY,
                        mmap_size: 268435456,      // 256MB
                        wal_checkpoint_interval_ms: 30000,  // 30 seconds
                    }
                }
            }

            impl WALConfiguration {
                pub fn configure_wal_mode(
                    db_path: &Path,
                    config: WALConfig
                ) -> Result<WALConnection, WALError> {
                    // Open database with WAL-compatible flags
                    let connection = Connection::open_with_flags(
                        db_path,
                        OpenFlags::SQLITE_OPEN_READ_WRITE |
                        OpenFlags::SQLITE_OPEN_CREATE |
                        OpenFlags::SQLITE_OPEN_URI |
                        OpenFlags::SQLITE_OPEN_NO_MUTEX  // External synchronization
                    )?;

                    // Configure WAL mode
                    Self::apply_wal_settings(&connection, &config)?;

                    // Verify WAL is active
                    let journal_mode: String = connection
                        .query_row("PRAGMA journal_mode", [], |row| row.get(0))?;

                    if journal_mode.to_uppercase() != "WAL" {
                        return Err(WALError::WALNotEnabled(journal_mode));
                    }

                    Ok(WALConnection {
                        connection: Arc::new(connection),
                        config,
                    })
                }

                fn apply_wal_settings(
                    connection: &Connection,
                    config: &WALConfig
                ) -> Result<(), WALError> {
                    // Set journal mode to WAL
                    let journal_mode_str = match config.journal_mode {
                        WALJournalMode::WAL => "WAL",
                        WALJournalMode::DELETE => "DELETE",
                        WALJournalMode::TRUNCATE => "TRUNCATE",
                        WALJournalMode::PERSIST => "PERSIST",
                        WALJournalMode::MEMORY => "MEMORY",
                        WALJournalMode::OFF => "OFF",
                    };
                    connection.execute(&format!("PRAGMA journal_mode = {}", journal_mode_str), [])?;

                    // Set synchronous mode
                    let sync_mode_str = match config.synchronous {
                        WALSynchronousMode::FULL => "FULL",
                        WALSynchronousMode::NORMAL => "NORMAL",
                        WALSynchronousMode::FAST => "FAST",
                        WALSynchronousMode::EXTRA => "EXTRA",
                        WALSynchronousMode::OFF => "OFF",
                    };
                    connection.execute(&format!("PRAGMA synchronous = {}", sync_mode_str), [])?;

                    // Set WAL autocheckpoint
                    connection.execute(
                        &format!("PRAGMA wal_autocheckpoint = {}", config.wal_autocheckpoint),
                        []
                    )?;

                    // Set cache size
                    connection.execute(
                        &format!("PRAGMA cache_size = {}", config.cache_size),
                        []
                    )?;

                    // Set temp store
                    let temp_store_str = match config.temp_store {
                        WALTempStore::DEFAULT => "DEFAULT",
                        WALTempStore::FILE => "FILE",
                        WALTempStore::MEMORY => "MEMORY",
                    };
                    connection.execute(&format!("PRAGMA temp_store = {}", temp_store_str), [])?;

                    // Set mmap size for better performance
                    connection.execute(
                        &format!("PRAGMA mmap_size = {}", config.mmap_size),
                        []
                    )?;

                    // Enable foreign keys
                    connection.execute("PRAGMA foreign_keys = ON", [])?;

                    Ok(())
                }

                pub fn get_wal_status(connection: &Connection) -> Result<WALStatus, WALError> {
                    let journal_mode: String = connection.query_row("PRAGMA journal_mode", [], |row| row.get(0))?;
                    let synchronous: String = connection.query_row("PRAGMA synchronous", [], |row| row.get(0))?;
                    let wal_checkpoint: i32 = connection.query_row("PRAGMA wal_autocheckpoint", [], |row| row.get(0))?;
                    let cache_size: i32 = connection.query_row("PRAGMA cache_size", [], |row| row.get(0))?;

                    // Get WAL file statistics
                    let wal_stats = Self::get_wal_file_stats(connection)?;

                    Ok(WALStatus {
                        journal_mode,
                        synchronous,
                        wal_autocheckpoint: wal_checkpoint,
                        cache_size,
                        wal_stats,
                    })
                }

                fn get_wal_file_stats(connection: &Connection) -> Result<WALFileStats, WALError> {
                    // This would query WAL-specific statistics
                    // Implementation depends on SQLite version and available PRAGMAs
                    Ok(WALFileStats {
                        wal_file_size_bytes: 0,  // TODO: Implement
                        wal_frame_count: 0,
                        wal_checkpoint_count: 0,
                    })
                }
            }

            pub struct WALConnection {
                pub connection: Arc<Connection>,
                pub config: WALConfig,
            }

            #[derive(Debug)]
            pub struct WALStatus {
                pub journal_mode: String,
                pub synchronous: String,
                pub wal_autocheckpoint: i32,
                pub cache_size: i32,
                pub wal_stats: WALFileStats,
            }

            #[derive(Debug)]
            pub struct WALFileStats {
                pub wal_file_size_bytes: u64,
                pub wal_frame_count: u64,
                pub wal_checkpoint_count: u64,
            }
          python: |
            import sqlite3
            from typing import Optional, Dict, Any
            from dataclasses import dataclass
            from enum import Enum

            class WALConfiguration:
                """SQLite WAL mode configuration for receipt storage"""

                @dataclass
                class WALConfig:
                    journal_mode: str = "WAL"
                    synchronous: str = "NORMAL"
                    wal_autocheckpoint: int = 1000
                    cache_size: int = -64000  # 64MB
                    temp_store: str = "MEMORY"
                    mmap_size: int = 268435456  # 256MB

                def configure_wal_mode(self, db_path: str, config: Optional[WALConfig] = None) -> 'WALConnection':
                    """Configure SQLite database for WAL mode"""
                    if config is None:
                        config = self.WALConfig()

                    # Connect with WAL-compatible settings
                    connection = sqlite3.connect(
                        db_path,
                        isolation_level=None,  # Autocommit mode
                        check_same_thread=False
                    )

                    # Apply WAL settings
                    self._apply_wal_settings(connection, config)

                    # Verify WAL is active
                    cursor = connection.cursor()
                    cursor.execute("PRAGMA journal_mode")
                    journal_mode = cursor.fetchone()[0]

                    if journal_mode.upper() != "WAL":
                        raise WALError(f"WAL not enabled, got: {journal_mode}")

                    return WALConnection(connection, config)

                def _apply_wal_settings(self, connection: sqlite3.Connection, config: WALConfig):
                    """Apply WAL configuration settings"""
                    cursor = connection.cursor()

                    # Set journal mode to WAL
                    cursor.execute(f"PRAGMA journal_mode = {config.journal_mode}")

                    # Set synchronous mode for performance/durability balance
                    cursor.execute(f"PRAGMA synchronous = {config.synchronous}")

                    # Set WAL autocheckpoint (pages)
                    cursor.execute(f"PRAGMA wal_autocheckpoint = {config.wal_autocheckpoint}")

                    # Set cache size (negative = KB)
                    cursor.execute(f"PRAGMA cache_size = {config.cache_size}")

                    # Set temp store to memory for performance
                    cursor.execute(f"PRAGMA temp_store = {config.temp_store}")

                    # Set mmap size for better performance
                    cursor.execute(f"PRAGMA mmap_size = {config.mmap_size}")

                    # Enable foreign keys
                    cursor.execute("PRAGMA foreign_keys = ON")

                def get_wal_status(self, connection: sqlite3.Connection) -> Dict[str, Any]:
                    """Get current WAL configuration status"""
                    cursor = connection.cursor()

                    status = {}
                    pragmas = [
                        'journal_mode', 'synchronous', 'wal_autocheckpoint',
                        'cache_size', 'temp_store', 'mmap_size', 'foreign_keys'
                    ]

                    for pragma in pragmas:
                        cursor.execute(f"PRAGMA {pragma}")
                        status[pragma] = cursor.fetchone()[0]

                    return status

        performance_requirements:
          - wal_overhead: <1ms per write operation (P95)
          - concurrent_readers: Unlimited readers during writes
          - checkpoint_latency: <100ms periodic checkpoints
          - memory_usage: Configurable cache size limits
        error_handling:
          - wal_not_enabled: Fallback to DELETE mode with warning
          - disk_full: Graceful degradation with error logging
          - corruption: WAL replay for recovery

      - name: optimize_for_receipts
        description: Optimize WAL settings specifically for receipt writing patterns
        parameters:
          - name: expected_write_rate
            type: int
            description: Expected receipts/second write rate
          - name: durability_level
            type: string
            description: Durability vs performance trade-off (HIGH/MEDIUM/LOW)
        returns:
          type: WALConfig
          description: Optimized configuration for receipt workload
        implementation_notes: Dynamic configuration based on workload characteristics

    dependencies:
      - name: rusqlite
        description: SQLite with WAL support
      - name: WALConfig
        description: Configuration parameters for WAL tuning

testing_requirements:
  - unit_tests:
      - wal_configuration: WAL settings applied correctly
      - mode_verification: WAL mode verified after configuration
      - parameter_validation: Invalid parameters rejected
      - status_reporting: WAL status reported accurately
  - integration_tests:
      - concurrent_access: Multiple readers during writes
      - crash_recovery: WAL replay after simulated crash
      - performance_tuning: Settings optimize for receipt patterns
  - performance_tests:
      - write_throughput: WAL overhead doesn't impact throughput
      - read_concurrency: Concurrent reads don't block writes
      - checkpoint_impact: Checkpoints don't cause latency spikes

observability:
  metrics:
    - name: wal_mode_active
      type: gauge
      description: Whether WAL mode is active (1) or not (0)
    - name: wal_checkpoint_duration_ms
      type: histogram
      buckets: [10, 50, 100, 500]
      description: Time taken for WAL checkpoints
    - name: wal_file_size_bytes
      type: gauge
      description: Current size of WAL file
    - name: wal_frames_written_total
      type: counter
      description: Total WAL frames written

alerting_rules:
  - name: WALModeNotActive
    condition: wal_mode_active == 0
    severity: error
    description: WAL mode is not active - performance and durability impacted
    runbook: Check database configuration, restart with WAL enabled

  - name: WALCheckpointSlow
    condition: histogram_quantile(0.95, rate(wal_checkpoint_duration_ms_bucket[5m])) > 500
    severity: warning
    description: WAL checkpoints taking >500ms P95
    runbook: Tune wal_autocheckpoint, check disk I/O performance

compliance:
  - soc2: CC7.2 (system monitoring with durability configuration)
  - gdpr: Article 30 (audit logging with configurable retention/durability)