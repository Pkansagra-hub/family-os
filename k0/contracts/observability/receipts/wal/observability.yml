classes:
  - name: WALObservability
    description: Observability and metrics for WAL-based receipt writing system
    research: ADR-0038b (WAL integration), Prometheus monitoring, OpenTelemetry tracing, WAL performance metrics
    performance_budget: <0.1ms per metric emission (P95)
    reliability_properties:
      - metric_accuracy: All WAL metrics accurately reflect system state
      - tracing_completeness: All WAL operations fully traced
      - alerting_coverage: Critical WAL issues trigger alerts within 1 second
    methods:
      - name: record_wal_operation
        description: Record WAL operation metrics and traces
        parameters:
          - name: operation
            type: string
            description: WAL operation type (write/checkpoint/recovery)
          - name: duration_ms
            type: float
            description: Operation duration in milliseconds
          - name: success
            type: bool
            description: Whether operation succeeded
          - name: trace_id
            type: string
            description: Cognitive trace ID
        returns:
          type: void
        implementation:
          rust: |
            use prometheus::{Counter, Histogram, Gauge, Encoder, TextEncoder};
            use opentelemetry::trace::{Tracer, Span, Status};
            use std::collections::HashMap;

            lazy_static! {
                static ref WAL_OPERATIONS_TOTAL: Counter = register_counter!(
                    "wal_operations_total",
                    "Total WAL operations",
                    &["operation", "result"]
                ).unwrap();

                static ref WAL_OPERATION_LATENCY_MS: Histogram = register_histogram!(
                    "wal_operation_latency_ms",
                    "WAL operation latency in milliseconds",
                    &["operation"],
                    vec![0.1, 1.0, 5.0, 10.0, 50.0, 100.0]
                ).unwrap();

                static ref WAL_FILE_SIZE_BYTES: Gauge = register_gauge!(
                    "wal_file_size_bytes",
                    "Current WAL file size in bytes"
                ).unwrap();

                static ref WAL_CHECKPOINT_PENDING: Gauge = register_gauge!(
                    "wal_checkpoint_pending",
                    "Number of WAL frames awaiting checkpoint"
                ).unwrap();

                static ref RECEIPT_BATCH_WRITES_TOTAL: Counter = register_counter!(
                    "receipt_batch_writes_total",
                    "Total receipt batch writes",
                    &["result"]
                ).unwrap();

                static ref RECEIPT_BATCH_WRITE_LATENCY_MS: Histogram = register_histogram!(
                    "receipt_batch_write_latency_ms",
                    "Receipt batch write latency in milliseconds",
                    vec![1.0, 5.0, 10.0, 25.0, 50.0, 100.0]
                ).unwrap();

                static ref RECEIPT_BATCH_SIZE: Histogram = register_histogram!(
                    "receipt_batch_size",
                    "Size of receipt batches",
                    vec![1.0, 10.0, 50.0, 100.0, 200.0]
                ).unwrap();
            }

            impl WALObservability {
                pub fn record_wal_operation(
                    &self,
                    operation: &str,
                    duration_ms: f64,
                    success: bool,
                    trace_id: &str,
                ) {
                    // Prometheus metrics
                    let result = if success { "success" } else { "error" };
                    WAL_OPERATIONS_TOTAL
                        .with_label_values(&[operation, result])
                        .inc();

                    WAL_OPERATION_LATENCY_MS
                        .with_label_values(&[operation])
                        .observe(duration_ms);

                    // OpenTelemetry tracing
                    let tracer = opentelemetry::global::tracer("wal_operations");
                    let mut span = tracer
                        .span_builder(format!("wal.{}", operation))
                        .with_trace_id(trace_id.parse().unwrap_or_default())
                        .start(&tracer);

                    span.set_attribute("operation", operation.to_string());
                    span.set_attribute("duration_ms", duration_ms);
                    span.set_attribute("success", success);

                    if !success {
                        span.set_status(Status::Error, "WAL operation failed");
                    }

                    // Performance budget validation
                    let budget_ms = match operation {
                        "write" => 5.0,
                        "checkpoint" => 100.0,
                        "recovery" => 30000.0,
                        _ => 10.0,
                    };

                    if duration_ms > budget_ms {
                        span.set_attribute("budget.violation", true);
                        span.add_event(
                            "Performance budget exceeded",
                            vec![
                                KeyValue::new("budget_ms", budget_ms),
                                KeyValue::new("actual_ms", duration_ms),
                            ]
                        );
                    }

                    span.end();
                }

                pub fn record_batch_write(
                    &self,
                    batch_size: usize,
                    write_duration_ms: f64,
                    fsync_duration_ms: f64,
                    success: bool,
                    trace_id: &str,
                ) {
                    // Prometheus metrics
                    let result = if success { "success" } else { "error" };
                    RECEIPT_BATCH_WRITES_TOTAL
                        .with_label_values(&[result])
                        .inc();

                    RECEIPT_BATCH_WRITE_LATENCY_MS.observe(write_duration_ms);
                    RECEIPT_BATCH_SIZE.observe(batch_size as f64);

                    // OpenTelemetry tracing
                    let tracer = opentelemetry::global::tracer("batch_writer");
                    let mut span = tracer
                        .span_builder("batch.write")
                        .with_trace_id(trace_id.parse().unwrap_or_default())
                        .start(&tracer);

                    span.set_attribute("batch_size", batch_size as i64);
                    span.set_attribute("write_duration_ms", write_duration_ms);
                    span.set_attribute("fsync_duration_ms", fsync_duration_ms);
                    span.set_attribute("success", success);

                    if !success {
                        span.set_status(Status::Error, "Batch write failed");
                    }

                    // Performance validation
                    if write_duration_ms > 5.0 {
                        span.set_attribute("write_budget_violation", true);
                    }
                    if fsync_duration_ms > 5.0 {
                        span.set_attribute("fsync_budget_violation", true);
                    }

                    span.end();
                }

                pub fn update_wal_stats(
                    &self,
                    file_size_bytes: u64,
                    checkpoint_pending: u64,
                ) {
                    WAL_FILE_SIZE_BYTES.set(file_size_bytes as f64);
                    WAL_CHECKPOINT_PENDING.set(checkpoint_pending as f64);
                }

                pub fn record_backpressure_event(&self, queue_depth: usize, max_capacity: usize) {
                    // Additional backpressure metrics specific to WAL
                    // (complements the general backpressure metrics)
                }

                pub fn get_metrics(&self) -> String {
                    let encoder = TextEncoder::new();
                    let metric_families = prometheus::gather();
                    let mut buffer = Vec::new();
                    encoder.encode(&metric_families, &mut buffer).unwrap();
                    String::from_utf8(buffer).unwrap()
                }
            }
          python: |
            from prometheus_client import Counter, Histogram, Gauge, generate_latest
            from opentelemetry import trace
            from opentelemetry.trace import Status, StatusCode
            import time

            class WALObservability:
                """Observability for WAL-based receipt writing"""

                def __init__(self):
                    self.wal_operations_total = Counter(
                        'wal_operations_total',
                        'Total WAL operations',
                        ['operation', 'result']
                    )

                    self.wal_operation_latency_ms = Histogram(
                        'wal_operation_latency_ms',
                        'WAL operation latency in milliseconds',
                        ['operation'],
                        buckets=[0.1, 1.0, 5.0, 10.0, 50.0, 100.0]
                    )

                    self.wal_file_size_bytes = Gauge(
                        'wal_file_size_bytes',
                        'Current WAL file size in bytes'
                    )

                    self.wal_checkpoint_pending = Gauge(
                        'wal_checkpoint_pending',
                        'Number of WAL frames awaiting checkpoint'
                    )

                    self.receipt_batch_writes_total = Counter(
                        'receipt_batch_writes_total',
                        'Total receipt batch writes',
                        ['result']
                    )

                    self.receipt_batch_write_latency_ms = Histogram(
                        'receipt_batch_write_latency_ms',
                        'Receipt batch write latency in milliseconds',
                        buckets=[1.0, 5.0, 10.0, 25.0, 50.0, 100.0]
                    )

                    self.receipt_batch_size = Histogram(
                        'receipt_batch_size',
                        'Size of receipt batches',
                        buckets=[1.0, 10.0, 50.0, 100.0, 200.0]
                    )

                    self.tracer = trace.get_tracer(__name__)

                def record_wal_operation(
                    self,
                    operation: str,
                    duration_ms: float,
                    success: bool,
                    trace_id: str,
                ):
                    """Record WAL operation metrics and traces"""
                    # Prometheus metrics
                    result = "success" if success else "error"
                    self.wal_operations_total \
                        .labels(operation=operation, result=result) \
                        .inc()

                    self.wal_operation_latency_ms \
                        .labels(operation=operation) \
                        .observe(duration_ms)

                    # OpenTelemetry tracing
                    with self.tracer.start_as_current_span(
                        f"wal.{operation}",
                        trace_id=trace_id,
                    ) as span:
                        span.set_attribute("operation", operation)
                        span.set_attribute("duration_ms", duration_ms)
                        span.set_attribute("success", success)

                        if not success:
                            span.set_status(Status(StatusCode.ERROR, "WAL operation failed"))

                        # Performance budget validation
                        budget_ms = {
                            "write": 5.0,
                            "checkpoint": 100.0,
                            "recovery": 30000.0,
                        }.get(operation, 10.0)

                        if duration_ms > budget_ms:
                            span.set_attribute("budget.violation", True)
                            span.add_event(
                                "Performance budget exceeded",
                                {"budget_ms": budget_ms, "actual_ms": duration_ms}
                            )

                def record_batch_write(
                    self,
                    batch_size: int,
                    write_duration_ms: float,
                    fsync_duration_ms: float,
                    success: bool,
                    trace_id: str,
                ):
                    """Record batch write metrics and traces"""
                    # Prometheus metrics
                    result = "success" if success else "error"
                    self.receipt_batch_writes_total \
                        .labels(result=result) \
                        .inc()

                    self.receipt_batch_write_latency_ms.observe(write_duration_ms)
                    self.receipt_batch_size.observe(batch_size)

                    # OpenTelemetry tracing
                    with self.tracer.start_as_current_span(
                        "batch.write",
                        trace_id=trace_id,
                    ) as span:
                        span.set_attribute("batch_size", batch_size)
                        span.set_attribute("write_duration_ms", write_duration_ms)
                        span.set_attribute("fsync_duration_ms", fsync_duration_ms)
                        span.set_attribute("success", success)

                        if not success:
                            span.set_status(Status(StatusCode.ERROR, "Batch write failed"))

                        # Performance validation
                        if write_duration_ms > 5.0:
                            span.set_attribute("write_budget_violation", True)
                        if fsync_duration_ms > 5.0:
                            span.set_attribute("fsync_budget_violation", True)

                def update_wal_stats(self, file_size_bytes: int, checkpoint_pending: int):
                    """Update WAL file statistics"""
                    self.wal_file_size_bytes.set(file_size_bytes)
                    self.wal_checkpoint_pending.set(checkpoint_pending)

                def record_backpressure_event(self, queue_depth: int, max_capacity: int):
                    """Record WAL-specific backpressure metrics"""
                    # Could add WAL-specific backpressure tracking
                    pass

                def get_metrics(self) -> str:
                    """Get Prometheus metrics in text format"""
                    return generate_latest().decode('utf-8')

    dependencies:
      - name: prometheus
        description: Metrics collection and exposition
      - name: opentelemetry
        description: Distributed tracing and observability
      - name: structlog
        description: Structured logging for WAL events

testing_requirements:
  - unit_tests:
      - metric_accuracy: WAL metrics increment correctly for each operation
      - tracing_completeness: All WAL operations properly traced
      - performance_budget: <0.1ms per metric emission
  - integration_tests:
      - prometheus_scraping: WAL metrics exposed correctly at /metrics endpoint
      - tracing_collection: WAL traces collected by Jaeger/Zipkin
      - alerting_integration: Critical WAL errors trigger alerts
  - security_tests:
      - metric_leakage: No sensitive data in WAL metric labels
      - trace_privacy: PII redacted in WAL trace attributes

alerting_rules:
  - name: WALOperationLatencyHigh
    condition: histogram_quantile(0.95, rate(wal_operation_latency_ms_bucket{operation="write"}[5m])) > 5
    severity: warning
    description: WAL write latency exceeds 5ms P95 budget
    runbook: Check disk I/O performance, consider WAL tuning

  - name: WALCheckpointPendingHigh
    condition: wal_checkpoint_pending > 10000
    severity: warning
    description: WAL checkpoint pending >10K frames
    runbook: Check checkpoint frequency, consider manual checkpoint

  - name: WALFileSizeHigh
    condition: wal_file_size_bytes > 1073741824  # 1GB
    severity: warning
    description: WAL file size >1GB
    runbook: Check checkpoint configuration, consider increasing wal_autocheckpoint

  - name: ReceiptBatchWriteErrorsHigh
    condition: rate(receipt_batch_writes_total{result="error"}[5m]) > 0.01
    severity: error
    description: Receipt batch write error rate >1%
    runbook: Check database connectivity, disk space, WAL corruption

compliance:
  - soc2: CC7.2 (system monitoring with WAL durability guarantees)
  - gdpr: Article 30 (audit logging with WAL integrity monitoring)
