classes:
  - name: ReceiptWriter
    description: Async receipt writer with batch optimization and WAL integration
    research: ADR-0038b (async writes), SQLite WAL mode, batch optimization, backpressure handling
    performance_budget: <5ms async writes (P95), 10× throughput improvement with batching
    reliability_properties:
      - crash_recovery: WAL replay reconstructs state after crashes
      - batch_atomicity: All receipts in batch succeed or fail together
      - backpressure_safety: Queue full blocks new receipts, prevents OOM
    methods:
      - name: write_receipt_async
        description: Queue receipt for async batch writing
        parameters:
          - name: receipt
            type: Receipt
            description: Receipt to write asynchronously
        returns:
          type: Result[void, WriteError]
          description: Success or error (backpressure, queue full, etc.)
        implementation:
          rust: |
            use tokio::sync::mpsc;
            use std::sync::Arc;
            use tokio::sync::Mutex;

            pub struct ReceiptWriter {
                sender: mpsc::Sender<Receipt>,
                batch_writer: Arc<BatchWriter>,
                metrics: Arc<ReceiptMetrics>,
            }

            impl ReceiptWriter {
                pub fn new(
                    db_pool: Arc<rusqlite::Connection>,
                    metrics: Arc<ReceiptMetrics>,
                ) -> Self {
                    let (sender, receiver) = mpsc::channel(10_000);  // 10K capacity queue

                    let batch_writer = Arc::new(BatchWriter::new(db_pool.clone(), metrics.clone()));
                    let batch_writer_clone = batch_writer.clone();

                    // Start background batch writer task
                    tokio::spawn(async move {
                        batch_writer_clone.run_batch_writer(receiver).await;
                    });

                    Self {
                        sender,
                        batch_writer,
                        metrics,
                    }
                }

                pub async fn write_receipt_async(
                    &self,
                    receipt: Receipt,
                ) -> Result<(), WriteError> {
                    let start = std::time::Instant::now();

                    // Try to send receipt to queue (with timeout to prevent blocking)
                    match tokio::time::timeout(
                        std::time::Duration::from_millis(100),  // 100ms timeout
                        self.sender.send(receipt)
                    ).await {
                        Ok(Ok(())) => {
                            let queue_time_ms = start.elapsed().as_millis() as f64;
                            self.metrics.record_queue_time(queue_time_ms);

                            // Check if we're approaching queue capacity
                            if self.sender.capacity() < 1000 {
                                self.metrics.record_backpressure_event();
                            }

                            Ok(())
                        }
                        Ok(Err(_)) => {
                            // Channel closed - this is a serious error
                            self.metrics.record_channel_closed_error();
                            Err(WriteError::ChannelClosed)
                        }
                        Err(_) => {
                            // Timeout - queue is full, backpressure
                            self.metrics.record_backpressure_timeout();
                            Err(WriteError::QueueFull)
                        }
                    }
                }

                pub async fn flush(&self) -> Result<(), WriteError> {
                    // Signal batch writer to flush all pending receipts
                    self.batch_writer.flush().await
                }

                pub fn queue_depth(&self) -> usize {
                    10_000 - self.sender.capacity()  // Estimate current queue depth
                }
            }
          python: |
            import asyncio
            from typing import Optional
            import time
            from asyncio import Queue

            class ReceiptWriter:
                """Async receipt writer with batch optimization"""

                def __init__(self, db_connection, metrics: ReceiptMetrics, max_queue_size: int = 10000):
                    self.db = db_connection
                    self.metrics = metrics
                    self.queue = Queue(maxsize=max_queue_size)
                    self.batch_writer = BatchWriter(self.db, self.metrics)

                    # Start background batch writer
                    self._writer_task = asyncio.create_task(self._run_batch_writer())

                async def write_receipt_async(self, receipt: Receipt) -> None:
                    """Queue receipt for async batch writing"""
                    start_time = time.time()

                    try:
                        # Try to put receipt in queue with timeout
                        await asyncio.wait_for(
                            self.queue.put(receipt),
                            timeout=0.1  # 100ms timeout
                        )

                        queue_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_queue_time(queue_time_ms)

                        # Check backpressure
                        if self.queue.qsize() > 9000:  # 90% capacity
                            self.metrics.record_backpressure_event()

                    except asyncio.TimeoutError:
                        self.metrics.record_backpressure_timeout()
                        raise QueueFullError("Receipt queue is full - backpressure")

                async def _run_batch_writer(self):
                    """Background task that processes receipt batches"""
                    while True:
                        try:
                            await self.batch_writer.process_batch(self.queue)
                        except Exception as e:
                            self.metrics.record_batch_writer_error(str(e))
                            await asyncio.sleep(1)  # Backoff on error

                async def flush(self):
                    """Flush all pending receipts"""
                    await self.batch_writer.flush()

                def queue_depth(self) -> int:
                    """Get current queue depth"""
                    return self.queue.qsize()

        performance_requirements:
          - queue_latency: <100ms to enqueue receipt
          - batch_throughput: 1000 receipts/second sustained
          - memory_usage: <50MB for 10K receipt queue
          - backpressure_threshold: Block when queue >90% full
        error_handling:
          - queue_full: Return error, don't block indefinitely
          - channel_closed: Log critical error, attempt recovery
          - batch_write_failure: Retry batch, exponential backoff

      - name: get_queue_stats
        description: Get current queue statistics for monitoring
        returns:
          type: QueueStats
          description: Current queue depth, capacity, throughput metrics
        implementation_notes: Used by observability system for monitoring

    dependencies:
      - name: tokio::sync::mpsc
        description: Async channel for receipt queuing
      - name: rusqlite
        description: SQLite connection with WAL support
      - name: BatchWriter
        description: Background batch writing logic

testing_requirements:
  - unit_tests:
      - async_queuing: Receipts queued without blocking main thread
      - backpressure_handling: Queue full returns error, doesn't deadlock
      - batch_processing: Batches written atomically
      - crash_recovery: WAL replay reconstructs pending receipts
  - integration_tests:
      - high_throughput: 1000 receipts/sec sustained for 5 minutes
      - concurrent_writers: Multiple threads queuing receipts safely
      - memory_pressure: Monitor memory usage under load
  - performance_tests:
      - latency_distribution: P95 <5ms async write latency
      - throughput_scaling: Linear scaling with batch size
      - resource_usage: CPU/memory during peak load

observability:
  metrics:
    - name: receipt_queue_depth
      type: gauge
      description: Current number of receipts in async queue
    - name: receipt_queue_time_ms
      type: histogram
      buckets: [1, 5, 10, 50, 100]
      description: Time to enqueue receipt in milliseconds
    - name: receipt_backpressure_events_total
      type: counter
      description: Total backpressure events (queue near capacity)
    - name: receipt_batch_write_latency_ms
      type: histogram
      buckets: [1, 5, 10, 25, 50]
      description: Batch write latency in milliseconds

alerting_rules:
  - name: ReceiptQueueDepthHigh
    condition: receipt_queue_depth > 9000
    severity: warning
    description: Receipt queue >90% capacity - risk of backpressure
    runbook: Check batch writer performance, consider scaling

  - name: ReceiptBackpressureHigh
    condition: rate(receipt_backpressure_events_total[5m]) > 10
    severity: error
    description: Frequent backpressure events indicate performance issue
    runbook: Investigate batch writer bottlenecks, check database performance

compliance:
  - soc2: CC7.2 (system monitoring with performance guarantees)
  - gdpr: Article 30 (audit logging with durability guarantees)