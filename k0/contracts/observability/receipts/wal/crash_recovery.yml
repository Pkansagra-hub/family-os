classes:
  - name: CrashRecovery
    description: WAL replay implementation for reconstructing receipt state after crashes
    research: ADR-0038b (crash recovery), WAL replay patterns, atomic recovery, state reconstruction
    performance_budget: <30 seconds full recovery (P95), <5 seconds incremental recovery
    reliability_properties:
      - atomic_recovery: All-or-nothing recovery of receipt state
      - hash_chain_integrity: Hash chains verified during recovery
      - incremental_recovery: Only replay missing receipts after crash
    methods:
      - name: recover_from_crash
        description: Recover receipt state from WAL after system crash
        parameters:
          - name: db_connection
            type: WALConnection
            description: Database connection with WAL enabled
          - name: recovery_config
            type: RecoveryConfig
            description: Recovery configuration parameters
        returns:
          type: Result<RecoveryResult, RecoveryError>
          description: Recovery result with statistics or error
        implementation:
          rust: |
            use rusqlite::Connection;
            use std::collections::HashMap;
            use std::sync::Arc;
            use tokio::sync::Mutex;

            pub struct CrashRecovery {
                metrics: Arc<RecoveryMetrics>,
            }

            #[derive(Debug, Clone)]
            pub struct RecoveryConfig {
                pub max_recovery_time_ms: u64,
                pub validate_hash_chains: bool,
                pub rebuild_indexes: bool,
                pub checkpoint_after_recovery: bool,
                pub recovery_batch_size: usize,
            }

            impl Default for RecoveryConfig {
                fn default() -> Self {
                    Self {
                        max_recovery_time_ms: 30000,  // 30 seconds
                        validate_hash_chains: true,
                        rebuild_indexes: true,
                        checkpoint_after_recovery: true,
                        recovery_batch_size: 1000,
                    }
                }
            }

            impl CrashRecovery {
                pub fn new(metrics: Arc<RecoveryMetrics>) -> Self {
                    Self { metrics }
                }

                pub async fn recover_from_crash(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                    config: &RecoveryConfig,
                ) -> Result<RecoveryResult, RecoveryError> {
                    let start = std::time::Instant::now();
                    self.metrics.record_recovery_started();

                    // Step 1: Check if WAL recovery is needed
                    let needs_recovery = self.check_wal_recovery_needed(connection).await?;

                    if !needs_recovery {
                        self.metrics.record_recovery_skipped();
                        return Ok(RecoveryResult {
                            recovered_receipts: 0,
                            validated_chains: 0,
                            rebuilt_indexes: false,
                            duration_ms: start.elapsed().as_millis() as u64,
                            recovery_type: RecoveryType::NoRecoveryNeeded,
                        });
                    }

                    // Step 2: Perform WAL replay
                    let replay_result = self.perform_wal_replay(connection, config).await?;

                    // Step 3: Validate hash chains if enabled
                    let validation_result = if config.validate_hash_chains {
                        Some(self.validate_hash_chains(connection, config).await?)
                    } else {
                        None
                    };

                    // Step 4: Rebuild indexes if enabled
                    let indexes_rebuilt = if config.rebuild_indexes {
                        self.rebuild_indexes(connection).await?;
                        true
                    } else {
                        false
                    };

                    // Step 5: Checkpoint WAL if enabled
                    if config.checkpoint_after_recovery {
                        self.perform_wal_checkpoint(connection).await?;
                    }

                    let duration_ms = start.elapsed().as_millis() as u64;

                    // Record metrics
                    self.metrics.record_recovery_completed(
                        replay_result.recovered_receipts,
                        validation_result.as_ref().map(|v| v.validated_chains).unwrap_or(0),
                        duration_ms
                    );

                    Ok(RecoveryResult {
                        recovered_receipts: replay_result.recovered_receipts,
                        validated_chains: validation_result.map(|v| v.validated_chains).unwrap_or(0),
                        rebuilt_indexes: indexes_rebuilt,
                        duration_ms,
                        recovery_type: RecoveryType::FullRecovery,
                    })
                }

                async fn check_wal_recovery_needed(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                ) -> Result<bool, RecoveryError> {
                    let conn = connection.lock().await;

                    // Check if there are uncommitted transactions in WAL
                    let wal_size: i64 = conn.query_row(
                        "PRAGMA wal_checkpoint(TRUNCATE)",
                        [],
                        |row| row.get(0)
                    ).unwrap_or(0);

                    // If WAL has content, recovery may be needed
                    Ok(wal_size > 0)
                }

                async fn perform_wal_replay(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                    config: &RecoveryConfig,
                ) -> Result<ReplayResult, RecoveryError> {
                    let conn = connection.lock().await;

                    // SQLite automatically replays WAL on connection
                    // We just need to verify the receipts are consistent

                    let mut stmt = conn.prepare(
                        "SELECT COUNT(*) FROM receipts WHERE batch_id IS NOT NULL"
                    )?;

                    let recovered_count: i64 = stmt.query_row([], |row| row.get(0))?;

                    Ok(ReplayResult {
                        recovered_receipts: recovered_count as usize,
                    })
                }

                async fn validate_hash_chains(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                    config: &RecoveryConfig,
                ) -> Result<ValidationResult, RecoveryError> {
                    let conn = connection.lock().await;

                    // Validate hash chain continuity per session
                    let mut stmt = conn.prepare("
                        SELECT session_id,
                               receipt_id,
                               previous_hash,
                               current_hash,
                               ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY timestamp) as seq
                        FROM receipts
                        ORDER BY session_id, timestamp
                    ")?;

                    let mut rows = stmt.query([])?;
                    let mut session_chains: HashMap<String, Vec<(String, Option<String>, String)>> = HashMap::new();

                    while let Some(row) = rows.next()? {
                        let session_id: String = row.get(0)?;
                        let receipt_id: String = row.get(1)?;
                        let previous_hash: Option<String> = row.get(2)?;
                        let current_hash: String = row.get(3)?;

                        session_chains.entry(session_id)
                            .or_insert_with(Vec::new)
                            .push((receipt_id, previous_hash, current_hash));
                    }

                    // Validate each session's chain
                    let mut validated_chains = 0;
                    let mut broken_chains = 0;

                    for (session_id, chain) in session_chains {
                        if self.validate_session_chain(&chain)? {
                            validated_chains += 1;
                        } else {
                            broken_chains += 1;
                            eprintln!("Broken hash chain in session: {}", session_id);
                        }
                    }

                    if broken_chains > 0 {
                        return Err(RecoveryError::HashChainValidationFailed(broken_chains));
                    }

                    Ok(ValidationResult {
                        validated_chains,
                        broken_chains,
                    })
                }

                fn validate_session_chain(
                    &self,
                    chain: &[(String, Option<String>, String)]
                ) -> Result<bool, RecoveryError> {
                    for i in 0..chain.len() {
                        let (_, previous_hash, current_hash) = &chain[i];

                        if i == 0 {
                            // First receipt should have no previous hash
                            if previous_hash.is_some() {
                                return Ok(false);
                            }
                        } else {
                            // Subsequent receipts should link to previous
                            let (_, _, prev_current_hash) = &chain[i-1];
                            if previous_hash.as_ref() != Some(prev_current_hash) {
                                return Ok(false);
                            }
                        }
                    }
                    Ok(true)
                }

                async fn rebuild_indexes(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                ) -> Result<(), RecoveryError> {
                    let conn = connection.lock().await;

                    // Rebuild all indexes (SQLite optimizes this)
                    conn.execute("REINDEX", [])?;

                    Ok(())
                }

                async fn perform_wal_checkpoint(
                    &self,
                    connection: &Arc<Mutex<Connection>>,
                ) -> Result<(), RecoveryError> {
                    let conn = connection.lock().await;

                    // Perform full WAL checkpoint
                    conn.execute("PRAGMA wal_checkpoint(TRUNCATE)", [])?;

                    Ok(())
                }
            }

            #[derive(Debug)]
            pub struct RecoveryResult {
                pub recovered_receipts: usize,
                pub validated_chains: usize,
                pub rebuilt_indexes: bool,
                pub duration_ms: u64,
                pub recovery_type: RecoveryType,
            }

            #[derive(Debug)]
            pub enum RecoveryType {
                NoRecoveryNeeded,
                IncrementalRecovery,
                FullRecovery,
            }

            #[derive(Debug)]
            struct ReplayResult {
                recovered_receipts: usize,
            }

            #[derive(Debug)]
            struct ValidationResult {
                validated_chains: usize,
                broken_chains: usize,
            }
          python: |
            import sqlite3
            import time
            from typing import Optional, Dict, List, Tuple
            import hashlib

            class CrashRecovery:
                """Handles WAL-based crash recovery for receipts"""

                def __init__(self, metrics: RecoveryMetrics):
                    self.metrics = metrics

                async def recover_from_crash(
                    self,
                    connection: sqlite3.Connection,
                    config: Optional['RecoveryConfig'] = None
                ) -> 'RecoveryResult':
                    """Recover receipt state from WAL after crash"""
                    if config is None:
                        config = RecoveryConfig()

                    start_time = time.time()
                    self.metrics.record_recovery_started()

                    # Check if recovery needed
                    needs_recovery = self._check_wal_recovery_needed(connection)

                    if not needs_recovery:
                        self.metrics.record_recovery_skipped()
                        return RecoveryResult(
                            recovered_receipts=0,
                            validated_chains=0,
                            rebuilt_indexes=False,
                            duration_ms=0,
                            recovery_type=RecoveryType.NO_RECOVERY_NEEDED
                        )

                    # Perform WAL replay (SQLite does this automatically on connection)
                    replay_result = self._perform_wal_replay(connection, config)

                    # Validate hash chains
                    validation_result = None
                    if config.validate_hash_chains:
                        validation_result = self._validate_hash_chains(connection, config)

                    # Rebuild indexes
                    indexes_rebuilt = False
                    if config.rebuild_indexes:
                        self._rebuild_indexes(connection)
                        indexes_rebuilt = True

                    # Checkpoint WAL
                    if config.checkpoint_after_recovery:
                        self._perform_wal_checkpoint(connection)

                    duration_ms = int((time.time() - start_time) * 1000)

                    validated_chains = validation_result.validated_chains if validation_result else 0

                    self.metrics.record_recovery_completed(
                        replay_result.recovered_receipts,
                        validated_chains,
                        duration_ms
                    )

                    return RecoveryResult(
                        recovered_receipts=replay_result.recovered_receipts,
                        validated_chains=validated_chains,
                        rebuilt_indexes=indexes_rebuilt,
                        duration_ms=duration_ms,
                        recovery_type=RecoveryType.FULL_RECOVERY
                    )

                def _check_wal_recovery_needed(self, connection: sqlite3.Connection) -> bool:
                    """Check if WAL recovery is needed"""
                    cursor = connection.cursor()
                    cursor.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                    result = cursor.fetchone()
                    return result and result[0] > 0

                def _perform_wal_replay(self, connection: sqlite3.Connection, config: 'RecoveryConfig') -> 'ReplayResult':
                    """Perform WAL replay (mostly automatic in SQLite)"""
                    cursor = connection.cursor()

                    # Count recovered receipts
                    cursor.execute("SELECT COUNT(*) FROM receipts WHERE batch_id IS NOT NULL")
                    recovered_count = cursor.fetchone()[0]

                    return ReplayResult(recovered_receipts=recovered_count)

                def _validate_hash_chains(self, connection: sqlite3.Connection, config: 'RecoveryConfig') -> 'ValidationResult':
                    """Validate hash chain integrity"""
                    cursor = connection.cursor()

                    # Get all receipts ordered by session and timestamp
                    cursor.execute("""
                        SELECT session_id, receipt_id, previous_hash, current_hash
                        FROM receipts
                        ORDER BY session_id, timestamp
                    """)

                    rows = cursor.fetchall()
                    session_chains = {}

                    # Group by session
                    for row in rows:
                        session_id, receipt_id, previous_hash, current_hash = row
                        if session_id not in session_chains:
                            session_chains[session_id] = []
                        session_chains[session_id].append((receipt_id, previous_hash, current_hash))

                    # Validate each session's chain
                    validated_chains = 0
                    broken_chains = 0

                    for session_id, chain in session_chains.items():
                        if self._validate_session_chain(chain):
                            validated_chains += 1
                        else:
                            broken_chains += 1
                            print(f"Broken hash chain in session: {session_id}")

                    if broken_chains > 0:
                        raise RecoveryError(f"Hash chain validation failed: {broken_chains} broken chains")

                    return ValidationResult(validated_chains=validated_chains, broken_chains=broken_chains)

                def _validate_session_chain(self, chain: List[Tuple]) -> bool:
                    """Validate a single session's hash chain"""
                    for i, (receipt_id, previous_hash, current_hash) in enumerate(chain):
                        if i == 0:
                            # First receipt should have no previous hash
                            if previous_hash is not None:
                                return False
                        else:
                            # Subsequent receipts should link to previous
                            _, _, prev_current_hash = chain[i-1]
                            if previous_hash != prev_current_hash:
                                return False
                    return True

                def _rebuild_indexes(self, connection: sqlite3.Connection):
                    """Rebuild all database indexes"""
                    cursor = connection.cursor()
                    cursor.execute("REINDEX")

                def _perform_wal_checkpoint(self, connection: sqlite3.Connection):
                    """Perform WAL checkpoint"""
                    cursor = connection.cursor()
                    cursor.execute("PRAGMA wal_checkpoint(TRUNCATE)")

            class RecoveryConfig:
                """Configuration for crash recovery"""
                def __init__(
                    self,
                    max_recovery_time_ms: int = 30000,
                    validate_hash_chains: bool = True,
                    rebuild_indexes: bool = True,
                    checkpoint_after_recovery: bool = True,
                    recovery_batch_size: int = 1000
                ):
                    self.max_recovery_time_ms = max_recovery_time_ms
                    self.validate_hash_chains = validate_hash_chains
                    self.rebuild_indexes = rebuild_indexes
                    self.checkpoint_after_recovery = checkpoint_after_recovery
                    self.recovery_batch_size = recovery_batch_size

            class RecoveryResult:
                """Result of crash recovery operation"""
                def __init__(
                    self,
                    recovered_receipts: int,
                    validated_chains: int,
                    rebuilt_indexes: bool,
                    duration_ms: int,
                    recovery_type: str
                ):
                    self.recovered_receipts = recovered_receipts
                    self.validated_chains = validated_chains
                    self.rebuilt_indexes = rebuilt_indexes
                    self.duration_ms = duration_ms
                    self.recovery_type = recovery_type

            class RecoveryType:
                NO_RECOVERY_NEEDED = "NO_RECOVERY_NEEDED"
                INCREMENTAL_RECOVERY = "INCREMENTAL_RECOVERY"
                FULL_RECOVERY = "FULL_RECOVERY"

            class ReplayResult:
                def __init__(self, recovered_receipts: int):
                    self.recovered_receipts = recovered_receipts

            class ValidationResult:
                def __init__(self, validated_chains: int, broken_chains: int):
                    self.validated_chains = validated_chains
                    self.broken_chains = broken_chains

            class RecoveryError(Exception):
                pass

        performance_requirements:
          - recovery_time: <30 seconds full recovery (P95)
          - incremental_recovery: <5 seconds for recent crashes
          - memory_usage: O(number of receipts) during validation
          - cpu_usage: Minimal CPU for hash chain validation
        error_handling:
          - hash_chain_broken: Log error, continue with partial recovery
          - wal_corruption: Fallback to last good checkpoint
          - timeout_exceeded: Partial recovery with warning

      - name: validate_recovery_integrity
        description: Validate that recovery maintained data integrity
        returns:
          type: Result<IntegrityCheck, IntegrityError>
          description: Integrity check results or validation error
        implementation_notes: Post-recovery integrity verification

    dependencies:
      - name: rusqlite
        description: SQLite connection for WAL operations
      - name: RecoveryMetrics
        description: Metrics collection for recovery operations

testing_requirements:
  - unit_tests:
      - wal_replay: WAL replay reconstructs correct state
      - hash_validation: Hash chains validated correctly
      - index_rebuild: Indexes rebuilt without data loss
      - checkpoint_execution: WAL checkpoints performed correctly
  - integration_tests:
      - crash_simulation: Recovery works after simulated crash
      - incremental_recovery: Only replays missing data
      - concurrent_recovery: Recovery works during system startup
  - performance_tests:
      - recovery_speed: Recovery completes within time budget
      - memory_bounds: Memory usage stays within limits
      - validation_overhead: Hash validation doesn't slow recovery excessively

observability:
  metrics:
    - name: recovery_operations_total
      type: counter
      labels: [recovery_type]
      description: Total recovery operations by type
    - name: recovery_duration_ms
      type: histogram
      buckets: [1000, 5000, 10000, 30000, 60000]
      description: Time taken for recovery operations
    - name: hash_chains_validated_total
      type: counter
      description: Total hash chains validated during recovery
    - name: recovery_errors_total
      type: counter
      labels: [error_type]
      description: Total recovery errors by type

alerting_rules:
  - name: RecoveryDurationHigh
    condition: histogram_quantile(0.95, rate(recovery_duration_ms_bucket[5m])) > 30000
    severity: warning
    description: Recovery taking longer than 30 seconds P95
    runbook: Check database size, consider incremental recovery

  - name: RecoveryErrorsHigh
    condition: rate(recovery_errors_total[5m]) > 0
    severity: error
    description: Recovery operations failing
    runbook: Check database corruption, WAL file integrity

  - name: HashChainValidationFailed
    condition: recovery_errors_total{error_type="hash_chain_validation"} > 0
    severity: error
    description: Hash chain integrity compromised
    runbook: Investigate data corruption, consider backup restoration

compliance:
  - soc2: CC7.2 (system monitoring with crash recovery)
  - gdpr: Article 30 (audit logging with integrity guarantees)
