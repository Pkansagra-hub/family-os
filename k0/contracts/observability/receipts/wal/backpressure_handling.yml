classes:
  - name: BackpressureHandler
    description: Backpressure handling for receipt queue when capacity exceeded
    research: ADR-0038b (backpressure handling), flow control patterns, queue management
    performance_budget: <100ms backpressure response time (P95)
    reliability_properties:
      - graceful_degradation: System continues with reduced throughput
      - memory_bounds: Prevents unbounded memory growth
      - observability: Backpressure events fully monitored
    methods:
      - name: handle_queue_full
        description: Handle receipt queue full condition with backpressure
        parameters:
          - name: queue
            type: ReceiptQueue
            description: The full receipt queue
          - name: receipt
            type: Receipt
            description: Receipt that triggered backpressure
          - name: backpressure_config
            type: BackpressureConfig
            description: Configuration for backpressure behavior
        returns:
          type: Result<BackpressureAction, BackpressureError>
          description: Action to take (BLOCK/DROP/DELAY) or error
        implementation:
          rust: |
            use tokio::time::{Duration, sleep};
            use std::sync::Arc;
            use tokio::sync::Mutex;

            pub struct BackpressureHandler {
                metrics: Arc<BackpressureMetrics>,
                circuit_breaker: Arc<CircuitBreaker>,
            }

            #[derive(Debug, Clone)]
            pub struct BackpressureConfig {
                pub max_block_time_ms: u64,
                pub backoff_strategy: BackoffStrategy,
                pub circuit_breaker_threshold: u32,
                pub circuit_breaker_timeout_ms: u64,
                pub drop_policy: DropPolicy,
            }

            #[derive(Debug, Clone)]
            pub enum BackoffStrategy {
                Fixed(u64),           // Fixed delay in ms
                Exponential { base: u64, max: u64 },  // Exponential backoff
                Linear { increment: u64, max: u64 },  // Linear backoff
            }

            #[derive(Debug, Clone)]
            pub enum DropPolicy {
                Never,                // Never drop, always block
                Oldest,              // Drop oldest receipts first
                Newest,              // Drop newest receipts first
                Priority { threshold: u32 }, // Drop based on priority
            }

            #[derive(Debug)]
            pub enum BackpressureAction {
                Block(Duration),     // Block for duration
                Drop,                // Drop the receipt
                CircuitOpen,         // Circuit breaker open
            }

            impl BackpressureHandler {
                pub fn new(metrics: Arc<BackpressureMetrics>) -> Self {
                    Self {
                        metrics,
                        circuit_breaker: Arc::new(CircuitBreaker::new()),
                    }
                }

                pub async fn handle_queue_full(
                    &self,
                    queue: &Arc<Mutex<ReceiptQueue>>,
                    receipt: &Receipt,
                    config: &BackpressureConfig,
                ) -> Result<BackpressureAction, BackpressureError> {
                    let start = std::time::Instant::now();

                    // Check circuit breaker
                    if self.circuit_breaker.is_open() {
                        self.metrics.record_circuit_breaker_open();
                        return Ok(BackpressureAction::CircuitOpen);
                    }

                    // Record backpressure event
                    self.metrics.record_backpressure_event(receipt.receipt_type.clone());

                    // Try to make space based on drop policy
                    let space_made = self.attempt_drop_policy(queue, config).await?;

                    if space_made {
                        // Space made, can proceed
                        let handle_time_ms = start.elapsed().as_millis() as f64;
                        self.metrics.record_backpressure_resolved(handle_time_ms);
                        return Ok(BackpressureAction::Block(Duration::from_millis(0)));
                    }

                    // No space made, apply backoff strategy
                    let backoff_duration = self.calculate_backoff(config, receipt);
                    self.metrics.record_backpressure_delay(backoff_duration.as_millis() as f64);

                    // Check if backoff exceeds max block time
                    if backoff_duration.as_millis() > config.max_block_time_ms as u128 {
                        // Trip circuit breaker
                        self.circuit_breaker.trip(config.circuit_breaker_timeout_ms);
                        self.metrics.record_circuit_breaker_tripped();
                        return Ok(BackpressureAction::CircuitOpen);
                    }

                    Ok(BackpressureAction::Block(backoff_duration))
                }

                async fn attempt_drop_policy(
                    &self,
                    queue: &Arc<Mutex<ReceiptQueue>>,
                    config: &BackpressureConfig,
                ) -> Result<bool, BackpressureError> {
                    let mut queue_guard = queue.lock().await;

                    match config.drop_policy {
                        DropPolicy::Never => Ok(false),
                        DropPolicy::Oldest => {
                            // Try to drop oldest receipt
                            if let Some(dropped) = queue_guard.drop_oldest() {
                                self.metrics.record_receipt_dropped("oldest", dropped.receipt_type);
                                Ok(true)
                            } else {
                                Ok(false)
                            }
                        }
                        DropPolicy::Newest => {
                            // Try to drop newest receipt (the one causing backpressure)
                            self.metrics.record_receipt_dropped("newest", "current".to_string());
                            Ok(true)  // Drop the current receipt
                        }
                        DropPolicy::Priority { threshold: _ } => {
                            // TODO: Implement priority-based dropping
                            Ok(false)
                        }
                    }
                }

                fn calculate_backoff(&self, config: &BackpressureConfig, receipt: &Receipt) -> Duration {
                    match config.backoff_strategy {
                        BackoffStrategy::Fixed(delay_ms) => Duration::from_millis(delay_ms),
                        BackoffStrategy::Exponential { base, max } => {
                            // Simple exponential backoff based on receipt count
                            let count = self.metrics.get_backpressure_count() as u32;
                            let delay = base.saturating_mul(2u64.saturating_pow(count.min(10)));
                            Duration::from_millis(delay.min(max))
                        }
                        BackoffStrategy::Linear { increment, max } => {
                            let count = self.metrics.get_backpressure_count() as u64;
                            let delay = increment.saturating_mul(count);
                            Duration::from_millis(delay.min(max))
                        }
                    }
                }

                pub async fn apply_backpressure_action(
                    &self,
                    action: BackpressureAction,
                    receipt: Receipt,
                ) -> Result<Option<Receipt>, BackpressureError> {
                    match action {
                        BackpressureAction::Block(duration) => {
                            sleep(duration).await;
                            Ok(Some(receipt))  // Return receipt to retry
                        }
                        BackpressureAction::Drop => {
                            self.metrics.record_receipt_dropped("policy", receipt.receipt_type);
                            Ok(None)  // Receipt dropped
                        }
                        BackpressureAction::CircuitOpen => {
                            self.metrics.record_receipt_dropped("circuit_breaker", receipt.receipt_type);
                            Ok(None)  // Receipt dropped due to circuit breaker
                        }
                    }
                }
            }

            pub struct CircuitBreaker {
                state: Mutex<CircuitState>,
            }

            #[derive(Debug)]
            enum CircuitState {
                Closed,
                Open { until: std::time::Instant },
            }

            impl CircuitBreaker {
                pub fn new() -> Self {
                    Self {
                        state: Mutex::new(CircuitState::Closed),
                    }
                }

                pub fn is_open(&self) -> bool {
                    let state = self.state.blocking_lock();
                    match *state {
                        CircuitState::Closed => false,
                        CircuitState::Open { until } => {
                            if std::time::Instant::now() > until {
                                // Transition to closed
                                *state = CircuitState::Closed;
                                false
                            } else {
                                true
                            }
                        }
                    }
                }

                pub fn trip(&self, timeout_ms: u64) {
                    let mut state = self.state.blocking_lock();
                    *state = CircuitState::Open {
                        until: std::time::Instant::now() + Duration::from_millis(timeout_ms),
                    };
                }
            }
          python: |
            import asyncio
            import time
            from typing import Optional, Union
            from dataclasses import dataclass
            from enum import Enum

            class BackpressureHandler:
                """Handles backpressure when receipt queue is full"""

                @dataclass
                class BackpressureConfig:
                    max_block_time_ms: int = 5000
                    backoff_strategy: 'BackoffStrategy' = None
                    circuit_breaker_threshold: int = 10
                    circuit_breaker_timeout_ms: int = 30000
                    drop_policy: 'DropPolicy' = None

                    def __post_init__(self):
                        if self.backoff_strategy is None:
                            self.backoff_strategy = BackoffStrategy.exponential(base=100, max=2000)
                        if self.drop_policy is None:
                            self.drop_policy = DropPolicy.never()

                def __init__(self, metrics: BackpressureMetrics):
                    self.metrics = metrics
                    self.circuit_breaker = CircuitBreaker()

                async def handle_queue_full(
                    self,
                    queue: asyncio.Queue,
                    receipt: Receipt,
                    config: BackpressureConfig
                ) -> 'BackpressureAction':
                    """Handle queue full condition"""
                    start_time = time.time()

                    # Check circuit breaker
                    if self.circuit_breaker.is_open():
                        self.metrics.record_circuit_breaker_open()
                        return BackpressureAction.circuit_open()

                    # Record backpressure event
                    self.metrics.record_backpressure_event(receipt.receipt_type)

                    # Try to make space with drop policy
                    space_made = await self._attempt_drop_policy(queue, config)

                    if space_made:
                        handle_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_backpressure_resolved(handle_time_ms)
                        return BackpressureAction.block_ms(0)

                    # Calculate backoff
                    backoff_ms = self._calculate_backoff(config, receipt)
                    self.metrics.record_backpressure_delay(backoff_ms)

                    # Check max block time
                    if backoff_ms > config.max_block_time_ms:
                        self.circuit_breaker.trip(config.circuit_breaker_timeout_ms)
                        self.metrics.record_circuit_breaker_tripped()
                        return BackpressureAction.circuit_open()

                    return BackpressureAction.block_ms(backoff_ms)

                async def _attempt_drop_policy(self, queue: asyncio.Queue, config: BackpressureConfig) -> bool:
                    """Try to make space using drop policy"""
                    if config.drop_policy.name == "NEVER":
                        return False

                    # For simplicity, implement oldest drop
                    if config.drop_policy.name == "OLDEST" and not queue.empty():
                        try:
                            dropped = queue.get_nowait()
                            self.metrics.record_receipt_dropped("oldest", dropped.receipt_type)
                            return True
                        except asyncio.QueueEmpty:
                            pass

                    return False

                def _calculate_backoff(self, config: BackpressureConfig, receipt: Receipt) -> int:
                    """Calculate backoff duration"""
                    strategy = config.backoff_strategy

                    if strategy.name == "FIXED":
                        return strategy.delay_ms
                    elif strategy.name == "EXPONENTIAL":
                        count = self.metrics.get_backpressure_count()
                        delay = strategy.base * (2 ** min(count, 10))
                        return min(delay, strategy.max_delay)
                    elif strategy.name == "LINEAR":
                        count = self.metrics.get_backpressure_count()
                        delay = strategy.increment * count
                        return min(delay, strategy.max_delay)

                    return 100  # Default 100ms

                async def apply_backpressure_action(self, action: 'BackpressureAction', receipt: Receipt) -> Optional[Receipt]:
                    """Apply the backpressure action"""
                    if action.action_type == "BLOCK":
                        await asyncio.sleep(action.delay_ms / 1000)
                        return receipt
                    elif action.action_type in ["DROP", "CIRCUIT_OPEN"]:
                        self.metrics.record_receipt_dropped(action.action_type.lower(), receipt.receipt_type)
                        return None

                    return receipt

            @dataclass
            class BackpressureAction:
                action_type: str
                delay_ms: int = 0

                @classmethod
                def block_ms(cls, delay_ms: int) -> 'BackpressureAction':
                    return cls("BLOCK", delay_ms)

                @classmethod
                def drop(cls) -> 'BackpressureAction':
                    return cls("DROP")

                @classmethod
                def circuit_open(cls) -> 'BackpressureAction':
                    return cls("CIRCUIT_OPEN")

            class BackoffStrategy:
                def __init__(self, name: str, **kwargs):
                    self.name = name.upper()
                    for k, v in kwargs.items():
                        setattr(self, k, v)

                @classmethod
                def fixed(cls, delay_ms: int) -> 'BackoffStrategy':
                    return cls("FIXED", delay_ms=delay_ms)

                @classmethod
                def exponential(cls, base: int, max_delay: int) -> 'BackoffStrategy':
                    return cls("EXPONENTIAL", base=base, max_delay=max_delay)

                @classmethod
                def linear(cls, increment: int, max_delay: int) -> 'BackoffStrategy':
                    return cls("LINEAR", increment=increment, max_delay=max_delay)

            class DropPolicy:
                def __init__(self, name: str):
                    self.name = name.upper()

                @classmethod
                def never(cls) -> 'DropPolicy':
                    return cls("NEVER")

                @classmethod
                def oldest(cls) -> 'DropPolicy':
                    return cls("OLDEST")

                @classmethod
                def newest(cls) -> 'DropPolicy':
                    return cls("NEWEST")

            class CircuitBreaker:
                """Simple circuit breaker for backpressure"""

                def __init__(self):
                    self.state = "CLOSED"
                    self.open_until = 0

                def is_open(self) -> bool:
                    if self.state == "OPEN":
                        if time.time() * 1000 > self.open_until:
                            self.state = "CLOSED"
                            return False
                        return True
                    return False

                def trip(self, timeout_ms: int):
                    self.state = "OPEN"
                    self.open_until = time.time() * 1000 + timeout_ms

        performance_requirements:
          - response_time: <100ms backpressure handling (P95)
          - memory_efficiency: O(1) additional memory per event
          - cpu_efficiency: Minimal CPU overhead during backpressure
          - graceful_degradation: System continues with reduced throughput
        error_handling:
          - circuit_breaker: Automatic recovery after timeout
          - drop_policy_failure: Fallback to blocking behavior
          - metric_failure: Continue operation with degraded monitoring

      - name: get_backpressure_stats
        description: Get current backpressure statistics for monitoring
        returns:
          type: BackpressureStats
          description: Current backpressure metrics and circuit breaker state
        implementation_notes: Used by observability system for monitoring and alerting

    dependencies:
      - name: tokio::time
        description: Async timing for backoff delays
      - name: BackpressureMetrics
        description: Metrics collection for backpressure events

testing_requirements:
  - unit_tests:
      - backpressure_detection: Queue full correctly detected
      - drop_policies: Receipts dropped according to policy
      - backoff_strategies: Backoff delays calculated correctly
      - circuit_breaker: Circuit breaker trips and recovers
  - integration_tests:
      - sustained_backpressure: System handles prolonged queue full
      - recovery_behavior: System recovers after backpressure clears
      - circuit_breaker_integration: Circuit breaker prevents cascade failures
  - performance_tests:
      - backpressure_latency: <100ms response time under load
      - memory_pressure: Memory usage stays bounded during backpressure
      - throughput_degradation: Graceful throughput reduction

observability:
  metrics:
    - name: receipt_backpressure_events_total
      type: counter
      labels: [receipt_type]
      description: Total backpressure events by receipt type
    - name: receipt_backpressure_delay_ms
      type: histogram
      buckets: [10, 50, 100, 500, 1000]
      description: Backpressure delay durations
    - name: receipt_backpressure_resolved_total
      type: counter
      description: Total backpressure events resolved
    - name: receipt_dropped_total
      type: counter
      labels: [reason, receipt_type]
      description: Total receipts dropped by reason
    - name: circuit_breaker_state
      type: gauge
      description: Circuit breaker state (0=closed, 1=open)

alerting_rules:
  - name: ReceiptBackpressureHigh
    condition: rate(receipt_backpressure_events_total[5m]) > 60
    severity: error
    description: High backpressure rate (>1/minute)
    runbook: Check batch writer performance, increase queue capacity

  - name: CircuitBreakerOpen
    condition: circuit_breaker_state == 1
    severity: error
    description: Circuit breaker is open - dropping receipts
    runbook: Investigate root cause of backpressure, check system resources

  - name: ReceiptDropRateHigh
    condition: rate(receipt_dropped_total[5m]) > 10
    severity: warning
    description: High receipt drop rate (>10/minute)
    runbook: Review backpressure policies, consider increasing capacity

compliance:
  - soc2: CC7.2 (system monitoring with graceful degradation)
  - gdpr: Article 30 (audit logging with backpressure handling for data protection)
