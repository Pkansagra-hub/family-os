classes:
  - name: BatchWriterTask
    description: Background task for batch receipt writing with WAL optimization
    research: ADR-0038b (batch optimization), SQLite WAL mode, fsync batching, crash recovery
    performance_budget: 10× throughput improvement, <5ms batch write latency (P95)
    reliability_properties:
      - batch_atomicity: All receipts in batch succeed or fail together
      - wal_durability: WAL ensures durability without blocking writes
      - crash_recovery: WAL replay reconstructs failed batches
    methods:
      - name: run_batch_writer
        description: Main background task loop for processing receipt batches
        parameters:
          - name: receiver
            type: Receiver<Receipt>
            description: Channel receiver for incoming receipts
        returns:
          type: void
          description: Runs indefinitely until channel closes
        implementation:
          rust: |
            use tokio::sync::mpsc::Receiver;
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use std::time::{Duration, Instant};

            pub struct BatchWriterTask {
                db: Arc<Mutex<rusqlite::Connection>>,
                metrics: Arc<BatchMetrics>,
                max_batch_size: usize,
                max_batch_time_ms: u64,
            }

            impl BatchWriterTask {
                pub fn new(
                    db: Arc<Mutex<rusqlite::Connection>>,
                    metrics: Arc<BatchMetrics>,
                    max_batch_size: usize,
                    max_batch_time_ms: u64,
                ) -> Self {
                    Self {
                        db,
                        metrics,
                        max_batch_size,
                        max_batch_time_ms,
                    }
                }

                pub async fn run_batch_writer(mut self, mut receiver: Receiver<Receipt>) {
                    let mut batch = Vec::with_capacity(self.max_batch_size);
                    let mut batch_start = Instant::now();

                    loop {
                        let timeout = Duration::from_millis(self.max_batch_time_ms);
                        let batch_timeout = batch_start + timeout;

                        // Wait for next receipt or batch timeout
                        match tokio::time::timeout_at(batch_timeout, receiver.recv()).await {
                            Ok(Some(receipt)) => {
                                batch.push(receipt);

                                // Check if batch is full
                                if batch.len() >= self.max_batch_size {
                                    self.process_batch(batch).await;
                                    batch = Vec::with_capacity(self.max_batch_size);
                                    batch_start = Instant::now();
                                }
                            }
                            Ok(None) => {
                                // Channel closed - process final batch and exit
                                if !batch.is_empty() {
                                    self.process_batch(batch).await;
                                }
                                break;
                            }
                            Err(_) => {
                                // Timeout - process current batch
                                if !batch.is_empty() {
                                    self.process_batch(batch).await;
                                    batch = Vec::with_capacity(self.max_batch_size);
                                    batch_start = Instant::now();
                                } else {
                                    // No receipts, reset timer
                                    batch_start = Instant::now();
                                }
                            }
                        }
                    }
                }

                async fn process_batch(&self, batch: Vec<Receipt>) {
                    let batch_id = uuid::Uuid::new_v4().to_string();
                    let batch_size = batch.len();
                    let start_time = Instant::now();

                    self.metrics.record_batch_started(batch_id.clone(), batch_size);

                    match self.write_batch_to_db(&batch_id, &batch).await {
                        Ok(_) => {
                            let write_time_ms = start_time.elapsed().as_millis() as f64;
                            self.metrics.record_batch_completed(
                                batch_id,
                                batch_size,
                                write_time_ms
                            );
                        }
                        Err(e) => {
                            let error_time_ms = start_time.elapsed().as_millis() as f64;
                            self.metrics.record_batch_failed(
                                batch_id,
                                batch_size,
                                error_time_ms,
                                &e.to_string()
                            );

                            // TODO: Implement retry logic with exponential backoff
                            eprintln!("Batch write failed: {}", e);
                        }
                    }
                }

                async fn write_batch_to_db(
                    &self,
                    batch_id: &str,
                    batch: &[Receipt]
                ) -> Result<(), BatchWriteError> {
                    let db = self.db.lock().await;

                    // Begin transaction for atomic batch write
                    let tx = db.unchecked_transaction()?;

                    {
                        let mut stmt = tx.prepare_cached(
                            "INSERT INTO receipts (
                                receipt_id, session_id, space_id, user_id,
                                receipt_type, privacy_band, timestamp,
                                previous_hash, current_hash, payload,
                                turn_number, tool_name, agent_id, section,
                                batch_id, created_at
                            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
                        )?;

                        let write_start = Instant::now();

                        for receipt in batch {
                            // Extract metadata from FlatBuffers payload for indexing
                            let metadata = self.extract_metadata(&receipt.payload)?;

                            stmt.execute(rusqlite::params![
                                receipt.receipt_id,
                                receipt.session_id,
                                receipt.space_id,
                                receipt.user_id,
                                receipt.receipt_type,
                                receipt.privacy_band,
                                receipt.timestamp,
                                receipt.previous_hash,
                                receipt.current_hash,
                                receipt.payload,
                                metadata.turn_number,
                                metadata.tool_name,
                                metadata.agent_id,
                                metadata.section,
                                batch_id,
                                receipt.timestamp,  // created_at = timestamp for receipts
                            ])?;
                        }

                        // Force WAL sync for durability
                        tx.execute("PRAGMA wal_checkpoint(PASSIVE)", [])?;
                    }

                    tx.commit()?;

                    let fsync_time_ms = write_start.elapsed().as_millis() as u64;
                    self.metrics.record_fsync_duration(fsync_time_ms);

                    Ok(())
                }

                fn extract_metadata(&self, payload: &[u8]) -> Result<ReceiptMetadata, BatchWriteError> {
                    // TODO: Implement FlatBuffers parsing to extract metadata for indexing
                    // This would parse the receipt type and extract relevant fields
                    Ok(ReceiptMetadata {
                        turn_number: None,
                        tool_name: None,
                        agent_id: None,
                        section: None,
                    })
                }
            }
          python: |
            import asyncio
            import uuid
            import time
            from typing import List, Optional
            import sqlite3

            class BatchWriterTask:
                """Background batch writer for receipts"""

                def __init__(
                    self,
                    db_connection,
                    metrics: BatchMetrics,
                    max_batch_size: int = 100,
                    max_batch_time_ms: int = 100
                ):
                    self.db = db_connection
                    self.metrics = metrics
                    self.max_batch_size = max_batch_size
                    self.max_batch_time_ms = max_batch_time_ms

                async def run_batch_writer(self, queue: asyncio.Queue):
                    """Main batch writer loop"""
                    batch = []
                    batch_start_time = time.time()

                    while True:
                        try:
                            # Calculate timeout for current batch
                            elapsed_ms = (time.time() - batch_start_time) * 1000
                            timeout_sec = max(0, (self.max_batch_time_ms - elapsed_ms) / 1000)

                            # Wait for next receipt or timeout
                            try:
                                receipt = await asyncio.wait_for(
                                    queue.get(),
                                    timeout=timeout_sec
                                )
                                batch.append(receipt)

                                # Check if batch is full
                                if len(batch) >= self.max_batch_size:
                                    await self._process_batch(batch)
                                    batch = []
                                    batch_start_time = time.time()

                            except asyncio.TimeoutError:
                                # Timeout - process current batch if not empty
                                if batch:
                                    await self._process_batch(batch)
                                    batch = []
                                    batch_start_time = time.time()

                        except Exception as e:
                            self.metrics.record_batch_writer_error(str(e))
                            await asyncio.sleep(1)  # Backoff on error

                async def _process_batch(self, batch: List[Receipt]):
                    """Process a batch of receipts"""
                    batch_id = str(uuid.uuid4())
                    batch_size = len(batch)
                    start_time = time.time()

                    self.metrics.record_batch_started(batch_id, batch_size)

                    try:
                        await self._write_batch_to_db(batch_id, batch)
                        write_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_batch_completed(batch_id, batch_size, write_time_ms)

                    except Exception as e:
                        error_time_ms = (time.time() - start_time) * 1000
                        self.metrics.record_batch_failed(batch_id, batch_size, error_time_ms, str(e))

                        # TODO: Implement retry logic
                        print(f"Batch write failed: {e}")

                async def _write_batch_to_db(self, batch_id: str, batch: List[Receipt]):
                    """Write batch to database atomically"""
                    # Use thread pool for blocking DB operations
                    loop = asyncio.get_event_loop()

                    def _sync_write():
                        with self.db:
                            cursor = self.db.cursor()

                            # Prepare batch insert
                            receipts_data = []
                            for receipt in batch:
                                metadata = self._extract_metadata(receipt.payload)
                                receipts_data.append((
                                    receipt.receipt_id,
                                    receipt.session_id,
                                    receipt.space_id,
                                    receipt.user_id,
                                    receipt.receipt_type,
                                    receipt.privacy_band,
                                    receipt.timestamp,
                                    receipt.previous_hash,
                                    receipt.current_hash,
                                    receipt.payload,
                                    metadata.get('turn_number'),
                                    metadata.get('tool_name'),
                                    metadata.get('agent_id'),
                                    metadata.get('section'),
                                    batch_id,
                                    receipt.timestamp,
                                ))

                            # Batch insert
                            cursor.executemany("""
                                INSERT INTO receipts (
                                    receipt_id, session_id, space_id, user_id,
                                    receipt_type, privacy_band, timestamp,
                                    previous_hash, current_hash, payload,
                                    turn_number, tool_name, agent_id, section,
                                    batch_id, created_at
                                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                            """, receipts_data)

                            # Force WAL checkpoint for durability
                            cursor.execute("PRAGMA wal_checkpoint(PASSIVE)")

                            return cursor.rowcount

                    # Run in thread pool
                    write_start = time.time()
                    rowcount = await loop.run_in_executor(None, _sync_write)
                    fsync_time_ms = (time.time() - write_start) * 1000

                    self.metrics.record_fsync_duration(fsync_time_ms)

                    if rowcount != len(batch):
                        raise BatchWriteError(f"Expected {len(batch)} rows, got {rowcount}")

                def _extract_metadata(self, payload: bytes) -> dict:
                    """Extract metadata from FlatBuffers payload for indexing"""
                    # TODO: Implement FlatBuffers parsing
                    return {
                        'turn_number': None,
                        'tool_name': None,
                        'agent_id': None,
                        'section': None,
                    }

        performance_requirements:
          - batch_throughput: 1000 receipts/second sustained
          - fsync_latency: <5ms per batch fsync (P95)
          - memory_efficiency: O(batch_size) memory usage
          - cpu_efficiency: Minimal CPU overhead per receipt
        error_handling:
          - batch_failure: Retry with exponential backoff
          - db_connection_loss: Reconnect and retry
          - corruption: WAL replay for recovery

      - name: flush_pending_batches
        description: Force flush all pending batches to disk
        returns:
          type: Result<void, FlushError>
          description: Success or error with pending batch count
        implementation_notes: Used during graceful shutdown

    dependencies:
      - name: rusqlite
        description: SQLite connection with WAL support
      - name: tokio::sync::Mutex
        description: Async mutex for database access
      - name: BatchMetrics
        description: Metrics collection for batch performance

testing_requirements:
  - unit_tests:
      - batch_formation: Batches form correctly by size/time
      - atomic_writes: All receipts in batch succeed or fail together
      - wal_checkpointing: WAL checkpoints execute correctly
      - metadata_extraction: Metadata extracted from FlatBuffers
  - integration_tests:
      - crash_recovery: WAL replay reconstructs state after crash
      - concurrent_batches: Multiple batch writers don't conflict
      - high_throughput: 1000 receipts/sec sustained for 5 minutes
  - performance_tests:
      - batch_size_optimization: Optimal batch size for throughput
      - fsync_overhead: fsync impact on latency vs durability
      - memory_scaling: Memory usage scales with batch size

observability:
  metrics:
    - name: receipt_batch_size
      type: histogram
      buckets: [1, 10, 50, 100]
      description: Size of processed batches
    - name: receipt_batch_write_latency_ms
      type: histogram
      buckets: [1, 5, 10, 25, 50]
      description: Time to write batch to database
    - name: receipt_batch_fsync_latency_ms
      type: histogram
      buckets: [0.1, 1, 5, 10]
      description: Time for WAL fsync operation
    - name: receipt_batches_completed_total
      type: counter
      description: Total batches successfully written
    - name: receipt_batches_failed_total
      type: counter
      description: Total batches that failed to write

alerting_rules:
  - name: ReceiptBatchWriteLatencyHigh
    condition: histogram_quantile(0.95, rate(receipt_batch_write_latency_ms_bucket[5m])) > 50
    severity: warning
    description: Batch write latency >50ms P95
    runbook: Check database performance, consider batch size tuning

  - name: ReceiptBatchFailureRateHigh
    condition: rate(receipt_batch_failed_total[5m]) / rate(receipt_batch_completed_total[5m]) > 0.01
    severity: error
    description: Batch failure rate >1%
    runbook: Check database connectivity, disk space, corruption

compliance:
  - soc2: CC7.2 (system monitoring with durability guarantees)
  - gdpr: Article 30 (audit logging with crash recovery)