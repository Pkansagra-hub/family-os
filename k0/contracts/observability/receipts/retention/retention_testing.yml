classes:
  - name: RetentionTesting
    description: Comprehensive test suite for retention policies, auto-deletion, and compliance
    research: ADR-0038c (retention testing), Ward testing framework, GDPR compliance testing
    performance_budget: <100ms per test execution (P95), <5s for full test suite
    reliability_properties:
      - test_coverage: 100% coverage of retention policy logic
      - compliance_validation: GDPR/HIPAA compliance rules fully tested
      - data_integrity: Test data doesn't corrupt production receipts
      - isolation: Tests run in isolated environment without side effects
    methods:
      - name: test_retention_policy_engine
        description: Test retention policy engine with various privacy bands and scenarios
        parameters:
          - name: test_scenario
            type: string
            description: Test scenario to execute (band_green, band_amber, band_red, mixed_bands)
          - name: dry_run
            type: bool
            description: Whether to run tests in dry-run mode
        returns:
          type: TestResult
          description: Test execution results with pass/fail status and metrics
        implementation:
          rust: |
            use ward::{test, fixture, TestResult};
            use chrono::{DateTime, Utc, Duration};
            use std::collections::HashMap;
            use tokio::sync::Mutex;

            #[fixture]
            fn test_database() -> TestDatabase {
                // Create isolated test database
                TestDatabase::new()
            }

            #[fixture]
            fn retention_engine(test_db: &TestDatabase) -> RetentionPolicyEngine {
                RetentionPolicyEngine::new(test_db.connection.clone())
            }

            #[test("retention policy engine handles GREEN band correctly")]
            async fn test_green_band_retention(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                // Setup test data
                let user_id = "test_user_green";
                let receipts = create_test_receipts(user_id, "GREEN", 100);

                // Insert test receipts
                test_db.insert_receipts(&receipts).await?;

                // Advance time to make receipts eligible for retention
                test_db.advance_time(Duration::days(366)).await?;

                // Execute retention policy
                let result = retention_engine.execute_retention("GREEN", true).await?;

                // Verify results
                assert_eq!(result.receipts_processed, 100);
                assert_eq!(result.receipts_deleted, 100); // All should be deleted after 365+7 days
                assert!(result.dry_run);

                // Verify receipts are marked for deletion but not actually deleted
                let remaining = test_db.count_receipts(user_id).await?;
                assert_eq!(remaining, 100); // Still exist in dry run

                Ok(())
            }

            #[test("retention policy engine handles AMBER band correctly")]
            async fn test_amber_band_retention(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_amber";
                let receipts = create_test_receipts(user_id, "AMBER", 50);

                test_db.insert_receipts(&receipts).await?;
                test_db.advance_time(Duration::days(181)).await?; // 180 + 7 days

                let result = retention_engine.execute_retention("AMBER", false).await?;

                assert_eq!(result.receipts_processed, 50);
                assert_eq!(result.receipts_deleted, 50);

                // Verify actual deletion in non-dry-run
                let remaining = test_db.count_receipts(user_id).await?;
                assert_eq!(remaining, 0);

                Ok(())
            }

            #[test("retention policy engine handles RED band correctly")]
            async fn test_red_band_retention(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_red";
                let receipts = create_test_receipts(user_id, "RED", 25);

                test_db.insert_receipts(&receipts).await?;
                test_db.advance_time(Duration::days(91)).await?; // 90 + 7 days

                let result = retention_engine.execute_retention("RED", false).await?;

                assert_eq!(result.receipts_processed, 25);
                assert_eq!(result.receipts_deleted, 25);

                let remaining = test_db.count_receipts(user_id).await?;
                assert_eq!(remaining, 0);

                Ok(())
            }

            #[test("retention policy respects grace period")]
            async fn test_grace_period_respected(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_grace";
                let receipts = create_test_receipts(user_id, "GREEN", 10);

                test_db.insert_receipts(&receipts).await?;
                test_db.advance_time(Duration::days(365)).await?; // Exactly retention period

                let result = retention_engine.execute_retention("GREEN", false).await?;

                // Should not delete during grace period
                assert_eq!(result.receipts_deleted, 0);

                // Advance into grace period
                test_db.advance_time(Duration::days(8)).await?;

                let result = retention_engine.execute_retention("GREEN", false).await?;
                assert_eq!(result.receipts_deleted, 10);

                Ok(())
            }

            #[test("retention policy handles mixed bands correctly")]
            async fn test_mixed_bands_retention(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                // Insert receipts for all bands
                let green_receipts = create_test_receipts("user_green", "GREEN", 30);
                let amber_receipts = create_test_receipts("user_amber", "AMBER", 20);
                let red_receipts = create_test_receipts("user_red", "RED", 10);

                test_db.insert_receipts(&green_receipts).await?;
                test_db.insert_receipts(&amber_receipts).await?;
                test_db.insert_receipts(&red_receipts).await?;

                // Advance time past RED band retention (90+7=97 days)
                test_db.advance_time(Duration::days(100)).await?;

                // Execute retention for RED band
                let red_result = retention_engine.execute_retention("RED", false).await?;
                assert_eq!(red_result.receipts_deleted, 10);

                // GREEN and AMBER should not be touched
                let green_remaining = test_db.count_receipts("user_green").await?;
                let amber_remaining = test_db.count_receipts("user_amber").await?;
                assert_eq!(green_remaining, 30);
                assert_eq!(amber_remaining, 20);

                Ok(())
            }

            #[test("deletion audit trail is maintained")]
            async fn test_deletion_audit_trail(
                retention_engine: &RetentionPolicyEngine,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_audit";
                let receipts = create_test_receipts(user_id, "RED", 5);

                test_db.insert_receipts(&receipts).await?;
                test_db.advance_time(Duration::days(100)).await?;

                let result = retention_engine.execute_retention("RED", false).await?;

                // Verify audit trail entries
                let audit_entries = test_db.get_audit_entries(user_id).await?;
                assert_eq!(audit_entries.len(), 5); // One entry per deleted receipt

                for entry in audit_entries {
                    assert_eq!(entry.action, "RETENTION_POLICY_DELETION");
                    assert!(entry.details.contains(user_id));
                    assert!(entry.details.contains("RED"));
                }

                Ok(())
            }

            #[test("compliance export includes all user data")]
            async fn test_compliance_export_completeness(
                compliance_reporting: &ComplianceReporting,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_export";
                let receipts = create_test_receipts(user_id, "GREEN", 20);

                test_db.insert_receipts(&receipts).await?;

                let export_result = compliance_reporting
                    .export_user_receipts(user_id, "GREEN", "json", false, "test_trace")
                    .await?;

                assert_eq!(export_result.total_receipts, 20);
                assert_eq!(export_result.receipts.len(), 20);
                assert!(!export_result.export_hash.is_empty());

                // Verify all receipts are included
                let receipt_ids: std::collections::HashSet<_> = export_result.receipts
                    .iter()
                    .map(|r| r.receipt_id.as_str())
                    .collect();

                assert_eq!(receipt_ids.len(), 20);

                Ok(())
            }

            #[test("privacy redaction is applied correctly")]
            async fn test_privacy_redaction(
                compliance_reporting: &ComplianceReporting,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_redaction";
                let receipts = create_test_receipts_with_pii(user_id, "AMBER", 3);

                test_db.insert_receipts(&receipts).await?;

                let export_result = compliance_reporting
                    .export_user_receipts(user_id, "AMBER", "json", false, "test_trace")
                    .await?;

                // Verify AMBER band redaction
                for receipt in &export_result.receipts {
                    assert!(receipt.privacy_applied.contains(&"email_removed".to_string()));
                    assert!(receipt.privacy_applied.contains(&"phone_removed".to_string()));
                    assert!(receipt.privacy_applied.contains(&"location_anonymized".to_string()));

                    // Verify PII is actually removed
                    let data = &receipt.data;
                    assert!(!data.contains_key("email"));
                    assert!(!data.contains_key("phone"));
                }

                Ok(())
            }

            #[test("hash chain integrity is maintained")]
            async fn test_hash_chain_integrity(
                compliance_reporting: &ComplianceReporting,
                test_db: &TestDatabase,
            ) -> TestResult {
                let user_id = "test_user_hash";
                let receipts = create_test_receipts(user_id, "GREEN", 5);

                test_db.insert_receipts(&receipts).await?;

                let export_result = compliance_reporting
                    .export_user_receipts(user_id, "GREEN", "json", false, "test_trace")
                    .await?;

                // Verify all hash chains are valid
                for receipt in &export_result.receipts {
                    assert!(receipt.hash_chain.chain_verified);
                    assert!(!receipt.hash_chain.current_hash.is_empty());
                }

                Ok(())
            }

            // Helper functions
            fn create_test_receipts(user_id: &str, privacy_band: &str, count: usize) -> Vec<Receipt> {
                (0..count).map(|i| {
                    Receipt {
                        id: format!("receipt_{}_{}", user_id, i),
                        user_id: user_id.to_string(),
                        privacy_band: privacy_band.to_string(),
                        receipt_type: "turn_receipt".to_string(),
                        timestamp: Utc::now() - Duration::days(i as i64),
                        session_id: format!("session_{}", i),
                        data: serde_json::json!({"action": "test", "result": i}),
                        current_hash: format!("hash_{}", i),
                        previous_hash: if i > 0 { Some(format!("hash_{}", i-1)) } else { None },
                        created_at: Utc::now(),
                        deleted_at: None,
                        privacy_applied: vec![],
                    }
                }).collect()
            }

            fn create_test_receipts_with_pii(user_id: &str, privacy_band: &str, count: usize) -> Vec<Receipt> {
                (0..count).map(|i| {
                    Receipt {
                        id: format!("receipt_pii_{}_{}", user_id, i),
                        user_id: user_id.to_string(),
                        privacy_band: privacy_band.to_string(),
                        receipt_type: "turn_receipt".to_string(),
                        timestamp: Utc::now() - Duration::days(i as i64),
                        session_id: format!("session_pii_{}", i),
                        data: serde_json::json!({
                            "email": format!("user{}@example.com", i),
                            "phone": format!("+123456789{}", i),
                            "location": format!("City {}", i),
                            "action": "test_with_pii"
                        }),
                        current_hash: format!("hash_pii_{}", i),
                        previous_hash: if i > 0 { Some(format!("hash_pii_{}", i-1)) } else { None },
                        created_at: Utc::now(),
                        deleted_at: None,
                        privacy_applied: vec![],
                    }
                }).collect()
            }
          python: |
            import pytest
            from datetime import datetime, timedelta, timezone
            from typing import List, Dict, Any
            import asyncio

            class TestRetentionPolicyEngine:
                """Test retention policy engine functionality"""

                @pytest.fixture
                async def test_db(self):
                    """Create isolated test database"""
                    db = TestDatabase()
                    await db.setup()
                    yield db
                    await db.teardown()

                @pytest.fixture
                async def retention_engine(self, test_db):
                    """Create retention policy engine with test database"""
                    return RetentionPolicyEngine(test_db.connection)

                @pytest.mark.asyncio
                async def test_green_band_retention(self, retention_engine, test_db):
                    """Test GREEN band retention policy (365 days)"""
                    user_id = "test_user_green"
                    receipts = self._create_test_receipts(user_id, "GREEN", 100)

                    await test_db.insert_receipts(receipts)
                    await test_db.advance_time(timedelta(days=366))  # Past retention + grace

                    result = await retention_engine.execute_retention("GREEN", dry_run=True)

                    assert result.receipts_processed == 100
                    assert result.receipts_deleted == 100
                    assert result.dry_run == True

                    # Verify receipts still exist in dry run
                    remaining = await test_db.count_receipts(user_id)
                    assert remaining == 100

                @pytest.mark.asyncio
                async def test_amber_band_retention(self, retention_engine, test_db):
                    """Test AMBER band retention policy (180 days)"""
                    user_id = "test_user_amber"
                    receipts = self._create_test_receipts(user_id, "AMBER", 50)

                    await test_db.insert_receipts(receipts)
                    await test_db.advance_time(timedelta(days=181))  # Past retention + grace

                    result = await retention_engine.execute_retention("AMBER", dry_run=False)

                    assert result.receipts_processed == 50
                    assert result.receipts_deleted == 50

                    # Verify actual deletion
                    remaining = await test_db.count_receipts(user_id)
                    assert remaining == 0

                @pytest.mark.asyncio
                async def test_red_band_retention(self, retention_engine, test_db):
                    """Test RED band retention policy (90 days)"""
                    user_id = "test_user_red"
                    receipts = self._create_test_receipts(user_id, "RED", 25)

                    await test_db.insert_receipts(receipts)
                    await test_db.advance_time(timedelta(days=91))  # Past retention + grace

                    result = await retention_engine.execute_retention("RED", dry_run=False)

                    assert result.receipts_processed == 25
                    assert result.receipts_deleted == 25

                    remaining = await test_db.count_receipts(user_id)
                    assert remaining == 0

                @pytest.mark.asyncio
                async def test_grace_period_respected(self, retention_engine, test_db):
                    """Test that grace period prevents premature deletion"""
                    user_id = "test_user_grace"
                    receipts = self._create_test_receipts(user_id, "GREEN", 10)

                    await test_db.insert_receipts(receipts)
                    await test_db.advance_time(timedelta(days=365))  # Exactly retention period

                    result = await retention_engine.execute_retention("GREEN", dry_run=False)

                    # Should not delete during grace period
                    assert result.receipts_deleted == 0

                    # Advance into grace period
                    await test_db.advance_time(timedelta(days=8))

                    result = await retention_engine.execute_retention("GREEN", dry_run=False)
                    assert result.receipts_deleted == 10

                @pytest.mark.asyncio
                async def test_mixed_bands_isolation(self, retention_engine, test_db):
                    """Test that retention policies don't affect other bands"""
                    # Insert receipts for all bands
                    green_receipts = self._create_test_receipts("user_green", "GREEN", 30)
                    amber_receipts = self._create_test_receipts("user_amber", "AMBER", 20)
                    red_receipts = self._create_test_receipts("user_red", "RED", 10)

                    await test_db.insert_receipts(green_receipts)
                    await test_db.insert_receipts(amber_receipts)
                    await test_db.insert_receipts(red_receipts)

                    # Advance time past RED retention (90+7=97 days)
                    await test_db.advance_time(timedelta(days=100))

                    # Execute RED band retention
                    red_result = await retention_engine.execute_retention("RED", dry_run=False)
                    assert red_result.receipts_deleted == 10

                    # GREEN and AMBER should be untouched
                    green_remaining = await test_db.count_receipts("user_green")
                    amber_remaining = await test_db.count_receipts("user_amber")
                    assert green_remaining == 30
                    assert amber_remaining == 20

                @pytest.mark.asyncio
                async def test_deletion_audit_trail(self, retention_engine, test_db):
                    """Test that deletions are properly audited"""
                    user_id = "test_user_audit"
                    receipts = self._create_test_receipts(user_id, "RED", 5)

                    await test_db.insert_receipts(receipts)
                    await test_db.advance_time(timedelta(days=100))

                    result = await retention_engine.execute_retention("RED", dry_run=False)

                    # Verify audit trail
                    audit_entries = await test_db.get_audit_entries(user_id)
                    assert len(audit_entries) == 5

                    for entry in audit_entries:
                        assert entry["action"] == "RETENTION_POLICY_DELETION"
                        assert user_id in entry["details"]
                        assert "RED" in entry["details"]

            class TestComplianceReporting:
                """Test GDPR compliance export functionality"""

                @pytest.fixture
                async def compliance_reporting(self, test_db):
                    """Create compliance reporting instance"""
                    return ComplianceReporting(test_db.connection, MockObservability())

                @pytest.mark.asyncio
                async def test_export_completeness(self, compliance_reporting, test_db):
                    """Test that export includes all user receipts"""
                    user_id = "test_user_export"
                    receipts = self._create_test_receipts(user_id, "GREEN", 20)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "GREEN", "json", False, "test_trace"
                    )

                    assert export_result.total_receipts == 20
                    assert len(export_result.receipts) == 20
                    assert export_result.export_hash

                    # Verify all receipt IDs are unique
                    receipt_ids = {r.receipt_id for r in export_result.receipts}
                    assert len(receipt_ids) == 20

                @pytest.mark.asyncio
                async def test_privacy_redaction_green(self, compliance_reporting, test_db):
                    """Test GREEN band privacy redaction"""
                    user_id = "test_user_green_redaction"
                    receipts = self._create_test_receipts_with_pii(user_id, "GREEN", 3)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "GREEN", "json", False, "test_trace"
                    )

                    for receipt in export_result.receipts:
                        assert "email_masked" in receipt.privacy_applied
                        assert "phone_masked" in receipt.privacy_applied
                        # Verify PII is masked, not removed
                        assert "email" in receipt.data
                        assert "phone" in receipt.data

                @pytest.mark.asyncio
                async def test_privacy_redaction_amber(self, compliance_reporting, test_db):
                    """Test AMBER band privacy redaction"""
                    user_id = "test_user_amber_redaction"
                    receipts = self._create_test_receipts_with_pii(user_id, "AMBER", 3)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "AMBER", "json", False, "test_trace"
                    )

                    for receipt in export_result.receipts:
                        assert "email_removed" in receipt.privacy_applied
                        assert "phone_removed" in receipt.privacy_applied
                        assert "location_anonymized" in receipt.privacy_applied
                        # Verify PII is removed
                        assert "email" not in receipt.data
                        assert "phone" not in receipt.data

                @pytest.mark.asyncio
                async def test_privacy_redaction_red(self, compliance_reporting, test_db):
                    """Test RED band privacy redaction"""
                    user_id = "test_user_red_redaction"
                    receipts = self._create_test_receipts_with_pii(user_id, "RED", 3)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "RED", "json", False, "test_trace"
                    )

                    for receipt in export_result.receipts:
                        assert "all_pii_removed" in receipt.privacy_applied
                        assert "content_sanitized" in receipt.privacy_applied
                        # Verify all sensitive data is removed/sanitized
                        assert len(receipt.data) == 0 or "sanitized" in str(receipt.data)

                @pytest.mark.asyncio
                async def test_hash_chain_verification(self, compliance_reporting, test_db):
                    """Test hash chain integrity verification"""
                    user_id = "test_user_hash"
                    receipts = self._create_test_receipts(user_id, "GREEN", 5)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "GREEN", "json", False, "test_trace"
                    )

                    # All hash chains should be verified
                    for receipt in export_result.receipts:
                        assert receipt.hash_chain.chain_verified
                        assert receipt.hash_chain.current_hash

                @pytest.mark.asyncio
                async def test_export_audit_trail(self, compliance_reporting, test_db):
                    """Test that exports are properly audited"""
                    user_id = "test_user_audit_export"
                    receipts = self._create_test_receipts(user_id, "GREEN", 5)

                    await test_db.insert_receipts(receipts)

                    export_result = await compliance_reporting.export_user_receipts(
                        user_id, "GREEN", "json", False, "test_trace"
                    )

                    # Verify audit trail was created
                    assert len(export_result.audit_trail) > 0
                    assert export_result.audit_trail[0].action == "GDPR_EXPORT_INITIATED"
                    assert user_id in export_result.audit_trail[0].details

            # Helper methods
            def _create_test_receipts(self, user_id: str, privacy_band: str, count: int) -> List[Dict[str, Any]]:
                """Create test receipts for testing"""
                receipts = []
                base_time = datetime.now(timezone.utc)

                for i in range(count):
                    receipts.append({
                        "id": f"receipt_{user_id}_{i}",
                        "user_id": user_id,
                        "privacy_band": privacy_band,
                        "receipt_type": "turn_receipt",
                        "timestamp": base_time - timedelta(days=i),
                        "session_id": f"session_{i}",
                        "data": {"action": "test", "result": i},
                        "current_hash": f"hash_{i}",
                        "previous_hash": f"hash_{i-1}" if i > 0 else None,
                        "created_at": base_time,
                        "deleted_at": None,
                        "privacy_applied": [],
                    })

                return receipts

            def _create_test_receipts_with_pii(self, user_id: str, privacy_band: str, count: int) -> List[Dict[str, Any]]:
                """Create test receipts with PII for redaction testing"""
                receipts = []
                base_time = datetime.now(timezone.utc)

                for i in range(count):
                    receipts.append({
                        "id": f"receipt_pii_{user_id}_{i}",
                        "user_id": user_id,
                        "privacy_band": privacy_band,
                        "receipt_type": "turn_receipt",
                        "timestamp": base_time - timedelta(days=i),
                        "session_id": f"session_pii_{i}",
                        "data": {
                            "email": f"user{i}@example.com",
                            "phone": f"+123456789{i}",
                            "location": f"City {i}",
                            "action": "test_with_pii"
                        },
                        "current_hash": f"hash_pii_{i}",
                        "previous_hash": f"hash_pii_{i-1}" if i > 0 else None,
                        "created_at": base_time,
                        "deleted_at": None,
                        "privacy_applied": [],
                    })

                return receipts

    dependencies:
      - name: ward
        description: Testing framework for comprehensive test suites
      - name: pytest
        description: Python testing framework with async support
      - name: pytest-asyncio
        description: Async test support for pytest
      - name: faker
        description: Fake data generation for test receipts

testing_requirements:
  - unit_tests:
      - retention_logic: All retention policy calculations tested
      - privacy_redaction: All redaction rules properly applied
      - hash_verification: Hash chain integrity validation
      - audit_trail: All operations properly audited
  - integration_tests:
      - database_operations: Full CRUD operations with test database
      - scheduled_jobs: Cron job execution and monitoring
      - export_formats: JSON/CSV/PDF export validation
      - observability: Metrics and tracing collection
  - security_tests:
      - data_isolation: Test data doesn't leak into production
      - access_control: Proper authorization for sensitive operations
      - pii_protection: PII redaction prevents data leakage
  - performance_tests:
      - execution_time: Retention jobs complete within budget (<5s)
      - export_time: GDPR exports complete within budget (<500ms user, <50ms session)
      - concurrent_access: Multiple retention jobs don't conflict

test_coverage_requirements:
  - retention_policy_engine: 100% coverage of all retention logic
  - compliance_reporting: 100% coverage of export and redaction logic
  - scheduled_pruning_job: 100% coverage of job execution and error handling
  - observability: 100% coverage of metrics and tracing
