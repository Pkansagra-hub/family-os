classes:
  - name: ScheduledPruningJob
    description: Scheduled job for automatic receipt pruning based on retention policies
    research: ADR-0038c (auto-deletion), cron scheduling, job orchestration, failure recovery
    performance_budget: <5 seconds execution time (P95), hourly scheduling
    reliability_properties:
      - idempotent_execution: Multiple runs don't cause issues
      - failure_recovery: Failed runs are retried with exponential backoff
      - concurrent_safety: Multiple instances don't conflict
    methods:
      - name: execute_pruning_job
        description: Execute the scheduled pruning job (called by cron/scheduler)
        parameters:
          - name: job_id
            type: string
            description: Unique job execution identifier
          - name: force_run
            type: bool
            description: Force execution even if recently run
        returns:
          type: Result<PruningJobResult, PruningError>
          description: Job execution results or error
        implementation:
          rust: |
            use chrono::{DateTime, Utc, Duration};
            use std::sync::Arc;
            use tokio::sync::Mutex;
            use uuid::Uuid;

            pub struct ScheduledPruningJob {
                retention_engine: Arc<RetentionPolicyEngine>,
                db: Arc<Mutex<rusqlite::Connection>>,
                metrics: Arc<PruningMetrics>,
                config: PruningJobConfig,
            }

            #[derive(Debug, Clone)]
            pub struct PruningJobConfig {
                pub schedule_interval_hours: i64,
                pub max_concurrent_jobs: usize,
                pub retry_attempts: u32,
                pub retry_backoff_ms: u64,
                pub dry_run_first: bool,
                pub notify_on_completion: bool,
            }

            impl Default for PruningJobConfig {
                fn default() -> Self {
                    Self {
                        schedule_interval_hours: 1,  // Hourly execution
                        max_concurrent_jobs: 1,
                        retry_attempts: 3,
                        retry_backoff_ms: 1000,
                        dry_run_first: true,
                        notify_on_completion: false,
                    }
                }
            }

            impl ScheduledPruningJob {
                pub fn new(
                    retention_engine: Arc<RetentionPolicyEngine>,
                    db: Arc<Mutex<rusqlite::Connection>>,
                    metrics: Arc<PruningMetrics>,
                    config: PruningJobConfig,
                ) -> Self {
                    Self {
                        retention_engine,
                        db,
                        metrics,
                        config,
                    }
                }

                pub async fn execute_pruning_job(
                    &self,
                    job_id: Option<String>,
                    force_run: bool,
                ) -> Result<PruningJobResult, PruningError> {
                    let job_id = job_id.unwrap_or_else(|| Uuid::new_v4().to_string());
                    let start_time = Utc::now();

                    self.metrics.record_job_started(&job_id);

                    // Check if job should run (unless forced)
                    if !force_run {
                        if let Some(last_run) = self.get_last_job_execution().await? {
                            let time_since_last_run = Utc::now().signed_duration_since(last_run);
                            if time_since_last_run < Duration::hours(self.config.schedule_interval_hours) {
                                self.metrics.record_job_skipped(&job_id, "too_soon");
                                return Ok(PruningJobResult {
                                    job_id,
                                    status: JobStatus::Skipped,
                                    reason: Some("Last execution too recent".to_string()),
                                    ..Default::default()
                                });
                            }
                        }
                    }

                    // Check for concurrent jobs
                    if self.get_active_job_count().await? >= self.config.max_concurrent_jobs {
                        self.metrics.record_job_skipped(&job_id, "concurrent_limit");
                        return Ok(PruningJobResult {
                            job_id,
                            status: JobStatus::Skipped,
                            reason: Some("Concurrent job limit reached".to_string()),
                            ..Default::default()
                        });
                    }

                    // Record job execution start
                    self.record_job_execution_start(&job_id, start_time).await?;

                    let result = self.execute_with_retry(&job_id, start_time).await;

                    // Record job completion
                    let end_time = Utc::now();
                    let duration_ms = end_time.signed_duration_since(start_time).num_milliseconds() as u64;

                    match &result {
                        Ok(job_result) => {
                            self.record_job_execution_end(&job_id, end_time, true, job_result.total_deleted).await?;
                            self.metrics.record_job_completed(&job_id, duration_ms, job_result.total_deleted);
                        }
                        Err(e) => {
                            self.record_job_execution_end(&job_id, end_time, false, 0).await?;
                            self.metrics.record_job_failed(&job_id, duration_ms, &e.to_string());
                        }
                    }

                    result
                }

                async fn execute_with_retry(
                    &self,
                    job_id: &str,
                    start_time: DateTime<Utc>,
                ) -> Result<PruningJobResult, PruningError> {
                    let mut last_error = None;

                    for attempt in 0..=self.config.retry_attempts {
                        if attempt > 0 {
                            // Exponential backoff
                            let backoff_ms = self.config.retry_backoff_ms * 2u64.pow(attempt - 1);
                            tokio::time::sleep(std::time::Duration::from_millis(backoff_ms)).await;
                            self.metrics.record_job_retry(job_id, attempt);
                        }

                        match self.execute_pruning_attempt(job_id, start_time, attempt == 0 && self.config.dry_run_first).await {
                            Ok(result) => return Ok(result),
                            Err(e) => {
                                last_error = Some(e);
                                if attempt < self.config.retry_attempts {
                                    continue;
                                }
                            }
                        }
                    }

                    Err(last_error.unwrap())
                }

                async fn execute_pruning_attempt(
                    &self,
                    job_id: &str,
                    start_time: DateTime<Utc>,
                    dry_run: bool,
                ) -> Result<PruningJobResult, PruningError> {
                    // Execute retention policy
                    let retention_result = self.retention_engine
                        .execute_retention_policy(start_time, dry_run)
                        .await?;

                    // If this was a dry run, schedule the real execution
                    if dry_run && retention_result.total_deleted > 0 {
                        // Schedule real execution for next cycle
                        self.schedule_real_execution(job_id, start_time).await?;
                        return Ok(PruningJobResult {
                            job_id: job_id.to_string(),
                            status: JobStatus::DryRunCompleted,
                            total_deleted: 0,
                            eligible_for_deletion: retention_result.total_deleted,
                            duration_ms: retention_result.duration_ms,
                            dry_run: true,
                            band_results: retention_result.band_results,
                            ..Default::default()
                        });
                    }

                    // Perform post-pruning maintenance
                    self.perform_post_pruning_maintenance().await?;

                    Ok(PruningJobResult {
                        job_id: job_id.to_string(),
                        status: JobStatus::Completed,
                        total_deleted: retention_result.total_deleted,
                        eligible_for_deletion: retention_result.total_deleted,
                        duration_ms: retention_result.duration_ms,
                        dry_run: false,
                        band_results: retention_result.band_results,
                        start_time,
                        end_time: Some(Utc::now()),
                    })
                }

                async fn perform_post_pruning_maintenance(&self) -> Result<(), PruningError> {
                    let db = self.db.lock().await;

                    // Run VACUUM if significant space was reclaimed
                    // (This is a simplified version - real implementation would track space usage)
                    db.execute("PRAGMA optimize", [])?;

                    Ok(())
                }

                async fn get_last_job_execution(&self) -> Result<Option<DateTime<Utc>>, PruningError> {
                    let db = self.db.lock().await;

                    let mut stmt = db.prepare(
                        "SELECT end_time FROM pruning_job_history
                         WHERE status = 'COMPLETED'
                         ORDER BY end_time DESC LIMIT 1"
                    )?;

                    match stmt.query_row([], |row| {
                        let timestamp: i64 = row.get(0)?;
                        Ok(DateTime::<Utc>::from_utc(
                            chrono::NaiveDateTime::from_timestamp(timestamp / 1000, 0),
                            Utc
                        ))
                    }) {
                        Ok(dt) => Ok(Some(dt)),
                        Err(rusqlite::Error::QueryReturnedNoRows) => Ok(None),
                        Err(e) => Err(PruningError::Database(e.to_string())),
                    }
                }

                async fn get_active_job_count(&self) -> Result<usize, PruningError> {
                    let db = self.db.lock().await;

                    let count: i64 = db.query_row(
                        "SELECT COUNT(*) FROM pruning_job_history
                         WHERE status = 'RUNNING'",
                        [],
                        |row| row.get(0)
                    )?;

                    Ok(count as usize)
                }

                async fn record_job_execution_start(
                    &self,
                    job_id: &str,
                    start_time: DateTime<Utc>,
                ) -> Result<(), PruningError> {
                    let db = self.db.lock().await;

                    db.execute(
                        "INSERT INTO pruning_job_history (
                            job_id, status, start_time, dry_run
                        ) VALUES (?, 'RUNNING', ?, ?)",
                        rusqlite::params![
                            job_id,
                            start_time.timestamp_millis(),
                            self.config.dry_run_first
                        ]
                    )?;

                    Ok(())
                }

                async fn record_job_execution_end(
                    &self,
                    job_id: &str,
                    end_time: DateTime<Utc>,
                    success: bool,
                    receipts_deleted: usize,
                ) -> Result<(), PruningError> {
                    let db = self.db.lock().await;

                    let status = if success { "COMPLETED" } else { "FAILED" };

                    db.execute(
                        "UPDATE pruning_job_history
                         SET status = ?, end_time = ?, receipts_deleted = ?
                         WHERE job_id = ?",
                        rusqlite::params![
                            status,
                            end_time.timestamp_millis(),
                            receipts_deleted,
                            job_id
                        ]
                    )?;

                    Ok(())
                }

                async fn schedule_real_execution(
                    &self,
                    dry_run_job_id: &str,
                    start_time: DateTime<Utc>,
                ) -> Result<(), PruningError> {
                    // In a real implementation, this would schedule the actual job
                    // For now, just log the intention
                    println!("Scheduling real pruning execution after dry run {}", dry_run_job_id);
                    Ok(())
                }
            }

            #[derive(Debug, Default)]
            pub struct PruningJobResult {
                pub job_id: String,
                pub status: JobStatus,
                pub total_deleted: usize,
                pub eligible_for_deletion: usize,
                pub duration_ms: u64,
                pub dry_run: bool,
                pub band_results: std::collections::HashMap<PrivacyBand, BandRetentionResult>,
                pub start_time: DateTime<Utc>,
                pub end_time: Option<DateTime<Utc>>,
                pub reason: Option<String>,
            }

            #[derive(Debug, Default)]
            pub enum JobStatus {
                #[default]
                Pending,
                Running,
                Completed,
                DryRunCompleted,
                Failed,
                Skipped,
            }
          python: |
            import asyncio
            import uuid
            from datetime import datetime, timedelta
            from typing import Optional, Dict, Any
            import sqlite3
            from dataclasses import dataclass
            from enum import Enum

            class ScheduledPruningJob:
                """Scheduled job for automatic receipt pruning"""

                @dataclass
                class PruningJobConfig:
                    schedule_interval_hours: int = 1
                    max_concurrent_jobs: int = 1
                    retry_attempts: int = 3
                    retry_backoff_ms: int = 1000
                    dry_run_first: bool = True
                    notify_on_completion: bool = False

                def __init__(
                    self,
                    retention_engine: RetentionPolicyEngine,
                    db_connection,
                    metrics: PruningMetrics,
                    config: Optional[PruningJobConfig] = None
                ):
                    self.retention_engine = retention_engine
                    self.db = db_connection
                    self.metrics = metrics
                    self.config = config or self.PruningJobConfig()

                async def execute_pruning_job(
                    self,
                    job_id: Optional[str] = None,
                    force_run: bool = False
                ) -> 'PruningJobResult':
                    """Execute the scheduled pruning job"""
                    job_id = job_id or str(uuid.uuid4())
                    start_time = datetime.utcnow()

                    self.metrics.record_job_started(job_id)

                    # Check if job should run
                    if not force_run:
                        last_run = self._get_last_job_execution()
                        if last_run:
                            time_since_last = datetime.utcnow() - last_run
                            if time_since_last < timedelta(hours=self.config.schedule_interval_hours):
                                self.metrics.record_job_skipped(job_id, "too_soon")
                                return PruningJobResult(
                                    job_id=job_id,
                                    status=JobStatus.SKIPPED,
                                    reason="Last execution too recent"
                                )

                    # Check concurrent jobs
                    active_count = self._get_active_job_count()
                    if active_count >= self.config.max_concurrent_jobs:
                        self.metrics.record_job_skipped(job_id, "concurrent_limit")
                        return PruningJobResult(
                            job_id=job_id,
                            status=JobStatus.SKIPPED,
                            reason="Concurrent job limit reached"
                        )

                    # Record job start
                    self._record_job_execution_start(job_id, start_time)

                    try:
                        result = await self._execute_with_retry(job_id, start_time)
                        end_time = datetime.utcnow()
                        duration_ms = int((end_time - start_time).total_seconds() * 1000)

                        self._record_job_execution_end(job_id, end_time, True, result.total_deleted)
                        self.metrics.record_job_completed(job_id, duration_ms, result.total_deleted)

                        return result

                    except Exception as e:
                        end_time = datetime.utcnow()
                        duration_ms = int((end_time - start_time).total_seconds() * 1000)

                        self._record_job_execution_end(job_id, end_time, False, 0)
                        self.metrics.record_job_failed(job_id, duration_ms, str(e))

                        raise

                async def _execute_with_retry(self, job_id: str, start_time: datetime) -> 'PruningJobResult':
                    """Execute pruning with retry logic"""
                    last_error = None

                    for attempt in range(self.config.retry_attempts + 1):
                        if attempt > 0:
                            backoff_ms = self.config.retry_backoff_ms * (2 ** (attempt - 1))
                            await asyncio.sleep(backoff_ms / 1000)
                            self.metrics.record_job_retry(job_id, attempt)

                        try:
                            return await self._execute_pruning_attempt(
                                job_id, start_time, attempt == 0 and self.config.dry_run_first
                            )
                        except Exception as e:
                            last_error = e
                            if attempt < self.config.retry_attempts:
                                continue
                            raise last_error

                async def _execute_pruning_attempt(
                    self, job_id: str, start_time: datetime, dry_run: bool
                ) -> 'PruningJobResult':
                    """Execute a single pruning attempt"""
                    # Execute retention policy
                    retention_result = await self.retention_engine.execute_retention_policy(
                        start_time, dry_run
                    )

                    if dry_run and retention_result.total_deleted > 0:
                        # Schedule real execution
                        self._schedule_real_execution(job_id, start_time)
                        return PruningJobResult(
                            job_id=job_id,
                            status=JobStatus.DRY_RUN_COMPLETED,
                            total_deleted=0,
                            eligible_for_deletion=retention_result.total_deleted,
                            duration_ms=retention_result.duration_ms,
                            dry_run=True,
                            band_results=retention_result.band_results
                        )

                    # Perform post-pruning maintenance
                    await self._perform_post_pruning_maintenance()

                    return PruningJobResult(
                        job_id=job_id,
                        status=JobStatus.COMPLETED,
                        total_deleted=retention_result.total_deleted,
                        eligible_for_deletion=retention_result.total_deleted,
                        duration_ms=retention_result.duration_ms,
                        dry_run=False,
                        band_results=retention_result.band_results,
                        start_time=start_time,
                        end_time=datetime.utcnow()
                    )

                async def _perform_post_pruning_maintenance(self):
                    """Perform post-pruning database maintenance"""
                    cursor = self.db.cursor()
                    cursor.execute("PRAGMA optimize")

                def _get_last_job_execution(self) -> Optional[datetime]:
                    """Get timestamp of last successful job execution"""
                    cursor = self.db.cursor()
                    cursor.execute("""
                        SELECT end_time FROM pruning_job_history
                        WHERE status = 'COMPLETED'
                        ORDER BY end_time DESC LIMIT 1
                    """)
                    row = cursor.fetchone()
                    if row:
                        return datetime.fromtimestamp(row[0] / 1000)
                    return None

                def _get_active_job_count(self) -> int:
                    """Get number of currently running jobs"""
                    cursor = self.db.cursor()
                    cursor.execute("""
                        SELECT COUNT(*) FROM pruning_job_history
                        WHERE status = 'RUNNING'
                    """)
                    return cursor.fetchone()[0]

                def _record_job_execution_start(self, job_id: str, start_time: datetime):
                    """Record job execution start"""
                    cursor = self.db.cursor()
                    cursor.execute("""
                        INSERT INTO pruning_job_history (
                            job_id, status, start_time, dry_run
                        ) VALUES (?, 'RUNNING', ?, ?)
                    """, (job_id, int(start_time.timestamp() * 1000), self.config.dry_run_first))

                def _record_job_execution_end(
                    self, job_id: str, end_time: datetime, success: bool, receipts_deleted: int
                ):
                    """Record job execution end"""
                    cursor = self.db.cursor()
                    status = 'COMPLETED' if success else 'FAILED'
                    cursor.execute("""
                        UPDATE pruning_job_history
                        SET status = ?, end_time = ?, receipts_deleted = ?
                        WHERE job_id = ?
                    """, (status, int(end_time.timestamp() * 1000), receipts_deleted, job_id))

                def _schedule_real_execution(self, dry_run_job_id: str, start_time: datetime):
                    """Schedule real execution after dry run"""
                    print(f"Scheduling real pruning execution after dry run {dry_run_job_id}")

        performance_requirements:
          - execution_time: <5 seconds per job execution (P95)
          - scheduling_accuracy: ±5 minutes of scheduled time
          - retry_efficiency: <30 seconds total for failed jobs with retries
          - concurrent_safety: No conflicts between concurrent executions
        error_handling:
          - job_failure: Automatic retry with exponential backoff
          - concurrent_conflict: Skip execution if another job is running
          - database_error: Fail fast and retry on next scheduled run

      - name: get_job_history
        description: Get execution history for pruning jobs
        parameters:
          - name: limit
            type: int
            description: Maximum number of records to return
        returns:
          type: List[PruningJobResult]
          description: Historical job execution results
        implementation_notes: For monitoring and debugging job execution

    dependencies:
      - name: tokio::time
        description: Async timing for scheduling and retries
      - name: chrono
        description: Date/time handling for job scheduling
      - name: PruningMetrics
        description: Metrics collection for job execution

testing_requirements:
  - unit_tests:
      - scheduling_logic: Jobs execute at correct intervals
      - retry_behavior: Failed jobs retry with correct backoff
      - concurrent_limits: Concurrent execution limits enforced
      - dry_run_logic: Dry runs work correctly before real execution
  - integration_tests:
      - cron_integration: Jobs execute on schedule via cron
      - failure_recovery: Failed jobs recover on next scheduled run
      - concurrent_execution: Multiple schedulers don't conflict
  - performance_tests:
      - execution_time: Jobs complete within time budget
      - resource_usage: Memory/CPU usage stays within limits
      - scheduling_accuracy: Jobs run at precise intervals

observability:
  metrics:
    - name: pruning_jobs_started_total
      type: counter
      description: Total pruning jobs started
    - name: pruning_jobs_completed_total
      type: counter
      labels: [status]
      description: Total pruning jobs completed by status
    - name: pruning_job_duration_ms
      type: histogram
      buckets: [1000, 5000, 10000, 30000]
      description: Time taken for pruning job execution
    - name: pruning_job_retries_total
      type: counter
      description: Total pruning job retries
    - name: pruning_jobs_skipped_total
      type: counter
      labels: [reason]
      description: Total pruning jobs skipped by reason

alerting_rules:
  - name: PruningJobFailed
    condition: pruning_jobs_completed_total{status="FAILED"} > 0
    severity: error
    description: Pruning job execution failed
    runbook: Check job logs, database connectivity, retry configuration

  - name: PruningJobDurationHigh
    condition: histogram_quantile(0.95, rate(pruning_job_duration_ms_bucket[5m])) > 5000
    severity: warning
    description: Pruning jobs exceeding 5s budget
    runbook: Check database performance, consider job tuning

  - name: PruningJobsSkippedHigh
    condition: rate(pruning_jobs_skipped_total[1h]) > 1
    severity: warning
    description: Pruning jobs being skipped frequently
    runbook: Check concurrent job limits, scheduling conflicts

compliance:
  - gdpr: Article 30 (automated processing record retention)
  - soc2: CC7.2 (automated system monitoring and maintenance)