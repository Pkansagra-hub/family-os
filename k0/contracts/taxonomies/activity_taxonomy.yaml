# Activity Taxonomy - Hierarchical Classification System
#
# Research Foundation:
# - Yin et al. (2019) - Zero-shot text classification
# - Lewis et al. (2020) - BART: Denoising Sequence-to-Sequence Pre-training
# - Time Use Survey (Bureau of Labor Statistics) - Activity categories
#
# Design Philosophy:
# - 3-level hierarchy: category → activity → subtype
# - 50+ activity types in hierarchy (vs 7 hardcoded)
# - Extensible without code changes
# - Compatible with zero-shot classification labels
#
# Contract: k0/contracts/taxonomies/activity_taxonomy.yaml
# ADR: docs/architecture/decisions-K0/modules/k007.4-activity-taxonomy.md

