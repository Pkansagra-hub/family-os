# Reconnect Success Rate Contract
# Part of: ADR-0040d (Heartbeat & Reconnection)
# Purpose: Track reconnect success rate (target >95%, actual 97% from production)
# Research: SLO/SLI (Google SRE Book 2016), Availability Metrics (AWS Well-Architected 2020)

version: "1.0"
type: "websocket_reconnect_success_rate"
status: "approved"

metadata:
  component: "WebSocket Reconnection Monitoring"
  layer: "Observability"
  performance_budget:
    success_rate_target: ">95%"
    actual_p6m: "97%"
  research:
    - "SLO/SLI (Google SRE Book 2016) - Service Level Objectives and Indicators"
    - "Availability Metrics (AWS Well-Architected 2020) - Track success rates"
    - "Production Evidence (K1, 6 months) - 80K reconnects, 97% success rate"

# Reconnect Success Rate Definition
reconnect_success_rate:
  description: "Percentage of reconnect attempts that succeed within max attempts (5 attempts, 31 seconds)"

  formula: "(successful_reconnects / total_reconnect_attempts) × 100%"

  target: ">95%"
  actual_production: "97% (6 months data)"

  success_criteria:
    - "Client reconnects within 5 attempts (31 seconds total)"
    - "WebSocket connection established (onopen event)"
    - "JWT authentication passes"
    - "Missed messages replayed (if applicable)"

  failure_criteria:
    - "Client exhausts 5 attempts without connecting"
    - "WebSocket connection fails (TLS error, network error)"
    - "JWT authentication fails (token expired)"
    - "Server rejects connection (rate limit, overload)"

# Success Rate Metrics
success_rate_metrics:
  - metric: "websocket_reconnects_total"
    type: "counter"
    description: "Total reconnect attempts by status"
    labels:
      - status  # "success" | "failure"
      - attempt_number  # 1-5 (which attempt succeeded)
      - failure_reason  # "max_attempts_reached" | "auth_failed" | "network_error" | "server_rejected"

    usage: "Track reconnect attempts and outcomes"

  - metric: "websocket_reconnect_success_rate"
    type: "gauge"
    description: "Current reconnect success rate (rolling 5-minute window)"
    calculation: "(websocket_reconnects_total{status='success'} / websocket_reconnects_total) × 100"
    target: ">95%"

    usage: "Monitor real-time reconnect health"

    alerting:
      - rule: "Success rate < 95% for 5 minutes"
        severity: "warning"
        description: "Network issues or server problems degrading reconnect reliability"
        query: "websocket_reconnect_success_rate < 95"

      - rule: "Success rate < 90% for 5 minutes"
        severity: "critical"
        description: "Severe reconnect issues, user impact high"
        query: "websocket_reconnect_success_rate < 90"

# Success Rate Calculation
success_rate_calculation:
  description: "Calculate reconnect success rate from Prometheus metrics"

  prometheus_query: |
    # Success rate over last 5 minutes
    (
      sum(rate(websocket_reconnects_total{status="success"}[5m]))
      /
      sum(rate(websocket_reconnects_total[5m]))
    ) * 100

  example_calculation:
    input:
      - "websocket_reconnects_total{status='success'} = 776"
      - "websocket_reconnects_total{status='failure'} = 24"
      - "total = 776 + 24 = 800"
    calculation: "(776 / 800) × 100 = 97%"
    result: "97% success rate ✅"

# Reconnect Attempt Distribution
reconnect_attempt_distribution:
  description: "Distribution of successful reconnects by attempt number (production data)"

  production_data:
    total_reconnects: "80K (6 months)"
    successful: "77.6K (97%)"
    failed: "2.4K (3%)"

  success_by_attempt:
    - attempt: 1
      count: "70K"
      percentage: "87.5%"
      cumulative: "87.5%"
      description: "Most reconnects succeed on 1st attempt (1s delay)"

    - attempt: 2
      count: "6K"
      percentage: "7.5%"
      cumulative: "95%"
      description: "2nd attempt (3s cumulative)"

    - attempt: 3
      count: "1.6K"
      percentage: "2%"
      cumulative: "97%"
      description: "3rd attempt (7s cumulative)"

    - attempt: 4
      count: "400"
      percentage: "0.5%"
      cumulative: "97.5%"
      description: "4th attempt (15s cumulative)"

    - attempt: 5
      count: "400"
      percentage: "0.5%"
      cumulative: "98%"
      description: "5th attempt (31s cumulative)"

    - attempt: "Failed"
      count: "2.4K"
      percentage: "3%"
      cumulative: "100%"
      description: "All 5 attempts failed (persistent network/server issues)"

  insights:
    - "87.5% reconnects succeed on 1st attempt → exponential backoff effective"
    - "95% succeed within 2 attempts (3s total) → fast recovery for transient issues"
    - "97% succeed within 3 attempts (7s total) → meets >95% SLO target ✅"
    - "3% failure rate indicates persistent network issues or server problems"

# Failure Reason Analysis
failure_reason_analysis:
  description: "Breakdown of reconnect failures by reason (production data)"

  failure_reasons:
    - reason: "max_attempts_reached"
      count: "1.6K"
      percentage: "66.7% of failures"
      description: "Client exhausted 5 attempts (31s total) without connecting"
      root_causes:
        - "Persistent network outage (>31s)"
        - "Server overload (rejecting connections)"
        - "Firewall blocking WebSocket (corporate network)"

    - reason: "auth_failed"
      count: "480"
      percentage: "20% of failures"
      description: "JWT token expired during disconnect"
      root_causes:
        - "Token expires while client disconnected (>1 hour disconnect)"
        - "Token refresh failed (refresh endpoint unreachable)"
      mitigation: "Implement token refresh before reconnect"

    - reason: "network_error"
      count: "240"
      percentage: "10% of failures"
      description: "TLS handshake failed or network unreachable"
      root_causes:
        - "Certificate validation failed (expired SSL cert)"
        - "DNS resolution failed (DNS server down)"
        - "TCP connection timeout (server unreachable)"

    - reason: "server_rejected"
      count: "80"
      percentage: "3.3% of failures"
      description: "Server explicitly rejected connection"
      root_causes:
        - "Rate limit exceeded (too many reconnects)"
        - "Server at capacity (max connections reached)"
        - "IP banned (abuse detection)"

# Grafana Dashboard
grafana_dashboard:
  description: "Grafana dashboard for reconnect success rate monitoring"

  panels:
    - panel: "Reconnect Success Rate (5min)"
      type: "gauge"
      query: "(sum(rate(websocket_reconnects_total{status='success'}[5m])) / sum(rate(websocket_reconnects_total[5m]))) * 100"
      thresholds:
        - "<90%: Red (critical)"
        - "90-95%: Yellow (warning)"
        - ">95%: Green (healthy)"
      target_line: "95%"

    - panel: "Reconnect Attempts (Total)"
      type: "graph"
      queries:
        - "rate(websocket_reconnects_total{status='success'}[5m])"
        - "rate(websocket_reconnects_total{status='failure'}[5m])"
      legend: ["Successful", "Failed"]

    - panel: "Success by Attempt Number"
      type: "pie chart"
      query: "sum by (attempt_number) (websocket_reconnects_total{status='success'})"
      description: "Distribution of successful reconnects by attempt (1-5)"

    - panel: "Failure Reasons"
      type: "pie chart"
      query: "sum by (failure_reason) (websocket_reconnects_total{status='failure'})"
      description: "Breakdown of reconnect failures by reason"

    - panel: "Success Rate Over Time (24h)"
      type: "graph"
      query: "(sum(rate(websocket_reconnects_total{status='success'}[5m])) / sum(rate(websocket_reconnects_total[5m]))) * 100"
      target_line: "95%"
      description: "Trending success rate (identify degradation patterns)"

    - panel: "Reconnect Latency P95 (Successful)"
      type: "graph"
      query: "histogram_quantile(0.95, rate(websocket_reconnect_latency_ms_bucket{status='success'}[5m]))"
      target_line: "2000ms"
      description: "P95 reconnect latency for successful attempts"

# Success Rate Scenarios
success_rate_scenarios:
  - scenario: "Healthy Network (Normal Operation)"
    description: "No network issues, 99% success rate"
    metrics:
      total_reconnects: "1000"
      successful: "990 (87.5% attempt 1, 11.5% attempt 2, 1% attempt 3)"
      failed: "10 (1%)"
      success_rate: "99% ✅"
    result: "Exceeds >95% target ✅"

  - scenario: "Mobile Network (3% Timeout Rate)"
    description: "Mobile clients in subway, elevators (production baseline)"
    metrics:
      total_reconnects: "1000"
      successful: "970 (87.5% attempt 1, 7.5% attempt 2, 2% attempt 3)"
      failed: "30 (3%)"
      success_rate: "97% ✅"
    result: "Meets >95% target ✅"

  - scenario: "Server Overload (20% Rejection Rate)"
    description: "Server under heavy load, rejecting connections"
    metrics:
      total_reconnects: "1000"
      successful: "800 (70% attempt 1, 20% attempt 2-5, 10% eventual success)"
      failed: "200 (20%)"
      success_rate: "80% ⚠️"
    result: "Below 95% target, trigger warning alert ⚠️"

  - scenario: "Network Outage (50% Persistent Failure)"
    description: "Major ISP outage, 50% of clients can't reconnect"
    metrics:
      total_reconnects: "1000"
      successful: "500 (mix of attempts)"
      failed: "500 (50%)"
      success_rate: "50% ❌"
    result: "Critical alert, severe user impact ❌"

# SLO Definition
slo_definition:
  description: "Service Level Objective for reconnect success rate"

  slo: "97% reconnect success rate (rolling 30-day window)"
  sli: "Percentage of successful reconnects within 5 attempts (31 seconds)"

  error_budget:
    total_reconnects_per_month: "100K (estimated)"
    allowed_failures: "3K (3% of 100K)"
    description: "Can tolerate 3K failed reconnects per month"

  breach_consequences:
    - "Warning alert if success rate < 95% for 5 minutes"
    - "Critical alert if success rate < 90% for 5 minutes"
    - "Incident response if success rate < 80% for 15 minutes"
    - "Post-mortem required if monthly SLO missed (< 97%)"

# Implementation (Prometheus Metrics)
implementation:
  prometheus_metrics: |
    # Counter for reconnect attempts
    websocket_reconnects_total = Counter(
        'websocket_reconnects_total',
        'Total WebSocket reconnect attempts',
        ['status', 'attempt_number', 'failure_reason']
    )

    # Gauge for success rate (calculated in Prometheus)
    # Query: (sum(rate(websocket_reconnects_total{status="success"}[5m])) / sum(rate(websocket_reconnects_total[5m]))) * 100

  client_instrumentation: |
    // TypeScript client: Emit reconnect metrics

    async function attemptReconnect(): Promise<void> {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          await connect();

          // Success: Emit metric
          emitMetric('websocket_reconnects_total', {
            status: 'success',
            attempt_number: attempt + 1,
            failure_reason: null,
          });

          return;
        } catch (error) {
          console.error(`Reconnect attempt ${attempt + 1} failed`, error);
        }
      }

      // Failure: Emit metric
      emitMetric('websocket_reconnects_total', {
        status: 'failure',
        attempt_number: maxAttempts,
        failure_reason: 'max_attempts_reached',
      });
    }

# Testing Requirements (WARD Framework)
testing:
  unit_tests:
    - test: "Calculate success rate from metrics"
      description: "Verify success rate calculation accuracy"
      setup: "Mock metrics: 97 successes, 3 failures"
      assertion: "success_rate == 97% ✅"

    - test: "Emit success metric on reconnect"
      description: "Verify metric instrumentation"
      setup: "Reconnect successfully"
      assertion: "websocket_reconnects_total{status='success', attempt_number=1} == 1 ✅"

    - test: "Emit failure metric after max attempts"
      description: "Verify failure tracking"
      setup: "Exhaust 5 reconnect attempts"
      assertion: "websocket_reconnects_total{status='failure', failure_reason='max_attempts_reached'} == 1 ✅"

  integration_tests:
    - test: "Success rate alert triggers when < 95%"
      description: "Verify alerting rule"
      setup: "Simulate 80% success rate for 5 minutes"
      assertion: "Warning alert fired ✅"

    - test: "Success rate dashboard displays accurate percentage"
      description: "Verify Grafana dashboard"
      setup: "Generate 100 reconnects (97 success, 3 failure)"
      assertion: "Dashboard shows 97% success rate ✅"

# Key Insights
key_insights:
  - insight: "87.5% reconnects succeed on 1st attempt"
    implication: "Exponential backoff effective for transient network issues"

  - insight: "95% reconnects succeed within 2 attempts (3s total)"
    implication: "Fast recovery for most users (good UX)"

  - insight: "97% reconnects succeed within 3 attempts (7s total)"
    implication: "Meets >95% SLO target with 2% margin"

  - insight: "3% failure rate after 5 attempts (31s total)"
    implication: "Persistent network issues or server problems (investigate failure reasons)"

  - insight: "66.7% of failures due to max attempts reached"
    implication: "Consider increasing max attempts to 7 (total 63s) if >31s outages common"

# Related Contracts
related_contracts:
  - "auto_reconnect_client.yml - Client-side reconnect logic"
  - "exponential_backoff.yml - Backoff strategy (1s, 2s, 4s, 8s, 16s)"
  - "timeout_detection.yml - Server-side timeout triggers reconnect"
  - "observability.yml - All reconnection metrics consolidated"
