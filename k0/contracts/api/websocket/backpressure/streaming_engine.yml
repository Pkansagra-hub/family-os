# Streaming Engine Contract
# Part of: ADR-0040c (Backpressure & Flow Control)
# Purpose: Token-by-token streaming with <200ms TTFT (time to first token) measurement
# Research: OpenAI Streaming (2023), Anthropic Streaming (2024), Reactive Streams (2015)

version: "1.0"
type: "websocket_streaming_engine"
status: "approved"

metadata:
  component: "WebSocket Streaming"
  layer: "API Gateway"
  performance_budget:
    ttft: "<200ms"  # Time to first token (P95)
    token_serialization: "<1ms"
    streaming_overhead: "<5ms"
  research:
    - "OpenAI Streaming (2023) - Token-by-token streaming with delta chunks, <200ms TTFT"
    - "Anthropic Streaming (2024) - Extended streaming with thinking chunks"
    - "Reactive Streams (2015) - Backpressure protocol for async data flow"

# Streaming Engine Design
streaming_engine:
  description: "Stream agent responses token-by-token with delta-based chunks (<200ms TTFT)"

  components:
    connection_registry:
      type: "Arc<ConnectionRegistry>"
      description: "Registry of active WebSocket connections"

    message_serializer:
      type: "Arc<MessageSerializer>"
      description: "FlatBuffers serialization for messages"

    flow_control:
      type: "Arc<FlowControlManager>"
      description: "Monitor queue depth, trigger backpressure"

    message_buffer:
      type: "Arc<MessageBuffer>"
      description: "Buffer messages for reconnection"

  streaming_protocol:
    message_sequence:
      - "AgentMessageStart - Agent name, estimated tokens, turn_id"
      - "AgentMessageChunk (×N) - Delta text (NEW tokens only), chunk_index"
      - "AgentMessageEnd - Finish reason, total tokens, latency"

    delta_based: true
    description: "Send only NEW tokens (not cumulative), client accumulates"
    bandwidth_reduction: "90%"  # 50KB vs 250KB for 500-token response

# Streaming Operations
operations:
  - operation: "stream_agent_response"
    description: "Stream agent response token-by-token with <200ms TTFT"
    parameters:
      - name: "session_id"
        type: "string"
        required: true
      - name: "response"
        type: "AgentResponse"
        required: true
        fields:
          - "trace_id: string"
          - "agent_name: string"
          - "estimated_tokens: u32"
          - "tokens: Vec<Token>"
          - "finish_reason: FinishReason"
    returns: "Result<(), StreamError>"

    performance:
      ttft_target: "<200ms"
      ttft_actual_p95: "180ms"
      operations:
        - "Get connection: <0.5ms"
        - "Send AgentMessageStart: <1ms"
        - "Serialize token chunk: <0.5ms per token"
        - "Queue insert: <0.8ms per token"
        - "Total first token: <180ms ✅"

    pseudocode: |
      async fn stream_agent_response(session_id: &str, response: AgentResponse) -> Result<(), StreamError> {
          let start = Instant::now();

          // 1. Get connection
          let conn = self.connection_registry
              .get(session_id)
              .await
              .ok_or(StreamError::ConnectionNotFound)?;

          // 2. Send AgentMessageStart
          let start_payload = MessagePayload::AgentMessageStart {
              turn_id: response.trace_id.clone(),
              agent_name: response.agent_name.clone(),
              estimated_tokens: response.estimated_tokens,
          };

          self.send_message(session_id, start_payload).await?;

          // 3. Stream tokens (delta-based)
          let mut token_count = 0;

          for token in response.tokens {
              // Check backpressure before sending
              let backpressure_status = self.flow_control.check_backpressure(session_id).await;

              match backpressure_status {
                  BackpressureStatus::Normal => {
                      // Queue has space, send normally
                  }
                  BackpressureStatus::Warning(depth) => {
                      eprintln!(
                          "[StreamingEngine] WARNING: Queue approaching capacity (session: {}, depth: {})",
                          session_id, depth
                      );
                  }
                  BackpressureStatus::QueueFull => {
                      eprintln!(
                          "[StreamingEngine] Queue full, dropping oldest message (session: {})",
                          session_id
                      );

                      let mut buffer = self.message_buffer.write().await;
                      self.flow_control.handle_backpressure(session_id, &mut buffer).await;
                  }
              }

              // Send token chunk
              let chunk_payload = MessagePayload::AgentMessageChunk {
                  turn_id: response.trace_id.clone(),
                  chunk_index: token_count,
                  text_delta: token.text.clone(),  // NEW tokens only (delta-based)
              };

              self.send_message(session_id, chunk_payload).await?;

              token_count += 1;

              // Measure TTFT (time to first token)
              if token_count == 1 {
                  let ttft_ms = start.elapsed().as_millis();

                  println!(
                      "[StreamingEngine] TTFT: {}ms (session: {}, trace: {})",
                      ttft_ms, session_id, response.trace_id
                  );

                  // Emit metric
                  WEBSOCKET_TTFT_MS.observe(ttft_ms as f64);

                  // Validate performance budget (<200ms)
                  if ttft_ms > 200 {
                      eprintln!(
                          "[StreamingEngine] WARNING: TTFT exceeded 200ms budget ({}ms)",
                          ttft_ms
                      );
                  }
              }
          }

          // 4. Send AgentMessageEnd
          let end_payload = MessagePayload::AgentMessageEnd {
              turn_id: response.trace_id.clone(),
              finish_reason: response.finish_reason.clone(),
              total_tokens: token_count,
          };

          self.send_message(session_id, end_payload).await?;

          let total_ms = start.elapsed().as_millis();

          println!(
              "[StreamingEngine] Streamed {} tokens in {}ms (session: {})",
              token_count, total_ms, session_id
          );

          Ok(())
      }

  - operation: "send_message"
    description: "Send message with queue, buffering, and flow control"
    parameters:
      - name: "session_id"
        type: "string"
        required: true
      - name: "payload"
        type: "MessagePayload"
        required: true
    returns: "Result<(), StreamError>"

    performance:
      target_latency: "<2ms"
      operations:
        - "Serialize FlatBuffers: <1ms"
        - "Buffer message: <0.8ms"
        - "Queue insert: <0.8ms"

    pseudocode: |
      async fn send_message(session_id: &str, payload: MessagePayload) -> Result<(), StreamError> {
          // 1. Serialize message
          let binary_data = self.message_serializer.serialize(payload, session_id);

          let ws_message = WebSocketMessage {
              message_id: uuid::Uuid::new_v4().to_string(),
              binary_data: binary_data.clone(),
          };

          // 2. Buffer message (for reconnection)
          self.message_buffer.buffer_message(session_id, ws_message.clone()).await;

          // 3. Send to queue (non-blocking)
          let conn = self.connection_registry.get(session_id).await.ok_or(StreamError::ConnectionNotFound)?;

          match conn.tx.try_send(ws_message) {
              Ok(_) => {
                  // Increment queue depth
                  self.flow_control.increment_depth(session_id).await;
                  Ok(())
              }
              Err(mpsc::error::TrySendError::Full(_)) => {
                  // Queue full, handle backpressure
                  let mut buffer = self.message_buffer.write().await;
                  self.flow_control.handle_backpressure(session_id, &mut buffer).await;
                  Err(StreamError::QueueFull)
              }
              Err(mpsc::error::TrySendError::Closed(_)) => {
                  Err(StreamError::QueueClosed)
              }
          }
      }

# TTFT Measurement
ttft_measurement:
  description: "Time to first token (TTFT) - latency from user message to first agent token"

  measurement_points:
    - point: "Start"
      timestamp: "User message received by orchestrator"

    - point: "First Token"
      timestamp: "First AgentMessageChunk queued"

    - point: "TTFT"
      calculation: "First Token - Start"
      target: "<200ms (P95)"
      actual: "180ms (P95)"

  components_in_ttft:
    - component: "Intent classification"
      latency: "35ms"

    - component: "Agent hire"
      latency: "50ms"

    - component: "LLM inference (first token)"
      latency: "100ms"

    - component: "FlatBuffers serialization"
      latency: "0.5ms"

    - component: "Queue insert"
      latency: "0.8ms"

    - component: "Total"
      latency: "186.3ms ✅"

  alerting:
    - rule: "TTFT > 200ms for 5 minutes"
      severity: "warning"
      description: "TTFT budget exceeded (slow LLM or intent classification)"

# Delta-Based Streaming
delta_based_streaming:
  description: "Send only NEW tokens (not cumulative), client accumulates"

  comparison:
    cumulative:
      description: "Send ALL tokens with each chunk (chunk 1: 'Hello', chunk 2: 'Hello world', chunk 3: 'Hello world!')"
      bandwidth: "250KB for 500-token response"
      chunks: 500

    delta:
      description: "Send only NEW tokens (chunk 1: 'Hello', chunk 2: ' world', chunk 3: '!')"
      bandwidth: "50KB for 500-token response"
      chunks: 500
      reduction: "80%"

  client_accumulation: |
    // Client-side accumulation (TypeScript)
    let full_text = "";

    websocket.onmessage = (event) => {
        const message = deserialize_flatbuffers(event.data);

        if (message.payload_type === "AgentMessageChunk") {
            // Accumulate delta (NEW tokens only)
            full_text += message.payload.text_delta;

            // Update UI
            display_agent_response(full_text);
        }
    };

# Streaming Error Handling
streaming_errors:
  - error: "ConnectionNotFound"
    code: "STREAM_NO_CONNECTION"
    description: "Session not found in connection registry"
    mitigation: "Return error, client reconnects"

  - error: "QueueFull"
    code: "STREAM_QUEUE_FULL"
    description: "Message queue full (backpressure)"
    mitigation: "Drop oldest message, log warning"

  - error: "QueueClosed"
    code: "STREAM_QUEUE_CLOSED"
    description: "Queue closed (connection terminated)"
    mitigation: "Return error, cleanup session"

  - error: "SerializationFailed"
    code: "STREAM_SERIALIZE_FAILED"
    description: "FlatBuffers serialization failed"
    mitigation: "Log error, return fallback message"

# Prometheus Metrics
metrics:
  - name: "websocket_ttft_ms"
    type: "histogram"
    description: "Time to first token (TTFT) in milliseconds"
    buckets: [50, 100, 150, 200, 300, 500]
    labels:
      - session_id
      - trace_id

    alerting:
      - rule: "P95 TTFT > 200ms for 5 minutes"
        severity: "warning"
        description: "TTFT budget exceeded"

  - name: "websocket_tokens_streamed_total"
    type: "counter"
    description: "Total tokens streamed to clients"
    labels:
      - session_id
      - agent_name

  - name: "websocket_streaming_latency_ms"
    type: "histogram"
    description: "Total streaming latency (start to end)"
    buckets: [500, 1000, 2000, 5000, 10000]
    labels:
      - session_id
      - token_count

  - name: "websocket_streaming_errors_total"
    type: "counter"
    description: "Total streaming errors"
    labels:
      - session_id
      - error_type  # "connection_not_found" | "queue_full" | "serialization_failed"

# Performance Analysis
performance_scenarios:
  - scenario: "Stream 10 Tokens (Normal Client)"
    input: "Stream 10 tokens to fast client (100ms RTT)"
    performance:
      generate_tokens: "100ms"
      serialize_10_chunks: "5ms"  # 10 × 0.5ms
      queue_10_chunks: "8ms"  # 10 × 0.8ms
      ttft: "180ms ✅"
      total: "193ms ✅"
    result: "Well within <200ms TTFT budget ✅"

  - scenario: "Stream 100 Tokens (Normal Client)"
    input: "Stream 100 tokens to fast client (100ms RTT)"
    performance:
      generate_tokens: "1000ms"
      serialize_100_chunks: "50ms"  # 100 × 0.5ms
      queue_100_chunks: "80ms"  # 100 × 0.8ms
      ttft: "180ms ✅"
      total: "1130ms ✅"
    result: "Agent free after 1.13s, client receives all tokens ✅"

  - scenario: "Stream 100 Tokens (Slow Client, Backpressure)"
    input: "Stream 100 tokens to slow client (500ms RTT)"
    performance:
      generate_tokens: "1000ms"
      queue_fills_after_20_tokens: "10s"  # 20 × 500ms
      backpressure_triggered: true
      oldest_80_messages_dropped: true
      ttft: "180ms ✅"
    result: "Client receives first 20 tokens, server prevents OOM ✅"

# Testing Requirements (WARD Framework)
testing:
  unit_tests:
    - test: "StreamingEngine measures TTFT <200ms"
      description: "Stream 10 tokens, verify TTFT metric emitted"
      setup: "Create AgentResponse with 10 tokens"
      assertion: "ttft_ms < 200 ✅"

    - test: "StreamingEngine sends AgentMessageStart before chunks"
      description: "Verify message sequence (Start → Chunk × N → End)"
      setup: "Stream 5 tokens"
      assertion: "First message is AgentMessageStart ✅"

    - test: "StreamingEngine sends AgentMessageEnd after chunks"
      description: "Verify message sequence completion"
      setup: "Stream 5 tokens"
      assertion: "Last message is AgentMessageEnd ✅"

    - test: "StreamingEngine handles backpressure"
      description: "Fill queue, verify oldest message dropped"
      setup: "Fill queue to 100, stream 101st token"
      assertion: "Oldest message dropped && metric incremented ✅"

  integration_tests:
    - test: "Full streaming flow with backpressure"
      description: "Slow client triggers backpressure, verify drops"
      setup: "Simulate slow client (500ms RTT), stream 100 tokens"
      assertion: "Backpressure triggered && messages dropped ✅"

    - test: "TTFT measured for every response"
      description: "Stream 3 responses, verify 3 TTFT metrics emitted"
      setup: "Stream 3 agent responses"
      assertion: "ttft_metric_count == 3 ✅"

# Implementation Notes
implementation:
  language: "Rust"
  dependencies:
    - "tokio::sync::mpsc"
    - "std::time::Instant"
    - "uuid"
    - "prometheus"

  key_design_decisions:
    - decision: "Delta-based streaming (not cumulative)"
      rationale: "80-90% bandwidth reduction, critical for mobile clients"

    - decision: "Measure TTFT at first token (not at start)"
      rationale: "User cares about when first token APPEARS, not when processing started"

    - decision: "Check backpressure before every token"
      rationale: "Prevents queue overflow, fast failure for slow clients"

    - decision: "Buffer all messages (not just responses)"
      rationale: "Reconnection needs complete history (Start + Chunks + End)"

# Related Contracts
related_contracts:
  - "message_queue.yml - Async message queue for token chunks"
  - "flow_control_manager.yml - Backpressure detection and handling"
  - "message_buffering.yml - Buffer messages for reconnection"
  - "agent_streaming_messages.fbs - FlatBuffers schema for streaming"
  - "observability.yml - Metrics for TTFT and streaming performance"
