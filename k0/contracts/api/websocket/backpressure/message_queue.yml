# Message Queue Contract
# Part of: ADR-0040c (Backpressure & Flow Control)
# Purpose: Async message queue for WebSocket messages using mpsc channel (bounded, 100 capacity)
# Research: SEDA (Welsh et al. 2001), Bounded Queues (Lamport 1974), Reactive Streams (2015)

version: "1.0"
type: "websocket_message_queue"
status: "approved"

metadata:
  component: "WebSocket Backpressure"
  layer: "API Gateway"
  performance_budget:
    queue_insert: "<1ms"
    queue_read: "<1ms"
    capacity: 100
  research:
    - "SEDA (Welsh et al. 2001) - Staged event-driven architecture with bounded queues"
    - "Bounded Queues (Lamport 1974) - Finite capacity prevents unbounded memory growth"
    - "Reactive Streams (2015) - Backpressure protocol for async data flow"

# Message Queue Design
message_queue:
  description: "Async message queue decouples agent generation from WebSocket send (prevents blocking)"
  channel_type: "mpsc"  # Multi-producer single-consumer
  capacity: 100
  blocking_behavior: "non-blocking"

  properties:
    bounded: true
    fifo_order: true
    thread_safe: true
    async_operations: true

  operations:
    - operation: "send"
      description: "Send message to queue (non-blocking, <1ms)"
      parameters:
        - name: "message"
          type: "WebSocketMessage"
          required: true
        - name: "session_id"
          type: "string"
          required: true

      performance:
        target_latency: "<1ms"
        actual_p95: "0.8ms"

      error_handling:
        - error: "QueueFull"
          description: "Queue at capacity (100 messages)"
          mitigation: "Trigger backpressure handling (drop oldest message)"
        - error: "QueueClosed"
          description: "Queue closed (connection terminated)"
          mitigation: "Return error, log warning"

      pseudocode: |
        async fn send(message: WebSocketMessage) -> Result<(), QueueError> {
            let start = Instant::now();

            // Try send (non-blocking)
            match self.tx.try_send(message) {
                Ok(_) => {
                    let send_ms = start.elapsed().as_millis();

                    // Emit metric
                    WEBSOCKET_QUEUE_INSERT_LATENCY_MS.observe(send_ms);

                    // Validate performance budget (<1ms)
                    if send_ms > 1 {
                        eprintln!("WARNING: Queue insert exceeded 1ms budget ({}ms)", send_ms);
                    }

                    Ok(())
                }
                Err(TrySendError::Full(_)) => {
                    Err(QueueError::QueueFull)
                }
                Err(TrySendError::Closed(_)) => {
                    Err(QueueError::QueueClosed)
                }
            }
        }

    - operation: "recv"
      description: "Receive message from queue (blocking, <1ms)"
      returns: "Option<WebSocketMessage>"

      performance:
        target_latency: "<1ms"
        actual_p95: "0.8ms"

      pseudocode: |
        async fn recv() -> Option<WebSocketMessage> {
            let start = Instant::now();

            let message = self.rx.recv().await;

            let recv_ms = start.elapsed().as_millis();

            // Emit metric
            WEBSOCKET_QUEUE_READ_LATENCY_MS.observe(recv_ms);

            message
        }

    - operation: "depth"
      description: "Get current queue depth (approximate, maintained externally)"
      returns: "usize"
      note: "mpsc doesn't expose depth, use FlowControlManager counter"

# Queue Error Types
queue_errors:
  - name: "QueueFull"
    code: "QUEUE_FULL"
    description: "Queue at capacity (100 messages), backpressure triggered"
    http_status: 503
    mitigation: "Drop oldest message (FIFO), warn user about slow connection"

  - name: "QueueClosed"
    code: "QUEUE_CLOSED"
    description: "Queue closed (connection terminated)"
    http_status: 410
    mitigation: "Return error, cleanup connection"

# Background Task: Queue → WebSocket Delivery
background_task:
  name: "QueueDeliveryTask"
  description: "Background task reads from queue and sends to WebSocket (decouples generation from send)"

  pseudocode: |
    async fn queue_delivery_task(session_id: String, rx: Receiver<WebSocketMessage>, websocket: WebSocketStream) {
        while let Some(message) = rx.recv().await {
            // Serialize to FlatBuffers
            let binary_data = serialize_flatbuffers(message);

            // Send to WebSocket
            match websocket.send(Message::Binary(binary_data)).await {
                Ok(_) => {
                    // Decrement queue depth
                    flow_control.decrement_depth(&session_id).await;

                    WEBSOCKET_MESSAGES_SENT_TOTAL.inc();
                }
                Err(e) => {
                    eprintln!("WebSocket send failed: {}", e);
                    break;
                }
            }
        }
    }

# Prometheus Metrics
metrics:
  - name: "websocket_queue_insert_latency_ms"
    type: "histogram"
    description: "Queue insert latency in milliseconds"
    buckets: [0.1, 0.5, 1.0, 5.0]
    labels:
      - session_id

  - name: "websocket_queue_read_latency_ms"
    type: "histogram"
    description: "Queue read latency in milliseconds"
    buckets: [0.1, 0.5, 1.0, 5.0]
    labels:
      - session_id

  - name: "websocket_messages_sent_total"
    type: "counter"
    description: "Total messages sent to WebSocket"
    labels:
      - session_id
      - message_type

# Performance Analysis
performance_scenarios:
  - scenario: "Queue Insert (Non-Blocking)"
    input: "Send message to queue"
    performance:
      try_send_call: "0.8ms"
      total: "0.8ms ✅"
    result: "Well within <1ms budget ✅"

  - scenario: "Queue Read (Blocking)"
    input: "Receive message from queue"
    performance:
      recv_call: "0.8ms"
      total: "0.8ms ✅"
    result: "Well within <1ms budget ✅"

  - scenario: "Queue Full (Backpressure)"
    input: "Send message when queue at 100 capacity"
    performance:
      try_send_call: "0.5ms"
      error_returned: "QueueFull"
      total: "0.5ms ✅"
    result: "Fast failure, trigger backpressure handling ✅"

# Testing Requirements (WARD Framework)
testing:
  unit_tests:
    - test: "MessageQueue sends message to queue"
      description: "Verify non-blocking send succeeds"
      assertion: "result.is_ok() ✅"

    - test: "MessageQueue returns QueueFull when capacity reached"
      description: "Fill queue to 100, verify 101st message fails"
      setup: "Fill queue with 100 messages"
      assertion: "result.is_err() && result.error == QueueError::QueueFull ✅"

    - test: "MessageQueue recv returns message"
      description: "Send message, verify recv returns it"
      assertion: "message.is_some() ✅"

  integration_tests:
    - test: "Background task sends messages from queue to WebSocket"
      description: "Verify queue → WebSocket delivery works"
      setup: "Create queue, start background task, send 10 messages"
      assertion: "All 10 messages received by WebSocket client ✅"

    - test: "Queue insert latency <1ms"
      description: "Measure queue insert performance"
      assertion: "latency < 1ms ✅"

# Implementation Notes
implementation:
  language: "Rust"
  dependencies:
    - "tokio::sync::mpsc"
    - "std::time::Instant"
    - "prometheus"

  key_design_decisions:
    - decision: "Use mpsc channel (not broadcast/watch)"
      rationale: "Single consumer (WebSocket sender), multiple producers (agent streaming, tool calls)"

    - decision: "Bounded capacity (100 messages)"
      rationale: "Prevents infinite memory growth, forces backpressure handling for slow clients"

    - decision: "Non-blocking send (try_send)"
      rationale: "Agent doesn't wait for queue space, fast failure triggers backpressure"

    - decision: "Background task for queue → WebSocket"
      rationale: "Decouples agent generation from WebSocket send speed (async architecture)"

# Related Contracts
related_contracts:
  - "flow_control_manager.yml - Monitors queue depth, triggers backpressure"
  - "message_buffering.yml - Buffers messages for reconnection"
  - "streaming_engine.yml - Uses queue for token-by-token streaming"
  - "websocket_message_envelope.fbs - Message format for queue"
