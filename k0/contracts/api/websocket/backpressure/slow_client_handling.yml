# Slow Client Handling Contract
# Part of: ADR-0040c (Backpressure & Flow Control)
# Purpose: Detect and handle slow WebSocket clients (>500ms RTT) to prevent server OOM
# Research: TCP Flow Control (RFC 793 1981), SEDA Load Shedding (Welsh 2001)

version: "1.0"
type: "websocket_slow_client_handling"
status: "approved"

metadata:
  component: "WebSocket Backpressure"
  layer: "API Gateway"
  performance_budget:
    rtt_detection: "<10ms"
    slow_client_threshold: ">500ms RTT"
    backpressure_action: "<2ms"
  research:
    - "TCP Flow Control (RFC 793 1981) - Prevent fast sender overwhelming slow receiver"
    - "SEDA Load Shedding (Welsh 2001) - Drop load under high pressure"
    - "WebSocket Best Practices (RFC 6455) - Connection health monitoring"

# Slow Client Detection
slow_client_detection:
  description: "Detect slow WebSocket clients based on RTT and queue depth"

  criteria:
    - metric: "WebSocket send RTT > 500ms"
      description: "Time to send message to client exceeds 500ms"
      classification: "Slow client"

    - metric: "Queue depth > 90% for 30 seconds"
      description: "Queue consistently full (client can't keep up)"
      classification: "Very slow client"

    - metric: "Queue full (100 messages)"
      description: "Queue at capacity (immediate backpressure)"
      classification: "Critical slow client"

  measurement:
    rtt_calculation: |
      RTT = time_to_send_to_websocket

      // Measured in background delivery task
      let start = Instant::now();
      websocket.send(message).await?;
      let rtt_ms = start.elapsed().as_millis();

      WEBSOCKET_SEND_RTT_MS.observe(rtt_ms as f64);

# Slow Client Classification
client_speed_classification:
  - classification: "Fast"
    rtt_range: "0-100ms"
    description: "Good WiFi/5G connection"
    action: "No action"
    queue_depth: "0-50 messages (50% capacity)"

  - classification: "Normal"
    rtt_range: "100-300ms"
    description: "4G/LTE connection"
    action: "Monitor queue depth"
    queue_depth: "50-80 messages (80% capacity)"

  - classification: "Slow"
    rtt_range: "300-500ms"
    description: "3G/slow 4G connection"
    action: "Warning logged, queue depth monitored"
    queue_depth: "80-90 messages (90% capacity)"

  - classification: "Very Slow"
    rtt_range: ">500ms"
    description: "2G/poor connection"
    action: "Backpressure triggered, drop oldest messages"
    queue_depth: "90-100 messages (100% capacity)"

# Slow Client Handling Strategy
handling_strategy:
  description: "Multi-level strategy for handling slow clients"

  levels:
    - level: 1
      name: "Warning"
      trigger: "Queue depth > 80% (80 messages)"
      action: "Log warning, emit metric"
      impact: "No message drop"

      pseudocode: |
        if queue_depth > 80 {
            eprintln!(
                "[SlowClientHandler] WARNING: Queue filling up (session: {}, depth: {})",
                session_id, queue_depth
            );

            WEBSOCKET_SLOW_CLIENT_WARNINGS_TOTAL.inc();
        }

    - level: 2
      name: "Slow Client Detection"
      trigger: "Queue depth > 90% (90 messages) for 30 seconds"
      action: "Mark as slow client, log, emit metric"
      impact: "Monitoring intensified"

      pseudocode: |
        if queue_depth > 90 && duration > 30s {
            slow_clients.insert(session_id);

            eprintln!(
                "[SlowClientHandler] Slow client detected (session: {}, RTT: {}ms)",
                session_id, rtt_ms
            );

            WEBSOCKET_SLOW_CLIENTS_TOTAL.inc();
        }

    - level: 3
      name: "Backpressure (Drop Oldest)"
      trigger: "Queue full (100 messages)"
      action: "Drop oldest messages (FIFO), free queue space"
      impact: "Message loss (oldest messages dropped)"

      pseudocode: |
        if queue_depth >= 100 {
            eprintln!(
                "[SlowClientHandler] Queue full, dropping oldest message (session: {})",
                session_id
            );

            // Drop oldest message
            message_buffer.drop_oldest(session_id).await;

            WEBSOCKET_MESSAGES_DROPPED_TOTAL
                .with_label_values(&[session_id, "slow_client"])
                .inc();
        }

    - level: 4
      name: "Connection Termination"
      trigger: "Queue full for 5 minutes continuously"
      action: "Disconnect client, cleanup session"
      impact: "Connection closed (client must reconnect)"

      pseudocode: |
        if queue_depth >= 100 && duration > 5min {
            eprintln!(
                "[SlowClientHandler] Terminating slow client (session: {})",
                session_id
            );

            // Send Goodbye message
            websocket.send(Goodbye {
                message: "Connection too slow, please reconnect on better network",
            }).await;

            // Close connection
            websocket.close().await;

            WEBSOCKET_SLOW_CLIENT_DISCONNECTS_TOTAL.inc();
        }

# Operations
operations:
  - operation: "detect_slow_client"
    description: "Detect slow client based on RTT and queue depth"
    parameters:
      - name: "session_id"
        type: "string"
        required: true
      - name: "rtt_ms"
        type: "u64"
        description: "WebSocket send RTT in milliseconds"
      - name: "queue_depth"
        type: "usize"
        description: "Current queue depth"
    returns: "SlowClientStatus"

    performance:
      target_latency: "<10ms"

    pseudocode: |
      fn detect_slow_client(session_id: &str, rtt_ms: u64, queue_depth: usize) -> SlowClientStatus {
          if rtt_ms > 500 || queue_depth >= 100 {
              SlowClientStatus::VerySlow
          } else if rtt_ms > 300 || queue_depth >= 90 {
              SlowClientStatus::Slow
          } else if rtt_ms > 100 || queue_depth >= 80 {
              SlowClientStatus::Normal
          } else {
              SlowClientStatus::Fast
          }
      }

  - operation: "handle_slow_client"
    description: "Handle slow client (drop oldest messages, log, emit metrics)"
    parameters:
      - name: "session_id"
        type: "string"
        required: true
      - name: "status"
        type: "SlowClientStatus"
        required: true
      - name: "message_buffer"
        type: "&mut MessageBuffer"
        required: true
    returns: "void"

    performance:
      target_latency: "<2ms"

    pseudocode: |
      async fn handle_slow_client(session_id: &str, status: SlowClientStatus, message_buffer: &mut MessageBuffer) {
          match status {
              SlowClientStatus::Fast => {
                  // No action
              }
              SlowClientStatus::Normal => {
                  // Monitor queue depth
                  WEBSOCKET_SLOW_CLIENT_WARNINGS_TOTAL.inc();
              }
              SlowClientStatus::Slow => {
                  // Log warning
                  eprintln!("[SlowClientHandler] Slow client (session: {})", session_id);
                  WEBSOCKET_SLOW_CLIENTS_TOTAL.inc();
              }
              SlowClientStatus::VerySlow => {
                  // Drop oldest messages
                  eprintln!("[SlowClientHandler] Very slow client, dropping oldest (session: {})", session_id);
                  message_buffer.drop_oldest(session_id).await;
                  WEBSOCKET_MESSAGES_DROPPED_TOTAL.inc();
              }
          }
      }

  - operation: "monitor_rtt"
    description: "Monitor WebSocket send RTT (background task)"
    parameters:
      - name: "session_id"
        type: "string"
        required: true
      - name: "websocket"
        type: "WebSocketStream"
        required: true
    returns: "void"

    pseudocode: |
      async fn monitor_rtt(session_id: String, websocket: WebSocketStream) {
          loop {
              let start = Instant::now();

              // Send message
              let result = websocket.send(message).await;

              if result.is_ok() {
                  let rtt_ms = start.elapsed().as_millis();

                  // Emit metric
                  WEBSOCKET_SEND_RTT_MS
                      .with_label_values(&[&session_id])
                      .observe(rtt_ms as f64);

                  // Detect slow client
                  if rtt_ms > 500 {
                      eprintln!(
                          "[SlowClientHandler] High RTT detected (session: {}, RTT: {}ms)",
                          session_id, rtt_ms
                      );
                  }
              } else {
                  break;
              }
          }
      }

# Client Notification
client_notification:
  description: "Notify client about slow connection (optional)"

  message:
    type: "Warning"
    payload: |
      Warning {
          code: "SLOW_CONNECTION",
          message: "Your connection is slow, messages may be delayed or dropped. Please switch to WiFi for better performance.",
          severity: "WARNING",
      }

  trigger: "Queue depth > 90% for 30 seconds"

  frequency: "Once per 5 minutes (avoid spam)"

# Prometheus Metrics
metrics:
  - name: "websocket_send_rtt_ms"
    type: "histogram"
    description: "WebSocket send RTT in milliseconds"
    buckets: [10, 50, 100, 200, 500, 1000, 2000]
    labels:
      - session_id

    alerting:
      - rule: "P95 RTT > 500ms for 5 minutes"
        severity: "warning"
        description: "Slow clients detected (network issue or mobile)"

  - name: "websocket_slow_clients_total"
    type: "counter"
    description: "Total slow clients detected (RTT > 500ms or queue > 90%)"
    labels:
      - session_id

  - name: "websocket_slow_client_warnings_total"
    type: "counter"
    description: "Total slow client warnings (queue > 80%)"
    labels:
      - session_id

  - name: "websocket_slow_client_disconnects_total"
    type: "counter"
    description: "Total slow clients disconnected (queue full for 5 minutes)"
    labels:
      - session_id

  - name: "websocket_messages_dropped_total"
    type: "counter"
    description: "Total messages dropped due to slow clients"
    labels:
      - session_id
      - reason  # "slow_client" | "backpressure" | "timeout"

# Performance Analysis
performance_scenarios:
  - scenario: "Fast Client (RTT 50ms)"
    input: "Client with 50ms RTT, queue depth 30"
    performance:
      detect_slow_client: "0.5ms"
      classification: "Fast"
      action: "None"
    result: "No action ✅"

  - scenario: "Normal Client (RTT 200ms)"
    input: "Client with 200ms RTT, queue depth 70"
    performance:
      detect_slow_client: "0.5ms"
      classification: "Normal"
      action: "Monitor queue depth"
    result: "Warning logged ✅"

  - scenario: "Slow Client (RTT 400ms)"
    input: "Client with 400ms RTT, queue depth 92"
    performance:
      detect_slow_client: "0.5ms"
      classification: "Slow"
      action: "Log warning, emit metric"
    result: "Slow client detected ✅"

  - scenario: "Very Slow Client (RTT 600ms)"
    input: "Client with 600ms RTT, queue depth 100"
    performance:
      detect_slow_client: "0.5ms"
      classification: "VerySlow"
      action: "Drop oldest messages"
      handle_slow_client: "1.8ms"
      total: "2.3ms ✅"
    result: "Backpressure triggered, oldest message dropped ✅"

# Testing Requirements (WARD Framework)
testing:
  unit_tests:
    - test: "Detect fast client (RTT 50ms)"
      description: "Verify fast client classification"
      setup: "RTT = 50ms, queue_depth = 30"
      assertion: "status == SlowClientStatus::Fast ✅"

    - test: "Detect slow client (RTT 400ms)"
      description: "Verify slow client classification"
      setup: "RTT = 400ms, queue_depth = 92"
      assertion: "status == SlowClientStatus::Slow ✅"

    - test: "Detect very slow client (RTT 600ms)"
      description: "Verify very slow client classification"
      setup: "RTT = 600ms, queue_depth = 100"
      assertion: "status == SlowClientStatus::VerySlow ✅"

    - test: "Handle very slow client (drop oldest)"
      description: "Verify backpressure handling"
      setup: "status = VerySlow"
      assertion: "Oldest message dropped && metric incremented ✅"

  integration_tests:
    - test: "Slow client triggers backpressure"
      description: "Simulate slow client (500ms RTT), verify backpressure"
      setup: "Simulate slow WebSocket send (500ms), stream 100 tokens"
      assertion: "Backpressure triggered && messages dropped ✅"

    - test: "Very slow client disconnected after 5 minutes"
      description: "Simulate very slow client, verify disconnect"
      setup: "Queue full for 5 minutes"
      assertion: "Connection closed && metric incremented ✅"

# Implementation Notes
implementation:
  language: "Rust"
  dependencies:
    - "std::time::Instant"
    - "tokio::time"
    - "prometheus"

  key_design_decisions:
    - decision: "500ms RTT threshold (not 300ms or 1000ms)"
      rationale: "Balances detection sensitivity (catch slow 3G) with false positives (normal 4G bursts)"

    - decision: "Drop oldest messages (not newest)"
      rationale: "User cares about latest response (newest tokens), oldest messages likely outdated"

    - decision: "Disconnect after 5 minutes (not 1 minute)"
      rationale: "Give client time to recover (temporary network issue), avoid premature disconnect"

    - decision: "Monitor RTT in background task (not per message)"
      rationale: "Avoid blocking agent streaming, efficient async architecture"

# Related Contracts
related_contracts:
  - "flow_control_manager.yml - Monitors queue depth, triggers backpressure"
  - "message_buffering.yml - Provides drop_oldest operation"
  - "message_queue.yml - Async message queue (100 capacity)"
  - "streaming_engine.yml - Uses slow client detection for streaming"
