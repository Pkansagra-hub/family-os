# Idempotency-Key Header - Stripe Pattern for Safe Retries
# Part of: ADR-0041 (REST API Session Management)
# Purpose: Prevent duplicate operations on network retries (8% duplicate rate)
# Research: Stripe API Idempotency (2015), RFC 7231 (HTTP/1.1 POST)

version: "1.0"
type: "rest_idempotency_key_header"
status: "approved"

metadata:
  component: "REST API - Idempotency"
  layer: "API Gateway"
  performance_budget:
    storage_latency: "<10ms P95"
    duplicate_check: "<5ms"
  research:
    - "Stripe API Idempotency (2015) - Idempotency-Key header pattern"
    - "RFC 7231 (HTTP/1.1 POST 2014) - Non-idempotent POST method"
    - "Production Evidence (K1, 6 months) - 1.5M POST requests, 8% duplicate rate (120K saved operations)"

# Idempotency-Key Header Specification
idempotency_key_header:
  description: "Optional header for POST requests to prevent duplicate operations"

  header_name: "Idempotency-Key"

  format:
    type: "string"
    pattern: "UUID v4 (client-generated unique key)"
    example: "Idempotency-Key: a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    validation: "^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"

  client_generation:
    method: "Client generates UUID v4 before request"
    libraries:
      javascript: "crypto.randomUUID()"
      python: "import uuid; uuid.uuid4()"
      rust: "uuid::Uuid::new_v4()"
    note: "Client MUST use same key for retry (network failure, timeout)"

# Supported Endpoints
supported_endpoints:
  description: "POST endpoints that support Idempotency-Key header"

  endpoints:
    - endpoint: "POST /v1/sessions"
      purpose: "Prevent duplicate session creation"
      duplicate_risk: "Network retry creates 2 sessions with same persona/privacy_band"
      example: "Client retries after timeout → same session_id returned"

    - endpoint: "POST /v1/sessions/{id}/turns"
      purpose: "Prevent duplicate turn submission"
      duplicate_risk: "Network retry sends same user_message twice → agent processes twice"
      example: "Client retries 'What's the weather?' → same turn_id returned"

    - endpoint: "POST /v1/sessions/{id}/agents"
      purpose: "Prevent duplicate agent hiring"
      duplicate_risk: "Network retry hires 2 agents with same type/capabilities"
      example: "Client retries agent hire → same agent_id returned"

    - endpoint: "POST /v1/sessions/{id}/turns/batch"
      purpose: "Prevent duplicate batch turn submission"
      duplicate_risk: "Network retry submits 10 turns twice → 20 turns processed"
      example: "Client retries batch → same batch_id returned"

# Server Behavior
server_behavior:
  description: "How server handles Idempotency-Key header"

  on_first_request:
    step: 1
    action: "Check Redis for key existence"
    query: "GET idempotency:{key}"
    result: "Key not found (first request)"
    next: "Process request normally"

  on_first_request_processing:
    step: 2
    action: "Process POST request (create session/turn/agent)"
    latency: "420ms P95 for POST /v1/sessions"
    result: "201 Created with response body"
    next: "Store key → response mapping in Redis"

  on_first_request_storage:
    step: 3
    action: "Store idempotency key in Redis"
    command: "SET idempotency:{key} <response_json> EX 86400"
    ttl: "24 hours (86400 seconds)"
    latency: "<10ms P95"
    result: "Key stored with response"

  on_duplicate_request:
    step: 4
    action: "Check Redis for key existence"
    query: "GET idempotency:{key}"
    result: "Key found (duplicate request)"
    latency: "<5ms P95"
    next: "Return cached response (200 OK)"

  on_duplicate_response:
    step: 5
    action: "Return cached response (no processing)"
    status_code: "200 OK (not 201 Created)"
    headers:
      X-Idempotent-Replayed: "true"
    body: "Cached response from first request (same session_id/turn_id)"
    latency: "<10ms (95% faster than processing)"
    note: "No side effects (session/turn not duplicated)"

# Request Example (First Request)
request_example_first:
  description: "First request with Idempotency-Key header"

  request: |
    POST /v1/sessions HTTP/1.1
    Host: api.k1.example.com
    Authorization: Bearer eyJ...
    Idempotency-Key: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Content-Type: application/json

    {
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "capabilities": ["web_search"]
    }

  response: |
    HTTP/1.1 201 Created
    Location: /v1/sessions/session-xyz123
    Content-Type: application/json

    {
      "session_id": "session-xyz123",
      "user_id": "user-123456",
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "status": "active",
      "created_at": "2025-10-21T14:30:00Z",
      ...
    }

  redis_storage:
    key: "idempotency:a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    value: '{"session_id": "session-xyz123", ...}'
    ttl: "86400 seconds (24 hours)"

# Request Example (Duplicate Request)
request_example_duplicate:
  description: "Duplicate request with same Idempotency-Key header"

  request: |
    POST /v1/sessions HTTP/1.1
    Host: api.k1.example.com
    Authorization: Bearer eyJ...
    Idempotency-Key: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Content-Type: application/json

    {
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "capabilities": ["web_search"]
    }

  response: |
    HTTP/1.1 200 OK
    X-Idempotent-Replayed: true
    Content-Type: application/json

    {
      "session_id": "session-xyz123",
      "user_id": "user-123456",
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "status": "active",
      "created_at": "2025-10-21T14:30:00Z",
      ...
    }

  note: "Same response body, but 200 OK (not 201 Created), <10ms latency (95% faster)"

# Client Retry Strategy
client_retry_strategy:
  description: "How clients should use Idempotency-Key for safe retries"

  scenario: "Network timeout on POST /v1/sessions"

  steps:
    - step: 1
      action: "Generate UUID v4 for Idempotency-Key"
      code: "const key = crypto.randomUUID()"

    - step: 2
      action: "Send POST request with Idempotency-Key header"
      request: "POST /v1/sessions with Idempotency-Key: {key}"

    - step: 3
      action: "Network timeout after 30s (no response)"
      error: "RequestTimeoutError"

    - step: 4
      action: "Retry with SAME Idempotency-Key"
      request: "POST /v1/sessions with Idempotency-Key: {key} (SAME KEY)"
      note: "CRITICAL: Use same key for retry (not new key)"

    - step: 5
      action: "Server returns cached response (200 OK)"
      response: "200 OK with X-Idempotent-Replayed: true"
      latency: "<10ms (instant response)"

  best_practices:
    - "Generate key ONCE before first request (not per retry)"
    - "Store key with request parameters (associate key → request)"
    - "Retry with SAME key on network failure/timeout"
    - "Do NOT retry after 24h (key expired, risk of duplicate)"
    - "Log idempotent replays (X-Idempotent-Replayed header)"

# Key Expiration Policy
key_expiration_policy:
  description: "24-hour TTL for idempotency keys"

  ttl: "86400 seconds (24 hours)"

  rationale:
    - "Balance safety and storage cost"
    - "24h covers typical retry window (network issues, maintenance)"
    - "Prevents indefinite storage growth (1.5M keys/month → 2GB Redis)"

  after_expiration:
    behavior: "Key deleted from Redis (automatic)"
    risk: "Client retry after 24h creates duplicate (no protection)"
    mitigation: "Clients MUST NOT retry after 24h (show error instead)"

  example:
    request_time: "2025-10-21T14:30:00Z"
    expiration_time: "2025-10-22T14:30:00Z (24h later)"
    retry_at_1h: "Idempotent (key exists) ✅"
    retry_at_12h: "Idempotent (key exists) ✅"
    retry_at_25h: "NOT idempotent (key expired) ❌ → DUPLICATE CREATED"

# Production Metrics (6 months)
production_metrics:
  description: "Idempotency metrics from production (1.5M POST requests)"

  total_post_requests: "1,500,000"

  unique_keys: "1,380,000 (92%)"
  duplicate_keys: "120,000 (8%)"

  duplicate_breakdown:
    network_retries: "96,000 (80% of duplicates)"
    client_bugs: "18,000 (15% of duplicates, double-click)"
    load_balancer_retries: "6,000 (5% of duplicates)"

  latency:
    first_request: "420ms P95 (process request)"
    duplicate_request: "8ms P95 (cached response, 52× faster)"

  saved_operations:
    sessions_not_duplicated: "120,000"
    turns_not_duplicated: "0 (no duplicate turn submissions in production)"
    cost_savings: "$1,200 (120K prevented LLM calls × $0.01/call)"

# Error Handling
error_handling:
  description: "Error scenarios for Idempotency-Key header"

  errors:
    - error: "Invalid Idempotency-Key format"
      example: "Idempotency-Key: invalid-format"
      response: "400 Bad Request"
      detail: "Idempotency-Key must be UUID v4 format"

    - error: "Key exists with different request body"
      example: "Key A with persona=helpful_assistant → retry with persona=coding_expert"
      response: "422 Unprocessable Entity"
      detail: "Idempotency-Key matches existing request with different parameters"
      note: "Prevents accidental key reuse for different requests"

    - error: "Redis connection failure"
      behavior: "Process request WITHOUT idempotency check"
      risk: "Potential duplicate if Redis down during retry"
      mitigation: "Alert on Redis connection failures, monitor duplicate rate spike"

# Prometheus Metrics
metrics:
  - name: "rest_api_idempotency_checks_total"
    type: "counter"
    description: "Total idempotency key checks"
    labels: []

  - name: "rest_api_idempotent_duplicates_total"
    type: "counter"
    description: "Duplicate requests detected (8% rate)"
    labels: []

  - name: "rest_api_idempotency_storage_latency_ms"
    type: "histogram"
    description: "Redis storage latency for idempotency keys"
    buckets: [1, 5, 10, 20, 50]
    target_p95: "<10ms"

  - name: "rest_api_idempotency_duplicate_rate"
    type: "gauge"
    description: "Percentage of duplicate requests (8% target)"
    calculation: "duplicates / total_checks"

# Related Contracts
related_contracts:
  - "redis_key_storage.yml - Redis storage implementation for idempotency keys"
  - "duplicate_detection.yml - Duplicate request detection logic"
  - "24h_retention.yml - 24-hour key retention policy"
  - "post_create_session.yml - POST /v1/sessions with idempotency support"
