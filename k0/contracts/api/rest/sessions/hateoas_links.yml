# HATEOAS Links - Hypermedia as the Engine of Application State
# Part of: ADR-0041 (REST API Session Management)
# Purpose: Link structure for evolvable API (clients navigate via links, not hardcoded URLs)
# Research: Roy Fielding's REST Dissertation (2000), HAL+JSON, JSON:API

version: "1.0"
type: "rest_hateoas_links"
status: "approved"

metadata:
  component: "REST API - HATEOAS"
  layer: "API Gateway"
  research:
    - "REST Dissertation (Fielding 2000) - HATEOAS constraint for evolvable APIs"
    - "HAL+JSON (2011) - Hypertext Application Language"
    - "JSON:API (2015) - Links object specification"
    - "Production Evidence (K1, 6 months) - 100% client navigation via links (no hardcoded URLs)"

# HATEOAS Principles
hateoas_principles:
  description: "Hypermedia as the Engine of Application State (Fielding 2000)"

  benefits:
    - benefit: "Evolvable API"
      description: "Server changes URLs without breaking clients"
      example: "Change /v1/sessions → /v2/sessions (clients follow links)"

    - benefit: "Discoverable"
      description: "Clients discover available actions via links"
      example: "Session response includes links to turns, agents, webhooks"

    - benefit: "Self-documenting"
      description: "Links show relationship types + available methods"

    - benefit: "Decoupled"
      description: "Clients don't hardcode URLs (reduces coupling)"

  constraint:
    from: "REST Dissertation (Fielding 2000)"
    quote: "A REST API should be entered with no prior knowledge beyond the initial URI and set of standardized media types. From that point on, all application state transitions must be driven by client selection of server-provided choices."

# Link Object Schema
link_object_schema:
  description: "_links object in all API responses"

  structure:
    _links:
      type: "object"
      description: "Map of link relations to link objects"

      link_relation:
        type: "object"
        fields:
          href:
            type: "string"
            required: true
            description: "Absolute or relative URL"
            example: "/v1/sessions/session-a1b2c3d4"

          description:
            type: "string"
            required: false
            description: "Human-readable description"
            example: "View session details"

          method:
            type: "string"
            required: false
            default: "GET"
            description: "HTTP method"
            enum: ["GET", "POST", "PATCH", "DELETE"]

          templated:
            type: "boolean"
            required: false
            default: false
            description: "True if href contains URI template variables"
            example: "/v1/sessions/{session_id}/turns"

# Standard Link Relations
standard_link_relations:
  description: "Common link relations used across K1 REST API"

  relations:
    - rel: "self"
      description: "Current resource"
      example: "/v1/sessions/session-a1b2c3d4"
      required: true
      note: "All responses MUST include self link"

    - rel: "collection"
      description: "Parent collection"
      example: "/v1/sessions"
      required: false

    - rel: "turns"
      description: "Sub-resource: turns in this session"
      example: "/v1/sessions/session-a1b2c3d4/turns"
      method: "GET"

    - rel: "agents"
      description: "Sub-resource: agents in this session"
      example: "/v1/sessions/session-a1b2c3d4/agents"
      method: "GET"

    - rel: "submit_turn"
      description: "Action: submit new turn"
      example: "/v1/sessions/session-a1b2c3d4/turns"
      method: "POST"

    - rel: "update"
      description: "Action: update current resource"
      example: "/v1/sessions/session-a1b2c3d4"
      method: "PATCH"

    - rel: "delete"
      description: "Action: delete current resource"
      example: "/v1/sessions/session-a1b2c3d4"
      method: "DELETE"

    - rel: "next"
      description: "Next page in pagination"
      example: "/v1/sessions?cursor=xyz123&limit=20"
      method: "GET"

    - rel: "prev"
      description: "Previous page in pagination"
      example: "/v1/sessions?cursor=abc456&limit=20"
      method: "GET"

# Examples by Resource Type

# Session Resource Links
session_links_example:
  description: "Links in GET /v1/sessions/{id} response"

  _links:
    self:
      href: "/v1/sessions/session-a1b2c3d4"
      description: "View this session"
      method: "GET"

    collection:
      href: "/v1/sessions"
      description: "List all sessions"
      method: "GET"

    turns:
      href: "/v1/sessions/session-a1b2c3d4/turns"
      description: "View turns in this session"
      method: "GET"

    submit_turn:
      href: "/v1/sessions/session-a1b2c3d4/turns"
      description: "Submit new turn"
      method: "POST"

    agents:
      href: "/v1/sessions/session-a1b2c3d4/agents"
      description: "View agents in this session"
      method: "GET"

    update:
      href: "/v1/sessions/session-a1b2c3d4"
      description: "Update session metadata"
      method: "PATCH"

    delete:
      href: "/v1/sessions/session-a1b2c3d4"
      description: "Terminate this session"
      method: "DELETE"

    websocket:
      href: "wss://api.k1.example.com/v1/chat?token={jwt}&session_id=session-a1b2c3d4"
      description: "Real-time chat over WebSocket"
      templated: true

# Session List Links
session_list_links_example:
  description: "Links in GET /v1/sessions response (pagination)"

  _links:
    self:
      href: "/v1/sessions?limit=20"
      description: "Current page"
      method: "GET"

    next:
      href: "/v1/sessions?cursor=c2Vzc2lvbi1hMWIyYzNkNA==&limit=20"
      description: "Next page of sessions"
      method: "GET"

    prev:
      href: "/v1/sessions?cursor=c2Vzc2lvbi14eXo3ODk=&limit=20"
      description: "Previous page of sessions"
      method: "GET"

# Turn Resource Links
turn_links_example:
  description: "Links in GET /v1/sessions/{id}/turns/{turn_id} response"

  _links:
    self:
      href: "/v1/sessions/session-a1b2c3d4/turns/turn-xyz123"
      description: "View this turn"
      method: "GET"

    session:
      href: "/v1/sessions/session-a1b2c3d4"
      description: "Parent session"
      method: "GET"

    collection:
      href: "/v1/sessions/session-a1b2c3d4/turns"
      description: "All turns in this session"
      method: "GET"

    next_turn:
      href: "/v1/sessions/session-a1b2c3d4/turns/turn-abc456"
      description: "Next turn in conversation"
      method: "GET"

    prev_turn:
      href: "/v1/sessions/session-a1b2c3d4/turns/turn-lmn789"
      description: "Previous turn in conversation"
      method: "GET"

# Agent Resource Links
agent_links_example:
  description: "Links in GET /v1/sessions/{id}/agents response"

  _links:
    self:
      href: "/v1/sessions/session-a1b2c3d4/agents"
      description: "Agents in this session"
      method: "GET"

    session:
      href: "/v1/sessions/session-a1b2c3d4"
      description: "Parent session"
      method: "GET"

    hire_agent:
      href: "/v1/sessions/session-a1b2c3d4/agents"
      description: "Hire new agent"
      method: "POST"

    terminate_agent:
      href: "/v1/sessions/session-a1b2c3d4/agents/{agent_id}"
      description: "Terminate specific agent"
      method: "DELETE"
      templated: true

# URI Templates
uri_templates:
  description: "Support for templated URIs (RFC 6570)"

  syntax:
    simple: "/v1/sessions/{session_id}"
    multiple: "/v1/sessions/{session_id}/turns/{turn_id}"
    query: "/v1/sessions?limit={limit}&cursor={cursor}"

  example_usage:
    template: "/v1/sessions/{session_id}/turns"
    variables:
      session_id: "session-a1b2c3d4"
    expanded: "/v1/sessions/session-a1b2c3d4/turns"

  templated_field:
    description: "Set templated: true when href contains {variables}"
    example:
      href: "/v1/sessions/{session_id}/agents/{agent_id}"
      templated: true

# Client Navigation Example
client_navigation_example:
  description: "How clients navigate the API using HATEOAS"

  scenario: "Client wants to submit turn and view result"

  steps:
    - step: 1
      action: "GET /v1/sessions/{id}"
      response: "_links.submit_turn.href = /v1/sessions/{id}/turns"

    - step: 2
      action: "POST to _links.submit_turn.href"
      response: "Turn created, _links.self.href = /v1/sessions/{id}/turns/{turn_id}"

    - step: 3
      action: "GET to _links.self.href"
      response: "Turn details with final state"

  note: "Client never hardcoded /v1/sessions/{id}/turns (discovered via links)"

# Evolvability Example
evolvability_example:
  description: "How HATEOAS enables API evolution without breaking clients"

  scenario: "Move from /v1 to /v2 API"

  v1_response:
    _links:
      self: { href: "/v1/sessions/session-a1b2c3d4" }
      turns: { href: "/v1/sessions/session-a1b2c3d4/turns" }

  v2_response:
    _links:
      self: { href: "/v2/sessions/session-a1b2c3d4" }
      turns: { href: "/v2/sessions/session-a1b2c3d4/turns" }

  client_impact: "None (clients follow links, not hardcoded URLs)"

# Implementation Notes
implementation:
  description: "Server-side HATEOAS link generation"

  rust_example: |
    fn generate_session_links(session_id: &str, base_url: &str) -> HashMap<String, Link> {
        let mut links = HashMap::new();

        links.insert("self".to_string(), Link {
            href: format!("{}/v1/sessions/{}", base_url, session_id),
            description: Some("View this session".to_string()),
            method: Some("GET".to_string()),
            templated: false,
        });

        links.insert("turns".to_string(), Link {
            href: format!("{}/v1/sessions/{}/turns", base_url, session_id),
            description: Some("View turns in this session".to_string()),
            method: Some("GET".to_string()),
            templated: false,
        });

        links.insert("agents".to_string(), Link {
            href: format!("{}/v1/sessions/{}/agents", base_url, session_id),
            description: Some("View agents in this session".to_string()),
            method: Some("GET".to_string()),
            templated: false,
        });

        links
    }

  performance: "<0.5ms to generate links (string formatting)"

# Related Contracts
related_contracts:
