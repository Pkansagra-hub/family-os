# POST /v1/sessions - Create Session Contract
# Part of: ADR-0041 (REST API Session Management)
# Purpose: Create new K1 session with persona, privacy_band, capabilities, and initial agents
# Research: REST (Fielding 2000), HATEOAS, Idempotency Keys (Stripe 2015)

version: "1.0"
type: "rest_post_create_session"
status: "approved"

metadata:
  component: "REST API - Session Management"
  layer: "API Gateway"
  performance_budget:
    session_creation_latency: "<500ms P95"
    actual_p95: "420ms"
  research:
    - "REST (Fielding 2000) - Stateless client-server, resource-oriented design"
    - "RFC 7231 (HTTP/1.1 Semantics 2014) - POST method, 201 Created status"
    - "HATEOAS (Fielding 2000) - Hypermedia links for navigation"
    - "Idempotency Keys (Stripe 2015) - Safe retries, 24h deduplication"
    - "Production Evidence (K1, 6 months) - 1.5M sessions created, 420ms P95 latency"

# Endpoint Specification
endpoint:
  method: "POST"
  path: "/v1/sessions"
  description: "Create new K1 session with agent hiring and configuration"

  authentication:
    type: "JWT Bearer Token"
    header: "Authorization: Bearer <token>"
    adr_reference: "ADR-0037 (JWT Authentication)"
    validation: "<2ms RS256 signature verification"

# Request Body Schema
request_body:
  content_type: "application/json"

  schema:
    persona:
      type: "string"
      required: true
      description: "Persona to use for session"
      examples: ["helpful_assistant", "coding_expert", "travel_advisor", "medical_assistant"]

    privacy_band:
      type: "string"
      required: true
      description: "Privacy band classification"
      enum: ["GREEN", "AMBER", "RED"]
      validation: "Must be valid PrivacyBand enum value"

    capabilities:
      type: "array<string>"
      required: false
      description: "Requested capabilities for agents"
      examples: ["web_search", "python_executor", "file_system_access", "api_caller"]
      default: []

    initial_agents:
      type: "array<object>"
      required: false
      description: "Pre-hire agents with configuration"
      schema:
        agent_type:
          type: "string"
          examples: ["Concierge", "Specialist", "Executor", "Arbiter"]
        capabilities:
          type: "array<string>"
        config:
          type: "object"
          properties:
            temperature: "float (0.0-1.0)"
            max_tokens: "integer"
            model: "string"
      default: []

    metadata:
      type: "object<string, string>"
      required: false
      description: "Custom metadata (key-value pairs)"
      max_size: "10 fields"
      examples:
        - { "source": "slack", "channel_id": "C123456" }
        - { "integration": "zapier", "workflow_id": "wf-789" }
      default: {}

    ttl_seconds:
      type: "integer"
      required: false
      description: "Session time-to-live in seconds"
      default: 3600
      min: 300
      max: 86400
      validation: "300 ≤ ttl_seconds ≤ 86400 (5 minutes to 24 hours)"

  example_request: |
    POST /v1/sessions HTTP/1.1
    Host: api.k1.example.com
    Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
    Content-Type: application/json
    Idempotency-Key: req-abc123-xyz789

    {
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "capabilities": ["web_search", "python_executor"],
      "initial_agents": [
        {
          "agent_type": "Concierge",
          "capabilities": ["web_search"],
          "config": {
            "temperature": 0.7,
            "max_tokens": 2000
          }
        }
      ],
      "metadata": {
        "source": "slack",
        "channel_id": "C123456"
      },
      "ttl_seconds": 7200
    }

# Response Schema
response:
  status_code: 201
  status_text: "Created"

  headers:
    Location:
      description: "URL of created session"
      format: "/v1/sessions/{session_id}"
      example: "Location: /v1/sessions/session-a1b2c3d4"

    Content-Type:
      value: "application/json"

    X-Request-Id:
      description: "Unique request ID for tracing"
      format: "UUID"

    X-RateLimit-Limit:
      description: "Rate limit (requests per minute)"
      value: "100"

    X-RateLimit-Remaining:
      description: "Remaining requests in current window"
      example: "99"

  body_schema:
    session_id:
      type: "string"
      description: "Unique session identifier"
      format: "session-{uuid}"
      example: "session-a1b2c3d4-e5f6-4789-0123-456789abcdef"

    user_id:
      type: "string"
      description: "User ID from JWT claims"
      format: "user-{uuid}"

    space_id:
      type: "string"
      description: "Space ID from JWT claims"
      format: "space-{uuid}"

    persona:
      type: "string"
      description: "Persona used for session"

    privacy_band:
      type: "string"
      description: "Privacy band classification"
      enum: ["GREEN", "AMBER", "RED"]

    status:
      type: "string"
      description: "Current session status"
      enum: ["active", "idle", "draining", "terminated"]
      initial_value: "active"

    created_at:
      type: "string"
      description: "Session creation timestamp"
      format: "ISO 8601 (UTC)"
      example: "2025-10-21T14:30:00Z"

    updated_at:
      type: "string"
      description: "Last update timestamp"
      format: "ISO 8601 (UTC)"

    expires_at:
      type: "string"
      description: "Session expiration timestamp"
      format: "ISO 8601 (UTC)"
      calculation: "created_at + ttl_seconds"

    agents:
      type: "array<object>"
      description: "List of hired agents"
      schema:
        agent_id:
          type: "string"
          format: "agent-{uuid}"
        agent_name:
          type: "string"
          example: "Concierge-1"
        agent_type:
          type: "string"
          enum: ["Concierge", "Specialist", "Executor", "Arbiter"]
        status:
          type: "string"
          enum: ["PENDING", "WARMING", "ACTIVE", "IDLE", "DRAINING", "TERMINATED"]
        capabilities:
          type: "array<string>"
        hired_at:
          type: "string"
          format: "ISO 8601 (UTC)"
        memory_mb:
          type: "integer"
          description: "Agent memory usage in MB"

    capabilities:
      type: "array<string>"
      description: "Session capabilities"

    metadata:
      type: "object<string, string>"
      description: "Custom metadata"

    websocket_url:
      type: "string"
      description: "WebSocket URL for real-time chat (ADR-0040)"
      format: "wss://api.k1.example.com/v1/chat?token={jwt}&session_id={session_id}"

    _links:
      type: "object"
      description: "HATEOAS links for navigation"
      schema:
        self:
          href: "/v1/sessions/{session_id}"
          description: "Self link (GET session details)"
        turns:
          href: "/v1/sessions/{session_id}/turns"
          description: "Turns collection (POST turn, GET history)"
        agents:
          href: "/v1/sessions/{session_id}/agents"
          description: "Agents collection (POST hire, GET list)"

  example_response: |
    HTTP/1.1 201 Created
    Location: /v1/sessions/session-a1b2c3d4
    Content-Type: application/json
    X-Request-Id: req-abc123-xyz789

    {
      "session_id": "session-a1b2c3d4-e5f6-4789-0123-456789abcdef",
      "user_id": "user-123456",
      "space_id": "space-789012",
      "persona": "helpful_assistant",
      "privacy_band": "GREEN",
      "status": "active",
      "created_at": "2025-10-21T14:30:00Z",
      "updated_at": "2025-10-21T14:30:00Z",
      "expires_at": "2025-10-21T16:30:00Z",
      "agents": [
        {
          "agent_id": "agent-xyz123",
          "agent_name": "Concierge-1",
          "agent_type": "Concierge",
          "status": "ACTIVE",
          "capabilities": ["web_search"],
          "hired_at": "2025-10-21T14:30:00.200Z",
          "memory_mb": 128
        }
      ],
      "capabilities": ["web_search", "python_executor"],
      "metadata": {
        "source": "slack",
        "channel_id": "C123456"
      },
      "websocket_url": "wss://api.k1.example.com/v1/chat?token=eyJ...&session_id=session-a1b2c3d4",
      "_links": {
        "self": { "href": "/v1/sessions/session-a1b2c3d4" },
        "turns": { "href": "/v1/sessions/session-a1b2c3d4/turns" },
        "agents": { "href": "/v1/sessions/session-a1b2c3d4/agents" }
      }
    }

# Idempotency Support
idempotency:
  description: "Prevent duplicate session creation on network retries"

  header:
    name: "Idempotency-Key"
    required: false
    format: "String (client-generated unique key, recommended UUID)"
    example: "Idempotency-Key: req-abc123-xyz789"

  behavior:
    first_request: "Process normally, store response with key in Redis (24h TTL)"
    duplicate_request: "Return cached response (200 OK) with X-Idempotent-Replayed: true header"
    storage: "Redis: SET idempotency:{key} <response_json> EX 86400"
    ttl: "24 hours (86400 seconds)"

  performance:
    storage_latency: "<10ms P95"
    lookup_latency: "<5ms P95"

  production_evidence:
    total_requests: "1.5M POST /v1/sessions (6 months)"
    idempotency_hit_rate: "8% (120K duplicate requests prevented)"
    insight: "Network retries common (mobile networks, flaky Wi-Fi)"

# Performance Breakdown
performance:
  target_latency: "<500ms P95"
  actual_latency: "420ms P95"

  breakdown:
    jwt_validation: "2ms (RS256 signature verification)"
    idempotency_check: "5ms (Redis lookup, if key provided)"
    session_id_generation: "0.5ms (UUID v4)"
    orchestrator_create_session: "50ms (initialize SessionState)"
    agent_hiring: "200ms (hire 1 Concierge agent, WARMING → ACTIVE)"
    response_serialization: "1ms (JSON encoding)"
    idempotency_storage: "10ms (Redis SET, if key provided)"
    total: "268.5ms average, 420ms P95"

  optimization_notes:
    - "Agent hiring dominates latency (200ms of 420ms = 48%)"
    - "Consider pre-warming agent pool to reduce hire latency"
    - "JWT validation fast (<2ms, cached public key)"

# Error Responses
error_responses:
  - status_code: 400
    type: "https://api.k1.com/errors/invalid-request"
    title: "Invalid Request"
    description: "Invalid request body (missing required field, invalid enum value)"
    example_detail: "privacy_band must be one of: GREEN, AMBER, RED"

  - status_code: 401
    type: "https://api.k1.com/errors/unauthorized"
    title: "Unauthorized"
    description: "Missing or invalid JWT token"
    example_detail: "Invalid JWT signature"

  - status_code: 403
    type: "https://api.k1.com/errors/forbidden"
    title: "Forbidden"
    description: "User lacks permission to create session in this space"
    example_detail: "User not member of space space-789012"

  - status_code: 409
    type: "https://api.k1.com/errors/resource-exists"
    title: "Resource Already Exists"
    description: "Idempotency key already used (duplicate request)"
    note: "Returns cached response with 200 OK instead (not 409)"

  - status_code: 422
    type: "https://api.k1.com/errors/validation-failed"
    title: "Validation Failed"
    description: "Request validation failed (ttl_seconds out of range, invalid persona)"
    example_detail: "ttl_seconds must be between 300 and 86400"

  - status_code: 429
    type: "https://api.k1.com/errors/rate-limit-exceeded"
    title: "Rate Limit Exceeded"
    description: "Rate limit of 100 requests/minute exceeded"
    headers:
      X-RateLimit-Limit: "100"
      X-RateLimit-Remaining: "0"
      X-RateLimit-Reset: "1698765000"

  - status_code: 500
    type: "https://api.k1.com/errors/internal-error"
    title: "Internal Server Error"
    description: "Unexpected server error (K1 kernel failure, database unavailable)"
    example_detail: "Failed to initialize SessionState"

# Prometheus Metrics
metrics:
  - name: "rest_api_requests_total"
    type: "counter"
    description: "Total REST API requests"
    labels:
      - method: "POST"
      - endpoint: "/v1/sessions"
      - status: "201 | 400 | 401 | 429 | 500"

    usage: "Track request volume by status code"

  - name: "rest_api_request_duration_ms"
    type: "histogram"
    description: "Request latency in milliseconds"
    labels:
      - method: "POST"
      - endpoint: "/v1/sessions"
    buckets: [10, 50, 100, 250, 500, 1000, 2000]

    target: "<500ms P95"
    actual_p95: "420ms"

  - name: "rest_api_sessions_created_total"
    type: "counter"
    description: "Total sessions created successfully"
    labels:
      - persona
      - privacy_band

    usage: "Track session creation volume by persona/band"

  - name: "rest_api_idempotency_hits_total"
    type: "counter"
    description: "Total idempotency key matches (duplicate requests)"

    actual_rate: "8% (120K of 1.5M requests)"

# Related Contracts
related_contracts:
  - "get_session.yml - GET /v1/sessions/{id} for retrieving session details"
  - "patch_update_session.yml - PATCH /v1/sessions/{id} for updating metadata"
  - "delete_terminate_session.yml - DELETE /v1/sessions/{id} for termination"
  - "hateoas_links.yml - HATEOAS link structure (_links object)"
  - "resource_oriented_design.yml - REST resource design principles"
  - "ADR-0037 - JWT Authentication (Bearer token validation)"
  - "ADR-0040 - WebSocket Chat (websocket_url in response)"
