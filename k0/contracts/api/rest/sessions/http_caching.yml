# HTTP Caching Strategy - ETag, Last-Modified, Cache-Control
# Part of: ADR-0041 (REST API Session Management)
# Purpose: HTTP caching for 82% cache hit rate (10.6× faster: 8ms cached vs 85ms uncached)
# Research: RFC 7232 (Conditional Requests), RFC 7234 (Caching), MDN HTTP Caching

version: "1.0"
type: "rest_http_caching"
status: "approved"

metadata:
  component: "REST API - HTTP Caching"
  layer: "API Gateway"
  performance_impact:
    cache_hit_rate: "82%"
    cached_latency: "8ms P95"
    uncached_latency: "85ms P95"
    speedup: "10.6× faster (cached vs uncached)"
  research:
    - "RFC 7232 (HTTP/1.1 Conditional Requests 2014) - ETag, If-None-Match, 304 Not Modified"
    - "RFC 7234 (HTTP/1.1 Caching 2014) - Cache-Control, max-age, private"
    - "RFC 7231 (HTTP/1.1 Semantics 2014) - Last-Modified, If-Modified-Since"
    - "Production Evidence (K1, 6 months) - 3M GETs, 2.46M cached (82%), 4.92GB bandwidth saved"

# Caching Headers Overview
caching_headers_overview:
  description: "HTTP headers used for caching in K1 REST API"

  headers:
    - header: "ETag"
      direction: "Response (server → client)"
      purpose: "Opaque validator for resource version"
      example: 'ETag: "md5-abc123def456"'
      rfc: "RFC 7232"

    - header: "Last-Modified"
      direction: "Response (server → client)"
      purpose: "Timestamp of last modification"
      example: "Last-Modified: Mon, 21 Oct 2025 14:30:00 GMT"
      rfc: "RFC 7231"

    - header: "Cache-Control"
      direction: "Response (server → client)"
      purpose: "Caching directives (private, max-age)"
      example: "Cache-Control: private, max-age=300"
      rfc: "RFC 7234"

    - header: "If-None-Match"
      direction: "Request (client → server)"
      purpose: "Conditional request (check if ETag changed)"
      example: 'If-None-Match: "md5-abc123def456"'
      rfc: "RFC 7232"

    - header: "If-Modified-Since"
      direction: "Request (client → server)"
      purpose: "Conditional request (check if modified after timestamp)"
      example: "If-Modified-Since: Mon, 21 Oct 2025 14:30:00 GMT"
      rfc: "RFC 7231"

# ETag Generation
etag_generation:
  description: "ETag creation for session resources"

  algorithm: "MD5 hash"

  input_fields:
    - field: "session_id"
      rationale: "Unique session identifier"

    - field: "updated_at"
      rationale: "Last modification timestamp (changes trigger new ETag)"

    - field: "status"
      rationale: "Session status (active → idle changes state)"

    - field: "agents"
      rationale: "Agent list (hiring/termination changes state)"

    - field: "metadata"
      rationale: "User metadata (updates change state)"

  formula: 'ETag = "md5-" + MD5(session_id + updated_at + status + agents + metadata)'

  rust_example: |
    use md5::{Md5, Digest};

    fn generate_etag(session: &Session) -> String {
        let mut hasher = Md5::new();
        hasher.update(session.session_id.as_bytes());
        hasher.update(session.updated_at.to_rfc3339().as_bytes());
        hasher.update(session.status.as_bytes());
        hasher.update(serde_json::to_string(&session.agents).unwrap().as_bytes());
        hasher.update(serde_json::to_string(&session.metadata).unwrap().as_bytes());

        let hash = hasher.finalize();
        format!("md5-{:x}", hash)
    }

  performance: "1ms to generate ETag (MD5 hash)"

  example:
    session_id: "session-a1b2c3d4"
    updated_at: "2025-10-21T14:30:00Z"
    status: "active"
    agents: "[{agent_id: agent-xyz123}]"
    metadata: "{source: slack}"
    etag: '"md5-abc123def456"'

# Last-Modified Header
last_modified_header:
  description: "Last-Modified timestamp header"

  source: "session.updated_at"
  format: "HTTP-date (RFC 7231)"
  example: "Last-Modified: Mon, 21 Oct 2025 14:30:00 GMT"

  conversion:
    from: "2025-10-21T14:30:00Z (ISO 8601)"
    to: "Mon, 21 Oct 2025 14:30:00 GMT (HTTP-date)"

  rust_example: |
    use chrono::{DateTime, Utc};

    fn format_last_modified(updated_at: DateTime<Utc>) -> String {
        updated_at.format("%a, %d %b %Y %H:%M:%S GMT").to_string()
    }

  note: "Precision: seconds (no milliseconds in HTTP-date)"

# Cache-Control Directives
cache_control_directives:
  description: "Cache-Control header directives for session resources"

  directives:
    - directive: "private"
      description: "User-specific data (not shareable across users)"
      rationale: "Session belongs to specific user (not public)"

    - directive: "max-age=300"
      description: "Cache valid for 5 minutes (300 seconds)"
      rationale: "Balance freshness (session changes) vs performance"
      tradeoff: "Shorter TTL (fresher) vs longer TTL (higher hit rate)"

  full_header: "Cache-Control: private, max-age=300"

  alternatives_considered:
    - alternative: "max-age=60 (1 minute)"
      impact: "Fresher data, but lower cache hit rate (~65%)"

    - alternative: "max-age=600 (10 minutes)"
      impact: "Higher cache hit rate (~88%), but stale data risk"

    - chosen: "max-age=300 (5 minutes)"
      rationale: "82% cache hit rate + acceptable staleness"

# Conditional Request Flow
conditional_request_flow:
  description: "Client-server flow for conditional requests"

  steps:
    - step: 1
      actor: "Client"
      action: "Initial GET /v1/sessions/{id}"
      request: "GET /v1/sessions/session-a1b2c3d4"

    - step: 2
      actor: "Server"
      action: "Return full response with caching headers"
      response: |
        200 OK
        ETag: "md5-abc123"
        Last-Modified: Mon, 21 Oct 2025 14:30:00 GMT
        Cache-Control: private, max-age=300
        { ... session data ... }
      latency: "85ms (uncached)"

    - step: 3
      actor: "Client"
      action: "Store ETag + Last-Modified in local cache"
      cache_entry:
        url: "/v1/sessions/session-a1b2c3d4"
        etag: '"md5-abc123"'
        last_modified: "Mon, 21 Oct 2025 14:30:00 GMT"
        cached_at: "2025-10-21T14:30:00Z"
        expires_at: "2025-10-21T14:35:00Z"

    - step: 4
      actor: "Client"
      action: "Second GET within 5 minutes (before expiration)"
      request: |
        GET /v1/sessions/session-a1b2c3d4
        If-None-Match: "md5-abc123"
        If-Modified-Since: Mon, 21 Oct 2025 14:30:00 GMT

    - step: 5
      actor: "Server"
      action: "Validate ETag (unchanged)"
      validation: 'current_etag == "md5-abc123" → MATCH'
      response: |
        304 Not Modified
        ETag: "md5-abc123"
        (no body)
      latency: "8ms (cached, 10.6× faster)"

    - step: 6
      actor: "Client"
      action: "Use cached response (no download)"
      bandwidth_saved: "~2KB per request"

# Cache Miss Flow
cache_miss_flow:
  description: "Flow when cached data is stale (ETag changed)"

  steps:
    - step: 1
      actor: "Client"
      action: "GET with cached ETag"
      request: |
        GET /v1/sessions/session-a1b2c3d4
        If-None-Match: "md5-abc123"

    - step: 2
      actor: "Server"
      action: "Session updated (new agent hired)"
      updated_at: "2025-10-21T14:40:00Z"
      new_etag: '"md5-xyz789"'

    - step: 3
      actor: "Server"
      action: "Validate ETag (changed)"
      validation: 'current_etag ("md5-xyz789") != cached_etag ("md5-abc123") → MISMATCH'
      response: |
        200 OK
        ETag: "md5-xyz789"
        Last-Modified: Mon, 21 Oct 2025 14:40:00 GMT
        { ... updated session data ... }
      latency: "85ms (uncached, cache miss)"

    - step: 4
      actor: "Client"
      action: "Update cache with new ETag + data"

# Cache Performance Metrics
cache_performance_metrics:
  description: "Production metrics for HTTP caching (6 months)"

  metrics:
    total_get_requests: "3,000,000"
    cache_hits: "2,460,000 (82%)"
    cache_misses: "540,000 (18%)"

    cache_hit_latency:
      p50: "6ms"
      p95: "8ms"
      p99: "12ms"

    cache_miss_latency:
      p50: "70ms"
      p95: "85ms"
      p99: "110ms"

    speedup: "10.6× faster (8ms cached vs 85ms uncached)"

    bandwidth_saved:
      per_request: "2KB (session JSON)"
      total: "4.92GB (2,460,000 × 2KB)"

    server_load_reduction: "82% of GETs return 304 (minimal CPU + DB)"

# Cache Invalidation
cache_invalidation:
  description: "When cached data becomes stale"

  triggers:
    - trigger: "Session updated (PATCH /v1/sessions/{id})"
      action: "updated_at changes → new ETag generated"
      result: "Next GET returns 200 OK (cache miss)"

    - trigger: "Agent hired/terminated"
      action: "agents list changes → new ETag generated"
      result: "Next GET returns 200 OK (cache miss)"

    - trigger: "Metadata updated"
      action: "metadata changes → new ETag generated"
      result: "Next GET returns 200 OK (cache miss)"

    - trigger: "TTL expires (5 minutes)"
      action: "Client revalidates even if ETag unchanged"
      result: "GET with If-None-Match → 304 Not Modified (revalidated)"

  note: "No active cache invalidation (server doesn't push invalidations to clients)"

# Client-Side Cache Implementation
client_side_cache_implementation:
  description: "How clients should implement HTTP caching"

  pseudocode: |
    cache = {}  # URL → {etag, last_modified, data, expires_at}

    def get_session(session_id):
        url = f"/v1/sessions/{session_id}"

        # Check local cache
        if url in cache and cache[url]['expires_at'] > now():
            # Cache valid, send conditional request
            headers = {
                'If-None-Match': cache[url]['etag'],
                'If-Modified-Since': cache[url]['last_modified']
            }
            response = http.get(url, headers=headers)

            if response.status == 304:
                # Cache hit (use cached data)
                return cache[url]['data']
            else:
                # Cache miss (update cache)
                cache[url] = {
                    'etag': response.headers['ETag'],
                    'last_modified': response.headers['Last-Modified'],
                    'data': response.json(),
                    'expires_at': now() + 300  # 5 minutes
                }
                return response.json()
        else:
            # No cache, fetch fresh data
            response = http.get(url)
            cache[url] = {
                'etag': response.headers['ETag'],
                'last_modified': response.headers['Last-Modified'],
                'data': response.json(),
                'expires_at': now() + 300
            }
            return response.json()

  libraries:
    - language: "JavaScript"
      library: "axios-cache-adapter"
      note: "Automatic ETag caching"

    - language: "Python"
      library: "requests-cache"
      note: "HTTP cache backend (SQLite, Redis)"

    - language: "Rust"
      library: "reqwest-middleware + http-cache"
      note: "HTTP caching middleware"

# Related Contracts
related_contracts:
