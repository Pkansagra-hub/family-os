# GET /v1/sessions - List Sessions Contract
# Part of: ADR-0041 (REST API Session Management)
# Purpose: List sessions with cursor-based pagination
# Research: Cursor Pagination (Facebook Graph API), Infinite Scroll UX

version: "1.0"
type: "rest_get_sessions_list"
status: "approved"

metadata:
  component: "REST API - Session Management"
  layer: "API Gateway"
  performance_budget:
    pagination_latency: "<100ms P95"
    actual_p95: "78ms"
  research:
    - "Cursor-Based Pagination (Facebook Graph API 2010) - Opaque cursor, no offset"
    - "Infinite Scroll UX (Twitter Feed) - has_more flag, next_cursor"
    - "Database Indexing (Postgres B-tree) - O(log n) cursor lookup vs O(n) offset"
    - "Production Evidence (K1, 6 months) - 500K list requests, 78ms P95 latency"

# Endpoint Specification
endpoint:
  method: "GET"
  path: "/v1/sessions"
  description: "List sessions with cursor-based pagination and filtering"

  query_parameters:
    limit:
      type: "integer"
      required: false
      default: 20
      min: 1
      max: 100
      description: "Number of sessions per page"
      validation: "1 ≤ limit ≤ 100"

    cursor:
      type: "string"
      required: false
      default: null
      description: "Opaque cursor for pagination (base64-encoded last item ID)"
      format: "Base64(session_id)"
      example: "cursor=c2Vzc2lvbi1hMWIyYzNkNA=="
      note: "Client should treat as opaque (no parsing)"

    status:
      type: "string"
      required: false
      enum: ["active", "idle", "draining", "terminated"]
      description: "Filter by session status"
      example: "status=active"

    privacy_band:
      type: "string"
      required: false
      enum: ["GREEN", "AMBER", "RED"]
      description: "Filter by privacy band"
      example: "privacy_band=GREEN"

    created_after:
      type: "string"
      required: false
      format: "ISO 8601 (UTC)"
      description: "Filter sessions created after timestamp"
      example: "created_after=2025-10-21T00:00:00Z"

    created_before:
      type: "string"
      required: false
      format: "ISO 8601 (UTC)"
      description: "Filter sessions created before timestamp"

  authentication:
    type: "JWT Bearer Token"
    header: "Authorization: Bearer <token>"

# Cursor-Based Pagination Strategy
pagination_strategy:
  description: "Use opaque cursor (not offset) for consistency and scalability"

  cursor_encoding:
    format: "Base64(last_item_id)"
    example_raw: "session-a1b2c3d4"
    example_encoded: "c2Vzc2lvbi1hMWIyYzNkNA=="
    opacity: "Client treats as opaque string (no parsing)"

  database_query:
    without_cursor: "SELECT * FROM sessions WHERE user_id = ? ORDER BY created_at DESC LIMIT ?"
    with_cursor: "SELECT * FROM sessions WHERE user_id = ? AND session_id > ? ORDER BY created_at DESC LIMIT ?"
    index: "CREATE INDEX idx_sessions_user_created ON sessions(user_id, created_at)"
    performance: "O(log n) B-tree index lookup (not O(n) offset scan)"

  has_more_detection:
    strategy: "Fetch limit + 1 items, check if result count > limit"
    benefit: "Avoid expensive COUNT(*) query (>1s for 1M rows)"
    example:
      request_limit: 20
      fetch_query: "LIMIT 21"
      result_count: 21
      has_more: true
      returned_items: 20

  consistency:
    problem_with_offset: "Items added/removed during pagination cause skipped/duplicate items"
    cursor_solution: "Cursor locks to specific item ID, consistent results even with concurrent writes"

# Request Examples
request_examples:
  - scenario: "First Page (No Cursor)"
    request: |
      GET /v1/sessions?limit=20 HTTP/1.1
      Host: api.k1.example.com
      Authorization: Bearer eyJ...

    query_execution: "SELECT * FROM sessions WHERE user_id = 'user-123' ORDER BY created_at DESC LIMIT 21"
    latency: "78ms P95"

  - scenario: "Second Page (With Cursor)"
    request: |
      GET /v1/sessions?limit=20&cursor=c2Vzc2lvbi1hMWIyYzNkNA== HTTP/1.1
      Host: api.k1.example.com
      Authorization: Bearer eyJ...

    cursor_decoded: "session-a1b2c3d4"
    query_execution: "SELECT * FROM sessions WHERE user_id = 'user-123' AND session_id > 'session-a1b2c3d4' ORDER BY created_at DESC LIMIT 21"
    latency: "78ms P95 (consistent with first page)"

  - scenario: "Filter by Status"
    request: |
      GET /v1/sessions?status=active&limit=20 HTTP/1.1
      Host: api.k1.example.com
      Authorization: Bearer eyJ...

    query_execution: "SELECT * FROM sessions WHERE user_id = 'user-123' AND status = 'active' ORDER BY created_at DESC LIMIT 21"

# Response Schema
response_schema:
  status_code: 200
  content_type: "application/json"

  body:
    data:
      type: "array<SessionSummary>"
      description: "List of session summaries (not full details)"
      schema:
        session_id: "string"
        persona: "string"
        privacy_band: "string (GREEN | AMBER | RED)"
        status: "string (active | idle | draining | terminated)"
        created_at: "string (ISO 8601)"
        updated_at: "string (ISO 8601)"
        total_turns: "integer"
        agents_count: "integer"

    pagination:
      type: "object"
      description: "Pagination metadata"
      schema:
        total:
          type: "integer | null"
          description: "Total count (not computed, null)"
          rationale: "Avoid expensive COUNT(*) query"

        limit:
          type: "integer"
          description: "Requested limit (1-100)"

        has_more:
          type: "boolean"
          description: "True if more pages exist"
          calculation: "result.len() > limit"

        next_cursor:
          type: "string | null"
          description: "Cursor for next page (null if last page)"
          encoding: "Base64(last_item_id)"

        prev_cursor:
          type: "string | null"
          description: "Cursor for previous page (optional, not implemented)"

    _links:
      type: "object"
      description: "HATEOAS links"
      schema:
        self:
          href: "/v1/sessions?limit={limit}&cursor={cursor}"
        next:
          href: "/v1/sessions?limit={limit}&cursor={next_cursor}"
          condition: "Only if has_more = true"
        prev:
          href: "/v1/sessions?limit={limit}&cursor={prev_cursor}"
          condition: "Optional (not always available)"

# Example Response
example_response: |
  HTTP/1.1 200 OK
  Content-Type: application/json

  {
    "data": [
      {
        "session_id": "session-a1b2c3d4",
        "persona": "helpful_assistant",
        "privacy_band": "GREEN",
        "status": "active",
        "created_at": "2025-10-21T14:30:00Z",
        "updated_at": "2025-10-21T14:35:00Z",
        "total_turns": 5,
        "agents_count": 1
      },
      {
        "session_id": "session-e5f6g7h8",
        "persona": "coding_expert",
        "privacy_band": "AMBER",
        "status": "idle",
        "created_at": "2025-10-20T10:15:00Z",
        "updated_at": "2025-10-20T12:00:00Z",
        "total_turns": 12,
        "agents_count": 2
      }
    ],
    "pagination": {
      "total": null,
      "limit": 20,
      "has_more": true,
      "next_cursor": "c2Vzc2lvbi1lNWY2ZzdoOA==",
      "prev_cursor": null
    },
    "_links": {
      "self": { "href": "/v1/sessions?limit=20" },
      "next": { "href": "/v1/sessions?limit=20&cursor=c2Vzc2lvbi1lNWY2ZzdoOA==" }
    }
  }

# Performance Analysis
performance:
  target_latency: "<100ms P95"
  actual_latency: "78ms P95"

  breakdown:
    jwt_validation: "2ms"
    cursor_decode: "0.5ms (base64 decode)"
    database_query: "70ms (indexed on user_id + created_at)"
    json_serialization: "5ms"
    total: "77.5ms average, 78ms P95"

  scalability:
    offset_pagination: "O(n) - OFFSET 1000000 scans 1M rows"
    cursor_pagination: "O(log n) - B-tree index lookup, constant time"

    comparison_large_dataset:
      dataset_size: "1M sessions"
      offset_1000000: "2500ms (full table scan)"
      cursor_1000000: "78ms (index lookup)"
      improvement: "32× faster"

# Error Responses
error_responses:
  - status_code: 400
    type: "https://api.k1.com/errors/invalid-request"
    title: "Invalid Request"
    description: "Invalid query parameter (limit out of range, invalid cursor)"
    example_detail: "limit must be between 1 and 100"

  - status_code: 401
    type: "https://api.k1.com/errors/unauthorized"
    title: "Unauthorized"
    description: "Missing or invalid JWT token"

# Prometheus Metrics
metrics:
  - name: "rest_api_pagination_latency_ms"
    type: "histogram"
    description: "Pagination query latency"
    labels:
      - endpoint: "/v1/sessions"
    buckets: [10, 25, 50, 100, 200]
    target_p95: "<100ms"
    actual_p95: "78ms"

  - name: "rest_api_pagination_page_sizes"
    type: "histogram"
    description: "Requested page sizes (limit parameter)"
    buckets: [10, 20, 50, 100]

  - name: "rest_api_cursor_decode_errors_total"
    type: "counter"
    description: "Invalid cursor errors"

# Related Contracts
related_contracts:
  - "get_session.yml - GET /v1/sessions/{id} for full details"
  - "hateoas_links.yml - HATEOAS link structure"
  - "resource_oriented_design.yml - Collection vs resource URLs"
