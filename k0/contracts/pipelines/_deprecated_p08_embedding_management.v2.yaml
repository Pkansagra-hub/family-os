# DEPRECATED: Superseded by p08_embedding_management.v3.yaml (M4 Epic 4.2)
# Reason: v2 claims aspirational pgvector/FAISS state, v3 reflects real 3-stage DAG
# See: ADR-K003 v2.0, k0/contracts/pipelines/p08_embedding_management.v3.yaml
#
# P08 Embedding Management & Enhancement Pipeline
# Version: v2.2
# ADR Reference: ADR-K003 (Inline Embedding via UltraBERT), ADR-K0XX (PostgreSQL Migration)
# Updated: 2025-12-24 (vector migration - FAISS deprecated)
#
# MIGRATION NOTE (PostgreSQL + pgvector):
# - pgvector HNSW index replaces FAISS for similarity search
# - Vectors auto-indexed on INSERT via HNSW (vector_cosine_ops)
# - P08's primary indexing role is DEPRECATED
# - Pipeline retained for: backfill, cleanup, maintenance operations

pipeline_id: P08_EMBEDDING_MANAGEMENT
version: v3
name: P08 Embedding Management (Maintenance Mode)

description: |
  Background embedding lifecycle management - MAINTENANCE MODE.
  Primary generation moved to P02 inline (ADR-K003).
  Primary indexing moved to pgvector HNSW (PostgreSQL migration).

  pgvector Migration Update:
  - FAISS indexing DEPRECATED (pgvector HNSW auto-indexes on INSERT)
  - P08 role reduced to: backfill, cleanup, integrity checks
  - Scheduled triggers retained for maintenance operations

  Remaining P08 responsibilities:
  - M25 (backfill): Recompute embeddings for PENDING entries
  - M27 (cleanup): Remove orphaned embeddings without parent hipp_event
  - Integrity: Verify vector dimensions, detect corruption

  Trigger modes:
  - interval (300s): Check for pending maintenance tasks
  - threshold: Trigger when cleanup/backfill backlog grows
  - manual: Admin-initiated operations

# REMOVED (ADR-K003 v1.2): No longer event-driven
# Previously: entry_topic: cognitive.vector.stored.v1
# NOTE: Using placeholder topic for schema compliance (scheduled mode ignores this)
entry_topic: scheduled.p08.maintenance.v1
exit_topic: embedding.maintenance.completed.v1

# ============================================================================
# DECLARATIVE TRIGGERS (PipelineScheduler)
# ============================================================================
# Migrated from hardcoded _p08_faiss_indexer_loop to declarative triggers.
# pgvector migration: FAISS indexing deprecated, triggers now for maintenance.
# ============================================================================

triggers:
  # Primary interval trigger: every 5 minutes (300s) - check for maintenance tasks
  - id: maintenance_interval
    type: interval
    interval_seconds: 300
    batch_size: 100
    catch_up_enabled: true
    description: "Periodic check for backfill/cleanup work"

  # Threshold trigger: when maintenance backlog grows
  - id: maintenance_threshold
    type: threshold
    table: st_vec
    condition: "status = 'PENDING'"
    threshold_count: 50
    check_interval_seconds: 60
    batch_size: 50
    description: "Trigger backfill when PENDING count exceeds threshold"

  # Manual trigger: for admin-initiated maintenance via CLI or API
  - id: maintenance_manual
    type: manual
    description: "Admin-initiated maintenance operations"

concurrency: 1
max_queue_depth: 1000  # Retained for compatibility

required_capabilities:
  # Storage tables
  - st_vec.read
  - st_vec.write
  - st_hipp_events.read
  - st_hipp_events.write
  # UltraBERT (for backfill/recompute)
  - ultrabert.embed
  # NOTE: faiss.read/faiss.write REMOVED - pgvector HNSW replaces FAISS

# Single-stage DAG: Backfill PENDING embeddings
# pgvector migration: FAISS indexer removed (HNSW auto-indexes on INSERT)
# Using existing embedding.backfill module for scheduled maintenance
dag:
  - id: stage_10_backfill
    module: embedding.backfill:v1
    depends_on: []
    description: |
      Backfill PENDING embeddings for legacy events.
      Queries st_hipp_events WHERE embedding_status='PENDING', computes embeddings.
      pgvector HNSW auto-indexes on INSERT - no separate indexing step needed.
    latency_budget_ms: 5000
    config:
      batch_size: 100          # Process up to 100 items per invocation
      use_syscalls: true       # Uses hipp_query, vec_write, ultrabert_embed
      emit_completion_event: false  # No event emission (scheduled mode)

# Performance targets
performance:
  # Backfill operations (M25)
  backfill_batch_duration_p95: 5s
  backfill_embedding_p95: 50ms

  # Cleanup operations (M27)
  cleanup_batch_size: 100
  cleanup_batch_duration_p95: 2s

  # NOTE: FAISS indexing targets REMOVED - pgvector HNSW handles indexing

# Observability
observability:
  metrics:
    - m25.embeddings_backfilled
    - m25.backfill_failures
    - m27.embeddings_cleaned
    - m27.cleanup_failures
    # NOTE: m24.* metrics REMOVED - FAISS indexing deprecated

  tracing:
    - All modules emit trace identifiers
    - All syscalls include operation context

# Architecture references
related_adrs:
  - ADR-K003  # Inline Embedding via UltraBERT
  - ADR-K0XX  # PostgreSQL Migration (pgvector replaces FAISS)

related_pipelines:
  - P02_WRITE  # Primary embedding generation (M22/M23)
