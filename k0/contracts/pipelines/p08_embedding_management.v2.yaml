# P08 Embedding Management & Enhancement Pipeline
# Version: v2.1
# ADR Reference: ADR-K003 (Inline Embedding via UltraBERT)
# Updated: 2025-12-13 (ADR-K003 v1.2 - converted to scheduled mode)
#
# NOTE: This pipeline no longer subscribes to bus events.
# It runs as a scheduled batch job, querying st_vec for READY embeddings.
# This simplifies architecture and improves efficiency (batch FAISS ops).

pipeline_id: P08_EMBEDDING_MANAGEMENT
version: v2
name: P08 Embedding Management & Enhancement

description: |
  Background embedding lifecycle management - SCHEDULED MODE.
  Primary generation moved to P02 inline (ADR-K003).

  ADR-K003 v1.2 Update:
  - No longer event-driven (removed entry_topic)
  - Runs as scheduled batch job every 5 minutes
  - Queries st_vec WHERE status='READY' for pending indexing
  - More efficient: batch FAISS operations, reduced event overhead

  This pipeline manages FAISS indexing of stored vectors:
  - Trigger: Scheduled (every 5 minutes) or manual invocation
  - Processing: M24 (embedding.faiss_indexer) queries READY vectors, adds to FAISS
  - Exit: Updates st_vec.status to INDEXED

  Additional P08 capabilities (separate workers):
  - M25 (backfill): Manual trigger for PENDING embeddings
  - M27 (cleanup): Manual trigger for orphan cleanup

# REMOVED (ADR-K003 v1.2): No longer event-driven
# Previously: entry_topic: cognitive.vector.stored.v1
# NOTE: Using placeholder topic for schema compliance (scheduled mode ignores this)
entry_topic: scheduled.p08.trigger.v1
exit_topic: cognitive.vector.indexed.v1

# ============================================================================
# DECLARATIVE TRIGGERS (ADR-K004 Capability Mesh)
# ============================================================================
# Migrated from hardcoded _p08_faiss_indexer_loop to declarative triggers.
# Replaces the legacy trigger_mode/schedule configuration.
#
# DEPRECATED (M5 Migration):
#   trigger_mode: scheduled
#   schedule:
#     interval_seconds: 300
#     batch_size: 100
#     catch_up_enabled: true
# ============================================================================

triggers:
  # Primary interval trigger: every 30 seconds for testing (production: 300s)
  - id: faiss_indexer_interval
    type: interval
    interval_seconds: 30
    batch_size: 100
    catch_up_enabled: true

  # Threshold trigger: when 5+ embeddings pending for READY status (testing)
  # Production: threshold_count: 50
  - id: faiss_indexer_threshold
    type: threshold
    table: st_vec
    condition: "status = 'READY'"
    threshold_count: 5
    check_interval_seconds: 10
    batch_size: 50

  # Manual trigger: for admin-initiated indexing via CLI or API
  - id: faiss_indexer_manual
    type: manual

concurrency: 1
max_queue_depth: 1000  # Retained for compatibility

required_capabilities:
  # Storage tables
  - st_vec.read
  - st_vec.write
  - st_hipp_events.read
  - st_hipp_events.write
  # FAISS operations
  - faiss.read
  - faiss.write
  # UltraBERT (for backfill/recompute)
  - ultrabert.embed

# Single-stage DAG: M24 FAISS Indexer (Batch Mode)
# ADR-K003 v1.2: Uses vec_query syscall instead of event subscription
dag:
  - id: stage_10_faiss_indexer
    module: embedding.faiss_indexer:v1
    depends_on: []
    description: |
      M24: Batch index vectors in FAISS for similarity search.
      ADR-K003 v1.2: Uses vec_query(status='READY') to find pending embeddings.
      Updates st_vec.status to INDEXED after successful FAISS add.
    latency_budget_ms: 50
    config:
      batch_size: 100          # Process up to 100 vectors per invocation
      use_syscalls: true       # Uses vec_query, vec_update_status, faiss_add
      emit_completion_event: false  # No event emission (scheduled mode)

# Performance targets
performance:
  # M24: FAISS indexing
  faiss_indexing_p95: 50ms
  faiss_search_p95: 50ms
  backfill_batch_duration_p95: 5s

  # M27: Cleanup
  cleanup_batch_size: 100
  cleanup_batch_duration_p95: 2s

# Observability
observability:
  metrics:
    - m24.vectors_indexed
    - m24.indexing_failures
    - m25.embeddings_backfilled
    - m25.backfill_failures
    - m27.embeddings_cleaned
    - m27.cleanup_failures

  tracing:
    - All modules emit trace identifiers
    - All syscalls include operation context

# Architecture references
related_adrs:
  - ADR-K003  # Inline Embedding via UltraBERT
  - ADR-K004  # FAISS Integration (IVF256,PQ64)

related_pipelines:
  - P02_WRITE  # Primary embedding generation (M22/M23)
