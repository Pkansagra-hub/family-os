# P02 Write Pipeline: Episodic Memory Formation
# Purpose: Transform cognitive.memory.write.committed.v1 → st_hipp_events + st_embedding_queue
# Owner: Intelligence Kernel (K0)
# Status: PRODUCTION
# ADRs: k009.2 (builder pattern), k010.1 (atomic writes), k007.2 (event bus)

pipeline_id: P02_WRITE
version: v1
name: P02 Write - Episodic Memory Formation
description: |
  Transforms committed memory write events into structured hippocampal records.
  Performs pattern separation, semantic projection, context enrichment, and atomic storage.

  Performance: 171ms P95 (v1 baseline; M04 optimization to reduce to ~150ms tracked separately).
  Primary exit topic: p02.write.complete.v1
  Additional emitter topics: memory.formed.v1, embedding.queued.v1, salience.computed.v1,
                            social.enriched.v1, privacy.masked.v1, cognitive.vector.stored.v1

  ADR-K003 Changes (v1.1):
  - Added M22 (embedding.extract_from_cache:v1) after stage_20
  - Replaced M14 embedding_queue_write with M23 (builders.embedding_write:v1)
  - Embeddings now stored inline in st_vec (no async P08 for primary generation)
  - cognitive.vector.stored.v1 event triggers P08 M24 FAISS indexing

  Future extension: Pipeline variants (P02_WRITE_FAST/COMPLETE) if differentiated QoS needed.

entry_topic: cognitive.memory.write.committed.v1
exit_topic: p02.write.complete.v1
concurrency: 1
max_queue_depth: 512

# Required storage capabilities (capability-based security model)
required_capabilities:
  - st_hipp_events.write
  - st_embedding_queue.write    # DEPRECATED (ADR-K003) - kept for backward compat
  - st_vec.write                # NEW (ADR-K003) - M23 inline embedding write
  - st_pipeline_processed.write
  - st_outbox.write
  - st_kg_edges.read            # ADR-K022: Changed from st_relationships.read

dag:
  # STAGE 10: DG Pattern Separation
  - id: stage_10_dg_pattern_separate
    module: hippocampus.pattern_separate:v1
    after: []
    description: Dentate Gyrus pattern separation - creates unique memory_id and detects novelty
    config:
      novelty_threshold: 0.7
      hash_seed: 42

  # STAGE 20: CA1 Semantic Projection
  # Note: Sequential with M01 for v1; can be parallelized in future perf tuning if needed
  - id: stage_20_ca1_semantic_project
    module: hippocampus.semantic_project:v1
    after:
      - stage_10_dg_pattern_separate
    description: CA1 semantic projection - extracts entities, relations, generates embeddings
    config:
      entity_extraction_model: spacy_en_core_web_sm
      kg_confidence_threshold: 0.6
      max_triples_per_event: 10
      embedding_queue_batch_size: 1

  # STAGE 22: Embedding Cache Extraction (ADR-K003)
  # NEW: Extracts 768-dim embedding from UltraBERT single-pass cache (0ms, cache hit)
  - id: stage_22_embedding_extract
    module: embedding.extract_from_cache:v1
    after:
      - stage_20_ca1_semantic_project
    description: Extract embedding from UltraBERT cache (ADR-K003 inline embedding)
    config:
      fallback_to_direct_call: true
      expected_vector_dim: 768
      model_id: ultrabert_v2.1.0

  # STAGE 30-33: Core Cognition (Parallel Group 1)
  - id: stage_30_affect_analyze
    module: affect.analyze:v1
    after:
      - stage_20_ca1_semantic_project
    description: Affect analysis - detects valence, arousal, dominance from content
    config:
      confidence_threshold: 0.8

  - id: stage_31_space_resolve
    module: space.resolve_visibility:v1
    after:
      - stage_20_ca1_semantic_project
    description: Space visibility resolution - determines household/personal/shared scope
    config:
      visibility_mode: household

  - id: stage_32_social_resolve
    module: social.family_graph_resolve:v1
    after:
      - stage_20_ca1_semantic_project
    description: Social graph resolution - identifies participants and relationships
    config:
      cache_ttl_seconds: 300
      default_social_context: solo
      default_social_intimacy: LOW
      max_participants_to_resolve: 20

  - id: stage_33_temporal_profile
    module: context.temporal_profile:v1
    after:
      - stage_20_ca1_semantic_project
    description: Temporal profiling - extracts time-of-day, day-of-week patterns
    config:
      timezone_source: tenant_config

  # STAGE 40-43: Context Enrichment (Parallel Group 2)
  - id: stage_40_device_profile
    module: context.device_profile:v1
    after:
      - stage_20_ca1_semantic_project
    description: Device profiling - captures device type, OS, client version
    config:
      default_device_kind: phone
      supported_platforms:
        - iOS
        - Android
        - web
      minimum_client_version: "2.0.0"

  - id: stage_41_ingress_classify
    module: context.ingress_classify:v1
    after:
      - stage_20_ca1_semantic_project
    description: Ingress classification - determines activity type and content type
    config:
      default_activity_type: routine
      default_content_type: episodic
      supported_ingress_topics:
        - cognitive.memory.write.committed.v1
        - cognitive.observation.captured.v1

  - id: stage_42_geo_metadata
    module: context.geo_metadata:v1
    after:
      - stage_20_ca1_semantic_project
    description: Geo metadata enrichment - extracts location type and geohash
    config:
      default_location_type: unknown
      default_geo_precision: 6
      validate_geohash_format: true

  - id: stage_43_spatial_minimal
    module: context.spatial_minimal:v1
    after:
      - stage_20_ca1_semantic_project
    description: Spatial minimal processing - privacy-aware location handling
    config:
      green_band_precision: 6
      amber_band_precision: 4
      red_band_precision: 0
      allow_null_location: true

  # STAGE 50: Retention Lookup (depends on device_kind from stage_40)
  - id: stage_50_retention_lookup
    module: context.retention_lookup:v1
    after:
      - stage_40_device_profile
    description: Retention policy lookup - determines storage duration based on device/content
    config:
      default_retention_bucket: STANDARD
      default_retention_days: 365
      cache_ttl_seconds: 600
      fallback_policy_chain:
        - device_kind
        - content_type
        - activity_type

  # STAGE 55: Salience Scoring (depends on affect + social + temporal)
  - id: stage_55_salience_score
    module: salience.score:v1
    after:
      - stage_30_affect_analyze
      - stage_32_social_resolve
      - stage_33_temporal_profile
    description: Salience scoring - computes memory importance from affect, social, recency
    config:
      social_weight: 0.50
      affect_weight: 0.40
      recency_weight: 0.10

  # STAGE 60-61: Builders (Parallel)
  # Note: Row builder depends on ALL enrichment stages by design; do not simplify
  - id: stage_60_build_hipp_events_row
    module: builders.hipp_events_row:v1
    after:
      - stage_10_dg_pattern_separate
      - stage_20_ca1_semantic_project
      - stage_22_embedding_extract  # NEW (ADR-K003) - embedding data for st_hipp_events
      - stage_30_affect_analyze
      - stage_31_space_resolve
      - stage_32_social_resolve
      - stage_33_temporal_profile
      - stage_40_device_profile
      - stage_41_ingress_classify
      - stage_42_geo_metadata
      - stage_43_spatial_minimal
      - stage_50_retention_lookup
      - stage_55_salience_score
    description: Row builder - assembles complete st_hipp_events row from all module outputs
    config:
      validate_required_fields: true

  # STAGE 70: Atomic Storage Commit (ADR-K003 v1.2)
  # Merged: stage_61 (embedding_write) now integrated into stage_70 for atomic 3-table transaction
  - id: stage_70_atomic_writer
    module: core.hipp_events_writer:v1
    after:
      - stage_60_build_hipp_events_row
      - stage_22_embedding_extract  # NEW (ADR-K003 v1.2) - embedding data for st_vec
    description: |
      Atomic writer - commits st_hipp_events + st_vec + st_pipeline_processed.
      ADR-K003 v1.2: Merged M23 into M16 for atomic 3-table transaction.
      Order: st_hipp_events FIRST, st_vec SECOND (FK constraint satisfied).
      If embedding missing: sets embedding_status=PENDING (P08 backfill handles).
    config:
      batch_size: 128
      retry_backoff_ms: 100
      max_retry_attempts: 3
      write_embedding: true  # NEW: enables st_vec write
      emit_stored_event: true
      stored_event_topic: cognitive.vector.stored.v1

  # STAGE 80: Event Emission
  - id: stage_80_event_emitter
    module: core.event_emitter:v1
    after:
      - stage_70_atomic_writer
    description: Event emitter - publishes completion events and telemetry to st_outbox
    config:
      enable_telemetry_event: true
      batch_emit_enabled: true
