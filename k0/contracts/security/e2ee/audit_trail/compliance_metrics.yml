---
# ADR-0036: Compliance Metrics Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Compliance Metrics Contract
# Defines metrics, monitoring, and reporting for E2EE audit trail compliance

contract:
  name: compliance_metrics
  version: "1.0.0"
  description: "Compliance metrics, monitoring, and reporting for E2EE audit trails"
  parent_adr: "ADR-0036"
  priority: "HIGH"
  effort: "2 weeks"

# Compliance Metrics Framework
compliance_metrics_framework:
  metric_categories:
    security_metrics:
      - "Encryption operation success rates"
      - "Key management operation success rates"
      - "Audit log integrity verification"
      - "Access control enforcement"
      - "Breach detection and response times"

    compliance_metrics:
      - "GDPR compliance adherence"
      - "HIPAA compliance adherence"
      - "Audit trail completeness"
      - "Retention period compliance"
      - "Data subject rights fulfillment"

    operational_metrics:
      - "System availability and uptime"
      - "Performance against SLAs"
      - "Error rates and incident frequency"
      - "User adoption and satisfaction"
      - "Resource utilization efficiency"

    audit_metrics:
      - "Audit log coverage completeness"
      - "Audit review timeliness"
      - "Compliance violation detection"
      - "Remediation action effectiveness"
      - "Audit finding resolution rates"

  metric_hierarchy:
    organizational_level:
      - "Overall compliance score"
      - "Regulatory framework adherence"
      - "Risk mitigation effectiveness"
      - "Continuous improvement progress"

    system_level:
      - "Component compliance scores"
      - "Integration compliance"
      - "Security control effectiveness"
      - "Performance compliance"

    operational_level:
      - "Daily compliance status"
      - "Incident response metrics"
      - "User access compliance"
      - "Audit trail maintenance"

# Security Metrics
security_metrics:
  encryption_metrics:
    encryption_success_rate:
      metric: "encryption_success_rate"
      type: "percentage"
      description: "Percentage of successful encryption operations"
      target: ">99.9%"
      critical_threshold: "<99.5%"
      measurement_period: "1 hour"
      aggregation: "average"

    decryption_success_rate:
      metric: "decryption_success_rate"
      type: "percentage"
      description: "Percentage of successful decryption operations"
      target: ">99.9%"
      critical_threshold: "<99.5%"
      measurement_period: "1 hour"
      aggregation: "average"

    encryption_latency:
      metric: "encryption_latency_ms"
      type: "histogram"
      description: "Time taken for encryption operations"
      target: "<1ms p95"
      critical_threshold: ">10ms p95"
      measurement_period: "1 minute"
      buckets: "[0.1, 0.5, 1, 5, 10, 50, 100]"

  key_management_metrics:
    key_operation_success_rate:
      metric: "key_operation_success_rate"
      type: "percentage"
      description: "Percentage of successful key management operations"
      target: ">99.99%"
      critical_threshold: "<99.9%"
      measurement_period: "1 hour"
      aggregation: "average"

    key_rotation_success_rate:
      metric: "key_rotation_success_rate"
      type: "percentage"
      description: "Percentage of successful key rotations"
      target: ">99.9%"
      critical_threshold: "<99%"
      measurement_period: "1 day"
      aggregation: "average"

    key_compromise_incidents:
      metric: "key_compromise_incidents"
      type: "counter"
      description: "Number of key compromise incidents"
      target: "0"
      critical_threshold: ">0"
      measurement_period: "1 day"
      reset_period: "never"

  audit_integrity_metrics:
    audit_log_integrity_violations:
      metric: "audit_log_integrity_violations"
      type: "counter"
      description: "Number of audit log integrity violations detected"
      target: "0"
      critical_threshold: ">0"
      measurement_period: "1 hour"
      alert_immediately: true

    audit_log_completeness:
      metric: "audit_log_completeness"
      type: "percentage"
      description: "Percentage of expected audit events captured"
      target: ">99.99%"
      critical_threshold: "<99.9%"
      measurement_period: "1 hour"
      aggregation: "average"

# Compliance Metrics
compliance_metrics:
  gdpr_compliance_metrics:
    data_subject_rights_fulfillment:
      metric: "data_subject_rights_fulfillment_rate"
      type: "percentage"
      description: "Percentage of data subject rights requests fulfilled within timeframe"
      target: ">95%"
      critical_threshold: "<90%"
      measurement_period: "1 month"
      aggregation: "average"

    lawful_basis_documentation:
      metric: "lawful_basis_documentation_completeness"
      type: "percentage"
      description: "Percentage of processing activities with documented lawful basis"
      target: ">100%"
      critical_threshold: "<100%"
      measurement_period: "1 month"
      aggregation: "average"

    breach_notification_compliance:
      metric: "breach_notification_compliance"
      type: "percentage"
      description: "Percentage of breaches notified within 72 hours"
      target: ">100%"
      critical_threshold: "<100%"
      measurement_period: "1 month"
      aggregation: "count"

  hipaa_compliance_metrics:
    phi_access_audit_completeness:
      metric: "phi_access_audit_completeness"
      type: "percentage"
      description: "Percentage of PHI access events properly audited"
      target: ">99.99%"
      critical_threshold: "<99.9%"
      measurement_period: "1 day"
      aggregation: "average"

    security_incident_response_time:
      metric: "security_incident_response_time_hours"
      type: "histogram"
      description: "Time to respond to security incidents"
      target: "<4 hours p95"
      critical_threshold: ">24 hours p95"
      measurement_period: "1 month"
      buckets: "[1, 4, 8, 24, 48, 72]"

    risk_analysis_completeness:
      metric: "risk_analysis_completeness"
      type: "percentage"
      description: "Percentage of required risk analyses completed"
      target: ">100%"
      critical_threshold: "<100%"
      measurement_period: "1 year"
      aggregation: "average"

  audit_trail_compliance:
    retention_compliance:
      metric: "retention_compliance"
      type: "percentage"
      description: "Percentage of audit data retained according to policy"
      target: ">99.99%"
      critical_threshold: "<99.9%"
      measurement_period: "1 month"
      aggregation: "average"

    audit_review_completeness:
      metric: "audit_review_completeness"
      type: "percentage"
      description: "Percentage of required audit reviews completed"
      target: ">95%"
      critical_threshold: "<90%"
      measurement_period: "1 month"
      aggregation: "average"

# Operational Metrics
operational_metrics:
  system_availability:
    e2ee_service_availability:
      metric: "e2ee_service_availability"
      type: "percentage"
      description: "Percentage of time E2EE service is available"
      target: ">99.9%"
      critical_threshold: "<99.5%"
      measurement_period: "1 month"
      aggregation: "average"

    audit_service_availability:
      metric: "audit_service_availability"
      type: "percentage"
      description: "Percentage of time audit service is available"
      target: ">99.95%"
      critical_threshold: "<99.9%"
      measurement_period: "1 month"
      aggregation: "average"

  performance_metrics:
    end_to_end_latency:
      metric: "e2ee_end_to_end_latency_ms"
      type: "histogram"
      description: "End-to-end latency for E2EE operations"
      target: "<2000ms p95"
      critical_threshold: ">5000ms p95"
      measurement_period: "1 minute"
      buckets: "[100, 500, 1000, 2000, 5000, 10000]"

    throughput_operations_per_second:
      metric: "e2ee_operations_per_second"
      type: "gauge"
      description: "Number of E2EE operations processed per second"
      target: ">1000 ops/sec"
      critical_threshold: "<500 ops/sec"
      measurement_period: "1 minute"
      aggregation: "average"

  error_incident_metrics:
    error_rate:
      metric: "e2ee_error_rate"
      type: "percentage"
      description: "Percentage of E2EE operations that result in errors"
      target: "<0.1%"
      critical_threshold: ">1%"
      measurement_period: "1 hour"
      aggregation: "average"

    security_incidents:
      metric: "security_incidents_total"
      type: "counter"
      description: "Total number of security incidents"
      target: "minimize"
      critical_threshold: "any increase"
      measurement_period: "1 day"
      alert_immediately: true

# Audit Metrics
audit_metrics:
  audit_coverage:
    audit_event_coverage:
      metric: "audit_event_coverage"
      type: "percentage"
      description: "Percentage of system events covered by audit logging"
      target: ">99.9%"
      critical_threshold: "<99%"
      measurement_period: "1 day"
      aggregation: "average"

    audit_data_integrity:
      metric: "audit_data_integrity_score"
      type: "gauge"
      description: "Score representing audit data integrity (0-100)"
      target: ">99"
      critical_threshold: "<95"
      measurement_period: "1 hour"
      aggregation: "average"

  audit_review_metrics:
    audit_review_timeliness:
      metric: "audit_review_timeliness_days"
      type: "histogram"
      description: "Time taken to complete audit reviews"
      target: "<7 days p95"
      critical_threshold: ">30 days p95"
      measurement_period: "1 month"
      buckets: "[1, 7, 14, 30, 60, 90]"

    audit_findings_resolution_rate:
      metric: "audit_findings_resolution_rate"
      type: "percentage"
      description: "Percentage of audit findings resolved within timeframe"
      target: ">90%"
      critical_threshold: "<75%"
      measurement_period: "1 month"
      aggregation: "average"

  compliance_violation_detection:
    compliance_violations_detected:
      metric: "compliance_violations_detected"
      type: "counter"
      description: "Number of compliance violations detected"
      target: "minimize"
      critical_threshold: "any"
      measurement_period: "1 day"
      alert_immediately: true

    false_positive_rate:
      metric: "compliance_false_positive_rate"
      type: "percentage"
      description: "Percentage of detected violations that are false positives"
      target: "<5%"
      critical_threshold: ">20%"
      measurement_period: "1 month"
      aggregation: "average"

# Monitoring and Alerting
monitoring_alerting:
  alerting_rules:
    critical_alerts:
      - "audit_log_integrity_violations > 0"
      - "key_compromise_incidents > 0"
      - "e2ee_service_availability < 99.5%"
      - "compliance_violations_detected > 0"
      - "breach_notification_compliance < 100%"

    warning_alerts:
      - "encryption_success_rate < 99.9%"
      - "audit_review_timeliness_days p95 > 7"
      - "data_subject_rights_fulfillment_rate < 95%"
      - "phi_access_audit_completeness < 99.9%"
      - "e2ee_end_to_end_latency_ms p95 > 2000"

    informational_alerts:
      - "key_rotation_success_rate < 99.9%"
      - "audit_review_completeness < 95%"
      - "retention_compliance < 99.99%"
      - "error_rate > 0.1%"

  dashboard_requirements:
    executive_dashboard:
      - "Overall compliance score"
      - "Critical metric status summary"
      - "Trend analysis over time"
      - "Top compliance risks"
      - "Recent security incidents"

    operational_dashboard:
      - "Real-time system health"
      - "Performance metrics"
      - "Error rates and incidents"
      - "Audit log status"
      - "Key management status"

    compliance_dashboard:
      - "Regulatory compliance status"
      - "Audit findings and resolutions"
      - "Risk assessment results"
      - "Training completion rates"
      - "Policy acknowledgment status"

# Reporting Framework
reporting_framework:
  scheduled_reports:
    daily_reports:
      - "System health and availability"
      - "Security incident summary"
      - "Compliance metric status"
      - "Audit log integrity verification"

    weekly_reports:
      - "Compliance trend analysis"
      - "Audit review completion status"
      - "Risk assessment updates"
      - "Performance optimization opportunities"

    monthly_reports:
      - "Comprehensive compliance assessment"
      - "Regulatory reporting requirements"
      - "Audit findings and remediation"
      - "Continuous improvement initiatives"

    quarterly_reports:
      - "Annual compliance certification preparation"
      - "Risk management effectiveness"
      - "Security control validation"
      - "Business continuity testing results"

  ad_hoc_reporting:
    incident_reports:
      - "Security incident investigation reports"
      - "Breach notification documentation"
      - "Compliance violation investigations"
      - "System outage post-mortem reports"

    compliance_reports:
      - "Data subject rights fulfillment reports"
      - "Audit trail completeness reports"
      - "Risk assessment documentation"
      - "Third-party audit reports"

# Implementation Interface
implementation:
  rust:
    struct: "ComplianceMetricsCollector"
    functions:
      - "new(config: MetricsConfig) -> Result<Self, MetricsError>"
      - "collect_security_metrics(&self) -> Result<SecurityMetrics, MetricsError>"
      - "collect_compliance_metrics(&self) -> Result<ComplianceMetrics, MetricsError>"
      - "collect_operational_metrics(&self) -> Result<OperationalMetrics, MetricsError>"
      - "generate_compliance_report(&self, period: TimePeriod) -> Result<ComplianceReport, MetricsError>"
      - "check_alert_conditions(&self) -> Result<Vec<Alert>, MetricsError>"

  python:
    class: "ComplianceMetricsCollector"
    methods:
      - "__init__(self, config: dict)"
      - "collect_security_metrics(self) -> dict"
      - "collect_compliance_metrics(self) -> dict"
      - "collect_operational_metrics(self) -> dict"
      - "generate_compliance_report(self, period: str) -> dict"
      - "check_alert_conditions(self) -> list"

# Testing Requirements
testing:
  unit_tests:
    - "Metric calculation accuracy"
    - "Alert condition evaluation"
    - "Report generation completeness"
    - "Data aggregation correctness"
    - "Threshold validation logic"

  integration_tests:
    - "Metrics collection from all components"
    - "Alert system integration"
    - "Dashboard data flow"
    - "Report generation workflow"
    - "Historical data retention"

  performance_tests:
    - "Metrics collection performance"
    - "Report generation scalability"
    - "Alert processing latency"
    - "Dashboard query performance"
    - "Data retention efficiency"

  validation_tests:
    - "Metric accuracy against ground truth"
    - "Alert false positive/negative rates"
    - "Compliance calculation verification"
    - "Regulatory reporting completeness"
    - "Audit trail coverage validation"

# Dependencies
dependencies:
  upstream:
    - "e2ee_audit_logger.yml: Provides audit data for metrics"
    - "audit_schema.yml: Defines metric data schemas"
    - "gdpr_compliance.yml: GDPR compliance metrics"
    - "hipaa_compliance.yml: HIPAA compliance metrics"
    - "byok_documentation.yml: BYOK compliance metrics"
  downstream:
    - "None - final consumer of compliance data"

# Success Criteria
success_criteria:
  functional:
    - "All required metrics collected accurately"
    - "Alerts triggered correctly for threshold violations"
    - "Reports generated on schedule and on-demand"
    - "Dashboards display real-time compliance status"
    - "Historical data retained according to policy"

  accuracy:
    - "Metrics calculated with >99.9% accuracy"
    - "Alert false positive rate <5%"
    - "Report data completeness >99%"
    - "Dashboard data freshness <5 minutes"
    - "Historical data integrity maintained"

  performance:
    - "Metrics collection completes within 1 minute"
    - "Alert evaluation completes within 100ms"
    - "Report generation completes within 10 minutes"
    - "Dashboard queries respond within 2 seconds"
    - "System handles 10x normal load without degradation"

  compliance:
    - "All regulatory reporting requirements met"
    - "Audit trail covers all compliance-relevant events"
    - "Metrics support automated compliance assessments"
    - "Data retention meets regulatory requirements"
    - "Access controls protect sensitive compliance data"

  usability:
    - "Dashboards intuitive and actionable"
    - "Alerts provide clear remediation guidance"
    - "Reports formatted for executive and technical audiences"
    - "API provides programmatic access to all metrics"
    - "Documentation covers all metric definitions and usage"