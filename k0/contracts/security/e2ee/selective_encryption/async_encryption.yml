---
# ADR-0036: Async Encryption Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Async Encryption Contract
# Defines asynchronous E2EE encryption for non-blocking operations

contract:
  name: async_encryption
  version: "1.0.0"
  description: "Asynchronous E2EE encryption for non-blocking SessionState processing"
  parent_adr: "ADR-0036"
  priority: "HIGH"
  effort: "2 weeks"

# Async Processing Model
async_processing_model:
  execution_model: "Event-driven async processing with futures/promises"
  concurrency_model: "Async/await with task parallelism"
  scheduling_model: "Priority-based task scheduling"
  completion_model: "Callback/promise-based completion notification"

  components:
    - "async_scheduler: Schedules encryption tasks asynchronously"
    - "task_queue: Priority queue for async tasks"
    - "completion_handler: Handles task completion callbacks"
    - "progress_tracker: Tracks async operation progress"
    - "timeout_manager: Manages async operation timeouts"

# Async Task Model
async_task_model:
  encryption_task:
    task_id: "Unique async task identifier"
    sessionstate_id: "ID of SessionState being processed"
    sections_to_encrypt: "List of sections requiring encryption"
    encryption_context: "User, space, operation context"
    priority: "HIGH, NORMAL, LOW"
    timeout_seconds: 300
    callback_url: "Webhook for completion notification"
    retry_policy: "Retry configuration"

  task_lifecycle:
    submitted: "Task submitted to async queue"
    scheduled: "Task scheduled for execution"
    executing: "Task currently executing"
    completed: "Task completed successfully"
    failed: "Task failed with error"
    cancelled: "Task cancelled by user/system"
    timed_out: "Task exceeded timeout"

  task_metadata:
    submitted_at: "Task submission timestamp"
    started_at: "Task execution start timestamp"
    completed_at: "Task completion timestamp"
    progress_percentage: "Completion progress (0-100)"
    estimated_completion: "Estimated completion time"
    worker_id: "Worker executing the task"

# Async Execution Strategies
async_execution_strategies:
  background_encryption:
    description: "Encrypt SessionState in background after creation"
    use_case: "Non-critical SessionState creation"
    benefits: "Non-blocking user experience"
    trade_offs: "Potential data inconsistency window"

  lazy_background_encryption:
    description: "Defer encryption until system is idle"
    use_case: "Low-priority encryption during off-peak"
    benefits: "Minimal performance impact"
    scheduling: "Execute during low system load"

  progressive_encryption:
    description: "Encrypt sections progressively over time"
    use_case: "Large SessionState with many sections"
    benefits: "Smooth performance impact"
    implementation: "Encrypt few sections at a time"

  batch_async_encryption:
    description: "Batch multiple SessionState encryptions"
    use_case: "Bulk operations, data migration"
    benefits: "Efficient resource utilization"
    optimization: "Group similar encryption tasks"

# Queue Management
queue_management:
  priority_queues:
    critical: "Immediate encryption (security requirements)"
    high: "Fast encryption (< 30 seconds)"
    normal: "Standard encryption (< 5 minutes)"
    low: "Background encryption (< 1 hour)"

  queue_discipline:
    fifo_per_priority: "First-in-first-out within priority"
    priority_preemption: "Higher priority tasks preempt lower"
    fair_scheduling: "Prevent priority starvation"
    load_balancing: "Distribute across available workers"

  queue_limits:
    max_queue_depth: 1000
    max_per_user: 50
    max_per_space: 200
    queue_timeout: "24 hours maximum queue time"

# Completion Handling
completion_handling:
  callback_mechanisms:
    webhook: "HTTP POST to configured URL"
    websocket: "Real-time notification via WebSocket"
    polling: "Client polls for completion status"
    push_notification: "Mobile/desktop push notification"

  completion_payload:
    task_id: "Completed task identifier"
    status: "COMPLETED, FAILED, CANCELLED, TIMED_OUT"
    result_data: "Encryption results or error details"
    completion_time: "Task completion timestamp"
    performance_metrics: "Encryption performance data"

  error_handling:
    retry_failed_tasks: "Retry failed tasks with backoff"
    notify_on_failure: "Alert user/system of failures"
    cleanup_failed_tasks: "Clean up partial encryption state"
    audit_failures: "Log failures for analysis"

# Progress Tracking
progress_tracking:
  progress_metrics:
    sections_processed: "Number of sections encrypted"
    total_sections: "Total sections to encrypt"
    bytes_processed: "Bytes encrypted so far"
    total_bytes: "Total bytes to encrypt"
    estimated_time_remaining: "ETA based on current progress"

  progress_reporting:
    real_time_updates: "WebSocket updates during encryption"
    periodic_callbacks: "Regular progress notifications"
    milestone_notifications: "Notify at 25%, 50%, 75%, 100%"
    final_completion: "Final completion notification"

  progress_persistence:
    store_progress: "Persist progress for recovery"
    resume_on_restart: "Resume interrupted encryption"
    progress_cleanup: "Clean up progress after completion"

# Timeout and Cancellation
timeout_cancellation:
  timeout_policies:
    per_task_timeout: "Individual task timeout limits"
    queue_timeout: "Maximum time in queue"
    execution_timeout: "Maximum execution time"
    total_timeout: "End-to-end timeout from submission"

  cancellation_mechanisms:
    user_cancellation: "User can cancel their tasks"
    system_cancellation: "System cancels low-priority tasks"
    timeout_cancellation: "Automatic cancellation on timeout"
    dependency_cancellation: "Cancel dependent tasks"

  cancellation_cleanup:
    partial_cleanup: "Clean up partially encrypted data"
    resource_cleanup: "Free allocated resources"
    notification: "Notify of cancellation"
    audit_logging: "Log cancellation for compliance"

# Resource Management
resource_management:
  worker_allocation:
    dedicated_workers: "Workers dedicated to async encryption"
    shared_workers: "Workers shared with sync encryption"
    dynamic_scaling: "Scale workers based on queue depth"
    resource_limits: "CPU, memory limits per worker"

  memory_management:
    streaming_encryption: "Process large data without full loading"
    memory_limits: "Prevent memory exhaustion"
    garbage_collection: "Trigger GC during long operations"
    buffer_pool: "Reuse memory buffers"

  io_management:
    async_io: "Non-blocking I/O operations"
    bandwidth_limits: "Control encryption I/O bandwidth"
    prioritization: "Prioritize critical encryption I/O"

# Performance Optimization
performance_optimization:
  task_batching:
    group_similar_tasks: "Batch tasks with similar characteristics"
    optimize_key_usage: "Reuse keys across batched tasks"
    reduce_context_switching: "Minimize worker context switches"

  caching_optimization:
    key_caching: "Cache frequently used keys"
    result_caching: "Cache encryption results when applicable"
    metadata_caching: "Cache SessionState metadata"

  algorithm_optimization:
    hardware_acceleration: "Use AES-NI when available"
    parallel_encryption: "Encrypt multiple sections concurrently"
    compression: "Compress before encryption for large data"

# Monitoring and Alerting
monitoring_alerting:
  queue_metrics:
    metric: "async_encryption_queue_depth"
    labels: ["priority"]
    description: "Number of queued async tasks"

  performance_metrics:
    metric: "async_encryption_duration_seconds"
    labels: ["priority", "result"]
    description: "Async encryption operation timing"

  throughput_metrics:
    metric: "async_encryption_throughput_bytes_per_second"
    labels: ["priority"]
    description: "Async encryption throughput"

  error_metrics:
    metric: "async_encryption_errors_total"
    labels: ["error_type", "priority"]
    description: "Async encryption error counts"

# Implementation Interface
implementation:
  rust:
    struct: "AsyncEncryptor"
    functions:
      - "new(config: AsyncConfig) -> Result<Self, AsyncError>"
      - "submit_encryption_task(&self, task: EncryptionTask) -> Result<TaskId, AsyncError>"
      - "get_task_status(&self, task_id: TaskId) -> Result<TaskStatus, AsyncError>"
      - "cancel_task(&self, task_id: TaskId) -> Result<(), AsyncError>"
      - "get_queue_status(&self) -> QueueStatus"

  python:
    class: "AsyncEncryptor"
    methods:
      - "__init__(self, config: dict)"
      - "submit_encryption_task(self, task: dict) -> str"
      - "get_task_status(self, task_id: str) -> dict"
      - "cancel_task(self, task_id: str) -> None"
      - "get_queue_status(self) -> dict"

# Testing Requirements
testing:
  unit_tests:
    - "Async task submission and execution"
    - "Queue management and prioritization"
    - "Completion handling and callbacks"
    - "Timeout and cancellation logic"
    - "Progress tracking accuracy"

  integration_tests:
    - "Full async encryption workflow"
    - "Callback mechanism functionality"
    - "Queue overflow and backpressure"
    - "Worker scaling and resource management"
    - "Error recovery and retry logic"

  performance_tests:
    - "Async encryption throughput"
    - "Queue processing latency"
    - "Concurrent task handling"
    - "Memory usage under load"
    - "Scalability with increasing load"

  reliability_tests:
    - "Worker failure recovery"
    - "System restart task recovery"
    - "Network failure handling"
    - "Long-running task management"
    - "Resource exhaustion scenarios"

# Dependencies
dependencies:
  upstream:
    - "parallel_encryption.yml: Provides encryption capabilities"
    - "sessionstate_integration.yml: Integrates with SessionState"
  downstream:
    - "e2ee_manager.yml: Uses async encryption for non-blocking ops"
    - "graceful_degradation.yml: Handles async encryption failures"

# Success Criteria
success_criteria:
  functional:
    - "Async encryption tasks execute correctly"
    - "Progress tracking and callbacks work"
    - "Queue management handles load properly"
    - "Timeout and cancellation work reliably"

  performance:
    - "Async encryption doesn't block user operations"
    - "Queue processing within acceptable latency"
    - "High throughput for background encryption"
    - "Efficient resource utilization"

  reliability:
    - "Robust error handling and recovery"
    - "Task persistence across restarts"
    - "Proper cleanup on failures"
    - "Comprehensive monitoring and alerting"

  user_experience:
    - "Non-blocking encryption operations"
    - "Clear progress indication"
    - "Reliable completion notifications"
    - "Graceful handling of failures"
