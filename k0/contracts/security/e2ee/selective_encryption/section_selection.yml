---
# ADR-0036: Section Selection Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Section Selection Contract
# Defines logic for selecting SessionState sections for encryption

contract:
  name: section_selection
  version: "1.0.0"
  description: "Logic for selecting SessionState sections requiring E2EE encryption"
  parent_adr: "ADR-0036"
  priority: "HIGH"
  effort: "2 weeks"

# Selection Criteria
selection_criteria:
  primary_criteria:
    - "Privacy band classification = RED"
    - "Section contains sensitive user data"
    - "Section requires owner-only access"
    - "Section contains beliefs/scoreboard/control data"

  secondary_criteria:
    - "Section size suitable for encryption (< 10MB)"
    - "Section has defined encryption boundaries"
    - "Section supports encryption metadata"
    - "Section has backup/recovery mechanisms"

  exclusion_criteria:
    - "Section already encrypted"
    - "Section marked encryption-exempt"
    - "Section contains only public data"
    - "Section required for system operation (unencrypted)"

# Selection Process
selection_process:
  1:
    name: "Band-based filtering"
    description: "Filter sections by privacy band"
    input: "Classification results from band detector"
    filter: "Only RED band sections"
    output: "Candidate sections for encryption"

  2:
    name: "Policy evaluation"
    description: "Apply space and user policies"
    input: "Candidate sections + policy context"
    evaluation: "Check encryption requirements, exemptions"
    output: "Policy-compliant sections"

  3:
    name: "Technical feasibility"
    description: "Verify encryption technical requirements"
    input: "Policy-compliant sections"
    checks: ["size limits", "format compatibility", "key availability"]
    output: "Technically feasible sections"

  4:
    name: "Priority ordering"
    description: "Order sections by encryption priority"
    input: "Feasible sections"
    ordering: ["criticality", "size", "access frequency"]
    output: "Prioritized section list"

  5:
    name: "Batch optimization"
    description: "Group sections for efficient processing"
    input: "Prioritized sections"
    grouping: "Similar sections, size balancing"
    output: "Optimized encryption batches"

# Section Categories
section_categories:
  core_beliefs:
    paths: ["beliefs.*", "beliefs.core.*", "beliefs.user.*"]
    priority: "CRITICAL"
    reason: "Fundamental user mental models"
    encryption_mode: "full_section"
    size_expectation: "1-5MB"

  scoreboard_data:
    paths: ["scoreboard.*", "metrics.*", "evaluation.*"]
    priority: "CRITICAL"
    reason: "Performance and evaluation metrics"
    encryption_mode: "full_section"
    size_expectation: "500KB-2MB"

  control_state:
    paths: ["control.*", "state.*", "decision.*"]
    priority: "HIGH"
    reason: "Decision logic and control state"
    encryption_mode: "selective_fields"
    size_expectation: "100KB-1MB"

  user_profile:
    paths: ["profile.*", "preferences.*", "settings.*"]
    priority: "HIGH"
    reason: "Personal user data"
    encryption_mode: "conditional"
    size_expectation: "50KB-500KB"

  session_metadata:
    paths: ["metadata.*", "session.*", "context.*"]
    priority: "MEDIUM"
    reason: "Session identification data"
    encryption_mode: "selective"
    size_expectation: "10KB-100KB"

# Selection API
selection_api:
  select_sections:
    function: "select_sections(sessionstate: SessionState, classifications: dict, context: SelectionContext) -> SelectionResult"
    description: "Select sections requiring encryption"
    parameters:
      sessionstate: "SessionState to analyze"
      classifications: "Band classifications for sections"
      context: "Selection context (policies, preferences)"
    returns:
      selected_sections: "List of sections to encrypt"
      selection_reasons: "Reasons for each selection"
      priority_order: "Encryption priority order"
      estimated_size: "Total estimated encryption size"

  validate_selection:
    function: "validate_selection(selection: SelectionResult, constraints: SelectionConstraints) -> ValidationResult"
    description: "Validate section selection"
    parameters:
      selection: "Section selection result"
      constraints: "Selection constraints (size, count, etc.)"
    returns: "Validation status and any violations"

  optimize_selection:
    function: "optimize_selection(selection: SelectionResult, optimization_goals: dict) -> OptimizedSelection"
    description: "Optimize selection for performance"
    parameters:
      selection: "Initial section selection"
      optimization_goals: "Performance and efficiency goals"
    returns: "Optimized selection with batching"

# Selection Constraints
selection_constraints:
  size_limits:
    max_total_size: "10MB per SessionState"
    max_section_size: "5MB per section"
    min_section_size: "1KB (below this, not worth encrypting)"

  count_limits:
    max_sections: "50 sections per SessionState"
    max_red_sections: "20 RED sections per SessionState"
    batch_size_limit: "10 sections per encryption batch"

  performance_constraints:
    max_selection_time: "< 20ms"
    max_analysis_time: "< 10ms per section"
    memory_limit: "< 5MB during selection"

  policy_constraints:
    respect_user_opt_out: "Skip encryption if user opts out"
    enforce_space_policy: "Follow space encryption policies"
    comply_regulatory: "Meet GDPR/HIPAA requirements"

# Selection Strategies
selection_strategies:
  conservative:
    description: "Encrypt all RED sections, no exceptions"
    use_case: "High security requirements"
    trade_off: "Maximum security, potential performance impact"

  balanced:
    description: "Encrypt RED sections, optimize for performance"
    use_case: "Standard operation"
    trade_off: "Good security with acceptable performance"

  performance_optimized:
    description: "Encrypt critical RED sections only"
    use_case: "Performance-critical operations"
    trade_off: "Minimal performance impact, reduced security coverage"

  adaptive:
    description: "Dynamically adjust based on context"
    use_case: "Variable requirements"
    adaptation: "Based on user preferences, space policies, system load"

# Dynamic Selection
dynamic_selection:
  context_awareness:
    user_preferences: "Respect user's E2EE preferences"
    space_policies: "Follow space-specific policies"
    regulatory_requirements: "Meet compliance requirements"
    performance_requirements: "Consider performance budgets"

  runtime_adaptation:
    system_load: "Reduce encryption scope under high load"
    key_availability: "Skip encryption if keys unavailable"
    user_consent: "Require explicit consent for sensitive data"
    emergency_mode: "Minimal encryption during emergencies"

  learning_adaptation:
    usage_patterns: "Learn from past selections"
    effectiveness_metrics: "Measure encryption effectiveness"
    user_feedback: "Incorporate user corrections"
    policy_updates: "Adapt to policy changes"

# Selection Metadata
selection_metadata:
  selection_record:
    timestamp: "Selection timestamp"
    selector_version: "Version of selection logic"
    criteria_used: "Selection criteria applied"
    context_snapshot: "Context at time of selection"
    performance_metrics: "Selection performance data"

  section_metadata:
    section_path: "Full path to section"
    band_classification: "RED/AMBER/GREEN"
    selection_reason: "Why section was selected"
    encryption_mode: "How section will be encrypted"
    estimated_size: "Estimated encrypted size"
    priority_score: "Encryption priority (0-1)"

# Error Handling
error_handling:
  selection_failure:
    error_code: "SECTION_SELECTION_FAILED"
    description: "Cannot determine sections to encrypt"
    recovery: "Use conservative default (encrypt all RED)"
    fallback: "Skip encryption for session"

  constraint_violation:
    error_code: "SELECTION_CONSTRAINT_VIOLATION"
    description: "Selection violates size/count constraints"
    recovery: "Reduce selection scope, prioritize critical sections"
    fallback: "Encrypt highest priority sections only"

  policy_conflict:
    error_code: "SELECTION_POLICY_CONFLICT"
    description: "Conflicting policy requirements"
    recovery: "Escalate to policy administrator"
    resolution: "Manual policy review required"

  performance_timeout:
    error_code: "SELECTION_TIMEOUT"
    description: "Selection taking too long"
    recovery: "Use cached/fallback selection logic"
    fallback: "Conservative selection strategy"

# Monitoring and Metrics
monitoring_metrics:
  selection_metrics:
    metric: "section_selection_operations_total"
    labels: ["strategy", "result"]
    description: "Section selection operation counts"

  performance_metrics:
    metric: "section_selection_duration_seconds"
    labels: ["operation_type"]
    description: "Selection operation timing"

  quality_metrics:
    metric: "section_selection_coverage"
    labels: ["band", "strategy"]
    description: "Percentage of eligible sections selected"

  error_metrics:
    metric: "section_selection_errors_total"
    labels: ["error_type"]
    description: "Selection error counts"

# Implementation Interface
implementation:
  rust:
    struct: "SectionSelector"
    functions:
      - "new(config: SectionSelectionConfig) -> Result<Self, SelectionError>"
      - "select_sections(&self, sessionstate: &SessionState, classifications: &HashMap<String, Classification>, context: &SelectionContext) -> Result<SelectionResult, SelectionError>"
      - "validate_selection(&self, selection: &SelectionResult, constraints: &SelectionConstraints) -> ValidationResult"
      - "optimize_selection(&self, selection: &SelectionResult, goals: &OptimizationGoals) -> Result<OptimizedSelection, SelectionError>"

  python:
    class: "SectionSelector"
    methods:
      - "__init__(self, config: dict)"
      - "select_sections(self, sessionstate: dict, classifications: dict, context: dict) -> dict"
      - "validate_selection(self, selection: dict, constraints: dict) -> dict"
      - "optimize_selection(self, selection: dict, goals: dict) -> dict"

# Testing Requirements
testing:
  unit_tests:
    - "Section selection logic accuracy"
    - "Constraint validation"
    - "Priority ordering"
    - "Policy integration"
    - "Error handling"

  integration_tests:
    - "Full SessionState section selection"
    - "Policy override handling"
    - "Performance optimization"
    - "Dynamic adaptation"

  accuracy_tests:
    - "Selection accuracy vs requirements"
    - "Constraint compliance"
    - "Priority effectiveness"
    - "Edge case handling"

  performance_tests:
    - "Selection latency"
    - "Throughput under load"
    - "Memory usage"
    - "Concurrent selection"

# Dependencies
dependencies:
  upstream:
    - "band_detection.yml: Provides section classifications"
  downstream:
    - "e2ee_manager.yml: Uses section selection results"
    - "parallel_encryption.yml: Uses selected sections for batching"
    - "encryption_bypass.yml: Uses selection for bypass decisions"

# Success Criteria
success_criteria:
  functional:
    - "Correctly identifies RED sections for encryption"
    - "Respects all selection constraints"
    - "Applies appropriate selection strategies"
    - "Handles dynamic context changes"

  accuracy:
    - "100% selection of required RED sections"
    - "No selection of exempted sections"
    - "Appropriate priority ordering"
    - "Policy compliance"

  performance:
    - "Selection within latency budgets"
    - "Efficient for large SessionStates"
    - "Scalable concurrent operations"
    - "Memory efficient"

  reliability:
    - "Robust error handling and recovery"
    - "Consistent selection results"
    - "Monitoring and alerting effective"
    - "Adaptable to changing requirements"
