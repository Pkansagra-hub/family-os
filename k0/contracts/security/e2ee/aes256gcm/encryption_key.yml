---
# ADR-0036a: AES-256-GCM Encryption Key Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Encryption Key Contract
# Defines the structure and lifecycle of AES-256 encryption keys for E2EE

contract:
  name: encryption_key
  version: "1.0.0"
  description: "AES-256 encryption key structure and lifecycle for RED band SessionState E2EE"
  parent_adr: "ADR-0036a"
  priority: "CRITICAL"
  effort: "2 weeks"

# Key Structure
key_structure:
  algorithm: "AES-256-GCM"
  key_length_bits: 256
  key_length_bytes: 32
  nonce_length_bits: 96
  nonce_length_bytes: 12
  auth_tag_length_bits: 128
  auth_tag_length_bytes: 16

# Key Lifecycle
key_lifecycle:
  generation:
    method: "cryptographically_secure_random"
    entropy_source: "OS CSPRNG (Windows BCryptGenRandom, Linux getrandom, macOS SecRandomCopyBytes)"
    validation: "FIPS 140-2 compliant randomness"

  storage:
    location: "OS Keychain (primary) or encrypted file (secondary)"
    encryption: "PBKDF2/Argon2 derived key for encrypted file storage"
    access_control: "OS authentication required (password/biometric)"

  rotation:
    interval_days: 90
    automatic: true
    grace_period_days: 7
    old_key_retention_days: 180

  revocation:
    immediate: true
    reason_required: true
    audit_logged: true

  deletion:
    retention_days: 365
    hard_delete: true
    audit_logged: true

# Key Metadata
key_metadata:
  key_id:
    format: "space-{space_id}-v{version}"
    example: "space-001-v1"
    uniqueness: "global across all spaces"

  space_id:
    description: "K1 space identifier"
    format: "space-{uuid}"
    example: "space-001"

  user_id:
    description: "User who owns the space"
    format: "user-{uuid}"
    example: "user-abc123"

  created_at:
    format: "RFC3339 timestamp"
    timezone: "UTC"

  rotated_at:
    format: "RFC3339 timestamp"
    nullable: true

  expires_at:
    calculation: "created_at + 90 days"
    format: "RFC3339 timestamp"

  is_byok:
    description: "Bring Your Own Key (user-provided)"
    type: boolean
    default: false

  keystore_backend:
    enum: ["OS_KEYCHAIN", "ENCRYPTED_FILE", "LOCAL_HSM"]
    default: "OS_KEYCHAIN"

# Performance Budget
performance_budget:
  key_generation_ms: 10
  key_fetch_ms: 1
  key_rotation_ms: 100
  memory_usage_mb: 0.001  # Minimal memory footprint

# Security Requirements
security_requirements:
  - "Key material never logged or exposed in plaintext"
  - "Keys stored separately from encrypted data"
  - "Hardware-backed storage when available (TPM/Secure Enclave)"
  - "Zero-knowledge architecture (K1 cannot decrypt without user key)"
  - "FIPS 140-2 Level 2+ compliance"

# Implementation Interface
implementation:
  rust:
    struct: "EncryptionKey"
    methods:
      - "new(key_id: String, key_bytes: [u8; 32]) -> Result<Self>"
      - "key_id() -> &str"
      - "encrypt(plaintext: &[u8], nonce: &[u8; 12]) -> Result<(Vec<u8>, [u8; 16])>"
      - "decrypt(ciphertext: &[u8], nonce: &[u8; 12], tag: &[u8; 16]) -> Result<Vec<u8>>"

  python:
    class: "EncryptionKey"
    methods:
      - "__init__(key_id: str, key_bytes: bytes)"
      - "encrypt(plaintext: bytes, nonce: bytes) -> tuple[bytes, bytes]"
      - "decrypt(ciphertext: bytes, nonce: bytes, tag: bytes) -> bytes"

# Testing Requirements
testing:
  unit_tests:
    - "Key generation produces 256-bit keys"
    - "Encryption/decryption round-trip succeeds"
    - "Invalid authentication tag fails decryption"
    - "Key metadata correctly populated"

  integration_tests:
    - "Key stored/retrieved from OS keychain"
    - "Key rotation maintains data accessibility"
    - "Performance budget not exceeded"

  security_tests:
    - "Key material not exposed in logs"
    - "Tamper detection works (authentication tag)"
    - "Zero-knowledge verified (K1 cannot decrypt)"

# Dependencies
dependencies:
  upstream:
    - "ADR-0036: E2EE for RED Band (requirements)"
  downstream:
    - "ADR-0036b: KMS Integration (key storage)"
    - "ADR-0036c: Selective Encryption (key usage)"

# Success Criteria
success_criteria:
  functional:
    - "256-bit AES keys generated securely"
    - "AES-256-GCM encryption/decryption works"
    - "Authentication tags prevent tampering"
    - "Hardware acceleration utilized when available"

  performance:
    - "<10ms key generation"
    - "<1ms key fetch from cache"
    - "<1ms encryption/decryption per section"

  security:
    - "Zero plaintext key exposure"
    - "Tamper-evident encryption"
    - "Hardware-backed when possible"

  compliance:
    - "FIPS 140-2 Level 2+"
    - "GDPR encryption requirements"
    - "HIPAA PHI protection"
