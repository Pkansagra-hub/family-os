---
# ADR-0036b: Key Caching Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Key Caching Contract
# Defines in-memory key caching for performance optimization

contract:
  name: key_caching
  version: "1.0.0"
  description: "In-memory key caching for AES-256 encryption performance"
  parent_adr: "ADR-0036b"
  priority: "HIGH"
  effort: "2 weeks"

# Cache Architecture
cache_architecture:
  cache_type: "LRU (Least Recently Used)"
  max_entries: 100
  max_memory: "50MB"
  entry_size_estimate: "1KB per cached key"
  eviction_policy: "LRU with TTL"
  thread_safety: "Concurrent access safe"

# Cache Entry Structure
cache_entry:
  key_id: "UUID string identifier"
  key_material: "32 bytes AES-256 key (encrypted in memory)"
  metadata: "Key metadata dictionary"
  access_time: "Last access timestamp"
  created_time: "Cache entry creation timestamp"
  ttl_seconds: 300
  access_count: "Number of times accessed"
  backend_type: "Source backend (os_keychain, encrypted_file, hsm)"

# Cache Operations
cache_operations:
  get_key:
    function: "get_cached_key(key_id: str) -> Optional[bytes, dict]"
    description: "Retrieve key from cache if available"
    parameters:
      key_id: "Unique key identifier"
    returns:
      key_material: "AES-256 key bytes"
      metadata: "Key metadata"
    cache_hit: "Return cached data, update access_time"
    cache_miss: "Return None, key will be fetched from backend"

  put_key:
    function: "put_cached_key(key_id: str, key_material: bytes, metadata: dict, backend: str)"
    description: "Store key in cache"
    parameters:
      key_id: "Unique key identifier"
      key_material: "AES-256 key bytes"
      metadata: "Key metadata"
      backend: "Source backend type"
    eviction: "Evict LRU entries if cache full"
    encryption: "Encrypt key material in memory"

  invalidate_key:
    function: "invalidate_cached_key(key_id: str)"
    description: "Remove key from cache"
    parameters:
      key_id: "Unique key identifier"
    use_case: "Key rotation, revocation, deletion"
    immediate: "Remove from cache immediately"

  clear_cache:
    function: "clear_cache()"
    description: "Clear entire cache"
    use_case: "Security incident, user logout"
    secure_wipe: "Overwrite memory before clearing"

  get_cache_stats:
    function: "get_cache_stats() -> dict"
    description: "Get cache performance statistics"
    returns:
      hit_rate: "Cache hit percentage"
      total_requests: "Total cache requests"
      current_entries: "Current number of cached keys"
      memory_usage: "Current memory usage"
      eviction_count: "Number of evictions"

# Security Model
security_model:
  memory_encryption:
    encryption: "Keys encrypted in memory using process-specific key"
    key_derivation: "Derived from system entropy + process ID"
    rotation: "Memory encryption key rotated on cache clear"
    purpose: "Prevent memory dumps from revealing keys"

  access_control:
    process_isolation: "Cache only accessible within keystore process"
    user_isolation: "Keys isolated by user ID"
    space_isolation: "Keys tagged by space membership"

  lifetime_management:
    ttl_enforcement: "Keys evicted after TTL expires"
    access_tracking: "Track key usage for security monitoring"
    automatic_cleanup: "Background cleanup of expired entries"

  secure_wipe:
    memory_overwrite: "Keys overwritten with random data before eviction"
    cache_clear: "All memory securely wiped on clear operations"
    process_exit: "Cache cleared on process termination"

# Performance Requirements
performance_requirements:
  cache_hit_latency: "< 1ms"
  cache_miss_latency: "< 5ms (backend fetch + cache)"
  memory_overhead: "< 50MB total"
  max_entries: 100
  ttl_default: 300

  throughput:
    read_operations: "10,000 operations/second"
    write_operations: "1,000 operations/second"
    concurrent_access: "Thread-safe for 100 concurrent users"

# Cache Policies
cache_policies:
  key_priority:
    high_priority: "Frequently used keys (access_count > 10)"
    medium_priority: "Recently used keys (< 1 hour)"
    low_priority: "Infrequently used keys"

  eviction_triggers:
    max_entries_reached: "Evict LRU entry"
    memory_limit_reached: "Evict LRU entries until under limit"
    ttl_expired: "Remove expired entries"
    key_revoked: "Immediate eviction on revocation"

  preload_strategies:
    on_startup: "Cache recently used keys"
    on_user_login: "Cache user's active keys"
    predictive: "Cache keys likely to be used soon"

# Monitoring and Metrics
monitoring_metrics:
  cache_hit_rate:
    metric: "key_cache_hit_rate"
    type: "gauge"
    description: "Percentage of cache hits"
    alerting: "Low hit rate (> 50%) triggers optimization alert"

  cache_size:
    metric: "key_cache_entries_total"
    type: "gauge"
    description: "Current number of cached keys"
    alerting: "High usage (> 90% capacity) triggers alert"

  cache_memory_usage:
    metric: "key_cache_memory_bytes"
    type: "gauge"
    description: "Current cache memory usage"
    alerting: "High memory usage (> 80%) triggers alert"

  cache_operations:
    metric: "key_cache_operations_total"
    labels: ["operation", "result"]
    type: "counter"
    description: "Cache operation counts"

  eviction_events:
    metric: "key_cache_evictions_total"
    labels: ["reason"]
    type: "counter"
    description: "Cache eviction counts"

# Error Handling
error_handling:
  cache_corruption:
    error_code: "CACHE_CORRUPTION"
    description: "Cached data integrity check failed"
    recovery: "Invalidate corrupted entry, fetch from backend"
    security: "Alert security team"

  memory_pressure:
    error_code: "MEMORY_PRESSURE"
    description: "System memory running low"
    recovery: "Reduce cache size, evict less critical entries"
    fallback: "Disable caching temporarily"

  concurrent_access_conflict:
    error_code: "CONCURRENT_ACCESS_CONFLICT"
    description: "Multiple threads accessing same cache entry"
    recovery: "Use atomic operations, retry on conflict"
    thread_safety: "Guaranteed by implementation"

  backend_failure:
    error_code: "BACKEND_FAILURE"
    description: "Cannot fetch key from backend"
    recovery: "Return cache miss, let caller handle"
    fallback: "Serve from cache if TTL allows"

# Integration with Key Backends
backend_integration:
  cache_first_lookup:
    1: "Check cache for key"
    2: "If cache hit, return cached key"
    3: "If cache miss, fetch from backend"
    4: "Store fetched key in cache"
    5: "Return key to caller"

  cache_invalidation_triggers:
    key_rotation: "Invalidate old key, cache new key"
    key_revocation: "Invalidate revoked key"
    key_deletion: "Invalidate deleted key"
    user_logout: "Clear user's cached keys"
    security_incident: "Clear entire cache"

  cache_warming:
    on_demand: "Cache key when first accessed"
    proactive: "Cache frequently used keys on startup"
    predictive: "Cache keys based on usage patterns"

# Implementation Interface
implementation:
  rust:
    struct: "KeyCache"
    functions:
      - "new(max_entries: usize, max_memory: usize) -> Self"
      - "get(&self, key_id: &str) -> Option<(Vec<u8>, Value)>"
      - "put(&self, key_id: &str, key_material: &[u8], metadata: &Value, backend: &str)"
      - "invalidate(&self, key_id: &str)"
      - "clear(&self)"
      - "stats(&self) -> CacheStats"
      - "cleanup_expired(&self)"

  python:
    class: "KeyCache"
    methods:
      - "__init__(self, max_entries: int = 100, max_memory_mb: int = 50)"
      - "get(self, key_id: str) -> tuple[bytes, dict] | None"
      - "put(self, key_id: str, key_material: bytes, metadata: dict, backend: str)"
      - "invalidate(self, key_id: str)"
      - "clear(self)"
      - "get_stats(self) -> dict"
      - "cleanup_expired(self)"

# Background Tasks
background_tasks:
  cleanup_task:
    frequency: "Every 60 seconds"
    function: "Remove expired cache entries"
    performance: "Low priority, non-blocking"

  stats_reporting:
    frequency: "Every 300 seconds"
    function: "Report cache statistics to monitoring"
    metrics: "Hit rate, memory usage, eviction counts"

  cache_warming:
    frequency: "On startup and hourly"
    function: "Preload frequently used keys"
    optimization: "Based on access patterns"

# Testing Requirements
testing:
  unit_tests:
    - "Cache hit/miss behavior"
    - "LRU eviction policy"
    - "TTL expiration"
    - "Memory encryption"
    - "Thread safety"

  integration_tests:
    - "Cache with key backends"
    - "Cache invalidation on key lifecycle events"
    - "Performance under load"
    - "Memory usage limits"

  security_tests:
    - "Memory encryption strength"
    - "Secure wipe on eviction"
    - "Access control enforcement"
    - "Cache timing attack resistance"

  performance_tests:
    - "Cache hit latency"
    - "Concurrent access performance"
    - "Memory usage under load"
    - "Cache warming effectiveness"

# Dependencies
dependencies:
  upstream:
    - "key_storage.yml: Caches keys from storage backends"
    - "key_rotation.yml: Invalidates cache on rotation"
    - "key_revocation.yml: Invalidates cache on revocation"
  downstream:
    - "All keystore operations use caching"

# Success Criteria
success_criteria:
  functional:
    - "Keys cached and retrieved correctly"
    - "LRU eviction works properly"
    - "TTL expiration enforced"
    - "Cache invalidation on key changes"

  security:
    - "Keys encrypted in memory"
    - "Secure wipe on eviction"
    - "Access controls enforced"
    - "No key leakage in memory dumps"

  performance:
    - "Cache hit latency < 1ms"
    - "Memory usage within limits"
    - "High cache hit rate (> 80%)"
    - "Concurrent access safe"

  reliability:
    - "Background cleanup works"
    - "Error handling robust"
    - "Cache consistency maintained"
    - "Recovery from corruption"
