---
# ADR-0036b: Key Rotation Contract
# Parent: ADR-0036 (E2EE for RED Band)
# Status: Active
# Date: 2025-10-13
# Authors: K1 Architecture Team

# Key Rotation Contract
# Defines automatic 90-day rotation of encryption keys

contract:
  name: key_rotation
  version: "1.0.0"
  description: "Automatic 90-day rotation of AES-256 encryption keys"
  parent_adr: "ADR-0036b"
  priority: "CRITICAL"
  effort: "2 weeks"

# Rotation Policy
rotation_policy:
  interval_days: 90
  automatic: true
  grace_period_days: 7
  old_key_retention_days: 180
  compliance: "NIST SP 800-57, GDPR security requirements"

# Rotation Triggers
rotation_triggers:
  scheduled:
    description: "Automatic rotation based on key age"
    condition: "created_at + 90 days < now()"
    frequency: "Checked daily during key access"

  manual:
    description: "User-initiated rotation"
    trigger: "User request via API"
    reason: "User preference, security concern"

  emergency:
    description: "Immediate rotation on security incident"
    trigger: "Authentication failure, key compromise suspected"
    priority: "HIGHEST"

# Rotation Process
rotation_process:
  1:
    name: "Check rotation eligibility"
    description: "Verify key age > 90 days"
    condition: "key.expires_at < now()"

  2:
    name: "Generate new key"
    description: "Create new 256-bit encryption key"
    inheritance: "Same space_id, new key_id version"

  3:
    name: "Re-encrypt data"
    description: "Decrypt with old key, encrypt with new key"
    scope: "All SessionState for this space"
    async: "Background job to avoid blocking"

  4:
    name: "Update key references"
    description: "Update K0 database with new key_id"
    atomicity: "All-or-nothing update"

  5:
    name: "Retain old key"
    description: "Keep old key for decryption grace period"
    duration: "7 days minimum"

  6:
    name: "Schedule old key deletion"
    description: "Delete old key after retention period"
    duration: "180 days total retention"

  7:
    name: "Audit rotation"
    description: "Log rotation operation"
    compliance: "GDPR/HIPAA audit trail"

# Key Versioning
key_versioning:
  format: "space-{space_id}-v{version}"
  increment: "Monotonic version number"
  example: "space-001-v1 to space-001-v2"
  collision: "Version numbers never reused"

# Grace Period Handling
grace_period_handling:
  duration_days: 7
  purpose: "Allow decryption with old key during transition"
  access: "Both old and new keys valid during grace period"
  expiration: "Old key invalidated after grace period"

# Data Re-encryption
data_reencryption:
  scope: "All encrypted SessionState for the space"
  method: "Background job processing"
  batch_size: "10 SessionState per batch"
  progress_tracking: "Track re-encryption progress"
  rollback: "Ability to rollback if re-encryption fails"

# Performance Considerations
performance_considerations:
  background_processing:
    description: "Rotation happens in background"
    impact: "No user-facing latency"
    resource_usage: "Controlled CPU/memory usage"

  batch_processing:
    description: "Process SessionState in batches"
    size: "10 items per batch"
    delay: "100ms between batches"
    monitoring: "Track processing rate"

# Error Handling
error_handling:
  reencryption_failure:
    error_code: "REENCRYPTION_FAILED"
    description: "Cannot re-encrypt some SessionState"
    recovery: "Retry failed items, alert on persistent failure"

  key_generation_failure:
    error_code: "NEW_KEY_GENERATION_FAILED"
    description: "Cannot generate replacement key"
    recovery: "Retry key generation, extend grace period"

  storage_failure:
    error_code: "ROTATION_STORAGE_FAILED"
    description: "Cannot store new key or update references"
    recovery: "Rollback rotation, alert administrator"

# Monitoring and Alerting
monitoring_alerting:
  rotation_events:
    metric: "key_rotations_total"
    labels: ["trigger_type", "success"]
    alerting: "Failed rotations trigger alert"

  reencryption_progress:
    metric: "data_reencryption_progress"
    labels: ["space_id", "status"]
    alerting: "Stalled re-encryption triggers alert"

  grace_period_usage:
    metric: "grace_period_key_access_total"
    labels: ["days_remaining"]
    alerting: "High grace period usage triggers alert"

# Implementation Interface
implementation:
  rust:
    function: "rotate_encryption_key(key_id: &str, reason: RotationReason) -> Result<NewKeyMetadata, RotationError>"
    async: true
    background_job: "spawn re-encryption task"

  python:
    function: "rotate_encryption_key(key_id: str, reason: str) -> dict"
    async: true
    background_processing: "Celery task for re-encryption"

# Testing Requirements
testing:
  unit_tests:
    - "Rotation triggers at correct intervals"
    - "New keys generated with incremented versions"
    - "Key metadata updated correctly"
    - "Old keys retained during grace period"

  integration_tests:
    - "Full rotation cycle: old → new key"
    - "Data re-encryption works correctly"
    - "Grace period allows old key access"
    - "Old key deletion after retention period"

  performance_tests:
    - "Rotation completes within time budget"
    - "Re-encryption doesn't impact user operations"
    - "Background processing uses appropriate resources"

  security_tests:
    - "Both keys valid during grace period"
    - "Old key invalidated after grace period"
    - "Re-encryption maintains data integrity"
    - "Rotation operations properly audited"

# Dependencies
dependencies:
  upstream:
    - "key_generation.yml: Generates new keys"
    - "key_storage.yml: Stores rotated keys"
  downstream:
    - "ADR-0036c: Selective encryption uses rotated keys"

# Success Criteria
success_criteria:
  functional:
    - "Keys rotated automatically every 90 days"
    - "Data re-encrypted with new keys"
    - "Grace period allows smooth transition"
    - "Old keys deleted after retention period"

  security:
    - "Forward secrecy maintained"
    - "No data loss during rotation"
    - "Key compromise limited by rotation"

  performance:
    - "Rotation happens in background"
    - "No user-facing performance impact"
    - "Re-encryption completes within time budget"

  compliance:
    - "NIST key rotation requirements met"
    - "GDPR/HIPAA audit trail maintained"
    - "Automatic rotation prevents key expiration"
