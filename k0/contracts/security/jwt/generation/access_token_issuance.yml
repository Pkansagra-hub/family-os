---
# ADR-0037: Access Token Issuance Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Access Token Issuance Contract
# Defines the process for issuing 1-hour access tokens with RS256 signing

contract:
  name: access_token_issuance
  version: "1.0.0"
  description: "Access token issuance with 1-hour expiry and RS256 signing"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "3 days"

# Access Token Issuance Process
access_token_issuance:
  process_name: "issue_access_token"
  description: "Create and sign 1-hour access token"

  input_parameters:
    - name: "user_id"
      type: "String"
      description: "User identifier"
      validation: "Required, non-empty"
    - name: "space_id"
      type: "String"
      description: "Space/workspace identifier"
      validation: "Required, valid space ID"
    - name: "roles"
      type: "Vec<String>"
      description: "User roles"
      validation: "Required, at least one role"
    - name: "privacy_band"
      type: "String"
      description: "Privacy band (RED/AMBER/GREEN)"
      validation: "Required, valid enum value"
    - name: "capabilities"
      type: "Vec<String>"
      description: "User capabilities"
      validation: "Required, valid capability names"

  process_steps:
    generate_jti:
      description: "Generate unique JWT ID"
      implementation: "UUID v4 generation"
      uniqueness: "Globally unique across all tokens"
      purpose: "Token revocation and tracking"

    create_claims:
      description: "Create Claims struct with all required fields"
      fields:
        - "iss: Configured issuer"
        - "sub: user_id"
        - "aud: API audience"
        - "exp: now + 1 hour"
        - "iat: current timestamp"
        - "jti: generated JTI"
        - "space_id: provided space_id"
        - "roles: provided roles"
        - "privacy_band: provided privacy_band"
        - "capabilities: provided capabilities"
        - "token_type: 'access'"

    serialize_payload:
      description: "Serialize claims to JSON"
      format: "Compact JSON without whitespace"
      encoding: "UTF-8"
      validation: "Valid JSON structure"

    create_jwt_header:
      description: "Create JWT header"
      fields:
        - "alg: 'RS256'"
        - "typ: 'JWT'"
        - "kid: key identifier"
      encoding: "Base64URL"

    base64url_encode_payload:
      description: "Encode payload with Base64URL"
      standard: "RFC 4648 Section 5"
      padding: "No padding"
      validation: "Valid Base64URL characters only"

    sign_token:
      description: "Sign header.payload with RS256"
      algorithm: "RSASSA-PKCS1-v1_5 with SHA-256"
      key: "RSA 2048-bit private key"
      keystore: "Secure keystore access"
      performance: "<35ms signing time"

    assemble_jwt:
      description: "Combine header.payload.signature"
      format: "header.payload.signature"
      separator: "."
      validation: "Valid JWT format"

  output:
    type: "String"
    format: "JWT string (header.payload.signature)"
    expiry: "1 hour from issuance"
    validation: "Can be validated by JWT validator"

# Token Expiry
token_expiry:
  lifetime: "1 hour (3600 seconds)"
  rationale: "Balance between security and user experience"
  clock_skew_tolerance: "5 minutes"
  validation: "exp > (now - 300)"

# Performance Requirements
performance_requirements:
  total_latency: "<50ms"
  breakdown:
    - "JTI generation: <1ms"
    - "Claims creation: <2ms"
    - "JSON serialization: <5ms"
    - "Base64URL encoding: <2ms"
    - "Token signing: <35ms"
    - "JWT assembly: <1ms"

  success_rate: ">99.9%"
  error_rate: "<0.1%"

# Error Handling
error_handling:
  keystore_unavailable:
    error: "KeystoreError"
    handling: "Return error, do not issue token"
    logging: "Log security event"

  invalid_parameters:
    error: "InvalidParameters"
    handling: "Validate input parameters"
    logging: "Log validation failure"

  signing_failure:
    error: "SigningError"
    handling: "Return error, do not issue token"
    logging: "Log security event with high priority"

  jti_collision:
    error: "JTICollision"
    handling: "Regenerate JTI, retry once"
    logging: "Log collision event"

# Security Considerations
security_considerations:
  key_security:
    - "Private key never in application memory"
    - "Secure keystore access only"
    - "Key rotation every 90 days"

  token_entropy:
    - "JTI provides uniqueness"
    - "Timestamp prevents replay"
    - "User-specific claims"

  signature_integrity:
    - "RS256 provides cryptographic security"
    - "SHA-256 hash function"
    - "RSA 2048-bit key strength"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "jsonwebtoken = \"8.3\""
      - "serde_json = \"1.0\""
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"
      - "base64 = \"0.21\""

    code_example: |
      pub async fn issue_access_token(
          keystore: &dyn KeystoreClient,
          user_id: &str,
          space_id: &str,
          roles: Vec<String>,
          privacy_band: &str,
          capabilities: Vec<String>,
      ) -> Result<String, AuthError> {
          // Generate JTI
          let jti = Uuid::new_v4().to_string();

          // Create claims
          let claims = Claims::new_access_token(
              user_id, space_id, roles, privacy_band, capabilities
          );

          // Get private key
          let private_key = keystore.get_private_key().await?;

          // Sign token
          let token = jsonwebtoken::encode(
              &jsonwebtoken::Header::new(jsonwebtoken::Algorithm::RS256),
              &claims,
              &jsonwebtoken::EncodingKey::from_rsa_pem(private_key.as_bytes())?,
          )?;

          Ok(token)
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"
      - "uuid==1.30"

    code_example: |
      async def issue_access_token(
          keystore_client,
          user_id: str,
          space_id: str,
          roles: List[str],
          privacy_band: str,
          capabilities: List[str]
      ) -> str:
          # Generate JTI
          jti = str(uuid.uuid4())

          # Create claims
          claims = Claims.new_access_token(
              user_id, space_id, roles, privacy_band, capabilities
          )

          # Get private key
          private_key = await keystore_client.get_private_key()

          # Sign token
          token = jwt.encode(
              claims.dict(),
              private_key,
              algorithm='RS256'
          )

          return token

# Testing Requirements
testing:
  unit_tests:
    - "Token issuance with valid parameters"
    - "Token expiry calculation"
    - "JTI uniqueness"
    - "Claims structure validation"
    - "JWT format validation"

  integration_tests:
    - "Full token issuance workflow"
    - "Token validation after issuance"
    - "Keystore integration"
    - "Performance under load"

  security_tests:
    - "Token signature verification"
    - "Private key access security"
    - "Token entropy validation"
    - "Timing attack resistance"

  performance_tests:
    - "Token issuance latency (<50ms)"
    - "Concurrent issuance (100 req/sec)"
    - "Memory usage stability"

# Dependencies
dependencies:
  upstream:
    - "claims_structure.yml: Defines claims format"
    - "rs256_signing.yml: Defines signing process"
    - "private_key_security.yml: Defines key access"
  downstream:
    - "jwt_validator.yml: Validates issued tokens"
    - "token_pair_response.yml: Includes access token"

# Success Criteria
success_criteria:
  functional:
    - "Access tokens issued successfully"
    - "Tokens contain correct claims"
    - "Tokens have valid RS256 signatures"
    - "Tokens expire in 1 hour"
    - "JTI values are unique"

  performance:
    - "Token issuance <50ms"
    - "Handles 100 concurrent requests"
    - "Stable memory usage"
    - "No performance degradation"

  security:
    - "Cryptographically secure signatures"
    - "Private keys never exposed"
    - "Unique token identifiers"
    - "Proper token expiry"

  reliability:
    - "High success rate (>99.9%)"
    - "Proper error handling"
    - "Graceful failure modes"
    - "Comprehensive logging"
