---
# ADR-0037: Expiry Check Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Expiry Check Contract
# Defines JWT token expiry validation with clock skew tolerance

contract:
  name: expiry_check
  version: "1.0.0"
  description: "Validate JWT token expiry with clock skew tolerance"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "1 day"

# Token Expiry Validation
expiry_validation:
  description: "Check JWT exp claim against current time"
  validation_rules:
    - "exp claim must be present"
    - "exp must be numeric timestamp"
    - "exp must be in future (with skew tolerance)"
    - "Clock skew tolerance: 30 seconds"

  process_steps:
    extract_expiry:
      description: "Extract exp claim from JWT payload"
      operations:
        - "Parse JWT payload as JSON"
        - "Extract 'exp' field"
        - "Validate numeric format"
        - "Handle missing exp claim"
      error_handling: "Missing or invalid exp claim"

    get_current_time:
      description: "Get current timestamp"
      operations:
        - "Use system clock"
        - "Convert to Unix timestamp"
        - "Apply clock skew tolerance"
      precision: "Second precision"
      timezone: "UTC"

    apply_clock_skew:
      description: "Apply clock skew tolerance"
      operations:
        - "Subtract 30 seconds from current time"
        - "Allow tokens issued slightly in future"
        - "Prevent replay attacks"
      tolerance: "30 seconds (configurable)"

    validate_expiry:
      description: "Compare expiry against current time"
      operations:
        - "exp > (now - skew_tolerance)"
        - "Fail if expired"
        - "Pass if valid"
      logic: "Strict inequality check"

  clock_skew_handling:
    tolerance_seconds: 30
    rationale: "Account for clock drift between systems"
    security_impact: "Prevents legitimate tokens from being rejected"
    attack_prevention: "Limits replay window"

# Token Lifetime Validation
token_lifetimes:
  access_token:
    lifetime_seconds: 3600  # 1 hour
    validation: "exp = iat + 3600"
    renewal: "Via refresh token"

  refresh_token:
    lifetime_seconds: 604800  # 7 days
    validation: "exp = iat + 604800"
    renewal: "Rotation on use"

  validation_rules:
    - "Token not expired at issuance time"
    - "Reasonable lifetime bounds"
    - "No excessively long-lived tokens"

# Error Conditions
error_conditions:
  missing_exp_claim:
    error: "MissingExpClaim"
    handling: "Reject token"
    logging: "Warning level"

  invalid_exp_format:
    error: "InvalidExpFormat"
    handling: "Reject token"
    logging: "Warning level"

  token_expired:
    error: "TokenExpired"
    handling: "Reject token, suggest refresh"
    logging: "Info level (common)"

  future_token:
    error: "TokenFromFuture"
    handling: "Reject token (with skew tolerance)"
    logging: "Warning level, potential attack"

# Performance Requirements
performance_requirements:
  latency: "<0.1ms"
  operations:
    - "JSON parsing: <0.05ms"
    - "Timestamp comparison: <0.05ms"
  throughput: "Unlimited (CPU bound)"
  memory_usage: "Minimal"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "serde_json = \"1.0\""
      - "chrono = \"0.4\""

    code_example: |
      pub fn validate_expiry(
          payload: &serde_json::Value,
          clock_skew_tolerance_secs: i64,
      ) -> Result<(), ExpiryValidationError> {
          // Extract exp claim
          let exp = payload.get("exp")
              .and_then(|v| v.as_i64())
              .ok_or(ExpiryValidationError::MissingExpClaim)?;

          // Get current time
          let now = chrono::Utc::now().timestamp();

          // Apply clock skew tolerance
          let effective_now = now - clock_skew_tolerance_secs;

          // Validate expiry
          if exp <= effective_now {
              return Err(ExpiryValidationError::TokenExpired);
          }

          Ok(())
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"

    code_example: |
      def validate_expiry(payload: dict, clock_skew_tolerance: int = 30) -> None:
          """Validate JWT expiry with clock skew tolerance"""
          if 'exp' not in payload:
              raise ExpiryValidationError('Missing exp claim')

          exp = payload['exp']
          if not isinstance(exp, (int, float)):
              raise ExpiryValidationError('Invalid exp format')

          # Get current time
          now = int(time.time())

          # Apply clock skew
          effective_now = now - clock_skew_tolerance

          if exp <= effective_now:
              raise ExpiryValidationError('Token expired')

# Testing Requirements
testing:
  unit_tests:
    - "Valid non-expired token"
    - "Expired token rejection"
    - "Missing exp claim"
    - "Invalid exp format"
    - "Clock skew tolerance"
    - "Future token handling"

  integration_tests:
    - "Full expiry validation workflow"
    - "Clock synchronization testing"
    - "Edge cases around expiry time"

  security_tests:
    - "Replay attack prevention"
    - "Clock manipulation resistance"
    - "Expiry manipulation attempts"

  performance_tests:
    - "Expiry validation latency"
    - "High-frequency validation"
    - "Memory usage monitoring"

# Dependencies
dependencies:
  upstream:
    - "claims_structure.yml: Defines exp claim"
    - "signature_verification.yml: Runs before expiry check"
  downstream:
    - "jwt_validator.yml: Uses expiry validation"
    - "claims_extraction.yml: Runs after expiry check"

# Success Criteria
success_criteria:
  functional:
    - "Expired tokens are rejected"
    - "Valid tokens are accepted"
    - "Clock skew is properly handled"
    - "Error conditions are properly detected"

  performance:
    - "Expiry validation <0.1ms"
    - "No performance degradation"
    - "Efficient timestamp operations"

  security:
    - "No timing attacks possible"
    - "Proper clock skew handling"
    - "Attack-resistant validation"

  reliability:
    - "Consistent validation results"
    - "Proper error handling"
    - "Comprehensive logging"