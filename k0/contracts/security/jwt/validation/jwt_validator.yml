---
# ADR-0037: JWT Validator Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# JWT Validator Contract
# Defines JWTValidator class for stateless token validation with <2ms latency

contract:
  name: jwt_validator
  version: "1.0.0"
  description: "JWTValidator class for stateless token validation with RS256 signature verification"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "3 days"

# JWTValidator Class
jwt_validator:
  class_name: "JWTValidator"
  description: "Stateless JWT token validation with signature verification and claims extraction"

  constructor:
    parameters:
      - name: "keystore_client"
        type: "KeystoreClient"
        description: "Client for accessing public keys from secure keystore"
      - name: "redis_client"
        type: "RedisClient"
        description: "Redis client for token blacklist checking"
      - name: "config"
        type: "JWTValidationConfig"
        description: "Configuration for validation rules and timeouts"

    initialization:
      - "Load RSA public key from keystore on startup"
      - "Cache public key in memory for validation"
      - "Initialize Redis connection pool"
      - "Set up Prometheus metrics collectors"
      - "Configure clock skew tolerance (5 minutes)"

  methods:
    validate_token:
      signature: "validate_token(token: String, trace_id: String) -> Result<Claims, JWTValidationError>"
      description: "Complete JWT validation pipeline"
      parameters:
        - name: "token"
          type: "String"
          description: "JWT token to validate"
        - name: "trace_id"
          type: "String"
          description: "Request trace ID for logging"

      validation_pipeline:
        - "Parse JWT header and extract algorithm"
        - "Verify RS256 algorithm (reject others)"
        - "Base64URL decode and parse payload"
        - "Extract and validate claims structure"
        - "Verify RS256 signature with public key"
        - "Check token expiry with clock skew"
        - "Validate issuer and audience"
        - "Check token blacklist in Redis"
        - "Return validated claims"

      performance_requirements:
        - "Total latency: <2ms"
        - "Signature verification: <1ms"
        - "Redis lookup: <1ms (cached)"
        - "Claims parsing: <0.5ms"

      error_handling:
        - "InvalidSignature: Signature verification failed"
        - "Expired: Token expired (with skew tolerance)"
        - "InvalidIssuer: Wrong issuer claim"
        - "InvalidAudience: Wrong audience claim"
        - "Revoked: Token in blacklist"
        - "InvalidFormat: Malformed JWT"

# Validation Pipeline
validation_pipeline:
  step_1_parse_header:
    description: "Parse and validate JWT header"
    operations:
      - "Base64URL decode header"
      - "Parse JSON structure"
      - "Verify alg = 'RS256'"
      - "Verify typ = 'JWT'"
    error: "InvalidFormat"

  step_2_parse_payload:
    description: "Parse and validate JWT payload"
    operations:
      - "Base64URL decode payload"
      - "Parse JSON claims"
      - "Validate required fields presence"
      - "Extract Claims struct"
    error: "InvalidFormat"

  step_3_verify_signature:
    description: "Verify RS256 signature"
    operations:
      - "Get RSA public key from cache"
      - "Compute SHA-256 hash of header.payload"
      - "Verify PKCS#1 v1.5 signature"
      - "Fail fast on signature mismatch"
    error: "InvalidSignature"
    performance: "<1ms"

  step_4_check_expiry:
    description: "Validate token expiry"
    operations:
      - "Get current Unix timestamp"
      - "Apply 5-minute clock skew tolerance"
      - "Compare exp > (now - 300)"
      - "Reject expired tokens"
    error: "Expired"

  step_5_validate_claims:
    description: "Validate issuer and audience"
    operations:
      - "Check iss matches configured issuer"
      - "Check aud matches API audience"
      - "Validate JTI format (UUID v4)"
      - "Check token_type is valid"
    error: "InvalidIssuer/InvalidAudience"

  step_6_check_blacklist:
    description: "Check token revocation"
    operations:
      - "Query Redis GET blacklist:{jti}"
      - "Cache results for 1 minute"
      - "Return error if token revoked"
    error: "Revoked"
    performance: "<1ms cached"

# Configuration
jwt_validation_config:
  struct_name: "JWTValidationConfig"
  fields:
    - name: "issuer"
      type: "String"
      default: "k1.familyos.com"
      description: "Expected JWT issuer"
    - name: "audience"
      type: "String"
      default: "k1-api"
      description: "Expected JWT audience"
    - name: "clock_skew_seconds"
      type: "u64"
      default: 300
      description: "Clock skew tolerance (5 minutes)"
    - name: "redis_cache_ttl_seconds"
      type: "u64"
      default: 60
      description: "Redis blacklist cache TTL"

# Error Types
jwt_validation_errors:
  enum_name: "JWTValidationError"
  variants:
    - name: "InvalidSignature"
      description: "RS256 signature verification failed"
    - name: "Expired"
      description: "Token has expired"
    - name: "InvalidIssuer"
      description: "Issuer claim does not match"
    - name: "InvalidAudience"
      description: "Audience claim does not match"
    - name: "Revoked"
      description: "Token has been revoked"
    - name: "InvalidFormat"
      description: "JWT is malformed"
    - name: "InvalidAlgorithm"
      description: "Unsupported algorithm (not RS256)"
    - name: "KeystoreError"
      description: "Unable to access public key"
    - name: "RedisError"
      description: "Unable to check blacklist"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "jsonwebtoken = \"8.3\""
      - "serde_json = \"1.0\""
      - "redis = \"0.23\""
      - "tokio = { version = \"1.0\", features = [\"full\"] }"

    code_example: |
      pub struct JWTValidator {
          keystore: Arc<dyn KeystoreClient>,
          redis: Arc<redis::Client>,
          config: JWTValidationConfig,
          metrics: JWTValidationMetrics,
          public_key_cache: Arc<RwLock<Option<String>>>,
      }

      impl JWTValidator {
          pub async fn validate_token(
              &self,
              token: &str,
              trace_id: &str,
          ) -> Result<Claims, JWTValidationError> {
              // Parse header
              let header = jsonwebtoken::decode_header(token)?;

              // Verify algorithm
              if header.alg != jsonwebtoken::Algorithm::RS256 {
                  return Err(JWTValidationError::InvalidAlgorithm);
              }

              // Get public key
              let public_key = self.get_public_key().await?;

              // Decode and validate
              let decoding_key = jsonwebtoken::DecodingKey::from_rsa_pem(public_key.as_bytes())?;
              let validation = jsonwebtoken::Validation::new(header.alg);

              let token_data = jsonwebtoken::decode::<Claims>(
                  token,
                  &decoding_key,
                  &validation,
              )?;

              // Additional validations here...

              Ok(token_data.claims)
          }
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"
      - "redis==4.5.5"
      - "pydantic==2.0.0"

    code_example: |
      class JWTValidator:
          def __init__(self, keystore_client, redis_client, config):
              self.keystore = keystore_client
              self.redis = redis_client
              self.config = config
              self._public_key_cache = None

          async def validate_token(self, token: str, trace_id: str) -> dict:
              try:
                  # Decode without verification first to check header
                  header = jwt.get_unverified_header(token)

                  if header.get('alg') != 'RS256':
                      raise JWTValidationError('InvalidAlgorithm')

                  # Get public key
                  public_key = await self._get_public_key()

                  # Decode and verify
                  payload = jwt.decode(
                      token,
                      public_key,
                      algorithms=['RS256'],
                      audience=self.config.audience,
                      issuer=self.config.issuer
                  )

                  # Additional validations...

                  return payload
              except jwt.ExpiredSignatureError:
                  raise JWTValidationError('Expired')
              except jwt.InvalidSignatureError:
                  raise JWTValidationError('InvalidSignature')
              except Exception as e:
                  raise JWTValidationError('InvalidFormat')

# Testing Requirements
testing:
  unit_tests:
    - "Valid token validation"
    - "Expired token rejection"
    - "Invalid signature rejection"
    - "Wrong issuer rejection"
    - "Wrong audience rejection"
    - "Malformed JWT rejection"
    - "Blacklist checking"

  integration_tests:
    - "Full validation pipeline"
    - "Keystore integration"
    - "Redis blacklist integration"
    - "Performance under load"

  security_tests:
    - "Signature verification correctness"
    - "Timing attack resistance"
    - "Cache poisoning prevention"
    - "Redis injection prevention"

  performance_tests:
    - "Validation latency (<2ms)"
    - "Concurrent validation (1000 req/sec)"
    - "Memory usage stability"
    - "Cache hit rate (>95%)"

# Dependencies
dependencies:
  upstream:
    - "claims_structure.yml: Defines expected claims"
    - "signature_verification.yml: Defines signature checking"
    - "blacklist_check.yml: Defines revocation checking"
  downstream:
    - "authorization_middleware.yml: Uses validated tokens"
    - "session_binding.yml: Uses validated claims"

# Success Criteria
success_criteria:
  functional:
    - "Valid tokens pass all validation steps"
    - "Invalid tokens are rejected with correct errors"
    - "Claims are properly extracted and validated"
    - "Blacklist checking works correctly"
    - "Signature verification is cryptographically sound"

  performance:
    - "Token validation completes in <2ms"
    - "Handles 1000+ validations per second"
    - "Memory usage remains stable"
    - "Caching reduces keystore calls"

  security:
    - "No false positive validations"
    - "No false negative validations"
    - "Signature verification cannot be bypassed"
    - "Blacklist checking prevents revoked token use"

  reliability:
    - "Service remains available during keystore issues"
    - "Graceful degradation on Redis failures"
    - "Proper error messages for debugging"
    - "Comprehensive security event logging"