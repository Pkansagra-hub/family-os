---
# ADR-0037: Claims Extraction Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Claims Extraction Contract
# Defines JWT claims parsing and validation from token payload

contract:
  name: claims_extraction
  version: "1.0.0"
  description: "Extract and validate JWT claims from token payload"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "1.5 days"

# JWT Claims Structure
claims_structure:
  standard_claims:
    iss: "Issuer (string)"
    sub: "Subject (string)"
    aud: "Audience (string or array)"
    exp: "Expiration time (numeric)"
    nbf: "Not before time (numeric)"
    iat: "Issued at time (numeric)"
    jti: "JWT ID (string)"

  custom_claims:
    space_id: "K1 space identifier (UUID)"
    roles: "User roles array (array of strings)"
    privacy_band: "Privacy band (GREEN/AMBER/RED)"
    capabilities: "Granted capabilities (array of strings)"
    session_id: "Session identifier (UUID)"

  validation_rules:
    - "All required claims must be present"
    - "Claim types must match specification"
    - "Custom claims must be valid"
    - "No unknown critical claims"

# Claims Extraction Process
extraction_process:
  decode_payload:
    description: "Base64URL decode JWT payload"
    operations:
      - "Split JWT into components"
      - "Decode payload segment"
      - "Validate UTF-8 encoding"
      - "Parse as JSON"
    error_handling: "Invalid base64 or JSON"

  parse_json:
    description: "Parse payload as JSON object"
    operations:
      - "Deserialize JSON"
      - "Validate object structure"
      - "Extract individual claims"
    validation: "Well-formed JSON object"

  validate_required_claims:
    description: "Validate presence of required claims"
    required_claims:
      - "iss"
      - "sub"
      - "exp"
      - "iat"
      - "jti"
      - "space_id"
      - "roles"
      - "privacy_band"
    error_handling: "Missing required claims"

  validate_claim_types:
    description: "Validate claim data types"
    type_validations:
      iss: "string"
      sub: "string"
      aud: "string or array"
      exp: "number (timestamp)"
      nbf: "number (timestamp)"
      iat: "number (timestamp)"
      jti: "string (UUID)"
      space_id: "string (UUID)"
      roles: "array of strings"
      privacy_band: "string (enum)"
      capabilities: "array of strings"
    error_handling: "Type mismatch errors"

  validate_custom_claims:
    description: "Validate custom K1 claims"
    validations:
      space_id: "Valid UUID format"
      roles: "Non-empty array, valid role names"
      privacy_band: "Must be GREEN/AMBER/RED"
      capabilities: "Valid capability names"
    error_handling: "Invalid custom claims"

# Claims Validation Rules
validation_rules:
  issuer_validation:
    allowed_issuers: ["k1.auth.service"]
    validation: "Exact match required"

  audience_validation:
    allowed_audiences: ["k1.api", "k1.services"]
    validation: "At least one match required"

  subject_validation:
    format: "UUID"
    validation: "Valid UUID format"

  timestamp_validation:
    iat_not_future: "iat <= now + skew"
    exp_reasonable: "exp - iat <= max_lifetime"
    nbf_handling: "Optional, defaults to iat"

  jwt_id_validation:
    format: "UUID"
    uniqueness: "Globally unique"
    validation: "Valid UUID format"

# Custom Claims Validation
custom_claims_validation:
  space_id:
    type: "UUID string"
    validation: "Valid UUID v4 format"
    required: true

  roles:
    type: "Array of strings"
    allowed_values: ["admin", "user", "service", "agent"]
    validation: "Non-empty, valid role names"
    required: true

  privacy_band:
    type: "String enum"
    allowed_values: ["GREEN", "AMBER", "RED"]
    validation: "Exact case match"
    required: true

  capabilities:
    type: "Array of strings"
    allowed_values: ["read", "write", "execute", "admin", "tool_call"]
    validation: "Valid capability names"
    required: false

# Error Handling
error_handling:
  invalid_json:
    error: "InvalidJsonPayload"
    handling: "Reject token"
    logging: "Warning level"

  missing_required_claim:
    error: "MissingRequiredClaim"
    handling: "Reject token"
    logging: "Warning level"

  invalid_claim_type:
    error: "InvalidClaimType"
    handling: "Reject token"
    logging: "Warning level"

  invalid_custom_claim:
    error: "InvalidCustomClaim"
    handling: "Reject token"
    logging: "Warning level"

  unknown_critical_claim:
    error: "UnknownCriticalClaim"
    handling: "Reject token"
    logging: "Warning level"

# Performance Requirements
performance_requirements:
  latency: "<0.5ms"
  breakdown:
    - "Base64 decoding: <0.1ms"
    - "JSON parsing: <0.2ms"
    - "Validation: <0.2ms"
  throughput: "1000+ extractions per second"
  memory_usage: "Minimal (<1KB per token)"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "serde_json = \"1.0\""
      - "base64 = \"0.21\""
      - "uuid = \"1.0\""

    code_example: |
      #[derive(Debug, Deserialize)]
      pub struct JwtClaims {
          // Standard claims
          pub iss: String,
          pub sub: String,
          pub aud: Option<serde_json::Value>,
          pub exp: i64,
          pub nbf: Option<i64>,
          pub iat: i64,
          pub jti: String,

          // Custom claims
          pub space_id: String,
          pub roles: Vec<String>,
          pub privacy_band: String,
          pub capabilities: Option<Vec<String>>,
      }

      pub fn extract_claims(token: &str) -> Result<JwtClaims, ClaimsExtractionError> {
          // Split and decode payload
          let parts: Vec<&str> = token.split('.').collect();
          if parts.len() != 3 {
              return Err(ClaimsExtractionError::InvalidFormat);
          }

          let payload_bytes = base64::decode_config(parts[1], base64::URL_SAFE_NO_PAD)?;
          let payload_str = String::from_utf8(payload_bytes)?;
          let claims: JwtClaims = serde_json::from_str(&payload_str)?;

          // Validate claims
          validate_claims(&claims)?;

          Ok(claims)
      }

      fn validate_claims(claims: &JwtClaims) -> Result<(), ClaimsExtractionError> {
          // Validate issuer
          if claims.iss != "k1.auth.service" {
              return Err(ClaimsExtractionError::InvalidIssuer);
          }

          // Validate space_id as UUID
          uuid::Uuid::parse_str(&claims.space_id)?;

          // Validate privacy band
          match claims.privacy_band.as_str() {
              "GREEN" | "AMBER" | "RED" => {},
              _ => return Err(ClaimsExtractionError::InvalidPrivacyBand),
          }

          Ok(())
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"
      - "pydantic==2.0.0"

    code_example: |
      from pydantic import BaseModel, validator
      from typing import Optional, List
      import jwt

      class JwtClaims(BaseModel):
          # Standard claims
          iss: str
          sub: str
          aud: Optional[str]
          exp: int
          nbf: Optional[int]
          iat: int
          jti: str

          # Custom claims
          space_id: str
          roles: List[str]
          privacy_band: str
          capabilities: Optional[List[str]]

          @validator('iss')
          def validate_issuer(cls, v):
              if v != 'k1.auth.service':
                  raise ValueError('Invalid issuer')
              return v

          @validator('space_id')
          def validate_space_id(cls, v):
              import uuid
              uuid.UUID(v)  # Validate UUID format
              return v

          @validator('privacy_band')
          def validate_privacy_band(cls, v):
              if v not in ['GREEN', 'AMBER', 'RED']:
                  raise ValueError('Invalid privacy band')
              return v

      def extract_claims(token: str) -> JwtClaims:
          """Extract and validate JWT claims"""
          try:
              # Decode without verification (already verified)
              payload = jwt.decode(
                  token,
                  options={'verify_signature': False, 'verify_exp': False}
              )

              # Parse with Pydantic validation
              claims = JwtClaims(**payload)
              return claims

          except jwt.InvalidTokenError:
              raise ClaimsExtractionError('Invalid token format')
          except Exception as e:
              raise ClaimsExtractionError(f'Claims extraction failed: {e}')

# Testing Requirements
testing:
  unit_tests:
    - "Valid claims extraction"
    - "Missing required claims"
    - "Invalid claim types"
    - "Invalid custom claims"
    - "Malformed JSON handling"

  integration_tests:
    - "Full claims extraction workflow"
    - "Claims validation integration"
    - "Error handling scenarios"

  security_tests:
    - "Claims manipulation attempts"
    - "Type confusion attacks"
    - "Custom claims validation"

  performance_tests:
    - "Claims extraction latency"
    - "JSON parsing performance"
    - "Validation overhead"

# Dependencies
dependencies:
  upstream:
    - "claims_structure.yml: Defines claim structure"
    - "signature_verification.yml: Runs before claims extraction"
    - "expiry_check.yml: Runs before claims extraction"
  downstream:
    - "jwt_validator.yml: Uses extracted claims"
    - "blacklist_check.yml: Uses claims for validation"

# Success Criteria
success_criteria:
  functional:
    - "All claims are properly extracted"
    - "Required claims are validated"
    - "Custom claims are validated"
    - "Invalid tokens are rejected"

  performance:
    - "Claims extraction <0.5ms"
    - "Efficient JSON parsing"
    - "Minimal memory usage"

  security:
    - "No claims injection possible"
    - "Proper type validation"
    - "Custom claims validation"

  reliability:
    - "Consistent extraction results"
    - "Proper error handling"
    - "Comprehensive validation"
