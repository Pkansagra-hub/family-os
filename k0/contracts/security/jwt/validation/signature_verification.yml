---
# ADR-0037: Signature Verification Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Signature Verification Contract
# Defines RS256 signature verification with RSA public keys

contract:
  name: signature_verification
  version: "1.0.0"
  description: "RS256 signature verification using RSA public keys with <1ms latency"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "2 days"

# RS256 Signature Verification
signature_verification:
  algorithm: "RSASSA-PKCS1-v1_5 with SHA-256"
  description: "Verify JWT signatures using RSA public keys"

  process_steps:
    extract_signature:
      description: "Extract signature from JWT"
      operations:
        - "Split JWT into header.payload.signature"
        - "Base64URL decode signature component"
        - "Validate signature is 256 bytes (RSA-2048)"
      error_handling: "Invalid signature format"

    prepare_message:
      description: "Prepare message for verification"
      operations:
        - "Concatenate header + '.' + payload"
        - "Use ASCII/UTF-8 encoding"
        - "Ensure no extra whitespace"
      validation: "Message matches signing input"

    load_public_key:
      description: "Load RSA public key"
      operations:
        - "Get from keystore cache"
        - "Parse PEM format"
        - "Extract RSA parameters"
      caching: "In-memory cache with rotation refresh"
      performance: "Cached access <0.1ms"

    compute_hash:
      description: "Compute SHA-256 hash"
      operations:
        - "Hash the message"
        - "Use cryptographically secure implementation"
        - "Constant-time operation"
      performance: "<0.5ms"

    verify_signature:
      description: "Verify PKCS#1 v1.5 signature"
      operations:
        - "Decrypt signature with public key"
        - "Extract hash from decrypted padding"
        - "Compare with computed hash"
        - "Constant-time comparison"
      security: "Fail fast, no timing leaks"
      performance: "<0.5ms"

  security_properties:
    - "Cryptographically secure verification"
    - "No private key exposure"
    - "Constant-time operations"
    - "Side-channel attack resistance"

# Public Key Management
public_key_management:
  key_format: "PEM-encoded RSA public key"
  key_size: "2048-bit RSA"
  storage: "In-memory cache"
  refresh: "On key rotation events"

  cache_strategy:
    cache_hit_ratio: ">99.9%"
    cache_ttl: "Until key rotation"
    memory_usage: "Minimal (<1KB per key)"
    thread_safety: "Concurrent read access"

  rotation_handling:
    rotation_detection: "Key ID change detection"
    cache_invalidation: "Immediate cache flush"
    new_key_loading: "Synchronous loading"
    validation_overlap: "Support old signatures during transition"

# Performance Requirements
performance_requirements:
  total_latency: "<1ms"
  breakdown:
    - "Key loading: <0.1ms (cached)"
    - "Hash computation: <0.5ms"
    - "Signature verification: <0.5ms"
  throughput: "1000+ verifications per second"
  memory_usage: "Minimal cache overhead"

# Error Handling
error_handling:
  invalid_signature_format:
    error: "InvalidSignatureFormat"
    handling: "Reject token immediately"
    logging: "Debug level (common for attacks)"

  public_key_unavailable:
    error: "PublicKeyUnavailable"
    handling: "Fail verification, return keystore error"
    logging: "Error level, security event"

  signature_verification_failed:
    error: "SignatureVerificationFailed"
    handling: "Reject token, log security event"
    logging: "Warning level, potential attack"

  key_rotation_in_progress:
    error: "KeyRotationInProgress"
    handling: "Retry with backoff, or fail gracefully"
    logging: "Info level, operational event"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "jsonwebtoken = \"8.3\""
      - "rsa = \"0.9\""
      - "sha2 = \"0.10\""
      - "base64 = \"0.21\""

    code_example: |
      pub async fn verify_rs256_signature(
          token: &str,
          keystore: &dyn KeystoreClient,
      ) -> Result<(), SignatureVerificationError> {
          // Decode header to get key info
          let header = jsonwebtoken::decode_header(token)?;

          // Get public key (cached)
          let public_key_pem = keystore.get_public_key().await?;
          let public_key = rsa::RsaPublicKey::from_public_key_pem(&public_key_pem)?;

          // Extract signature
          let parts: Vec<&str> = token.split('.').collect();
          if parts.len() != 3 {
              return Err(SignatureVerificationError::InvalidFormat);
          }

          let signature_bytes = base64::decode_config(parts[2], base64::URL_SAFE_NO_PAD)?;

          // Prepare message
          let message = format!("{}.{}", parts[0], parts[1]);
          let message_bytes = message.as_bytes();

          // Compute hash
          let mut hasher = sha2::Sha256::new();
          hasher.update(message_bytes);
          let hash = hasher.finalize();

          // Verify signature
          let padding = rsa::PaddingScheme::PKCS1v15;
          public_key.verify(padding, &hash, &signature_bytes)?;

          Ok(())
      }

  python:
    dependencies:
      - "PyJWT==2.8.0"
      - "cryptography==41.0.0"

    code_example: |
      async def verify_rs256_signature(token: str, keystore_client) -> None:
          try:
              # Get public key
              public_key_pem = await keystore_client.get_public_key()
              public_key = serialization.load_pem_public_key(
                  public_key_pem.encode()
              )

              # Decode header
              header = jwt.get_unverified_header(token)

              # Verify signature by decoding
              jwt.decode(
                  token,
                  public_key,
                  algorithms=['RS256'],
                  options={'verify_signature': True, 'verify_exp': False}
              )

          except jwt.InvalidSignatureError:
              raise SignatureVerificationError('Invalid signature')
          except Exception as e:
              raise SignatureVerificationError('Verification failed')

