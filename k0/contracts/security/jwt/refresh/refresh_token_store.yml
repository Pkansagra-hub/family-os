---
# ADR-0037: Refresh Token Store Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Refresh Token Store Contract
# Defines Redis-based refresh token storage and management

contract:
  name: refresh_token_store
  version: "1.0.0"
  description: "Redis-based refresh token storage with secure management"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "2 days"

# Refresh Token Storage
refresh_token_storage:
  storage_backend: "Redis"
  token_format: "Opaque token (UUID v4)"
  ttl_management: "Automatic expiration"
  security: "Encrypted storage, secure deletion"

  storage_structure:
    token_key: "jwt:refresh:{token_id}"
    value_format: "JSON with metadata"
    ttl: "Token expiry + buffer (7 days + 1 hour)"
    compression: "None (small payloads)"

  token_metadata:
    required_fields:
      - "token_id: UUID of refresh token"
      - "subject: User identifier"
      - "session_id: Session identifier"
      - "issued_at: Token creation timestamp"
      - "expires_at: Token expiry timestamp"
      - "family_id: Token family for revocation"
      - "client_id: OAuth2 client identifier"
    optional_fields:
      - "device_fingerprint: Device identification"
      - "ip_address: Issuance IP address"
      - "user_agent: Client user agent"

# Token Storage Operations
storage_operations:
  store_token:
    description: "Store refresh token with metadata"
    operations:
      - "Generate unique token_id"
      - "Create metadata JSON"
      - "Set Redis key with TTL"
      - "Verify storage success"
    error_handling: "Redis failure, duplicate token_id"
    performance: "<10ms"

  retrieve_token:
    description: "Retrieve token metadata"
    operations:
      - "Get Redis key"
      - "Parse JSON metadata"
      - "Validate token not expired"
      - "Return metadata or None"
    error_handling: "Key not found, JSON parse error"
    performance: "<5ms"

  revoke_token:
    description: "Revoke specific refresh token"
    operations:
      - "Delete Redis key"
      - "Log revocation event"
      - "Update metrics"
    error_handling: "Key not found (idempotent)"
    performance: "<5ms"

  revoke_token_family:
    description: "Revoke all tokens in family"
    operations:
      - "Find all tokens with family_id"
      - "Delete all matching keys"
      - "Log family revocation"
    error_handling: "Partial failures"
    performance: "<50ms (depends on family size)"

# Token Lifecycle Management
token_lifecycle:
  token_issuance:
    description: "Store token on creation"
    workflow:
      - "Generate token_id"
      - "Create metadata"
      - "Store in Redis"
      - "Return token_id to client"
    atomicity: "All-or-nothing"

  token_usage:
    description: "Validate and consume token"
    workflow:
      - "Retrieve token metadata"
      - "Validate not expired"
      - "Check not previously used"
      - "Mark as used (optional)"
      - "Generate new token pair"
    single_use: "Tokens consumed on use"

  token_expiry:
    description: "Automatic cleanup on expiry"
    mechanism: "Redis TTL expiration"
    monitoring: "Expiry event logging"
    cleanup: "No manual cleanup needed"

  token_revocation:
    description: "Manual token invalidation"
    triggers:
      - "User logout"
      - "Security incident"
      - "Account deactivation"
      - "Token reuse detected"
    cleanup: "Immediate deletion"

# Security Considerations
security_considerations:
  token_opacity:
    description: "Tokens are opaque identifiers"
    rationale: "No sensitive data in token itself"
    implementation: "UUID mapping to metadata"

  encryption_at_rest:
    description: "Redis data encryption"
    mechanism: "Redis encryption at rest"
    key_management: "AWS KMS or equivalent"
    compliance: "GDPR, HIPAA requirements"

  secure_deletion:
    description: "Secure token deletion"
    mechanism: "Redis DEL command"
    verification: "No data recovery possible"
    audit: "Deletion events logged"

  rate_limiting:
    description: "Prevent token storage abuse"
    limits: "100 tokens per user per hour"
    enforcement: "Application-level limiting"
    monitoring: "Rate limit violations"

# Performance Requirements
performance_requirements:
  store_token_latency: "<10ms"
  retrieve_token_latency: "<5ms"
  revoke_token_latency: "<5ms"
  throughput: "1000+ operations per second"
  memory_usage: "Minimal (small JSON objects)"

  redis_connection:
    connection_pool: "Pooled connections"
    timeout: "100ms"
    retry_policy: "3 attempts with backoff"
    circuit_breaker: "Open after 5 failures"

# Error Handling
error_handling:
  redis_connection_failed:
    error: "RedisConnectionFailed"
    handling: "Fail token operation, return service unavailable"
    logging: "Error level, alert on"
    fallback: "No fallback storage"

  token_already_exists:
    error: "TokenAlreadyExists"
    handling: "Regenerate token_id, retry storage"
    logging: "Warning level"
    recovery: "Automatic retry with new ID"

  token_not_found:
    error: "TokenNotFound"
    handling: "Return invalid_token error"
    logging: "Info level (common)"
    security: "Not a security event"

  invalid_token_metadata:
    error: "InvalidTokenMetadata"
    handling: "Log corruption, delete invalid key"
    logging: "Error level"
    recovery: "Automatic cleanup"

  storage_quota_exceeded:
    error: "StorageQuotaExceeded"
    handling: "Reject new token issuance"
    logging: "Warning level"
    monitoring: "Quota usage tracking"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "redis = \"0.23\""
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"

    code_example: |
      use serde::{Deserialize, Serialize};
      use uuid::Uuid;

      #[derive(Debug, Serialize, Deserialize)]
      pub struct RefreshTokenMetadata {
          pub token_id: String,
          pub subject: String,
          pub session_id: String,
          pub issued_at: i64,
          pub expires_at: i64,
          pub family_id: String,
          pub client_id: String,
          pub device_fingerprint: Option<String>,
      }

      pub struct RefreshTokenStore {
          redis_client: redis::Client,
      }

      impl RefreshTokenStore {
          pub async fn store_token(
              &self,
              metadata: RefreshTokenMetadata,
          ) -> Result<String, TokenStoreError> {
              let token_id = Uuid::new_v4().to_string();
              let key = format!("jwt:refresh:{}", token_id);

              let json_value = serde_json::to_string(&metadata)?;
              let ttl = (metadata.expires_at - chrono::Utc::now().timestamp()) + 3600; // +1 hour buffer

              let mut conn = self.redis_client.get_async_connection().await?;
              redis::cmd("SETEX")
                  .arg(&key)
                  .arg(ttl.max(1)) // Minimum 1 second
                  .arg(json_value)
                  .query_async(&mut conn)
                  .await?;

              Ok(token_id)
          }

          pub async fn retrieve_token(
              &self,
              token_id: &str,
          ) -> Result<Option<RefreshTokenMetadata>, TokenStoreError> {
              let key = format!("jwt:refresh:{}", token_id);

              let mut conn = self.redis_client.get_async_connection().await?;
              let json_value: Option<String> = redis::cmd("GET")
                  .arg(&key)
                  .query_async(&mut conn)
                  .await?;

              match json_value {
                  Some(json) => {
                      let metadata: RefreshTokenMetadata = serde_json::from_str(&json)?;
                      Ok(Some(metadata))
                  }
                  None => Ok(None),
              }
          }

          pub async fn revoke_token(&self, token_id: &str) -> Result<(), TokenStoreError> {
              let key = format!("jwt:refresh:{}", token_id);

              let mut conn = self.redis_client.get_async_connection().await?;
              redis::cmd("DEL")
                  .arg(&key)
                  .query_async(&mut conn)
                  .await?;

              Ok(())
          }

          pub async fn revoke_token_family(&self, family_id: &str) -> Result<(), TokenStoreError> {
              // Find all tokens with this family_id
              let pattern = format!("jwt:refresh:*");
              let mut conn = self.redis_client.get_async_connection().await?;

              // Use SCAN to find matching keys (simplified)
              let keys: Vec<String> = redis::cmd("SCAN")
                  .arg(0)
                  .arg("MATCH")
                  .arg(&pattern)
                  .query_async(&mut conn)
                  .await?;

              for key in keys {
                  // Check if this key belongs to the family
                  let json_value: Option<String> = redis::cmd("GET")
                      .arg(&key)
                      .query_async(&mut conn)
                      .await?;

                  if let Some(json) = json_value {
                      if let Ok(metadata) = serde_json::from_str::<RefreshTokenMetadata>(&json) {
                          if metadata.family_id == family_id {
                              redis::cmd("DEL").arg(&key).query_async(&mut conn).await?;
                          }
                      }
                  }
              }

              Ok(())
          }
      }

  python:
    dependencies:
      - "redis==4.5.0"
      - "pydantic==2.0.0"
      - "uuid"

    code_example: |
      import redis.asyncio as redis
      from pydantic import BaseModel
      from typing import Optional
      import json
      import time
      import uuid

      class RefreshTokenMetadata(BaseModel):
          token_id: str
          subject: str
          session_id: str
          issued_at: int
          expires_at: int
          family_id: str
          client_id: str
          device_fingerprint: Optional[str] = None

      class RefreshTokenStore:
          def __init__(self, redis_url: str):
              self.redis = redis.from_url(redis_url)

          async def store_token(self, metadata: RefreshTokenMetadata) -> str:
              """Store refresh token metadata"""
              token_id = str(uuid.uuid4())
              key = f"jwt:refresh:{token_id}"

              # Calculate TTL with buffer
              now = int(time.time())
              ttl = (metadata.expires_at - now) + 3600  # +1 hour buffer

              json_value = metadata.json()

              await self.redis.setex(key, ttl, json_value)
              return token_id

          async def retrieve_token(self, token_id: str) -> Optional[RefreshTokenMetadata]:
              """Retrieve token metadata"""
              key = f"jwt:refresh:{token_id}"
              json_value = await self.redis.get(key)

              if json_value:
                  data = json.loads(json_value)
                  return RefreshTokenMetadata(**data)
              return None

          async def revoke_token(self, token_id: str) -> None:
              """Revoke specific token"""
              key = f"jwt:refresh:{token_id}"
              await self.redis.delete(key)

          async def revoke_token_family(self, family_id: str) -> None:
              """Revoke all tokens in family"""
              # This is a simplified implementation
              # In production, you'd want a more efficient approach
              pattern = "jwt:refresh:*"
              keys = []

              # SCAN for keys (simplified)
              cursor = 0
              while True:
                  cursor, batch = await self.redis.scan(cursor, match=pattern, count=100)
                  keys.extend(batch)
                  if cursor == 0:
                      break

              # Check each key's family_id
              for key in keys:
                  json_value = await self.redis.get(key)
                  if json_value:
                      try:
                          data = json.loads(json_value)
                          if data.get('family_id') == family_id:
                              await self.redis.delete(key)
                      except json.JSONDecodeError:
                          continue

