---
# ADR-0037: Logout Flow Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Logout Flow Contract
# Defines secure logout with token cleanup and session termination

contract:
  name: logout_flow
  version: "1.0.0"
  description: "Secure logout flow with token revocation and cleanup"
  parent_adr: "ADR-0037"
  priority: "HIGH"
  effort: "1 day"

# Logout Flow Overview
logout_flow_overview:
  description: "Complete logout process with security cleanup"
  objectives:
    - "Revoke all active refresh tokens"
    - "Invalidate current access token"
    - "Clean up session state"
    - "Prevent token reuse"
    - "Log security event"

  flow_steps:
    authenticate_request:
      description: "Verify logout request authenticity"
      methods: ["Bearer token", "Session cookie", "API key"]
      validation: "Valid active session"

    revoke_tokens:
      description: "Revoke all tokens for session"
      scope: "Current session family"
      cleanup: "Immediate invalidation"

    cleanup_session:
      description: "Clean up server-side session state"
      operations: ["Delete session data", "Clear caches"]
      persistence: "Durable cleanup"

    respond_success:
      description: "Confirm logout completion"
      response: "Success confirmation"
      client_actions: "Clear local storage"

# Logout Endpoint
logout_endpoint:
  http_method: "POST"
  path: "/auth/logout"
  authentication: "Required (access token or session)"

  request_formats:
    bearer_token:
      authorization: "Bearer {access_token}"
      description: "Use current access token"

    refresh_token:
      content_type: "application/json"
      body: |
        {
          "refresh_token": "optional_refresh_token"
        }
      description: "Optionally specify refresh token to revoke"

  response_formats:
    success:
      status_code: 200
      content_type: "application/json"
      body: |
        {
          "success": true,
          "message": "Logged out successfully",
          "revoked_tokens": 3
        }

    error_responses:
      unauthorized:
        status_code: 401
        error: "unauthorized"
        description: "Invalid or missing authentication"

      server_error:
        status_code: 500
        error: "server_error"
        description: "Logout failed"

# Token Revocation Strategy
token_revocation_strategy:
  scope_determination:
    description: "Determine which tokens to revoke"
    strategies:
      session_family:
        description: "Revoke all tokens in current session family"
        trigger: "Standard logout"
        scope: "Family-based revocation"

      specific_token:
        description: "Revoke specific refresh token"
        trigger: "Token-specific logout"
        scope: "Individual token"

      all_user_tokens:
        description: "Revoke all user's tokens"
        trigger: "Complete logout from all devices"
        scope: "User-wide revocation"

  revocation_execution:
    immediate_invalidation:
      description: "Immediate token invalidation"
      mechanism: "Delete from storage"
      effectiveness: "100% prevention of reuse"

    blacklist_addition:
      description: "Add to revocation blacklist"
      purpose: "Handle in-flight requests"
      duration: "Token remaining lifetime"

# Session Cleanup
session_cleanup:
  server_state_cleanup:
    description: "Clean up server-side session data"
    operations:
      - "Delete session records"
      - "Clear session caches"
      - "Remove temporary data"
    persistence: "Durable deletion"

  client_state_cleanup:
    description: "Guide client cleanup"
    recommendations:
      - "Clear local storage"
      - "Clear session storage"
      - "Remove cookies"
      - "Redirect to login"
    enforcement: "Client responsibility"

# Security Considerations
security_considerations:
  logout_completeness:
    description: "Ensure complete logout"
    requirements:
      - "All tokens invalidated"
      - "Session state cleared"
      - "No token reuse possible"
    verification: "Post-logout token validation fails"

  timing_attacks:
    description: "Prevent logout timing analysis"
    measures:
      - "Consistent response times"
      - "No token information leakage"
      - "Uniform error responses"
    implementation: "Constant-time operations"

  audit_logging:
    description: "Complete logout audit trail"
    events:
      - "Logout request received"
      - "Tokens revoked"
      - "Session cleaned up"
      - "Client IP and user agent"
    retention: "90 days"
    compliance: "Security auditing"

  rate_limiting:
    description: "Prevent logout abuse"
    limits: "10 logout requests per minute per user"
    enforcement: "User-based limiting"
    monitoring: "Abuse detection"

# Error Handling
error_handling:
  authentication_failure:
    error: "AuthenticationFailure"
    response: "401 unauthorized"
    logging: "Info level"
    security: "Not a security event"

  token_revocation_failure:
    error: "TokenRevocationFailure"
    response: "500 server_error"
    logging: "Error level"
    recovery: "Retry revocation"

  session_cleanup_failure:
    error: "SessionCleanupFailure"
    response: "500 server_error"
    logging: "Warning level"
    partial_success: "Accept partial cleanup"

  concurrent_logout:
    error: "ConcurrentLogout"
    response: "200 success (idempotent)"
    logging: "Info level"
    handling: "Treat as successful"

# Performance Requirements
performance_requirements:
  logout_latency: "<300ms"
  breakdown:
    - "Authentication: <50ms"
    - "Token revocation: <150ms"
    - "Session cleanup: <50ms"
    - "Response: <50ms"
  throughput: "100+ logouts per second"
  concurrent_handling: "Support high concurrency"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "axum = \"0.6\""
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"

    code_example: |
      use axum::{
          extract::Json,
          http::StatusCode,
          response::Json as JsonResponse,
      };
      use serde::{Deserialize, Serialize};

      #[derive(Deserialize)]
      pub struct LogoutRequest {
          pub refresh_token: Option<String>,
      }

      #[derive(Serialize)]
      pub struct LogoutResponse {
          pub success: bool,
          pub message: String,
          pub revoked_tokens: u32,
      }

      pub async fn logout_handler(
          auth_context: AuthContext,
          Json(request): Json<LogoutRequest>,
      ) -> Result<Json<LogoutResponse>, (StatusCode, Json<serde_json::Value>)> {
          // Verify authentication
          let session_info = auth_context.session()
              .ok_or_else(|| (
                  StatusCode::UNAUTHORIZED,
                  Json(serde_json::json!({
                      "error": "unauthorized",
                      "error_description": "Authentication required"
                  }))
              ))?;

          // Determine revocation scope
          let family_id = if let Some(refresh_token) = &request.refresh_token {
              // Get family from specific token
              let token_store = get_token_store();
              let metadata = token_store
                  .retrieve_token(refresh_token)
                  .await
                  .map_err(|_| (
                      StatusCode::INTERNAL_SERVER_ERROR,
                      Json(serde_json::json!({
                          "error": "server_error"
                      }))
                  ))?
                  .ok_or_else(|| (
                      StatusCode::BAD_REQUEST,
                      Json(serde_json::json!({
                          "error": "invalid_request",
                          "error_description": "Invalid refresh token"
                      }))
                  ))?;

              metadata.family_id
          } else {
              // Use current session family
              session_info.family_id.clone()
          };

          // Revoke token family
          let family_revocator = get_family_revocator();
          let revocation_result = family_revocator
              .revoke_family(&family_id, RevocationTrigger::UserLogout)
              .await
              .map_err(|_| (
                  StatusCode::INTERNAL_SERVER_ERROR,
                  Json(serde_json::json!({
                      "error": "server_error"
                  }))
              ))?;

          // Clean up session state
          let session_manager = get_session_manager();
          session_manager
              .cleanup_session(&session_info.session_id)
              .await;

          // Log logout event
          tracing::info!(
              user_id = %session_info.user_id,
              session_id = %session_info.session_id,
              family_id = %family_id,
              revoked_tokens = %revocation_result.tokens_revoked,
              "User logout completed"
          );

          // Return success response
          Ok(Json(LogoutResponse {
              success: true,
              message: "Logged out successfully".to_string(),
              revoked_tokens: revocation_result.tokens_revoked,
          }))
      }

  python:
    dependencies:
      - "fastapi==0.100.0"
      - "pydantic==2.0.0"

    code_example: |
      from fastapi import FastAPI, HTTPException, Depends
      from pydantic import BaseModel
      from typing import Optional

      app = FastAPI()

      class LogoutRequest(BaseModel):
          refresh_token: Optional[str] = None

      class LogoutResponse(BaseModel):
          success: bool
          message: str
          revoked_tokens: int

      @app.post("/auth/logout", response_model=LogoutResponse)
      async def logout(
          request: LogoutRequest,
          auth_context: AuthContext = Depends(get_auth_context)
      ):
          """Secure logout endpoint"""
          try:
              # Verify authentication
              if not auth_context.session:
                  raise HTTPException(
                      status_code=401,
                      detail={
                          "error": "unauthorized",
                          "error_description": "Authentication required"
                      }
                  )

              session_info = auth_context.session

              # Determine revocation scope
              if request.refresh_token:
                  # Get family from specific token
                  token_store = get_token_store()
                  metadata = await token_store.retrieve_token(request.refresh_token)
                  if not metadata:
                      raise HTTPException(
                          status_code=400,
                          detail={
                              "error": "invalid_request",
                              "error_description": "Invalid refresh token"
                          }
                      )
                  family_id = metadata.family_id
              else:
                  # Use current session family
                  family_id = session_info.family_id

              # Revoke token family
              family_revocator = get_family_revocator()
              revocation_result = await family_revocator.revoke_family(
                  family_id,
                  RevocationTrigger.USER_LOGOUT
              )

              # Clean up session state
              session_manager = get_session_manager()
              await session_manager.cleanup_session(session_info.session_id)

              # Log event
              import logging
              logging.info(
                  f"User logout: user={session_info.user_id}, "
                  f"session={session_info.session_id}, "
                  f"family={family_id}, revoked={revocation_result.tokens_revoked}"
              )

              return LogoutResponse(
                  success=True,
                  message="Logged out successfully",
                  revoked_tokens=revocation_result.tokens_revoked
              )

          except HTTPException:
              raise
          except Exception as e:
              import logging
              logging.error(f"Logout failed: {e}")
              raise HTTPException(
                  status_code=500,
                  detail={
                      "error": "server_error"
                  }
              )

# Testing Requirements
testing:
  unit_tests:
    - "Logout request validation"
    - "Token revocation logic"
    - "Session cleanup"
    - "Error handling"

  integration_tests:
    - "Full logout workflow"
    - "Token invalidation verification"
    - "Session cleanup verification"
    - "Concurrent logout handling"

  security_tests:
    - "Unauthorized logout attempts"
    - "Token information leakage"
    - "Timing attack prevention"
    - "Audit trail integrity"

  performance_tests:
    - "Logout latency"
    - "Concurrent logouts"
    - "Resource cleanup efficiency"

# Dependencies
dependencies:
  upstream:
    - "token_family_revocation.yml: Provides family revocation"
    - "refresh_token_store.yml: Provides token management"
  downstream:
    - "observability.yml: Monitors logout metrics"

# Success Criteria
success_criteria:
  functional:
    - "Tokens properly revoked"
    - "Session state cleaned up"
    - "Success response returned"
    - "Audit events logged"

  performance:
    - "Logout <300ms"
    - "High throughput maintained"
    - "Efficient cleanup"

  security:
    - "Complete token invalidation"
    - "No information leakage"
    - "Secure audit trail"

  reliability:
    - "Error handling comprehensive"
    - "Idempotent operations"
    - "Graceful degradation"