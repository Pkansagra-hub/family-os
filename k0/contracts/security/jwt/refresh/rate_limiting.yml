---
# ADR-0037: Rate Limiting Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Rate Limiting Contract
# Defines rate limiting for JWT authentication endpoints

contract:
  name: rate_limiting
  version: "1.0.0"
  description: "Rate limiting for JWT authentication endpoints"
  parent_adr: "ADR-0037"
  priority: "HIGH"
  effort: "1 day"

# Rate Limiting Overview
rate_limiting_overview:
  description: "Protect authentication endpoints from abuse"
  objectives:
    - "Prevent brute force attacks"
    - "Limit resource consumption"
    - "Ensure service availability"
    - "Provide fair access"

  protected_endpoints:
    - "/auth/login"
    - "/auth/refresh"
    - "/auth/logout"
    - "/auth/token"  # If separate token endpoint

  limiting_strategies:
    user_based: "Per user identifier"
    ip_based: "Per client IP address"
    endpoint_based: "Per API endpoint"
    global: "System-wide limits"

# Rate Limiting Algorithms
rate_limiting_algorithms:
  token_bucket:
    description: "Token bucket algorithm for smooth rate limiting"
    parameters:
      capacity: "Maximum burst requests"
      refill_rate: "Tokens added per second"
    use_case: "General API protection"
    implementation: "In-memory with Redis backing"

  fixed_window:
    description: "Fixed time window counter"
    parameters:
      window_size: "Time window duration"
      max_requests: "Maximum requests per window"
    use_case: "Simple rate limiting"
    implementation: "Redis counters with TTL"

  sliding_window:
    description: "Sliding time window for precision"
    parameters:
      window_size: "Time window duration"
      max_requests: "Maximum requests per window"
    use_case: "Precise rate limiting"
    implementation: "Redis sorted sets"

# Rate Limits Configuration
rate_limits_configuration:
  login_endpoint:
    algorithm: "token_bucket"
    capacity: 5  # Burst requests
    refill_rate: 0.1  # 1 request per 10 seconds
    identifier: "username or IP"
    violation_response: "429 Too Many Requests"

  refresh_endpoint:
    algorithm: "token_bucket"
    capacity: 10  # Burst requests
    refill_rate: 0.167  # 1 request per 6 seconds
    identifier: "user_id"
    violation_response: "429 Too Many Requests"

  logout_endpoint:
    algorithm: "fixed_window"
    window_size: 60  # seconds
    max_requests: 10  # per window
    identifier: "user_id"
    violation_response: "429 Too Many Requests"

  global_limits:
    algorithm: "sliding_window"
    window_size: 60  # seconds
    max_requests: 1000  # per window
    identifier: "global"
    violation_response: "503 Service Unavailable"

# Rate Limiting Implementation
rate_limiting_implementation:
  storage_backend: "Redis"
  key_patterns:
    user_limit: "ratelimit:user:{user_id}:{endpoint}"
    ip_limit: "ratelimit:ip:{ip_address}:{endpoint}"
    global_limit: "ratelimit:global:{endpoint}"

  lua_scripts:
    token_bucket_check: |
      local key = KEYS[1]
      local capacity = tonumber(ARGV[1])
      local refill_rate = tonumber(ARGV[2])
      local now = tonumber(ARGV[3])

      local bucket = redis.call('HMGET', key, 'tokens', 'last_refill')
      local tokens = tonumber(bucket[1]) or capacity
      local last_refill = tonumber(bucket[2]) or now

      local time_passed = now - last_refill
      local tokens_to_add = time_passed * refill_rate
      tokens = math.min(capacity, tokens + tokens_to_add)

      local allowed = tokens >= 1
      if allowed then
          tokens = tokens - 1
      end

      redis.call('HMSET', key, 'tokens', tokens, 'last_refill', now)
      redis.call('EXPIRE', key, math.ceil(capacity / refill_rate) * 2)

      return allowed

  middleware_integration:
    description: "Integrate rate limiting into request pipeline"
    placement: "Before authentication"
    failure_handling: "Return 429 immediately"
    logging: "Rate limit violations"

# Rate Limit Responses
rate_limit_responses:
  http_429_response:
    status_code: 429
    headers:
      retry_after: "Seconds until next request allowed"
      x_ratelimit_limit: "Request limit"
      x_ratelimit_remaining: "Remaining requests"
      x_ratelimit_reset: "Reset timestamp"
    body: |
      {
        "error": "too_many_requests",
        "error_description": "Rate limit exceeded",
        "retry_after": 30
      }

  http_503_response:
    status_code: 503
    headers:
      retry_after: "Backoff duration"
    body: |
      {
        "error": "service_unavailable",
        "error_description": "Service temporarily unavailable"
      }

# Monitoring and Alerting
monitoring_alerting:
  metrics_collection:
    rate_limit_hits_total:
      type: "Counter"
      labels: ["endpoint", "limit_type", "identifier_type"]
      example: "rate_limit_hits_total{endpoint=\"/auth/login\",limit_type=\"user\"} 150"

    rate_limit_violations_total:
      type: "Counter"
      labels: ["endpoint", "limit_type", "identifier"]
      example: "rate_limit_violations_total{endpoint=\"/auth/login\",limit_type=\"user\"} 5"

    current_rate_limit_usage:
      type: "Gauge"
      labels: ["endpoint", "limit_type"]
      example: "current_rate_limit_usage{endpoint=\"/auth/login\",limit_type=\"user\"} 0.8"

  alerting_rules:
    high_violation_rate:
      condition: "rate(rate_limit_violations_total[5m]) > 10"
      severity: "WARNING"
      description: "High rate limit violation rate"
      runbook: "Check for brute force attacks"

    limit_exhaustion:
      condition: "current_rate_limit_usage > 0.9"
      severity: "INFO"
      description: "Rate limits nearing exhaustion"
      runbook: "Monitor for increased load"

# Security Considerations
security_considerations:
  brute_force_protection:
    description: "Prevent password guessing attacks"
    implementation: "Strict login rate limits"
    monitoring: "Failed login attempts"
    alerting: "Suspicious patterns"

  credential_stuffing_prevention:
    description: "Prevent automated credential testing"
    implementation: "IP-based and user-based limits"
    detection: "Cross-user attack patterns"
    response: "Temporary IP blocks"

  ddos_protection:
    description: "Protect against authentication DDoS"
    implementation: "Global rate limits"
    scaling: "Auto-scaling based on load"
    fallback: "Circuit breaker pattern"

  information_leakage:
    description: "Prevent rate limit information leakage"
    measures:
      - "Consistent response times"
      - "No limit details in errors"
      - "Jitter in retry_after headers"
    implementation: "Response normalization"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "redis = \"0.23\""
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "axum = \"0.6\""

    code_example: |
      use axum::{
          http::{StatusCode, HeaderMap},
          response::Json as JsonResponse,
      };
      use serde_json::json;

      pub struct RateLimiter {
          redis_client: redis::Client,
      }

      impl RateLimiter {
          pub async fn check_limit(
              &self,
              identifier: &str,
              endpoint: &str,
              capacity: f64,
              refill_rate: f64,
          ) -> Result<(), RateLimitError> {
              let key = format!("ratelimit:{}:{}", identifier, endpoint);
              let now = chrono::Utc::now().timestamp() as f64;

              let script = redis::Script::new(r#"
                  local key = KEYS[1]
                  local capacity = tonumber(ARGV[1])
                  local refill_rate = tonumber(ARGV[2])
                  local now = tonumber(ARGV[3])

                  local bucket = redis.call('HMGET', key, 'tokens', 'last_refill')
                  local tokens = tonumber(bucket[1]) or capacity
                  local last_refill = tonumber(bucket[2]) or now

                  local time_passed = now - last_refill
                  local tokens_to_add = time_passed * refill_rate
                  tokens = math.min(capacity, tokens + tokens_to_add)

                  if tokens < 1 then
                      return {false, math.ceil((1 - tokens) / refill_rate)}
                  end

                  tokens = tokens - 1
                  redis.call('HMSET', key, 'tokens', tokens, 'last_refill', now)
                  redis.call('EXPIRE', key, math.ceil(capacity / refill_rate) * 2)

                  return {true, 0}
              "#);

              let mut conn = self.redis_client.get_async_connection().await?;
              let result: Vec<i64> = script
                  .key(&key)
                  .arg(capacity)
                  .arg(refill_rate)
                  .arg(now)
                  .invoke_async(&mut conn)
                  .await?;

              if result[0] == 1 {
                  Ok(())
              } else {
                  Err(RateLimitError::LimitExceeded {
                      retry_after: result[1] as u32,
                  })
              }
          }
      }

      pub async fn rate_limit_middleware(
          req: axum::extract::Request,
          next: axum::middleware::Next,
      ) -> Result<axum::response::Response, (StatusCode, JsonResponse<serde_json::Value>)> {
          // Extract identifier (simplified - use IP or user ID)
          let identifier = "user123"; // In practice, extract from auth context

          let rate_limiter = get_rate_limiter();
          match rate_limiter.check_limit(identifier, "/auth/login", 5.0, 0.1).await {
              Ok(_) => {
                  // Proceed with request
                  Ok(next.run(req).await)
              }
              Err(RateLimitError::LimitExceeded { retry_after }) => {
                  let mut headers = HeaderMap::new();
                  headers.insert("retry-after", retry_after.into());

                  Err((
                      StatusCode::TOO_MANY_REQUESTS,
                      JsonResponse(json!({
                          "error": "too_many_requests",
                          "error_description": "Rate limit exceeded",
                          "retry_after": retry_after
                      })),
                  ))
              }
          }
      }

  python:
    dependencies:
      - "redis==4.5.0"
      - "fastapi==0.100.0"

    code_example: |
      import redis.asyncio as redis
      from fastapi import Request, HTTPException
      from starlette.middleware.base import BaseHTTPMiddleware

      class RateLimiter:
          def __init__(self, redis_url: str):
              self.redis = redis.from_url(redis_url)

          async def check_limit(
              self,
              identifier: str,
              endpoint: str,
              capacity: float,
              refill_rate: float
          ) -> tuple[bool, int]:
              """Check rate limit using token bucket algorithm"""
              key = f"ratelimit:{identifier}:{endpoint}"
              now = time.time()

              # Lua script for atomic token bucket
              script = """
              local key = KEYS[1]
              local capacity = tonumber(ARGV[1])
              local refill_rate = tonumber(ARGV[2])
              local now = tonumber(ARGV[3])

              local bucket = redis.call('HMGET', key, 'tokens', 'last_refill')
              local tokens = tonumber(bucket[1]) or capacity
              local last_refill = tonumber(bucket[2]) or now

              local time_passed = now - last_refill
              local tokens_to_add = time_passed * refill_rate
              tokens = min(capacity, tokens + tokens_to_add)

              if tokens < 1 then
                  return {0, math.ceil((1 - tokens) / refill_rate)}
              end

              tokens = tokens - 1
              redis.call('HMSET', key, 'tokens', tokens, 'last_refill', now)
              redis.call('EXPIRE', key, math.ceil(capacity / refill_rate) * 2)

              return {1, 0}
              """

              result = await self.redis.eval(script, 1, key, capacity, refill_rate, now)
              return result[0] == 1, result[1]

      class RateLimitMiddleware(BaseHTTPMiddleware):
          def __init__(self, app, rate_limiter: RateLimiter):
              super().__init__(app)
              self.rate_limiter = rate_limiter

          async def dispatch(self, request: Request, call_next):
              # Extract identifier (simplified)
              identifier = request.client.host  # Use IP or user ID

              # Check rate limit
              allowed, retry_after = await self.rate_limiter.check_limit(
                  identifier, request.url.path, 5.0, 0.1
              )

              if not allowed:
                  raise HTTPException(
                      status_code=429,
                      detail={
                          "error": "too_many_requests",
                          "error_description": "Rate limit exceeded",
                          "retry_after": retry_after
                      },
                      headers={"retry-after": str(retry_after)}
                  )

              # Proceed with request
              response = await call_next(request)
              return response

