      - "Scope enforcement"
      - "Permission boundary checks"
      - "Audit trail monitoring"

  least_privilege_principle:
    description: "Grant minimum required permissions"
    implementation: "Role-based permission assignment"
    monitoring: "Permission usage analysis"
    cleanup: "Remove unused permissions"

  separation_of_duties:
    description: "Prevent single points of failure"
    implementation: "Mutually exclusive roles"
    conflict_detection: "Role conflict identification"
    approval_requirements: "Dual authorization for conflicts"

  audit_and_monitoring:
    description: "Comprehensive access audit trail"
    events:
      - "Role assignments and revocations"
      - "Permission checks and decisions"
      - "Access denials"
      - "Privilege escalation attempts"
    retention: "7 years for compliance"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "hashbrown = \"0.14\""

    code_example: |
      use serde::{Deserialize, Serialize};
      use std::collections::HashMap;

      #[derive(Debug, Clone, Serialize, Deserialize)]
      pub struct Role {
          pub role_id: String,
          pub role_name: String,
          pub permissions: Vec<String>,
          pub hierarchy_level: i32,
          pub scope: String,
      }

      #[derive(Debug, Clone, Serialize, Deserialize)]
      pub struct Permission {
          pub resource: String,
          pub action: String,
          pub scope: String,
      }

      #[derive(Debug)]
      pub struct AccessDecision {
          pub allowed: bool,
          pub reason: String,
          pub required_permissions: Vec<String>,
          pub granted_permissions: Vec<String>,
      }

      pub struct RoleBasedAccessControl {
          roles: HashMap<String, Role>,
          user_roles: HashMap<String, Vec<String>>, // user_id -> role_ids
      }

      impl RoleBasedAccessControl {
          pub fn new() -> Self {
              Self {
                  roles: HashMap::new(),
                  user_roles: HashMap::new(),
              }
          }

          pub fn add_role(&mut self, role: Role) {
              self.roles.insert(role.role_id.clone(), role);
          }

          pub fn assign_role(&mut self, user_id: &str, role_id: &str) -> Result<(), AccessError> {
              // Validate role exists
              if !self.roles.contains_key(role_id) {
                  return Err(AccessError::RoleNotFound);
              }

              // Add role to user
              self.user_roles
                  .entry(user_id.to_string())
                  .or_insert_with(Vec::new)
                  .push(role_id.to_string());

              Ok(())
          }

          pub fn check_permission(
              &self,
              user_id: &str,
              resource: &str,
              action: &str,
              scope: &str,
          ) -> AccessDecision {
              let user_role_ids = self.user_roles.get(user_id).cloned().unwrap_or_default();
              let mut granted_permissions = Vec::new();

              // Collect all permissions from user's roles
              for role_id in &user_role_ids {
                  if let Some(role) = self.roles.get(role_id) {
                      for permission in &role.permissions {
                          if self.matches_permission(permission, resource, action, scope) {
                              granted_permissions.push(permission.clone());
                          }
                      }
                  }
              }

              // Check if any permission allows the action
              let required_permission = format!("{}.{}", resource, action);
              let allowed = granted_permissions.iter().any(|p| {
                  p == "*" || p == &required_permission || self.is_wildcard_match(p, &required_permission)
              });

              AccessDecision {
                  allowed,
                  reason: if allowed {
                      "Permission granted".to_string()
                  } else {
                      "Permission denied".to_string()
                  },
                  required_permissions: vec![required_permission],
                  granted_permissions,
              }
          }

          pub fn get_user_permissions(&self, user_id: &str) -> Vec<String> {
              let user_role_ids = self.user_roles.get(user_id).cloned().unwrap_or_default();
              let mut permissions = Vec::new();

              for role_id in &user_role_ids {
                  if let Some(role) = self.roles.get(role_id) {
                      permissions.extend(role.permissions.clone());
                  }
              }

              permissions
          }

          fn matches_permission(&self, permission: &str, resource: &str, action: &str, scope: &str) -> bool {
              if permission == "*" {
                  return true;
              }

              let parts: Vec<&str> = permission.split('.').collect();
              if parts.len() < 2 {
                  return false;
              }

              let perm_resource = parts[0];
              let perm_action = parts[1];

              // Check resource match
              if perm_resource != "*" && perm_resource != resource {
                  return false;
              }

              // Check action match
              if perm_action != "*" && perm_action != action {
                  return false;
              }

              // Additional scope checking could be added here
              true
          }

          fn is_wildcard_match(&self, pattern: &str, permission: &str) -> bool {
              if pattern.ends_with(".*") {
                  let prefix = &pattern[..pattern.len() - 2];
                  return permission.starts_with(prefix);
              }
              false
          }
      }

  python:
    dependencies:
      - "pydantic==2.0.0"
      - "typing-extensions==4.5.0"

    code_example: |
      from pydantic import BaseModel
      from typing import List, Dict, Optional
      import re

      class Role(BaseModel):
          role_id: str
          role_name: str
          permissions: List[str]
          hierarchy_level: int
          scope: str

      class Permission(BaseModel):
          resource: str
          action: str
          scope: str

      class AccessDecision(BaseModel):
          allowed: bool
          reason: str
          required_permissions: List[str]
          granted_permissions: List[str]

      class RoleBasedAccessControl:
          def __init__(self):
              self.roles: Dict[str, Role] = {}
              self.user_roles: Dict[str, List[str]] = {}

          def add_role(self, role: Role) -> None:
              """Add a role to the system"""
              self.roles[role.role_id] = role

          def assign_role(self, user_id: str, role_id: str) -> None:
              """Assign a role to a user"""
              if role_id not in self.roles:
                  raise AccessError(f"Role {role_id} not found")

              if user_id not in self.user_roles:
                  self.user_roles[user_id] = []

              if role_id not in self.user_roles[user_id]:
                  self.user_roles[user_id].append(role_id)

          def check_permission(
              self,
              user_id: str,
              resource: str,
              action: str,
              scope: str
          ) -> AccessDecision:
              """Check if user has permission for an action"""
              user_role_ids = self.user_roles.get(user_id, [])
              granted_permissions = []

              # Collect permissions from all user roles
              for role_id in user_role_ids:
                  role = self.roles.get(role_id)
                  if role:
                      for permission in role.permissions:
                          if self._matches_permission(permission, resource, action, scope):
                              granted_permissions.append(permission)

              # Check if action is allowed
              required_permission = f"{resource}.{action}"
              allowed = any(
                  perm == "*" or
                  perm == required_permission or
                  self._is_wildcard_match(perm, required_permission)
                  for perm in granted_permissions
              )

              return AccessDecision(
                  allowed=allowed,
                  reason="Permission granted" if allowed else "Permission denied",
                  required_permissions=[required_permission],
                  granted_permissions=granted_permissions
              )

          def get_user_permissions(self, user_id: str) -> List[str]:
              """Get all permissions for a user"""
              user_role_ids = self.user_roles.get(user_id, [])
              permissions = []

              for role_id in user_role_ids:
                  role = self.roles.get(role_id)
                  if role:
                      permissions.extend(role.permissions)

              return permissions

          def _matches_permission(self, permission: str, resource: str, action: str, scope: str) -> bool:
              """Check if a permission matches the required action"""
              if permission == "*":
                  return True

              parts = permission.split(".")
              if len(parts) < 2:
                  return False

              perm_resource, perm_action = parts[0], parts[1]

              # Check resource match
              if perm_resource != "*" and perm_resource != resource:
                  return False

              # Check action match
              if perm_action != "*" and perm_action != action:
                  return False

              return True

          def _is_wildcard_match(self, pattern: str, permission: str) -> bool:
              """Check wildcard permission match"""
              if pattern.endswith(".*"):
                  prefix = pattern[:-2]
                  return permission.startswith(prefix)
              return False

