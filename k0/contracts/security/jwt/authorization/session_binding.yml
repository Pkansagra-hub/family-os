---
# ADR-0037: Session Binding Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Session Binding Contract
# Defines session binding and management for JWT tokens

contract:
  name: session_binding
  version: "1.0.0"
  description: "Session binding and management for JWT authentication"
  parent_adr: "ADR-0037"
  priority: "CRITICAL"
  effort: "1.5 days"

# Session Concept
session_concept:
  description: "User session management with JWT token binding"
  objectives:
    - "Bind tokens to user sessions"
    - "Enable session-based revocation"
    - "Track session lifecycle"
    - "Support concurrent session management"

  session_properties:
    session_id: "Unique session identifier (UUID)"
    user_id: "Authenticated user identifier"
    created_at: "Session creation timestamp"
    expires_at: "Session expiration timestamp"
    last_activity: "Last activity timestamp"
    device_info: "Client device information"
    ip_address: "Client IP address"
    status: "active|expired|terminated"

# Session Binding Process
session_binding_process:
  session_creation:
    description: "Create session on successful authentication"
    steps:
      - "Generate unique session_id"
      - "Associate with user_id"
      - "Set initial expiry"
      - "Record client information"
      - "Store session metadata"

  token_binding:
    description: "Bind JWT tokens to session"
    mechanisms:
      - "session_id in token claims"
      - "family_id linking tokens"
      - "session validation on token use"
    validation: "Token valid only within session context"

  session_validation:
    description: "Validate session on token use"
    checks:
      - "Session exists and active"
      - "Session not expired"
      - "IP address consistency (optional)"
      - "Device fingerprint match (optional)"
    failure_handling: "Token invalidation"

# Session Management
session_management:
  session_lifecycle:
    states:
      active: "Session accepting new tokens"
      idle: "Session temporarily inactive"
      expired: "Session naturally expired"
      terminated: "Session manually terminated"

    transitions:
      active_to_idle:
        trigger: "Inactivity timeout"
        actions: ["Update status", "Send warning"]
      idle_to_active:
        trigger: "User activity"
        actions: ["Reset timers", "Update activity"]
      active_to_expired:
        trigger: "Expiry timeout"
        actions: ["Terminate session", "Revoke tokens"]
      any_to_terminated:
        trigger: "Manual termination"
        actions: ["Immediate cleanup", "Token revocation"]

  session_timeouts:
    absolute_timeout: "24 hours maximum session duration"
    idle_timeout: "2 hours of inactivity"
    renewal_window: "Extend session on activity"
    warning_threshold: "15 minutes before expiry"

  concurrent_sessions:
    max_sessions_per_user: 5
    replacement_policy: "LRU (oldest first)"
    device_based_limits: "2 sessions per device type"
    monitoring: "Session count tracking"

# Session Storage
session_storage:
  storage_backend: "Redis with persistence"
  key_patterns:
    session_data: "session:{session_id}"
    user_sessions: "user_sessions:{user_id}"
    active_sessions: "active_sessions"

  session_metadata:
    required_fields:
      - "session_id: UUID"
      - "user_id: string"
      - "created_at: timestamp"
      - "expires_at: timestamp"
      - "last_activity: timestamp"
      - "ip_address: string"
      - "user_agent: string"
      - "device_fingerprint: optional string"
    optional_fields:
      - "location: geographic location"
      - "timezone: client timezone"
      - "language: preferred language"

  storage_operations:
    create_session:
      operation: "HMSET with TTL"
      ttl: "Session expiry + buffer"
      indexing: "Add to user sessions set"

    update_activity:
      operation: "HSET last_activity"
      renewal: "Extend expiry if within window"
      atomicity: "Single command"

    terminate_session:
      operation: "DEL session key, remove from user set"
      cleanup: "Revoke associated tokens"
      logging: "Termination event"

# Security Considerations
security_considerations:
  session_hijacking_prevention:
    description: "Prevent session hijacking attacks"
    measures:
      - "IP address binding (optional)"
      - "Device fingerprint validation"
      - "Geographic consistency checks"
      - "Suspicious activity detection"

  session_fixation_protection:
    description: "Prevent session fixation attacks"
    implementation: "New session_id on privilege changes"
    monitoring: "Session ID reuse detection"

  concurrent_session_limits:
    description: "Limit concurrent sessions per user"
    enforcement: "Reject new sessions over limit"
    cleanup: "Automatic old session termination"

  audit_logging:
    description: "Complete session audit trail"
    events:
      - "Session creation"
      - "Session activity"
      - "Session termination"
      - "Suspicious activity"
    retention: "90 days"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "redis = \"0.23\""
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"

    code_example: |
      use serde::{Deserialize, Serialize};
      use uuid::Uuid;

      #[derive(Debug, Serialize, Deserialize)]
      pub struct SessionMetadata {
          pub session_id: String,
          pub user_id: String,
          pub created_at: i64,
          pub expires_at: i64,
          pub last_activity: i64,
          pub ip_address: String,
          pub user_agent: String,
          pub device_fingerprint: Option<String>,
      }

      #[derive(Debug)]
      pub enum SessionStatus {
          Active,
          Idle,
          Expired,
          Terminated,
      }

      pub struct SessionManager {
          redis_client: redis::Client,
      }

      impl SessionManager {
          pub async fn create_session(
              &self,
              user_id: &str,
              ip_address: &str,
              user_agent: &str,
              device_fingerprint: Option<&str>,
          ) -> Result<String, SessionError> {
              let session_id = Uuid::new_v4().to_string();
              let now = chrono::Utc::now().timestamp();

              let session = SessionMetadata {
                  session_id: session_id.clone(),
                  user_id: user_id.to_string(),
                  created_at: now,
                  expires_at: now + 86400, // 24 hours
                  last_activity: now,
                  ip_address: ip_address.to_string(),
                  user_agent: user_agent.to_string(),
                  device_fingerprint: device_fingerprint.map(|s| s.to_string()),
              };

              // Check concurrent session limits
              self.enforce_session_limits(user_id).await?;

              // Store session
              let key = format!("session:{}", session_id);
              let json_value = serde_json::to_string(&session)?;
              let mut conn = self.redis_client.get_async_connection().await?;
              redis::cmd("SETEX")
                  .arg(&key)
                  .arg(86400 + 3600) // TTL + buffer
                  .arg(json_value)
                  .query_async(&mut conn)
                  .await?;

              // Add to user sessions
              let user_key = format!("user_sessions:{}", user_id);
              redis::cmd("SADD")
                  .arg(&user_key)
                  .arg(&session_id)
                  .query_async(&mut conn)
                  .await?;

              Ok(session_id)
          }

          pub async fn validate_session(&self, session_id: &str) -> Result<SessionMetadata, SessionError> {
              let key = format!("session:{}", session_id);
              let mut conn = self.redis_client.get_async_connection().await?;
              let json_value: Option<String> = redis::cmd("GET")
                  .arg(&key)
                  .query_async(&mut conn)
                  .await?;

              let json = json_value.ok_or(SessionError::SessionNotFound)?;
              let session: SessionMetadata = serde_json::from_str(&json)?;

              let now = chrono::Utc::now().timestamp();
              if session.expires_at <= now {
                  return Err(SessionError::SessionExpired);
              }

              // Update last activity
              self.update_activity(session_id).await?;

              Ok(session)
          }

          pub async fn terminate_session(&self, session_id: &str) -> Result<(), SessionError> {
              let mut conn = self.redis_client.get_async_connection().await?;

              // Get session to find user_id
              let key = format!("session:{}", session_id);
              let json_value: Option<String> = redis::cmd("GET")
                  .arg(&key)
                  .query_async(&mut conn)
                  .await?;

              if let Some(json) = json_value {
                  let session: SessionMetadata = serde_json::from_str(&json)?;
                  let user_key = format!("user_sessions:{}", session.user_id);

                  // Remove from user sessions
                  redis::cmd("SREM")
                      .arg(&user_key)
                      .arg(session_id)
                      .query_async(&mut conn)
                      .await?;
              }

              // Delete session
              redis::cmd("DEL")
                  .arg(&key)
                  .query_async(&mut conn)
                  .await?;

              Ok(())
          }

          async fn enforce_session_limits(&self, user_id: &str) -> Result<(), SessionError> {
              let user_key = format!("user_sessions:{}", user_id);
              let mut conn = self.redis_client.get_async_connection().await?;
              let session_count: i64 = redis::cmd("SCARD")
                  .arg(&user_key)
                  .query_async(&mut conn)
                  .await?;

              if session_count >= 5 {
                  return Err(SessionError::TooManySessions);
              }

              Ok(())
          }

          async fn update_activity(&self, session_id: &str) -> Result<(), SessionError> {
              let key = format!("session:{}", session_id);
              let now = chrono::Utc::now().timestamp();

              let mut conn = self.redis_client.get_async_connection().await?;
              redis::cmd("HSET")
                  .arg(&key)
                  .arg("last_activity")
                  .arg(now)
                  .query_async(&mut conn)
                  .await?;

              Ok(())
          }
      }

  python:
    dependencies:
      - "redis==4.5.0"
      - "pydantic==2.0.0"

    code_example: |
      from pydantic import BaseModel
      from typing import Optional
      import redis.asyncio as redis
      import json
      import time
      import uuid

      class SessionMetadata(BaseModel):
          session_id: str
          user_id: str
          created_at: int
          expires_at: int
          last_activity: int
          ip_address: str
          user_agent: str
          device_fingerprint: Optional[str] = None

      class SessionManager:
          def __init__(self, redis_url: str):
              self.redis = redis.from_url(redis_url)

          async def create_session(
              self,
              user_id: str,
              ip_address: str,
              user_agent: str,
              device_fingerprint: Optional[str] = None
          ) -> str:
              """Create a new user session"""
              session_id = str(uuid.uuid4())
              now = int(time.time())

              session = SessionMetadata(
                  session_id=session_id,
                  user_id=user_id,
                  created_at=now,
                  expires_at=now + 86400,  # 24 hours
                  last_activity=now,
                  ip_address=ip_address,
                  user_agent=user_agent,
                  device_fingerprint=device_fingerprint
              )

              # Check session limits
              await self._enforce_session_limits(user_id)

              # Store session
              key = f"session:{session_id}"
              json_value = session.json()
              await self.redis.setex(key, 86400 + 3600, json_value)  # TTL + buffer

              # Add to user sessions
              user_key = f"user_sessions:{user_id}"
              await self.redis.sadd(user_key, session_id)

              return session_id

          async def validate_session(self, session_id: str) -> SessionMetadata:
              """Validate session and update activity"""
              key = f"session:{session_id}"
              json_value = await self.redis.get(key)

              if not json_value:
                  raise SessionError("Session not found")

              session = SessionMetadata.parse_raw(json_value)
              now = int(time.time())

              if session.expires_at <= now:
                  raise SessionError("Session expired")

              # Update last activity
              await self._update_activity(session_id)

              return session

          async def terminate_session(self, session_id: str) -> None:
              """Terminate a session"""
              # Get session to find user_id
              key = f"session:{session_id}"
              json_value = await self.redis.get(key)

              if json_value:
                  session = SessionMetadata.parse_raw(json_value)
                  user_key = f"user_sessions:{session.user_id}"
                  await self.redis.srem(user_key, session_id)

              # Delete session
              await self.redis.delete(key)

          async def _enforce_session_limits(self, user_id: str) -> None:
              """Enforce concurrent session limits"""
              user_key = f"user_sessions:{user_id}"
              session_count = await self.redis.scard(user_key)

              if session_count >= 5:
                  raise SessionError("Too many concurrent sessions")

          async def _update_activity(self, session_id: str) -> None:
              """Update session last activity"""
              key = f"session:{session_id}"
              now = int(time.time())
              await self.redis.hset(key, "last_activity", now)

