---
# ADR-0037: Capability Checking Contract
# Parent: ADR-0037 (JWT Authentication)
# Status: Active
# Date: 2025-10-21
# Authors: K1 Architecture Team

# Capability Checking Contract
# Defines fine-grained capability-based access control

contract:
  name: capability_checking
  version: "1.0.0"
  description: "Fine-grained capability-based access control"
  parent_adr: "ADR-0037"
  priority: "HIGH"
  effort: "1.5 days"

# Capability-Based Access Control Concept
capability_concept:
  description: "Capability-based security model"
  objectives:
    - "Implement fine-grained access control"
    - "Support object-level permissions"
    - "Enable delegation and attenuation"
    - "Provide cryptographic capability tokens"

  core_principles:
    capability_tokens: "Unforgeable tokens granting specific rights"
    object_capabilities: "Capabilities tied to specific objects"
    delegation: "Controlled capability delegation"
    attenuation: "Capability rights reduction"

# Capability Structure
capability_structure:
  capability_components:
    object_id: "Target object identifier"
    rights: "Granted rights (read, write, execute, etc.)"
    issuer: "Capability issuer"
    subject: "Capability holder"
    validity: "Time-based validity constraints"
    delegation_chain: "Delegation history"

  capability_types:
    direct_capabilities:
      description: "Directly granted capabilities"
      examples: ["user:read", "space:write", "document:execute"]
      validation: "Direct issuer validation"

    delegated_capabilities:
      description: "Capabilities granted through delegation"
      delegation_depth: "Maximum delegation levels"
      attenuation_rules: "Rights reduction on delegation"
      revocation_cascade: "Revoke through delegation chain"

    attenuated_capabilities:
      description: "Capabilities with reduced rights"
      attenuation_mechanisms: ["rights_reduction", "time_limits", "usage_limits"]
      restoration: "Cannot restore attenuated rights"

# Capability Rights Model
capability_rights:
  standard_rights:
    read: "Read access to object"
    write: "Write/modify access to object"
    execute: "Execute/run access to object"
    delete: "Delete access to object"
    administer: "Administrative access to object"
    delegate: "Delegate capability to others"

  composite_rights:
    full_access: "read + write + execute + delete"
    read_write: "read + write"
    read_execute: "read + execute"
    manage: "write + delete + administer"

  object_specific_rights:
    user_rights: ["read_profile", "update_profile", "manage_sessions"]
    space_rights: ["read_members", "manage_members", "create_content", "moderate"]
    document_rights: ["read_content", "edit_content", "share", "version_control"]

# Capability Validation
capability_validation:
  validation_process:
    steps:
      - "Extract capability from request"
      - "Verify capability authenticity"
      - "Check capability validity"
      - "Validate rights for operation"
      - "Check delegation chain"
      - "Apply attenuation rules"

  validation_checks:
    authenticity:
      description: "Verify capability is genuine"
      mechanisms: ["cryptographic_signing", "issuer_verification", "chain_validation"]
      failure_handling: "Reject invalid capabilities"

    validity:
      description: "Check capability is still valid"
      time_checks: ["not_before", "not_after", "expiration"]
      usage_limits: ["max_uses", "rate_limits"]
      revocation_checks: ["issuer_revocation", "object_deletion"]

    rights_verification:
      description: "Verify required rights are granted"
      operation_mapping: "Map operation to required rights"
      rights_combination: "Check rights are sufficient"
      attenuation_check: "Apply attenuation constraints"

# Capability Storage and Management
capability_management:
  storage_model:
    capability_store: "Secure storage for capability tokens"
    indexing: ["object_id", "subject", "issuer", "validity_window"]
    encryption: "Capabilities encrypted at rest"
    backup: "Regular capability backups"

  capability_operations:
    grant_capability:
      inputs: ["object_id", "subject", "rights", "validity"]
      validation: "Issuer has delegation rights"
      storage: "Store signed capability"
      notification: "Notify capability holder"

    revoke_capability:
      mechanisms: ["explicit_revocation", "expiration", "cascade_revocation"]
      cleanup: "Remove from storage"
      notification: "Notify affected parties"
      audit_logging: "Log revocation event"

    delegate_capability:
      attenuation_options: ["rights_reduction", "time_limits", "scope_limits"]
      delegation_chain: "Track delegation history"
      revocation_handling: "Cascade revocation support"
      validation: "Check delegation rights"

  capability_lifecycle:
    creation: "Capability issuance"
    usage: "Capability validation on use"
    renewal: "Capability refresh/extension"
    expiration: "Natural capability expiry"
    revocation: "Forced capability removal"

# Delegation and Attenuation
delegation_model:
  delegation_rules:
    delegation_rights: "Must have delegate right to delegate"
    attenuation_required: "Cannot grant more rights than held"
    depth_limits: "Maximum delegation chain length"
    scope_restriction: "Delegation scope limitations"

  attenuation_mechanisms:
    rights_attenuation:
      description: "Reduce granted rights"
      examples: ["full_access → read_only", "admin → user_management"]
      irreversibility: "Cannot restore attenuated rights"

    temporal_attenuation:
      description: "Limit capability validity time"
      mechanisms: ["absolute_expiry", "time_windows", "renewal_limits"]
      renewal_policies: ["automatic_renewal", "manual_approval", "no_renewal"]

    spatial_attenuation:
      description: "Limit capability scope"
      mechanisms: ["object_subsets", "geographic_limits", "network_limits"]
      validation: "Check scope compliance"

# Security Considerations
security_considerations:
  capability_token_security:
    description: "Protect capability tokens from compromise"
    measures:
      - "Cryptographic signing"
      - "Secure storage"
      - "Transport encryption"
      - "Regular rotation"

  delegation_security:
    description: "Secure capability delegation"
    measures:
      - "Delegation chain validation"
      - "Attenuation enforcement"
      - "Revocation cascade"
      - "Audit trail monitoring"

  privilege_attenuation:
    description: "Prevent privilege escalation through delegation"
    measures:
      - "Rights reduction enforcement"
      - "Delegation depth limits"
      - "Scope restrictions"
      - "Regular capability audits"

  audit_and_compliance:
    description: "Comprehensive capability audit trail"
    events:
      - "Capability grants and revocations"
      - "Delegation events"
      - "Capability usage"
      - "Validation failures"
    retention: "7 years for compliance"

# Implementation Interface
implementation:
  rust:
    dependencies:
      - "serde = { version = \"1.0\", features = [\"derive\"] }"
      - "tokio = { version = \"1.0\", features = [\"full\"] }"
      - "ring = \"0.16\""
      - "uuid = { version = \"1.0\", features = [\"v4\"] }"

    code_example: |
      use serde::{Deserialize, Serialize};
      use std::collections::HashSet;
      use uuid::Uuid;

      #[derive(Debug, Clone, Serialize, Deserialize)]
      pub struct Capability {
          pub capability_id: String,
          pub object_id: String,
          pub subject: String,
          pub issuer: String,
          pub rights: HashSet<String>,
          pub issued_at: i64,
          pub expires_at: Option<i64>,
          pub delegation_chain: Vec<String>,
          pub signature: String,
      }

      #[derive(Debug)]
      pub enum CapabilityRight {
          Read,
          Write,
          Execute,
          Delete,
          Administer,
          Delegate,
      }

      impl CapabilityRight {
          pub fn as_str(&self) -> &'static str {
              match self {
                  CapabilityRight::Read => "read",
                  CapabilityRight::Write => "write",
                  CapabilityRight::Execute => "execute",
                  CapabilityRight::Delete => "delete",
                  CapabilityRight::Administer => "administer",
                  CapabilityRight::Delegate => "delegate",
              }
          }
      }

      #[derive(Debug)]
      pub struct CapabilityValidationResult {
          pub valid: bool,
          pub reason: String,
          pub granted_rights: HashSet<String>,
      }

      pub struct CapabilityManager {
          capabilities: HashMap<String, Capability>,
          revocation_list: HashSet<String>,
      }

      impl CapabilityManager {
          pub fn new() -> Self {
              Self {
                  capabilities: HashMap::new(),
                  revocation_list: HashSet::new(),
              }
          }

          pub fn grant_capability(
              &mut self,
              object_id: &str,
              subject: &str,
              issuer: &str,
              rights: HashSet<String>,
              expires_at: Option<i64>,
          ) -> Result<String, CapabilityError> {
              let capability_id = Uuid::new_v4().to_string();
              let issued_at = chrono::Utc::now().timestamp();

              let capability = Capability {
                  capability_id: capability_id.clone(),
                  object_id: object_id.to_string(),
                  subject: subject.to_string(),
                  issuer: issuer.to_string(),
                  rights,
                  issued_at,
                  expires_at,
                  delegation_chain: vec![issuer.to_string()],
                  signature: self.sign_capability(&capability_id, object_id, subject, issuer)?,
              };

              self.capabilities.insert(capability_id.clone(), capability);
              Ok(capability_id)
          }

          pub fn validate_capability(
              &self,
              capability_id: &str,
              object_id: &str,
              required_right: &str,
          ) -> CapabilityValidationResult {
              // Check if capability exists
              let capability = match self.capabilities.get(capability_id) {
                  Some(cap) => cap,
                  None => return CapabilityValidationResult {
                      valid: false,
                      reason: "Capability not found".to_string(),
                      granted_rights: HashSet::new(),
                  },
              };

              // Check revocation
              if self.revocation_list.contains(capability_id) {
                  return CapabilityValidationResult {
                      valid: false,
                      reason: "Capability revoked".to_string(),
                      granted_rights: HashSet::new(),
                  };
              }

              // Check expiration
              if let Some(expires_at) = capability.expires_at {
                  let now = chrono::Utc::now().timestamp();
                  if now > expires_at {
                      return CapabilityValidationResult {
                          valid: false,
                          reason: "Capability expired".to_string(),
                          granted_rights: HashSet::new(),
                      };
                  }
              }

              // Check object match
              if capability.object_id != object_id {
                  return CapabilityValidationResult {
                      valid: false,
                      reason: "Object mismatch".to_string(),
                      granted_rights: HashSet::new(),
                  };
              }

              // Check signature
              if !self.verify_signature(capability) {
                  return CapabilityValidationResult {
                      valid: false,
                      reason: "Invalid signature".to_string(),
                      granted_rights: HashSet::new(),
                  };
              }

              // Check rights
              let has_right = capability.rights.contains(required_right) ||
                             capability.rights.contains("*");

              CapabilityValidationResult {
                  valid: has_right,
                  reason: if has_right {
                      "Capability valid".to_string()
                  } else {
                      "Insufficient rights".to_string()
                  },
                  granted_rights: capability.rights.clone(),
              }
          }

          pub fn revoke_capability(&mut self, capability_id: &str) -> Result<(), CapabilityError> {
              if !self.capabilities.contains_key(capability_id) {
                  return Err(CapabilityError::CapabilityNotFound);
              }

              self.revocation_list.insert(capability_id.to_string());
              Ok(())
          }

          pub fn delegate_capability(
              &mut self,
              original_capability_id: &str,
              new_subject: &str,
              attenuated_rights: Option<HashSet<String>>,
              expires_at: Option<i64>,
          ) -> Result<String, CapabilityError> {
              let original = self.capabilities.get(original_capability_id)
                  .ok_or(CapabilityError::CapabilityNotFound)?;

              // Check delegation right
              if !original.rights.contains("delegate") {
                  return Err(CapabilityError::DelegationNotAllowed);
              }

              // Apply attenuation
              let new_rights = attenuated_rights.unwrap_or_else(|| original.rights.clone());
              let attenuated_rights: HashSet<String> = new_rights.intersection(&original.rights)
                  .cloned().collect();

              // Create new capability
              let new_capability_id = Uuid::new_v4().to_string();
              let mut delegation_chain = original.delegation_chain.clone();
              delegation_chain.push(original.subject.clone());

              let new_capability = Capability {
                  capability_id: new_capability_id.clone(),
                  object_id: original.object_id.clone(),
                  subject: new_subject.to_string(),
                  issuer: original.subject.clone(),
                  rights: attenuated_rights,
                  issued_at: chrono::Utc::now().timestamp(),
                  expires_at,
                  delegation_chain,
                  signature: String::new(), // Would be signed
              };

              self.capabilities.insert(new_capability_id.clone(), new_capability);
              Ok(new_capability_id)
          }

          fn sign_capability(
              &self,
              capability_id: &str,
              object_id: &str,
              subject: &str,
              issuer: &str,
          ) -> Result<String, CapabilityError> {
              // Simplified signing - in practice would use proper crypto
              let message = format!("{}:{}:{}:{}", capability_id, object_id, subject, issuer);
              Ok(format!("signed_{}", message))
          }

          fn verify_signature(&self, capability: &Capability) -> bool {
              // Simplified verification - in practice would verify crypto signature
              capability.signature.starts_with("signed_")
          }
      }

  python:
    dependencies:
      - "pydantic==2.0.0"
      - "cryptography==41.0.0"

    code_example: |
      from pydantic import BaseModel
      from typing import List, Dict, Optional, Set
      import time
      import uuid
      from cryptography.hazmat.primitives import hashes, serialization
      from cryptography.hazmat.primitives.asymmetric import rsa, padding

      class Capability(BaseModel):
          capability_id: str
          object_id: str
          subject: str
          issuer: str
          rights: Set[str]
          issued_at: int
          expires_at: Optional[int] = None
          delegation_chain: List[str]
          signature: str

      class CapabilityValidationResult(BaseModel):
          valid: bool
          reason: str
          granted_rights: Set[str]

      class CapabilityManager:
          def __init__(self):
              self.capabilities: Dict[str, Capability] = {}
              self.revocation_list: Set[str] = set()
              # In practice, would load from secure storage
              self.private_key = rsa.generate_private_key(
                  public_exponent=65537,
                  key_size=2048
              )
              self.public_key = self.private_key.public_key()

          def grant_capability(
              self,
              object_id: str,
              subject: str,
              issuer: str,
              rights: Set[str],
              expires_at: Optional[int] = None
          ) -> str:
              """Grant a new capability"""
              capability_id = str(uuid.uuid4())
              issued_at = int(time.time())

              capability = Capability(
                  capability_id=capability_id,
                  object_id=object_id,
                  subject=subject,
                  issuer=issuer,
                  rights=rights,
                  issued_at=issued_at,
                  expires_at=expires_at,
                  delegation_chain=[issuer],
                  signature=""
              )

              # Sign the capability
              capability.signature = self._sign_capability(capability)
              self.capabilities[capability_id] = capability

              return capability_id

          def validate_capability(
              self,
              capability_id: str,
              object_id: str,
              required_right: str
          ) -> CapabilityValidationResult:
              """Validate a capability for a specific operation"""
              capability = self.capabilities.get(capability_id)
              if not capability:
                  return CapabilityValidationResult(
                      valid=False,
                      reason="Capability not found",
                      granted_rights=set()
                  )

              # Check revocation
              if capability_id in self.revocation_list:
                  return CapabilityValidationResult(
                      valid=False,
                      reason="Capability revoked",
                      granted_rights=set()
                  )

              # Check expiration
              if capability.expires_at and time.time() > capability.expires_at:
                  return CapabilityValidationResult(
                      valid=False,
                      reason="Capability expired",
                      granted_rights=set()
                  )

              # Check object match
              if capability.object_id != object_id:
                  return CapabilityValidationResult(
                      valid=False,
                      reason="Object mismatch",
                      granted_rights=set()
                  )

              # Verify signature
              if not self._verify_signature(capability):
                  return CapabilityValidationResult(
                      valid=False,
                      reason="Invalid signature",
                      granted_rights=set()
                  )

              # Check rights
              has_right = (required_right in capability.rights or
                          "*" in capability.rights)

              return CapabilityValidationResult(
                  valid=has_right,
                  reason="Valid" if has_right else "Insufficient rights",
                  granted_rights=capability.rights.copy()
              )

          def revoke_capability(self, capability_id: str) -> None:
              """Revoke a capability"""
              if capability_id in self.capabilities:
                  self.revocation_list.add(capability_id)

          def delegate_capability(
              self,
              original_capability_id: str,
              new_subject: str,
              attenuated_rights: Optional[Set[str]] = None,
              expires_at: Optional[int] = None
          ) -> str:
              """Delegate a capability with optional attenuation"""
              original = self.capabilities.get(original_capability_id)
              if not original:
                  raise CapabilityError("Original capability not found")

              # Check delegation right
              if "delegate" not in original.rights:
                  raise CapabilityError("Delegation not allowed")

              # Apply attenuation
              new_rights = attenuated_rights or original.rights.copy()
              attenuated_rights = new_rights & original.rights

              # Create new capability
              new_capability_id = str(uuid.uuid4())
              delegation_chain = original.delegation_chain + [original.subject]

              new_capability = Capability(
                  capability_id=new_capability_id,
                  object_id=original.object_id,
                  subject=new_subject,
                  issuer=original.subject,
                  rights=attenuated_rights,
                  issued_at=int(time.time()),
                  expires_at=expires_at,
                  delegation_chain=delegation_chain,
                  signature=""
              )

              # Sign new capability
              new_capability.signature = self._sign_capability(new_capability)
              self.capabilities[new_capability_id] = new_capability

              return new_capability_id

          def _sign_capability(self, capability: Capability) -> str:
              """Sign capability data"""
              data = f"{capability.capability_id}:{capability.object_id}:{capability.subject}:{capability.issuer}"
              signature = self.private_key.sign(
                  data.encode(),
                  padding.PSS(
                      mgf=padding.MGF1(hashes.SHA256()),
                      salt_length=padding.PSS.MAX_LENGTH
                  ),
                  hashes.SHA256()
              )
              return signature.hex()

          def _verify_signature(self, capability: Capability) -> bool:
              """Verify capability signature"""
              try:
                  data = f"{capability.capability_id}:{capability.object_id}:{capability.subject}:{capability.issuer}"
                  signature_bytes = bytes.fromhex(capability.signature)
                  self.public_key.verify(
                      signature_bytes,
                      data.encode(),
                      padding.PSS(
                          mgf=padding.MGF1(hashes.SHA256()),
                          salt_length=padding.PSS.MAX_LENGTH
                      ),
                      hashes.SHA256()
                  )
                  return True
              except:
                  return False

# Testing Requirements
testing:
  unit_tests:
    - "Capability granting and validation"
    - "Rights checking logic"
    - "Delegation and attenuation"
    - "Revocation handling"

  integration_tests:
    - "Full capability lifecycle"
    - "Delegation chain validation"
    - "Cryptographic signature verification"
    - "Storage and retrieval"

  security_tests:
    - "Signature verification"
    - "Delegation security"
    - "Attenuation enforcement"
    - "Revocation cascade"

  performance_tests:
    - "Capability validation latency"
    - "Delegation operation performance"
    - "Large capability set handling"

# Dependencies
dependencies:
  upstream:
    - "role_based_access.yml: Provides base permissions"
    - "session_binding.yml: Provides session context"
  downstream:
    - "privacy_band_enforcement.yml: Extends with privacy bands"
    - "authorization_cache.yml: Caches capability decisions"

# Success Criteria
success_criteria:
  functional:
    - "Capabilities properly granted and validated"
    - "Delegation and attenuation work correctly"
    - "Rights enforcement accurate"
    - "Revocation cascade functions"

  performance:
    - "Capability validation <2ms"
    - "Delegation operations <5ms"
    - "Scalable to 1M capabilities"

  security:
    - "Cryptographic signatures verified"
    - "Delegation chains validated"
    - "Attenuation enforced"
    - "Audit trail complete"

  reliability:
    - "Capability state consistency"
    - "Revocation handling robust"
    - "Failure recovery graceful"