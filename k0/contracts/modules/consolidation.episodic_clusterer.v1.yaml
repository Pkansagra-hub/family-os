# P03 Module Contract: Episodic Clusterer
# Phase: R2 - Episodic Clustering
# Dossier: §D.3.1 stage_20_episodic_cluster, §4.2, Appendix C.3
# Updated: 2026-03-07 (Epic 2.3 Contract Reconciliation)

module_id: consolidation.episodic_clusterer
version: v1

# R2 receives events via P03BatchEnvelope (sequential runner), not bus events.
# R1 importance scoring enriches events with importance_score before R2 runs.
# p03.hebbian.updated.v1 is not consumed by R2 (Hebbian output is co-occurrence
# data used by R1, not by R2 clustering).
input_event_types: []

output_event_types:
  - p03.clusters.formed.v1

latency_budget_ms: 200

side_effects:
  - read:st_vec             # Episode centroid embeddings for episode matching
  - read:st_epi             # Existing episodes for episode matching (raw SQL join)
  - read:st_learned_weights  # Adaptive clustering_eps and clustering_min_samples
  - write:st_learned_weights # Adjusted eps/min_samples after quality evaluation

idempotent: true

fabric_capabilities:
  - cluster_episodes

# ---------------------------------------------------------------------------
# Failure Modes (reconciled with r2_episodic_integrator.py after Epic 2.1)
# ---------------------------------------------------------------------------
failure_modes:
  - code: INSUFFICIENT_EVENTS
    policy: phase_skip
    description: |
      Batch has fewer events than min_batch_size or no events with embeddings.
      R2 returns P03PhaseResult.skip() — no episodes formed, no side effects.
  - code: EMBEDDING_FILTER
    policy: exclude_event
    description: |
      Individual events without embedding_768 are excluded from clustering.
      Remaining events proceed normally. Not a phase-level failure.
  - code: NO_VALID_CLUSTERS
    policy: phase_skip
    description: |
      HDBSCAN assigns all events to noise (label=-1). No episodes formed.
      Quality tracking still runs; adaptive eps may increase for next cycle.
  - code: CLUSTER_TIMEOUT
    policy: phase_skip
    description: |
      Clustering exceeds time budget. Phase returns skip status.
      No DBSCAN fallback exists — the only clustering path is HDBSCAN.

# ---------------------------------------------------------------------------
# Quality Metrics (reconciled with cluster_quality.py after Epic 2.2)
# ---------------------------------------------------------------------------
#
# Quality channels:
#   | Channel          | Weight | Status  | Source                    |
#   |------------------|--------|---------|---------------------------|
#   | Silhouette Score | 0.40   | LIVE    | sklearn on precomputed DM |
#   | Grounding Rate   | 0.30   | DORMANT | No K1 feedback loop yet   |
#   | Correction Rate  | 0.20   | DORMANT | No user correction yet    |
#   | Singleton Rate   | 0.10   | LIVE    | Noise cluster count       |
#
# Composite formula (live channels only, renormalized):
#   When silhouette valid: 0.80 * sil_norm + 0.20 * (1-singleton)
#   When silhouette invalid: 1.0 * (1-singleton)
#
# Silhouette: Real sklearn.metrics.silhouette_score on precomputed distance
#   matrix (metric="precomputed"). Mean on representative corpus = 0.27.
#   Target = 0.30 (p75 of observed distribution per POC-02/03 research).
#   Invalid when fewer than 2 clusters or all noise.
#
# Noise: Target < 10% (contract invariant). Research achieves 0.15%.

# ---------------------------------------------------------------------------
# Responsibility Boundaries (Epic 2.3.5)
# ---------------------------------------------------------------------------
#
# Intrinsic to this module (clustering algorithm):
#   - Composite distance matrix computation (semantic + temporal)
#   - HDBSCAN clustering on precomputed distance matrix
#   - Soft noise rescue (outlier_score < threshold)
#   - Distance matrix output for downstream quality computation
#
# Delegated (owned by pipeline orchestration or adjacent modules):
#   - Event filtering and skip logic → R2EpisodicIntegrator (pipeline)
#   - Episode candidate assembly → R2EpisodicIntegrator (pipeline)
#   - Episode matching against st_epi → R2EpisodicIntegrator (pipeline)
#   - Real silhouette computation → ClusterQualityTracker (quality module)
#   - Composite quality scoring → ClusterQualityTracker (quality module)
#   - Adaptive eps/min_samples learning → EpsAdjuster, MinSamplesAdjuster
#   - Centroid calculation → CentroidCalculator
#   - Observability and logging → R2EpisodicIntegrator (pipeline)
#
# Extraction candidates for M3 (Epic 3.5 Phase Wrapper Decomposition):
#   - Episode matching (raw SQL on st_epi + st_vec) → separate phase or module
#   - Quality tracking → dedicated quality module contract
#   - Adaptive tuning → dedicated adaptive module contract

description: |
  Episodic Clusterer Module (R2 Phase)

  Groups related events into coherent episodes using HDBSCAN on precomputed
  composite distance matrices:
  - Semantic distance: Cosine distance on 768-dim UltraBERT embeddings
  - Temporal distance: Proximity-based distance with configurable weight
  - HDBSCAN metric: precomputed (operates on the composite distance matrix)
  - Noise rescue: Low-outlier-score noise points rescued into nearest cluster

  Algorithm: HDBSCAN (Hierarchical Density-Based Spatial Clustering)
  - min_cluster_size: 2 (minimum events per cluster)
  - min_samples: 1 (density smoothing, inclusive)
  - cluster_selection_method: leaf (preserves small clusters)
  - noise_rescue_threshold: 0.5 (rescue noise with outlier_score < this)
  - cluster_selection_epsilon: adaptive via st_learned_weights (default 0.0)

  Adaptive Parameters (via st_learned_weights):
  - clustering_eps: cluster_selection_epsilon, adjusted per-space based on
    silhouette score feedback. Legacy key fallback: dbscan_eps.
  - clustering_min_samples: min_samples, adjusted per-space based on
    singleton rate. Legacy key fallback: dbscan_min_samples.

  Output:
  - envelope.clusters: Array of cluster assignments
  - envelope.clusters[*].cluster_id: ULID cluster identifier
  - envelope.clusters[*].event_ids: Array of event IDs in cluster
  - envelope.clusters[*].centroid_embedding: 768-dim centroid vector
  - envelope.noise_events: Array of unclustered event IDs
  - distance_matrix: Precomputed distance matrix (carried in HDBSCANClusteringResult)
