module_id: embedding.faiss_indexer
version: v1

input_event_types:
  - cognitive.vector.stored.v1

output_event_types:
  - cognitive.vector.indexed.v1

latency_budget_ms: 50

side_effects:
  - write:faiss_index
  - write:st_vec  # Updates status to INDEXED

idempotent: true

failure_modes:
  - code: FAISS_ADD_FAILED
    policy: retry
    max_retries: 3
  - code: VECTOR_NOT_FOUND
    policy: skip
    max_retries: 0
  - code: DIMENSION_MISMATCH
    policy: skip
    max_retries: 0
  - code: INDEX_CORRUPTED
    policy: rebuild_index
    max_retries: 1

description: |
  M24: FAISS Index Management Module

  Adds 768-dimensional embeddings to FAISS similarity search index
  for fast nearest-neighbor retrieval.

  P08 v2 Use Case: FAISS Indexing
  - Triggered by: cognitive.vector.stored.v1 event from P02 M23
  - Reads embedding from st_vec table
  - Adds to FAISS index (IVF + PQ compression)
  - Updates st_vec.status = INDEXED
  - Emits cognitive.vector.indexed.v1 event

  Performance Target: <50ms P95 per vector (single add)
  Batch Performance: ~200ms for 10 vectors, ~1s for 100 vectors

  FAISS Index Configuration:
  - Index Type: IVF256,PQ64 (Inverted File with Product Quantization)
  - Vector Dimension: 768 (UltraBERT)
  - Quantization: 64 bytes per vector (8:1 compression from 3KB)
  - Clusters: 256 inverted lists
  - Search Parameters: nprobe=16 (recall ~0.95)

  Input (from cognitive.vector.stored.v1 event):
  - embedding_id: str (UUID)
  - event_id: str
  - tenant_id: str
  - space_id: str
  - model_id: str
  - vector_dim: int (768)
  - stored_at: int (Unix timestamp)

  Operations:
  1. Query st_vec for vector blob: SELECT vector FROM st_vec WHERE embedding_id = ?
  2. Validate dimension: len(vector) == 768
  3. Add to FAISS index: index.add(vector)
  4. Update st_vec: UPDATE st_vec SET status='INDEXED', updated_at=? WHERE embedding_id=?
  5. Emit event: cognitive.vector.indexed.v1

  Output:
  - indexed: bool (true if FAISS add succeeded)
  - embedding_id: str
  - index_position: int (FAISS internal ID)
  - indexed_at: int (Unix timestamp)

  Failure Handling:
  - VECTOR_NOT_FOUND: Embedding deleted before indexing (skip)
  - DIMENSION_MISMATCH: Vector != 768 dim (skip, log error)
  - FAISS_ADD_FAILED: FAISS internal error (retry 3x)
  - INDEX_CORRUPTED: Rebuild entire index from st_vec WHERE status='READY'

  Index Persistence:
  - Saved to disk: k0/storage/faiss_index_768d.bin
  - Auto-save frequency: Every 100 adds or every 5 minutes
  - Load on startup: Read from disk or rebuild from st_vec

  Related:
  - ADR-K003: P08 repurposed for FAISS indexing (not primary generation)
  - M23 (builders.embedding_write): Emits cognitive.vector.stored.v1
  - P03 CA1 Bridge: Uses FAISS for semantic similarity search

config_schema:
  type: object
  properties:
    index_type:
      type: string
      default: "IVF256,PQ64"
      description: FAISS index configuration string
    nprobe:
      type: integer
      default: 16
      description: Number of clusters to search (recall vs speed tradeoff)
    batch_size:
      type: integer
      default: 100
      description: Batch multiple vectors before adding to index
    auto_save_frequency:
      type: integer
      default: 100
      description: Save index to disk every N additions
    index_path:
      type: string
      default: "k0/storage/faiss_index_768d.bin"
      description: File path for index persistence

input_schema:
  type: object
  required:
    - embedding_id
    - event_id
    - tenant_id
    - space_id
    - model_id
    - vector_dim
  properties:
    embedding_id:
      type: string
      format: uuid
    event_id:
      type: string
    tenant_id:
      type: string
    space_id:
      type: string
    model_id:
      type: string
      enum: ["ultrabert_v2.1.0"]
    vector_dim:
      type: integer
      enum: [768]
    stored_at:
      type: integer
      description: Unix timestamp from st_vec insert

output_schema:
  type: object
  required:
    - indexed
    - embedding_id
  properties:
    indexed:
      type: boolean
      description: True if FAISS add succeeded
    embedding_id:
      type: string
      format: uuid
    index_position:
      type: integer
      description: FAISS internal vector ID
    indexed_at:
      type: integer
      description: Unix timestamp when indexed

dependencies:
  syscalls:
    - faiss.add
    - faiss.save
    - st_vec.update
    - events.emit
  libraries:
    - faiss-cpu>=1.7.4  # or faiss-gpu for GPU acceleration

performance:
  p50_latency_ms: 20
  p95_latency_ms: 50
  p99_latency_ms: 100
  batch_throughput_vectors_per_sec: 200
