# =============================================================================
# M16: Hippocampus Events Writer Module Contract
# =============================================================================
# Module: core.hipp_events_writer
# Version: v1 (internal revision 1.2)
# Epic: 4.5.1
# Status: Active
# Created: 2025-11-17
# Updated: 2025-12-13 (ADR-K003 v1.2 - merged M23 into M16)
#
# Purpose:
#   Write episodic memory events to st_hipp_events after enrichment pipeline.
#   Performs 3-table atomic transaction (st_hipp_events + st_vec + st_pipeline_processed).
#
# Transaction Scope (ADR-K003 v1.2 Update):
#   - st_hipp_events (core memory event) - FIRST (parent)
#   - st_vec (embedding vector) - SECOND (child with FK to st_hipp_events)
#   - st_pipeline_processed (pipeline completion tracking) - LAST
#
#   NOTE: M23 (builders.embedding_write) was MERGED into M16 to ensure
#   atomic transaction and correct FK ordering. Stage 61 removed from P02 DAG.
#
# Performance:
#   - Latency Budget: 30ms P95 (3-table INSERT with indexes)
#   - Throughput: 35-45 ops/sec single-threaded
#   - Memory: <6MB per operation (768-dim embedding = 3KB)
#
# Related:
#   - ADR: docs/architecture/decisions-K0/modules/k010.1-hipp-events-writer.md
#   - ADR: docs/architecture/decisions-K0/k003-embedding-architecture.md
#   - Schema: docs/pipelines/P02_data_schema.md (lines 96-185, 511-569)
#   - P08: Embedding management pipeline (FAISS indexing, backfill)
# =============================================================================

module_id: core.hipp_events_writer
version: v1

input_event_types:
  - p02.enrichment.complete.v1
  - cognitive.memory.write.committed.v1

output_event_types:
  - p02.hipp_events.written.v1
  - cognitive.vector.stored.v1  # NEW: emitted when embedding written to st_vec

latency_budget_ms: 30

# UPDATED (ADR-K003 v1.2): Added st_vec (merged from M23)
side_effects:
  - write:st_hipp_events
  - write:st_vec
  - write:st_pipeline_processed

idempotent: true

failure_modes:
  - code: MISSING_EVENT_ID
    policy: drop
  - code: MISSING_WAL_POS
    policy: drop
  - code: MISSING_EMBEDDING_ID
    policy: drop
  - code: DUPLICATE_EVENT_ID
    policy: drop
  - code: TRANSACTION_TIMEOUT
    policy: retry
  - code: INTEGRITY_VIOLATION
    policy: dlq
  - code: EMBEDDING_WRITE_FAILED  # NEW: non-fatal, sets PENDING status
    policy: continue

description: |
  Hippocampus Events Writer (M16) - v1.2 (ADR-K003 Update)

  Writes enriched episodic memory events to st_hipp_events after P02 enrichment
  pipeline completes. Performs 3-table atomic transaction:

  1. st_hipp_events: Core memory event with enrichments (text, embeddings, affect, etc.)
  2. st_vec: Embedding vector (768-dim) with FK to st_hipp_events.event_id
  3. st_pipeline_processed: Pipeline completion tracking for idempotency

  Transaction Boundary (ADR-K003 v1.2 Update):
  - MERGED M23 (builders.embedding_write) into M16
  - Ensures correct FK ordering: st_hipp_events FIRST, st_vec SECOND
  - Stage 61 removed from P02 DAG
  - If embedding missing: sets embedding_status=PENDING, P08 backfill handles

  Idempotency:
  - Uses event_id as PRIMARY KEY with INSERT OR IGNORE
  - Checks st_pipeline_processed before writing (skip if already processed)
  - Duplicate event_id triggers skip (no error, returns status=SKIPPED_DUPLICATE)

  Performance:
  - Target: <30ms P95 (3-table INSERT with B-tree indexes)
  - Uses prepared statements and connection pooling
  - Batching NOT supported (single event per call for transactional atomicity)

  Security:
  - Requires capability: st_hipp_events.write
  - Requires capability: st_vec.write
  - Requires capability: st_pipeline_processed.write
  - Enforces tenant_id and space_id isolation
  - Validates privacy_band (GREEN/AMBER/RED)

  Related Modules:
  - M02 (semantic.project): Provides embedding_id
  - M11 (affect.analyze): Provides valence/arousal
  - M22 (extract_from_cache): Provides 768-dim embedding vector
  - M17 (core.event_emitter): Emits completion events to bus
  - P08: Embedding management pipeline (FAISS indexing, backfill for PENDING)
