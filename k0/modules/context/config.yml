# Context Module Configuration | Version: 0.1.0
module:
  version: "0.1.0"
  enabled: true

temporal:
  timezone_source: "tenant_config"  # tenant_config, envelope, utc
  backdating_threshold_hours: 24
  buckets:
    morning: [6, 12]
    afternoon: [12, 18]
    evening: [18, 22]
    night: [22, 6]
  target_p95_ms: 2

device:
  cache_enabled: true
  cache_ttl_seconds: 600
  target_p95_ms: 3

ingress:
  channels:
    - "k1.conversation"
    - "k1.command"
    - "external.import"
  target_p95_ms: 1

retention:
  cache_enabled: true
  cache_ttl_seconds: 3600
  target_p95_ms: 3

geo:
  precision_levels:
    GREEN: "full"
    AMBER: "geohash6"
    RED: "geohash4"
  target_p95_ms: 5

features:
  multimodal_context: false  # Future: EXIF, audio metadata
  behavioral_context: false   # Future: typing speed, patterns
  environmental_context: false  # Future: weather, ambient noise

observability:
  emit_metrics: true
