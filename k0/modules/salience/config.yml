# Salience Module Configuration | Version: 0.1.0
module:
  version: "0.1.0"
  enabled: true

write_path:  # Used by P02
  formula:
    social_weight: 0.50
    affect_weight: 0.40
    recency_weight: 0.10

  thresholds:
    high: 0.7
    medium: 0.4
    low: 0.0

social_importance:
  SPOUSE: 1.0
  PARENT: 0.9
  CHILD: 0.9
  SIBLING: 0.7
  CARETAKER: 0.8
  FRIEND: 0.5
  ACQUAINTANCE: 0.3

performance:
  target_p95_ms: 5
  target_p99_ms: 10
  max_memory_mb: 10

features:
  read_path_salience: false   # Future: query-time reranking
  learned_attention: false    # Future: neural attention models
  novelty_boost: false        # P03 feature

observability:
  emit_metrics: true
  emit_traces: true
