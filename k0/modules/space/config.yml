# Space Module Configuration | Version: 0.1.0
module:
  version: "0.1.0"
  enabled: true

acl_resolution:
  mode: "intersection"  # intersection, union, policy_only
  cache_enabled: true
  cache_ttl_seconds: 300

ownership:
  derive_from_actor: true
  allow_co_owners: true
  max_co_owners: 10

performance:
  target_p95_ms: 3
  target_p99_ms: 5
  max_memory_mb: 5

features:
  space_hierarchy: false      # Future: workspace → household → family
  temporal_visibility: false  # Future: time-based ACLs
  proximity_acls: false       # Future: location-based sharing

observability:
  emit_metrics: true
  emit_traces: true
