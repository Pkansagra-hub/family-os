# Builders Module Configuration | Version: 0.1.0
module:
  version: "0.1.0"
  enabled: true

hipp_events_builder:
  schema_version: "0.1.0"
  null_handling: "explicit"  # explicit, skip, default
  json_serialization: "compact"  # compact, pretty
  target_p95_ms: 5

embedding_queue_writer:
  default_priority: "NORMAL"  # NORMAL, HIGH, LOW
  default_max_attempts: 5
  vector_kind: "memory.body.text"
  model_id: "embed-mini-001"
  target_p95_ms: 2

performance:
  max_memory_mb: 20

features:
  batch_optimization: false    # Future: vectorized operations
  streaming_assembly: false    # Future: reduce memory footprint
  schema_evolution: false      # Future: handle missing/new columns

observability:
  emit_metrics: true
