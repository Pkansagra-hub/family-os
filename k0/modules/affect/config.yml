# Affect Module Configuration
# Version: 0.1.0
# Tunable parameters for emotional classification

module:
  version: "0.1.0"
  enabled: true
  log_level: "INFO"

# Tier-0 Fast Affect Classification
tier0:
  enabled: true
  model_path: "${AFFECT_MODEL_PATH}"  # env var
  fallback_lexicon: true              # Use lexicon if model unavailable

  valence:
    range: [-1.0, 1.0]                # Negative to positive
    neutral_threshold: 0.1            # |valence| < 0.1 = neutral

  arousal:
    range: [0.0, 1.0]                 # Calm to excited
    high_threshold: 0.7

  performance:
    target_p95_ms: 70
    target_p99_ms: 100
    max_memory_mb: 20
    batch_size: 16

# Emotion Tags
emotions:
  enabled: true
  tags:
    - joy
    - contentment
    - sadness
    - anger
    - fear
    - surprise
    - disgust
    - anticipation

  multi_label: true                   # Allow multiple emotions
  confidence_threshold: 0.3

# Affect Band Classification
bands:
  enabled: true
  rules:
    GREEN:                            # Low emotional intensity
      valence_range: [-0.3, 0.3]
      arousal_range: [0.0, 0.4]
    AMBER:                            # Moderate emotional content
      valence_range: [-0.7, 0.7]
      arousal_range: [0.0, 0.7]
    RED:                              # High emotional intensity
      valence_range: [-1.0, 1.0]
      arousal_range: [0.7, 1.0]

# Feature Flags
features:
  multimodal_affect: false            # Image/audio/video affect
  personalized_models: false          # Per-user affect baselines
  learning_loop: false                # Feedback-based improvement
  cultural_adaptation: false          # Cultural affect norms

# Model Management
models:
  default_model: "distilbert-affect-v1"
  quantization: "int8"                # int8, fp16, fp32
  device: "cpu"                       # cpu, cuda, mps
  auto_update: false

# Observability
observability:
  emit_metrics: true
  emit_traces: true
  log_classifications: false          # High volume
  performance_tracking: true
