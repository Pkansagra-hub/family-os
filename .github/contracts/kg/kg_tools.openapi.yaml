openapi: 3.1.0
info:
  title: Knowledge Graph v2 MCP Tools
  version: 2.0.0
  description: |
    15 AI-focused MCP tools for semantic repository graph queries.
    Enables AI agents to understand repository architecture, dependencies, and implementation context.
  contact:
    name: K1 Intelligence Team
    url: https://familyos.dev
servers:
  - url: mcp://kg_v2
    description: MCP server via stdio

components:
  schemas:
    Node:
      $ref: './node.schema.json'

    Edge:
      $ref: './edge.schema.json'

    GraphSummary:
      type: object
      properties:
        nodes_by_type:
          type: object
          additionalProperties:
            type: integer
          description: Node counts by type (adr, module, contract, file)
        edges_by_relation:
          type: object
          additionalProperties:
            type: integer
          description: Edge counts by relation (implements, depends_on, references, tests)
        total_nodes:
          type: integer
        total_edges:
          type: integer

    DependencyImpact:
      type: object
      properties:
        module:
          type: string
          description: Module being analyzed
        direct_dependents:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              evidence:
                type: string
        transitive_dependents:
          type: array
          items:
            type: string
        affected_tests:
          type: array
          items:
            type: string
        total_impact:
          type: integer

    ImplementationChain:
      type: object
      properties:
        adr:
          $ref: '#/components/schemas/Node'
        implementations:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        tests:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        related_adrs:
          type: array
          items:
            $ref: '#/components/schemas/Node'

    FeatureContext:
      type: object
      properties:
        query:
          type: string
        related_adrs:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        similar_code:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        suggestion:
          type: string

paths:
  /kg_search:
    post:
      operationId: kg_search
      summary: Full-text search across all nodes
      description: Search ADRs, modules, contracts, and files using FTS5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Search query
                  example: "agent scheduling"
                limit:
                  type: integer
                  default: 20
                  minimum: 1
                  maximum: 100
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'

  /kg_neighbors:
    post:
      operationId: kg_neighbors
      summary: Get adjacent nodes
      description: Find nodes connected to a given node by edges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id:
                  type: string
                  description: Node to query
                  example: "adr_0051"
                direction:
                  type: string
                  enum: [outgoing, incoming, both]
                  default: both
                  description: Edge direction
                relation:
                  type: string
                  enum: [implements, depends_on, references, tests]
                  description: Filter by relation type
      responses:
        '200':
          description: Adjacent nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  allOf:
                    - $ref: '#/components/schemas/Node'
                    - type: object
                      properties:
                        relation:
                          type: string
                        evidence:
                          type: string

  /kg_add_node:
    post:
      operationId: kg_add_node
      summary: Create or update a node
      description: Manually add a node to the graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '200':
          description: Node created/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  /kg_add_edge:
    post:
      operationId: kg_add_edge
      summary: Create an edge between nodes
      description: Manually link two nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Edge'
      responses:
        '200':
          description: Edge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edge'

  /kg_find_by_type:
    post:
      operationId: kg_find_by_type
      summary: Find all nodes of a type
      description: Get all ADRs, modules, contracts, or files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_type]
              properties:
                node_type:
                  type: string
                  enum: [adr, module, contract, file]
                  example: "adr"
                limit:
                  type: integer
                  default: 50
                  minimum: 1
                  maximum: 500
      responses:
        '200':
          description: Nodes of specified type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'

  /kg_graph_summary:
    post:
      operationId: kg_graph_summary
      summary: High-level graph statistics
      description: Get counts and distribution of nodes/edges
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Graph statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSummary'

  /kg_paths:
    post:
      operationId: kg_paths
      summary: Find paths between two nodes
      description: BFS to find connection paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [src, dst]
              properties:
                src:
                  type: string
                  example: "adr_0051"
                dst:
                  type: string
                  example: "k1.l2_orchestration.agent_scheduler"
                max_hops:
                  type: integer
                  default: 6
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: List of paths (each path is array of node IDs)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string

  /kg_get_module_deps:
    post:
      operationId: kg_get_module_deps
      summary: Get module dependencies
      description: Find all dependencies (transitive) of a module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module_id]
              properties:
                module_id:
                  type: string
                  example: "k0.kernel"
                depth:
                  type: integer
                  description: Max depth (null = unlimited)
                  nullable: true
      responses:
        '200':
          description: List of dependency module IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /kg_dependency_impact:
    post:
      operationId: kg_dependency_impact
      summary: Dependency impact analysis
      description: What breaks if this module changes?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module_id]
              properties:
                module_id:
                  type: string
                  example: "k0.bus"
      responses:
        '200':
          description: Impact analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyImpact'

  /kg_find_circular_deps:
    post:
      operationId: kg_find_circular_deps
      summary: Detect circular dependencies
      description: Find dependency cycles in the codebase
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: List of circular dependency chains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
                  description: Circular dependency path

  /kg_implementation_chain:
    post:
      operationId: kg_implementation_chain
      summary: ADR implementation chain
      description: Get complete context for an ADR (code, contracts, tests, related ADRs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adr_id]
              properties:
                adr_id:
                  type: string
                  example: "adr_0051"
      responses:
        '200':
          description: Implementation chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementationChain'

  /kg_get_feature_context:
    post:
      operationId: kg_get_feature_context
      summary: Get context for implementing a feature
      description: Find related ADRs, similar code, contracts, patterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature_name]
              properties:
                feature_name:
                  type: string
                  example: "health monitoring"
      responses:
        '200':
          description: Feature implementation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureContext'

  /kg_ask:
    post:
      operationId: kg_ask
      summary: Natural language query router
      description: |
        Natural language interface to KG tools. Routes queries to appropriate tools.

        Examples:
        - "What implements ADR-0051?" → kg_implementation_chain
        - "What breaks if I change k0.bus?" → kg_dependency_impact
        - "Find circular dependencies" → kg_find_circular_deps
        - "Give me context for health monitoring" → kg_get_feature_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "What implements ADR-0051?"
      responses:
        '200':
          description: Query result (schema varies based on detected intent)
          content:
            application/json:
              schema:
                type: object

  /kg_diagnostics:
    post:
      operationId: kg_diagnostics
      summary: Architecture diagnostics
      description: Find issues like orphaned code, missing tests, circular deps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnostic_type]
              properties:
                diagnostic_type:
                  type: string
                  enum: [orphaned_code, missing_tests, circular_deps]
                  example: "orphaned_code"
      responses:
        '200':
          description: Diagnostic results
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Node'
                    description: For orphaned_code, missing_tests
                  - type: array
                    items:
                      type: array
                      items:
                        type: string
                    description: For circular_deps

tags:
  - name: Core
    description: Core graph operations (search, neighbors, add)
  - name: Queries
    description: Graph queries (find_by_type, summary, paths)
  - name: Dependencies
    description: Dependency analysis (deps, impact, circular)
  - name: AI Context
    description: AI-focused context builders (implementation_chain, feature_context, ask)
  - name: Diagnostics
    description: Architecture diagnostics and health checks
