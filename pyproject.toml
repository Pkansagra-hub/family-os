[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-k1-bridge"
version = "0.1.0"
description = "K1 Bridge - HTTP/2 Communication Layer for FamilyOS"
authors = [
    {name = "FamilyOS Team", email = "dev@familyos.ai"}
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "aiohttp>=3.9.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=k1 --cov-report=term-missing"

# Disable OpenTelemetry export during tests
env = [
    "OTEL_TRACES_EXPORTER=none",
    "OTEL_METRICS_EXPORTER=none",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

