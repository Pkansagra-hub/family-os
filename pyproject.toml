[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-k1-bridge"
version = "0.1.0"
description = "K1 Bridge - HTTP/2 Communication Layer for FamilyOS"
authors = [
    {name = "FamilyOS Team", email = "dev@familyos.ai"}
]
requires-python = ">=3.10"

[tool.setuptools]
packages = ["k0", "k1", "services"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "aiohttp>=3.9.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "rich>=13.0.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.0",
    "pytest-emoji>=0.2.0",
    "pytest-xdist>=3.0.0",
    "pytest-watch>=4.2.0",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --color=yes --tb=short --disable-warnings --strict-markers"
# Use --cov=k0 or --cov=k1 to enable coverage; disable by default for clean output
# Example: pytest --cov=k0 tests/k0/
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "performance: performance tests",
    "slow: slow tests",
]

[tool.coverage.run]
# Only measure coverage for main packages, not tests
branch = true
parallel = true
source = ["k0", "k1"]

[tool.coverage.report]
skip_covered = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
