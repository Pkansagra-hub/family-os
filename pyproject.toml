[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-k1-bridge"
version = "0.1.0"
description = "K1 Bridge - HTTP/2 Communication Layer for FamilyOS"
authors = [
    {name = "FamilyOS Team", email = "dev@familyos.ai"}
]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
]

[tool.setuptools]
packages = ["k0", "k1", "services"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-postgresql>=5.0.0",
    "aiohttp>=3.9.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "rich>=13.0.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.0",
    "pytest-emoji>=0.2.0",
    "pytest-xdist>=3.0.0",
    "pytest-watch>=4.2.0",
    "prometheus-client>=0.18.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]
scheduler = [
    "croniter>=2.0.0",
]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --color=yes --tb=short --disable-warnings --strict-markers"
# Standard directories to skip
norecursedirs = [
    ".git",
    "__pycache__",
    "archived",
]
# Use --cov=k0 or --cov=k1 to enable coverage; disable by default for clean output
# Example: pytest --cov=k0 tests/k0/
# Ignore archived tests and deprecated SQLite-based tests (PostgreSQL migration)
collect_ignore_glob = [
    "**/archived/**",
    "tests/k0/automation/test_migrate.py",
    "tests/k0/test_accuracy_benchmark.py",
    "tests/k0/test_golden_dataset.py",
    "tests/scripts/test_k0_bootstrap_harness.py",
    "tests/performance/test_pem_latency.py",
    "tests/integration/test_v1_privacy_performance_pipeline.py",
    "tests/k0/integration/test_cli_integration.py",
    "tests/k0/integration/test_hmac_idempotency.py",
    "tests/k0/integration/test_scheduler_fairness.py",
    "tests/k0/integration/test_v1_performance.py",
    # PostgreSQL migration - SQLite-based tests to be migrated
    "tests/integration/p02/test_p02_pipeline_e2e.py",
    "tests/integration/test_p02_inline_embedding.py",
    "tests/k0/integration/test_crdt_merge_logging.py",
    "tests/k0/integration/test_outbox_exponential_backoff.py",
    "tests/k0/integration/test_retention_policies.py",
    "tests/k0/integration/test_schema_cache_thread_safety.py",
    "tests/k0/modules/builders/test_embedding_queue_write.py",
    "tests/k0/modules/builders/test_hipp_events_row.py",
    "tests/k0/modules/context/test_ingress_classify.py",
    "tests/k0/modules/context/test_spatial_minimal.py",
    "tests/k0/modules/core/test_event_emitter.py",
    "tests/k0/modules/embedding/test_extract_from_cache.py",
    "tests/k0/modules/embedding/test_faiss_indexer.py",
    "tests/k0/modules/hippocampus/test_semantic_project_full.py",
    "tests/k0/policy/test_retention_enforcer.py",
    "tests/k0/receipts/test_receipt_audit_fields.py",
    "tests/k0/runtime/test_p02_parallel_execution.py",
    "tests/k0/runtime/test_schemas_trigger.py",
]
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "performance: performance tests",
    "slow: slow tests",
]

[tool.coverage.run]
# Only measure coverage for main packages, not tests
branch = true
parallel = true
source = ["k0", "k1"]

[tool.coverage.report]
skip_covered = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
