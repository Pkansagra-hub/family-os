# Common propagation scenarios
scenarios:
  - scenario: "Add new module to layer2_orchestration"
    description: "When adding a new module to layer2_orchestration"
    checklist:
      adrs_to_review:
        - ADR-0001: K0/K1 Kernel Split Architecture
        - ADR-0001a: 0001A K0 Bridge Communication Protocol
        - ADR-0001b: Model Hub Architecture & LLM Integration
      contracts_to_update:
        - "k1/contracts/flatbuffers/layer2_orchestration/*.fbs"
        - "k1/contracts/api/*.yaml"
      tests_to_add:
        - "tests/k1/l2_orchestration/test_new_module.py"
      diagrams_to_update:
        - "architecture_diagrams/k1/k1_complete_with_flows.mmd"

  - scenario: "Modify existing module in layer2_orchestration"
    description: "When changing behavior of existing layer2_orchestration module"
    checklist:
      adrs_to_review:
        - ADR-0001: K0/K1 Kernel Split Architecture
        - ADR-0001a: 0001A K0 Bridge Communication Protocol
      contracts_to_validate:
        - "Ensure backward compatibility with existing schemas"
      tests_to_update:
        - "Update integration tests for modified module"
        - "Verify performance budgets still met"

  - scenario: "Remove module from layer2_orchestration"
    description: "When deprecating/removing a layer2_orchestration module"
    checklist:
      adrs_to_update:
        - "Update ADR-0004 module count"
        - "Document deprecation timeline"
      contracts_to_deprecate:
        - "Mark schemas as deprecated (90-day policy)"
      migration_guide:
        - "Create migration guide for users"
      tests_to_remove:
        - "Archive tests after deprecation period"

# Layer dependencies
upstream_dependencies:
  - layer1_input  # Receives input from Layer 1

downstream_dependencies:
  - layer1_input  # Layer 1 sends events to Layer 2

# Cross-cutting concerns
cross_cutting:
  - "All layer changes must update contracts in 07-contracts-serialization/"
  - "All layer changes must follow Actor Model patterns (ADR-0002)"
  - "All layer changes must update performance budgets (ADR-0024)"
  - "All layer changes must add observability (ADR-0029, ADR-0030)"
