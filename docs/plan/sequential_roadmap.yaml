  - id: L2_KERNEL
    name: "Phase 2: Layer 2 Core Kernel (GATE VALIDATION)"
    description: |
      **CRITICAL**: Build Agent Fabric + Orchestrator + Planner + Protocol Monitor.
      These are co-designed and form K1's heart.
      Per DEPENDENCY_MAP: "ADR-0006/0007 orchestrator + ADR-0003 MPST validator"

      **GATE REQUIREMENT**: All 5 issues MUST PASS contract review.
    duration_weeks: 4
    adr_refs: ["ADR-0005", "ADR-0006", "ADR-0007", "ADR-0003"]
    contract_refs: ["contracts/agent_lifecycle/lifecycle_fsm.yml"]
    epics:
      - id: "L2-E1"
        name: "Agent Fabric (Lifecycle FSM)"
        issues:
          - id: "L2-I1"
            title: "Agent Fabric: 6-state FSM + Supervisor"
            description: |
              Build Agent Fabric per ADR-0005 (6-state FSM).

              **States per ADR-0005:**
              - PENDING: Created, waiting to warm up
              - WARMING: Loading model + KV cache (< 2s)
              - ACTIVE: Ready for tasks, proposing
              - IDLE: Pooled, reusable (no restart overhead)
              - DRAINING: Completing current tasks
              - TERMINATED: Cleanup, released

              **Main types to implement:**
              - AgentState: enum of 6 states
              - Agent: dataclass with agent_id, state, personality, capabilities
              - AgentFabric: Registry + FSM orchestrator
              - Supervisor: Health monitor, crash detector, blacklist manager

              **Key responsibilities per ADR-0005:**
              - State transitions: all 6 transitions working
              - WARMING: Model loads < 2s (mock model)
              - IDLE pooling: Fast reuse (no cold start)
              - Supervisor: Detect crashes, blacklist for 1 hour (ADR-0005d)
              - Message passing via event_bus

              **File structure:**
              - k1/core/agent_fabric/__init__.py
              - k1/core/agent_fabric/lifecycle.py (FSM)
              - k1/core/agent_fabric/registry.py (Registry)
              - k1/core/agent_fabric/supervisor.py (Supervisor)
              - k1/core/agent_fabric/types.py (Agent, AgentState)

              **Contract to create:**
              contracts/agent_lifecycle/agent_fabric_contract.yml
              - All 6 state transitions documented
              - WARMING < 2s (per ADR-0024a)
              - Supervisor crash threshold = 3 (ADR-0005d)
              - Blacklist duration = 1 hour
            adr_refs: ["ADR-0005", "ADR-0005a", "ADR-0005b", "ADR-0005c", "ADR-0005d", "ADR-0002"]
            contract_refs: ["contracts/agent_lifecycle/lifecycle_fsm.yml"]
            depends_on: ["L5-I3"]
            acceptance_criteria:
              - "All 6 state transitions implemented"
              - "WARMING < 2s (mock model load)"
              - "IDLE pooling: Can reuse agent without restart"
              - "Supervisor detects crashes, blacklists"
              - "Message passing via event_bus works"
            points: 13
            status: "not_started"

          - id: "L2-I2"
            title: "Mailbox: MPSC queue for inter-agent messages"
            description: |
              Build Mailbox per ADR-0002a (MPSC queue).

              **Main types to implement:**
              - MailboxMessage: sender_id, receiver_id, payload, seq_num
              - Mailbox: Per-agent MPSC (multi-producer, single-consumer)
              - BackpressureSignal: Queue threshold alerting

              **Key responsibilities per ADR-0002a:**
              - Non-blocking enqueue (bounded, backpressure on > 1000)
              - Blocking dequeue (async await)
              - Fair ordering per sender (FIFO)
              - Backpressure: > 1000 → signal upstream

              **File structure:**
              - k1/core/mailbox/__init__.py
              - k1/core/mailbox/queue.py (MPSC impl)
              - k1/core/mailbox/router.py (Message routing)
              - k1/core/mailbox/types.py (Message types)

              **Contract to create:**
              contracts/actor_model/mailbox_contract.yml
              - MPSC semantics (no blocking on send)
              - Backpressure threshold = 1000
              - Latency: enqueue < 1ms, dequeue < 1ms
            adr_refs: ["ADR-0002a", "ADR-0002c", "ADR-0061"]
            contract_refs: ["contracts/actor_model/mailbox/README.md"]
            depends_on: ["L2-I1"]
            acceptance_criteria:
              - "Mailbox.enqueue(msg) non-blocking"
              - "Mailbox.dequeue() async waits for message"
              - "Backpressure signal on queue > 1000"
              - "Per-sender FIFO ordering"
              - "Latency < 1ms per op"
            points: 8
            status: "not_started"

      - id: "L2-E2"
        name: "Orchestrator (3-Phase Coordination)"
        issues:
          - id: "L2-I3"
            title: "Orchestrator: 3-phase (Negotiation-Selection-Execution)"
            description: |
              Build Orchestrator per ADR-0006 (Contract Net protocol).

              **3-Phase Flow per ADR-0006:**

              Phase 1 - Negotiation (ADR-0006a, < 100ms):
              - Receive task from Planner
              - Announce to all agents
              - Agents respond with proposals (score, ETA, capability match)
              - Collect all proposals

              Phase 2 - Selection (ADR-0006b, < 50ms):
              - Score proposals: capability, latency, cost, specialization
              - Select highest-scoring agent
              - Notify all agents of result

              Phase 3 - Execution (< 2s):
              - Monitor selected agent
              - Collect task results
              - On failure: trigger saga rollback (ADR-0006d)
              - Emit ExecutionComplete event

              **Main types to implement:**
              - Task: description, requirements, deadline
              - Proposal: agent_id, score, ETA
              - Orchestrator: 3-phase coordinator
              - PhaseNegotiation, PhaseSelection, PhaseExecution

              **File structure:**
              - k1/core/orchestrator/__init__.py
              - k1/core/orchestrator/orchestrator.py (Coordinator)
              - k1/core/orchestrator/negotiation.py (Phase 1)
              - k1/core/orchestrator/selection.py (Phase 2, scoring)
              - k1/core/orchestrator/execution.py (Phase 3)
              - k1/core/orchestrator/types.py (Task, Proposal)

              **Contract to create:**
              contracts/orchestration/orchestrator_contract.yml
              - Phase 1 < 100ms
              - Phase 2 < 50ms
              - Phase 3 < 2s E2E
              - Scoring logic per ADR-0006b
            adr_refs: ["ADR-0006", "ADR-0006a", "ADR-0006b", "ADR-0006c", "ADR-0006d"]
            contract_refs: ["contracts/orchestration/3phase.yml"]
            depends_on: ["L2-I2"]
            acceptance_criteria:
              - "Phase 1: Task announce + proposal collect < 100ms"
              - "Phase 2: Score + select < 50ms"
              - "Phase 3: Execute + collect results < 2s"
              - "Can handle 10+ agents proposing"
              - "Saga rollback on agent failure"
            points: 13
            status: "not_started"

      - id: "L2-E3"
        name: "Planner (4-Stage Pipeline)"
        issues:
          - id: "L2-I4"
            title: "Planner: 4-stage pipeline (Sketch-Expand-Validate-Commit)"
            description: |
              Build Planner per ADR-0007 (4-stage planning).

              **4-Stage Flow per ADR-0007:**

              Stage 1 - Sketch (ADR-0007a, < 100ms):
              - LLM generates high-level plan
              - Input: UserIntent + SessionState (mocked)
              - Output: PlanSketch (steps, estimated cost)

              Stage 2 - Expand (ADR-0007b, < 50ms):
              - Tool Registry selects specific tools
              - Expand sketch to full details
              - Output: ExpandedPlan

              Stage 3 - Validate (ADR-0007c, < 100ms):
              - Tier 1: Rule checks (capabilities, resources)
              - Tier 2: Arbiter (ML or human for RED band)
              - Output: ValidationResult

              Stage 4 - Commit (ADR-0007d, < 50ms):
              - Persist plan to K0 WAL (mocked)
              - Emit PlanCommitted event
              - Output: ExecutablePlan

              Total: < 300ms P95

              **Main types to implement:**
              - UserIntent: description, confidence
              - PlanSketch: steps list
              - ExpandedPlan: detailed steps with tools
              - ValidationResult: valid, errors
              - ExecutablePlan: ready to execute

              **File structure:**
              - k1/core/planner/__init__.py
              - k1/core/planner/planner.py (Orchestrator)
              - k1/core/planner/sketch.py (Stage 1, LLM mock)
              - k1/core/planner/expand.py (Stage 2)
              - k1/core/planner/validate.py (Stage 3)
              - k1/core/planner/commit.py (Stage 4, K0 mock)
              - k1/core/planner/types.py

              **Contract to create:**
              contracts/planning/planner_contract.yml
              - Stage 1 < 100ms
              - Stage 2 < 50ms
              - Stage 3 < 100ms
              - Stage 4 < 50ms
              - E2E < 300ms
            adr_refs: ["ADR-0007", "ADR-0007a", "ADR-0007b", "ADR-0007c", "ADR-0007d"]
            contract_refs: ["contracts/planning/4stage.yml"]
            depends_on: ["L2-I3"]
            acceptance_criteria:
              - "All 4 stages complete sequentially"
              - "E2E latency < 300ms P95"
              - "Plans generated for 5+ intent types"
              - "Validation catches invalid plans"
              - "K0 persistence mocked"
            points: 13
            status: "not_started"

      - id: "L2-E4"
        name: "Protocol Monitor (MPST Validation)"
        issues:
          - id: "L2-I5"
            title: "Protocol Monitor: MPST validation for 6 protocols"
            description: |
              Build Protocol Monitor per ADR-0003 (protocol validation).

              **6 Core Protocols per ADR-0003b:**
              1. Agent Hire (Agent Fabric ↔ Orchestrator)
              2. Task Execution (Orchestrator → Agent)
              3. Clarification (Planner ↔ Voice Pipeline)
              4. Barge-In (Voice Pipeline → Orchestrator)
              5. Tool Call (Agent → Tool Runner)
              6. Saga Rollback (Error Recovery → Agent)

              **Per-Protocol FSMs per ADR-0003c:**
              - State machine for each protocol
              - Message validation (wrong state = error)
              - Timeout enforcement (5s agent response)
              - Logging of violations

              **Main types to implement:**
              - Protocol: enum of 6
              - ProtocolState: FSM state
              - ProtocolMessage: sender, receiver, protocol, state, payload
              - ProtocolValidator: Validate transitions
              - ProtocolMonitor: Autonomous monitor

              **File structure:**
              - k1/core/protocol_monitor/__init__.py
              - k1/core/protocol_monitor/monitor.py (Monitor)
              - k1/core/protocol_monitor/validators.py (Per-protocol)
              - k1/core/protocol_monitor/fsm.py (FSMs)
              - k1/core/protocol_monitor/types.py

              **Contract to create:**
              contracts/protocols/protocol_monitor_contract.yml
              - All 6 FSMs defined
              - Message validation
              - Timeout: agent response < 5s
              - Violation logging
            adr_refs: ["ADR-0003", "ADR-0003a", "ADR-0003b", "ADR-0003c", "ADR-0003d"]
            contract_refs: ["contracts/protocols/agent_hire.pdl.yml"]
            depends_on: ["L2-I4"]
            acceptance_criteria:
              - "All 6 protocol FSMs defined"
              - "Message validation rejects out-of-state"
              - "Timeout enforcement works"
              - "Violations logged with trace_id"
              - "Can validate concurrent multi-protocol"
            points: 13
            status: "not_started"

      - id: "L2-E5"
        name: "GATE: L2 Core Kernel Integration"
        issues:
          - id: "L2-I6"
            title: "**GATE**: E2E core kernel integration test"
            description: |
              **GATE VALIDATION ISSUE**: All 5 modules working together.

              **Test Scenario:**
              1. Mock user intent: "Set a timer for 5 minutes"
              2. Planner receives intent
              3. Planner 4-stage: Sketch → Expand → Validate → Commit
              4. Planner emits PlanCommitted → event_bus
              5. Orchestrator receives → Phase 1 Negotiation
              6. Announce task to Agent Fabric
              7. Agent PENDING → WARMING (< 2s model load)
              8. Agent WARMING → ACTIVE
              9. Agent proposes for task
              10. Orchestrator Phase 2 Selection: score + select
              11. Orchestrator Phase 3 Execution: execute task
              12. Agent executes, completes
              13. Agent ACTIVE → IDLE (pooled)
              14. Result captured, E2E < 2s
              15. Protocol Monitor: zero violations

              **File structure:**
              - tests/integration/test_core_kernel_e2e.py (WARD test)

              **Requirements:**
              - Coder + Proofreader both sign off
              - All ADRs referenced in code
              - All contracts created for L2 modules
            adr_refs: ["ADR-0005", "ADR-0006", "ADR-0007", "ADR-0003", "ADR-0024a"]
            contract_refs: ["contracts/orchestration/3phase.yml"]
            depends_on: ["L2-I5"]
            acceptance_criteria:
              - "WARD test PASSES"
              - "Full 3-phase orchestration completes"
              - "E2E latency < 2s P95"
              - "Zero protocol violations"
              - "Agent FSM: PENDING → WARMING → ACTIVE → IDLE"
            points: 21
            status: "not_started"

---

  - id: L1_INPUT
    name: "Phase 3: Layer 1 Input Processing"
    description: |
      Voice pipeline: stream_switch → operators → intent_router → meta_policy.

      **DEPENDENCY**: Must wait for L2-I6 (Core Kernel GATE) to PASS.
      Data flows: User audio → Intent → Planner → Orchestrator
    duration_weeks: 3
    adr_refs: ["ADR-0056", "ADR-0057", "ADR-0058"]
    contract_refs: ["contracts/voice_pipeline/README.md"]
    epics:
      - id: "L1-E1"
        name: "Stream Ingestion & ASR"
        issues:
          - id: "L1-I1"
            title: "stream_switch: VAD + ASR + frame buffering"
            description: |
              Build stream_switch per ADR-0056 (voice pipeline stage 1).

              **Key responsibilities per ADR-0056a:**
              - Accept 20ms audio frames (320 bytes PCM @ 16kHz)
              - Voice Activity Detection (energy-based + WebRTC VAD)
              - Buffer frames (4-frame ring buffer = 80ms)
              - ASR invocation (Whisper, mocked)
              - Route to intent_router
              - Publish InputStreamEvent → event_bus

              **Main types:**
              - AudioFrame: data, sequence_number, timestamp, vad_active
              - VADDetector: Energy threshold = -50dB, silence = 2s
              - FrameBuffer: 4-frame ring buffer
              - ASRPipeline: Whisper wrapper (mocked)
              - StreamSwitch: Orchestrator

              **File structure:**
              - k1/input/stream_switch/__init__.py
              - k1/input/stream_switch/stream_switch.py
              - k1/input/stream_switch/vad.py
              - k1/input/stream_switch/frame_buffer.py
              - k1/input/stream_switch/asr_pipeline.py
              - k1/input/stream_switch/types.py

              **Contract:**
              contracts/voice_pipeline/stream_switch_contract.yml
              - Audio frame format (20ms, 320 bytes)
              - VAD thresholds
              - Buffering: 4 frames = 80ms
              - ASR latency < 100ms (mocked)
            adr_refs: ["ADR-0056", "ADR-0056a", "ADR-0057"]
            contract_refs: ["contracts/voice_pipeline/stream_switch_contract.yml"]
            depends_on: ["L2-I6"]
            acceptance_criteria:
              - "Accept 20ms audio frames"
              - "VAD detection works (active/inactive)"
              - "Frame buffering: 4 frames"
              - "ASR mock returns transcripts"
              - "Publish InputStreamEvent → event_bus"
              - "Handle 50 FPS input stream"
            points: 8
            status: "not_started"

          - id: "L1-I2"
            title: "operators: disfluency removal, TTS synthesis"
            description: |
              Build operators per ADR-0056 (stream transformations).

              **Key responsibilities per ADR-0056b, ADR-0056d:**
              - Disfluency removal: "um set a timer for like 5 minutes" → "set a timer for 5 minutes"
              - Phonetic matching: ASR corrections ("tan" → "ten")
              - TTS synthesis: Text → speech (mocked, < 200ms TTFA)
              - Quality ladder: 5 levels per thermal state + load (ADR-0057b)

              **Main types:**
              - DisfluencyRemover: Regex filler patterns
              - PhoneticMatcher: Soundex + edit distance
              - TTSSynthesizer: VITS model (mocked)
              - QualityLadder: 5 levels (MOS 4.3 → 2.7)

              **File structure:**
              - k1/input/operators/__init__.py
              - k1/input/operators/disfluency_remover.py
              - k1/input/operators/phonetic_matcher.py
              - k1/input/operators/tts_synthesizer.py
              - k1/input/operators/quality_ladder.py
              - k1/input/operators/operators.py
              - k1/input/operators/types.py

              **Contract:**
              contracts/voice_pipeline/operators_contract.yml
              - Disfluency patterns
              - Phonetic matching
              - TTS quality levels (ADR-0057b)
              - TTS latency < 200ms TTFA
            adr_refs: ["ADR-0056b", "ADR-0056d", "ADR-0057b"]
            contract_refs: ["contracts/voice_pipeline/operators_contract.yml"]
            depends_on: ["L1-I1"]
            acceptance_criteria:
              - "Disfluency removal works"
              - "Phonetic matching works"
              - "TTS mock returns speech"
              - "Quality ladder: 5 levels"
              - "Publish StreamTransformedEvent → event_bus"
            points: 8
            status: "not_started"

      - id: "L1-E2"
        name: "Intent Classification & Meta-Policy"
        issues:
          - id: "L1-I3"
            title: "intent_router: 3-tier classification (regex→SLM→LLM)"
            description: |
              Build intent_router per ADR-0058 (intent classification).

              **3-Tier Pipeline per ADR-0058:**

              Tier 1 - Regex (< 1ms):
              - Hardcoded patterns for 50+ intents
              - E.g., "set.*timer.*(\d+).*minutes" → SetTimer + extract
              - Confidence threshold: > 90%

              Tier 2 - SLM (< 20ms):
              - Lightweight model (Phi-3, Mistral 7B) mocked
              - Used for 50-90% confidence cases

              Tier 3 - LLM (async):
              - GPT-4o (mocked)
              - Used for < 50% confidence
              - Not in critical path

              **Main types:**
              - Intent: name, confidence, parameters, category
              - ClassificationTier1, 2, 3
              - IntentRouter: orchestrates 3 tiers

              **File structure:**
              - k1/input/intent_router/__init__.py
              - k1/input/intent_router/intent_router.py
              - k1/input/intent_router/tier1_regex.py
              - k1/input/intent_router/tier2_slm.py (mock)
              - k1/input/intent_router/tier3_llm.py (mock)
              - k1/input/intent_router/types.py

              **Contract:**
              contracts/voice_pipeline/intent_router_contract.yml
              - Tier 1 < 1ms
              - Tier 2 < 20ms
              - Confidence thresholds (90%, 50%)
              - 50+ intent patterns
            adr_refs: ["ADR-0058", "ADR-0058a", "ADR-0058b"]
            contract_refs: ["contracts/voice_pipeline/intent_router_contract.yml"]
            depends_on: ["L1-I2"]
            acceptance_criteria:
              - "Tier 1: 50+ regex patterns working"
              - "Tier 2: Mock SLM classifier"
              - "Tier 3: Mock LLM fallback"
              - "Confidence thresholds enforced"
              - "Publish IntentDetectedEvent → event_bus"
              - "Can classify 10+ intent types"
            points: 8
            status: "not_started"

          - id: "L1-I4"
            title: "meta_policy: barge-in, clarification, proactivity"
            description: |
              Build meta_policy per ADR-0057c + ADR-0058a.

              **Responsibilities:**

              Barge-In (< 120ms, ADR-0057c):
              - Detect user interrupt while TTS playing (< 5ms)
              - Stop TTS, clear context
              - Route new input → intent_router (fresh classification)

              Clarification (ADR-0058a):
              - Max 3 attempts per intent
              - Generate natural language prompts
              - Fallback: offer text input

              Proactivity (ADR-0057c):
              - Detect when K1 should interrupt
              - Score: 0-100 based on context

              **Main types:**
              - BargeInDetector: User interrupt detection
              - ClarificationStrategy: Prompt generation
              - ProactivityScorer: 0-100 score
              - MetaPolicy: Orchestrator

              **File structure:**
              - k1/input/meta_policy/__init__.py
              - k1/input/meta_policy/meta_policy.py
              - k1/input/meta_policy/barge_in.py
              - k1/input/meta_policy/clarification.py
              - k1/input/meta_policy/proactivity.py
              - k1/input/meta_policy/types.py

              **Contract:**
              contracts/voice_pipeline/meta_policy_contract.yml
              - Barge-in latency < 120ms
              - Max 3 clarifications
              - Proactivity scoring
            adr_refs: ["ADR-0057c", "ADR-0058a", "ADR-0054a"]
            contract_refs: ["contracts/voice_pipeline/meta_policy_contract.yml"]
            depends_on: ["L1-I3"]
            acceptance_criteria:
              - "Barge-in: < 120ms detection"
              - "Clarification: 5+ prompt templates"
              - "Limit: max 3 attempts"
              - "Proactivity: 0-100 score"
              - "Emit ProactivityEvent, ClarificationEvent → event_bus"
            points: 8
            status: "not_started"

