  - id: L3_EXEC
    name: "Phase 4: Layer 3 Execution & Tools"
    description: |
      Tool execution engine (3-tier sandbox) and model hub integration.

      **DEPENDENCY**: Must wait for L1-I4 (Input GATE) to PASS.
    duration_weeks: 3
    adr_refs: ["ADR-0033", "ADR-0034", "ADR-0001b"]
    contract_refs: ["contracts/tools/README.md"]
    epics:
      - id: "L3-E1"
        name: "Tool Execution (3-Tier Sandbox)"
        issues:
          - id: "L3-I1"
            title: "Tool Runner: MCP protocol + WASM/Process sandboxes"
            description: |
              Build Tool Runner per ADR-0033 (3-tier sandbox).

              **3-Tier Sandbox per ADR-0033:**

              Tier 1 - MCP Protocol (standard tools):
              - JSON-RPC 2.0 over stdio/socket
              - Standard tools: web APIs, services, databases
              - Latency: < 5s per call

              Tier 2 - WASM (custom trusted tools):
              - WebAssembly sandboxing
              - Custom logic, trusted devs
              - Latency: < 1s per call

              Tier 3 - Process (untrusted code):
              - OS-level sandbox (seccomp, cgroups)
              - Untrusted plugins
              - Latency: < 10s per call

              **Main types:**
              - Tool: id, name, description, sandbox_tier
              - ToolCall: tool_id, input_params, trace_id
              - ToolResult: tool_id, output, success, error
              - ToolRunner: routes to correct tier
              - MCPGateway: JSON-RPC 2.0 layer

              **File structure:**
              - k1/execution/tool_runner/__init__.py
              - k1/execution/tool_runner/tool_runner.py
              - k1/execution/tool_runner/mcp_gateway.py
              - k1/execution/tool_runner/wasm_sandbox.py (stub)
              - k1/execution/tool_runner/process_sandbox.py (stub)
              - k1/execution/tool_runner/types.py

              **Contract:**
              contracts/tools/tool_runner_contract.yml
              - MCP: JSON-RPC 2.0 protocol
              - Sandbox selection (2D matrix: tool type × risk)
              - Latency per tier
            adr_refs: ["ADR-0033", "ADR-0033a", "ADR-0033d", "ADR-0034", "ADR-0034a"]
            contract_refs: ["contracts/tools/tool_runner_contract.yml"]
            depends_on: ["L1-I4"]
            acceptance_criteria:
              - "MCP gateway accepts JSON-RPC 2.0"
              - "Tool selection: Tier 1/2/3 routing"
              - "Mock tools return results"
              - "Latency tracking per tier"
              - "Error handling: tool failures isolated"
            points: 10
            status: "not_started"

