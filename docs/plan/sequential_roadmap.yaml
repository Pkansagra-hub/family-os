# SEQUENTIAL_ROADMAP.yaml — K1 Intelligence Module Implementation Roadmap
#
# Purpose: Milestone → Epic → Issue roadmap for team of 2 (AI Coder + Proofreader)
# Last Updated: 2025-10-17
# Author: K1 Architecture Planning Team
#
# **CRITICAL WORKFLOW:**
# 1. Pick ONE issue (bottom-up from dependencies)
# 2. Read DEPENDENCY_MAP.md for module spec
# 3. Coder: Write module with main types/classes
# 4. Coder: Create contract YAML documenting what was built
# 5. Proofreader: Review code against contract + ADRs
# 6. Update DEPENDENCY_MAP with learnings
# 7. Mark issue COMPLETE, move to next
#
# **IMPLEMENTATION ORDER (Sequential, No Parallel Work):**
# Phase 0:  Scaffold (1 week)
# Phase 1:  L5 Infrastructure (3 weeks) - event_bus, tracing, logging
# Phase 2:  L2 Core Kernel (4 weeks) - GATE VALIDATION, enables everything
# Phase 3:  L1 Input Processing (3 weeks) - voice pipeline
# Phase 4:  L3 Execution (3 weeks) - tool runner, model hub
# Phase 5:  Integration (2 weeks) - E2E turn testing
# Total: ~16 weeks for MVP
#

milestones:
  - id: P0
    name: "Phase 0: Repository Scaffold"
    description: "Initialize Python project, pyproject.toml, k1/ module structure"
    duration_weeks: 1
    adr_refs: ["ADR-0004", "ADR-0001"]
    contract_refs: ["contracts/architecture/module_manifest.yml"]
    epics:
      - id: "P0-E1"
        name: "Project Initialization"
        issues:
          - id: "P0-I1"
            title: "Initialize K1 repository scaffold"
            description: |
              Set up project structure:
              - pyproject.toml (Python 3.11+, async, pytest/ward)
              - k1/ with Layer1-Layer5 subdirectories per ADR-0004
              - .github/workflows for CI/CD
              - docs/, contracts/ directories
              - All __init__.py files present (no imports yet)

              Upon completion:
              - Project can run: `python -m pytest --version`
              - Structure matches ADR-0004 module manifest
            adr_refs: ["ADR-0004", "ADR-0001"]
            contract_refs: ["contracts/P0_REPOSITORY_SCAFFOLD.md"]
            depends_on: []
            acceptance_criteria:
              - "k1/layer1, k1/layer2, ..., k1/layer5 directories exist"
              - "pyproject.toml defines Python 3.11+ async runtime"
              - "pytest/ward can run (no actual tests yet)"
              - "All __init__.py present, no runtime errors"
            points: 5
            status: "complete"
            completed_date: "2025-10-17"
            notes: "Repository structure initialized. All layers, core modules, and test directories created with documentation in __init__.py files. pyproject.toml configured for Python 3.11+ async/await development. README.md documents architecture and development workflow."

---

  - id: L5_INFRA
    name: "Phase 1: Layer 5 Infrastructure (Foundation)"
    description: "Build event_bus, tracing, logging - NO external dependencies"
    duration_weeks: 3
    adr_refs: ["ADR-0004a", "ADR-0030", "ADR-0029"]
    contract_refs: ["contracts/event_bus/README.md"]
    epics:
      - id: "L5-E1"
        name: "Event Bus Foundation"
        issues:
          - id: "L5-I1"
            title: "Implement async event_bus (pub/sub)"
            description: |
              Build async pub/sub event bus per ADR-0004a.

              **Main types to implement:**
              - Event: dataclass with id, topic, timestamp, payload, trace_id
              - TopicRouter: Wildcard topic matching
              - Subscriber: Async callback handler
              - EventBus: Singleton with publish/subscribe

              **Key responsibilities:**
              - publish(topic, event) async - emit to subscribers
              - subscribe(topic, handler) async - register handler
              - Topic wildcards: 'agents/*' matches 'agents/fabric'
              - Backpressure: signal when queue > 1000 events
              - Latency < 5ms for publish+route

              **File structure:**
              - k1/infrastructure/event_bus/__init__.py
              - k1/infrastructure/event_bus/bus.py (EventBus class)
              - k1/infrastructure/event_bus/models.py (Event, Subscriber)
              - k1/infrastructure/event_bus/router.py (TopicRouter)
              - k1/infrastructure/event_bus/backpressure.py

              **Contract to create:**
              contracts/event_bus/event_bus_contract.yml
              - Publish latency < 5ms
              - Subscribe pattern matching
              - Backpressure thresholds
            adr_refs: ["ADR-0004a", "ADR-0061"]
            contract_refs: ["contracts/event_bus/README.md"]
            depends_on: ["P0-I1"]
            acceptance_criteria:
              - "EventBus.publish(topic, event) async works"
              - "EventBus.subscribe(topic, handler) works with async handlers"
              - "Topic matching: 'layer1/*' matches 'layer1/intent'"
              - "Backpressure: queue > 1000 events triggers signal"
              - "Latency < 5ms P95 (measure in test)"
              - "Handles 10,000 events/sec peak load"
            points: 8
            status: "not_started"

          - id: "L5-I2"
            title: "Implement OpenTelemetry tracing (cognitive_trace_id)"
            description: |
              Build OpenTelemetry integration per ADR-0030.

              **Main types to implement:**
              - TracingContext: Thread-local trace_id storage
              - SpanFactory: Create typed spans (negotiation, planning, etc)
              - SamplingStrategy: Adaptive 1%-100% based on errors
              - Span: Start/end with duration tracking

              **Key responsibilities:**
              - Every operation has cognitive_trace_id
              - get_trace_id() async context access
              - Sampling: 1% baseline, 100% on errors (ADR-0030a)
              - Span creation < 1ms overhead
              - Export to Jaeger or stdout for dev

              **File structure:**
              - k1/infrastructure/tracing/__init__.py
              - k1/infrastructure/tracing/context.py (TracingContext)
              - k1/infrastructure/tracing/spans.py (SpanFactory)
              - k1/infrastructure/tracing/sampling.py (Sampling strategy)
              - k1/infrastructure/tracing/exporters.py (Jaeger, stdout)

              **Contract to create:**
              contracts/observability/tracing_contract.yml
              - Trace_id propagation across async boundaries
              - Sampling rates (1% baseline)
              - Span latency overhead < 1ms
            adr_refs: ["ADR-0030", "ADR-0030a", "ADR-0030b"]
            contract_refs: ["contracts/observability/README.md"]
            depends_on: ["L5-I1"]
            acceptance_criteria:
              - "get_trace_id() returns current trace_id"
              - "Sampling: 1% baseline, 100% on errors"
              - "Span creation overhead < 1ms"
              - "Trace propagates through async/await boundaries"
              - "Can export to Jaeger (dev: stdout JSON)"
            points: 8
            status: "not_started"

      - id: "L5-E2"
        name: "Observability (Logging & Metrics)"
        issues:
          - id: "L5-I3"
            title: "Implement structured logging with context"
            description: |
              Build structured logging per ADR-0029.

              **Main types to implement:**
              - LogContext: Structured fields (trace_id, agent_id, turn_id)
              - StructuredLogger: Context-aware logging
              - LogFormatter: JSON output for cloud ingestion

              **Key responsibilities:**
              - Log with trace_id for correlation
              - Context propagation through async calls
              - Log level filtering (DEBUG < INFO < WARNING < ERROR)
              - Latency < 2ms per log call

              **File structure:**
              - k1/infrastructure/logging/__init__.py
              - k1/infrastructure/logging/logger.py (StructuredLogger)
              - k1/infrastructure/logging/context.py (LogContext)
              - k1/infrastructure/logging/formatter.py (JSON formatter)

              **Contract to create:**
              contracts/observability/logging_contract.yml
              - JSON output with trace_id
              - Level filtering
              - < 2ms per call
            adr_refs: ["ADR-0029", "ADR-0029a"]
            contract_refs: ["contracts/observability/README.md"]
            depends_on: ["L5-I2"]
            acceptance_criteria:
              - "logger.info(msg, **context) emits JSON with trace_id"
              - "Log levels filter correctly"
              - "Latency < 2ms per log"
              - "Can disable logs in test mode"
            points: 5
            status: "not_started"

